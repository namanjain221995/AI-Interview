expected_concepts:
  - widest (maximum bottleneck) path
  - Kruskal-style processing of links by descending capacity with union-find
  - alternatively a modified Dijkstra with a max-heap on the bottleneck value
  - returning -1 when source and target stay in different components
optimal_complexity: {time: O(E log E), space: O(V + E)}
rubric:
  excellent: Identifies the widest-path problem, solves it with either descending-capacity union-find (stopping as soon as source and target join) or a max-heap Dijkstra variant, explains why the greedy order is correct, handles parallel links and disconnection, and states O(E log E).
  good: Reaches a correct polynomial solution such as binary search on the capacity threshold with a BFS per step, or a max-heap search with small slips fixed after a hint.
  weak: Enumerates all simple paths, uses fewest hops or a shortest-path sum, or does not handle the unreachable case.
  criteria:
    correctness: Returns the largest bottleneck over all routes, -1 when the routers are not connected.
    efficiency: Sorting plus near-constant union-find operations, or a heap-based search; no exponential path enumeration.
    code_quality: Clean union-find with path compression or a clear adjacency list and heap loop.
    edge_cases: Parallel links, no links, source and target given in either order, the 10^9 capacity limit.
    communication: Explains why adding links from widest to narrowest finds the bottleneck at the moment the two routers join.
hints:
  - The throughput of a route depends only on its narrowest link; try asking which capacity thresholds still leave a route between the two routers.
  - If you only allow links with capacity at least some value, a route exists or it does not; think about adding links in order of decreasing capacity until the two routers become connected.
  - Sort the links from widest to narrowest and merge their endpoints with a union-find structure; the capacity of the link whose merge first puts source and target in the same set is the answer, and if that never happens return minus one.
followups:
  - How would you adapt Dijkstra's algorithm to compute the same answer from one source to every router?
  - How would you also return the route itself?
  - What if you need answers for many (source, target) pairs; how does a maximum spanning tree help?
  - How would the problem change if a transfer may be split across several routes at once?
common_errors:
  - Choosing the route with the fewest hops or the largest sum of capacities instead of the largest minimum.
  - Ignoring parallel links or keeping only the first link between two routers.
  - Forgetting to return -1 when the routers are in different components.
  - Exploring every simple path with DFS, which is exponential on dense networks.
