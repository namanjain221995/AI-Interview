expected_concepts:
  - "multi-source shortest paths started from every dock at once"
  - "reversing the direction of travel so the entering cost is charged correctly"
  - "Dijkstra with a priority queue, or a bucket queue because costs are only 1 and 3"
  - "why plain breadth-first search is wrong once moves have different costs"
  - "O(m * n log(m * n)) time with a heap, O(m * n) with buckets"
optimal_complexity: {time: "O(m * n log(m * n)) with a heap (O(m * n) with a bucket queue)", space: "O(m * n)"}
rubric:
  excellent: "Runs one multi-source Dijkstra (or bucket queue) from all docks, charges the cost of the cell being entered in the right direction, skips stale queue entries, and explains why BFS breaks with weighted moves and why a single search beats one search per cell."
  good: "Correct result with a per-cell search or a heap-based search that needed a hint about which cell's cost to add when walking backwards from a dock."
  weak: "Uses plain BFS and ignores slow-zone costs, adds the cost of the starting cell instead of the entered cell, or reports distances for walls."
  criteria:
    correctness: "All tests pass, including grids without docks, all-slow neighbourhoods and long detours that beat a slow corridor."
    efficiency: "A single search over the grid instead of one search per starting cell."
    code_quality: "Readable cost lookup per cell type, a direction list and a clear stale-entry check."
    edge_cases: "No docks, a single dock cell, unreachable pockets, slow zones next to docks."
    communication: "Explains the reversal: a robot on a neighbour reaches the dock by entering the current cell, so that cell's cost is added."
hints:
  - "Instead of searching outward from every cell separately, search once from all the docks together and work out how far each cell is from them."
  - "Moves have different costs, so plain breadth-first search is not enough; use a priority queue ordered by time. When you expand a cell while walking backwards from a dock, ask which cell the robot would actually be entering on the forward trip."
  - "Start a priority queue with every dock at time zero. Pop the smallest time; skip it if a better time is already recorded. A robot on any open neighbour would reach the dock by entering the popped cell, so the neighbour's candidate time is the popped time plus the popped cell's own entry cost (1 for a dock or open floor, 3 for a slow zone). Record improvements, push them, and leave unvisited and wall cells at minus one."
followups:
  - "Costs are only 1 and 3; how could you avoid a heap entirely?"
  - "How would you also return which dock each cell should drive to, breaking ties by the dock that comes first in row order?"
  - "If docks can be switched off at runtime, how would you update the table without recomputing everything?"
  - "What changes if the cost were paid for the cell the robot leaves instead of the cell it enters?"
common_errors:
  - "Using breadth-first search with unit steps so slow zones cost the same as open floor."
  - "Adding the neighbour's entry cost instead of the expanded cell's, which charges the starting cell and misses the dock's own cost."
  - "Running one search per cell, which is far slower than one multi-source search."
  - "Not skipping outdated heap entries, or marking cells final before they are popped."
