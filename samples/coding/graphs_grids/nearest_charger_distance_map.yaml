slug: nearest_charger_distance_map
title: "Nearest Charger Travel Times"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [backend, mobile, general, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Nearest Charger Travel Times

  A warehouse robot fleet needs a lookup table that tells a robot, wherever it stands, how long it
  will take to drive to the closest charging dock. The floor plan is `floor`, a list of equal-length
  strings, one per row:

  - `'C'` a charging dock,
  - `'.'` open floor,
  - `'~'` a slow zone (a ramp or a rough patch) that robots cross carefully,
  - `'#'` a wall or shelf that robots cannot enter.

  A robot moves one cell up, down, left or right at a time. The time is paid for the cell it **moves
  into**: entering open floor or a dock takes `1` second, entering a slow zone takes `3` seconds. The
  cell the robot starts on costs nothing.

  Return a grid of the same shape where each cell holds the minimum number of seconds a robot starting
  there needs to reach **any** dock: `0` on a dock, and `-1` for walls and for cells from which no dock
  can be reached.

  ### Example 1
  ```
  Input:  floor = ["C..", ".#.", "..C"]
  Output: [[0, 1, 2], [1, -1, 1], [2, 1, 0]]
  Explanation: Every move into open floor or a dock costs one second; the wall is -1.
  ```

  ### Example 2
  ```
  Input:  floor = ["C~.", "#~#", "..."]
  Output: [[0, 1, 4], [-1, 4, -1], [8, 7, 8]]
  Explanation: From (0,2) the robot enters the slow zone (0,1) for 3 seconds, then the dock for 1: total 4. Cell (2,1) first has to enter the slow zone (1,1): 3 + 4 = 7.
  ```

  ### Example 3
  ```
  Input:  floor = ["C#.", "##.", "..."]
  Output: [[0, -1, -1], [-1, -1, -1], [-1, -1, -1]]
  Explanation: Walls seal the dock in, so no other cell can reach it.
  ```

  ### Constraints
  - `1 <= m, n <= 60`, where `m = floor.length` and `n = floor[i].length`
  - Every row has the same length and contains only `'C'`, `'.'`, `'~'` and `'#'`.
  - There may be zero, one or many docks.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nearest_charger
  params:
    - {name: floor, type: "string[]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def nearest_charger(floor: list[str]) -> list[list[int]]:
        rows, cols = len(floor), len(floor[0])
        enter_cost = {"C": 1, ".": 1, "~": 3}
        dist = [[-1] * cols for _ in range(rows)]
        heap = []
        for r in range(rows):
            for c in range(cols):
                if floor[r][c] == "C":
                    dist[r][c] = 0
                    heap.append((0, r, c))
        heapq.heapify(heap)
        while heap:
            d, r, c = heapq.heappop(heap)
            if d > dist[r][c]:
                continue
            # A robot standing on a neighbour reaches charger-distance d by moving into (r, c).
            step = d + enter_cost[floor[r][c]]
            for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                if 0 <= nr < rows and 0 <= nc < cols and floor[nr][nc] != "#":
                    if dist[nr][nc] == -1 or step < dist[nr][nc]:
                        dist[nr][nc] = step
                        heapq.heappush(heap, (step, nr, nc))
        return dist
  javascript: |
    function nearestCharger(floor) {
      const rows = floor.length;
      const cols = floor[0].length;
      const enterCost = { C: 1, ".": 1, "~": 3 };
      const dist = floor.map(() => new Array(cols).fill(-1));
      // Costs are 1 or 3, so a bucket queue indexed by distance replaces a heap.
      const buckets = [[]];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (floor[r][c] === "C") {
            dist[r][c] = 0;
            buckets[0].push([r, c]);
          }
        }
      }
      const moves = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      for (let d = 0; d < buckets.length; d++) {
        const bucket = buckets[d] || [];
        for (const [r, c] of bucket) {
          if (dist[r][c] !== d) continue;
          const step = d + enterCost[floor[r][c]];
          for (const [dr, dc] of moves) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || floor[nr][nc] === "#") continue;
            if (dist[nr][nc] === -1 || step < dist[nr][nc]) {
              dist[nr][nc] = step;
              while (buckets.length <= step) buckets.push([]);
              buckets[step].push([nr, nc]);
            }
          }
        }
      }
      return dist;
    }
