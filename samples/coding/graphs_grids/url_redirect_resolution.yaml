slug: url_redirect_resolution
title: "Resolve URL Redirect Chains"
difficulty: easy
competency_keys: [data_structures, problem_solving, debugging]
role_tags: [backend, frontend, fullstack, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Resolve URL Redirect Chains

  After several site migrations, a web team's edge server holds a table of permanent redirect rules. Each
  rule `[from, to]` in `redirects` sends a request for path `from` to path `to`. Every `from` path has **at
  most one** rule.

  Support engineers want to know where a request finally lands. For each path in `queries`, follow the
  rules starting from that path, one hop at a time, until you reach a path that has **no** rule; that path
  is the answer. A path without any rule resolves to itself.

  If following the rules from a query would **visit some path a second time** (a redirect loop, including
  a rule that points to itself or a chain that runs into a loop further along), the answer for that query
  is the string `"LOOP"`.

  Return the answers in the same order as `queries`.

  ### Example 1
  ```
  Input:  redirects = [["/old-home", "/home"], ["/home", "/index"], ["/blog", "/news"]], queries = ["/old-home", "/blog", "/about"]
  Output: ["/index", "/news", "/about"]
  Explanation: /old-home -> /home -> /index; /blog -> /news; /about has no rule.
  ```

  ### Example 2
  ```
  Input:  redirects = [["/a", "/b"], ["/b", "/c"], ["/c", "/a"], ["/x", "/a"]], queries = ["/x", "/c", "/d"]
  Output: ["LOOP", "LOOP", "/d"]
  Explanation: /x leads into the loop /a -> /b -> /c -> /a, so it never lands either.
  ```

  ### Constraints
  - `0 <= redirects.length <= 10^4` and `0 <= queries.length <= 10^4`
  - `redirects[i].length == 2`
  - Every path is a non-empty string of at most 100 characters that starts with `/`; paths are case-sensitive.
  - All `redirects[i][0]` are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: resolve_redirects
  params:
    - {name: redirects, type: "string[][]"}
    - {name: queries, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def resolve_redirects(redirects: list[list[str]], queries: list[str]) -> list[str]:
        target = {source: dest for source, dest in redirects}
        resolved: dict[str, str] = {}

        def resolve(start: str) -> str:
            chain: list[str] = []
            on_chain: set[str] = set()
            path = start
            while True:
                if path in resolved:
                    answer = resolved[path]
                    break
                if path not in target:
                    answer = path
                    break
                if path in on_chain:
                    answer = "LOOP"
                    break
                on_chain.add(path)
                chain.append(path)
                path = target[path]
            for visited in chain:
                resolved[visited] = answer
            return answer

        return [resolve(query) for query in queries]
  javascript: |
    function resolveRedirects(redirects, queries) {
      const target = new Map(redirects.map(([source, dest]) => [source, dest]));
      const resolved = new Map();
      const resolve = (start) => {
        const chain = [];
        const onChain = new Set();
        let path = start;
        let answer;
        while (true) {
          if (resolved.has(path)) { answer = resolved.get(path); break; }
          if (!target.has(path)) { answer = path; break; }
          if (onChain.has(path)) { answer = "LOOP"; break; }
          onChain.add(path);
          chain.push(path);
          path = target.get(path);
        }
        for (const visited of chain) resolved.set(visited, answer);
        return answer;
      };
      return queries.map(resolve);
    }
