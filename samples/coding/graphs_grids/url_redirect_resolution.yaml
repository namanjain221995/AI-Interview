expected_concepts:
  - "hash map from source path to destination"
  - "following a functional graph (each node has at most one outgoing edge)"
  - "cycle detection with a per-walk visited set"
  - "memoising resolved paths so shared chains are walked once"
optimal_complexity: {time: "O(R + Q) with memoisation (O(Q * L) without, L = longest chain)", space: "O(R)"}
rubric:
  excellent: "Builds a map of rules, follows each chain with a visited set to detect loops (including tails into a loop), memoises the answer for every path on the walked chain and explains the resulting linear bound."
  good: "Correct per-query walk with a visited set; memoisation only after prompting."
  weak: "Detects only self-redirects or a return to the starting path and loops forever on a tail into a cycle, or caps hops at an arbitrary number."
  criteria:
    correctness: "All tests pass, including self-redirects, tails into loops and case-sensitive paths."
    efficiency: "Each rule is followed a bounded number of times overall thanks to memoisation, or the per-query cost is justified."
    code_quality: "A small resolve helper with clear names and a single exit point for the answer."
    edge_cases: "No rules, no queries, repeated queries and queries that are already final targets."
    communication: "Explains why reaching any previously seen path on the same walk proves a loop."
hints:
  - "Put the rules in a structure that answers 'where does this path go next?' in constant time."
  - "When you follow a chain, keep track of the paths seen on this walk; seeing one again means the chain can never end, even if it is not the starting path."
  - "For each query walk hop by hop: stop with the current path when it has no rule, stop with LOOP when it is already in this walk's seen set, and optionally store the final answer for every path on the walk so later queries that reach those paths can stop immediately."
followups:
  - "How would you rewrite the redirect table so that every rule points directly to its final destination?"
  - "Browsers give up after a fixed number of hops; what are the trade-offs of that approach versus loop detection?"
  - "How would you detect loops at the moment a new rule is added instead of at query time?"
common_errors:
  - "Only checking whether the walk returns to the query path, which loops forever on a chain that runs into a cycle."
  - "Treating a self-redirect as a normal rule and spinning on it."
  - "Lower-casing paths although the contract says they are case-sensitive."
  - "Returning the first hop instead of following the chain to the end."
