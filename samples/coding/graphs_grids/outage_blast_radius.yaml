expected_concepts:
  - "reversing edge direction to follow dependents instead of dependencies"
  - "level-by-level breadth-first search for shortest hop counts"
  - "visited marking so each service is counted once and loops terminate"
  - "why depth-first search depth is not the shortest distance"
optimal_complexity: {time: "O(n + e)", space: "O(n + e)"}
rubric:
  excellent: "Builds a reverse adjacency list (service to its dependents), runs a level-by-level BFS from the failed service marking services when they are first discovered, records each non-empty level size, and explains why BFS gives the shortest hop while DFS does not; states O(n + e)."
  good: "Correct BFS layering after a small fix, for example reversing the edge direction, marking on enqueue rather than on dequeue, or dropping a trailing empty level."
  weak: "Uses DFS depth as the hop number, follows the dependency direction instead of the dependents, double-counts services reached twice, or never terminates on loops."
  criteria:
    correctness: "All tests pass, including the shortest-hop trap, loops back to the failed service and repeated pairs."
    efficiency: "Linear in services plus pairs; each service is discovered once."
    code_quality: "Clear names for the reverse map and the current and next frontier; no trailing zero in the result."
    edge_cases: "Handles a single service, no dependents, duplicates and cycles."
    communication: "Explains why the edges are reversed and why breadth-first order yields shortest hops."
hints:
  - "First decide which direction the outage travels: towards the services a service calls, or towards the services that call it?"
  - "Build a lookup from each service to the services that depend on it, then explore outward from the failed service one ring at a time, never visiting a service twice."
  - "Run a breadth-first search over the reverse lookup that processes a whole frontier per round: mark each newly discovered service as seen when you add it to the next frontier, append the size of every non-empty frontier to the answer, and stop when a frontier is empty."
followups:
  - "How would you return the actual service ids at each hop rather than just the counts?"
  - "If only some dependencies are critical and others degrade gracefully, how would the model and the traversal change?"
  - "The dependency map has millions of edges and incident queries arrive every minute; what would you precompute or cache?"
  - "How would you find the service whose failure impacts the most other services?"
common_errors:
  - "Traversing along depends_on edges from failed, which lists what failed needs rather than who needs it."
  - "Using depth-first search depth as the hop, which can place a service further away than its shortest chain."
  - "Marking services as visited only when dequeued, so a service reachable from two services in the same ring is counted twice."
  - "Counting the failed service when a dependency loop leads back to it, or appending a final zero."
