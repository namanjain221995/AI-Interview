version: 1
slug: outage_blast_radius
title: "Outage Spread by Hop"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, backend, platform, devops]
time_limit_minutes: 15
prompt_markdown: |
  ## Outage Spread by Hop

  Your platform runs `n` services with ids `0` to `n - 1`. The service catalogue exports its
  dependency map as a list of pairs: `[a, b]` in `depends_on` means **service `a` depends on
  service `b`**.

  When service `failed` goes down, the outage spreads to the services that depend on it, then to the
  services that depend on those, and so on. A service that `failed` itself depends on is **not**
  affected. For the incident timeline, the on-call engineer wants to know how fast the outage fans
  out. The **hop** of an impacted service is the length of the **shortest** chain of dependencies
  from it to `failed`: services that depend on `failed` directly are at hop 1, services that depend
  on a hop-1 service (and not directly on `failed`) are at hop 2, and so on.

  Return an array whose element `i` is the **number of services at hop `i + 1`**. The array ends at
  the last hop that has at least one service; return an empty array if nothing depends on `failed`.
  `failed` itself is never counted, even when a dependency loop leads back to it.

  The map may contain repeated pairs and dependency loops.

  ### Example 1
  ```
  Input:  n = 6, depends_on = [[1, 0], [2, 1], [3, 1], [4, 5]], failed = 0
  Output: [1, 2]
  Explanation: Service 1 depends on 0 (hop 1); services 2 and 3 depend on 1 (hop 2).
               Services 4 and 5 are unrelated.
  ```

  ### Example 2
  ```
  Input:  n = 4, depends_on = [[0, 1], [1, 2], [2, 0], [3, 2]], failed = 1
  Output: [1, 1, 1]
  Explanation: 0 is at hop 1, 2 at hop 2 and 3 at hop 3. The loop returns to service 1,
               which is never counted.
  ```

  ### Example 3
  ```
  Input:  n = 3, depends_on = [[0, 1], [1, 2]], failed = 0
  Output: []
  Explanation: Service 0 depends on others, but nothing depends on 0.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= depends_on.length <= 2 * 10^4`
  - `depends_on[i].length == 2`, `0 <= a, b < n` and `a != b`
  - `0 <= failed < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: impact_by_hop
  params:
    - {name: n, type: "int"}
    - {name: depends_on, type: "int[][]"}
    - {name: failed, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def impact_by_hop(n: int, depends_on: list[list[int]], failed: int) -> list[int]:
        # dependents[b] lists every service that depends on b directly
        dependents: list[list[int]] = [[] for _ in range(n)]
        for a, b in depends_on:
            dependents[b].append(a)
        seen = [False] * n
        seen[failed] = True
        frontier = [failed]
        counts: list[int] = []
        while frontier:
            next_frontier: list[int] = []
            for current in frontier:
                for caller in dependents[current]:
                    if not seen[caller]:
                        seen[caller] = True
                        next_frontier.append(caller)
            if next_frontier:
                counts.append(len(next_frontier))
            frontier = next_frontier
        return counts
  javascript: |
    function impactByHop(n, dependsOn, failed) {
      const dependents = Array.from({ length: n }, () => []);
      for (const [a, b] of dependsOn) dependents[b].push(a);
      const seen = new Array(n).fill(false);
      seen[failed] = true;
      let frontier = [failed];
      const counts = [];
      while (frontier.length > 0) {
        const next = [];
        for (const current of frontier) {
          for (const caller of dependents[current]) {
            if (!seen[caller]) {
              seen[caller] = true;
              next.push(caller);
            }
          }
        }
        if (next.length > 0) counts.push(next.length);
        frontier = next;
      }
      return counts;
    }
