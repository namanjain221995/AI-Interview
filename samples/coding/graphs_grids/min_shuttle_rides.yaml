slug: min_shuttle_rides
title: "Fewest Campus Shuttle Rides"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, general, data]
time_limit_minutes: 30
prompt_markdown: |
  ## Fewest Campus Shuttle Rides

  A large office campus runs several shuttle lines, and you are building the trip planner for the
  internal transport app. `routes[i]` lists the stop ids served by shuttle line `i` (the stops of one
  line are distinct). Stop ids are arbitrary non-negative integers, not necessarily small or
  consecutive.

  A **ride** means boarding line `i` at any stop it serves and getting off at any other stop of the
  same line; the number of stops passed in between does not matter. You may transfer between lines
  only at a stop both lines serve.

  Return the **minimum number of rides** needed to travel from stop `source` to stop `target`. Return
  `0` if `source` equals `target` (even if no line serves that stop), and `-1` if the trip is
  impossible, including when no line serves `source` or `target`.

  ### Example 1
  ```
  Input:  routes = [[1, 4, 9], [9, 12, 20], [20, 33]], source = 1, target = 33
  Output: 3
  Explanation: Line 0 from 1 to 9, line 1 from 9 to 20, line 2 from 20 to 33.
  ```

  ### Example 2
  ```
  Input:  routes = [[5, 6, 7], [8, 9]], source = 5, target = 9
  Output: -1
  Explanation: No stop is shared between the two lines.
  ```

  ### Example 3
  ```
  Input:  routes = [[3, 1, 8, 2]], source = 8, target = 8
  Output: 0
  ```

  ### Constraints
  - `1 <= routes.length <= 500`
  - `1 <= routes[i].length` and the total number of listed stops is at most `10^5`
  - `0 <= routes[i][j], source, target < 10^6`; the stops within one line are distinct
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_shuttle_rides
  params:
    - {name: routes, type: "int[][]"}
    - {name: source, type: "int"}
    - {name: target, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_shuttle_rides(routes: list[list[int]], source: int, target: int) -> int:
        if source == target:
            return 0
        lines_at: dict[int, list[int]] = {}
        for line, stops in enumerate(routes):
            for stop in stops:
                lines_at.setdefault(stop, []).append(line)
        if source not in lines_at or target not in lines_at:
            return -1
        line_used = [False] * len(routes)
        reached = {source}
        frontier = [source]
        rides = 0
        while frontier:
            rides += 1
            next_frontier: list[int] = []
            for stop in frontier:
                for line in lines_at[stop]:
                    if line_used[line]:
                        continue
                    line_used[line] = True  # each line is expanded once overall
                    for other in routes[line]:
                        if other == target:
                            return rides
                        if other not in reached:
                            reached.add(other)
                            next_frontier.append(other)
            frontier = next_frontier
        return -1
  javascript: |
    function minShuttleRides(routes, source, target) {
      if (source === target) return 0;
      const linesAt = new Map();
      routes.forEach((stops, line) => {
        for (const stop of stops) {
          if (!linesAt.has(stop)) linesAt.set(stop, []);
          linesAt.get(stop).push(line);
        }
      });
      if (!linesAt.has(source) || !linesAt.has(target)) return -1;
      const lineUsed = new Array(routes.length).fill(false);
      const reached = new Set([source]);
      let frontier = [source];
      let rides = 0;
      while (frontier.length > 0) {
        rides++;
        const next = [];
        for (const stop of frontier) {
          for (const line of linesAt.get(stop)) {
            if (lineUsed[line]) continue;
            lineUsed[line] = true;
            for (const other of routes[line]) {
              if (other === target) return rides;
              if (!reached.has(other)) {
                reached.add(other);
                next.push(other);
              }
            }
          }
        }
        frontier = next;
      }
      return -1;
    }
