expected_concepts:
  - "breadth-first search where one level equals one ride"
  - "index from stop to the lines that serve it"
  - "expanding each line at most once to keep the work linear"
  - "hash map instead of an array for sparse, large stop ids"
  - "special cases: source equals target, unserved stops"
optimal_complexity: {time: "O(S)", space: "O(S)"}
rubric:
  excellent: "Models rides rather than stops as the unit of cost, builds a stop-to-lines index, runs a level-by-level BFS that expands each line once (so total work is linear in the listed stops), handles source equals target and unserved stops, and explains why a line-to-line graph built pairwise could be quadratic."
  good: "Correct BFS over stops or lines with a minor inefficiency, such as re-scanning a line from every stop on it, or needs a nudge for the special cases."
  weak: "Counts stops instead of rides, connects every pair of stops on a line (quadratic blow-up), or uses depth-first search for the minimum."
  criteria:
    correctness: "All tests pass, including transfers, unreachable targets, unserved stops and source equal to target."
    efficiency: "Each line's stop list is scanned once overall; total time linear in the listed stops."
    code_quality: "Clear stop-to-lines index and a visited marker for lines as well as stops."
    edge_cases: "Large sparse stop ids, single-stop lines, a target served only by an unreachable line."
    communication: "Explains why one BFS level corresponds to one ride."
hints:
  - "The cost is the number of rides, not the number of stops. Think about what one step of a breadth-first search should represent here."
  - "Build a lookup from each stop to the lines that serve it. From the stops you can currently reach, every line serving them gives you all of its stops for one more ride."
  - "Run a level-by-level breadth-first search starting at the source stop. In each level, for every frontier stop, board each line that serves it which has not been used yet, mark that line used, and add all of its unvisited stops to the next frontier; return the level number as soon as the target appears. Handle source equal to target and unserved stops before the search."
followups:
  - "How would you return the actual sequence of lines to take?"
  - "If each line had a fare, how would you find the cheapest trip, and when would that differ from the fewest rides?"
  - "Many planner queries hit the same timetable. What would you precompute?"
  - "How would timed departures change the model?"
common_errors:
  - "Counting stops travelled instead of rides."
  - "Linking every pair of stops on each line, which is quadratic in the line length."
  - "Scanning the same line again from every stop on it, which repeats work."
  - "Returning -1 when source equals target but no line serves that stop."
  - "Allocating an array indexed by stop id up to 10^6 per query when a hash map suffices."
