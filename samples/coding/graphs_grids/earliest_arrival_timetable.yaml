slug: earliest_arrival_timetable
title: "Earliest Arrival From a Timetable"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Earliest Arrival From a Timetable

  A campus shuttle network has `n` stops numbered `0` to `n - 1`. Today's timetable is a list of
  **trips**: `trips[i] = [from, to, depart, arrive]` means one shuttle leaves stop `from` at time
  `depart` and reaches stop `to` at time `arrive` (`arrive > depart`). Every trip runs exactly once
  and makes no intermediate stops. Times are integer minutes.

  A traveller standing at stop `from` at any time **at or before** `depart` can board that trip.
  Transfers are instant: arriving at a stop at time `t` lets you board any trip that leaves that stop
  at time `t` or later. Waiting at a stop is always allowed.

  The traveller is at stop `source` at time `start_time`. Return the **earliest time** they can be at
  stop `target`. Return `start_time` when `source == target`, and `-1` when `target` cannot be reached.

  ### Example 1
  ```
  Input:  n = 4, trips = [[0, 1, 10, 20], [1, 2, 25, 30], [0, 2, 5, 40], [1, 3, 20, 35], [2, 3, 30, 45]], source = 0, target = 3, start_time = 8
  Output: 35
  Explanation: The trip 0 -> 2 left at 5, before the traveller arrived. Take 0 -> 1 (10 to 20), then
               immediately 1 -> 3 (20 to 35). Going through stop 2 would reach 3 only at 45.
  ```

  ### Example 2
  ```
  Input:  n = 3, trips = [[0, 1, 5, 9], [1, 2, 8, 12]], source = 0, target = 2, start_time = 0
  Output: -1
  Explanation: The traveller reaches stop 1 at 9, but the only trip from 1 left at 8.
  ```

  ### Example 3
  ```
  Input:  n = 2, trips = [[0, 1, 1, 2]], source = 1, target = 1, start_time = 7
  Output: 7
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= trips.length <= 10^5`
  - `trips[i].length == 4`, `0 <= from, to < n`, `from != to`
  - `0 <= depart < arrive <= 10^9`
  - `0 <= source, target < n`, `0 <= start_time <= 10^9`
  - Trips may appear in any order; several trips may share a route or a departure time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: earliest_arrival
  params:
    - {name: n, type: "int"}
    - {name: trips, type: "int[][]"}
    - {name: source, type: "int"}
    - {name: target, type: "int"}
    - {name: start_time, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def earliest_arrival(n: int, trips: list[list[int]], source: int, target: int, start_time: int) -> int:
        if source == target:
            return start_time
        # best[s] = earliest time we can be standing at stop s (None = not reached yet)
        best: list[int | None] = [None] * n
        best[source] = start_time
        # A trip can only feed trips that depart strictly later (arrive > depart),
        # so one pass in departure order settles every stop.
        for frm, to, depart, arrive in sorted(trips, key=lambda trip: trip[2]):
            here = best[frm]
            if here is not None and here <= depart:
                if best[to] is None or arrive < best[to]:
                    best[to] = arrive
        return best[target] if best[target] is not None else -1
  javascript: |
    function earliestArrival(n, trips, source, target, startTime) {
      if (source === target) return startTime;
      const best = new Array(n).fill(-1);
      best[source] = startTime;
      const ordered = trips.slice().sort((x, y) => x[2] - y[2]);
      for (const [from, to, depart, arrive] of ordered) {
        if (best[from] !== -1 && best[from] <= depart) {
          if (best[to] === -1 || arrive < best[to]) best[to] = arrive;
        }
      }
      return best[target];
    }
