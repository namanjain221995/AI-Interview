expected_concepts:
  - "time-dependent shortest path where an edge is usable only if you are there before it departs"
  - "processing trips in departure order (connection scan) or Dijkstra keyed on arrival time"
  - "earliest-arrival relaxation per stop"
  - "why fewest trips or first-found trip is not the earliest arrival"
optimal_complexity: {time: "O(m log m) for sorting m trips plus O(n + m)", space: "O(n + m)"}
rubric:
  excellent: "Recognises that a trip can only feed trips departing later, sorts by departure and relaxes each stop's earliest arrival in one pass (or runs Dijkstra on arrival time with the boarding check), handles source == target and unreachable targets, and states O(m log m)."
  good: "Reaches a correct Dijkstra or sorted-scan solution after a hint about the boarding condition or about trips listed out of order."
  weak: "Treats the timetable as a static graph, uses BFS by number of trips, ignores the depart >= current time rule, or depends on input order."
  criteria:
    correctness: "All tests pass, including missed connections, waiting for a later trip and loops back through the source."
    efficiency: "One sort plus a linear scan, or Dijkstra in O((n + m) log m); no repeated rescanning of all trips."
    code_quality: "Clear per-stop earliest-arrival array with an explicit unreached marker and readable trip unpacking."
    edge_cases: "No trips, source equals target, departure exactly at arrival time and large timestamps."
    communication: "Explains why departure order is a valid processing order because arrive is strictly greater than depart."
hints:
  - "Keep, for every stop, the earliest time you could be standing there; a trip is only useful if that time is no later than its departure."
  - "A trip can only help you board trips that leave after it departs, so think about the order in which to look at the trips."
  - "Sort the trips by departure time and scan them once: when the earliest known time at the trip's origin is at or before its departure, improve the destination's earliest time with the trip's arrival. Answer with the target's value, the start time if source equals target, or -1."
followups:
  - "How would you also return the sequence of trips that achieves the earliest arrival?"
  - "Transfers now need a minimum connection time per stop; what changes?"
  - "Many travellers query different sources and start times against the same timetable; what would you precompute?"
  - "How would you find the latest departure from source that still reaches target by a deadline?"
common_errors:
  - "Using plain BFS on trip count, which minimises transfers rather than arrival time."
  - "Ignoring the boarding check and taking trips that already left."
  - "Processing trips in input order without sorting, so later-listed early trips are missed."
  - "Rejecting a connection where the arrival time equals the next departure time."
  - "Returning -1 instead of start_time when source equals target."
