expected_concepts:
  - "permutation check with a seen array or set"
  - "position (index) lookup table for O(1) comparisons"
  - "checking every dependency edge once"
  - "validating untrusted input before indexing"
optimal_complexity: {time: "O(n + d)", space: "O(n)"}
rubric:
  excellent: "Validates length, range and uniqueness first, builds a position table, checks each dependency in O(1) and explains why this is O(n + d) without needing a topological sort."
  good: "Correct position-table solution that may need a nudge about out-of-range labels, duplicates or a proposal with the wrong length."
  weak: "Searches the order with indexOf for every dependency (quadratic), skips the permutation check, or indexes arrays with unvalidated labels."
  criteria:
    correctness: "All tests pass, including duplicate entries, wrong lengths, out-of-range labels and cyclic dependencies."
    efficiency: "Linear in services plus dependencies with one position array."
    code_quality: "Separate, readable steps for the permutation check and the dependency check with clear names such as position, dependent and prerequisite."
    edge_cases: "Empty or overlong proposals, negative labels, repeated dependency pairs and a single service."
    communication: "Explains that validating an order is easier than producing one and why cycles automatically fail."
hints:
  - "There are two separate questions: is the proposal a proper list of every service exactly once, and does each dependency point backwards in it?"
  - "If you know at which step each service is deployed, a dependency pair can be checked with a single comparison instead of a search."
  - "First reject proposals with the wrong length, a label outside the range or a repeated label while filling an array of positions indexed by service; then, for each pair, fail as soon as the prerequisite's position is not smaller than the dependent's position."
followups:
  - "How would you produce a valid order instead of checking one, and how would you report a cycle?"
  - "If the operator's order is rejected, how would you return the first violated dependency to help them fix it?"
  - "Several services can be deployed in parallel in waves; how would you validate a proposed list of waves?"
common_errors:
  - "Skipping the permutation check, so a proposal that repeats or omits a service is accepted."
  - "Reading the pair the wrong way round and requiring a before b."
  - "Indexing the position array with an unchecked label and crashing on negative or too-large values."
  - "Calling indexOf inside the dependency loop, which is quadratic on large inputs."
