version: 1
slug: rollout_order_validator
title: "Validate a Rollout Order"
difficulty: easy
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [devops, platform, qa, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Validate a Rollout Order

  A release pipeline deploys `n` services labelled `0` to `n - 1`, one at a time. The platform team keeps
  a list of deployment dependencies: each pair `[a, b]` in `deps` means **service `b` must be deployed
  before service `a`** (for example, `a` reads a schema that `b` migrates).

  Before a release starts, an operator submits a proposed `order`. The pipeline accepts it only when
  **both** of these hold:

  - `order` is a **permutation** of `0` to `n - 1`: it has exactly `n` entries, every entry is a valid
    label and no service appears twice (so every service is deployed exactly once);
  - for every pair `[a, b]` in `deps`, service `b` appears **earlier** in `order` than service `a`.

  Return `true` if the proposed order is accepted and `false` otherwise.

  ### Example 1
  ```
  Input:  n = 4, deps = [[1, 0], [2, 0], [3, 1], [3, 2]], order = [0, 2, 1, 3]
  Output: true
  Explanation: Service 0 goes first, 1 and 2 follow it in either order, and 3 comes after both.
  ```

  ### Example 2
  ```
  Input:  n = 4, deps = [[1, 0], [2, 0], [3, 1], [3, 2]], order = [0, 3, 1, 2]
  Output: false
  Explanation: Service 3 depends on 1 and 2 but is deployed before both of them.
  ```

  ### Example 3
  ```
  Input:  n = 3, deps = [[2, 1]], order = [1, 1, 2]
  Output: false
  Explanation: Service 1 is deployed twice and service 0 is never deployed.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= deps.length <= 2 * 10^4`
  - `deps[i].length == 2`, `0 <= deps[i][0], deps[i][1] < n` and `deps[i][0] != deps[i][1]`
  - `deps` may contain the same pair more than once.
  - `0 <= order.length <= 2 * 10^4` and `-10^5 <= order[i] <= 10^5` (the proposal is unchecked input)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: valid_rollout
  params:
    - {name: n, type: "int"}
    - {name: deps, type: "int[][]"}
    - {name: order, type: "int[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def valid_rollout(n: int, deps: list[list[int]], order: list[int]) -> bool:
        if len(order) != n:
            return False
        position = [-1] * n
        for index, service in enumerate(order):
            if service < 0 or service >= n or position[service] != -1:
                return False
            position[service] = index
        for dependent, prerequisite in deps:
            if position[prerequisite] >= position[dependent]:
                return False
        return True
  javascript: |
    function validRollout(n, deps, order) {
      if (order.length !== n) return false;
      const position = new Array(n).fill(-1);
      for (let i = 0; i < order.length; i++) {
        const service = order[i];
        if (service < 0 || service >= n || position[service] !== -1) return false;
        position[service] = i;
      }
      for (const [dependent, prerequisite] of deps) {
        if (position[prerequisite] >= position[dependent]) return false;
      }
      return true;
    }
