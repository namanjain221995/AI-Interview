version: 1
slug: dial_button_min_presses
title: Fewest Dial Button Presses
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Fewest Dial Button Presses

  A test rig for an industrial controller has a digital set-point dial showing a whole number. The firmware
  only accepts values in the range `0` to `limit` inclusive. The dial has three buttons:

  - **Up** adds `up` to the value.
  - **Down** subtracts `down` from the value.
  - **Double** multiplies the value by `2`.

  A press whose result would fall **outside** `[0, limit]` is rejected by the firmware and is not allowed
  in a sequence. A QA engineer is writing an automated script that turns the dial from `start` to `goal`
  and wants it as short as possible.

  Return the minimum number of button presses that change the value from `start` to `goal`. Return `0`
  if `start == goal` and `-1` if `goal` cannot be reached.

  ### Example 1
  ```
  Input:  start = 3, goal = 10, up = 2, down = 1, limit = 20
  Output: 2
  Explanation: Up gives 5, then Double gives 10.
  ```

  ### Example 2
  ```
  Input:  start = 9, goal = 2, up = 3, down = 5, limit = 10
  Output: 3
  Explanation: Down gives 4, Up gives 7, Down gives 2. Pressing Up first would give 12, which is above the limit.
  ```

  ### Example 3
  ```
  Input:  start = 2, goal = 3, up = 2, down = 4, limit = 10
  Output: -1
  Explanation: Starting from an even value, every button keeps the value even.
  ```

  ### Constraints
  - `1 <= limit <= 10^5`
  - `0 <= start, goal <= limit`
  - `0 <= up, down <= limit` (a button with step `0` leaves the value unchanged)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_presses
  params:
    - {name: start, type: int}
    - {name: goal, type: int}
    - {name: up, type: int}
    - {name: down, type: int}
    - {name: limit, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def min_presses(start: int, goal: int, up: int, down: int, limit: int) -> int:
        if start == goal:
            return 0
        dist = [-1] * (limit + 1)
        dist[start] = 0
        queue = deque([start])
        while queue:
            value = queue.popleft()
            for nxt in (value + up, value - down, value * 2):
                if 0 <= nxt <= limit and dist[nxt] == -1:
                    dist[nxt] = dist[value] + 1
                    if nxt == goal:
                        return dist[nxt]
                    queue.append(nxt)
        return -1
  javascript: |
    function minPresses(start, goal, up, down, limit) {
      if (start === goal) return 0;
      const dist = new Int32Array(limit + 1).fill(-1);
      dist[start] = 0;
      const queue = [start];
      for (let head = 0; head < queue.length; head++) {
        const value = queue[head];
        for (const next of [value + up, value - down, value * 2]) {
          if (next >= 0 && next <= limit && dist[next] === -1) {
            dist[next] = dist[value] + 1;
            if (next === goal) return dist[next];
            queue.push(next);
          }
        }
      }
      return -1;
    }
tests:
  - {id: t1, args: [3, 10, 2, 1, 20], expected: 2, description: "Example 1 - Up then Double"}
  - {id: t2, args: [9, 2, 3, 5, 10], expected: 3, description: "Example 2 - Up first would exceed the limit; route goes down, up, down"}
  - {id: t3, args: [2, 3, 2, 4, 10], expected: -1, description: "Example 3 - parity makes the goal unreachable"}
  - {id: t4, hidden: true, args: [5, 5, 1, 1, 10], expected: 0, description: "start equals goal - zero presses"}
  - {id: t5, hidden: true, args: [1, 0, 1, 2, 5], expected: 2, description: "Down below zero is rejected; must go up first to reach 0"}
  - {id: t6, hidden: true, args: [14, 21, 6, 7, 21], expected: 10, description: "Double then Down (2 presses) is blocked because 28 exceeds the limit; answer is much longer"}
  - {id: t7, hidden: true, args: [3, 24, 0, 0, 100], expected: 3, description: "Up and Down have step 0; only doubling helps"}
  - {id: t8, hidden: true, args: [0, 5, 0, 0, 10], expected: -1, description: "Value 0 with zero steps can never change - unreachable, visited marking avoids infinite loops"}
  - {id: t9, hidden: true, args: [1, 99999, 1, 1, 100000], expected: 22, description: "Large range with unit steps - doubling plus small corrections"}
  - {id: t10, hidden: true, args: [0, 99991, 1000, 1, 100000], expected: 11, description: "Large range, goal near the top, big Up step and unit Down step"}
expected_concepts:
  - "modelling dial values as graph nodes and button presses as edges"
  - "breadth-first search over a bounded state space"
  - "visited array indexed by value"
  - "rejecting moves that leave the allowed range"
  - "early exit when the goal is first reached"
optimal_complexity: {time: O(limit), space: O(limit)}
rubric:
  excellent: "Models the values 0..limit as nodes with three outgoing edges, runs BFS with a visited array, rejects out-of-range presses, handles start equal to goal and unreachable goals, and explains why greedy rules (double whenever below the goal) fail; states O(limit) time and space."
  good: "Correct BFS with small prompts about the range check, the start-equals-goal case or marking visited on enqueue."
  weak: "Uses a greedy rule or unbounded recursion, ignores the range limits, or runs DFS without a visited set and loops forever."
  criteria:
    correctness: "All tests pass, including unreachable goals, zero-step buttons and cases where the limit blocks the obvious shortcut."
    efficiency: "Each value visited at most once; linear in limit."
    code_quality: "The three button transitions written once, range check in one place, clear early exits."
    edge_cases: "start equal to goal, start of zero with doubling, up or down of zero, goal at either end of the range."
    communication: "Explains why the first time BFS reaches the goal uses the fewest presses."
hints:
  - "Each value the dial can show is a state, and each button press moves you to another state. What kind of search finds the fewest steps between two states?"
  - "There are only limit plus one possible values, so you can remember which values you have already reached and never process one twice. Remember that presses landing outside the range are not allowed."
  - "Run breadth-first search from start with a distance array of size limit plus one, and for each dequeued value try value plus up, value minus down and value times two, enqueueing each in-range unvisited result with distance plus one, returning as soon as goal is reached, zero when start equals goal and minus one when the queue empties."
followups:
  - "How would you also return the sequence of buttons to press?"
  - "What changes if each button has a different cost, for example Double takes three seconds and the others one?"
  - "Could you search from both ends at once, and what makes the backward direction tricky here?"
  - "If limit were 10^12, what would you do differently?"
common_errors:
  - "Greedily doubling while below the goal, which misses shorter or the only valid sequences."
  - "Forgetting to reject values above the limit or below zero."
  - "Not marking values as visited, which loops forever when a button has step zero or two buttons cancel out."
  - "Returning -1 instead of 0 when start already equals goal."
