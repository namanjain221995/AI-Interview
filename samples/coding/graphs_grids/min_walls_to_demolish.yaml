version: 1
slug: min_walls_to_demolish
title: Fewest Walls to Demolish
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, general, data_scientist]
time_limit_minutes: 25
prompt_markdown: |
  ## Fewest Walls to Demolish

  A renovation crew needs a walkway for moving equipment through an old building. The site plan is
  `layout`, a list of equal-length strings, one per row: `'.'` is an open cell and `'#'` is a wall
  segment. The walkway starts at the top-left cell `(0, 0)` and ends at the bottom-right cell
  `(rows - 1, cols - 1)`, and each step goes **up, down, left or right** to a neighbouring cell inside
  the plan.

  Stepping into an open cell is free. A wall cell can only be used after it is **demolished**, which
  counts `1`; a demolished wall stays open, so using the same cell twice costs nothing extra. If the
  start or end cell is itself a wall it must be demolished too (and a `1 x 1` plan that is a wall costs
  `1`).

  Return the **minimum number of wall cells** that must be demolished so that a walkway from the start to
  the end exists.

  ### Example 1
  ```
  Input:  layout = ["..#..", "###.#", "..#..", ".##.#", "...#."]
  Output: 2
  Explanation: One cheapest walkway demolishes (0, 2), follows the open cells down column 3 and then demolishes (4, 3) to reach the end
  ```

  ### Example 2
  ```
  Input:  layout = ["#.", ".#"]
  Output: 2
  Explanation: Both the start cell and the end cell must be demolished; the open cells in between are free
  ```

  ### Constraints
  - `1 <= rows, cols <= 200`
  - all strings in `layout` have the same length `cols`
  - every character is `'.'` or `'#'`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_walls_to_clear
  params:
    - {name: layout, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def min_walls_to_clear(layout: list[str]) -> int:
        rows, cols = len(layout), len(layout[0])
        best = [[rows * cols + 1] * cols for _ in range(rows)]
        best[0][0] = 1 if layout[0][0] == "#" else 0
        queue = deque([(0, 0)])
        # 0-1 BFS: free moves go to the front of the deque, demolitions to the back.
        while queue:
            r, c = queue.popleft()
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols:
                    step = 1 if layout[nr][nc] == "#" else 0
                    if best[r][c] + step < best[nr][nc]:
                        best[nr][nc] = best[r][c] + step
                        if step == 0:
                            queue.appendleft((nr, nc))
                        else:
                            queue.append((nr, nc))
        return best[rows - 1][cols - 1]
  javascript: |
    function minWallsToClear(layout) {
      const rows = layout.length;
      const cols = layout[0].length;
      const best = Array.from({ length: rows }, () => new Array(cols).fill(rows * cols + 1));
      best[0][0] = layout[0][0] === '#' ? 1 : 0;
      // Process cells level by level: `current` holds cells at the current demolition count.
      let current = [[0, 0]];
      let level = best[0][0];
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (current.length > 0) {
        const next = [];
        for (let i = 0; i < current.length; i++) {
          const [r, c] = current[i];
          if (best[r][c] !== level) continue;
          for (const [dr, dc] of moves) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            const cost = level + (layout[nr][nc] === '#' ? 1 : 0);
            if (cost < best[nr][nc]) {
              best[nr][nc] = cost;
              if (cost === level) current.push([nr, nc]);
              else next.push([nr, nc]);
            }
          }
        }
        current = next;
        level += 1;
      }
      return best[rows - 1][cols - 1];
    }
