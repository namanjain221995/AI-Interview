expected_concepts:
  - shortest path with 0/1 edge weights
  - 0-1 BFS with a deque (or Dijkstra) over grid cells
  - counting the start cell when it is a wall
  - why plain BFS by number of steps is wrong
optimal_complexity: {time: O(R*C), space: O(R*C)}
rubric:
  excellent: Models the plan as a graph with 0/1 weights on entering a cell, implements 0-1 BFS (or Dijkstra and explains the deque optimisation), includes the start cell's cost, and states O(RC) time and space.
  good: Uses Dijkstra with a heap correctly, or reaches 0-1 BFS with a hint; minor slips such as the start-cell cost fixed after testing.
  weak: Uses plain BFS minimising steps, a greedy rule, or a right/down-only table that misses detours.
  criteria:
    correctness: Returns the minimum number of demolished cells, counting a wall at the start or end.
    efficiency: Linear in the number of cells with a deque, or O(RC log RC) with a heap; no path enumeration.
    code_quality: Clear distance grid, neighbour iteration and separation of free and paid moves.
    edge_cases: 1 x 1 plans (open and wall), single rows, all walls, routes that must move up or left.
    communication: Explains why free moves go to the front of the deque and paid moves to the back.
hints:
  - Treat each cell as a node; entering an open cell costs nothing and entering a wall costs one, so you want a cheapest route rather than a shortest one.
  - With only zero and one as costs you can keep a double-ended queue instead of a heap, as long as cells are processed in non-decreasing cost order.
  - Start with a cost of one if the top-left cell is a wall, otherwise zero; when relaxing a neighbour, push it to the front of the deque for an open cell and to the back for a wall, and read the final cost of the bottom-right cell.
followups:
  - How would you return which walls to demolish?
  - What if demolishing different walls had different costs from 1 to 9?
  - What if the crew may demolish at most k walls; how would you decide whether a walkway exists?
  - How would a breadth-first search over components of open cells give the same answer?
common_errors:
  - Running an ordinary BFS that minimises the number of steps instead of the number of demolitions.
  - Forgetting to count the start cell (or the end cell) when it is a wall.
  - Only moving right and down, which misses detours through open corridors.
  - Marking cells visited on first discovery in a 0-1 BFS, which can lock in a higher cost.
