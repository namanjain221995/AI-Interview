slug: freight_cheapest_with_leg_limit
title: "Cheapest Freight With a Leg Limit"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Cheapest Freight With a Leg Limit

  A logistics planner books pallets between `n` hubs, numbered `0` to `n - 1`. Each entry
  `[from, to, cost]` in `lanes` is a **one-way** freight lane with a positive price. Every lane used is
  one **leg** of the shipment, and the customer's contract allows at most `max_legs` legs, because each
  handover adds a day of transit.

  Return `[cost, legs]` for the shipment from `origin` to `destination`:

  - `cost` is the lowest total price of any route that uses at most `max_legs` lanes;
  - `legs` is the **fewest lanes** used by a route that achieves that lowest price;
  - if `origin` equals `destination`, return `[0, 0]`;
  - if no route fits within the limit, return `[-1, -1]`.

  Several lanes may connect the same two hubs, and a route may pass through a hub more than once.

  ### Example 1
  ```
  Input:  n = 4
          lanes = [[0, 1, 2], [1, 2, 2], [2, 3, 2], [0, 3, 9], [0, 2, 5]]
          origin = 0
          destination = 3
          max_legs = 2
  Output: [7, 2]
  Explanation: 0 -> 1 -> 2 -> 3 costs 6 but needs 3 lanes. Within 2 lanes the choices are 0 -> 2 -> 3 for 7 and 0 -> 3 for 9.
  ```

  ### Example 2
  ```
  Input:  n = 3, lanes = [[0, 1, 3], [1, 2, 3], [0, 2, 6]], origin = 0, destination = 2, max_legs = 5
  Output: [6, 1]
  Explanation: 0 -> 2 and 0 -> 1 -> 2 both cost 6; the route with fewer lanes is reported.
  ```

  ### Example 3
  ```
  Input:  n = 3, lanes = [[1, 0, 3], [2, 1, 3]], origin = 0, destination = 2, max_legs = 4
  Output: [-1, -1]
  Explanation: No lane leaves hub 0, so the destination can never be reached.
  ```

  ### Constraints
  - `1 <= n <= 100`
  - `0 <= lanes.length <= 5000`, `lanes[i].length == 3`, `0 <= from, to < n` and `from != to`
  - `1 <= cost <= 10^4`
  - `0 <= origin, destination < n`
  - `0 <= max_legs <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cheapest_shipment
  params:
    - {name: n, type: "int"}
    - {name: lanes, type: "int[][]"}
    - {name: origin, type: "int"}
    - {name: destination, type: "int"}
    - {name: max_legs, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def cheapest_shipment(n: int, lanes: list[list[int]], origin: int, destination: int, max_legs: int) -> list[int]:
        if origin == destination:
            return [0, 0]
        best = [None] * n
        best[origin] = 0
        answer = [-1, -1]
        for legs in range(1, max_legs + 1):
            nxt = best[:]
            for u, v, cost in lanes:
                if best[u] is not None and (nxt[v] is None or best[u] + cost < nxt[v]):
                    nxt[v] = best[u] + cost
            best = nxt
            if best[destination] is not None and (answer[0] == -1 or best[destination] < answer[0]):
                answer = [best[destination], legs]
        return answer
  javascript: |
    function cheapestShipment(n, lanes, origin, destination, maxLegs) {
      if (origin === destination) return [0, 0];
      let best = new Array(n).fill(Infinity);
      best[origin] = 0;
      let answer = [-1, -1];
      for (let legs = 1; legs <= maxLegs; legs++) {
        const next = best.slice();
        for (const [u, v, cost] of lanes) {
          if (best[u] !== Infinity && best[u] + cost < next[v]) next[v] = best[u] + cost;
        }
        best = next;
        if (best[destination] !== Infinity && (answer[0] === -1 || best[destination] < answer[0])) {
          answer = [best[destination], legs];
        }
      }
      return answer;
    }
