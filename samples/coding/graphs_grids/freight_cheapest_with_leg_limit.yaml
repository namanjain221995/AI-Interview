expected_concepts:
  - "Bellman-Ford style relaxation limited to max_legs rounds"
  - "copying the previous round's costs so one round adds at most one lane"
  - "recording the first round in which the best cost appears for the fewest legs"
  - "alternative: Dijkstra over hub and legs-used states"
  - "O(max_legs * E) time"
optimal_complexity: {time: "O(max_legs * E) for E lanes", space: "O(n)"}
rubric:
  excellent: "Runs exactly max_legs relaxation rounds on a copy of the previous costs, notes the first round where the destination reaches its minimum to get the fewest legs, handles the origin-equals-destination and unreachable cases, and explains why plain Dijkstra on cost alone fails under a leg limit."
  good: "Correct cost and legs using a state-space search over hub and legs used, or rounds that needed a prompt about copying the previous costs."
  weak: "Uses plain Dijkstra ignoring the limit, relaxes in place so a round can chain several lanes, or reports the legs of the first route found rather than the fewest among the cheapest."
  criteria:
    correctness: "All tests pass, including ties between short and long routes, a zero limit and unreachable destinations."
    efficiency: "Polynomial in the limit and the number of lanes; no route enumeration."
    code_quality: "Rounds are clearly separated and the best-so-far pair is updated in one place."
    edge_cases: "origin equals destination, max_legs of zero, parallel lanes, cycles near the origin."
    communication: "Explains why each round must read the previous round's costs."
hints:
  - "Think in rounds: what is the cheapest way to reach each hub using at most one lane, then at most two lanes, and so on?"
  - "Each round can extend the routes of the previous round by one lane. If you update costs in place, a single round can chain several lanes and break the limit. The fewest-legs part of the answer comes from noticing when the best price first appears."
  - "Return the origin-equals-destination pair first. Keep a cost per hub with only the origin at zero. For each round from one to max_legs, copy the costs, relax every lane using the previous round's costs into the copy, then replace the costs with the copy. After each round, if the destination's cost is strictly lower than the best seen so far, record that cost together with the round number. Return the recorded pair, or minus one twice if nothing was recorded."
followups:
  - "How would you return the hubs on the chosen route?"
  - "Can you solve it with a priority queue over hub and legs used, and when is that faster?"
  - "What changes if lanes could also have a transit time and the contract limited total days instead of legs?"
  - "How would you answer the same question for every possible limit from 1 to max_legs at once?"
common_errors:
  - "Running Dijkstra on price alone, which can pick a route with too many legs."
  - "Relaxing lanes in place within a round, letting one round use several lanes."
  - "Reporting the legs of the final round instead of the first round that reached the best price."
  - "Returning 0 instead of [0, 0], or forgetting the zero-leg limit."
