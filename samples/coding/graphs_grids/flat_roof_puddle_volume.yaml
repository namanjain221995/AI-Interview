prompt_markdown: |
  ## Flat Roof Puddle Volume

  A warehouse has a flat roof that a drone survey has mapped as a grid of integer heights:
  `heights[r][c]` is the height of the roof surface in cell `(r, c)` (each cell is one square metre).

  After heavy rain, water collects wherever it is enclosed. Water flows between cells that share an
  **edge** (up, down, left or right, not diagonally), and any water that reaches a cell on the **outer
  border** of the grid runs off the roof. In the settled state, each cell holds water up to the lowest
  level at which it could still drain away: water above a cell can only rise as high as the lowest
  "wall" it would have to cross to reach the border. Border cells never hold water.

  Return the **total volume** of water left on the roof, that is, the sum over all cells of the water
  depth above the roof surface. The total can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  heights = [[4, 4, 4, 4],
                     [4, 1, 2, 4],
                     [4, 4, 4, 4]]
  Output: 5
  Explanation: The two inner cells are enclosed by height 4: depths 3 and 2.
  ```

  ### Example 2
  ```
  Input:  heights = [[5, 5, 5, 5],
                     [5, 1, 1, 2],
                     [5, 5, 5, 5]]
  Output: 2
  Explanation: The right border cell has height 2, so water above the inner cells drains once it
               is higher than 2: depths 1 and 1.
  ```

  ### Example 3
  ```
  Input:  heights = [[7, 7, 7, 7, 7],
                     [7, 3, 7, 1, 7],
                     [7, 7, 7, 7, 7]]
  Output: 10
  Explanation: Two separate puddles, both held at level 7: depths 4 and 6.
  ```

  ### Constraints
  - `1 <= heights.length, heights[0].length <= 200`
  - All rows have the same length
  - `0 <= heights[r][c] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
