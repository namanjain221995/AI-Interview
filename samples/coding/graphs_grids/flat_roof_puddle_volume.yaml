  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def puddle_volume(heights: list[list[int]]) -> int:
        rows = len(heights)
        cols = len(heights[0]) if rows else 0
        if rows < 3 or cols < 3:
            return 0
        seen = [[False] * cols for _ in range(rows)]
        heap: list[tuple[int, int, int]] = []
        for r in range(rows):
            for c in range(cols):
                if r == 0 or r == rows - 1 or c == 0 or c == cols - 1:
                    heapq.heappush(heap, (heights[r][c], r, c))
                    seen[r][c] = True
        total = 0
        # Always grow inward from the lowest point of the current shoreline:
        # that level is exactly how high water can stand next to it.
        while heap:
            level, r, c = heapq.heappop(heap)
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols and not seen[nr][nc]:
                    seen[nr][nc] = True
                    h = heights[nr][nc]
                    if h < level:
                        total += level - h
                    heapq.heappush(heap, (max(h, level), nr, nc))
        return total
  javascript: |
    function puddleVolume(heights) {
      const rows = heights.length;
      const cols = rows ? heights[0].length : 0;
      if (rows < 3 || cols < 3) return 0;
      // binary min-heap of [level, row, col]
      const heap = [];
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p][0] <= heap[i][0]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
            if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
            push([heights[r][c], r, c]);
            seen[r][c] = true;
          }
        }
      }
      let total = 0;
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (heap.length > 0) {
        const [level, r, c] = pop();
        for (const [dr, dc] of steps) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || seen[nr][nc]) continue;
          seen[nr][nc] = true;
          const h = heights[nr][nc];
          if (h < level) total += level - h;
          push([Math.max(h, level), nr, nc]);
        }
      }
      return total;
    }
