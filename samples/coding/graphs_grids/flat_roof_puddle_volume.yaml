expected_concepts:
  - "min-heap (priority queue) flood fill from the border inward"
  - "water level as the minimax height of an escape path"
  - "why one-dimensional left/right maxima per row or column are wrong in 2D"
  - "visited marking on a grid"
  - "64-bit accumulation"
optimal_complexity: {time: "O(R * C * log(R * C))", space: "O(R * C)"}
rubric:
  excellent: "Seeds a min-heap with every border cell, repeatedly expands the lowest boundary cell, adds max(0, level - height) for each new neighbour and pushes it with the raised level; justifies correctness via the lowest escape wall, handles grids with no interior and uses a 64-bit total."
  good: "Arrives at the heap-based flood fill after a hint, or gets a correct but slower repeated-relaxation solution and can explain how to speed it up."
  weak: "Applies the one-dimensional two-pointer idea per row and column (overfilling winding drains), forgets that water escapes over the lowest border, or overflows a 32-bit sum."
  criteria:
    correctness: "All tests pass, including the winding drain, separate basins and the 9 * 10^9 volume."
    efficiency: "Each cell enters the heap once: O(R * C log(R * C))."
    code_quality: "Clear heap entries (level, row, col), a visited grid and a single neighbour loop."
    edge_cases: "Single row or column, 2 x 2 grids, flat roofs and very tall walls."
    communication: "Explains why processing the lowest boundary point first gives the exact water level of its neighbours."
hints:
  - "Water above a cell can only rise until it finds the lowest way out to the border; the border cells themselves are the starting walls."
  - "Think of the border as a shoreline and grow it inward. If you always work from the lowest point of the current shoreline, you know exactly how high water can stand next to it."
  - "Put every border cell in a min-priority queue keyed by height and mark them visited. Repeatedly take the lowest entry; for each unvisited neighbour, add the positive difference between the entry's level and the neighbour's height to the total, mark it, and push it with the larger of the two values as its level."
followups:
  - "How would you return the depth grid instead of the total, for a drainage report?"
  - "The roof has a few drains in interior cells that remove water; how would you model them?"
  - "How would you update the answer after a single cell's height changes during repairs?"
  - "Why does the one-dimensional two-pointer method fail in two dimensions? Give a small counter-example."
common_errors:
  - "Using per-row and per-column maximum walls, which ignores winding escape paths."
  - "Starting the search from the global minimum instead of from the whole border."
  - "Pushing a neighbour with its own height instead of the raised water level, which undercounts deeper basins."
  - "Accumulating the volume in a 32-bit integer."
  - "Counting water on border cells or treating diagonal cells as connected."
