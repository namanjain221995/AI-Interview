slug: largest_wet_floor_patch
title: Largest Wet Floor Patch
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, backend, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Largest Wet Floor Patch

  A data-centre hall has a leak sensor under every floor tile. After a cooling-pipe alarm, the sensors
  report a snapshot `floor`: a list of equal-length strings where `W` marks a wet tile and `.` a dry one.

  Wet tiles that share an edge (up, down, left or right) form one **wet patch**; tiles that only touch
  at a corner are separate. The on-call engineer sends the clean-up crew to the biggest patch first.

  Return the number of tiles in the largest wet patch, or `0` if no tile is wet.

  ### Example 1
  ```
  Input:  floor = ["WW..",
                   "W..W",
                   "..WW",
                   "...W"]
  Output: 4
  Explanation: The top-left patch has 3 tiles; the patch on the right has 4.
  ```

  ### Example 2
  ```
  Input:  floor = ["...",
                   "..."]
  Output: 0
  ```

  ### Constraints
  - `1 <= floor.length <= 100` and `1 <= floor[i].length <= 100`; all strings have the same length.
  - Every character is `W` or `.`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_wet_patch
  params:
    - {name: floor, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def largest_wet_patch(floor: list[str]) -> int:
        rows, cols = len(floor), len(floor[0])
        seen = [[False] * cols for _ in range(rows)]
        best = 0
        for r in range(rows):
            for c in range(cols):
                if floor[r][c] != "W" or seen[r][c]:
                    continue
                seen[r][c] = True
                stack = [(r, c)]
                size = 0
                while stack:
                    cr, cc = stack.pop()
                    size += 1
                    for nr, nc in ((cr - 1, cc), (cr + 1, cc), (cr, cc - 1), (cr, cc + 1)):
                        if 0 <= nr < rows and 0 <= nc < cols and floor[nr][nc] == "W" and not seen[nr][nc]:
                            seen[nr][nc] = True
                            stack.append((nr, nc))
                best = max(best, size)
        return best
  javascript: |
    function largestWetPatch(floor) {
      const rows = floor.length;
      const cols = floor[0].length;
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      let best = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (floor[r][c] !== "W" || seen[r][c]) continue;
          seen[r][c] = true;
          const queue = [[r, c]];
          let head = 0;
          while (head < queue.length) {
            const [cr, cc] = queue[head++];
            for (const [nr, nc] of [[cr - 1, cc], [cr + 1, cc], [cr, cc - 1], [cr, cc + 1]]) {
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && floor[nr][nc] === "W" && !seen[nr][nc]) {
                seen[nr][nc] = true;
                queue.push([nr, nc]);
              }
            }
          }
          best = Math.max(best, queue.length);
        }
      }
      return best;
    }
