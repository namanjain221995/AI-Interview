expected_concepts:
  - "connected components on a grid"
  - "flood fill with BFS or DFS"
  - "visited marking so each tile is counted once"
  - "tracking the maximum component size"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Scans every tile, flood-fills each unvisited wet tile with an explicit stack or queue while counting its size, keeps the maximum, handles the all-dry case and states O(rows * cols) time and space."
  good: "Correct recursive flood fill that counts sizes; may need a prompt about recursion depth or a visited structure."
  weak: "Counts all wet tiles instead of the largest patch, counts diagonal neighbours, revisits tiles so sizes are inflated, or returns the number of patches."
  criteria:
    correctness: "All tests pass, including no wet tiles, checkerboards and a single long patch."
    efficiency: "Every tile visited a constant number of times."
    code_quality: "Neighbour offsets defined once and a clear per-patch counter."
    edge_cases: "Single tile, single row or column, all wet, all dry, ring with a hole."
    communication: "Explains how the visited marking prevents double counting."
hints:
  - "Each wet patch is a group of tiles you can walk between through shared edges; you want the size of the biggest group."
  - "Scan the floor and, whenever you meet a wet tile you have not counted yet, explore its whole patch, counting tiles as you go and marking them so they are never counted again."
  - "Keep a visited grid and a best value; for each unvisited W start a stack with that tile, pop tiles one at a time adding one to a counter and pushing the in-bounds, unvisited W neighbours above, below, left and right (marking them when pushed), then update best with the counter."
followups:
  - "How would you also return the coordinates of the largest patch?"
  - "If sensors report tiles becoming wet one at a time, how would you keep the largest patch size up to date?"
  - "What if diagonal contact should also connect wet tiles?"
  - "How would you avoid the extra visited grid, and what is the trade-off?"
common_errors:
  - "Marking tiles visited only when popped, so the same tile is pushed and counted twice."
  - "Counting diagonal neighbours as part of the patch."
  - "Returning the number of patches or the total of wet tiles."
  - "Recursive flood fill that overflows the stack on a long winding patch."
