version: 1
slug: hop_route_validator
title: Validate a Hop Route
difficulty: easy
competency_keys: [data_structures, code_quality]
role_tags: [network, qa, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Validate a Hop Route

  A network team keeps an inventory of `n` routers labelled `0` to `n - 1`. Each entry `[a, b]` in
  `links` is a **bidirectional** physical link: traffic can hop from `a` to `b` and from `b` to `a`.

  Before a static path is pushed to production, a change-review bot checks the proposed `route`, a
  list of router labels in the order the traffic would visit them. The route is **valid** when all
  of these hold:

  - the route is **non-empty**;
  - every two consecutive routers in the route are joined by a direct link (in either direction);
  - no router appears in the route more than once.

  Return `true` if the route is valid and `false` otherwise. A route with a single router has no
  hops and is valid.

  ### Example 1
  ```
  Input:  n = 5, links = [[0, 1], [1, 2], [2, 3], [3, 4]], route = [0, 1, 2, 3]
  Output: true
  Explanation: Every hop 0-1, 1-2 and 2-3 is a direct link and no router repeats.
  ```

  ### Example 2
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [0, 3]], route = [3, 0, 2]
  Output: false
  Explanation: Routers 0 and 2 are not directly linked (only through router 1).
  ```

  ### Example 3
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 0]], route = [0, 1, 2, 0]
  Output: false
  Explanation: Every hop is linked, but router 0 appears twice.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 2 * 10^4`
  - `links[i].length == 2`, `0 <= links[i][0], links[i][1] < n` and `links[i][0] != links[i][1]`
  - The same link may be listed more than once, in either direction.
  - `0 <= route.length <= 10^4` and `0 <= route[i] < n`

  **Follow-up:** your check should run in time linear in the number of links plus the route length.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_valid_route
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: route, type: "int[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_valid_route(n: int, links: list[list[int]], route: list[int]) -> bool:
        if not route:
            return False
        linked = set()
        for a, b in links:
            linked.add((min(a, b), max(a, b)))
        seen = set()
        for i, node in enumerate(route):
            if node in seen:
                return False
            seen.add(node)
            if i > 0:
                prev = route[i - 1]
                if (min(prev, node), max(prev, node)) not in linked:
                    return False
        return True
  javascript: |
    function isValidRoute(n, links, route) {
      if (route.length === 0) return false;
      const linked = new Set();
      for (const [a, b] of links) {
        linked.add(Math.min(a, b) * n + Math.max(a, b));
      }
      const seen = new Set();
      for (let i = 0; i < route.length; i++) {
        const node = route[i];
        if (seen.has(node)) return false;
        seen.add(node);
        if (i > 0) {
          const prev = route[i - 1];
          if (!linked.has(Math.min(prev, node) * n + Math.max(prev, node))) return false;
        }
      }
      return true;
    }
