expected_concepts:
  - "adjacency set or normalised edge set for O(1) link lookups"
  - "treating undirected links symmetrically"
  - "tracking visited nodes to reject repeats"
  - "explicit handling of the empty and single-node route"
optimal_complexity: {time: "O(L + R)", space: "O(L + R)"}
rubric:
  excellent: "Builds a constant-time link lookup that ignores direction, walks the route once checking each hop and a seen set, handles the empty and single-router routes explicitly and states linear time and space."
  good: "Correct solution with a set or adjacency lists, possibly after fixing the reversed-direction case or the empty route with a small prompt."
  weak: "Scans the whole link list for every hop without discussing the cost, checks only one direction of each link, or forgets to reject repeated routers."
  criteria:
    correctness: "All tests pass, including reversed links, repeated routers and the empty route."
    efficiency: "Linear in links plus route length using hashing; quadratic scans are recognised as avoidable."
    code_quality: "Small, readable checks with early returns and a clear way of normalising an undirected pair."
    edge_cases: "Empty route, single router, duplicate link entries and a router repeated immediately or much later."
    communication: "States the three validity rules before coding and explains how direction is ignored."
hints:
  - "Split the job into the three separate rules and check each one while walking the route once."
  - "Answering whether two routers are directly linked should not require scanning the whole link list; store the links so that this is a constant-time question, regardless of which way each link was written."
  - "Put every link into a set as an ordered pair with the smaller label first, keep a second set of routers already used, then walk the route: reject immediately on a repeated router or a hop whose normalised pair is missing, and remember that an empty route is rejected before the walk starts."
followups:
  - "How would you report the index of the first offending hop instead of a boolean?"
  - "What changes if links were one-directional?"
  - "How would you validate many routes against the same link inventory efficiently?"
  - "If routes may revisit routers but must not reuse a link, what would you track instead?"
common_errors:
  - "Looking up only the pair as written and missing links stored in the other direction."
  - "Returning true for an empty route."
  - "Checking only consecutive repeats and missing a router revisited later in the route."
  - "Scanning the full link list for every hop, giving quadratic time."
