title: "Is the Network a Single Tree?"
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [network, general, backend, cloud]
time_limit_minutes: 15
prompt_markdown: |
  ## Is the Network a Single Tree?

  A network team is auditing the fibre plan for `n` sites with ids `0` to `n - 1`. Each entry
  `[a, b]` in `links` is a two-way cable between sites `a` and `b`. To keep the plan lean, the
  team wants exactly the cables needed to connect every site and nothing more: the plan should form a
  **single tree**.

  Return `true` if and only if both of these hold:

  - every site can reach every other site through the cables, and
  - there is no redundant cable: no loop of any length, no cable listed twice between the same pair
    of sites (in either orientation), and no cable from a site to itself.

  A plan with one site and no cables is a valid tree. Otherwise return `false`.

  ### Example 1
  ```
  Input:  n = 5, links = [[0, 1], [0, 2], [0, 3], [1, 4]]
  Output: true
  ```

  ### Example 2
  ```
  Input:  n = 5, links = [[0, 1], [1, 2], [2, 3], [1, 3], [1, 4]]
  Output: false
  Explanation: Sites 1, 2 and 3 form a loop, so one of those cables is redundant.
  ```

  ### Example 3
  ```
  Input:  n = 4, links = [[0, 1], [2, 3]]
  Output: false
  Explanation: Sites 0-1 cannot reach sites 2-3.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 2 * 10^4`
  - `links[i].length == 2` and `0 <= a, b < n` (a self-loop `a == b` and repeated cables may appear)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_tree_network
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_tree_network(n: int, links: list[list[int]]) -> bool:
        if len(links) != n - 1:
            return False
        root = list(range(n))

        def find(x: int) -> int:
            while root[x] != x:
                root[x] = root[root[x]]
                x = root[x]
            return x

        for a, b in links:
            ra, rb = find(a), find(b)
            if ra == rb:
                # self-loop, duplicate cable or loop: a redundant cable
                return False
            root[ra] = rb
        # n - 1 cables and none redundant means everything is connected
        return True
  javascript: |
    function isTreeNetwork(n, links) {
      if (links.length !== n - 1) return false;
      const root = Array.from({ length: n }, (_, i) => i);
      const find = (x) => {
        while (root[x] !== x) {
          root[x] = root[root[x]];
          x = root[x];
        }
        return x;
      };
      for (const [a, b] of links) {
        const ra = find(a);
        const rb = find(b);
        if (ra === rb) return false;
        root[ra] = rb;
      }
      return true;
    }
