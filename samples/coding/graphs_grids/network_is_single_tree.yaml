expected_concepts:
  - "a tree on n nodes has exactly n - 1 edges, is connected and acyclic"
  - "union-find (disjoint set) or a graph traversal with a visited set"
  - "duplicate edges and self-loops count as cycles"
  - "edge-count check as an early exit"
optimal_complexity: {time: "O(n + e * α(n))", space: "O(n)"}
rubric:
  excellent: "States the tree properties (n - 1 edges plus connected, or plus acyclic), uses union-find or a BFS/DFS with a visited set, treats self-loops and duplicates as redundant, and explains why two of the three properties imply the third."
  good: "Correct traversal or union-find solution that handles duplicates and self-loops, possibly after a hint about the n - 1 edge check."
  weak: "Checks only the edge count or only connectivity, treats an undirected cable as a back edge to its parent and wrongly reports loops (or misses real ones), or fails on n = 1."
  criteria:
    correctness: "All tests pass, including n - 1 cables with a loop plus an isolated site, duplicates and self-loops."
    efficiency: "Near-linear in sites plus cables; no pairwise comparisons."
    code_quality: "Clear find/union helpers or a clean iterative traversal; no recursion depth risk at 10^4 sites."
    edge_cases: "Handles a single site, no cables, self-loops, duplicates and disconnected pieces."
    communication: "Explains which combination of tree properties the code relies on and why it is sufficient."
hints:
  - "Recall what makes an undirected graph a tree: think about connectivity, loops and how many edges such a graph must have."
  - "If the plan has exactly n - 1 cables, you only need to confirm one more property; a structure that tracks which sites are already joined makes loops easy to spot."
  - "Return false unless there are exactly n - 1 cables; then process cables with a disjoint-set structure, returning false as soon as a cable joins two sites already in the same group (this catches self-loops and duplicates too), and return true at the end."
followups:
  - "If the plan is not a tree, how would you report which cables are redundant?"
  - "How would you count how many extra cables would be needed to connect every site?"
  - "Cables now arrive one by one as they are installed; how would you report after each one whether the network is connected?"
  - "Why do any two of the three properties (connected, acyclic, n - 1 edges) imply the third?"
common_errors:
  - "Checking only that there are n - 1 cables, which accepts a loop plus an isolated site."
  - "Checking only connectivity, which accepts extra cables."
  - "In a DFS, treating the cable back to the parent as a loop, or skipping the parent by id so a duplicate cable is never detected."
  - "Returning false for a single site with no cables."
