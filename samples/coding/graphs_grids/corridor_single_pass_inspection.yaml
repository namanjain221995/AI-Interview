title: Inspect Every Corridor Once
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, qa, network]
time_limit_minutes: 20
prompt_markdown: |
  ## Inspect Every Corridor Once

  A cable-tray inspection robot works in a plant whose junctions are numbered `0` to `n - 1`. The
  corridors between junctions are listed in `corridors`, where `corridors[i] = [u, v]` means a corridor
  that can be travelled in **either direction** connects junction `u` and junction `v`. Two junctions may
  be joined by **several** parallel corridors; each one is a separate corridor. No corridor starts and
  ends at the same junction.

  The robot is dropped at any junction you choose and picked up at any junction (possibly the same one).
  To save battery it must travel through **every corridor exactly once** in a single continuous walk. It
  may pass through a junction as many times as needed.

  Return `true` if such a walk exists and `false` otherwise.

  - Junctions with no corridors play no part and are ignored.
  - With zero corridors there is nothing to inspect, so return `true`.

  ### Example 1
  ```
  Input:  n = 4, corridors = [[0, 1], [1, 2], [2, 3], [3, 0], [0, 2]]
  Output: true
  Explanation: One walk is 0 -> 1 -> 2 -> 3 -> 0 -> 2.
  ```

  ### Example 2
  ```
  Input:  n = 4, corridors = [[0, 1], [0, 2], [0, 3]]
  Output: false
  Explanation: Whichever route the robot takes, it would have to use one of the corridors at junction 0 twice.
  ```

  ### Example 3
  ```
  Input:  n = 5, corridors = [[0, 1], [1, 2], [2, 0], [3, 4], [4, 3]]
  Output: false
  Explanation: Each group of corridors could be walked on its own, but the robot cannot get from one group to the other.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= corridors.length <= 2 * 10^4`
  - `corridors[i].length == 2`, `0 <= u, v < n` and `u != v`
  - The same pair of junctions may appear more than once, in either order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_walk_each_corridor_once
  params:
    - {name: n, type: int}
    - {name: corridors, type: "int[][]"}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def can_walk_each_corridor_once(n: int, corridors: list[list[int]]) -> bool:
        if not corridors:
            return True
        parent = list(range(n))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        degree = [0] * n
        for u, v in corridors:
            degree[u] += 1
            degree[v] += 1
            parent[find(u)] = find(v)
        odd = sum(1 for d in degree if d % 2 == 1)
        if odd not in (0, 2):
            return False
        groups = {find(x) for x in range(n) if degree[x] > 0}
        return len(groups) == 1
  javascript: |
    function canWalkEachCorridorOnce(n, corridors) {
      if (corridors.length === 0) return true;
      const parent = Array.from({ length: n }, (_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const degree = new Array(n).fill(0);
      for (const [u, v] of corridors) {
        degree[u] += 1;
        degree[v] += 1;
        parent[find(u)] = find(v);
      }
      let odd = 0;
      for (const d of degree) if (d % 2 === 1) odd += 1;
      if (odd !== 0 && odd !== 2) return false;
      const groups = new Set();
      for (let x = 0; x < n; x++) if (degree[x] > 0) groups.add(find(x));
      return groups.size === 1;
    }
