expected_concepts:
  - "Euler trail condition: zero or two junctions of odd degree"
  - "all junctions that have corridors must be in one connected component"
  - "degree counting with parallel corridors counted separately"
  - "union-find or BFS/DFS for connectivity"
  - "ignoring isolated junctions"
optimal_complexity: {time: "O(n + m) where m = corridors.length", space: "O(n)"}
rubric:
  excellent: "States and justifies the odd-degree rule (each pass through a junction uses two corridors, only the start and end can be unbalanced), adds the connectivity check restricted to junctions with corridors, handles parallel corridors and zero corridors, and gives O(n + m)."
  good: "Correct degree and connectivity checks with a small prompt about isolated junctions, parallel corridors or the empty case."
  weak: "Tries to search for the walk by backtracking (exponential), checks only degrees and misses disconnected groups, or requires every junction to be connected including isolated ones."
  criteria:
    correctness: "All tests pass, including disconnected groups with valid degrees, parallel corridors and isolated junctions."
    efficiency: "Linear in junctions plus corridors; no backtracking over walks."
    code_quality: "Degree counting and connectivity kept as two clear steps; union-find or traversal written cleanly."
    edge_cases: "Zero corridors, a single corridor, isolated junctions, the same pair listed several times."
    communication: "Explains why a junction passed through in the middle of the walk must have even degree."
hints:
  - "Think about what happens at a junction the robot passes through in the middle of its walk, it arrives along one corridor and leaves along another."
  - "So the number of corridors touching each junction matters, and only the start and end junctions can break that pattern. Separately, the robot must be able to reach every corridor at all."
  - "Count the corridors at every junction and accept only zero or two junctions with an odd count, then check with union-find or a graph traversal that all junctions with at least one corridor lie in one connected group, ignoring junctions with no corridors."
followups:
  - "How would you actually produce the walk (Hierholzer's algorithm) and in what complexity?"
  - "What changes if every corridor is one-way?"
  - "If no single walk exists, what is the minimum number of separate walks needed to cover every corridor once?"
  - "How would you require the walk to start and end at the same junction?"
common_errors:
  - "Checking only the odd-degree count and forgetting that the corridors may form disconnected groups."
  - "Including isolated junctions in the connectivity check, which wrongly returns false."
  - "Deduplicating parallel corridors, which changes the degrees."
  - "Returning false when there are no corridors."
