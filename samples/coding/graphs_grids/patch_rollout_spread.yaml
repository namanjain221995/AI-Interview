reference_solutions:
  python: |
    def patch_rollout(rack_map: list[str]) -> list[int]:
        rows, cols = len(rack_map), len(rack_map[0])
        patched = [[cell == "P" for cell in row] for row in rack_map]
        hits = [[0] * cols for _ in range(rows)]
        frontier = []
        outdated = 0
        for r in range(rows):
            for c in range(cols):
                cell = rack_map[r][c]
                if cell == "P":
                    frontier.append((r, c))
                elif cell in "oH":
                    outdated += 1
        minutes = 0
        while frontier:
            next_frontier = []
            for r, c in frontier:
                for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                    if not (0 <= nr < rows and 0 <= nc < cols) or patched[nr][nc]:
                        continue
                    cell = rack_map[nr][nc]
                    if cell not in "oH":
                        continue
                    hits[nr][nc] += 1
                    if hits[nr][nc] >= (1 if cell == "o" else 2):
                        patched[nr][nc] = True
                        next_frontier.append((nr, nc))
            if next_frontier:
                minutes += 1
                outdated -= len(next_frontier)
            frontier = next_frontier
        return [minutes, outdated]
  javascript: |
    function patchRollout(rackMap) {
      const rows = rackMap.length;
      const cols = rackMap[0].length;
      const patched = rackMap.map((row) => Array.from(row, (cell) => cell === "P"));
      const hits = rackMap.map(() => new Array(cols).fill(0));
      let frontier = [];
      let outdated = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = rackMap[r][c];
          if (cell === "P") frontier.push([r, c]);
          else if (cell === "o" || cell === "H") outdated++;
        }
      }
      const moves = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      let minutes = 0;
      while (frontier.length > 0) {
        const next = [];
        for (const [r, c] of frontier) {
          for (const [dr, dc] of moves) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || patched[nr][nc]) continue;
            const cell = rackMap[nr][nc];
            if (cell !== "o" && cell !== "H") continue;
            hits[nr][nc]++;
            if (hits[nr][nc] >= (cell === "o" ? 1 : 2)) {
              patched[nr][nc] = true;
              next.push([nr, nc]);
            }
          }
        }
        if (next.length > 0) {
          minutes++;
          outdated -= next.length;
        }
        frontier = next;
      }
      return [minutes, outdated];
    }
