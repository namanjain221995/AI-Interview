title: "Patch Rollout Spread"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, sre, security, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Patch Rollout Spread

  A security patch is spreading through a server room by peer-to-peer update agents. The room is
  given as `rack_map`, a list of equal-length strings, one per row of rack slots:

  - `'P'` a server that already runs the patch at minute `0`,
  - `'o'` a standard server still on the old build,
  - `'H'` a hardened server still on the old build,
  - `'.'` an empty slot (it never relays anything).

  The rollout advances in whole minutes. Within a minute every change happens **at the same time**,
  based only on which servers were patched at the end of the previous minute:

  - a standard server gets the patch if **at least one** of its neighbours directly above, below, left
    or right of it is patched;
  - a hardened server only accepts the patch when **at least two different** neighbours in those four
    directions are patched. Diagonal slots never count.

  Once a server is patched it stays patched. Return `[minutes, outdated]`:

  - `minutes` is the number of the last minute in which at least one server was patched (`0` if no
    server ever changes);
  - `outdated` is how many standard and hardened servers are still on the old build when the rollout
    can make no further progress.

  ### Example 1
  ```
  Input:  rack_map = ["Poo.", "o.oo", "o..P"]
  Output: [2, 0]
  Explanation: Using (row, column) positions, minute 1 patches (0,1), (1,0) and (1,3); minute 2 patches (0,2), (1,2) and (2,0).
  ```

  ### Example 2
  ```
  Input:  rack_map = ["PoH", "oHo", "..P"]
  Output: [2, 0]
  Explanation: Minute 1 patches the standard servers (0,1), (1,0) and (1,2). Both hardened servers then have two patched neighbours, so they join in minute 2.
  ```

  ### Example 3
  ```
  Input:  rack_map = ["P.o", "...", "o.o"]
  Output: [0, 3]
  Explanation: Empty slots surround the seed, so nothing ever changes and all three standard servers stay outdated.
  ```

  ### Constraints
  - `1 <= m, n <= 60`, where `m = rack_map.length` and `n = rack_map[i].length`
  - Every row has the same length and contains only `'P'`, `'o'`, `'H'` and `'.'`.
  - There may be zero, one or many patched servers at the start.
languages: [python, javascript, typescript, java, go, cpp]
