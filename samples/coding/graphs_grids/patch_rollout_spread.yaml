expected_concepts:
  - "multi-source breadth-first search started from every patched server"
  - "processing the frontier minute by minute so changes are simultaneous"
  - "per-server counter of patched neighbours with a threshold of one or two"
  - "counting remaining outdated servers after the frontier empties"
  - "O(m * n) time because each cell is relaxed at most four times"
optimal_complexity: {time: "O(m * n)", space: "O(m * n)"}
rubric:
  excellent: "Models the rollout as a level-by-level multi-source BFS, keeps a patched-neighbour counter per hardened server so it joins the frontier exactly when the second neighbour flips, reports the last productive minute and the remaining outdated count, and argues O(m * n) time."
  good: "Correct answer using repeated full-grid simulation (one sweep per minute with a copy of the state) or a BFS that needs a nudge on the hardened-server rule or on the minute counting."
  weak: "Updates the grid in place so the patch races across several servers in one minute, ignores the two-neighbour rule, counts minutes off by one, or never terminates when nothing can spread."
  criteria:
    correctness: "All tests pass, including rooms with no seed, isolated hardened servers and rooms that need no work."
    efficiency: "Each cell enters the frontier at most once and each neighbour check is constant work, giving O(m * n)."
    code_quality: "Clear separation of the current and next frontier, a neighbour-direction list and named thresholds."
    edge_cases: "Zero seeds, only empty slots, hardened servers in corners or single rows, servers that are never reachable."
    communication: "Explains why simultaneous updates require a level-by-level frontier and how the counter enforces the two-neighbour rule."
hints:
  - "All the seed servers start spreading at once, so think of a search that begins from every patched server together and moves outward one minute at a time."
  - "Process the rollout as a breadth-first search in levels: the servers patched at minute t are the frontier that decides who is patched at minute t plus one. A hardened server needs to know how many of its neighbours are already patched."
  - "Put every 'P' in the first frontier and count the outdated servers. For each frontier server, look at its four neighbours; increase a counter on each still-outdated neighbour and add it to the next frontier as soon as the counter reaches one for a standard server or two for a hardened one, marking it patched. Count a minute only when the next frontier is non-empty, subtract its size from the outdated total and stop when it is empty."
followups:
  - "How would you return the minute at which each individual server gets patched?"
  - "What changes if some servers need three patched neighbours, or the threshold differs per server?"
  - "How would you find the single extra seed position that minimises the total rollout time?"
  - "How would you run this on a room too large to fit in memory, streamed row by row?"
common_errors:
  - "Updating servers in place during a sweep so one minute patches a whole chain of servers."
  - "Treating hardened servers like standard ones, or counting the same patched neighbour twice."
  - "Incrementing the minute counter for a final empty frontier, which reports one minute too many."
  - "Forgetting to count servers that can never be reached when there are no seeds at all."
