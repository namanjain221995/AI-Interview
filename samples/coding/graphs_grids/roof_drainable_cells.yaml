expected_concepts:
  - reverse the flow direction and search uphill from the drains
  - multi-source BFS or DFS with a shared visited grid
  - non-strict comparison (equal heights let water flow both ways)
  - avoiding a separate search from every cell
optimal_complexity: {time: O(R*C), space: O(R*C)}
rubric:
  excellent: Reverses the problem into a multi-source search that climbs from every drain to neighbours of greater or equal height, counts visited cells once, handles duplicate drains and empty drain lists, and states O(RC) time and space.
  good: Correct answer with a search from every cell (O((RC)^2)) and an explanation of how reversing the direction would speed it up, or the reversed search with small slips fixed after testing.
  weak: Follows only the single steepest descent from each cell, uses strict comparisons, or counts drains multiple times.
  criteria:
    correctness: Counts exactly the cells from which some non-increasing path reaches a drain.
    efficiency: One multi-source traversal over the grid; each cell enters the queue at most once.
    code_quality: Clear visited grid, neighbour list and the reversed comparison named or commented.
    edge_cases: No drains, duplicate drains, flat plateaus, a drain at a peak and isolated low pits.
    communication: Explains why searching uphill from the drains gives the same set of cells as searching downhill from every cell.
hints:
  - Instead of following water downhill from every cell, think about which cells could have sent water to a given drain.
  - Water reaches a cell from a neighbour that is at least as high, so you can explore outward from the drains, stepping only to neighbours of greater or equal height.
  - Put every distinct drain cell into a queue and mark it, then run a breadth-first search that visits each unmarked neighbour whose height is greater than or equal to the current cell's height; the answer is the number of marked cells.
followups:
  - How would you report, for each cell, which drains its water can reach?
  - How would you find the single extra drain that maximises the number of drainable cells?
  - What changes if water may also flow diagonally?
  - How would you update the answer efficiently after one cell's height changes?
common_errors:
  - Running a separate search from every cell, which is quadratic in the number of cells.
  - Using strict greater-than when climbing, which breaks on flat areas.
  - Following only the lowest neighbour instead of every neighbour that is not higher.
  - Counting a drain twice when it is listed more than once.
