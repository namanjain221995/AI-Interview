title: Roof Cells That Reach a Drain
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Roof Cells That Reach a Drain

  A facilities team models a flat-ish warehouse roof as a grid `heights` of `rows x cols` cells, where
  `heights[r][c]` is the surface height of cell `(r, c)` in millimetres. Rainwater on a cell can flow to
  a neighbouring cell **up, down, left or right** whose height is **less than or equal to** the height of
  the cell it is on, and it can keep flowing from cell to cell in this way. Water never flows off the
  edge of the roof.

  `drains` lists the cells that have a drain, each as `[row, col]`; the same drain may be listed more
  than once. A cell is **drainable** if water starting on it can reach at least one drain cell (a drain
  cell is drainable by itself).

  Return the number of drainable cells, so the team knows how much of the roof is at risk of pooling
  (`rows * cols` minus your answer). Return `0` when there are no drains.

  ### Example 1
  ```
  Input:  heights = [[5, 4, 6], [3, 2, 7], [1, 8, 0]], drains = [[2, 0]]
  Output: 4
  Explanation: Water from the cells of height 3, 5 and 8 can run down to the drain at height 1; the cells of height 4, 6 and 7 can only reach the pit at height 2 or the corner at height 0, which never reach the drain
  ```

  ### Example 2
  ```
  Input:  heights = [[3, 3, 3], [3, 0, 3], [3, 3, 1]], drains = [[0, 0]]
  Output: 7
  Explanation: The ring of 3s is level and reaches the drain at (0, 0); the cells of height 0 and 1 are lower than all their neighbours, so their water never leaves
  ```

  ### Constraints
  - `1 <= rows, cols <= 200`
  - all rows have the same length `cols`
  - `0 <= heights[r][c] <= 10^6`
  - `0 <= drains.length <= rows * cols`, each `drains[i] = [row, col]` is inside the grid
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: drainable_cells
  params:
    - {name: heights, type: "int[][]"}
    - {name: drains, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def drainable_cells(heights: list[list[int]], drains: list[list[int]]) -> int:
        rows, cols = len(heights), len(heights[0])
        reached = [[False] * cols for _ in range(rows)]
        queue = deque()
        for r, c in drains:
            if not reached[r][c]:
                reached[r][c] = True
                queue.append((r, c))
        count = len(queue)
        # Walk uphill from the drains: water flows from a neighbour into this cell
        # when the neighbour is at least as high.
        while queue:
            r, c = queue.popleft()
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols and not reached[nr][nc] and heights[nr][nc] >= heights[r][c]:
                    reached[nr][nc] = True
                    count += 1
                    queue.append((nr, nc))
        return count
  javascript: |
    function drainableCells(heights, drains) {
      const rows = heights.length;
      const cols = heights[0].length;
      const reached = Array.from({ length: rows }, () => new Array(cols).fill(false));
      const queue = [];
      for (const [r, c] of drains) {
        if (!reached[r][c]) {
          reached[r][c] = true;
          queue.push([r, c]);
        }
      }
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let head = 0; head < queue.length; head++) {
        const [r, c] = queue[head];
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || reached[nr][nc]) continue;
          if (heights[nr][nc] >= heights[r][c]) {
            reached[nr][nc] = true;
            queue.push([nr, nc]);
          }
        }
      }
      return queue.length;
    }
