expected_concepts:
  - minimum spanning tree
  - Kruskal's algorithm with union-find (or Prim's algorithm with a heap)
  - detecting a disconnected graph by counting merged components
  - 64-bit accumulation of the total cost
optimal_complexity: {time: O(E log E), space: O(V + E)}
rubric:
  excellent: Recognises a minimum spanning tree, implements Kruskal with path-compressed union-find (or Prim with a heap), detects disconnection by counting merges, uses a 64-bit total, handles n = 1, and states O(E log E).
  good: Correct Kruskal or Prim with minor slips, such as the disconnected case or the n = 1 case, fixed after testing.
  weak: Greedily picks the cheapest trench at each office (which can form cycles and miss connectivity), or enumerates subsets of trenches.
  criteria:
    correctness: Returns the minimum spanning tree weight, 0 for one office and -1 when the candidates cannot connect every office.
    efficiency: Sorting plus near-constant union-find operations, or a heap-based Prim; no subset enumeration.
    code_quality: A small, clear union-find (find with path compression, union by size) and an early exit once n - 1 trenches are chosen.
    edge_cases: Parallel candidates, a single office, isolated offices, totals above 2^31.
    communication: Explains the cut property, or why skipping a trench that joins two offices already connected never hurts.
hints:
  - The cheapest set of trenches that connects every office never contains a cycle; what structure is that?
  - Consider trenches from cheapest to most expensive and keep one only if it joins two groups of offices that are not yet connected.
  - Sort the candidates by cost and use a union-find structure; add the cost of every trench that merges two different sets, count the merges, and if you end with fewer than n minus one merges return minus one.
followups:
  - When would Prim's algorithm with a heap be preferable to Kruskal's?
  - How would you report which trenches to dig, not only the total cost?
  - If one trench is already dug for free, how does the algorithm change?
  - How would you update the answer when a new candidate trench is added later?
common_errors:
  - Accumulating the total in a 32-bit integer, which overflows for large costs.
  - Returning a partial total instead of -1 when some office stays unreachable.
  - Picking the cheapest trench at each office independently, which can create cycles and miss connections.
  - Returning -1 for a single office instead of 0.
