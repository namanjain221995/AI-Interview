slug: office_network_min_trench_cost
title: Cheapest Office Network
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [network, cloud, backend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Cheapest Office Network

  A company is wiring a campus of `n` offices, numbered `0` to `n - 1`, with fibre laid in trenches. A
  survey produced a list of `candidates`, where each entry `[u, v, cost]` is a trench that could be dug
  between offices `u` and `v` for `cost`. A trench carries traffic in both directions, and the same pair
  of offices may appear in several candidates with different costs.

  Choose a set of candidate trenches so that **every office can reach every other office**, directly or
  through other offices, and the total cost of the chosen trenches is as small as possible. Return that
  **minimum total cost**.

  - A campus with a single office needs no trenches, so the answer is `0`.
  - If even digging every candidate would leave some office unreachable, return `-1`.
  - The total can exceed the range of a 32-bit integer.

  ### Example 1
  ```
  Input:  n = 4, candidates = [[0, 1, 4], [1, 2, 2], [2, 3, 5], [0, 3, 3], [0, 2, 6]]
  Output: 9
  Explanation: Dig [1, 2, 2], [0, 3, 3] and [0, 1, 4] for a total of 9; every office is connected
  ```

  ### Example 2
  ```
  Input:  n = 3, candidates = [[0, 1, 10]]
  Output: -1
  Explanation: Office 2 cannot be reached by any candidate, so the campus cannot be connected
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= candidates.length <= 5 * 10^4`
  - `candidates[i].length == 3`, `0 <= u, v < n`, `u != v`
  - `1 <= cost <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_network_cost
  params:
    - {name: n, type: "int"}
    - {name: candidates, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def min_network_cost(n: int, candidates: list[list[int]]) -> int:
        parent = list(range(n))
        size = [1] * n

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        total = 0
        joined = 1
        for u, v, cost in sorted(candidates, key=lambda trench: trench[2]):
            ru, rv = find(u), find(v)
            if ru == rv:
                continue
            if size[ru] < size[rv]:
                ru, rv = rv, ru
            parent[rv] = ru
            size[ru] += size[rv]
            total += cost
            joined += 1
            if joined == n:
                break
        return total if joined == n else -1
  javascript: |
    function minNetworkCost(n, candidates) {
      const parent = Array.from({ length: n }, (_, i) => i);
      const size = new Array(n).fill(1);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const sorted = [...candidates].sort((a, b) => a[2] - b[2]);
      let total = 0; // stays exact: at most 10^4 * 10^9 < 2^53
      let joined = 1;
      for (const [u, v, cost] of sorted) {
        if (joined === n) break;
        let ru = find(u);
        let rv = find(v);
        if (ru === rv) continue;
        if (size[ru] < size[rv]) [ru, rv] = [rv, ru];
        parent[rv] = ru;
        size[ru] += size[rv];
        total += cost;
        joined += 1;
      }
      return joined === n ? total : -1;
    }
