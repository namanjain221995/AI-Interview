version: 1
slug: router_hop_counts
title: Hop Counts from the Gateway
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [network, sre, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Hop Counts from the Gateway

  A branch office network has `n` routers numbered `0` to `n - 1`. Each entry `[a, b]` of `links` is a
  physical link between router `a` and router `b` that carries traffic in both directions. Links may be
  listed more than once, and a link from a router to itself may appear (it never helps).

  For capacity planning, the network team needs the **hop count** of every router: the minimum number
  of links a packet must cross to travel from the router `gateway` to that router.

  Return an array `hops` of length `n` where:

  - `hops[gateway] == 0`;
  - `hops[i]` is the minimum number of links between `gateway` and router `i`;
  - `hops[i] == -1` if router `i` cannot be reached from `gateway`.

  ### Example 1
  ```
  Input:  n = 6, links = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 4]], gateway = 0
  Output: [0, 1, 1, 2, 3, -1]
  Explanation: Router 5 has no links, so it is unreachable.
  ```

  ### Example 2
  ```
  Input:  n = 3, links = [], gateway = 1
  Output: [-1, 0, -1]
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 2 * 10^4`
  - `links[i].length == 2` and `0 <= a, b < n`
  - `0 <= gateway < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: hop_counts
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: gateway, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def hop_counts(n: int, links: list[list[int]], gateway: int) -> list[int]:
        neighbours: list[list[int]] = [[] for _ in range(n)]
        for a, b in links:
            neighbours[a].append(b)
            neighbours[b].append(a)
        hops = [-1] * n
        hops[gateway] = 0
        queue = deque([gateway])
        while queue:
            router = queue.popleft()
            for nxt in neighbours[router]:
                if hops[nxt] == -1:
                    hops[nxt] = hops[router] + 1
                    queue.append(nxt)
        return hops
  javascript: |
    function hopCounts(n, links, gateway) {
      const neighbours = Array.from({ length: n }, () => []);
      for (const [a, b] of links) {
        neighbours[a].push(b);
        neighbours[b].push(a);
      }
      const hops = new Array(n).fill(-1);
      hops[gateway] = 0;
      const queue = [gateway];
      for (let head = 0; head < queue.length; head++) {
        const router = queue[head];
        for (const next of neighbours[router]) {
          if (hops[next] === -1) {
            hops[next] = hops[router] + 1;
            queue.push(next);
          }
        }
      }
      return hops;
    }
