expected_concepts:
  - "breadth-first search for unweighted shortest paths"
  - "undirected adjacency list (add both directions)"
  - "single-source distances for every node"
  - "-1 for nodes in other components"
optimal_complexity: {time: "O(n + m)", space: "O(n + m)"}
rubric:
  excellent: "Builds an undirected adjacency list, runs a single BFS from the gateway filling a distance array initialised to -1 (which doubles as the visited marker), and explains why BFS order yields minimum hop counts in O(n + m)."
  good: "Correct BFS with a separate visited set or a slightly wasteful queue, with the right complexity."
  weak: "Uses DFS distances, runs a separate search per router, adds only one direction of each link, or leaves unreachable routers at 0."
  criteria:
    correctness: "All tests pass, including rings where DFS overestimates and disconnected routers."
    efficiency: "One BFS over all routers and links; no per-router searches."
    code_quality: "Clear adjacency construction and a distance array used as the visited flag."
    edge_cases: "Single router, no links, self-links, duplicate links, gateway not at index 0."
    communication: "Explains why the first time a router is reached is via a shortest route."
hints:
  - "Every link costs one hop, so think about how a packet spreading from the gateway reaches routers in waves."
  - "Explore from the gateway in order of distance: first its direct neighbours, then their unseen neighbours, and so on, recording the wave number for each router."
  - "Build a neighbour list with both directions of every link, set every hop count to -1 except the gateway at 0, then run a queue: pop a router and give each neighbour still at -1 the router's count plus one before pushing it."
followups:
  - "How would you also report one shortest route from the gateway to each router?"
  - "If links had different latencies, which algorithm would replace BFS?"
  - "How would you compute hop counts from the nearest of several gateways in one pass?"
  - "When a single new link is added, how could you update the hop counts without starting over?"
common_errors:
  - "Adding each link in only one direction."
  - "Using DFS and recording the first depth at which a router is found."
  - "Marking routers visited when dequeued, so a router can get a larger count first."
  - "Leaving unreachable routers at 0 instead of -1."
