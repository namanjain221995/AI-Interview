slug: mutually_reachable_services
title: Mutually Reachable Services
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, sre, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Mutually Reachable Services

  An SRE team is mapping the call graph of `n` microservices with ids `0` to `n - 1`. Each entry
  `[from, to]` in `edges` means service `from` sends requests to service `to`. Calls are
  **directed**: `[a, b]` does not mean that `b` calls `a`.

  Service `v` can **reach** service `w` when there is a chain of zero or more calls leading from `v`
  to `w`; every service can reach itself.

  A change to service `x` is risky for every service that sits in a feedback loop with it. Return,
  in **ascending** order, every service `v` such that `x` can reach `v` **and** `v` can reach `x`.
  The result always contains `x` itself.

  ### Example 1
  ```
  Input:  n = 5, edges = [[0, 1], [1, 2], [2, 0], [2, 3], [3, 4]], x = 1
  Output: [0, 1, 2]
  Explanation: Services 0, 1 and 2 form a loop; 3 and 4 are reachable from 1 but cannot call back.
  ```

  ### Example 2
  ```
  Input:  n = 4, edges = [[0, 1], [1, 2], [2, 3]], x = 2
  Output: [2]
  Explanation: Service 2 reaches 3 and is reached from 0 and 1, but no service does both.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= edges.length <= 5 * 10^4`
  - `edges[i].length == 2` and `0 <= edges[i][0], edges[i][1] < n`
  - Edges may repeat and a service may call itself.
  - `0 <= x < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: mutual_group
  params:
    - {name: n, type: "int"}
