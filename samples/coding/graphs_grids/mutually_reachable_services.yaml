    - {name: x, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def mutual_group(n: int, edges: list[list[int]], x: int) -> list[int]:
        forward = [[] for _ in range(n)]
        backward = [[] for _ in range(n)]
        for a, b in edges:
            forward[a].append(b)
            backward[b].append(a)

        def reachable(adjacency: list[list[int]]) -> list[bool]:
            seen = [False] * n
            seen[x] = True
            queue = deque([x])
            while queue:
                node = queue.popleft()
                for nxt in adjacency[node]:
                    if not seen[nxt]:
                        seen[nxt] = True
                        queue.append(nxt)
            return seen

        downstream = reachable(forward)
        upstream = reachable(backward)
        return [v for v in range(n) if downstream[v] and upstream[v]]
  javascript: |
    function mutualGroup(n, edges, x) {
      const forward = Array.from({ length: n }, () => []);
      const backward = Array.from({ length: n }, () => []);
      for (const [a, b] of edges) {
        forward[a].push(b);
        backward[b].push(a);
      }
      const reachable = (adjacency) => {
        const seen = new Array(n).fill(false);
        seen[x] = true;
        const stack = [x];
        while (stack.length > 0) {
          const node = stack.pop();
          for (const next of adjacency[node]) {
            if (!seen[next]) {
              seen[next] = true;
              stack.push(next);
            }
          }
        }
        return seen;
      };
      const down = reachable(forward);
      const up = reachable(backward);
      const result = [];
      for (let v = 0; v < n; v++) if (down[v] && up[v]) result.push(v);
      return result;
    }
