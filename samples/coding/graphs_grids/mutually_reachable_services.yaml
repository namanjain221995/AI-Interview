expected_concepts:
  - "graph reachability with breadth-first or depth-first search"
  - "reversing the edges to answer who can reach x"
  - "intersection of forward and backward reachable sets"
  - "strongly connected component containing a node"
optimal_complexity: {time: "O(n + E)", space: "O(n + E)"}
rubric:
  excellent: "Recognises that the answer is the strongly connected component of x, computes it with one search on the call graph and one on the reversed graph, intersects the results and returns them sorted in linear time."
  good: "Correct forward and backward searches, possibly after first trying a per-service search and then improving it with a prompt."
  weak: "Runs a separate search from every service to test whether it reaches x (quadratic), or treats the calls as undirected."
  criteria:
    correctness: "All tests pass, including one-way joins between loops, self-calls and repeated edges."
    efficiency: "Two linear traversals instead of one traversal per service."
    code_quality: "One reusable traversal helper applied to both adjacency lists."
    edge_cases: "No edges, self-calls, repeated edges and a single cycle covering every service."
    communication: "Explains why reversing the edges answers the question of who can reach x."
hints:
  - "Split the condition into two questions: which services x can reach, and which services can reach x."
  - "The first question is a plain graph search from x; the second becomes the same kind of search if you flip the direction of every call."
  - "Build adjacency lists for the call graph and for its reverse, run a breadth-first or depth-first search from x on each to get two boolean arrays, then scan ids from zero upwards and keep the services marked in both, which yields the answer already in ascending order."
followups:
  - "How would you find all such groups for every service at once?"
  - "What does this group represent in graph theory terms?"
  - "How would you answer many queries for different x efficiently?"
  - "How would you decide whether the whole call graph contains any loop at all?"
common_errors:
  - "Treating the calls as undirected and returning the whole connected component."
  - "Running a search from every service to test reachability of x, which is quadratic."
  - "Forgetting that x is always part of the result."
  - "Using deep recursion that can overflow on a long chain of calls."
