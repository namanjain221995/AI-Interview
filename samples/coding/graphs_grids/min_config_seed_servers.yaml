slug: min_config_seed_servers
title: "Minimum Config Seed Servers"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [platform, sre, devops, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Minimum Config Seed Servers

  A platform team distributes a new configuration bundle across `n` servers with ids `0` to `n - 1`.
  Servers replicate to each other over one-way channels: `links` contains pairs `[from, to]`, meaning
  that as soon as server `from` holds the bundle it pushes a copy to server `to`. Propagation repeats,
  so the bundle keeps flowing along chains of channels, and channels may form loops. The same pair
  can appear more than once.

  The release tool can upload the bundle directly to a chosen set of **seed** servers; everything
  else must receive it through replication. Return the **minimum number of seed servers** needed so
  that every server eventually holds the bundle.

  ### Example 1
  ```
  Input:  n = 5, links = [[0, 1], [1, 2], [2, 0], [3, 4]]
  Output: 2
  Explanation: Seeding any one of 0, 1 or 2 covers that loop; server 3 must be seeded
               to reach 3 and 4.
  ```

  ### Example 2
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 3], [3, 1]]
  Output: 1
  Explanation: Seeding server 0 reaches 1, then 2 and 3 through the loop.
  ```

  ### Example 3
  ```
  Input:  n = 3, links = []
  Output: 3
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 3 * 10^4`
  - `links[i].length == 2`, `0 <= from, to < n` and `from != to`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_seed_servers
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_seed_servers(n: int, links: list[list[int]]) -> int:
        out_edges: list[list[int]] = [[] for _ in range(n)]
        in_edges: list[list[int]] = [[] for _ in range(n)]
        for a, b in links:
            out_edges[a].append(b)
            in_edges[b].append(a)
        # pass 1: iterative depth-first search, record servers by finish time
        visited = [False] * n
        finished: list[int] = []
        for start in range(n):
            if visited[start]:
                continue
            visited[start] = True
            stack = [(start, 0)]
            while stack:
                server, index = stack[-1]
                if index < len(out_edges[server]):
                    stack[-1] = (server, index + 1)
                    nxt = out_edges[server][index]
                    if not visited[nxt]:
                        visited[nxt] = True
                        stack.append((nxt, 0))
                else:
                    stack.pop()
                    finished.append(server)
        # pass 2: on reversed channels, in decreasing finish time, label each loop group (SCC)
        group = [-1] * n
        groups = 0
        for start in reversed(finished):
            if group[start] != -1:
                continue
            group[start] = groups
            todo = [start]
            while todo:
                server = todo.pop()
                for prev in in_edges[server]:
                    if group[prev] == -1:
                        group[prev] = groups
                        todo.append(prev)
            groups += 1
        # a group needs a seed exactly when no channel enters it from another group
        fed = [False] * groups
        for a, b in links:
            if group[a] != group[b]:
                fed[group[b]] = True
        return fed.count(False)
  javascript: |
    function minSeedServers(n, links) {
      const outEdges = Array.from({ length: n }, () => []);
      const inEdges = Array.from({ length: n }, () => []);
      for (const [a, b] of links) {
        outEdges[a].push(b);
        inEdges[b].push(a);
      }
      const visited = new Array(n).fill(false);
      const finished = [];
      for (let start = 0; start < n; start++) {
        if (visited[start]) continue;
        visited[start] = true;
        const stack = [[start, 0]];
        while (stack.length > 0) {
          const top = stack[stack.length - 1];
          const server = top[0];
          if (top[1] < outEdges[server].length) {
            const next = outEdges[server][top[1]++];
            if (!visited[next]) {
              visited[next] = true;
              stack.push([next, 0]);
            }
          } else {
            stack.pop();
            finished.push(server);
          }
        }
      }
      const group = new Array(n).fill(-1);
      let groups = 0;
      for (let i = finished.length - 1; i >= 0; i--) {
        const start = finished[i];
        if (group[start] !== -1) continue;
        group[start] = groups;
        const todo = [start];
        while (todo.length > 0) {
          const server = todo.pop();
          for (const prev of inEdges[server]) {
            if (group[prev] === -1) {
              group[prev] = groups;
              todo.push(prev);
            }
          }
        }
        groups++;
      }
      const fed = new Array(groups).fill(false);
      for (const [a, b] of links) {
        if (group[a] !== group[b]) fed[group[b]] = true;
      }
      return fed.filter((x) => !x).length;
    }
