expected_concepts:
  - "strongly connected components (Kosaraju or Tarjan)"
  - "condensation of a directed graph into a DAG of components"
  - "components with no incoming edge from another component must be seeded"
  - "why counting servers with in-degree zero is wrong when loops exist"
  - "iterative depth-first search for large graphs"
optimal_complexity: {time: "O(n + e)", space: "O(n + e)"}
rubric:
  excellent: "Shows why counting zero in-degree servers fails for a loop with no outside input, collapses loops into strongly connected components, argues that exactly the components with no incoming channel from another component need one seed each (and that one seed suffices for each), and implements an iterative linear-time SCC algorithm."
  good: "Reaches the SCC idea and the source-component count with some prompting, or uses a correct but recursive SCC implementation and notes the depth risk."
  weak: "Counts only servers with in-degree zero, greedily seeds and floods without handling loops, or tries every subset of seeds."
  criteria:
    correctness: "All tests pass, including isolated loops, chains of loops and duplicate channels."
    efficiency: "Linear in servers plus channels; no repeated flooding from every server."
    code_quality: "SCC labelling and the final counting step are separated and clearly named."
    edge_cases: "Handles no channels, a single server, duplicate pairs and a loop fed from outside."
    communication: "Gives both directions of the argument: every source component needs a seed, and seeding one server per source component reaches everything."
hints:
  - "A server with no incoming channel clearly must be seeded, but that is not the whole story. What happens with a loop of servers that nothing outside the loop feeds?"
  - "Inside a group of servers that can all reach each other, one seed is enough for the whole group. Collapse each such group into a single node and look at the resulting graph, which has no loops."
  - "Compute strongly connected components with an iterative Kosaraju or Tarjan pass, then mark every component that receives a channel from a different component. The answer is the number of unmarked components, because each needs its own seed and seeding one server in each reaches everything downstream."
followups:
  - "How would you return an actual set of seed servers, choosing the lowest id in each group?"
  - "What is the minimum number of new channels needed so that seeding any single server reaches everyone?"
  - "If each server had an upload cost, how would you pick the cheapest seeds?"
  - "How would you keep the answer current as channels are added during a rollout?"
common_errors:
  - "Returning the number of servers with no incoming channel, which is 0 for an isolated loop that still needs a seed."
  - "Seeding greedily in id order and flooding, which can seed a downstream server before its upstream source."
  - "Counting components with no outgoing edge instead of no incoming edge."
  - "Recursing over a chain of 10^4 servers and exceeding the recursion limit."
