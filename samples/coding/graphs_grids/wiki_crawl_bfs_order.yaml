expected_concepts:
  - "breadth-first search with a FIFO queue"
  - "adjacency lists built from an edge list"
  - "sorting each page's outgoing links for deterministic order"
  - "marking pages when queued so they are never queued twice"
optimal_complexity: {time: "O(n + L log L)", space: "O(n + L)"}
rubric:
  excellent: "Builds adjacency lists, sorts each list once, runs a queue-based breadth-first search that marks pages when they are queued, ignores self-links and repeats naturally, and explains the sorting cost in the complexity."
  good: "Correct breadth-first search with sorted neighbours, possibly marking pages on visit and then fixing duplicates in the output after a test fails."
  weak: "Uses depth-first order, does not sort neighbours, or re-scans the full link list for every page without discussing the cost."
  criteria:
    correctness: "All tests pass, including repeated links, self-links, cycles back to the start and unreachable pages."
    efficiency: "Linear in pages plus links apart from sorting each neighbour list once."
    code_quality: "Clear separation between building the graph and traversing it; an efficient queue (deque or head index) instead of shifting an array."
    edge_cases: "A start page with no links, a one-page wiki, repeated links and a self-link."
    communication: "Explains why marking on enqueue prevents duplicates and why breadth-first order differs from depth-first order here."
hints:
  - "This is a level-by-level exploration; think about which data structure gives you first-in first-out order."
  - "Group the links by source page first and sort each group once, so that visiting a page lets you scan its targets in ascending order without touching the rest of the list."
  - "Keep a boolean per page that is set when the page enters the queue, seed the queue with the start page, and each time you take a page from the front append it to the answer and enqueue every sorted target whose flag is still unset, setting the flag as you go."
followups:
  - "How would you also return the click distance of each page from the start?"
  - "What would change if the crawler had to stop after a maximum depth?"
  - "How would you crawl when the link graph is too large to fit in memory?"
  - "How does the order change if you switch the queue for a stack?"
common_errors:
  - "Marking pages only when they are visited, so a page reachable from two queued parents is output twice."
  - "Forgetting to sort neighbours and returning links in input order."
  - "Using a recursive depth-first traversal and producing the wrong order."
  - "Using array shift in a loop, which makes the queue quadratic on large inputs."
