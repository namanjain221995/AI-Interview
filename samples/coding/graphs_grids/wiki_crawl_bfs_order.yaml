title: Internal Wiki Crawl Order
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [backend, data, general, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Internal Wiki Crawl Order

  The search team is rebuilding the index of the company wiki. The wiki has `n` pages with ids `0` to
  `n - 1`, and each entry `[from, to]` in `links` is a **one-way** hyperlink on page `from` that
  points to page `to`.

  The crawler works breadth-first from page `start`, using a first-in first-out queue:

  1. Page `start` is put in the queue.
  2. Repeatedly take the page at the front of the queue and **visit** it (append it to the output).
  3. When a page is visited, look at the pages it links to in **ascending id order** and append each
     one to the back of the queue unless it has already been queued or visited before.

  Return the list of pages in the order they are visited. Pages that cannot be reached from `start`
  do not appear. Links may be listed in any order, a link may be repeated, and a page may link to
  itself.

  ### Example 1
  ```
  Input:  n = 6, links = [[0, 2], [0, 1], [1, 3], [2, 3], [2, 4], [3, 5]], start = 0
  Output: [0, 1, 2, 3, 4, 5]
  Explanation: Page 0 queues 1 then 2; page 1 queues 3; page 2 queues only 4 because 3 is already queued; page 3 queues 5.
  ```

  ### Example 2
  ```
  Input:  n = 5, links = [[3, 1], [3, 0], [1, 4], [0, 2], [4, 3]], start = 3
  Output: [3, 0, 1, 2, 4]
  Explanation: Page 3 links to 0 and 1, visited in ascending order; their children 2 and 4 follow in queue order.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 5 * 10^4`
  - `links[i].length == 2` and `0 <= links[i][0], links[i][1] < n`
  - `0 <= start < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: crawl_order
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: start, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def crawl_order(n: int, links: list[list[int]], start: int) -> list[int]:
        outgoing = [[] for _ in range(n)]
        for source, target in links:
            outgoing[source].append(target)
        for targets in outgoing:
            targets.sort()
        queued = [False] * n
        queued[start] = True
        queue = deque([start])
        order = []
        while queue:
            page = queue.popleft()
            order.append(page)
            for target in outgoing[page]:
                if not queued[target]:
                    queued[target] = True
                    queue.append(target)
        return order
  javascript: |
    function crawlOrder(n, links, start) {
      const outgoing = Array.from({ length: n }, () => []);
      for (const [source, target] of links) outgoing[source].push(target);
      for (const targets of outgoing) targets.sort((a, b) => a - b);
      const queued = new Array(n).fill(false);
      queued[start] = true;
      const queue = [start];
      for (let head = 0; head < queue.length; head++) {
        const page = queue[head];
        for (const target of outgoing[page]) {
          if (!queued[target]) {
            queued[target] = true;
            queue.push(target);
          }
        }
      }
      return queue;
    }
