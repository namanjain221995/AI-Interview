expected_concepts:
  - "functional graph (out-degree at most one)"
  - "walk with per-walk timestamps or colours to find where a walk revisits itself"
  - "distinguishing a revisit within the current walk from reaching an earlier walk's mailbox"
  - "each mailbox visited once overall: O(n) time"
  - "alternatively peel tails with in-degree counting, then measure remaining loops"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Recognises the functional-graph structure, walks each unvisited mailbox once with global step numbers (or colours plus per-walk positions), measures loop length from the first revisit inside the current walk, ignores mailboxes reached from earlier walks, and states O(n) time and space."
  good: "Correct linear or near-linear solution after a prompt about tails or about mailboxes already visited in earlier walks."
  weak: "Restarts a full walk from every mailbox in O(n^2), counts tail mailboxes in the loop length, treats any already-visited mailbox as a loop, or misses self-loops."
  criteria:
    correctness: "All tests pass, including self-loops, tails into loops and later walks that end at earlier visited mailboxes."
    efficiency: "Every mailbox is stepped on once across all walks."
    code_quality: "Clear bookkeeping of the step counter and the start of the current walk."
    edge_cases: "A single mailbox, no loops, self-loops, several loops of different sizes."
    communication: "Explains why reaching a mailbox visited in an earlier walk cannot reveal a new loop."
hints:
  - "Every mailbox has at most one outgoing forward, so following forwards from any mailbox traces a single path that either stops or eventually repeats."
  - "Walk from each mailbox you have not seen yet and remember when you reached each mailbox; a repeat that happens within the same walk reveals a loop whose length follows from those times."
  - "Keep one global step counter and record the step at which each mailbox is first reached. For each unvisited start, note the counter value where this walk began, follow forwards while the mailbox is unvisited, and when you stop on a mailbox that was reached during this same walk, its loop length is the current step minus that mailbox's step plus one. Keep the maximum, or -1 if no walk found a loop."
followups:
  - "How would you list the mailboxes of the longest loop rather than just its length?"
  - "How would you report, for every mailbox, which loop its mail ends up in (if any)?"
  - "How would you solve it with Floyd's tortoise-and-hare idea, and what extra memory does that save?"
  - "How would you keep the answer current when one mailbox changes its forward target?"
common_errors:
  - "Treating a mailbox visited during an earlier walk as the start of a new loop."
  - "Counting the tail mailboxes that lead into a loop as part of the loop."
  - "Restarting from every mailbox without sharing visited state, giving quadratic time."
  - "Returning 0 instead of -1 when no loop exists."
  - "Forgetting that a mailbox forwarding to itself is a loop of length 1."
