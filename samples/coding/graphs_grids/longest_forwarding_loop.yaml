slug: longest_forwarding_loop
title: "Longest Forwarding Loop"
difficulty: medium
competency_keys: [algorithms, data_structures, debugging]
role_tags: [backend, sre, support_engineer, network]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Forwarding Loop

  A mail platform has `n` mailboxes numbered `0` to `n - 1`. Each mailbox can auto-forward to **at most
  one** other mailbox: `forwards[i]` is the mailbox that mailbox `i` forwards to, or `-1` if mailbox `i`
  keeps its mail.

  A misconfiguration can make messages bounce around forever. A **forwarding loop** is a sequence of
  distinct mailboxes `m1, m2, ..., mk` where each forwards to the next and `mk` forwards back to `m1`. A
  mailbox that forwards to itself is a loop of length `1`. Mailboxes that only lead *into* a loop are not
  part of it.

  Support wants to fix the worst loop first. Return the number of mailboxes in the **longest** forwarding
  loop, or `-1` if there is no loop at all.

  ### Example 1
  ```
  Input:  forwards = [1, 2, 0, 4, -1]
  Output: 3
  Explanation: 0 -> 1 -> 2 -> 0 is a loop of 3. Mailbox 3 forwards to 4, which keeps its mail.
  ```

  ### Example 2
  ```
  Input:  forwards = [-1, 0, 1]
  Output: -1
  ```

  ### Example 3
  ```
  Input:  forwards = [3, 3, 1, 1]
  Output: 2
  Explanation: Mailboxes 1 and 3 forward to each other. Mailboxes 0 and 2 lead into that loop but are not part of it.
  ```

  ### Constraints
  - `1 <= forwards.length <= 10^5`
  - `forwards[i] == -1` or `0 <= forwards[i] < forwards.length`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_forwarding_loop
  params:
    - {name: forwards, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_forwarding_loop(forwards: list[int]) -> int:
        n = len(forwards)
        # visited_at[i] is the global step at which mailbox i was first reached (0 = never).
        visited_at = [0] * n
        step = 0
        best = -1
        for start in range(n):
            if visited_at[start]:
                continue
            walk_start = step + 1
            node = start
            while node != -1 and not visited_at[node]:
                step += 1
                visited_at[node] = step
                node = forwards[node]
            # A loop is found only if this walk ran into a mailbox it visited itself.
            if node != -1 and visited_at[node] >= walk_start:
                best = max(best, step - visited_at[node] + 1)
        return best
  javascript: |
    function longestForwardingLoop(forwards) {
      const n = forwards.length;
      const visitedAt = new Array(n).fill(0);
      let step = 0;
      let best = -1;
      for (let start = 0; start < n; start++) {
        if (visitedAt[start]) continue;
        const walkStart = step + 1;
        let node = start;
        while (node !== -1 && !visitedAt[node]) {
          step += 1;
          visitedAt[node] = step;
          node = forwards[node];
        }
        if (node !== -1 && visitedAt[node] >= walkStart) {
          best = Math.max(best, step - visitedAt[node] + 1);
        }
      }
      return best;
    }
