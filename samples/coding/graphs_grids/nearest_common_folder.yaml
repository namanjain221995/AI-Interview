slug: nearest_common_folder
title: "Nearest Common Folder"
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [general, backend, fullstack, frontend]
time_limit_minutes: 15
prompt_markdown: |
  ## Nearest Common Folder

  A document management system lets users share a folder with a teammate, and sharing a folder also
  shares everything inside it. When someone wants to share two items `a` and `b` at once, the system
  should suggest the **narrowest** single folder that covers both.

  There are `n` folders with ids `0` to `n - 1`. `parent[i]` is the folder that directly contains
  folder `i`; the one top-level folder has `parent[i] == -1`, and the folders form a single tree.
  Ids carry no ordering meaning: a parent can have a larger id than its child.

  A folder **contains** itself and every folder nested below it at any depth. Return the id of the
  **deepest** folder that contains both `a` and `b`. In particular, if `a` contains `b` the answer is
  `a`, and if `a == b` the answer is `a`.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], a = 3, b = 4
  Output: 1
  Explanation: Folders 3 and 4 are both directly inside folder 1.
  ```

  ### Example 2
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], a = 3, b = 5
  Output: 0
  Explanation: 3 is under 1 and 5 is under 2; only folder 0 contains both.
  ```

  ### Example 3
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], a = 1, b = 4
  Output: 1
  Explanation: Folder 1 contains folder 4 and counts as containing itself.
  ```

  ### Constraints
  - `1 <= parent.length <= 10^5`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]`
  - Following parents from any folder reaches the top-level folder (no loops)
  - `0 <= a, b < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nearest_common_folder
  params:
    - {name: parent, type: "int[]"}
    - {name: a, type: "int"}
    - {name: b, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def nearest_common_folder(parent: list[int], a: int, b: int) -> int:
        covers_a: set[int] = set()
        node = a
        while node != -1:
            covers_a.add(node)
            node = parent[node]
        node = b
        while node not in covers_a:
            node = parent[node]
        return node
  javascript: |
    function nearestCommonFolder(parent, a, b) {
      const coversA = new Set();
      for (let node = a; node !== -1; node = parent[node]) coversA.add(node);
      let node = b;
      while (!coversA.has(node)) node = parent[node];
      return node;
    }
