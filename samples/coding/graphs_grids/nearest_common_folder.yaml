expected_concepts:
  - "walking up a parent array to collect ancestors"
  - "lowest common ancestor in a rooted tree"
  - "a node is its own ancestor (inclusive containment)"
  - "depth equalisation or ancestor set as alternative techniques"
optimal_complexity: {time: "O(h)", space: "O(h)"}
rubric:
  excellent: "Collects the ancestors of a (including a) by following parents, then walks up from b until it hits that set, or equalises depths and climbs in lockstep for O(1) extra space; explains O(h) and mentions binary lifting for many queries."
  good: "Correct ancestor-walk solution after fixing the inclusive case (a contains b) or the root case."
  weak: "Builds the whole tree and runs a recursive search from the root without need, ignores the case where one folder contains the other, or assumes parents have smaller ids."
  criteria:
    correctness: "All tests pass, including a == b, one folder containing the other and the root as an input."
    efficiency: "Proportional to the depth of the two folders; no need to build child lists or scan all n folders."
    code_quality: "Short loops with clear names; no recursion that could overflow on a deep chain."
    edge_cases: "Handles a single folder, identical inputs, the root as input and deep chains."
    communication: "Explains why the first shared ancestor reached from b is the deepest one."
hints:
  - "From any folder you can follow parent links all the way to the top; what do the two upward paths from a and b have in common?"
  - "Record every folder on the path from a to the top (a included), then follow the path upward from b."
  - "Put a and all of its ancestors into a set, then start at b and move to its parent until the current folder is in the set; that folder is the answer, which covers the case where a or b contains the other."
followups:
  - "How would you solve it with O(1) extra memory?"
  - "If the system must answer 10^5 such queries on the same tree, what would you precompute?"
  - "How would you find the narrowest folder covering a list of k items instead of two?"
  - "What would you return if the export could contain two separate trees?"
common_errors:
  - "Starting the ancestor walk from the parent of a, which misses the case where a contains b."
  - "Assuming a parent's id is smaller than its child's id."
  - "Returning the top-level folder whenever the folders are in different subtrees of a child, instead of the first shared ancestor."
  - "Using recursion on a deep chain and hitting the stack limit."
