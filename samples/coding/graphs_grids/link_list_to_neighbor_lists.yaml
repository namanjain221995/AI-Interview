  - {id: t2, args: [3, [[2, 1], [1, 2], [0, 0], [1, 0]]], expected: [[1], [0, 2], [1]], description: "Example 2 - duplicate in reverse orientation and a self-link"}
  - {id: t3, hidden: true, args: [1, []], expected: [[]], description: "Single node with no links"}
  - {id: t4, hidden: true, args: [3, []], expected: [[], [], []], description: "No links: every list is empty but there are still n lists"}
  - {id: t5, hidden: true, args: [3, [[1, 1], [2, 2], [1, 1]]], expected: [[], [], []], description: "Only self-links, all ignored"}
  - {id: t6, hidden: true, args: [6, [[5, 0], [5, 3], [5, 1], [5, 4], [5, 2]]], expected: [[5], [5], [5], [5], [5], [0, 1, 2, 3, 4]], description: "Star around the highest id; centre list must be sorted, not insertion order"}
  - {id: t7, hidden: true, args: [4, [[0, 3], [3, 0], [0, 3], [3, 0], [0, 3]]], expected: [[3], [], [], [0]], description: "One link reported five times"}
  - {id: t8, hidden: true, args: [10, [[9, 8], [7, 6], [8, 7], [9, 0], [0, 9], [4, 4], [2, 5], [5, 2], [1, 9]]], expected: [[9], [9], [5], [], [], [2], [7], [6, 8], [7, 9], [0, 1, 8]], description: "Mixed noise across several components"}
