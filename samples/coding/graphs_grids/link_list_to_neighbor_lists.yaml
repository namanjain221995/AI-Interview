version: 1
slug: link_list_to_neighbor_lists
title: "Edge List to Neighbour Lists"
difficulty: easy
competency_keys: [data_structures, code_quality]
role_tags: [general, backend, frontend, data]
time_limit_minutes: 12
prompt_markdown: |
  ## Edge List to Neighbour Lists

  A topology dashboard draws a network of `n` nodes with ids `0` to `n - 1`. The discovery agent
  exports what it saw as a raw list of undirected links: `[a, b]` means nodes `a` and `b` are
  directly connected. The export is noisy:

  - the same link may be reported several times, in either orientation (`[a, b]` and `[b, a]`);
  - a node may report a link to itself (`[a, a]`), which the dashboard ignores.

  The dashboard needs a clean **neighbour list** per node. Return an array of exactly `n` lists where
  list `i` contains every node directly connected to node `i`, **each once**, **in ascending order**,
  never including `i` itself. A node with no neighbours gets an empty list.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 0]]
  Output: [[1, 2], [0, 2], [0, 1], []]
  Explanation: Node 3 has no links, so its list is empty.
  ```

  ### Example 2
  ```
  Input:  n = 3, links = [[2, 1], [1, 2], [0, 0], [1, 0]]
  Output: [[1], [0, 2], [1]]
  Explanation: [2, 1] and [1, 2] are the same link; [0, 0] is ignored.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 5 * 10^4`
  - `links[i].length == 2` and `0 <= a, b < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: neighbor_lists
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def neighbor_lists(n: int, links: list[list[int]]) -> list[list[int]]:
        neighbours: list[set[int]] = [set() for _ in range(n)]
        for a, b in links:
            if a == b:
                continue
            neighbours[a].add(b)
            neighbours[b].add(a)
        return [sorted(group) for group in neighbours]
  javascript: |
    function neighborLists(n, links) {
      const neighbours = Array.from({ length: n }, () => new Set());
      for (const [a, b] of links) {
        if (a === b) continue;
        neighbours[a].add(b);
        neighbours[b].add(a);
      }
      return neighbours.map((group) => [...group].sort((x, y) => x - y));
    }
