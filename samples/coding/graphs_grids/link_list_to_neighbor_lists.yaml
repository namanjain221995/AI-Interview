expected_concepts:
  - "adjacency list representation of an undirected graph"
  - "adding each undirected edge in both directions"
  - "de-duplication with a set (or sort and skip equal neighbours)"
  - "deterministic ordering of each neighbour list"
optimal_complexity: {time: "O(n + e log e)", space: "O(n + e)"}
rubric:
  excellent: "Allocates n containers up front, adds each non-self link in both directions, de-duplicates with sets (or sorts and skips repeats), sorts every list, and explains the cost of sorting versus a set-based approach."
  good: "Correct output after a small fix such as skipping self-links, adding the reverse direction or returning lists for isolated nodes."
  weak: "Adds links in only one direction, leaves duplicates, scans the whole link list once per node in O(n * e), or returns fewer than n lists."
  criteria:
    correctness: "All tests pass, including reversed duplicates, self-links and isolated nodes."
    efficiency: "One pass over the links plus per-list sorting; no per-node rescans of the input."
    code_quality: "Readable names, no mutation of the input, and a clear separation between building and normalising the lists."
    edge_cases: "Handles empty input, nodes without links, only self-links and heavy repetition."
    communication: "Explains why undirected links must be stored on both endpoints and how duplicates are removed."
hints:
  - "Each node needs its own collection of neighbours, even nodes that never appear in a link."
  - "An undirected link belongs to both of its endpoints, and a container that ignores repeats removes the duplicate reports for you."
  - "Create n empty sets, skip any link whose endpoints are equal, add b to a's set and a to b's set for every other link, then turn each set into a sorted list."
followups:
  - "When would an adjacency matrix be a better choice than adjacency lists, and what would it cost here?"
  - "How would you also return how many times each link was reported?"
  - "How would you produce a compressed representation (one flat array plus offsets) for a graph with millions of links?"
  - "If node ids were arbitrary strings instead of 0 to n - 1, what would change?"
common_errors:
  - "Adding only a to b and forgetting b to a."
  - "Keeping self-links or duplicate neighbours."
  - "Returning only the nodes that appear in links, so isolated nodes are missing."
  - "Sorting numbers as strings in JavaScript, which places 10 before 9."
