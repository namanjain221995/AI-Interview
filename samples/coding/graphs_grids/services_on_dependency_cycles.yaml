expected_concepts:
  - "strongly connected components (Tarjan or Kosaraju)"
  - "a vertex is on a cycle iff its SCC has 2+ vertices or it has a self-loop"
  - "why topological trimming of sources and sinks is not enough"
  - "iterative DFS or awareness of recursion depth"
  - "linear O(n + e) graph traversal"
optimal_complexity: {time: "O(n + e)", space: "O(n + e)"}
rubric:
  excellent: "Identifies that the answer is every vertex in a strongly connected component of size two or more plus self-loops, implements Tarjan or Kosaraju correctly in O(n + e), handles duplicates and isolated services, and discusses recursion depth on long chains."
  good: "Correct SCC-based solution after a hint, or a correct per-component approach with minor issues such as forgetting self-dependencies at first."
  weak: "Runs a search from every service (O(n * (n + e))), trims in-degree and out-degree zero services and returns the remainder, or only detects whether any cycle exists."
  criteria:
    correctness: "All tests pass, including the bridge between two loops, self-dependencies and repeated pairs."
    efficiency: "Linear in services plus pairs; no per-service full search."
    code_quality: "Clear separation between graph building, the SCC pass and collecting the answer; iterative or safely bounded recursion."
    edge_cases: "Single service, self-loop only, isolated services with large ids, parallel pairs that do not form a cycle."
    communication: "Explains why membership in a non-trivial strongly connected component is equivalent to lying on a cycle."
hints:
  - "Two services that can each reach the other are on a common cycle; think about grouping services by mutual reachability."
  - "Strongly connected components group exactly those services. Which components contain a cycle, and what about a component of a single service?"
  - "Run Tarjan's or Kosaraju's algorithm once over the whole graph (iteratively if chains can be long). Mark every service in a component with at least two members, also mark services that list themselves as a dependency, and return the marked ids in increasing order."
followups:
  - "How would you report each cycle group separately so owners can fix them one at a time?"
  - "What is the minimum number of dependencies to remove to make the graph acyclic, and why is that hard in general?"
  - "The graph changes by one pair at a time during a release; how would you re-check incrementally?"
  - "How would you produce a valid start order for the services that are not on cycles and do not depend on any cycle?"
common_errors:
  - "Repeatedly removing services with no incoming or no outgoing dependencies, which keeps services that sit between two cycles."
  - "Returning only whether a cycle exists, or only the first cycle found by DFS."
  - "Treating repeated pairs [a, b], [a, b] as a cycle."
  - "Forgetting that a self-dependency is a cycle of length one."
  - "Running a full search from every service, which is quadratic on large graphs."
  - "Recursive DFS overflowing the stack on long dependency chains."
