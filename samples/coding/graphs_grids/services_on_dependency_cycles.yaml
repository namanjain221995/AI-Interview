version: 1
slug: services_on_dependency_cycles
title: "Services on Dependency Cycles"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [platform, backend, sre]
time_limit_minutes: 35
prompt_markdown: |
  ## Services on Dependency Cycles

  A platform has `n` services with ids `0` to `n - 1`. The deployment tool reads a list of pairs where
  `[a, b]` in `deps` means **service `a` depends on service `b`** (so `b` must be healthy before `a`
  can start).

  A service that lies on a **dependency cycle** can never be started cleanly from scratch, so the
  release checker must flag it. Service `s` is on a cycle when following dependencies from `s` can
  lead back to `s` itself; a service that depends on itself (`[s, s]`) counts. A service that merely
  depends on a cycle, or that a cycle depends on, is **not** on a cycle unless it can also get back to
  itself.

  Return the ids of all services that lie on at least one cycle, in **ascending order**. Return `[]`
  if the dependency graph has no cycles.

  ### Example 1
  ```
  Input:  n = 6, deps = [[0, 1], [1, 2], [2, 0], [3, 2], [4, 4], [4, 5]]
  Output: [0, 1, 2, 4]
  Explanation: 0 -> 1 -> 2 -> 0 is a cycle, and 4 depends on itself. Service 3 depends on the
               cycle but nothing leads back to 3; service 5 has no dependencies.
  ```

  ### Example 2
  ```
  Input:  n = 4, deps = [[0, 1], [0, 2], [1, 3], [2, 3]]
  Output: []
  Explanation: 3 is reachable from 0 in two ways, but no path returns to where it started.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= deps.length <= 3 * 10^4`
  - `deps[i].length == 2`, `0 <= a, b < n` (`a == b` is allowed)
  - The same pair may appear more than once.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: services_in_cycles
  params:
    - {name: n, type: "int"}
    - {name: deps, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def services_in_cycles(n: int, deps: list[list[int]]) -> list[int]:
        graph: list[list[int]] = [[] for _ in range(n)]
        self_loop = [False] * n
        for a, b in deps:
            graph[a].append(b)
            if a == b:
                self_loop[a] = True
        # Iterative Tarjan: a service is on a cycle when its strongly connected
        # component has 2+ services, or it depends on itself.
        index = [-1] * n
        low = [0] * n
        on_stack = [False] * n
        stack: list[int] = []
        in_cycle = [False] * n
        counter = 0
        for root in range(n):
            if index[root] != -1:
                continue
            index[root] = low[root] = counter
            counter += 1
            stack.append(root)
            on_stack[root] = True
            work = [(root, 0)]
            while work:
                v, i = work[-1]
                if i < len(graph[v]):
                    work[-1] = (v, i + 1)
                    w = graph[v][i]
                    if index[w] == -1:
                        index[w] = low[w] = counter
                        counter += 1
                        stack.append(w)
                        on_stack[w] = True
                        work.append((w, 0))
                    elif on_stack[w]:
                        low[v] = min(low[v], index[w])
                    continue
                work.pop()
                if work:
                    parent = work[-1][0]
                    low[parent] = min(low[parent], low[v])
                if low[v] == index[v]:
                    component = []
                    while True:
                        w = stack.pop()
                        on_stack[w] = False
                        component.append(w)
                        if w == v:
                            break
                    if len(component) > 1:
                        for w in component:
                            in_cycle[w] = True
        return [v for v in range(n) if in_cycle[v] or self_loop[v]]
  javascript: |
    function servicesInCycles(n, deps) {
      const graph = Array.from({ length: n }, () => []);
      const selfLoop = new Array(n).fill(false);
      for (const [a, b] of deps) {
        graph[a].push(b);
        if (a === b) selfLoop[a] = true;
      }
      const index = new Array(n).fill(-1);
      const low = new Array(n).fill(0);
      const onStack = new Array(n).fill(false);
      const inCycle = new Array(n).fill(false);
      const stack = [];
      let counter = 0;
      for (let root = 0; root < n; root++) {
        if (index[root] !== -1) continue;
        index[root] = low[root] = counter++;
        stack.push(root);
        onStack[root] = true;
        const work = [[root, 0]];
        while (work.length > 0) {
          const top = work[work.length - 1];
          const v = top[0];
          if (top[1] < graph[v].length) {
            const w = graph[v][top[1]++];
            if (index[w] === -1) {
              index[w] = low[w] = counter++;
              stack.push(w);
              onStack[w] = true;
              work.push([w, 0]);
            } else if (onStack[w]) {
              low[v] = Math.min(low[v], index[w]);
            }
            continue;
          }
          work.pop();
          if (work.length > 0) {
            const parent = work[work.length - 1][0];
            low[parent] = Math.min(low[parent], low[v]);
          }
          if (low[v] === index[v]) {
            const component = [];
            let w;
            do {
              w = stack.pop();
              onStack[w] = false;
              component.push(w);
            } while (w !== v);
            if (component.length > 1) for (const x of component) inCycle[x] = true;
          }
        }
      }
      const out = [];
      for (let v = 0; v < n; v++) if (inCycle[v] || selfLoop[v]) out.push(v);
      return out;
    }
