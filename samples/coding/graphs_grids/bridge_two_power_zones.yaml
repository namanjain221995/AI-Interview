expected_concepts:
  - "flood fill to identify one of the two zones"
  - "multi-source breadth-first search seeded with every tile of that zone"
  - "BFS layer number equals the count of empty tiles powered"
  - "4-directional neighbours with bounds checks"
  - "marking visited tiles so each tile is processed once"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Finds one zone with a flood fill, runs a multi-source BFS from all of its tiles at once, stops on the first tile of the other zone with the correct off-by-one count, and states O(rows * cols) time and space with a clear argument for why BFS layers give the minimum."
  good: "Correct two-phase solution (flood fill plus BFS) with minor prompting on the off-by-one in the returned count or on marking visited tiles."
  weak: "Runs a separate BFS from every tile of the first zone (quadratic), uses Manhattan distance between tiles and ignores that it still needs a path, counts the bridge length off by one, or includes diagonal neighbours."
  criteria:
    correctness: "All tests pass, including diagonal-only contact, a zone enclosed by the other and single-row or single-column grids."
    efficiency: "Each tile enters the queue at most once; linear in the grid size."
    code_quality: "Neighbour offsets defined once, the two phases clearly separated, distances or levels tracked explicitly."
    edge_cases: "Zones touching diagonally, one zone surrounding the other, long thin grids and irregular zone shapes."
    communication: "Explains why seeding the BFS with the entire zone at distance zero yields the shortest bridge."
hints:
  - "First separate the problem into two parts, knowing exactly which tiles form one of the zones, and then measuring how far the other zone is from it."
  - "Once one zone is marked, think of a breadth-first search that starts from all of its tiles at the same time and grows outward one ring of empty tiles at a time."
  - "Flood fill from any powered tile to mark the first zone and put all of its tiles in a queue at distance zero, then run BFS over unvisited tiles where each empty tile gets its parent's distance plus one, and the moment you step onto a powered unvisited tile return the distance of the tile you came from."
followups:
  - "How would you also return which tiles to power, not just how many?"
  - "What changes if powering a tile has a different cost per tile (for example cable trays cost more than open floor)?"
  - "How would you handle more than two zones that must all be connected?"
  - "Could you start the search from both zones at once, and would it help?"
common_errors:
  - "Starting the BFS from a single tile of the first zone instead of from all of its tiles."
  - "Returning the BFS distance of the tile in the second zone, which is one more than the number of empty tiles."
  - "Treating diagonal neighbours as connected."
  - "Using Manhattan distance between zone tiles, which is the right number only by coincidence and is quadratic to compute."
