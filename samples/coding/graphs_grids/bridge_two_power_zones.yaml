reference_solutions:
  python: |
    from collections import deque


    def min_cells_to_bridge(grid: list[list[int]]) -> int:
        rows, cols = len(grid), len(grid[0])
        start = next((r, c) for r in range(rows) for c in range(cols) if grid[r][c] == 1)
        dist = [[-1] * cols for _ in range(rows)]
        dist[start[0]][start[1]] = 0
        # Collect the whole first zone; every tile of it is a BFS source at distance 0.
        frontier = deque([start])
        stack = [start]
        while stack:
            r, c = stack.pop()
            for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1 and dist[nr][nc] == -1:
                    dist[nr][nc] = 0
                    stack.append((nr, nc))
                    frontier.append((nr, nc))
        # Expand over empty tiles layer by layer until a tile of the second zone is touched.
        while frontier:
            r, c = frontier.popleft()
            for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                if 0 <= nr < rows and 0 <= nc < cols and dist[nr][nc] == -1:
                    if grid[nr][nc] == 1:
                        return dist[r][c]
                    dist[nr][nc] = dist[r][c] + 1
                    frontier.append((nr, nc))
        return -1
  javascript: |
    function minCellsToBridge(grid) {
      const rows = grid.length;
      const cols = grid[0].length;
      const dist = grid.map((row) => row.map(() => -1));
      const moves = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      let start = null;
      for (let r = 0; r < rows && start === null; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === 1) { start = [r, c]; break; }
        }
      }
      dist[start[0]][start[1]] = 0;
      const queue = [start];
      const stack = [start];
      while (stack.length > 0) {
        const [r, c] = stack.pop();
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 1 && dist[nr][nc] === -1) {
            dist[nr][nc] = 0;
            stack.push([nr, nc]);
            queue.push([nr, nc]);
          }
        }
      }
      for (let head = 0; head < queue.length; head++) {
        const [r, c] = queue[head];
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || dist[nr][nc] !== -1) continue;
          if (grid[nr][nc] === 1) return dist[r][c];
          dist[nr][nc] = dist[r][c] + 1;
          queue.push([nr, nc]);
        }
      }
      return -1;
    }
