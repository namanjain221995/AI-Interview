expected_concepts:
  - "grid as an implicit graph with four-directional neighbours"
  - "breadth-first or depth-first flood fill with a visited grid"
  - "bounds checking and inclusive height comparison"
  - "early exit when the target is reached or an endpoint is blocked"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Treats the grid as a graph, checks both endpoints first, runs BFS or iterative DFS with a visited grid marking cells on push, uses the inclusive comparison and stops as soon as the target is reached; states O(rows * cols)."
  good: "Correct flood fill with minor fixes such as the endpoint check, the inclusive comparison or the bounds check."
  weak: "Only moves right and down, allows diagonal moves, forgets the visited set (looping forever), or uses unbounded recursion on a 200 x 200 grid without acknowledging the stack risk."
  criteria:
    correctness: "All tests pass, including winding routes, diagonal-only connections and blocked endpoints."
    efficiency: "Each cell is visited at most once."
    code_quality: "A direction list instead of four copied blocks; clear bounds and height checks."
    edge_cases: "Handles 1 x 1 grids, single rows, blocked start or target and the exact ceiling value."
    communication: "Explains why reachability is a graph search and why the visited grid guarantees termination."
hints:
  - "Think of each low-enough cell as a node and each pair of side-by-side low-enough cells as an edge; the question becomes whether two nodes are connected."
  - "Explore outward from the start cell, keeping track of the cells already reached so you never process one twice, and only step onto cells within the grid that are at most the ceiling."
  - "Return false if the start or target is too high; otherwise run a breadth-first search from (0, 0) with a queue and a visited grid, enqueueing each in-bounds, unvisited neighbour whose height is at most max_height, and return true when you dequeue the target cell."
followups:
  - "How would you find the smallest max_height that still allows the crossing?"
  - "How would you return the minimum number of moves instead of just true or false?"
  - "Diagonal moves become allowed; what changes in the code and in the tests?"
  - "The grid is 10^5 x 10^5 and stored in tiles on disk; how would you approach it?"
common_errors:
  - "Using a strict less-than comparison so cells exactly at the ceiling are rejected."
  - "Only moving right and down, which misses routes that wind back up or left."
  - "Marking cells visited only when dequeued, so the queue holds the same cell many times."
  - "Forgetting to check that the start and target cells themselves are low enough."
