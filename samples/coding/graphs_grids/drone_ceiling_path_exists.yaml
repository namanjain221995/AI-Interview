role_tags: [general, mobile, backend, data_scientist]
time_limit_minutes: 15
prompt_markdown: |
  ## Drone Path Under a Ceiling

  An inspection drone surveys a site mapped as a grid of terrain cells. `heights[r][c]` is the
  height of the terrain (or the structure on it) at row `r`, column `c`. Because of an airspace
  restriction the drone must fly low, so it may only be above a cell whose height is **at most**
  `max_height`.

  The drone starts above the top-left cell `(0, 0)` and must reach the bottom-right cell
  `(rows - 1, cols - 1)`. In one move it flies to the cell directly **up, down, left or right** of
  its current cell (never diagonally) and must stay inside the grid.

  Return `true` if the drone can reach the bottom-right cell, otherwise `false`. If either the
  start or the target cell is higher than `max_height`, the answer is `false`. A 1 x 1 grid only
  needs its single cell to be low enough.

  ### Example 1
  ```
  Input:  heights = [[1, 3, 2], [2, 9, 2], [4, 1, 1]], max_height = 3
  Output: true
  Explanation: One route: (0,0) -> (0,1) -> (0,2) -> (1,2) -> (2,2); every height is at most 3.
  ```

  ### Example 2
  ```
  Input:  heights = [[1, 5, 1], [5, 5, 1], [1, 1, 1]], max_height = 4
  Output: false
  Explanation: Both neighbours of the start have height 5.
  ```

  ### Example 3
  ```
  Input:  heights = [[2, 2], [2, 7]], max_height = 6
  Output: false
  ```

  ### Constraints
  - `1 <= rows, cols <= 200`
  - all rows have the same length
  - `0 <= heights[r][c] <= 10^6`
  - `0 <= max_height <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_cross
  params:
    - {name: heights, type: "int[][]"}
    - {name: max_height, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def can_cross(heights: list[list[int]], max_height: int) -> bool:
        rows, cols = len(heights), len(heights[0])
        if heights[0][0] > max_height or heights[rows - 1][cols - 1] > max_height:
            return False
        seen = [[False] * cols for _ in range(rows)]
        seen[0][0] = True
        queue = deque([(0, 0)])
        while queue:
            r, c = queue.popleft()
            if r == rows - 1 and c == cols - 1:
                return True
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols and not seen[nr][nc] and heights[nr][nc] <= max_height:
                    seen[nr][nc] = True
                    queue.append((nr, nc))
        return False
  javascript: |
    function canCross(heights, maxHeight) {
      const rows = heights.length;
      const cols = heights[0].length;
      if (heights[0][0] > maxHeight || heights[rows - 1][cols - 1] > maxHeight) return false;
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      seen[0][0] = true;
      const queue = [[0, 0]];
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let head = 0; head < queue.length; head++) {
        const [r, c] = queue[head];
        if (r === rows - 1 && c === cols - 1) return true;
        for (const [dr, dc] of steps) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !seen[nr][nc] && heights[nr][nc] <= maxHeight) {
            seen[nr][nc] = true;
            queue.push([nr, nc]);
          }
        }
      }
      return false;
    }
