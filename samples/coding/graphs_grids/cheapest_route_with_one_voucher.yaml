reference_solutions:
  python: |
    import heapq


    def cheapest_with_voucher(n: int, roads: list[list[int]], source: int, target: int) -> int:
        if source == target:
            return 0
        adj: list[list[tuple[int, int]]] = [[] for _ in range(n)]
        for frm, to, toll in roads:
            adj[frm].append((to, toll))
        inf = float("inf")
        # best[used][node]: cheapest known total to reach node, with the voucher unused (0) or spent (1).
        best = [[inf] * n, [inf] * n]
        best[0][source] = 0
        heap = [(0, source, 0)]
        while heap:
            cost, node, used = heapq.heappop(heap)
            if cost > best[used][node]:
                continue
            if node == target:
                return cost
            for nxt, toll in adj[node]:
                full = cost + toll
                if full < best[used][nxt]:
                    best[used][nxt] = full
                    heapq.heappush(heap, (full, nxt, used))
                if used == 0:
                    half = cost + toll // 2
                    if half < best[1][nxt]:
                        best[1][nxt] = half
                        heapq.heappush(heap, (half, nxt, 1))
        return -1
  javascript: |
    function cheapestWithVoucher(n, roads, source, target) {
      if (source === target) return 0;
      const adj = Array.from({ length: n }, () => []);
      for (const [from, to, toll] of roads) adj[from].push([to, toll]);
      // best[used][node]: cheapest known total with the voucher unused (0) or spent (1).
      const best = [new Array(n).fill(Infinity), new Array(n).fill(Infinity)];
      best[0][source] = 0;
      // Binary min-heap of [cost, node, used].
      const heap = [[0, source, 0]];
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p][0] <= heap[i][0]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
            if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      while (heap.length > 0) {
        const [cost, node, used] = pop();
        if (cost > best[used][node]) continue;
        if (node === target) return cost;
        for (const [next, toll] of adj[node]) {
          const full = cost + toll;
          if (full < best[used][next]) {
            best[used][next] = full;
            push([full, next, used]);
          }
          if (used === 0) {
            const half = cost + Math.floor(toll / 2);
            if (half < best[1][next]) {
              best[1][next] = half;
              push([half, next, 1]);
            }
          }
        }
      }
      return -1;
    }
