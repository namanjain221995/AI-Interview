slug: cheapest_route_with_one_voucher
title: Cheapest Route With One Toll Voucher
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Cheapest Route With One Toll Voucher

  A delivery company plans routes for its vans across a regional road network. The network has `n`
  junctions numbered `0` to `n - 1` and a list of **one-way** toll roads, where `roads[i] = [from, to, toll]`
  means a van may drive from junction `from` to junction `to` and pays `toll` for doing so. Tolls are
  non-negative. Two junctions may be joined by several roads, and a road may start and end at the same
  junction.

  Every van carries **one discount voucher**. The voucher may be used on **at most one** road of the trip;
  on that road the van pays `floor(toll / 2)` instead of `toll`. Using the voucher is optional, and a road
  that is driven more than once is paid each time it is driven.

  Return the **minimum total toll** a van must pay to drive from junction `source` to junction `target`.

  - If `source == target` the answer is `0`.
  - If `target` cannot be reached from `source`, return `-1`.
  - The answer can exceed the 32-bit integer range; return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  n = 4, roads = [[0, 1, 10], [1, 3, 10], [0, 2, 4], [2, 3, 15]], source = 0, target = 3
  Output: 11
  Explanation: Without the voucher the best route is 0 -> 2 -> 3 for 4 + 15 = 19. Using the voucher on
  the road 2 -> 3 costs 4 + 7 = 11, which beats 0 -> 1 -> 3 with the voucher (5 + 10 = 15).
  ```

  ### Example 2
  ```
  Input:  n = 3, roads = [[0, 1, 5], [1, 2, 3]], source = 2, target = 0
  Output: -1
  Explanation: The roads only lead away from junction 0, so junction 0 cannot be reached from 2.
  ```

  ### Example 3
  ```
  Input:  n = 2, roads = [[0, 1, 9]], source = 0, target = 1
  Output: 4
  Explanation: The voucher turns the toll of 9 into floor(9 / 2) = 4.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= roads.length <= 2 * 10^4`
  - `roads[i].length == 3` and `0 <= from, to < n`
  - `0 <= toll <= 10^9`
  - `0 <= source, target < n`
languages: [python, javascript, typescript, java, go, cpp]
