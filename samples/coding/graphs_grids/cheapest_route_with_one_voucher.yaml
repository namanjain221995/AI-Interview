expected_concepts:
  - Dijkstra's algorithm on non-negative edge weights
  - state expansion to (junction, voucher used or not), a two-layer graph
  - each road gives a full-price edge within a layer and a half-price edge from the unused to the used layer
  - why finding the cheapest route first and then halving its most expensive road is wrong
  - 64-bit accumulation of totals
optimal_complexity: {time: O((n + m) log(n + m)) where m is the number of roads, space: O(n + m)}
rubric:
  excellent: Models the state as (junction, voucher spent) and runs one Dijkstra over the doubled graph with stale-entry skipping, explains with a counterexample why halving the most expensive road of the plain shortest route fails, handles source == target and unreachable targets, uses 64-bit totals and states O((n + m) log(n + m)).
  good: Reaches a correct solution such as the layered Dijkstra after a hint, or the equivalent forward-and-reverse Dijkstra combining dist_from_source[u] + floor(toll / 2) + dist_to_target[v] over every road, with minor slips fixed when tested.
  weak: Halves the largest toll on the plain cheapest route, re-runs Dijkstra once per road without discussing the cost, uses an unweighted BFS, or overflows 32-bit totals.
  criteria:
    correctness: Returns the true minimum over all routes and all choices of discounted road, -1 when unreachable and 0 when source equals target.
    efficiency: One Dijkstra over 2n states (or two Dijkstras plus a pass over the roads) rather than one shortest-path run per road.
    code_quality: Clear state tuple (cost, junction, used), a readable distance table per layer and no duplicated relaxation code.
    edge_cases: Odd tolls rounded down, zero tolls, parallel roads, self-loops, separate components and totals above 2^31.
    communication: Explains why the extra state makes the greedy choice of road unnecessary and why Dijkstra stays valid on the expanded graph.
hints:
  - The cheapest route without the voucher is not always the route you want to discount; think about what extra information a partial route needs to carry.
  - Track two costs per junction, one for arriving with the voucher still unused and one for arriving after spending it, and treat the pair (junction, voucher spent) as a node of a bigger graph.
  - Run Dijkstra from (source, unused); for each road out of a popped state relax the same layer with the full toll and, if the voucher is still unused, also relax the spent layer with floor(toll / 2); the first time any state at the target is popped its cost is the answer.
followups:
  - How would you generalise to k vouchers, and how does the running time grow?
  - Can you solve it with one Dijkstra from the source and one on the reversed graph from the target instead of a layered graph?
  - What changes if the voucher gives a fixed amount off instead of half price, or if tolls could be negative?
  - How would you also return the route and say which road the voucher was used on?
common_errors:
  - Finding the cheapest route first and halving its most expensive road, which misses a different route that becomes cheaper with the voucher.
  - Keeping a single distance per junction, so arriving cheaply after spending the voucher blocks a later, better use of it.
  - Rounding half tolls up or using floating-point division.
  - Accumulating totals in a 32-bit integer.
  - Returning a large sentinel instead of -1 for an unreachable target.
