expected_concepts:
  - "Eulerian path in a directed multigraph"
  - "Hierholzer's algorithm (post-order stop emission, then reverse)"
  - "visiting neighbours in ascending order for the lexicographically smallest route"
  - "why plain greedy or backtracking is wrong or exponential"
  - "numeric versus string sorting"
optimal_complexity: {time: "O(E log E) for sorting the legs, O(E) for the walk", space: "O(n + E)"}
rubric:
  excellent: "Recognises an Eulerian path, implements Hierholzer with each stop's legs in ascending order and a stack, emits stops when they run out of legs and reverses, explains why this yields the smallest valid route and runs in O(E log E)."
  good: "Correct Hierholzer or a correct backtracking solution with good pruning, needing a hint about stranding or about reversing the post-order."
  weak: "Always takes the smallest next stop without recovery (strands the truck), uses exponential backtracking without discussing cost, or sorts ids as strings."
  criteria:
    correctness: "All tests pass, including stranding traps, repeated legs, start not equal to 0 and 2-versus-10 ordering."
    efficiency: "Near-linear after sorting; every leg is consumed once."
    code_quality: "Adjacency lists sorted once, an explicit stack, no recursion that can overflow on long routes."
    edge_cases: "No legs, repeated legs and routes that end away from the depot."
    communication: "Explains why stops are appended only when stuck and why the final list is reversed."
hints:
  - "Think of stops as nodes and legs as one-way edges that must each be used exactly once; this is a classic kind of path in graph theory."
  - "Walking greedily to the smallest next stop can get stuck with legs left over. What if, whenever you get stuck, you record that stop and back up to splice the remaining legs in earlier?"
  - "Sort each stop's outgoing legs ascending (numerically). Keep a stack starting with the depot: while the top stop has unused legs, push the smallest destination and consume that leg; when it has none, pop it onto the route. Reverse the route at the end."
followups:
  - "How would you check whether a valid route exists at all, and where it must start?"
  - "If the depot were unknown, how would you pick the start stop?"
  - "How would you adapt this to two-way roads that each must be driven once in either direction?"
  - "Why does processing destinations in ascending order make the final reversed route the lexicographically smallest?"
common_errors:
  - "Always driving to the smallest next stop and returning a partial route when stuck."
  - "Sorting stop ids as strings so 10 comes before 2."
  - "Forgetting to reverse the post-order list produced by Hierholzer."
  - "De-duplicating repeated legs, which drops legs the truck drove more than once."
  - "Exhaustive backtracking that is exponential on routes with many loops."
  - "Recursive walks overflowing the stack on long routes."
