slug: truck_route_from_legs
title: "Rebuild a Truck Route From Legs"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Rebuild a Truck Route From Legs

  A delivery truck's GPS logger lost its timeline, but the dispatch system still has every one-way
  **leg** the truck drove today: `legs[i] = [from, to]` means the truck drove once from stop `from`
  directly to stop `to`. Stops have ids `0` to `n - 1`. The truck started the day at the depot,
  stop `start`, and drove **every leg exactly once** (the same `[from, to]` pair can appear several
  times when the truck drove it several times). It is guaranteed that at least one route like this
  exists.

  Rebuild the route as the sequence of stops the truck visited, beginning with `start`; the sequence
  has `legs.length + 1` stops. Several routes may be consistent with the legs; return the
  **lexicographically smallest** one, comparing stop ids as **numbers** position by position (the
  first position where two routes differ decides).

  ### Example 1
  ```
  Input:  n = 4, legs = [[0, 1], [3, 0], [1, 2], [0, 3], [2, 0]], start = 0
  Output: [0, 1, 2, 0, 3, 0]
  Explanation: [0, 3, 0, 1, 2, 0] also uses every leg once, but [0, 1, ...] is smaller.
  ```

  ### Example 2
  ```
  Input:  n = 3, legs = [[0, 1], [0, 2], [2, 0]], start = 0
  Output: [0, 2, 0, 1]
  Explanation: Driving to 1 first would leave the truck at 1 with the legs [0, 2] and [2, 0] unused,
               so the only valid route goes to 2 first.
  ```

  ### Example 3
  ```
  Input:  n = 5, legs = [], start = 4
  Output: [4]
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= legs.length <= 10^4`
  - `legs[i].length == 2`, `0 <= from, to < n`, `from != to`
  - `0 <= start < n`
  - A route starting at `start` that uses every leg exactly once exists.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: truck_route
  params:
    - {name: n, type: "int"}
    - {name: legs, type: "int[][]"}
    - {name: start, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def truck_route(n: int, legs: list[list[int]], start: int) -> list[int]:
        # Outgoing legs per stop, sorted descending so the smallest is popped first.
        outgoing: list[list[int]] = [[] for _ in range(n)]
        for frm, to in legs:
            outgoing[frm].append(to)
        for options in outgoing:
            options.sort(reverse=True)
        # Hierholzer: walk greedily; a stop is written to the route only when it has
        # no unused legs left, so detours that would strand the truck are spliced in.
        route: list[int] = []
        stack = [start]
        while stack:
            stop = stack[-1]
            if outgoing[stop]:
                stack.append(outgoing[stop].pop())
            else:
                route.append(stack.pop())
        route.reverse()
        return route
  javascript: |
    function truckRoute(n, legs, start) {
      const outgoing = Array.from({ length: n }, () => []);
      for (const [from, to] of legs) outgoing[from].push(to);
      for (const options of outgoing) options.sort((x, y) => y - x);
      const route = [];
      const stack = [start];
      while (stack.length > 0) {
        const stop = stack[stack.length - 1];
        if (outgoing[stop].length > 0) stack.push(outgoing[stop].pop());
        else route.push(stack.pop());
      }
      return route.reverse();
    }
