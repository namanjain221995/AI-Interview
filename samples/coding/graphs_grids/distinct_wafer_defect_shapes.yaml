expected_concepts:
  - flood fill (BFS or DFS) to find 4-connected components
  - canonical form of a component by translating to a reference cell
  - hashing canonical shapes in a set
  - consistent ordering or traversal so equal shapes produce equal keys
optimal_complexity: {time: O(R*C log(R*C)), space: O(R*C)}
rubric:
  excellent: Flood-fills each defect, normalises its cells relative to a fixed reference (the first cell in scan order or the bounding-box corner), sorts or otherwise canonicalises them, stores the keys in a set, and explains why rotations and reflections are not merged.
  good: Correct component extraction and shape keys with small slips, such as relying on traversal order for the key, fixed after testing.
  weak: Counts components instead of shapes, compares only sizes or bounding boxes, or merges diagonal neighbours.
  criteria:
    correctness: Two defects get the same key exactly when one is a translation of the other.
    efficiency: Each cell is visited once; shape keys cost at most a sort of the component's cells.
    code_quality: Separate flood-fill and normalisation steps; a clear neighbour list and visited grid.
    edge_cases: No defects, single cells, dominoes in both orientations, mirrored shapes and holes.
    communication: Explains why the normalisation is translation-invariant and why sorting makes the key independent of traversal order.
hints:
  - First find each defect as a connected group of defective cells, using up, down, left and right neighbours only.
  - Two defects are the same shape when their cells line up after a shift, so describe each defect by its cells measured relative to one fixed reference cell.
  - For each defect, subtract the row and column of its first cell in top-to-bottom, left-to-right order from every cell, sort the resulting offsets so the description does not depend on the search order, and add that sorted list to a set whose final size is the answer.
followups:
  - How would you treat rotations and reflections as the same shape?
  - How would you report how many defects have each shape?
  - What if the map is too large for memory and arrives one row at a time?
  - Could a path signature recorded during DFS replace the sorted offset list; what must it include to be unambiguous?
common_errors:
  - Counting defects (components) instead of distinct shapes.
  - Building the key from traversal order without sorting or recording backtracking, so equal shapes get different keys.
  - Treating diagonally touching cells as one defect.
  - Using only the size or the bounding box as the shape key.
