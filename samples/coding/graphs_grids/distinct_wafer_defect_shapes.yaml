slug: distinct_wafer_defect_shapes
title: Distinct Wafer Defect Shapes
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data_scientist, backend, ml, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Distinct Wafer Defect Shapes

  An optical inspection station scans silicon wafers and produces a map `wafer`: a list of equal-length
  strings, one per row, where `'#'` marks a defective cell and `'.'` a good one. A **defect** is a group of
  defective cells connected **up, down, left or right** (cells that touch only diagonally belong to
  different defects).

  Process engineers classify defects by shape to trace them back to a faulty tool. Two defects have the
  **same shape** when one can be moved onto the other by a **translation** only, that is, shifting it by
  some number of rows and columns. Rotated or mirrored versions count as **different** shapes.

  Return the number of **distinct shapes** among all defects on the map (`0` if there are no defective
  cells).

  ### Example 1
  ```
  Input:  wafer = ["##..#", "#...#", "...##", "##...", "#...."]
  Output: 2
  Explanation: The defects at the top-left and bottom-left are the same L-shape shifted down by 3 rows; the defect on the right is a different shape
  ```

  ### Example 2
  ```
  Input:  wafer = ["#.#", ".#.", "#.#"]
  Output: 1
  Explanation: Five single-cell defects, all the same shape
  ```

  ### Constraints
  - `1 <= rows, cols <= 100`
  - all strings in `wafer` have the same length `cols`
  - every character is `'.'` or `'#'`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: distinct_defect_shapes
  params:
    - {name: wafer, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def distinct_defect_shapes(wafer: list[str]) -> int:
        rows, cols = len(wafer), len(wafer[0])
        seen = [[False] * cols for _ in range(rows)]
        shapes: set[tuple[tuple[int, int], ...]] = set()
        for sr in range(rows):
            for sc in range(cols):
                if wafer[sr][sc] != "#" or seen[sr][sc]:
                    continue
                seen[sr][sc] = True
                stack = [(sr, sc)]
                cells = []
                while stack:
                    r, c = stack.pop()
                    cells.append((r - sr, c - sc))
                    for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                        if 0 <= nr < rows and 0 <= nc < cols and wafer[nr][nc] == "#" and not seen[nr][nc]:
                            seen[nr][nc] = True
                            stack.append((nr, nc))
                # Offsets from the first cell found in row-major order identify the shape up to translation.
                shapes.add(tuple(sorted(cells)))
        return len(shapes)
  javascript: |
    function distinctDefectShapes(wafer) {
      const rows = wafer.length;
      const cols = wafer[0].length;
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      const shapes = new Set();
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let sr = 0; sr < rows; sr++) {
        for (let sc = 0; sc < cols; sc++) {
          if (wafer[sr][sc] !== '#' || seen[sr][sc]) continue;
          seen[sr][sc] = true;
          const stack = [[sr, sc]];
          const cells = [];
          while (stack.length > 0) {
            const [r, c] = stack.pop();
            cells.push([r - sr, c - sc]);
            for (const [dr, dc] of moves) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && wafer[nr][nc] === '#' && !seen[nr][nc]) {
                seen[nr][nc] = true;
                stack.push([nr, nc]);
              }
            }
          }
          cells.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
          shapes.add(cells.map(([r, c]) => r + ',' + c).join(';'));
        }
      }
      return shapes.size;
    }
