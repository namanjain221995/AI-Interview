version: 1
slug: badge_unlocked_rooms
title: "Badge-Unlocked Storage Rooms"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, security, qa, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## Badge-Unlocked Storage Rooms

  A facilities auditor is checking a warehouse with `n` storage rooms numbered `0` to `n - 1`. Every door
  has a badge reader. Room `0` is the loading bay and is already open; every other room starts locked.

  Inside each room there is a rack of access badges: `badges[i]` lists the rooms whose doors the badges
  found in room `i` open. Once the auditor has entered a room they keep its badges for the rest of the
  audit, may walk back through any room they have already opened and may enter rooms in any order.

  Return `true` if the auditor can eventually enter **every** room, and `false` otherwise.

  ### Example 1
  ```
  Input:  badges = [[2], [], [1, 3], []]
  Output: true
  Explanation: Room 0 opens room 2, and room 2 holds the badges for rooms 1 and 3.
  ```

  ### Example 2
  ```
  Input:  badges = [[1], [0, 1], [3], [2]]
  Output: false
  Explanation: Rooms 0 and 1 only open each other; the badges for rooms 2 and 3 are locked inside 2 and 3.
  ```

  ### Constraints
  - `1 <= n == badges.length <= 1000`
  - `0 <= badges[i].length <= 1000`
  - `0 <= badges[i][j] < n`
  - The total number of badges across all rooms is at most `3000`.
  - A rack may hold several badges for the same room, and a room may hold a badge for itself.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_open_all_rooms
  params:
    - {name: badges, type: "int[][]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def can_open_all_rooms(badges: list[list[int]]) -> bool:
        opened = [False] * len(badges)
        opened[0] = True
        count = 1
        to_visit = [0]
        while to_visit:
            room = to_visit.pop()
            for target in badges[room]:
                if not opened[target]:
                    opened[target] = True
                    count += 1
                    to_visit.append(target)
        return count == len(badges)
  javascript: |
    function canOpenAllRooms(badges) {
      const opened = new Array(badges.length).fill(false);
      opened[0] = true;
      let count = 1;
      const toVisit = [0];
      while (toVisit.length > 0) {
        const room = toVisit.pop();
        for (const target of badges[room]) {
          if (!opened[target]) {
            opened[target] = true;
            count++;
            toVisit.push(target);
          }
        }
      }
      return count === badges.length;
    }
