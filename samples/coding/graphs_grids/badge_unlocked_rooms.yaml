expected_concepts:
  - "reachability in a directed graph"
  - "breadth-first or depth-first search from a start node"
  - "visited set to avoid repeated work and infinite loops"
  - "iterative traversal to avoid deep recursion"
optimal_complexity: {time: "O(n + b) where b is the total number of badges", space: "O(n)"}
rubric:
  excellent: "Models rooms as nodes and badges as directed edges, runs an iterative BFS or DFS from room 0 with a visited array, counts opened rooms and states O(n + b) time."
  good: "Correct traversal, possibly recursive, that may need a prompt about duplicate badges or deep chains."
  weak: "Simulates rounds of opening rooms until nothing changes in quadratic time without noticing the graph, or forgets to mark rooms visited and loops forever."
  criteria:
    correctness: "All tests pass, including self badges, duplicates and rooms that only unlock each other."
    efficiency: "Each room and each badge is processed at most once."
    code_quality: "Clear names (opened, to_visit) and a simple loop without special cases."
    edge_cases: "Single room, empty racks, duplicate and self badges, and a 500-room chain."
    communication: "Explains why the order of visiting does not matter because badges never expire."
hints:
  - "Think of each room as a point and each badge as a one-way arrow from the room where it is found to the room it opens."
  - "The question becomes whether every room is reachable from the loading bay; a standard graph traversal answers that."
  - "Keep a visited array with room zero marked and a stack or queue of rooms to explore; pop a room, mark and push every unvisited room its badges open, and at the end compare the number of visited rooms with n."
followups:
  - "How would you return the list of rooms that can never be entered?"
  - "If each badge could be used only once, how would the problem change?"
  - "What is the risk of a recursive DFS on 10^5 rooms in a chain, and how do you avoid it?"
common_errors:
  - "Forgetting to mark room 0 as opened, so a badge back to it is processed again."
  - "Marking rooms when they are popped instead of when they are pushed, which adds duplicates to the stack."
  - "Using recursion without considering stack depth on long chains."
  - "Returning true as soon as every room appears in some rack, ignoring whether that rack is reachable."
