version: 1
slug: category_breadcrumb_paths
title: "Category Breadcrumb Paths (SQL)"
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data_analyst, fullstack, backend, dba]
time_limit_minutes: 20
prompt_markdown: |
  ## Category Breadcrumb Paths

  An online store keeps its product categories in one table:

  Table `categories`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | TEXT | not unique: the same name can appear under different parents |
  | parent_id | INTEGER | references `categories.id`; **NULL for a top-level (root) category** |

  Every non-NULL `parent_id` points to an existing category and there are no cycles, so the table is a
  forest of trees. A child's `id` can be smaller than its parent's.

  The storefront needs a breadcrumb for every category. Return one row per category with columns:

  - `id`: the category id;
  - `breadcrumb`: the names on the path from its root down to the category itself, joined with
    `' > '` (space, greater-than sign, space), for example `'Hardware > Storage > SSD'`. A root's
    breadcrumb is just its name;
  - `depth`: the number of ancestors (`0` for a root).

  Order the rows by `id` ascending. The tree can be arbitrarily deep.

  Write standard SQL that runs on both PostgreSQL and SQLite (use `||` for string concatenation and a
  recursive common table expression).

  ### Example 1
  ```
  categories
  +----+------------+-----------+
  | id | name       | parent_id |
  +----+------------+-----------+
  | 1  | Hardware   | NULL      |
  | 2  | Storage    | 1         |
  | 3  | Networking | 1         |
  | 4  | SSD        | 2         |
  | 5  | HDD        | 2         |
  | 6  | Software   | NULL      |
  | 7  | Databases  | 6         |
  +----+------------+-----------+

  Output
  +----+--------------------------+-------+
  | id | breadcrumb               | depth |
  +----+--------------------------+-------+
  | 1  | Hardware                 | 0     |
  | 2  | Hardware > Storage       | 1     |
  | 3  | Hardware > Networking    | 1     |
  | 4  | Hardware > Storage > SSD | 2     |
  | 5  | Hardware > Storage > HDD | 2     |
  | 6  | Software                 | 0     |
  | 7  | Software > Databases     | 1     |
  +----+--------------------------+-------+
  ```

  ### Example 2
  ```
  categories
  +----+----------------+-----------+
  | id | name           | parent_id |
  +----+----------------+-----------+
  | 2  | Tools          | 5         |
  | 5  | Garden         | NULL      |
  | 9  | Pruning Shears | 2         |
  | 11 | Seasonal       | NULL      |
  +----+----------------+-----------+

  Output
  +----+---------------------------------+-------+
  | id | breadcrumb                      | depth |
  +----+---------------------------------+-------+
  | 2  | Garden > Tools                  | 1     |
  | 5  | Garden                          | 0     |
  | 9  | Garden > Tools > Pruning Shears | 2     |
  | 11 | Seasonal                        | 0     |
  +----+---------------------------------+-------+
  Tools (id 2) has a smaller id than its parent Garden (id 5); rows are still ordered by id.
  ```
languages: [sql]
starter_code:
  sql: |
    -- Return id, breadcrumb (root names joined with ' > ') and depth for every category, ordered by id.
    SELECT id, name AS breadcrumb, 0 AS depth
    FROM categories
    ORDER BY id;
reference_solutions:
  sql: |
    WITH RECURSIVE trail (id, breadcrumb, depth) AS (
      SELECT id, name, 0
      FROM categories
      WHERE parent_id IS NULL
      UNION ALL
      SELECT c.id, t.breadcrumb || ' > ' || c.name, t.depth + 1
      FROM categories c
      JOIN trail t ON c.parent_id = t.id
    )
    SELECT id, breadcrumb, depth
    FROM trail
    ORDER BY id;
sql_setup: |
  CREATE TABLE categories (
    id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    parent_id INTEGER REFERENCES categories (id)
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - two roots, three levels, siblings"
    setup_sql: |
      INSERT INTO categories (id, name, parent_id) VALUES
        (1, 'Hardware', NULL), (2, 'Storage', 1), (3, 'Networking', 1), (4, 'SSD', 2),
        (5, 'HDD', 2), (6, 'Software', NULL), (7, 'Databases', 6);
    expected_rows: [[1, "Hardware", 0], [2, "Hardware > Storage", 1], [3, "Hardware > Networking", 1], [4, "Hardware > Storage > SSD", 2], [5, "Hardware > Storage > HDD", 2], [6, "Software", 0], [7, "Software > Databases", 1]]
  - id: t2
    ordered: true
    description: "Example 2 - child ids smaller than parent ids; a lone root"
    setup_sql: |
      INSERT INTO categories (id, name, parent_id) VALUES
        (2, 'Tools', 5), (5, 'Garden', NULL), (9, 'Pruning Shears', 2), (11, 'Seasonal', NULL);
    expected_rows: [[2, "Garden > Tools", 1], [5, "Garden", 0], [9, "Garden > Tools > Pruning Shears", 2], [11, "Seasonal", 0]]
