expected_concepts:
  - "WITH RECURSIVE over an adjacency list (parent_id)"
  - "anchoring the recursion on roots (parent_id IS NULL)"
  - "building a path string with || while recursing top-down"
  - "carrying a depth counter"
  - "ordering the final result independently of recursion order"
optimal_complexity: {time: "O(n) rows produced, each join step indexed on parent_id", space: "O(n * d) for the breadcrumb strings, d = depth"}
rubric:
  excellent: "Anchors a recursive CTE on the roots, appends ' > ' and the child name while incrementing depth, joins on parent_id = id (never on names), orders the final SELECT by id, and discusses index on parent_id and type consistency of the recursive column."
  good: "Correct recursive query after a hint about the anchor (roots) or about walking top-down so the breadcrumb is built in the right order."
  weak: "Uses a fixed number of self-joins, builds the breadcrumb in reverse order, joins categories by name, or misses roots."
  criteria:
    correctness: "All tests pass, including deep chains, duplicate names and ids smaller than their parents."
    efficiency: "Single recursive pass touching each category once; mentions an index on parent_id."
    code_quality: "Readable CTE with named columns and a clear separator literal."
    edge_cases: "Empty table, roots only, repeated names and names containing punctuation."
    communication: "Explains why walking down from roots builds the path naturally and how recursion stops at the leaves."
hints:
  - "A breadcrumb is easiest to build if you start at the top of each tree and walk down, extending the path one level at a time."
  - "Use a recursive common table expression whose first part selects the roots with their own name as the path and depth zero."
  - "In the recursive part, join categories to the rows already produced on child parent id equals produced id, and output the produced breadcrumb followed by the separator and the child's name, with depth plus one. Select from the CTE and order by id."
followups:
  - "How would you list, for one category, all of its descendants with their relative depth?"
  - "How would you detect a cycle if bad data introduced one, and stop the recursion safely?"
  - "What schema alternatives (materialised path, nested sets, closure table) make breadcrumb reads cheaper, and what do they cost on writes?"
  - "How would you count the number of products under each category including all subcategories?"
common_errors:
  - "Starting the recursion from every category instead of only from roots, which produces partial breadcrumbs."
  - "Walking upwards from each category and concatenating in the wrong order."
  - "Joining on category names, which mixes up categories that share a name."
  - "Using a fixed number of self-joins that silently stops at a few levels."
  - "Forgetting the final ORDER BY id, relying on recursion output order."
