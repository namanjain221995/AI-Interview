expected_concepts:
  - weighted directed graph with reciprocal edges
  - BFS or DFS that multiplies rates along the path
  - weighted union-find as an alternative for many queries
  - distinguishing unknown currencies, disconnected markets and self-queries
optimal_complexity: {time: O(Q * (V + E)), space: O(V + E)}
rubric:
  excellent: Models quotes as a graph with an edge in each direction (rate and its reciprocal), answers each query with BFS or DFS multiplying along the path with a visited set (or uses weighted union-find for near-constant queries), handles unknown, self and disconnected cases exactly as specified, and discusses floating-point accumulation.
  good: Correct graph traversal with minor slips, such as the unknown-currency self-query or missing reverse edges, fixed after testing.
  weak: Uses only direct quotes, forgets reverse rates, or loops forever on cycles without a visited set.
  criteria:
    correctness: Derived rates match within tolerance; 1.0 only for known self-queries; -1.0 for unknown or unlinked currencies.
    efficiency: One traversal per query, or a precomputed union-find; no enumeration of all paths.
    code_quality: Clean adjacency map, clear traversal and explicit special cases.
    edge_cases: Unknown currency to itself, reverse direction, cycles, disconnected markets and extreme rates.
    communication: Explains why consistency means any found path gives the correct rate.
hints:
  - Picture each currency as a node and each quote as a pair of edges, one in each direction, carrying a multiplier.
  - To convert between two currencies, walk from one to the other along any path and multiply the multipliers you pass; because the quotes are consistent, the first path you find is good enough.
  - Build an adjacency map with the rate on the forward edge and its reciprocal on the reverse edge; for each query, return minus one if either currency is missing from the map, otherwise run a breadth-first search from the source storing the accumulated product per currency, and return the product stored for the target or minus one if it was never reached.
followups:
  - How would weighted union-find answer each query in near-constant time after preprocessing?
  - What if quotes could be inconsistent; how would you detect an arbitrage loop?
  - How would you choose among paths when quotes carry fees or confidence values?
  - How does floating-point error grow along long chains and how would you limit it?
common_errors:
  - Forgetting the reverse edge with rate 1 / rate.
  - Returning 1.0 for a currency that never appears in any quote.
  - Traversing without a visited set, which loops forever on cycles.
  - Adding rates along a path instead of multiplying them.
