slug: currency_rate_derivation
title: Derive Currency Rates
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Derive Currency Rates

  A payments service receives exchange quotes from several banks, but no bank quotes every pair of
  currencies. Quote `i` says that **1 unit** of `pairs[i][0]` is worth `rates[i]` units of
  `pairs[i][1]`. Every quote also implies the reverse rate: 1 unit of `pairs[i][1]` is worth
  `1 / rates[i]` units of `pairs[i][0]`. Rates can be chained: if 1 A = 2 B and 1 B = 3 C, then
  1 A = 6 C.

  The quotes are **consistent**: any two chains between the same two currencies give the same rate.

  For every query `[from, to]` in `queries`, return how many units of `to` one unit of `from` is worth,
  in the same order as the queries:

  - `1.0` when `from` and `to` are the same currency **and** that currency appears in some quote;
  - `-1.0` when either currency never appears in a quote, or when no chain of quotes links them.

  Answers are compared with a relative tolerance of `1e-6`.

  ### Example 1
  ```
  Input:  pairs = [["GBP", "USD"], ["USD", "EUR"], ["JPY", "KRW"]], rates = [1.25, 0.8, 8.0], queries = [["GBP", "EUR"], ["EUR", "USD"], ["USD", "USD"], ["GBP", "JPY"], ["CHF", "CHF"]]
  Output: [1.0, 1.25, 1.0, -1.0, -1.0]
  Explanation: GBP -> USD -> EUR gives 1.25 * 0.8 = 1.0; EUR -> USD is the reverse of 0.8; JPY and KRW form a separate market; CHF never appears in a quote
  ```

  ### Example 2
  ```
  Input:  pairs = [["AUD", "NZD"], ["NZD", "SGD"], ["SGD", "HKD"]], rates = [2.0, 0.5, 4.0], queries = [["HKD", "AUD"], ["AUD", "HKD"], ["NZD", "XYZ"]]
  Output: [0.25, 4.0, -1.0]
  ```

  ### Constraints
  - `1 <= pairs.length == rates.length <= 200`
  - `pairs[i].length == 2`, `pairs[i][0] != pairs[i][1]`; each unordered pair of currencies is quoted at most once
  - currency codes are 3 uppercase letters
  - `0.001 <= rates[i] <= 1000.0`
  - `1 <= queries.length <= 200`, `queries[j].length == 2`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: convert_rates
  params:
    - {name: pairs, type: "string[][]"}
    - {name: rates, type: "float[]"}
    - {name: queries, type: "string[][]"}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    from collections import deque


    def convert_rates(pairs: list[list[str]], rates: list[float], queries: list[list[str]]) -> list[float]:
        graph: dict[str, list[tuple[str, float]]] = {}
        for (src, dst), rate in zip(pairs, rates):
            graph.setdefault(src, []).append((dst, rate))
            graph.setdefault(dst, []).append((src, 1.0 / rate))
        answers: list[float] = []
        for src, dst in queries:
            if src not in graph or dst not in graph:
                answers.append(-1.0)
                continue
            value = {src: 1.0}
            queue = deque([src])
            while queue and dst not in value:
                node = queue.popleft()
                for nxt, rate in graph[node]:
                    if nxt not in value:
                        value[nxt] = value[node] * rate
                        queue.append(nxt)
            answers.append(value.get(dst, -1.0))
        return answers
  javascript: |
    function convertRates(pairs, rates, queries) {
      const graph = new Map();
      const link = (a, b, r) => {
        if (!graph.has(a)) graph.set(a, []);
        graph.get(a).push([b, r]);
      };
      pairs.forEach(([src, dst], i) => {
        link(src, dst, rates[i]);
        link(dst, src, 1 / rates[i]);
      });
      return queries.map(([src, dst]) => {
        if (!graph.has(src) || !graph.has(dst)) return -1.0;
        const value = new Map([[src, 1.0]]);
        const queue = [src];
        for (let head = 0; head < queue.length && !value.has(dst); head++) {
          const node = queue[head];
          for (const [nxt, rate] of graph.get(node)) {
            if (!value.has(nxt)) {
              value.set(nxt, value.get(node) * rate);
              queue.push(nxt);
            }
          }
        }
        return value.has(dst) ? value.get(dst) : -1.0;
      });
    }
