expected_concepts:
  - "cycle detection in an undirected graph"
  - "union-find: an edge joining two cells already in one set closes a cycle"
  - "alternative DFS or BFS that ignores the edge back to the parent"
  - "processing each grid edge once (right and down neighbours)"
  - "in a grid every cycle has at least 4 cells"
optimal_complexity: {time: "O(rows * cols * α(rows * cols))", space: "O(rows * cols)"}
rubric:
  excellent: "Treats same-letter neighbours as an undirected graph, detects a cycle with union-find (or a DFS that skips only the parent edge), explains why any grid cycle automatically has at least 4 cells, handles every zone and states near-linear time."
  good: "Correct DFS or union-find with a small prompt about the parent edge, revisiting already-explored zones or recursion depth."
  weak: "Reports a loop whenever a visited cell is seen again (including the parent), only checks for 2 x 2 blocks, or searches separately from every cell with fresh visited sets (quadratic)."
  criteria:
    correctness: "All tests pass, including U shapes, diagonal-only contact, loops enclosing other letters and large tree-shaped zones."
    efficiency: "Each cell and edge processed a constant number of times."
    code_quality: "Cell indexing and neighbour checks kept simple; union-find helpers or DFS state clearly named."
    edge_cases: "Single cell, single row or column, every cell different, the whole grid one letter."
    communication: "Explains why seeing an already visited cell through a non-parent edge proves a loop, and how the length rule is satisfied automatically."
hints:
  - "Think of every cell as a node and connect neighbouring cells that share a letter. The question becomes whether this undirected graph has a cycle."
  - "During a traversal, reaching an already visited cell means a cycle unless that cell is the one you just came from. Union-find gives an even simpler test as you add connections one by one."
  - "Give each cell an index, then for every cell look only at its right and lower neighbours, and for each pair with the same letter find both set representatives, returning true if they are already the same set and otherwise merging them; return false after all pairs are processed."
followups:
  - "How would you return the cells of one loop instead of just true or false?"
  - "What changes if diagonal moves were also allowed, and is the length rule still automatic?"
  - "How would you report every zone that contains a loop?"
  - "If the layout is streamed one row at a time, can you detect a loop with memory proportional to one row?"
common_errors:
  - "Counting the step back to the previous cell as a loop."
  - "Only looking for 2 x 2 blocks, which misses larger rings."
  - "Recursive DFS that overflows the call stack on a long snake-shaped zone."
  - "Comparing against the wrong letter when moving between zones, or allowing diagonal moves."
