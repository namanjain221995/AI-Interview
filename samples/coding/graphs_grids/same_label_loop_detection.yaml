slug: same_label_loop_detection
title: Detect a Same-Label Loop
difficulty: medium
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [general, backend, qa]
time_limit_minutes: 22
prompt_markdown: |
  ## Detect a Same-Label Loop

  A parcel hub's conveyor layout is stored as `grid`, a list of equal-length strings. Every character is a
  lowercase letter that names the **conveyor zone** the cell belongs to. A parcel moves from a cell to a
  neighbouring cell **up, down, left or right**, and only between cells with the **same letter**.

  Controls engineers are worried about parcels circulating forever. A **loop** is a route that:

  - starts and ends at the same cell,
  - visits at least **4** cells,
  - only moves between orthogonal neighbours with the same letter, and
  - does not visit any cell twice except for returning to the start at the end.

  Stepping from a cell to a neighbour and straight back does **not** form a loop. Return `true` if the
  grid contains at least one loop and `false` otherwise.

  ### Example 1
  ```
  Input:  grid = ["aaaa", "abba", "abba", "aaaa"]
  Output: true
  Explanation: The outer ring of a cells is a loop (so is the 2 x 2 block of b cells).
  ```

  ### Example 2
  ```
  Input:  grid = ["aaa", "aba", "aba"]
  Output: false
  Explanation: The a cells form a U shape that never closes.
  ```

  ### Example 3
  ```
  Input:  grid = ["cc", "cc"]
  Output: true
  ```

  ### Constraints
  - `1 <= grid.length <= 300` and `1 <= grid[i].length <= 300`; all strings have the same length.
  - Every character is a lowercase English letter.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: has_label_loop
  params:
    - {name: grid, type: "string[]"}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def has_label_loop(grid: list[str]) -> bool:
        rows, cols = len(grid), len(grid[0])
        parent = list(range(rows * cols))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        for r in range(rows):
            for c in range(cols):
                # Each same-letter edge is joined once (to the right and downward).
                for nr, nc in ((r, c + 1), (r + 1, c)):
                    if nr < rows and nc < cols and grid[nr][nc] == grid[r][c]:
                        a = find(r * cols + c)
                        b = find(nr * cols + nc)
                        if a == b:
                            return True
                        parent[a] = b
        return False
  javascript: |
    function hasLabelLoop(grid) {
      const rows = grid.length;
      const cols = grid[0].length;
      const parent = Array.from({ length: rows * cols }, (_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const here = r * cols + c;
          if (c + 1 < cols && grid[r][c + 1] === grid[r][c]) {
            const a = find(here);
            const b = find(here + 1);
            if (a === b) return true;
            parent[a] = b;
          }
          if (r + 1 < rows && grid[r + 1][c] === grid[r][c]) {
            const a = find(here);
            const b = find(here + cols);
            if (a === b) return true;
            parent[a] = b;
          }
        }
      }
      return false;
    }
