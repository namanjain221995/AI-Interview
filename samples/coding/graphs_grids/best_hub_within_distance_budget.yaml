version: 1
slug: best_hub_within_distance_budget
title: "Best Hub Within a Distance Budget"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_analyst, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Best Hub Within a Distance Budget

  A logistics team is choosing which of its `n` sites, numbered `0` to `n - 1`, should host a new shared
  parts hub. Sites are joined by **two-way** roads: each entry `[u, v, km]` in `roads` is a road between
  sites `u` and `v` that is `km` kilometres long. A route between two sites may pass through any number of
  other sites, and its length is the sum of its road lengths.

  A site **covers** another site when the shortest route between them is **at most** `budget` kilometres.
  Sites that cannot be reached by any route are never covered, and a site does not count itself.

  Return the site that covers the **largest number** of other sites. If several sites cover the same,
  largest number, return the **smallest** id among them.

  ### Example 1
  ```
  Input:  n = 4, roads = [[0, 1, 3], [1, 2, 1], [1, 3, 4], [2, 3, 1]], budget = 4
  Output: 1
  Explanation: Site 1 reaches 0 (3 km), 2 (1 km) and 3 (2 km, via 2). Site 2 reaches 0 (4 km), 1 and 3. Both cover 3 sites, so the smaller id wins.
  ```

  ### Example 2
  ```
  Input:  n = 5, roads = [[0, 1, 2], [1, 2, 2], [2, 3, 2], [3, 4, 2]], budget = 4
  Output: 2
  Explanation: Site 2 is at most 4 km from every other site.
  ```

  ### Example 3
  ```
  Input:  n = 3, roads = [], budget = 10
  Output: 0
  ```

  ### Constraints
  - `1 <= n <= 100`
  - `0 <= roads.length <= 1000`
  - `roads[i] = [u, v, km]` with `0 <= u, v < n`, `u != v` and `1 <= km <= 10^4`
  - Two sites may be joined by more than one road (of possibly different lengths).
  - `0 <= budget <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_hub
  params:
    - {name: n, type: "int"}
    - {name: roads, type: "int[][]"}
    - {name: budget, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def best_hub(n: int, roads: list[list[int]], budget: int) -> int:
        # Floyd-Warshall: all-pairs shortest road distances (n is at most 100).
        inf = float("inf")
        dist = [[inf] * n for _ in range(n)]
        for i in range(n):
            dist[i][i] = 0
        for u, v, km in roads:
            if km < dist[u][v]:
                dist[u][v] = km
                dist[v][u] = km
        for k in range(n):
            row_k = dist[k]
            for i in range(n):
                dik = dist[i][k]
                if dik == inf:
                    continue
                row_i = dist[i]
                for j in range(n):
                    candidate = dik + row_k[j]
                    if candidate < row_i[j]:
                        row_i[j] = candidate
        best_site, best_count = 0, -1
        for site in range(n):
            count = sum(1 for other in range(n) if other != site and dist[site][other] <= budget)
            if count > best_count:
                best_site, best_count = site, count
        return best_site
  javascript: |
    function bestHub(n, roads, budget) {
      const dist = Array.from({ length: n }, (_, i) =>
        Array.from({ length: n }, (_, j) => (i === j ? 0 : Infinity)));
      for (const [u, v, km] of roads) {
        if (km < dist[u][v]) {
          dist[u][v] = km;
          dist[v][u] = km;
        }
      }
      for (let k = 0; k < n; k++) {
        for (let i = 0; i < n; i++) {
          const dik = dist[i][k];
          if (dik === Infinity) continue;
          for (let j = 0; j < n; j++) {
            const candidate = dik + dist[k][j];
            if (candidate < dist[i][j]) dist[i][j] = candidate;
          }
        }
      }
      let bestSite = 0;
      let bestCount = -1;
      for (let site = 0; site < n; site++) {
        let count = 0;
        for (let other = 0; other < n; other++) {
          if (other !== site && dist[site][other] <= budget) count++;
        }
        if (count > bestCount) {
          bestSite = site;
          bestCount = count;
        }
      }
      return bestSite;
    }
