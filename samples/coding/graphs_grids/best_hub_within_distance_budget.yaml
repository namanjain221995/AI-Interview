expected_concepts:
  - "all-pairs shortest paths (Floyd-Warshall) or Dijkstra from every site"
  - "keeping the minimum of parallel roads"
  - "inclusive budget comparison and excluding the site itself"
  - "deterministic tie-breaking by smallest id"
  - "why plain BFS hop counts are wrong for weighted roads"
optimal_complexity: {time: "O(n^3) with Floyd-Warshall, or O(n * m log n) with Dijkstra from every site", space: "O(n^2)"}
rubric:
  excellent: "Chooses Floyd-Warshall (justified by n <= 100) or repeated Dijkstra, initialises distances correctly including parallel roads, applies the inclusive budget and the smallest-id tie-break, and compares the complexity of both options."
  good: "Correct shortest-path computation and counting with minor prompting on parallel roads, the inclusive comparison or tie-breaking."
  weak: "Counts direct roads only, uses BFS hop counts on weighted roads, overwrites a shorter parallel road with a longer one, or breaks ties toward the largest id."
  criteria:
    correctness: "All tests pass, including parallel roads, multi-hop routes shorter than direct roads and disconnected sites."
    efficiency: "O(n^3) or O(n * m log n); no exponential path enumeration."
    code_quality: "Distance matrix initialised once with a clear infinity value; counting and tie-breaking kept in a small final loop."
    edge_cases: "Single site, no roads, budget 0, unreachable sites, ties."
    communication: "Explains why Floyd-Warshall is acceptable for n <= 100 and how the tie-break follows from scanning ids in increasing order with a strict comparison."
hints:
  - "You need the shortest road distance between every pair of sites, not just between neighbours."
  - "With at most 100 sites an all-pairs shortest-path algorithm is affordable; afterwards each site's count is a simple scan of its row of distances."
  - "Build an n by n distance table with zero on the diagonal, infinity elsewhere, and the shortest road for each linked pair. Relax every pair through every possible intermediate site, then for each site count the other sites whose distance is at most the budget, keeping the first site that achieves a strictly larger count."
followups:
  - "How would you solve it if n were 10^5 but the graph were sparse?"
  - "What changes if some roads are one-way?"
  - "How would you return the list of covered sites for the chosen hub?"
  - "How would you choose two hubs that together cover the most sites?"
common_errors:
  - "Overwriting an existing shorter road when a longer parallel road appears later in the input."
  - "Using BFS hop counts instead of weighted distances."
  - "Placing the intermediate-site loop innermost in Floyd-Warshall, which gives wrong distances."
  - "Using a strict less-than comparison with the budget instead of at most."
  - "Breaking ties toward the largest id by using a greater-or-equal comparison."
