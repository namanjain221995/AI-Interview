title: "Keycard Warehouse Escape"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, security]
time_limit_minutes: 35
prompt_markdown: |
  ## Keycard Warehouse Escape

  A warehouse robot must travel from its charging station to the exit while the site's access
  control is active. The floor plan is given as `layout`, a list of equal-length strings where each
  character is one cell:

  - `'S'` the charging station (the start), exactly one
  - `'X'` the exit, exactly one
  - `'.'` open floor
  - `'#'` a wall the robot can never enter
  - `'a'` to `'f'` a keycard; each letter appears **at most once**
  - `'A'` to `'F'` a security door; the same door letter may appear several times

  Each move takes the robot one cell up, down, left or right, staying inside the layout. When the
  robot enters a keycard cell it picks the keycard up and keeps it for the rest of the trip (the cell
  stays passable). The robot may enter a door cell only while it holds the keycard with the matching
  lowercase letter, for example door `'C'` needs keycard `'c'`. A door whose keycard does not exist
  can never be opened. Cells may be revisited, and collecting every keycard is not required.

  Return the **minimum number of moves** from `S` to `X`, or `-1` if the exit cannot be reached.

  ### Example 1
  ```
  Input:  layout = ["S.a", "#A#", "X.."]
  Output: 6
  Explanation: Go right twice to pick up keycard a, come back one cell,
               pass door A, then go down and left to the exit.
  ```

  ### Example 2
  ```
  Input:  layout = ["SAX", "#.#", "#a#"]
  Output: -1
  Explanation: Keycard a is only reachable through door A itself.
  ```

  ### Example 3
  ```
  Input:  layout = ["S..", "...", "..X"]
  Output: 4
  ```

  ### Constraints
  - `1 <= layout.length <= 30` and `1 <= layout[i].length <= 30`; all rows have the same length
  - `layout[i][j]` is one of `S X . # a b c d e f A B C D E F`
  - Exactly one `S` and exactly one `X`; each keycard letter appears at most once
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_moves_with_keycards
  params:
    - {name: layout, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def min_moves_with_keycards(layout: list[str]) -> int:
        rows, cols = len(layout), len(layout[0])
        start = next((r, c) for r in range(rows) for c in range(cols) if layout[r][c] == "S")
        # state = (row, col, set of held keycards as a 6-bit mask)
        seen = [[[False] * 64 for _ in range(cols)] for _ in range(rows)]
        seen[start[0]][start[1]][0] = True
        queue = deque([(start[0], start[1], 0, 0)])
        while queue:
            r, c, keys, moves = queue.popleft()
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                nr, nc = r + dr, c + dc
                if not (0 <= nr < rows and 0 <= nc < cols):
                    continue
                cell = layout[nr][nc]
                if cell == "#":
                    continue
                if cell == "X":
                    return moves + 1
                new_keys = keys
                if "a" <= cell <= "f":
                    new_keys |= 1 << (ord(cell) - ord("a"))
                elif "A" <= cell <= "F" and not keys & (1 << (ord(cell) - ord("A"))):
                    continue
                if not seen[nr][nc][new_keys]:
                    seen[nr][nc][new_keys] = True
                    queue.append((nr, nc, new_keys, moves + 1))
        return -1
  javascript: |
    function minMovesWithKeycards(layout) {
      const rows = layout.length;
      const cols = layout[0].length;
      let sr = 0;
      let sc = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (layout[r][c] === "S") {
            sr = r;
            sc = c;
          }
        }
      }
      const seen = new Uint8Array(rows * cols * 64);
      seen[(sr * cols + sc) * 64] = 1;
      const queue = [[sr, sc, 0, 0]];
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let head = 0; head < queue.length; head++) {
        const [r, c, keys, moves] = queue[head];
        for (const [dr, dc] of steps) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          const cell = layout[nr][nc];
          if (cell === "#") continue;
          if (cell === "X") return moves + 1;
          let newKeys = keys;
          if (cell >= "a" && cell <= "f") {
            newKeys |= 1 << (cell.charCodeAt(0) - 97);
          } else if (cell >= "A" && cell <= "F" && !(keys & (1 << (cell.charCodeAt(0) - 65)))) {
            continue;
          }
          const id = (nr * cols + nc) * 64 + newKeys;
          if (!seen[id]) {
            seen[id] = 1;
            queue.push([nr, nc, newKeys, moves + 1]);
          }
        }
      }
      return -1;
    }
