expected_concepts:
  - "breadth-first search for the fewest moves on an unweighted grid"
  - "expanding the state to position plus the set of keycards held"
  - "bitmask encoding of up to six keycards"
  - "revisiting a cell is valid when the keycard set differs"
  - "state-space size rows times columns times 64"
optimal_complexity: {time: "O(R * C * 2^K)", space: "O(R * C * 2^K)"}
rubric:
  excellent: "Recognises that a plain visited grid fails because the robot may need to walk back after collecting a keycard, models the state as (row, column, keycard mask), runs breadth-first search over it, returns as soon as the exit is entered, and states the R*C*2^K bound with K at most 6."
  good: "Reaches the expanded-state BFS after a hint about revisiting cells, with minor slips such as checking the door against the new mask or a late goal check."
  weak: "Uses a visited grid without the keycard set, uses depth-first search for shortest moves, or tries every order of keycards with separate searches without bounding the cost."
  criteria:
    correctness: "All tests pass, including back-tracking for a keycard, doors without keycards and unreachable exits."
    efficiency: "Each (cell, keycard set) state is processed at most once."
    code_quality: "Clear mask helpers or bit operations; door and keycard handling are easy to follow."
    edge_cases: "Start next to the exit, keycard behind its own door, unused keycards and repeated door letters."
    communication: "Explains why the visited structure needs the keycard dimension and how big it can get."
hints:
  - "The fewest moves on a grid where every move costs the same suggests a level-by-level search. Ask what information besides the position decides where the robot can go next."
  - "Two visits to the same cell are different situations if the robot holds different keycards. Make the search state the position together with the set of keycards held, and track visited states rather than visited cells."
  - "Encode the held keycards as a six-bit mask and run breadth-first search over (row, column, mask). When stepping onto a keycard, set its bit; when stepping onto a door, continue only if the matching bit is set; skip walls and out-of-range cells; return the move count the moment you step onto the exit, and return minus one when the queue empties."
followups:
  - "How would you also report which keycards the shortest route collects?"
  - "If keycards were consumed when used (each opens one door once), how would the state change?"
  - "With up to 20 keycard types the mask approach explodes. What would you try instead?"
  - "How would you handle doors that take extra time to open, so moves are no longer uniform cost?"
common_errors:
  - "Marking cells visited regardless of the keycards held, which blocks the walk back after collecting a keycard."
  - "Checking the door against the keycard set after the move instead of before it."
  - "Treating a door whose keycard does not exist as passable or as a crash."
  - "Using depth-first search, which finds a route but not the shortest one."
  - "Requiring every keycard to be collected before heading to the exit."
