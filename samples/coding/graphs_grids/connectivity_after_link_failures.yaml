expected_concepts:
  - "processing deletions offline in reverse as insertions"
  - "union-find (disjoint set union) with path compression"
  - "monotonicity of connectivity under deletions (binary search alternative)"
  - "multigraph edges and self-loops"
optimal_complexity: {time: "O((n + m) * alpha(n)) with union-find, m = links.length", space: "O(n + m)"}
rubric:
  excellent: "Observes that deletions are hard but insertions are easy, unions every link that never fails, then replays the failures backwards answering before each restoring union; explains near-linear complexity and mentions the monotone binary-search-plus-BFS alternative and its O((n + m) log f) cost."
  good: "Reaches the reverse union-find or the binary search over the failure prefix after a hint, with small slips such as an off-by-one in which answer is recorded before a union."
  weak: "Rebuilds the graph and runs BFS after every failure (O(f * (n + m))), or tries to delete edges from a union-find."
  criteria:
    correctness: "All tests pass, including parallel links, self-links, a equals b and hosts that were never connected."
    efficiency: "Near-linear union-find pass; no full traversal per failure."
    code_quality: "Small find and union helpers, a clear set of failed indices and a result array filled from the back."
    edge_cases: "No failures, a equals b, isolated hosts, large n with few links."
    communication: "Explains why reversing time turns deletions into unions and why the answer is recorded before restoring the link."
hints:
  - "Removing links from a structure is awkward, but adding links is easy. What if you looked at the storm backwards in time?"
  - "Start from the network as it is after the last failure, then put the failed links back one at a time in reverse order; a structure that merges groups quickly will tell you whether a and b share a group."
  - "Use union-find: join every link that never fails, then walk the failures list from last to first. For position k, first record whether a and b have the same representative, then join the endpoints of the link that failed at step k. The recorded values, in their original positions, are the answer."
followups:
  - "Links can now also be repaired during the storm, mixed with failures; what changes?"
  - "How would you answer the same question for many (a, b) probe pairs at once?"
  - "How would you report the number of isolated groups of hosts after each failure?"
  - "Which single link, if it failed first, would disconnect a and b soonest, and how would you find bridges in general?"
common_errors:
  - "Running a full BFS or DFS after every failure, which is quadratic for large inputs."
  - "Recording the answer after re-adding the link instead of before, shifting every result by one."
  - "Removing every link between the same pair of hosts when one parallel link fails."
  - "Returning false when a equals b and the host has no working links."
  - "Treating failures as host ids instead of link indices."
