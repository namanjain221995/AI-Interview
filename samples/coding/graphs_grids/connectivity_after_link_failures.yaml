version: 1
slug: connectivity_after_link_failures
title: "Connectivity After Link Failures"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [network, sre, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Connectivity After Link Failures

  A data centre has `n` hosts with ids `0` to `n - 1`, wired by **undirected** network links:
  `links[i] = [u, v]` connects hosts `u` and `v`. Two hosts are connected when a path of working links
  joins them. Several links may join the same pair of hosts.

  During a storm, links fail **permanently**, one after another: `failures` lists distinct link
  **indices** (positions in `links`) in the order they fail. A monitoring probe runs between hosts `a`
  and `b`. After **each** failure, report whether `a` and `b` are still connected.

  Return a boolean array whose element `k` tells whether `a` and `b` are connected after the first
  `k + 1` failures have happened. A host is always connected to itself.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 3], [0, 3]], failures = [1, 3, 0], a = 0, b = 2
  Output: [true, false, false]
  Explanation: After link 1 ([1, 2]) fails, 0 still reaches 2 through 3. After link 3 ([0, 3]) also
               fails, the remaining links are [0, 1] and [2, 3], so 0 and 2 are split.
  ```

  ### Example 2
  ```
  Input:  n = 3, links = [[0, 1], [0, 1], [1, 2]], failures = [0, 2], a = 0, b = 2
  Output: [true, false]
  Explanation: Links 0 and 1 both join hosts 0 and 1, so losing link 0 changes nothing. When
               link 2 ([1, 2]) fails, host 2 is cut off.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `0 <= links.length <= 10^5`, `links[i].length == 2`, `0 <= u, v < n` (`u == v` is allowed)
  - `0 <= failures.length <= links.length`; the values in `failures` are distinct indices into `links`
  - `0 <= a, b < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: still_connected_after_failures
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: failures, type: "int[]"}
    - {name: a, type: "int"}
    - {name: b, type: "int"}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    def still_connected_after_failures(n: int, links: list[list[int]], failures: list[int], a: int, b: int) -> list[bool]:
        parent = list(range(n))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        def union(x: int, y: int) -> None:
            rx, ry = find(x), find(y)
            if rx != ry:
                parent[rx] = ry

        # Work backwards: start from the network after every failure, then
        # restore the failed links one by one in reverse order.
        failed = set(failures)
        for i, (u, v) in enumerate(links):
            if i not in failed:
                union(u, v)
        result = [False] * len(failures)
        for k in range(len(failures) - 1, -1, -1):
            result[k] = find(a) == find(b)
            u, v = links[failures[k]]
            union(u, v)
        return result
  javascript: |
    function stillConnectedAfterFailures(n, links, failures, a, b) {
      const parent = Array.from({ length: n }, (_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const union = (x, y) => {
        const rx = find(x);
        const ry = find(y);
        if (rx !== ry) parent[rx] = ry;
      };
      const failed = new Set(failures);
      links.forEach(([u, v], i) => {
        if (!failed.has(i)) union(u, v);
      });
      const result = new Array(failures.length).fill(false);
      for (let k = failures.length - 1; k >= 0; k--) {
        result[k] = find(a) === find(b);
        const [u, v] = links[failures[k]];
        union(u, v);
      }
      return result;
    }
