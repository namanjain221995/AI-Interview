expected_concepts:
  - "directed graph cycle reachability"
  - "reverse graph with out-degree counting (topological peeling from terminal nodes)"
  - "alternatively DFS with three colours (unvisited, in progress, safe)"
  - "all-paths versus some-path reasoning"
  - "O(n + m) time and space"
optimal_complexity: {time: "O(n + m)", space: "O(n + m)"}
rubric:
  excellent: "Recognises that a job is unsafe exactly when it can reach a cycle, implements either reverse-graph peeling from terminal jobs or a three-colour DFS with memoised results, handles self-triggers and duplicates, avoids deep recursion issues and states O(n + m)."
  good: "Correct DFS or peeling solution with linear complexity; may need a prompt about self-triggers, duplicate pairs or memoising results."
  weak: "Marks a job safe if some branch terminates, only detects whether any cycle exists, recomputes reachability from every job in O(n * (n + m)) without memoisation, or returns unsorted ids."
  criteria:
    correctness: "All tests pass, including mixed branches, self-triggers and jobs feeding into a loop."
    efficiency: "Each job and trigger is processed a constant number of times."
    code_quality: "Clear separation between building the graph and the peeling or DFS step; meaningful names such as out_degree and fired_by."
    edge_cases: "Single job, self-trigger, duplicate pairs, jobs with no triggers at all and an empty result."
    communication: "Explains why a job is safe only when all of its successors are safe and how that maps to the chosen algorithm."
hints:
  - "Think about which jobs you can mark safe immediately, and what must be true of a job's successors for it to be safe too."
  - "A job is safe exactly when every job it can trigger is safe. Try working backwards from the terminal jobs, or use a depth-first search that remembers whether a job is still being explored."
  - "Count each job's outgoing triggers and keep, for every job, the list of jobs that trigger it. Start a queue with the jobs whose count is zero; each time you take a job from the queue, decrement the count of every job that triggers it and enqueue any whose count drops to zero. The jobs that were ever enqueued are the safe ones, listed in increasing id order."
followups:
  - "How would you report, for an unsafe job, one concrete loop it can reach?"
  - "How does the recursive three-colour DFS compare with the queue-based approach for a chain of a million jobs?"
  - "What changes if the engine guarantees that exactly one trigger fires, chosen by the job, and you want jobs that can terminate?"
  - "How would you keep the safe set up to date when triggers are added one at a time?"
common_errors:
  - "Treating a job as safe when only some of its branches terminate."
  - "Detecting whether the whole graph has a cycle instead of which jobs can reach one."
  - "Forgetting that a self-trigger is a loop."
  - "Counting in-degrees on the forward graph instead of out-degrees, so the peeling starts from the wrong end."
  - "Running a fresh search from every job without memoising results, giving quadratic time."
