title: "Jobs Guaranteed to Terminate"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [platform, backend, data, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Jobs Guaranteed to Terminate

  A workflow engine runs `n` jobs numbered `0` to `n - 1`. When a job finishes it can fire **triggers**:
  each entry `[a, b]` in `triggers` means that finishing job `a` may start job `b`. A job with no outgoing
  triggers is a **terminal** job: when it finishes, that branch of the workflow is over.

  Which trigger actually fires depends on runtime data, so the on-call team assumes the worst. A job is
  **safe** when *every* possible chain of triggers that starts at it reaches a terminal job after a finite
  number of steps, whichever triggers fire along the way. A job from which some chain can enter a loop of
  triggers (including a job that triggers itself) is **not** safe, even if its other branches all end.

  Return the ids of all safe jobs in **ascending** order. Terminal jobs are always safe. Return an empty
  list if no job is safe.

  ### Example 1
  ```
  Input:  n = 5, triggers = [[0, 1], [1, 2], [2, 1], [3, 4]]
  Output: [3, 4]
  Explanation: Jobs 1 and 2 trigger each other forever, and job 0 can enter that loop. Job 4 is terminal and job 3 always ends at job 4.
  ```

  ### Example 2
  ```
  Input:  n = 4, triggers = [[0, 1], [0, 2], [1, 3], [2, 3]]
  Output: [0, 1, 2, 3]
  ```

  ### Example 3
  ```
  Input:  n = 3, triggers = [[1, 1], [0, 2]]
  Output: [0, 2]
  Explanation: Job 1 re-triggers itself. Job 0 always ends at terminal job 2.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= triggers.length <= 4 * 10^4`
  - `triggers[i] = [a, b]` with `0 <= a, b < n`
  - `a == b` is allowed (a job that re-triggers itself), and the same pair may appear more than once.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: safe_jobs
  params:
    - {name: n, type: "int"}
    - {name: triggers, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def safe_jobs(n: int, triggers: list[list[int]]) -> list[int]:
        # Peel jobs off from the terminal end: a job is safe once all of its
        # outgoing triggers lead to jobs already known to be safe.
        out_degree = [0] * n
        fired_by: list[list[int]] = [[] for _ in range(n)]
        for a, b in triggers:
            out_degree[a] += 1
            fired_by[b].append(a)
        queue = deque(job for job in range(n) if out_degree[job] == 0)
        safe = [False] * n
        while queue:
            job = queue.popleft()
            safe[job] = True
            for parent in fired_by[job]:
                out_degree[parent] -= 1
                if out_degree[parent] == 0:
                    queue.append(parent)
        return [job for job in range(n) if safe[job]]
  javascript: |
    function safeJobs(n, triggers) {
      const outDegree = new Array(n).fill(0);
      const firedBy = Array.from({ length: n }, () => []);
      for (const [a, b] of triggers) {
        outDegree[a] += 1;
        firedBy[b].push(a);
      }
      const queue = [];
      for (let job = 0; job < n; job++) if (outDegree[job] === 0) queue.push(job);
      const safe = new Array(n).fill(false);
      for (let head = 0; head < queue.length; head++) {
        const job = queue[head];
        safe[job] = true;
        for (const parent of firedBy[job]) {
          outDegree[parent] -= 1;
          if (outDegree[parent] === 0) queue.push(parent);
        }
      }
      const result = [];
      for (let job = 0; job < n; job++) if (safe[job]) result.push(job);
      return result;
    }
