version: 1
slug: product_code_transition_steps
title: "Product Code Transition Steps"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Product Code Transition Steps

  A catalogue team is migrating a product from one internal code to another. The labelling system
  only allows **one character** of a code to be changed per relabelling step, and after every step the
  product must carry a code that is on the approved list, so that scanners never see an unknown code.

  Given the current code `start`, the desired code `target` and the list `approved`, return the
  **minimum number of steps** needed to turn `start` into `target`:

  - every code reached after a step, including `target` itself, must appear in `approved`;
  - `start` does not need to be approved;
  - if `start` equals `target`, the answer is `0`;
  - if `target` cannot be reached, return `-1`.

  All codes have the same length. `approved` may contain duplicates and may contain `start`.

  ### Example 1
  ```
  Input:  start = "AB12", target = "XY12", approved = ["XB12", "XY12", "AY12", "AY13"]
  Output: 2
  Explanation: AB12 -> XB12 -> XY12 (AB12 -> AY12 -> XY12 also works). AY13 is never useful.
  ```

  ### Example 2
  ```
  Input:  start = "SKU1", target = "SKU9", approved = ["SKU5", "SKV9"]
  Output: -1
  Explanation: SKU9 is not approved, so the product can never carry it.
  ```

  ### Example 3
  ```
  Input:  start = "Q1", target = "Q1", approved = []
  Output: 0
  Explanation: No step is needed, so the empty list does not matter.
  ```

  ### Constraints
  - `1 <= start.length <= 8` and `target.length == start.length`
  - `0 <= approved.length <= 5000` and every `approved[i].length == start.length`
  - Codes contain only uppercase English letters and digits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_code_steps
  params:
    - {name: start, type: "string"}
    - {name: target, type: "string"}
    - {name: approved, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import defaultdict, deque


    def min_code_steps(start: str, target: str, approved: list[str]) -> int:
        if start == target:
            return 0
        allowed = set(approved)
        if target not in allowed:
            return -1
        buckets = defaultdict(list)
        for code in allowed:
            for i in range(len(code)):
                buckets[code[:i] + "*" + code[i + 1:]].append(code)
        seen = {start}
        queue = deque([(start, 0)])
        while queue:
            code, steps = queue.popleft()
            for i in range(len(code)):
                pattern = code[:i] + "*" + code[i + 1:]
                for nxt in buckets.pop(pattern, []):
                    if nxt in seen:
                        continue
                    if nxt == target:
                        return steps + 1
                    seen.add(nxt)
                    queue.append((nxt, steps + 1))
        return -1
  javascript: |
    function minCodeSteps(start, target, approved) {
      if (start === target) return 0;
      const allowed = new Set(approved);
      if (!allowed.has(target)) return -1;
      const buckets = new Map();
      for (const code of allowed) {
        for (let i = 0; i < code.length; i++) {
          const pattern = code.slice(0, i) + "*" + code.slice(i + 1);
          if (!buckets.has(pattern)) buckets.set(pattern, []);
          buckets.get(pattern).push(code);
        }
      }
      const seen = new Set([start]);
      let frontier = [start];
      let steps = 0;
      while (frontier.length > 0) {
        steps++;
        const next = [];
        for (const code of frontier) {
          for (let i = 0; i < code.length; i++) {
            const pattern = code.slice(0, i) + "*" + code.slice(i + 1);
            const group = buckets.get(pattern);
            if (!group) continue;
            buckets.delete(pattern);
            for (const candidate of group) {
              if (seen.has(candidate)) continue;
              if (candidate === target) return steps;
              seen.add(candidate);
              next.push(candidate);
            }
          }
        }
        frontier = next;
      }
      return -1;
    }
