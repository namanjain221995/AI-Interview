expected_concepts:
  - "modelling codes as nodes of an implicit graph with one-character edges"
  - "breadth-first search for the fewest steps"
  - "wildcard buckets (or per-position substitution) to find neighbours quickly"
  - "visited set so each code is expanded once"
  - "early exits for equal codes and an unapproved target"
optimal_complexity: {time: "O(N * L^2) where N is the number of approved codes and L the code length", space: "O(N * L^2)"}
rubric:
  excellent: "Recognises an unweighted shortest-path problem, runs BFS from start with a visited set, finds neighbours through wildcard buckets or per-position substitution instead of comparing all pairs, handles the zero-step and unapproved-target cases first, and states the complexity in terms of N and L."
  good: "Correct BFS that finds neighbours by comparing each code against the whole approved list (O(N^2 * L)), with the special cases handled after a prompt."
  weak: "Uses DFS or greedy character fixing that misses shorter routes, forgets the visited set, or requires start to be approved."
  criteria:
    correctness: "All tests pass, including duplicates, disconnected targets and the equal-codes case."
    efficiency: "Neighbour lookup is better than scanning every approved code for every visited code."
    code_quality: "Clear queue handling with step counts, and a helper that builds the wildcard key."
    edge_cases: "start equals target, target missing from the list, single-character codes, duplicate entries."
    communication: "Explains why BFS gives the minimum and why DFS or greedy fixing does not."
hints:
  - "Think of every approved code as a point, with a connection between two codes that differ in exactly one position. The question becomes the length of the shortest route between two points."
  - "All steps cost the same, so breadth-first search from the starting code finds the fewest steps. The expensive part is finding a code's neighbours; try grouping codes by what they look like with one position hidden."
  - "Handle the equal-codes and unapproved-target cases first. Build a map from each pattern with one position replaced by a wildcard to the approved codes matching it. Run breadth-first search from start, level by level: for each position of the current code look up its wildcard pattern, visit every unseen code in that bucket, return the step count when you meet the target, and clear the bucket after using it so it is never scanned twice. Return minus one when the queue empties."
followups:
  - "How would you return one actual sequence of codes, not just the count?"
  - "How would bidirectional search change the amount of work on large lists?"
  - "What if changing a digit cost one unit but changing a letter cost two?"
  - "How would you list every shortest sequence?"
common_errors:
  - "Requiring start to be on the approved list, or returning -1 when start equals an unapproved target."
  - "Comparing every pair of codes to build the graph, which is quadratic in the list size."
  - "Using depth-first search, which finds a route but not necessarily the shortest one."
  - "Forgetting to mark codes as visited, so the search loops between neighbours."
