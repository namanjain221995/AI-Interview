title: "Critical Network Links"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [network, sre, security, cloud]
time_limit_minutes: 35
prompt_markdown: |
  ## Critical Network Links

  A network team is preparing a resilience report for a data centre. There are `n` hosts with ids
  `0` to `n - 1`, and `links` lists the physical cables between them: `[a, b]` is a cable that
  carries traffic both ways between host `a` and host `b`. Hosts that can reach each other through
  any chain of cables form one **connected group**; the network may already consist of several
  groups, and some hosts may have no cables at all.

  A cable is **critical** if cutting it alone would split its group, so that the total number of
  connected groups goes up. Cables that sit on a loop are not critical, because traffic can still
  go around the other side.

  Return every critical cable as `[smaller id, larger id]`, and return the list sorted in ascending
  order (by the first id, then by the second id). Return an empty list if no cable is critical.

  ### Example 1
  ```
  Input:  n = 5, links = [[0, 1], [1, 2], [2, 0], [1, 3], [3, 4]]
  Output: [[1, 3], [3, 4]]
  Explanation: Hosts 0, 1 and 2 form a loop, so none of those cables is critical.
               Cutting 1-3 or 3-4 cuts off part of the network.
  ```

  ### Example 2
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 3], [3, 0]]
  Output: []
  Explanation: All four hosts sit on one ring; any single cut leaves them connected.
  ```

  ### Example 3
  ```
  Input:  n = 6, links = [[0, 1], [2, 3], [3, 4], [4, 2], [5, 4]]
  Output: [[0, 1], [4, 5]]
  Explanation: The network already has two groups. Cable [5, 4] is reported as [4, 5].
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 2 * 10^4`
  - `links[i].length == 2`, `0 <= a, b < n` and `a != b`
  - No cable appears twice (in either orientation).
languages: [python, javascript, typescript, java, go, cpp]
