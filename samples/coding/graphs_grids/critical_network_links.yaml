expected_concepts:
  - "bridges in an undirected graph"
  - "depth-first search discovery times and low-link values"
  - "ignoring only the cable used to enter a host, not the parent host"
  - "iterative traversal to avoid recursion limits on long chains"
  - "normalising and sorting the output pairs"
optimal_complexity: {time: "O(n + e log e)", space: "O(n + e)"}
rubric:
  excellent: "Explains why the brute force of cutting each cable and re-counting groups is O(e * (n + e)), derives the discovery-time and low-link rule (a tree cable to a child is critical when the child's subtree cannot reach the parent or above), runs it over every group, handles deep chains without recursion overflow and returns normalised, sorted pairs; states linear time plus the sort."
  good: "Implements the low-link approach correctly after small fixes, for example skipping the parent cable, starting a search in every group, or sorting the output; or explains it well but needs help with an iterative traversal."
  weak: "Only reaches the cut-and-recount brute force, treats every cable outside a cycle check incorrectly, or confuses critical cables with critical hosts."
  criteria:
    correctness: "All tests pass, including several groups, isolated hosts, trees and loops joined by a single cable."
    efficiency: "One depth-first pass over hosts and cables, then a sort of the critical cables."
    code_quality: "Clear names for discovery time and low value; the critical-cable condition is easy to read."
    edge_cases: "Handles a single host, no cables, reversed cable orientation and long chains."
    communication: "Can justify the strict inequality in the critical-cable condition with a small example."
hints:
  - "A cable is safe exactly when it lies on some loop. Think about how a depth-first search reveals loops through cables that lead back to hosts already discovered."
  - "Record when each host is first discovered, and for each host compute the earliest discovery time its part of the search tree can reach using one cable that jumps back to an earlier host."
  - "During a depth-first search, a cable from a parent to a newly discovered child is critical when the earliest time reachable from the child's subtree is still later than the parent's own discovery time. Skip only the cable you arrived by, start a fresh search in every undiscovered group, then normalise each pair and sort."
followups:
  - "How would you find the hosts (rather than cables) whose failure splits the network?"
  - "If two parallel cables could join the same pair of hosts, what would change in your solution?"
  - "Given a budget to add k new cables, how would you choose them to remove as many critical cables as possible?"
  - "How would you keep the critical list current as cables are added over time?"
common_errors:
  - "Skipping every edge back to the parent host instead of only the entering cable, which breaks with parallel cables if they are later allowed."
  - "Using a non-strict comparison of low value against the parent's discovery time, which reports loop cables as critical."
  - "Starting the search only from host 0, which misses critical cables in other groups."
  - "Recursing over a chain of thousands of hosts and hitting the recursion limit."
  - "Returning pairs in input orientation or in discovery order instead of normalised and sorted."
