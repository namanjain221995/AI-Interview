    - {name: links, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def critical_links(n: int, links: list[list[int]]) -> list[list[int]]:
        adj: list[list[tuple[int, int]]] = [[] for _ in range(n)]
        for edge_id, (a, b) in enumerate(links):
            adj[a].append((b, edge_id))
            adj[b].append((a, edge_id))
        found = [-1] * n  # discovery time of each host
        low = [0] * n  # earliest discovery time reachable from the host's subtree
        timer = 0
        result: list[list[int]] = []
        for root in range(n):
            if found[root] != -1:
                continue
            found[root] = low[root] = timer
            timer += 1
            # frame = [host, id of the cable used to enter it, next neighbour index]
            stack = [[root, -1, 0]]
            while stack:
                frame = stack[-1]
                host, via, index = frame
                if index < len(adj[host]):
                    frame[2] += 1
                    nxt, edge_id = adj[host][index]
                    if edge_id == via:
                        continue
                    if found[nxt] == -1:
                        found[nxt] = low[nxt] = timer
                        timer += 1
                        stack.append([nxt, edge_id, 0])
                    else:
                        low[host] = min(low[host], found[nxt])
                else:
                    stack.pop()
                    if stack:
                        parent = stack[-1][0]
                        low[parent] = min(low[parent], low[host])
                        if low[host] > found[parent]:
                            result.append([min(parent, host), max(parent, host)])
        result.sort()
        return result
  javascript: |
    function criticalLinks(n, links) {
      const adj = Array.from({ length: n }, () => []);
      links.forEach(([a, b], id) => {
        adj[a].push([b, id]);
        adj[b].push([a, id]);
      });
      const found = new Array(n).fill(-1);
      const low = new Array(n).fill(0);
      let timer = 0;
      const result = [];
      for (let root = 0; root < n; root++) {
        if (found[root] !== -1) continue;
        found[root] = low[root] = timer++;
        const stack = [[root, -1, 0]];
        while (stack.length > 0) {
          const frame = stack[stack.length - 1];
          const [host, via, index] = frame;
          if (index < adj[host].length) {
            frame[2]++;
            const [next, id] = adj[host][index];
            if (id === via) continue;
            if (found[next] === -1) {
              found[next] = low[next] = timer++;
              stack.push([next, id, 0]);
            } else {
              low[host] = Math.min(low[host], found[next]);
            }
          } else {
            stack.pop();
            if (stack.length > 0) {
              const parent = stack[stack.length - 1][0];
              low[parent] = Math.min(low[parent], low[host]);
              if (low[host] > found[parent]) {
                result.push([Math.min(parent, host), Math.max(parent, host)]);
              }
            }
          }
        }
      }
      result.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
      return result;
    }
