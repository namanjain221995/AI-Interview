expected_concepts:
  - "dynamic programming over a directed acyclic graph"
  - "topological order (Kahn's algorithm) or memoised DFS"
  - "number of routes to a stage is the sum over its predecessors"
  - "modular arithmetic applied at every addition"
  - "only routes that start at the source count"
optimal_complexity: {time: "O(n + m) where m = edges.length", space: "O(n + m)"}
rubric:
  excellent: "Frames it as DP on a DAG, processes stages in topological order (or memoises a DFS and discusses recursion depth), seeds only the source, applies the modulus on every addition, handles source equal to target and unreachable targets, and states O(n + m)."
  good: "Correct DP with memoised DFS or topological order; may need a prompt about the modulus, recursion depth or stages that feed the target without being reachable from the source."
  weak: "Enumerates every route explicitly (exponential), applies the modulus only at the end after overflowing, or counts routes that start at other stages."
  criteria:
    correctness: "All tests pass, including counts larger than the modulus, unreachable targets and extra entry stages."
    efficiency: "Each stage and edge processed once; no route enumeration."
    code_quality: "Adjacency list and in-degrees built once, DP array clearly named, modulus as a named constant."
    edge_cases: "source equal to target, single stage, target upstream of source, dead-end branches, other stages with no inputs."
    communication: "Explains why a stage's count is final once all of its predecessors have been processed."
hints:
  - "The number of routes into a stage depends only on the number of routes into each stage that feeds it directly."
  - "Because the graph has no cycles you can process stages in an order where every stage comes after all stages that feed it, or memoise a recursive count of routes from each stage to the target."
  - "Compute a topological order with in-degrees and a queue, set the count of the source to one and every other stage to zero, and for each stage in order add its count to each successor modulo 1000000007, then return the count stored at the target."
followups:
  - "How would you count routes for many different source and target pairs efficiently?"
  - "How would you detect and report a cycle if the input were not guaranteed to be acyclic?"
  - "How would you find the single route with the fewest stages, or with the lowest total processing cost?"
  - "Why can't you simply count routes in a graph that has cycles?"
common_errors:
  - "Exploring every route with a plain DFS, which is exponential on layered pipelines."
  - "Applying the modulus only at the end, after the count has already overflowed."
  - "Starting the count from every stage with no inputs instead of only from the source."
  - "Recursive memoised DFS that exceeds the recursion limit on a long chain of stages."
