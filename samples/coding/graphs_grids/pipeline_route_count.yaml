version: 1
slug: pipeline_route_count
title: Count Pipeline Routes
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [data, backend, platform]
time_limit_minutes: 22
prompt_markdown: |
  ## Count Pipeline Routes

  A data platform describes each ETL pipeline as stages numbered `0` to `n - 1`. `edges[i] = [from, to]`
  means records leaving stage `from` can be sent on to stage `to`. The stage graph is **acyclic**: no
  sequence of edges ever returns to a stage it already visited.

  To size a lineage audit, the data team wants to know how many different ways a record can travel from
  stage `source` to stage `target`. A **route** is a sequence of stages that starts at `source`, ends at
  `target` and follows edges in their direction; two routes are different if their stage sequences differ.

  Return the number of routes **modulo `1000000007`**.

  - If `source == target` there is exactly one route (the record is already there), so return `1`.
  - If `target` cannot be reached from `source`, return `0`.

  ### Example 1
  ```
  Input:  n = 4, edges = [[0, 1], [0, 2], [1, 3], [2, 3]], source = 0, target = 3
  Output: 2
  Explanation: 0 -> 1 -> 3 and 0 -> 2 -> 3.
  ```

  ### Example 2
  ```
  Input:  n = 5, edges = [[0, 1], [1, 2], [0, 2], [2, 3], [1, 3], [3, 4]], source = 0, target = 4
  Output: 3
  Explanation: 0 -> 1 -> 2 -> 3 -> 4, 0 -> 1 -> 3 -> 4 and 0 -> 2 -> 3 -> 4.
  ```

  ### Example 3
  ```
  Input:  n = 3, edges = [[0, 1], [2, 1]], source = 0, target = 2
  Output: 0
  Explanation: Stage 2 only feeds into stage 1; nothing flows from stage 0 to stage 2.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= edges.length <= 5 * 10^4` and `edges[i].length == 2`
  - `0 <= from, to < n`, `from != to`, and no edge is listed twice.
  - The graph has no directed cycle.
  - `0 <= source, target < n`
  - The number of routes can be astronomically large, which is why the answer is taken modulo `1000000007`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_routes
  params:
    - {name: n, type: int}
    - {name: edges, type: "int[][]"}
    - {name: source, type: int}
    - {name: target, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    from collections import deque

    MOD = 1_000_000_007


    def count_routes(n: int, edges: list[list[int]], source: int, target: int) -> int:
        adj: list[list[int]] = [[] for _ in range(n)]
        indegree = [0] * n
        for u, v in edges:
            adj[u].append(v)
            indegree[v] += 1
        ways = [0] * n
        ways[source] = 1
        # Kahn's order guarantees every predecessor of a stage is final before the stage is pushed on.
        queue = deque(x for x in range(n) if indegree[x] == 0)
        while queue:
            x = queue.popleft()
            for y in adj[x]:
                ways[y] = (ways[y] + ways[x]) % MOD
                indegree[y] -= 1
                if indegree[y] == 0:
                    queue.append(y)
        return ways[target]
  javascript: |
    function countRoutes(n, edges, source, target) {
      const MOD = 1000000007;
      const adj = Array.from({ length: n }, () => []);
      const indegree = new Array(n).fill(0);
      for (const [u, v] of edges) {
        adj[u].push(v);
        indegree[v] += 1;
      }
      const ways = new Array(n).fill(0);
      ways[source] = 1;
      const queue = [];
      for (let x = 0; x < n; x++) if (indegree[x] === 0) queue.push(x);
      for (let head = 0; head < queue.length; head++) {
        const x = queue[head];
        for (const y of adj[x]) {
          ways[y] = (ways[y] + ways[x]) % MOD;
          indegree[y] -= 1;
          if (indegree[y] === 0) queue.push(y);
        }
      }
      return ways[target];
    }
