expected_concepts:
  - "connected-component labelling on a grid (BFS, iterative DFS or union-find)"
  - "precomputing component sizes keyed by label"
  - "de-duplicating neighbouring components with a set"
  - "handling the all-full and all-empty cases"
optimal_complexity: {time: "O(R * C)", space: "O(R * C)"}
rubric:
  excellent: "Labels every array once with its size, then for each empty slot sums the sizes of its distinct neighbouring labels plus one, takes the maximum together with the largest existing array, handles full and empty roofs, and states O(R * C)."
  good: "Correct labelling approach after a hint about counting the same array twice or about the roof with no empty slot."
  weak: "Re-runs a full flood fill for every empty slot (O((R * C)^2)), double-counts an array touching a slot on several sides, or returns 0 for an empty roof."
  criteria:
    correctness: "All tests pass, including a slot surrounded by one array, diagonals and full or empty roofs."
    efficiency: "Linear in the number of slots; each panel is visited once while labelling."
    code_quality: "Separate labelling and evaluation phases, clear label grid and sizes list, shared neighbour offsets."
    edge_cases: "Single cell, all ones, all zeros, single row and a slot touching the same array from several directions."
    communication: "Explains why labels (not just sizes) are needed to avoid counting the same array more than once."
hints:
  - "First understand the roof as it is today: which panels already belong to the same array, and how big is each array?"
  - "If every panel knows which array it belongs to and how big that array is, adding one panel in an empty slot only needs a look at its four neighbours."
  - "Flood-fill once to give every array an id and record each id's size. Then for every empty slot, collect the distinct ids among its four neighbours, add their sizes plus one, and keep the maximum. Also compare with the largest existing array so a fully covered roof is handled."
followups:
  - "How would the solution change if you could install up to k extra panels?"
  - "Panels are added one at a time over months; how would you report the largest array after each installation?"
  - "What changes if diagonal neighbours were also wired together?"
  - "How would you find the slot whose installation merges the largest number of separate arrays?"
common_errors:
  - "Adding the size of the same array once per side when it touches the empty slot from several directions."
  - "Returning 0 instead of 1 when the roof has no panels."
  - "Forgetting the case with no empty slots and returning a value smaller than the whole roof."
  - "Running a new flood fill for every empty slot, which is far too slow on a 500 x 500 roof."
  - "Recursive flood fill overflowing the call stack on large roofs."
