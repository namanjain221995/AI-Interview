prompt_markdown: |
  ## Largest Panel Array With One Addition

  A facilities team plans solar panels on a flat rooftop divided into a grid of slots:
  `grid[r][c]` is `1` when a panel is already installed in that slot and `0` when the slot is empty.
  Panels in slots that share an **edge** (up, down, left or right) are wired together; a maximal group
  of panels wired together this way is called an **array**. Diagonal neighbours are not wired.

  The budget covers installing **at most one** additional panel in an empty slot. Return the size
  (number of panels) of the **largest array** that can exist on the roof afterwards. If every slot
  already has a panel, the answer is the size of the whole roof; if there are no panels yet, installing
  one gives an array of size `1`.

  ### Example 1
  ```
  Input:  grid = [[1, 1, 0, 0],
                  [0, 0, 0, 1],
                  [1, 0, 1, 1]]
  Output: 5
  Explanation: The arrays have sizes 2 (top left), 1 (bottom left) and 3 (bottom right). Installing
               at row 2, column 1 (0-based) wires the 1-panel and 3-panel arrays together:
               1 + 3 + 1 = 5.
  ```

  ### Example 2
  ```
  Input:  grid = [[1, 1, 1],
                  [1, 1, 1]]
  Output: 6
  ```

  ### Example 3
  ```
  Input:  grid = [[0, 0],
                  [0, 0]]
  Output: 1
  ```

  ### Constraints
  - `1 <= grid.length, grid[0].length <= 500`
  - All rows have the same length
  - `grid[r][c]` is `0` or `1`
languages: [python, javascript, typescript, java, go, cpp]
