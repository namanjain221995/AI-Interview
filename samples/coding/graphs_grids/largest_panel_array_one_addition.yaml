reference_solutions:
  python: |
    def largest_array_with_one_more(grid: list[list[int]]) -> int:
        rows, cols = len(grid), len(grid[0])
        label = [[-1] * cols for _ in range(rows)]
        sizes: list[int] = []
        # Label every existing array (4-connected group of 1s) with an id and record its size.
        for r in range(rows):
            for c in range(cols):
                if grid[r][c] == 1 and label[r][c] == -1:
                    group = len(sizes)
                    label[r][c] = group
                    stack = [(r, c)]
                    size = 0
                    while stack:
                        cr, cc = stack.pop()
                        size += 1
                        for nr, nc in ((cr + 1, cc), (cr - 1, cc), (cr, cc + 1), (cr, cc - 1)):
                            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1 and label[nr][nc] == -1:
                                label[nr][nc] = group
                                stack.append((nr, nc))
                    sizes.append(size)
        best = max(sizes, default=0)
        # Try installing a panel in each empty slot: it joins the distinct neighbouring arrays.
        for r in range(rows):
            for c in range(cols):
                if grid[r][c] == 0:
                    groups = set()
                    for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                        if 0 <= nr < rows and 0 <= nc < cols and label[nr][nc] != -1:
                            groups.add(label[nr][nc])
                    best = max(best, 1 + sum(sizes[g] for g in groups))
        return best
  javascript: |
    function largestArrayWithOneMore(grid) {
      const rows = grid.length;
      const cols = grid[0].length;
      const label = Array.from({ length: rows }, () => new Array(cols).fill(-1));
      const sizes = [];
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] !== 1 || label[r][c] !== -1) continue;
          const group = sizes.length;
          label[r][c] = group;
          const stack = [[r, c]];
          let size = 0;
          while (stack.length > 0) {
            const [cr, cc] = stack.pop();
            size++;
            for (const [dr, dc] of steps) {
              const nr = cr + dr;
              const nc = cc + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 1 && label[nr][nc] === -1) {
                label[nr][nc] = group;
                stack.push([nr, nc]);
              }
            }
          }
          sizes.push(size);
        }
      }
      let best = sizes.length ? Math.max(...sizes) : 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] !== 0) continue;
          const groups = new Set();
          for (const [dr, dc] of steps) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && label[nr][nc] !== -1) groups.add(label[nr][nc]);
          }
          let total = 1;
          for (const g of groups) total += sizes[g];
          best = Math.max(best, total);
        }
      }
      return best;
    }
