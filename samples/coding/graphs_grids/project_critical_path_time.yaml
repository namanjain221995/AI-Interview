  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def critical_tasks(durations: list[int], deps: list[list[int]]) -> list[int]:
        n = len(durations)
        waiting = [0] * n
        after = [[] for _ in range(n)]
        for a, b in deps:
            waiting[a] += 1
            after[b].append(a)
        queue = deque(i for i in range(n) if waiting[i] == 0)
        order = []
        earliest_start = [0] * n
        while queue:
            task = queue.popleft()
            order.append(task)
            finish = earliest_start[task] + durations[task]
            for nxt in after[task]:
                earliest_start[nxt] = max(earliest_start[nxt], finish)
                waiting[nxt] -= 1
                if waiting[nxt] == 0:
                    queue.append(nxt)
        if len(order) < n:
            return []
        project_end = max(earliest_start[i] + durations[i] for i in range(n))
        latest_finish = [project_end] * n
        for task in reversed(order):
            for nxt in after[task]:
                latest_finish[task] = min(latest_finish[task], latest_finish[nxt] - durations[nxt])
        return [i for i in range(n) if latest_finish[i] - durations[i] == earliest_start[i]]
  javascript: |
    function criticalTasks(durations, deps) {
      const n = durations.length;
      const waiting = new Array(n).fill(0);
      const after = Array.from({ length: n }, () => []);
      for (const [a, b] of deps) {
        waiting[a]++;
        after[b].push(a);
      }
      const order = [];
      for (let i = 0; i < n; i++) if (waiting[i] === 0) order.push(i);
      const earliestStart = new Array(n).fill(0);
      for (let head = 0; head < order.length; head++) {
        const task = order[head];
        const finish = earliestStart[task] + durations[task];
        for (const next of after[task]) {
          earliestStart[next] = Math.max(earliestStart[next], finish);
          waiting[next]--;
          if (waiting[next] === 0) order.push(next);
        }
      }
      if (order.length < n) return [];
      let projectEnd = 0;
      for (let i = 0; i < n; i++) projectEnd = Math.max(projectEnd, earliestStart[i] + durations[i]);
      const latestFinish = new Array(n).fill(projectEnd);
      for (let k = n - 1; k >= 0; k--) {
        const task = order[k];
        for (const next of after[task]) {
          latestFinish[task] = Math.min(latestFinish[task], latestFinish[next] - durations[next]);
        }
      }
      const result = [];
      for (let i = 0; i < n; i++) {
        if (latestFinish[i] - durations[i] === earliestStart[i]) result.push(i);
      }
      return result;
    }
