title: "Project Critical Tasks"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Project Critical Tasks

  A migration project has `n` tasks numbered `0` to `n - 1`; task `i` takes `durations[i]` hours.
  Each pair `[a, b]` in `deps` means task `a` can start only after task `b` has finished. Any number of
  tasks may run in parallel, and every task starts as early as its prerequisites allow. The project
  manager wants to know which tasks have **no slack at all**, so they can be watched closely.

  Use these definitions (all times in hours from the project start):

  - the **earliest start** of a task is `0` if it has no prerequisites, otherwise the latest finish time
    among its prerequisites; its **earliest finish** is the earliest start plus its duration;
  - the **project end** is the largest earliest finish over all tasks;
  - the **latest finish** of a task is the project end if no task waits for it, otherwise the smallest
    latest start among the tasks waiting for it; its **latest start** is the latest finish minus its
    duration.

  A task is **critical** when its latest start equals its earliest start. Return the critical task
  numbers in ascending order. If the dependencies contain a cycle (including a task that depends on
  itself), no schedule exists: return an empty list. The same pair may appear more than once.

  ### Example 1
  ```
  Input:  durations = [3, 2, 4, 1], deps = [[1, 0], [2, 0], [3, 1], [3, 2]]
  Output: [0, 2, 3]
  Explanation: Task 0 runs 0-3, task 2 runs 3-7 and task 3 runs 7-8. Task 1 finishes at 5 but task 3 only starts at 7, so task 1 has 2 hours of slack.
  ```

  ### Example 2
  ```
  Input:  durations = [2, 5, 5], deps = []
  Output: [1, 2]
  Explanation: The project ends at hour 5; task 0 could start up to 3 hours late without moving the end.
  ```

  ### Example 3
  ```
  Input:  durations = [1, 1], deps = [[0, 1], [1, 0]]
  Output: []
  Explanation: Each task waits for the other, so no schedule exists.
  ```

  ### Constraints
  - `1 <= n <= 10^4`, where `n = durations.length`
  - `0 <= durations[i] <= 10^6`
  - `0 <= deps.length <= 5 * 10^4`, `deps[i].length == 2` and `0 <= a, b < n`
  - Times can exceed the 32-bit integer range; use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
signature:
