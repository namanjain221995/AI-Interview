expected_concepts:
  - "topological order of the dependency graph (Kahn's algorithm or DFS)"
  - "forward pass for earliest start and finish times"
  - "backward pass in reverse topological order for latest start times"
  - "zero slack identifies critical tasks, including zero-duration ones"
  - "cycle detection and 64-bit time arithmetic"
optimal_complexity: {time: "O(n + E) for E dependency pairs", space: "O(n + E)"}
rubric:
  excellent: "Computes a topological order once, runs a forward pass for earliest times and a backward pass in reverse order for latest times, selects tasks with zero slack, returns an empty list on a cycle, uses 64-bit times and explains the O(n + E) bound."
  good: "Correct critical set but with a less direct approach, for example recomputing the project end per task or needing a hint for the backward pass."
  weak: "Returns only one longest chain, treats every task on some long path as critical without checking slack, mishandles zero-duration tasks, or does not detect cycles."
  criteria:
    correctness: "All tests pass, including ties between parallel chains, zero durations and duplicate pairs."
    efficiency: "Two linear passes over the graph after one topological sort."
    code_quality: "Separate, clearly named arrays for earliest start and latest finish."
    edge_cases: "Single task, all zero durations, self-dependency, several disconnected parts of the project."
    communication: "Explains slack and why the backward pass must run in reverse topological order."
hints:
  - "Work out when each task can start at the earliest, then ask how late each task could start without pushing back the end of the whole project."
  - "Both questions need the tasks in dependency order: earliest times flow forward from tasks with no prerequisites, latest times flow backward from the tasks nobody waits for. A topological sort gives that order and also exposes cycles."
  - "Build a topological order with remaining-prerequisite counts and return an empty list if it does not include every task. Walk the order forwards to set each task's earliest start as the largest earliest finish among its prerequisites, and take the project end as the largest earliest finish. Then walk the order backwards, setting each task's latest finish to the smallest latest start among the tasks waiting on it, or the project end if none do. Report the tasks whose latest start equals their earliest start."
followups:
  - "How would you return the slack of every task instead of only the critical ones?"
  - "If you could shorten one task by an hour, how would you choose which one to shorten?"
  - "How would the answer change if only k tasks could run in parallel?"
  - "How would you print one critical path as an ordered chain of tasks?"
common_errors:
  - "Returning just one longest chain when parallel chains tie for the project end."
  - "Running the backward pass in the wrong order, so latest times use values that are not final yet."
  - "Forgetting that a zero-duration task can still be critical."
  - "Using 32-bit integers for times on long chains of large durations."
