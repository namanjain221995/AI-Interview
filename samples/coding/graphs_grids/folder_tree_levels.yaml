difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [general, frontend, fullstack, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Folder Tree Levels

  A shared drive stores `n` folders with ids `0` to `n - 1`. Its metadata export gives one array:
  `parent[i]` is the id of the folder that directly contains folder `i`, and exactly one folder has
  `parent[i] == -1` - the top-level folder of the drive. Every other folder sits somewhere below it, so
  the folders form a single tree. Ids are assigned arbitrarily: a folder's parent may have a **larger**
  id than the folder itself.

  The drive's web client renders the folder browser one depth at a time. The top-level folder is at
  depth `0`, the folders directly inside it are at depth `1`, and so on.

  Return a list of levels: element `k` is the list of folder ids at depth `k`, sorted **in ascending
  order**. The first element is always the single top-level folder, and there are no empty levels.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2]
  Output: [[0], [1, 2], [3, 4, 5]]
  ```

  ### Example 2
  ```
  Input:  parent = [3, 3, -1, 2, 0]
  Output: [[2], [3], [0, 1], [4]]
  Explanation: Folder 2 is the top level; 3 is inside 2; 0 and 1 are inside 3; 4 is inside 0.
  ```

  ### Constraints
  - `1 <= parent.length <= 10^4`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]` and `parent[i] != i`
  - Following parents from any folder reaches the top-level folder (no loops)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: levels_by_depth
  params:
    - {name: parent, type: "int[]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def levels_by_depth(parent: list[int]) -> list[list[int]]:
        n = len(parent)
        children: list[list[int]] = [[] for _ in range(n)]
        root = -1
        for folder, up in enumerate(parent):
            if up == -1:
                root = folder
            else:
                children[up].append(folder)
        levels: list[list[int]] = []
        current = [root]
        while current:
            current.sort()
            levels.append(current)
            nxt: list[int] = []
            for folder in current:
                nxt.extend(children[folder])
            current = nxt
        return levels
  javascript: |
    function levelsByDepth(parent) {
      const n = parent.length;
      const children = Array.from({ length: n }, () => []);
      let root = -1;
      for (let folder = 0; folder < n; folder++) {
        if (parent[folder] === -1) root = folder;
        else children[parent[folder]].push(folder);
      }
      const levels = [];
      let current = [root];
      while (current.length > 0) {
        current.sort((x, y) => x - y);
        levels.push(current);
        const next = [];
        for (const folder of current) {
          for (const child of children[folder]) next.push(child);
        }
        current = next;
      }
      return levels;
    }
