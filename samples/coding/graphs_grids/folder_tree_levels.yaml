expected_concepts:
  - "building child lists from a parent array"
  - "breadth-first traversal level by level"
  - "sorting each level for a deterministic order"
  - "finding the root instead of assuming it is folder 0"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Converts the parent array into child lists in one pass, locates the root, walks the tree one level at a time, sorts each level and explains the O(n log n) cost from sorting (or O(n) with a counting-style approach)."
  good: "Correct level-order result, possibly after fixing the assumption that the root is folder 0 or that levels arrive sorted."
  weak: "Recomputes every folder's depth by walking to the root each time without discussing the quadratic worst case, assumes parents have smaller ids, or returns levels unsorted."
  criteria:
    correctness: "All tests pass, including a root with a large id and levels whose folders come from several parents."
    efficiency: "Each folder is visited once; only per-level sorting adds a log factor."
    code_quality: "Separates building the child lists from the traversal with clear names (children, current, next level)."
    edge_cases: "Handles a single folder, a long chain and a wide star."
    communication: "Explains why breadth-first order matches depth and why each level still needs sorting."
hints:
  - "The parent array tells you how to go up; to list folders by depth you need a way to go down."
  - "Build, for every folder, the list of folders directly inside it, find the top-level folder, and process the tree one depth at a time."
  - "Start with a list holding only the root; repeatedly sort the current list, append it to the answer and form the next list from all children of the current folders, stopping when the next list is empty."
followups:
  - "How would you compute each folder's depth if you could only use the parent array and constant extra memory per query?"
  - "The client loads one level at a time over the network; how would you design the API?"
  - "How would you detect and report a malformed export that contains a loop or two top-level folders?"
  - "What would change if you had to list the levels from the deepest up to the root?"
common_errors:
  - "Assuming the root is folder 0 or that every parent id is smaller than its child's id."
  - "Grouping children per parent and concatenating without sorting the whole level."
  - "Walking up from every folder to compute its depth, which is quadratic on a long chain."
  - "Appending an empty final level."
