expected_concepts:
  - building a dependency graph from parsed formulas
  - topological order (Kahn's algorithm) or DFS with three colours and memoisation
  - cycle detection and propagation to every dependent cell
  - memoisation so shared sub-formulas are evaluated once, not exponentially often
  - 64-bit arithmetic (BigInt in JavaScript) and string output
optimal_complexity: {time: O(n + t) where t is the total number of terms, space: O(n + t)}
rubric:
  excellent: Parses each formula into a constant plus a list of references, builds the dependency graph, evaluates in topological order (or memoised DFS with an in-progress state), marks every cell left on or behind a cycle as #CYCLE, counts repeated references, treats undefined names as 0, uses 64-bit or arbitrary-precision sums and states O(n + t).
  good: Correct memoised DFS or Kahn solution with minor slips (for example missing the cells that only depend on a cycle, or losing precision above 2^53 in JavaScript) fixed after looking at the examples.
  weak: Re-evaluates references recursively without memoisation (exponential on shared references), loops forever on cycles, or only flags the cells that close the cycle.
  criteria:
    correctness: Every value matches, cycle members and their dependents are #CYCLE, undefined names count as 0 and duplicates count each time.
    efficiency: Each cell is evaluated once; total work linear in the number of terms.
    code_quality: Parsing separated from evaluation, a name-to-index map and clear state for pending or in-progress cells.
    edge_cases: Self references, negative literals, formulas made only of numbers, references to cells listed later and values beyond 2^53.
    communication: Explains how cycles are detected and why a cell that depends on a cycle cannot have a value.
hints:
  - Each formula is a constant plus references to other cells; think of the references as edges in a graph and ask in which order the cells can be computed.
  - A cell can be computed once every cell it references is known; cells that never reach that point are exactly those on a cycle or behind one. Remember that the same reference can be shared by many cells, so each cell should be computed only once.
  - Count each cell's unresolved references to defined cells, start a queue with the cells that have none, and when a cell is finished add its value to every cell that references it (once per occurrence) and release those whose count reaches zero; cells never released are "#CYCLE". Use 64-bit (or BigInt) sums.
followups:
  - How would you recalculate efficiently when the user edits a single cell?
  - How would you support subtraction, multiplication and ranges such as SUM(A1:A10)?
  - How would you report one concrete cycle path to the user instead of just #CYCLE?
  - What changes if the sheet has millions of cells and does not fit in memory?
common_errors:
  - Recursing into references without memoisation, which explodes on chains that reference the same cell twice.
  - Marking only the cells on the cycle and computing a value for cells that depend on it.
  - Treating undefined cell names as an error or as a cycle instead of 0.
  - Counting a repeated reference only once.
  - Using JavaScript Number or 32-bit integers, which lose precision for large sums.
  - Assuming cells are listed in dependency order.
