version: 1
slug: spreadsheet_formula_evaluation
title: Spreadsheet Formula Evaluation
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [frontend, fullstack, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Spreadsheet Formula Evaluation

  You are building the recalculation engine for a lightweight budgeting spreadsheet in a web app. The
  sheet is sent to you as two parallel lists: `cells[i]` is the name of a cell (such as `"B2"`) and
  `formulas[i]` is what the user typed into it. Each entry of `formulas` is one of:

  - an **integer literal**, optionally negative, such as `"42"`, `"0"` or `"-7"`;
  - a **formula**: `'='` followed by one or more terms joined by `'+'`, such as `"=A1+B2+100"`. Each term
    is either a cell name or a non-negative integer. There are no spaces, parentheses or other operators.

  A formula's value is the sum of its terms. A term that names a cell **not** present in `cells` counts as
  `0`. A cell referenced several times in one formula is added once per occurrence.

  Some sheets contain circular references. A cell whose formula takes part in a reference cycle
  (including a cell that references itself), or that depends directly or indirectly on such a cell, has
  no value and must be reported as `"#CYCLE"`.

  Return a list of the same length as `cells` where entry `i` is the value of `cells[i]` written as a
  decimal string (with a leading `'-'` when negative), or `"#CYCLE"`. Values can be larger than 32 bits.

  ### Example 1
  ```
  Input:  cells = ["A1", "A2", "B1", "C3"], formulas = ["5", "=A1+10", "=A1+A2+Z9", "=B1+B1"]
  Output: ["5", "15", "20", "40"]
  Explanation: Z9 is not defined, so it counts as 0; C3 adds B1 twice.
  ```

  ### Example 2
  ```
  Input:  cells = ["A1", "B1", "C1", "D1"], formulas = ["=B1+1", "=A1+1", "=A1+2", "7"]
  Output: ["#CYCLE", "#CYCLE", "#CYCLE", "7"]
  Explanation: A1 and B1 reference each other, and C1 depends on A1.
  ```

  ### Example 3
  ```
  Input:  cells = ["X1", "X2"], formulas = ["=X1", "=3+4"]
  Output: ["#CYCLE", "7"]
  Explanation: X1 references itself; X2 is a formula made only of numbers.
  ```

  ### Constraints
  - `1 <= cells.length == formulas.length <= 1000`
  - cell names are distinct and consist of 1 to 3 uppercase letters followed by 1 to 4 digits
  - a formula has at most 50 terms; integer literals and numeric terms are at most `10^15` in absolute value
  - every value that is not `"#CYCLE"`, and every partial sum while adding up a formula, fits in a signed 64-bit integer
  - cells may appear in any order; a cell can be referenced before it is listed
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: evaluate_sheet
  params:
    - {name: cells, type: "string[]"}
    - {name: formulas, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def evaluate_sheet(cells: list[str], formulas: list[str]) -> list[str]:
        index = {name: i for i, name in enumerate(cells)}
        n = len(cells)
        value = [0] * n
        dependents: list[list[int]] = [[] for _ in range(n)]
        pending = [0] * n  # references to defined cells not yet resolved
        for i, text in enumerate(formulas):
            if not text.startswith("="):
                value[i] = int(text)
                continue
            for term in text[1:].split("+"):
                if term[0].isdigit():
                    value[i] += int(term)
                elif term in index:
                    dependents[index[term]].append(i)
                    pending[i] += 1
                # an undefined cell name contributes 0
        # Kahn's algorithm: a cell is final once every cell it references is final.
        ready = [i for i in range(n) if pending[i] == 0]
        for cell in ready:  # the list grows while we walk it
            for user in dependents[cell]:
                value[user] += value[cell]
                pending[user] -= 1
                if pending[user] == 0:
                    ready.append(user)
        # Cells never released are on a cycle or depend on one.
        return [str(value[i]) if pending[i] == 0 else "#CYCLE" for i in range(n)]
  javascript: |
    function evaluateSheet(cells, formulas) {
      const n = cells.length;
      const index = new Map(cells.map((name, i) => [name, i]));
      // BigInt keeps 64-bit sums exact (Number loses precision above 2^53).
      const value = new Array(n).fill(0n);
      const dependents = Array.from({ length: n }, () => []);
      const pending = new Array(n).fill(0); // references to defined cells not yet resolved
      formulas.forEach((text, i) => {
        if (!text.startsWith("=")) {
          value[i] = BigInt(text);
          return;
        }
        for (const term of text.slice(1).split("+")) {
          if (term[0] >= "0" && term[0] <= "9") {
            value[i] += BigInt(term);
          } else if (index.has(term)) {
            dependents[index.get(term)].push(i);
            pending[i]++;
          }
          // an undefined cell name contributes 0
        }
      });
      // Kahn's algorithm: a cell is final once every cell it references is final.
      const ready = [];
      for (let i = 0; i < n; i++) if (pending[i] === 0) ready.push(i);
      for (let head = 0; head < ready.length; head++) {
        const cell = ready[head];
        for (const user of dependents[cell]) {
          value[user] += value[cell];
          pending[user]--;
          if (pending[user] === 0) ready.push(user);
        }
      }
      // Cells never released are on a cycle or depend on one.
      return value.map((v, i) => (pending[i] === 0 ? v.toString() : "#CYCLE"));
    }
