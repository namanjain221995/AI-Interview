  - {id: t2, args: [["S...b", ".###.", "b..#E"]], expected: 5, description: "Example 2 - entering the lift from the far pad beats walking"}
  - {id: t3, args: [["S#E"]], expected: -1, description: "Example 3 - no route and no pads"}
