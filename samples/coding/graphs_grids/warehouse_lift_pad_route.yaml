version: 1
slug: warehouse_lift_pad_route
title: Warehouse Route With Lift Pads
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, general, mobile]
time_limit_minutes: 25
prompt_markdown: |
  ## Warehouse Route With Lift Pads

  A picking robot's routing service receives the warehouse floor as `layout`, a list of equal-length
  strings. Each character is one cell:

  - `S`: the robot's starting cell (exactly one).
  - `E`: the packing station the robot must reach (exactly one).
  - `#`: a rack; the robot can never enter it.
  - `.`: an open aisle.
  - a lowercase letter (`a` to `z`): a **lift pad**. Every letter that is used appears **exactly twice**,
    and the two cells with the same letter are **twin pads** connected by a freight lift.

  In one **move** the robot either steps **up, down, left or right** into any cell that is not a rack
  (pads, aisles, `S` and `E` can all be entered), or, while standing on a lift pad, rides the lift to its
  twin pad. Riding the lift is optional: the robot may also walk over a pad like an aisle.

  Return the minimum number of moves needed to go from `S` to `E`, or `-1` if `E` cannot be reached.

  ### Example 1
  ```
  Input:  layout = ["S.a#", "###.", ".a.E"]
  Output: 5
  Explanation: Walk two cells to the pad at (0, 2), ride the lift to (2, 1), then walk two cells to E.
  ```

  ### Example 2
  ```
  Input:  layout = ["S...b", ".###.", "b..#E"]
  Output: 5
  Explanation: Walking along the top row takes 6 moves. Walking down to the pad at (2, 0) and riding to (0, 4)
  takes 2 + 1 + 2 = 5.
  ```

  ### Example 3
  ```
  Input:  layout = ["S#E"]
  Output: -1
  ```

  ### Constraints
  - `1 <= layout.length <= 100` and `1 <= layout[i].length <= 100`; all strings have the same length.
  - Every character is `S`, `E`, `#`, `.` or a lowercase letter.
  - `S` and `E` each appear exactly once; every lowercase letter appears either zero or exactly two times.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_moves_with_lifts
  params:
    - {name: layout, type: "string[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def min_moves_with_lifts(layout: list[str]) -> int:
        rows, cols = len(layout), len(layout[0])
        pads: dict[str, list[tuple[int, int]]] = {}
        start = end = (0, 0)
        for r, line in enumerate(layout):
            for c, ch in enumerate(line):
                if ch == "S":
                    start = (r, c)
                elif ch == "E":
                    end = (r, c)
                elif "a" <= ch <= "z":
                    pads.setdefault(ch, []).append((r, c))
        twin: dict[tuple[int, int], tuple[int, int]] = {}
        for first, second in pads.values():
            twin[first] = second
            twin[second] = first
        dist = [[-1] * cols for _ in range(rows)]
        dist[start[0]][start[1]] = 0
        queue = deque([start])
        while queue:
            cell = queue.popleft()
            r, c = cell
            if cell == end:
                return dist[r][c]
            options = [(r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)]
            if cell in twin:
                options.append(twin[cell])
            for nr, nc in options:
                if 0 <= nr < rows and 0 <= nc < cols and layout[nr][nc] != "#" and dist[nr][nc] == -1:
                    dist[nr][nc] = dist[r][c] + 1
                    queue.append((nr, nc))
        return -1
  javascript: |
    function minMovesWithLifts(layout) {
      const rows = layout.length;
      const cols = layout[0].length;
      const pads = new Map();
      let start = 0;
      let end = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ch = layout[r][c];
          const id = r * cols + c;
          if (ch === "S") start = id;
          else if (ch === "E") end = id;
          else if (ch >= "a" && ch <= "z") {
            if (!pads.has(ch)) pads.set(ch, []);
            pads.get(ch).push(id);
          }
        }
      }
      const twin = new Map();
      for (const [a, b] of pads.values()) {
        twin.set(a, b);
        twin.set(b, a);
      }
      const dist = new Array(rows * cols).fill(-1);
      dist[start] = 0;
      const queue = [start];
      for (let head = 0; head < queue.length; head++) {
        const id = queue[head];
        if (id === end) return dist[id];
        const r = Math.floor(id / cols);
        const c = id % cols;
        const options = [];
        if (r > 0) options.push(id - cols);
        if (r < rows - 1) options.push(id + cols);
        if (c > 0) options.push(id - 1);
        if (c < cols - 1) options.push(id + 1);
        if (twin.has(id)) options.push(twin.get(id));
        for (const next of options) {
          const nr = Math.floor(next / cols);
          const nc = next % cols;
          if (layout[nr][nc] !== "#" && dist[next] === -1) {
            dist[next] = dist[id] + 1;
            queue.push(next);
          }
        }
      }
      return -1;
    }
