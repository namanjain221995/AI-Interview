  - {id: t5, hidden: true, args: [["S", ".", "a", "#", "a", "E"]], expected: 4, description: "Single-column layout split by a rack, lift jumps over it"}
  - {id: t6, hidden: true, args: [["S.a.E", ".....", "a...."]], expected: 4, description: "Decoy pad - walking straight is shorter than using the lift"}
  - {id: t7, hidden: true, args: [["Sa#.E", "####b", "ba###"]], expected: 5, description: "Two lifts in sequence are required"}
  - {id: t8, hidden: true, args: [["S.a#E", "####.", "a#..."]], expected: -1, description: "The only lift leads into a sealed pocket - E unreachable"}
  - {id: t9, hidden: true, args: [["Sa.ba.bE"]], expected: 5, description: "Single row with interleaved pad pairs - walking over pads and riding both work"}
  - {id: t10, hidden: true, args: [["S............................q", "#############################.", "..........z...................", ".#############################", "..........z...................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "q.............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "..............................", "#############################E"]], expected: 184, description: "30 x 30 serpentine maze with a long-distance lift shortcut and a decoy lift"}
expected_concepts:
  - "breadth-first search for shortest paths with unit-cost moves"
  - "graph modelling: grid neighbours plus an extra edge between twin pads"
  - "precomputing pad pairs in a hash map"
  - "visited marking when a cell is enqueued"
  - "returning -1 when the queue empties"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Models the floor as a graph whose edges are the four grid steps plus the lift between twin pads, precomputes the twin of every pad, runs a single BFS with visited marking on enqueue, treats the lift as optional and states O(rows * cols) time and space."
  good: "Correct BFS with lift handling; may need a prompt about marking visited on enqueue, the -1 case or scanning for the twin pad efficiently."
  weak: "Uses DFS and returns the first route found, forces a lift ride whenever the robot steps on a pad, searches the whole grid for the twin on every visit without noticing the cost, or forgets that pads can be walked over."
  criteria:
    correctness: "All tests pass, including routes that need two lifts, decoy pads where walking is shorter and unreachable stations."
    efficiency: "Each cell enqueued once; twin lookups in constant time."
    code_quality: "Parsing, twin map and BFS kept as separate steps; neighbour generation in one place."
    edge_cases: "S next to E, single-row and single-column layouts, pads that lead into sealed areas, no pads at all."
    communication: "Explains why BFS gives the minimum when every move, walking or riding, costs one."
hints:
  - "Every move costs the same, whether it is a step or a lift ride, so think of the floor as a graph and ask which classic search finds the fewest moves."
  - "A pad cell simply has one extra neighbour, its twin. Find all pad pairs before the search so that this neighbour can be looked up instantly."
  - "Scan the layout once to locate S, E and the two cells of each letter, build a map from each pad cell to its twin, then run BFS from S where a cell's options are its four in-bounds non-rack neighbours plus its twin if it is a pad, marking cells visited as you enqueue them and returning the distance when E is dequeued or -1 when the queue runs out."
followups:
  - "How would the solution change if a lift ride took three moves instead of one?"
  - "What if each pad could be used only once?"
  - "How would you return the actual route, not just its length?"
  - "If thousands of route requests arrive for the same layout with different start cells, what would you precompute?"
common_errors:
  - "Forcing the robot to ride the lift whenever it lands on a pad."
  - "Marking cells visited only when they are dequeued, which enqueues the same cell many times."
  - "Using depth-first search, which finds a route but not the shortest one."
  - "Treating S or E as blocked because they are not '.' characters."
