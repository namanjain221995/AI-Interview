  - {id: t4, hidden: true, args: [1, [[0, 0]]], expected: [], description: "Single service that calls itself is not an entry point"}
  - {id: t5, hidden: true, args: [4, []], expected: [0, 1, 2, 3], description: "No calls at all - every service is an entry point"}
  - {id: t6, hidden: true, args: [6, [[5, 0], [5, 0], [4, 0], [4, 1], [1, 1], [3, 2]]], expected: [3, 4, 5], description: "Duplicates, a self-call and high-id callers; answer must be sorted ascending"}
  - {id: t7, hidden: true, args: [5, [[0, 1], [0, 2], [0, 3], [0, 4]]], expected: [0], description: "Fan-out from one service - only the caller is an entry point"}
