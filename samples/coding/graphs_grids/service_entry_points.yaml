version: 1
slug: service_entry_points
title: Find Service Entry Points
difficulty: easy
competency_keys: [data_structures, problem_solving]
role_tags: [backend, platform, sre, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Find Service Entry Points

  A platform team wants to know where traffic enters its microservice mesh. Services are numbered `0` to
  `n - 1`. Distributed tracing produced `calls`, where each record `[caller, callee]` means service
  `caller` sent at least one request to service `callee`. The same record can appear many times. A
  service that calls itself (for example, a retry loop) counts as being called.

  An **entry point** is a service that no service calls at all, so its traffic must come from outside
  the mesh (a gateway, a scheduler or a user). Return the ids of all entry points in **ascending
  order**. Return an empty list if every service is called by some service.

  ### Example 1
  ```
  Input:  n = 5, calls = [[0, 1], [0, 2], [3, 2], [2, 4]]
  Output: [0, 3]
  Explanation: Services 1, 2 and 4 are called; 0 and 3 are never called.
  ```

  ### Example 2
  ```
  Input:  n = 3, calls = [[0, 1], [1, 2], [2, 0]]
  Output: []
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= calls.length <= 2 * 10^4`
  - `calls[i].length == 2` and `0 <= caller, callee < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: entry_points
  params:
    - {name: n, type: "int"}
    - {name: calls, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def entry_points(n: int, calls: list[list[int]]) -> list[int]:
        called = [False] * n
        for _caller, callee in calls:
            called[callee] = True
        return [service for service in range(n) if not called[service]]
  javascript: |
    function entryPoints(n, calls) {
      const called = new Array(n).fill(false);
      for (const [, callee] of calls) called[callee] = true;
      const result = [];
      for (let s = 0; s < n; s++) if (!called[s]) result.push(s);
      return result;
    }
