expected_concepts:
  - "in-degree of nodes in a directed graph"
  - "boolean or count array indexed by node id"
  - "single pass over edges then over nodes"
  - "self-loops count as incoming edges"
optimal_complexity: {time: "O(n + m)", space: "O(n)"}
rubric:
  excellent: "Marks every callee in one pass over the calls, collects unmarked ids in a second pass over 0..n-1 (naturally ascending), handles self-calls and duplicates and states O(n + m) time with O(n) space."
  good: "Correct answer using a set of callees or full in-degree counts, perhaps with an unnecessary sort."
  weak: "Only considers services that appear in the call records, treats self-calls as not counting, or checks every pair of services in nested loops."
  criteria:
    correctness: "All tests pass, including no calls, self-calls and the all-called cycle."
    efficiency: "Linear in services plus records; no per-service scan of all records."
    code_quality: "Short, clear loops; meaningful names such as called or in_degree."
    edge_cases: "Single service, self-call, duplicates, services absent from all records."
    communication: "Relates entry points to in-degree zero and explains why the output is already sorted."
hints:
  - "Being an entry point depends only on whether anything calls a service, not on what the service itself calls."
  - "Make one pass over the records to note which services appear as a callee, then decide for each service id separately."
  - "Create a boolean array of size n, set the callee position to true for every record (a self-call included), then walk the ids from 0 to n - 1 and collect those still false; that walk already gives ascending order."
followups:
  - "How would you list services that are never called and also never call anything?"
  - "How would you find services that are only reachable from one particular entry point?"
  - "If the call records arrive as a stream, how would you keep the set of entry points up to date?"
  - "How does this relate to the first step of a topological sort?"
common_errors:
  - "Iterating only over ids that appear in the records, so services with no records are missed."
  - "Ignoring self-calls when marking callees."
  - "Marking the caller instead of the callee."
  - "Returning ids in discovery order rather than ascending order."
