prompt_markdown: |
  ## Reverse Roads Toward the Depot

  A delivery region has `n` sites numbered `0` to `n - 1`; site `0` is the depot. The sites are joined by
  exactly `n - 1` **one-way** roads: each entry `[a, b]` in `roads` lets vans drive from site `a` to site
  `b` only. If you ignore the directions, the roads connect every site and there is exactly one route
  between any two sites (the road map is a tree).

  For the evening return run every van, wherever it is, must be able to drive to the depot. The city lets
  the operator reverse the direction of individual roads. Return the **minimum number of roads** that must
  be reversed so that every site can reach site `0` by following roads in their direction.

  ### Example 1
  ```
  Input:  n = 5, roads = [[0, 1], [1, 2], [3, 1], [4, 0]]
  Output: 2
  Explanation: Reverse 0 -> 1 and 1 -> 2. Roads 3 -> 1 and 4 -> 0 already lead toward the depot.
  ```

  ### Example 2
  ```
  Input:  n = 4, roads = [[1, 0], [2, 1], [3, 2]]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  n = 4, roads = [[0, 1], [0, 2], [0, 3]]
  Output: 3
  Explanation: All three roads must be reversed.
  ```

  ### Constraints
  - `1 <= n <= 5 * 10^4`
  - `roads.length == n - 1`
  - `roads[i] = [a, b]` with `0 <= a, b < n` and `a != b`
  - Ignoring direction, the roads form a tree that contains every site.
languages: [python, javascript, typescript, java, go, cpp]
signature:
