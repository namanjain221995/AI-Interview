expected_concepts:
  - "treating the directed roads as an undirected tree for traversal"
  - "remembering each road's original direction on its adjacency entry"
  - "counting roads that point away from the depot during a traversal from site 0"
  - "iterative BFS or DFS to avoid recursion depth limits"
  - "O(n) time and space"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Explains that in a tree each road must point toward the depot, traverses from site 0 over an undirected adjacency that remembers original directions, counts roads leading away, uses an iterative traversal and states O(n)."
  good: "Correct traversal and counting, possibly recursive, with minor prompting about the direction flag or the n = 1 case."
  weak: "Traverses only along the given directions, simulates reachability repeatedly for each site, or counts roads by comparing ids instead of tree structure."
  criteria:
    correctness: "All tests pass, including the depot as a leaf, mixed directions and shuffled road order."
    efficiency: "Single linear traversal of the tree."
    code_quality: "Adjacency entries carry the direction flag; the counting rule is stated in one place."
    edge_cases: "Single site, two sites in both orientations, long paths."
    communication: "Argues why the answer is forced: in a tree there is only one route to the depot, so each road's required direction is fixed."
hints:
  - "In a tree there is exactly one route from each site to the depot, so the required direction of every road is already decided."
  - "Explore the map outward from the depot while ignoring directions; each road you cross should point back toward where you came from."
  - "Build an undirected adjacency list where each entry also records whether the original road leaves the current site. Traverse from site 0 with a queue or explicit stack, and each time you reach an unvisited site through a road that originally pointed away from the site you are expanding, add one to the count."
followups:
  - "What changes if the road map can contain cycles (more than n - 1 roads)?"
  - "How would you list which roads to reverse instead of counting them?"
  - "How would you answer the same question for every possible depot in linear total time?"
  - "What if reversing each road has a different cost?"
common_errors:
  - "Only traversing along the given directions, so most sites are never reached from the depot."
  - "Counting roads by comparing which endpoint has the smaller id."
  - "Using recursion that overflows the stack on a long path."
  - "Forgetting to mark sites visited, so roads are counted twice."
