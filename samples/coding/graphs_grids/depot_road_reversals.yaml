  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_reversals(n: int, roads: list[list[int]]) -> int:
        # Undirected adjacency; the flag says whether the road points away from
        # the neighbour we came from (1) or toward it (0).
        adjacent: list[list[tuple[int, int]]] = [[] for _ in range(n)]
        for a, b in roads:
            adjacent[a].append((b, 1))  # a -> b: leaving a, points away from the depot side
            adjacent[b].append((a, 0))
        seen = [False] * n
        seen[0] = True
        stack = [0]
        reversals = 0
        while stack:
            site = stack.pop()
            for other, away in adjacent[site]:
                if not seen[other]:
                    seen[other] = True
                    reversals += away
                    stack.append(other)
        return reversals
  javascript: |
    function minReversals(n, roads) {
      const adjacent = Array.from({ length: n }, () => []);
      for (const [a, b] of roads) {
        adjacent[a].push([b, 1]);
        adjacent[b].push([a, 0]);
      }
      const seen = new Array(n).fill(false);
      seen[0] = true;
      const stack = [0];
      let reversals = 0;
      while (stack.length > 0) {
        const site = stack.pop();
        for (const [other, away] of adjacent[site]) {
          if (!seen[other]) {
            seen[other] = true;
            reversals += away;
            stack.push(other);
          }
        }
      }
      return reversals;
    }
