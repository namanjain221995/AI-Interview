expected_concepts:
  - "reversing the edges of a directed graph"
  - "adjacency lists indexed by id"
  - "deduplicating with a set or by exploiting ascending processing order"
  - "producing sorted output without an extra sort"
optimal_complexity: {time: "O(n + E)", space: "O(n + E)"}
rubric:
  excellent: "Creates n empty lists, walks packages in ascending id order appending each consumer once, notes that the lists come out sorted for free and that comparing with the last element removes repeats, and states linear time."
  good: "Correct solution using sets per package followed by sorting each list, with the extra log factor acknowledged."
  weak: "For every package scans every dependency list to find its consumers (quadratic), or leaves duplicates or unsorted output."
  criteria:
    correctness: "All tests pass, including repeated dependencies, cycles and the empty input."
    efficiency: "Linear in packages plus total list length, or near-linear with a justified per-list sort."
    code_quality: "Pre-sized result, descriptive names and no mutation of the input lists."
    edge_cases: "Empty input, packages with no dependencies or no consumers, and heavy repetition."
    communication: "Explains why processing in id order keeps the output sorted."
hints:
  - "Each dependency entry is an arrow from one package to another; the task is to reverse every arrow."
  - "Start with one empty list per package and, while reading each manifest, add the reading package to the list of the package it depends on; then worry about repeats and ordering."
  - "If you read the manifests in ascending package id, every list you build is already sorted, and a repeat of the same dependency can only collide with the last element added, so checking the last element before appending removes duplicates without any set or sort."
followups:
  - "How would you compute every package that transitively depends on package j?"
  - "What changes if package ids are arbitrary strings instead of 0 to n - 1?"
  - "How would you keep the inverted index up to date when a single manifest changes?"
  - "Could you produce the answer without storing all lists in memory at once?"
common_errors:
  - "Leaving duplicate consumers when a dependency is listed several times."
  - "Returning only packages that have consumers instead of a list for every package."
  - "Searching every list for every package, giving quadratic time."
  - "Sharing a single list object across all slots when pre-allocating the result."
