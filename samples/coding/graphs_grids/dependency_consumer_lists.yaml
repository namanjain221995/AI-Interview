slug: dependency_consumer_lists
title: Invert Dependency Lists
difficulty: easy
competency_keys: [data_structures, code_quality]
role_tags: [platform, backend, devops, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Invert Dependency Lists

  A build platform tracks `n` internal packages with ids `0` to `n - 1`, where `n` is the length of
  `depends`. The list `depends[i]` names the packages that package `i` depends on. The lists come
  straight from manifest files, so they are in no particular order and may name the same package
  more than once. A package never lists itself.

  When a package changes, the platform needs to know who to rebuild, so it wants the inverted view.
  Return a list `consumers` of length `n` where `consumers[j]` is the list of **distinct** packages
  that depend on package `j`, sorted in **ascending** order. A package that nobody depends on gets
  an empty list.

  ### Example 1
  ```
  Input:  depends = [[1, 2], [2], [], [2, 1]]
  Output: [[], [0, 3], [0, 1, 3], []]
  Explanation: Packages 0 and 3 depend on 1; packages 0, 1 and 3 depend on 2; nobody depends on 0 or 3.
  ```

  ### Example 2
  ```
  Input:  depends = [[1, 1, 1], []]
  Output: [[], [0]]
  ```

  ### Constraints
  - `0 <= n <= 10^4`
  - `0 <= depends[i].length <= 100`, with at most `10^5` entries in total
  - `0 <= depends[i][k] < n` and `depends[i][k] != i`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: consumers_of
  params:
    - {name: depends, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def consumers_of(depends: list[list[int]]) -> list[list[int]]:
        consumers: list[list[int]] = [[] for _ in depends]
        # Packages are processed in ascending id order, so each list is built already sorted;
        # comparing with the last entry is enough to skip repeated dependencies.
        for package, deps in enumerate(depends):
            for dep in deps:
                bucket = consumers[dep]
                if not bucket or bucket[-1] != package:
                    bucket.append(package)
        return consumers
  javascript: |
    function consumersOf(depends) {
      const consumers = depends.map(() => []);
      depends.forEach((deps, pkg) => {
        for (const dep of deps) {
          const bucket = consumers[dep];
          if (bucket.length === 0 || bucket[bucket.length - 1] !== pkg) bucket.push(pkg);
        }
      });
      return consumers;
    }
