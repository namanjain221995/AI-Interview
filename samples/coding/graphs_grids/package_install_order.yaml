expected_concepts:
  - "topological sorting with in-degree counts (Kahn's algorithm)"
  - "min-heap of ready packages to apply the smallest-name rule"
  - "cycle detection by comparing the number of installed packages with the total"
  - "duplicate requirement pairs counted consistently"
  - "O((P + R) log P) time"
optimal_complexity: {time: "O((P + R) log P) for P packages and R requirement pairs", space: "O(P + R)"}
rubric:
  excellent: "Builds dependents lists and remaining-requirement counts, keeps the ready packages in a min-heap so the smallest name is always next, detects cycles by the installed count, handles duplicates and self-requirements, and explains O((P + R) log P)."
  good: "Correct Kahn-style solution that rescans or re-sorts the ready set each step (quadratic), or needs a prompt on the cycle check."
  weak: "Sorts names once and installs greedily, uses a plain DFS post-order that ignores the smallest-name rule, or loops forever on a cycle."
  criteria:
    correctness: "All tests pass, including cycles, self-requirements, duplicate pairs and an empty input."
    efficiency: "A heap gives each choice in logarithmic time instead of scanning all ready packages."
    code_quality: "Clear names for the remaining-requirement counts and the dependents map."
    edge_cases: "Empty input, a package that requires itself, cycles deep in a chain, mixed-case names."
    communication: "Explains why the order is unique under the rule and how the cycle is detected."
hints:
  - "A package can be installed once everything it requires is installed. Which packages can go first, and what changes after one of them is installed?"
  - "Track for each package how many of its requirements are still missing, and which packages are waiting on it. The packages with nothing missing form a ready pool, and you always need the smallest name in that pool."
  - "Count the missing requirements per package, counting duplicate pairs every time, and record each requirement's dependents. Put every package with a count of zero in a min-heap keyed by name. Repeatedly pop the smallest, append it to the order and decrement the counts of its dependents, pushing any that reach zero. If the order ends shorter than the package list, a cycle blocked the rest, so return an empty list."
followups:
  - "How would you report the packages that are stuck in or behind a cycle?"
  - "What changes if the manager can install several packages in parallel?"
  - "How would you install only the packages needed for one chosen package?"
  - "How would you detect the cycle with depth-first search instead, and what would you print to help the user fix it?"
common_errors:
  - "Returning a valid topological order that does not follow the smallest-name rule."
  - "Choosing the next package from a FIFO queue, so a newly unlocked smaller name loses to an older ready one."
  - "Deduplicating pairs on one side only, so counts never reach zero."
  - "Returning the partial order instead of an empty list when a cycle exists."
