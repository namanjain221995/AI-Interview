version: 1
slug: package_install_order
title: "Package Install Order"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [platform, devops, backend, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Package Install Order

  An internal package manager installs one package at a time. `packages` lists every package to
  install (names are distinct). Each pair `[pkg, dep]` in `requires` means **`dep` must be installed
  before `pkg`**; both names always appear in `packages`, and the same pair may be listed more than once.

  To make installs reproducible, the manager follows one fixed rule: at every point, among the packages
  whose requirements are all already installed, it installs the one whose name is **smallest in ASCII
  order** next.

  Return the full install order. If a dependency cycle (including a package that requires itself) makes
  it impossible to install every package, return an empty list. An empty `packages` list also gives an
  empty list.

  ### Example 1
  ```
  Input:  packages = ["web", "auth", "db", "cache"]
          requires = [["web", "auth"], ["auth", "db"], ["web", "cache"]]
  Output: ["cache", "db", "auth", "web"]
  Explanation: db and cache are installable at the start; cache is smaller. Installing db unlocks auth, and web needs both auth and cache.
  ```

  ### Example 2
  ```
  Input:  packages = ["ui", "core", "net"]
          requires = [["core", "net"], ["net", "ui"], ["ui", "core"]]
  Output: []
  Explanation: core needs net, net needs ui and ui needs core, so none of them can ever be installed.
  ```

  ### Example 3
  ```
  Input:  packages = ["zlib", "yaml", "xml"], requires = []
  Output: ["xml", "yaml", "zlib"]
  Explanation: Nothing has requirements, so the order is simply alphabetical.
  ```

  ### Constraints
  - `0 <= packages.length <= 10^4`
  - `0 <= requires.length <= 5 * 10^4`
  - `requires[i].length == 2` and both names appear in `packages`
  - Names are 1 to 30 characters from `[A-Za-z0-9_-]` and are compared by ASCII code.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: install_order
  params:
    - {name: packages, type: "string[]"}
    - {name: requires, type: "string[][]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def install_order(packages: list[str], requires: list[list[str]]) -> list[str]:
        waiting = {name: 0 for name in packages}
        dependents = {name: [] for name in packages}
        for pkg, dep in requires:
            waiting[pkg] += 1
            dependents[dep].append(pkg)
        ready = [name for name in packages if waiting[name] == 0]
        heapq.heapify(ready)
        order = []
        while ready:
            name = heapq.heappop(ready)
            order.append(name)
            for pkg in dependents[name]:
                waiting[pkg] -= 1
                if waiting[pkg] == 0:
                    heapq.heappush(ready, pkg)
        return order if len(order) == len(packages) else []
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      push(value) {
        const items = this.items;
        items.push(value);
        let i = items.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.less(items[i], items[parent])) break;
          [items[i], items[parent]] = [items[parent], items[i]];
          i = parent;
        }
      }
      pop() {
        const items = this.items;
        const top = items[0];
        const last = items.pop();
        if (items.length > 0) {
          items[0] = last;
          let i = 0;
          for (;;) {
            const left = 2 * i + 1;
            const right = left + 1;
            let smallest = i;
            if (left < items.length && this.less(items[left], items[smallest])) smallest = left;
            if (right < items.length && this.less(items[right], items[smallest])) smallest = right;
            if (smallest === i) break;
            [items[i], items[smallest]] = [items[smallest], items[i]];
            i = smallest;
          }
        }
        return top;
      }
    }

    function installOrder(packages, requires) {
      const waiting = new Map();
      const dependents = new Map();
      for (const name of packages) {
        waiting.set(name, 0);
        dependents.set(name, []);
      }
      for (const [pkg, dep] of requires) {
        waiting.set(pkg, waiting.get(pkg) + 1);
        dependents.get(dep).push(pkg);
      }
      const ready = new MinHeap((a, b) => a < b);
      for (const name of packages) if (waiting.get(name) === 0) ready.push(name);
      const order = [];
      while (ready.size > 0) {
        const name = ready.pop();
        order.push(name);
        for (const pkg of dependents.get(name)) {
          waiting.set(pkg, waiting.get(pkg) - 1);
          if (waiting.get(pkg) === 0) ready.push(pkg);
        }
      }
      return order.length === packages.length ? order : [];
    }
