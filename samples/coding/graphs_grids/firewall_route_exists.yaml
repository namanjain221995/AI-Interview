slug: firewall_route_exists
title: Firewall Route Exists
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [security, network, devops, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Firewall Route Exists

  A security engineer is checking whether a lockdown really isolates a host. The internal network has
  `n` hosts numbered `0` to `n - 1`. Each firewall rule `[from, to]` in `allow_rules` permits traffic in
  **one direction only**: from host `from` to host `to`. Rules may be listed more than once, and a rule
  may allow a host to send to itself.

  Hosts relay packets, so traffic can travel through any number of intermediate hosts as long as every
  single hop is permitted by a rule.

  Return `true` if traffic starting at `source` can arrive at `target`, and `false` otherwise. A host
  can always reach itself, so `source == target` is `true` even without rules.

  ### Example 1
  ```
  Input:  n = 5, allow_rules = [[0, 1], [1, 2], [3, 2], [2, 4]], source = 0, target = 4
  Output: true
  Explanation: 0 -> 1 -> 2 -> 4 uses only allowed hops.
  ```

  ### Example 2
  ```
  Input:  n = 5, allow_rules = [[0, 1], [1, 2], [3, 2], [2, 4]], source = 3, target = 1
  Output: false
  Explanation: Host 3 can reach 2 and 4, but no rule leads back towards 1.
  ```

  ### Example 3
  ```
  Input:  n = 2, allow_rules = [], source = 1, target = 1
  Output: true
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= allow_rules.length <= 2 * 10^4`
  - `allow_rules[i].length == 2` and `0 <= from, to < n`
  - `0 <= source, target < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_reach
  params:
    - {name: n, type: "int"}
    - {name: allow_rules, type: "int[][]"}
    - {name: source, type: "int"}
    - {name: target, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def can_reach(n: int, allow_rules: list[list[int]], source: int, target: int) -> bool:
        if source == target:
            return True
        outgoing: list[list[int]] = [[] for _ in range(n)]
        for frm, to in allow_rules:
            outgoing[frm].append(to)
        seen = [False] * n
        seen[source] = True
        queue = deque([source])
        while queue:
            host = queue.popleft()
            for nxt in outgoing[host]:
                if nxt == target:
                    return True
                if not seen[nxt]:
                    seen[nxt] = True
                    queue.append(nxt)
        return False
  javascript: |
    function canReach(n, allowRules, source, target) {
      if (source === target) return true;
      const outgoing = Array.from({ length: n }, () => []);
      for (const [from, to] of allowRules) outgoing[from].push(to);
      const seen = new Array(n).fill(false);
      seen[source] = true;
      const stack = [source];
      while (stack.length > 0) {
        const host = stack.pop();
        for (const next of outgoing[host]) {
          if (next === target) return true;
          if (!seen[next]) {
            seen[next] = true;
            stack.push(next);
          }
        }
      }
      return false;
    }
