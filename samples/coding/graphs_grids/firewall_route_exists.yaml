expected_concepts:
  - "directed graph reachability"
  - "adjacency list built from edge pairs"
  - "BFS or DFS with a visited set"
  - "handling cycles and self-loops without infinite loops"
optimal_complexity: {time: "O(n + m)", space: "O(n + m)"}
rubric:
  excellent: "Builds a directed adjacency list, runs BFS or iterative DFS with a visited set, handles source == target up front, can stop early when the target is found and states O(n + m) time and space."
  good: "Correct traversal with a visited set; may use recursion or miss the early exit, or need a prompt about edge direction."
  weak: "Treats rules as two-way, has no visited set so cycles loop forever, or only checks direct rules from the source."
  criteria:
    correctness: "All tests pass, including reverse-only rules, cycles and source equal to target."
    efficiency: "Each host and rule processed at most once."
    code_quality: "Readable graph construction and traversal with descriptive names."
    edge_cases: "Self-rules, duplicate rules, cycles, target with only outgoing rules, long chains."
    communication: "Explains why the graph is directed and why the visited set guarantees termination."
hints:
  - "Think of hosts as nodes and each rule as a one-way arrow; the question becomes whether some path of arrows leads from source to target."
  - "Group the rules by their starting host so you can quickly list where traffic may go next, and explore outward from the source while remembering which hosts you have already explored."
  - "Return true immediately when source equals target; otherwise build a list of outgoing hosts per host, push the source onto a queue with a seen flag, and pop hosts one by one, returning true as soon as you meet the target and queueing each unseen neighbour; if the queue empties, return false."
followups:
  - "How would you return the actual route (the list of hosts) instead of a yes or no?"
  - "If you must answer many source-target questions on the same rule set, what would you precompute?"
  - "How would you find every host that can reach a sensitive database host?"
  - "What changes if each rule only applies to a certain port?"
common_errors:
  - "Adding both directions of each rule to the adjacency list."
  - "Recursing or looping without a visited set, which never terminates on cycles."
  - "Returning false for source == target when there are no rules."
  - "Checking only the source's direct rules instead of relayed paths."
