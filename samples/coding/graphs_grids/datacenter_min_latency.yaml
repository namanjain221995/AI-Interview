slug: datacenter_min_latency
title: "Minimum Latency Between Data Centres"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [network, cloud, sre, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Latency Between Data Centres

  A network team is choosing a replication path between two of its `n` data centres, numbered `0`
  to `n - 1`. Each entry `[u, v, ms]` in `links` is a link that carries traffic **in both directions**
  with a latency of `ms` milliseconds. Two data centres may be joined by several links, a link may even
  loop back to the same data centre, and latencies can be `0`.

  Return the smallest total latency of any path from `source` to `target`, adding the latencies of the
  links used. Return `0` if `source` equals `target`, and `-1` if no path connects them.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1, 5], [1, 2, 3], [0, 2, 10], [2, 3, 1]], source = 0, target = 3
  Output: 9
  Explanation: 0 -> 1 -> 2 -> 3 costs 5 + 3 + 1 = 9, cheaper than starting with the direct 10 ms link from 0 to 2.
  ```

  ### Example 2
  ```
  Input:  n = 3, links = [[0, 1, 7]], source = 2, target = 0
  Output: -1
  Explanation: Data centre 2 has no links at all.
  ```

  ### Example 3
  ```
  Input:  n = 2, links = [[0, 1, 4], [1, 0, 2]], source = 1, target = 0
  Output: 2
  Explanation: Links work in both directions, so the 2 ms link carries traffic from 1 to 0.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 5 * 10^4`, `links[i].length == 3` and `0 <= u, v < n`
  - `0 <= ms <= 10^6`
  - `0 <= source, target < n`
  - Totals can exceed the 32-bit integer range; use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
