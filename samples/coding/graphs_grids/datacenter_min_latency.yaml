reference_solutions:
  python: |
    import heapq


    def min_latency(n: int, links: list[list[int]], source: int, target: int) -> int:
        graph = [[] for _ in range(n)]
        for u, v, ms in links:
            graph[u].append((v, ms))
            graph[v].append((u, ms))
        best = [None] * n
        best[source] = 0
        heap = [(0, source)]
        while heap:
            d, node = heapq.heappop(heap)
            if d > best[node]:
                continue
            if node == target:
                return d
            for nxt, ms in graph[node]:
                cand = d + ms
                if best[nxt] is None or cand < best[nxt]:
                    best[nxt] = cand
                    heapq.heappush(heap, (cand, nxt))
        return -1
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      push(value) {
        const items = this.items;
        items.push(value);
        let i = items.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.less(items[i], items[parent])) break;
          [items[i], items[parent]] = [items[parent], items[i]];
          i = parent;
        }
      }
      pop() {
        const items = this.items;
        const top = items[0];
        const last = items.pop();
        if (items.length > 0) {
          items[0] = last;
          let i = 0;
          for (;;) {
            const left = 2 * i + 1;
            const right = left + 1;
            let smallest = i;
            if (left < items.length && this.less(items[left], items[smallest])) smallest = left;
            if (right < items.length && this.less(items[right], items[smallest])) smallest = right;
            if (smallest === i) break;
            [items[i], items[smallest]] = [items[smallest], items[i]];
            i = smallest;
          }
        }
        return top;
      }
    }

    function minLatency(n, links, source, target) {
      const graph = Array.from({ length: n }, () => []);
      for (const [u, v, ms] of links) {
        graph[u].push([v, ms]);
        graph[v].push([u, ms]);
      }
      const best = new Array(n).fill(-1);
      best[source] = 0;
      const heap = new MinHeap((a, b) => a[0] < b[0]);
      heap.push([0, source]);
      while (heap.size > 0) {
        const [d, node] = heap.pop();
        if (d > best[node]) continue;
        if (node === target) return d;
        for (const [next, ms] of graph[node]) {
          const candidate = d + ms;
          if (best[next] === -1 || candidate < best[next]) {
            best[next] = candidate;
            heap.push([candidate, next]);
          }
        }
      }
      return -1;
    }
