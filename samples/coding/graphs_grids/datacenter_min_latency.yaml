expected_concepts:
  - "Dijkstra's algorithm with a binary heap"
  - "adjacency list built in both directions for undirected links"
  - "skipping stale heap entries and stopping early at the target"
  - "why non-negative weights make the greedy choice safe"
  - "O((n + E) log n) time"
optimal_complexity: {time: "O((n + E) log n) for E links", space: "O(n + E)"}
rubric:
  excellent: "Builds an undirected adjacency list, runs Dijkstra with a min-heap, skips stale entries, stops at the target, uses 64-bit totals and explains why non-negative latencies make the algorithm correct."
  good: "Correct Dijkstra (or Bellman-Ford on small inputs) with minor issues such as no early exit or needing a prompt about stale heap entries."
  weak: "Uses breadth-first search on hop count, adds links in one direction only, or runs an exponential path enumeration."
  criteria:
    correctness: "All tests pass, including zero-latency links, parallel links, loops and unreachable targets."
    efficiency: "Heap-based Dijkstra rather than a quadratic scan or path enumeration."
    code_quality: "Clear adjacency construction and distance bookkeeping."
    edge_cases: "source equals target, isolated data centres, zero latencies, large totals."
    communication: "Explains the greedy invariant and the cost of the heap operations."
hints:
  - "This is a shortest-path question on a weighted graph; think about why counting hops alone is not enough."
  - "Because latencies are never negative, the data centre with the smallest known total so far can be finalised. A priority queue lets you pick it quickly."
  - "Build an adjacency list that adds every link in both directions. Keep a best-known total per data centre, starting with zero at the source, and a min-heap of total and data centre pairs. Pop the smallest; skip it if it is worse than the recorded best; return it if it is the target; otherwise relax every neighbour with the popped total plus the link latency and push improvements. Return minus one if the heap empties first."
followups:
  - "How would you return the actual list of data centres on the best path?"
  - "What changes if some links could have negative adjustments?"
  - "How would you answer many source-target queries on the same network?"
  - "How would you find the second-best path for failover?"
common_errors:
  - "Running breadth-first search, which minimises the number of links instead of the latency."
  - "Adding each link only in one direction."
  - "Marking a data centre final when it is pushed rather than when it is popped."
  - "Overflowing 32-bit totals on long paths with large latencies."
