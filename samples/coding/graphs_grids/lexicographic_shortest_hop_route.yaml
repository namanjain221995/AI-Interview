    - {name: source, type: "int"}
    - {name: target, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def smallest_shortest_route(n: int, links: list[list[int]], source: int, target: int) -> list[int]:
        adjacent: list[set[int]] = [set() for _ in range(n)]
        for a, b in links:
            adjacent[a].add(b)
            adjacent[b].add(a)
        # Hop distance of every node to the target.
        dist = [-1] * n
        dist[target] = 0
        queue = deque([target])
        while queue:
            node = queue.popleft()
            for other in adjacent[node]:
                if dist[other] == -1:
                    dist[other] = dist[node] + 1
                    queue.append(other)
        if dist[source] == -1:
            return []
        # Walk forward, always to the smallest neighbour that is one hop closer.
        route = [source]
        node = source
        while node != target:
            node = min(other for other in adjacent[node] if dist[other] == dist[node] - 1)
            route.append(node)
        return route
  javascript: |
    function smallestShortestRoute(n, links, source, target) {
      const adjacent = Array.from({ length: n }, () => []);
      for (const [a, b] of links) {
        adjacent[a].push(b);
        adjacent[b].push(a);
      }
      const dist = new Array(n).fill(-1);
      dist[target] = 0;
      const queue = [target];
      for (let head = 0; head < queue.length; head++) {
        const node = queue[head];
        for (const other of adjacent[node]) {
          if (dist[other] === -1) {
            dist[other] = dist[node] + 1;
            queue.push(other);
          }
        }
      }
      if (dist[source] === -1) return [];
      const route = [source];
      let node = source;
      while (node !== target) {
        let next = -1;
        for (const other of adjacent[node]) {
          if (dist[other] === dist[node] - 1 && (next === -1 || other < next)) next = other;
        }
        node = next;
        route.push(node);
      }
      return route;
    }
