slug: lexicographic_shortest_hop_route
title: "Smallest Shortest Hop Route"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, backend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Smallest Shortest Hop Route

  The network team traces packet routes between `n` routers numbered `0` to `n - 1`. Routers are joined by
  **two-way** links: each entry `[a, b]` in `links` connects routers `a` and `b`. A **route** from
  `source` to `target` is a list of router ids that starts with `source`, ends with `target`, and in which
  every two consecutive routers are linked. Its **hop count** is the number of links it uses.

  Several routes can share the minimum hop count. To make traces reproducible, the team always reports the
  **lexicographically smallest** one: compare two routes id by id from the start, and the first position
  where they differ decides (the smaller id wins).

  Return that route as a list of router ids. Return `[source]` if `source == target`, and an empty list
  if `target` cannot be reached from `source`.

  ### Example 1
  ```
  Input:  n = 6, links = [[0, 1], [0, 2], [1, 3], [2, 3], [3, 5], [2, 4], [4, 5]], source = 0, target = 5
  Output: [0, 1, 3, 5]
  Explanation: 0-1-3-5, 0-2-3-5 and 0-2-4-5 all use 3 hops; [0, 1, 3, 5] is the smallest.
  ```

  ### Example 2
  ```
  Input:  n = 5, links = [[4, 3], [3, 0], [4, 1], [1, 0], [4, 2], [2, 0]], source = 4, target = 0
  Output: [4, 1, 0]
  ```

  ### Example 3
  ```
  Input:  n = 4, links = [[0, 1], [2, 3]], source = 0, target = 3
  Output: []
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 5 * 10^4`
  - `links[i] = [a, b]` with `0 <= a, b < n` and `a != b`; the same pair may be listed more than once.
  - `0 <= source, target < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_shortest_route
  params:
    - {name: n, type: "int"}
