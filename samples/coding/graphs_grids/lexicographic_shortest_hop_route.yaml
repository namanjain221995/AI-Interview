expected_concepts:
  - "breadth-first search for unweighted hop distances"
  - "BFS from the target so every node knows its remaining distance"
  - "greedy forward choice of the smallest neighbour that is one hop closer"
  - "why unsorted first-discovered parents or the smallest predecessor per node are not enough"
  - "O(n + m) time and space (plus neighbour scanning on the chosen route)"
optimal_complexity: {time: "O(n + m)", space: "O(n + m)"}
rubric:
  excellent: "Runs BFS from the target to get distances, then walks from the source choosing the smallest neighbour that is exactly one hop closer, explains why this yields the lexicographically smallest shortest route, handles the source-equals-target and unreachable cases and states O(n + m)."
  good: "Correct solution, for example a BFS from the source that visits neighbours in increasing id order and keeps first-discovered parents (with some argument why that works), or the target BFS approach after a hint; complexity mostly right."
  weak: "Returns whichever shortest route an unsorted BFS finds first, picks the smallest neighbour greedily without distances, keeps the smallest predecessor per node, or enumerates all routes."
  criteria:
    correctness: "All tests pass, including the predecessor trap, duplicates and unreachable targets."
    efficiency: "Linear BFS plus a single forward walk; no enumeration of all shortest routes."
    code_quality: "Distance computation and route reconstruction kept separate and readable."
    edge_cases: "Source equals target, single router, unreachable target, duplicate links."
    communication: "Explains why the lexicographic choice must be made from the front of the route."
hints:
  - "First work out the minimum hop count; among routes with that hop count, the earliest positions of the route matter most for the ordering."
  - "If you know every router's hop distance to the target, then from any router the valid next steps on a shortest route are exactly the neighbours that are one hop closer."
  - "Run a breadth-first search starting from the target to label each router with its distance to the target. If the source has no label, return an empty list. Otherwise start at the source and repeatedly move to the smallest-id neighbour whose label is one less than the current router's label, appending each router until you reach the target."
followups:
  - "Why does keeping, for each router, the smallest predecessor found by a BFS from the source not give the right answer?"
  - "How would you solve it if links had different latencies?"
  - "How would you answer many queries with the same target efficiently?"
  - "How would you count the number of minimum-hop routes?"
common_errors:
  - "Returning whichever shortest route a BFS with unsorted neighbour lists happens to discover first."
  - "Walking greedily to the smallest neighbour without checking that it stays on a shortest route."
  - "Rebuilding the route backwards from the target using the smallest predecessor at each step."
  - "Forgetting the source-equals-target and unreachable cases."
  - "Treating links as one-way."
