expected_concepts:
  - "the strictly-rising rule makes the cell graph a directed acyclic graph"
  - "memoised depth-first search or processing cells in height order"
  - "longest path in a DAG with dynamic programming"
  - "why a plain visited set without memoisation is exponential"
  - "avoiding deep recursion on long trails"
optimal_complexity: {time: "O(R * C * log(R * C))", space: "O(R * C)"}
rubric:
  excellent: "Observes that strictly rising steps can never form a loop, so the grid is a DAG; computes the longest trail from each cell with memoised search or by processing cells from highest to lowest; avoids recursion overflow on a 40,000-cell spiral; states O(R*C) work plus the sort (or O(R*C) with memoised DFS)."
  good: "Correct memoised depth-first search with clean boundary checks, with a nudge on recursion depth or on why no visited set is needed."
  weak: "Explores every trail with plain backtracking (exponential), allows equal-height steps, or wraps around edges."
  criteria:
    correctness: "All tests pass, including plateaus, negative heights, a single cell and a full spiral."
    efficiency: "Each cell's best trail is computed once and reused."
    code_quality: "A direction table and a single bounds check; clear name for the per-cell best length."
    edge_cases: "Single row, single column, all equal heights and very large negative or positive heights."
    communication: "Explains why caching is safe here when it would not be for a general longest-path problem."
hints:
  - "Because every step must go strictly higher, a trail can never come back to a cell it has already used. What does that tell you about reusing work between starting cells?"
  - "Let the best trail starting at a cell be one plus the best trail starting at any strictly higher neighbour. Each cell's value then depends only on higher cells."
  - "Either cache the best length per cell in a depth-first search, or sort all cells from highest to lowest elevation and fill a table: for each cell, look at its four in-bounds neighbours that are strictly higher, take the largest stored length, add one, and track the overall maximum. The sorted order also avoids deep recursion."
followups:
  - "How would you return the trail itself, preferring the one that starts at the lowest elevation on ties?"
  - "What changes if the hikers may also step diagonally?"
  - "If a trail may include at most one flat step (equal heights), how does the state need to change?"
  - "How would you process a survey grid too large to fit in memory?"
common_errors:
  - "Backtracking through every path with a visited set and no memoisation, which is exponential."
  - "Allowing steps onto equal heights, which creates cycles and wrong answers."
  - "Recursing along a long spiral and exceeding the call-stack limit."
  - "Returning the number of steps instead of the number of cells."
