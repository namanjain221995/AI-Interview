slug: longest_rising_terrain_trail
title: "Longest Rising Terrain Trail"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist]
time_limit_minutes: 30
prompt_markdown: |
  ## Longest Rising Terrain Trail

  A drone survey of a hillside produced a grid of elevation readings: `heights[r][c]` is the
  elevation, in centimetres relative to a reference point, of the cell in row `r` and column `c`.
  Readings can be negative.

  The trail-planning team wants the longest possible **rising trail**. A trail is a sequence of cells
  where each next cell is directly up, down, left or right of the previous one (no diagonals, no
  wrapping around the edges) and has a **strictly higher** elevation than the previous cell. A trail
  may start at any cell, and a single cell on its own is a trail of length 1.

  Return the **number of cells** on the longest rising trail in the grid.

  ### Example 1
  ```
  Input:  heights = [[3, 4, 5], [3, 2, 6], [2, 2, 1]]
  Output: 4
  Explanation: 3 -> 4 -> 5 -> 6 along the top row and down the right edge.
  ```

  ### Example 2
  ```
  Input:  heights = [[7, 7], [7, 7]]
  Output: 1
  Explanation: No step is strictly uphill, so every trail is a single cell.
  ```

  ### Example 3
  ```
  Input:  heights = [[1, 2, 3], [8, 9, 4], [7, 6, 5]]
  Output: 9
  Explanation: The trail spirals 1 -> 2 -> ... -> 9 through every cell.
  ```

  ### Constraints
  - `1 <= rows, cols <= 200` and every row has the same length
  - `-10^9 <= heights[r][c] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_rising_trail
  params:
    - {name: heights, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_rising_trail(heights: list[list[int]]) -> int:
        rows, cols = len(heights), len(heights[0])
        # visit cells from highest to lowest so every higher neighbour is final before it is used
        cells = sorted(
            ((heights[r][c], r, c) for r in range(rows) for c in range(cols)),
            reverse=True,
        )
        best = [[1] * cols for _ in range(rows)]  # longest trail starting at each cell
        answer = 0
        for height, r, c in cells:
            length = 1
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                nr, nc = r + dr, c + dc
                if 0 <= nr < rows and 0 <= nc < cols and heights[nr][nc] > height:
                    length = max(length, best[nr][nc] + 1)
            best[r][c] = length
            answer = max(answer, length)
        return answer
  javascript: |
    function longestRisingTrail(heights) {
      const rows = heights.length;
      const cols = heights[0].length;
      const cells = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) cells.push([heights[r][c], r, c]);
      }
      cells.sort((x, y) => y[0] - x[0]);
      const best = Array.from({ length: rows }, () => new Array(cols).fill(1));
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      let answer = 0;
      for (const [height, r, c] of cells) {
        let length = 1;
        for (const [dr, dc] of steps) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && heights[nr][nc] > height) {
            length = Math.max(length, best[nr][nc] + 1);
          }
        }
        best[r][c] = length;
        answer = Math.max(answer, length);
      }
      return answer;
    }
