expected_concepts:
  - maximum bipartite matching between engineers and tickets
  - augmenting paths that reassign already matched engineers
  - Kuhn's algorithm (DFS augmenting paths) or Hopcroft-Karp
  - reduction to maximum flow with unit capacities
  - why greedy assignment in input order is not optimal
optimal_complexity: {time: O(E * sqrt(V)) with Hopcroft-Karp (O(V * E) with simple augmenting paths), space: O(V + E)}
rubric:
  excellent: Recognises maximum bipartite matching, implements augmenting paths with a per-search visited set (Kuhn) or Hopcroft-Karp, explains with a counterexample why greedy fails and why no augmenting path means the matching is maximum, handles duplicate pairs and isolated engineers, and states the complexity.
  good: Reaches a correct augmenting-path or max-flow solution with some prompting, or has small slips such as resetting the visited set at the wrong time that are fixed after tracing an example.
  weak: Assigns greedily (first available ticket, or fewest options first) without reassignment, tries every permutation, or counts duplicate pairs as extra assignments.
  criteria:
    correctness: Returns the true maximum, including cases that need long chains of reassignment.
    efficiency: Polynomial matching (O(V * E) or better); no exponential search over assignments.
    code_quality: Adjacency list per engineer, a clear owner array per ticket and a small recursive or iterative augment routine.
    edge_cases: No pairs, duplicate pairs, more engineers than tickets or the reverse, engineers or tickets with no options.
    communication: Explains what an augmenting path is and why each successful search increases the matching by exactly one.
hints:
  - Picking any qualified ticket for each engineer in turn can lock out a later engineer; when that happens, could an earlier engineer have taken a different ticket instead?
  - Model engineers and tickets as the two sides of a bipartite graph; you want the largest set of edges with no shared endpoint, and you can grow it by finding paths that alternate between unused and used edges.
  - For each engineer run a DFS over its tickets with a fresh visited set; a ticket works if it is free or if its current owner can recursively be moved to another ticket, and on success reassign along the path and count one more assignment.
followups:
  - How would Hopcroft-Karp improve the running time, and when would that matter?
  - How would you change the solution if each engineer could take up to k tickets?
  - How would you prefer senior engineers for urgent tickets (a weighted assignment)?
  - How would you return the actual assignment, not just its size?
common_errors:
  - Greedy assignment in input order, which misses assignments that need an engineer to switch tickets.
  - Sorting engineers by number of options and assigning greedily, which still fails on some inputs.
  - Sharing one visited set across all engineers instead of resetting it for each new search.
  - Counting duplicate pairs as separate capacity.
  - Brute-forcing all assignments, which is exponential.
