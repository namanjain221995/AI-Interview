slug: max_ticket_assignments
title: Maximum Support Ticket Assignments
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, support_engineer, engineering_manager]
time_limit_minutes: 35
prompt_markdown: |
  ## Maximum Support Ticket Assignments

  At the start of a support shift, the queue holds `tickets` open tickets (numbered `0` to `tickets - 1`)
  and `workers` on-call engineers (numbered `0` to `workers - 1`). Not every engineer can take every
  ticket: the skills matrix is given as `can_handle`, where each pair `[worker, ticket]` means engineer
  `worker` is qualified for ticket `ticket`. The same pair may appear more than once.

  For the first hour every engineer works on **at most one** ticket and every ticket is given to **at
  most one** engineer, and a ticket may only go to an engineer who is qualified for it. Return the
  **maximum number of tickets** that can be assigned at the same time.

  ### Example 1
  ```
  Input:  workers = 3, tickets = 3, can_handle = [[0, 0], [0, 1], [1, 0], [2, 1], [2, 2]]
  Output: 3
  Explanation: Engineer 1 can only take ticket 0, so engineer 0 takes ticket 1 and engineer 2 takes
  ticket 2. Handing engineer 0 the first ticket it can do (ticket 0) would leave only 2 assignments.
  ```

  ### Example 2
  ```
  Input:  workers = 2, tickets = 3, can_handle = [[0, 2], [1, 2]]
  Output: 1
  Explanation: Both engineers are only qualified for ticket 2, and nobody can take tickets 0 or 1.
  ```

  ### Example 3
  ```
  Input:  workers = 4, tickets = 2, can_handle = [[0, 0], [1, 0], [1, 1], [2, 1], [3, 0], [3, 1]]
  Output: 2
  Explanation: There are only two tickets, so at most two engineers can be busy.
  ```

  ### Constraints
  - `1 <= workers, tickets <= 300`
  - `0 <= can_handle.length <= 5000`
  - `can_handle[i].length == 2`, `0 <= worker < workers`, `0 <= ticket < tickets`
  - pairs may repeat and appear in any order
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_assignments
  params:
    - {name: workers, type: int}
    - {name: tickets, type: int}
    - {name: can_handle, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def max_assignments(workers: int, tickets: int, can_handle: list[list[int]]) -> int:
        options: list[list[int]] = [[] for _ in range(workers)]
        for worker, ticket in can_handle:
            options[worker].append(ticket)
        owner = [-1] * tickets  # owner[ticket] = engineer currently holding it

        def try_assign(worker: int, visited: list[bool]) -> bool:
            # Look for an augmenting path: a free ticket, or a taken one whose owner can move elsewhere.
            for ticket in options[worker]:
                if visited[ticket]:
                    continue
                visited[ticket] = True
                if owner[ticket] == -1 or try_assign(owner[ticket], visited):
                    owner[ticket] = worker
                    return True
            return False

        assigned = 0
        for worker in range(workers):
            if try_assign(worker, [False] * tickets):
                assigned += 1
        return assigned
  javascript: |
    function maxAssignments(workers, tickets, canHandle) {
      const options = Array.from({ length: workers }, () => []);
      for (const [worker, ticket] of canHandle) options[worker].push(ticket);
      const owner = new Array(tickets).fill(-1); // owner[ticket] = engineer currently holding it

      // Look for an augmenting path: a free ticket, or a taken one whose owner can move elsewhere.
      const tryAssign = (worker, visited) => {
        for (const ticket of options[worker]) {
          if (visited[ticket]) continue;
          visited[ticket] = true;
          if (owner[ticket] === -1 || tryAssign(owner[ticket], visited)) {
            owner[ticket] = worker;
            return true;
          }
        }
        return false;
      };

      let assigned = 0;
      for (let worker = 0; worker < workers; worker++) {
        if (tryAssign(worker, new Array(tickets).fill(false))) assigned++;
      }
      return assigned;
    }
