expected_concepts:
  - "building child adjacency lists from a parent array"
  - "tree traversal (BFS or iterative DFS) from the root"
  - "longest weighted root-to-node path where the weight belongs to the parent"
  - "64-bit accumulation of large delays"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Builds children lists, traverses iteratively from the root accumulating the parent's delay, returns the maximum arrival time in O(n), uses 64-bit arithmetic and explains why leaf delays are irrelevant."
  good: "Correct traversal or memoised walk up the parent chain, possibly after fixing the root lookup or the overflow."
  weak: "Sums all delays, adds the child's own delay instead of the parent's, assumes the root is label 0, or walks every node to the root without memoisation in O(n^2) on chains."
  criteria:
    correctness: "All tests pass, including a root that is not label 0, leaf delays and 64-bit totals."
    efficiency: "Each responder is visited once; no repeated walks up long chains."
    code_quality: "Clear names (reports, received, latest) and an iterative traversal."
    edge_cases: "Single responder, star, zero delays, deep chains and shuffled labels."
    communication: "Explains that the answer is the longest path where each edge weighs the parent's delay."
hints:
  - "Write down when a responder receives the alert in terms of when their own parent received it."
  - "Each arrival time depends only on the parent's arrival time plus the parent's delay, so process responders from the root downwards and keep the largest time seen."
  - "Turn the parent array into lists of direct reports and find the root, then run an iterative breadth-first or depth-first traversal from it, giving each report the arrival time of its parent plus the parent's delay, and track the maximum in a 64-bit integer."
followups:
  - "How would you also return which responder is paged last, breaking ties by label?"
  - "If every responder could notify only one report per minute, how would the answer change?"
  - "How would you recompute the answer quickly when a single responder's delay changes?"
common_errors:
  - "Adding the child's own delay instead of the parent's."
  - "Assuming responder 0 is the root or that parents always have smaller labels."
  - "Overflowing a 32-bit integer on long chains of large delays."
  - "Using recursion on a 10^5-deep chain and hitting the stack limit."
