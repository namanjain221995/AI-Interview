role_tags: [sre, devops, general, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Escalation Tree Fan-out Time

  An incident-response team pages people through an escalation tree of `n` responders labelled `0` to
  `n - 1`. `parent[i]` is the responder who notifies responder `i`; exactly one responder has
  `parent[i] == -1`. That responder is the **root**: the monitoring system pages them at minute `0`.

  Once responder `i` has the alert, they need `delay[i]` minutes to triage it, after which they notify
  **all** of their direct reports at the same moment. So if responder `i` receives the alert at minute
  `t`, each responder `j` with `parent[j] == i` receives it at minute `t + delay[i]`. The delay of a
  responder with no direct reports does not matter.

  Return the minute at which the **last** responder receives the alert (`0` when the root is the only
  responder). Labels are arbitrary: a parent can have a larger label than its reports.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], delay = [2, 3, 1, 0, 0, 0]
  Output: 5
  Explanation: Responders 1 and 2 are paged at minute 2. Responder 1 needs 3 minutes, so 3 and 4
  are paged at minute 5; responder 2 needs 1 minute, so 5 is paged at minute 3.
  ```

  ### Example 2
  ```
  Input:  parent = [2, 2, -1, 0], delay = [4, 0, 7, 0]
  Output: 11
  Explanation: Responder 2 is the root. Responders 0 and 1 are paged at minute 7, and responder 3
  (a report of 0) at minute 7 + 4 = 11.
  ```

  ### Example 3
  ```
  Input:  parent = [-1], delay = [5]
  Output: 0
  Explanation: Nobody else needs to be paged.
  ```

  ### Constraints
  - `1 <= n == parent.length == delay.length <= 10^5`
  - Exactly one `parent[i]` is `-1`; every other `parent[i]` is in `[0, n - 1]` and the parents form a single tree rooted at that responder.
  - `0 <= delay[i] <= 10^9`
  - The answer can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: alert_fanout_time
  params:
    - {name: parent, type: "int[]"}
    - {name: delay, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def alert_fanout_time(parent: list[int], delay: list[int]) -> int:
        n = len(parent)
        reports: list[list[int]] = [[] for _ in range(n)]
        root = 0
        for responder, boss in enumerate(parent):
            if boss == -1:
                root = responder
            else:
                reports[boss].append(responder)
        received = [0] * n
        latest = 0
        to_visit = [root]
        while to_visit:
            responder = to_visit.pop()
            for report in reports[responder]:
                received[report] = received[responder] + delay[responder]
                latest = max(latest, received[report])
                to_visit.append(report)
        return latest
  javascript: |
    function alertFanoutTime(parent, delay) {
      const n = parent.length;
      const reports = Array.from({ length: n }, () => []);
      let root = 0;
      for (let i = 0; i < n; i++) {
        if (parent[i] === -1) root = i;
        else reports[parent[i]].push(i);
      }
      const received = new Array(n).fill(0);
      let latest = 0;
      const toVisit = [root];
      while (toVisit.length > 0) {
        const responder = toVisit.pop();
        for (const report of reports[responder]) {
          received[report] = received[responder] + delay[responder];
          if (received[report] > latest) latest = received[report];
          toVisit.push(report);
        }
      }
      return latest;
    }
