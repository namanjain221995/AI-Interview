expected_concepts:
  - "Bellman-Ford relaxation and the n-1 rounds bound"
  - "detecting a negative cycle by a further successful relaxation"
  - "virtual source (all distances start at 0) to cover every component"
  - "why Dijkstra does not work with negative costs"
  - "O(n * m) time, O(n) space"
optimal_complexity: {time: "O(n * m)", space: "O(n)"}
rubric:
  excellent: "Uses Bellman-Ford with all distances initialised to 0 (or a virtual source), explains why a relaxation in round n proves a negative loop, adds the early exit, handles self-segments and parallel segments, and contrasts with Dijkstra and with Floyd-Warshall's diagonal check."
  good: "Correct Bellman-Ford or Floyd-Warshall solution; may initially run it only from junction 0 and fix it after a prompt about unreachable loops."
  weak: "Returns true whenever any cost is negative, uses Dijkstra, runs Bellman-Ford only from junction 0, or uses an infinity sentinel that breaks the check for unreachable junctions."
  criteria:
    correctness: "All tests pass, including unreachable loops, zero-total loops and negative costs without loops."
    efficiency: "O(n * m) with an early exit when a round changes nothing."
    code_quality: "Clear relaxation loop, a single place where the extra round decides the answer."
    edge_cases: "Self-segments, parallel segments, a single junction, no segments, long rings."
    communication: "Explains why n - 1 rounds suffice for shortest paths without negative loops."
hints:
  - "Think about what happens to shortest-route costs when a loop with a negative total exists: they can keep getting smaller forever."
  - "Bellman-Ford settles all shortest costs within n - 1 rounds unless a negative loop exists, so a further improvement is the signal. Make sure loops that junction 0 cannot reach are also covered."
  - "Start every junction's best known cost at zero, as if a virtual start point reached each of them for free. Repeat up to n rounds of relaxing every segment; if a round changes nothing, answer false right away, and if the n-th round still lowers some cost, answer true."
followups:
  - "How would you return the junctions that form one negative loop?"
  - "How would you find every junction whose cheapest route cost from junction 0 is unbounded?"
  - "Could Floyd-Warshall answer the same question, and what would you check at the end?"
  - "How would you handle a network with a million segments that changes a few prices per minute?"
common_errors:
  - "Returning true as soon as any segment has a negative cost."
  - "Running Bellman-Ford only from junction 0, so unreachable loops are missed."
  - "Initialising distances to infinity and adding to infinity, which overflows or never relaxes unreachable parts."
  - "Running only n - 2 rounds, or checking for improvement before the loop has had n - 1 rounds."
  - "Using Dijkstra, which is not correct with negative costs."
