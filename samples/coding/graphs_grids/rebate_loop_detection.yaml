version: 1
slug: rebate_loop_detection
title: "Detect a Rebate Loop"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, security, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Detect a Rebate Loop

  A toll-road operator models its network as `n` junctions numbered `0` to `n - 1`, connected by
  **one-way** segments. Each entry `[from, to, cost]` in `segments` means a vehicle may drive from
  junction `from` to junction `to` and is charged `cost`. Promotional segments have a **negative** cost:
  the driver receives a rebate.

  Before a new price list goes live, the billing team must make sure nobody can farm rebates by driving in
  circles. A **loop** is a route that follows segments in their direction and returns to the junction it
  started from; its total is the sum of the costs of the segments it uses. Return `true` if the network
  contains at least one loop with a **negative** total, otherwise `false`.

  - The loop can be anywhere in the network; it does not have to be reachable from junction `0`.
  - A loop whose total is exactly `0` is acceptable.
  - A segment from a junction to itself is a loop on its own.

  ### Example 1
  ```
  Input:  n = 3, segments = [[0, 1, 4], [1, 2, -2], [2, 0, -3]]
  Output: true
  Explanation: 0 -> 1 -> 2 -> 0 costs 4 - 2 - 3 = -1.
  ```

  ### Example 2
  ```
  Input:  n = 3, segments = [[0, 1, 4], [1, 2, -2], [2, 0, -2]]
  Output: false
  Explanation: The only loop costs 4 - 2 - 2 = 0.
  ```

  ### Example 3
  ```
  Input:  n = 5, segments = [[0, 1, 1], [1, 2, 1], [3, 4, -5], [4, 3, 2]]
  Output: true
  Explanation: Junctions 3 and 4 form a loop costing -3, even though junction 0 cannot reach them.
  ```

  ### Constraints
  - `1 <= n <= 300`
  - `0 <= segments.length <= 3000`
  - `segments[i] = [from, to, cost]` with `0 <= from, to < n` and `-10^4 <= cost <= 10^4`
  - `from == to` is allowed, and several segments may join the same ordered pair of junctions.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: has_negative_cycle
  params:
    - {name: n, type: "int"}
    - {name: segments, type: "int[][]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def has_negative_cycle(n: int, segments: list[list[int]]) -> bool:
        # Bellman-Ford from a virtual source joined to every junction at cost 0:
        # starting every distance at 0 covers loops anywhere in the network.
        dist = [0] * n
        for _ in range(n):
            changed = False
            for frm, to, cost in segments:
                if dist[frm] + cost < dist[to]:
                    dist[to] = dist[frm] + cost
                    changed = True
            if not changed:
                return False
        # Still relaxing after n rounds: some loop keeps lowering the cost.
        return True
  javascript: |
    function hasNegativeCycle(n, segments) {
      const dist = new Array(n).fill(0);
      for (let round = 0; round < n; round++) {
        let changed = false;
        for (const [from, to, cost] of segments) {
          if (dist[from] + cost < dist[to]) {
            dist[to] = dist[from] + cost;
            changed = true;
          }
        }
        if (!changed) return false;
      }
      return true;
    }
