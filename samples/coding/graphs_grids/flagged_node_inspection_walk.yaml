slug: flagged_node_inspection_walk
title: "Inspection Walk Over Flagged Nodes"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, sre, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Inspection Walk Over Flagged Nodes

  A field engineer inspects equipment cabinets on a campus network. There are `n` cabinets numbered `0` to
  `n - 1`, joined by `n - 1` cable runs: each entry `[a, b]` in `links` is a run between cabinets `a` and
  `b` that can be walked in either direction. The runs connect every cabinet and there is exactly one
  route between any two cabinets (the layout is a tree).

  `flagged[i]` is `true` when cabinet `i` needs a physical check. The engineer starts at cabinet `0`,
  walks along cable runs (each time a run is walked, in either direction, costs `1`) and must **finish back
  at cabinet `0`**. A cabinet counts as checked as soon as the engineer passes it.

  Return the **minimum total cost** of a walk that passes every flagged cabinet. If no cabinet is flagged,
  or only cabinet `0` is, the answer is `0`.

  ### Example 1
  ```
  Input:  n = 7, links = [[0, 1], [0, 2], [1, 4], [1, 5], [2, 3], [2, 6]], flagged = [false, false, true, false, true, true, false]
  Output: 8
  Explanation: The walk must use runs 0-1, 1-4, 1-5 and 0-2, each once out and once back: 4 runs x 2 = 8.
  ```

  ### Example 2
  ```
  Input:  n = 7, links = [[0, 1], [0, 2], [1, 4], [1, 5], [2, 3], [2, 6]], flagged = [false, false, true, false, false, true, false]
  Output: 6
  ```

  ### Example 3
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [0, 3]], flagged = [false, false, false, false]
  Output: 0
  ```

  ### Constraints
  - `1 <= n <= 5 * 10^4`
  - `links.length == n - 1`
  - `links[i] = [a, b]` with `0 <= a, b < n` and `a != b`; the runs form a tree.
  - `flagged.length == n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_inspection_walk
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: flagged, type: "bool[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_inspection_walk(n: int, links: list[list[int]], flagged: list[bool]) -> int:
        adjacent: list[list[int]] = [[] for _ in range(n)]
        for a, b in links:
            adjacent[a].append(b)
            adjacent[b].append(a)
        # Iterative DFS order from node 0, then process children before parents.
        parent = [-1] * n
        order = []
        seen = [False] * n
        seen[0] = True
        stack = [0]
        while stack:
            node = stack.pop()
            order.append(node)
            for other in adjacent[node]:
                if not seen[other]:
                    seen[other] = True
                    parent[other] = node
                    stack.append(other)
        needed = list(flagged)
        cost = 0
        for node in reversed(order):
            if node != 0 and needed[node]:
                # The link to the parent is walked once in each direction.
                cost += 2
                needed[parent[node]] = True
        return cost
  javascript: |
    function minInspectionWalk(n, links, flagged) {
      const adjacent = Array.from({ length: n }, () => []);
      for (const [a, b] of links) {
        adjacent[a].push(b);
        adjacent[b].push(a);
      }
      const parent = new Array(n).fill(-1);
      const seen = new Array(n).fill(false);
      const order = [];
      seen[0] = true;
      const stack = [0];
      while (stack.length > 0) {
        const node = stack.pop();
        order.push(node);
        for (const other of adjacent[node]) {
          if (!seen[other]) {
            seen[other] = true;
            parent[other] = node;
            stack.push(other);
          }
        }
      }
      const needed = flagged.slice();
      let cost = 0;
      for (let i = order.length - 1; i >= 0; i--) {
        const node = order[i];
        if (node !== 0 && needed[node]) {
          cost += 2;
          needed[parent[node]] = true;
        }
      }
      return cost;
    }
