expected_concepts:
  - "rooting the tree at cabinet 0"
  - "a run is needed exactly when the subtree below it contains a flagged cabinet"
  - "each needed run is walked exactly twice in a closed walk"
  - "post-order aggregation (iterative to avoid deep recursion)"
  - "O(n) time and space"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Roots the tree at 0, argues that a run must be walked exactly twice when its lower side holds a flagged cabinet and never otherwise, computes it with a post-order pass (iterative or with depth discussed) and states O(n)."
  good: "Correct subtree-aggregation solution with minor prompting on the root's own flag or on undirected links."
  weak: "Sums distances from 0 to every flagged cabinet, counts each run once, assumes links are given parent-first, or walks the whole tree."
  criteria:
    correctness: "All tests pass, including flagged internal cabinets, a flagged cabinet 0 and links in arbitrary orientation."
    efficiency: "One traversal plus one bottom-up pass."
    code_quality: "Clear separation of building the rooted order and aggregating flags; the 2 per run rule is explicit."
    edge_cases: "Single cabinet, nothing flagged, only cabinet 0 flagged, long paths."
    communication: "Explains why shared route prefixes are counted only once and why each needed run costs exactly 2."
