  - "Think about each cable run separately: when does the engineer have to cross it at all, and how many times?"
  - "Root the tree at cabinet 0. A run has to be used exactly when the part of the tree below it contains a flagged cabinet, and a walk that returns home crosses such a run once going down and once coming back."
  - "Build an undirected adjacency list, record a parent for each cabinet with a traversal from cabinet 0, then process cabinets from the deepest upward. When a cabinet other than 0 is flagged or has a needed cabinet below it, add two to the total and mark its parent as needed as well."
followups:
  - "What is the minimum cost if the engineer may finish at any cabinet instead of returning to 0?"
  - "How would you return the actual order in which to visit the cabinets?"
  - "What changes if each run has a different walking time?"
  - "How would you update the answer quickly when one cabinet's flag toggles?"
common_errors:
  - "Adding the full distance from 0 to every flagged cabinet, which double counts shared routes."
  - "Counting each needed run once instead of twice for the return trip."
  - "Assuming each link is given as parent then child."
  - "Adding cost for cabinet 0 when it is flagged."
  - "Recursion depth errors on long paths."
