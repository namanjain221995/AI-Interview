expected_concepts:
  - "grid simulation with direction vectors"
  - "cycle detection with a visited grid"
  - "pigeonhole bound - at most rows x cols steps before a repeat"
  - "bounds checking before indexing"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Simulates with a direction table, detects loops by marking visited cells, argues that each cell is entered at most once before a repeat proves a loop, and counts the exit move correctly."
  good: "Correct simulation that may first use a step cap of rows times cols or need a nudge on counting the final move."
  weak: "Loops forever on cyclic belts, uses an arbitrary step cap, or reads out of bounds when the parcel leaves."
  criteria:
    correctness: "All tests pass, including loops that do not include the start cell and immediate exits."
    efficiency: "Linear in the number of cells with a visited grid or step cap."
    code_quality: "Direction lookup table instead of repeated if branches, and a clear loop condition."
    edge_cases: "Single cell, single row or column, a tail into a loop and the longest snake path."
    communication: "Explains why revisiting any cell (not only the start) means the parcel never leaves."
hints:
  - "The parcel's path is completely determined by its current cell, so think about what it means if it ever lands on a cell it has already been on."
  - "Simulate the movement step by step and remember which cells have been visited; the walk can last at most as many steps as there are cells before something repeats."
  - "Map each tile character to a row and column change, keep a visited grid, and loop while the position is inside the grid: if the cell is already visited return minus one, otherwise mark it, move and add one step; when the loop ends the step count includes the move off the edge."
followups:
  - "How would you answer the same question for a parcel dropped on every cell, in total linear time?"
  - "Can you detect the loop with O(1) extra memory?"
  - "How would you report which cells form the loop so a technician can fix a belt?"
common_errors:
  - "Only checking for a return to the start cell, which misses loops entered after a tail."
  - "Not counting the final move off the grid, giving an answer one too small."
  - "Indexing the grid after moving without a bounds check."
  - "Swapping rows and columns so '^' and 'v' move sideways."
