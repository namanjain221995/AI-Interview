slug: conveyor_parcel_exit
title: "Conveyor Parcel Exit"
difficulty: easy
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [general, backend, qa, mobile]
time_limit_minutes: 12
prompt_markdown: |
  ## Conveyor Parcel Exit

  A parcel-sorting floor is a rectangular grid of conveyor belt tiles. `belts[r]` describes row `r` from
  left to right, and every character is one of:

  | tile | moves the parcel |
  |------|------------------|
  | `>` | one cell right |
  | `<` | one cell left |
  | `^` | one cell up (to the previous row) |
  | `v` | one cell down (to the next row) |

  A technician drops a test parcel on the **top-left** cell (row `0`, column `0`). Every second the parcel
  moves exactly one cell in the direction of the tile it is currently on. Each such move is one **step**,
  including the final move that carries the parcel off the edge of the grid.

  Return the number of steps until the parcel leaves the grid, or `-1` if the belts send it round a loop
  so that it never leaves.

  ### Example 1
  ```
  Input:  belts = [">>v", "v<<"]
  Output: 6
  Explanation: Right, right, down, left, left, then down off the bottom edge: 6 steps.
  ```

  ### Example 2
  ```
  Input:  belts = [">v", "^<"]
  Output: -1
  Explanation: The parcel cycles through all four cells forever.
  ```

  ### Example 3
  ```
  Input:  belts = ["v>", ">^"]
  Output: 4
  Explanation: Down, right, up, then right off the right edge from row 0: 4 steps.
  ```

  ### Constraints
  - `1 <= belts.length <= 100`
  - `1 <= belts[r].length <= 100`, and all rows have the same length
  - Every character of `belts[r]` is one of `>`, `<`, `^`, `v`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: conveyor_exit_steps
  params:
    - {name: belts, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def conveyor_exit_steps(belts: list[str]) -> int:
        rows, cols = len(belts), len(belts[0])
        moves = {">": (0, 1), "<": (0, -1), "^": (-1, 0), "v": (1, 0)}
        visited = [[False] * cols for _ in range(rows)]
        r = c = steps = 0
        while 0 <= r < rows and 0 <= c < cols:
            if visited[r][c]:
                return -1
            visited[r][c] = True
            dr, dc = moves[belts[r][c]]
            r, c = r + dr, c + dc
            steps += 1
        return steps
  javascript: |
    function conveyorExitSteps(belts) {
      const rows = belts.length;
      const cols = belts[0].length;
      const moves = { ">": [0, 1], "<": [0, -1], "^": [-1, 0], "v": [1, 0] };
      const visited = Array.from({ length: rows }, () => new Array(cols).fill(false));
      let r = 0;
      let c = 0;
      let steps = 0;
      while (r >= 0 && r < rows && c >= 0 && c < cols) {
        if (visited[r][c]) return -1;
        visited[r][c] = true;
        const [dr, dc] = moves[belts[r][c]];
        r += dr;
        c += dc;
        steps++;
      }
      return steps;
    }
