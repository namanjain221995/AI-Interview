expected_concepts:
  - connected components over listings linked by shared barcodes
  - union-find (disjoint set union) or BFS/DFS over a barcode-to-listing index
  - mapping each barcode to the first listing that carried it
  - 64-bit aggregation and descending sort of component totals
optimal_complexity: {time: O(B * alpha(n) + n log n), space: O(n + B)}
rubric:
  excellent: Builds a barcode-to-listing map and unions listings (or runs BFS/DFS over the bipartite listing-barcode graph), aggregates stock per component with a 64-bit sum, sorts descending, handles empty listings, and explains why comparing every pair of listings is unnecessary.
  good: Correct component grouping and totals with small slips, such as forgetting empty listings or the descending order, fixed after testing.
  weak: Compares every pair of listings repeatedly, merges only direct matches (missing chains), or treats barcodes as numbers.
  criteria:
    correctness: Transitive grouping, one total per product, listings without barcodes counted as their own product, descending order.
    efficiency: Near-linear in the total number of barcodes plus a sort of the totals; no quadratic pairwise scans.
    code_quality: Clear separation between building the index, merging and aggregating; small union-find helper.
    edge_cases: No listings, repeated barcodes within a listing, leading zeros, zero stock and totals above 2^31.
    communication: Explains how transitivity is captured by connected components.
hints:
  - Think of listings as nodes and draw an edge whenever two listings carry the same barcode; what is a product in that picture?
  - Rather than comparing every pair of listings, remember for each barcode one listing that already carries it and connect new listings to that one.
  - Use a union-find over listing indices, merging each listing with the first owner of each of its barcodes; then add every listing's stock to its root's total and sort those totals from largest to smallest.
followups:
  - How would you also return which listing indices belong to each product?
  - Some barcodes are known to be reused by unrelated products; how would you exclude them from merging?
  - How would you process new listings arriving as a stream while keeping the totals up to date?
  - How would you parallelise the merge across machines for millions of listings?
common_errors:
  - Merging only listings that share a barcode directly, missing chains through other listings.
  - Dropping listings without barcodes instead of reporting them as their own product.
  - Converting barcodes to integers, which merges codes that differ only in leading zeros.
  - Summing totals in a 32-bit integer.
