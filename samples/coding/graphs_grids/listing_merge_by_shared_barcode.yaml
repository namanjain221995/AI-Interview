slug: listing_merge_by_shared_barcode
title: Merge Listings by Shared Barcode
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [data, backend, data_analyst, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Merge Listings by Shared Barcode

  A marketplace imports catalogue listings from many sellers, and the same physical product often shows
  up as several listings. Listing `i` carries the barcodes printed on its packaging in `barcodes[i]`
  (possibly none, possibly the same barcode twice) and has `stock[i]` units available.

  Two listings belong to the **same product** when they carry a common barcode. This is transitive: if
  listing A shares a barcode with B and B shares a (possibly different) barcode with C, then A, B and C
  are all one product even when A and C have no barcode in common. A listing without barcodes is a
  product on its own. Barcodes are compared as exact strings.

  Return the **total stock of every product** (the sum of `stock` over its listings), sorted in
  **descending** order. The result has one entry per product, so its length is the number of distinct
  products. Return an empty list when there are no listings.

  ### Example 1
  ```
  Input:  barcodes = [["4006381333931", "5012345678900"], ["9780201379624"], ["5012345678900", "0012345678905"], ["0012345678905"], []], stock = [12, 40, 5, 3, 7]
  Output: [40, 20, 7]
  Explanation: Listings 0, 2 and 3 are linked through 5012345678900 and 0012345678905 (12 + 5 + 3 = 20); listing 1 has 40; listing 4 has no barcodes and stands alone with 7
  ```

  ### Example 2
  ```
  Input:  barcodes = [["111"], ["222"], ["222", "333"], ["333"]], stock = [5, 5, 5, 5]
  Output: [15, 5]
  Explanation: Listings 1, 2 and 3 form one product (15); listing 0 is another (5)
  ```

  ### Constraints
  - `0 <= barcodes.length == stock.length <= 10^4`
  - `0 <= barcodes[i].length <= 10`
  - each barcode is 1 to 14 digits
  - `0 <= stock[i] <= 10^9` (totals can exceed 32 bits)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: product_stock_totals
  params:
    - {name: barcodes, type: "string[][]"}
    - {name: stock, type: "int[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def product_stock_totals(barcodes: list[list[str]], stock: list[int]) -> list[int]:
        n = len(barcodes)
        parent = list(range(n))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        first_owner: dict[str, int] = {}
        for i, codes in enumerate(barcodes):
            for code in codes:
                if code in first_owner:
                    a, b = find(i), find(first_owner[code])
                    if a != b:
                        parent[a] = b
                else:
                    first_owner[code] = i
        totals: dict[int, int] = {}
        for i in range(n):
            root = find(i)
            totals[root] = totals.get(root, 0) + stock[i]
        return sorted(totals.values(), reverse=True)
  javascript: |
    function productStockTotals(barcodes, stock) {
      const n = barcodes.length;
      const parent = Array.from({ length: n }, (_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const firstOwner = new Map();
      for (let i = 0; i < n; i++) {
        for (const code of barcodes[i]) {
          if (firstOwner.has(code)) {
            const a = find(i);
            const b = find(firstOwner.get(code));
            if (a !== b) parent[a] = b;
          } else {
            firstOwner.set(code, i);
          }
        }
      }
      const totals = new Map();
      for (let i = 0; i < n; i++) {
        const root = find(i);
        totals.set(root, (totals.get(root) || 0) + stock[i]); // exact below 2^53
      }
      return [...totals.values()].sort((a, b) => b - a);
    }
