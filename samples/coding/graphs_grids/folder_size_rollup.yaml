slug: folder_size_rollup
title: "Folder Size Roll-up"
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [backend, platform, sre, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Folder Size Roll-up

  A storage quota report needs the total size of every folder on a file server. There are `n`
  folders with ids `0` to `n - 1`, arranged as one tree: `parent[i]` is the folder that directly
  holds folder `i`, and the single top-level folder has `parent[i] == -1`. Ids are arbitrary, so a
  parent may have a larger id than its child.

  `direct_bytes[i]` is the size of the files stored **directly** in folder `i` (not counting its
  subfolders). The **total size** of a folder is its own direct bytes plus the direct bytes of every
  folder nested inside it at any depth.

  Return an array `totals` of length `n` where `totals[i]` is the total size of folder `i`. Totals can
  exceed the 32-bit integer range, so use 64-bit arithmetic.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1], direct_bytes = [10, 20, 30, 40]
  Output: [100, 60, 30, 40]
  Explanation: Folder 1 = 20 + 40 = 60; folder 0 = 10 + 60 + 30 = 100.
  ```

  ### Example 2
  ```
  Input:  parent = [2, 2, -1], direct_bytes = [5000000000, 7000000000, 1]
  Output: [5000000000, 7000000000, 12000000001]
  ```

  ### Constraints
  - `1 <= n == parent.length == direct_bytes.length <= 10^5`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]`
  - Following parents from any folder reaches the top-level folder (no loops)
  - `0 <= direct_bytes[i] <= 10^10`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: folder_totals
  params:
    - {name: parent, type: "int[]"}
    - {name: direct_bytes, type: "long[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def folder_totals(parent: list[int], direct_bytes: list[int]) -> list[int]:
        n = len(parent)
        children: list[list[int]] = [[] for _ in range(n)]
        root = 0
        for folder, up in enumerate(parent):
            if up == -1:
                root = folder
            else:
                children[up].append(folder)
        # breadth-first order puts every parent before its children
        order = [root]
        for folder in order:
            order.extend(children[folder])
        totals = list(direct_bytes)
        for folder in reversed(order):
            if parent[folder] != -1:
                totals[parent[folder]] += totals[folder]
        return totals
  javascript: |
    function folderTotals(parent, directBytes) {
      const n = parent.length;
      const children = Array.from({ length: n }, () => []);
      let root = 0;
      for (let folder = 0; folder < n; folder++) {
        if (parent[folder] === -1) root = folder;
        else children[parent[folder]].push(folder);
      }
      const order = [root];
      for (let i = 0; i < order.length; i++) {
        for (const child of children[order[i]]) order.push(child);
      }
      const totals = directBytes.slice();
      for (let i = order.length - 1; i >= 0; i--) {
        const folder = order[i];
        if (parent[folder] !== -1) totals[parent[folder]] += totals[folder];
      }
      return totals;
    }
