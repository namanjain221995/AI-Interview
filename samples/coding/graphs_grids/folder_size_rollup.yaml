  weak: "Walks from every folder up to the root adding its bytes to each ancestor (O(n * h) without discussion), processes folders in id order assuming parents have smaller ids, or overflows 32-bit totals."
  criteria:
    correctness: "All tests pass, including root ids that are not 0, parents with larger ids and totals beyond 32 bits."
    efficiency: "Linear time; each folder is added to its parent exactly once."
    code_quality: "Does not mutate the input arrays; clear separation of building the tree, ordering and accumulating."
    edge_cases: "Handles a single folder, empty folders, deep chains and wide stars."
    communication: "Explains the processing order and the 64-bit requirement."
hints:
  - "A folder's total depends on the totals of the folders directly inside it; which folders can you finish first?"
  - "If you had an order in which every parent appears before all of its children, walking that order backwards would let you finish each child before its parent."
  - "Build child lists, create a breadth-first order starting from the top-level folder, copy direct_bytes into totals, then iterate over the order from the end and add each folder's total to its parent's total."
followups:
  - "Files are added and removed constantly; how would you keep totals current without recomputing everything?"
  - "How would you report the k largest folders that are not nested inside one another?"
  - "Why can a recursive solution fail on this input size, and how would you show it in a test?"
  - "How would the approach change if the folder metadata were spread across several machines?"
common_errors:
  - "Iterating folders by id and adding into parents, which assumes parents have smaller ids and loses nested sizes."
  - "Using 32-bit integers in Java, Go or C++, so totals above about 2.1 billion overflow."
  - "Recursing through a 10^5-deep chain and overflowing the call stack."
  - "Adding a folder's direct bytes (instead of its finished total) to its parent, so grandchildren are missed."
