version: 1
slug: enclosed_roof_pools
title: Enclosed Roof Pools
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Enclosed Roof Pools

  After a storm, a facilities drone surveys a flat warehouse roof and produces a grid `roof`. Each
  string is one row of the grid and every row has the same length. A cell is `'.'` when it holds
  standing water and `'#'` when it is dry.

  Water cells that touch **horizontally or vertically** belong to the same body of water (diagonal
  contact does not count). Any body of water that includes at least one cell on the **outer edge**
  of the grid (first or last row, first or last column) drains off the roof by itself. A body of
  water with no cell on the edge is an **enclosed pool** and needs a crew to pump it out.

  Return the number of enclosed pools. An empty grid has none.

  ### Example 1
  ```
  Input:  roof = [
    "######",
    "#..#.#",
    "#.##.#",
    "####..",
    "######"
  ]
  Output: 1
  Explanation: The water at the top left is enclosed; the water on the right reaches the edge in the fourth row and drains.
  ```

  ### Example 2
  ```
  Input:  roof = [
    ".##.#",
    "#.#.#",
    "##.##",
    "#####"
  ]
  Output: 2
  Explanation: The water cells at (row 1, column 1) and (row 2, column 2), counting from 0, touch only diagonally, so they are two separate enclosed pools; every other water cell lies on the top edge or connects to it.
  ```

  ### Constraints
  - `0 <= roof.length <= 200`
  - `1 <= roof[i].length <= 200`, and all rows have the same length
  - `roof[i][j]` is `'.'` or `'#'`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_enclosed_pools
  params:
    - {name: roof, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def count_enclosed_pools(roof: list[str]) -> int:
        rows = len(roof)
        if rows == 0:
            return 0
        cols = len(roof[0])
        seen = [[False] * cols for _ in range(rows)]
        pools = 0
        for r in range(rows):
            for c in range(cols):
                if roof[r][c] != "." or seen[r][c]:
                    continue
                seen[r][c] = True
                queue = deque([(r, c)])
                touches_edge = False
                while queue:
                    y, x = queue.popleft()
                    if y == 0 or x == 0 or y == rows - 1 or x == cols - 1:
                        touches_edge = True
                    for ny, nx in ((y + 1, x), (y - 1, x), (y, x + 1), (y, x - 1)):
                        if 0 <= ny < rows and 0 <= nx < cols and not seen[ny][nx] and roof[ny][nx] == ".":
                            seen[ny][nx] = True
                            queue.append((ny, nx))
                if not touches_edge:
                    pools += 1
        return pools
  javascript: |
    function countEnclosedPools(roof) {
      const rows = roof.length;
      if (rows === 0) return 0;
      const cols = roof[0].length;
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      let pools = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (roof[r][c] !== "." || seen[r][c]) continue;
          seen[r][c] = true;
          const queue = [[r, c]];
          let touchesEdge = false;
          for (let head = 0; head < queue.length; head++) {
            const [y, x] = queue[head];
            if (y === 0 || x === 0 || y === rows - 1 || x === cols - 1) touchesEdge = true;
            for (const [ny, nx] of [[y + 1, x], [y - 1, x], [y, x + 1], [y, x - 1]]) {
              if (ny >= 0 && ny < rows && nx >= 0 && nx < cols && !seen[ny][nx] && roof[ny][nx] === ".") {
                seen[ny][nx] = true;
                queue.push([ny, nx]);
              }
            }
          }
          if (!touchesEdge) pools += 1;
        }
      }
      return pools;
    }
tests:
  - {id: t1, args: [["######", "#..#.#", "#.##.#", "####..", "######"]], expected: 1, description: "Example 1"}
  - {id: t2, args: [[".##.#", "#.#.#", "##.##", "#####"]], expected: 2, description: "Example 2 - diagonal contact does not join bodies of water"}
  - {id: t3, hidden: true, args: [[]], expected: 0, description: "Empty grid"}
  - {id: t4, hidden: true, args: [["..."]], expected: 0, description: "Single row: every water cell is on the edge"}
  - {id: t5, hidden: true, args: [["#####", "#...#", "#...#", "#####"]], expected: 1, description: "One enclosed pool of several cells"}
  - {id: t6, hidden: true, args: [["....", "....", "...."]], expected: 0, description: "Roof entirely under water drains completely"}
  - {id: t7, hidden: true, args: [["#######", "#.....#", "#.###.#", "#.#.#.#", "#.###.#", "#.....#", "#######"]], expected: 2, description: "Ring of water around a dry island that holds its own pool: two pools"}
  - {id: t8, hidden: true, args: [["#########", "#.......#", "#.#####.#", "#.#...#.#", "#.#.#.#.#", "#.#.###.#", "#.#.....#", "#.#######", "#........"]], expected: 0, description: "Long winding channel connects the centre to the bottom-right edge: zero pools"}
  - {id: t9, hidden: true, args: [["#.#", "#.#", "#.#", "#.#"]], expected: 0, description: "Vertical channel touching top and bottom edges"}
  - {id: t10, hidden: true, args: [["####################", "#.#.#.#.#.#.#.#.####", "####################", "#.#.#.#.#.#.#.#.####", "####################", "#.#.#.#.#.#.#.#.####", "####################", "#.#.#.#.#.#.#.#.####", "####################", "#.#.#.#.#...........", "####################", "#.#.#.#.#.#.#.#.####", "####################", "#.#.#.#.#.#.#.#.####", "####################", "#.#.#.#.#.#.#.#.####", "####################", "#.#.#.#.#.#.#.#.####", "####################", "####################"]], expected: 68, description: "20x20 grid of single-cell pools with a channel draining part of one row"}
expected_concepts:
  - "flood fill with breadth-first or depth-first search"
  - "4-directional connectivity on a grid"
  - "tracking whether a component touches the border"
  - "visited marking to keep the scan linear"
optimal_complexity: {time: "O(R * C)", space: "O(R * C)"}
rubric:
  excellent: "Flood-fills each body of water once, records whether it touches the edge (or first flood-fills from all edge water and then counts the rest), uses an iterative traversal and explains the linear bound."
  good: "Correct flood fill with a small slip fixed after a prompt, such as stopping the fill early when the edge is reached and then recounting part of the same body."
  weak: "Counts every body of water including draining ones, uses diagonal neighbours, or abandons a fill as soon as it reaches the edge so the rest of that body is later counted as a pool."
  criteria:
    correctness: "All tests pass, including the winding channel, nested pools and the empty grid."
    efficiency: "Every cell is visited a constant number of times."
    code_quality: "Direction list, bounds check in one place and a clear visited structure."
    edge_cases: "Empty grid, single row or column, all-water roof and long winding channels."
    communication: "Explains why a fill must finish even after the edge is found, or describes the edge-first alternative."
hints:
  - "Think of each body of water as a connected region of the grid and decide, for each region, whether it ever reaches the boundary."
  - "A flood fill from any unvisited water cell visits exactly one body of water; while filling, remember whether any visited cell lies on the first or last row or column."
  - "Scan every cell; whenever you meet unvisited water, run an iterative breadth-first fill over its four neighbours, marking cells as visited and setting a flag when a cell sits on the boundary, and only after the fill has finished add one to the answer if the flag stayed unset; alternatively flood from all boundary water first and count the regions that remain."
followups:
  - "How would you return the total area of all enclosed pools instead of their count?"
  - "How would the answer change if diagonal contact also joined water cells?"
  - "How would you handle a roof grid too large to keep in memory, streamed one row at a time?"
  - "How would you avoid a stack overflow if you used recursion?"
common_errors:
  - "Stopping the flood fill as soon as an edge cell is found, leaving the rest of that body to be counted later as a pool."
  - "Counting all bodies of water instead of only enclosed ones."
  - "Treating diagonal neighbours as connected."
  - "Recursive fill that overflows the call stack on a large all-water roof."
