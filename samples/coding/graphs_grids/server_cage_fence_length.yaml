expected_concepts:
  - "grid neighbour inspection"
  - "perimeter of a union of unit squares"
  - "treating out-of-bounds as open"
  - "alternative counting: 4 * racks - 2 * shared sides"
optimal_complexity: {time: "O(rows * cols)", space: "O(1)"}
rubric:
  excellent: "Counts, for every rack tile, the sides facing an open tile or the map edge (or uses 4 * racks - 2 * shared adjacencies), explains why holes need no special handling, and states O(rows * cols) time with O(1) extra space."
  good: "Correct per-tile side counting with bounds checks; may first try a flood fill from outside before realising it is unnecessary."
  weak: "Ignores the map edge, skips fencing around enclosed holes, subtracts each shared side only once in the 4 * racks formula, or reads out of bounds."
  criteria:
    correctness: "All tests pass, including holes, the fully covered map and diagonal-only racks."
    efficiency: "Single pass over the grid with constant work per tile; no BFS needed."
    code_quality: "Neighbour offsets defined once and a compact bounds check."
    edge_cases: "1 x 1 map, no racks, every tile a rack, single row, enclosed open tiles."
    communication: "Explains the counting rule clearly and verifies it on a small shape by hand."
hints:
  - "The fence only depends on each rack tile and what lies directly next to it; you do not need to know which group a rack belongs to."
  - "Look at the four sides of every rack tile and decide side by side whether a fence is needed: is the neighbour outside the map or open floor?"
  - "Loop over every tile; for each rack tile check the cells above, below, left and right, adding one when the cell is outside the map or is not a rack. Alternatively count racks and edge-sharing rack pairs and use four times the racks minus twice the shared pairs."
followups:
  - "How would you fence only the outside of each rack group, ignoring enclosed holes?"
  - "How would you return the fence length per connected group of racks?"
  - "If racks are added one at a time, how would you update the total in O(1) per addition?"
  - "How would you handle a map so large that only one row fits in memory at a time?"
common_errors:
  - "Forgetting that the map edge needs fencing, so border racks are under-counted."
  - "Using 4 * racks - shared instead of 4 * racks - 2 * shared."
  - "Flood-filling the outside and skipping fence around enclosed open tiles."
  - "Off-by-one bounds checks that wrap around with negative indices in Python."
