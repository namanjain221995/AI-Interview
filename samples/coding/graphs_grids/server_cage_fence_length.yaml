slug: server_cage_fence_length
title: Server Cage Fence Length
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, fullstack]
time_limit_minutes: 12
prompt_markdown: |
  ## Server Cage Fence Length

  A colocation provider is ordering mesh fencing for a hall. The floor plan `floor` is a list of
  equal-length strings where `#` is a tile occupied by a rack and `.` is an open tile. Every tile is a
  1 x 1 square.

  Fencing must run along every unit side of a rack tile that faces an open tile **or** the outer edge of
  the map. Sides shared by two rack tiles need no fence. Open tiles completely surrounded by racks still
  count as open, so the rack sides around such holes are fenced too.

  Return the total length of fencing needed.

  ### Example 1
  ```
  Input:  floor = ["##.",
                   "#.."]
  Output: 8
  Explanation: Three rack tiles in an L shape: 3 * 4 = 12 sides minus 2 shared sides on each of the two joins.
  ```

  ### Example 2
  ```
  Input:  floor = ["###",
                   "#.#",
                   "###"]
  Output: 16
  Explanation: 12 units around the outside plus 4 units around the open tile in the middle.
  ```

  ### Constraints
  - `1 <= floor.length <= 100` and `1 <= floor[i].length <= 100`; all strings have the same length.
  - Every character is `#` or `.`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: fence_length
  params:
    - {name: floor, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def fence_length(floor: list[str]) -> int:
        rows, cols = len(floor), len(floor[0])
        total = 0
        for r in range(rows):
            for c in range(cols):
                if floor[r][c] != "#":
                    continue
                for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                    if not (0 <= nr < rows and 0 <= nc < cols) or floor[nr][nc] != "#":
                        total += 1
        return total
  javascript: |
    function fenceLength(floor) {
      const rows = floor.length;
      const cols = floor[0].length;
      let racks = 0;
      let shared = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (floor[r][c] !== "#") continue;
          racks += 1;
          if (r + 1 < rows && floor[r + 1][c] === "#") shared += 1;
          if (c + 1 < cols && floor[r][c + 1] === "#") shared += 1;
        }
      }
      return 4 * racks - 2 * shared;
    }
