  - {id: t2, args: [["###", "#.#", "###"]], expected: 16, description: "Example 2 - enclosed open tile is fenced on the inside"}
  - {id: t3, hidden: true, args: [["#"]], expected: 4, description: "Single rack tile on a 1 x 1 map - all four sides on the map edge"}
  - {id: t4, hidden: true, args: [["...", "..."]], expected: 0, description: "No racks - zero fencing"}
  - {id: t5, hidden: true, args: [["####", "####", "####"]], expected: 14, description: "Map fully covered by racks - only the outer edge, 14"}
  - {id: t6, hidden: true, args: [["#.#", ".#.", "#.#"]], expected: 20, description: "Diagonal-only racks share no sides - 5 * 4 = 20"}
  - {id: t7, hidden: true, args: [["#.##..###"]], expected: 18, description: "Single row with runs of 1, 2 and 3 racks"}
  - {id: t8, hidden: true, args: [["#####", "#.#.#", "#####"]], expected: 24, description: "Two separate enclosed holes"}
