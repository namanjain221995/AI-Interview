expected_concepts:
  - "breadth-first search for shortest paths in an unweighted grid"
  - "distance or visited array marked when a cell is enqueued"
  - "bounds and obstacle checks"
  - "returning -1 when the target is unreachable"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Chooses BFS because every move costs one, locates S, records distances when cells are enqueued, stops at E, returns -1 when the queue empties and explains why DFS would not give the minimum; states O(rows * cols) time and space."
  good: "Correct BFS that may mark cells when dequeued or scan the grid an extra time, with the right complexity."
  weak: "Uses DFS and returns the first path found, forgets to mark visited cells so the search loops, allows diagonal moves or moves through racks, or returns 0 instead of -1 when unreachable."
  criteria:
    correctness: "All tests pass, including unreachable exits, two routes of different lengths and the long serpentine."
    efficiency: "Each cell enters the queue at most once; uses a real queue (deque or head index) instead of repeated list shifting."
    code_quality: "Neighbour offsets defined once, distance tracking clear, start lookup separated from the search."
    edge_cases: "Adjacent S and E, single row or column, enclosed exit, start surrounded by racks."
    communication: "Explains why BFS order guarantees the first time E is reached is the shortest."
hints:
  - "Every move costs the same, so think about exploring cells in order of how many moves they take to reach."
  - "Explore level by level from the start: first every cell one move away, then every cell two moves away, and so on, never revisiting a cell."
  - "Find S, put it in a queue with distance 0 and mark it; repeatedly take the front cell, return its distance if it is E, otherwise add each in-bounds, non-rack, unmarked neighbour with distance plus one and mark it immediately. If the queue runs out, return -1."
followups:
  - "How would you return the actual sequence of moves, not just the count?"
  - "If several robots start at different cells, how would you find the fastest robot to reach the exit in one search?"
  - "What changes if turning costs an extra move, or if some aisles are slower than others?"
  - "How would A* with a Manhattan distance heuristic change the work done on a large open hall?"
common_errors:
  - "Using DFS, which finds a path but not necessarily the shortest one."
  - "Marking cells visited only when dequeued, so cells are enqueued many times."
  - "Treating S or E as blocked, or forgetting the -1 case."
  - "Removing from the front of a plain array in a loop, turning BFS quadratic on large grids."
