slug: warehouse_exit_min_moves
title: Warehouse Exit in Fewest Moves
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, mobile, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Warehouse Exit in Fewest Moves

  A warehouse picking robot has finished its shift and must drive to the charging exit. The warehouse
  `layout` is a list of equal-length strings:

  - `S` is the robot's start cell (exactly one),
  - `E` is the exit cell (exactly one),
  - `#` is a rack the robot cannot enter,
  - `.` is an open aisle cell.

  In one move the robot goes to the cell directly above, below, left or right of it, never diagonally,
  never onto a rack and never off the map. `S` and `E` are open cells.

  Return the minimum number of moves needed to reach `E` from `S`, or `-1` if the exit cannot be reached.

  ### Example 1
  ```
  Input:  layout = ["S.#",
                    "..#",
                    "#.E"]
  Output: 4
  Explanation: down, right, down, right.
  ```

  ### Example 2
  ```
  Input:  layout = ["S#.",
                    "##.",
                    "..E"]
  Output: -1
  Explanation: The start is boxed in by racks.
  ```

  ### Constraints
  - `1 <= layout.length <= 100` and `1 <= layout[i].length <= 100`; all strings have the same length.
  - Every character is `S`, `E`, `#` or `.`; `S` and `E` each appear exactly once.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_moves_to_exit
  params:
    - {name: layout, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def min_moves_to_exit(layout: list[str]) -> int:
        rows, cols = len(layout), len(layout[0])
        start = next((r, c) for r in range(rows) for c in range(cols) if layout[r][c] == "S")
        dist = [[-1] * cols for _ in range(rows)]
        dist[start[0]][start[1]] = 0
        queue = deque([start])
        while queue:
            r, c = queue.popleft()
            if layout[r][c] == "E":
                return dist[r][c]
            for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                if 0 <= nr < rows and 0 <= nc < cols and layout[nr][nc] != "#" and dist[nr][nc] == -1:
                    dist[nr][nc] = dist[r][c] + 1
                    queue.append((nr, nc))
        return -1
  javascript: |
    function minMovesToExit(layout) {
      const rows = layout.length;
      const cols = layout[0].length;
      const dist = Array.from({ length: rows }, () => new Array(cols).fill(-1));
      let queue = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (layout[r][c] === "S") {
            dist[r][c] = 0;
            queue.push([r, c]);
          }
        }
      }
      while (queue.length > 0) {
        const next = [];
        for (const [r, c] of queue) {
          if (layout[r][c] === "E") return dist[r][c];
          for (const [nr, nc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && layout[nr][nc] !== "#" && dist[nr][nc] === -1) {
              dist[nr][nc] = dist[r][c] + 1;
              next.push([nr, nc]);
            }
          }
        }
        queue = next;
      }
      return -1;
    }
