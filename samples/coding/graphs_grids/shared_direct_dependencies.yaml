slug: shared_direct_dependencies
title: "Shared Direct Dependencies"
difficulty: easy
competency_keys: [data_structures, problem_solving]
role_tags: [backend, platform, general, qa]
time_limit_minutes: 12
prompt_markdown: |
  ## Shared Direct Dependencies

  Before merging two services, a platform team wants to know which downstream services both of them
  already talk to. There are `n` services with ids `0` to `n - 1`. Tracing produced a list of call
  records: `[caller, callee]` means service `caller` makes **direct** calls to service `callee`. The
  same record can appear many times, because it is logged once per sampled request.

  Given two different services `a` and `b`, return the ids of every service that **both** `a` and `b`
  call directly, **each once** and **in ascending order**. Calls are one-directional: `b` calling
  `x` says nothing about `x` calling `b`, and services reached only indirectly (through another
  service) do not count. Return an empty array if `a` and `b` share no direct callee.

  ### Example 1
  ```
  Input:  n = 6, calls = [[0, 3], [0, 2], [1, 3], [1, 2], [1, 4], [0, 5]], a = 0, b = 1
  Output: [2, 3]
  Explanation: Service 0 calls 2, 3 and 5; service 1 calls 2, 3 and 4.
  ```

  ### Example 2
  ```
  Input:  n = 5, calls = [[0, 1], [1, 4], [2, 3]], a = 0, b = 2
  Output: []
  Explanation: 0 calls 1 and 1 calls 4, but 4 is not a direct callee of 0. Service 2 only calls 3.
  ```

  ### Example 3
  ```
  Input:  n = 4, calls = [[3, 1], [3, 1], [2, 1], [2, 1], [2, 0]], a = 3, b = 2
  Output: [1]
  ```

  ### Constraints
  - `2 <= n <= 10^4`
  - `0 <= calls.length <= 10^5`
  - `calls[i].length == 2`, `0 <= caller, callee < n` and `caller != callee`
  - `0 <= a, b < n` and `a != b`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shared_dependencies
  params:
    - {name: n, type: "int"}
    - {name: calls, type: "int[][]"}
    - {name: a, type: "int"}
    - {name: b, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def shared_dependencies(n: int, calls: list[list[int]], a: int, b: int) -> list[int]:
        from_a: set[int] = set()
        from_b: set[int] = set()
        for caller, callee in calls:
            if caller == a:
                from_a.add(callee)
            elif caller == b:
                from_b.add(callee)
        return sorted(from_a & from_b)
  javascript: |
    function sharedDependencies(n, calls, a, b) {
      const fromA = new Set();
      const fromB = new Set();
      for (const [caller, callee] of calls) {
        if (caller === a) fromA.add(callee);
        else if (caller === b) fromB.add(callee);
      }
      return [...fromA].filter((svc) => fromB.has(svc)).sort((x, y) => x - y);
    }
