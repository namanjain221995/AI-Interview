expected_concepts:
  - "building the outgoing neighbour set of two specific nodes"
  - "set intersection"
  - "de-duplicating repeated records"
  - "edge direction in a directed graph"
optimal_complexity: {time: "O(e + k log k)", space: "O(k)"}
rubric:
  excellent: "Makes one pass over the records collecting only a's and b's callees into sets, intersects them, sorts the result and notes that memory is bounded by those two services' out-degrees."
  good: "Builds a full adjacency structure for every service and intersects the two relevant lists correctly, or fixes a duplicate or ordering issue after running tests."
  weak: "Uses nested loops over the full record list for every pair without considering cost, counts callers instead of callees, includes indirect callees, or returns duplicates."
  criteria:
    correctness: "All tests pass, including mutual calls, direction traps and repeated records."
    efficiency: "Single pass over the records plus sorting the (usually small) intersection."
    code_quality: "Clear naming of the two callee sets and a concise intersection."
    edge_cases: "Handles no records, no overlap, repeated records and ids of two or more digits."
    communication: "Explains why only outgoing edges of a and b matter and how duplicates are removed."
hints:
  - "You only care about the records whose caller is a or b; everything else in the trace can be skipped."
  - "Collect the direct callees of a and of b into two structures that ignore repeats, then look for what they have in common."
  - "In one pass put the callee of every record from a into one set and from b into another, intersect the two sets and return the intersection sorted numerically."
followups:
  - "How would you rank every pair of services by how many direct callees they share?"
  - "How would you answer the question for services that are called by both a and b instead?"
  - "If the trace is a stream of billions of records, how would you keep the answer up to date?"
  - "How would you include callees reachable within two hops?"
common_errors:
  - "Matching on the callee column instead of the caller column, which returns shared callers."
  - "Returning duplicates because repeated records are not removed."
  - "Including services that are only reachable indirectly."
  - "Sorting numerically as strings in JavaScript so 10 comes before 9."
