time_limit_minutes: 25
prompt_markdown: |
  ## Robot Minimum-Energy Grid Path

  A warehouse robot crosses a factory floor modelled as a grid `cost` of `rows x cols` cells. Each cell
  holds a value from `1` to `9`: the energy the robot spends whenever it **enters** that cell (worn
  flooring, ramps and congested aisles cost more). The robot is placed on the top-left cell `(0, 0)` and
  must reach the charging dock on the bottom-right cell `(rows - 1, cols - 1)`.

  In one move the robot goes **up, down, left or right** to a neighbouring cell inside the grid. Moving
  back towards the start is allowed when a detour is cheaper.

  The energy of a route is the sum of the values of every cell it enters, **including the starting cell**
  `(0, 0)` and the dock. Return the **minimum energy** of any route from the start to the dock. On a
  `1 x 1` floor the robot is already docked and spends only the value of that single cell.

  ### Example 1
  ```
  Input:  cost = [[2, 5, 1], [1, 9, 3], [4, 1, 2]]
  Output: 10
  Explanation: Route (0,0) -> (1,0) -> (2,0) -> (2,1) -> (2,2) costs 2 + 1 + 4 + 1 + 2 = 10; going right first costs 2 + 5 + 1 + 3 + 2 = 13
  ```

  ### Example 2
  ```
  Input:  cost = [[1, 9, 1, 1, 1], [1, 9, 1, 9, 1], [1, 1, 1, 9, 1]]
  Output: 11
  Explanation: The route snakes down column 0, back up column 2 and down column 4, entering eleven cells of value 1
  ```

  ### Constraints
  - `1 <= rows, cols <= 100`
  - every row has the same length `cols`
  - `1 <= cost[r][c] <= 9`
languages: [python, javascript, typescript, java, go, cpp]
