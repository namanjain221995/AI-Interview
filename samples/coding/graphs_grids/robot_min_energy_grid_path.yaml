expected_concepts:
  - Dijkstra's algorithm on a grid with non-negative cell weights
  - priority queue (min-heap) keyed by accumulated energy
  - counting the start cell's cost in the initial distance
  - why right/down-only dynamic programming fails when detours are cheaper
optimal_complexity: {time: O(R*C log(R*C)), space: O(R*C)}
rubric:
  excellent: Recognises a shortest-path problem with positive node weights, implements Dijkstra with a min-heap and stale-entry skipping, includes the start cell's cost, explains why a right/down DP is wrong here and states O(RC log RC) time.
  good: Implements a correct Dijkstra (or an equivalent bucket queue) with small slips fixed after a hint, such as forgetting the start cost or not skipping stale heap entries.
  weak: Uses a right/down-only dynamic programme, a plain BFS that ignores weights, or an exhaustive DFS that times out.
  criteria:
    correctness: Returns the true minimum over routes that may move in all four directions, including the start and dock values.
    efficiency: Each cell is settled once with a priority queue; no exponential path enumeration.
    code_quality: Clear distance grid, direction list and bounds checks; heap entries carry energy first.
    edge_cases: Handles 1 x 1 floors, single rows or columns and serpentine routes that move up or left.
    communication: Explains why non-negative weights make Dijkstra valid and when an entry popped from the heap can be ignored.
hints:
  - Think of every cell as a node and every move as an edge whose weight is the value of the cell being entered; what kind of problem is that?
  - Because routes can turn back up or left, filling a table row by row is not enough; process cells in order of the cheapest energy found so far instead.
  - Run Dijkstra's algorithm with a min-heap of (energy, row, column), starting from the top-left cell with its own cost; when a popped entry is worse than the best known energy for that cell skip it, and stop when the dock is popped.
followups:
  - How would you return the route itself, not just its energy?
  - The values are small integers from 1 to 9; how could a bucket queue (Dial's algorithm) remove the log factor?
  - What changes if the robot may also move diagonally, or if some cells are blocked entirely?
  - How would you answer many queries for different docks on the same floor?
common_errors:
  - Using a right/down-only dynamic programme, which misses cheaper routes that move up or left.
  - Forgetting to count the energy of the starting cell.
  - Using an unweighted BFS that minimises the number of moves instead of the energy.
  - Marking cells visited when they are pushed rather than when they are popped, which can lock in a non-optimal energy.
