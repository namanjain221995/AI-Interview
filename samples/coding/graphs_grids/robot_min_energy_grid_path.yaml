reference_solutions:
  python: |
    import heapq


    def min_energy_path(cost: list[list[int]]) -> int:
        rows, cols = len(cost), len(cost[0])
        best = [[float("inf")] * cols for _ in range(rows)]
        best[0][0] = cost[0][0]
        heap = [(cost[0][0], 0, 0)]
        while heap:
            energy, r, c = heapq.heappop(heap)
            if energy > best[r][c]:
                continue
            if r == rows - 1 and c == cols - 1:
                return energy
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols:
                    candidate = energy + cost[nr][nc]
                    if candidate < best[nr][nc]:
                        best[nr][nc] = candidate
                        heapq.heappush(heap, (candidate, nr, nc))
        return best[rows - 1][cols - 1]
  javascript: |
    function minEnergyPath(cost) {
      const rows = cost.length;
      const cols = cost[0].length;
      const best = Array.from({ length: rows }, () => new Array(cols).fill(Infinity));
      best[0][0] = cost[0][0];
      // Binary min-heap of [energy, row, col].
      const heap = [[cost[0][0], 0, 0]];
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p][0] <= heap[i][0]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
            if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (heap.length > 0) {
        const [energy, r, c] = pop();
        if (energy > best[r][c]) continue;
        if (r === rows - 1 && c === cols - 1) return energy;
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          const candidate = energy + cost[nr][nc];
          if (candidate < best[nr][nc]) {
            best[nr][nc] = candidate;
            push([candidate, nr, nc]);
          }
        }
      }
      return best[rows - 1][cols - 1];
    }
