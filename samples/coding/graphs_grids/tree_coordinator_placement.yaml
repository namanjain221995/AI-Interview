expected_concepts:
  - "centre of a tree (minimum eccentricity)"
  - "peeling leaves layer by layer, like a topological sort on degrees"
  - "alternative: find a longest path with two BFS passes and take its middle node or nodes"
  - "a tree has exactly one or two centres"
  - "sorting the result for a deterministic order"
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Recognises the tree centre, explains why there are at most two optimal nodes, implements leaf peeling (or the longest-path midpoint) in O(n), handles n = 1 and n = 2 and returns the nodes sorted."
  good: "Correct linear solution with a small prompt about the single-node case, the stopping condition or the output order."
  weak: "Runs a BFS from every node (O(n^2)) without recognising the structure, stops peeling at the wrong time, or returns a single node when there are two."
  criteria:
    correctness: "All tests pass, including chains of odd and even length, stars and the one- and two-node clusters."
    efficiency: "Linear time; the quadratic all-sources BFS is identified as too slow for 10^5 nodes."
    code_quality: "Adjacency and degree arrays built once, the layer loop easy to follow, clear stopping condition."
    edge_cases: "n = 1, n = 2, long chains, high-degree nodes that are not the centre."
    communication: "Explains why removing all current leaves lowers every remaining node's reach by exactly one."
hints:
  - "A node near the edge of the tree is a poor choice because it is far from the other edge. Think about what is left if you repeatedly ignore the outermost nodes."
  - "Removing every current leaf at once reduces the reach of every remaining node by exactly one, so the best nodes never change while you do it. How many nodes can be left at the end?"
  - "Build degrees and an adjacency list, put all degree-one nodes in a layer, and while more than two nodes remain remove the whole layer, decreasing each neighbour's degree and collecting neighbours that become degree one as the next layer, then return the final layer sorted, treating a single node as its own answer."
followups:
  - "Prove that a tree has at most two centres and that two centres are always adjacent."
  - "How would you solve it if links had latencies instead of being one hop each?"
  - "How would you compute every node's reach in linear time with rerooting?"
  - "What changes if the network may contain cycles?"
common_errors:
  - "Running a BFS from every node and timing out on large clusters."
  - "Stopping the peeling when the remaining count is 1 instead of at most 2, or peeling one leaf at a time instead of a whole layer."
  - "Forgetting the single-node cluster, where there are no leaves."
  - "Returning the node with the highest degree, which is not always the centre."
