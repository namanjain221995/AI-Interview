version: 1
slug: tree_coordinator_placement
title: Place the Cluster Coordinator
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, sre, platform, network]
time_limit_minutes: 22
prompt_markdown: |
  ## Place the Cluster Coordinator

  A storage cluster has `n` nodes numbered `0` to `n - 1`. The nodes talk over an overlay network that
  forms a **tree**: `links` holds `n - 1` pairs `[u, v]`, every link carries messages in both directions,
  and every node can reach every other node. Each link is one **hop**.

  One node will be promoted to coordinator. Its **reach** is the largest number of hops from the
  coordinator to any node in the cluster, and heartbeats take longest to the node at that distance. The
  operators want a coordinator with the **smallest possible reach**.

  Return **all** nodes that achieve the smallest reach, in **ascending** order.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [1, 3]]
  Output: [1]
  Explanation: Node 1 reaches every other node in 1 hop; any other node needs 2 hops to reach some node.
  ```

  ### Example 2
  ```
  Input:  n = 6, links = [[3, 0], [0, 1], [1, 2], [2, 4], [4, 5]]
  Output: [1, 2]
  Explanation: The nodes form the chain 3 - 0 - 1 - 2 - 4 - 5. Nodes 1 and 2 both have a reach of 3 hops.
  ```

  ### Example 3
  ```
  Input:  n = 1, links = []
  Output: [0]
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `links.length == n - 1` and `links[i].length == 2`
  - `0 <= u, v < n`, `u != v`, and the links form a tree.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_coordinators
  params:
    - {name: n, type: int}
    - {name: links, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def best_coordinators(n: int, links: list[list[int]]) -> list[int]:
        if n == 1:
            return [0]
        adj: list[list[int]] = [[] for _ in range(n)]
        degree = [0] * n
        for u, v in links:
            adj[u].append(v)
            adj[v].append(u)
            degree[u] += 1
            degree[v] += 1
        layer = [x for x in range(n) if degree[x] == 1]
        remaining = n
        # Peel the leaves layer by layer; the last one or two nodes are the centre.
        while remaining > 2:
            remaining -= len(layer)
            nxt = []
            for leaf in layer:
                for nb in adj[leaf]:
                    degree[nb] -= 1
                    if degree[nb] == 1:
                        nxt.append(nb)
            layer = nxt
        return sorted(layer)
  javascript: |
    function bestCoordinators(n, links) {
      if (n === 1) return [0];
      const adj = Array.from({ length: n }, () => []);
      const degree = new Array(n).fill(0);
      for (const [u, v] of links) {
        adj[u].push(v);
        adj[v].push(u);
        degree[u] += 1;
        degree[v] += 1;
      }
      let layer = [];
      for (let x = 0; x < n; x++) if (degree[x] === 1) layer.push(x);
      let remaining = n;
      while (remaining > 2) {
        remaining -= layer.length;
        const next = [];
        for (const leaf of layer) {
          for (const nb of adj[leaf]) {
            degree[nb] -= 1;
            if (degree[nb] === 1) next.push(nb);
          }
        }
        layer = next;
      }
      return layer.sort((a, b) => a - b);
    }
