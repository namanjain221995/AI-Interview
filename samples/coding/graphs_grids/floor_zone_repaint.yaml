version: 1
slug: floor_zone_repaint
title: Repaint a Floor-Plan Zone
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, frontend, fullstack, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Repaint a Floor-Plan Zone

  The facilities team stores each office floor as a text map. `floor_plan` is a list of strings of equal
  length and every character is a **zone code**, for example `A` for open desks, `M` for meeting rooms
  and `.` for corridor. When a zone is reassigned, the planner clicks one tile in the map editor and the
  whole zone that tile belongs to switches to a new code.

  The **zone** of the clicked tile is every tile that has the same code as the clicked tile and can be
  reached from it by stepping **up, down, left or right** through tiles of that same code. Tiles that
  only touch diagonally are not connected.

  You are given the clicked tile as `row` (index into `floor_plan`) and `col` (index into that string),
  both 0-indexed, and a one-character `new_code`. Return the updated map as a list of strings:

  - every tile of the clicked zone gets `new_code`;
  - every other tile keeps its code, even when it has the same code as the zone but is not connected to it;
  - if `new_code` is already the clicked tile's code, return the map unchanged.

  ### Example 1
  ```
  Input:  floor_plan = ["AAB", "ABB", "CAA"], row = 0, col = 0, new_code = "Z"
  Output: ["ZZB", "ZBB", "CAA"]
  Explanation: The A tiles in the bottom row touch the clicked zone only diagonally, so they keep code A.
  ```

  ### Example 2
  ```
  Input:  floor_plan = ["MMM", "M.M", "MMM"], row = 0, col = 0, new_code = "D"
  Output: ["DDD", "D.D", "DDD"]
  Explanation: The ring of M tiles is one zone; the corridor tile in the middle is untouched.
  ```

  ### Example 3
  ```
  Input:  floor_plan = ["KK", "KK"], row = 1, col = 0, new_code = "K"
  Output: ["KK", "KK"]
  ```

  ### Constraints
  - `1 <= floor_plan.length <= 50` and `1 <= floor_plan[i].length <= 50`; all strings have the same length.
  - Zone codes and `new_code` are single printable non-space ASCII characters.
  - `0 <= row < floor_plan.length` and `0 <= col < floor_plan[0].length`.
  - Return a new list; the input strings themselves cannot be modified in most languages.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: repaint_zone
  params:
    - {name: floor_plan, type: "string[]"}
    - {name: row, type: "int"}
    - {name: col, type: "int"}
    - {name: new_code, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def repaint_zone(floor_plan: list[str], row: int, col: int, new_code: str) -> list[str]:
        old = floor_plan[row][col]
        if old == new_code:
            return list(floor_plan)
        grid = [list(line) for line in floor_plan]
        rows, cols = len(grid), len(grid[0])
        grid[row][col] = new_code
        queue = deque([(row, col)])
        while queue:
            r, c = queue.popleft()
            for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == old:
                    grid[nr][nc] = new_code
                    queue.append((nr, nc))
        return ["".join(line) for line in grid]
  javascript: |
    function repaintZone(floorPlan, row, col, newCode) {
      const old = floorPlan[row][col];
      if (old === newCode) return floorPlan.slice();
      const grid = floorPlan.map((line) => line.split(""));
      const rows = grid.length;
      const cols = grid[0].length;
      grid[row][col] = newCode;
      const stack = [[row, col]];
      while (stack.length > 0) {
        const [r, c] = stack.pop();
        for (const [nr, nc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === old) {
            grid[nr][nc] = newCode;
            stack.push([nr, nc]);
          }
        }
      }
      return grid.map((line) => line.join(""));
    }
