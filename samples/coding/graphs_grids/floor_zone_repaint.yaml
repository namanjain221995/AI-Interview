expected_concepts:
  - "flood fill with breadth-first or depth-first search"
  - "4-directional neighbour checks with bounds"
  - "marking cells as visited (here, by repainting them) to avoid revisiting"
  - "early return when the new code equals the old code"
  - "converting immutable strings to mutable rows and back"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Recognises a flood fill, handles the same-code case up front, repaints while enqueueing so no tile is processed twice, uses an explicit stack or queue (or discusses recursion depth) and states O(rows * cols) time and space."
  good: "Correct recursive or iterative flood fill with bounds checks; may need a prompt for the same-code case or for recursion depth on long corridors."
  weak: "Repaints every tile with the old code regardless of connectivity, includes diagonal neighbours, loops forever when new_code equals the old code, or reads outside the map."
  criteria:
    correctness: "All tests pass, including the unchanged map, diagonal-only contact and repainting into a neighbour's code."
    efficiency: "Each tile is visited at most once; linear in the map size."
    code_quality: "Neighbour offsets written once, clear names for the old and new code, conversion between strings and character arrays kept in one place."
    edge_cases: "Single tile, single row or column, clicks on corners and edges, new code equal to the current code."
    communication: "Explains why the old code must be captured before painting and why the same-code case would otherwise loop."
hints:
  - "Remember the code of the clicked tile first, then think of the zone as everything you can walk to without stepping on a different code."
  - "Explore outward from the clicked tile using a queue or stack, looking only at the four orthogonal neighbours that are inside the map and still carry the old code."
  - "Copy the map into mutable rows; if the new code equals the old code return a copy straight away, otherwise paint the start tile, push it, and repeatedly pop a tile, painting and pushing each in-bounds neighbour that still has the old code, then join the rows back into strings."
followups:
  - "How would recursion depth become a problem on a 2000 x 2000 map, and how do you avoid it?"
  - "How would you return only the coordinates that changed so the editor can redraw just those tiles?"
  - "What changes if diagonal contact should also join tiles into one zone?"
  - "How would you support undo for a repaint?"
common_errors:
  - "Not handling new_code equal to the old code, so painted tiles keep matching and the search never ends."
  - "Comparing neighbours against the new code or the neighbour's own code instead of the clicked tile's original code."
  - "Including diagonal neighbours."
  - "Missing bounds checks on the last row or column, or swapping row and column indices."
