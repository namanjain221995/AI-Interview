expected_concepts:
  - sorting by start
  - linear sweep with the last merged interval
  - inclusive overlap condition (start <= last end)
  - extending the end with max
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Sorts by start, sweeps once comparing with the last merged interval, uses the inclusive overlap test and max for the end, and explains O(n log n).
  good: Correct sort-and-sweep solution with a small fix after running the tests (for example touching intervals).
  weak: Compares only adjacent pairs of the unsorted input, overwrites the end instead of taking the max, or is O(n^2).
  criteria:
    correctness: All tests pass, including contained and touching intervals.
    efficiency: Sorting dominates; the merge sweep is linear.
    code_quality: Does not mutate the caller's input unexpectedly; clear variable names.
    edge_cases: Empty input, single interval, duplicates and negative values.
    communication: Explains why sorting makes a single sweep sufficient.
hints:
  - Would the problem be easier if the intervals were in a particular order?
  - After sorting by start, an interval can only overlap the most recent merged interval — you never need to look further back.
  - Sort by start, then keep a result list; if the current start is at most the last merged end, set that end to the max of both ends, otherwise append the current interval.
followups:
  - What happens with an empty input?
  - How would you insert one new interval into an already merged, sorted list in O(n)?
  - How would you find the total time covered by at least one maintenance window?
  - What changes if intervals arrive as a stream?
common_errors:
  - Forgetting to sort, which misses overlaps between non-adjacent intervals.
  - Replacing the merged end with the current end instead of taking the maximum, which breaks contained intervals.
  - Using a strict less-than comparison so touching intervals like [1, 4] and [4, 5] are not merged.
  - Sorting the caller's array in place without considering the side effect.
