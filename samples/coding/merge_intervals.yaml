reference_solutions:
  python: |
    def merge_intervals(intervals: list[list[int]]) -> list[list[int]]:
        merged: list[list[int]] = []
        for start, end in sorted(intervals):
            if merged and start <= merged[-1][1]:
                merged[-1][1] = max(merged[-1][1], end)
            else:
                merged.append([start, end])
        return merged
  javascript: |
    function mergeIntervals(intervals) {
      const sorted = [...intervals].sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (const [start, end] of sorted) {
        const last = merged[merged.length - 1];
        if (last && start <= last[1]) {
          last[1] = Math.max(last[1], end);
        } else {
          merged.push([start, end]);
        }
      }
      return merged;
    }
  typescript: |
    function mergeIntervals(intervals: number[][]): number[][] {
      const sorted = [...intervals].sort((a, b) => a[0] - b[0]);
      const merged: number[][] = [];
      for (const [start, end] of sorted) {
        const last = merged.length > 0 ? merged[merged.length - 1] : undefined;
        if (last !== undefined && start <= last[1]) {
          last[1] = Math.max(last[1], end);
        } else {
          merged.push([start, end]);
        }
      }
      return merged;
    }
  java: |
    import java.util.*;

    class Solution {
        public int[][] mergeIntervals(int[][] intervals) {
            int[][] sorted = intervals.clone();
            Arrays.sort(sorted, (a, b) -> Integer.compare(a[0], b[0]));
            List<int[]> merged = new ArrayList<>();
            for (int[] interval : sorted) {
                if (!merged.isEmpty() && interval[0] <= merged.get(merged.size() - 1)[1]) {
                    int[] last = merged.get(merged.size() - 1);
                    last[1] = Math.max(last[1], interval[1]);
                } else {
                    merged.add(new int[]{interval[0], interval[1]});
                }
            }
            return merged.toArray(new int[0][]);
        }
    }
  go: |
    package main

    import "sort"

    func mergeIntervals(intervals [][]int) [][]int {
    	sorted := make([][]int, len(intervals))
    	copy(sorted, intervals)
    	sort.Slice(sorted, func(a, b int) bool { return sorted[a][0] < sorted[b][0] })
    	merged := [][]int{}
    	for _, iv := range sorted {
    		if n := len(merged); n > 0 && iv[0] <= merged[n-1][1] {
    			if iv[1] > merged[n-1][1] {
    				merged[n-1][1] = iv[1]
    			}
    		} else {
    			merged = append(merged, []int{iv[0], iv[1]})
    		}
    	}
    	return merged
    }
  cpp: |
    #include <algorithm>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        vector<vector<int>> mergeIntervals(vector<vector<int>>& intervals) {
            vector<vector<int>> sorted = intervals;
            sort(sorted.begin(), sorted.end());
            vector<vector<int>> merged;
            for (const auto& iv : sorted) {
                if (!merged.empty() && iv[0] <= merged.back()[1]) {
                    merged.back()[1] = max(merged.back()[1], iv[1]);
                } else {
                    merged.push_back({iv[0], iv[1]});
                }
            }
            return merged;
        }
    };
