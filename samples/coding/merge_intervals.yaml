title: Merge Intervals
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, devops, sre, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Merge Intervals

  You are given a list of maintenance windows, each written as `[start, end]` with `start <= end`. The
  list is **not** sorted. Merge all overlapping windows and return the result **sorted by start**.

  Two windows overlap when they share at least one point, so `[1, 4]` and `[4, 5]` merge into `[1, 5]`.

  ### Example 1
  ```
  Input:  intervals = [[1, 3], [2, 6], [8, 10], [15, 18]]
  Output: [[1, 6], [8, 10], [15, 18]]
  ```

  ### Example 2
  ```
  Input:  intervals = [[1, 4], [4, 5]]
  Output: [[1, 5]]
  ```

  ### Constraints
  - `0 <= intervals.length <= 10^4`
  - `intervals[i].length == 2`
  - `-10^4 <= start <= end <= 10^4`
