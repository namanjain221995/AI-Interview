expected_concepts:
  - hash map lookup of the complement
  - single pass over the array
  - O(n) time versus O(n^2) brute force
  - not reusing the same index
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Explains the brute-force baseline, derives the one-pass hash map solution, handles duplicates correctly and states O(n) time and space with a clear argument.
  good: Implements a correct hash map solution (one or two passes) with minor prompting and gives the right complexity.
  weak: Only reaches the nested-loop solution, reuses the same element, or returns values instead of indices.
  criteria:
    correctness: All tests pass, including duplicates and negative numbers.
    efficiency: Linear time using a hash map; the trade-off of extra memory is acknowledged.
    code_quality: Clear variable names (complement, seen) and an early return when the pair is found.
    edge_cases: Handles duplicate values such as [3, 3] by checking before inserting the current element.
    communication: Explains why the map is checked before the current element is stored.
hints:
  - For each number, think about which other value you would need to find so that the pair adds up to the target.
  - Instead of comparing every pair, can you remember the numbers you have already seen in a structure with fast lookups?
  - Walk the array once with a hash map from value to index; for each element, look up target minus the element before you store the element itself.
followups:
  - What happens with duplicate values such as [3, 3] — why does the order of the lookup and the insert matter?
  - If the array were sorted, how could you solve it with O(1) extra space?
  - How would you return all distinct pairs that add up to the target instead of just one?
  - What would change if the input were a stream too large to keep in memory?
common_errors:
  - Storing the current element before checking for its complement, which returns the same index twice.
  - Returning the two values instead of their indices.
  - Stopping at an O(n^2) nested loop without discussing a faster approach.
  - Assuming the array is sorted and using two pointers on unsorted input.
