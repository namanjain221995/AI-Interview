version: 1
slug: find_keywords_in_grid
title: "Find Keywords in Grid"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, security, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Find Keywords in Grid

  A content-security scanner inspects letter grids extracted from images (for example screenshots of
  dashboards or whiteboards) for words on a watch list. The grid is given as `grid`, a list of
  equal-length strings, one per row.

  A keyword **appears** in the grid if you can trace it letter by letter through cells where each next
  cell is directly above, below, left or right of the previous one (no diagonals), and no cell is used
  twice within that one keyword. Different keywords may reuse the same cells.

  Write `find_keywords_in_grid(grid, keywords)` that returns the keywords that appear in the grid:

  - Return each found keyword once, even if it is listed several times in `keywords` or can be traced
    in several ways.
  - Return them sorted in ascending order (plain string order).
  - Return an empty list `[]` if none appears.

  The scanner checks dozens of keywords against every grid, so aim to share work between keywords
  instead of searching the whole grid separately for each one.

  ### Example 1
  ```
  Input:  grid = ["LOGS", "KEYA", "TPIN"], keywords = ["PIN", "LOG", "API", "KEY", "SKY", "YEP", "TOKEN"]
  Output: ["KEY", "LOG", "PIN", "YEP"]
  Explanation: YEP turns a corner (Y, E, then P below E). API, SKY and TOKEN cannot be traced through adjacent cells.
  ```

  ### Example 2
  ```
  Input:  grid = ["AB", "CD"], keywords = ["ABDC", "ABA", "ACDB", "AD"]
  Output: ["ABDC", "ACDB"]
  Explanation: ABA would need the single A twice, and AD would need a diagonal step.
  ```

  ### Constraints
  - `1 <= rows, cols <= 8` (`rows == grid.length`, `cols == grid[r].length`)
  - `1 <= keywords.length <= 60`
  - `1 <= keywords[i].length <= 10`
  - `grid` and `keywords` contain only uppercase letters `A-Z`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_keywords_in_grid
  params:
    - {name: grid, type: "string[]"}
    - {name: keywords, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def find_keywords_in_grid(grid: list[str], keywords: list[str]) -> list[str]:
        rows, cols = len(grid), len(grid[0])
        root: dict = {}
        for word in keywords:
            node = root
            for ch in word:
                node = node.setdefault(ch, {})
            node["$"] = word
        board = [list(row) for row in grid]
        found: set[str] = set()

        def search(r: int, c: int, parent: dict) -> None:
            ch = board[r][c]
            node = parent.get(ch)
            if node is None:
                return
            word = node.pop("$", None)
            if word is not None:
                found.add(word)
            board[r][c] = "#"  # in use on the current path
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                nr, nc = r + dr, c + dc
                if 0 <= nr < rows and 0 <= nc < cols and board[nr][nc] != "#":
                    search(nr, nc, node)
            board[r][c] = ch
            if not node:
                del parent[ch]  # prune branches whose keywords are all found

        for r in range(rows):
            for c in range(cols):
                search(r, c, root)
        return sorted(found)
  javascript: |
    function findKeywordsInGrid(grid, keywords) {
      const rows = grid.length;
      const cols = grid[0].length;
      const root = new Map();
      for (const word of keywords) {
        let node = root;
        for (const ch of word) {
          if (!node.has(ch)) node.set(ch, new Map());
          node = node.get(ch);
        }
        node.set("$", word);
      }
      const board = grid.map((row) => row.split(""));
      const found = new Set();
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      const search = (r, c, parent) => {
        const ch = board[r][c];
        const node = parent.get(ch);
        if (node === undefined) return;
        if (node.has("$")) {
          found.add(node.get("$"));
          node.delete("$");
        }
        board[r][c] = "#"; // in use on the current path
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] !== "#") {
            search(nr, nc, node);
          }
        }
        board[r][c] = ch;
        if (node.size === 0) parent.delete(ch); // prune branches whose keywords are all found
      };
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) search(r, c, root);
      }
      return [...found].sort();
    }
