expected_concepts:
  - "prefix tree (trie) of all keywords"
  - "depth-first search with backtracking from every cell"
  - "marking cells in use on the current path"
  - "stopping a path as soon as it is not a keyword prefix"
  - "pruning trie branches once their keywords are found"
optimal_complexity: {time: "O(R * C * 4 * 3^(L-1)) for keyword length L, shared across keywords", space: "O(total keyword letters) for the trie"}
rubric:
  excellent: "Builds a trie of the keywords, runs one backtracking DFS from every cell that walks the trie in step with the grid, marks cells on the current path, records and removes found words, prunes empty trie branches, deduplicates and sorts the result, and compares the cost with a per-keyword search."
  good: "Correct per-keyword backtracking search or a trie without pruning; handles reuse, duplicates and sorting, with prompting toward sharing work."
  weak: "Allows diagonal moves or cell reuse, returns duplicates, misses keywords that start in later cells, or cannot finish on many keywords."
  criteria:
    correctness: "Exactly the traceable keywords, each once, sorted."
    efficiency: "Shared prefix search through a trie with early termination of non-prefix paths."
    code_quality: "Clear separation of trie construction and grid search; visited marking restored on every return."
    edge_cases: "Single cell, duplicate keywords, palindromes, prefixes of other keywords, no matches."
    communication: "Explains why a trie avoids repeating the same prefix work for many keywords."
hints:
  - "Searching the grid once per keyword repeats a lot of work when keywords share beginnings. Is there a structure that lets one walk through the grid check many keywords at the same time?"
  - "Store all keywords in a prefix tree. Start a depth-first search from every cell and follow the tree edge for each letter you step on; stop as soon as the current path is not the start of any keyword."
  - "During the search, temporarily mark the current cell as used, recurse into the four neighbours with the child tree node, then restore the cell. When you reach a node that ends a keyword, add it to a result set and clear that end marker so it is not reported again, and remove tree branches that no longer lead to any keyword. Sort the collected keywords at the end."
followups:
  - "How would you report the cell path of each found keyword?"
  - "How would you allow diagonal moves, and how does that change the complexity?"
  - "If the same keyword list is checked against thousands of grids, what would you precompute and cache?"
common_errors:
  - "Reusing a cell within one keyword (for example tracing ABA from a single A)."
  - "Forgetting to restore a cell after backtracking."
  - "Returning a keyword more than once when it is listed twice or found from several cells."
  - "Running a separate full search for each keyword and timing out on many shared prefixes."
  - "Stopping the search after finding a keyword that is a prefix of a longer one."
