slug: split_identifier_into_terms
title: "Split Identifier Into Terms"
difficulty: medium
competency_keys: [algorithms, problem_solving, data_structures]
role_tags: [backend, data, llm, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Split Identifier Into Terms

  A code-search indexer receives identifiers from a legacy codebase in which every separator has been
  stripped, so `get_user_id` arrived as `getuserid`. To make them searchable again, the indexer has a
  `vocabulary` of known terms and wants to see **every** way the identifier could have been written.

  Write `split_identifier_into_terms(identifier, vocabulary)` that returns every way to cut
  `identifier` into consecutive pieces such that **every** piece is a vocabulary term:

  - Terms may be used any number of times, and not every term has to be used.
  - The pieces must cover the whole identifier, in order, with nothing left over.
  - Write each split as its pieces joined by a single underscore `_` (a split with one piece is just
    that piece).
  - Return the distinct splits sorted in ascending order by character code (plain string order, in
    which `_` sorts before every lowercase letter).
  - If no split exists, return an empty list `[]`.
  - The vocabulary may contain the same term more than once; that does not create extra splits.

  ### Example 1
  ```
  Input:  identifier = "getuserid", vocabulary = ["get", "user", "id", "use", "rid", "getuser"]
  Output: ["get_use_rid", "get_user_id", "getuser_id"]
  Explanation: "get_use_rid" comes before "get_user_id" because '_' has a smaller character code than 'r'.
  ```

  ### Example 2
  ```
  Input:  identifier = "loadconfig", vocabulary = ["load", "conf", "fig"]
  Output: []
  Explanation: After "load" and "conf" the remaining "ig" is not a term.
  ```

  ### Constraints
  - `1 <= identifier.length <= 20`
  - `1 <= vocabulary.length <= 20`
  - `1 <= vocabulary[i].length <= 20`
  - `identifier` and every term contain only lowercase letters `a-z`.
  - The answer contains at most `200` splits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: split_identifier_into_terms
  params:
    - {name: identifier, type: "string"}
    - {name: vocabulary, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def split_identifier_into_terms(identifier: str, vocabulary: list[str]) -> list[str]:
        terms = set(vocabulary)
        longest = max(len(term) for term in terms)
        n = len(identifier)
        memo: dict[int, list[str]] = {}

        def splits_from(start: int) -> list[str]:
            if start == n:
                return [""]
            if start in memo:
                return memo[start]
            found: list[str] = []
            for end in range(start + 1, min(n, start + longest) + 1):
                piece = identifier[start:end]
                if piece not in terms:
                    continue
                for rest in splits_from(end):
                    found.append(piece if rest == "" else piece + "_" + rest)
            memo[start] = found
            return found

        return sorted(splits_from(0))
  javascript: |
    function splitIdentifierIntoTerms(identifier, vocabulary) {
      const terms = new Set(vocabulary);
      let longest = 0;
      for (const term of terms) longest = Math.max(longest, term.length);
      const n = identifier.length;
      const memo = new Map();
      const splitsFrom = (start) => {
        if (start === n) return [""];
        if (memo.has(start)) return memo.get(start);
        const found = [];
        for (let end = start + 1; end <= Math.min(n, start + longest); end++) {
          const piece = identifier.slice(start, end);
          if (!terms.has(piece)) continue;
          for (const rest of splitsFrom(end)) {
            found.push(rest === "" ? piece : piece + "_" + rest);
          }
        }
        memo.set(start, found);
        return found;
      };
      return [...splitsFrom(0)].sort();
    }
