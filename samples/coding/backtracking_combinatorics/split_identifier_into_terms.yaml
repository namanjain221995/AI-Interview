expected_concepts:
  - "backtracking over prefix cuts"
  - "hash set for term lookup"
  - "memoisation of results per start index"
  - "string ordering by character code"
  - "output-sensitive complexity"
optimal_complexity: {time: "O(n^2 + total output size)", space: "O(n + total output size)"}
rubric:
  excellent: "Recurses on the start index, tries every prefix that is a term, memoises the splits of each suffix so dead ends are computed once, joins pieces with underscores, sorts by plain string order and explains that the running time is dominated by the size of the output."
  good: "Produces all splits correctly with plain backtracking and a final sort; may need prompting to add memoisation for inputs with many dead ends."
  weak: "Returns only one split or only a yes/no answer, misses splits that reuse a term, or does not finish on long ambiguous identifiers."
  criteria:
    correctness: "Every valid split appears once, joined with underscores and sorted by character code."
    efficiency: "Dead-end suffixes are not re-explored (memoisation or a reachability pre-check)."
    code_quality: "Small recursive helper with a clear base case and no string-building bugs at the boundaries."
    edge_cases: "Duplicate vocabulary entries, terms longer than the identifier, a single-piece split and no split at all."
    communication: "Explains why the worst case is exponential in output size and how memoisation helps when the answer is small."
hints:
  - "Think about the first piece of a split: it must be some prefix of the identifier that is a known term. What remains after it is a smaller version of the same problem."
  - "Write a recursive search over the position where the next piece starts; at each position try every term that matches the text there, and combine the piece with every split of the rest."
  - "Store the vocabulary in a set and cache, for each start position, the list of splits of the suffix that starts there, so a suffix that cannot be split is only examined once. The base case at the end of the identifier yields one empty split; join pieces with underscores and sort the final list as plain strings."
followups:
  - "How would you return only the number of splits, for identifiers of length 10,000?"
  - "How would you pick the single most likely split if each term had a frequency?"
  - "How would a prefix tree of the vocabulary change the matching step?"
common_errors:
  - "Stopping after the first successful split."
  - "Not memoising, so long identifiers with a failing tail time out."
  - "Producing duplicate splits when the vocabulary contains repeated terms."
  - "Adding a leading or trailing underscore when joining pieces."
  - "Sorting the lists of pieces instead of the joined strings, which gives a different order."
