version: 1
slug: grid_contains_keyword
title: Keyword in Label Grid
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, qa, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Keyword in Label Grid

  A maintenance panel in a server room is covered with small letter tiles arranged in a rectangular
  grid. As part of an automated acceptance check, QA wants to know whether a given `keyword` can be
  **traced** on the panel.

  The grid is given as a list of equal-length row strings: `grid[r][c]` is the letter in row `r`,
  column `c`. A trace starts on any tile whose letter is the first letter of `keyword`, and each next
  letter must be on a tile that is **horizontally or vertically adjacent** (up, down, left or right; not
  diagonal) to the previous tile. A tile may be used **at most once** within a single trace.

  Return `true` if at least one trace spells the whole `keyword`, otherwise `false`.

  ### Example 1
  ```
  Input:  grid = ["NODE", "XLOG", "PORT"], keyword = "NOLOG"
  Output: true
  Explanation: N(0,0) -> O(0,1) -> L(1,1) -> O(1,2) -> G(1,3).
  ```

  ### Example 2
  ```
  Input:  grid = ["NODE", "XLOG", "PORT"], keyword = "PORTS"
  Output: false
  ```

  ### Example 3
  ```
  Input:  grid = ["NODE", "XLOG", "PORT"], keyword = "GOLOG"
  Output: false
  Explanation: After G -> O -> L -> O the only G on the panel has already been used.
  ```

  ### Constraints
  - `1 <= grid.length <= 6` (rows)
  - `1 <= grid[r].length <= 6` (columns); all rows have the same length
  - `1 <= keyword.length <= 15`
  - `grid` and `keyword` contain only uppercase letters `A`-`Z`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: grid_contains_keyword
  params:
    - {name: grid, type: "string[]"}
    - {name: keyword, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def grid_contains_keyword(grid: list[str], keyword: str) -> bool:
        rows, cols = len(grid), len(grid[0])
        if len(keyword) > rows * cols:
            return False
        available = Counter("".join(grid))
        if any(available[ch] < need for ch, need in Counter(keyword).items()):
            return False  # some letter is missing or too rare
        # Start from the rarer end: fewer starting tiles means fewer dead branches.
        if available[keyword[0]] > available[keyword[-1]]:
            keyword = keyword[::-1]
        used = [[False] * cols for _ in range(rows)]

        def trace(r: int, c: int, i: int) -> bool:
            if used[r][c] or grid[r][c] != keyword[i]:
                return False
            if i == len(keyword) - 1:
                return True
            used[r][c] = True
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols and trace(nr, nc, i + 1):
                    used[r][c] = False
                    return True
            used[r][c] = False
            return False

        return any(trace(r, c, 0) for r in range(rows) for c in range(cols))
  javascript: |
    function gridContainsKeyword(grid, keyword) {
      const rows = grid.length;
      const cols = grid[0].length;
      if (keyword.length > rows * cols) return false;
      const available = new Map();
      for (const row of grid) for (const ch of row) available.set(ch, (available.get(ch) || 0) + 1);
      const need = new Map();
      for (const ch of keyword) need.set(ch, (need.get(ch) || 0) + 1);
      for (const [ch, count] of need) if ((available.get(ch) || 0) < count) return false;
      let word = keyword;
      if ((available.get(word[0]) || 0) > (available.get(word[word.length - 1]) || 0)) {
        word = word.split("").reverse().join("");
      }
      const used = Array.from({ length: rows }, () => new Array(cols).fill(false));
      const trace = (r, c, i) => {
        if (used[r][c] || grid[r][c] !== word[i]) return false;
        if (i === word.length - 1) return true;
        used[r][c] = true;
        const moves = [[r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]];
        for (const [nr, nc] of moves) {
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && trace(nr, nc, i + 1)) {
            used[r][c] = false;
            return true;
          }
        }
        used[r][c] = false;
        return false;
      };
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) if (trace(r, c, 0)) return true;
      }
      return false;
    }
tests:
  - {id: t1, args: [["NODE", "XLOG", "PORT"], "NOLOG"], expected: true, description: "Example 1 - trace that turns corners"}
  - {id: t2, args: [["NODE", "XLOG", "PORT"], "PORTS"], expected: false, description: "Example 2 - letter S does not exist"}
  - {id: t3, args: [["NODE", "XLOG", "PORT"], "GOLOG"], expected: false, description: "Example 3 - only possible by reusing the G tile"}
  - {id: t4, hidden: true, args: [["Q"], "Q"], expected: true, description: "1x1 grid matching a one-letter keyword"}
  - {id: t5, hidden: true, args: [["Q"], "QQ"], expected: false, description: "Keyword longer than the number of tiles"}
  - {id: t6, hidden: true, args: [["AB"], "ABA"], expected: false, description: "Would need to step back onto a used tile"}
  - {id: t7, hidden: true, args: [["ABC", "HID", "GFE"], "ABCDEFGHI"], expected: true, description: "Spiral that uses every tile of a 3x3 grid"}
  - {id: t8, hidden: true, args: [["S", "E", "R", "V", "E"], "EVRES"], expected: true, description: "Single column traced bottom to top"}
  - {id: t9, hidden: true, args: [["CAA", "AAA", "BCD"], "AAB"], expected: true, description: "Many A paths lead to dead ends; must backtrack and unmark tiles to find the one reaching B"}
  - {id: t10, hidden: true, args: [["BBDE", "AEAC", "EEED"], "EABBE"], expected: true, description: "An early failed branch passes through tiles the real trace needs; a solution that does not unmark after failure returns false"}
  - {id: t11, hidden: true, args: [["AAAAAA", "AAAAAA", "AAAAAA", "AAAAAA", "AAAAAA", "AAAAAB"], "AAAAAAAAAAAB"], expected: true, description: "6x6 of A with one B in a corner, 12-letter keyword ending in B: stress for unpruned search"}
  - {id: t12, hidden: true, args: [["AAAAAA", "AAAAAA", "AAAAAA", "AAAAAA", "AAAAAA", "AAAAAA"], "AAAAAAAAAAAAAAB"], expected: false, description: "6x6 of A, 15-letter keyword with a missing B: a letter-count pre-check answers instantly, an unpruned search walks every 14-step path"}
expected_concepts:
  - "depth-first search with backtracking from every matching start tile"
  - "marking tiles as used on the way down and unmarking on the way back"
  - "bounds checks for the four orthogonal neighbours"
  - "pruning: letter-frequency pre-check and starting from the rarer end of the keyword"
  - "exponential worst case bounded by the keyword length"
optimal_complexity: {time: "O(R * C * 3^L)", space: "O(L) recursion depth"}
rubric:
  excellent: "Backtracking DFS from every start tile that marks and unmarks tiles correctly, adds pruning such as a letter-count check or tracing from the rarer end, and explains the O(R * C * 3^L) bound."
  good: "Correct backtracking DFS with proper unmarking that passes typical cases; complexity roughly explained with some prompting about pruning."
  weak: "Allows tile reuse, allows diagonal moves, forgets to unmark after a failed branch, or only searches from the first matching tile."
  criteria:
    correctness: "All tests pass, including tile-reuse traps and paths that require backtracking."
    efficiency: "Stops early on success and prunes impossible keywords before searching."
    code_quality: "A small recursive helper with clear parameters (row, column, index) and no duplicated neighbour code."
    edge_cases: "Single tile grids, single row or column grids and keywords longer than the grid."
    communication: "Explains why the used mark must be cleared when returning from a branch."
hints:
  - "Every trace has to start somewhere: try each tile that holds the first letter of the keyword."
  - "From a tile, explore the four neighbours recursively while remembering which tiles the current trace already uses, and undo that memory when a branch fails."
  - "Write a depth-first helper taking a row, a column and the keyword position: fail on out-of-range, used or wrong-letter tiles, succeed at the last letter, otherwise mark the tile, recurse into the four neighbours and unmark before returning. Before searching, compare letter counts so impossible keywords are rejected instantly."
followups:
  - "How would you check thousands of keywords against the same panel efficiently?"
  - "What changes if diagonal moves were allowed?"
  - "Why can starting from the end of the keyword be faster on some panels?"
  - "Can you avoid the separate used matrix by temporarily changing the grid?"
common_errors:
  - "Not unmarking a tile after a failed branch, which blocks valid traces that pass through it later."
  - "Letting a trace reuse the tile it just came from."
  - "Checking the last letter's neighbours instead of stopping as soon as the final letter matches."
  - "Running an unpruned search on keywords whose letters do not exist on the panel."
