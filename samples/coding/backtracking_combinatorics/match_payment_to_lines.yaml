slug: match_payment_to_lines
title: Match Payment to Invoice Lines
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_analyst, business_analyst, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Match Payment to Invoice Lines

  An accounts-receivable tool tries to explain partial payments. A customer sent a single lump sum
  `payment` against an invoice whose line amounts are listed in `amounts` (whole currency units). The
  tool must suggest which lines the payment could be covering.

  Return **every distinct set of line amounts** that adds up to exactly `payment`, where:

  - each invoice line can be used **at most once** (an amount appearing twice in `amounts` can be used
    up to twice);
  - suggestions are compared by their **amounts**, not by which line they came from: if two choices of
    lines give the same multiset of amounts, report it **once**;
  - the order of suggestions in the result, and the order of amounts inside a suggestion, do **not** matter;
  - return an empty list if nothing matches.

  ### Example 1
  ```
  Input:  amounts = [40, 25, 15, 25, 10, 35], payment = 50
  Output: [[10, 15, 25], [10, 40], [15, 35], [25, 25]]
  Explanation: [10, 15, 25] can be formed with either 25 line, but it is reported once.
  [25, 25] uses both 25 lines.
  ```

  ### Example 2
  ```
  Input:  amounts = [30, 30, 20], payment = 45
  Output: []
  ```

  ### Constraints
  - `1 <= amounts.length <= 30`
  - `1 <= amounts[i] <= 100`
  - `1 <= payment <= 100`
  - The answer contains at most 150 suggestions.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: match_payment_to_lines
  params:
    - {name: amounts, type: "int[]"}
    - {name: payment, type: int}
  return_type: "int[][]"
  comparison: unordered
reference_solutions:
  python: |
    def match_payment_to_lines(amounts: list[int], payment: int) -> list[list[int]]:
        lines = sorted(amounts)
        matches: list[list[int]] = []
        chosen: list[int] = []

        def pick(start: int, remaining: int) -> None:
            if remaining == 0:
                matches.append(chosen.copy())
                return
            for index in range(start, len(lines)):
                # At one depth, an amount equal to the previous candidate would rebuild the same multiset.
                if index > start and lines[index] == lines[index - 1]:
                    continue
                if lines[index] > remaining:
                    break
                chosen.append(lines[index])
                pick(index + 1, remaining - lines[index])
                chosen.pop()

        pick(0, payment)
        return matches
  javascript: |
    function matchPaymentToLines(amounts, payment) {
      const lines = [...amounts].sort((a, b) => a - b);
      const matches = [];
      const chosen = [];
      const pick = (start, remaining) => {
        if (remaining === 0) {
          matches.push([...chosen]);
          return;
        }
        for (let index = start; index < lines.length; index++) {
          if (index > start && lines[index] === lines[index - 1]) continue;
          if (lines[index] > remaining) break;
          chosen.push(lines[index]);
          pick(index + 1, remaining - lines[index]);
          chosen.pop();
        }
      };
      pick(0, payment);
      return matches;
    }
