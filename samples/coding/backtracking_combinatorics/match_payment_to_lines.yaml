expected_concepts:
  - sorting so equal amounts are adjacent and the loop can stop early
  - backtracking where each line is used at most once by advancing the index
  - skipping equal amounts at the same recursion depth to avoid duplicate multisets
  - copying the current selection when recording a match
optimal_complexity: {time: "O(2^n) worst case; output-sensitive with pruning and duplicate skipping", space: "O(n) recursion depth besides the output"}
rubric:
  excellent: Sorts the amounts, backtracks with index plus one so each line is used once, skips an amount equal to the previous candidate at the same depth, breaks early when an amount exceeds the remainder, and explains why the skip rule removes exactly the duplicate multisets.
  good: Correct results by generating subsets and deduplicating through a set of tuples, with a clear note on why that is slow for many repeated amounts; or the skip rule after some prompting.
  weak: Reuses the same line multiple times, returns duplicate suggestions, or skips duplicates too aggressively so that [25, 25] is lost.
  criteria:
    correctness: All tests pass, including repeated amounts and amounts larger than the payment.
    efficiency: Duplicate branches are pruned during the search rather than removed after it.
    code_quality: Clear backtracking with symmetric choose and undo steps.
    edge_cases: Many identical lines, payment equal to the total, single line and no-match cases.
    communication: Distinguishes skipping an equal amount at the same depth from using it deeper in the recursion.
hints:
  - This is a search over which lines to include. What would make repeated amounts easy to recognise during that search?
  - After sorting, equal amounts sit next to each other. At any one decision point, choosing the first or the second of two equal amounts leads to the same suggestions, so only one of them needs to be tried there.
  - Sort the amounts and recurse with a start index and the remaining payment; loop from the start index, skip an amount that equals the previous one in the same loop (but not when it is the first one tried), stop once an amount exceeds the remainder, recurse with the next index so each line is used once, and save a copy when the remainder is zero.
followups:
  - How would you count the matching suggestions without listing them when payment is up to 10,000?
  - How would you return which line indexes were used rather than the amounts?
  - What changes if amounts can have cents, and how would you avoid floating point errors?
  - How would you rank suggestions, for example preferring the fewest lines or the oldest lines first?
common_errors:
  - Recursing with the same index, which lets one invoice line be used twice.
  - Generating every subset and deduplicating at the end, which is too slow when many lines repeat.
  - Skipping any amount equal to its predecessor regardless of depth, which loses suggestions such as [25, 25].
  - Appending the shared selection list instead of a copy.
