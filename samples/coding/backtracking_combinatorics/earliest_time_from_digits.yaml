version: 1
slug: earliest_time_from_digits
title: Earliest Clock Time From Digits
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [frontend, mobile, fullstack, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Earliest Clock Time From Digits

  A self-service kiosk shows the time on a four-digit display. After a firmware glitch the display still
  holds the right four digits but in a scrambled order. Support wants a recovery screen that proposes the
  **earliest** time the four digits could represent.

  Given the four digits in `digits`, arrange **all four of them, each exactly once**, into a 24-hour time
  `HH:MM` and return the earliest valid one as a string formatted `"HH:MM"`:

  - `HH` is between `00` and `23`, and `MM` is between `00` and `59`;
  - both parts always use two digits (so 7:05 is written `"07:05"`);
  - "earliest" means closest to `00:00` on the same day.

  Return the empty string `""` if no arrangement forms a valid time.

  ### Example 1
  ```
  Input:  digits = [2, 1, 0, 4]
  Output: "01:24"
  ```

  ### Example 2
  ```
  Input:  digits = [5, 5, 5, 1]
  Output: "15:55"
  Explanation: The hour must start with 1, and 15:55 is the only valid arrangement.
  ```

  ### Example 3
  ```
  Input:  digits = [9, 9, 2, 3]
  Output: ""
  Explanation: The hour can only be 23 or 29; 29 is invalid and 23 leaves 99 as minutes.
  ```

  ### Constraints
  - `digits.length == 4`
  - `0 <= digits[i] <= 9`
  - Digits may repeat.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: earliest_time_from_digits
  params:
    - {name: digits, type: "int[]"}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def earliest_time_from_digits(digits: list[int]) -> str:
        wanted = sorted(digits)
        # Walk the day minute by minute; the first time using exactly these digits is the earliest.
        for minute_of_day in range(24 * 60):
            hours, minutes = divmod(minute_of_day, 60)
            shown = f"{hours:02d}{minutes:02d}"
            if sorted(int(ch) for ch in shown) == wanted:
                return f"{hours:02d}:{minutes:02d}"
        return ""
  javascript: |
    function earliestTimeFromDigits(digits) {
      const wanted = [...digits].sort((a, b) => a - b).join("");
      for (let minuteOfDay = 0; minuteOfDay < 24 * 60; minuteOfDay++) {
        const hh = String(Math.floor(minuteOfDay / 60)).padStart(2, "0");
        const mm = String(minuteOfDay % 60).padStart(2, "0");
        const used = (hh + mm).split("").sort().join("");
        if (used === wanted) return `${hh}:${mm}`;
      }
      return "";
    }
tests:
  - {id: t1, args: [[2, 1, 0, 4]], expected: "01:24", description: "Example 1"}
  - {id: t2, args: [[5, 5, 5, 1]], expected: "15:55", description: "Example 2 - repeated digits, single valid time"}
  - {id: t3, args: [[9, 9, 2, 3]], expected: "", description: "Example 3 - no valid arrangement"}
  - {id: t4, hidden: true, args: [[0, 0, 0, 0]], expected: "00:00", description: "All zeros - midnight"}
  - {id: t5, hidden: true, args: [[1, 9, 6, 0]], expected: "06:19", description: "Greedy trap - hour 01 leaves invalid minutes (69/96); the answer is 06:19"}
  - {id: t6, hidden: true, args: [[2, 0, 6, 6]], expected: "06:26", description: "Greedy trap - hour 02 leaves 66; the answer is 06:26"}
  - {id: t7, hidden: true, args: [[6, 6, 6, 6]], expected: "", description: "Repeated large digit - impossible"}
  - {id: t8, hidden: true, args: [[9, 0, 7, 8]], expected: "", description: "Zero available but every hour 07/08/09 leaves invalid minutes - impossible"}
  - {id: t9, hidden: true, args: [[3, 2, 9, 5]], expected: "23:59", description: "Only one valid hour (23) - latest-looking answer 23:59"}
  - {id: t10, hidden: true, args: [[4, 0, 2, 0]], expected: "00:24", description: "Two zeros - leading zeros in both the hour and the minutes"}
expected_concepts:
  - enumerating the 24 permutations of four digits, or every minute of the day
  - validating hour and minute ranges separately
  - choosing the minimum valid time rather than building it greedily
  - zero-padded formatting of hours and minutes
optimal_complexity: {time: "O(1) - at most 24 permutations or 1440 minutes", space: O(1)}
rubric:
  excellent: Enumerates all arrangements (or all 1440 minutes) with clear validity checks, keeps the earliest by comparing minutes since midnight, formats with zero padding, handles the impossible case and explains why greedy digit placement fails.
  good: Correct permutation-based solution with minor slips fixed during testing, such as padding or comparing strings instead of minutes.
  weak: Greedily picks the smallest digit for each position and returns invalid or non-earliest times, or forgets to return the empty string.
  criteria:
    correctness: All tests pass, including the greedy traps and the impossible cases.
    efficiency: Constant work; no unnecessary recursion or memory.
    code_quality: Readable validity check and formatting helper; no magic numbers without names.
    edge_cases: Repeated digits, all zeros, impossible inputs and leading zeros in both fields.
    communication: Explains the search space size and why exhaustive search is the cleanest correct approach.
hints:
  - Four digits can only be arranged in a small number of ways. How many, and could you simply check each one?
  - Picking the smallest digit for each position one at a time can paint you into a corner with invalid minutes. Compare complete candidate times instead.
  - Try every ordering of the four digits, keep those where the first two form an hour from 0 to 23 and the last two form minutes from 0 to 59, convert each to minutes since midnight, and format the smallest with two-digit padding; if none survive, return the empty string.
followups:
  - How would you return the latest valid time instead, or the next valid time after the current one?
  - How would you change the solution for a six-digit HH:MM:SS display?
  - How would you test this function thoroughly, given there are only 10^4 possible inputs?
  - What would change for a 12-hour clock with an AM/PM indicator?
common_errors:
  - Greedy digit-by-digit construction that picks 01 as the hour and then has no valid minutes.
  - Forgetting zero padding, returning "1:5" instead of "01:05".
  - Allowing hour 24 or minutes 60.
  - Returning a time that reuses one digit and drops another when digits repeat.
