expected_concepts:
  - backtracking with a start index so each multiset is built once
  - reusing the same size by recursing without advancing the index
  - sorting sizes to stop early when a size exceeds the remaining seats
  - copying the current basket when recording a result
optimal_complexity: {time: "O(R * seats) in practice where R is the number of purchases (exponential in the worst case)", space: "O(seats) recursion depth besides the output"}
rubric:
  excellent: Sorts the sizes, backtracks with a start index that allows reuse of the current size but never earlier ones, breaks early when a size exceeds the remaining seats, copies the basket on success, and explains why this enumerates each multiset exactly once.
  good: Correct results, possibly generating ordered sequences and deduplicating them, or missing the early break, with a sensible complexity discussion.
  weak: Produces duplicates in different orders, uses each size at most once, or records the shared basket by reference so all results end up empty.
  criteria:
    correctness: All tests pass, including empty results and the single-size cases.
    efficiency: No duplicate generation; pruning on sorted sizes.
    code_quality: Clear choose and undo steps and descriptive names for the basket and remaining seats.
    edge_cases: Sizes larger than seats, unsorted input, a single size and unreachable targets.
    communication: Explains the start-index rule that prevents permutations of the same purchase.
hints:
  - Think of building a purchase one pack at a time while tracking how many seats are still needed.
  - "To avoid listing the same purchase in different orders, decide on a fixed order for picking sizes: once you move on from a size, never go back to it."
  - Sort the sizes and recurse with a start position and the remaining seats; at each step try every size from the start position onward, staying on the same position after picking a size so it can be bought again, stop the loop when a size exceeds the remaining seats, and save a copy of the basket when the remaining seats reach zero.
followups:
  - How would you only count the purchases for seats up to 10,000 without listing them?
  - How would you find the purchase that uses the fewest packs, or the cheapest one if each pack has a price?
  - What changes if each pack size can be bought at most a limited number of times?
  - How would you return the purchases in a deterministic sorted order?
common_errors:
  - Restarting the loop from the first size at every level, which lists the same purchase in several orders.
  - Advancing the start index after choosing a size, which forbids buying the same size twice.
  - Appending the shared basket instead of a copy, so every recorded purchase changes later.
  - Continuing the loop after a size exceeds the remaining seats on sorted input, wasting work.
