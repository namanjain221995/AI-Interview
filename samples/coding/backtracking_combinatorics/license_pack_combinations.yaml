reference_solutions:
  python: |
    def license_pack_combinations(pack_sizes: list[int], seats: int) -> list[list[int]]:
        sizes = sorted(pack_sizes)
        purchases: list[list[int]] = []
        basket: list[int] = []

        def choose(start: int, remaining: int) -> None:
            if remaining == 0:
                purchases.append(basket.copy())
                return
            # Only sizes from index start onward keep each basket in non-decreasing order,
            # so every multiset is built exactly once.
            for index in range(start, len(sizes)):
                size = sizes[index]
                if size > remaining:
                    break
                basket.append(size)
                choose(index, remaining - size)
                basket.pop()

        choose(0, seats)
        return purchases
  javascript: |
    function licensePackCombinations(packSizes, seats) {
      const sizes = [...packSizes].sort((a, b) => a - b);
      const purchases = [];
      const basket = [];
      const choose = (start, remaining) => {
        if (remaining === 0) {
          purchases.push([...basket]);
          return;
        }
        for (let index = start; index < sizes.length; index++) {
          const size = sizes[index];
          if (size > remaining) break;
          basket.push(size);
          choose(index, remaining - size);
          basket.pop();
        }
      };
      choose(0, seats);
      return purchases;
    }
