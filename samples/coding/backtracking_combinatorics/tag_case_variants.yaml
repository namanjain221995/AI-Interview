version: 1
slug: tag_case_variants
title: Case-Insensitive Tag Variants
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Case-Insensitive Tag Variants

  Your team is moving container images from an old registry that treated image tags case-insensitively
  to a new one that is case-sensitive. Old deployment manifests may reference a tag with any mix of upper
  and lower case, so the migration script needs to pre-create an alias for every spelling.

  Given a `tag`, return **every distinct string** that can be obtained by independently choosing upper
  or lower case for each **letter** of the tag. Digits, `.` and `-` are copied unchanged. The original
  spelling is one of the variants.

  - Only the ASCII letters `a`-`z` and `A`-`Z` change case.
  - The variants may be returned in **any order**, but each must appear exactly once.

  ### Example 1
  ```
  Input:  tag = "v1.2-rc"
  Output: ["v1.2-rc", "v1.2-rC", "v1.2-Rc", "v1.2-RC", "V1.2-rc", "V1.2-rC", "V1.2-Rc", "V1.2-RC"]
  Explanation: The letters v, r and c each have two spellings; 1, 2, '.' and '-' never change.
  ```

  ### Example 2
  ```
  Input:  tag = "2.0.1"
  Output: ["2.0.1"]
  Explanation: A tag without letters has exactly one spelling.
  ```

  ### Constraints
  - `1 <= tag.length <= 12`
  - `tag` contains only ASCII letters, digits, `.` and `-`
  - `tag` contains at most 10 letters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: tag_case_variants
  params:
    - {name: tag, type: "string"}
  return_type: "string[]"
  comparison: unordered
reference_solutions:
  python: |
    def tag_case_variants(tag: str) -> list[str]:
        variants = [""]
        for ch in tag:
            if ch.isascii() and ch.isalpha():
                variants = [v + c for v in variants for c in (ch.lower(), ch.upper())]
            else:
                variants = [v + ch for v in variants]
        return variants
  javascript: |
    function tagCaseVariants(tag) {
      let variants = [""];
      for (const ch of tag) {
        if (/[a-zA-Z]/.test(ch)) {
          const next = [];
          for (const v of variants) {
            next.push(v + ch.toLowerCase(), v + ch.toUpperCase());
          }
          variants = next;
        } else {
          variants = variants.map((v) => v + ch);
        }
      }
      return variants;
    }
