expected_concepts:
- two choices per letter, one choice per non-letter
- backtracking or iterative doubling of a partial list
- result size 2^L where L is the number of letters
- normalising the original case before branching
optimal_complexity:
  time: O(n * 2^L) where L is the number of letters
  space: O(n * 2^L) for the output
rubric:
  excellent: Treats each letter as an independent two-way choice, generates variants by backtracking or iterative doubling without duplicates, handles uppercase input and states the O(n * 2^L) bound tied to the output size.
  good: Correct solution that needs a nudge on uppercase input or on skipping non-letters, or that deduplicates with a set instead of avoiding duplicates by construction.
  weak: Only toggles letters that start lowercase, branches on digits and creates duplicates, or misses the original spelling.
  criteria:
    correctness: Every case combination appears exactly once and non-letters are untouched.
    efficiency: Generates exactly 2^L strings without exploring duplicate branches.
    code_quality: Clear letter check and a simple doubling loop or recursive helper.
    edge_cases: Tags with no letters, all-uppercase tags and repeated letters.
    communication: Explains why the number of variants doubles per letter and is unaffected by digits.
hints:
- Each letter can independently be upper or lower case, while every other character has only one option.
- 'Build the variants from left to right: keep a list of partial spellings and extend each one with the possible forms of the next character.'
- Start from a list containing the empty string; for a letter, replace every partial spelling with two longer ones (lowercase and uppercase forms of that letter), and for a digit, dot or dash append the character as is; using the explicit lowercase and uppercase forms makes uppercase input work too.
followups:
- How would you return the variants in sorted order without sorting at the end?
- How would you count the variants without generating them?
- If the registry also treated '-' and '_' as equivalent, how would you extend the generator?
- How could you stream the variants one at a time to keep memory low?
common_errors:
- Toggling the character's current case instead of producing both forms, which breaks on uppercase input.
- Branching on digits or separators and producing duplicate strings.
- Forgetting to include the original spelling.
- Treating every non-digit character, including '.' and '-', as a letter.
