expected_concepts:
  - backtracking that fills one digit at a time
  - pruning when the remaining sum cannot be reached or is exceeded
  - treating PINs as strings so leading zeros survive
  - generating digits in increasing order to get sorted output for free
optimal_complexity: {time: "O(10^length) worst case; with pruning, proportional to the output", space: "O(length) besides the output"}
rubric:
  excellent: Backtracks digit by digit in increasing order, prunes when the remaining sum is negative or larger than nine times the remaining slots, keeps PINs as strings, and explains why the output is already sorted.
  good: Correct answer by enumerating all 10^length strings and filtering, with a clear note on why it is fine for length 4 and how pruning would help.
  weak: Converts PINs to integers and loses leading zeros, returns unsorted output, or mishandles the empty case.
  criteria:
    correctness: All tests pass, including sum 0, impossible sums and leading zeros.
    efficiency: Prunes dead branches using the maximum reachable sum, or justifies full enumeration within the limits.
    code_quality: A small recursive helper with clear parameters for the prefix, remaining slots and remaining sum.
    edge_cases: Length 1, sum 0, sums above 9 times length and the all-nines PIN.
    communication: Explains the pruning rule and the ordering guarantee.
hints:
  - Think of filling the PIN one position at a time, choosing a digit for each position.
  - After choosing some digits you know how much of the sum is still needed and how many positions are left; some choices can never lead to a valid PIN.
  - Recurse over positions trying digits 0 to 9 in increasing order, skip a digit if it exceeds the remaining sum or leaves more than nine times the remaining positions to fill, and record the string when no positions and no sum remain; increasing digit order makes the list sorted.
followups:
  - How would you only count the PINs for length 12 without listing them?
  - What would change if each digit could be used at most once in a PIN?
  - How would you return the PINs one at a time with a generator or iterator instead of building the whole list?
  - Why is a digit-sum check a poor security control, and what would you recommend instead?
common_errors:
  - Building PINs as integers, which turns "03" into 3 and breaks the length rule.
  - Sorting the PINs numerically after converting, which reorders or drops leading zeros.
  - Forgetting the sum 0 case, which has exactly one PIN made of zeros.
  - Missing the pruning bound and recursing into branches that can never reach the sum, which is slow for larger lengths.
