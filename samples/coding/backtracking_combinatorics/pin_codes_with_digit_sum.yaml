title: PIN Codes With Digit Sum
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [security, backend, qa, general]
time_limit_minutes: 12
prompt_markdown: |
  ## PIN Codes With Digit Sum

  A building's door controllers accept numeric PINs. A security audit found that one controller only
  checks the **sum of the digits** of a PIN, not the PIN itself. To measure how bad that is, the audit
  team wants the full list of PINs that the faulty controller would accept.

  Given `length` and `digit_sum`, return every PIN that

  - has exactly `length` characters, each a digit `0`-`9` (leading zeros are allowed, so `"07"` is a valid
    two-digit PIN), and
  - whose digits add up to exactly `digit_sum`.

  Return the PINs as **strings** in **ascending** order. Return an empty list if no PIN qualifies.

  ### Example 1
  ```
  Input:  length = 2, digit_sum = 3
  Output: ["03", "12", "21", "30"]
  ```

  ### Example 2
  ```
  Input:  length = 3, digit_sum = 27
  Output: ["999"]
  ```

  ### Example 3
  ```
  Input:  length = 2, digit_sum = 19
  Output: []
  Explanation: The largest possible sum of two digits is 9 + 9 = 18.
  ```

  ### Constraints
  - `1 <= length <= 4`
  - `0 <= digit_sum <= 40`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: pin_codes_with_digit_sum
  params:
    - {name: length, type: int}
    - {name: digit_sum, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def pin_codes_with_digit_sum(length: int, digit_sum: int) -> list[str]:
        pins: list[str] = []

        def build(prefix: str, slots_left: int, sum_left: int) -> None:
            if slots_left == 0:
                if sum_left == 0:
                    pins.append(prefix)
                return
            for digit in range(10):
                if digit > sum_left:
                    break
                # The remaining slots can add at most 9 each.
                if sum_left - digit > 9 * (slots_left - 1):
                    continue
                build(prefix + str(digit), slots_left - 1, sum_left - digit)

        build("", length, digit_sum)
        return pins
  javascript: |
    function pinCodesWithDigitSum(length, digitSum) {
      const pins = [];
      const build = (prefix, slotsLeft, sumLeft) => {
        if (slotsLeft === 0) {
          if (sumLeft === 0) pins.push(prefix);
          return;
        }
        for (let digit = 0; digit <= 9 && digit <= sumLeft; digit++) {
          if (sumLeft - digit > 9 * (slotsLeft - 1)) continue;
          build(prefix + digit, slotsLeft - 1, sumLeft - digit);
        }
      };
      build("", length, digitSum);
      return pins;
    }
