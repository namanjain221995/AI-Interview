version: 1
slug: count_conflict_free_orders
title: Conflict-Free Task Orders
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, project_manager, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Conflict-Free Task Orders

  During a maintenance window, a set of tasks runs strictly one after another. Some pairs of tasks
  contend for the same resource (a disk, a lock, a network link) and must **not run back to back**:
  between them there has to be at least one other task.

  You are given the distinct task names `tasks` and a list `conflicts` of pairs `[a, b]`. A conflict is
  **symmetric** (`[a, b]` also forbids `b` directly followed by `a`), and the same pair may appear more
  than once, in either orientation. Every name in `conflicts` appears in `tasks`, and `a != b`.

  Return the number of orderings of **all** the tasks in which no two adjacent tasks form a conflicting
  pair. Two orderings are different if some position holds a different task.

  ### Example 1
  ```
  Input:  tasks = ["backup", "reindex", "vacuum"], conflicts = [["backup", "reindex"]]
  Output: 2
  Explanation: Only vacuum can separate the pair: backup, vacuum, reindex and reindex, vacuum, backup.
  ```

  ### Example 2
  ```
  Input:  tasks = ["deploy", "migrate"], conflicts = [["migrate", "deploy"]]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  tasks = ["lint", "build", "test"], conflicts = []
  Output: 6
  ```

  ### Constraints
  - `1 <= tasks.length <= 9`
  - task names are distinct, non-empty and at most 12 characters long
  - `0 <= conflicts.length <= 36`
  - `conflicts[i].length == 2`, both names are in `tasks` and differ
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_conflict_free_orders
  params:
    - {name: tasks, type: "string[]"}
    - {name: conflicts, type: "string[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_conflict_free_orders(tasks: list[str], conflicts: list[list[str]]) -> int:
        n = len(tasks)
        index = {name: i for i, name in enumerate(tasks)}
        clash = [[False] * n for _ in range(n)]
        for a, b in conflicts:
            clash[index[a]][index[b]] = clash[index[b]][index[a]] = True

        # ways[mask][last]: orderings of the tasks in mask that end with task last.
        full = (1 << n) - 1
        ways = [[0] * n for _ in range(1 << n)]
        for i in range(n):
            ways[1 << i][i] = 1
        for mask in range(1, full + 1):
            for last in range(n):
                count = ways[mask][last]
                if count == 0:
                    continue
                for nxt in range(n):
                    if not mask & (1 << nxt) and not clash[last][nxt]:
                        ways[mask | (1 << nxt)][nxt] += count
        return sum(ways[full])
  javascript: |
    function countConflictFreeOrders(tasks, conflicts) {
      const n = tasks.length;
      const index = new Map(tasks.map((name, i) => [name, i]));
      const clash = Array.from({ length: n }, () => new Array(n).fill(false));
      for (const [a, b] of conflicts) {
        const i = index.get(a);
        const j = index.get(b);
        clash[i][j] = true;
        clash[j][i] = true;
      }
      const full = (1 << n) - 1;
      const ways = Array.from({ length: full + 1 }, () => new Array(n).fill(0));
      for (let i = 0; i < n; i++) ways[1 << i][i] = 1;
      for (let mask = 1; mask <= full; mask++) {
        for (let last = 0; last < n; last++) {
          const count = ways[mask][last];
          if (count === 0) continue;
          for (let nxt = 0; nxt < n; nxt++) {
            if ((mask & (1 << nxt)) === 0 && !clash[last][nxt]) ways[mask | (1 << nxt)][nxt] += count;
          }
        }
      }
      return ways[full].reduce((a, b) => a + b, 0);
    }
tests:
  - {id: t1, args: [["backup", "reindex", "vacuum"], [["backup", "reindex"]]], expected: 2, description: "Example 1 - one conflict among three tasks"}
  - {id: t2, args: [["deploy", "migrate"], [["migrate", "deploy"]]], expected: 0, description: "Example 2 - two tasks that conflict can never be ordered"}
  - {id: t3, args: [["lint", "build", "test"], []], expected: 6, description: "Example 3 - no conflicts: every ordering counts (3! = 6)"}
  - {id: t4, hidden: true, args: [["solo"], []], expected: 1, description: "Single task: exactly one ordering"}
  - {id: t5, hidden: true, args: [["a", "b", "c", "d"], [["a", "b"], ["b", "a"], ["a", "b"], ["c", "d"]]], expected: 8, description: "Repeated and reversed duplicate conflicts must count once"}
  - {id: t6, hidden: true, args: [["hub", "w1", "w2", "w3"], [["hub", "w1"], ["hub", "w2"], ["hub", "w3"]]], expected: 0, description: "One task conflicts with all others: it has no valid neighbour, answer 0"}
  - {id: t7, hidden: true, args: [["t1", "t2", "t3", "t4", "t5"], [["t1", "t2"], ["t2", "t3"], ["t3", "t4"], ["t4", "t5"]]], expected: 14, description: "Conflicts form a chain: neighbours in the chain must be separated"}
  - {id: t8, hidden: true, args: [["a1", "a2", "a3", "b1", "b2", "b3"], [["a1", "a2"], ["a1", "a3"], ["a2", "a3"], ["b1", "b2"], ["b1", "b3"], ["b2", "b3"]]], expected: 72, description: "Two groups of mutually conflicting tasks: orderings must alternate groups"}
  - {id: t9, hidden: true, args: [["backup", "reindex", "vacuum", "rotate", "patch", "reboot", "scan", "sync", "purge"], []], expected: 362880, description: "Nine tasks without conflicts: 9! = 362880, the largest possible answer and the full search space"}
  - {id: t10, hidden: true, args: [["backup", "reindex", "vacuum", "rotate", "patch", "reboot", "scan", "sync", "purge"], [["backup", "reindex"], ["reindex", "vacuum"], ["patch", "reboot"], ["reboot", "scan"], ["sync", "purge"], ["backup", "purge"], ["rotate", "sync"], ["vacuum", "patch"]]], expected: 47622, description: "Nine tasks with eight mixed conflicts: stress case favouring subset DP over plain permutation search"}
expected_concepts:
  - "backtracking over permutations with pruning when the next task conflicts with the previous one"
  - "symmetric conflict lookup (adjacency matrix or set of pairs) that ignores duplicates"
  - "dynamic programming over subsets: state is (set of placed tasks, last task)"
  - "O(2^n * n^2) DP versus O(n!) enumeration"
optimal_complexity: {time: "O(2^n * n^2)", space: "O(2^n * n)"}
rubric:
  excellent: "Builds a symmetric conflict lookup, recognises that only the set of placed tasks and the last task matter, implements the O(2^n * n^2) subset DP (or memoised backtracking on that state) and compares it with O(n!) enumeration."
  good: "Correct backtracking that places tasks one by one and prunes on conflicts with the previous task; passes the tests within limits and discusses the factorial cost."
  weak: "Treats conflicts as one-directional, double counts duplicate pairs, checks non-adjacent tasks, or enumerates and stores all permutations without pruning."
  criteria:
    correctness: "All tests pass, including duplicate and reversed conflicts and cases with no valid ordering."
    efficiency: "Uses subset DP or memoisation on (placed set, last task); plain enumeration is acknowledged as factorial."
    code_quality: "Names map to indices once; the conflict check is a constant-time lookup."
    edge_cases: "Single task, no conflicts, a task that conflicts with everyone and repeated pairs."
    communication: "Explains why the order of the earlier tasks does not matter once the set and the last task are known."
hints:
  - "Build the ordering one position at a time: when choosing the next task, which earlier decision actually restricts your choice?"
  - "Only the previous task matters for the adjacency rule, so backtracking with a quick symmetric conflict lookup works. To go faster, notice that two partial orderings with the same set of used tasks and the same last task have exactly the same number of completions."
  - "Map names to indices and fill a symmetric conflict matrix. Count with a table indexed by a bitmask of used tasks and the last task: start each single task with one way, then for every state add its count to each state reached by appending an unused task that does not conflict with the last one. The answer is the sum over all last tasks for the full mask."
followups:
  - "How would you list the orderings in lexicographic order instead of counting them?"
  - "How would the solution change if conflicting tasks needed at least two other tasks between them?"
  - "Up to how many tasks is the subset DP practical, and what limits it?"
  - "How would you count orderings if some tasks must also come before others?"
common_errors:
  - "Recording a conflict in only one direction."
  - "Counting duplicate conflict pairs as separate constraints in a way that changes the answer."
  - "Generating all permutations into a list first, which wastes memory for nine tasks."
  - "Forgetting that a single task has exactly one valid ordering."
