expected_concepts:
  - backtracking over positions with a per-character count (or sorted input with a used array)
  - skipping duplicate choices at the same position instead of deduplicating afterwards
  - producing sorted output by exploring characters in order
  - multinomial count of distinct arrangements
optimal_complexity: {time: "O(n * P) where P is the number of distinct arrangements", space: "O(n) besides the output"}
rubric:
  excellent: Backtracks with character counts (or sorted characters plus a skip-equal-sibling rule), never generates duplicates, emits results in sorted order, and states the output-sensitive complexity using the multinomial count.
  good: Generates all permutations and removes duplicates with a set, then sorts, while explaining the waste for inputs like "BBBBBBBT"; or the count-based method with minor bugs fixed during testing.
  weak: Returns duplicates, unsorted output, or misses arrangements because the duplicate-skip rule is applied incorrectly.
  criteria:
    correctness: All tests pass, including all-identical and fully distinct inputs.
    efficiency: Work proportional to the number of distinct results; no 8! generation followed by deduplication without discussion.
    code_quality: Clean backtracking with symmetric choose and undo steps.
    edge_cases: Single character, all identical characters and unsorted input.
    communication: Explains why the chosen rule prevents duplicates.
hints:
  - Swapping two identical stages produces the same string. Think about choosing the stage type for each position rather than choosing a specific character.
  - Keep how many of each stage type are still unused. At every position, try each type that still has stages left, but only once per type.
  - Count the occurrences of each letter, then recurse position by position trying the letters in alphabetical order, decrementing the chosen letter's count before recursing and restoring it afterwards; record the string when every position is filled, and the results come out sorted with no duplicates.
followups:
  - How many distinct sequences are there for a given string, and how can you compute that number without listing them?
  - How would you produce the next sequence in sorted order from the current one without recursion?
  - How would you find the k-th sequence in sorted order directly?
  - What changes if certain stage types must never be adjacent?
common_errors:
  - Generating all n! permutations and returning duplicates for repeated stage types.
  - Skipping a duplicate character only when it equals the previous one without checking whether the previous one is in use, which drops valid sequences.
  - Forgetting to sort, or sorting the input but appending results in an unsorted order.
  - Mutating the shared path or counts without undoing the change after the recursive call.
