slug: distinct_stage_sequences
title: Distinct Pipeline Stage Sequences
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [devops, backend, platform, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Distinct Pipeline Stage Sequences

  A release-engineering team is load-testing its pipeline orchestrator. Each pipeline is described by a
  string of **stage-type codes**, one uppercase letter per stage, for example `"BBT"` for two build stages
  and one test stage. Stages of the same type are interchangeable, so two orderings that read the same
  are the same pipeline.

  To exercise the scheduler with every possible ordering, return **every distinct rearrangement** of the
  characters of `stages`:

  - each result uses every character of `stages` exactly as many times as it appears;
  - no string may appear twice in the result;
  - the result is sorted in **ascending** order (plain character-code order, which for uppercase letters is
    alphabetical).

  ### Example 1
  ```
  Input:  stages = "BBT"
  Output: ["BBT", "BTB", "TBB"]
  Explanation: The two B stages are interchangeable, so there are 3 distinct orderings, not 6.
  ```

  ### Example 2
  ```
  Input:  stages = "DT"
  Output: ["DT", "TD"]
  ```

  ### Constraints
  - `1 <= stages.length <= 8`
  - `stages` contains only uppercase letters `A`-`Z`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: distinct_stage_sequences
  params:
    - {name: stages, type: string}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def distinct_stage_sequences(stages: str) -> list[str]:
        counts: dict[str, int] = {}
        for code in stages:
            counts[code] = counts.get(code, 0) + 1
        kinds = sorted(counts)
        result: list[str] = []
        current: list[str] = []

        def place() -> None:
            if len(current) == len(stages):
                result.append("".join(current))
                return
            # Choosing each distinct remaining code once per position avoids duplicates,
            # and trying codes in sorted order emits the results already sorted.
            for code in kinds:
                if counts[code] == 0:
                    continue
                counts[code] -= 1
                current.append(code)
                place()
                current.pop()
                counts[code] += 1

        place()
        return result
  javascript: |
    function distinctStageSequences(stages) {
      const counts = new Map();
      for (const code of stages) counts.set(code, (counts.get(code) || 0) + 1);
      const kinds = [...counts.keys()].sort();
      const result = [];
      const current = [];
      const place = () => {
        if (current.length === stages.length) {
          result.push(current.join(""));
          return;
        }
        for (const code of kinds) {
          if (counts.get(code) === 0) continue;
          counts.set(code, counts.get(code) - 1);
          current.push(code);
          place();
          current.pop();
          counts.set(code, counts.get(code) + 1);
        }
      };
      place();
      return result;
    }
