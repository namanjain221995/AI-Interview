reference_solutions:
  python: |
    def peer_review_rotations(n: int, blocked: list[list[int]]) -> list[list[int]]:
        allowed = [[pr != eng for eng in range(n)] for pr in range(n)]
        for pr, eng in blocked:
            allowed[pr][eng] = False
        taken = [False] * n
        current: list[int] = []
        rotations: list[list[int]] = []

        def assign(pr: int) -> None:
            if pr == n:
                rotations.append(list(current))
                return
            for eng in range(n):
                if not taken[eng] and allowed[pr][eng]:
                    taken[eng] = True
                    current.append(eng)
                    assign(pr + 1)
                    current.pop()
                    taken[eng] = False

        assign(0)
        return rotations
  javascript: |
    function peerReviewRotations(n, blocked) {
      const allowed = Array.from({ length: n }, (_, pr) =>
        Array.from({ length: n }, (_, eng) => pr !== eng));
      for (const [pr, eng] of blocked) allowed[pr][eng] = false;
      const taken = new Array(n).fill(false);
      const current = [];
      const rotations = [];
      function assign(pr) {
        if (pr === n) {
          rotations.push([...current]);
          return;
        }
        for (let eng = 0; eng < n; eng++) {
          if (taken[eng] || !allowed[pr][eng]) continue;
          taken[eng] = true;
          current.push(eng);
          assign(pr + 1);
          current.pop();
          taken[eng] = false;
        }
      }
      assign(0);
      return rotations;
    }
