role_tags: [engineering_manager, tech_lead, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Peer Review Rotations

  A team of `n` engineers, numbered `0` to `n - 1`, has opened one pull request each: engineer `i`
  authored PR `i`. The tech lead wants to plan a review **rotation** in which every PR gets exactly one
  reviewer and every engineer reviews exactly one PR.

  A rotation is an array `a` of length `n` where `a[i]` is the engineer who reviews PR `i`. It is valid
  when:

  - every engineer appears exactly once in `a`,
  - nobody reviews their own PR (`a[i]` is never `i`), and
  - no assignment listed in `blocked` is used: each `blocked[j] = [pr, engineer]` means `engineer` may
    not review PR `pr` (for example because they pair-programmed it).

  Return **all** valid rotations in ascending **lexicographic** order (compare arrays element by
  element; the first difference decides). If no valid rotation exists, return an empty list.

  ### Example 1
  ```
  Input:  n = 3, blocked = []
  Output: [[1, 2, 0], [2, 0, 1]]
  Explanation: Only the two cyclic rotations avoid self-review.
  ```

  ### Example 2
  ```
  Input:  n = 4, blocked = [[0, 1], [2, 3]]
  Output: [[2, 3, 0, 1], [2, 3, 1, 0], [3, 0, 1, 2], [3, 2, 0, 1], [3, 2, 1, 0]]
  Explanation: Engineer 1 may not review PR 0 and engineer 3 may not review PR 2.
  ```

  ### Constraints
  - `1 <= n <= 6`
  - `0 <= blocked.length <= n * (n - 1)`
  - `blocked[j].length == 2`, `0 <= pr, engineer < n`, `pr != engineer`
  - The pairs in `blocked` are distinct.
languages: [python, javascript, typescript, java, go, cpp]
