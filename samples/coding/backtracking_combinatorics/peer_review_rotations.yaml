expected_concepts:
- permutations with constraints (derangements) by backtracking
- pruning a branch as soon as a PR has no allowed reviewer
- lookup table for blocked pairs instead of scanning the list
- lexicographic output by trying reviewers in increasing order
optimal_complexity:
  time: O(n * n!) worst case
  space: O(n^2) for the allowed table plus O(n) recursion
rubric:
  excellent: Assigns reviewers PR by PR with a taken marker and a constant-time allowed check, tries engineers in increasing order so output is lexicographic, handles n = 1 and impossible inputs by returning an empty list, and explains the n! bound with pruning.
  good: Generates all permutations and filters invalid ones, or checks blocked pairs by scanning the list, with correct results and complexity discussion.
  weak: Allows self-review, ignores blocked pairs, returns rotations out of order, or reuses an engineer for two PRs.
  criteria:
    correctness: Exactly the valid rotations, in lexicographic order; empty list when none exist.
    efficiency: Prunes invalid choices while building instead of filtering complete permutations.
    code_quality: Clear names for the PR index, taken engineers and the allowed table.
    edge_cases: n = 1, all reviewers of a PR blocked, and n = 2 with the swap blocked.
    communication: Explains why choosing reviewers in increasing order yields lexicographic output.
hints:
- A rotation is an ordering of the engineers with a few positions ruled out, so you can build it one PR at a time.
- For each PR in turn, try every engineer who has not been given a PR yet and who is allowed to review this one; if none fits, abandon that partial rotation.
- Precompute a table saying whether an engineer may review a PR (false on the diagonal and for blocked pairs), then recurse over PRs trying engineers in increasing number, marking the chosen engineer as taken before recursing and clearing the mark afterwards; trying them in increasing order makes the results come out lexicographically sorted.
followups:
- How many valid rotations exist for n engineers with no blocked pairs, and can you compute it without listing them?
- How would you return just one valid rotation quickly for n = 200 (a matching problem)?
- How would you prefer rotations where nobody reviews the same person as last sprint?
- How would you avoid rotations where two engineers simply swap reviews with each other?
common_errors:
- Forgetting the no-self-review rule or the blocked pairs.
- Returning [[0]] instead of an empty list for n = 1.
- Reading blocked pairs in the wrong direction (engineer, pr instead of pr, engineer).
- Not unmarking the engineer after backtracking, so later branches miss options.
