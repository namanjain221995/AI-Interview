title: Depth-Limited Span Sequences
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, sre, platform, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Depth-Limited Span Sequences

  A tracing library writes a compact event string for each request: `(` when a span **opens** and `)`
  when the most recently opened, still-open span **closes**. To fuzz the trace viewer, the observability
  team wants every well-formed event string the tracer can produce.

  An event string is **valid** when:

  - it contains exactly `pairs` opening and `pairs` closing characters;
  - reading left to right, a span is never closed when no span is open (the number of `)` never exceeds
    the number of `(` so far), and every span is closed at the end;
  - the tracer can hold at most `max_depth` spans open at the same time, so the number of currently open
    spans never exceeds `max_depth`.

  Return every valid event string, sorted in ascending **ASCII order** (`(` sorts before `)`).

  ### Example 1
  ```
  Input:  pairs = 3, max_depth = 2
  Output: ["(()())", "(())()", "()(())", "()()()"]
  Explanation: "((()))" is excluded because it holds three spans open at once.
  ```

  ### Example 2
  ```
  Input:  pairs = 2, max_depth = 5
  Output: ["(())", "()()"]
  ```

  ### Constraints
  - `1 <= pairs <= 8`
  - `1 <= max_depth <= 8`
