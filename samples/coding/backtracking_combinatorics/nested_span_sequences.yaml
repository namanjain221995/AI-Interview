reference_solutions:
  python: |
    def nested_span_sequences(pairs: int, max_depth: int) -> list[str]:
        sequences: list[str] = []
        events: list[str] = []

        def emit(opened: int, closed: int) -> None:
            if closed == pairs:
                sequences.append("".join(events))
                return
            depth = opened - closed
            # Trying "(" before ")" produces the strings in ascending ASCII order.
            if opened < pairs and depth < max_depth:
                events.append("(")
                emit(opened + 1, closed)
                events.pop()
            if depth > 0:
                events.append(")")
                emit(opened, closed + 1)
                events.pop()

        emit(0, 0)
        return sequences
  javascript: |
    function nestedSpanSequences(pairs, maxDepth) {
      const sequences = [];
      const events = [];
      const emit = (opened, closed) => {
        if (closed === pairs) {
          sequences.push(events.join(""));
          return;
        }
        const depth = opened - closed;
        if (opened < pairs && depth < maxDepth) {
          events.push("(");
          emit(opened + 1, closed);
          events.pop();
        }
        if (depth > 0) {
          events.push(")");
          emit(opened, closed + 1);
          events.pop();
        }
      };
      emit(0, 0);
      return sequences;
    }
