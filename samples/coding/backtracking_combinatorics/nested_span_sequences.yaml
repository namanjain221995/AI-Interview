expected_concepts:
  - "backtracking with counts of opened and closed spans"
  - "pruning: open only while opened < pairs and depth < max_depth; close only while depth > 0"
  - "choosing the opening character first yields ascending ASCII order without sorting"
  - "output-sensitive running time"
optimal_complexity: {time: "O(n * S) where S is the number of valid strings and n = 2 * pairs", space: "O(n) besides the output"}
rubric:
  excellent: "Builds strings with backtracking guided by the opened and closed counts, enforces the depth limit while generating rather than filtering afterwards, explains why trying the opening character first gives sorted output and describes the output-sensitive cost."
  good: "Correct backtracking that respects the depth limit, possibly followed by an explicit sort."
  weak: "Generates all 2^(2n) strings and filters them, ignores the depth limit, or returns unsorted output."
  criteria:
    correctness: "Every valid string appears once and none exceed the depth limit; output is in ASCII order."
    efficiency: "Never explores a prefix that cannot lead to a valid string."
    code_quality: "Recursion state is minimal (opened, closed or depth) and the two choices are clearly separated."
    edge_cases: "Depth 1, depth at or above pairs and the smallest input."
    communication: "Explains how the current depth is derived and why both pruning rules are needed."
hints:
  - "Build the string one character at a time; at each step you only need to know how many spans you have opened and how many you have closed so far."
  - "You may add an opening character only if you still have spans left to open and the current depth is below the limit; you may add a closing character only if at least one span is open."
  - "Write a recursive helper that takes the opened and closed counts, records the string once all spans are closed, and otherwise first tries an opening character (when both conditions allow it) and then a closing character (when the depth is positive), undoing each choice afterwards. Trying the opening character first visits strings in ASCII order, so no final sort is needed."
followups:
  - "How would you count the valid strings for large pairs without listing them?"
  - "How would you also enforce a minimum depth that must be reached at least once?"
  - "How would the solution change with two span types, such as round and square brackets, that must nest correctly?"
  - "How many strings are there when max_depth is 2, and why?"
common_errors:
  - "Checking the depth limit only after appending, which lets the depth reach max_depth + 1."
  - "Allowing a closing character when no span is open."
  - "Generating every string of opening and closing characters and filtering, which is far too slow for eight pairs."
  - "Trying the closing character first and returning the strings in the wrong order."
