version: 1
slug: min_runner_imbalance
title: Two-Runner Test Split
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, qa, platform, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Two-Runner Test Split

  Your CI pipeline has two identical runners that execute test suites in parallel. You know how long each
  suite takes (`durations[i]` seconds). Every suite must run on **exactly one** of the two runners, a suite
  cannot be split, and a runner is allowed to receive no suites at all.

  The pipeline finishes when the busier runner is done, so you want the two runners' total durations to
  be as close as possible. Return the **minimum possible absolute difference** between the total
  duration assigned to the first runner and the total assigned to the second.

  ### Example 1
  ```
  Input:  durations = [30, 10, 20, 5]
  Output: 5
  Explanation: {30} and {10, 20, 5} give 30 and 35. No split of the total 65 gets closer.
  ```

  ### Example 2
  ```
  Input:  durations = [12, 7, 7, 4, 3]
  Output: 1
  Explanation: {12, 4} = 16 and {7, 7, 3} = 17. The total 33 is odd, so 1 is the best possible.
  ```

  ### Example 3
  ```
  Input:  durations = [40]
  Output: 40
  Explanation: The only suite runs on one runner and the other stays idle.
  ```

  ### Constraints
  - `1 <= durations.length <= 18`
  - `1 <= durations[i] <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_runner_imbalance
  params:
    - {name: durations, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_runner_imbalance(durations: list[int]) -> int:
        total = sum(durations)
        # Bit s of reachable is set when some subset of suites sums to s.
        reachable = 1
        for duration in durations:
            reachable |= reachable << duration
        # The best first-runner load is the largest reachable sum not above half the total.
        for load in range(total // 2, -1, -1):
            if (reachable >> load) & 1:
                return total - 2 * load
        return total
  javascript: |
    function minRunnerImbalance(durations) {
      const total = durations.reduce((a, b) => a + b, 0);
      const half = Math.floor(total / 2);
      const reachable = new Uint8Array(half + 1);
      reachable[0] = 1;
      for (const duration of durations) {
        for (let load = half; load >= duration; load--) {
          if (reachable[load - duration]) reachable[load] = 1;
        }
      }
      for (let load = half; load >= 0; load--) {
        if (reachable[load]) return total - 2 * load;
      }
      return total;
    }
tests:
  - {id: t1, args: [[30, 10, 20, 5]], expected: 5, description: "Example 1"}
  - {id: t2, args: [[12, 7, 7, 4, 3]], expected: 1, description: "Example 2 - odd total, best is 1"}
  - {id: t3, args: [[40]], expected: 40, description: "Example 3 - single suite, other runner idle"}
  - {id: t4, hidden: true, args: [[9, 9]], expected: 0, description: "Two equal suites - perfect split"}
  - {id: t5, hidden: true, args: [[1, 2, 4, 8, 16, 32, 64]], expected: 1, description: "Powers of two - one suite outweighs all the others combined"}
  - {id: t6, hidden: true, args: [[100000, 1, 1, 1]], expected: 99997, description: "One huge suite dominates - greedy balancing is irrelevant"}
  - {id: t7, hidden: true, args: [[8, 7, 6, 5, 4]], expected: 0, description: "Largest-first greedy gives 4 but the optimum is 0 ({8, 7} vs {6, 5, 4})"}
  - {id: t8, hidden: true, args: [[100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 100000, 99999]], expected: 1, description: "Maximum length with maximum values - totals beyond 16 bits, near-equal values"}
  - {id: t9, hidden: true, args: [[37, 91, 14, 58, 73, 26, 49, 82, 65, 11, 98, 33, 7, 54, 21, 76, 40, 3]], expected: 0, description: "Maximum length with varied values - exhaustive search must stay within limits"}
  - {id: t10, hidden: true, args: [[99991, 50021, 49970, 3, 77777, 22222, 12345, 54321]], expected: 2406, description: "Large distinct values where only one subset combination reaches the best split"}
expected_concepts:
  - reduce to finding a subset whose sum is as close as possible to half the total
  - exhaustive search over 2^n subsets with backtracking or bit masks
  - subset-sum dynamic programming or bitset of reachable sums
  - why a largest-first greedy split is not optimal
optimal_complexity: {time: "O(min(2^n, n * S)) where S is the total duration", space: "O(S) for the DP, O(n) for the recursion"}
rubric:
  excellent: Reframes the task as finding the reachable subset sum closest to half the total, compares the 2^n search with the subset-sum DP or bitset and picks one with a clear complexity argument, and shows a counterexample to greedy.
  good: Correct exhaustive search over all assignments (recursion or bit masks) with a sound note that n <= 18 keeps it fast.
  weak: Uses a greedy rule such as giving each suite to the lighter runner and fails some tests, or forgets that a runner may stay empty.
  criteria:
    correctness: All tests pass, including the greedy counterexample and a single suite.
    efficiency: 2^n search justified by the limits, or a subset-sum DP over totals; no factorial permutation search.
    code_quality: Clear separation of computing reachable loads and choosing the best one.
    edge_cases: Single suite, equal suites, one dominant suite and large totals.
    communication: Explains the reduction from difference to a subset closest to half the total.
hints:
  - If the first runner gets a total of L, what is the difference between the two runners in terms of L and the overall total?
  - The difference is smallest when the first runner's load is as close as possible to half of the total. With at most 18 suites, you can afford to consider every way to choose the first runner's suites.
  - Either explore every include-or-exclude choice recursively while tracking the load, or build the set of all reachable loads one suite at a time; then take the largest reachable load not above half the total and return the total minus twice that load.
followups:
  - How would you solve it for 200 suites whose durations are at most 100 seconds?
  - What would change with three runners?
  - How would you also return which suites go to each runner?
  - Why does the greedy rule of giving the next longest suite to the lighter runner fail, and how far from optimal can it be?
common_errors:
  - Greedily assigning the longest suite to the less loaded runner, which is not optimal.
  - Sorting and splitting the list in the middle by index.
  - Forgetting that one runner may get no suites, which matters when one suite dominates.
  - Allocating a DP table of the full total for every suite instead of reusing one row.
