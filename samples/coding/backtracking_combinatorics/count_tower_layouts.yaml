version: 1
slug: count_tower_layouts
title: "Count Interference-Free Tower Layouts"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, backend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Count Interference-Free Tower Layouts

  A network planner divides a square site into an `n x n` map of plots. In `board`, row `r` is a
  string of length `n` where `'.'` marks a buildable plot and `'#'` marks a plot where nothing can be
  built (a pond, a road, an existing structure).

  Exactly `n` directional transmitter towers must be placed on buildable plots. Two towers interfere
  when they are in the same row, the same column, or on the same diagonal (in either direction), no
  matter how far apart they are. Blocked plots **do not** shield interference: two towers on the same
  line interfere even if a `'#'` lies between them.

  Write `count_tower_layouts(board)` that returns the number of different layouts in which all `n`
  towers are placed and no two towers interfere. Two layouts are different if some plot holds a tower
  in one layout and not in the other. Return `0` if no such layout exists.

  ### Example 1
  ```
  Input:  board = ["....", "....", "....", "...."]
  Output: 2
  Explanation: The two layouts put the towers in columns [1, 3, 0, 2] and [2, 0, 3, 1] for rows 0 to 3.
  ```

  ### Example 2
  ```
  Input:  board = [".#..", "....", "....", "...."]
  Output: 1
  Explanation: The layout that needs a tower in row 0, column 1 is no longer possible.
  ```

  ### Example 3
  ```
  Input:  board = ["#.", ".."]
  Output: 0
  ```

  ### Constraints
  - `1 <= n <= 9`
  - `board.length == n` and `board[r].length == n`
  - `board[r][c]` is `'.'` or `'#'`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_tower_layouts
  params:
    - {name: board, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_tower_layouts(board: list[str]) -> int:
        n = len(board)
        cols: set[int] = set()
        diagonals: set[int] = set()  # r - c is constant on a down-right diagonal
        anti_diagonals: set[int] = set()  # r + c is constant on a down-left diagonal

        def place(row: int) -> int:
            if row == n:
                return 1
            total = 0
            for col in range(n):
                if board[row][col] == "#":
                    continue
                if col in cols or row - col in diagonals or row + col in anti_diagonals:
                    continue
                cols.add(col)
                diagonals.add(row - col)
                anti_diagonals.add(row + col)
                total += place(row + 1)
                cols.discard(col)
                diagonals.discard(row - col)
                anti_diagonals.discard(row + col)
            return total

        return place(0)
  javascript: |
    function countTowerLayouts(board) {
      const n = board.length;
      const cols = new Set();
      const diagonals = new Set(); // r - c
      const antiDiagonals = new Set(); // r + c
      const place = (row) => {
        if (row === n) return 1;
        let total = 0;
        for (let col = 0; col < n; col++) {
          if (board[row][col] === "#") continue;
          if (cols.has(col) || diagonals.has(row - col) || antiDiagonals.has(row + col)) continue;
          cols.add(col);
          diagonals.add(row - col);
          antiDiagonals.add(row + col);
          total += place(row + 1);
          cols.delete(col);
          diagonals.delete(row - col);
          antiDiagonals.delete(row + col);
        }
        return total;
      };
      return place(0);
    }
tests:
  - {id: t1, args: [["....", "....", "....", "...."]], expected: 2, description: "Example 1 - open 4x4 site has two layouts"}
  - {id: t2, args: [[".#..", "....", "....", "...."]], expected: 1, description: "Example 2 - one blocked plot removes one of the two layouts"}
  - {id: t3, args: [["#.", ".."]], expected: 0, description: "Example 3 - a blocked plot does not help: 2x2 has no layout at all"}
  - {id: t4, hidden: true, args: [["."]], expected: 1, description: "Minimum size - single buildable plot"}
  - {id: t5, hidden: true, args: [["#"]], expected: 0, description: "Minimum size - single blocked plot gives 0"}
  - {id: t6, hidden: true, args: [["...", "...", "..."]], expected: 0, description: "3x3 open site - no layout exists"}
  - {id: t7, hidden: true, args: [["......", "......", "......", "......", "......", "......"]], expected: 4, description: "6x6 open site"}
  - {id: t8, hidden: true, args: [["....", "####", "....", "...."]], expected: 0, description: "A fully blocked row makes every layout impossible"}
  - {id: t9, hidden: true, args: [[".#....", "...#..", "#.....", "....#.", "..#...", "......"]], expected: 1, description: "6x6 site whose blocked plots remove three of the four open-site layouts"}
  - {id: t10, hidden: true, args: [[".....", "..#..", ".....", "...#.", "....."]], expected: 7, description: "Blocked plots lie between towers on a diagonal - they must NOT shield (treating them as shields gives 8 instead of 7)"}
  - {id: t11, hidden: true, args: [["........", "........", "........", "........", "........", "........", "........", "........"]], expected: 92, description: "8x8 open site"}
  - {id: t12, hidden: true, args: [["#........", ".........", "....#....", ".........", "........#", ".........", "..#......", ".........", "......#.."]], expected: 212, description: "Worst case size - 9x9 site with scattered blocked plots"}
expected_concepts:
  - "row-by-row backtracking (one tower per row)"
  - "sets or boolean arrays for columns and both diagonal directions"
  - "diagonal indexing by row - col and row + col"
  - "skipping blocked plots during placement"
optimal_complexity: {time: "O(n!)", space: "O(n)"}
rubric:
  excellent: "Observes that every row holds exactly one tower, backtracks row by row, tracks used columns and both diagonal families in constant-time structures, skips blocked plots, explains that blocked plots do not shield, and states the factorial bound."
  good: "Correct backtracking with an O(n) safety check scanning earlier rows, or minor prompting on the diagonal indexing."
  weak: "Enumerates all subsets of plots, treats blocked plots as shields, misses one diagonal direction, or counts symmetric layouts once."
  criteria:
    correctness: "Exact count of valid layouts including blocked-plot restrictions."
    efficiency: "Constant-time conflict checks with row-by-row pruning."
    code_quality: "Symmetric add and remove of column and diagonal markers."
    edge_cases: "n = 1 open or blocked, n = 2 and 3 with no layout, fully blocked rows."
    communication: "Explains why one tower per row reduces the search and how diagonals are indexed."
hints:
  - "Since no two towers may share a row and there are exactly n towers, every row holds exactly one tower. That turns the problem into choosing one column per row."
  - "Place towers one row at a time. Before placing in a column, check that the plot is buildable and that no earlier tower shares its column or either diagonal; after exploring that choice, remove the tower and try the next column."
  - "Plots on the same down-right diagonal share the value row minus column, and plots on the same down-left diagonal share row plus column. Keep three sets (columns, row minus column, row plus column), recurse to the next row after each valid placement, add one when every row has a tower, and sum the counts."
followups:
  - "How would bitmasks for columns and diagonals speed this up?"
  - "How would you list the layouts instead of counting them?"
  - "What changes if blocked plots did shield interference along a line?"
common_errors:
  - "Checking only one diagonal direction."
  - "Treating blocked plots as walls that stop interference."
  - "Forgetting to remove a tower's markers after backtracking."
  - "Returning 1 for the 2x2 or 3x3 cases."
