  - {id: t8, hidden: true, args: ["6060", 0], expected: ["6*0*6*0", "6*0*6+0", "6*0*6-0", "6*0*60", "6*0+6*0", "6*0-6*0", "6+0-6+0", "6+0-6-0", "6-0-6+0", "6-0-6-0", "60*6*0", "60-60", "606*0"], description: "Many zero-valued formulas - ordering of '*', '+' and '-'"}
  - {id: t9, hidden: true, args: ["9999999999", 9999800001], expected: ["99999*99999"], description: "Product of two five-digit numbers above 32 bits"}
  - {id: t10, hidden: true, args: ["9999999999", 9999999999], expected: ["9999999999"], description: "Whole string as one ten-digit number"}
  - {id: t11, hidden: true, args: ["1234567890", 2026], expected: ["1+2*34*5*6-7-8+9*0", "1+2*34*5*6-7-8-9*0", "1+2+345*6-7*8+9+0", "1+2+345*6-7*8+9-0", "12*34*5-6-7+8-9+0", "12*34*5-6-7+8-9-0", "12+345*6-7*8+9*0", "12+345*6-7*8-9*0", "1234+5+67+8*90"], description: "Ten digits - full search of 4^9 formulas"}
expected_concepts:
  - backtracking over the gap choices (plus, minus, times or concatenate)
  - tracking the running value and the last product term to honour precedence without re-parsing
  - leading-zero rule for multi-digit operands
  - 64-bit arithmetic for long operands and products
  - sorting the results into ASCII order
optimal_complexity: {time: "O(4^n * n) for n digits", space: "O(n) recursion depth plus the output"}
rubric:
  excellent: Builds formulas recursively while carrying the running total and the last multiplicative term so that '*' is applied in constant time, enforces the leading-zero rule, uses 64-bit values, sorts the output and explains the 4^(n-1) bound.
  good: Correct solution that enumerates all formulas and evaluates them with a small precedence-aware evaluator; passes the tests but does more work per formula.
  weak: Evaluates strictly left to right ignoring precedence, allows operands such as 05, forgets to sort, or overflows on ten-digit operands.
  criteria:
    correctness: All tests pass, including zeros, negative targets, single digits and ten-digit operands.
    efficiency: One pass per formula with O(1) value updates; no repeated full re-evaluation of long strings if avoidable.
    code_quality: Clear recursive helper with named state (position, expression, total, last term).
    edge_cases: Leading zeros, single digit input, targets that no formula reaches and values beyond 32 bits.
    communication: Explains how multiplication undoes and redoes the last term to respect precedence.
hints:
  - Every gap between two digits has four choices, so at most 4^9 formulas exist; think about building them left to right and checking the value when the digits run out.
  - To respect precedence without re-parsing, carry two numbers while you build - the value so far and the last term that a following multiplication would extend. Also decide at each position how many digits the next number takes, stopping when it would start with a zero.
  - Recurse on the position, the formula text, the running total and the last term. For each next number taken from the current position (a single zero is allowed, but never longer numbers starting with zero), add it, subtract it (the last term becomes its negative), or multiply by it by removing the last term from the total and adding back the last term times the number. Record the text when the position reaches the end with a total equal to the target, then sort the results.
followups:
  - How would you add division with integer truncation, and which edge cases would it introduce?
  - How would you only count the formulas instead of listing them, and can you avoid generating each one?
  - What if parentheses were also allowed?
  - How would you deduplicate if the digit string could produce identical formulas?
common_errors:
  - Ignoring precedence and evaluating every operator left to right.
  - Allowing multi-digit numbers that start with zero, or rejecting a single zero.
  - Placing an operator before the first number or forgetting the concatenate option.
  - Overflowing 32-bit integers on long operands or products.
  - Returning the formulas unsorted.
