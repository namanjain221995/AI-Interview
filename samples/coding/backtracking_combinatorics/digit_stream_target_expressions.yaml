version: 1
slug: digit_stream_target_expressions
title: Digit Stream Target Expressions
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Digit Stream Target Expressions

  An alerting tool lets operators build threshold formulas from a fixed string of digits read off a
  sensor panel. Between every pair of adjacent digits the builder places either `+`, `-`, `*` or
  **nothing** (nothing glues the digits into one multi-digit number). The digits themselves keep their
  order and none may be dropped.

  Rules for a valid formula:

  - A number made of two or more digits may **not** start with `0` (`"0"` on its own is fine, `"05"` is not).
  - There is no unary minus; the formula starts with a number.
  - Normal precedence applies: `*` is evaluated before `+` and `-`, which are evaluated left to right.

  Given `digits` and an integer `target`, return **every** valid formula whose value equals `target`,
  written without spaces and sorted in **ascending ASCII order** (so `*` < `+` < `-` < `0` < ... < `9`).
  Return an empty list if no formula reaches the target.

  ### Example 1
  ```
  Input:  digits = "1234", target = 10
  Output: ["1*2*3+4", "1+2+3+4"]
  ```

  ### Example 2
  ```
  Input:  digits = "2005", target = 5
  Output: ["2*0*0+5", "2*0+0+5", "2*0-0+5", "20*0+5"]
  Explanation: "2*005" is not allowed because 005 has a leading zero.
  ```

  ### Example 3
  ```
  Input:  digits = "528", target = 13
  Output: []
  ```

  ### Constraints
  - `1 <= digits.length <= 10`
  - `digits` contains only the characters `0`-`9`.
  - `-2^31 <= target <= 2^31 - 1`
  - Intermediate values can exceed the 32-bit range (for example `9999999999`); use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: digit_stream_target_expressions
  params:
    - {name: digits, type: string}
    - {name: target, type: long}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def digit_stream_target_expressions(digits: str, target: int) -> list[str]:
        found: list[str] = []
        n = len(digits)

        def extend(pos: int, text: str, total: int, last: int) -> None:
            # total = value of text; last = the trailing product term, which a following
            # '*' must replace by last * next.
            if pos == n:
                if total == target:
                    found.append(text)
                return
            for end in range(pos + 1, n + 1):
                if end > pos + 1 and digits[pos] == "0":
                    break  # no multi-digit number with a leading zero
                chunk = digits[pos:end]
                value = int(chunk)
                if pos == 0:
                    extend(end, chunk, value, value)
                    continue
                extend(end, text + "+" + chunk, total + value, value)
                extend(end, text + "-" + chunk, total - value, -value)
                extend(end, text + "*" + chunk, total - last + last * value, last * value)

        extend(0, "", 0, 0)
        return sorted(found)
  javascript: |
    function digitStreamTargetExpressions(digits, target) {
      const found = [];
      const n = digits.length;

      function extend(pos, text, total, last) {
        if (pos === n) {
          if (total === target) found.push(text);
          return;
        }
        for (let end = pos + 1; end <= n; end++) {
          if (end > pos + 1 && digits[pos] === "0") break;
          const chunk = digits.slice(pos, end);
          const value = Number(chunk);
          if (pos === 0) {
            extend(end, chunk, value, value);
            continue;
          }
          extend(end, text + "+" + chunk, total + value, value);
          extend(end, text + "-" + chunk, total - value, -value);
          extend(end, text + "*" + chunk, total - last + last * value, last * value);
        }
      }

      extend(0, "", 0, 0);
      return found.sort();
    }
