version: 1
slug: distinct_sku_bundles
title: Distinct SKU Bundles
difficulty: medium
competency_keys: [algorithms, problem_solving, data_structures]
role_tags: [backend, fullstack, data, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Distinct SKU Bundles

  A packing station receives a shopping cart as a list of SKU codes. The same SKU can appear several
  times because the customer ordered several units of it. For a split-shipment feature the station needs
  to know every **bundle** it could ship first: a bundle is any selection of units from the cart, from
  nothing at all up to the whole cart.

  Two bundles are the **same** when they contain the same number of units of every SKU. It does not
  matter which physical unit of a repeated SKU was picked, so picking "the first `MS`" or "the second
  `MS`" gives the same bundle.

  Return every distinct bundle **exactly once**, including the empty bundle `[]`. Each bundle is a list
  of SKU codes in which a SKU appears once per unit it contains.

  - The bundles may be returned in **any order**.
  - The SKU codes inside a bundle may also be in any order.

  ### Example 1
  ```
  Input:  skus = ["KB", "MS", "MS"]
  Output: [[], ["KB"], ["KB", "MS"], ["KB", "MS", "MS"], ["MS"], ["MS", "MS"]]
  Explanation: Picking either MS unit alone gives the same bundle, so ["MS"] appears once.
  ```

  ### Example 2
  ```
  Input:  skus = ["PAD"]
  Output: [[], ["PAD"]]
  ```

  ### Constraints
  - `0 <= skus.length <= 10`
  - `1 <= skus[i].length <= 8`
  - SKU codes contain only uppercase letters and digits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: distinct_sku_bundles
  params:
    - {name: skus, type: "string[]"}
  return_type: "string[][]"
  comparison: unordered
reference_solutions:
  python: |
    def distinct_sku_bundles(skus: list[str]) -> list[list[str]]:
        items = sorted(skus)  # equal SKUs become neighbours
        bundles: list[list[str]] = []
        current: list[str] = []

        def extend(start: int) -> None:
            bundles.append(list(current))
            for i in range(start, len(items)):
                # At one decision level, only the first copy of a SKU may start a branch.
                if i > start and items[i] == items[i - 1]:
                    continue
                current.append(items[i])
                extend(i + 1)
                current.pop()

        extend(0)
        return bundles
  javascript: |
    function distinctSkuBundles(skus) {
      const items = [...skus].sort();
      const bundles = [];
      const current = [];
      const extend = (start) => {
        bundles.push([...current]);
        for (let i = start; i < items.length; i++) {
          if (i > start && items[i] === items[i - 1]) continue;
          current.push(items[i]);
          extend(i + 1);
          current.pop();
        }
      };
      extend(0);
      return bundles;
    }
