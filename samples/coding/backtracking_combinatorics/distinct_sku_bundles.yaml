expected_concepts:
  - "backtracking over include/skip decisions"
  - "sorting (or counting) so equal SKUs are grouped"
  - "skipping repeated values at the same recursion level to avoid duplicate bundles"
  - "alternative: choose 0..count units per distinct SKU from a frequency map"
  - "output size bounds the running time"
optimal_complexity: {time: "O(n * 2^n)", space: "O(n) besides the output"}
rubric:
  excellent: "Groups equal SKUs (sorting or a frequency map), generates each distinct bundle exactly once without a set of seen bundles, includes the empty bundle and explains why the running time is bounded by the number and size of bundles."
  good: "Correct output using backtracking, possibly by generating all subsets of a sorted cart and removing duplicates with a set of tuples, with a reasonable complexity estimate."
  weak: "Returns duplicate bundles, omits the empty bundle, or treats copies of the same SKU as different items."
  criteria:
    correctness: "Every distinct bundle appears exactly once, including the empty one, for carts with and without repeated SKUs."
    efficiency: "Avoids producing duplicates and then filtering them; work is proportional to the bundles produced."
    code_quality: "Clear recursive helper with an explicit current bundle that is copied when recorded and restored after each branch."
    edge_cases: "Empty cart, a cart of a single repeated SKU and duplicates that are not adjacent in the input."
    communication: "Explains why only the first copy of a SKU may start a branch at a given level."
hints:
  - "Think of each distinct SKU separately: for a SKU that appears k times, a bundle can contain anywhere from zero to k units of it."
  - "If you generate subsets position by position, copies of the same SKU create identical branches. Bringing equal SKUs next to each other lets you notice and skip those repeats."
  - "Sort the cart, then backtrack with a start index: record the current bundle on entry, and when looping over the remaining positions skip any SKU equal to the previous one at the same level, because a branch starting with that SKU has already been explored."
followups:
  - "How would you return only bundles with exactly k units?"
  - "How many bundles are there in terms of the count of each distinct SKU?"
  - "How would you produce the bundles lazily (as a generator) to avoid holding them all in memory?"
  - "If the cart had thousands of units of only a few SKUs, which representation would you switch to?"
common_errors:
  - "Forgetting the empty bundle."
  - "Skipping duplicates without first sorting or counting, so non-adjacent copies still create duplicate bundles."
  - "Skipping every repeated SKU instead of only repeats at the same recursion level, which loses bundles such as two units of the same SKU."
  - "Appending the shared current list instead of a copy, so every recorded bundle ends up empty."
