expected_concepts:
- cartesian product built by backtracking or iterative extension
- deduplicating and sorting each slot's options first
- sorted options per slot give sorted output for equal-length labels
- output size is the product of distinct options per slot
optimal_complexity:
  time: O(m * P) where P is the number of labels and m the number of slots
  space: O(m) auxiliary beyond the output
rubric:
  excellent: Deduplicates and sorts each slot's characters up front, generates the product in slot order so the labels come out sorted without a final sort, and explains the output-size-bound complexity.
  good: Correct product with duplicates removed through a set and a final sort, or needs a hint about duplicate characters.
  weak: Produces duplicate labels, returns labels unsorted, or only handles a fixed number of slots with nested loops.
  criteria:
    correctness: All distinct labels, sorted by character code, with no duplicates.
    efficiency: Never generates the same label twice; work proportional to the output.
    code_quality: Clear separation between preparing options and generating labels.
    edge_cases: Single slot, repeated characters within a slot and digits mixed with letters.
    communication: Explains why sorted options per slot already produce sorted labels.
hints:
- 'Think of building a label left to right: for each slot you choose one of its allowed characters, independently of the other slots.'
- Duplicates only come from a slot listing the same character twice, and the ordering of the result depends on the order you try characters; prepare each slot's characters before generating anything.
- Turn each slot into its distinct characters in ascending order, then use a recursive helper that picks a character for the current slot, moves on to the next slot, and records the label when all slots are filled; because all labels have the same length, trying characters in ascending order produces the labels already sorted.
followups:
- How would you compute only the number of labels, and when could that overflow a 32-bit integer?
- How would you return the k-th label in sorted order without generating the others?
- If certain neighbouring character pairs were forbidden, where would you prune?
- How would the approach change if labels could have different lengths?
common_errors:
- Not removing repeated characters, so the same label appears several times.
- Trying characters in the order given and forgetting to sort.
- Hard-coding nested loops for a fixed number of slots.
- Mixing up the order of slots when building the label.
