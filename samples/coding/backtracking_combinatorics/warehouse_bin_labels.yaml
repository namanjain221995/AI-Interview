time_limit_minutes: 15
prompt_markdown: |
  ## Warehouse Bin Labels

  A warehouse prints a label for every storage bin. A label has one character per **slot**, and
  `slots[i]` lists the characters that are allowed in slot `i` (for example the aisle letter, the shelf
  digit, and so on). Before printing, the inventory system wants the list of all labels that the scheme
  can produce.

  Return every **distinct** label that can be formed by picking one allowed character for each slot, in
  slot order.

  - A slot may list the same character more than once; repeats add nothing and must not produce
    duplicate labels.
  - Return the labels sorted in **ascending character-code order** (digits come before uppercase
    letters, so `"9A"` comes before `"A0"`).

  ### Example 1
  ```
  Input:  slots = ["BA", "12"]
  Output: ["A1", "A2", "B1", "B2"]
  Explanation: Slot 0 allows A or B, slot 1 allows 1 or 2; the four labels are returned sorted.
  ```

  ### Example 2
  ```
  Input:  slots = ["AA", "7", "XX"]
  Output: ["A7X"]
  Explanation: Every slot has only one distinct character, so only one label exists.
  ```

  ### Constraints
  - `1 <= slots.length <= 6`
  - `1 <= slots[i].length <= 6`
  - `slots[i]` contains only uppercase letters `A`-`Z` and digits `0`-`9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: warehouse_bin_labels
  params:
    - {name: slots, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def warehouse_bin_labels(slots: list[str]) -> list[str]:
        options = [sorted(set(slot)) for slot in slots]
        labels: list[str] = []
        current: list[str] = []

        def build(i: int) -> None:
            if i == len(options):
                labels.append("".join(current))
                return
            for ch in options[i]:
                current.append(ch)
                build(i + 1)
                current.pop()

        build(0)
        return labels
  javascript: |
    function warehouseBinLabels(slots) {
      const options = slots.map((slot) => [...new Set(slot)].sort());
      const labels = [];
      const current = [];
      function build(i) {
        if (i === options.length) {
          labels.push(current.join(""));
          return;
        }
        for (const ch of options[i]) {
          current.push(ch);
          build(i + 1);
          current.pop();
        }
      }
      build(0);
      return labels;
    }
