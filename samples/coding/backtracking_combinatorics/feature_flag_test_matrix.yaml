expected_concepts:
- include/exclude decision per flag (power set)
- backtracking with a shared path and undo step
- start index to avoid emitting the same subset twice
- bitmask enumeration as an alternative
- output size 2^n drives the complexity
optimal_complexity:
  time: O(n * 2^n)
  space: O(n) auxiliary beyond the output
rubric:
  excellent: Derives the include/exclude (or bitmask) enumeration quickly, avoids duplicates by construction, copies the path when recording it, includes the empty configuration and explains that O(n * 2^n) is unavoidable because of the output size.
  good: Correct backtracking or iterative doubling solution after small fixes, such as forgetting to copy the current list or initially missing the empty configuration.
  weak: Produces duplicate configurations, misses the empty or the full configuration, or cannot generalise beyond hard-coded nested loops.
  criteria:
    correctness: Every one of the 2^n configurations appears exactly once, including the all-off one.
    efficiency: Each configuration is built once; no generate-then-deduplicate pass over permutations.
    code_quality: Small recursive helper or clear loop, with the path copied when stored.
    edge_cases: Empty flag list, a single flag and unsorted names.
    communication: Explains why the start index prevents the same set from being produced in two orders.
hints:
- 'Look at each flag on its own: in any configuration it is either on or off, and those choices are independent.'
- Build configurations one flag at a time, branching into a path where the flag is added and a path where it is skipped; record the configuration when every flag has been decided.
- Use a recursive helper that takes a starting position, records a copy of the current list on entry, then for each later flag adds it, recurses from the next position and removes it again; the starting position guarantees each set is produced in only one order.
followups:
- How would you produce the configurations with a bitmask counter instead of recursion?
- How would you return only the configurations with exactly k flags switched on?
- If some pairs of flags must never be on together, how would you prune the search?
- With 30 flags the full matrix is over a billion runs; what test-design technique (such as pairwise coverage) would you propose instead?
common_errors:
- Appending the shared current list instead of a copy, so every recorded configuration ends up empty.
- Forgetting the all-off configuration.
- Looping from index 0 in every call, which emits the same set in several orders.
- Returning only the configurations of a single size.
