version: 1
slug: feature_flag_test_matrix
title: Feature Flag Test Matrix
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [qa, frontend, fullstack, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Feature Flag Test Matrix

  A release ships behind a handful of feature flags, and QA wants one test configuration for every
  possible on/off combination of those flags. A configuration is described by the list of flags that are
  switched **on**; every flag not in the list is off.

  Given the release's flag names, return **every** configuration exactly once, including the one where
  all flags are off (an empty list).

  - The flag names are distinct.
  - Configurations may be returned in **any order**, and the flag names inside a configuration may also
    be in any order.
  - No configuration may appear twice (for example `["a", "b"]` and `["b", "a"]` are the same
    configuration).

  ### Example 1
  ```
  Input:  flags = ["dark_mode", "new_checkout"]
  Output: [[], ["dark_mode"], ["dark_mode", "new_checkout"], ["new_checkout"]]
  Explanation: All flags off, each flag on by itself, and both flags on.
  ```

  ### Example 2
  ```
  Input:  flags = []
  Output: [[]]
  Explanation: With no flags there is exactly one configuration: everything off.
  ```

  ### Constraints
  - `0 <= flags.length <= 10`
  - `1 <= flags[i].length <= 20`; names use lowercase letters, digits, `_` and `-`
  - All flag names are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: feature_flag_test_matrix
  params:
    - {name: flags, type: "string[]"}
  return_type: "string[][]"
  comparison: unordered
reference_solutions:
  python: |
    def feature_flag_test_matrix(flags: list[str]) -> list[list[str]]:
        configs: list[list[str]] = []
        current: list[str] = []

        def build(start: int) -> None:
            configs.append(list(current))
            for i in range(start, len(flags)):
                current.append(flags[i])
                build(i + 1)
                current.pop()

        build(0)
        return configs
  javascript: |
    function featureFlagTestMatrix(flags) {
      const configs = [];
      const current = [];
      function build(start) {
        configs.push([...current]);
        for (let i = start; i < flags.length; i++) {
          current.push(flags[i]);
          build(i + 1);
          current.pop();
        }
      }
      build(0);
      return configs;
    }
