title: Rack Power Patterns
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, platform, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Rack Power Patterns

  A small data-centre row has `n` server racks side by side. The cooling in this row is weak: if two
  **adjacent** racks are powered on at the same time, they overheat. Any rack may be off, and two racks
  that are not neighbours may both be on.

  A power pattern is a string of length `n` where character `i` is `'1'` if rack `i` is on and `'0'` if
  it is off. Return **every** pattern with no two adjacent `'1'` characters, sorted in ascending
  lexicographic order (`'0'` sorts before `'1'`). The all-off pattern is always included.

  ### Example 1
  ```
  Input:  n = 3
  Output: ["000", "001", "010", "100", "101"]
  Explanation: 011, 110 and 111 are missing because they power two neighbours.
  ```

  ### Example 2
  ```
  Input:  n = 1
  Output: ["0", "1"]
  ```

  ### Constraints
  - `1 <= n <= 12`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rack_power_patterns
  params:
    - {name: n, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def rack_power_patterns(n: int) -> list[str]:
        patterns: list[str] = []
        current: list[str] = []

        def build() -> None:
            if len(current) == n:
                patterns.append("".join(current))
                return
            current.append("0")
            build()
            current.pop()
            if not current or current[-1] == "0":
                current.append("1")
                build()
                current.pop()

        build()
        return patterns
  javascript: |
    function rackPowerPatterns(n) {
      const patterns = [];
      const current = [];
      function build() {
        if (current.length === n) {
          patterns.push(current.join(""));
          return;
        }
        current.push("0");
        build();
        current.pop();
        if (current.length === 0 || current[current.length - 1] === "0") {
          current.push("1");
          build();
          current.pop();
        }
      }
      build();
      return patterns;
    }
