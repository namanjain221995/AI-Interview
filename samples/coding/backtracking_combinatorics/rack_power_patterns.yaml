expected_concepts:
- backtracking with a constraint on the previous choice
- trying '0' before '1' to produce lexicographic output directly
- pruning instead of generating all 2^n strings and filtering
- Fibonacci growth of the number of valid patterns
optimal_complexity:
  time: O(n * F(n + 2)) where F is the Fibonacci sequence
  space: O(n) auxiliary beyond the output
rubric:
  excellent: Builds patterns left to right, only placing '1' after a '0' or at the start, tries '0' first so output is sorted, and recognises that the count follows the Fibonacci sequence.
  good: Enumerates all 2^n strings and filters, then sorts, with a correct explanation of why that is acceptable for n <= 12.
  weak: Misses the all-off pattern, allows adjacent ones, or returns unsorted output.
  criteria:
    correctness: Exactly the patterns without adjacent ones, in ascending order.
    efficiency: Prunes invalid prefixes rather than building all 2^n strings.
    code_quality: Simple recursive helper with an explicit previous-character check.
    edge_cases: n = 1 and n = 2.
    communication: Explains the choice order that guarantees sorted output and the Fibonacci count.
hints:
- Build the pattern from the first rack to the last; the only thing that limits your choice for a rack is the rack just before it.
- Every rack may always be off; it may be on only if the previous rack is off or there is no previous rack, so cut off any prefix that would break the rule instead of filtering at the end.
- 'Use a recursive helper that extends the current prefix: first append ''0'' and recurse, then, only if the prefix is empty or ends in ''0'', append ''1'' and recurse; trying ''0'' before ''1'' at each position makes the full-length patterns appear in ascending order, and each finished prefix of length n is recorded.'
followups:
- How many patterns are there for n racks, and how would you compute the count in O(n) without listing them?
- If each rack also had a power draw and the row had a power cap, how would you prune?
- How would the problem change if the racks were arranged in a ring, so the first and last racks are neighbours?
- How would you return only the patterns with the maximum number of racks switched on?
common_errors:
- Checking the next rack instead of the previous one and allowing '11' at the end.
- Trying '1' before '0', which produces descending order.
- Forgetting the all-off pattern or the single-rack case.
- Generating all 2^n strings without sorting the filtered result.
