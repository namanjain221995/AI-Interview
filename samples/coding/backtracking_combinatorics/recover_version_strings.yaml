version: 1
slug: recover_version_strings
title: Recover Version Strings
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [devops, backend, platform, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Recover Version Strings

  A release log was exported through a tool that stripped every dot, so a version such as `10.4.7` now
  reads `1047`. The release team wants to know which versions a damaged entry could have been.

  A version has the form `MAJOR.MINOR.PATCH` with exactly **three** parts. Each part must be:

  - a decimal integer from `0` to `999`, and
  - written **without leading zeros**: `"0"` on its own is allowed, but `"00"`, `"07"` or `"010"` are not.

  Given the digit string `digits`, return every version obtainable by inserting exactly two dots into it
  (without reordering, adding or removing digits) such that all three parts are valid.

  Return the versions sorted in ascending **ASCII order** (plain string comparison, where `.` sorts
  before any digit). Return an empty list if no valid version exists.

  ### Example 1
  ```
  Input:  digits = "1102"
  Output: ["1.10.2", "11.0.2"]
  Explanation: 1.1.02 is rejected because "02" has a leading zero; "." sorts before "0", so "1.10.2" comes first.
  ```

  ### Example 2
  ```
  Input:  digits = "000"
  Output: ["0.0.0"]
  ```

  ### Example 3
  ```
  Input:  digits = "1234567890"
  Output: []
  ```

  ### Constraints
  - `1 <= digits.length <= 12`
  - `digits` contains only the characters `0`-`9`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: recover_version_strings
  params:
    - {name: digits, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def recover_version_strings(digits: str) -> list[str]:
        def valid(part: str) -> bool:
            if not 1 <= len(part) <= 3:
                return False
            return part == "0" or part[0] != "0"

        n = len(digits)
        versions: list[str] = []
        for i in range(1, min(3, n - 2) + 1):  # end of MAJOR
            for j in range(i + 1, min(i + 3, n - 1) + 1):  # end of MINOR
                parts = (digits[:i], digits[i:j], digits[j:])
                if all(valid(p) for p in parts):
                    versions.append(".".join(parts))
        return sorted(versions)
  javascript: |
    function recoverVersionStrings(digits) {
      const valid = (part) => part.length >= 1 && part.length <= 3 && (part === "0" || part[0] !== "0");
      const n = digits.length;
      const versions = [];
      for (let i = 1; i <= Math.min(3, n - 2); i++) {
        for (let j = i + 1; j <= Math.min(i + 3, n - 1); j++) {
          const parts = [digits.slice(0, i), digits.slice(i, j), digits.slice(j)];
          if (parts.every(valid)) versions.push(parts.join("."));
        }
      }
      return versions.sort();
    }
tests:
  - {id: t1, args: ["1102"], expected: ["1.10.2", "11.0.2"], description: "Example 1 - leading zero excludes 1.1.02; checks ASCII order"}
  - {id: t2, args: ["000"], expected: ["0.0.0"], description: "Example 2 - every part is a lone zero"}
  - {id: t3, args: ["1234567890"], expected: [], description: "Example 3 - ten digits cannot fit into three parts of at most three digits"}
  - {id: t4, hidden: true, args: ["7"], expected: [], description: "Single digit: too short for three parts"}
  - {id: t5, hidden: true, args: ["12"], expected: [], description: "Two digits: still too short"}
  - {id: t6, hidden: true, args: ["999999999"], expected: ["999.999.999"], description: "Nine digits: exactly one split with all parts at the maximum 999"}
  - {id: t7, hidden: true, args: ["1000"], expected: ["10.0.0"], description: "Zeros can only stand alone: only 10.0.0 is valid"}
  - {id: t8, hidden: true, args: ["0000"], expected: [], description: "Four zeros: every split creates a part with a leading zero"}
  - {id: t9, hidden: true, args: ["10010"], expected: ["10.0.10", "100.1.0"], description: "Mix of trailing and inner zeros"}
  - {id: t10, hidden: true, args: ["111111"], expected: ["1.11.111", "1.111.11", "11.1.111", "11.11.11", "11.111.1", "111.1.11", "111.11.1"], description: "Many valid splits that need correct ASCII ordering"}
  - {id: t11, hidden: true, args: ["2024110"], expected: ["20.24.110", "20.241.10", "202.4.110", "202.41.10", "202.411.0"], description: "Date-like digits with several splits and leading-zero traps"}
  - {id: t12, hidden: true, args: ["100100100100"], expected: [], description: "Maximum length 12: no valid version"}
expected_concepts:
  - "enumerating the two dot positions (backtracking over parts or two nested loops)"
  - "validating each part: length 1 to 3, value at most 999, no leading zero unless exactly 0"
  - "early rejection of inputs longer than 9 or shorter than 3 digits"
  - "sorting the results by plain string comparison"
  - "constant bound on the number of candidates"
optimal_complexity: {time: "O(1) (at most 27 candidate splits for valid lengths)", space: "O(1) besides the output"}
rubric:
  excellent: "Enumerates only feasible dot positions, validates parts with a small well-named helper (including the lone-zero rule), returns the ASCII-sorted list and explains why the work is bounded by a constant."
  good: "Correct backtracking or nested-loop solution with a validation helper; may enumerate some impossible splits before rejecting them."
  weak: "Allows leading zeros or parts above 999, produces versions with the wrong number of parts, or returns an unsorted list."
  criteria:
    correctness: "All tests pass, including lone zeros, leading-zero traps and inputs that are too short or too long."
    efficiency: "Bounds part lengths to three digits instead of trying every pair of positions without limits."
    code_quality: "Part validation is isolated in a helper and loop bounds are readable."
    edge_cases: "Inputs of length 1, 2, 3, 9 and more than 9, and strings made of zeros."
    communication: "States the validity rules before coding and checks them against an example such as 1102."
hints:
  - "A version has only three parts and each part has between one and three digits, so there are very few places the two dots can go."
  - "Try every position for the first dot and every position for the second dot, cut the string into three parts and keep the split only if every part is valid. Write the part check as its own small function."
  - "A part is valid when it has one to three digits, is at most 999 (automatic for three digits) and either equals the single character zero or does not start with a zero. Limit each part to three digits when choosing dot positions, collect the joined versions and sort them as plain strings before returning."
followups:
  - "How would you generalise this to versions with a variable number of parts (for example 2 to 4)?"
  - "How would you rank candidates if the log also contained the previous release number?"
  - "Why does the dot sort before any digit, and how does that affect the output order?"
  - "What if parts could go up to 9999?"
common_errors:
  - "Rejecting a part that is exactly zero, or accepting parts such as 07."
  - "Forgetting that every part must be non-empty, so dots end up adjacent or at the ends."
  - "Not sorting the result, or sorting numerically by part instead of as plain strings."
  - "Index errors on very short inputs instead of returning an empty list."
