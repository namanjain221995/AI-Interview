version: 1
slug: count_bundles_within_budget
title: Add-on Bundles Within Budget
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, product_manager, data_analyst, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Add-on Bundles Within Budget

  A pricing page lets customers add any combination of optional add-ons to their plan. The product team
  wants to know how many different add-on bundles a customer with a given monthly budget could afford.

  Given the monthly cost of each add-on and the `budget`, return the number of **subsets** of add-ons
  whose total cost is **at most** `budget`.

  - The empty bundle (no add-ons, total cost 0) always counts.
  - Add-ons are distinct by position: two add-ons with the same cost are different products, so
    choosing one or the other gives two different bundles.
  - Each add-on can be chosen at most once.

  ### Example 1
  ```
  Input:  costs = [5, 3, 8], budget = 10
  Output: 5
  Explanation: {}, {5}, {3}, {8} and {5, 3} fit; {5, 8} costs 13 and {3, 8} costs 11.
  ```

  ### Example 2
  ```
  Input:  costs = [4, 4], budget = 4
  Output: 3
  Explanation: {}, {first 4} and {second 4} fit; {4, 4} costs 8.
  ```

  ### Constraints
  - `0 <= costs.length <= 18`
  - `1 <= costs[i] <= 10^6`
  - `0 <= budget <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_bundles_within_budget
  params:
    - {name: costs, type: "int[]"}
    - {name: budget, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_bundles_within_budget(costs: list[int], budget: int) -> int:
        prices = sorted(costs)

        def count(start: int, remaining: int) -> int:
            # Bundles built from prices[start:] that fit in `remaining`, including adding nothing.
            total = 1
            for i in range(start, len(prices)):
                if prices[i] > remaining:
                    break  # sorted, so every later add-on is too expensive as well
                total += count(i + 1, remaining - prices[i])
            return total

        return count(0, budget)
  javascript: |
    function countBundlesWithinBudget(costs, budget) {
      const prices = [...costs].sort((a, b) => a - b);
      function count(start, remaining) {
        let total = 1;
        for (let i = start; i < prices.length; i++) {
          if (prices[i] > remaining) break;
          total += count(i + 1, remaining - prices[i]);
        }
        return total;
      }
      return count(0, budget);
    }
tests:
  - {id: t1, args: [[5, 3, 8], 10], expected: 5, description: "Example 1 - basic budget check"}
  - {id: t2, args: [[4, 4], 4], expected: 3, description: "Example 2 - equal costs are different add-ons"}
  - {id: t3, hidden: true, args: [[], 0], expected: 1, description: "No add-ons, zero budget - only the empty bundle"}
  - {id: t4, hidden: true, args: [[1, 2, 3], 0], expected: 1, description: "Zero budget - only the empty bundle"}
  - {id: t5, hidden: true, args: [[7], 7], expected: 2, description: "Single add-on exactly at budget - inclusive comparison"}
  - {id: t6, hidden: true, args: [[1000000, 1000000, 1000000], 1000000000], expected: 8, description: "Budget above total - all 2^3 bundles count"}
  - {id: t7, hidden: true, args: [[2, 2, 2, 2, 2], 6], expected: 26, description: "Many duplicates - counts by position, C(5,0..3) = 26"}
  - {id: t8, hidden: true, args: [[9, 1, 8, 2, 7, 3], 10], expected: 18, description: "Unsorted mixed costs"}
  - {id: t9, hidden: true, args: [[1000000, 1, 999999, 500000, 500000, 2], 1000001], expected: 19, description: "Large costs near the 10^6 limit with ties"}
  - {id: t10, hidden: true, args: [[3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8, 9, 7, 9, 3, 2, 3], 45], expected: 157350, description: "Stress - 18 add-ons with budget near half the total"}
expected_concepts:
- include/exclude enumeration of subsets
- carrying the running total instead of re-summing each subset
- pruning once the remaining budget is exceeded (sorted costs)
- counting duplicates by position, not by value
- meet-in-the-middle as a follow-up for larger n
optimal_complexity:
  time: O(2^n) worst case
  space: O(n) recursion depth
rubric:
  excellent: Enumerates subsets with a running total, prunes as soon as the budget is exceeded (sorting first so the whole tail can be skipped), counts the empty bundle and equal-cost add-ons correctly, and can discuss meet-in-the-middle for larger inputs.
  good: Correct include/exclude recursion or bitmask loop without pruning, with the right O(2^n) analysis.
  weak: Deduplicates bundles by cost values, forgets the empty bundle, uses strict comparison with the budget, or attempts a greedy approach that cannot count.
  criteria:
    correctness: Counts every position-distinct subset with total at most budget, including the empty one.
    efficiency: Running sum per branch (no O(n) re-summing per subset); pruning when over budget.
    code_quality: Small recursive helper with clear parameters for position and remaining budget.
    edge_cases: Empty list, zero budget, a cost exactly equal to the budget and repeated costs.
    communication: Explains why sorting enables cutting off the remaining add-ons at once.
hints:
- With at most 18 add-ons there are at most about a quarter of a million bundles, so looking at every bundle is affordable.
- Decide add-on by add-on whether it is in the bundle, carrying the money left in the budget along so you never re-add a bundle's total from scratch, and stop a branch as soon as the money left goes negative.
- Sort the costs, then write a helper that, given a starting position and the remaining budget, counts one for stopping here and adds the result of choosing each later add-on in turn; once an add-on costs more than the remaining budget, every later one does too, so the loop can stop.
followups:
- How would you handle 40 add-ons, where 2^40 bundles is too many to enumerate?
- If costs were small integers (say at most 100), how could dynamic programming over the total count bundles?
- How would you list the affordable bundles with the highest total instead of counting them?
- What changes if two add-ons with the same name and cost should count as one product?
common_errors:
- Not counting the empty bundle.
- Using a strict comparison so bundles that cost exactly the budget are missed.
- Treating equal costs as the same add-on and undercounting.
- Recomputing each subset's total with an inner loop, making the solution much slower than needed.
