expected_concepts:
  - "backtracking over all topological orders"
  - "in-degree counts updated and restored on each choice"
  - "trying available names in sorted order yields lexicographic output"
  - "cycle detection (no complete order exists)"
  - "output-sensitive complexity"
optimal_complexity: {time: "O(R * n^2) for R valid orders", space: "O(n + d) plus the output"}
rubric:
  excellent: "Builds the dependency graph with in-degree counts, backtracks by choosing any currently unblocked migration in sorted order and restoring counts on the way back, explains why this produces sorted output without a final sort, notes that a cycle simply yields no complete order, and states an output-sensitive complexity."
  good: "Generates all valid orders correctly (for example by filtering permutations or backtracking without sorted choice followed by a sort), handles cycles, with minor prompting on ordering or complexity."
  weak: "Returns a single topological order, misses orders, forgets to undo in-degree changes, or loops forever or crashes on a cycle."
  criteria:
    correctness: "Every valid order appears exactly once, sorted lexicographically; cycles give an empty list."
    efficiency: "Prunes at every step by only placing unblocked migrations instead of testing all n! permutations."
    code_quality: "Clear choose / recurse / undo structure with symmetric updates to the in-degree counts."
    edge_cases: "Single migration, repeated dependencies, partial cycles and names that sort differently as strings than as numbers."
    communication: "Explains how the recursion relates to Kahn's algorithm and why output size dominates the running time."
hints:
  - "A single valid order can be produced by repeatedly running some migration that is no longer waiting on anything. What changes if you explore every such choice instead of just one?"
  - "Keep, for each migration, the number of dependencies that still block it. At each step try every unblocked, unplaced migration, place it, unblock what depends on it, explore further, and then undo those changes."
  - "Sort the names first and always try candidates in that sorted order; then complete orders are discovered already in lexicographic order. Record an order when every migration is placed. If a cycle exists, the search can never place every migration, so the result stays empty without any special case."
followups:
  - "How would you count the valid orders without listing them, for up to 20 migrations?"
  - "How would you return only the first k orders in lexicographic order efficiently?"
  - "How would you report which migrations form the cycle when there is one?"
common_errors:
  - "Returning one topological order instead of all of them."
  - "Forgetting to restore in-degree counts after backtracking, which loses later orders."
  - "Counting a repeated dependency once when adding and twice when removing (or the reverse)."
  - "Sorting names numerically or by input position instead of as strings."
  - "Generating all n! permutations and checking each, without discussing pruning."
