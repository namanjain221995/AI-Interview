version: 1
slug: all_migration_orders
title: "All Valid Migration Orders"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, dba, platform, general]
time_limit_minutes: 25
prompt_markdown: |
  ## All Valid Migration Orders

  Before a risky release, the database team wants to rehearse **every** order in which a set of schema
  migrations could legally run, so that each order can be tested against a staging copy.

  You are given the distinct migration names in `migrations` and a list of `dependencies`. Each
  dependency is a pair `[before, after]` meaning migration `before` must run at some point earlier than
  migration `after` (not necessarily immediately before it).

  Write `all_migration_orders(migrations, dependencies)` that returns every ordering of **all** the
  migrations that respects every dependency:

  - Each ordering is a list containing every migration name exactly once.
  - Return the orderings sorted lexicographically: compare two orderings element by element and order
    them by the first position where they differ, comparing names as plain strings (character codes,
    so `"v10"` comes before `"v2"`).
  - The order of names in `migrations` carries no meaning.
  - If the dependencies contain a cycle, no ordering is valid: return an empty list `[]`.
  - The same dependency may be listed more than once; repeats change nothing.

  ### Example 1
  ```
  Input:  migrations = ["users", "orders", "audit"], dependencies = [["users", "orders"]]
  Output: [["audit", "users", "orders"], ["users", "audit", "orders"], ["users", "orders", "audit"]]
  Explanation: users must run before orders; audit has no constraints, so it can take any of the three positions.
  ```

  ### Example 2
  ```
  Input:  migrations = ["schema", "seed", "index"], dependencies = [["schema", "seed"], ["seed", "index"], ["index", "schema"]]
  Output: []
  Explanation: schema -> seed -> index -> schema is a cycle, so no order satisfies every dependency.
  ```

  ### Example 3
  ```
  Input:  migrations = ["b", "a"], dependencies = []
  Output: [["a", "b"], ["b", "a"]]
  ```

  ### Constraints
  - `1 <= migrations.length <= 8`; names are distinct
  - `1 <= name.length <= 20`; names use lowercase letters, digits and `_`
  - `0 <= dependencies.length <= 20`
  - `dependencies[i].length == 2`; both names appear in `migrations` and are different from each other
  - The answer contains at most `1000` orderings.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: all_migration_orders
  params:
    - {name: migrations, type: "string[]"}
    - {name: dependencies, type: "string[][]"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def all_migration_orders(migrations: list[str], dependencies: list[list[str]]) -> list[list[str]]:
        names = sorted(migrations)
        waiting_on = {name: 0 for name in names}
        unlocks: dict[str, list[str]] = {name: [] for name in names}
        for before, after in dependencies:
            unlocks[before].append(after)
            waiting_on[after] += 1
        orders: list[list[str]] = []
        current: list[str] = []
        placed: set[str] = set()

        def extend() -> None:
            if len(current) == len(names):
                orders.append(current[:])
                return
            for name in names:
                if name in placed or waiting_on[name] > 0:
                    continue
                placed.add(name)
                current.append(name)
                for nxt in unlocks[name]:
                    waiting_on[nxt] -= 1
                extend()
                for nxt in unlocks[name]:
                    waiting_on[nxt] += 1
                current.pop()
                placed.discard(name)

        extend()
        return orders
  javascript: |
    function allMigrationOrders(migrations, dependencies) {
      const names = [...migrations].sort();
      const waitingOn = new Map(names.map((n) => [n, 0]));
      const unlocks = new Map(names.map((n) => [n, []]));
      for (const [before, after] of dependencies) {
        unlocks.get(before).push(after);
        waitingOn.set(after, waitingOn.get(after) + 1);
      }
      const orders = [];
      const current = [];
      const placed = new Set();
      const extend = () => {
        if (current.length === names.length) {
          orders.push([...current]);
          return;
        }
        for (const name of names) {
          if (placed.has(name) || waitingOn.get(name) > 0) continue;
          placed.add(name);
          current.push(name);
          for (const nxt of unlocks.get(name)) waitingOn.set(nxt, waitingOn.get(nxt) - 1);
          extend();
          for (const nxt of unlocks.get(name)) waitingOn.set(nxt, waitingOn.get(nxt) + 1);
          current.pop();
          placed.delete(name);
        }
      };
      extend();
      return orders;
    }
