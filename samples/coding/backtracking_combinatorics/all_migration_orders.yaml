  - {id: t1, args: [["users", "orders", "audit"], [["users", "orders"]]], expected: [["audit", "users", "orders"], ["users", "audit", "orders"], ["users", "orders", "audit"]], description: "Example 1 - one dependency, independent migration can go anywhere"}
  - {id: t2, args: [["schema", "seed", "index"], [["schema", "seed"], ["seed", "index"], ["index", "schema"]]], expected: [], description: "Example 2 - three-step cycle has no valid order"}
  - {id: t3, args: [["b", "a"], []], expected: [["a", "b"], ["b", "a"]], description: "Example 3 - no dependencies, output sorted regardless of input order"}
  - {id: t4, hidden: true, args: [["init"], []], expected: [["init"]], description: "Single migration with no dependencies"}
  - {id: t5, hidden: true, args: [["a", "b", "c"], [["a", "b"], ["a", "b"]]], expected: [["a", "b", "c"], ["a", "c", "b"], ["c", "a", "b"]], description: "Same dependency listed twice must be counted consistently (no lost or duplicated orders)"}
  - {id: t6, hidden: true, args: [["m5", "m3", "m1", "m4", "m2"], [["m1", "m2"], ["m2", "m3"], ["m3", "m4"], ["m4", "m5"]]], expected: [["m1", "m2", "m3", "m4", "m5"]], description: "Full chain - exactly one valid order"}
  - {id: t7, hidden: true, args: [["m1", "m2", "m3", "m4"], [["m1", "m2"], ["m3", "m4"], ["m4", "m3"]]], expected: [], description: "Two-node cycle in one part while the rest is fine - whole answer is empty"}
  - {id: t8, hidden: true, args: [["v10", "v2", "v1"], []], expected: [["v1", "v10", "v2"], ["v1", "v2", "v10"], ["v10", "v1", "v2"], ["v10", "v2", "v1"], ["v2", "v1", "v10"], ["v2", "v10", "v1"]], description: "String (not numeric) comparison of names: v1 < v10 < v2"}
  - {id: t9, hidden: true, args: [["top", "left", "base", "right"], [["base", "left"], ["base", "right"], ["left", "top"], ["right", "top"]]], expected: [["base", "left", "right", "top"], ["base", "right", "left", "top"]], description: "Diamond dependency - two valid orders"}
