title: Count Letter Cipher Sum Solutions
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, security, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Count Letter Cipher Sum Solutions

  A puzzle-style challenge page shows an addition written in uppercase letters, such as
  `IO + IO = OPS`. Before a puzzle goes live, the team wants to know how many solutions it has.

  A **solution** maps each distinct letter to a decimal digit so that:

  - different letters get different digits (digits not used by any letter are irrelevant),
  - a word with **two or more** letters does not start with a letter mapped to `0` (a one-letter word
    may be `0`),
  - reading every word as a decimal number, the sum of the words in `addends` equals the number `total`.

  Return the **number of distinct letter-to-digit mappings** that are solutions. Return `0` if there are none.

  ### Example 1
  ```
  Input:  addends = ["IO", "IO"], total = "OPS"
  Output: 4
  Explanation: 2 * IO must be a three-digit number starting with O, so O = 1 and I is 5 to 9.
  I = 6 gives 61 + 61 = 122, which reuses 2 for P and S; I = 5, 7, 8, 9 give
  51 + 51 = 102, 71 + 71 = 142, 81 + 81 = 162 and 91 + 91 = 182.
  ```

  ### Example 2
  ```
  Input:  addends = ["A", "B"], total = "C"
  Output: 32
  Explanation: A and B must be two different non-zero digits whose sum is at most 9; there are 32
  ordered pairs, and C is their sum.
  ```

  ### Example 3
  ```
  Input:  addends = ["AB", "AB"], total = "C"
  Output: 0
  Explanation: AB is at least 10, so the sum never fits in one digit.
  ```

  ### Constraints
  - `1 <= addends.length <= 5`
  - `1 <= addends[i].length <= 7`
  - `1 <= total.length <= 8`
  - All words contain only uppercase letters `A`-`Z`.
  - At most 10 distinct letters appear across all words.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_cipher_sum_solutions
  params:
    - {name: addends, type: "string[]"}
    - {name: total, type: string}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def count_cipher_sum_solutions(addends: list[str], total: str) -> int:
        width = max(len(word) for word in addends + [total])
        leading = {word[0] for word in addends + [total] if len(word) > 1}
        # Column c (from the right): addend letters in that column and the total's letter (or None).
        columns = []
        for c in range(width):
            column_addends = [word[-1 - c] for word in addends if c < len(word)]
            column_total = total[-1 - c] if c < len(total) else None
            columns.append((column_addends, column_total))
        value: dict[str, int] = {}
        used = [False] * 10

        def solve_column(c: int, carry: int) -> int:
            if c == width:
                return 1 if carry == 0 else 0
            pending: list[str] = []
            for letter in columns[c][0]:
                if letter not in value and letter not in pending:
                    pending.append(letter)
            return assign(c, carry, pending, 0)

        def assign(c: int, carry: int, pending: list[str], k: int) -> int:
            if k < len(pending):
                # Give the next unassigned addend letter of this column every free digit.
                letter = pending[k]
                count = 0
                for d in range(10):
                    if used[d] or (d == 0 and letter in leading):
                        continue
                    used[d] = True
                    value[letter] = d
                    count += assign(c, carry, pending, k + 1)
                    del value[letter]
                    used[d] = False
                return count
            column_addends, column_total = columns[c]
            s = carry + sum(value[letter] for letter in column_addends)
            digit, next_carry = s % 10, s // 10
            if column_total is None:
                return 0  # an addend is longer than the total
            if column_total in value:
                return solve_column(c + 1, next_carry) if value[column_total] == digit else 0
            # The column forces the total's letter.
            if used[digit] or (digit == 0 and column_total in leading):
                return 0
            used[digit] = True
            value[column_total] = digit
            count = solve_column(c + 1, next_carry)
            del value[column_total]
            used[digit] = False
            return count

        return solve_column(0, 0)
  javascript: |
    function countCipherSumSolutions(addends, total) {
      const words = [...addends, total];
      const width = Math.max(...words.map((w) => w.length));
      const leading = new Set(words.filter((w) => w.length > 1).map((w) => w[0]));
      const columns = [];
      for (let c = 0; c < width; c++) {
        const letters = addends.filter((w) => c < w.length).map((w) => w[w.length - 1 - c]);
        const totalLetter = c < total.length ? total[total.length - 1 - c] : null;
        columns.push([letters, totalLetter]);
      }
      const value = new Map();
      const used = new Array(10).fill(false);

      function solveColumn(c, carry) {
        if (c === width) return carry === 0 ? 1 : 0;
        const pending = [];
        for (const letter of columns[c][0]) {
          if (!value.has(letter) && !pending.includes(letter)) pending.push(letter);
        }
        return assign(c, carry, pending, 0);
      }

      function assign(c, carry, pending, k) {
        if (k < pending.length) {
          const letter = pending[k];
          let count = 0;
          for (let d = 0; d < 10; d++) {
            if (used[d] || (d === 0 && leading.has(letter))) continue;
            used[d] = true;
            value.set(letter, d);
            count += assign(c, carry, pending, k + 1);
            value.delete(letter);
            used[d] = false;
          }
          return count;
        }
        const [letters, totalLetter] = columns[c];
        let s = carry;
        for (const letter of letters) s += value.get(letter);
        const digit = s % 10;
        const nextCarry = Math.floor(s / 10);
        if (totalLetter === null) return 0;
        if (value.has(totalLetter)) {
          return value.get(totalLetter) === digit ? solveColumn(c + 1, nextCarry) : 0;
        }
        if (used[digit] || (digit === 0 && leading.has(totalLetter))) return 0;
        used[digit] = true;
        value.set(totalLetter, digit);
        const count = solveColumn(c + 1, nextCarry);
        value.delete(totalLetter);
        used[digit] = false;
        return count;
      }

      return solveColumn(0, 0);
    }
