  - {id: t7, hidden: true, args: [["ABCD", "E"], "FGH"], expected: 0, description: "Addend longer than the total - no solutions"}
  - {id: t8, hidden: true, args: [["RACK", "RACK", "RACK"], "POWER"], expected: 8, description: "Same word repeated three times"}
  - {id: t9, hidden: true, args: [["PATCH", "PATCH"], "DEPLOY"], expected: 3, description: "All ten letters used with a final carry into the total"}
  - {id: t10, hidden: true, args: [["ATSEVIE", "ESCOEOP"], "RSOPRPA"], expected: 2, description: "Two seven-letter addends using all ten letters"}
  - {id: t11, hidden: true, args: [["RECPVOT", "EAVSVOI", "RORERAA", "PRRSSVV", "RRICVTV"], "APSEETTE"], expected: 1, description: "Maximum size - five seven-letter addends, eight-letter total, ten letters"}
expected_concepts:
  - backtracking over letter-to-digit assignments with a used-digit set
  - column-by-column search from the least significant digit with a carry, pruning as soon as a column fails
  - deriving the total's letter from the column sum instead of guessing it
  - leading-zero rule only for words with two or more letters
  - alternative of weighting each letter by its place values and searching for a zero weighted sum
optimal_complexity: {time: "O(10! / (10 - L)!) worst case for L distinct letters, far less with column pruning", space: "O(L + W) for the assignment and the columns"}
rubric:
  excellent: Searches column by column from the right with a carry, assigns only the letters a column needs, forces the total's letter from the column digit, prunes immediately on a mismatch, applies the leading-zero rule correctly to one-letter words and explains why this beats trying all permutations.
  good: Correct count via full permutation search with a weighted-sum check or a pruned backtracking search; may be slower but passes within the limits.
  weak: Stops at the first solution instead of counting, lets two letters share a digit, forbids zero for one-letter words, or forgets that an addend longer than the total makes the puzzle unsolvable.
  criteria:
    correctness: All tests pass, including repeated addends, letters that appear only in the total and one-letter words.
    efficiency: Column pruning or weighted-sum bounds keep ten-letter puzzles fast; no string-to-number conversion inside the innermost loop.
    code_quality: Clear separation of column preparation, digit assignment and the column check, with undo of every assignment.
    edge_cases: One-letter words equal to zero, total shorter than an addend, all ten letters used, the same word repeated.
    communication: Explains the carry, why the total's letter is forced and how the leading-zero rule is applied.
hints:
  - Trying all digit assignments and converting the words to numbers works for small puzzles but repeats a lot of work; think about how you check an addition by hand.
  - Work column by column from the rightmost digit with a carry. In each column you only need digits for the addend letters not yet assigned, and the column sum then determines the total's digit there.
  - Recurse on the column index and the carry. Assign each unassigned addend letter of the column a free digit (skipping zero for a leading letter of a multi-letter word), add the column digits and the carry, and compare the last digit of that sum with the total's letter - if it is assigned it must match, otherwise give it that digit if it is free and allowed. Move on with the new carry and count a solution when every column is done with no carry left.
followups:
  - How would you return the solutions themselves, and what if there could be millions of them?
  - How would you support subtraction or several equations that share letters?
  - How would you generate puzzles that have exactly one solution?
  - Compare the column search with the weighted-sum formulation in terms of pruning.
common_errors:
  - Returning as soon as one solution is found instead of counting all of them.
  - Forbidding zero for every leading letter, including one-letter words.
  - Assigning the same digit to two letters.
  - Ignoring the final carry, which must be zero once the total's last column is processed.
  - Treating unused digits as part of the mapping and counting them.
