expected_concepts:
  - "backtracking over radios in index order"
  - "trying channels in increasing order gives the lexicographically smallest answer"
  - "adjacency sets for O(degree) conflict checks"
  - "graph colouring is exponential in the worst case"
optimal_complexity: {time: "O(k^n * n) worst case", space: "O(n + m)"}
rubric:
  excellent: "Builds adjacency sets, assigns radios in index order trying channels from 1 upward, checks only already-assigned neighbours, returns the first complete assignment and argues why that is the lexicographically smallest, and explains the exponential worst case and pruning."
  good: "Correct backtracking with a conflict check, possibly scanning the full link list for each check, with minor help on why the first solution found is the smallest."
  weak: "Uses greedy colouring without backtracking (fails when an early choice must change), returns a non-minimal assignment, or enumerates all k^n assignments without pruning."
  criteria:
    correctness: "Valid assignment that is lexicographically smallest, or an empty list when none exists."
    efficiency: "Prunes as soon as a radio clashes with an assigned neighbour."
    code_quality: "Clear recursive helper that undoes its assignment when a branch fails."
    edge_cases: "Isolated radios, one channel, duplicate or reversed links, impossible inputs."
    communication: "Explains why greedy is not enough and why the search order yields the smallest answer."
hints:
  - "Decide radio 0 first, then radio 1, and so on. Which channel should you try first for each radio if you want the smallest possible list?"
  - "A greedy choice can paint itself into a corner later. When a radio has no allowed channel, go back to the previous radio and try its next channel instead."
  - "Build a set of interfering neighbours for each radio. Recurse over radios in index order and, for each one, try channels from 1 to the limit, skipping any channel already used by an assigned neighbour; the first time every radio is assigned, that assignment is the lexicographically smallest, and if the search for radio 0 runs out of options the answer is empty."
followups:
  - "How would you find the minimum number of channels the site needs?"
  - "Which radio-ordering heuristics (most constrained first) speed up the search, and why would they break the lexicographic guarantee?"
  - "How would you handle a link that only requires channels to be at least two apart?"
common_errors:
  - "Greedy assignment without backtracking, which fails when an earlier radio must change."
  - "Checking conflicts against unassigned radios that still hold a placeholder value."
  - "Not undoing a tentative assignment before trying the next channel."
  - "Treating links as directed and checking only one side."
