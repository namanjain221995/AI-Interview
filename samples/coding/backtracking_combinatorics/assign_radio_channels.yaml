slug: assign_radio_channels
title: "Assign Radio Channels"
difficulty: medium
competency_keys: [algorithms, problem_solving, data_structures]
role_tags: [network, backend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Assign Radio Channels

  A warehouse runs `n` wireless access radios numbered `0` to `n - 1`. A site survey produced a list
  of `links`; each link `[u, v]` means radios `u` and `v` are close enough to interfere, so they must
  not use the same channel. The site licence allows channels `1` to `channels`.

  Write `assign_radio_channels(n, links, channels)` that gives every radio one channel such that the
  two radios of every link get **different** channels:

  - Return the assignment as a list of `n` integers, where position `i` holds the channel of radio `i`.
  - If several assignments are valid, return the **lexicographically smallest** one: the one with the
    smallest channel for radio `0`, then, among those, the smallest for radio `1`, and so on.
  - Radios that appear in no link may use any channel (so they get channel `1`).
  - A link may be listed more than once or in either direction (`[u, v]` and `[v, u]`).
  - If no valid assignment exists, return an empty list `[]`.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 3], [3, 0]], channels = 2
  Output: [1, 2, 1, 2]
  Explanation: Radios form a ring 0-1-2-3-0; alternating channels 1 and 2 is valid and smallest.
  ```

  ### Example 2
  ```
  Input:  n = 3, links = [[0, 1], [1, 2], [2, 0]], channels = 2
  Output: []
  Explanation: Each pair of the three radios interferes, so three different channels would be needed.
  ```

  ### Example 3
  ```
  Input:  n = 3, links = [], channels = 1
  Output: [1, 1, 1]
  ```

  ### Constraints
  - `1 <= n <= 12`
  - `0 <= links.length <= 30`
  - `links[i].length == 2`, `0 <= u, v < n`, `u != v`
  - `1 <= channels <= 4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: assign_radio_channels
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: channels, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def assign_radio_channels(n: int, links: list[list[int]], channels: int) -> list[int]:
        neighbours: list[set[int]] = [set() for _ in range(n)]
        for u, v in links:
            neighbours[u].add(v)
            neighbours[v].add(u)
        assigned = [0] * n

        def place(radio: int) -> bool:
            if radio == n:
                return True
            for channel in range(1, channels + 1):
                if all(assigned[other] != channel for other in neighbours[radio]):
                    assigned[radio] = channel
                    if place(radio + 1):
                        return True
                    assigned[radio] = 0
            return False

        return assigned if place(0) else []
  javascript: |
    function assignRadioChannels(n, links, channels) {
      const neighbours = Array.from({ length: n }, () => new Set());
      for (const [u, v] of links) {
        neighbours[u].add(v);
        neighbours[v].add(u);
      }
      const assigned = new Array(n).fill(0);
      const place = (radio) => {
        if (radio === n) return true;
        for (let channel = 1; channel <= channels; channel++) {
          let clash = false;
          for (const other of neighbours[radio]) {
            if (assigned[other] === channel) {
              clash = true;
              break;
            }
          }
          if (clash) continue;
          assigned[radio] = channel;
          if (place(radio + 1)) return true;
          assigned[radio] = 0;
        }
        return false;
      };
      return place(0) ? assigned : [];
    }
