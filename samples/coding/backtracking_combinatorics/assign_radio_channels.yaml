  - {id: t10, hidden: true, args: [12, [[0, 1], [1, 2], [2, 3], [3, 4], [4, 0], [5, 4], [5, 1], [6, 0], [6, 2], [7, 1], [7, 3], [8, 2], [8, 4], [9, 3], [9, 0], [10, 5], [10, 6], [10, 7], [10, 8], [10, 9]], 3], expected: [], description: "Worst case - triangle-free 11-radio graph that needs 4 channels, given 3; exhaustive search must fail"}
