slug: complete_shift_rota
title: "Complete the Shift Rota"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, engineering_manager, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Complete the Shift Rota

  A support team of `n` engineers plans an `n`-day rotation over `n` shift types, numbered `1` to `n`
  (for example early, late, night and on-call). In the rota `grid`, row `r` is engineer `r` and column
  `c` is day `c`; `grid[r][c]` is the shift type that engineer works that day. A fair rota gives
  **every engineer each shift type exactly once** and staffs **every shift type exactly once per day**,
  so each row and each column contains every number from `1` to `n` exactly once.

  Some assignments are already agreed; `0` marks a cell that is still open.

  Write `complete_shift_rota(grid)` that fills every open cell so the rota is fair, without changing
  any agreed cell:

  - If several completions exist, return the one that is **lexicographically smallest when read row by
    row, left to right**: compare the cells in that reading order and prefer the smaller number at the
    first cell where two completions differ.
  - If the agreed cells already conflict (the same number twice in a row or a column), or no
    completion exists, return an empty list `[]`.
  - Do not modify the input grid; return a new `n x n` grid.

  ### Example 1
  ```
  Input:  grid = [[1, 0, 0], [0, 0, 1], [0, 0, 0]]
  Output: [[1, 2, 3], [2, 3, 1], [3, 1, 2]]
  ```

  ### Example 2
  ```
  Input:  grid = [[1, 1], [0, 0]]
  Output: []
  Explanation: Engineer 0 is already given shift type 1 twice.
  ```

  ### Example 3
  ```
  Input:  grid = [[0, 0], [0, 2]]
  Output: [[2, 1], [1, 2]]
  Explanation: Putting 1 in the top-left cell would force 2 into the top-right cell, but that day already has shift type 2, so the top-left cell must be 2.
  ```

  ### Constraints
  - `1 <= n <= 6`
  - `grid.length == n` and `grid[r].length == n`
  - `0 <= grid[r][c] <= n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: complete_shift_rota
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def complete_shift_rota(grid: list[list[int]]) -> list[list[int]]:
        n = len(grid)
        board = [row[:] for row in grid]
        row_used = [set() for _ in range(n)]
        col_used = [set() for _ in range(n)]
        for r in range(n):
            for c in range(n):
                value = board[r][c]
                if value == 0:
                    continue
                if value in row_used[r] or value in col_used[c]:
                    return []
                row_used[r].add(value)
                col_used[c].add(value)

        def fill(cell: int) -> bool:
            if cell == n * n:
                return True
            r, c = divmod(cell, n)
            if board[r][c] != 0:
                return fill(cell + 1)
            for value in range(1, n + 1):
                if value in row_used[r] or value in col_used[c]:
                    continue
                board[r][c] = value
                row_used[r].add(value)
                col_used[c].add(value)
                if fill(cell + 1):
                    return True
                board[r][c] = 0
                row_used[r].discard(value)
                col_used[c].discard(value)
            return False

        return board if fill(0) else []
  javascript: |
    function completeShiftRota(grid) {
      const n = grid.length;
      const board = grid.map((row) => [...row]);
      const rowUsed = Array.from({ length: n }, () => new Array(n + 1).fill(false));
      const colUsed = Array.from({ length: n }, () => new Array(n + 1).fill(false));
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const value = board[r][c];
          if (value === 0) continue;
          if (rowUsed[r][value] || colUsed[c][value]) return [];
          rowUsed[r][value] = true;
          colUsed[c][value] = true;
        }
      }
      const fill = (cell) => {
        if (cell === n * n) return true;
        const r = Math.floor(cell / n);
        const c = cell % n;
        if (board[r][c] !== 0) return fill(cell + 1);
        for (let value = 1; value <= n; value++) {
          if (rowUsed[r][value] || colUsed[c][value]) continue;
          board[r][c] = value;
          rowUsed[r][value] = true;
          colUsed[c][value] = true;
          if (fill(cell + 1)) return true;
          board[r][c] = 0;
          rowUsed[r][value] = false;
          colUsed[c][value] = false;
        }
        return false;
      };
      return fill(0) ? board : [];
    }
