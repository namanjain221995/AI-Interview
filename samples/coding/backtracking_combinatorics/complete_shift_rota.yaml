expected_concepts:
  - "backtracking cell by cell in row-major order"
  - "row and column used-value sets for O(1) checks"
  - "validating agreed cells before searching"
  - "trying values in increasing order yields the lexicographically smallest completion"
optimal_complexity: {time: "O(n^(n^2)) worst case, heavily pruned", space: "O(n^2)"}
rubric:
  excellent: "Validates the agreed cells first, keeps per-row and per-column used sets, backtracks over open cells in reading order trying values from 1 upward, returns the first full completion with an argument for why it is the lexicographically smallest, copies the input, and discusses pruning ideas such as choosing the most constrained cell (and why that breaks the ordering guarantee unless handled)."
  good: "Correct backtracking that returns the smallest completion, possibly re-scanning rows and columns for each check, or missing the up-front conflict check but still returning an empty list."
  weak: "Fills cells greedily without backtracking, overwrites agreed cells, returns a valid but not smallest rota, or mutates the input grid."
  criteria:
    correctness: "Smallest completion in reading order, agreed cells preserved, empty list when impossible or conflicting."
    efficiency: "Constant-time feasibility checks with incremental set updates; prunes dead branches immediately."
    code_quality: "Single recursive helper over a cell index, symmetric place and undo steps."
    edge_cases: "n = 1, fully agreed grids (valid and invalid), conflicts that are only discovered by search."
    communication: "Explains the search order, why the first solution is minimal, and the exponential worst case."
hints:
  - "Visit the open cells in the same order the answer is compared (row by row, left to right). If you always try the smallest allowed number first, what can you say about the first complete rota you reach?"
  - "Before searching, check that no row or column already contains the same agreed number twice. Then fill one open cell at a time, and when a cell has no allowed number, step back and change the previous open cell to its next allowed number."
  - "Keep, for every row and every column, the set of numbers already used. Recurse over cell positions in reading order: skip agreed cells, try each number from 1 to n that is unused in both the row and the column, record it in both sets, recurse, and remove it again if the recursion fails. Return a copy of the board as soon as the last cell is filled, or an empty list if the search for the first open cell is exhausted."
followups:
  - "How would you count all completions instead of returning the smallest?"
  - "How would constraint propagation (cells with only one candidate) speed up the search?"
  - "How would you add a rule such as no engineer working a night shift the day before an early shift?"
common_errors:
  - "Skipping the up-front check, so conflicting agreed cells in already-filled rows go unnoticed."
  - "Overwriting agreed cells during the search."
  - "Not undoing the row and column sets when backtracking."
  - "Filling greedily and returning a partial or invalid rota when stuck."
  - "Mutating and returning the input grid instead of a copy."
