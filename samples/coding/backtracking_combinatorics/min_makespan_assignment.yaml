version: 1
slug: min_makespan_assignment
title: Minimum Makespan Assignment
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, data, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Minimum Makespan Assignment

  A small render farm has `workers` identical machines and a batch of render jobs. Job `i` takes
  `durations[i]` seconds. Every job must be given to **exactly one** machine, a job cannot be split
  between machines, and a machine may stay idle. A machine's **load** is the sum of the durations of the
  jobs it receives, and the batch is finished when the most loaded machine is done.

  Return the **smallest possible maximum load** over all ways of assigning the jobs.

  ### Example 1
  ```
  Input:  durations = [7, 5, 4, 3, 3, 2], workers = 2
  Output: 12
  Explanation: {7, 5} and {4, 3, 3, 2} both have load 12, which is half of the total 24.
  ```

  ### Example 2
  ```
  Input:  durations = [30, 30, 20, 20, 20], workers = 2
  Output: 60
  Explanation: {30, 30} and {20, 20, 20}. Always handing the next longest job to the least loaded
  machine gives {30, 20, 20} and {30, 20}, a maximum load of 70.
  ```

  ### Example 3
  ```
  Input:  durations = [9, 4], workers = 5
  Output: 9
  Explanation: Each job gets its own machine and three machines stay idle.
  ```

  ### Constraints
  - `1 <= durations.length <= 12`
  - `1 <= durations[i] <= 10^9`
  - `1 <= workers <= 12`
  - The answer can exceed the 32-bit integer range; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_makespan_assignment
  params:
    - {name: durations, type: "int[]"}
    - {name: workers, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def min_makespan_assignment(durations: list[int], workers: int) -> int:
        jobs = sorted(durations, reverse=True)
        machines = min(workers, len(jobs))
        # Upper bound: longest job first onto the least loaded machine.
        loads = [0] * machines
        for job in jobs:
            loads[loads.index(min(loads))] += job
        best = max(loads)
        # No assignment can beat the longest job or the average load.
        lower = max(jobs[0], -(-sum(jobs) // machines))
        loads = [0] * machines

        def place(index: int, current_max: int) -> None:
            nonlocal best
            if best == lower:
                return
            if index == len(jobs):
                best = current_max
                return
            job = jobs[index]
            tried: set[int] = set()
            for m in range(machines):
                load = loads[m]
                # Machines with the same load are interchangeable; only strictly better
                # partial assignments are worth exploring.
                if load in tried or load + job >= best:
                    continue
                tried.add(load)
                loads[m] = load + job
                place(index + 1, max(current_max, load + job))
                loads[m] = load

        place(0, 0)
        return best
  javascript: |
    function minMakespanAssignment(durations, workers) {
      const jobs = [...durations].sort((a, b) => b - a);
      const machines = Math.min(workers, jobs.length);
      const loads = new Array(machines).fill(0);
      for (const job of jobs) {
        let lightest = 0;
        for (let m = 1; m < machines; m++) if (loads[m] < loads[lightest]) lightest = m;
        loads[lightest] += job;
      }
      let best = Math.max(...loads);
      const total = jobs.reduce((a, b) => a + b, 0);
      const lower = Math.max(jobs[0], Math.ceil(total / machines));
      loads.fill(0);

      function place(index, currentMax) {
        if (best === lower) return;
        if (index === jobs.length) {
          best = currentMax;
          return;
        }
        const job = jobs[index];
        const tried = new Set();
        for (let m = 0; m < machines; m++) {
          const load = loads[m];
          if (tried.has(load) || load + job >= best) continue;
          tried.add(load);
          loads[m] = load + job;
          place(index + 1, Math.max(currentMax, load + job));
          loads[m] = load;
        }
      }

      place(0, 0);
      return best;
    }
tests:
  - {id: t1, args: [[7, 5, 4, 3, 3, 2], 2], expected: 12, description: "Example 1"}
  - {id: t2, args: [[30, 30, 20, 20, 20], 2], expected: 60, description: "Example 2 - greedy longest-job-first gives 70"}
  - {id: t3, args: [[9, 4], 5], expected: 9, description: "Example 3 - more machines than jobs, idle machines"}
  - {id: t4, hidden: true, args: [[1000000000], 1], expected: 1000000000, description: "Single job on a single machine"}
  - {id: t5, hidden: true, args: [[1000000000, 1000000000, 1000000000, 1000000000, 1000000000, 1000000000, 1000000000, 1000000000, 1000000000, 1000000000, 1000000000, 1000000000], 1], expected: 12000000000, description: "One machine takes all twelve maximum jobs - total 1.2e10 overflows 32-bit"}
  - {id: t6, hidden: true, args: [[5, 5, 4, 4, 3, 3, 3], 3], expected: 9, description: "Greedy counterexample with three machines - greedy gives 11, optimum 9"}
  - {id: t7, hidden: true, args: [[10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10, 10], 5], expected: 30, description: "Twelve identical jobs on five machines - symmetry breaking matters"}
  - {id: t8, hidden: true, args: [[17, 4, 9, 23, 11, 2, 8, 30, 6, 1, 14, 5], 12], expected: 30, description: "Twelve jobs and twelve machines - answer is the longest job"}
  - {id: t9, hidden: true, args: [[485738844, 929583700, 601051018, 920049643, 992363556, 838826498, 499987953, 485151262, 545290416, 918098261, 630699661, 203905759], 3], expected: 2693945144, description: "Large random durations where the optimum is above the average-load bound and greedy is worse"}
  - {id: t10, hidden: true, args: [[999999937, 999999929, 999999893, 999999883, 999999797, 999999761, 999999757, 999999751, 999999739, 999999733, 999999677, 999999667], 5], expected: 2999999163, description: "Twelve near-equal huge jobs on five machines - lower bound unreachable, full search with 64-bit loads"}
expected_concepts:
  - backtracking over job-to-machine assignments with the longest jobs placed first
  - pruning branches whose load already reaches the best answer found so far
  - symmetry breaking by skipping machines with an identical current load (including idle ones)
  - lower bound from the longest job and the average load, upper bound from a greedy assignment
  - alternative of binary searching the answer with a subset or bitmask feasibility check
  - 64-bit arithmetic for the total load
optimal_complexity: {time: "O(k^n) worst case with pruning that is fast in practice, or O(3^n * log(sum)) with binary search plus bitmask DP", space: "O(n + k) for the search, O(2^n) for the bitmask DP"}
rubric:
  excellent: Recognises the problem as NP-hard so an exhaustive search is required, sorts jobs longest first, prunes with the best answer so far and breaks symmetry between machines with equal load, uses 64-bit totals and explains why greedy fails with a counterexample.
  good: Correct backtracking or bitmask solution with at least one effective pruning rule; may need a prompt for symmetry breaking or the 64-bit total.
  weak: Uses the greedy longest-job-to-lightest-machine rule, tries every one of k^n assignments without pruning and times out, or overflows the total in a 32-bit integer.
  criteria:
    correctness: All tests pass, including the greedy counterexamples, idle machines and totals above 2^31.
    efficiency: Worst cases with 12 jobs finish quickly thanks to ordering, bounds and symmetry breaking (or a subset DP).
    code_quality: Clear recursive helper with explicit place-and-undo of each job and named bounds.
    edge_cases: One machine, more machines than jobs, identical durations and very large durations.
    communication: Explains each pruning rule and why it never discards the optimum.
hints:
  - A simple rule such as always giving the next job to the least loaded machine is not always optimal; with at most 12 jobs you can afford to search assignments, as long as you cut the search down.
  - Place the longest jobs first and abandon any partial assignment whose busiest machine already reaches the best complete answer you have seen. Also notice that machines with the same current load are interchangeable.
  - Sort the durations in decreasing order and recurse job by job, trying each machine whose load plus the job stays below the best answer; skip a machine if another machine with the same load was already tried for this job, which also means only one idle machine is ever tried. Seed the best answer with a greedy assignment, stop early when it equals the larger of the longest job and the average load rounded up, and keep all sums in 64-bit integers.
followups:
  - How would you return the actual assignment of jobs to machines?
  - How would a binary search on the answer combined with a bitmask feasibility check compare to the backtracking search?
  - What changes if machines have different speeds?
  - For thousands of jobs, which approximation would you use and how far from optimal can it be?
common_errors:
  - Returning the greedy longest-job-first answer, which is not always optimal.
  - Summing durations in a 32-bit integer, which overflows for twelve jobs near 10^9.
  - Exploring every machine for every job without symmetry breaking, which explodes when many machines are idle.
  - Forgetting that machines may stay idle when there are more machines than jobs.
