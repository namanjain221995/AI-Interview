expected_concepts:
- permutations by backtracking with a used marker
- sorting the input first to emit permutations in lexicographic order
- string comparison by character code
- output size n! drives the complexity
optimal_complexity:
  time: O(n * n!)
  space: O(n) auxiliary beyond the output
rubric:
  excellent: Sorts the names once, generates permutations with a used marker so they come out already in lexicographic order, avoids a final sort, and explains the n * n! bound.
  good: Correct permutation generation followed by sorting the full result, or needs a nudge to sort the input first.
  weak: Produces permutations in input order without sorting, compares numeric suffixes as numbers, or misses or duplicates orderings.
  criteria:
    correctness: All n! orderings appear once, in the required order.
    efficiency: No repeated generation; ordering obtained by construction or a single sort.
    code_quality: Clear backtracking with symmetric choose and undo steps.
    edge_cases: A single service, prefix names and numeric suffixes.
    communication: Explains why fixing positions left to right over sorted names yields sorted output.
hints:
- 'Fill the restart order one position at a time: any service that has not been placed yet can go in the next position.'
- Keep track of which services are already used, and undo that choice after exploring it so the next option can be tried.
- Sort the names first; then a recursive helper that tries the unused names for the next position in that sorted order, recurses, and then un-marks the name will emit the orderings already in the required order, so no final sort is needed.
followups:
- How would you generate the next ordering from the current one without recursion?
- If some services must start before others, how would you prune the search?
- How would you handle duplicate service names so equal orderings are not repeated?
- With 12 services there are almost half a billion orders; how would you choose which ones to actually run?
common_errors:
- Emitting permutations in input order and forgetting to sort.
- Sorting names by a numeric suffix instead of plain string comparison.
- Not undoing the used marker, so later branches miss services.
- Recording a reference to the shared path instead of a copy.
