version: 1
slug: service_restart_orders
title: Service Restart Orders
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Service Restart Orders

  During a maintenance drill an SRE team wants to check whether the order in which services come back
  up matters. They plan to replay the drill once for **every possible restart order** of the services
  involved.

  Given a list of distinct service names, return every ordering of all of them (each service appears
  exactly once in each ordering).

  The result must be **sorted**: compare two orderings position by position, and the first position
  where they differ decides, using ordinary string comparison by character code (so `"api"` comes before
  `"api-gw"`, and `"web10"` comes before `"web2"`). The input list itself is not necessarily sorted.

  ### Example 1
  ```
  Input:  services = ["db", "api", "cache"]
  Output: [["api", "cache", "db"], ["api", "db", "cache"], ["cache", "api", "db"], ["cache", "db", "api"], ["db", "api", "cache"], ["db", "cache", "api"]]
  Explanation: The input order does not matter; the output starts with the alphabetically smallest ordering.
  ```

  ### Example 2
  ```
  Input:  services = ["worker"]
  Output: [["worker"]]
  ```

  ### Constraints
  - `1 <= services.length <= 6`
  - `1 <= services[i].length <= 15`; names use lowercase letters, digits and `-`
  - All service names are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: service_restart_orders
  params:
    - {name: services, type: "string[]"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def service_restart_orders(services: list[str]) -> list[list[str]]:
        names = sorted(services)
        used = [False] * len(names)
        current: list[str] = []
        orders: list[list[str]] = []

        def build() -> None:
            if len(current) == len(names):
                orders.append(list(current))
                return
            for i, name in enumerate(names):
                if not used[i]:
                    used[i] = True
                    current.append(name)
                    build()
                    current.pop()
                    used[i] = False

        build()
        return orders
  javascript: |
    function serviceRestartOrders(services) {
      const names = [...services].sort();
      const used = new Array(names.length).fill(false);
      const current = [];
      const orders = [];
      function build() {
        if (current.length === names.length) {
          orders.push([...current]);
          return;
        }
        for (let i = 0; i < names.length; i++) {
          if (used[i]) continue;
          used[i] = true;
          current.push(names[i]);
          build();
          current.pop();
          used[i] = false;
        }
      }
      build();
      return orders;
    }
