expected_concepts:
  - "backtracking over cut positions"
  - "checking a chunk is a mirror with two pointers or a precomputed table"
  - "precomputing mirror[i][j] with dynamic programming to avoid repeated checks"
  - "generating shorter chunks first yields the required order without a final sort"
  - "copying the current chunk list when recording a complete way"
optimal_complexity: {time: "O(n * 2^n)", space: "O(n^2) for the mirror table"}
rubric:
  excellent: "Backtracks over cut positions with an O(1) mirror check from a precomputed table, explains why trying shorter chunks first produces the sorted order directly (or sorts with a correct element-wise comparator) and states the O(n * 2^n) output-bound complexity."
  good: "Correct backtracking with an on-the-fly two-pointer mirror check and an explicit sort that matches the required order."
  weak: "Misses ways, includes non-mirror chunks, returns the ways in an unspecified order, or sorts by the joined string instead of chunk by chunk."
  criteria:
    correctness: "Every valid cutting appears once and the list follows the chunk-by-chunk ordering."
    efficiency: "Mirror checks are not recomputed from scratch inside deep recursion, or the cost is acknowledged."
    code_quality: "Clear recursion on the start index with a shared chunk list that is copied when recorded."
    edge_cases: "Single character, all distinct characters and all equal characters."
    communication: "Explains the ordering rule and why the recursion order already satisfies it."
hints:
  - "Decide where the first chunk ends: it must be a mirror, and whatever remains after it is a smaller instance of the same problem."
  - "Recurse on the start index, trying each end position whose chunk is a mirror, and record the chunk list when the start reaches the end of the payload. Think about the order in which you try end positions."
  - "Precompute a table telling whether each substring is a mirror (a substring is a mirror when its two end characters match and the inside is a mirror). Then backtrack from each start trying end positions from nearest to farthest; because a shorter chunk is a prefix of a longer chunk at the same position, this order produces the ways already sorted."
followups:
  - "How would you count the ways without listing them?"
  - "How would you find the minimum number of cuts so every chunk is a mirror?"
  - "Why is the number of ways at most 2^(n-1), and which input reaches it?"
  - "How would the mirror table change if the gateway ignored case?"
common_errors:
  - "Sorting the ways by their concatenation, which is the same string for every way."
  - "Recording the shared chunk list instead of a copy."
  - "Off-by-one errors in substring bounds so the last character is never a chunk on its own."
  - "Treating the empty string as a valid chunk, which causes infinite recursion."
