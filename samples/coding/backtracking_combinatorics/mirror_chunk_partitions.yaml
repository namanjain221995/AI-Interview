slug: mirror_chunk_partitions
title: Mirror Chunk Partitions
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, security, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Mirror Chunk Partitions

  A legacy checksum gateway only accepts a payload after it has been cut into contiguous **chunks**, and
  it rejects any chunk that does not read the same forwards and backwards (a **mirror chunk**, such as
  `"x"`, `"tt"` or `"level"`). Before choosing a cutting strategy, the integration team wants to see every
  option.

  Given the payload `s`, return **every** way to cut it into mirror chunks. Each way is the list of its
  chunks in payload order; joining the chunks gives back `s` exactly. Single characters are always mirror
  chunks, so at least one way exists.

  Return the ways **sorted**: compare two ways chunk by chunk from the start, and at the first position
  where the chunks differ, the way whose chunk is smaller in ordinary string (ASCII) order comes first (a
  list that is a prefix of another comes first).

  ### Example 1
  ```
  Input:  s = "noon"
  Output: [["n", "o", "o", "n"], ["n", "oo", "n"], ["noon"]]
  Explanation: "n" < "noon" at the first chunk, and "o" < "oo" at the second, which fixes the order.
  ```

  ### Example 2
  ```
  Input:  s = "kayak"
  Output: [["k", "a", "y", "a", "k"], ["k", "aya", "k"], ["kayak"]]
  ```

  ### Constraints
  - `1 <= s.length <= 12`
  - `s` contains only lowercase letters `a`-`z`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: mirror_chunk_partitions
  params:
    - {name: s, type: "string"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def mirror_chunk_partitions(s: str) -> list[list[str]]:
        n = len(s)
        # mirror[i][j] is True when s[i..j] reads the same in both directions.
        mirror = [[False] * n for _ in range(n)]
        for i in range(n - 1, -1, -1):
            for j in range(i, n):
                mirror[i][j] = s[i] == s[j] and (j - i < 2 or mirror[i + 1][j - 1])

        ways: list[list[str]] = []
        chunks: list[str] = []

        def cut(start: int) -> None:
            if start == n:
                ways.append(list(chunks))
                return
            # Shorter chunks first: a shorter chunk is a prefix of a longer one
            # starting at the same position, so the ways come out already sorted.
            for end in range(start, n):
                if mirror[start][end]:
                    chunks.append(s[start:end + 1])
                    cut(end + 1)
                    chunks.pop()

        cut(0)
        return ways
  javascript: |
    function mirrorChunkPartitions(s) {
      const n = s.length;
      const mirror = Array.from({ length: n }, () => new Array(n).fill(false));
      for (let i = n - 1; i >= 0; i--) {
        for (let j = i; j < n; j++) {
          mirror[i][j] = s[i] === s[j] && (j - i < 2 || mirror[i + 1][j - 1]);
        }
      }
      const ways = [];
      const chunks = [];
      const cut = (start) => {
        if (start === n) {
          ways.push([...chunks]);
          return;
        }
        for (let end = start; end < n; end++) {
          if (mirror[start][end]) {
            chunks.push(s.slice(start, end + 1));
            cut(end + 1);
            chunks.pop();
          }
        }
      };
      cut(0);
      return ways;
    }
