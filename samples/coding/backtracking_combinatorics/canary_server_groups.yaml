expected_concepts:
- choosing combinations in increasing order to avoid duplicates
- backtracking with a start index
- pruning when too few servers remain to fill the group
- output size C(n, k)
optimal_complexity:
  time: O(k * C(n, k))
  space: O(k) auxiliary beyond the output
rubric:
  excellent: Builds groups in increasing order so each set appears once, prunes branches that cannot reach size k, copies the path on output and relates the running time to C(n, k).
  good: Correct backtracking without pruning, or an include/exclude recursion, with the right complexity discussion after a prompt.
  weak: Generates permutations and deduplicates afterwards, uses fixed nested loops that only work for one k, or has off-by-one errors at 1 or n.
  criteria:
    correctness: Exactly the C(n, k) groups, each once, using servers 1..n.
    efficiency: No permutation explosion; optional pruning of hopeless branches.
    code_quality: Readable recursive helper with a clear stopping condition.
    edge_cases: k = 1, k = n and n = 1.
    communication: Explains why choosing in increasing order rules out duplicate groups.
hints:
- A group is a set, so you only need to generate each one in a single canonical order, for example with server numbers increasing.
- Grow a partial group one server at a time, and only ever add a server whose number is larger than the last one you added; stop and record when the group reaches size k.
- Write a recursive helper that receives the smallest server number still allowed; loop from that number upwards, add the server, recurse with the next number, then remove it again, and stop the loop early once there are too few servers left to fill the remaining slots.
followups:
- How would you produce the groups in lexicographic order, and does your solution already do so?
- How would you return only the m-th group without generating all of them?
- If some servers share a rack and a group may contain at most one server per rack, how would you prune?
- How would you generate the groups iteratively without recursion?
common_errors:
- Restarting the loop from server 1 at every level, which produces the same group in several orders.
- Off-by-one bounds that never include server n or that start at 0.
- Storing a reference to the shared path instead of a copy.
- Hard-coding k nested loops.
