prompt_markdown: |
  ## Canary Server Groups

  A deployment pipeline rolls new builds out to a **canary group** first: exactly `k` servers chosen from
  a pool of `n` servers numbered `1` to `n`. To plan an experiment that eventually tries every possible
  canary group, the release team needs the full list of candidate groups.

  Return every group of exactly `k` **distinct** server numbers from `1..n`.

  - A group is a set: `[1, 3]` and `[3, 1]` are the same group and must not both appear.
  - Groups may be returned in **any order**, and the numbers inside a group may be in any order.

  ### Example 1
  ```
  Input:  n = 4, k = 2
  Output: [[1, 2], [1, 3], [1, 4], [2, 3], [2, 4], [3, 4]]
  Explanation: There are C(4, 2) = 6 ways to choose two of the four servers.
  ```

  ### Example 2
  ```
  Input:  n = 3, k = 3
  Output: [[1, 2, 3]]
  Explanation: The only way to pick all three servers.
  ```

  ### Constraints
  - `1 <= k <= n <= 10`
languages: [python, javascript, typescript, java, go, cpp]
signature:
