reference_solutions:
  python: |
    def canary_server_groups(n: int, k: int) -> list[list[int]]:
        groups: list[list[int]] = []
        current: list[int] = []

        def build(first: int) -> None:
            if len(current) == k:
                groups.append(list(current))
                return
            # Leave enough servers to fill the remaining slots.
            for server in range(first, n - (k - len(current)) + 2):
                current.append(server)
                build(server + 1)
                current.pop()

        build(1)
        return groups
  javascript: |
    function canaryServerGroups(n, k) {
      const groups = [];
      const current = [];
      function build(first) {
        if (current.length === k) {
          groups.push([...current]);
          return;
        }
        const last = n - (k - current.length) + 1;
        for (let server = first; server <= last; server++) {
          current.push(server);
          build(server + 1);
          current.pop();
        }
      }
      build(1);
      return groups;
    }
