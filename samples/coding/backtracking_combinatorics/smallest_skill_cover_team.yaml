slug: smallest_skill_cover_team
title: Smallest Skill-Covering On-Call Team
difficulty: hard
competency_keys: [algorithms, problem_solving, data_structures]
role_tags: [engineering_manager, sre, tech_lead, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Smallest Skill-Covering On-Call Team

  You are staffing an on-call rotation. Every runbook skill in `required` must be held by at least one
  person on the team. `engineers[i]` lists the skills engineer `i` holds; a list may be empty, may
  repeat a skill and may contain skills that are not in `required` (those are simply ignored).

  Return the indices of a team with the **fewest engineers** that covers every required skill, sorted
  in ascending order. If several minimum-size teams exist, return the one whose sorted index list is
  **lexicographically smallest** (compare the first index, then the second, and so on).

  ### Example 1
  ```
  Input:  required = ["deploy", "dns", "postgres", "tls"],
          engineers = [["deploy", "dns"], ["postgres"], ["tls", "postgres"], ["dns", "tls"], ["deploy"]]
  Output: [0, 2]
  Explanation: Engineer 0 covers deploy and dns, engineer 2 covers tls and postgres. No single engineer
  covers all four skills.
  ```

  ### Example 2
  ```
  Input:  required = ["kafka", "redis", "vault"],
          engineers = [["redis"], ["kafka", "vault"], ["vault", "redis", "kafka"]]
  Output: [2]
  Explanation: [0, 1] also covers everything, but a team of one is smaller.
  ```

  ### Example 3
  ```
  Input:  required = ["dns", "k8s", "tls"],
          engineers = [["dns", "k8s"], ["tls"], ["k8s", "tls"], ["dns"]]
  Output: [0, 1]
  Explanation: [0, 1], [0, 2] and [2, 3] are all teams of two; [0, 1] is the smallest list.
  ```

  ### Constraints
  - `1 <= required.length <= 16`; the required skills are distinct.
  - `1 <= engineers.length <= 40`
  - `0 <= engineers[i].length <= 16`
  - Skills are non-empty strings of lowercase letters, digits and `-`.
  - At least one team covering every required skill exists.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_skill_cover_team
  params:
    - {name: required, type: "string[]"}
    - {name: engineers, type: "string[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def smallest_skill_cover_team(required: list[str], engineers: list[list[str]]) -> list[int]:
        bit = {skill: 1 << i for i, skill in enumerate(required)}
        full = (1 << len(required)) - 1
        masks = []
        for skills in engineers:
            mask = 0
            for skill in skills:
                mask |= bit.get(skill, 0)
            masks.append(mask)
        # holders[b] = distinct skill masks of the engineers holding skill b.
        holders = [sorted({m for m in masks if m >> b & 1}) for b in range(len(required))]
        # need[m] = fewest engineers whose skills cover every skill in the set m.
        need = [0] * (full + 1)
        for m in range(1, full + 1):
            low = (m & -m).bit_length() - 1  # someone must cover the lowest missing skill
            best = len(engineers) + 1
            for h in holders[low]:
                if need[m & ~h] < best:
                    best = need[m & ~h]
            need[m] = best + 1
        # Greedy reconstruction: take the smallest index that keeps the team size optimal.
        team: list[int] = []
        remaining = full
        for i, mask in enumerate(masks):
            if remaining == 0:
                break
            if need[remaining & ~mask] == need[remaining] - 1:
                team.append(i)
                remaining &= ~mask
        return team
  javascript: |
    function smallestSkillCoverTeam(required, engineers) {
      const bit = new Map();
      required.forEach((skill, i) => bit.set(skill, 1 << i));
      const full = (1 << required.length) - 1;
      const masks = engineers.map((skills) => {
        let mask = 0;
        for (const skill of skills) mask |= bit.get(skill) || 0;
        return mask;
      });
      const holders = required.map((_, b) => [...new Set(masks.filter((m) => (m >> b) & 1))]);
      const need = new Int32Array(full + 1);
      for (let m = 1; m <= full; m++) {
        let low = 0;
        while (!((m >> low) & 1)) low++;
        let best = engineers.length + 1;
        for (const h of holders[low]) {
          const candidate = need[m & ~h];
          if (candidate < best) best = candidate;
        }
        need[m] = best + 1;
      }
      const team = [];
      let remaining = full;
      for (let i = 0; i < masks.length && remaining !== 0; i++) {
        if (need[remaining & ~masks[i]] === need[remaining] - 1) {
          team.push(i);
          remaining &= ~masks[i];
        }
      }
      return team;
    }
