expected_concepts:
  - mapping required skills to bits and each engineer to a skill bitmask
  - minimum set cover is NP-hard, so search over the 2^k skill subsets is acceptable for k <= 16
  - dynamic programming over subsets of missing skills, branching only on engineers who hold the lowest missing skill
  - reconstructing the lexicographically smallest optimal team greedily from the DP table
  - alternative of iterative deepening backtracking with pruning
optimal_complexity: {time: "O(2^k * n) for k required skills and n engineers", space: "O(2^k)"}
rubric:
  excellent: Encodes skills as bitmasks, computes the minimum team size for every subset of missing skills (branching on holders of one fixed missing skill), rebuilds the lexicographically smallest team by taking the first index that keeps the size optimal and justifies why that greedy reconstruction is correct.
  good: Finds a correct minimum team with bitmask search or pruned backtracking and handles the tie-break, perhaps by enumerating teams of increasing size in lexicographic order.
  weak: Uses the greedy pick-the-most-new-skills heuristic, ignores the tie-break, or enumerates all 2^40 subsets of engineers.
  criteria:
    correctness: All tests pass, including the greedy counterexample, tie-breaks and skills outside the required list.
    efficiency: Exponential only in the number of required skills (at most 2^16 states), not in the number of engineers.
    code_quality: Clear bitmask helpers, named DP table and a separate reconstruction step.
    edge_cases: Empty skill lists, repeated or unknown skills, one engineer covering everything and every skill held by exactly one engineer.
    communication: Explains why the reconstruction yields the lexicographically smallest minimum team.
hints:
  - Picking the engineer who adds the most new skills each time is not always optimal. There are at most 16 required skills, so the number of possible sets of still-missing skills is small.
  - Turn each engineer into a bitmask over the required skills and compute, for every set of missing skills, the fewest engineers needed to cover it. One of the engineers holding the lowest missing skill must be in any cover of that set, so you only need to branch on them.
  - Fill a table over all subsets of missing skills in increasing order, where the empty set needs zero engineers and any other set needs one plus the best value after removing the skills of an engineer who holds its lowest missing skill. Then walk the engineers by index starting from the full set of skills and take engineer i whenever removing their skills lowers the table value by exactly one; that yields a minimum team and, because you always take the smallest usable index, the lexicographically smallest one.
followups:
  - How would you handle 60 required skills, where a table over all subsets no longer fits?
  - What if engineers had different costs and you wanted the cheapest team instead of the smallest?
  - How would you require every skill to be covered by at least two people for redundancy?
  - How does the greedy heuristic perform as an approximation, and what guarantee does it have?
common_errors:
  - Using the greedy most-new-skills heuristic, which can return a larger team.
  - Enumerating subsets of engineers (up to 2^40) instead of subsets of skills.
  - Returning any minimum team without applying the lexicographic tie-break.
  - Crashing on skills that are not in the required list or counting duplicates twice.
