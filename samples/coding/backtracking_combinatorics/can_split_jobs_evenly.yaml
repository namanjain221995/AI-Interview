slug: can_split_jobs_evenly
title: Even Job Split Across Workers
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Even Job Split Across Workers

  A nightly batch scheduler has a list of jobs, where `durations[i]` is the run time of job `i` in
  minutes, and a pool of `workers` identical workers. Every job must be given to **exactly one** worker
  (jobs cannot be split), and the operations team wants all workers to finish at the same moment, which
  means every worker must receive the **same total duration**.

  Because every duration is positive, this also means every worker receives at least one job.

  Return `true` if such an assignment exists, otherwise `false`.

  ### Example 1
  ```
  Input:  durations = [5, 7, 3, 4, 1, 6, 2], workers = 4
  Output: true
  Explanation: [7], [5, 2], [4, 3] and [6, 1] each total 7.
  ```

  ### Example 2
  ```
  Input:  durations = [6, 2, 4, 3, 3, 6], workers = 3
  Output: false
  Explanation: Each worker needs 8; both 6-minute jobs need a 2-minute partner and there is only one.
  ```

  ### Example 3
  ```
  Input:  durations = [10, 10], workers = 3
  Output: false
  ```

  ### Constraints
  - `1 <= durations.length <= 16`
  - `1 <= durations[i] <= 10^4`
  - `1 <= workers <= 16`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_split_jobs_evenly
  params:
    - {name: durations, type: "int[]"}
    - {name: workers, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def can_split_jobs_evenly(durations: list[int], workers: int) -> bool:
        total = sum(durations)
        if workers > len(durations) or total % workers != 0:
            return False
        target = total // workers
        jobs = sorted(durations, reverse=True)  # big jobs first fail fast
        if jobs[0] > target:
            return False
        loads = [0] * workers

        def assign(i: int) -> bool:
            if i == len(jobs):
                return True  # all loads equal target because the total matches
            tried: set[int] = set()
            for w in range(workers):
                load = loads[w]
                # Workers with the same current load are interchangeable: try one.
                if load + jobs[i] > target or load in tried:
                    continue
                tried.add(load)
                loads[w] += jobs[i]
                if assign(i + 1):
                    return True
                loads[w] -= jobs[i]
            return False

        return assign(0)
  javascript: |
    function canSplitJobsEvenly(durations, workers) {
      const total = durations.reduce((a, b) => a + b, 0);
      if (workers > durations.length || total % workers !== 0) return false;
      const target = total / workers;
      const jobs = [...durations].sort((a, b) => b - a);
      if (jobs[0] > target) return false;
      const loads = new Array(workers).fill(0);
      const assign = (i) => {
        if (i === jobs.length) return true;
        const tried = new Set();
        for (let w = 0; w < workers; w++) {
          const load = loads[w];
          if (load + jobs[i] > target || tried.has(load)) continue;
          tried.add(load);
          loads[w] += jobs[i];
          if (assign(i + 1)) return true;
          loads[w] -= jobs[i];
        }
        return false;
      };
      return assign(0);
    }
