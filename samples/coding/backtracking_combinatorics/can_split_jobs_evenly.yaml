  - {id: t9, hidden: true, args: [[4119, 9999, 7342, 6789, 2533, 9001, 6158, 10000, 3617, 8211, 4321, 6077, 1383, 2890, 4423, 9137], 4], expected: true, description: "Sixteen large durations with a valid 4-way split (24000 each)"}
  - {id: t10, hidden: true, args: [[33, 33, 28, 25, 35, 52, 31, 30, 45, 36, 12, 58, 21, 30, 16, 40], 5], expected: false, description: "Sixteen jobs, divisible total and no job above target, yet impossible: search worst case that needs pruning"}
expected_concepts:
  - "quick rejections: total not divisible, more workers than jobs, a job above the target"
  - "backtracking that assigns each job to a worker without exceeding the target"
  - "sorting jobs in decreasing order so dead ends appear early"
  - "symmetry pruning: skip workers whose current load was already tried for this job"
  - "alternative: bitmask dynamic programming over subsets of jobs in O(n * 2^n)"
optimal_complexity: {time: "O(n * 2^n) with bitmask DP (pruned backtracking is exponential in the worst case but fast in practice)", space: "O(2^n) for bitmask DP, O(n + k) for backtracking"}
rubric:
  excellent: "Applies the divisibility, job-count and largest-job checks, then uses backtracking with descending order and symmetry pruning (or bitmask DP over subsets), explains why greedy fails and analyses the exponential search versus O(n * 2^n) DP."
  good: "Correct backtracking that fills workers up to the target with at least one pruning rule; passes typical cases within the limits."
  weak: "Uses a greedy heuristic, ignores that every job must be assigned, or runs an unpruned search that times out on sixteen jobs."
  criteria:
    correctness: "All tests pass, including the greedy trap and the impossible case with a divisible total."
    efficiency: "Search is pruned (sorted order, interchangeable workers, early exits) or replaced by subset DP."
    code_quality: "Clear separation of the early checks and the recursive assignment, with state restored after each attempt."
    edge_cases: "One worker, as many workers as jobs, more workers than jobs and a job longer than the target."
    communication: "Explains why workers with equal loads are interchangeable and why that pruning is safe."
hints:
  - "First work out what total each worker must end up with, and which inputs can be rejected immediately because of it."
  - "Try to give jobs to workers one at a time with backtracking, never letting a worker exceed the target. Handling the longest jobs first and noticing that workers with identical loads are interchangeable cuts the search dramatically."
  - "Reject if the total is not divisible by the worker count, if there are more workers than jobs, or if any job exceeds the target. Sort the jobs from longest to shortest and recursively place job i on each worker whose load plus the job fits the target, skipping a worker whose current load equals one already tried for this job; undo the placement when the branch fails and succeed once every job is placed."
followups:
  - "How would you return the actual assignment instead of a boolean?"
  - "How does the bitmask dynamic programming version work, and when is it preferable?"
  - "If an exact split is impossible, how would you minimise the longest worker total?"
  - "Why does a greedy rule such as giving each job to the least-loaded worker fail?"
common_errors:
  - "Using a greedy assignment, which fails on inputs such as the greedy trap case."
  - "Forgetting to undo a worker's load when a branch fails."
  - "Not checking divisibility first and searching for an impossible target."
  - "Missing the symmetry pruning so the search explores identical states many times and times out."
