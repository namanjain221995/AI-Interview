expected_concepts:
  - depth-first search or breadth-first search that builds codes digit by digit
  - pruning digits outside 0-9 as soon as they appear
  - handling step 0 so each code is generated once
  - excluding a leading zero while allowing zeros later in the code
  - numeric sort of the final list
optimal_complexity: {time: O(9 * 2^(length-1)), space: O(length) besides the output}
rubric:
  excellent: Builds codes digit by digit from each non-zero first digit, branches only to the at most two valid next digits, deduplicates the step-0 case at the source, returns a numerically sorted list and explains why the output size bounds the work.
  good: Correct generation and ordering, but deduplicates with a set afterwards or needs a hint about the step-0 or leading-zero rule.
  weak: Scans every number with the given length and checks each digit pair (too slow for length 7 in an interview setting without discussion), emits duplicates for step 0, or allows a leading zero.
  criteria:
    correctness: All tests pass, including step 0, step 9 and the single-code cases.
    efficiency: Work proportional to the number of codes produced rather than to all 9 * 10^(length-1) candidates.
    code_quality: A small recursive or queue-based helper with clear names for the current value, last digit and digits remaining.
    edge_cases: Step 0 duplicates, leading zero, zeros later in the code and branches that leave the 0-9 range.
    communication: States the branching factor and how the leading-zero rule is enforced.
hints:
  - Instead of testing every number of the right length, think about building a valid code one digit at a time.
  - Once you know the last digit, there are at most two digits that may follow it. Start from each allowed first digit and only extend with digits that stay between 0 and 9.
  - Run a depth-first search from each first digit 1 to 9, carrying the value built so far and the last digit; add the last digit plus step and minus step when in range, treating step 0 as a single option, and sort the collected codes numerically at the end.
followups:
  - How many codes can there be at most for a given length, and how does that bound the running time?
  - Could you generate the codes already in ascending order without a final sort?
  - How would you count the codes for length 18 without listing them?
  - What changes if neighbouring digits may differ by at most step instead of exactly step?
common_errors:
  - Adding both last plus step and last minus step when step is 0, which duplicates every code.
  - Allowing 0 as the first digit, or forbidding 0 later in the code.
  - Building codes as strings and returning them without converting to integers, or sorting before deduplicating.
  - Brute-forcing every number with length digits and checking pairs, which does millions of checks for length 7.
