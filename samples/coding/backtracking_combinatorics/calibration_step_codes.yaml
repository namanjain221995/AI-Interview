version: 1
slug: calibration_step_codes
title: Calibration Step Codes
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Calibration Step Codes

  A lab's sensor rig is calibrated with numeric codes that technicians key in one digit at a time. To make
  typos easy to spot, a code is only accepted if it follows a fixed **step rule**:

  - it has exactly `length` digits and does **not** start with `0`;
  - every pair of neighbouring digits differs by exactly `step` (in either direction, so `1 -> 8` and
    `8 -> 1` are both a difference of 7).

  Given `length` and `step`, return **every** accepted code as an integer, sorted in **ascending** order
  and without duplicates. When `step` is `0`, every digit equals its neighbour, so each repeated-digit code
  appears exactly once.

  ### Example 1
  ```
  Input:  length = 3, step = 7
  Output: [181, 292, 707, 818, 929]
  Explanation: From 1 the only digit 7 away is 8, and from 8 the only one is 1, giving 181. A code may not
  start with 0, so 070 is not accepted, but 707 is.
  ```

  ### Example 2
  ```
  Input:  length = 2, step = 0
  Output: [11, 22, 33, 44, 55, 66, 77, 88, 99]
  ```

  ### Constraints
  - `2 <= length <= 7`
  - `0 <= step <= 9`
  - Codes are decimal; the answer is never empty for these limits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: calibration_step_codes
  params:
    - {name: length, type: int}
    - {name: step, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def calibration_step_codes(length: int, step: int) -> list[int]:
        codes: list[int] = []

        def extend(value: int, last: int, remaining: int) -> None:
            if remaining == 0:
                codes.append(value)
                return
            # With step 0 both directions are the same digit; visit it once.
            nexts = {last - step, last + step}
            for digit in sorted(nexts):
                if 0 <= digit <= 9:
                    extend(value * 10 + digit, digit, remaining - 1)

        for first in range(1, 10):
            extend(first, first, length - 1)
        return sorted(codes)
  javascript: |
    function calibrationStepCodes(length, step) {
      const codes = [];
      const extend = (value, last, remaining) => {
        if (remaining === 0) {
          codes.push(value);
          return;
        }
        const nexts = step === 0 ? [last] : [last - step, last + step];
        for (const digit of nexts) {
          if (digit >= 0 && digit <= 9) extend(value * 10 + digit, digit, remaining - 1);
        }
      };
      for (let first = 1; first <= 9; first++) extend(first, first, length - 1);
      return codes.sort((a, b) => a - b);
    }
