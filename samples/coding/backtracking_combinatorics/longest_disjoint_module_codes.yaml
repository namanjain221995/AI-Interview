version: 1
slug: longest_disjoint_module_codes
title: "Longest Disjoint Module Codes"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Disjoint Module Codes

  A firmware build system identifies each optional module by a short code of lowercase letters. Each
  letter stands for a hardware register bank that the module claims exclusively, so a firmware image
  can include a set of modules only if **no letter appears more than once across all of their codes
  together**. A code that repeats a letter inside itself claims the same bank twice and can never be
  included.

  Write `longest_disjoint_module_codes(codes)` that returns the largest possible **total length** of
  the codes in a valid selection:

  - Choose any subset of the modules (each module at most once, in any order).
  - The selection is valid when all letters across the chosen codes are distinct.
  - Two modules may have identical codes; they still count as separate modules (so at most one of them
    can be chosen).
  - Return `0` if no module can be chosen.

  ### Example 1
  ```
  Input:  codes = ["core", "net", "log", "auth"]
  Output: 8
  Explanation: "core" + "auth" uses 8 distinct letters. "net" clashes with both of them, and "log" clashes with "core" on 'o'.
  ```

  ### Example 2
  ```
  Input:  codes = ["ota", "boot", "io"]
  Output: 3
  Explanation: "boot" repeats 'o'; "ota" and "io" share 'o', so the best is "ota" alone.
  ```

  ### Constraints
  - `1 <= codes.length <= 16`
  - `1 <= codes[i].length <= 26`
  - `codes[i]` contains only lowercase letters `a-z`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_disjoint_module_codes
  params:
    - {name: codes, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_disjoint_module_codes(codes: list[str]) -> int:
        masks: list[int] = []
        for code in codes:
            mask = 0
            for ch in code:
                bit = 1 << (ord(ch) - ord("a"))
                if mask & bit:
                    mask = -1
                    break
                mask |= bit
            if mask != -1:
                masks.append(mask)
        best = 0

        def explore(index: int, used: int, total: int) -> None:
            nonlocal best
            best = max(best, total)
            for i in range(index, len(masks)):
                if used & masks[i] == 0:
                    explore(i + 1, used | masks[i], total + bin(masks[i]).count("1"))

        explore(0, 0, 0)
        return best
  javascript: |
    function longestDisjointModuleCodes(codes) {
      const masks = [];
      const sizes = [];
      for (const code of codes) {
        let mask = 0;
        let ok = true;
        for (const ch of code) {
          const bit = 1 << (ch.charCodeAt(0) - 97);
          if (mask & bit) {
            ok = false;
            break;
          }
          mask |= bit;
        }
        if (ok) {
          masks.push(mask);
          sizes.push(code.length);
        }
      }
      let best = 0;
      const explore = (index, used, total) => {
        if (total > best) best = total;
        for (let i = index; i < masks.length; i++) {
          if ((used & masks[i]) === 0) explore(i + 1, used | masks[i], total + sizes[i]);
        }
      };
      explore(0, 0, 0);
      return best;
    }
tests:
  - {id: t1, args: [["core", "net", "log", "auth"]], expected: 8, description: "Example 1 - best pair beats other combinations"}
  - {id: t2, args: [["ota", "boot", "io"]], expected: 3, description: "Example 2 - code with a repeated letter is never usable"}
  - {id: t3, hidden: true, args: [["aa"]], expected: 0, description: "Minimum size - the only code repeats a letter, answer 0"}
  - {id: t4, hidden: true, args: [["zyxwvutsrqponmlkjihgfedcba"]], expected: 26, description: "Single code using all 26 letters"}
  - {id: t5, hidden: true, args: [["ab", "ab", "cd"]], expected: 4, description: "Identical codes - only one copy can be chosen"}
  - {id: t6, hidden: true, args: [["abcdef", "abg", "cdh", "efi"]], expected: 9, description: "Greedy by longest code fails - three shorter codes beat the longest one"}
  - {id: t7, hidden: true, args: [["ab", "bc", "cd", "de", "ea"]], expected: 4, description: "Every pair of neighbours overlaps (cycle of shared letters) - best is two codes"}
  - {id: t8, hidden: true, args: [["abc", "abc", "abc", "def", "def"]], expected: 6, description: "Many duplicates of a few codes"}
  - {id: t9, hidden: true, args: [["a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o", "p"]], expected: 16, description: "Maximum count - 16 single-letter codes, all can be chosen"}
  - {id: t10, hidden: true, args: [["qwe", "rty", "uio", "pas", "dfg", "hjk", "lzx", "cvb", "nmq", "wer", "tyu", "iop", "asd", "fgh", "jkl", "zxcv"]], expected: 25, description: "Stress - 16 overlapping codes forcing broad search over subsets"}
expected_concepts:
  - "backtracking over include / exclude choices"
  - "bitmask representation of letter sets"
  - "filtering codes with internal repeats up front"
  - "pruning branches on letter conflicts"
optimal_complexity: {time: "O(2^n)", space: "O(n)"}
rubric:
  excellent: "Discards codes with repeated letters, encodes each remaining code as a 26-bit mask, backtracks over subsets combining masks with a constant-time overlap check, tracks the best total length and explains the 2^n bound and why greedy fails."
  good: "Correct backtracking over subsets using sets or strings for the overlap check, with minor prompting on the repeated-letter case or complexity."
  weak: "Greedy selection by length, concatenation without checking internal repeats, or counting distinct letters across all codes regardless of overlap."
  criteria:
    correctness: "Maximum total length over valid selections, 0 when nothing can be chosen."
    efficiency: "Constant-time conflict checks (bitmasks) and pruning of conflicting branches."
    code_quality: "Precomputed masks and a small recursive helper with clear parameters."
    edge_cases: "Codes with internal repeats, identical codes, a single code of 26 letters."
    communication: "Explains why a local greedy choice can be wrong and how the bitmask speeds up checks."
hints:
  - "For each module you either include it or leave it out; with at most 16 modules you can afford to explore those choices."
  - "Before searching, throw away any code that repeats a letter itself, and represent each remaining code as the set of letters it uses so checking two selections for overlap is cheap."
  - "Turn each valid code into a 26-bit mask. Recurse through the codes keeping the mask of letters already used and the total length; a code can be added only when its mask shares no bit with the used mask. Record the best total seen at every step of the search."
followups:
  - "How would you also return which modules were chosen?"
  - "How would you scale this to 60 modules (meet in the middle, memoising on the used mask)?"
  - "What if each module had a weight and you wanted the maximum weight instead of total length?"
common_errors:
  - "Keeping codes that repeat a letter internally."
  - "Choosing greedily by length or by fewest conflicts."
  - "Treating identical codes as one module, or allowing both copies."
  - "Returning the number of chosen modules instead of their total length."
