version: 1
slug: max_drone_route_yield
title: "Maximum Drone Route Yield"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_scientist, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Maximum Drone Route Yield

  An agricultural survey drone maps a field divided into a grid of plots. `field[r][c]` is the number
  of soil-sensor readings the drone can download while hovering over plot `(r, c)`; a value of `0`
  marks a no-fly plot (a building, a power line or a restricted area).

  Plan one flight that collects as many readings as possible:

  - The drone may start on **any** plot with a non-zero value.
  - From a plot it moves one step up, down, left or right (never diagonally) onto a plot with a
    non-zero value.
  - It never visits the same plot twice in one flight, and it may stop on any plot.
  - The flight collects the value of every plot it visits, including the starting plot.

  Write `max_drone_route_yield(field)` that returns the largest total a single flight can collect.
  Return `0` if every plot is a no-fly plot.

  ### Example 1
  ```
  Input:  field = [[3, 0, 7], [2, 5, 1], [0, 6, 0]]
  Output: 19
  Explanation: The best flight is 6 -> 5 -> 1 -> 7 = 19. Starting at 3 (3 -> 2 -> 5 -> 1 -> 7) collects only 18, because plot 5 can be passed only once, so the 6 branch and the 3 branch cannot both be visited.
  ```

  ### Example 2
  ```
  Input:  field = [[0, 0], [0, 0]]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  field = [[9, 0, 9]]
  Output: 9
  Explanation: The no-fly plot in the middle cannot be crossed, so one flight collects only one of the two plots.
  ```

  ### Constraints
  - `1 <= rows, cols <= 6` and every row has the same length
  - `0 <= field[r][c] <= 100`
  - At most `20` plots have a non-zero value.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_drone_route_yield
  params:
    - {name: field, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_drone_route_yield(field: list[list[int]]) -> int:
        rows, cols = len(field), len(field[0])
        grid = [row[:] for row in field]

        def fly(r: int, c: int) -> int:
            value = grid[r][c]
            grid[r][c] = 0  # mark as visited for this flight
            gained = 0
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                nr, nc = r + dr, c + dc
                if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] > 0:
                    gained = max(gained, fly(nr, nc))
            grid[r][c] = value
            return value + gained

        best = 0
        for r in range(rows):
            for c in range(cols):
                if grid[r][c] > 0:
                    best = max(best, fly(r, c))
        return best
  javascript: |
    function maxDroneRouteYield(field) {
      const rows = field.length;
      const cols = field[0].length;
      const grid = field.map((row) => [...row]);
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      const fly = (r, c) => {
        const value = grid[r][c];
        grid[r][c] = 0; // mark as visited for this flight
        let gained = 0;
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] > 0) {
            gained = Math.max(gained, fly(nr, nc));
          }
        }
        grid[r][c] = value;
        return value + gained;
      };
      let best = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] > 0) best = Math.max(best, fly(r, c));
        }
      }
      return best;
    }
