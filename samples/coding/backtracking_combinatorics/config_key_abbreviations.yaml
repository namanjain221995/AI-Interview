expected_concepts:
  - "backtracking with a hide/keep decision per character"
  - "carrying the length of the current hidden run and flushing it when a character is kept or at the end"
  - "equivalence with the 2^n subsets of positions (bitmask enumeration also works)"
  - "sorting the results by plain string comparison"
optimal_complexity: {time: "O(n * 2^n) to build, plus O(2^n * n log 2^n) to sort", space: "O(n) besides the output"}
rubric:
  excellent: "Generates each abbreviation from a hide/keep decision per position while carrying the current run length, never produces adjacent numbers, handles multi-digit runs, sorts as plain strings and explains the O(n * 2^n) output-bound cost."
  good: "Correct bitmask or backtracking solution that merges consecutive hidden characters into one count and sorts the output."
  weak: "Writes a separate digit for each hidden character, produces adjacent counts such as 11 for two hidden characters, misses the all-hidden or none-hidden case, or returns unsorted output."
  criteria:
    correctness: "Exactly 2^n abbreviations, every run maximal, sorted in ASCII order."
    efficiency: "Each abbreviation is built in linear time without generating and discarding invalid strings."
    code_quality: "The run length is flushed in one place and the recursion state is minimal."
    edge_cases: "Single character, all characters hidden (just the length) and repeated letters."
    communication: "Explains why each subset of hidden positions maps to exactly one abbreviation."
hints:
  - "Each character is either hidden or kept, so there are two choices per position. Think about what you must remember about the hidden characters you have just passed."
  - "Walk the word left to right carrying the length of the current run of hidden characters. When you keep a character, first write out that pending length (if any), then the character, and reset the run."
  - "Use a recursive helper with the current index and the pending run length: one branch hides the character by increasing the run, the other appends the pending number (when positive) followed by the character and resets the run to zero. At the end of the word append any pending number, record the result, and finally sort all results as plain strings."
followups:
  - "How would you check whether a given abbreviation matches a given key without generating all of them?"
  - "How would you find the shortest abbreviation that does not match any other key in a dictionary?"
  - "How would you produce the abbreviations already in sorted order without a final sort?"
  - "What changes if each run length had to be at least 2?"
common_errors:
  - "Emitting one count per hidden character so two hidden characters become 11 instead of 2."
  - "Forgetting to flush the pending run at the end of the word."
  - "Treating multi-digit run lengths as single characters when reasoning about lengths or sorting."
  - "Returning the abbreviations in generation order instead of ASCII order."
