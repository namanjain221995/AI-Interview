slug: config_key_abbreviations
title: Config Key Abbreviations
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Config Key Abbreviations

  A configuration CLI lets operators type shortened key names. A shortened form is made by choosing any
  set of character positions in the key to **hide** (possibly none, possibly all) and then replacing each
  **maximal run** of consecutive hidden characters with the run's length written in decimal. Visible
  characters stay as they are.

  For example, hiding positions 1 and 2 of `"cache"` gives `"c2he"`, and hiding positions 0, 3 and 4
  gives `"1ac2"`. Because every run is maximal, each set of hidden positions produces exactly one
  abbreviation, and a key of length `n` has exactly `2^n` abbreviations.

  To build the CLI's lookup table, return **all** abbreviations of `word`, sorted in ascending **ASCII
  order** (plain string comparison, where digits sort before lowercase letters).

  ### Example 1
  ```
  Input:  word = "db"
  Output: ["1b", "2", "d1", "db"]
  Explanation: Hide nothing (db), only d (1b), only b (d1) or both (2).
  ```

  ### Example 2
  ```
  Input:  word = "log"
  Output: ["1o1", "1og", "2g", "3", "l1g", "l2", "lo1", "log"]
  ```

  ### Constraints
  - `1 <= word.length <= 10`
  - `word` contains only lowercase letters `a`-`z`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: config_key_abbreviations
  params:
    - {name: word, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def config_key_abbreviations(word: str) -> list[str]:
        n = len(word)
        results: list[str] = []
        parts: list[str] = []

        def build(i: int, hidden_run: int) -> None:
            if i == n:
                results.append("".join(parts) + (str(hidden_run) if hidden_run else ""))
                return
            # Hide word[i]: extend the current run of hidden characters.
            build(i + 1, hidden_run + 1)
            # Keep word[i]: flush the pending run length, then the character.
            flushed = str(hidden_run) if hidden_run else ""
            parts.append(flushed + word[i])
            build(i + 1, 0)
            parts.pop()

        build(0, 0)
        return sorted(results)
  javascript: |
    function configKeyAbbreviations(word) {
      const n = word.length;
      const results = [];
      const parts = [];
      const build = (i, hiddenRun) => {
        if (i === n) {
          results.push(parts.join("") + (hiddenRun ? String(hiddenRun) : ""));
          return;
        }
        build(i + 1, hiddenRun + 1);
        parts.push((hiddenRun ? String(hiddenRun) : "") + word[i]);
        build(i + 1, 0);
        parts.pop();
      };
      build(0, 0);
      return results.sort();
    }
