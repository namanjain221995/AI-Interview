expected_concepts:
  - column heights for O(1) drops
  - checking only lines through the last piece
  - counting in both directions along each axis
  - ignored moves do not switch the turn
  - stopping at the first winning move
optimal_complexity: {time: "O(M * L), M moves and L the longest line through a cell", space: "O(rows * cols)"}
rubric:
  excellent: Tracks column heights, validates each move, checks the four axes through the placed piece counting both ways (so gap fills are caught), keeps the turn on ignored moves and returns at the first win with a clear complexity argument.
  good: Correct replay that rescans the whole board after every move, or needs a hint about counting in both directions from the new piece.
  weak: Switches turns on ignored moves, only counts forward from the new piece, misses one diagonal, or reports the last winner instead of the first.
  criteria:
    correctness: All tests pass, including ignored moves, diagonals and boards too small to win on.
    efficiency: Each move is checked in time proportional to the lines through the new piece.
    code_quality: Move validation, placement and the line check are separate, readable steps.
    edge_cases: Empty logs, out-of-range and full columns, boards smaller than four and late wins.
    communication: Explains why only lines through the newest piece can create the first win.
hints:
  - A new four-in-a-row can only appear through the piece that was just placed, so there is no need to rescan the board.
  - Keep the height of each column to find the landing cell instantly, and for each of the four line directions count matching pieces on both sides of the new piece.
  - "For each move skip it without changing the player if the column is out of range or full; otherwise place the piece at the column's height, then for each of the horizontal, vertical and two diagonal directions add one to the counts found walking forwards and backwards. Return the move index and player the first time any count reaches four, and alternate players only after a valid move."
followups:
  - How would you generalise to connect-k with k given as input?
  - How would you detect a draw as early as possible, before the board is full?
  - How would you make the check O(1) per move with extra bookkeeping?
  - How would you validate that a log never contains moves after the game ended?
common_errors:
  - Switching to the other player after an ignored move.
  - Counting only in one direction from the new piece, which misses gap fills.
  - Mixing up the row index of the lowest empty cell and placing pieces from the top.
  - Continuing the replay after the first win and returning a later winner.
