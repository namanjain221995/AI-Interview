time_limit_minutes: 25
prompt_markdown: |
  ## Column Drop First Winner

  A casual-games team is replaying client move logs to find out when each match was actually decided.
  The game is played on an upright board with `rows` rows and `cols` columns (columns numbered `0` to
  `cols - 1`), initially empty.

  Two players take turns, **player 1 first**. `moves[i]` is the column chosen by the player whose turn it
  is. The piece falls to the **lowest empty cell** of that column. Because logs come from untrusted
  clients, a move that targets a **full** column or a column **outside** `0..cols-1` is ignored: no piece
  is placed and it is **still the same player's turn**.

  A player connects four when a piece they just placed is part of at least **4** of their own pieces in
  a straight line: horizontally, vertically or along either diagonal.

  Return `[i, player]` for the **first** move (its 0-based index in `moves`) that makes its player
  connect four; later moves are irrelevant. If nobody ever connects four, return `[-1, 0]`.

  ### Example 1
  ```
  Input:  rows = 6, cols = 7, moves = [3, 4, 3, 4, 3, 4, 3, 2]
  Output: [6, 1]
  Explanation: Player 1 stacks column 3; the fourth piece lands at move index 6.
  ```

  ### Example 2
  ```
  Input:  rows = 2, cols = 4, moves = [0, 0, 0, 1, -1, 1, 2, 2, 3]
  Output: [8, 1]
  Explanation: Moves 2 (column 0 is full) and 4 (column -1) are ignored, so player 1 is still to move
               and plays columns 1, 2 and 3, completing the bottom row at index 8.
  ```

  ### Example 3
  ```
  Input:  rows = 5, cols = 6, moves = [0, 1, 2, 4, 3, 2, 1, 1, 0, 0]
  Output: [-1, 0]
  ```

  ### Constraints
  - `1 <= rows, cols <= 20`
  - `0 <= moves.length <= 500`
  - `-5 <= moves[i] <= 25`
languages: [python, javascript, typescript, java, go, cpp]
