  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def column_drop_first_winner(rows: int, cols: int, moves: list[int]) -> list[int]:
        heights = [0] * cols
        board = [[0] * cols for _ in range(rows)]
        player = 1
        for index, col in enumerate(moves):
            if col < 0 or col >= cols or heights[col] == rows:
                continue
            row = heights[col]
            heights[col] += 1
            board[row][col] = player
            for dr, dc in ((0, 1), (1, 0), (1, 1), (1, -1)):
                count = 1
                for sign in (1, -1):
                    r, c = row + dr * sign, col + dc * sign
                    while 0 <= r < rows and 0 <= c < cols and board[r][c] == player:
                        count += 1
                        r += dr * sign
                        c += dc * sign
                if count >= 4:
                    return [index, player]
            player = 3 - player
        return [-1, 0]
  javascript: |
    function columnDropFirstWinner(rows, cols, moves) {
      const heights = new Array(cols).fill(0);
      const board = Array.from({ length: rows }, () => new Array(cols).fill(0));
      let player = 1;
      const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
      for (let index = 0; index < moves.length; index++) {
        const col = moves[index];
        if (col < 0 || col >= cols || heights[col] === rows) continue;
        const row = heights[col]++;
        board[row][col] = player;
        for (const [dr, dc] of directions) {
          let count = 1;
          for (const sign of [1, -1]) {
            let r = row + dr * sign, c = col + dc * sign;
            while (r >= 0 && r < rows && c >= 0 && c < cols && board[r][c] === player) {
              count++;
              r += dr * sign;
              c += dc * sign;
            }
          }
          if (count >= 4) return [index, player];
        }
        player = 3 - player;
      }
      return [-1, 0];
    }
