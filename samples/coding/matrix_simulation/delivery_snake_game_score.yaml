expected_concepts:
  - "deque (or ring buffer) for the body with head and tail updates in O(1)"
  - "hash set or occupancy grid for O(1) collision checks"
  - "vacate the tail before the collision check when not collecting"
  - "parcels consumed in order, one current parcel at a time"
  - "game-over conditions: wall and body collision"
optimal_complexity: {time: "O(rows * cols + moves.length + parcels.length)", space: "O(rows * cols)"}
rubric:
  excellent: "Uses a deque plus an occupancy set or grid, removes the tail before the collision check only when not collecting, handles the length-2 reversal and stops at the first fatal move; explains each rule's order and the O(1) cost per move."
  good: "Correct result with a list body scanned for collisions (O(length) per move), or after a debugging pass on the tail-vacating rule."
  weak: "Checks collisions against the old tail, grows the train on every move, lets parcels be collected out of order, or keeps counting moves after the game ended."
  criteria:
    correctness: "All tests pass, including tail chasing, reversal at length 2 and running out of parcels."
    efficiency: "Each move costs O(1) with a deque and a set or grid; no scan of the body per move."
    code_quality: "Head, tail and occupancy updates are in one clear order with named direction offsets."
    edge_cases: "Empty moves, no parcels, the first move hitting the wall and moves after the game ends."
    communication: "Explains why the tail must be removed before the body check and why collecting keeps it."
hints:
  - "Model the train as an ordered sequence of cells from head to tail; every move adds a new head and, unless a parcel is collected, removes the tail."
  - "Keep a fast membership structure next to the sequence so a collision check does not scan the whole train, and be careful about when the tail leaves relative to that check."
  - "Use a double-ended queue for the train and a set or boolean grid for occupied cells; for each move compute the new head, stop if it is off the field, decide whether it is the current parcel, if not pop the tail and clear its cell, then stop if the head cell is still occupied, otherwise push the head, mark it and update the score and move count."
followups:
  - "How would you return the full body position after the last successful move?"
  - "What changes if the field wraps around at the edges instead of ending the game?"
  - "How would you design this as a class that processes one move at a time for a live game loop?"
  - "How would you generate the next parcel position fairly while never placing it on the train?"
common_errors:
  - "Checking for a body collision before removing the tail, which wrongly ends the game when chasing the tail."
  - "Removing the tail even when a parcel is collected, so the train never grows."
  - "Treating every parcel as present at once instead of one at a time in order."
  - "Counting the fatal move as a successful move."
