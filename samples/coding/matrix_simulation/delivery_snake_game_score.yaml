  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def snake_game_result(rows: int, cols: int, parcels: list[list[int]], moves: str) -> list[int]:
        steps = {"U": (-1, 0), "D": (1, 0), "L": (0, -1), "R": (0, 1)}
        train = deque([(0, 0)])  # head at the left end, tail at the right end
        occupied = {(0, 0)}
        score = successful = 0
        for move in moves:
            d_row, d_col = steps[move]
            head_row, head_col = train[0]
            cell = (head_row + d_row, head_col + d_col)
            if not (0 <= cell[0] < rows and 0 <= cell[1] < cols):
                break
            collecting = score < len(parcels) and parcels[score][0] == cell[0] and parcels[score][1] == cell[1]
            if not collecting:
                occupied.discard(train.pop())  # the tail moves first
            if cell in occupied:
                break
            train.appendleft(cell)
            occupied.add(cell)
            if collecting:
                score += 1
            successful += 1
        return [score, successful]
  javascript: |
    function snakeGameResult(rows, cols, parcels, moves) {
      const steps = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
      // The train lives in a ring buffer: head at index `head`, `length` cells back to the tail.
      const capacity = rows * cols + 1;
      const ring = new Array(capacity);
      let head = 0, length = 1;
      ring[0] = 0; // cells encoded as row * cols + col
      const occupied = new Uint8Array(rows * cols);
      occupied[0] = 1;
      let score = 0, successful = 0;
      for (const move of moves) {
        const [dRow, dCol] = steps[move];
        const row = Math.floor(ring[head] / cols) + dRow;
        const col = (ring[head] % cols) + dCol;
        if (row < 0 || row >= rows || col < 0 || col >= cols) break;
        const cell = row * cols + col;
        const collecting = score < parcels.length && parcels[score][0] === row && parcels[score][1] === col;
        if (!collecting) {
          const tail = ring[(head - length + 1 + capacity) % capacity];
          occupied[tail] = 0;
          length--;
        }
        if (occupied[cell]) break;
        head = (head + 1) % capacity;
        ring[head] = cell;
        length++;
        occupied[cell] = 1;
        if (collecting) score++;
        successful++;
      }
      return [score, successful];
    }
