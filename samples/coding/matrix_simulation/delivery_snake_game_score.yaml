time_limit_minutes: 25
prompt_markdown: |
  ## Delivery Train Game

  A mobile game team needs a deterministic replay checker for their "delivery train" mini-game. The
  playfield is a `rows x cols` grid. The train is a chain of cells; it starts with length `1` at cell
  `(0, 0)` (row `0` is the top, column `0` is the left edge).

  Parcels appear **one at a time**: `parcels[0]` is on the field from the start, and `parcels[i + 1]`
  appears only after `parcels[i]` has been collected. A parcel never appears on a cell occupied by the
  train at that moment. Once all parcels are collected, no more appear.

  The player's input is a string `moves` of `'U'`, `'D'`, `'L'` and `'R'` (up, down, left, right). For
  each move the head steps one cell in that direction:

  - If the new head cell is **outside the field**, the game ends.
  - If the new head cell holds the current parcel, the parcel is **collected**: the score goes up by `1`
    and the train grows by one cell (the tail stays where it is for this move).
  - Otherwise the tail cell is vacated in the same move, so the head **may** enter the cell the tail is
    leaving (this applies even to a train of length 2 that reverses direction).
  - If the new head cell is still occupied by the train after that, the head has hit the train's body and
    the game ends.

  A move that does not end the game is a **successful move**. Moves after the game has ended are
  ignored. Return `[score, successful_moves]`.

  ### Example 1
  ```
  Input:  rows = 3, cols = 4, parcels = [[0, 2], [1, 2], [2, 0]], moves = "RRDLDLLR"
  Output: [3, 6]
  Explanation: R, R (collect at (0, 2)), D (collect at (1, 2)), L, D, L (collect at (2, 0)); the
  seventh move would leave the field, so the game ends after 6 successful moves.
  ```

  ### Example 2
  ```
  Input:  rows = 3, cols = 3, parcels = [[0, 1], [0, 2], [1, 2], [1, 1]], moves = "RRDLUR"
  Output: [4, 4]
  Explanation: After four collections the train occupies (1, 1), (1, 2), (0, 2), (0, 1), (0, 0),
  head first. Moving up to (0, 1) hits the body: only the tail cell (0, 0) is vacated by that move.
  ```

  ### Example 3
  ```
  Input:  rows = 2, cols = 2, parcels = [[0, 1]], moves = "RDLURDLU"
  Output: [1, 8]
  Explanation: After collecting at (0, 1) the train has length 2 and chases its own tail around the
  2 x 2 field; every move enters the cell the tail is leaving, which is allowed.
  ```

  ### Constraints
  - `1 <= rows, cols <= 100`
  - `0 <= parcels.length <= 1000`, each parcel `[r, c]` has `0 <= r < rows`, `0 <= c < cols`
  - A parcel is never on the train when it appears (so `parcels[0]` is not `[0, 0]`).
  - `0 <= moves.length <= 10^4`, every character is one of `U`, `D`, `L`, `R`
languages: [python, javascript, typescript, java, go, cpp]
