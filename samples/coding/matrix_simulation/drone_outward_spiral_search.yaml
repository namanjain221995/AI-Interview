prompt_markdown: |
  ## Drone Outward Spiral Search

  A search-and-rescue drone surveys a field divided into a `rows x cols` grid of cells. Row `0` is the
  northern edge and column `0` is the western edge. The drone takes off above cell
  `(start_row, start_col)` facing **east** and flies an outward square spiral:

  - it flies straight segments of length `1, 1, 2, 2, 3, 3, 4, 4, ...` cells,
  - after each segment it turns **90 degrees clockwise** (east, then south, then west, then north, then
    east again, ...).

  The flight path ignores the field boundary: the drone may fly outside the field, but its camera only
  **records** cells that are inside the field. Each in-field cell is recorded the first time the drone
  is above it, and the start cell is recorded at take-off.

  Return the recorded cells as `[row, col]` pairs **in the order they are recorded**, beginning with the
  start cell and ending when all `rows * cols` cells have been recorded.

  ### Example 1
  ```
  Input:  rows = 3, cols = 3, start_row = 1, start_col = 1
  Output: [[1, 1], [1, 2], [2, 2], [2, 1], [2, 0], [1, 0], [0, 0], [0, 1], [0, 2]]
  Explanation: East 1, south 1, west 2 and north 2 record seven cells (start included); the first two steps of the
  eastward segment of length 3 record (0, 1) and (0, 2), which completes the field.
  ```

  ### Example 2
  ```
  Input:  rows = 2, cols = 4, start_row = 0, start_col = 2
  Output: [[0, 2], [0, 3], [1, 3], [1, 2], [1, 1], [0, 1], [1, 0], [0, 0]]
  Explanation: East to (0, 3), south to (1, 3), west along row 1 to (1, 1), then north through (0, 1)
  and out of the field. The next eastward, southward and westward segments stay outside the field
  (above row 0, along column 4, below row 1), and the northward segment of length 4 records (1, 0) and
  (0, 0).
  ```

  ### Constraints
  - `1 <= rows, cols <= 100`
  - `0 <= start_row < rows` and `0 <= start_col < cols`
