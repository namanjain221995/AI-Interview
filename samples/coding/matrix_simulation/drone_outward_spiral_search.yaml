reference_solutions:
  python: |
    def drone_spiral_visit_order(rows: int, cols: int, start_row: int, start_col: int) -> list[list[int]]:
        directions = [(0, 1), (1, 0), (0, -1), (-1, 0)]  # east, south, west, north
        row, col = start_row, start_col
        recorded = [[row, col]]
        total = rows * cols
        length, heading = 1, 0
        while len(recorded) < total:
            for _ in range(2):  # every segment length is flown twice
                d_row, d_col = directions[heading]
                for _ in range(length):
                    row += d_row
                    col += d_col
                    if 0 <= row < rows and 0 <= col < cols:
                        recorded.append([row, col])
                heading = (heading + 1) % 4
            length += 1
        return recorded
  javascript: |
    function droneSpiralVisitOrder(rows, cols, startRow, startCol) {
      const directions = [[0, 1], [1, 0], [0, -1], [-1, 0]];
      let row = startRow, col = startCol;
      const recorded = [[row, col]];
      const total = rows * cols;
      let length = 1, heading = 0;
      while (recorded.length < total) {
        for (let turn = 0; turn < 2; turn++) {
          const [dRow, dCol] = directions[heading];
          for (let step = 0; step < length; step++) {
            row += dRow;
            col += dCol;
            if (row >= 0 && row < rows && col >= 0 && col < cols) recorded.push([row, col]);
          }
          heading = (heading + 1) % 4;
        }
        length++;
      }
      return recorded;
    }
