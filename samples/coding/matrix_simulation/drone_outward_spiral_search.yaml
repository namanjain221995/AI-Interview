expected_concepts:
  - "direction vectors with a clockwise turn index"
  - "segment lengths growing by one every two turns"
  - "recording only in-bounds cells while flying out of bounds"
  - "termination once rows * cols cells are recorded"
  - "the spiral never revisits a cell, so no visited set is needed"
optimal_complexity: {time: "O(max(rows, cols)^2)", space: "O(1) beyond the output"}
rubric:
  excellent: "Simulates the spiral with a direction array and a length that grows every second segment, records only in-field cells, argues the spiral never revisits a cell so no visited set is needed and bounds the flight length by max(rows, cols)^2."
  good: "Correct simulation with a visited set or a slightly redundant termination check, found after tracing an example."
  weak: "Clamps the drone to the field, turns at the boundary like an inward spiral, or grows the segment length every turn."
  criteria:
    correctness: "All tests pass, including corner starts and single rows or columns."
    efficiency: "Flight length is O(max(rows, cols)^2) and each step is O(1)."
    code_quality: "Direction vectors and the turn index are clear; the segment-length rule is visible in the loop structure."
    edge_cases: "1 x 1 fields, starts on any corner or edge and fields much wider than tall."
    communication: "Traces the first few segments of an example aloud and explains why the loop terminates."
hints:
  - "Simulate the drone exactly as described, but keep the flight and the recording separate: the drone keeps flying even when it is outside the field."
  - "Keep a list of the four headings in clockwise order and a current segment length; the length only grows after every second segment, and each single step either records a cell or not."
  - "Loop while fewer than rows times cols cells are recorded; in each round fly the current length twice, turning clockwise after each segment, append a cell whenever the position is inside the field, and add one to the length after the pair; a square spiral never passes the same point twice, so no visited set is needed."
followups:
  - "How would you skip long out-of-field stretches without stepping through them one cell at a time?"
  - "What changes for a counter-clockwise spiral, or one that starts facing north?"
  - "How would you return only the k-th recorded cell without building the whole list?"
  - "Could you write the walk as a lazy generator so the drone can stop early when it finds its target?"
common_errors:
  - "Growing the segment length after every turn instead of every two turns."
  - "Stopping or turning at the field boundary instead of flying through it."
  - "Forgetting to record the start cell before the first move."
  - "Stopping as soon as the drone first leaves the field, assuming every cell has already been seen."
