role_tags: [backend, sre, data, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Cooling Zone Load Totals

  A server hall is laid out as a grid of nodes: `load[r][c]` is the number of requests the node in
  rack `r`, slot `c` served during the last minute. The hall's cooling ducts run diagonally, so one
  cooling zone covers every node whose rack number plus slot number is the same value `d`:

  - Zone 0 is just the node at rack 0, slot 0.
  - Zone 1 covers rack 0 slot 1 and rack 1 slot 0, and so on.
  - The last zone, `rows + cols - 2`, is just the bottom-right node.

  Return an array of length `rows + cols - 1` whose element at index `d` is the **total load** of zone
  `d`. Loads are large, so a zone total can exceed the 32-bit integer range; use 64-bit arithmetic.

  ### Example 1
  ```
  Input:  load = [[1, 2, 3], [4, 5, 6]]
  Output: [1, 6, 8, 6]
  Explanation: Zone 1 is 2 + 4 = 6 and zone 2 is 3 + 5 = 8.
  ```

  ### Example 2
  ```
  Input:  load = [[5], [7], [9]]
  Output: [5, 7, 9]
  ```

  ### Constraints
  - `1 <= rows, cols <= 200` where `rows = load.length` and `cols = load[i].length`
  - All rows have the same length.
  - `0 <= load[r][c] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: anti_diagonal_load_totals
  params:
    - {name: load, type: "int[][]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def anti_diagonal_load_totals(load: list[list[int]]) -> list[int]:
        rows, cols = len(load), len(load[0])
        totals = [0] * (rows + cols - 1)
        for r in range(rows):
            for c in range(cols):
                totals[r + c] += load[r][c]
        return totals
  javascript: |
    function antiDiagonalLoadTotals(load) {
      const rows = load.length;
      const cols = load[0].length;
      const totals = new Array(rows + cols - 1).fill(0);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          totals[r + c] += load[r][c];
        }
      }
      return totals;
    }
