expected_concepts:
  - "row plus column index as the zone key"
  - "single pass accumulation into an output array"
  - "64-bit accumulation to avoid overflow"
  - "O(rows * cols) time"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows + cols) for the output"}
rubric:
  excellent: "Spots that rack plus slot identifies the zone, accumulates every cell in one pass into a 64-bit array of the right length, and explains O(rows * cols) time and why 32-bit sums overflow."
  good: "Correct totals, perhaps walking each diagonal explicitly with start-cell arithmetic, and uses 64-bit sums after a prompt."
  weak: "Sums only the main diagonal, gets the output length wrong on rectangular grids, or overflows on large loads."
  criteria:
    correctness: "All tests pass, including single rows, single columns and maximum loads."
    efficiency: "Each cell is read once."
    code_quality: "Uses the index sum directly rather than complex per-diagonal boundary logic."
    edge_cases: "1 x 1 grids, zeros and sums above two billion."
    communication: "Explains the zone key and the overflow risk before coding."
hints:
  - "Look for a simple quantity computed from a node's rack and slot that is identical for every node in the same cooling zone."
  - "Rack plus slot is constant within a zone and ranges from zero to rows plus cols minus two, so it can index directly into the result array."
  - "Create a result array of length rows plus cols minus one filled with zeros (using a 64-bit type), visit every cell once and add its load to the entry at its rack plus slot index, then return the array."
followups:
  - "How would you return the zone with the highest total and break ties by the smallest zone number?"
  - "If the zones ran along the other diagonal direction, what key would you use?"
  - "How would you keep the totals current if individual node loads were updated in a stream?"
common_errors:
  - "Accumulating in a 32-bit integer so totals above about 2.1 billion overflow."
  - "Sizing the output as max(rows, cols) or rows times cols."
  - "Using rack minus slot, which groups the other diagonal direction."
  - "Walking diagonals with boundary arithmetic that skips cells on rectangular grids."
