  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def heat_grid_after_ticks(grid: list[list[int]], ticks: int) -> list[list[int]]:
        m, n = len(grid), len(grid[0])
        current = [row[:] for row in grid]
        for _ in range(ticks):
            nxt = [row[:] for row in current]
            for r in range(m):
                for c in range(n):
                    state = current[r][c]
                    if state == -1:
                        continue
                    hot = warm = 0
                    for dr in (-1, 0, 1):
                        for dc in (-1, 0, 1):
                            if dr == 0 and dc == 0:
                                continue
                            rr, cc = r + dr, c + dc
                            if 0 <= rr < m and 0 <= cc < n:
                                if current[rr][cc] == 2:
                                    hot += 1
                                elif current[rr][cc] == 1:
                                    warm += 1
                    if state == 0:
                        nxt[r][c] = 1 if hot >= 2 else 0
                    elif state == 1:
                        if hot + warm >= 3:
                            nxt[r][c] = 2
                        elif hot == 0 and warm <= 1:
                            nxt[r][c] = 0
                        else:
                            nxt[r][c] = 1
                    else:
                        nxt[r][c] = 2 if hot >= 4 else 1
            if nxt == current:
                break
            current = nxt
        return current
  javascript: |
    function heatGridAfterTicks(grid, ticks) {
      const m = grid.length, n = grid[0].length;
      let current = grid.map(row => row.slice());
      for (let t = 0; t < ticks; t++) {
        const next = current.map(row => row.slice());
        let changed = false;
        for (let r = 0; r < m; r++) {
          for (let c = 0; c < n; c++) {
            const state = current[r][c];
            if (state === -1) continue;
            let hot = 0, warm = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const rr = r + dr, cc = c + dc;
                if (rr < 0 || rr >= m || cc < 0 || cc >= n) continue;
                if (current[rr][cc] === 2) hot++;
                else if (current[rr][cc] === 1) warm++;
              }
            }
            let value;
            if (state === 0) value = hot >= 2 ? 1 : 0;
            else if (state === 1) value = hot + warm >= 3 ? 2 : (hot === 0 && warm <= 1 ? 0 : 1);
            else value = hot >= 4 ? 2 : 1;
            next[r][c] = value;
            if (value !== state) changed = true;
          }
        }
        if (!changed) break;
        current = next;
      }
      return current;
    }
