title: Rack Heat Propagation
difficulty: medium
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [sre, devops, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Rack Heat Propagation

  A capacity team models the thermal state of a data-centre floor as an `m x n` grid. Every cell holds one
  of four values:

  - `-1` a wall or pillar: it never changes and is **not** counted as a neighbour of any kind,
  - `0` a cool rack position,
  - `1` a warm rack position,
  - `2` a hot rack position.

  The model advances in **ticks**. In each tick every non-wall cell looks at its up to **8** neighbours
  (horizontal, vertical and diagonal; cells outside the grid do not exist) and **all cells update at the
  same time**, using only the states from before the tick:

  - A **cool** cell becomes warm if at least 2 of its neighbours are hot; otherwise it stays cool.
  - A **warm** cell becomes hot if at least 3 of its neighbours are warm or hot. Otherwise it becomes cool
    if it has no hot neighbour and at most 1 warm neighbour. Otherwise it stays warm.
  - A **hot** cell stays hot if at least 4 of its neighbours are hot; otherwise it drops to warm.

  Given the starting `grid` and the number of `ticks`, return the grid after that many ticks. Do not
  modify the input in a way that changes the result (return a grid with the same dimensions).

  ### Example 1
  ```
  Input:  grid = [[0, 2, 0], [2, 1, 0], [0, 0, 1]], ticks = 1
  Output: [[1, 1, 0], [1, 2, 0], [0, 0, 0]]
  Explanation: (0,0) is cool with 2 hot neighbours -> warm. The centre is warm with 3 warm-or-hot neighbours -> hot.
               The two hot cells see only each other as hot (1 hot neighbour) -> warm. (2,2) is warm with no hot and 1 warm neighbour -> cool.
  ```

  ### Example 2
  ```
  Input:  grid = [[2, 2, -1, 0], [2, 2, -1, 0], [0, 1, -1, 0]], ticks = 2
  Output: [[2, 2, -1, 0], [2, 2, -1, 0], [2, 2, -1, 0]]
  Explanation: Walls are never counted, so the right column stays cool.
  ```

  ### Constraints
  - `1 <= m, n <= 40`, where `m = grid.length` and `n = grid[i].length`
  - All rows have the same length.
  - `grid[i][j]` is one of `-1`, `0`, `1`, `2`
  - `0 <= ticks <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
