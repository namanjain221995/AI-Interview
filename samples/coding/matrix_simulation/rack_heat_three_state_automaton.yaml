expected_concepts:
  - double buffering so every cell reads the previous state
  - "8-neighbour counting with bounds checks"
  - rule precedence for the warm state
  - walls excluded from neighbour counts
  - early exit once the grid stops changing
optimal_complexity: {time: "O(ticks * m * n)", space: "O(m * n)"}
rubric:
  excellent: Uses a second buffer (or a state encoding) so updates are simultaneous, applies the warm-cell rules in the stated order, excludes walls from counts, notes the early exit when a tick changes nothing and states O(ticks * m * n) time.
  good: Correct double-buffered simulation with a separate neighbour-count helper, possibly after fixing one rule-order or bounds bug found by tracing an example.
  weak: Updates the grid in place so later cells see new states, counts walls or out-of-range cells, or applies the warm rules in the wrong order.
  criteria:
    correctness: All tests pass, including zero ticks, walls and many ticks.
    efficiency: Linear work per tick; optional early stop when the grid is stable.
    code_quality: Neighbour counting and the transition rules live in small, clearly named pieces.
    edge_cases: "1 x 1 grids, all-wall grids, zero ticks and cells on the border with fewer neighbours."
    communication: Explains why in-place updates break the model and traces one tick by hand.
hints:
  - Every cell must see the floor exactly as it was at the start of the tick, even if its neighbours change during the same tick.
  - Build the next grid in a separate buffer; for each non-wall cell count how many of its eight neighbours are hot and how many are warm, then apply the rule for its current state.
  - Copy the grid, loop over ticks, and for each cell skip walls, count hot and warm neighbours within bounds, then for a warm cell check the becomes-hot condition first and the becomes-cool condition second. Swap buffers after each tick, and stop early if a tick changes nothing because every later tick would be identical.
followups:
  - How would you update the grid in place with O(1) extra space by encoding old and new states together?
  - If the floor were huge but mostly cool, how would you only process cells near warm or hot ones?
  - How would you detect that the model has entered a repeating cycle and skip ahead to a very large tick count?
  - How would you split the simulation across worker threads?
common_errors:
  - Writing new states into the same grid that is still being read, so later cells use updated neighbours.
  - Counting walls, or treating out-of-range positions as cool neighbours that affect the result.
  - Checking the becomes-cool rule for a warm cell before the becomes-hot rule.
  - "Mutating the caller's grid when zero ticks are requested and returning an aliased grid."
