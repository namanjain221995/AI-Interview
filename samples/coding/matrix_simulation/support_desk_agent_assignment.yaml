expected_concepts:
  - "min-heap of idle agents by number"
  - "min-heap of busy agents by (free time, number)"
  - "releasing every busy agent whose free time is at most the arrival"
  - "waiting tickets start at the earliest free time with a number tie-break"
  - "O((n + k) log k) instead of scanning all agents per ticket"
optimal_complexity: {time: "O((n + k) log k)", space: "O(k)"}
rubric:
  excellent: "Uses two heaps (idle agents by number, busy agents by free time then number), releases all agents free by each arrival before choosing, handles the waiting case with the correct tie-break and explains the O((n + k) log k) cost."
  good: "Correct result with an O(n * k) scan over all agents, or a two-heap solution that needs a hint for the tie-break or the inclusive free time."
  weak: "Picks the earliest-freed agent even when lower-numbered agents are free, treats an agent ending exactly at the arrival as busy, or reorders tickets."
  criteria:
    correctness: "All tests pass, including ties, exact finish-at-arrival and single-agent queues."
    efficiency: "Heap operations per ticket rather than a scan of every agent."
    code_quality: "Idle and busy pools are clearly separated and the release step is a small loop before each assignment."
    edge_cases: "No tickets, more agents than tickets, simultaneous arrivals and equal free times."
    communication: "States the two selection rules precisely and checks them against the examples."
hints:
  - "At each arrival there are two kinds of agents: those already free and those still busy; the rule you apply depends on whether the first group is empty."
  - "Keep free agents in a structure ordered by agent number and busy agents in a structure ordered by when they become free, breaking ties by agent number, so both choices are cheap."
  - "Use two min-heaps: before each ticket, move every busy agent whose free time is at most the arrival into the idle heap; take the smallest idle number if any and start at the arrival, otherwise pop the busy heap's top and start at its free time; then push the agent back as busy until start plus duration."
followups:
  - "How would you assign tickets by priority instead of strictly in list order while keeping fairness?"
  - "How would you report each agent's total busy time and the longest wait any ticket had?"
  - "What changes if agents have different skill sets and only some can take certain tickets?"
  - "If tickets arrived as an unbounded stream, how would you bound memory?"
common_errors:
  - "Choosing the agent that became free earliest even when a lower-numbered agent is also free."
  - "Releasing only one busy agent per ticket instead of all agents free by the arrival."
  - "Using a strict comparison so an agent finishing exactly at the arrival is treated as busy."
  - "Breaking ties among busy agents by insertion order instead of agent number."
