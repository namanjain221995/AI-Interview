role_tags: [backend, support_engineer, platform, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Support Desk Ticket Assignment

  A support desk has `agents` agents numbered `0` to `agents - 1`; all of them are free at time `0`.
  Tickets arrive as `tickets[i] = [arrival, duration]`, listed in **non-decreasing order of arrival**.
  Each agent works on one ticket at a time, and the desk assigns tickets strictly **in list order**
  (ticket `i` is assigned before ticket `i + 1`, even if they arrive at the same time).

  When ticket `i` is assigned:

  - An agent is **free** at time `t` if every ticket it was given earlier has finished by `t` (an agent
    whose last ticket ends exactly at `t` is free at `t`).
  - If at least one agent is free at the ticket's arrival time, the ticket goes to the **lowest-numbered**
    free agent and starts at its arrival time.
  - Otherwise the ticket waits for the agent that becomes free **earliest** (ties go to the
    lowest-numbered agent) and starts at that moment.

  A ticket that starts at time `s` keeps its agent busy until `s + duration`.

  Return a list with one `[agent, start_time]` pair per ticket, in the same order as `tickets`. Return an
  empty list when there are no tickets.

  ### Example 1
  ```
  Input:  tickets = [[0, 5], [1, 2], [2, 3], [4, 1], [6, 2]], agents = 2
  Output: [[0, 0], [1, 1], [1, 3], [0, 5], [0, 6]]
  Explanation: Ticket 2 arrives at 2 while both agents are busy (until 5 and 3), so it waits for
  agent 1 and starts at 3. Ticket 3 arrives at 4; agent 0 frees first (at 5). At time 6 both agents are
  free, so ticket 4 goes to the lower number, agent 0.
  ```

  ### Example 2
  ```
  Input:  tickets = [[10, 4], [10, 4], [12, 1], [14, 2]], agents = 3
  Output: [[0, 10], [1, 10], [2, 12], [0, 14]]
  Explanation: At time 14 all three agents are free; agent 2 freed up first (at 13), but the rule picks
  the lowest-numbered free agent, agent 0.
  ```

  ### Constraints
  - `0 <= tickets.length <= 10^4`
  - `1 <= agents <= 10^4`
  - `0 <= arrival <= 10^8`, arrivals are non-decreasing
  - `1 <= duration <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
