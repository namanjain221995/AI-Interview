  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def assign_support_tickets(tickets: list[list[int]], agents: int) -> list[list[int]]:
        idle = list(range(agents))  # min-heap of free agent numbers
        busy: list[tuple[int, int]] = []  # min-heap of (free_time, agent)
        result: list[list[int]] = []
        for arrival, duration in tickets:
            # Release every agent that is free by this arrival.
            while busy and busy[0][0] <= arrival:
                _, agent = heapq.heappop(busy)
                heapq.heappush(idle, agent)
            if idle:
                agent = heapq.heappop(idle)
                start = arrival
            else:
                start, agent = heapq.heappop(busy)
            heapq.heappush(busy, (start + duration, agent))
            result.append([agent, start])
        return result
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(value) {
        const a = this.items;
        a.push(value);
        let i = a.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.less(a[i], a[parent])) break;
          [a[i], a[parent]] = [a[parent], a[i]];
          i = parent;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let best = i;
            if (l < a.length && this.less(a[l], a[best])) best = l;
            if (r < a.length && this.less(a[r], a[best])) best = r;
            if (best === i) break;
            [a[i], a[best]] = [a[best], a[i]];
            i = best;
          }
        }
        return top;
      }
    }

    function assignSupportTickets(tickets, agents) {
      const idle = new MinHeap((x, y) => x < y);
      for (let a = 0; a < agents; a++) idle.push(a);
      const busy = new MinHeap((x, y) => x[0] < y[0] || (x[0] === y[0] && x[1] < y[1]));
      const result = [];
      for (const [arrival, duration] of tickets) {
        while (busy.size > 0 && busy.peek()[0] <= arrival) idle.push(busy.pop()[1]);
        let agent, start;
        if (idle.size > 0) {
          agent = idle.pop();
          start = arrival;
        } else {
          [start, agent] = busy.pop();
        }
        busy.push([start + duration, agent]);
        result.push([agent, start]);
      }
      return result;
    }
