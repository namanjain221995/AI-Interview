version: 1
slug: board_track_jump_finish
title: Board Track With Jumps
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, frontend, mobile, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Board Track With Jumps

  A casual board game inside a mobile app moves a single token along a track of squares numbered `1` to `n`.
  The token starts on square `1`. Some squares start a **jump**: `jumps[i] = [from, to]` means that a token
  whose move ends on square `from` is sent straight to square `to`. A jump may go forward (a shortcut) or
  backward (a setback). No square starts more than one jump.

  The QA team wants a deterministic replay of a game from its recorded dice results `rolls`. Process the
  rolls in order; for each roll:

  1. If `position + roll > n`, the move is not allowed and the token stays where it is (the token must land
     on square `n` exactly). The roll still counts as used.
  2. Otherwise the token moves to `position + roll`, and if that square starts a jump, the token follows it.
     At most **one** jump is followed per roll: arriving on a square through a jump never triggers that
     square's own jump.
  3. As soon as the token is on square `n`, the game is over and all remaining rolls are ignored.

  Return `[final_square, rolls_used]`, where `rolls_used` is the number of rolls processed: up to and
  including the roll that brought the token to square `n`, or all of the rolls if it never got there.

  ### Example 1
  ```
  Input:  n = 10, jumps = [[3, 8], [9, 2]], rolls = [2, 4, 1, 3]
  Output: [5, 4]
  Explanation: 1 + 2 = 3 starts a jump to 8. 8 + 4 = 12 > 10, so the token stays on 8.
               8 + 1 = 9 starts a jump back to 2. 2 + 3 = 5. All 4 rolls were used.
  ```

  ### Example 2
  ```
  Input:  n = 6, jumps = [[4, 6]], rolls = [3, 5, 2]
  Output: [6, 1]
  Explanation: 1 + 3 = 4 jumps to 6, which ends the game after 1 roll; the rolls 5 and 2 are ignored.
  ```

  ### Constraints
  - `2 <= n <= 1000`
  - `0 <= jumps.length <= n - 2`
  - `jumps[i].length == 2`, `2 <= from <= n - 1`, `1 <= to <= n`, `from != to`
  - All `from` values are distinct.
  - `0 <= rolls.length <= 1000`
  - `1 <= rolls[i] <= 6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: board_track_finish
  params:
    - {name: n, type: "int"}
    - {name: jumps, type: "int[][]"}
    - {name: rolls, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def board_track_finish(n: int, jumps: list[list[int]], rolls: list[int]) -> list[int]:
        jump_to = {start: end for start, end in jumps}
        position, used = 1, 0
        for roll in rolls:
            if position == n:
                break
            used += 1
            if position + roll > n:
                continue
            position += roll
            position = jump_to.get(position, position)
        return [position, used]
  javascript: |
    function boardTrackFinish(n, jumps, rolls) {
      const jumpTo = new Map(jumps.map(([start, end]) => [start, end]));
      let position = 1;
      let used = 0;
      for (const roll of rolls) {
        if (position === n) break;
        used += 1;
        if (position + roll > n) continue;
        position += roll;
        if (jumpTo.has(position)) position = jumpTo.get(position);
      }
      return [position, used];
    }
