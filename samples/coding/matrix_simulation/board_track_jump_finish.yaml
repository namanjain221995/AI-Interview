  - {id: t4, hidden: true, args: [2, [], [1, 1, 1]], expected: [2, 1], description: "Smallest track finished by the first roll"}
  - {id: t5, hidden: true, args: [12, [[2, 5], [5, 11]], [1, 2, 1]], expected: [8, 3], description: "Jump lands on another jump start which must not chain; later move off it"}
  - {id: t6, hidden: true, args: [8, [], [6, 3, 2, 1, 1]], expected: [8, 4], description: "Repeated overshoots near the end before landing exactly"}
  - {id: t7, hidden: true, args: [9, [[7, 1], [3, 9]], [5, 1, 2]], expected: [9, 3], description: "Backward jump to square 1, then a forward jump straight to the finish"}
  - {id: t8, hidden: true, args: [7, [[6, 2]], [5, 6, 1, 5]], expected: [3, 4], description: "Never finishes - setback right before the end and an overshoot; all rolls are counted"}
  - {id: t9, hidden: true, args: [10, [[4, 7]], [3, 2, 6, 1]], expected: [10, 4], description: "Reaches the finish exactly on the last roll after an overshoot"}
  - {id: t10, hidden: true, args: [100, [[15, 10], [80, 86], [91, 58], [98, 39], [85, 60], [69, 89], [33, 52], [36, 52], [96, 16], [34, 35], [39, 29], [95, 41]], [3, 3, 3, 6, 6, 5, 2, 2, 5, 6, 6, 3, 2, 1, 6, 1, 1, 5, 3, 1, 1, 3, 2, 4, 4, 5, 4, 5, 1, 6, 6, 1, 5, 5, 6, 6, 3, 2, 1, 6, 4, 5, 6, 2, 3, 4, 5, 2, 4, 3, 5, 3, 1, 1, 1, 3, 3, 1, 1, 2]], expected: [100, 53], description: "100-square track with 12 random jumps and 60 rolls - finishes on roll 53 with 7 rolls left over"}
expected_concepts:
  - "hash map from jump start to destination"
  - "step-by-step state simulation"
  - "exact-landing rule (overshoot keeps the position)"
  - "early termination once the finish is reached"
  - "applying at most one jump per move"
optimal_complexity: {time: "O(j + r)", space: "O(j)"}
rubric:
  excellent: "Builds a lookup from jump start to destination, simulates each roll with the overshoot, single-jump and early-stop rules in the right order, counts rolls correctly and states O(j + r) time."
  good: "Correct simulation, possibly scanning the jump list for every move (O(j * r)) or needing a nudge on how rolls_used is counted."
  weak: "Chains jumps in a loop, moves past n or wraps around instead of staying, keeps counting rolls after the finish, or forgets that a jump can lead straight to n."
  criteria:
    correctness: "All tests pass, including empty rolls, a jump to the finish and a jump landing on another jump start."
    efficiency: "Constant-time jump lookup per roll; linear in the number of jumps plus rolls."
    code_quality: "The per-roll rules read in the same order as the specification, with an early break once the game is over."
    edge_cases: "No rolls, n equal to 2, repeated overshoots, backward jump to square 1 and a finish on the final roll."
    communication: "Clarifies whether jumps chain and how rolls_used is counted before coding."
hints:
  - "This is a straightforward replay: keep the current square and a counter of rolls used, and apply the rules to one roll at a time."
  - "Looking up whether a square starts a jump should not require scanning every jump on every move; store the jumps keyed by their starting square."
  - "For each roll, stop if the token is already on n, otherwise count the roll; if the target square would pass n do nothing more, else move there and, if the jump lookup has that square, replace the position with its destination exactly once; return the position and the count at the end."
followups:
  - "If the rolls were not given, how would you find the minimum number of rolls needed to reach square n?"
  - "How would you detect a sequence of rolls that can never finish because of setbacks?"
  - "What would change if several tokens took turns with the same list of rolls?"
common_errors:
  - "Following jumps repeatedly in a loop when the destination starts another jump."
  - "Moving the token past n (or bouncing back) instead of keeping it in place on an overshoot."
  - "Not counting the overshoot rolls, or counting rolls after the token reached n."
  - "Checking for the finish before applying the jump, so a jump to n is missed until the next roll."
