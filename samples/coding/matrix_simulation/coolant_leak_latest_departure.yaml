  - {id: t2, args: [["T...L", ".###.", "....E"]], expected: -1, description: "Example 2 - exit floods before the technician can reach it"}
  - {id: t3, args: [["T..#L", ".#.#.", "..E#."]], expected: 1000000000, description: "Example 3 - leak walled off from the technician and exit"}
