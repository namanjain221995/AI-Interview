  - {id: t5, hidden: true, args: [["T.E.L"]], expected: 0, description: "Arrives at the exit the same minute the coolant does - the exit exception makes w = 0 valid"}
  - {id: t6, hidden: true, args: [["LT.E"]], expected: 0, description: "Leak next to the start - the start floods at minute 1 so only w = 0 works"}
  - {id: t7, hidden: true, args: [["TLE"]], expected: -1, description: "Leak sits in the only corridor - no escape even without waiting"}
  - {id: t8, hidden: true, args: [["T.#E", "..#.", "L.#."]], expected: -1, description: "Exit unreachable because of walls - must return -1 not 1000000000"}
  - {id: t9, hidden: true, args: [["T", ".", ".", "E", ".", ".", "L"]], expected: 0, description: "Single column with the leak beyond the exit - tie at the exit gives 0"}
  - {id: t10, hidden: true, args: [["...##T.", "......E", ".......", ".##....", "#.....#", "..LL..."]], expected: 5, description: "Two leaks and two shortest last steps into the exit - only one stays ahead of the coolant so the bound flood(E) - dist(E) is reached"}
  - {id: t11, hidden: true, args: [["L.#.....", "..#.###.", "....#T#.", "###.#.#.", "E.....#."]], expected: 2, description: "Winding route through a maze with several branches"}
  - {id: t12, hidden: true, args: [["L.............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "...............T..............", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", "..............................", "#############################.", "..............................", ".#############################", ".............................E"]], expected: 230, description: "Stress - 29 x 30 serpentine corridor with the leak far behind the technician (large answer)"}
expected_concepts:
  - "multi-source BFS from every leak to get the minute each cell floods"
  - "time-aware BFS for the technician that only enters cells flooding strictly later"
  - "monotonicity: if a wait works, every shorter wait works, so binary search applies"
  - "special handling of the exit tie and of the never-floods (1000000000) case"
  - "O(rows * cols) refinement: flood minutes differ by at most one between neighbours, so only the last step into the exit decides between two candidates"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Separates the coolant (independent of the technician) from the escape check, computes flood minutes with one multi-source BFS, argues monotonicity and either binary searches the wait with a time-aware BFS in O(rows * cols * log(rows * cols)) or derives the O(rows * cols) answer of flood(E) - dist(E) or one less from the last step; handles the exit tie, the start cell flooding during the wait, unreachable exits and the 1000000000 case."
  good: "Correct multi-source BFS plus a feasibility BFS and a binary search (or a linear scan over waits on small inputs) that passes the main tests, with one edge case such as the exit tie or the unreachable exit fixed after prompting."
  weak: "Simulates minute by minute without a clear model, treats the exit like any other cell, ignores that the start cell can flood while waiting, or returns 1000000000 when the exit is simply unreachable."
  criteria:
    correctness: "All tests pass, including the exit tie, a leak blocking the only corridor, walls isolating the exit and two leaks reaching the exit from different sides."
    efficiency: "Flood minutes computed once; the binary search with an O(rows * cols) check is strong, the single-pass O(rows * cols) margin argument is the best."
    code_quality: "Separate helpers for the flood BFS and the feasibility check, named constants for the 1000000000 sentinel and a single direction table."
    edge_cases: "No leaks, leak sealed off by walls, exit unreachable, start cell flooding during the wait, single row or column floors, arriving at the exit together with the coolant."
    communication: "States the safety rule as arrival minute < flood minute (<= at the exit), explains why longer waits never help and why the binary search bounds are correct."
hints:
  - "The coolant's spread does not depend on anything the technician does. Work out when every cell floods first, then ask whether a longer wait can ever make escaping easier."
  - "One breadth-first search started from all leaks at once gives the flood minute of every cell. For a fixed wait, a second breadth-first search from the start can check escape by only entering a cell when the arrival minute is earlier than its flood minute (or equal, for the exit). Because a working wait means every shorter wait also works, you can binary search the wait."
  - "First check the wait of zero and return -1 if it fails; if the exit never floods return 1000000000; otherwise binary search the largest working wait between 0 and the exit's flood minute, remembering that the start cell itself must not flood during the wait. For an O(rows * cols) answer, note that the result is either the exit's flood minute minus the technician's shortest distance to it, or one less, depending on whether some neighbour on a shortest route into the exit floods later than the technician would reach it."
followups:
  - "Can you avoid the binary search? Why can the answer only be flood(E) - dist(E) or one less?"
  - "What changes if the technician may also stand still in the middle of the route?"
  - "How would you handle several exits, or a second technician who must also get out?"
  - "What if coolant spreads only every other minute, or walls slow it down instead of stopping it?"
common_errors:
  - "Forbidding the exit when the technician and the coolant arrive at the same minute, contrary to the exit exception."
  - "Forgetting that the starting cell can flood while the technician is still waiting on it."
  - "Returning 1000000000 whenever the exit never floods, even when walls make the exit unreachable."
  - "Re-running the coolant spread for every candidate wait or simulating every wait one by one up to a huge bound."
  - "Treating cells that flood at the arrival minute as safe for ordinary floor cells (off-by-one in the comparison)."
