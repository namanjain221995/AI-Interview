slug: coolant_leak_latest_departure
title: Coolant Leak Evacuation Delay
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, platform, backend, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Coolant Leak Evacuation Delay

  A coolant pipe has burst in a data-centre plant room. A technician on the floor wants to finish a safe
  shutdown of the rack they are standing at before walking out, and asks you how long they can afford
  to stay.

  The room is given as `floor`, one string per row, all of the same length:

  - `'#'` is a wall or a rack: neither coolant nor people can enter it;
  - `'.'` is open floor;
  - `'L'` is a leak source;
  - `'T'` is the technician's starting cell (open floor);
  - `'E'` is the exit door (open floor).

  **Coolant.** At minute `0` exactly the `'L'` cells are flooded. At every following minute, every cell
  that is up, down, left or right of a flooded cell and is not a wall becomes flooded too (this includes
  the `'T'` and `'E'` cells). Cells the coolant can never reach never flood.

  **Technician.** The technician stays on `'T'` for `w` whole minutes, so they occupy `'T'` at minutes
  `0, 1, ..., w`. After that they move exactly one cell up, down, left or right every minute, never into a
  wall: the `k`-th cell of their route is occupied at minute `w + k`. They are out as soon as they step
  onto `'E'`.

  **Safety rule.** The technician may only occupy a cell at minute `t` if that cell floods strictly
  **after** minute `t`. The one exception is the exit: stepping onto `'E'` at minute `t` still counts as
  escaping when `'E'` floods at minute `t` or later.

  Return the **largest** `w` for which the technician can still escape. Return `-1` if they cannot
  escape even with `w = 0`, and `1000000000` if they can escape no matter how large `w` is.

  ### Example 1
  ```
  Input:  floor = ["L.....", "......", ".#####", "...T.E"]
  Output: 5
  Explanation: The bottom row is only reachable down the left column, so 'T' floods at minute 6,
               the cell to its right at minute 7 and 'E' at minute 8. With w = 5 the technician is on
               'T' until minute 5, next to the exit at minute 6 and on 'E' at minute 7. With w = 6 they
               would still be on 'T' when it floods.
  ```

  ### Example 2
  ```
  Input:  floor = ["T...L", ".###.", "....E"]
  Output: -1
  Explanation: 'E' floods at minute 2, but the technician needs at least 6 moves to reach it.
  ```

  ### Example 3
  ```
  Input:  floor = ["T..#L", ".#.#.", "..E#."]
  Output: 1000000000
  Explanation: The column of walls keeps the coolant away from the technician and the exit forever.
  ```

  ### Constraints
  - `1 <= floor.length <= 300`
  - `1 <= floor[i].length <= 300`, and all rows have the same length
  - `floor[i][j]` is one of `'#'`, `'.'`, `'L'`, `'T'`, `'E'`
  - There is exactly one `'T'` and exactly one `'E'`; there may be any number of `'L'` cells, including none.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: latest_safe_departure
  params:
    - {name: floor, type: "string[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def latest_safe_departure(floor: list[str]) -> int:
        rows, cols = len(floor), len(floor[0])
        steps = ((1, 0), (-1, 0), (0, 1), (0, -1))
        inf = float("inf")

        def bfs(sources: list[tuple[int, int]]) -> list[list[float]]:
            dist = [[inf] * cols for _ in range(rows)]
            queue = deque()
            for r, c in sources:
                dist[r][c] = 0
                queue.append((r, c))
            while queue:
                r, c = queue.popleft()
                for dr, dc in steps:
                    nr, nc = r + dr, c + dc
                    if 0 <= nr < rows and 0 <= nc < cols and floor[nr][nc] != "#" and dist[nr][nc] == inf:
                        dist[nr][nc] = dist[r][c] + 1
                        queue.append((nr, nc))
            return dist

        cells = [(r, c) for r in range(rows) for c in range(cols)]
        leaks = [cell for cell in cells if floor[cell[0]][cell[1]] == "L"]
        start = next(cell for cell in cells if floor[cell[0]][cell[1]] == "T")
        er, ec = next(cell for cell in cells if floor[cell[0]][cell[1]] == "E")

        flood = bfs(leaks)        # minute each cell floods
        walk = bfs([start])       # shortest walking distance, ignoring the coolant
        if walk[er][ec] == inf:
            return -1
        if flood[er][ec] == inf:
            return 1_000_000_000

        # Flood minutes change by at most 1 between neighbours, so along a shortest
        # route the margin flood - walk never grows. The best possible wait arrives
        # at the exit exactly as it floods; it works only if the last cell before
        # the exit still has a strictly larger margin, otherwise wait one minute less.
        best = flood[er][ec] - walk[er][ec]
        if best < 0:
            return -1
        for dr, dc in steps:
            pr, pc = er + dr, ec + dc
            if (
                0 <= pr < rows
                and 0 <= pc < cols
                and floor[pr][pc] != "#"
                and walk[pr][pc] == walk[er][ec] - 1
                and flood[pr][pc] - walk[pr][pc] > best
            ):
                return int(best)
        return int(best) - 1
  javascript: |
    function latestSafeDeparture(floor) {
      const rows = floor.length;
      const cols = floor[0].length;
      const INF = Number.POSITIVE_INFINITY;
      const flood = Array.from({ length: rows }, () => new Array(cols).fill(INF));
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      let queue = [];
      let start = null;
      let exit = null;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ch = floor[r][c];
          if (ch === "L") {
            flood[r][c] = 0;
            queue.push([r, c]);
          } else if (ch === "T") {
            start = [r, c];
          } else if (ch === "E") {
            exit = [r, c];
          }
        }
      }
      for (let head = 0; head < queue.length; head++) {
        const [r, c] = queue[head];
        for (const [dr, dc] of steps) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && floor[nr][nc] !== "#" && flood[nr][nc] === INF) {
            flood[nr][nc] = flood[r][c] + 1;
            queue.push([nr, nc]);
          }
        }
      }
      const canEscape = (wait) => {
        if (flood[start[0]][start[1]] <= wait) return false;
        const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
        seen[start[0]][start[1]] = true;
        const frontier = [[start[0], start[1], wait]];
        for (let head = 0; head < frontier.length; head++) {
          const [r, c, t] = frontier[head];
          for (const [dr, dc] of steps) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || floor[nr][nc] === "#" || seen[nr][nc]) continue;
            if (nr === exit[0] && nc === exit[1]) {
              if (t + 1 <= flood[nr][nc]) return true;
              continue;
            }
            if (t + 1 < flood[nr][nc]) {
              seen[nr][nc] = true;
              frontier.push([nr, nc, t + 1]);
            }
          }
        }
        return false;
      };
      if (!canEscape(0)) return -1;
      const exitFlood = flood[exit[0]][exit[1]];
      if (exitFlood === INF) return 1000000000;
      let low = 0;
      let high = exitFlood;
      while (low < high) {
        const mid = Math.floor((low + high + 1) / 2);
        if (canEscape(mid)) low = mid;
        else high = mid - 1;
      }
      return low;
    }
