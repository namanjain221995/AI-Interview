reference_solutions:
  python: |
    def spiral_pick_sequence(rows: int, cols: int) -> list[list[int]]:
        labels = [[0] * cols for _ in range(rows)]
        top, bottom, left, right = 0, rows - 1, 0, cols - 1
        step = 1
        while top <= bottom and left <= right:
            for c in range(left, right + 1):
                labels[top][c] = step
                step += 1
            for r in range(top + 1, bottom + 1):
                labels[r][right] = step
                step += 1
            if top < bottom:
                for c in range(right - 1, left - 1, -1):
                    labels[bottom][c] = step
                    step += 1
            if left < right:
                for r in range(bottom - 1, top, -1):
                    labels[r][left] = step
                    step += 1
            top, bottom, left, right = top + 1, bottom - 1, left + 1, right - 1
        return labels
  javascript: |
    function spiralPickSequence(rows, cols) {
      const labels = Array.from({ length: rows }, () => new Array(cols).fill(0));
      let top = 0;
      let bottom = rows - 1;
      let left = 0;
      let right = cols - 1;
      let step = 1;
      while (top <= bottom && left <= right) {
        for (let c = left; c <= right; c++) labels[top][c] = step++;
        for (let r = top + 1; r <= bottom; r++) labels[r][right] = step++;
        if (top < bottom) {
          for (let c = right - 1; c >= left; c--) labels[bottom][c] = step++;
        }
        if (left < right) {
          for (let r = bottom - 1; r > top; r--) labels[r][left] = step++;
        }
        top++;
        bottom--;
        left++;
        right--;
      }
      return labels;
    }
