expected_concepts:
  - "layer-by-layer boundary traversal with four shrinking bounds"
  - "direction changes at ring corners"
  - "guarding single-row and single-column inner rings against double counting"
  - "O(rows * cols) time, each bin labelled once"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols) for the output grid"}
rubric:
  excellent: "Tracks top, bottom, left and right bounds (or a direction vector with turn-on-blocked logic), guards the degenerate single-row and single-column rings explicitly, explains why every bin is labelled exactly once and states O(rows * cols) time."
  good: "Produces the correct grid for square and rectangular shelves, possibly after fixing an off-by-one on a degenerate inner ring."
  weak: "Overwrites bins on a thin inner ring, only handles square grids, or loops forever when the bounds cross."
  criteria:
    correctness: "All tests pass, including 1 x 1, single-row, single-column and tall or wide rectangles."
    efficiency: "Every bin is written once; no repeated scans of the grid."
    code_quality: "The four legs of a ring are clearly separated and the bounds update in one place."
    edge_cases: "Inner rings that collapse to one row or one column, and a single bin."
    communication: "Explains the loop invariant on the bounds and how the counter advances."
hints:
  - "Think of the shelf as nested rectangular rings and label one complete ring before moving inward."
  - "Keep four boundaries for the current ring (top row, bottom row, left column, right column), walk its four sides with a running counter and then shrink every boundary by one."
  - "Inside the loop, fill the top row left to right and the right column top to bottom; only fill the bottom row right to left if the top and bottom rows differ, and only fill the left column bottom to top if the left and right columns differ, otherwise a one-row or one-column ring is labelled twice."
followups:
  - "How would you instead return the bin ids in route order for a grid that is already labelled?"
  - "Can you compute the sticker number of a single bin in O(1) without building the grid?"
  - "How would the code change for a counterclockwise route starting at the top-right bin?"
common_errors:
  - "Labelling the bottom row or left column of a single-row or single-column inner ring a second time."
  - "Stopping when top equals bottom and missing the last row of an odd-height shelf."
  - "Swapping rows and columns so only square shelves work."
  - "Starting each inner ring at the wrong corner."
