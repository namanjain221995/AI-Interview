prompt_markdown: |
  ## Spiral Pick Sequence Labels

  A fulfilment centre is installing a new shelf unit with `rows x cols` bins. Pickers on this unit
  always walk the same ring-by-ring route, so before go-live the operations team prints a sticker for
  every bin showing **its position in the route** (1 for the first bin visited, 2 for the second, and
  so on).

  The route works like this:

  - Start at the top-left bin (row 0, column 0) and walk the **outer ring clockwise**: right along the
    top row, down the right column, left along the bottom row, then up the left column.
  - When the outer ring is finished, continue with the next ring inside it, again starting at its
    top-left bin and going clockwise, and so on until every bin has been visited **exactly once**.
  - A ring that is only one row tall or one column wide is simply walked once from its start to its end
    (rightwards for a row, downwards for a column).

  Return a `rows x cols` grid where the value at row `r`, column `c` is the sticker number of that bin.

  ### Example 1
  ```
  Input:  rows = 3, cols = 4
  Output: [[1, 2, 3, 4], [10, 11, 12, 5], [9, 8, 7, 6]]
  Explanation: The outer ring takes stickers 1 to 10; the inner ring is the single row 11, 12.
  ```

  ### Example 2
  ```
  Input:  rows = 4, cols = 1
  Output: [[1], [2], [3], [4]]
  ```

  ### Constraints
  - `1 <= rows <= 30`
  - `1 <= cols <= 30`
languages: [python, javascript, typescript, java, go, cpp]
