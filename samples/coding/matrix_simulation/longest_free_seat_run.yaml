expected_concepts:
  - "run-length scan resetting at booked seats and at each new row"
  - "tracking the start column of the current run"
  - "strict comparison to keep the earliest tie"
  - "O(rows * cols) time, O(1) extra space"
optimal_complexity: {time: "O(rows * cols)", space: O(1)}
rubric:
  excellent: "Scans each row once with a running length and start column, resets at booked seats and new rows, updates the best only on a strictly longer run so ties resolve to the smallest row and column, handles the no-free-seat sentinel and states O(rows * cols) time."
  good: "Correct result, perhaps after fixing tie-breaking or a run that ends at the last seat of a row."
  weak: "Lets runs continue across rows, uses a non-strict comparison so the last tie wins, or forgets the sentinel."
  criteria:
    correctness: "All tests pass, including fully booked halls, fully free halls and ties."
    efficiency: "Single pass over the grid."
    code_quality: "Run state is reset in one obvious place; the tie-breaking rule is visible in the comparison."
    edge_cases: "Runs ending at the end of a row, single seats and single-column halls."
    communication: "States the tie-breaking rule and why the comparison is strict."
hints:
  - "Look at one row at a time and keep track of the current stretch of free seats as you move from left to right."
  - "Keep the length of the current stretch and where it started; a booked seat or the start of a new row ends the stretch, and you compare against the best block found so far."
  - "Visit rows in order and columns left to right; on a free seat start a new stretch if the length is zero, then increase it and replace the best answer only if the stretch is strictly longer, so earlier blocks win ties; on a booked seat reset the length, and return the best triple or minus one, minus one, zero if it never changed."
followups:
  - "How would you return every block of the maximum length instead of one?"
  - "How would you answer many queries of the form 'is there a free block of length k in row r' as bookings change?"
  - "What changes if a block could wrap from the end of one row to the start of the next?"
common_errors:
  - "Using greater-than-or-equal, which returns the last tie instead of the first."
  - "Not resetting the run at the start of each row, so a block spans two rows."
  - "Updating the best only when a booked seat is reached, missing runs that end at the row's last seat."
  - "Returning the end column instead of the start column."
