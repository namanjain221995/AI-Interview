reference_solutions:
  python: |
    def rotate_display_rings(grid: list[list[int]], k: int) -> list[list[int]]:
        rows, cols = len(grid), len(grid[0])
        result = [row[:] for row in grid]
        layer = 0
        while layer < rows - 1 - layer and layer < cols - 1 - layer:
            top, left = layer, layer
            bottom, right = rows - 1 - layer, cols - 1 - layer
            # Ring cells in clockwise order starting at the top-left corner.
            cells = [(top, c) for c in range(left, right + 1)]
            cells += [(r, right) for r in range(top + 1, bottom + 1)]
            cells += [(bottom, c) for c in range(right - 1, left - 1, -1)]
            cells += [(r, left) for r in range(bottom - 1, top, -1)]
            values = [grid[r][c] for r, c in cells]
            length = len(cells)
            shift = k % length
            # Counterclockwise by one: each position takes the value of the next clockwise position.
            for i, (r, c) in enumerate(cells):
                result[r][c] = values[(i + shift) % length]
            layer += 1
        return result
  javascript: |
    function rotateDisplayRings(grid, k) {
      const rows = grid.length;
      const cols = grid[0].length;
      const result = grid.map((row) => row.slice());
      for (let layer = 0; layer < rows - 1 - layer && layer < cols - 1 - layer; layer++) {
        const top = layer;
        const left = layer;
        const bottom = rows - 1 - layer;
        const right = cols - 1 - layer;
        const cells = [];
        for (let c = left; c <= right; c++) cells.push([top, c]);
        for (let r = top + 1; r <= bottom; r++) cells.push([r, right]);
        for (let c = right - 1; c >= left; c--) cells.push([bottom, c]);
        for (let r = bottom - 1; r > top; r--) cells.push([r, left]);
        const values = cells.map(([r, c]) => grid[r][c]);
        const length = cells.length;
        const shift = k % length;
        cells.forEach(([r, c], i) => {
          result[r][c] = values[(i + shift) % length];
        });
      }
      return result;
    }
