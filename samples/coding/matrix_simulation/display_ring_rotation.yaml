expected_concepts:
  - "peeling concentric layers with top, bottom, left and right bounds"
  - "flattening a ring into a list in a fixed traversal order"
  - "reducing k modulo each ring's length"
  - "rotating a list by an offset and writing it back"
  - "stopping when the remaining middle is a single row or column"
optimal_complexity: {time: "O(m * n)", space: "O(m + n) per ring buffer plus the output grid"}
rubric:
  excellent: "Extracts each ring in one consistent order, reduces k modulo that ring's own length, writes values back with the correct direction, stops at single-row or single-column middles and explains O(m * n) time independent of k."
  good: "Correct result after debugging the direction or corner handling, with k reduced modulo the ring length."
  weak: "Simulates k frames one by one, reduces k by the outer ring length only, double counts corners, rotates clockwise, or rotates a degenerate middle row or column."
  criteria:
    correctness: "All tests pass, including k = 0, huge k, single rows or columns and odd dimensions with fixed middles."
    efficiency: "Linear in the board size regardless of k; each cell is read and written once."
    code_quality: "Ring traversal is written once and reused for reading and writing, with clear bound variables."
    edge_cases: "1 x 1, 1 x n, m x 1, 2 x n, odd sizes with a fixed centre and k a multiple of a ring length."
    communication: "Pins down the direction convention with a small example and explains why each ring needs its own modulo."
hints:
  - "Treat each ring independently: if you could lay one ring out as a straight list, rotating it would just be a shift of that list."
  - "Walk each ring once in a fixed order (for example clockwise from its top-left corner) to collect its cells, then the rotation is a shift of the collected values by k reduced modulo that ring's own length."
  - "For layer d use top and left equal to d and bottom and right as the opposite borders minus d, continue only while top is above bottom and left is before right, list the ring positions clockwise without repeating corners, and write into position i the value collected at index i plus k mod length, wrapped, which moves every value one step counterclockwise per frame."
followups:
  - "How would you rotate in place without an extra list per ring?"
  - "How would the code change for clockwise rotation, or for a different k per ring?"
  - "If the board refreshed 60 times per second, how would you render frame t directly without storing every frame?"
common_errors:
  - "Including the corner cells twice when collecting a ring."
  - "Reducing every ring by the outer ring's length instead of its own length."
  - "Rotating clockwise (shifting the wrong way) because the direction was not checked on a small example."
  - "Treating a single leftover row or column as a ring and reversing or rotating it."
