  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def match_cascade_settle(board: list[list[int]]) -> list[list[int]]:
        m, n = len(board), len(board[0])
        grid = [row[:] for row in board]
        while True:
            marked: set[tuple[int, int]] = set()
            for r in range(m):
                c = 0
                while c < n:
                    end = c
                    while end + 1 < n and grid[r][end + 1] == grid[r][c]:
                        end += 1
                    if grid[r][c] > 0 and end - c + 1 >= 3:
                        marked.update((r, k) for k in range(c, end + 1))
                    c = end + 1
            for c in range(n):
                r = 0
                while r < m:
                    end = r
                    while end + 1 < m and grid[end + 1][c] == grid[r][c]:
                        end += 1
                    if grid[r][c] > 0 and end - r + 1 >= 3:
                        marked.update((k, c) for k in range(r, end + 1))
                    r = end + 1
            if not marked:
                return grid
            for r, c in marked:
                grid[r][c] = 0
            for c in range(n):
                write = m - 1
                for r in range(m - 1, -1, -1):
                    value = grid[r][c]
                    if value == -1:
                        write = r - 1
                    elif value > 0:
                        grid[r][c] = 0
                        grid[write][c] = value
                        write -= 1
  javascript: |
    function matchCascadeSettle(board) {
      const m = board.length, n = board[0].length;
      const grid = board.map(row => row.slice());
      while (true) {
        const marked = Array.from({ length: m }, () => new Array(n).fill(false));
        let any = false;
        for (let r = 0; r < m; r++) {
          let c = 0;
          while (c < n) {
            let end = c;
            while (end + 1 < n && grid[r][end + 1] === grid[r][c]) end++;
            if (grid[r][c] > 0 && end - c + 1 >= 3) {
              for (let k = c; k <= end; k++) marked[r][k] = true;
              any = true;
            }
            c = end + 1;
          }
        }
        for (let c = 0; c < n; c++) {
          let r = 0;
          while (r < m) {
            let end = r;
            while (end + 1 < m && grid[end + 1][c] === grid[r][c]) end++;
            if (grid[r][c] > 0 && end - r + 1 >= 3) {
              for (let k = r; k <= end; k++) marked[k][c] = true;
              any = true;
            }
            r = end + 1;
          }
        }
        if (!any) return grid;
        for (let r = 0; r < m; r++) for (let c = 0; c < n; c++) if (marked[r][c]) grid[r][c] = 0;
        for (let c = 0; c < n; c++) {
          let write = m - 1;
          for (let r = m - 1; r >= 0; r--) {
            const value = grid[r][c];
            if (value === -1) write = r - 1;
            else if (value > 0) {
              grid[r][c] = 0;
              grid[write][c] = value;
              write--;
            }
          }
        }
      }
    }
