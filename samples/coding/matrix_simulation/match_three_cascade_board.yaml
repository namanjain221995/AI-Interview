expected_concepts:
  - mark all runs before clearing anything
  - run detection in rows and columns
  - column compaction with a write pointer
  - brackets split columns into independent segments
  - repeat until a round clears nothing
optimal_complexity: {time: "O(R * m * n), R rounds (at most m * n / 3)", space: "O(m * n)"}
rubric:
  excellent: Marks every run in a separate pass before clearing, compacts each column segment between brackets with a write pointer, loops until nothing is cleared, and bounds the number of rounds because every round removes at least three tiles.
  good: Correct resolver that rebuilds columns with temporary lists, or needs a hint about brackets resetting the landing position.
  weak: Clears runs while still scanning so overlapping runs are missed, lets tiles fall through brackets, matches empty cells or brackets, or stops after one round.
  criteria:
    correctness: All tests pass, including overlaps, brackets and multi-round chains.
    efficiency: Each round is linear in the board size and the round count is bounded by the tile count.
    code_quality: Mark, clear and drop are separate functions or clearly separated blocks.
    edge_cases: "1 x 1 boards, runs longer than three, runs interrupted by brackets and fully cleared boards."
    communication: Explains why marking must happen before clearing and how brackets change the drop step.
hints:
  - Split each round into three separate phases - find runs, clear them, let tiles fall - and repeat until the find phase finds nothing.
  - Record the cells to clear in a separate marking structure while scanning every row and every column, so overlapping horizontal and vertical runs are all caught before anything changes.
  - For the drop, walk each column from the bottom up with a write position that starts at the bottom row; a tile moves to the write position, which then moves up one, and a bracket resets the write position to the cell just above the bracket. Stop the outer loop when a round marks no cells.
followups:
  - How would you avoid rescanning the whole board after each drop and only check cells that moved?
  - How would you score combos where later rounds are worth more?
  - How would you refill empty cells from the top with new tiles from a deterministic generator?
  - How would you check whether any single swap on a settled board can create a match?
common_errors:
  - Clearing a run as soon as it is found so a crossing run in the other direction is missed.
  - Letting tiles fall through brackets or moving the brackets themselves.
  - Counting runs of empty cells or brackets as matches.
  - Stopping after the first round instead of repeating until stable.
