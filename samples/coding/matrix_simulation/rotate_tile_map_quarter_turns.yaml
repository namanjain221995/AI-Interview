time_limit_minutes: 15
prompt_markdown: |
  ## Rotate a Tile Map

  A 2D level editor stores each room as a rectangular grid of tile ids, `tiles[r][c]`, with row 0 at
  the top. Designers can press the rotate button many times, and scripted tools sometimes send very
  large rotation counts, so the editor receives a single signed integer `quarter_turns`:

  - A positive value rotates the room by `quarter_turns` x 90 degrees **clockwise**.
  - A negative value rotates it by `|quarter_turns|` x 90 degrees **counterclockwise**.
  - Zero leaves the room as it is.

  Return the rotated room as a **new** grid. After an odd number of net quarter turns the room has its
  row and column counts swapped (a room that was `m` rows by `n` columns becomes `n` rows by `m`
  columns). Tile ids are arbitrary integers that may repeat; move them, never change them.

  ### Example 1
  ```
  Input:  tiles = [[1, 2, 3], [4, 5, 6]], quarter_turns = 1
  Output: [[4, 1], [5, 2], [6, 3]]
  Explanation: One clockwise turn: the left column [1, 4] read bottom-up becomes the first row.
  ```

  ### Example 2
  ```
  Input:  tiles = [[1, 2, 3], [4, 5, 6]], quarter_turns = -1
  Output: [[3, 6], [2, 5], [1, 4]]
  ```

  ### Example 3
  ```
  Input:  tiles = [[7, 8], [9, 10]], quarter_turns = 6
  Output: [[10, 9], [8, 7]]
  Explanation: Six clockwise quarter turns are the same as one half turn.
  ```

  ### Constraints
  - `1 <= m, n <= 100` where `m = tiles.length` and `n = tiles[i].length`
  - All rows have the same length.
  - `-10^9 <= tiles[i][j] <= 10^9`
  - `-10^9 <= quarter_turns <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rotate_tile_map
  params:
    - {name: tiles, type: "int[][]"}
    - {name: quarter_turns, type: int}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def rotate_tile_map(tiles: list[list[int]], quarter_turns: int) -> list[list[int]]:
        turns = quarter_turns % 4  # Python's modulo is already non-negative
        rows, cols = len(tiles), len(tiles[0])
        if turns == 0:
            return [row[:] for row in tiles]
        if turns == 2:
            return [[tiles[rows - 1 - r][cols - 1 - c] for c in range(cols)] for r in range(rows)]
        if turns == 1:
            return [[tiles[rows - 1 - c][r] for c in range(rows)] for r in range(cols)]
        return [[tiles[c][cols - 1 - r] for c in range(rows)] for r in range(cols)]
  javascript: |
    function rotateTileMap(tiles, quarterTurns) {
      const turns = ((quarterTurns % 4) + 4) % 4;
      const rows = tiles.length;
      const cols = tiles[0].length;
      if (turns === 0) return tiles.map((row) => row.slice());
      if (turns === 2) {
        return tiles.map((_, r) => tiles[rows - 1 - r].slice().reverse());
      }
      const result = [];
      for (let r = 0; r < cols; r++) {
        const row = [];
        for (let c = 0; c < rows; c++) {
          row.push(turns === 1 ? tiles[rows - 1 - c][r] : tiles[c][cols - 1 - r]);
        }
        result.push(row);
      }
      return result;
    }
