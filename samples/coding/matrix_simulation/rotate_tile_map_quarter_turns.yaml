expected_concepts:
  - "reducing the turn count modulo 4, including negative counts"
  - "index mapping for 90, 180 and 270 degree rotations"
  - "swapping row and column counts on odd turns"
  - "O(m * n) time with no repeated rotation loops"
optimal_complexity: {time: "O(m * n)", space: "O(m * n) for the new grid"}
rubric:
  excellent: "Normalises the count to 0-3 with a non-negative modulo, writes one direct index formula per case (or applies a single 90 degree helper at most three times), handles rectangular grids and explains O(m * n) time independent of the turn count."
  good: "Correct for all tests, perhaps after fixing negative modulo or a row/column swap on rectangular maps."
  weak: "Loops quarter_turns times, assumes a square grid, or gets the direction of negative turns wrong."
  criteria:
    correctness: "All tests pass, including huge and negative turn counts and single-row or single-column maps."
    efficiency: "Work is proportional to the grid size, never to the size of quarter_turns."
    code_quality: "Rotation formulas are clearly named or derived from one helper; the input is not mutated."
    edge_cases: "1 x 1 maps, zero turns returning an equal copy, and counts that are multiples of four."
    communication: "Explains why a counterclockwise turn equals three clockwise turns."
hints:
  - "Rotating four quarter turns in the same direction brings the room back to where it started, so only a small number of distinct outcomes exist."
  - "Reduce the count to a value from zero to three, remembering that a counterclockwise turn is the same as three clockwise turns and that some languages return negative remainders."
  - "For one clockwise turn the new grid has as many rows as the old grid had columns, and new row r column c takes the old tile from row (old row count minus one minus c), column r; a half turn reverses both the row order and each row, and three turns is the mirror image of the one-turn mapping."
followups:
  - "How would you rotate a square map in place with O(1) extra memory?"
  - "How would you also support horizontal and vertical flips while still combining any sequence of operations into one transform?"
  - "If the map were huge and only viewed through a small window, how could you avoid materialising the rotated grid?"
common_errors:
  - "Using a remainder that stays negative for negative counts, so the case selection fails."
  - "Looping quarter_turns times, which never finishes for counts near one billion."
  - "Allocating the result with the original dimensions on an odd turn count."
  - "Rotating counterclockwise for positive counts."
