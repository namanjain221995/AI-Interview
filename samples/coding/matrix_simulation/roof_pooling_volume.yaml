prompt_markdown: |
  ## Flat Roof Pooling Volume

  A building-maintenance team is auditing the drainage of a large flat roof. A survey models the roof as
  a grid `heights` of tiles, where `heights[r][c]` is the surface height of tile `(r, c)` in millimetres.
  After a heavy downpour every tile is covered with as much water as can stay there.

  Water flows between tiles that share an edge (up, down, left, right; never diagonally). Water above a
  tile on the outer edge of the grid runs off the roof. The water surface over a tile therefore settles
  at the lowest level at which water could escape from that tile: the minimum, over all paths from the
  tile to an edge tile, of the highest tile height along the path (including the tile itself and the
  edge tile). The water held over a tile is that level minus the tile's own height.

  Return the **total** amount of water held on the roof, in tile-millimetres. The result can exceed the
  range of a 32-bit integer.

  ### Example 1
  ```
  Input:  heights = [[3, 3, 3, 3],
                     [3, 1, 1, 3],
                     [3, 3, 3, 3]]
  Output: 4
  Explanation: the two inner tiles of height 1 are enclosed by walls of height 3 and hold 2 each.
  ```

  ### Example 2
  ```
  Input:  heights = [[5, 5, 5, 5],
                     [5, 0, 3, 5],
                     [5, 1, 5, 5],
                     [5, 2, 5, 5]]
  Output: 3
  Explanation: without the notch the basin would fill to height 5, but the edge tile of height
               2 drains it down to 2: the tiles of height 0 and 1 hold 2 and 1, the tile of
               height 3 holds nothing.
  ```

  ### Constraints
  - `1 <= rows, cols <= 200`
  - `0 <= heights[r][c] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
