reference_solutions:
  python: |

    import heapq


    def roof_water_volume(heights: list[list[int]]) -> int:
        rows, cols = len(heights), len(heights[0])
        if rows < 3 or cols < 3:
            return 0
        visited = [[False] * cols for _ in range(rows)]
        heap: list[tuple[int, int, int]] = []
        for r in range(rows):
            for c in range(cols):
                if r in (0, rows - 1) or c in (0, cols - 1):
                    visited[r][c] = True
                    heapq.heappush(heap, (heights[r][c], r, c))
        total = 0
        while heap:
            level, r, c = heapq.heappop(heap)
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                nr, nc = r + dr, c + dc
                if 0 <= nr < rows and 0 <= nc < cols and not visited[nr][nc]:
                    visited[nr][nc] = True
                    h = heights[nr][nc]
                    if h < level:
                        total += level - h
                    heapq.heappush(heap, (max(level, h), nr, nc))
        return total
  javascript: |

    function roofWaterVolume(heights) {
      const rows = heights.length;
      const cols = heights[0].length;
      if (rows < 3 || cols < 3) return 0;
      const heap = [];
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p][0] <= heap[i][0]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
            if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      const visited = heights.map((row) => row.map(() => false));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
            visited[r][c] = true;
            push([heights[r][c], r, c]);
          }
        }
      }
      let total = 0;
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (heap.length) {
        const [level, r, c] = pop();
        for (const [dr, dc] of dirs) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || visited[nr][nc]) continue;
          visited[nr][nc] = true;
          const h = heights[nr][nc];
          if (h < level) total += level - h;
          push([Math.max(level, h), nr, nc]);
        }
      }
      return total;
    }
