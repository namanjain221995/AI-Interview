expected_concepts:
- the water level of a tile is the minimax path height to the edge
- min-heap seeded with every edge tile
- processing tiles from the lowest boundary inward
- running maximum level carried into neighbours
- 64-bit accumulation
optimal_complexity: {time: "O(rows * cols * log(rows * cols))", space: "O(rows * cols)"}
rubric:
  excellent: Explains that each tile's water level is the lowest possible maximum height on a path to the edge,
    seeds a min-heap with all edge tiles, expands inward carrying the running maximum, adds the difference for lower
    tiles, and accumulates in 64 bits.
  good: Implements the heap-based boundary expansion correctly after a hint, or a correct but slower iterative relaxation
    that converges.
  weak: Applies the one-dimensional technique per row and column (taking the minimum of row and column bounds),
    which over-counts water that escapes along winding paths.
  criteria:
    correctness: All tests pass, including winding drainage paths, nested walls and maximum heights.
    efficiency: Each tile enters the heap once, O(N log N) for N tiles.
    code_quality: Clear separation between seeding the boundary and expanding inward; no recomputation per tile.
    edge_cases: Handles grids with fewer than three rows or columns and a flat roof.
    communication: Justifies why the lowest boundary tile is always safe to expand next.
hints:
- The water level above a tile is decided by the weakest point on the best escape route to the roof edge, not by
  the walls in its own row and column.
- Think of the edge tiles as the current shoreline and always grow inward from the lowest shoreline tile, because
  water next to it cannot rise above that tile's level.
- Push every edge tile into a min-heap keyed by height and mark it visited; pop the lowest entry, and for each unvisited
  neighbour add the popped level minus the neighbour's height when positive, then push the neighbour with the larger
  of the two values as its level.
followups:
- How would you return the water depth for each tile instead of only the total?
- How would the algorithm change if water could also flow diagonally?
- If some interior tiles are drains that remove water, how would you model them?
common_errors:
- Using the minimum of the row and column maxima per tile, which ignores winding drainage paths.
- Seeding the heap with only the four corners or only one edge.
- Pushing a neighbour with its own height instead of the running water level.
- Summing into a 32-bit integer and overflowing for large heights.
