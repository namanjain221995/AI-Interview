reference_solutions:
  python: |

    def slide_merge_board(board: list[list[int]], moves: str) -> list[list[int]]:
        n = len(board)
        grid = [row[:] for row in board]

        def collapse(line: list[int]) -> list[int]:
            # Slide toward index 0: drop gaps, merge equal neighbours once, pad with zeros.
            tiles = [v for v in line if v != 0]
            merged: list[int] = []
            i = 0
            while i < len(tiles):
                if i + 1 < len(tiles) and tiles[i] == tiles[i + 1]:
                    merged.append(tiles[i] * 2)
                    i += 2
                else:
                    merged.append(tiles[i])
                    i += 1
            return merged + [0] * (len(line) - len(merged))

        for move in moves:
            if move in "LR":
                for r in range(n):
                    line = grid[r] if move == "L" else grid[r][::-1]
                    out = collapse(line)
                    grid[r] = out if move == "L" else out[::-1]
            else:
                for c in range(n):
                    column = [grid[r][c] for r in range(n)]
                    line = column if move == "U" else column[::-1]
                    out = collapse(line)
                    if move == "D":
                        out = out[::-1]
                    for r in range(n):
                        grid[r][c] = out[r]
        return grid
  javascript: |

    function slideMergeBoard(board, moves) {
      const n = board.length;
      const grid = board.map((row) => row.slice());
      const collapse = (line) => {
        const tiles = line.filter((v) => v !== 0);
        const merged = [];
        for (let i = 0; i < tiles.length; ) {
          if (i + 1 < tiles.length && tiles[i] === tiles[i + 1]) {
            merged.push(tiles[i] * 2);
            i += 2;
          } else {
            merged.push(tiles[i]);
            i += 1;
          }
        }
        while (merged.length < line.length) merged.push(0);
        return merged;
      };
      for (const move of moves) {
        if (move === "L" || move === "R") {
          for (let r = 0; r < n; r++) {
            const line = move === "L" ? grid[r] : grid[r].slice().reverse();
            const out = collapse(line);
            grid[r] = move === "L" ? out : out.reverse();
          }
        } else {
          for (let c = 0; c < n; c++) {
            const column = grid.map((row) => row[c]);
            const line = move === "U" ? column : column.reverse();
            let out = collapse(line);
            if (move === "D") out = out.reverse();
            for (let r = 0; r < n; r++) grid[r][c] = out[r];
          }
        }
      }
      return grid;
    }
