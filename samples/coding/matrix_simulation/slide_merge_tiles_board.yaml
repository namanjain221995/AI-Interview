title: Slide and Merge Tiles
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [frontend, mobile, general, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Slide and Merge Tiles

  A product team is adding a sliding-tile puzzle to its mobile app and needs a reference engine for the
  QA suite. The board is an `n x n` grid of integers: `0` is an empty cell and every other value is a
  power of two. A swipe string `moves` is replayed in order; each character is one swipe: `'L'`
  (left), `'R'` (right), `'U'` (up) or `'D'` (down). **No new tiles appear** between swipes.

  On a swipe, every row (for `L`/`R`) or column (for `U`/`D`) is processed on its own:

  1. All tiles slide as far as possible toward the swiped side, keeping their relative order.
  2. Two tiles with the **same value** that end up next to each other merge into one tile holding their
     sum. Pairs are formed starting from the side the board was swiped toward, so in a row
     `[2, 2, 2]` swiped left the two left-most tiles merge, giving `[4, 2, 0]`.
  3. A tile created by a merge cannot merge again during the same swipe: `[2, 2, 4, 0]` swiped left
     becomes `[4, 4, 0, 0]`, not `[8, 0, 0, 0]`.
  4. After merging, the remaining tiles are packed against the swiped side with no gaps.

  A swipe that changes nothing is still a valid swipe. Return the board after all swipes.

  ### Example 1
  ```
  Input:  board = [[2, 2, 4, 0],
                   [0, 4, 4, 4],
                   [2, 0, 2, 2],
                   [8, 8, 8, 8]]
          moves = "L"
  Output: [[4, 4, 0, 0],
           [8, 4, 0, 0],
           [4, 2, 0, 0],
           [16, 16, 0, 0]]
  ```

  ### Example 2
  ```
  Input:  board = [[2, 0, 2],
                   [2, 2, 0],
                   [0, 0, 4]]
          moves = "UL"
  Output: [[4, 4, 0],
           [4, 0, 0],
           [0, 0, 0]]
  ```

  ### Constraints
  - `1 <= n <= 8`, `board.length == board[i].length == n`
  - Every `board[i][j]` is `0` or `2^k` with `1 <= k <= 20` (merged tiles may grow larger and still fit in a 32-bit integer)
  - `0 <= moves.length <= 100`; `moves` contains only `'L'`, `'R'`, `'U'` and `'D'`
languages: [python, javascript, typescript, java, go, cpp]
