expected_concepts:
- per-line slide then merge in one pass
- merge from the swiped wall outward
- one merge per tile per swipe
- reusing one routine for all four directions by reversing or transposing lines
- simulation on a copy of the board
optimal_complexity: {time: "O(m * n^2) for m swipes", space: "O(n^2)"}
rubric:
  excellent: Factors the work into a single routine that slides and merges one line toward index zero, reuses it
    for all four directions by reversing or reading columns, and explains why merging from the wall outward with
    a skip after each merge gives the required behaviour.
  good: Produces a correct simulation for all directions, possibly with duplicated per-direction code, and handles
    the no-double-merge rule after a test or prompt.
  weak: Merges a tile more than once per swipe, merges from the wrong end, or leaves gaps between tiles after a
    swipe.
  criteria:
    correctness: All tests pass, including triples, four equal tiles in a line and swipes that change nothing.
    efficiency: Each swipe touches every cell a constant number of times, O(n^2) per swipe.
    code_quality: One line-collapse helper shared by all directions instead of four copy-pasted loops.
    edge_cases: Handles an empty move string, a 1 x 1 board and lines that are all zeros.
    communication: Explains the order in which pairs are formed and how direction is mapped onto the helper.
hints:
- Each swipe treats every row or column independently, so think about what happens to a single line pushed toward
  one end.
- Write the logic once for a line slid toward its first index; for the other directions, read the line in reverse
  or read a column, process it, and write it back.
- For one line, first collect the non-zero tiles in order; then walk them, and when the current tile equals the
  next one emit their sum and skip both, otherwise emit the tile alone; finally pad with zeros to the original length.
followups:
- How would you report whether a swipe changed the board, so the app can ignore no-op swipes?
- How would you add the score, the sum of all merged tiles, to the result?
- How would you detect that no swipe can change the board any more?
- What would change if the board were rectangular instead of square?
common_errors:
- Merging a freshly merged tile again in the same swipe, turning [2, 2, 4] into [8].
- Pairing tiles starting from the far side, so [2, 2, 2] swiped left becomes [2, 4, 0].
- Merging equal tiles that are separated by a different tile.
- Mutating the input row while still reading from it for the same swipe.
