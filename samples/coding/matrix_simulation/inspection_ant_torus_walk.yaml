expected_concepts:
  - "direction encoded as an index into move vectors"
  - "turn right as +1 and turn left as +3 modulo 4"
  - "wrap-around with modulo, including negative offsets"
  - "maintaining the flag count incrementally instead of recounting"
  - "copying the input grid before mutating it"
optimal_complexity: {time: "O(m * n + steps)", space: "O(m * n)"}
rubric:
  excellent: "Clean simulation with direction indices and move vectors, the turn-toggle-move order exactly as specified, modulo wrap that handles negative offsets in every language, an incremental flag count and no mutation of the caller's grid."
  good: "Correct simulation that recounts flags at the end or needs one debugging pass to fix the order of operations or a wrap bug."
  weak: "Moves before turning, toggles after moving, wraps incorrectly on the top or left edges, or uses a long if-else chain that mixes up left and right."
  criteria:
    correctness: "All tests pass, including zero steps, 1 x 1 floors and wraps on every edge."
    efficiency: "O(1) work per step plus one pass to count the initial flags."
    code_quality: "Directions are encoded once as vectors; turning is arithmetic rather than a chain of conditionals."
    edge_cases: "Zero steps, single rows or columns, all-flagged floors and negative modulo in JavaScript, Java, Go and C++."
    communication: "Traces the first steps of an example to confirm the order of turn, toggle and move."
hints:
  - "This is a direct simulation, so the main risks are the order of the three actions in each step and the wrap-around at the edges."
  - "Number the four directions clockwise starting from up, so a right turn adds one and a left turn adds three, and keep a matching table of row and column offsets for moving forward."
  - "Copy the grid and count its flags once; then for each step read the current flag, turn, toggle it while adjusting the count by one, and move with the offset wrapped by adding the dimension before taking the remainder so negative positions land on the far edge."
followups:
  - "How would you detect if the bot's state (position, direction and whole floor) ever repeats, and use that to answer for steps up to 10^18?"
  - "What changes if the floor does not wrap and the bot stops when it would leave the grid?"
  - "How would you support a rule string such as RLR that cycles flags through three states?"
  - "How would you unit-test this simulation without hand-tracing thousands of steps?"
common_errors:
  - "Moving before turning or toggling the cell after the bot has left it."
  - "Using a remainder that stays negative when moving up from row 0 or left from column 0."
  - "Swapping the turn directions for clear and flagged cells."
  - "Mutating the input grid, which breaks callers that reuse it."
