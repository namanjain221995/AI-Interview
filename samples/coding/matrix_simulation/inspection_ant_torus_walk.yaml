prompt_markdown: |
  ## Inspection Bot Flag Walk

  A floor-inspection bot patrols a warehouse floor mapped as an `m x n` grid. Every cell carries a flag:
  `grid[r][c] = 1` means the cell is flagged for re-inspection and `0` means it is clear. The floor map
  **wraps around**: moving up from row `0` lands on row `m - 1`, moving right from column `n - 1` lands
  on column `0`, and so on.

  The bot starts on cell `(start_row, start_col)` facing **up** (towards row 0). Each step it does three
  things, in this order:

  1. **Turn** 90 degrees: to the **right** if the current cell's flag is `0`, to the **left** if it is
     `1`.
  2. **Toggle** the current cell's flag (`0` becomes `1`, `1` becomes `0`).
  3. **Move** forward one cell in its new direction, wrapping around the edges.

  After `steps` steps, return `[row, col, direction, flags_set]`, where `(row, col)` is the bot's cell,
  `direction` is the way it faces (`0` up, `1` right, `2` down, `3` left) and `flags_set` is the number
  of cells whose flag is `1`. The input grid describes the floor before the first step.

  ### Example 1
  ```
  Input:  grid = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], start_row = 1, start_col = 1, steps = 4
  Output: [1, 1, 0, 4]
  Explanation: Four clear cells in a row make the bot turn right four times; it walks a small
  clockwise square, sets four flags and is back on its start cell facing up.
  ```

  ### Example 2
  ```
  Input:  grid = [[0, 1, 0], [1, 0, 0]], start_row = 0, start_col = 0, steps = 3
  Output: [1, 2, 1, 3]
  Explanation: Step 1: (0, 0) is clear, turn right, set it, move to (0, 1). Step 2: (0, 1) is
  flagged, turn left (now up), clear it, move up and wrap to (1, 1). Step 3: (1, 1) is clear, turn right,
  set it, move right to (1, 2). Flags set: (0, 0), (1, 0), (1, 1).
  ```

  ### Constraints
  - `1 <= m, n <= 50` where `m = grid.length` and `n = grid[i].length` (all rows have the same length)
  - `grid[r][c]` is `0` or `1`
  - `0 <= start_row < m` and `0 <= start_col < n`
  - `0 <= steps <= 10^4`
