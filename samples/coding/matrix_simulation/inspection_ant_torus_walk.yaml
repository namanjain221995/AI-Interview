reference_solutions:
  python: |
    def ant_walk_summary(grid: list[list[int]], start_row: int, start_col: int, steps: int) -> list[int]:
        rows, cols = len(grid), len(grid[0])
        flags = [row[:] for row in grid]  # do not modify the caller's grid
        flags_set = sum(sum(row) for row in flags)
        moves = [(-1, 0), (0, 1), (1, 0), (0, -1)]  # up, right, down, left
        row, col, direction = start_row, start_col, 0
        for _ in range(steps):
            if flags[row][col] == 0:
                direction = (direction + 1) % 4
                flags[row][col] = 1
                flags_set += 1
            else:
                direction = (direction + 3) % 4
                flags[row][col] = 0
                flags_set -= 1
            d_row, d_col = moves[direction]
            row = (row + d_row) % rows
            col = (col + d_col) % cols
        return [row, col, direction, flags_set]
  javascript: |
    function antWalkSummary(grid, startRow, startCol, steps) {
      const rows = grid.length, cols = grid[0].length;
      const flags = grid.map((row) => row.slice());
      let flagsSet = 0;
      for (const row of flags) for (const v of row) flagsSet += v;
      const moves = [[-1, 0], [0, 1], [1, 0], [0, -1]];
      let row = startRow, col = startCol, direction = 0;
      for (let i = 0; i < steps; i++) {
        if (flags[row][col] === 0) {
          direction = (direction + 1) % 4;
          flags[row][col] = 1;
          flagsSet++;
        } else {
          direction = (direction + 3) % 4;
          flags[row][col] = 0;
          flagsSet--;
        }
        // JavaScript's % keeps the sign of the dividend, so add the size before wrapping.
        row = (row + moves[direction][0] + rows) % rows;
        col = (col + moves[direction][1] + cols) % cols;
      }
      return [row, col, direction, flagsSet];
    }
