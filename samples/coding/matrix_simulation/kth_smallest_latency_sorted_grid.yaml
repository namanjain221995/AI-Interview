time_limit_minutes: 25
prompt_markdown: |
  ## Kth Latency in a Sorted Grid

  A performance team publishes a latency report as an `m x n` grid of integers (latency deltas in
  microseconds against a baseline, so values can be negative). Because of the way the report is built,
  the grid is sorted in two directions at once:

  - every **row** is sorted in non-decreasing order from left to right, and
  - every **column** is sorted in non-decreasing order from top to bottom.

  Given the grid and an integer `k`, return the **k-th smallest value** in the whole grid (1-based).
  Duplicates count separately: if the value `-3` appears three times, it occupies three positions in the
  sorted order.

  Copying every value into one list and sorting it works, but the report can be large; aim for a
  solution that uses the two sort orders instead of re-sorting everything.

  ### Example 1
  ```
  Input:  grid = [[1, 4, 7], [2, 5, 9], [6, 8, 12]], k = 5
  Output: 6
  Explanation: In sorted order the values are 1, 2, 4, 5, 6, 7, 8, 9, 12; the 5th is 6.
  ```

  ### Example 2
  ```
  Input:  grid = [[-3, -3, 0, 2], [-3, 1, 1, 5]], k = 4
  Output: 0
  Explanation: Sorted: -3, -3, -3, 0, 1, 1, 2, 5. The three copies of -3 take positions 1-3, so the 4th is 0.
  ```

  ### Constraints
  - `1 <= m, n <= 300` where `m = grid.length` and `n = grid[i].length` (all rows have the same length)
  - `-10^9 <= grid[i][j] <= 10^9`
  - Rows and columns are sorted in non-decreasing order.
  - `1 <= k <= m * n`

  **Follow-up:** can you find the answer using only `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: kth_smallest_in_sorted_grid
  params:
    - {name: grid, type: "int[][]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def kth_smallest_in_sorted_grid(grid: list[list[int]], k: int) -> int:
        rows, cols = len(grid), len(grid[0])

        def count_at_most(limit: int) -> int:
            # Staircase walk from the top-right corner: O(rows + cols).
            count, col = 0, cols - 1
            for row in range(rows):
                while col >= 0 and grid[row][col] > limit:
                    col -= 1
                count += col + 1
            return count

        low, high = grid[0][0], grid[rows - 1][cols - 1]
        while low < high:
            mid = (low + high) // 2
            if count_at_most(mid) >= k:
                high = mid
            else:
                low = mid + 1
        return low
  javascript: |
    function kthSmallestInSortedGrid(grid, k) {
      const rows = grid.length, cols = grid[0].length;
      const countAtMost = (limit) => {
        let count = 0, col = cols - 1;
        for (let row = 0; row < rows; row++) {
          while (col >= 0 && grid[row][col] > limit) col--;
          count += col + 1;
        }
        return count;
      };
      let low = grid[0][0], high = grid[rows - 1][cols - 1];
      while (low < high) {
        const mid = Math.floor((low + high) / 2);
        if (countAtMost(mid) >= k) high = mid;
        else low = mid + 1;
      }
      return low;
    }
