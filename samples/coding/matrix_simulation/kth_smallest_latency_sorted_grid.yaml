expected_concepts:
  - "binary search on the value range rather than on indices"
  - "staircase count of values <= x from a corner in O(m + n)"
  - "alternative: min-heap seeded with the first column, popping k times"
  - "duplicates counted separately in the rank"
  - "overflow-safe midpoint with negative values"
optimal_complexity: {time: "O((m + n) * log(max - min))", space: "O(1)"}
rubric:
  excellent: "Uses the two sort orders: binary search on values with a staircase count (or a k-step heap merge), explains why the search converges to a value present in the grid, handles duplicates and negative midpoints and states the complexity clearly."
  good: "Reaches a correct heap-based O(k log m) solution or the value binary search with minor help, with correct handling of duplicates."
  weak: "Flattens and sorts the whole grid without discussing alternatives, or returns a midpoint that is not in the grid, or miscounts duplicates."
  criteria:
    correctness: "All tests pass, including duplicates, single rows and columns, and extreme values."
    efficiency: "Avoids sorting all m * n values; counting runs in O(m + n) per probe or the heap does k pops."
    code_quality: "The counting helper is separate and clearly named; loop bounds and the search invariant are easy to follow."
    edge_cases: "k = 1, k = m * n, all-equal grids, negative values and the full -10^9..10^9 range."
    communication: "Explains why the column pointer only moves one way during the count and why low ends on a grid value."
hints:
  - "Instead of locating the k-th position directly, ask a yes or no question: are there at least k values that are less than or equal to some candidate value x?"
  - "That count can be computed in linear time in m + n by starting from a corner where moving one way always increases values and moving the other way always decreases them."
  - "Binary search on the value range from the top-left to the bottom-right value; for each midpoint walk a staircase from the top-right corner to count values not above it, keep the smallest midpoint whose count reaches k and round the midpoint down so negative ranges still converge."
followups:
  - "How would a min-heap solution compare, and when is it faster than the value binary search?"
  - "Why is the value returned by the binary search guaranteed to appear in the grid?"
  - "How would you return the median of the grid, and what changes for an even number of cells?"
  - "What if the grid were too large for memory and stored row by row on disk?"
common_errors:
  - "Treating the grid as fully sorted in row-major order and indexing directly."
  - "Using a truncating midpoint that does not converge when the range is negative."
  - "Counting values strictly less than x instead of at most x, which is off by one with duplicates."
  - "Resetting the column pointer for every row, losing the O(m + n) count."
