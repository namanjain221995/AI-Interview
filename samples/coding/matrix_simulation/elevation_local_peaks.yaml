expected_concepts:
  - "eight-direction neighbour iteration"
  - "clamping or bounds-checking neighbours at borders"
  - "strict comparison so equal heights disqualify"
  - "row-major output order"
optimal_complexity: {time: "O(rows * cols)", space: "O(1) beyond the output"}
rubric:
  excellent: "Iterates the eight neighbours through an offset loop or clamped ranges, skips the cell itself, uses a strict comparison, emits peaks in row-major order, may stop early on the first disqualifying neighbour and states O(rows * cols) time."
  good: "Correct result with explicit bounds checks, perhaps after fixing equal-height handling or a missed diagonal."
  weak: "Checks only four neighbours, treats equal neighbours as allowed, compares the cell with itself, or reads outside the grid at borders."
  criteria:
    correctness: "All tests pass, including 1 x 1 grids, plateaus and negative heights."
    efficiency: "Each cell inspects at most eight neighbours."
    code_quality: "Neighbour logic is written once, not as eight copied conditions."
    edge_cases: "Border and corner cells, single rows and columns, ties and extreme values."
    communication: "States the strictness rule and the output order before coding."
hints:
  - "Each cell's status depends only on the small block of cells around it, so check every cell independently."
  - "For a cell, look at the cells one step away in every direction including diagonals, ignore positions outside the grid and the cell itself, and remember that an equal height is enough to rule the cell out."
  - "Loop over rows then columns so results come out in row-major order; for each cell loop the row offset and the column offset from minus one to plus one, skip the zero-zero offset and out-of-range positions, and mark the cell as not a peak as soon as any neighbour is greater than or equal to it; add the position to the result if it survives."
followups:
  - "How would you find just one peak quickly in a very large grid without scanning every cell?"
  - "How would you report plateaus of equal-height cells that are higher than everything around them?"
  - "If heights arrived one row at a time, how many rows would you need in memory?"
common_errors:
  - "Using greater-than instead of greater-than-or-equal when ruling a cell out, so ties count as peaks."
  - "Checking only the four orthogonal neighbours."
  - "Comparing a cell with itself and rejecting every cell."
  - "Initialising a running maximum to zero, which fails on all-negative grids."
