version: 1
slug: elevation_local_peaks
title: Survey Grid Local Peaks
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [data, data_scientist, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Survey Grid Local Peaks

  A drone terrain survey produces a grid of spot heights in metres, `heights[r][c]`, relative to a
  reference level, so heights can be negative. The mapping team wants to place markers on every
  **local peak**.

  A cell is a local peak when it is **strictly higher** than every neighbour it has. Neighbours are the
  up to eight cells that touch it horizontally, vertically or diagonally and lie inside the grid:

  - Cells on the border or in a corner are compared only with the neighbours that exist.
  - A neighbour with an **equal** height disqualifies the cell (so two touching cells of the same
    maximum height are both not peaks).
  - In a 1 x 1 grid the single cell has no neighbours and is a peak.

  Return the `[row, col]` position of every peak in **row-major order** (top row first, left to right
  within a row). Return an empty list if there are none.

  ### Example 1
  ```
  Input:  heights = [[1, 2, 1], [2, 5, 2], [1, 2, 1]]
  Output: [[1, 1]]
  ```

  ### Example 2
  ```
  Input:  heights = [[3, 1, 4], [1, 1, 1], [2, 1, 5]]
  Output: [[0, 0], [0, 2], [2, 0], [2, 2]]
  Explanation: Each corner is higher than its three neighbours; the centre 1 is not.
  ```

  ### Example 3
  ```
  Input:  heights = [[4, 4], [1, 2]]
  Output: []
  Explanation: The two 4s touch each other, so neither is strictly higher than all of its neighbours.
  ```

  ### Constraints
  - `1 <= rows, cols <= 200` where `rows = heights.length` and `cols = heights[i].length`
  - All rows have the same length.
  - `-10^9 <= heights[r][c] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: local_peak_cells
  params:
    - {name: heights, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def local_peak_cells(heights: list[list[int]]) -> list[list[int]]:
        rows, cols = len(heights), len(heights[0])
        peaks = []
        for r in range(rows):
            for c in range(cols):
                value = heights[r][c]
                is_peak = True
                for nr in range(max(0, r - 1), min(rows, r + 2)):
                    for nc in range(max(0, c - 1), min(cols, c + 2)):
                        if (nr, nc) != (r, c) and heights[nr][nc] >= value:
                            is_peak = False
                if is_peak:
                    peaks.append([r, c])
        return peaks
  javascript: |
    function localPeakCells(heights) {
      const rows = heights.length;
      const cols = heights[0].length;
      const peaks = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const value = heights[r][c];
          let isPeak = true;
          for (let nr = Math.max(0, r - 1); nr <= Math.min(rows - 1, r + 1) && isPeak; nr++) {
            for (let nc = Math.max(0, c - 1); nc <= Math.min(cols - 1, c + 1); nc++) {
              if ((nr !== r || nc !== c) && heights[nr][nc] >= value) {
                isPeak = false;
                break;
              }
            }
          }
          if (isPeak) peaks.push([r, c]);
        }
      }
      return peaks;
    }
