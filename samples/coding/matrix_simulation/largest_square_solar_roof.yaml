expected_concepts:
  - "DP over bottom-right corners: 1 + min(top, left, top-left)"
  - "rolling one-row DP array with a saved diagonal value"
  - "counting cells whose DP value equals the maximum side"
  - "resetting the count whenever a larger side is found"
  - "O(m * n) time instead of checking every square"
optimal_complexity: {time: "O(m * n)", space: "O(n)"}
rubric:
  excellent: "Derives the bottom-right-corner DP with the min of three neighbours, explains why the number of cells reaching the maximum equals the number of placements, uses a rolling row and handles the [0, 0] case."
  good: "Correct full-grid DP with O(m * n) memory and a correct placement count, possibly after a hint about resetting the count."
  weak: "Checks every square position and size by brute force, or counts placements of all sizes instead of only the largest."
  criteria:
    correctness: "All tests pass, including fully blocked roofs, single rows and checkerboards."
    efficiency: "Single pass over the grid with O(1) work per tile."
    code_quality: "DP meaning is documented, the saved diagonal is clearly named and the count update is easy to follow."
    edge_cases: "No usable tile, a 1 x 1 roof, wide or tall roofs and several equal-size placements that overlap."
    communication: "Explains why each tile's value depends on its top, left and top-left neighbours."
hints:
  - "Describe each square panel by its bottom-right tile, and ask for every tile how large a usable square can end exactly there."
  - "The largest square ending at a tile is limited by the squares ending at its upper, left and upper-left neighbours; a square of side s ending at a tile means a panel of side s can be placed there."
  - "Fill a table where a usable tile gets one more than the smallest of its three upper and left neighbours and a blocked tile gets zero; track the largest value, reset the counter to one whenever it grows and add one whenever a tile matches it, and keep only one previous row plus the old diagonal value to save memory."
followups:
  - "How would you return the number of placements for every panel size, not just the largest?"
  - "How would you find the largest usable rectangle instead of a square?"
  - "What changes if panels may also cover at most one obstruction tile?"
  - "How would you reconstruct the top-left tile of every best placement?"
common_errors:
  - "Taking the minimum of only two neighbours and missing the diagonal, which overestimates the side."
  - "Forgetting to reset the placement count when a larger side appears."
  - "Overwriting the diagonal value in a rolling array before it is read."
  - "Returning the area instead of the side length."
