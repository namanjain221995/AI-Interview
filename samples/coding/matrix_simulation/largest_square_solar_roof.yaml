  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def best_solar_panel_square(roof: list[list[int]]) -> list[int]:
        rows, cols = len(roof), len(roof[0])
        # best[c] = side of the largest usable square whose bottom-right tile is (r, c).
        best = [0] * (cols + 1)
        side, placements = 0, 0
        for r in range(rows):
            diagonal = 0  # best value of (r - 1, c - 1) before it is overwritten
            for c in range(1, cols + 1):
                above = best[c]
                if roof[r][c - 1] == 0:
                    best[c] = 1 + min(above, best[c - 1], diagonal)
                    if best[c] > side:
                        side, placements = best[c], 1
                    elif best[c] == side:
                        placements += 1
                else:
                    best[c] = 0
                diagonal = above
        return [side, placements]
  javascript: |
    function bestSolarPanelSquare(roof) {
      const rows = roof.length, cols = roof[0].length;
      const best = new Array(cols + 1).fill(0);
      let side = 0, placements = 0;
      for (let r = 0; r < rows; r++) {
        let diagonal = 0;
        for (let c = 1; c <= cols; c++) {
          const above = best[c];
          if (roof[r][c - 1] === 0) {
            best[c] = 1 + Math.min(above, best[c - 1], diagonal);
            if (best[c] > side) {
              side = best[c];
              placements = 1;
            } else if (best[c] === side) {
              placements++;
            }
          } else {
            best[c] = 0;
          }
          diagonal = above;
        }
      }
      return [side, placements];
    }
