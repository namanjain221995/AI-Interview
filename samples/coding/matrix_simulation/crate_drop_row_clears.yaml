time_limit_minutes: 25
prompt_markdown: |
  ## Crate Drop Row Clears

  A loading-bay simulator models a vertical well that is `width` columns wide, starts empty and has no
  height limit. Rectangular crates are dropped one at a time, in the given order. Crate `i` is
  `crates[i] = [left, w, h]`: it covers columns `left` to `left + w - 1` and is `h` rows tall. Crates are
  never rotated.

  1. A crate falls straight down until its bottom row would hit the floor or any filled cell in one of
     its columns; it stops resting on the **highest** filled cell under it, even if there are empty
     cells below that cell in other columns it covers.
  2. After the crate lands, every row that is now **completely filled** is removed. Every cell above a
     removed row moves down by one row per removed row beneath it. Cells move exactly as they are:
     nothing falls further into gaps, and parts of a crate may end up separated.
  3. Then the next crate is dropped.

  Return `[total_rows_cleared, final_height]`, where `final_height` is the number of rows from the floor
  up to and including the highest filled cell after all crates have been processed (`0` if the well is
  empty).

  ### Example 1
  ```
  Input:  width = 4, crates = [[0, 2, 1], [2, 2, 1], [0, 1, 2]]
  Output: [1, 2]
  Explanation: the first two crates fill row 0, which is cleared; the third crate lands on the
               floor and is 2 rows tall.
  ```

  ### Example 2
  ```
  Input:  width = 3, crates = [[0, 2, 1], [1, 2, 1], [0, 1, 1]]
  Output: [1, 1]
  Explanation: the second crate rests on the first one in column 1, leaving a gap under it in
               column 2. The third crate completes row 1, which is cleared; the gap row remains.
  ```

  ### Constraints
  - `1 <= width <= 20`
  - `0 <= crates.length <= 1000`
  - `0 <= left`, `1 <= w`, `left + w <= width`
  - `1 <= h <= 10`
languages: [python, javascript, typescript, java, go, cpp]
