  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |

    def crate_drop_result(width: int, crates: list[list[int]]) -> list[int]:
        full = (1 << width) - 1
        rows: list[int] = []  # rows[0] is the floor row; each row is a bit mask of filled columns
        cleared = 0
        for left, w, h in crates:
            mask = ((1 << w) - 1) << left
            base = len(rows)
            while base > 0 and rows[base - 1] & mask == 0:
                base -= 1
            while len(rows) < base + h:
                rows.append(0)
            for r in range(base, base + h):
                rows[r] |= mask
            kept = [row for row in rows if row != full]
            cleared += len(rows) - len(kept)
            rows = kept
        while rows and rows[-1] == 0:
            rows.pop()
        return [cleared, len(rows)]
  javascript: |

    function crateDropResult(width, crates) {
      const full = (1 << width) - 1;
      let rows = [];
      let cleared = 0;
      for (const [left, w, h] of crates) {
        const mask = ((1 << w) - 1) << left;
        let base = rows.length;
        while (base > 0 && (rows[base - 1] & mask) === 0) base--;
        while (rows.length < base + h) rows.push(0);
        for (let r = base; r < base + h; r++) rows[r] |= mask;
        const kept = rows.filter((row) => row !== full);
        cleared += rows.length - kept.length;
        rows = kept;
      }
      while (rows.length && rows[rows.length - 1] === 0) rows.pop();
      return [cleared, rows.length];
    }
