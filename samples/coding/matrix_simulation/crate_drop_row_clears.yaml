expected_concepts:
- grid or bit-mask row representation
- landing row from the highest filled cell in the covered columns
- removing full rows and compacting the stack
- 'simulation order: land then clear'
- bounded height as the size driver
optimal_complexity: {time: "O(n * H) for n crates and stack height H (H <= 10n)", space: "O(H * width)"}
rubric:
  excellent: Models the well as a list of rows (ideally bit masks), finds the landing row by scanning down from
    the top of the stack until a covered column is filled, clears full rows by filtering the row list, and explains
    why cells must not fall further after a clear.
  good: Implements a correct cell-by-cell grid simulation with some prompting on the landing rule or on how rows
    shift after clears.
  weak: Drops crates to the lowest empty cell in each column independently, lets cells fall into gaps after a clear,
    or only clears one row per landing.
  criteria:
    correctness: All tests pass, including overhang gaps, multiple rows cleared at once and an empty input.
    efficiency: Work per crate is proportional to the current stack height times the width or better.
    code_quality: Clear separation between finding the landing row, stamping the crate and clearing rows.
    edge_cases: Handles width 1, full-width crates and a well that becomes empty again.
    communication: States the landing rule and the clearing rule precisely before coding.
hints:
- Store the well as a list of rows from the floor upward, where each row records which columns are filled.
- A crate lands directly above the highest row in which any of its columns is filled; scanning down from the current
  top of the stack finds that row.
- 'Represent each row as a bit mask so a crate''s footprint is a mask too: scan down while the row below has no
  overlap with the crate mask, add rows as needed, combine the mask into the crate''s rows, then rebuild the row
  list without rows equal to the all-columns mask and count how many were dropped.'
followups:
- How would you return the full final layout instead of just the height?
- If the well were 10^5 columns wide, how would you find the landing row quickly?
- How would the rules change if cells did fall into gaps after a clear, and how would you simulate that?
common_errors:
- Letting a crate slide into an empty cell below an overhang instead of stopping on the highest filled cell.
- Clearing rows only once at the end instead of after every landing.
- Making cells above a cleared row fall into gaps, which changes later landings.
- Off-by-one errors in the covered column range left to left + w - 1.
