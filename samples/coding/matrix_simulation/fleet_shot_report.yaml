prompt_markdown: |
  ## Fleet Board Shot Report

  You are writing the referee service for an online fleet-battle board game. A player's board is an
  `m x n` grid given as `m` strings of length `n`: `'S'` is part of a ship and `'.'` is open water.

  The board is guaranteed to be valid:

  - every ship is a straight horizontal or vertical run of one or more `'S'` cells, and
  - no two ships touch, not even diagonally (so any two `'S'` cells that are side by side belong to the
    same ship).

  The opponent fires `shots` in order; each shot `[r, c]` targets row `r`, column `c` and is always on
  the board. For every shot, report exactly one word:

  - `"repeat"` - this cell was already targeted by an earlier shot (whatever it contains),
  - `"miss"` - the cell is open water,
  - `"sunk"` - the cell belongs to a ship and it was the ship's **last** cell not yet hit,
  - `"hit"` - the cell belongs to a ship that still has other cells not yet hit.

  Return the reports in the same order as `shots` (an empty list when there are no shots).

  ### Example 1
  ```
  Input:  board = ["SS...", "....S", "S...S", "....."], shots = [[0, 0], [1, 1], [0, 1], [0, 1], [2, 0], [1, 4]]
  Output: ["hit", "miss", "sunk", "repeat", "sunk", "hit"]
  Explanation: The board has a 2-cell ship in row 0, a 2-cell vertical ship in column 4 and a
  1-cell ship at (2, 0). The second shot at (0, 1) is a repeat, and a 1-cell ship sinks on its first hit.
  ```

  ### Example 2
  ```
  Input:  board = ["..", ".S"], shots = [[0, 0], [0, 0], [1, 1], [1, 1]]
  Output: ["miss", "repeat", "sunk", "repeat"]
  ```

  ### Constraints
  - `1 <= m, n <= 100`, all rows have length `n`
  - Every character is `'S'` or `'.'`, and the board is valid as described above.
  - `0 <= shots.length <= 10^4`, `0 <= r < m`, `0 <= c < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shot_report
  params:
    - {name: board, type: "string[]"}
    - {name: shots, type: "int[][]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def shot_report(board: list[str], shots: list[list[int]]) -> list[str]:
        rows, cols = len(board), len(board[0])
        ship_of = [[-1] * cols for _ in range(rows)]
        cells_left: list[int] = []  # cells_left[ship] = cells of that ship not yet hit

        # Label each ship once with a flood fill over side-adjacent 'S' cells.
        for r in range(rows):
            for c in range(cols):
                if board[r][c] == "S" and ship_of[r][c] == -1:
                    ship = len(cells_left)
                    size = 0
                    stack = [(r, c)]
                    ship_of[r][c] = ship
                    while stack:
                        cr, cc = stack.pop()
                        size += 1
                        for nr, nc in ((cr + 1, cc), (cr - 1, cc), (cr, cc + 1), (cr, cc - 1)):
                            if 0 <= nr < rows and 0 <= nc < cols and board[nr][nc] == "S" and ship_of[nr][nc] == -1:
                                ship_of[nr][nc] = ship
                                stack.append((nr, nc))
                    cells_left.append(size)

        targeted = [[False] * cols for _ in range(rows)]
        report: list[str] = []
        for r, c in shots:
            if targeted[r][c]:
                report.append("repeat")
                continue
            targeted[r][c] = True
            ship = ship_of[r][c]
            if ship == -1:
                report.append("miss")
            else:
                cells_left[ship] -= 1
                report.append("sunk" if cells_left[ship] == 0 else "hit")
        return report
  javascript: |
    function shotReport(board, shots) {
      const rows = board.length, cols = board[0].length;
      const shipOf = Array.from({ length: rows }, () => new Array(cols).fill(-1));
      const cellsLeft = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (board[r][c] !== "S" || shipOf[r][c] !== -1) continue;
          const ship = cellsLeft.length;
          let size = 0;
          const stack = [[r, c]];
          shipOf[r][c] = ship;
          while (stack.length > 0) {
            const [cr, cc] = stack.pop();
            size++;
            for (const [nr, nc] of [[cr + 1, cc], [cr - 1, cc], [cr, cc + 1], [cr, cc - 1]]) {
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === "S" && shipOf[nr][nc] === -1) {
                shipOf[nr][nc] = ship;
                stack.push([nr, nc]);
              }
            }
          }
          cellsLeft.push(size);
        }
      }
      const targeted = Array.from({ length: rows }, () => new Array(cols).fill(false));
      const report = [];
      for (const [r, c] of shots) {
        if (targeted[r][c]) {
          report.push("repeat");
          continue;
        }
        targeted[r][c] = true;
        const ship = shipOf[r][c];
        if (ship === -1) report.push("miss");
        else report.push(--cellsLeft[ship] === 0 ? "sunk" : "hit");
      }
      return report;
    }
