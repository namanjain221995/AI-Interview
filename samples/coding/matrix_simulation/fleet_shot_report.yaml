expected_concepts:
  - "pre-labelling each ship with a flood fill or run scan"
  - "remaining-cell counter per ship"
  - "separate targeted grid so repeats are detected for water and ship cells"
  - "O(1) work per shot after O(m * n) preprocessing"
  - "check order: repeat before miss, hit or sunk"
optimal_complexity: {time: "O(m * n + s)", space: "O(m * n)"}
rubric:
  excellent: "Labels every ship once, keeps a remaining-cell count per ship and a targeted grid, checks repeat before anything else and answers each shot in O(1); explains how the no-touch rule makes ship identification simple."
  good: "Correct reports but re-scans the ship on every hit to decide whether it is sunk, or needs a hint about repeats on water."
  weak: "Treats a repeat on a sunk ship as sunk again, reports a sunk 1-cell ship as hit, or merges ships that are only diagonally near."
  criteria:
    correctness: "All tests pass, including repeats on water, single-cell ships and out-of-order hits."
    efficiency: "Each board cell is processed once in preprocessing and each shot costs O(1)."
    code_quality: "Ship labelling and shot handling are separate steps with clear names such as ship_of and cells_left."
    edge_cases: "No shots, no ships, a 1 x 1 board and shots repeated many times."
    communication: "Explains the precedence of the four outcomes and why a per-ship counter decides sunk."
hints:
  - "Deciding sunk is the hard part: you need to know which ship a cell belongs to and how much of that ship is still untouched."
  - "Before processing any shot, give every ship an identifier and record how many cells it has; during the game, remember which cells have already been targeted."
  - "Flood-fill or scan each run of ship cells to assign an id and a size; then for each shot answer repeat if the cell was targeted before, otherwise mark it, answer miss for water, and for a ship cell decrease that ship's remaining count and answer sunk when it reaches zero or hit otherwise."
followups:
  - "How would you also report the length of each ship when it sinks?"
  - "How would you validate that an uploaded board follows the straight-ship and no-touch rules?"
  - "How would you report when the whole fleet is destroyed and ignore shots after that?"
  - "What would you change to support ships shaped like an L?"
common_errors:
  - "Checking for a ship before checking for a repeat, so a second shot at a hit cell is reported as hit again."
  - "Reporting a single-cell ship as hit instead of sunk."
  - "Deciding sunk by looking only at the neighbouring cells of the shot."
  - "Not recording shots on water, so repeated water shots are reported as miss."
