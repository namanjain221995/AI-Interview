version: 1
slug: panel_row_column_toggles
title: LED Wall Band Toggles
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [frontend, mobile, general, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## LED Wall Band Toggles

  A stadium LED wall has `rows x cols` lights and starts with **every light off**. The show controller
  sends a list of band operations; each operation is `[type, first, last]`:

  - `type == 0`: toggle every light in **rows** `first` to `last` (inclusive), across all columns.
  - `type == 1`: toggle every light in **columns** `first` to `last` (inclusive), across all rows.

  Toggling switches a light that is off to on and a light that is on to off. A light may be toggled
  many times by different operations.

  Return how many lights are **on** after all operations have been applied. The wall can have up to
  `10^5 x 10^5` lights, so simulating it light by light is far too slow, and the answer can exceed the
  32-bit integer range.

  ### Example 1
  ```
  Input:  rows = 3, cols = 4, ops = [[0, 1, 1], [1, 0, 2]]
  Output: 7
  Explanation: Row 1 is toggled once and columns 0 to 2 are toggled once. Lights in row 1 and columns
  0 to 2 are toggled twice (off), so the lit lights are (1, 3) plus the 6 cells of columns 0 to 2 in
  rows 0 and 2.
  ```

  ### Example 2
  ```
  Input:  rows = 2, cols = 2, ops = [[0, 0, 1], [0, 0, 1]]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  rows = 100000, cols = 100000, ops = [[0, 0, 99999]]
  Output: 10000000000
  ```

  ### Constraints
  - `1 <= rows, cols <= 10^5`
  - `0 <= ops.length <= 10^4`
  - `ops[i].length == 3`, `ops[i][0]` is 0 or 1
  - `0 <= first <= last < rows` when `type == 0`, and `0 <= first <= last < cols` when `type == 1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_lit_panels
  params:
    - {name: rows, type: int}
    - {name: cols, type: int}
    - {name: ops, type: "int[][]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_lit_panels(rows: int, cols: int, ops: list[list[int]]) -> int:
        row_flip = [0] * (rows + 1)
        col_flip = [0] * (cols + 1)
        for kind, first, last in ops:
            flips = row_flip if kind == 0 else col_flip
            flips[first] ^= 1
            flips[last + 1] ^= 1

        def odd_count(flips: list[int], size: int) -> int:
            parity = count = 0
            for i in range(size):
                parity ^= flips[i]
                count += parity
            return count

        odd_rows = odd_count(row_flip, rows)
        odd_cols = odd_count(col_flip, cols)
        # A light is on exactly when its row and column were toggled a different parity of times.
        return odd_rows * cols + odd_cols * rows - 2 * odd_rows * odd_cols
  javascript: |
    function countLitPanels(rows, cols, ops) {
      const rowFlip = new Uint8Array(rows + 1);
      const colFlip = new Uint8Array(cols + 1);
      for (const [kind, first, last] of ops) {
        const flips = kind === 0 ? rowFlip : colFlip;
        flips[first] ^= 1;
        flips[last + 1] ^= 1;
      }
      const oddCount = (flips, size) => {
        let parity = 0;
        let count = 0;
        for (let i = 0; i < size; i++) {
          parity ^= flips[i];
          count += parity;
        }
        return count;
      };
      const oddRows = oddCount(rowFlip, rows);
      const oddCols = oddCount(colFlip, cols);
      return oddRows * cols + oddCols * rows - 2 * oddRows * oddCols;
    }
tests:
  - {id: t1, args: [3, 4, [[0, 1, 1], [1, 0, 2]]], expected: 7, description: "Example 1"}
  - {id: t2, args: [2, 2, [[0, 0, 1], [0, 0, 1]]], expected: 0, description: "Example 2 - toggling twice cancels"}
  - {id: t3, args: [100000, 100000, [[0, 0, 99999]]], expected: 10000000000, description: "Example 3 - result exceeds 32 bits"}
  - {id: t4, hidden: true, args: [1, 1, []], expected: 0, description: "1 x 1 panel with no operations"}
  - {id: t5, hidden: true, args: [1, 1, [[0, 0, 0], [1, 0, 0]]], expected: 0, description: "Row and column toggle cancel on the single light"}
  - {id: t6, hidden: true, args: [5, 6, [[0, 0, 4], [1, 0, 5]]], expected: 0, description: "All rows and all columns toggled - everything off"}
  - {id: t7, hidden: true, args: [5, 6, [[0, 0, 3], [0, 2, 4]]], expected: 18, description: "Overlapping row bands - middle rows toggled twice"}
  - {id: t8, hidden: true, args: [4, 7, [[1, 6, 6], [0, 3, 3], [1, 0, 0]]], expected: 11, description: "Bands at the last indices"}
  - {id: t9, hidden: true, args: [100000, 100000, [[0, 0, 49999], [1, 0, 49999]]], expected: 5000000000, description: "Half rows and half columns on a huge wall"}
  - {id: t10, hidden: true, args: [100000, 3, [[1, 0, 2], [0, 10, 99989], [0, 50000, 50000]]], expected: 63, description: "Very tall narrow wall with nested bands"}
  - {id: t11, hidden: true, args: [50, 40, [[0, 3, 30], [1, 5, 25], [0, 10, 12], [1, 20, 39], [0, 0, 49], [1, 0, 0], [0, 25, 25], [1, 7, 7]]], expected: 982, description: "Many mixed overlapping bands"}
expected_concepts:
  - "a light's state depends only on the parity of its row and column toggle counts"
  - "difference array (or sweep) for range toggles"
  - "inclusion-exclusion counting of lit cells"
  - "64-bit result"
optimal_complexity: {time: "O(rows + cols + ops)", space: "O(rows + cols)"}
rubric:
  excellent: "Observes that a light is on exactly when its row parity differs from its column parity, computes the number of odd rows and odd columns with a difference array or sorted sweep, combines them as R x cols + C x rows - 2 x R x C in 64-bit arithmetic and explains O(rows + cols + ops) time."
  good: "Reaches the parity insight and the counting formula, perhaps applying each band to a per-row and per-column parity array directly (O(ops x length)) before optimising."
  weak: "Simulates the full grid, forgets that cells toggled by both a row and a column end up off, or overflows a 32-bit result."
  criteria:
    correctness: "All tests pass, including cancelling bands, full-wall bands and huge walls."
    efficiency: "Never touches individual lights; band updates are O(1) each with one prefix pass."
    code_quality: "Row and column handling share one helper; the counting formula is explained."
    edge_cases: "No operations, 1 x 1 walls, bands ending at the last index and overlapping bands."
    communication: "Derives the formula with a small example before coding."
hints:
  - "Whether a single light ends up on depends only on how many times its row was toggled and how many times its column was toggled, and only on whether each count is odd or even."
  - "A light is on exactly when one of its row and column was toggled an odd number of times and the other an even number, so you only need the number of odd rows and the number of odd columns."
  - "Record each band in a difference array by flipping a parity marker at its first index and just after its last index, take a running parity to count odd rows R and odd columns C, then the lit lights are R times cols plus C times rows minus twice R times C, computed in 64-bit arithmetic."
followups:
  - "How would you handle walls with up to 10^9 rows where even an array per row is too large?"
  - "How would you answer how many lights are on after every operation, not just at the end?"
  - "What changes if an operation could toggle a rectangular block instead of whole rows or columns?"
common_errors:
  - "Allocating a rows x cols grid, which exhausts memory for large walls."
  - "Adding R x cols and C x rows without subtracting the doubly toggled intersections twice."
  - "Forgetting the extra slot after the last index in the difference array."
  - "Multiplying in 32-bit integers so the answer overflows."
