reference_solutions:
  python: |

    def forecast_status_board(board: list[list[int]], ticks: int) -> list[list[int]]:
        rows, cols = len(board), len(board[0])

        def advance(state: tuple[tuple[int, ...], ...]) -> tuple[tuple[int, ...], ...]:
            nxt = []
            for r in range(rows):
                row = []
                for c in range(cols):
                    lit = 0
                    for dr in (-1, 0, 1):
                        for dc in (-1, 0, 1):
                            if dr or dc:
                                lit += state[(r + dr) % rows][(c + dc) % cols]
                    row.append(1 if lit == 3 or (state[r][c] == 1 and lit == 2) else 0)
                nxt.append(tuple(row))
            return tuple(nxt)

        state = tuple(tuple(row) for row in board)
        first_seen = {state: 0}
        history = [state]
        t = 0
        while t < ticks:
            state = advance(state)
            t += 1
            if state in first_seen:
                start = first_seen[state]
                period = t - start
                target = start + (ticks - start) % period
                return [list(row) for row in history[target]]
            first_seen[state] = t
            history.append(state)
        return [list(row) for row in state]
  javascript: |

    function forecastStatusBoard(board, ticks) {
      const rows = board.length;
      const cols = board[0].length;
      const advance = (state) => {
        const next = [];
        for (let r = 0; r < rows; r++) {
          const row = [];
          for (let c = 0; c < cols; c++) {
            let lit = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                lit += state[(r + dr + rows) % rows][(c + dc + cols) % cols];
              }
            }
            row.push(lit === 3 || (state[r][c] === 1 && lit === 2) ? 1 : 0);
          }
          next.push(row);
        }
        return next;
      };
      const keyOf = (state) => state.map((row) => row.join("")).join("/");
      let state = board.map((row) => row.slice());
      const firstSeen = new Map([[keyOf(state), 0]]);
      const history = [state];
      let t = 0;
      while (t < ticks) {
        state = advance(state);
        t += 1;
        const key = keyOf(state);
        if (firstSeen.has(key)) {
          const start = firstSeen.get(key);
          const period = t - start;
          return history[start + ((ticks - start) % period)];
        }
        firstSeen.set(key, t);
        history.push(state);
      }
      return state;
    }
