expected_concepts:
- simultaneous update from a copy of the previous board
- wrap-around neighbour indexing with modulo
- state hashing to detect the first repeat
- lead-in plus cycle length arithmetic to skip ahead
- 64-bit tick counts
optimal_complexity: {time: "O((L + P) * rows * cols) where L is the lead-in and P the cycle length", space: "O((L + P) * rows * cols)"}
rubric:
  excellent: Simulates ticks from a copy with modulo wrap-around, records every board in a map from board to first
    tick, and on the first repeat computes start plus the remainder of the remaining ticks modulo the cycle length;
    explains why the lead-in must be handled separately.
  good: Detects the cycle and skips ahead correctly, possibly with an off-by-one fixed after testing or a slower
    board comparison.
  weak: Simulates every tick, updates the board in place, or assumes the very first board is part of the cycle.
  criteria:
    correctness: All tests pass, including zero ticks, boards that die out and boards with a lead-in before the
      cycle.
    efficiency: Work is bounded by the lead-in plus one cycle, independent of the tick count.
    code_quality: The step function, the board key and the skip-ahead arithmetic are clearly separated.
    edge_cases: Handles ticks smaller than the lead-in, non-square boards and 64-bit tick counts.
    communication: Explains why a repeated board implies the sequence is periodic from then on.
hints:
- The board has finitely many possible states and each one fully determines the next, so the sequence of boards
  must eventually repeat.
- Remember the tick at which each board was first seen; the first time you produce a board you have seen before,
  you know where the cycle starts and how long it is.
- Keep a list of boards by tick and a map from board to its first tick; when the board at tick t was first seen
  at tick s, the answer is the stored board at s plus the remainder of (ticks minus s) divided by (t minus s), and
  if ticks is reached first just return the current board.
followups:
- How would you encode the board compactly, for example as a single integer, to make hashing cheaper?
- How would you detect the cycle with constant extra memory?
- What changes if the board does not wrap around and cells outside it are always unlit?
common_errors:
- Updating cells in place so later cells read already-updated neighbours.
- Using negative indices without wrapping, which works in some languages and fails in others.
- Assuming the cycle starts at tick 0 and ignoring the lead-in.
- Off-by-one errors when mapping the remaining ticks onto the stored cycle.
