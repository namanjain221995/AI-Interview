role_tags: [frontend, mobile, ml, data_scientist]
time_limit_minutes: 15
prompt_markdown: |
  ## Thumbnail Block Averaging

  An image service creates small preview thumbnails from grayscale images. An image is an `m x n` grid
  `pixels` of brightness values from `0` to `255`. To shrink it by a factor `k`, the service cuts the image
  into square blocks of `k x k` pixels, starting from the top-left corner, and replaces each block with one
  pixel.

  Output pixel `(i, j)` covers the rows `i*k` to `i*k + k - 1` and the columns `j*k` to `j*k + k - 1` of the
  input, **clipped to the image**: when `m` or `n` is not a multiple of `k`, the blocks on the bottom and
  right edges are smaller. Its value is the average of the pixels in its block, **rounded down**.

  Return the thumbnail, which has `ceil(m / k)` rows and `ceil(n / k)` columns.

  ### Example 1
  ```
  Input:  pixels = [[10, 20, 30, 40], [50, 60, 70, 80], [0, 0, 255, 255], [0, 0, 255, 254]], k = 2
  Output: [[35, 55], [0, 254]]
  Explanation: Top-left block (10 + 20 + 50 + 60) / 4 = 35. Top-right block 220 / 4 = 55.
               Bottom-right block 1019 / 4 = 254.75, rounded down to 254.
  ```

  ### Example 2
  ```
  Input:  pixels = [[9, 8, 7, 6, 5], [1, 2, 3, 4, 5], [100, 101, 102, 103, 104]], k = 2
  Output: [[5, 5, 5], [100, 102, 104]]
  Explanation: The right column of blocks is only 1 pixel wide: (5 + 5) / 2 = 5 on top and 104 alone below.
               The bottom row of blocks is only 1 pixel tall: (100 + 101) / 2 = 100.5, rounded down to 100.
  ```

  ### Constraints
  - `1 <= m, n <= 100` where `m = pixels.length` and `n = pixels[i].length`
  - All rows have the same length.
  - `0 <= pixels[i][j] <= 255`
  - `1 <= k <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: block_average_downsample
  params:
    - {name: pixels, type: "int[][]"}
    - {name: k, type: "int"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def block_average_downsample(pixels: list[list[int]], k: int) -> list[list[int]]:
        rows, cols = len(pixels), len(pixels[0])
        result = []
        for top in range(0, rows, k):
            out_row = []
            for left in range(0, cols, k):
                total = count = 0
                for r in range(top, min(top + k, rows)):
                    for c in range(left, min(left + k, cols)):
                        total += pixels[r][c]
                        count += 1
                out_row.append(total // count)
            result.append(out_row)
        return result
  javascript: |
    function blockAverageDownsample(pixels, k) {
      const rows = pixels.length;
      const cols = pixels[0].length;
      const result = [];
      for (let top = 0; top < rows; top += k) {
        const outRow = [];
        for (let left = 0; left < cols; left += k) {
          let total = 0;
          let count = 0;
          for (let r = top; r < Math.min(top + k, rows); r++) {
            for (let c = left; c < Math.min(left + k, cols); c++) {
              total += pixels[r][c];
              count += 1;
            }
          }
          outRow.push(Math.floor(total / count));
        }
        result.push(outRow);
      }
      return result;
    }
