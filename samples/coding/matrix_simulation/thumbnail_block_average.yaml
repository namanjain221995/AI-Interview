expected_concepts:
  - "iterating over blocks with a stride of k"
  - "clipping partial blocks at the bottom and right edges"
  - "dividing by the actual number of pixels in the block"
  - "ceiling division for the output size"
  - "integer floor division"
optimal_complexity: {time: "O(m * n)", space: "O(ceil(m / k) * ceil(n / k)) for the output"}
rubric:
  excellent: "Steps through block origins with stride k, clips each block to the image, divides by the true pixel count, notes that every input pixel is read exactly once (O(m * n)) and mentions prefix sums or accumulation by integer division of coordinates as alternatives."
  good: "Correct output with a small fix for edge blocks or output sizing after testing; complexity explained."
  weak: "Always divides by k * k, drops the partial blocks on the edges, rounds to nearest, or reads beyond the image bounds."
  criteria:
    correctness: "All tests pass, including k = 1, k larger than the image and partial edge blocks."
    efficiency: "Every input pixel contributes to exactly one block, so the work is linear in the image size."
    code_quality: "Block bounds are computed once with clear names and no duplicated edge-case branches."
    edge_cases: "Single pixel, single row or column, k larger than either dimension and rounding near 255."
    communication: "Explains the output dimensions and why the divisor varies for edge blocks."
hints:
  - "Each output pixel corresponds to one block of the input; think about how to enumerate the top-left corners of those blocks."
  - "Block corners sit at rows and columns that are multiples of k; for each one, the block ends either k pixels later or at the image border, whichever comes first."
  - "Loop the block top over 0, k, 2k and so on below the row count and the block left the same way over the columns; sum the pixels inside the clipped block while counting them, and append the sum divided by that count rounded down to the current output row."
followups:
  - "How would 2D prefix sums let you compute any block average in constant time, and when is that worth it?"
  - "How would you downsample a colour image stored as separate red, green and blue channels?"
  - "What changes if the rounding rule becomes round-half-up instead of rounding down?"
common_errors:
  - "Dividing every block by k * k, so edge blocks come out too dark."
  - "Computing the output size with floor division and losing the last partial row or column of blocks."
  - "Rounding to the nearest integer instead of rounding down."
  - "Swapping row and column limits on non-square images."
