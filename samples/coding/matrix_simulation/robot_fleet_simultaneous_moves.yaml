slug: robot_fleet_simultaneous_moves
title: Warehouse Robot Fleet Ticks
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving, debugging]
role_tags: [backend, platform, qa, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Warehouse Robot Fleet Ticks

  A fulfilment centre wants a deterministic replay tool for its robot fleet. The floor is a grid
  `floor` of strings: `'.'` is open floor and `'#'` is a shelf. Robot `i` starts at
  `starts[i] = [row, col]` (all starts are distinct open cells) and follows `programs[i]`, one character
  per tick: `'U'`, `'D'`, `'L'`, `'R'` (move one cell up, down, left or right; row `0` is the top) or `'W'`
  (wait). All programs have the same length and all robots act **at the same time** on every tick.

  Each tick is resolved as follows. Every robot first picks a **target** cell, its current cell moved
  one step in the commanded direction. Then:

  1. A robot that waits, or whose target is a shelf or outside the floor, **stays**.
  2. If two or more of the remaining robots have the same target, **all** of them stay.
  3. If two of the remaining robots each target the other's current cell (a swap), both stay.
  4. A remaining robot whose target is the current cell of a robot that stays also stays. Apply this
     rule repeatedly until no more robots change to staying.

  Every robot not marked as staying moves to its target. A robot may move into a cell that another
  robot is leaving on the same tick (following in a line), and a closed loop of robots, each moving
  into the next one's cell, rotates as a whole. Only the two-robot loop, a swap, is blocked (rule 3).

  Return the final `[row, col]` of every robot, in input order.

  ### Example 1
  ```
  Input:  floor = ["....",
                   ".#..",
                   "...."]
          starts = [[0, 0], [0, 1], [0, 2], [2, 0]]
          programs = ["RR", "RR", "RR", "UU"]
  Output: [[0, 1], [0, 2], [0, 3], [0, 0]]
  Explanation: on tick 1 the three robots in row 0 move right as a train. On tick 2 the
               robot at [0, 3] would leave the floor, so it stays, and the two robots behind it
               stay too. The fourth robot walks up twice into the cell the first robot vacated.
  ```

  ### Example 2
  ```
  Input:  floor = ["...",
                   "...",
                   "..."]
          starts = [[1, 0], [1, 2], [0, 0], [0, 1]]
          programs = ["RW", "LW", "RR", "LD"]
  Output: [[1, 0], [1, 2], [0, 1], [1, 1]]
  Explanation: on tick 1 robots 0 and 1 both target [1, 1] and stay; robots 2 and 3 would swap
               and stay. On tick 2 robot 3 moves down and robot 2 follows into [0, 1].
  ```

  ### Example 3
  ```
  Input:  floor = ["..",
                   ".."]
          starts = [[0, 0], [0, 1], [1, 1], [1, 0]]
          programs = ["R", "D", "L", "U"]
  Output: [[0, 1], [1, 1], [1, 0], [0, 0]]
  Explanation: the four robots form a closed loop and rotate one position.
  ```

  ### Constraints
  - `1 <= floor.length, floor[i].length <= 20`, all rows have the same length
  - `1 <= starts.length == programs.length <= 20`
  - `0 <= programs[i].length <= 100`, all programs have the same length
  - Programs contain only `'U'`, `'D'`, `'L'`, `'R'` and `'W'`
  - Starts are distinct open cells
languages: [python, javascript, typescript, java, go, cpp]
