expected_concepts:
- 'two-phase update: decide intents, then move'
- conflict detection by counting targets
- swap detection via a position-to-robot map
- fixed-point propagation of blocked robots
- allowing following and rotating loops while blocking two-robot swaps
optimal_complexity: {time: "O(T * k^2) worst case for T ticks and k robots (O(T * k) with a dependency queue)", space: "O(k)"}
rubric:
  excellent: Separates intent from movement, applies the four rules in order with a position-to-robot map, propagates
    staying robots to a fixed point (or with a queue of dependants), and reasons about why longer loops move while
    swaps do not.
  good: Implements the rules correctly with straightforward repeated passes, perhaps after debugging one ordering
    issue with a test.
  weak: Moves robots one at a time in input order, so results depend on ordering, or lets two robots end in the
    same cell.
  criteria:
    correctness: All tests pass, including conflicts, swaps, chains blocked from the far end and rotating loops.
    efficiency: Per tick work is polynomial in the number of robots with no simulation of individual cells beyond
      lookups.
    code_quality: Rules are implemented as distinct, readable steps with named intermediate state.
    edge_cases: Handles empty programs, the floor edge, shelves and waiting robots.
    communication: Explains why a single pass is not enough for rule 4 and how the fixed point is reached.
hints:
- Never move robots one by one during a tick; first record where every robot wants to go, then decide who actually
  moves.
- Keep a map from occupied cell to robot so you can count how many movers share a target, spot pairs that would
  swap, and find which robot sits in a target cell.
- 'After applying the first three rules, repeatedly scan the movers: if a mover''s target holds a robot that is
  staying, mark the mover as staying too; stop when a full scan changes nothing, then move every robot still marked
  as moving.'
followups:
- How would you make the blocking propagation linear per tick instead of repeated scans?
- How would you detect that the fleet has reached a state where no robot can ever move again?
- What would change if robots had priorities and the highest-priority robot won a contested cell?
- How would you test this simulator to convince yourself the rules are applied in the right order?
common_errors:
- Updating positions while still resolving the same tick, which lets earlier robots in the list win conflicts.
- Treating a four-robot loop like a swap and blocking it.
- Running the blocking rule only once, so a long chain blocked at its far end partly moves.
- Forgetting that a waiting robot blocks any mover that targets its cell.
