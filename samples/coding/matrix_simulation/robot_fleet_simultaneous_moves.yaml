  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |

    def robot_fleet_positions(floor: list[str], starts: list[list[int]], programs: list[str]) -> list[list[int]]:
        rows, cols = len(floor), len(floor[0])
        step = {"U": (-1, 0), "D": (1, 0), "L": (0, -1), "R": (0, 1), "W": (0, 0)}
        pos = [(r, c) for r, c in starts]
        k = len(pos)
        ticks = len(programs[0]) if programs else 0
        for t in range(ticks):
            target = list(pos)
            moving = [False] * k
            # Rule 1: waiting, shelves and the floor edge keep a robot in place.
            for i in range(k):
                dr, dc = step[programs[i][t]]
                r, c = pos[i][0] + dr, pos[i][1] + dc
                if (dr or dc) and 0 <= r < rows and 0 <= c < cols and floor[r][c] != "#":
                    target[i] = (r, c)
                    moving[i] = True
            # Rule 2: two or more movers aiming at the same cell all stay.
            wanted: dict[tuple[int, int], int] = {}
            for i in range(k):
                if moving[i]:
                    wanted[target[i]] = wanted.get(target[i], 0) + 1
            for i in range(k):
                if moving[i] and wanted[target[i]] > 1:
                    moving[i] = False
            # Rule 3: two movers trying to swap cells both stay.
            robot_at = {pos[i]: i for i in range(k)}
            swappers = []
            for i in range(k):
                j = robot_at.get(target[i])
                if moving[i] and j is not None and moving[j] and target[j] == pos[i]:
                    swappers.append(i)
            for i in swappers:
                moving[i] = False
            # Rule 4: a mover aiming at a robot that stays also stays, until nothing changes.
            changed = True
            while changed:
                changed = False
                for i in range(k):
                    if moving[i]:
                        j = robot_at.get(target[i])
                        if j is not None and not moving[j]:
                            moving[i] = False
                            changed = True
            for i in range(k):
                if moving[i]:
                    pos[i] = target[i]
        return [[r, c] for r, c in pos]
  javascript: |

    function robotFleetPositions(floor, starts, programs) {
      const rows = floor.length;
      const cols = floor[0].length;
      const step = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1], W: [0, 0] };
      const pos = starts.map(([r, c]) => [r, c]);
      const k = pos.length;
      const ticks = programs.length ? programs[0].length : 0;
      const key = (r, c) => r * cols + c;
      for (let t = 0; t < ticks; t++) {
        const target = pos.map(([r, c]) => [r, c]);
        const moving = new Array(k).fill(false);
        for (let i = 0; i < k; i++) {
          const [dr, dc] = step[programs[i][t]];
          const r = pos[i][0] + dr;
          const c = pos[i][1] + dc;
          if ((dr || dc) && r >= 0 && r < rows && c >= 0 && c < cols && floor[r][c] !== "#") {
            target[i] = [r, c];
            moving[i] = true;
          }
        }
        const wanted = new Map();
        for (let i = 0; i < k; i++) {
          if (moving[i]) {
            const tk = key(target[i][0], target[i][1]);
            wanted.set(tk, (wanted.get(tk) || 0) + 1);
          }
        }
        for (let i = 0; i < k; i++) {
          if (moving[i] && wanted.get(key(target[i][0], target[i][1])) > 1) moving[i] = false;
        }
        const robotAt = new Map();
        for (let i = 0; i < k; i++) robotAt.set(key(pos[i][0], pos[i][1]), i);
        const swappers = [];
        for (let i = 0; i < k; i++) {
          if (!moving[i]) continue;
          const j = robotAt.get(key(target[i][0], target[i][1]));
          if (j !== undefined && moving[j] && target[j][0] === pos[i][0] && target[j][1] === pos[i][1]) {
            swappers.push(i);
          }
        }
        for (const i of swappers) moving[i] = false;
        let changed = true;
        while (changed) {
          changed = false;
          for (let i = 0; i < k; i++) {
            if (!moving[i]) continue;
            const j = robotAt.get(key(target[i][0], target[i][1]));
            if (j !== undefined && !moving[j]) {
              moving[i] = false;
              changed = true;
            }
          }
        }
        for (let i = 0; i < k; i++) if (moving[i]) pos[i] = target[i];
      }
      return pos;
    }
