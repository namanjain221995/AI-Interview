slug: badge_collection_shortest_route
title: Badge Collection Route
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, security, platform, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Badge Collection Route

  A maintenance technician must collect every access badge left around a facility before a security
  audit. The facility map `floor` is a list of equal-length strings:

  - `'@'` - the technician's starting cell (exactly one)
  - `'#'` - a wall
  - `'.'` - an open corridor cell
  - `'a'` to `'f'` - an access badge; each letter appears at most once
  - `'A'` to `'F'` - a door; a door can be entered only once the technician holds the badge with the
    same letter in lowercase (a door letter may appear several times, and a door whose badge is not on
    the map can never be opened)

  Each step moves the technician one cell up, down, left or right, never off the map and never into a
  wall. Walking onto a badge picks it up; badges are never used up, and open doors stay passable. Cells
  may be visited any number of times.

  Return the **minimum number of steps** needed to hold every badge that appears on the map, or `-1` if
  that is impossible. If the map contains no badges, the answer is `0`.

  ### Example 1
  ```
  Input:  floor = ["@.a#b",
                   "##A#.",
                   "....."]
  Output: 8
  Explanation: 2 steps to badge a, then through door A and around the bottom row to badge b.
  ```

  ### Example 2
  ```
  Input:  floor = ["@.A.a"]
  Output: -1
  Explanation: badge a lies behind door A, so it can never be reached.
  ```

  ### Example 3
  ```
  Input:  floor = ["b.A.@.a"]
  Output: 8
  Explanation: fetch badge a first (2 steps), then walk back through door A to badge b (6 steps).
  ```

  ### Constraints
  - `1 <= floor.length, floor[i].length <= 30`
  - Every row has the same length
  - `floor` contains exactly one `'@'`, and only the characters listed above
  - At most 6 distinct badges (`'a'` to `'f'`), each appearing at most once
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_steps_collect_badges
  params:
    - {name: floor, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |

    from collections import deque


    def min_steps_collect_badges(floor: list[str]) -> int:
        rows, cols = len(floor), len(floor[0])
        all_badges = 0
        start = (0, 0)
        for r in range(rows):
            for c in range(cols):
                ch = floor[r][c]
                if "a" <= ch <= "f":
                    all_badges |= 1 << (ord(ch) - ord("a"))
                elif ch == "@":
                    start = (r, c)
        if all_badges == 0:
            return 0
        seen = {(start[0], start[1], 0)}
        queue = deque([(start[0], start[1], 0, 0)])
        while queue:
            r, c, held, dist = queue.popleft()
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                nr, nc = r + dr, c + dc
                if not (0 <= nr < rows and 0 <= nc < cols):
                    continue
                ch = floor[nr][nc]
                if ch == "#":
                    continue
                if "A" <= ch <= "F" and not held & (1 << (ord(ch) - ord("A"))):
                    continue
                now = held
                if "a" <= ch <= "f":
                    now |= 1 << (ord(ch) - ord("a"))
                if now == all_badges:
                    return dist + 1
                if (nr, nc, now) not in seen:
                    seen.add((nr, nc, now))
                    queue.append((nr, nc, now, dist + 1))
        return -1
  javascript: |

    function minStepsCollectBadges(floor) {
      const rows = floor.length;
      const cols = floor[0].length;
      let allBadges = 0;
      let start = [0, 0];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ch = floor[r][c];
          if (ch >= "a" && ch <= "f") allBadges |= 1 << (ch.charCodeAt(0) - 97);
          else if (ch === "@") start = [r, c];
        }
      }
      if (allBadges === 0) return 0;
      const seen = new Set([(start[0] * cols + start[1]) * 64]);
      let frontier = [[start[0], start[1], 0]];
      let dist = 0;
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (frontier.length) {
        dist += 1;
        const next = [];
        for (const [r, c, held] of frontier) {
          for (const [dr, dc] of dirs) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            const ch = floor[nr][nc];
            if (ch === "#") continue;
            if (ch >= "A" && ch <= "F" && !(held & (1 << (ch.charCodeAt(0) - 65)))) continue;
            let now = held;
            if (ch >= "a" && ch <= "f") now |= 1 << (ch.charCodeAt(0) - 97);
            if (now === allBadges) return dist;
            const key = (nr * cols + nc) * 64 + now;
            if (!seen.has(key)) {
              seen.add(key);
              next.push([nr, nc, now]);
            }
          }
        }
        frontier = next;
      }
      return -1;
    }
