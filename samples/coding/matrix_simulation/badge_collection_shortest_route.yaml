expected_concepts:
- breadth-first search over (cell, badges held) states
- bit mask for the set of held badges
- visited set per state rather than per cell
- early exit when the full badge set is reached
- unreachable detection returning -1
optimal_complexity: {time: "O(rows * cols * 2^k) for k badges", space: "O(rows * cols * 2^k)"}
rubric:
  excellent: Recognises that the position alone is not a valid search state, runs BFS over (row, col, badge mask),
    gates doors on the mask, stops at the first state holding every badge, and states the O(R * C * 2^k) bound.
  good: Implements the state-space BFS correctly, perhaps with a set of tuples instead of a bit mask or with minor
    prompting on the visited key.
  weak: Uses a per-cell visited set so cells cannot be revisited after picking up a badge, tries badge orders greedily,
    or uses DFS that does not give shortest paths.
  criteria:
    correctness: All tests pass, including no badges, impossible maps and maps that need backtracking.
    efficiency: Each (cell, mask) state is processed at most once.
    code_quality: Clear helpers or branches for walls, doors and badges; the target mask is computed once.
    edge_cases: Handles doors without a badge on the map, a 1 x 1 map and badges walled off from the start.
    communication: Explains why the badge set must be part of the state and why BFS yields the minimum.
hints:
- Standing on the same cell is a different situation depending on which badges you already hold, so the position
  alone is not enough to describe progress.
- Search over pairs of position and set of held badges; with at most six badges the set fits in a small bit mask,
  and breadth-first search gives the minimum number of steps.
- Start a queue from the start cell with an empty mask; for each neighbour skip walls and doors whose bit is missing,
  add the bit when stepping on a badge, return the distance as soon as the mask equals the set of all badges on
  the map, and mark each (cell, mask) state visited once.
followups:
- How would the approach change if some corridor cells cost more than one step to cross?
- With up to 26 badges the state space explodes; how could you shrink it by working on distances between badges?
- How would you also return the order in which the badges were collected?
common_errors:
- Marking cells visited regardless of the badge set, which blocks necessary backtracking.
- Treating the target as all six letters instead of only the badges present on the map.
- Allowing a door to be entered in the same step the matching badge is still unvisited.
- Using depth-first search, which finds a route but not the shortest one.
