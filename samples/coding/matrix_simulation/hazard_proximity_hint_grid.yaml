expected_concepts:
  - "8-directional neighbour offsets"
  - "bounds checking at edges and corners"
  - "excluding the cell itself from its own count"
  - "building a separate output grid"
optimal_complexity: {time: "O(m * n)", space: "O(m * n) for the output grid"}
rubric:
  excellent: "Uses a compact offset loop with bounds checks, excludes the centre cell, writes into a new grid, explains O(m * n) time with constant work per cell and may mention the alternative of pushing counts outward from each hazard."
  good: "Correct output with explicit neighbour checks, perhaps after fixing an edge or corner case found while testing."
  weak: "Counts the cell itself, reads out of bounds on edges, writes hint values into the input so later counts break, or mixes up rows and columns on non-square grids."
  criteria:
    correctness: "All tests pass, including 1 x 1 grids, single rows and columns and the all-hazard grid."
    efficiency: "Constant work per cell, linear in the grid size."
    code_quality: "Neighbour enumeration expressed once (offset list or nested offsets) rather than eight hand-written branches."
    edge_cases: "Corners, borders, single row or column, no hazards and every plot a hazard."
    communication: "States the neighbour definition and the treatment of hazard plots before coding."
hints:
  - "Each clear plot only cares about the small square of plots around it, so the task is mostly about visiting those neighbours safely."
  - "Use the eight row and column offsets around a plot, skip the offset that points to the plot itself, and ignore any neighbour that falls outside the grid."
  - "Create a new grid of zeros; for every plot, store minus one if it is a hazard, otherwise loop the row offset and column offset from minus one to one, skip the zero-zero pair and out-of-range positions, add up the hazard values found and store that sum."
followups:
  - "How would you update the hint map efficiently when a single plot changes from clear to hazard?"
  - "When a crew steps on a plot showing 0, how would you reveal the whole connected clear area around it?"
  - "How would you do this without allocating a second grid?"
common_errors:
  - "Including the plot itself in its neighbour count."
  - "Missing bounds checks so edge plots read outside the grid (or wrap around with negative indices in Python)."
  - "Writing -1 into the input grid and then counting -1 values as hazards for later cells."
  - "Using the column count for rows (or vice versa) on non-square grids."
