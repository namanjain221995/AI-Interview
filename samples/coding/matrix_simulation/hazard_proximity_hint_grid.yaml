role_tags: [general, frontend, qa, mobile]
time_limit_minutes: 12
prompt_markdown: |
  ## Site Hazard Hint Grid

  A site-survey app divides a construction site into an `m x n` grid of plots. The survey marks each plot
  in `hazards` as `1` (a hazard such as an open trench) or `0` (clear). Before a field crew walks the site,
  the app shows a **hint map** so the crew knows how careful to be around each clear plot.

  Build the hint map, a grid of the same size where:

  - a hazard plot holds `-1`;
  - a clear plot holds the number of hazard plots among its neighbours. Neighbours are the up to eight
    plots that touch it horizontally, vertically or diagonally and lie inside the grid.

  Return the hint map. Do not modify the input grid.

  ### Example 1
  ```
  Input:  hazards = [[0, 1, 0], [0, 0, 0], [1, 0, 1]]
  Output: [[1, -1, 1], [2, 3, 2], [-1, 2, -1]]
  Explanation: The centre plot touches the hazards at (0, 1), (2, 0) and (2, 2), so it shows 3.
               Corner (0, 0) touches only the hazard at (0, 1).
  ```

  ### Example 2
  ```
  Input:  hazards = [[1, 1, 0, 0], [0, 0, 0, 1]]
  Output: [[-1, -1, 2, 1], [2, 2, 2, -1]]
  ```

  ### Constraints
  - `1 <= m, n <= 100` where `m = hazards.length` and `n = hazards[i].length`
  - All rows have the same length.
  - `hazards[i][j]` is `0` or `1`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: hazard_hint_grid
  params:
    - {name: hazards, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def hazard_hint_grid(hazards: list[list[int]]) -> list[list[int]]:
        rows, cols = len(hazards), len(hazards[0])
        hints = [[0] * cols for _ in range(rows)]
        for r in range(rows):
            for c in range(cols):
                if hazards[r][c] == 1:
                    hints[r][c] = -1
                    continue
                count = 0
                for dr in (-1, 0, 1):
                    for dc in (-1, 0, 1):
                        nr, nc = r + dr, c + dc
                        if (dr or dc) and 0 <= nr < rows and 0 <= nc < cols:
                            count += hazards[nr][nc]
                hints[r][c] = count
        return hints
  javascript: |
    function hazardHintGrid(hazards) {
      const rows = hazards.length;
      const cols = hazards[0].length;
      const hints = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          if (hazards[r][c] === 1) {
            row.push(-1);
            continue;
          }
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if ((dr !== 0 || dc !== 0) && nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                count += hazards[nr][nc];
              }
            }
          }
          row.push(count);
        }
        hints.push(row);
      }
      return hints;
    }
