slug: ring_automaton_rule_steps
title: Ring Status Automaton
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [general, backend, data_scientist, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Ring Status Automaton

  A fault-propagation simulator models `n` nodes wired in a **ring**: node `i` sits between node `i - 1` and
  node `i + 1`, and node `0` and node `n - 1` are neighbours. Each node has a status flag `cells[i]`
  (`0` or `1`).

  The simulation advances in **steps**, and in each step every node updates **at the same time** using the
  states from the previous step. For node `i`, take its left neighbour `L`, its own state `S` and its right
  neighbour `R`, and form the pattern number `p = 4*L + 2*S + R` (between `0` and `7`). The node's next
  state is **bit `p`** of the integer `rule` (bit `0` is the least significant bit). For example, rule
  `6` is `00000110` in binary, so a node becomes `1` exactly for the patterns `p = 1` and `p = 2`.

  With `n = 1`, both neighbours of the single node are the node itself; with `n = 2`, both neighbours of a
  node are the other node.

  Return the states of all nodes after `steps` steps.

  ### Example 1
  ```
  Input:  cells = [0, 0, 1, 0, 0], rule = 90, steps = 1
  Output: [0, 1, 0, 1, 0]
  Explanation: Rule 90 is 01011010 in binary, so the patterns 1, 3, 4 and 6 produce 1.
               Node 1 sees L=0, S=0, R=1, pattern 1, so it becomes 1; node 2 sees pattern 2 and becomes 0;
               node 3 sees pattern 4 and becomes 1.
  ```

  ### Example 2
  ```
  Input:  cells = [1, 0, 0, 0, 0, 0], rule = 2, steps = 2
  Output: [0, 0, 0, 0, 1, 0]
  Explanation: Rule 2 produces 1 only for pattern 1 (only the right neighbour is set), so the single
               flag moves one node to the left per step and wraps from node 0 to node 5, then to node 4.
  ```

  ### Example 3
  ```
  Input:  cells = [1, 1, 0, 1, 0, 0], rule = 30, steps = 3
  Output: [1, 1, 0, 0, 1, 0]
  ```

  ### Constraints
  - `1 <= cells.length <= 60`
  - `cells[i]` is `0` or `1`.
  - `0 <= rule <= 255`
  - `0 <= steps <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: ring_automaton
  params:
    - {name: cells, type: "int[]"}
    - {name: rule, type: "int"}
    - {name: steps, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def ring_automaton(cells: list[int], rule: int, steps: int) -> list[int]:
        n = len(cells)
        state = list(cells)
        for _ in range(steps):
            state = [
                (rule >> (4 * state[i - 1] + 2 * state[i] + state[(i + 1) % n])) & 1
                for i in range(n)
            ]
        return state
  javascript: |
    function ringAutomaton(cells, rule, steps) {
      const n = cells.length;
      let state = cells.slice();
      for (let step = 0; step < steps; step++) {
        const next = new Array(n);
        for (let i = 0; i < n; i++) {
          const left = state[(i - 1 + n) % n];
          const right = state[(i + 1) % n];
          next[i] = (rule >> (4 * left + 2 * state[i] + right)) & 1;
        }
        state = next;
      }
      return state;
    }
