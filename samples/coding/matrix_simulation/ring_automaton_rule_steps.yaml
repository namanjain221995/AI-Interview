expected_concepts:
  - "simultaneous update with a separate next-state buffer"
  - "circular indexing with modulo"
  - "extracting a bit with shift and mask"
  - "encoding a neighbourhood as a pattern number"
optimal_complexity: {time: "O(n * steps)", space: "O(n)"}
rubric:
  excellent: "Uses a fresh buffer per step, wraps indices with modulo (or Python negative indexing for the left side, explained), reads the rule bit with a shift and mask, states O(n * steps) and discusses cycle detection or bit-parallel updates for very large step counts."
  good: "Correct simulation with a separate buffer, maybe after fixing the wrap-around or the bit order with the examples."
  weak: "Updates the array in place so later nodes see new states, reverses the bit order of the rule, or crashes on n = 1 or n = 2 with an index out of range."
  criteria:
    correctness: "All tests pass, including zero steps, n = 1, n = 2 and the rules 0, 255 and 204."
    efficiency: "Constant work per node per step; no string conversion of the rule inside the inner loop."
    code_quality: "Neighbour lookup and rule lookup are each written once with clear names."
    edge_cases: "Zero steps, single node, two nodes, all-zero and all-one outcomes and wrap-around at both ends."
    communication: "Explains how the pattern number maps to a bit of the rule and why updates must be simultaneous."
hints:
  - "Each step depends only on the previous step, so you need the old states intact while you compute the new ones."
  - "Compute every new state into a separate list; the neighbours of node i are found with modulo arithmetic so the ends of the list wrap around."
  - "Repeat steps times: for every index take the left state at index minus one wrapped around, the state itself and the right state at index plus one wrapped around, combine them as four times left plus two times self plus right, shift the rule right by that amount and keep the lowest bit, then replace the old list with the new one."
followups:
  - "If steps could be 10^18, how would you detect a cycle in the sequence of states and skip ahead?"
  - "How would you pack the ring into a single integer and update all nodes with bitwise operations?"
  - "What changes if the ends are fixed at 0 instead of wrapping around?"
common_errors:
  - "Updating states in place so later nodes read already-updated neighbours."
  - "Reading the rule bits in the wrong order (treating pattern 0 as the most significant bit)."
  - "Forgetting the wrap-around for node 0 or node n - 1."
  - "Returning the input list itself when steps is 0 and then mutating it elsewhere."
