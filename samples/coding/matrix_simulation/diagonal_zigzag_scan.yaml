slug: diagonal_zigzag_scan
title: Encoder Zigzag Scan
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [frontend, ml, data, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Encoder Zigzag Scan

  An image codec stores each block of transform coefficients as an `m x n` grid `block` (row 0 at the top,
  column 0 at the left). Before entropy coding, the encoder flattens the block into a single list by
  walking its **anti-diagonals** in order `d = 0, 1, ..., m + n - 2`, where diagonal `d` holds every cell
  with `row + col = d`:

  - When `d` is **even**, the diagonal is read starting from its **bottom-left** cell and moving up and to
    the right (row decreases, column increases).
  - When `d` is **odd**, the diagonal is read starting from its **top-right** cell and moving down and to
    the left (row increases, column decreases).

  Most high-frequency coefficients are zero, so the encoder then writes an end-of-block marker instead of
  the trailing zeros: the returned list **ends at the last non-zero value** in read order. Zeros that
  appear before that point are kept. An all-zero block produces an empty list.

  Return the list of values the encoder writes. The block is not necessarily square.

  ### Example 1
  ```
  Input:  block = [[52, 11, 0, 3], [-7, 4, 0, 0], [2, 0, 0, 0]]
  Output: [52, 11, -7, 2, 4, 0, 3]
  Explanation: Diagonals: [52], [11, -7], [2, 4, 0], [3, 0, 0], [0, 0], [0].
               The five zeros after 3 are trailing and are dropped.
  ```

  ### Example 2
  ```
  Input:  block = [[5, 1], [2, 6], [3, 8], [9, 4]]
  Output: [5, 1, 2, 3, 6, 8, 9, 4]
  Explanation: Diagonals read: [5], [1, 2], [3, 6], [8, 9], [4].
  ```

  ### Example 3
  ```
  Input:  block = [[0, 0, 0], [0, 0, 0]]
  Output: []
  ```

  ### Constraints
  - `1 <= m, n <= 100`, where `m = block.length` and `n = block[i].length`
  - All rows have the same length.
  - `-2048 <= block[i][j] <= 2047`

  **Follow-up:** can you produce the order with O(1) extra space besides the output, without a visited grid
  or a per-diagonal buffer that you reverse?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: diagonal_zigzag_order
  params:
    - {name: block, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def diagonal_zigzag_order(block: list[list[int]]) -> list[int]:
        m, n = len(block), len(block[0])
        order: list[int] = []
        for d in range(m + n - 1):
            if d % 2 == 0:
                r = min(d, m - 1)
                c = d - r
                while r >= 0 and c < n:
                    order.append(block[r][c])
                    r -= 1
                    c += 1
            else:
                c = min(d, n - 1)
                r = d - c
                while c >= 0 and r < m:
                    order.append(block[r][c])
                    r += 1
                    c -= 1
        while order and order[-1] == 0:
            order.pop()
        return order
  javascript: |
    function diagonalZigzagOrder(block) {
      const m = block.length, n = block[0].length;
      const order = [];
      for (let d = 0; d < m + n - 1; d++) {
        if (d % 2 === 0) {
          let r = Math.min(d, m - 1), c = d - r;
          while (r >= 0 && c < n) order.push(block[r--][c++]);
        } else {
          let c = Math.min(d, n - 1), r = d - c;
          while (c >= 0 && r < m) order.push(block[r++][c--]);
        }
      }
      while (order.length > 0 && order[order.length - 1] === 0) order.pop();
      return order;
    }
