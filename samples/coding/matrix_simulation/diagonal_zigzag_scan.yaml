expected_concepts:
  - anti-diagonal index row + col
  - start cell of each diagonal clipped to the grid bounds
  - alternating direction by diagonal parity
  - trimming trailing zeros after the scan
  - non-square grids
optimal_complexity: {time: "O(m * n)", space: "O(1) besides the output"}
rubric:
  excellent: Derives the start cell of every diagonal from its parity with correct clipping, handles non-square blocks and the trailing-zero trim (including the all-zero block), and states O(m * n) time with O(1) extra space.
  good: Correct scan using per-diagonal buffers that are reversed on alternate diagonals, or needs a hint to fix clipping on a non-square block.
  weak: Only works for square blocks, mixes up which diagonals go up, drops zeros in the middle of the output, or leaves the trailing zeros in.
  criteria:
    correctness: All tests pass, including single rows, single columns, tall and wide blocks and all-zero blocks.
    efficiency: Each cell is read exactly once; no repeated scanning or sorting.
    code_quality: Start-cell computation and the walk are clearly separated and the parity rule is easy to read.
    edge_cases: "1 x 1 blocks, all-zero blocks, interior zeros that must be kept, and diagonals clipped by both edges."
    communication: Walks through the diagonals of a small non-square example and explains where each one starts.
hints:
  - Every cell on the same anti-diagonal has the same value of row plus column, so the scan visits those sums in increasing order.
  - For each diagonal you only need its first cell and a direction; work out the first cell from the parity and the grid edges, then step until you leave the grid.
  - For an even sum start at the row that is the smaller of the sum and the last row index and move up-right; for an odd sum start at the column that is the smaller of the sum and the last column index and move down-left. After the walk, pop zeros off the end of the list until it is empty or ends in a non-zero value.
followups:
  - How would you invert the scan and rebuild the block from the list and its dimensions?
  - How would you run-length encode the zeros inside the list as well?
  - Could you precompute the scan order once for many blocks of the same size, and what would you store?
  - How would you read the diagonals in the opposite parity convention without duplicating code?
common_errors:
  - Clipping the start cell only for square blocks so tall or wide blocks read cells outside the grid.
  - Swapping the directions so the second value read is the one below the corner instead of the one to its right.
  - Removing every zero instead of only the trailing run.
  - Failing on an all-zero block by indexing the last element of an empty list.
