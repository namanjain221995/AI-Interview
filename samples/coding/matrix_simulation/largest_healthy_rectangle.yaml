expected_concepts:
- per-row histogram of consecutive healthy levels
- largest rectangle in a histogram with a monotonic stack
- handling the ring by laying the columns out twice
- capping the block width at the number of racks
- O(rows * cols) total time
optimal_complexity: {time: "O(rows * cols)", space: "O(cols)"}
rubric:
  excellent: Reduces the grid to one histogram per row, solves each histogram with a monotonic stack, handles the
    ring by scanning the histogram twice in a row with the width capped at cols, and argues why every wrapping run
    is covered.
  good: Finds the histogram plus stack approach for the non-ring case and handles wrapping with an extra pass or
    an O(rows * cols^2) fallback after a hint.
  weak: Ignores the wrap-around, counts racks twice, or enumerates all rectangles in O(rows^2 * cols^2) or worse.
  criteria:
    correctness: All tests pass, including wrapping blocks, fully healthy maps and single rows or columns.
    efficiency: Linear in the number of nodes thanks to the stack; the doubled row adds only a constant factor.
    code_quality: The histogram update and the stack scan are separated and use clear names.
    edge_cases: Caps the width at cols, handles the all-degraded map and rows that do not wrap.
    communication: Explains why each bar is pushed and popped once and why the doubling captures every ring segment.
hints:
- For each level, count how many consecutive healthy nodes end at that level in every rack; this turns each row
  into a bar chart.
- The largest block whose bottom edge is on a given level is the largest rectangle under that bar chart, which a
  stack of increasing bars finds in linear time; for the ring, think about writing the bars out twice.
- Scan the bar chart concatenated with itself, popping bars from an increasing stack; each popped bar's width is
  the distance between the current index and the new stack top minus one, capped at cols, and its height times that
  width is a candidate answer.
followups:
- How would you find the largest healthy square block instead?
- If degraded nodes are reported one at a time, how could you keep the answer updated without recomputing everything?
- What changes if the levels also wrapped, making the map a torus?
common_errors:
- Ignoring that the last rack is adjacent to the first one.
- Doubling the columns but forgetting to cap the width, which counts some racks twice.
- Popping only strictly greater bars and then mis-computing widths for equal heights.
- Resetting the histogram per row instead of accumulating consecutive healthy levels.
