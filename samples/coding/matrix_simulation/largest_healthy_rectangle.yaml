prompt_markdown: |
  ## Largest Healthy Node Block

  A compute cluster's racks stand in a **ring** around a shared cooling core. The health map `health` has
  one row per shelf level and one column per rack, in ring order, so rack column `cols - 1` stands right
  next to rack column `0`. `health[r][c]` is `1` when the node on level `r` of rack `c` is healthy and
  `0` when it is degraded.

  A batch job needs a **block** of healthy nodes: a set of consecutive levels (rows) on a set of
  consecutive racks (columns), where every node in the block is healthy. Rows do not wrap, but the run
  of racks may wrap around the ring, for example racks `cols - 2, cols - 1, 0, 1`. A block covers at
  most all `cols` racks, each at most once.

  Return the **number of nodes** in the largest healthy block, or `0` if every node is degraded.
  Aim for `O(rows * cols)` time.

  ### Example 1
  ```
  Input:  health = [[1, 0, 0, 1],
                    [1, 1, 0, 1],
                    [1, 0, 1, 1]]
  Output: 6
  Explanation: racks 3 and 0 are neighbours on the ring and are healthy on all three levels,
               giving a 3 x 2 block of 6 nodes.
  ```

  ### Example 2
  ```
  Input:  health = [[0, 0, 0],
                    [0, 0, 0]]
  Output: 0
  Explanation: every node is degraded.
  ```

  ### Example 3
  ```
  Input:  health = [[1, 1, 1],
                    [1, 1, 1]]
  Output: 6
  Explanation: the whole ring is healthy; a block may use each rack only once, so the answer is
               2 levels x 3 racks.
  ```

  ### Constraints
  - `1 <= rows, cols <= 200`
  - `health[r][c]` is `0` or `1`
languages: [python, javascript, typescript, java, go, cpp]
