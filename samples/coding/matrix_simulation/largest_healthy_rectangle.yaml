reference_solutions:
  python: |

    def largest_healthy_rectangle(health: list[list[int]]) -> int:
        rows, cols = len(health), len(health[0])
        heights = [0] * cols
        best = 0
        for r in range(rows):
            for c in range(cols):
                heights[c] = heights[c] + 1 if health[r][c] == 1 else 0
            # Lay the ring out twice so every wrapping run of columns is contiguous.
            bars = heights + heights
            n = len(bars)
            stack: list[int] = []
            for i in range(n + 1):
                current = bars[i] if i < n else -1
                while stack and bars[stack[-1]] >= current:
                    height = bars[stack.pop()]
                    left = stack[-1] if stack else -1
                    width = min(i - left - 1, cols)
                    best = max(best, height * width)
                stack.append(i)
        return best
  javascript: |

    function largestHealthyRectangle(health) {
      const rows = health.length;
      const cols = health[0].length;
      const heights = new Array(cols).fill(0);
      let best = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) heights[c] = health[r][c] === 1 ? heights[c] + 1 : 0;
        const bars = heights.concat(heights);
        const n = bars.length;
        const stack = [];
        for (let i = 0; i <= n; i++) {
          const current = i < n ? bars[i] : -1;
          while (stack.length && bars[stack[stack.length - 1]] >= current) {
            const height = bars[stack.pop()];
            const left = stack.length ? stack[stack.length - 1] : -1;
            const width = Math.min(i - left - 1, cols);
            best = Math.max(best, height * width);
          }
          stack.push(i);
        }
      }
      return best;
    }
