reference_solutions:
  python: |
    def elevator_timed_stops(start_floor: int, calls: list[list[int]]) -> list[list[int]]:
        log = sorted(calls, key=lambda call: call[0])
        stops: list[list[int]] = []
        pending: set[int] = set()
        t, floor, direction, i = 0, start_floor, 0, 0
        while i < len(log) or pending:
            while i < len(log) and log[i][0] <= t:
                pending.add(log[i][1])
                i += 1
            if floor in pending:
                pending.discard(floor)
                stops.append([t, floor])
            if direction != 0:
                ahead = any((p - floor) * direction > 0 for p in pending)
                if not ahead:
                    direction = -direction if pending else 0
            if direction == 0 and pending:
                target = min(pending, key=lambda p: (abs(p - floor), p))
                direction = 1 if target > floor else -1
            if direction == 0:
                if i < len(log):
                    t = log[i][0]
                continue
            floor += direction
            t += 1
        return stops
  javascript: |
    function elevatorTimedStops(startFloor, calls) {
      const log = calls.slice().sort((a, b) => a[0] - b[0]);
      const stops = [];
      const pending = new Set();
      let t = 0, floor = startFloor, direction = 0, i = 0;
      while (i < log.length || pending.size > 0) {
        while (i < log.length && log[i][0] <= t) pending.add(log[i++][1]);
        if (pending.has(floor)) {
          pending.delete(floor);
          stops.push([t, floor]);
        }
        if (direction !== 0) {
          let ahead = false;
          for (const p of pending) if ((p - floor) * direction > 0) ahead = true;
          if (!ahead) direction = pending.size > 0 ? -direction : 0;
        }
        if (direction === 0 && pending.size > 0) {
          let target = null;
          for (const p of pending) {
            const d = Math.abs(p - floor);
            if (target === null || d < Math.abs(target - floor) || (d === Math.abs(target - floor) && p < target)) target = p;
          }
          direction = target > floor ? 1 : -1;
        }
        if (direction === 0) {
          if (i < log.length) t = log[i][0];
          continue;
        }
        floor += direction;
        t += 1;
      }
      return stops;
    }
