expected_concepts:
  - event-driven simulation over discrete time
  - set of pending floors
  - processing calls sorted by time
  - direction rules - keep, reverse or go idle
  - skipping idle gaps to the next call
  - nearest-floor tie-breaking
optimal_complexity: {time: "O(T * P + C log C), T simulated steps, P pending floors, C calls", space: "O(C)"}
rubric:
  excellent: Sorts the log, keeps a set of pending floors, follows learn-serve-choose-move order exactly, applies the tie-break, jumps over idle gaps instead of ticking through them and explains how the step order decides which calls are served on arrival.
  good: Correct simulation that ticks every time unit (no idle jump) or needs a hint on the order of learning and serving.
  weak: Serves calls before they are learned, records duplicate stops for duplicate calls, reverses too early, or loops forever when idle with calls still to come.
  criteria:
    correctness: All tests pass, including duplicates, unsorted logs and calls for the current floor.
    efficiency: Work is proportional to the simulated travel time plus sorting; idle periods are skipped.
    code_quality: The four phases are clearly separated and direction is a small signed value.
    edge_cases: Empty log, calls for the idle floor, equal-distance ties and large idle gaps.
    communication: Traces the first example step by step and justifies each direction change.
hints:
  - Treat this as a clock-driven simulation and do the four phases in exactly the stated order each time unit.
  - Sort the calls by time so you can add them to a set of pending floors as the clock passes their time, and keep the direction as up, down or idle.
  - "Each step, add calls whose time has come, serve the current floor if it is pending, then keep the direction while a pending floor is ahead, else reverse if anything is pending, else go idle and pick the nearest pending floor (lower on ties). When idle with nothing pending, jump the clock straight to the next call's time."
followups:
  - How would you speed up the ahead and behind checks with an ordered structure when many floors are pending?
  - How would the rules change for separate up and down call buttons on each floor?
  - How would you extend the replay to two elevators sharing the same call log?
  - How would you report the waiting time of each call?
common_errors:
  - Serving a floor the elevator passed before that call was learned.
  - Recording one stop per call instead of one per arrival.
  - Choosing the nearest floor while moving instead of continuing in the current direction.
  - Ticking the clock one unit at a time through long idle gaps, or never advancing it while idle.
