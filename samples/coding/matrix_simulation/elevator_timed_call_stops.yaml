time_limit_minutes: 25
prompt_markdown: |
  ## Elevator Call Log Replay

  A building-automation team wants to replay a day's elevator call log against its controller rules to
  check the stop log the controller produced. There is one elevator. At time `0` it is **idle** at
  `start_floor`. Each entry of `calls` is `[time, floor]`: a request to stop at `floor`, which the
  controller learns about at `time`. The log is **not** necessarily sorted.

  The elevator moves exactly one floor per time unit, and stopping takes no time. At every integer time
  `t = 0, 1, 2, ...`, with the elevator at floor `f`, the controller does the following in order:

  1. **Learn**: every call whose `time` equals `t` becomes pending.
  2. **Serve**: if any pending call is for floor `f`, all of them are served together and the stop
     `[t, f]` is recorded once.
  3. **Choose a direction**:
     - If the elevator is moving up (or down) and some pending floor lies ahead in that direction, it
       keeps its direction. Otherwise, if some pending floor lies behind it, it reverses. Otherwise it
       becomes idle.
     - If the elevator is idle (including when the previous rule has just made it idle) and calls are pending, it
       heads towards the **nearest** pending floor; when two are equally near it picks the **lower**
       floor.
  4. **Move**: a moving elevator travels one floor in its direction and arrives at time `t + 1`; an
     idle elevator stays where it is.

  The replay ends once every call has been learned and served. Return the recorded stops as a list of
  `[time, floor]` pairs in the order they happen (an empty list if there are no calls). A floor may be
  stopped at more than once.

  ### Example 1
  ```
  Input:  start_floor = 0, calls = [[0, 5], [2, 3], [3, 1]]
  Output: [[3, 3], [5, 5], [9, 1]]
  Explanation: Heading up for 5, it passes floor 1 at t=1 before that call exists (t=3).
               It stops at 3 on the way up (t=3), at 5 (t=5), then reverses and reaches 1 at t=9.
  ```

  ### Example 2
  ```
  Input:  start_floor = 4, calls = [[0, 4], [1, 6], [1, 2], [10, 9]]
  Output: [[0, 4], [3, 2], [7, 6], [13, 9]]
  Explanation: The call for floor 4 is served at once. At t=1 floors 2 and 6 are equally near, so it goes down first.
               It is idle from t=7 until the call at t=10 arrives.
  ```

  ### Constraints
  - `0 <= start_floor <= 200`
  - `0 <= calls.length <= 300`, each `calls[i] = [time, floor]`
  - `0 <= time <= 10^5`, `0 <= floor <= 200`
