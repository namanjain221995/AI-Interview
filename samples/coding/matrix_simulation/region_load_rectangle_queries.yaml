version: 1
slug: region_load_rectangle_queries
title: "Region Load After Traffic Shifts"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, data_analyst, backend, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Region Load After Traffic Shifts

  A capacity planner models a fleet of edge sites as a `rows x cols` grid. Every site starts with a
  load of `0` requests per second. The planner then replays a batch of **traffic shifts**: a shift
  `[r1, c1, r2, c2, delta]` adds `delta` to the load of **every** site in the rectangle from `(r1, c1)`
  to `(r2, c2)`, both corners inclusive. `delta` may be negative (traffic drained away), so a site's load
  can end up negative.

  After **all** shifts have been applied, a dashboard sends rectangle queries `[r1, c1, r2, c2]`
  (inclusive corners). Return the total load inside each query rectangle, in the **same order as the
  queries**. Return an empty list when there are no queries.

  Both lists can be long and the rectangles can be large, so applying each shift cell by cell or summing
  each query cell by cell is too slow; aim for a solution that is linear in the grid size plus the number
  of shifts and queries.

  ### Example 1
  ```
  Input:  rows = 3, cols = 4, shifts = [[0, 0, 1, 1, 5], [1, 1, 2, 3, -2]], queries = [[0, 0, 2, 3], [1, 1, 1, 1], [2, 0, 2, 3]]
  Output: [8, 3, -6]
  Explanation: After both shifts the loads are
    row 0:  5   5   0   0
    row 1:  5   3  -2  -2
    row 2:  0  -2  -2  -2
  The whole grid sums to 8, site (1, 1) holds 3 and row 2 sums to -6.
  ```

  ### Example 2
  ```
  Input:  rows = 1, cols = 5, shifts = [[0, 1, 0, 3, 4], [0, 2, 0, 4, 1]], queries = [[0, 0, 0, 4], [0, 2, 0, 2]]
  Output: [15, 5]
  Explanation: The loads are 0, 4, 5, 5, 1.
  ```

  ### Constraints
  - `1 <= rows, cols <= 300`
  - `0 <= shifts.length <= 10^4`, each shift is `[r1, c1, r2, c2, delta]` with `-10^6 <= delta <= 10^6`
  - `0 <= queries.length <= 10^4`, each query is `[r1, c1, r2, c2]`
  - For shifts and queries: `0 <= r1 <= r2 < rows` and `0 <= c1 <= c2 < cols`
  - Totals can exceed the 32-bit range; return them as 64-bit integers.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: region_load_sums
  params:
    - {name: rows, type: "int"}
    - {name: cols, type: "int"}
    - {name: shifts, type: "int[][]"}
    - {name: queries, type: "int[][]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def region_load_sums(rows: int, cols: int, shifts: list[list[int]], queries: list[list[int]]) -> list[int]:
        # 2D difference array: mark the four corners of every shift.
        diff = [[0] * (cols + 1) for _ in range(rows + 1)]
        for r1, c1, r2, c2, delta in shifts:
            diff[r1][c1] += delta
            diff[r1][c2 + 1] -= delta
            diff[r2 + 1][c1] -= delta
            diff[r2 + 1][c2 + 1] += delta

        # First prefix pass turns the differences into per-site loads,
        # the second builds inclusive prefix sums with a zero border.
        load = [[0] * cols for _ in range(rows)]
        prefix = [[0] * (cols + 1) for _ in range(rows + 1)]
        for r in range(rows):
            for c in range(cols):
                value = diff[r][c]
                if r > 0:
                    value += load[r - 1][c]
                if c > 0:
                    value += load[r][c - 1]
                if r > 0 and c > 0:
                    value -= load[r - 1][c - 1]
                load[r][c] = value
                prefix[r + 1][c + 1] = value + prefix[r][c + 1] + prefix[r + 1][c] - prefix[r][c]

        return [
            prefix[r2 + 1][c2 + 1] - prefix[r1][c2 + 1] - prefix[r2 + 1][c1] + prefix[r1][c1]
            for r1, c1, r2, c2 in queries
        ]
  javascript: |
    function regionLoadSums(rows, cols, shifts, queries) {
      const diff = Array.from({ length: rows + 1 }, () => new Array(cols + 1).fill(0));
      for (const [r1, c1, r2, c2, delta] of shifts) {
        diff[r1][c1] += delta;
        diff[r1][c2 + 1] -= delta;
        diff[r2 + 1][c1] -= delta;
        diff[r2 + 1][c2 + 1] += delta;
      }
      const load = Array.from({ length: rows }, () => new Array(cols).fill(0));
      const prefix = Array.from({ length: rows + 1 }, () => new Array(cols + 1).fill(0));
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let value = diff[r][c];
          if (r > 0) value += load[r - 1][c];
          if (c > 0) value += load[r][c - 1];
          if (r > 0 && c > 0) value -= load[r - 1][c - 1];
          load[r][c] = value;
          prefix[r + 1][c + 1] = value + prefix[r][c + 1] + prefix[r + 1][c] - prefix[r][c];
        }
      }
      return queries.map(([r1, c1, r2, c2]) =>
        prefix[r2 + 1][c2 + 1] - prefix[r1][c2 + 1] - prefix[r2 + 1][c1] + prefix[r1][c1]);
    }
