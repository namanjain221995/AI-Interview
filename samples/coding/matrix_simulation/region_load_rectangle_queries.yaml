expected_concepts:
  - "2D difference array marking four corners per shift"
  - "2D prefix sums with inclusion-exclusion for O(1) rectangle queries"
  - "zero-padded border row and column to avoid bounds checks"
  - "64-bit accumulation of totals"
  - "O(rows * cols + shifts + queries) overall"
optimal_complexity: {time: "O(rows * cols + shifts + queries)", space: "O(rows * cols)"}
rubric:
  excellent: "Combines a 2D difference array for the shifts with 2D prefix sums for the queries, gets every inclusion-exclusion sign right, uses 64-bit totals and states the linear overall complexity."
  good: "Uses prefix sums for the queries but applies shifts row by row with 1D differences or needs help with the corner signs; the result is correct."
  weak: "Applies every shift cell by cell and sums every query cell by cell, or gets the inclusion-exclusion corners wrong."
  criteria:
    correctness: "All tests pass, including empty shift or query lists, negative deltas and the last row and column."
    efficiency: "Each shift and each query costs O(1) after O(rows * cols) preprocessing."
    code_quality: "Difference and prefix grids are clearly named, with a padded border instead of scattered bounds checks."
    edge_cases: "1 x 1 grids, shifts that cancel, shifts touching the far edges and totals beyond 32 bits."
    communication: "Explains why four corner updates describe a rectangle increment and why the prefix pass recovers it."
hints:
  - "Treat the two halves separately: first find each site's final load, then answer the rectangle totals; neither half needs to visit a whole rectangle per shift or per query."
  - "A rectangle increment can be recorded by marking only its corners in a slightly larger grid, and a running two-dimensional sum over those marks recovers the per-site loads; the same kind of running sum answers any rectangle total from four corner values."
  - "Add delta at the top-left corner, subtract it just right of the top-right and just below the bottom-left, add it back diagonally past the bottom-right; take a 2D prefix sum to get loads, take a second 2D prefix sum with a zero border, then each query is the bottom-right value minus the two outside strips plus the doubly removed corner."
followups:
  - "How would you support shifts and queries arriving interleaved, where a query must see only earlier shifts?"
  - "Could you reuse a single grid for the difference marks, the loads and the prefix sums to save memory?"
  - "How would the approach extend to a three-dimensional grid of sites over time?"
  - "What changes if the grid is huge but only a few thousand shifts touch it?"
common_errors:
  - "Forgetting the extra row and column so the corner marks past the edge go out of bounds."
  - "Swapping a sign in the four-corner update or in the query inclusion-exclusion."
  - "Answering queries from the difference grid instead of from the recovered loads."
  - "Accumulating totals in 32-bit integers in Java, Go or C++."
