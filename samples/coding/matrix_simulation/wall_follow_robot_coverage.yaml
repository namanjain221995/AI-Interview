version: 1
slug: wall_follow_robot_coverage
title: Bump-and-Turn Robot Coverage
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, qa, mobile]
time_limit_minutes: 25
prompt_markdown: |
  ## Bump-and-Turn Robot Coverage

  A firmware team is estimating how much of a warehouse floor a low-cost cleaning robot actually reaches.
  The floor is a grid given as `floor`, a list of equal-length strings (row 0 is the **north** edge,
  column 0 the **west** edge):

  - `'.'` open floor,
  - `'#'` blocked (shelving, pillars),
  - `'S'` the robot's starting cell (open floor). There is exactly one.

  The robot starts on `'S'` **facing north**. Every tick it does exactly one thing:

  - if the cell directly in front of it is open floor inside the grid, it moves forward into that cell;
  - otherwise (blocked or outside the grid) it turns **90 degrees clockwise** in place (north, east, south,
    west, north, ...). Turning uses up the whole tick.

  Given `ticks`, return the number of **distinct cells** the robot has occupied after that many ticks,
  counting the starting cell. `ticks` can be far too large to simulate tick by tick.

  ### Example 1
  ```
  Input:  floor = ["...", ".S.", "#.."], ticks = 3
  Output: 3
  Explanation: Tick 1 moves north to (0,1). Tick 2 turns east (the north edge is ahead). Tick 3 moves to (0,2).
               Cells occupied: (1,1), (0,1), (0,2).
  ```

  ### Example 2
  ```
  Input:  floor = ["....", ".#..", "S..."], ticks = 1000000000000000
  Output: 10
  Explanation: The robot ends up circling the outer ring forever; only the cell (1, 2) is never reached.
  ```

  ### Constraints
  - `1 <= m, n <= 50`, where `m = floor.length` and `n = floor[i].length`
  - Every row has the same length; exactly one `'S'`.
  - `0 <= ticks <= 10^15`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_visited_cells
  params:
    - {name: floor, type: "string[]"}
    - {name: ticks, type: "long"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_visited_cells(floor: list[str], ticks: int) -> int:
        m, n = len(floor), len(floor[0])
        steps = ((-1, 0), (0, 1), (1, 0), (0, -1))
        r, c = next((i, row.index("S")) for i, row in enumerate(floor) if "S" in row)
        d = 0
        visited = {(r, c)}
        states = {(r, c, d)}
        for _ in range(min(ticks, 4 * m * n + 1)):
            nr, nc = r + steps[d][0], c + steps[d][1]
            if 0 <= nr < m and 0 <= nc < n and floor[nr][nc] != "#":
                r, c = nr, nc
                visited.add((r, c))
            else:
                d = (d + 1) % 4
            if (r, c, d) in states:
                break
            states.add((r, c, d))
        return len(visited)
  javascript: |
    function countVisitedCells(floor, ticks) {
      const m = floor.length, n = floor[0].length;
      const steps = [[-1, 0], [0, 1], [1, 0], [0, -1]];
      let r = floor.findIndex(row => row.includes("S"));
      let c = floor[r].indexOf("S");
      let d = 0;
      const visited = new Set([r * n + c]);
      const states = new Set([(r * n + c) * 4 + d]);
      const limit = Math.min(Number(ticks), 4 * m * n + 1);
      for (let t = 0; t < limit; t++) {
        const nr = r + steps[d][0], nc = c + steps[d][1];
        if (nr >= 0 && nr < m && nc >= 0 && nc < n && floor[nr][nc] !== "#") {
          r = nr;
          c = nc;
          visited.add(r * n + c);
        } else {
          d = (d + 1) % 4;
        }
        const key = (r * n + c) * 4 + d;
        if (states.has(key)) break;
        states.add(key);
      }
      return visited.size;
    }
tests:
