expected_concepts:
  - state is position plus heading
  - cycle detection on a deterministic state machine
  - at most 4 * m * n distinct states
  - set of visited cells
  - huge tick counts handled without full simulation
optimal_complexity: {time: "O(min(ticks, m * n))", space: "O(m * n)"}
rubric:
  excellent: Identifies the state as cell plus heading, argues that a repeated state means the future repeats and no new cells appear, caps the simulation at 4 * m * n steps, and handles zero ticks and boxed-in starts.
  good: Correct simulation with cycle detection, possibly computing the cycle length and remainder explicitly when stopping at the first repeat would suffice.
  weak: Simulates every tick (times out for 10^15), detects repetition by position only (ignoring heading), or forgets to count the start cell.
  criteria:
    correctness: All tests pass, including zero ticks, 1 x 1 floors and huge tick counts.
    efficiency: Simulation stops after at most 4 * m * n steps regardless of ticks.
    code_quality: Direction is an index into an offset table; turning is a single modular increment.
    edge_cases: Zero ticks, boxed-in starts, single rows and stopping before the cycle closes.
    communication: Explains why a repeated position-and-heading state proves no new cells can appear.
hints:
  - "The robot's behaviour is completely determined by where it is and which way it faces, and there are only a limited number of such combinations."
  - Record every position-and-heading combination you see; as soon as one repeats, the robot is in a loop that only revisits states it has already been in.
  - Simulate tick by tick while keeping a set of visited cells and a set of seen states; stop when the ticks run out or when the new state is already in the seen set, then return the size of the visited set. At most four states per cell exist, so this never needs more than about four times the number of cells steps.
followups:
  - How would you return the exact position and heading after ticks steps, not just the coverage?
  - How would you choose the best starting heading to maximise coverage?
  - How would the analysis change if the robot turned left on odd bumps and right on even bumps?
  - How would you compute coverage for many different tick counts on the same floor efficiently?
common_errors:
  - Detecting the loop by position alone, which stops too early when the robot passes a cell with a different heading.
  - Simulating all ticks and timing out for very large values.
  - Forgetting that turning consumes a tick, or turning counter-clockwise.
  - Not counting the starting cell, or counting a cell again on every visit.
