version: 1
slug: pallet_push_min_pushes
title: Pallet Pushing Robot
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, general, qa, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## Pallet Pushing Robot

  A warehouse robot has to deliver a pallet to a loading dock by pushing it. The map `floor` is a list of
  equal-length strings:

  - `'#'` - a rack (impassable for both the robot and the pallet)
  - `'.'` - open floor
  - `'R'` - the robot's starting cell (exactly one)
  - `'P'` - the pallet's starting cell (exactly one)
  - `'D'` - the dock (exactly one)

  The robot, the pallet's start and the dock all stand on open floor. The robot moves one cell up, down,
  left or right at a time onto any open cell except the one holding the pallet; walking is free. To
  **push**, the robot steps toward the pallet from an adjacent cell: the pallet moves one cell in the same
  direction and the robot takes the pallet's old cell. A push is allowed only if the cell beyond the
  pallet is open floor or the dock (inside the map, not a rack). The pallet can never be pulled.

  Return the **minimum number of pushes** needed to put the pallet on the dock, or `-1` if it cannot be
  done.

  ### Example 1
  ```
  Input:  floor = ["#######",
                   "#R.P.D#",
                   "#######"]
  Output: 2
  Explanation: the robot pushes right twice.
  ```

  ### Example 2
  ```
  Input:  floor = ["######",
                   "#D...#",
                   "#.#..#",
                   "#..P.#",
                   "#R...#",
                   "######"]
  Output: 4
  Explanation: the robot pushes the pallet up twice from below, then walks to its right side
               and pushes it left twice; no plan needs fewer than 4 pushes.
  ```

  ### Example 3
  ```
  Input:  floor = ["#####",
                   "#P..#",
                   "#.R.#",
                   "#..D#",
                   "#####"]
  Output: -1
  Explanation: the pallet sits in a corner; no push can ever move it toward the dock.
  ```

  ### Constraints
  - `1 <= floor.length, floor[i].length <= 20`
  - Every row has the same length
  - `floor` contains exactly one `'R'`, one `'P'` and one `'D'`, and otherwise only `'#'` and `'.'`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_pallet_pushes
  params:
    - {name: floor, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |

    def min_pallet_pushes(floor: list[str]) -> int:
        rows, cols = len(floor), len(floor[0])
        robot = pallet = dock = (0, 0)
        for r in range(rows):
            for c in range(cols):
                if floor[r][c] == "R":
                    robot = (r, c)
                elif floor[r][c] == "P":
                    pallet = (r, c)
                elif floor[r][c] == "D":
                    dock = (r, c)

        def open_cell(r: int, c: int) -> bool:
            return 0 <= r < rows and 0 <= c < cols and floor[r][c] != "#"

        # Layered search: within one layer the robot walks for free; a push leads to the next layer.
        seen = {(pallet, robot)}
        layer = [(pallet, robot)]
        pushes = 0
        while layer:
            following = []
            i = 0
            while i < len(layer):
                (pr, pc), (rr, rc) = layer[i]
                i += 1
                for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                    nr, nc = rr + dr, rc + dc
                    if (nr, nc) == (pr, pc):
                        br, bc = pr + dr, pc + dc
                        if open_cell(br, bc):
                            if (br, bc) == dock:
                                return pushes + 1
                            state = ((br, bc), (pr, pc))
                            if state not in seen:
                                seen.add(state)
                                following.append(state)
                    elif open_cell(nr, nc):
                        state = ((pr, pc), (nr, nc))
                        if state not in seen:
                            seen.add(state)
                            layer.append(state)
            layer = following
            pushes += 1
        return -1
  javascript: |

    function minPalletPushes(floor) {
      const rows = floor.length;
      const cols = floor[0].length;
      let robot = 0;
      let pallet = 0;
      let dock = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const ch = floor[r][c];
          if (ch === "R") robot = r * cols + c;
          else if (ch === "P") pallet = r * cols + c;
          else if (ch === "D") dock = r * cols + c;
        }
      }
      const openCell = (r, c) => r >= 0 && r < rows && c >= 0 && c < cols && floor[r][c] !== "#";
      const total = rows * cols;
      const seen = new Uint8Array(total * total);
      seen[pallet * total + robot] = 1;
      let layer = [[pallet, robot]];
      let pushes = 0;
      const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (layer.length) {
        const following = [];
        for (let i = 0; i < layer.length; i++) {
          const [p, q] = layer[i];
          const pr = Math.floor(p / cols);
          const pc = p % cols;
          const rr = Math.floor(q / cols);
          const rc = q % cols;
          for (const [dr, dc] of dirs) {
            const nr = rr + dr;
            const nc = rc + dc;
            if (nr === pr && nc === pc) {
              const br = pr + dr;
              const bc = pc + dc;
              if (!openCell(br, bc)) continue;
              const nextPallet = br * cols + bc;
              if (nextPallet === dock) return pushes + 1;
              const key = nextPallet * total + p;
              if (!seen[key]) {
                seen[key] = 1;
                following.push([nextPallet, p]);
              }
            } else if (openCell(nr, nc)) {
              const key = p * total + nr * cols + nc;
              if (!seen[key]) {
                seen[key] = 1;
                layer.push([p, nr * cols + nc]);
              }
            }
          }
        }
        layer = following;
        pushes += 1;
      }
      return -1;
    }
