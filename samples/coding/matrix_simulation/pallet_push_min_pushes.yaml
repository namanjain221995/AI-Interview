expected_concepts:
- state is (pallet cell, robot cell), not the pallet alone
- walking moves cost 0 and pushes cost 1
- layered BFS or 0-1 BFS over states
- push validity check on the cell beyond the pallet
- returning -1 when the dock is unreachable
optimal_complexity: {time: "O((rows * cols)^2)", space: "O((rows * cols)^2)"}
rubric:
  excellent: Models the state as pallet and robot positions, explains that walks are free and pushes cost one, uses
    0-1 BFS or a BFS on pushes with a robot reachability check, and analyses the O((R * C)^2) state bound.
  good: Searches over pallet positions with the side the robot stands on and a reachability flood fill per push,
    producing correct answers with some prompting.
  weak: Runs a plain BFS on the pallet position alone, ignoring whether the robot can reach the pushing side, or
    counts robot steps instead of pushes.
  criteria:
    correctness: All tests pass, including corner traps, unreachable pushing sides and long repositioning walks.
    efficiency: Each (pallet, robot) state is expanded at most once.
    code_quality: Push and walk transitions are clearly separated and boundary checks are shared.
    edge_cases: Handles one-row maps, a robot trapped behind the pallet and maps without surrounding racks.
    communication: Explains why the robot position must be part of the state and why the search is ordered by pushes.
hints:
- Whether a push is possible depends on where the robot stands, so the pallet position alone does not describe the
  situation.
- Use pairs of pallet cell and robot cell as states; moving the robot without pushing costs nothing, while a push
  costs one, so the search should finish all free moves before counting another push.
- 'Run a breadth-first search in layers by push count: from each state, a robot step onto an open non-pallet cell
  stays in the current layer, a step into the pallet moves it one cell further if that cell is open and goes to
  the next layer, and the answer is the layer at which the pallet first lands on the dock.'
followups:
- How would you also minimise the robot's walking distance among solutions with the fewest pushes?
- How could you reduce the state space by storing only the pallet cell and the side the robot is on?
- What changes with two pallets and two docks?
common_errors:
- Searching over pallet positions only and assuming the robot can always reach the pushing side.
- Letting the robot walk through the pallet's cell.
- Counting walking steps toward the answer instead of only pushes.
- Treating the dock cell as impassable for the robot or for a push.
