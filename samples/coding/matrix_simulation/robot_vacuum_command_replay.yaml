slug: robot_vacuum_command_replay
title: Robot Vacuum Command Replay
difficulty: easy
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [general, qa, backend, mobile]
time_limit_minutes: 15
prompt_markdown: |
  ## Robot Vacuum Command Replay

  A QA engineer is reproducing a field report from a cleaning robot. The room is a grid where
  `grid[r][c] == 0` is open floor and `grid[r][c] == 1` is furniture. The robot starts on the floor cell
  (`start_row`, `start_col`) and the report contains the exact command log it executed, a string made of
  the letters `U`, `D`, `L` and `R`:

  - `U` moves one cell up (row - 1), `D` one cell down (row + 1), `L` one cell left (column - 1) and
    `R` one cell right (column + 1).
  - If the target cell is outside the grid or contains furniture, the robot **stays where it is** and
    records a **bump**; it then continues with the next command.

  Replay the log and return `[final_row, final_col, bumps]`. An empty command log leaves the robot at
  its start with 0 bumps.

  ### Example 1
  ```
  Input:  grid = [[0, 0, 0, 1], [0, 1, 0, 0], [0, 0, 0, 0]], start_row = 0, start_col = 0, commands = "RRRDRRDLU"
  Output: [1, 2, 2]
  Explanation: The third R bumps into furniture at (0, 3); the last R of "DRR" bumps the right wall while the robot is at (1, 3).
  ```

  ### Example 2
  ```
  Input:  grid = [[0, 1], [0, 0]], start_row = 1, start_col = 1, commands = ""
  Output: [1, 1, 0]
  ```

  ### Constraints
  - `1 <= rows, cols <= 100` where `rows = grid.length` and `cols = grid[i].length`
  - All rows have the same length and every cell is 0 or 1.
  - `grid[start_row][start_col] == 0`
  - `0 <= commands.length <= 10^4` and every character is one of `U`, `D`, `L`, `R`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: final_robot_state
  params:
    - {name: grid, type: "int[][]"}
    - {name: start_row, type: int}
    - {name: start_col, type: int}
    - {name: commands, type: string}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def final_robot_state(grid: list[list[int]], start_row: int, start_col: int, commands: str) -> list[int]:
        moves = {"U": (-1, 0), "D": (1, 0), "L": (0, -1), "R": (0, 1)}
        rows, cols = len(grid), len(grid[0])
        r, c, bumps = start_row, start_col, 0
        for command in commands:
            dr, dc = moves[command]
            nr, nc = r + dr, c + dc
            if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 0:
                r, c = nr, nc
            else:
                bumps += 1
        return [r, c, bumps]
  javascript: |
    function finalRobotState(grid, startRow, startCol, commands) {
      const moves = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
      const rows = grid.length;
      const cols = grid[0].length;
      let r = startRow;
      let c = startCol;
      let bumps = 0;
      for (const command of commands) {
        const [dr, dc] = moves[command];
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 0) {
          r = nr;
          c = nc;
        } else {
          bumps += 1;
        }
      }
      return [r, c, bumps];
    }
