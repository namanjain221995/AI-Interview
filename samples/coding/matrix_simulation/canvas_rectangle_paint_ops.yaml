expected_concepts:
  - "normalising rectangle corners with min and max"
  - "clipping a rectangle to the grid bounds"
  - "empty ranges when the rectangle misses the canvas"
  - "applying operations in order so later ones overwrite"
  - "allocating independent rows for the 2D grid"
optimal_complexity: {time: "O(rows * cols + total painted area)", space: "O(rows * cols) for the canvas"}
rubric:
  excellent: "Normalises corners, clips each rectangle to the canvas once so off-canvas operations produce empty loops, keeps the code free of per-cell bounds checks and discusses the reverse-order trick or per-row interval ideas for many operations."
  good: "Correct result with per-cell bounds checks or minor clipping fixes after testing, and the complexity stated in terms of painted area."
  weak: "Assumes r1 <= r2 and c1 <= c2, indexes outside the canvas, treats colour 0 as unpainted, or shares one row object across the whole grid."
  criteria:
    correctness: "All tests pass, including reversed corners, fully off-canvas rectangles and colour 0."
    efficiency: "Each operation touches only the clipped cells; O(rows * cols * ops) worst case is fine for the limits."
    code_quality: "Corner normalisation and clipping are computed once per operation with clear names (top, bottom, left, right)."
    edge_cases: "Empty operation list, single-cell canvas, rectangles entirely outside on any side, and huge coordinates."
    communication: "Explains how clipping can produce an empty range and why that safely skips the operation."
hints:
  - "Handle each operation independently and in order; the main work is turning the two corners into a safe range of rows and columns."
  - "Sort out the corner order first by taking the smaller and larger row and column, then shrink that range so it never leaves the canvas."
  - "For every operation compute top as the larger of zero and the smaller row, bottom as the smaller of rows minus one and the larger row, and the same for columns; if top is above bottom or left is past right nothing is painted, otherwise assign the colour to every cell in that clipped block."
followups:
  - "If there were 10^5 operations on a large canvas, how could processing them in reverse order avoid repainting cells?"
  - "How would you answer only the final colour of a single cell without building the whole canvas?"
  - "How would you support undo of the last operation efficiently?"
common_errors:
  - "Assuming the first corner is always the top-left one."
  - "Clipping only the lower bounds (or only the upper bounds) and indexing out of range."
  - "Skipping operations whose colour is 0 because 0 looks like 'empty'."
  - "Building the grid with a repeated reference to one row so painting one row paints all of them."
