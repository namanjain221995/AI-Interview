time_limit_minutes: 12
prompt_markdown: |
  ## Canvas Paint Operations

  A lightweight drawing widget stores its canvas as a `rows x cols` grid of colour codes; every cell
  starts as `0`. To restore a saved drawing, the widget replays the user's paint operations **in order**.

  Each operation is `[r1, c1, r2, c2, color]`. It fills every cell `(r, c)` with
  `min(r1, r2) <= r <= max(r1, r2)` and `min(c1, c2) <= c <= max(c1, c2)` with `color`, replacing whatever
  was there, so later operations overwrite earlier ones.

  The operations were recorded from drag gestures, which means:

  - the two corners can be given in **any order** (the drag may go up, down, left or right);
  - a rectangle can lie **partly or completely outside** the canvas: only the cells inside the canvas are
    painted, and an operation that misses the canvas changes nothing;
  - colour `0` is a normal colour (the eraser).

  Return the final canvas as a list of `rows` rows, each with `cols` colour codes.

  ### Example 1
  ```
  Input:  rows = 3, cols = 4, ops = [[0, 0, 1, 2, 5], [2, 3, 1, 1, 7]]
  Output: [[5, 5, 5, 0], [5, 7, 7, 7], [0, 7, 7, 7]]
  Explanation: The first operation paints rows 0-1, columns 0-2 with 5. The second has its corners
               reversed and paints rows 1-2, columns 1-3 with 7, overwriting the overlap.
  ```

  ### Example 2
  ```
  Input:  rows = 2, cols = 3, ops = [[-1, 2, 5, 9, 4], [3, 0, 4, 2, 8]]
  Output: [[0, 0, 4], [0, 0, 4]]
  Explanation: The first rectangle is clipped to column 2 of both rows. The second lies entirely below
               the canvas and changes nothing.
  ```

  ### Constraints
  - `1 <= rows, cols <= 50`
  - `0 <= ops.length <= 200`
  - `ops[i].length == 5`
  - `-1000 <= r1, c1, r2, c2 <= 1000`
  - `0 <= color <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: paint_canvas
  params:
    - {name: rows, type: "int"}
    - {name: cols, type: "int"}
    - {name: ops, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def paint_canvas(rows: int, cols: int, ops: list[list[int]]) -> list[list[int]]:
        canvas = [[0] * cols for _ in range(rows)]
        for r1, c1, r2, c2, color in ops:
            top, bottom = max(min(r1, r2), 0), min(max(r1, r2), rows - 1)
            left, right = max(min(c1, c2), 0), min(max(c1, c2), cols - 1)
            for r in range(top, bottom + 1):
                for c in range(left, right + 1):
                    canvas[r][c] = color
        return canvas
  javascript: |
    function paintCanvas(rows, cols, ops) {
      const canvas = Array.from({ length: rows }, () => new Array(cols).fill(0));
      for (const [r1, c1, r2, c2, color] of ops) {
        const top = Math.max(Math.min(r1, r2), 0);
        const bottom = Math.min(Math.max(r1, r2), rows - 1);
        const left = Math.max(Math.min(c1, c2), 0);
        const right = Math.min(Math.max(c1, c2), cols - 1);
        for (let r = top; r <= bottom; r++) {
          for (let c = left; c <= right; c++) {
            canvas[r][c] = color;
          }
        }
      }
      return canvas;
    }
