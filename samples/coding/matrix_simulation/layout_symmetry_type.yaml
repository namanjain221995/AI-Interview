version: 1
slug: layout_symmetry_type
title: Floor Layout Symmetry
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [frontend, mobile, general, qa]
time_limit_minutes: 12
prompt_markdown: |
  ## Floor Layout Symmetry

  A floor-plan linter receives a layout as a list of equal-length strings, one string per row, where
  each character is a cell (for example `#` for a wall and `.` for open floor). Before a template is
  published, the linter labels its symmetry:

  - **mirror**: the layout equals its own left-right mirror image, that is every row reads the same
    backwards.
  - **rotation**: the layout equals itself turned by 180 degrees, that is the cell at row `r`, column
    `c` equals the cell at row `rows - 1 - r`, column `cols - 1 - c` for every cell.

  Characters are compared exactly as they are (case-sensitive, never transformed when flipped).
  Return `"both"` if both properties hold, `"mirror"` or `"rotation"` if only that one holds, and
  `"none"` otherwise.

  ### Example 1
  ```
  Input:  layout = ["#..#", ".##.", "#..#"]
  Output: "both"
  ```

  ### Example 2
  ```
  Input:  layout = ["#.#", "..."]
  Output: "mirror"
  Explanation: Each row is a palindrome, but turned upside down the all-dot row would be on top.
  ```

  ### Example 3
  ```
  Input:  layout = ["ab.", "#.#", ".ba"]
  Output: "rotation"
  ```

  ### Constraints
  - `1 <= layout.length <= 200`
  - `1 <= layout[i].length <= 200` and all rows have the same length
  - Every character is a printable ASCII character other than a space.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: layout_symmetry_type
  params:
    - {name: layout, type: "string[]"}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def layout_symmetry_type(layout: list[str]) -> str:
        rows = len(layout)
        mirror = all(row == row[::-1] for row in layout)
        rotation = all(layout[r] == layout[rows - 1 - r][::-1] for r in range(rows))
        if mirror and rotation:
            return "both"
        if mirror:
            return "mirror"
        if rotation:
            return "rotation"
        return "none"
  javascript: |
    function layoutSymmetryType(layout) {
      const rows = layout.length;
      const reversed = (s) => s.split("").reverse().join("");
      const mirror = layout.every((row) => row === reversed(row));
      const rotation = layout.every((row, r) => row === reversed(layout[rows - 1 - r]));
      if (mirror && rotation) return "both";
      if (mirror) return "mirror";
      if (rotation) return "rotation";
      return "none";
    }
tests:
  - {id: t1, args: [["#..#", ".##.", "#..#"]], expected: "both", description: "Example 1"}
  - {id: t2, args: [["#.#", "..."]], expected: "mirror", description: "Example 2 - mirror only"}
  - {id: t3, args: [["ab.", "#.#", ".ba"]], expected: "rotation", description: "Example 3 - rotation only"}
  - {id: t4, hidden: true, args: [["x"]], expected: "both", description: "Single cell"}
  - {id: t5, hidden: true, args: [["abcba"]], expected: "both", description: "Single palindromic row"}
  - {id: t6, hidden: true, args: [["a", "b"]], expected: "mirror", description: "Single column - mirror holds trivially, rotation does not"}
  - {id: t7, hidden: true, args: [["ab", "cd"]], expected: "none", description: "No symmetry"}
  - {id: t8, hidden: true, args: [["Aa"]], expected: "none", description: "Case-sensitive comparison"}
  - {id: t9, hidden: true, args: [["ab", "ab"]], expected: "none", description: "Repeated rows are neither mirror nor rotation"}
  - {id: t10, hidden: true, args: [["+.+.++++#..#++++.+.+", "#+###..#.++.#..###+#", "#+##+#..#..#..#+##+#", "###++.########.++###", "####..#++++++#..####", "##+#..#..##..#..#+##", "#.#..++#++++#++..#.#", "+.#....+.##.+....#.+", "..+##.#+....+#.##+..", "#+...+#.#++#.#+...+#", "#+...+#.#++#.#+...+#", "..+##.#+....+#.##+..", "+.#....+.##.+....#.+", "#.#..++#++++#++..#.#", "##+#..#..##..#..#+##", "####..#++++++#..####", "###++.########.++###", "#+##+#..#..#..#+##+#", "#+###..#.++.#..###+#", "+.+.++++#..#++++.+.+"]], expected: "both", description: "20 x 20 layout symmetric both ways (stress)"}
  - {id: t11, hidden: true, args: [["+.+.++++#..#++++.+.+", "#+###..#.++.#..###+#", "#+##+#..#..#..#+##+#", "###++.########.++###", "####..#++++++#..####", "##+#..#..##..#..#+##", "#.#..++#++++#++..#.#", "+.#....+.##.+....#.+", "..+##.#+....+#.##+..", "#+...+#.#++#.#+...+#", "#+...+#.#++#.#+...+#", "..+##.#+....+#.##+..", "+.#....+.##.+....#.+", "#.#.#++#++++#++..#.#", "##+#..#..##..#..#+##", "####..#++++++#..####", "###++.########.++###", "#+##+#..#..#..#+##+#", "#+###..#.++.#..###+#", "+.+.++++#..#++++.+.+"]], expected: "none", description: "20 x 20 layout with one broken cell"}
expected_concepts:
  - "index mapping for a horizontal mirror and a 180 degree rotation"
  - "checking two independent properties and combining the results"
  - "early exit on the first mismatch"
  - "O(rows * cols) time"
optimal_complexity: {time: "O(rows * cols)", space: O(1)}
rubric:
  excellent: "States both index mappings precisely, checks each with a pass that can stop at the first mismatch (or compares only half the cells), combines the two booleans into the four labels and explains O(rows * cols) time and O(1) extra space."
  good: "Correct labels using reversed copies of the rows, perhaps after fixing the rotation mapping on non-square layouts."
  weak: "Confuses 180 degree rotation with a vertical flip, assumes square layouts, or returns only one label when both properties hold."
  criteria:
    correctness: "All tests pass, including single cells, single rows, single columns and broken large layouts."
    efficiency: "Each cell is compared a constant number of times."
    code_quality: "The two checks are separate, named predicates and the label selection is easy to follow."
    edge_cases: "Odd and even dimensions, single-column layouts and case-sensitive characters."
    communication: "Explains why a 180 degree rotation is a row reversal plus a reversal of each row."
hints:
  - "Treat the two properties separately: decide whether the layout is a mirror image of itself and, independently, whether it survives a half turn, then pick the label."
  - "A left-right mirror only reverses each row, while a half turn both reverses the order of the rows and reverses each row, so a cell is paired with the cell at the opposite row and opposite column."
  - "For the mirror check compare each row with its own reverse; for the rotation check compare row r with the reverse of row (rows minus one minus r); compute both booleans, return both if both hold, the single property's name if only one holds, and none otherwise."
followups:
  - "How would you also detect top-bottom symmetry and 90 degree rotational symmetry for square layouts?"
  - "Can you do the checks without creating any reversed string copies?"
  - "If the linter had to report the first mismatching cell for each property, how would you return it?"
common_errors:
  - "Checking a top-bottom flip (reversing only the row order) instead of a 180 degree rotation."
  - "Returning mirror or rotation when both hold because of the order of the checks."
  - "Comparing row r with row cols - 1 - r on non-square layouts."
  - "Lower-casing characters before comparing, which hides real differences."
