expected_concepts:
  - multi-source breadth-first search
  - queue seeded with every source at distance 0
  - "4-directional neighbours with bounds checks"
  - unreached cells left at -1
  - each cell enqueued at most once
optimal_complexity: {time: "O(m * n)", space: "O(m * n)"}
rubric:
  excellent: "Recognises a multi-source BFS, seeds the queue with every 'S' at minute 0, marks cells when they are enqueued, leaves walls and unreachable racks at -1 and explains why BFS order yields the earliest minute in O(m * n)."
  good: Correct BFS, possibly running one search per seed and taking the minimum (slower) or needing a nudge to mark cells on enqueue rather than dequeue.
  weak: Uses a single-seed search, depth-first search that records non-minimal minutes, minute-by-minute grid rescans without noting the cost, or spreads diagonally.
  criteria:
    correctness: All tests pass, including no seeds, all seeds and isolated racks.
    efficiency: Every cell is processed once by a single breadth-first search.
    code_quality: Clear separation of seeding, the BFS loop and the neighbour checks.
    edge_cases: Zero seeds, 1 x 1 floors, racks enclosed by empty space and diagonal-only contact.
    communication: Explains why seeding all sources together gives the minimum distance to the nearest seed.
hints:
  - The minute a rack is patched equals its shortest walking distance, in up-down-left-right steps over racks, to the nearest seed.
  - Rather than searching from each seed separately, start one breadth-first search from all seeds at once, all at distance zero.
  - "Fill the answer with -1, put every seed in a queue with minute zero, then pop cells in order and give each unvisited neighbouring rack the popped cell's minute plus one before enqueueing it. Cells never reached keep -1."
followups:
  - How would the answer change if each rack needed a different number of minutes to install the patch before relaying it?
  - How would you also report the minute at which the whole rollout finishes, or that it can never finish?
  - If some links between neighbouring racks were down, how would you represent and handle that?
  - How would you process a hall too large for memory, streamed one row at a time?
common_errors:
  - Running a separate search per seed and overwriting earlier minutes instead of taking the minimum.
  - Marking cells as visited only when dequeued, which enqueues duplicates and can record later minutes.
  - Letting the patch travel through empty floor space or diagonally.
  - Returning 0 instead of -1 for racks that are never reached.
