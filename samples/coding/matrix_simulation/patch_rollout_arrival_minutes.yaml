slug: patch_rollout_arrival_minutes
title: Patch Rollout Arrival Times
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, sre, platform, cloud]
time_limit_minutes: 20
prompt_markdown: |
  ## Patch Rollout Arrival Times

  A security patch is rolled out across a server hall by a peer-to-peer agent. The hall is described by
  `floor`, a list of equal-length strings, one per row:

  - `'S'` a seed rack that already has the patch at minute `0`,
  - `'.'` a rack that still needs the patch,
  - `'#'` empty floor space with no rack.

  Every minute, each rack that has the patch copies it to every rack directly **above, below, left or
  right** of it (not diagonally) that does not have it yet. Empty space never relays the patch.

  Return an `m x n` grid of integers where cell `[r][c]` is the minute at which the rack at that position
  receives the patch. Use `-1` for empty floor space and for racks the rollout never reaches.

  ### Example 1
  ```
  Input:  floor = ["S..#", ".#..", "...S"]
  Output: [[0, 1, 2, -1], [1, -1, 2, 1], [2, 2, 1, 0]]
  Explanation: (1,2) is reached from the right seed after 2 minutes, before the left seed gets there.
  ```

  ### Example 2
  ```
  Input:  floor = ["S.#.", "..#.", "##.."]
  Output: [[0, 1, -1, -1], [1, 2, -1, -1], [-1, -1, -1, -1]]
  Explanation: The right-hand racks are separated from the seed by empty space and never receive the patch.
  ```

  ### Constraints
  - `1 <= m, n <= 60`, where `m = floor.length` and `n = floor[i].length`
  - Every row has the same length and contains only `'S'`, `'.'` and `'#'`.
  - There may be zero, one or many seed racks.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rollout_arrival_minutes
  params:
    - {name: floor, type: "string[]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def rollout_arrival_minutes(floor: list[str]) -> list[list[int]]:
        m, n = len(floor), len(floor[0])
        minutes = [[-1] * n for _ in range(m)]
        queue: deque[tuple[int, int]] = deque()
        for r in range(m):
            for c in range(n):
                if floor[r][c] == "S":
                    minutes[r][c] = 0
                    queue.append((r, c))
        while queue:
            r, c = queue.popleft()
            for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
                rr, cc = r + dr, c + dc
                if 0 <= rr < m and 0 <= cc < n and floor[rr][cc] == "." and minutes[rr][cc] == -1:
                    minutes[rr][cc] = minutes[r][c] + 1
                    queue.append((rr, cc))
        return minutes
  javascript: |
    function rolloutArrivalMinutes(floor) {
      const m = floor.length, n = floor[0].length;
      const minutes = Array.from({ length: m }, () => new Array(n).fill(-1));
      const queue = [];
      for (let r = 0; r < m; r++) {
        for (let c = 0; c < n; c++) {
          if (floor[r][c] === "S") {
            minutes[r][c] = 0;
            queue.push([r, c]);
          }
        }
      }
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let head = 0; head < queue.length; head++) {
        const [r, c] = queue[head];
        for (const [dr, dc] of steps) {
          const rr = r + dr, cc = c + dc;
          if (rr < 0 || rr >= m || cc < 0 || cc >= n) continue;
          if (floor[rr][cc] !== "." || minutes[rr][cc] !== -1) continue;
          minutes[rr][cc] = minutes[r][c] + 1;
          queue.push([rr, cc]);
        }
      }
      return minutes;
    }
