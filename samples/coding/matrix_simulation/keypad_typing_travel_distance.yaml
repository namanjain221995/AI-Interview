version: 1
slug: keypad_typing_travel_distance
title: Kiosk Keypad Travel
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [frontend, mobile, qa, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Kiosk Keypad Travel

  A self-service kiosk shows an on-screen keypad, and the UX team wants to compare layouts by how far a
  single finger has to travel to type common entries. The keypad is given as `layout`: a list of rows of
  equal length, where `layout[r][c]` is the key in row `r`, column `c`. Every key character appears at most
  once, except `'.'`, which marks an empty slot and is never typed.

  The finger starts on the key of the first character of `text` at no cost. Moving from the key at
  `(r1, c1)` to the key at `(r2, c2)` for the next character costs `|r1 - r2| + |c1 - c2|`; pressing the
  same key again costs `0`.

  Return the total cost of typing `text`. Every character of `text` appears on the keypad, and typing an
  empty `text` costs `0`.

  ### Example 1
  ```
  Input:  layout = ["123", "456", "789", ".0."], text = "2580"
  Output: 3
  Explanation: Each move goes one row down in the same column: 1 + 1 + 1 = 3.
  ```

  ### Example 2
  ```
  Input:  layout = ["QWERTYUIOP", "ASDFGHJKL-", "ZXCVBNM@_."], text = "CAFE"
  Output: 8
  Explanation: C (2, 2) to A (1, 0) costs 3, A to F (1, 3) costs 3, F to E (0, 2) costs 2.
  ```

  ### Example 3
  ```
  Input:  layout = ["AB", "CD"], text = ""
  Output: 0
  ```

  ### Constraints
  - `1 <= layout.length <= 10`
  - `1 <= layout[i].length <= 15`, and all rows have the same length.
  - Keys are printable ASCII characters without spaces; every character other than `'.'` appears at most once.
  - `0 <= text.length <= 1000`
  - Every character of `text` appears in `layout`, and `text` never contains `'.'`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: typing_travel_distance
  params:
    - {name: layout, type: "string[]"}
    - {name: text, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def typing_travel_distance(layout: list[str], text: str) -> int:
        position = {}
        for r, row in enumerate(layout):
            for c, key in enumerate(row):
                if key != ".":
                    position[key] = (r, c)
        total = 0
        for prev, cur in zip(text, text[1:]):
            (r1, c1), (r2, c2) = position[prev], position[cur]
            total += abs(r1 - r2) + abs(c1 - c2)
        return total
  javascript: |
    function typingTravelDistance(layout, text) {
      const position = new Map();
      layout.forEach((row, r) => {
        for (let c = 0; c < row.length; c++) {
          if (row[c] !== ".") position.set(row[c], [r, c]);
        }
      });
      let total = 0;
      for (let i = 1; i < text.length; i++) {
        const [r1, c1] = position.get(text[i - 1]);
        const [r2, c2] = position.get(text[i]);
        total += Math.abs(r1 - r2) + Math.abs(c1 - c2);
      }
      return total;
    }
tests:
  - {id: t1, args: [["123", "456", "789", ".0."], "2580"], expected: 3, description: "Example 1 - straight down the middle column of a PIN pad"}
  - {id: t2, args: [["QWERTYUIOP", "ASDFGHJKL-", "ZXCVBNM@_."], "CAFE"], expected: 8, description: "Example 2 - moves across rows and columns"}
  - {id: t3, args: [["AB", "CD"], ""], expected: 0, description: "Example 3 - empty text costs nothing"}
  - {id: t4, hidden: true, args: [["ABC"], "B"], expected: 0, description: "Single character - no movement"}
  - {id: t5, hidden: true, args: [["12", "34"], "1111"], expected: 0, description: "Repeated presses of the same key cost 0"}
  - {id: t6, hidden: true, args: [["ABCDEFGHIJ"], "AJAJ"], expected: 27, description: "Single-row layout - only horizontal travel"}
  - {id: t7, hidden: true, args: [["X", "Y", "Z", "W"], "XWYZ"], expected: 6, description: "Single-column layout - only vertical travel"}
  - {id: t8, hidden: true, args: [["1.3", ".5.", "7.9"], "19371"], expected: 12, description: "Layout with empty slots; diagonal corners cost row plus column distance"}
  - {id: t9, hidden: true, args: [["QWERTYUIOP", "ASDFGHJKL-", "ZXCVBNM@_."], "HELLO-WORLD"], expected: 47, description: "Word with a double letter and a symbol key"}
  - {id: t10, hidden: true, args: [["QWERTYUIOP", "ASDFGHJKL-", "ZXCVBNM@_."], "ZPZPQ@"], expected: 51, description: "Opposite corners of the keypad repeatedly"}
  - {id: t11, hidden: true, args: [["QWERTYUIOP", "ASDFGHJKL-", "ZXCVBNM@_."], ""], expected: 6628, description: "1000-character text mixing far jumps, repeats and a scan of the alphabet"}
expected_concepts:
  - "precomputing a hash map from key to coordinates"
  - "Manhattan distance between grid positions"
  - "summing costs over consecutive pairs"
  - "free starting position and zero-cost repeats"
optimal_complexity: {time: "O(R * C + L)", space: "O(R * C)"}
rubric:
  excellent: "Builds a key-to-position map once, sums Manhattan distances over consecutive characters, handles empty and single-character text naturally and states O(R * C + L) time instead of searching the layout per character."
  good: "Correct total, possibly searching the layout for every character (O(L * R * C)) and improving it when asked."
  weak: "Charges a cost for the first character, uses Euclidean distance, swaps row and column indexes, or crashes on empty text."
  criteria:
    correctness: "All tests pass, including empty text, repeated keys and layouts with empty slots."
    efficiency: "One pass over the layout and one pass over the text."
    code_quality: "Separates building the position lookup from summing the distances, with clear names."
    edge_cases: "Empty text, a single character, single-row and single-column layouts and '.' slots."
    communication: "Clarifies the starting cost and the distance metric before coding."
hints:
  - "The cost depends only on where consecutive characters sit on the keypad, so first think about how to find a character's row and column quickly."
  - "Scan the layout once and remember the coordinates of every real key in a map; then each step between neighbouring characters of the text is a simple distance calculation."
  - "Build a map from each key other than the empty-slot marker to its row and column, then walk the text from the second character onwards and add the absolute row difference plus the absolute column difference between the current character and the previous one; an empty or one-character text adds nothing."
followups:
  - "With two fingers that can each start anywhere, how would you minimise the total travel?"
  - "How would you compare two layouts over a list of common entries with weights by frequency?"
  - "What if diagonal moves cost the same as straight moves (Chebyshev distance)?"
common_errors:
  - "Adding a cost for moving onto the first character."
  - "Searching the whole layout for every character instead of precomputing positions."
  - "Storing the '.' slot in the lookup so the last empty slot overwrites a real position or is treated as a key."
  - "Indexing text[i + 1] past the end or failing on an empty string."
