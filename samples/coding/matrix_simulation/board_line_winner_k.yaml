slug: board_line_winner_k
title: K-in-a-Row Board Check
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [general, frontend, qa, mobile]
time_limit_minutes: 20
prompt_markdown: |
  ## K-in-a-Row Board Check

  A multiplayer game server stores finished boards for an audit job. A board is an `m x n` grid given as
  `board`, a list of equal-length strings; each character is `'X'`, `'O'` or `'.'` (empty). The audit job
  must decide who has a winning line for a configurable target length `k`.

  A symbol **has a line** if there are `k` consecutive cells containing that symbol along one straight
  direction: a row (horizontal), a column (vertical), a down-right diagonal or a down-left diagonal. A
  longer run also counts.

  The board is not guaranteed to come from a legal game, so both symbols may have a line. Return:

  - `"X"` if only `'X'` has a line,
  - `"O"` if only `'O'` has a line,
  - `"both"` if both do,
  - `"none"` if neither does (for example when `k` is larger than both board dimensions).

  ### Example 1
  ```
  Input:  board = ["X.O.", ".XO.", "O.X."], k = 3
  Output: "X"
  Explanation: X occupies (0,0), (1,1), (2,2). O's vertical run in column 2 is broken by X at (2,2).
  ```

  ### Example 2
  ```
  Input:  board = ["XXO", "OOX", "XOO"], k = 2
  Output: "both"
  ```

  ### Example 3
  ```
  Input:  board = ["XXXX"], k = 5
  Output: "none"
  ```

  ### Constraints
  - `1 <= m, n <= 60`, where `m = board.length` and `n = board[i].length`
  - Every row has the same length and contains only `'X'`, `'O'` and `'.'`.
  - `1 <= k <= 100`

  **Follow-up:** can you decide the result in a single pass over the board?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: board_line_winner
  params:
    - {name: board, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def board_line_winner(board: list[str], k: int) -> str:
        m, n = len(board), len(board[0])
        directions = [(0, 1), (1, 0), (1, 1), (1, -1)]
        runs = [[[0] * n for _ in range(m)] for _ in directions]
        winners: set[str] = set()
        for r in range(m):
            for c in range(n):
                symbol = board[r][c]
                if symbol == ".":
                    continue
                for d, (dr, dc) in enumerate(directions):
                    pr, pc = r - dr, c - dc
                    previous = 0
                    if 0 <= pr < m and 0 <= pc < n and board[pr][pc] == symbol:
                        previous = runs[d][pr][pc]
                    runs[d][r][c] = previous + 1
                    if runs[d][r][c] >= k:
                        winners.add(symbol)
        if len(winners) == 2:
            return "both"
        return winners.pop() if winners else "none"
  javascript: |
    function boardLineWinner(board, k) {
      const m = board.length, n = board[0].length;
      const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];
      const runs = directions.map(() => Array.from({ length: m }, () => new Array(n).fill(0)));
      const winners = new Set();
      for (let r = 0; r < m; r++) {
        for (let c = 0; c < n; c++) {
          const symbol = board[r][c];
          if (symbol === ".") continue;
          directions.forEach(([dr, dc], d) => {
            const pr = r - dr, pc = c - dc;
            let previous = 0;
            if (pr >= 0 && pr < m && pc >= 0 && pc < n && board[pr][pc] === symbol) previous = runs[d][pr][pc];
            runs[d][r][c] = previous + 1;
            if (runs[d][r][c] >= k) winners.add(symbol);
          });
        }
      }
      if (winners.size === 2) return "both";
      if (winners.size === 1) return [...winners][0];
      return "none";
    }
