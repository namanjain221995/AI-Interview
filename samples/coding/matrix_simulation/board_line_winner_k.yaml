expected_concepts:
  - four line directions
  - run-length counting along each direction
  - only extending runs from the previous cell in the same direction
  - result can be both or none
  - k larger than the board
optimal_complexity: {time: "O(m * n)", space: "O(m * n)"}
rubric:
  excellent: Counts runs in all four directions in a single pass (dynamic programming on the previous cell or scanning each line once), handles both and none, k larger than the board and k = 1, and states O(m * n) time.
  good: Correct check that starts a k-length probe from every cell in every direction, O(m * n * k), with a clear complexity statement.
  weak: Forgets the down-left diagonal, stops at the first winner and never reports both, treats empty cells as a symbol, or indexes outside the board.
  criteria:
    correctness: All tests pass, including both, none, k = 1 and anti-diagonals.
    efficiency: Linear in the board size, or O(m * n * k) with a stated reason.
    code_quality: Directions are data (a list of offsets) instead of four copy-pasted loops.
    edge_cases: k = 1, k larger than the board, single rows or columns and empty boards.
    communication: Explains why only previous cells in the same direction need to be consulted.
hints:
  - There are only four line directions to consider, and a line is just a run of equal non-empty cells along one of them.
  - Represent the directions as row and column offsets and, for each non-empty cell, work out how long the run of its symbol is that ends at that cell in each direction.
  - Scan rows top to bottom and columns left to right; the run ending at a cell in a direction is one more than the run at the previous cell in that direction if that cell holds the same symbol, otherwise one. Collect every symbol whose run reaches k, then map the collected set to X, O, both or none.
followups:
  - How would you check only the lines through the last move in a live game?
  - How would you validate that the board could come from a legal alternating game?
  - How would the check change on a board that wraps around at the edges?
  - How would you report the coordinates of a winning line?
common_errors:
  - Checking only one diagonal direction.
  - Returning as soon as one winner is found so both is never reported.
  - Counting empty cells as a third symbol that can win.
  - Index errors when k is larger than the board or when probing past the last column.
