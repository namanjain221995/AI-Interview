slug: conveyor_min_arrow_changes
title: Conveyor Arrow Rerouting
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, platform, general, devops]
time_limit_minutes: 30
prompt_markdown: |
  ## Conveyor Arrow Rerouting

  A parcel sorting floor is a rectangular grid of conveyor tiles, given as `arrows` with one string per
  row. Every tile has a direction:

  - `'>'` sends a parcel to the tile on its right,
  - `'<'` to the tile on its left,
  - `'^'` to the tile above,
  - `'v'` to the tile below.

  A parcel is dropped on the **top-left** tile and keeps following the arrows. It must arrive at the
  packing station on the **bottom-right** tile, where it is taken off the belt. A parcel that is sent
  past the edge of the floor is lost, and one that keeps circling never arrives.

  An operator can rotate any tile to any other direction; each rotated tile costs `1`, and the arrow on
  the bottom-right tile itself never matters. Return the **minimum number of tiles** that must be rotated
  so that the parcel reaches the packing station. Return `0` if it already does, including when the floor
  is a single tile.

  ### Example 1
  ```
  Input:  arrows = [">v<<", "^<>v", "v^<<", ">>^<"]
  Output: 2
  Explanation: As given, the parcel goes right, down, left, up and is back on the start tile forever.
               Rotating the tile at row 1, column 1 to '>' and the tile at row 2, column 3 to 'v'
               gives the route (0,0) (0,1) (1,1) (1,2) (1,3) (2,3) (3,3). No single rotation is enough.
  ```

  ### Example 2
  ```
  Input:  arrows = ["v<<", ">>v", "^<v"]
  Output: 0
  Explanation: (0,0) -> (1,0) -> (1,1) -> (1,2) -> (2,2) already reaches the packing station.
  ```

  ### Example 3
  ```
  Input:  arrows = ["<<<<"]
  Output: 3
  Explanation: The first three tiles must all be turned to '>'.
  ```

  ### Constraints
  - `1 <= arrows.length <= 100`
  - `1 <= arrows[i].length <= 100`, and all rows have the same length
  - `arrows[i][j]` is one of `'>'`, `'<'`, `'^'`, `'v'`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_arrow_changes
  params:
    - {name: arrows, type: "string[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def min_arrow_changes(arrows: list[str]) -> int:
        rows, cols = len(arrows), len(arrows[0])
        moves = {">": (0, 1), "<": (0, -1), "v": (1, 0), "^": (-1, 0)}
        inf = float("inf")
        cost = [[inf] * cols for _ in range(rows)]
        cost[0][0] = 0
        queue = deque([(0, 0)])
        while queue:
            r, c = queue.popleft()
            here = cost[r][c]
            for symbol, (dr, dc) in moves.items():
                nr, nc = r + dr, c + dc
                if not (0 <= nr < rows and 0 <= nc < cols):
                    continue
                step = 0 if arrows[r][c] == symbol else 1
                if here + step < cost[nr][nc]:
                    cost[nr][nc] = here + step
                    if step == 0:
                        queue.appendleft((nr, nc))
                    else:
                        queue.append((nr, nc))
        return cost[rows - 1][cols - 1]
  javascript: |
    function minArrowChanges(arrows) {
      const rows = arrows.length;
      const cols = arrows[0].length;
      const moves = [[">", 0, 1], ["<", 0, -1], ["v", 1, 0], ["^", -1, 0]];
      const cost = Array.from({ length: rows }, () => new Array(cols).fill(Infinity));
      cost[0][0] = 0;
      // 0-1 BFS with a deque made of two stacks: front holds cost-0 moves.
      let current = [[0, 0]];
      let next = [];
      let level = 0;
      while (current.length > 0) {
        const [r, c] = current.pop();
        if (cost[r][c] === level) {
          for (const [symbol, dr, dc] of moves) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            const step = arrows[r][c] === symbol ? 0 : 1;
            if (level + step < cost[nr][nc]) {
              cost[nr][nc] = level + step;
              if (step === 0) current.push([nr, nc]);
              else next.push([nr, nc]);
            }
          }
        }
        if (current.length === 0) {
          current = next;
          next = [];
          level += 1;
        }
      }
      return cost[rows - 1][cols - 1];
    }
