expected_concepts:
  - "modelling the floor as a graph where following a tile's arrow costs 0 and any other direction costs 1"
  - "0-1 BFS with a double-ended queue (or Dijkstra) for shortest paths with 0/1 weights"
  - "an optimal route never revisits a tile, so each rotation is counted once"
  - "greedy right/down routes are wrong because zero-cost detours may go up or left"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Reframes rotations as edge weights (0 along the arrow, 1 otherwise), justifies why a shortest path never needs to reuse a tile, implements 0-1 BFS with a deque in O(rows * cols) and explains why Dijkstra also works at an extra log factor."
  good: "Builds the weighted-graph model and solves it correctly with Dijkstra or 0-1 BFS, possibly needing a prompt for the 1 x 1 case or the complexity argument."
  weak: "Tries a greedy right/down walk, simulates rotations by trial and error, uses plain BFS that ignores the 0/1 weights, or counts rotations along a path that loops."
  criteria:
    correctness: "All tests pass, including cycles, the 1 x 1 floor, single rows and columns, and routes that must move up or left."
    efficiency: "Linear-time 0-1 BFS is the best; Dijkstra in O(rows * cols * log(rows * cols)) is acceptable; exhaustive search over rotations is not."
    code_quality: "A single direction table mapping each arrow symbol to its row and column offset, and a clear distance grid."
    edge_cases: "Single tile, arrows pointing off the floor, the start already reaching the target, and arrows forming a loop."
    communication: "Explains the graph model before coding and argues why pushing 0-cost edges to the front of the deque keeps distances correct."
hints:
  - "Think of every tile as a node with four possible exits. Following the printed arrow is free; leaving in any other direction means the tile had to be rotated."
  - "That makes it a shortest-path problem on a grid where every edge costs either 0 or 1. Which shortest-path technique fits weights that are only 0 or 1 better than plain breadth-first search?"
  - "Run a 0-1 BFS from the top-left tile with a double-ended queue: for each of the four neighbours, the cost is 0 if it matches the current tile's arrow and 1 otherwise; push 0-cost improvements to the front and 1-cost improvements to the back, and return the distance stored for the bottom-right tile."
followups:
  - "Why does an optimal route never pass over the same tile twice, so that each rotation is paid only once?"
  - "How would you also return which tiles to rotate?"
  - "What changes if some tiles are fixed and cannot be rotated, or if rotating clockwise and counter-clockwise have different costs?"
  - "How would the approach change for many parcels that start on different tiles but share one packing station?"
common_errors:
  - "Walking greedily right and down, which misses zero-cost detours that go up or left."
  - "Using plain BFS that counts steps instead of rotations."
  - "Pushing 1-cost neighbours to the front of the deque (or 0-cost ones to the back) and finalising distances too early."
  - "Not handling the 1 x 1 floor or looping forever when simulating the arrows."
