version: 1
slug: resolve_shell_path
title: "Resolve a Shell Path"
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [devops, platform, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Resolve a Shell Path

  A deployment tool replays shell scripts in a dry-run mode and must know which directory each
  `cd target` command would land in, without touching a real file system. Given the current
  directory `cwd` and the argument `target`, return the directory after the command:

  - If `target` starts with `/` it is **absolute** and `cwd` is ignored. Otherwise it is **relative**
    and is resolved starting from `cwd`.
  - Paths are split into segments on `/`. Empty segments (from repeated or trailing slashes) and `.`
    segments are dropped.
  - A `..` segment removes the most recent remaining segment; at the root (`/`) it does nothing.
  - Every other segment is an ordinary directory name, even if it contains dots (`...`, `.env`,
    `..backup`). No symbolic links exist and the directories do not need to exist.
  - `cwd` always starts with `/` but may itself contain `.`, `..` or repeated slashes; the same rules
    apply to it.

  Return the canonical absolute path: a `/` followed by the remaining segments joined with `/`, with
  no trailing slash. The root directory is `"/"`. An empty `target` leaves you in `cwd`.

  ### Example 1
  ```
  Input:  cwd = "/home/dev/app", target = "../logs/./today"
  Output: "/home/dev/logs/today"
  ```

  ### Example 2
  ```
  Input:  cwd = "/srv/releases", target = "/etc//nginx/"
  Output: "/etc/nginx"
  ```

  ### Example 3
  ```
  Input:  cwd = "/opt", target = "../../.."
  Output: "/"
  Explanation: The first .. leaves /opt for /, the others do nothing at the root.
  ```

  ### Constraints
  - `1 <= cwd.length <= 3000` and `cwd` starts with `/`
  - `0 <= target.length <= 3000`
  - Both strings contain only ASCII letters, digits, `.`, `_`, `-` and `/`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: resolve_path
  params:
    - {name: cwd, type: "string"}
    - {name: target, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def resolve_path(cwd: str, target: str) -> str:
        full = target if target.startswith("/") else cwd + "/" + target
        stack: list[str] = []
        for segment in full.split("/"):
            if segment in ("", "."):
                continue
            if segment == "..":
                if stack:
                    stack.pop()
            else:
                stack.append(segment)
        return "/" + "/".join(stack)
  javascript: |
    function resolvePath(cwd, target) {
      const full = target.startsWith("/") ? target : cwd + "/" + target;
      const stack = [];
      for (const segment of full.split("/")) {
        if (segment === "" || segment === ".") continue;
        if (segment === "..") {
          if (stack.length > 0) stack.pop();
        } else {
          stack.push(segment);
        }
      }
      return "/" + stack.join("/");
    }
tests:
  - {id: t1, args: ["/home/dev/app", "../logs/./today"], expected: "/home/dev/logs/today", description: "Example 1 - relative path with .. and ."}
  - {id: t2, args: ["/srv/releases", "/etc//nginx/"], expected: "/etc/nginx", description: "Example 2 - absolute target with repeated and trailing slashes"}
  - {id: t3, args: ["/opt", "../../.."], expected: "/", description: "Example 3 - .. at the root does nothing"}
  - {id: t4, hidden: true, args: ["/var/www", ""], expected: "/var/www", description: "Empty target stays in cwd"}
  - {id: t5, hidden: true, args: ["/var/www/", "."], expected: "/var/www", description: "Dot target with a trailing slash on cwd"}
  - {id: t6, hidden: true, args: ["/", "////"], expected: "/", description: "Absolute target made only of slashes is the root"}
  - {id: t7, hidden: true, args: ["/a/b", "..."], expected: "/a/b/...", description: "Three dots is an ordinary directory name"}
  - {id: t8, hidden: true, args: ["/app", ".config/../.env/..backup"], expected: "/app/.env/..backup", description: "Names starting with dots are ordinary unless exactly . or .."}
  - {id: t9, hidden: true, args: ["/x/y", "/../../z/./"], expected: "/z", description: "Absolute target climbing above the root then descending"}
  - {id: t10, hidden: true, args: ["/data/./tmp//", "../logs"], expected: "/data/logs", description: "Non-canonical cwd is normalised by the same rules"}
  - {id: t11, hidden: true, args: ["/a/b/c", "../../../../d/.."], expected: "/", description: "Climb past the root mid-path and come back to the root"}
  - {id: t12, hidden: true, args: ["/", "../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../"], expected: "/a", description: "Stress: 300 nested directories then 299 levels back up"}
expected_concepts:
- stack of path segments
- splitting on a separator and filtering empty segments
- absolute versus relative path resolution
- boundary behaviour at the root
optimal_complexity:
  time: O(|cwd| + |target|)
  space: O(|cwd| + |target|)
rubric:
  excellent: Chooses the starting point from the leading slash, splits into segments, uses a stack that ignores empty and dot segments and pops on .. only when non-empty, formats the root correctly, and calls out dotted names and non-canonical cwd values.
  good: Correct stack solution that needs a hint about the root, empty targets or names such as ... and .env.
  weak: Uses string replacement for .. and . that breaks on names containing dots, crashes on .. at the root, or returns trailing or doubled slashes.
  criteria:
    correctness: All tests pass, including absolute targets, empty targets and climbing past the root.
    efficiency: Linear in the total path length with a single split and stack pass.
    code_quality: One loop over segments with explicit cases for empty, dot, dot-dot and names.
    edge_cases: Root output, trailing and repeated slashes, dotted directory names and long chains.
    communication: States why a stack models directory navigation and how symbolic links would change the problem.
hints:
- Think of the path as a sequence of directory names you walk into and out of one at a time.
- 'Decide first which string you are resolving: the target alone if it is absolute, otherwise the current directory followed by the target. Then process its segments in order with a structure that can undo the most recent step.'
- Split the chosen path on slashes and push each ordinary name onto a stack, skip empty and single-dot segments, pop for a double-dot segment only when the stack is non-empty, and finally return a slash followed by the stack contents joined with slashes, which yields just a slash for the root.
followups:
- How would symbolic links change the meaning of .. and what would you need to look up?
- How would you support cd - (return to the previous directory) across a sequence of commands?
- How would you express a resolved path relative to another directory?
- What would you do differently for Windows paths with drive letters and backslashes?
common_errors:
- Treating any segment that starts with a dot as special instead of exactly . and ..
- Popping from an empty stack when .. appears at the root.
- Ignoring cwd for relative targets or using it for absolute ones.
- Returning an empty string or a trailing slash for the root.
