slug: redact_sensitive_log_params
title: "Redact Sensitive Log Parameters"
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [security, backend, sre, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## Redact Sensitive Log Parameters

  Application logs are shipped to a shared aggregator that many teams can search. Before a line leaves
  the host, credentials written as `name=value` parameters must be masked.

  A log `line` is made of **words** separated by space characters. Write
  `redact_sensitive_log_params(line)` that returns the line with these changes:

  - A word is a **parameter** if it contains at least one `=`. Its **name** is the part before the
    **first** `=` and its value is everything after that `=`.
  - A parameter is **sensitive** if its name, compared case-insensitively, is exactly one of `password`,
    `token`, `secret` or `api_key`. Names that merely contain a keyword (such as `my_token` or `tokens`)
    are not sensitive.
  - In every sensitive parameter, the value is replaced by `***`, even if the value is empty or contains
    more `=` signs. The name keeps its original spelling.
  - Every other word, and every space character (including leading, trailing and repeated spaces), is
    left exactly as it is.

  ### Example 1
  ```
  Input:  line = "user=deploy_bot password=hunter2 action=login"
  Output: "user=deploy_bot password=*** action=login"
  ```

  ### Example 2
  ```
  Input:  line = "POST /v1/keys API_KEY=ab=cd== token= retries=3"
  Output: "POST /v1/keys API_KEY=*** token=*** retries=3"
  Explanation: API_KEY matches case-insensitively and its whole value is masked; the empty token value is masked too
  ```

  ### Constraints
  - `0 <= line.length <= 10^4`
  - `line` consists of printable ASCII characters; the only whitespace is the space character.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: redact_sensitive_log_params
  params:
    - {name: line, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    SENSITIVE = {"password", "token", "secret", "api_key"}


    def redact_sensitive_log_params(line: str) -> str:
        words = line.split(" ")  # splitting on each single space keeps runs of spaces as empty words
        for i, word in enumerate(words):
            name, sep, _ = word.partition("=")
            if sep and name.lower() in SENSITIVE:
                words[i] = name + "=***"
        return " ".join(words)
  javascript: |
    function redactSensitiveLogParams(line) {
      const sensitive = new Set(["password", "token", "secret", "api_key"]);
      const words = line.split(" ");
      for (let i = 0; i < words.length; i++) {
        const eq = words[i].indexOf("=");
        if (eq === -1) continue;
        const name = words[i].slice(0, eq);
        if (sensitive.has(name.toLowerCase())) words[i] = name + "=***";
      }
      return words.join(" ");
    }
