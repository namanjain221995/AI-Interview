expected_concepts:
  - "tokenising on single spaces so spacing can be reproduced exactly"
  - "splitting a word on its first '=' only"
  - "exact, case-insensitive membership test in a set of names"
  - "building the output in linear time"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Splits on each space so empty words preserve spacing, takes the name before the first '=', checks exact case-insensitive membership in a set, masks the whole value including empty ones and rebuilds the line in one pass."
  good: "Correct masking with a small slip that is fixed with a nudge, such as collapsing repeated spaces or using a substring search for the name."
  weak: "Masks names that only contain a keyword, keeps part of a value that contains '=', lower-cases the output name or loses the original spacing."
  criteria:
    correctness: "All tests pass, including near-miss names, values with '=', empty values and repeated spaces."
    efficiency: "Linear in the length of the line."
    code_quality: "Keywords live in one set; the per-word rule is a few readable lines."
    edge_cases: "Empty line, keyword without '=', word starting with '=', leading or trailing spaces and repeated parameters."
    communication: "Explains why exact name matching avoids over-masking and why spacing must round-trip."
hints:
  - "Look at the line one word at a time; only words that look like a name and a value joined by an equals sign can contain a credential."
  - "For each word, the name is everything before the first equals sign; compare it, ignoring case, against the four keywords as whole names, not as substrings."
  - "Split the line on every single space so that runs of spaces turn into empty words, replace each sensitive word with its original name, an equals sign and three asterisks, and join the words back with single spaces, which reproduces the original spacing."
followups:
  - "How would you also mask credentials inside URL query strings such as ?token=abc?"
  - "Should the redaction run in the application or in the log shipper, and what are the trade-offs?"
  - "How would you test that a new keyword list never leaks a secret in production logs?"
common_errors:
  - "Using a split that collapses repeated spaces, so the output spacing changes."
  - "Matching names by substring, which masks my_token or tokens as well."
  - "Splitting on every '=' and masking only the text up to the second '='."
  - "Leaving an empty value unmasked or lower-casing the name in the output."
