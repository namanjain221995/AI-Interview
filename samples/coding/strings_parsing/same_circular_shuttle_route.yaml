version: 1
slug: same_circular_shuttle_route
title: "Same Circular Shuttle Route"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Same Circular Shuttle Route

  A campus shuttle drives a closed loop of stops and always comes back to where it began. Each stop has a
  one-character code, and a driver's log records the loop as a string of codes, starting from whichever stop
  the driver happened to begin logging at and following the direction of travel. For example, the loop
  `N` -> `L` -> `G` -> `P` -> back to `N` can be logged as `"NLGP"`, `"LGPN"`, `"GPNL"` or `"PNLG"`.

  Given two logged routes `a` and `b`, return `true` if they describe **the same loop**, meaning `b` can be
  obtained from `a` by moving some number of characters from the front of `a` to its end (a rotation), and
  `false` otherwise.

  - Routes of different lengths are never the same loop.
  - Direction matters: a route driven in reverse (`"PGLN"` for the loop above) is a different loop unless it
    also happens to be a rotation.
  - Stop codes may repeat within a route.
  - Two empty routes are the same loop.

  ### Example 1
  ```
  Input:  a = "NLGPQ", b = "GPQNL"
  Output: true
  Explanation: Moving N and L from the front of a to its end gives GPQNL.
  ```

  ### Example 2
  ```
  Input:  a = "NLGPQ", b = "NGLPQ"
  Output: false
  ```

  ### Example 3
  ```
  Input:  a = "AAB", b = "ABA"
  Output: true
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 10^5`
  - `a` and `b` consist of uppercase ASCII letters and digits

  **Follow-up:** can you decide it in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: same_circular_route
  params:
    - {name: a, type: "string"}
    - {name: b, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def same_circular_route(a: str, b: str) -> bool:
        if len(a) != len(b):
            return False
        if not a:
            return True
        # b is a rotation of a exactly when b occurs inside a written twice.
        # KMP failure function on b, then scan a + a: O(n) time.
        fail = [0] * len(b)
        k = 0
        for i in range(1, len(b)):
            while k > 0 and b[i] != b[k]:
                k = fail[k - 1]
            if b[i] == b[k]:
                k += 1
            fail[i] = k
        k = 0
        for ch in a + a:
            while k > 0 and ch != b[k]:
                k = fail[k - 1]
            if ch == b[k]:
                k += 1
                if k == len(b):
                    return True
        return False
  javascript: |
    function sameCircularRoute(a, b) {
      if (a.length !== b.length) return false;
      if (a.length === 0) return true;
      const fail = new Array(b.length).fill(0);
      let k = 0;
      for (let i = 1; i < b.length; i++) {
        while (k > 0 && b[i] !== b[k]) k = fail[k - 1];
        if (b[i] === b[k]) k++;
        fail[i] = k;
      }
      const doubled = a + a;
      k = 0;
      for (const ch of doubled) {
        while (k > 0 && ch !== b[k]) k = fail[k - 1];
        if (ch === b[k]) {
          k++;
          if (k === b.length) return true;
        }
      }
      return false;
    }
tests:
  - {id: t1, args: ["NLGPQ", "GPQNL"], expected: true, description: "Example 1 - rotation by two stops"}
  - {id: t2, args: ["NLGPQ", "NGLPQ"], expected: false, description: "Example 2 - same stops in a different cyclic order"}
  - {id: t3, args: ["AAB", "ABA"], expected: true, description: "Example 3 - repeated stop codes"}
  - {id: t4, hidden: true, args: ["", ""], expected: true, description: "Both routes empty"}
  - {id: t5, hidden: true, args: ["", "A"], expected: false, description: "One empty route, one non-empty"}
  - {id: t6, hidden: true, args: ["AB", "ABAB"], expected: false, description: "b is a substring of a+a but longer than a; the length check is required"}
  - {id: t7, hidden: true, args: ["ABC", "CBA"], expected: false, description: "Reversed direction is not a rotation"}
  - {id: t8, hidden: true, args: ["AAB", "ABB"], expected: false, description: "Same length and same distinct letters but different counts"}
  - {id: t9, hidden: true, args: ["S7", "S7"], expected: true, description: "Identical routes (rotation by zero)"}
  - {id: t10, hidden: true, args: ["Q", "Q"], expected: true, description: "Single-stop loop"}
  - {id: t11, hidden: true, args: ["", ""], expected: true, description: "Stress: 1000-stop route with long runs, half-turn rotation (true)"}
  - {id: t12, hidden: true, args: ["", ""], expected: false, description: "Stress: 1000-stop route, same letter counts but not a rotation (false)"}
expected_concepts:
  - "every rotation of a appears as a substring of a concatenated with itself"
  - "length check before the substring test"
  - "linear-time substring search (KMP or Z-function) for the follow-up"
  - "brute force over all rotations is O(n^2)"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Checks lengths, uses the a+a containment insight, handles empty routes, and for the follow-up explains or implements KMP or Z-function to guarantee O(n) instead of relying on an unspecified library search."
  good: "Correct a+a containment with the length check, or a correct O(n^2) check of every rotation with a clear explanation."
  weak: "Compares sorted letters or letter counts, forgets the length check, or treats reversed routes as equal."
  criteria:
    correctness: "All tests pass, including empty routes, repeated codes and different lengths."
    efficiency: "Linear time with a proper string-matching algorithm; quadratic rotation checking is acknowledged as a baseline."
    code_quality: "Early return on length mismatch; matching logic factored clearly."
    edge_cases: "Empty routes, single stop, reversed order, repeated stop codes, b longer than a."
    communication: "Explains why every rotation of a is a window of a+a and why the length check is needed."
hints:
  - "A rotation keeps the cyclic order of the stops; think about what you would see if you wrote the loop out twice in a row."
  - "Every rotation of a appears as a contiguous piece of a written twice. Before searching, rule out the case where the two routes have different lengths."
  - "Return false if the lengths differ and true if both are empty. Otherwise build a followed by a and check whether b occurs inside it. For a guaranteed linear time, compute the prefix-function table of b (as in KMP) and scan the doubled string with it, reporting success as soon as all of b has matched."
followups:
  - "How would you also return the rotation offset, i.e. how many stops a must be shifted?"
  - "How would you accept a route driven in the opposite direction as the same loop?"
  - "Given many logged routes, how would you group those that describe the same loop?"
  - "What is the worst case of a naive substring search on inputs like AAAA...AB?"
common_errors:
  - "Skipping the length check, so b = ABAB is accepted as a rotation of a = AB."
  - "Comparing sorted characters or character counts, which ignores the cyclic order."
  - "Treating a reversed route as a rotation."
  - "Returning false for two empty routes."
