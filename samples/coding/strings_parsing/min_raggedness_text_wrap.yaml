version: 1
slug: min_raggedness_text_wrap
title: "Minimum Raggedness Text Wrap"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [frontend, general, fullstack]
time_limit_minutes: 30
prompt_markdown: |
  ## Minimum Raggedness Text Wrap

  The release-notes viewer in a dashboard lays out a paragraph in a fixed-width panel. Words must stay
  **in their original order**, words on the same line are separated by **exactly one space**, and no line
  may be longer than `width` characters (the length of a line is the length of its words plus the spaces
  between them). Every word is at most `width` characters long, so a word never has to be split.

  A greedy layout (put as many words as possible on each line) often leaves one very short line in the
  middle of the paragraph, which looks ragged. The viewer instead minimises the **raggedness**:

  - For every line **except the last one**, the line's cost is `(width - line_length)^2`.
  - The last line is free (cost `0`), however short it is.
  - The raggedness of a layout is the sum of its line costs.

  Write `min_raggedness(words, width)` that returns the **minimum possible raggedness** over all valid
  layouts. An empty paragraph has raggedness `0`.

  ### Example 1
  ```
  Input:  words = ["new", "db", "is", "online"], width = 6
  Output: 10
  Explanation: greedy gives "new db" (0) / "is" (16) / "online" (last, 0) = 16, but
  "new" (9) / "db is" (1) / "online" (last, 0) = 10 is better
  ```

  ### Example 2
  ```
  Input:  words = ["rollout", "paused"], width = 20
  Output: 0
  Explanation: everything fits on one line, which is the last line
  ```

  ### Example 3
  ```
  Input:  words = ["cache", "miss", "rate", "is", "high"], width = 10
  Output: 9
  Explanation: "cache miss" (0) / "rate is" (9) / "high" (last, 0); for comparison
  "cache" (25) / "miss rate" (1) / "is high" (last, 0) costs 26
  ```

  ### Constraints
  - `0 <= words.length <= 1000`
  - `1 <= width <= 10^5`
  - `1 <= words[i].length <= width`; words contain no spaces.
  - The total length of all words is at most `10^5`.
  - The answer can exceed the 32-bit integer range; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_raggedness
  params:
    - {name: words, type: "string[]"}
    - {name: width, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def min_raggedness(words: list[str], width: int) -> int:
        n = len(words)
        # best[i] = minimum raggedness for laying out words[i:] starting on a fresh line.
        best = [0] * (n + 1)
        for i in range(n - 1, -1, -1):
            length = -1
            result = None
            for j in range(i, n):
                length += len(words[j]) + 1  # words i..j on one line, single spaces between
                if length > width:
                    break
                cost = 0 if j == n - 1 else (width - length) ** 2 + best[j + 1]
                if result is None or cost < result:
                    result = cost
            best[i] = result
        return best[0]
  javascript: |
    function minRaggedness(words, width) {
      const n = words.length;
      const best = new Array(n + 1).fill(0);
      for (let i = n - 1; i >= 0; i--) {
        let length = -1;
        let result = Infinity;
        for (let j = i; j < n; j++) {
          length += words[j].length + 1;
          if (length > width) break;
          const slack = width - length;
          const cost = j === n - 1 ? 0 : slack * slack + best[j + 1];
          if (cost < result) result = cost;
        }
        best[i] = result;
      }
      return best[0];
    }
