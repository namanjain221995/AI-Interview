expected_concepts:
  - "why the greedy line-filling layout is not optimal for a squared cost"
  - "dynamic programming over the index of the first word on a line (suffix or prefix form)"
  - "running line length with early exit once the line exceeds the width"
  - "treating the last line as free"
  - "64-bit arithmetic for the squared slack and the running total"
optimal_complexity: {time: "O(n * m) where m is the most words that fit on one line (O(n^2) worst case)", space: "O(n)"}
rubric:
  excellent: "Shows with a small example why greedy fails, defines the DP state as the best cost for the words from i onwards, extends the line word by word with an early break, handles the free last line and 64-bit costs, and states O(n * m) time and O(n) space."
  good: "Correct DP (top-down with memoisation or bottom-up) that needs a nudge on the last line or the overflow, or computes line lengths with an extra loop that makes it slower but still polynomial."
  weak: "Greedy layout, exponential enumeration of break points, charges the last line, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including the empty paragraph, words exactly as wide as the panel and greedy-trap inputs."
    efficiency: "Polynomial DP with the inner loop bounded by the words that fit on a line; handles 1000 words quickly."
    code_quality: "Clear state definition, running line length instead of re-summing, no magic sentinel collisions."
    edge_cases: "Empty input, single word, every word filling a whole line, very wide panels where a single slack squared exceeds 32 bits."
    communication: "Explains the recurrence, why the last line is special and where overflow can happen."
hints:
  - "Try the obvious greedy layout on the first example and compare it with breaking one word earlier; a squared cost punishes one big gap more than two small ones."
  - "Once you decide which words go on the first line, the rest of the paragraph is the same problem on a shorter list of words, so the best cost for the words from position i onwards depends only on i."
  - "Compute that best cost from the last word backwards: for each start i, extend a line one word at a time while it still fits, and take the minimum of the squared slack plus the best cost from the next word, using zero instead when the line reaches the final word; use 64-bit integers for the costs."
followups:
  - "How would you also return the chosen line breaks, not just the cost?"
  - "What changes if the cost were the cube of the slack, or if the last line were charged too?"
  - "How could you speed this up when lines hold thousands of words (hint: the cost function is convex)?"
  - "How would you handle a word longer than the width, for example by hyphenation?"
common_errors:
  - "Using the greedy layout, which leaves a large gap in the middle of the paragraph."
  - "Charging the last line, which pushes words away from the end."
  - "Forgetting the single spaces when computing the line length, or counting a trailing space."
  - "Computing the squared slack in 32-bit integers, which overflows for wide panels even when the answer is small."
