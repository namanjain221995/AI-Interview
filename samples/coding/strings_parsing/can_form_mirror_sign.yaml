version: 1
slug: can_form_mirror_sign
title: "Can Form a Mirror Sign"
difficulty: easy
competency_keys: [data_structures, problem_solving]
role_tags: [general, qa]
time_limit_minutes: 12
prompt_markdown: |
  ## Can Form a Mirror Sign

  A sign shop sells "mirror signs": a row of letter tiles that reads exactly the same from left to
  right as from right to left. A customer hands over a box of tiles, written as the string `tiles`
  (one character per tile, in no particular order), and asks whether a mirror sign can be built from
  them.

  - **Every** tile must be used exactly once, and tiles may be placed in any order.
  - Tiles are case-sensitive: `S` and `s` are different tiles.
  - Every character is a tile, including spaces and punctuation.
  - An empty box counts as a (blank) mirror sign.

  Return `true` if the tiles can be arranged into a mirror sign, otherwise `false`.

  ### Example 1
  ```
  Input:  tiles = "evlel"
  Output: true
  Explanation: The tiles can be arranged as "level".
  ```

  ### Example 2
  ```
  Input:  tiles = "top spot"
  Output: false
  Explanation: 's' and ' ' each appear once; at most one tile can sit alone in the middle.
  ```

  ### Example 3
  ```
  Input:  tiles = "Ss"
  Output: false
  ```

  ### Constraints
  - `0 <= tiles.length <= 10^5`
  - `tiles` contains printable ASCII characters (codes 32 to 126).

  **Follow-up:** can you answer in a single pass using memory bounded by the alphabet size?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_form_mirror_sign
  params:
    - {name: tiles, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def can_form_mirror_sign(tiles: str) -> bool:
        unpaired: set[str] = set()
        for tile in tiles:
            if tile in unpaired:
                unpaired.remove(tile)
            else:
                unpaired.add(tile)
        return len(unpaired) <= 1
  javascript: |
    function canFormMirrorSign(tiles) {
      const unpaired = new Set();
      for (const tile of tiles) {
        if (unpaired.has(tile)) unpaired.delete(tile);
        else unpaired.add(tile);
      }
      return unpaired.size <= 1;
    }
tests:
  - {id: t1, args: ["evlel"], expected: true, description: "Example 1 - one odd tile in the middle"}
  - {id: t2, args: ["top spot"], expected: false, description: "Example 2 - two odd tiles, one of them a space"}
  - {id: t3, args: ["Ss"], expected: false, description: "Example 3 - case-sensitive tiles"}
  - {id: t4, hidden: true, args: [""], expected: true, description: "Empty box is a blank mirror sign"}
  - {id: t5, hidden: true, args: ["x"], expected: true, description: "Single tile"}
  - {id: t6, hidden: true, args: ["aabbccdd"], expected: true, description: "All counts even, no middle tile"}
  - {id: t7, hidden: true, args: ["1 2 1"], expected: true, description: "Spaces are tiles: two spaces pair up, the 2 sits in the middle"}
  - {id: t8, hidden: true, args: ["!!??#"], expected: true, description: "Punctuation tiles with exactly one odd count"}
  - {id: t9, hidden: true, args: ["aabbc d"], expected: false, description: "Three odd counts including a space"}
  - {id: t10, hidden: true, args: ["aaabbbb"], expected: true, description: "One character with an odd count greater than one"}
  - {id: t11, hidden: true, args: [""], expected: true, description: "999 copies of one tile"}
  - {id: t12, hidden: true, args: ["?"], expected: false, description: "990 tiles where only the last two are unpaired"}
expected_concepts:
- character frequency counting
- a mirrored arrangement allows at most one odd count
- parity tracking with a set or bit mask
- O(n) time with O(alphabet) space
optimal_complexity:
  time: O(n)
  space: O(k) for k distinct characters
rubric:
  excellent: Explains that pairs fill symmetric positions so at most one character may have an odd count, implements a single pass with a counter or parity set, covers the empty box, case sensitivity and spaces, and states O(n) time with alphabet-bounded space.
  good: Counts characters correctly and checks odd counts, possibly needing a prompt about spaces, case or the empty input.
  weak: Tries to generate permutations, checks whether the input itself already reads the same both ways, or lower-cases and strips spaces contrary to the contract.
  criteria:
    correctness: All tests pass, including spaces, punctuation and case-sensitive tiles.
    efficiency: Linear time; no sorting or permutation search required.
    code_quality: Short, readable counting logic with a clear final condition.
    edge_cases: Empty box, a single tile, all-even counts and a single character with a large odd count.
    communication: Justifies the at-most-one-odd-count rule with the symmetry argument.
hints:
- Think about how the left half and the right half of a sign that reads the same both ways relate to each other.
- Each tile on the left needs an identical partner on the right, so only the counts of each character matter, not their order.
- Count how many times each character appears (or toggle membership in a set as you scan), and return true exactly when at most one character is left with an odd count, which then sits in the middle.
followups:
- How would you return one actual mirror arrangement instead of a yes or no answer?
- How would you track parity with a bit mask if tiles were limited to lowercase letters?
- How many tiles would you need to add, at minimum, to make an impossible box work?
common_errors:
- Checking whether the given string already reads the same backwards instead of whether it can be rearranged.
- Ignoring spaces or punctuation, or lower-casing tiles, contrary to the statement.
- Requiring all counts to be even, which rejects odd-length arrangements.
- Generating permutations, which is exponential.
