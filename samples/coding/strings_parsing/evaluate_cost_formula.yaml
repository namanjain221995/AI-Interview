  - {id: t2, args: ["7 - 10 - 3"], expected: -6, description: "Example 2 - left-to-right subtraction with a negative result"}
  - {id: t3, args: ["  42  "], expected: 42, description: "Example 3 - single literal with spaces"}
  - {id: t4, hidden: true, args: ["0"], expected: 0, description: "Single zero"}
  - {id: t5, hidden: true, args: ["2*3*4-5"], expected: 19, description: "No spaces, chained multiplication"}
  - {id: t6, hidden: true, args: ["100000 * 100000 * 10000"], expected: 100000000000000, description: "Product beyond 32 bits"}
  - {id: t7, hidden: true, args: ["5 - 2 * 3 - 4 * 0 + 1"], expected: 0, description: "Zero factor and subtraction of products"}
  - {id: t8, hidden: true, args: ["1 - 1000000000 * 1000000"], expected: -999999999999999, description: "Large negative result"}
  - {id: t9, hidden: true, args: ["007 +   3*   002"], expected: 13, description: "Leading zeros and irregular spacing"}
