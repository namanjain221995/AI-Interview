expected_concepts:
  - single left-to-right scan with a running total and a current product term
  - operator precedence without building a tree (multiply into the term, add or subtract finished terms)
  - accumulating multi-digit literals and skipping spaces
  - 64-bit arithmetic for large products
  - a stack-based or two-stack evaluator as an equivalent alternative
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Evaluates in one pass by keeping a finished-terms total and a signed product term, handles multi-digit literals, spaces and left-to-right subtraction, uses 64-bit integers, and explains how the approach generalises to a stack or shunting-yard evaluator.
  good: Correct stack-based or token-list evaluator with O(n) extra memory, or a one-pass solution that needed a fix for subtraction chains or the final term.
  weak: Uses a built-in eval, ignores precedence, evaluates right to left so chained subtraction is wrong, or overflows 32-bit integers.
  criteria:
    correctness: All tests pass, including chained subtraction, leading zeros and large products.
    efficiency: Linear time; constant extra memory for the one-pass approach.
    code_quality: Clear separation of tokenising and evaluating, or a well-commented single loop, with no special case for the last literal duplicated awkwardly.
    edge_cases: Single literal, spaces everywhere or nowhere, zero factors, negative results, values beyond 32 bits.
    communication: Explains why a product term can be completed before deciding its sign contribution.
hints:
  - Because multiplication binds tighter, the formula is really a sum of signed product terms; think about what you need to remember while reading it from left to right.
  - Keep a running total of finished terms and the current product term with its sign; multiplication only changes the current term, while plus or minus finishes it.
  - Scan characters, skipping spaces and building each literal digit by digit; when an operator or the end of the input arrives, multiply the literal into the current term, then if the operator is a plus or minus (or the input ended) add the term with its sign to the total and start a new term whose sign comes from that operator; use 64-bit integers throughout.
followups:
  - How would you add parentheses - with recursion, or with an explicit operator stack?
  - How would you add integer division, and how should it round negative results?
  - How would you report a clear error for malformed formulas such as two operators in a row?
  - If the same formula is evaluated millions of times with different numbers, how would you precompile it?
common_errors:
  - Ignoring precedence and evaluating strictly left to right, so "2 + 3 * 4" gives 20.
  - Evaluating subtraction right to left, so "7 - 10 - 3" gives 0.
  - Forgetting to add the last term after the loop.
  - Treating each digit as a separate number instead of accumulating multi-digit literals.
  - Using 32-bit integers for products that exceed 2^31.
