version: 1
slug: evaluate_cost_formula
title: Evaluate a Cost Formula
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [backend, data_analyst, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Evaluate a Cost Formula

  A billing rule engine stores pricing rules as plain-text formulas such as `3 * 40 + 12 - 2 * 5`
  (three seats at 40, a 12 platform fee, minus two 5-credit vouchers). Write `evaluate_cost_formula(expr)`
  that returns the value of a formula **without** calling a built-in expression evaluator.

  - A formula contains non-negative integer literals (leading zeros allowed, so `007` is `7`), the binary
    operators `+`, `-` and `*`, and any number of spaces anywhere between tokens.
  - There are no parentheses and no unary minus: literals and operators strictly alternate, starting
    and ending with a literal.
  - `*` binds tighter than `+` and `-`; operators of the same precedence are applied **left to right**,
    so `7 - 10 - 3` is `(7 - 10) - 3`.

  ### Example 1
  ```
  Input:  expr = "3 * 40 + 12 - 2 * 5"
  Output: 122
  ```

  ### Example 2
  ```
  Input:  expr = "7 - 10 - 3"
  Output: -6
  ```

  ### Example 3
  ```
  Input:  expr = "  42  "
  Output: 42
  ```

  ### Constraints
  - `1 <= expr.length <= 10^4`
  - Every literal is at most `10^9`.
  - Every product term and the sum of the absolute values of all terms are at most `10^15`, so the
    result needs a 64-bit integer but never overflows one.

  **Follow-up:** how would you extend the evaluator to support parentheses and division?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: evaluate_cost_formula
  params:
    - {name: expr, type: "string"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def evaluate_cost_formula(expr: str) -> int:
        total = 0  # sum of the finished signed terms
        term = 1  # product of the literals read so far in the current term
        sign = 1  # sign of the current term
        number = 0  # literal being read
        for ch in expr + "+":  # a trailing '+' finishes the last term
            if ch == " ":
                continue
            if ch.isdigit():
                number = number * 10 + int(ch)
                continue
            # an operator (or the sentinel '+'): fold the finished literal into the term
            term *= number
            number = 0
            if ch == "*":
                continue
            total += sign * term
            sign = 1 if ch == "+" else -1
            term = 1
        return total
  javascript: |
    function evaluateCostFormula(expr) {
      let total = 0;
      let term = 1;
      let number = 0;
      let sign = 1;
      for (const ch of expr + '+') {
        if (ch === ' ') continue;
        if (ch >= '0' && ch <= '9') {
          number = number * 10 + (ch.charCodeAt(0) - 48);
          continue;
        }
        term *= number;
        number = 0;
        if (ch === '*') continue;
        total += sign * term;
        sign = ch === '+' ? 1 : -1;
        term = 1;
      }
      return total;
    }
