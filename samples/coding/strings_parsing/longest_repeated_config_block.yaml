slug: longest_repeated_config_block
title: Longest Repeated Config Block
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [backend, platform, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Longest Repeated Config Block

  A platform team flattens every service configuration file into a single string `s` and wants to spot
  blocks that were copy-pasted. A block is a contiguous substring of `s`. It counts as copy-pasted when it
  appears at least twice **without overlapping**: there must be two occurrences starting at positions
  `i < j` with `j >= i + len(block)`.

  Return the **longest** copy-pasted block.

  - If several blocks share the maximum length, return the one whose **first occurrence** in `s` starts
    at the smallest index.
  - If no non-empty block appears twice without overlapping, return the empty string `""`.

  ### Example 1
  ```
  Input:  s = "port=80;host=a;port=80;host=b;"
  Output: "port=80;host="
  Explanation: "port=80;host=" starts at index 0 and again at index 15; no longer block repeats.
  ```

  ### Example 2
  ```
  Input:  s = "aaaa"
  Output: "aa"
  Explanation: "aaa" occurs twice but those occurrences overlap; "aa" at 0 and 2 does not.
  ```

  ### Example 3
  ```
  Input:  s = "abcdcdab"
  Output: "ab"
  Explanation: Both "ab" and "cd" repeat; the first occurrence of "ab" (index 0) comes earlier.
  ```

  ### Constraints
  - `1 <= s.length <= 3 * 10^4`
  - `s` consists of printable ASCII characters (codes 32 to 126).

  **Follow-up:** comparing every pair of substrings is far too slow at the upper limit. Can you get close to
  `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_repeated_block
  params:
    - {name: s, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def longest_repeated_block(s: str) -> str:
        n = len(s)
        mod1, mod2, base = 1_000_000_007, 998_244_353, 131

        def earliest_start(length: int) -> int:
            """Smallest first-occurrence start of a block of this length that has a
            later occurrence starting at or after first + length, or -1."""
            if length == 0:
                return 0
            p1, p2 = pow(base, length, mod1), pow(base, length, mod2)
            h1 = h2 = 0
            first: dict[tuple[int, int], int] = {}
            last: dict[tuple[int, int], int] = {}
            for i, ch in enumerate(s):
                c = ord(ch)
                h1 = (h1 * base + c) % mod1
                h2 = (h2 * base + c) % mod2
                if i >= length:
                    out = ord(s[i - length])
                    h1 = (h1 - out * p1) % mod1
                    h2 = (h2 - out * p2) % mod2
                if i >= length - 1:
                    key = (h1, h2)
                    start = i - length + 1
                    first.setdefault(key, start)
                    last[key] = start
            best = -1
            for key, start in first.items():
                if last[key] - start >= length and (best == -1 or start < best):
                    best = start
            return best

        lo, hi, best_start = 0, n // 2, 0
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if earliest_start(mid) != -1:
                lo = mid
            else:
                hi = mid - 1
        if lo == 0:
            return ""
        best_start = earliest_start(lo)
        return s[best_start:best_start + lo]
  javascript: |
    function longestRepeatedBlock(s) {
      const n = s.length;
      const M1 = 1000000007, M2 = 998244353, B = 131;
      const powMod = (len, m) => {
        let r = 1;
        for (let i = 0; i < len; i++) r = (r * B) % m;
        return r;
      };
      const earliestStart = (len) => {
        if (len === 0) return 0;
        const p1 = powMod(len, M1), p2 = powMod(len, M2);
        let h1 = 0, h2 = 0;
        const first = new Map(), last = new Map();
        for (let i = 0; i < n; i++) {
          const c = s.charCodeAt(i);
          h1 = (h1 * B + c) % M1;
          h2 = (h2 * B + c) % M2;
          if (i >= len) {
            const out = s.charCodeAt(i - len);
            h1 = ((h1 - out * p1) % M1 + M1) % M1;
            h2 = ((h2 - out * p2) % M2 + M2) % M2;
          }
          if (i >= len - 1) {
            const key = h1 + ":" + h2;
            const start = i - len + 1;
            if (!first.has(key)) first.set(key, start);
            last.set(key, start);
          }
        }
        let best = -1;
        for (const [key, start] of first) {
          if (last.get(key) - start >= len && (best === -1 || start < best)) best = start;
        }
        return best;
      };
      let lo = 0, hi = Math.floor(n / 2);
      while (lo < hi) {
        const mid = Math.floor((lo + hi + 1) / 2);
        if (earliestStart(mid) !== -1) lo = mid;
        else hi = mid - 1;
      }
      if (lo === 0) return "";
      const start = earliestStart(lo);
      return s.slice(start, start + lo);
    }
tests:
  - {id: t1, args: ["port=80;host=a;port=80;host=b;"], expected: "port=80;host=", description: "Example 1 - repeated key/value block"}
  - {id: t2, args: ["aaaa"], expected: "aa", description: "Example 2 - overlapping occurrences do not count"}
  - {id: t3, args: ["abcdcdab"], expected: "ab", description: "Example 3 - tie on length broken by earliest first occurrence"}
  - {id: t4, hidden: true, args: ["x"], expected: "", description: "Single character; nothing can repeat"}
  - {id: t5, hidden: true, args: ["abcdefg"], expected: "", description: "All characters distinct; empty answer"}
  - {id: t6, hidden: true, args: ["aaaaaaaaa"], expected: "aaaa", description: "Odd-length run of one character; longest non-overlapping block is 4"}
  - {id: t7, hidden: true, args: ["zzqabqzzab"], expected: "zz", description: "Tie between blocks whose first occurrences differ; earliest wins even though it is lexicographically larger"}
  - {id: t8, hidden: true, args: ["abcabcabc"], expected: "abc", description: "Periodic string where the overlapping answer would be longer than the non-overlapping one"}
  - {id: t9, hidden: true, args: ["k = v; k = v;"], expected: "k = v;", description: "Spaces are ordinary characters inside a repeated block"}
  - {id: t10, hidden: true, args: ["mode=on;MODE=on;"], expected: "=on;", description: "Case-sensitive comparison"}
  - {id: t11, hidden: true, args: ["=b;aaa=abaa;;aba;aaba;abab=;ba=bab=aaab;;=;;==bbba=;=;=aa;b=b;;aa===;;aa=;aa=;=;=a;=ba;ab=bb;;;ab;;=b;=;=;bbabbbba;b==abtimeout=30;retries=5;;==ba;;;;;a;;abab;ba=aaaba=aab;b===;aa;;;;=aba==;bab=ba=a==b=b=bbb;bb;=aa=;=b=;==abab;b=b;a;=aa;b;b;=a;;;abbbab;b;=bbaaab;bba=b=b==;ba=;;bbatimeout=30;retries=5;;babbb;aa=;aabb=aa;aa;=b=;;b=b;b;a;;=ab;"], expected: "timeout=30;retries=5;;", description: "Stress case with a long repeated block planted inside random noise"}
expected_concepts:
  - "binary search on the block length (the property is monotone)"
  - "rolling polynomial hash of fixed-length windows"
  - "tracking first and last occurrence per hash to test non-overlap"
  - "handling hash collisions with double hashing or verification"
  - "suffix array or suffix automaton as an alternative"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Argues why a valid block of length L implies one of length L - 1, binary searches the length with a rolling hash, checks non-overlap by comparing the first and last start of each hash, applies the earliest-first-occurrence tie rule and discusses collisions and O(n log n) time."
  good: "Correct binary search plus hashing (or a suffix structure) with a small slip on the overlap rule or tie-breaking that is fixed with a hint."
  weak: "Compares all substring pairs in cubic or quadratic-with-copies time, counts overlapping occurrences, or returns the lexicographically smallest block instead of the earliest one."
  criteria:
    correctness: "All tests pass, including overlapping runs, ties and the empty answer."
    efficiency: "Near O(n log n); no quadratic substring comparisons at 3 * 10^4 characters."
    code_quality: "The fixed-length check is a separate helper; hashing arithmetic is clearly reduced modulo a prime."
    edge_cases: "Single character, all-distinct strings, long single-character runs and spaces inside blocks."
    communication: "Explains monotonicity before coding and how collisions are made unlikely or ruled out."
hints:
  - "If some block of length L is copy-pasted without overlapping, what can you say about blocks of length L - 1?"
  - "That monotone property lets you binary search the answer length. For one fixed length, you only need a fast way to tell which windows of that length are equal and where each one first and last appears."
  - "For a fixed length, slide a rolling hash over every window and record the first and the last start index for each hash value. A block qualifies when its last start is at least its first start plus the length; among qualifying blocks keep the smallest first start, and binary search for the largest length that has one."
followups:
  - "How would the answer and the algorithm change if overlapping occurrences were allowed?"
  - "How would you guarantee correctness instead of relying on hashes being collision-free?"
  - "Could a suffix array with an LCP array solve the non-overlapping version directly, and what would it cost?"
  - "How would you report every block above a minimum length that is copy-pasted, not just the longest?"
common_errors:
  - "Accepting overlapping occurrences, which turns aaaa into aaa instead of aa."
  - "Comparing only adjacent occurrences of a hash instead of the first and last ones."
  - "Breaking ties lexicographically instead of by earliest first occurrence."
  - "Integer overflow in the rolling hash in languages without big integers."
  - "Searching lengths above half the string, which can never be non-overlapping."
