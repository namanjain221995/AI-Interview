  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def strip_source_comments(lines: list[str]) -> list[str]:
        result: list[str] = []
        pending: list[str] = []
        in_block = False

        def emit() -> None:
            text = "".join(pending).rstrip()
            if text:
                result.append(text)
            pending.clear()

        for line in lines:
            i, n = 0, len(line)
            while i < n:
                if in_block:
                    if line.startswith("*/", i):
                        in_block = False
                        i += 2
                    else:
                        i += 1
                elif line[i] == '"':
                    j = i + 1
                    while j < n and line[j] != '"':
                        j += 2 if line[j] == "\\" else 1
                    j = min(j + 1, n)
                    pending.append(line[i:j])
                    i = j
                elif line.startswith("//", i):
                    break
                elif line.startswith("/*", i):
                    in_block = True
                    i += 2
                else:
                    pending.append(line[i])
                    i += 1
            if not in_block:
                emit()
        emit()
        return result
  javascript: |
    function stripSourceComments(lines) {
      const result = [];
      let pending = "";
      let inBlock = false;
      const emit = () => {
        const text = pending.replace(/\s+$/, "");
        if (text.length > 0) result.push(text);
        pending = "";
      };
      for (const line of lines) {
        const n = line.length;
        let i = 0;
        while (i < n) {
          if (inBlock) {
            if (line.startsWith("*/", i)) {
              inBlock = false;
              i += 2;
            } else {
              i += 1;
            }
          } else if (line[i] === '"') {
            let j = i + 1;
            while (j < n && line[j] !== '"') j += line[j] === "\\" ? 2 : 1;
            j = Math.min(j + 1, n);
            pending += line.slice(i, j);
            i = j;
          } else if (line.startsWith("//", i)) {
            break;
          } else if (line.startsWith("/*", i)) {
            inBlock = true;
            i += 2;
          } else {
            pending += line[i];
            i += 1;
          }
        }
        if (!inBlock) emit();
      }
      emit();
      return result;
    }
