expected_concepts:
- finite state machine (code, string, block comment)
- scanning with lookahead for two-character tokens
- escape handling inside string literals
- state that carries across line boundaries
optimal_complexity:
  time: O(total characters)
  space: O(total characters)
rubric:
  excellent: Designs an explicit state machine for code, string and block-comment states, carries the block state and the pending line across lines, handles escapes and two-character markers precisely, and tests tricky inputs such as an unterminated block, the slash-star-slash sequence and markers inside strings.
  good: Correct for most inputs with a clear scanner, needing a hint on string escapes, on joining lines around a multi-line block or on unterminated blocks.
  weak: Uses regular expressions or string search that ignore string literals, loses code before or after a block comment, or keeps empty lines.
  criteria:
    correctness: All tests pass, including escapes, non-nesting blocks and unterminated comments.
    efficiency: Single pass over the characters with no repeated rescanning.
    code_quality: States are explicit and each branch handles exactly one token type; output assembly is separated from scanning.
    edge_cases: Empty input, comment-only input, markers inside strings and comments, and trailing whitespace.
    communication: Describes the states and transitions before coding and walks through a multi-line example.
hints:
- 'At any point while reading the source you are in one of a few situations: ordinary code, inside a string, or inside a block comment. What changes when you move between them?'
- Read character by character with a flag for being inside a block comment that survives across lines; when you see a quote in ordinary code, copy the whole string literal through, respecting backslash escapes, before looking for comment markers again.
- Keep a pending output line. In ordinary code, a quote copies through the closing unescaped quote, a double slash ends the line, a slash-star enters block state, and anything else is copied. In block state skip characters until star-slash. Only finish the pending line when a line ends outside a block comment (and once more at the end), stripping trailing whitespace and dropping it when empty.
followups:
- How would you add single-quoted character literals such as a quoted slash?
- Real compilers replace a comment with a space; how would that change your output and why does it matter?
- How would you preserve line numbers for error messages after stripping?
- How would you stream a very large file through this pass with constant memory per line?
common_errors:
- Searching for // or /* with string functions without skipping string literals.
- Treating an escaped quote as the end of a string, or missing a string that ends with an escaped backslash.
- Emitting the line before a multi-line block comment separately instead of joining it with the code after the comment.
- Nesting block comments or treating slash-star-slash as an empty comment.
