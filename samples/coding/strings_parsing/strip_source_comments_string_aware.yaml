time_limit_minutes: 25
prompt_markdown: |
  ## Strip Source Comments (String Aware)

  A build pipeline minifies configuration scripts written in a C-like language before shipping them to
  edge devices. Your job is the comment-removal pass. The source is given as a list of `lines`.

  - A **line comment** starts with `//` and runs to the end of that line.
  - A **block comment** starts with `/*` and ends at the first `*/` after it. It may span several
    lines. Block comments do not nest. If a block comment is never closed, it runs to the end of the
    input.
  - A **string literal** starts with `"` and ends at the next unescaped `"` on the same line. Inside a
    string, a backslash escapes the character after it (so `\"` does not end the string). Comment
    markers inside a string literal are ordinary text. String literals always close on the line they
    start on, and quote characters inside comments have no effect.
  - Comments are removed **with nothing inserted** in their place.
  - When a block comment spans several lines, the code before it on its first line and the code after
    it on its last line are joined into a **single** line.

  After removing comments, strip trailing whitespace from every resulting line and drop lines that are
  then empty. Leading whitespace is kept. Return the remaining lines in order.

  ### Example 1
  ```
  Input:  lines = [
            "int total = 0; // running sum",
            "url = \"http://svc/api\"; /* default",
            "   endpoint */ retries = 3;",
            "/* header */"
          ]
  Output: [
            "int total = 0;",
            "url = \"http://svc/api\";  retries = 3;"
          ]
  Explanation: The // inside the string is kept. The block comment spans lines 2 and 3,
  so the code around it is joined into one line (both surrounding spaces remain).
  ```

  ### Example 2
  ```
  Input:  lines = ["msg = \"/* not a comment */\";", "", "x = 1;   "]
  Output: ["msg = \"/* not a comment */\";", "x = 1;"]
  ```

  ### Constraints
  - `0 <= lines.length <= 500`
  - `0 <= lines[i].length <= 200`
  - Lines contain printable ASCII characters (codes 32 to 126).
  - Every string literal is closed on the line where it starts (outside comments).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: strip_source_comments
  params:
