version: 1
slug: min_cuts_into_mirrored_segments
title: Minimum Cuts into Mirrored Segments
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 30
prompt_markdown: |
  ## Minimum Cuts into Mirrored Segments

  A telemetry archive uses a compression scheme that can only store **mirrored chunks**: contiguous pieces
  that read the same forwards and backwards (for example `"7"`, `"aa"` or `"x9x"`). Before a record `s`
  is archived it must be cut into such chunks, and every cut costs a write.

  Return the **minimum number of cuts** needed so that every resulting piece of `s` is mirrored. The pieces
  keep their original order and together cover all of `s`. An empty string or a string that is already
  mirrored needs `0` cuts.

  ### Example 1
  ```
  Input:  s = "xnoon7"
  Output: 2
  Explanation: Split as "x" | "noon" | "7". No single cut leaves two mirrored pieces.
  ```

  ### Example 2
  ```
  Input:  s = "4tt4"
  Output: 0
  ```

  ### Example 3
  ```
  Input:  s = "abcab"
  Output: 4
  Explanation: No two adjacent characters match and no character is mirrored around a neighbour, so every character is its own piece.
  ```

  ### Constraints
  - `0 <= s.length <= 2000`
  - `s` consists of lowercase English letters and digits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_mirror_cuts
  params:
    - {name: s, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_mirror_cuts(s: str) -> int:
        n = len(s)
        if n == 0:
            return 0
        # pieces[e]: fewest palindromic pieces covering s[0:e]
        pieces = list(range(n + 1))
        for center in range(2 * n - 1):
            left, right = center // 2, center // 2 + center % 2
            while left >= 0 and right < n and s[left] == s[right]:
                # s[left:right + 1] is a palindrome
                if pieces[left] + 1 < pieces[right + 1]:
                    pieces[right + 1] = pieces[left] + 1
                left -= 1
                right += 1
        return pieces[n] - 1
  javascript: |
    function minMirrorCuts(s) {
      const n = s.length;
      if (n === 0) return 0;
      const pieces = Array.from({ length: n + 1 }, (_, i) => i);
      for (let center = 0; center < 2 * n - 1; center++) {
        let left = Math.floor(center / 2), right = left + (center % 2);
        while (left >= 0 && right < n && s[left] === s[right]) {
          if (pieces[left] + 1 < pieces[right + 1]) pieces[right + 1] = pieces[left] + 1;
          left--;
          right++;
        }
      }
      return pieces[n] - 1;
    }
tests:
  - {id: t1, args: ["xnoon7"], expected: 2, description: "Example 1 - two cuts around a long mirrored chunk"}
  - {id: t2, args: ["4tt4"], expected: 0, description: "Example 2 - already mirrored needs no cut"}
  - {id: t3, args: ["abcab"], expected: 4, description: "Example 3 - no mirrored chunk longer than one character"}
  - {id: t4, hidden: true, args: [""], expected: 0, description: "Empty string needs zero cuts"}
  - {id: t5, hidden: true, args: ["q"], expected: 0, description: "Single character"}
  - {id: t6, hidden: true, args: ["aab"], expected: 1, description: "Greedy longest-prefix choice happens to work; small sanity case"}
  - {id: t7, hidden: true, args: ["abaab"], expected: 1, description: "Greedy longest-prefix palindrome is not optimal (aba|a|b vs a|baab)"}
  - {id: t8, hidden: true, args: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], expected: 0, description: "Long run of one character is a single chunk"}
  - {id: t9, hidden: true, args: ["ab12321bacd"], expected: 2, description: "Odd-length mirrored chunk with digits inside a longer string"}
  - {id: t10, hidden: true, args: ["abccbadeed"], expected: 1, description: "Two adjacent even-length mirrored chunks"}
  - {id: t11, hidden: true, args: [""], expected: 225, description: "700-character random string; quadratic algorithm required"}
expected_concepts:
  - "dynamic programming over prefixes (fewest pieces ending at each position)"
  - "expanding around every centre to enumerate palindromic substrings"
  - "O(n^2) palindrome table or centre expansion instead of re-checking substrings"
  - "why greedy longest-palindrome-first is not optimal"
optimal_complexity: {time: "O(n^2)", space: "O(n)"}
rubric:
  excellent: "Defines the best answer for each prefix, enumerates palindromic substrings by centre expansion (or a palindrome table) so the whole solution is O(n^2), shows a counterexample to greedy and handles the empty string."
  good: "Correct O(n^2) dynamic programming with an O(n^2) boolean table, or a centre-expansion solution with minor prompting."
  weak: "Greedy longest palindrome first, exponential recursion without memoisation, or an O(n^3) solution that re-checks every substring."
  criteria:
    correctness: "All tests pass, including the greedy counterexample and the empty string."
    efficiency: "O(n^2) time; palindrome checks are not repeated per substring."
    code_quality: "Clear meaning for the DP array (pieces versus cuts) and no off-by-one between them."
    edge_cases: "Empty input, one character, whole-string palindromes and long runs."
    communication: "Explains the recurrence and why greedy fails before coding."
hints:
  - "Think about the best answer for each prefix of the string: the last piece of an optimal split of a prefix must itself be mirrored."
  - "So the answer for the prefix ending at position e is one more than the best answer for some shorter prefix, taken over every mirrored piece that ends at e. The difficulty is listing those mirrored pieces quickly instead of reversing every substring."
  - "Expand outwards from each of the 2n - 1 centres; every step of an expansion yields one mirrored piece from left to right, and you can immediately relax the best count for the prefix ending after right using the best count for the prefix ending before left. The number of cuts is the best piece count for the whole string minus one."
followups:
  - "Why does always taking the longest mirrored prefix fail? Give a small counterexample."
  - "How would you also return the pieces themselves, not just the number of cuts?"
  - "Can you reach O(n) memory if you also need the actual split?"
  - "How would the problem change if each piece also had to be at most k characters long?"
common_errors:
  - "Greedily taking the longest mirrored prefix, which fails on abaab."
  - "Returning the number of pieces instead of the number of cuts."
  - "Re-checking each substring for being mirrored, giving O(n^3) time."
  - "Forgetting even-length centres between two characters."
  - "Crashing or returning -1 for an empty string."
