version: 1
slug: count_keyword_subsequence_traces
title: Count Keyword Subsequence Traces
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [security, data, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Count Keyword Subsequence Traces

  An auditor reviews a keystroke log, recorded as the string `log`, and wants to know how strongly it could
  explain a sensitive keyword having been typed, even with other keys pressed in between. A **trace** of
  `keyword` is a choice of positions `i1 < i2 < ... < ik` in `log` (where `k = len(keyword)`) such that
  `log[i1] log[i2] ... log[ik]` spells `keyword` exactly. Two traces are different when they use a different
  set of positions.

  Return the number of distinct traces **modulo `1_000_000_007`**.

  - An empty `keyword` has exactly one trace (choose no positions), so the answer is `1`.
  - If `keyword` is longer than `log`, or cannot be spelled at all, the answer is `0`.

  ### Example 1
  ```
  Input:  log = "aaddm", keyword = "adm"
  Output: 4
  Explanation: Pick one of the two 'a' keys, then one of the two 'd' keys after it, then the 'm': 2 * 2 = 4 traces.
  ```

  ### Example 2
  ```
  Input:  log = "1x2y", keyword = "21"
  Output: 0
  Explanation: The only '1' comes before every '2', so "21" cannot be spelled.
  ```

  ### Example 3
  ```
  Input:  log = "root", keyword = ""
  Output: 1
  ```

  ### Constraints
  - `0 <= log.length <= 1000`
  - `0 <= keyword.length <= 100`
  - Both strings consist of lowercase English letters and digits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_subsequence_traces
  params:
    - {name: log, type: "string"}
    - {name: keyword, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_subsequence_traces(log: str, keyword: str) -> int:
        mod = 1_000_000_007
        m = len(keyword)
        # ways[j]: number of ways to spell keyword[:j] using the log characters seen so far
        ways = [0] * (m + 1)
        ways[0] = 1
        for ch in log:
            # go backwards so each log character is used at most once per trace
            for j in range(m, 0, -1):
                if keyword[j - 1] == ch:
                    ways[j] = (ways[j] + ways[j - 1]) % mod
        return ways[m]
  javascript: |
    function countSubsequenceTraces(log, keyword) {
      const MOD = 1000000007;
      const m = keyword.length;
      const ways = new Array(m + 1).fill(0);
      ways[0] = 1;
      for (const ch of log) {
        for (let j = m; j >= 1; j--) {
          if (keyword[j - 1] === ch) ways[j] = (ways[j] + ways[j - 1]) % MOD;
        }
      }
      return ways[m];
    }
tests:
  - {id: t1, args: ["aaddm", "adm"], expected: 4, description: "Example 1 - independent choices multiply"}
  - {id: t2, args: ["1x2y", "21"], expected: 0, description: "Example 2 - order makes the keyword impossible"}
  - {id: t3, args: ["root", ""], expected: 1, description: "Example 3 - empty keyword has one trace"}
  - {id: t4, hidden: true, args: ["", ""], expected: 1, description: "Both strings empty"}
  - {id: t5, hidden: true, args: ["", "a"], expected: 0, description: "Empty log with a non-empty keyword"}
  - {id: t6, hidden: true, args: ["abc", "abcd"], expected: 0, description: "Keyword longer than the log"}
  - {id: t7, hidden: true, args: ["passwd", "passwd"], expected: 1, description: "Log equals the keyword exactly"}
  - {id: t8, hidden: true, args: ["aaaaaaaa", "aaa"], expected: 56, description: "Repeated letters: C(8, 3) traces from overlapping choices"}
  - {id: t9, hidden: true, args: ["s3s3s3cr3t", "s3cr3t"], expected: 6, description: "Interleaved repeated characters including digits"}
  - {id: t10, hidden: true, args: ["", "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], expected: 771949870, description: "1000 identical keys and a 50-key keyword; the count must be reduced modulo 1e9+7"}
  - {id: t11, hidden: true, args: ["", "admin"], expected: 126772679, description: "600 random keystrokes over the keyword alphabet; large count reduced modulo 1e9+7"}
expected_concepts:
  - "dynamic programming over (log prefix, keyword prefix)"
  - "each log character either extends a partial trace or is skipped"
  - "iterating keyword positions backwards to reuse one row"
  - "modular arithmetic to keep counts bounded"
optimal_complexity: {time: "O(n * m)", space: "O(m)"}
rubric:
  excellent: "Defines ways to spell each keyword prefix with the log seen so far, explains the skip-or-use transition, rolls the table into one row updated from right to left, applies the modulus at every addition and covers the empty-keyword and impossible cases."
  good: "Correct O(n * m) table with O(n * m) memory and the modulus applied, possibly after a nudge on base cases."
  weak: "Enumerates subsets or uses unmemoised recursion, forgets the modulus, or counts distinct strings instead of distinct position sets."
  criteria:
    correctness: "All tests pass, including the large modular cases and empty strings."
    efficiency: "O(n * m) time; memory O(m) or O(n * m) both acceptable, O(m) preferred."
    code_quality: "Meaning of each table entry stated; modulus defined once as a constant."
    edge_cases: "Empty keyword, empty log, keyword longer than log and repeated characters."
    communication: "Explains why the inner loop runs backwards when a single row is reused."
hints:
  - "Process the log one character at a time and ask how each new key press can extend the ways of spelling a part of the keyword."
  - "Keep, for every prefix length of the keyword, how many traces spell that prefix using the characters seen so far. A new character either is ignored or extends traces of the prefix that is one character shorter when it equals the next keyword character."
  - "Use one array indexed by keyword prefix length, starting with one way to spell the empty prefix. For each log character, walk the keyword positions from the end to the start and, wherever the keyword character equals the log character, add the count of the shorter prefix to the current one, reducing modulo one billion and seven each time. The answer is the entry for the whole keyword."
followups:
  - "Why must the keyword positions be updated from right to left when only one row is kept?"
  - "How would you count traces in which consecutive chosen positions are at most d apart?"
  - "If the log grows as a stream, how would you keep the count up to date per key press?"
  - "How would you count only traces whose total span (last minus first position) is minimal?"
common_errors:
  - "Updating the single row from left to right, which lets one log character be used twice."
  - "Forgetting the modulus until the end, which overflows fixed-width integers."
  - "Returning 0 instead of 1 for an empty keyword."
  - "Counting distinct spelled strings instead of distinct sets of positions."
  - "Exponential recursion over choices without memoisation."
