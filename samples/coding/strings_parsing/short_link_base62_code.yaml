  - {id: t4, hidden: true, args: [61], expected: "Z", description: "Largest single digit maps to Z"}
  - {id: t5, hidden: true, args: [62], expected: "10", description: "Smallest two-digit value - carry into a new digit"}
  - {id: t6, hidden: true, args: [10], expected: "a", description: "First lowercase letter - alphabet order check"}
  - {id: t7, hidden: true, args: [36], expected: "A", description: "First uppercase letter - alphabet order check"}
  - {id: t8, hidden: true, args: [238328], expected: "1000", description: "62^3 - a one followed by zeros"}
  - {id: t9, hidden: true, args: [916132831], expected: "ZZZZZ", description: "62^5 - 1 - five Z digits"}
  - {id: t10, hidden: true, args: [1000000007], expected: "15FTGn", description: "Ten-digit decimal id"}
  - {id: t11, hidden: true, args: [9007199254740991], expected: "FfGNdXsE7", description: "Maximum id 2^53 - 1 - needs 64-bit arithmetic"}
expected_concepts:
  - "repeated division and remainder for base conversion"
  - "digits come out least significant first and must be reversed"
  - "special case for zero"
  - "64-bit integer arithmetic"
  - "O(log id) time"
optimal_complexity: {time: "O(log id)", space: "O(log id)"}
rubric:
  excellent: "Uses repeated division by 62 with the given alphabet, reverses the collected digits, handles zero explicitly, uses 64-bit arithmetic and states the logarithmic cost."
  good: "Correct conversion with a minor slip such as forgetting zero or the reversal, fixed after a test case."
  weak: "Builds the alphabet in the wrong order, returns digits least significant first, returns an empty string for zero or overflows on large ids."
  criteria:
    correctness: "All tests pass, including 0, alphabet boundaries and the maximum id."
    efficiency: "Logarithmic number of iterations; no string concatenation in a quadratic pattern."
    code_quality: "Alphabet defined once as a constant; loop variables named for what they hold."
    edge_cases: "Zero, exact powers of 62, values just below a power of 62 and the maximum id."
    communication: "Explains why remainders produce digits from least to most significant."
hints:
  - "This is the same procedure as converting a number to binary or hexadecimal, only with 62 digit symbols."
  - "The remainder of dividing by 62 gives the last digit of the code; dividing the number by 62 then removes that digit."
  - "While the id is positive, take the remainder modulo 62, look up that position in the alphabet, collect it, and replace the id with the integer quotient; the collected digits are in reverse order, so reverse them at the end, and handle an id of zero separately."
followups:
  - "Write the inverse function that turns a code back into the id; how do you reject invalid characters?"
  - "Sequential ids make codes guessable; how could you obfuscate them while keeping codes short and unique?"
  - "How long can a code get for a 64-bit id, and how would you pad codes to a fixed length?"
common_errors:
  - "Forgetting to reverse the collected digits."
  - "Returning an empty string for id 0."
  - "Using 32-bit integers so large ids overflow."
  - "Ordering the alphabet with uppercase before lowercase, contrary to the specification."
