slug: short_link_base62_code
title: "Short Link Base62 Code"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, fullstack]
time_limit_minutes: 12
prompt_markdown: |
  ## Short Link Base62 Code

  A link shortener stores every long URL as a database row with a non-negative integer `id`, and shows
  users a compact code instead of the number. The code is the `id` written in **base 62**, most
  significant digit first, using this digit alphabet:

  ```
  0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
  ```

  So `0`-`9` have values 0-9, `a`-`z` have values 10-35 and `A`-`Z` have values 36-61. The code has no
  leading zeros, except that `id = 0` is encoded as `"0"`.

  Write `short_link_code(id)` that returns the code.

  ### Example 1
  ```
  Input:  id = 125
  Output: "21"
  Explanation: 125 = 2 * 62 + 1.
  ```

  ### Example 2
  ```
  Input:  id = 0
  Output: "0"
  ```

  ### Example 3
  ```
  Input:  id = 3843
  Output: "ZZ"
  Explanation: 3843 = 61 * 62 + 61, the largest two-digit code.
  ```

  ### Constraints
  - `0 <= id <= 2^53 - 1` (the largest id the public API can carry exactly)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: short_link_code
  params:
    - {name: id, type: "long"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    ALPHABET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"


    def short_link_code(id: int) -> str:
        if id == 0:
            return "0"
        digits = []
        while id > 0:
            id, remainder = divmod(id, 62)
            digits.append(ALPHABET[remainder])
        return "".join(reversed(digits))
  javascript: |
    const ALPHABET = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

    function shortLinkCode(id) {
      let n = BigInt(id);
      if (n === 0n) return "0";
      const digits = [];
      while (n > 0n) {
        digits.push(ALPHABET[Number(n % 62n)]);
        n /= 62n;
      }
      return digits.reverse().join("");
    }
