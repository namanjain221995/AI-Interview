expected_concepts:
  - "tokenising on runs of whitespace"
  - "greedy line filling"
  - "accounting for the separator space in the length check"
  - "flushing the last line"
  - "O(n) time over the characters"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Tokenises on any whitespace run, fills lines greedily with a correct length check that includes the separating space, handles overlong words and the final flush, and explains why greedy is what the contract asks for."
  good: "Correct greedy wrapping with a minor slip (for example an off-by-one on lines of exactly width) fixed after a hint."
  weak: "Splits only on single spaces so empty words appear, forgets the separator in the length check, drops the last line or breaks long words."
  criteria:
    correctness: "All tests pass including exact-width lines, overlong words and whitespace-only input."
    efficiency: "Linear in the text length; avoids rebuilding strings quadratically."
    code_quality: "A clear current-line buffer and a single flush point; no special-casing duplicated across branches."
    edge_cases: "Empty or whitespace-only text, width 1, overlong words at the start, middle and end."
    communication: "Explains the length check (current + 1 + word) and when a new line starts."
hints:
  - "First turn the text into a clean list of words, then think about building one output line at a time."
  - "Keep the line you are currently building; before adding a word, check whether the line would still fit including the single space that joins them."
  - "Walk the words in order: if the current line is empty, the word starts it (even when it is longer than the width); otherwise append it when current length plus one plus word length is at most the width, else save the current line and start a new one with the word; after the loop, save the last non-empty line."
followups:
  - "How would you fully justify each line (except the last) by distributing extra spaces?"
  - "How would you break overlong words with a hyphen instead of leaving them whole?"
  - "Greedy filling can leave ragged lines; how would you minimise the total squared slack instead?"
common_errors:
  - "Splitting on a single space, which produces empty words for repeated spaces or keeps tabs and newlines inside words."
  - "Comparing current length plus word length without the separating space, so lines exceed the width by one."
  - "Forgetting to append the final line after the loop."
  - "Emitting an empty first line when the first word is longer than the width."
