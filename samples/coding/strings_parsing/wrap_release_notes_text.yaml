version: 1
slug: wrap_release_notes_text
title: "Wrap Release Notes Text"
difficulty: easy
competency_keys: [algorithms, code_quality]
role_tags: [frontend, general, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Wrap Release Notes Text

  Release notes are printed in a terminal pane that is exactly `width` characters wide. Before printing,
  the text is reflowed:

  1. Split `text` into **words** on any run of whitespace (spaces, tabs, newlines, carriage returns).
     Leading and trailing whitespace produce no words.
  2. Fill lines **greedily**, in word order: keep adding the next word to the current line, separated by a
     single space, as long as the line stays at most `width` characters long. When the next word does not
     fit, start a new line with it.
  3. A word longer than `width` is never broken; it is placed on a line of its own.

  Write `wrap_text(text, width)` that returns the list of lines. Lines never have leading or trailing spaces.
  Return an empty list when `text` contains no words.

  ### Example 1
  ```
  Input:  text = "Fixed a crash when exporting large reports to CSV.", width = 20
  Output: ["Fixed a crash when", "exporting large", "reports to CSV."]
  Explanation: "Fixed a crash when" is 18 characters; adding "exporting" would make 28.
  ```

  ### Example 2
  ```
  Input:  text = "Upgrade   the\nauthentication library", width = 10
  Output: ["Upgrade", "the", "authentication", "library"]
  ```

  ### Example 3
  ```
  Input:  text = "   ", width = 5
  Output: []
  ```

  ### Constraints
  - `0 <= text.length <= 10^4`
  - `1 <= width <= 200`
  - `text` contains printable ASCII characters, spaces, tabs (`\t`), newlines (`\n`) and carriage returns (`\r`) only.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: wrap_text
  params:
    - {name: text, type: "string"}
    - {name: width, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def wrap_text(text: str, width: int) -> list[str]:
        lines: list[str] = []
        current = ""
        for word in text.split():
            if not current:
                current = word
            elif len(current) + 1 + len(word) <= width:
                current += " " + word
            else:
                lines.append(current)
                current = word
        if current:
            lines.append(current)
        return lines
  javascript: |
    function wrapText(text, width) {
      const words = text.split(/[ \t\n\r]+/).filter((w) => w.length > 0);
      const lines = [];
      let current = "";
      for (const word of words) {
        if (current.length === 0) {
          current = word;
        } else if (current.length + 1 + word.length <= width) {
          current += " " + word;
        } else {
          lines.push(current);
          current = word;
        }
      }
      if (current.length > 0) lines.push(current);
      return lines;
    }
