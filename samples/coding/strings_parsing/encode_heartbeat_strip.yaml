expected_concepts:
  - "finding maximal blocks with a start and an end index"
  - "checking both neighbours of a block before filling it"
  - "run-length encoding with multi-digit counts and no count for single characters"
  - "linear-time string building"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Separates gap filling from encoding (or fuses them carefully), checks that both neighbours exist and agree, encodes runs with full multi-digit counts and builds the output in linear time; explains that filling can merge runs."
  good: "Correct result with a nudge on one boundary such as a gap at the start or end, or on writing counts of one."
  weak: "Fills gaps from one side only, fills gaps between different statuses, encodes before filling so merged runs are split, or only handles single-digit counts."
  criteria:
    correctness: "All tests pass, including gaps at the edges, gaps between different statuses and merged multi-digit runs."
    efficiency: "Linear time; each character is visited a constant number of times."
    code_quality: "Clear block boundaries and a single run-encoding routine without duplicated flush logic."
    edge_cases: "Empty string, only question marks, single character, long gaps and runs of ten or more."
    communication: "States the order of the two steps and why it matters for the run lengths."
hints:
  - "Do the two steps in order: first decide what every question mark becomes, then compress the cleaned string."
  - "For each block of question marks, find where it starts and where it ends; it can only be filled when there is a character just before the start and just after the end and those two characters are equal."
  - "Copy the string into a mutable list, fill every qualifying block with its neighbour status, then walk the list with a run-start index, emitting the run length only when it is at least two followed by the character, and join the pieces once at the end."
followups:
  - "Why must gaps be filled before encoding rather than after?"
  - "How would you decode the compacted string back into the cleaned history?"
  - "What would you change if only gaps of at most k checks may be filled?"
  - "How would you maintain the compacted form as new checks arrive one at a time?"
common_errors:
  - "Filling a gap at the start or end of the history, which has only one neighbour."
  - "Filling a gap that sits between an up and a down status."
  - "Encoding first and filling afterwards, so runs joined by a filled gap are not merged."
  - "Writing a count of 1 for single characters or only the last digit of a long run."
