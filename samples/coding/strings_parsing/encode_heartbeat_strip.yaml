slug: encode_heartbeat_strip
title: "Compact Heartbeat Strip"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Compact Heartbeat Strip

  A status page keeps the health-check history of a service as a string `checks`, one character per
  check: `U` (up), `D` (down) or `?` (no data, for example because the prober itself was restarting).
  Before the history is stored it is cleaned up and compacted in two steps.

  **Step 1 - fill short gaps.** Look at every maximal block of consecutive `?` characters. If the block
  has a status character immediately on **both** sides and those two characters are the **same**, every
  `?` in the block is replaced by that status (the service was evidently in that state the whole time).
  All other `?` blocks - at the start or end of the string, or between a `U` and a `D` - stay as they are.

  **Step 2 - encode runs.** Split the result into maximal runs of identical characters and write each
  run as its length in decimal followed by the character, except that a run of length 1 is written as
  the character alone. Multi-digit lengths are written in full (twelve `U` become `12U`).

  Write `encode_heartbeat_strip(checks)` that returns the compacted string. An empty history returns `""`.

  ### Example 1
  ```
  Input:  checks = "UU?UUD??D?"
  Output: "5U4D?"
  Explanation: UU?UU becomes 5 U and D??D becomes 4 D; the last ? has no right neighbour
  ```

  ### Example 2
  ```
  Input:  checks = "?UU??DDDU"
  Output: "?2U2?3DU"
  Explanation: the first ? has no left neighbour and the ?? sits between U and D
  ```

  ### Example 3
  ```
  Input:  checks = ""
  Output: ""
  ```

  ### Constraints
  - `0 <= checks.length <= 10^5`
  - `checks` contains only the characters `U`, `D` and `?`.

  **Follow-up:** can you produce the answer in a single left-to-right pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: encode_heartbeat_strip
  params:
    - {name: checks, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def encode_heartbeat_strip(checks: str) -> str:
        n = len(checks)
        filled = list(checks)
        i = 0
        while i < n:
            if checks[i] != "?":
                i += 1
                continue
            j = i
            while j < n and checks[j] == "?":
                j += 1
            # checks[i:j] is a maximal gap; fill it only when both neighbours exist and agree
            if i > 0 and j < n and checks[i - 1] == checks[j]:
                for k in range(i, j):
                    filled[k] = checks[j]
            i = j

        pieces: list[str] = []
        i = 0
        while i < n:
            j = i
            while j < n and filled[j] == filled[i]:
                j += 1
            run = j - i
            pieces.append(filled[i] if run == 1 else f"{run}{filled[i]}")
            i = j
        return "".join(pieces)
  javascript: |
    function encodeHeartbeatStrip(checks) {
      const n = checks.length;
      const filled = checks.split("");
      let i = 0;
      while (i < n) {
        if (checks[i] !== "?") { i++; continue; }
        let j = i;
        while (j < n && checks[j] === "?") j++;
        if (i > 0 && j < n && checks[i - 1] === checks[j]) {
          for (let k = i; k < j; k++) filled[k] = checks[j];
        }
        i = j;
      }
      const pieces = [];
      i = 0;
      while (i < n) {
        let j = i;
        while (j < n && filled[j] === filled[i]) j++;
        const run = j - i;
        pieces.push(run === 1 ? filled[i] : String(run) + filled[i]);
        i = j;
      }
      return pieces.join("");
    }
