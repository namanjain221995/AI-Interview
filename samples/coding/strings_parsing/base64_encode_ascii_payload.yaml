expected_concepts:
  - "grouping bytes in threes into a 24-bit block"
  - "extracting 6-bit values with shifts and masks"
  - "padding rules for one or two leftover bytes"
  - "lookup table for the alphabet"
  - "linear time with a string builder"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Packs each group into a 24-bit integer, extracts four 6-bit indexes with shifts and a mask, handles the one- and two-byte tails with a single rule, builds the output efficiently, and verifies by hand with a short example."
  good: "Correct encoder with bit operations; the padding logic may be written as separate special cases or need one fix."
  weak: "Converts to binary strings without understanding the grouping, gets the padding count reversed, or falls back to a built-in encoder."
  criteria:
    correctness: "All tests pass, including the empty input, both padding cases and bytes that map to + and /."
    efficiency: "Linear time; output assembled with a list or builder rather than quadratic concatenation in languages where that matters."
    code_quality: "Named alphabet constant, clear shift amounts, no duplicated branches per tail size."
    edge_cases: "Empty input, one byte, two bytes, a long input, and the highest printable characters."
    communication: "Explains why three bytes map to exactly four characters and what the padding tells a decoder."
hints:
  - "Three bytes hold twenty-four bits, which is exactly four groups of six bits, and six bits pick one of sixty-four characters."
  - "Combine each group of three bytes into one number, then pull out the four six-bit pieces from the most significant end with shifts and a mask of sixty-three. Think separately about a final group of one or two bytes."
  - "For a short final group, pretend the missing bytes are zero, compute the four characters as usual, then keep only one more character than the number of real bytes and fill the remaining positions with equals signs, so two real bytes give three characters plus one pad and one real byte gives two characters plus two pads."
followups:
  - "Write the matching decoder. How do you validate the padding?"
  - "What changes for the URL-safe Base64 variant?"
  - "How would you encode a stream without holding the whole payload in memory?"
  - "Why is Base64 not encryption, and what would you use to protect the payload?"
common_errors:
  - "Emitting four characters for a partial group and then appending padding as well."
  - "Getting the padding count reversed (one = for a single leftover byte)."
  - "Shifting in the wrong order so the least significant bits come first."
  - "Using a 32-bit signed shift carelessly or masking with the wrong value so indexes fall outside the alphabet."
  - "Building the result with repeated string concatenation in a language where that is quadratic."
