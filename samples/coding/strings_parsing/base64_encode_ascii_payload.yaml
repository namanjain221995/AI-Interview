title: Base64 Encode an ASCII Payload
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, security, network]
time_limit_minutes: 15
prompt_markdown: |
  ## Base64 Encode an ASCII Payload

  A firmware client on a small embedded device has to send an ASCII payload in an HTTP header, but no
  encoding library fits in its memory. Implement standard **Base64** encoding yourself.

  Treat each character of `text` as one byte (its ASCII code) and process the bytes in
  groups of three, from the start:

  - A full group of 3 bytes is 24 bits. Split them, most significant bit first, into four 6-bit values
    and map each value `v` to `ALPHABET[v]`, where
    `ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"` (so `0 -> A`,
    `26 -> a`, `52 -> 0`, `62 -> +`, `63 -> /`).
  - If the last group has only **2** bytes, append one zero byte, encode it as above, and replace the last
    output character with `=`.
  - If the last group has only **1** byte, append two zero bytes, encode it, and replace the last two
    output characters with `==`.

  The output has no line breaks. An empty `text` encodes to the empty string. Do not use a built-in
  Base64 function.

  ### Example 1
  ```
  Input:  text = "ok"
  Output: "b2s="
  Explanation: o and k are bytes 111 and 107, which give the 6-bit values 27, 54 and 44 plus one = for the
               missing third byte.
  ```

  ### Example 2
  ```
  Input:  text = "deploy:v2"
  Output: "ZGVwbG95OnYy"
  ```

  ### Example 3
  ```
  Input:  text = "svc-7"
  Output: "c3ZjLTc="
  ```

  ### Constraints
  - `0 <= text.length <= 1000`
  - `text` contains printable ASCII characters only (codes `32` to `126`).

  **Follow-up:** write the decoder, and decide how it should react to invalid characters or wrong padding.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: base64_encode_text
  params:
    - {name: text, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"


    def base64_encode_text(text: str) -> str:
        data = [ord(c) for c in text]
        out: list[str] = []
        for start in range(0, len(data), 3):
            chunk = data[start:start + 3]
            size = len(chunk)
            chunk += [0] * (3 - size)
            block = (chunk[0] << 16) | (chunk[1] << 8) | chunk[2]
            chars = [ALPHABET[(block >> shift) & 63] for shift in (18, 12, 6, 0)]
            keep = size + 1
            out.append("".join(chars[:keep]) + "=" * (4 - keep))
        return "".join(out)
  javascript: |
    function base64EncodeText(text) {
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
      let out = "";
      for (let start = 0; start < text.length; start += 3) {
        const size = Math.min(3, text.length - start);
        const b0 = text.charCodeAt(start);
        const b1 = size > 1 ? text.charCodeAt(start + 1) : 0;
        const b2 = size > 2 ? text.charCodeAt(start + 2) : 0;
        const block = (b0 << 16) | (b1 << 8) | b2;
        const chars = [18, 12, 6, 0].map((shift) => alphabet[(block >> shift) & 63]);
        out += chars.slice(0, size + 1).join("") + "=".repeat(3 - size);
      }
      return out;
    }
