version: 1
slug: pretty_print_json_document
title: Pretty Print a JSON Document
difficulty: medium
competency_keys: [algorithms, code_quality]
role_tags: [backend, frontend, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Pretty Print a JSON Document

  An API debugging console receives response bodies as compact or messily spaced JSON and shows them in a
  readable layout. Given a **valid** JSON document `doc` and an indentation width `indent`, return the
  formatted document as a list of lines, following these rules exactly:

  - Whitespace between tokens in `doc` (spaces, tabs, newlines, carriage returns) is ignored.
  - A **non-empty** object or array puts its opening `{` or `[` at the end of its owner's line (the
    line of its key, the line of the enclosing array element, or the first line for the top level).
    Each member or element then goes on its own line, indented by `indent` spaces per nesting depth
    (top-level members are at depth 1), and the closing `}` or `]` gets its own line at the owner's depth.
  - An object member is written as the key, then `": "` (colon and one space), then the value.
  - Every member or element except the last is followed by a `,` at the end of its last line.
  - An **empty** object or array is written as `{}` or `[]` on its owner's line.
  - Strings (keys and values), numbers, `true`, `false` and `null` are copied **verbatim** from `doc`,
    including escape sequences such as `\"` or `\u00e9` and the exact number spelling such as `1E3`.
  - Duplicate keys are kept, in their original order.

  In the examples, `doc` and each output line are shown as raw text without surrounding quotes, one
  output line per row.

  ### Example 1
  ```
  Input:  doc = {"service":"api","replicas":3,"ports":[80,443]}, indent = 2
  Output:
  {
    "service": "api",
    "replicas": 3,
    "ports": [
      80,
      443
    ]
  }
  ```

  ### Example 2
  ```
  Input:  doc = [ {}, [], "a\"b", null ], indent = 4
  Output:
  [
      {},
      [],
      "a\"b",
      null
  ]
  ```

  ### Constraints
  - `1 <= doc.length <= 10^4`
  - `doc` is valid JSON (RFC 8259) whose top-level value may be any JSON value.
  - `0 <= indent <= 8`
  - Nesting depth is at most `100`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: pretty_print_json
  params:
    - {name: doc, type: string}
    - {name: indent, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def pretty_print_json(doc: str, indent: int) -> list[str]:
        n = len(doc)
        lines: list[str] = []
        pos = 0

        def skip_ws() -> None:
            nonlocal pos
            while pos < n and doc[pos] in " \t\n\r":
                pos += 1

        def scalar() -> str:
            """Copy a string, number or literal token verbatim."""
            nonlocal pos
            start = pos
            if doc[pos] == '"':
                pos += 1
                while doc[pos] != '"':
                    pos += 2 if doc[pos] == "\\" else 1
                pos += 1
            else:
                while pos < n and doc[pos] not in " \t\n\r,]}:":
                    pos += 1
            return doc[start:pos]

        def value(depth: int, prefix: str) -> None:
            nonlocal pos
            skip_ws()
            opener = doc[pos]
            if opener not in "{[":
                lines.append(prefix + scalar())
                return
            closer = "}" if opener == "{" else "]"
            pos += 1
            skip_ws()
            if doc[pos] == closer:
                pos += 1
                lines.append(prefix + opener + closer)
                return
            lines.append(prefix + opener)
            pad = " " * (indent * (depth + 1))
            while True:
                skip_ws()
                child_prefix = pad
                if opener == "{":
                    key = scalar()
                    skip_ws()
                    pos += 1  # the colon
                    child_prefix = pad + key + ": "
                value(depth + 1, child_prefix)
                skip_ws()
                if doc[pos] == ",":
                    pos += 1
                    lines[-1] += ","
                    continue
                pos += 1  # the closer
                break
            lines.append(" " * (indent * depth) + closer)

        value(0, "")
        return lines
  javascript: |
    function prettyPrintJson(doc, indent) {
      const n = doc.length;
      const lines = [];
      let pos = 0;
      const isWs = (c) => c === " " || c === "\t" || c === "\n" || c === "\r";
      const skipWs = () => {
        while (pos < n && isWs(doc[pos])) pos++;
      };
      const scalar = () => {
        const start = pos;
        if (doc[pos] === '"') {
          pos++;
          while (doc[pos] !== '"') pos += doc[pos] === "\\" ? 2 : 1;
          pos++;
        } else {
          while (pos < n && !isWs(doc[pos]) && !",]}:".includes(doc[pos])) pos++;
        }
        return doc.slice(start, pos);
      };
      const value = (depth, prefix) => {
        skipWs();
        const opener = doc[pos];
        if (opener !== "{" && opener !== "[") {
          lines.push(prefix + scalar());
          return;
        }
        const closer = opener === "{" ? "}" : "]";
        pos++;
        skipWs();
        if (doc[pos] === closer) {
          pos++;
          lines.push(prefix + opener + closer);
          return;
        }
        lines.push(prefix + opener);
        const pad = " ".repeat(indent * (depth + 1));
        for (;;) {
          skipWs();
          let childPrefix = pad;
          if (opener === "{") {
            const key = scalar();
            skipWs();
            pos++;
            childPrefix = pad + key + ": ";
          }
          value(depth + 1, childPrefix);
          skipWs();
          if (doc[pos] === ",") {
            pos++;
            lines[lines.length - 1] += ",";
            continue;
          }
          pos++;
          break;
        }
        lines.push(" ".repeat(indent * depth) + closer);
      };
      value(0, "");
      return lines;
    }
