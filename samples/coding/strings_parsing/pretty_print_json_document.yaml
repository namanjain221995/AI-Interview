expected_concepts:
  - recursive descent over objects and arrays (or an explicit stack)
  - tokenising strings with backslash escapes
  - tracking depth for indentation
  - appending the separator to the last emitted line
optimal_complexity: {time: O(n + output size), space: O(depth + output size)}
rubric:
  excellent: Writes a small recursive-descent formatter that copies tokens verbatim, handles escapes inside strings, treats empty containers specially, appends commas to the last emitted line of each non-final child, and explains why parsing into native objects and re-serialising would break verbatim numbers, escapes and duplicate keys.
  good: Correct formatter with one or two fixes needed after tests, for example empty containers or commas after nested closers.
  weak: Uses a library parse and dump, scans characters without recognising strings so brackets inside strings break the layout, or misplaces commas and closing brackets.
  criteria:
    correctness: All tests pass, including escapes, duplicate keys, empty containers and top-level scalars.
    efficiency: Single pass over the input; output built line by line without quadratic re-scanning.
    code_quality: Separate helpers for whitespace, scalar tokens and containers; the indentation rule lives in one place.
    edge_cases: Indent zero, deep nesting, strings containing structural characters and escaped backslashes before a quote.
    communication: Describes the output grammar before coding and walks through the comma placement rule.
hints:
  - The layout depends only on structure - where containers open and close and where members are separated - so think about walking the document once while remembering the current depth.
  - Treat strings as single tokens; inside a string a backslash always escapes the next character, so brackets, commas and quotes there are content. A recursive function that formats one value given the text already on its line keeps the nesting simple.
  - Write a function that skips whitespace and either copies a scalar token onto the current line or, for a container, emits the opener on the current line, formats each child on a new line with the deeper indentation and the key and colon in front for objects, appends a comma to the last line of every child that is followed by another, and finally emits the closer at the current depth; an immediately closed container is written as a pair on one line.
followups:
  - How would you produce the opposite transformation that minifies a document?
  - How would you rewrite the formatter iteratively to survive very deep nesting?
  - How would you stream the output for a document too large to hold in memory?
  - How would you report the line and column of the first syntax error in invalid input?
common_errors:
  - Parsing into native objects and re-serialising, which changes escapes, number spellings and duplicate keys.
  - Treating brackets or quotes inside strings as structure, especially after an escaped backslash.
  - Putting commas on the line after a nested closer instead of on the closer line itself.
  - Printing empty containers across two lines.
