slug: asset_tag_checksum
title: "Asset Tag Checksum"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [qa, backend, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Asset Tag Checksum

  The IT team labels every laptop and monitor with an asset tag such as `AT-7317-0044-50`. Support staff
  type tags by hand, so the inventory service validates them before looking anything up. A tag is
  **valid** when all of these hold:

  1. It starts with exactly `AT-` (uppercase letters, then a dash).
  2. Everything after that prefix consists only of digits `0`-`9` and dashes `-` (dashes may appear
     anywhere and in any number).
  3. Ignoring the dashes, there are **at least two** digits.
  4. The digit sequence passes the checksum: going from the **rightmost** digit to the left, double every
     second digit (the 2nd, 4th, 6th, ... from the right); if a doubled value is greater than 9, subtract 9
     from it. Add up all the resulting values (doubled and untouched). The total must be divisible by 10.

  Write `valid_asset_tag(tag)` that returns `true` if the tag is valid and `false` otherwise.

  ### Example 1
  ```
  Input:  tag = "AT-7317-0044-50"
  Output: true
  Explanation: the digits are 7317004450; doubling every second digit from the right gives 1, 8, 0, 2 and 5 (10 and 14 reduced by 9), which sum to 16, the other digits sum to 14, and 16 + 14 = 30 is divisible by 10.
  ```

  ### Example 2
  ```
  Input:  tag = "AT-7317-0045-50"
  Output: false
  Explanation: one digit changed, so the total is no longer a multiple of 10.
  ```

  ### Example 3
  ```
  Input:  tag = "AT-7317-OO44-50"
  Output: false
  ```

  ### Constraints
  - `0 <= tag.length <= 100`
  - `tag` consists of printable ASCII characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: valid_asset_tag
  params:
    - {name: tag, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def valid_asset_tag(tag: str) -> bool:
        if not tag.startswith("AT-"):
            return False
        digits = []
        for ch in tag[3:]:
            if "0" <= ch <= "9":
                digits.append(ord(ch) - ord("0"))
            elif ch != "-":
                return False
        if len(digits) < 2:
            return False
        total = 0
        for position, value in enumerate(reversed(digits)):
            if position % 2 == 1:
                value *= 2
                if value > 9:
                    value -= 9
            total += value
        return total % 10 == 0
  javascript: |
    function validAssetTag(tag) {
      if (!tag.startsWith("AT-")) return false;
      const digits = [];
      for (const ch of tag.slice(3)) {
        if (ch >= "0" && ch <= "9") digits.push(ch.charCodeAt(0) - 48);
        else if (ch !== "-") return false;
      }
      if (digits.length < 2) return false;
      let total = 0;
      for (let position = 0; position < digits.length; position++) {
        let value = digits[digits.length - 1 - position];
        if (position % 2 === 1) {
          value *= 2;
          if (value > 9) value -= 9;
        }
        total += value;
      }
      return total % 10 === 0;
    }
tests:
  - {id: t1, args: ["AT-7317-0044-50"], expected: true, description: "Example 1 - valid tag"}
  - {id: t2, args: ["AT-7317-0045-50"], expected: false, description: "Example 2 - single mistyped digit fails the checksum"}
  - {id: t3, args: ["AT-7317-OO44-50"], expected: false, description: "Example 3 - letter O instead of zero"}
  - {id: t4, hidden: true, args: [""], expected: false, description: "Empty string"}
  - {id: t5, hidden: true, args: ["AT-"], expected: false, description: "Prefix only - no digits"}
  - {id: t6, hidden: true, args: ["AT-0"], expected: false, description: "Only one digit even though the sum is divisible by 10"}
  - {id: t7, hidden: true, args: ["AT-00"], expected: true, description: "Two zeros - minimal valid tag"}
  - {id: t8, hidden: true, args: ["at-7317-0044-50"], expected: false, description: "Lowercase prefix is rejected"}
  - {id: t9, hidden: true, args: ["AT7317004450"], expected: false, description: "Missing dash after AT"}
  - {id: t10, hidden: true, args: ["AT--18-"], expected: true, description: "Extra dashes at the start and end of the digit part are allowed"}
  - {id: t11, hidden: true, args: ["AT-7317 0044-50"], expected: false, description: "Space inside the tag is rejected"}
  - {id: t12, hidden: true, args: ["AT-7317-0044-05"], expected: false, description: "Two adjacent digits transposed - checksum catches it"}
  - {id: t13, hidden: true, args: ["AT-5500-0000-0000-0004-1234-5678-1234-5670"], expected: true, description: "Long tag with many digits"}
expected_concepts:
  - "validating format before computing the checksum"
  - "iterating digits from the right"
  - "alternating doubling with the subtract-nine rule (Luhn-style check)"
  - "early exit on invalid characters"
  - "O(n) time, O(1) extra space possible"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Validates the prefix, characters and digit count before the checksum, iterates from the right with correct alternation and subtract-nine handling, considers all edge cases and notes the O(n) time with optional O(1) space."
  good: "Checksum and format rules are correct with a small slip, such as allowing a single digit, fixed after a hint."
  weak: "Doubles digits counted from the left, includes dashes as digits, accepts lowercase or missing prefixes, or forgets the subtract-nine step."
  criteria:
    correctness: "All tests pass, including empty strings, prefix-only tags, a single digit and transposed digits."
    efficiency: "Single pass over the characters; no repeated string rebuilding."
    code_quality: "Format validation and checksum are separate, readable steps; no magic numbers without explanation."
    edge_cases: "Empty input, prefix only, one digit, extra dashes, spaces, lowercase prefix and long tags."
    communication: "Explains why counting positions from the right matters when the number of digits varies."
hints:
  - "Split the job in two: first decide whether the text even looks like a tag, then compute the checksum on its digits."
  - "Collect the digits after the prefix, rejecting any character that is neither a digit nor a dash; the doubling pattern is anchored at the right end, so process the digits from last to first."
  - "After confirming the prefix and the allowed characters and that at least two digits exist, walk the digits from the rightmost one keeping a position counter; double the value at every odd position counting from zero, subtract nine whenever a doubled value exceeds nine, add everything into a running total and accept the tag only if the total is a multiple of ten."
followups:
  - "How would you compute the correct final check digit for a new tag?"
  - "Which typing errors does this checksum always catch, and which can slip through?"
  - "How would you report the reason a tag was rejected instead of just true or false?"
common_errors:
  - "Doubling every second digit counted from the left, which breaks for an odd number of digits."
  - "Treating dashes as digits or failing on dashes instead of skipping them."
  - "Accepting tags with fewer than two digits such as the prefix alone."
  - "Using a general digit test that also accepts non-ASCII digits."
