expected_concepts:
- tokenisation with explicit separator rules
- sliding window of k words
- sets of tuples (or delimited keys) and Jaccard similarity
- special-casing empty sets
optimal_complexity:
  time: O((n + m) * k)
  space: O((n + m) * k)
rubric:
  excellent: Tokenises exactly as specified, builds distinct k-word shingle sets with an unambiguous key (tuples or a delimiter that cannot appear in a word), computes intersection over union with the empty-set rules, and discusses MinHash or locality-sensitive hashing for scale.
  good: Correct score for normal inputs, needing a hint on the empty-set cases, on duplicate shingles or on building keys without a delimiter.
  weak: Splits only on spaces, counts duplicate shingles, divides by zero when both sets are empty, or compares single words when k is larger than one.
  criteria:
    correctness: All tests pass, including texts with only separators and texts shorter than k.
    efficiency: Linear in the total number of words times k, using hash sets.
    code_quality: A shared helper that turns a text into its shingle set; clear handling of the special cases.
    edge_cases: Empty inputs, both sets empty, punctuation-only text and repeated phrases.
    communication: Explains why shingles must keep word boundaries and why sets remove repeats.
hints:
- 'Break the problem into three steps that can each be tested on their own: turn a text into words, turn words into shingles, and compare two collections of shingles.'
- Store each text's shingles in a set so repeats disappear, and make sure a shingle is stored in a form where two different word sequences can never look the same.
- Lower-case the text and split it on every run of characters that are not letters or digits, drop empty pieces, collect each window of k words as a tuple or as words joined by a space, then return 1.0 when both sets are empty and otherwise the size of the intersection divided by the size of the union.
followups:
- How would MinHash estimate this score without storing every shingle?
- How would you use locality-sensitive hashing to find candidate duplicate pairs among a million tickets?
- How would you choose k for short support tickets versus long incident reports?
- What text normalisation (stemming, stop words, numbers) would you consider and what could go wrong?
common_errors:
- Splitting only on spaces, so punctuation stays attached to words.
- Concatenating words without a delimiter, so different shingles collide.
- Using lists instead of sets, so repeated shingles inflate the score.
- Dividing by zero when both shingle sets are empty.
