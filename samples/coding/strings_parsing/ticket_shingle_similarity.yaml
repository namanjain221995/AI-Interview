role_tags: [support_engineer, data_scientist, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Duplicate Ticket Shingle Similarity

  A help desk wants to flag tickets that are probably duplicates of each other. It scores a pair of
  ticket texts `a` and `b` like this:

  1. **Words.** Lower-case the text. Every character that is not an ASCII letter (`a-z`) or digit
     (`0-9`) is a separator; the words are the non-empty pieces between separators, in order. So
     `"Can't log-in!"` gives the words `can`, `t`, `log`, `in`.
  2. **Shingles.** A *k-shingle* is a run of `k` consecutive words. The shingle set of a text is the
     set of its **distinct** k-shingles. A text with fewer than `k` words has an empty shingle set.
  3. **Score.** With shingle sets `A` and `B`, the score is `|A ∩ B| / |A ∪ B|`. If both sets are
     empty the score is `1.0`; if exactly one is empty it is `0.0`.

  Return the score as a floating-point number (answers within `1e-6` are accepted).

  ### Example 1
  ```
  Input:  a = "Login page times out after SSO redirect",
          b = "login page times out after the SSO redirect!", k = 2
  Output: 0.625
  Explanation: A has 6 two-word shingles, B has 7; they share 5 ("login page", "page times",
  "times out", "out after", "sso redirect"), and the union has 8.
  ```

  ### Example 2
  ```
  Input:  a = "Disk full on node-7", b = "disk FULL on node 7", k = 3
  Output: 1.0
  ```

  ### Example 3
  ```
  Input:  a = "Printer jam", b = "printer jam again", k = 3
  Output: 0.0
  Explanation: a has only two words, so its shingle set is empty while b's is not.
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 10^4`
  - `a` and `b` contain printable ASCII characters (codes 32 to 126).
  - `1 <= k <= 20`

  **Follow-up:** how would you find likely duplicates among a million tickets without comparing every pair?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shingle_similarity
  params:
    - {name: a, type: "string"}
    - {name: b, type: "string"}
    - {name: k, type: "int"}
  return_type: "float"
  comparison: float_tolerance
reference_solutions:
  python: |
    import re


    def shingle_similarity(a: str, b: str, k: int) -> float:
        def shingles(text: str) -> set[tuple[str, ...]]:
            words = [word for word in re.split(r"[^a-z0-9]+", text.lower()) if word]
            return {tuple(words[i : i + k]) for i in range(len(words) - k + 1)}

        first, second = shingles(a), shingles(b)
        if not first and not second:
            return 1.0
        return len(first & second) / len(first | second)
  javascript: |
    function shingleSimilarity(a, b, k) {
      const shingles = (text) => {
        const words = text.toLowerCase().split(/[^a-z0-9]+/).filter((word) => word.length > 0);
        const result = new Set();
        for (let i = 0; i + k <= words.length; i++) {
          result.add(words.slice(i, i + k).join(" "));
        }
        return result;
      };
      const first = shingles(a);
      const second = shingles(b);
      if (first.size === 0 && second.size === 0) return 1.0;
      let common = 0;
      for (const shingle of first) if (second.has(shingle)) common++;
      return common / (first.size + second.size - common);
    }
