expected_concepts:
  - "parsing a tag into numeric components after removing the optional prefix"
  - "padding missing components with zeros before comparing"
  - "numeric component-wise comparison instead of string comparison"
  - "single pass keeping the best so far with a strict comparison for stable tie-breaking"
optimal_complexity: {time: "O(n * L) where L is the tag length", space: "O(1) extra besides the parsed components"}
rubric:
  excellent: "Parses each tag once into four numbers, compares them numerically, keeps the first of equal versions by only replacing on a strictly newer version, and returns the original spelling; explains the linear cost."
  good: "Correct numeric comparison and tie-breaking, perhaps with a sort or a helper that needs a nudge on padding or on returning the original string."
  weak: "Compares tags as strings, strips leading zeros or the prefix in the returned value, or returns the last of several equal versions."
  criteria:
    correctness: "All tests pass, including ties between different spellings and components of different lengths."
    efficiency: "One pass over the tags; no need to sort the whole list."
    code_quality: "A small parse helper and a clear compare step; no duplicated parsing logic."
    edge_cases: "Single tag, all-equal versions, leading zeros, missing components and nine-digit components."
    communication: "States the tie-breaking rule and why a strict comparison keeps the earliest tag."
hints:
  - "Before you can compare two tags you need a form in which they are directly comparable; what is the version hiding inside each tag?"
  - "Strip the optional prefix, split on dots, turn each piece into a number and pad the list to four numbers so that a shorter tag is compared as if it had zeros at the end."
  - "Walk the list once, remembering the original text of the best tag and its padded numbers; replace them only when the current tag is strictly newer in the first component that differs, which automatically keeps the earliest of several equal versions."
followups:
  - "How would you extend the comparison to pre-release suffixes such as -rc1 that sort before the final release?"
  - "What would you change if a tag could be malformed and had to be skipped?"
  - "If the bot needed the newest tag for each major version, how would you organise the pass?"
common_errors:
  - "Comparing tags as strings, which ranks v9.0 above v10.0."
  - "Forgetting to pad missing components, so 1.2 and 1.2.0 compare as different versions."
  - "Returning the normalised version instead of the tag exactly as written."
  - "Using a greater-or-equal comparison, which returns the last of several equal versions instead of the first."
