version: 1
slug: latest_release_tag
title: "Latest Release Tag"
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [devops, platform, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Latest Release Tag

  A deploy bot promotes the newest release of a repository, so it has to pick the newest tag from the
  repository's tag list. Tags were created by different people over the years and are not written
  consistently.

  Each tag in `tags` is an optional lowercase `v` followed by **1 to 4** non-negative integers separated by
  dots, for example `v2.14.0`, `3.1` or `v1.04`. Leading zeros are allowed and do not change the value
  (`v1.04` is version 1.4).

  Two tags are compared like this:

  - Read each tag as a list of four numbers; missing trailing components count as `0`
    (`3.1` is `3.1.0.0`).
  - Compare the lists component by component from the left as **numbers**; the first component that
    differs decides which tag is newer.

  Write `latest_release_tag(tags)` that returns the newest tag **exactly as it is written** in the list.
  If several tags denote the same newest version (for example `1.2` and `v1.2.0`), return the one that
  appears **first** in `tags`.

  ### Example 1
  ```
  Input:  tags = ["v1.2.3", "v1.10.0", "v1.9.9"]
  Output: "v1.10.0"
  Explanation: 10 > 9 in the second component, so v1.10.0 is the newest
  ```

  ### Example 2
  ```
  Input:  tags = ["v3.1", "3.01.0", "v3.0.9"]
  Output: "v3.1"
  Explanation: v3.1 and 3.01.0 are both version 3.1.0.0; v3.1 appears first
  ```

  ### Example 3
  ```
  Input:  tags = ["0.9.9.9", "1", "v0.10"]
  Output: "1"
  ```

  ### Constraints
  - `1 <= tags.length <= 10^4`
  - Every tag is valid: an optional `v`, then 1 to 4 components separated by single dots.
  - Every component has 1 to 9 decimal digits (so each value fits in a 32-bit integer).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: latest_release_tag
  params:
    - {name: tags, type: "string[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def latest_release_tag(tags: list[str]) -> str:
        def version(tag: str) -> list[int]:
            body = tag[1:] if tag.startswith("v") else tag
            parts = [int(p) for p in body.split(".")]
            return parts + [0] * (4 - len(parts))

        best_tag = tags[0]
        best = version(best_tag)
        for tag in tags[1:]:
            current = version(tag)
            if current > best:  # strictly newer only, so the earliest of equal versions wins
                best, best_tag = current, tag
        return best_tag
  javascript: |
    function latestReleaseTag(tags) {
      const version = (tag) => {
        const body = tag.startsWith("v") ? tag.slice(1) : tag;
        const parts = body.split(".").map(Number);
        while (parts.length < 4) parts.push(0);
        return parts;
      };
      const compare = (a, b) => {
        for (let i = 0; i < 4; i++) {
          if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
        }
        return 0;
      };
      let bestTag = tags[0];
      let best = version(bestTag);
      for (let i = 1; i < tags.length; i++) {
        const current = version(tags[i]);
        if (compare(current, best) > 0) {
          best = current;
          bestTag = tags[i];
        }
      }
      return bestTag;
    }
