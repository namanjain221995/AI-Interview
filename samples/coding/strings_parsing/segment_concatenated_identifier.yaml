version: 1
slug: segment_concatenated_identifier
title: Segment a Concatenated Identifier
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, ml]
time_limit_minutes: 25
prompt_markdown: |
  ## Segment a Concatenated Identifier

  A legacy database stored column names without separators (`orderlineitemtotal`), and a migration tool
  wants to turn them into readable `snake_case` names. Given the lowercase identifier `s` and a vocabulary
  `vocab` of known words, write `segment_identifier(s, vocab)` that splits `s` into a sequence of
  vocabulary words whose concatenation is exactly `s`.

  - Use the **fewest words** possible. A word may be used any number of times.
  - If several splits use the fewest words, return the one that is **lexicographically smallest when
    compared word by word**: compare the first words; if they are equal compare the second words, and so
    on. Words are compared as ordinary strings, so a word is smaller than any longer word it is a prefix of
    (`"order"` comes before `"orderline"`).
  - Return an empty list `[]` if `s` cannot be split into vocabulary words.

  ### Example 1
  ```
  Input:  s = "orderlineitemtotal", vocab = ["order", "line", "item", "total", "lineitem", "orderline"]
  Output: ["order", "lineitem", "total"]
  Explanation: "orderline item total" also uses 3 words, but "order" < "orderline".
  ```

  ### Example 2
  ```
  Input:  s = "timestamp", vocab = ["time", "stamp", "times", "tamp", "timestamp"]
  Output: ["timestamp"]
  ```

  ### Example 3
  ```
  Input:  s = "pricexyz", vocab = ["price", "xy", "z1"]
  Output: []
  ```

  ### Constraints
  - `1 <= s.length <= 300`
  - `1 <= vocab.length <= 500`
  - `1 <= vocab[i].length <= 20`; `vocab` may contain duplicates.
  - `s` contains lowercase English letters only; vocabulary words contain lowercase letters and digits.

  **Follow-up:** a plain recursive search can take exponential time on inputs such as a long run of `a`
  with vocabulary `["a", "aa", "aaa"]` ending in a letter no word contains. How do you guarantee
  polynomial time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: segment_identifier
  params:
    - {name: s, type: "string"}
    - {name: vocab, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def segment_identifier(s: str, vocab: list[str]) -> list[str]:
        words = set(vocab)
        lengths = sorted({len(w) for w in words})
        n = len(s)
        # best[i] = best split of the suffix s[i:] (fewest words, then smallest word by word), None if impossible
        best: list[list[str] | None] = [None] * (n + 1)
        best[n] = []
        for i in range(n - 1, -1, -1):
            for length in lengths:
                if i + length > n:
                    break
                word = s[i:i + length]
                rest = best[i + length]
                if rest is None or word not in words:
                    continue
                candidate = [word] + rest
                current = best[i]
                if current is None or (len(candidate), candidate) < (len(current), current):
                    best[i] = candidate
        return best[0] if best[0] is not None else []
  javascript: |
    function segmentIdentifier(s, vocab) {
      const words = new Set(vocab);
      const lengths = [...new Set(vocab.map((w) => w.length))].sort((a, b) => a - b);
      const n = s.length;
      const better = (a, b) => {
        if (a.length !== b.length) return a.length < b.length;
        for (let k = 0; k < a.length; k++) {
          if (a[k] !== b[k]) return a[k] < b[k];
        }
        return false;
      };
      const best = new Array(n + 1).fill(null);
      best[n] = [];
      for (let i = n - 1; i >= 0; i--) {
        for (const length of lengths) {
          if (i + length > n) break;
          const word = s.slice(i, i + length);
          const rest = best[i + length];
          if (rest === null || !words.has(word)) continue;
          const candidate = [word, ...rest];
          if (best[i] === null || better(candidate, best[i])) best[i] = candidate;
        }
      }
      return best[0] === null ? [] : best[0];
    }
tests:
  - {id: t1, args: ["orderlineitemtotal", ["order", "line", "item", "total", "lineitem", "orderline"]], expected: ["order", "lineitem", "total"], description: "Example 1 - three-word tie broken word by word"}
  - {id: t2, args: ["timestamp", ["time", "stamp", "times", "tamp", "timestamp"]], expected: ["timestamp"], description: "Example 2 - whole identifier is one word"}
  - {id: t3, args: ["pricexyz", ["price", "xy", "z1"]], expected: [], description: "Example 3 - no valid split"}
  - {id: t4, hidden: true, args: ["a", ["a"]], expected: ["a"], description: "Minimum size"}
  - {id: t5, hidden: true, args: ["statuscode", ["statusc", "status", "code"]], expected: ["status", "code"], description: "Greedy longest prefix reaches a dead end"}
  - {id: t6, hidden: true, args: ["customerid", ["customeri", "customer", "id", "d"]], expected: ["customer", "id"], description: "Tie between two two-word splits - prefix word is smaller"}
  - {id: t7, hidden: true, args: ["idididid", ["id", "idid", "i", "d", "id"]], expected: ["idid", "idid"], description: "Repeated words and a duplicate vocabulary entry"}
  - {id: t8, hidden: true, args: ["abcab", ["a", "b", "c", "ab", "bca", "cab"]], expected: ["ab", "cab"], description: "Fewest words beats lexicographic order of a longer split"}
  - {id: t9, hidden: true, args: ["userrolemap", ["us", "user", "errole", "role", "map", "rolemap", "erro", "lemap"]], expected: ["user", "rolemap"], description: "Three three-word splits lose to the only two-word split"}
  - {id: t10, hidden: true, args: ["", ["a", "aa", "aaa"]], expected: [], description: "Stress - exponential for unmemoised backtracking, no split exists"}
expected_concepts:
  - dynamic programming over suffixes (or prefixes) of the identifier
  - hash set lookup of candidate words, bounded by the maximum word length
  - optimal substructure for both the word count and the word-by-word ordering
  - memoisation to avoid exponential backtracking
  - deterministic tie-breaking
optimal_complexity: {time: O(n^2 * L), space: O(n^2)}
rubric:
  excellent: Defines the best split of each suffix, argues that the best split starting with a fixed first word extends the best split of the remaining suffix (for both the count and the word-by-word order), builds it bottom-up with a hash set and length bounds, and explains why greedy longest-match fails.
  good: Correct memoised DP that finds a fewest-word split, with the tie-break rule fixed after testing or reconstructed with some extra work.
  weak: Greedy longest (or shortest) prefix matching, unmemoised backtracking that times out, or ignoring the tie-break rule.
  criteria:
    correctness: All tests pass, including greedy traps, ties and impossible inputs.
    efficiency: Polynomial time; candidate words limited to the distinct word lengths or the maximum word length.
    code_quality: Clear state definition and a single comparison rule for candidate splits.
    edge_cases: Impossible split, single-word identifier, repeated words, duplicate vocabulary entries, words containing digits that never match.
    communication: States the recurrence and why processing suffixes makes the lexicographic tie-break easy.
hints:
  - Greedily taking the longest matching word first can lead to a dead end or to more words than necessary; think about solving smaller versions of the problem first.
  - Define the best split for every suffix of the identifier; the best split of a suffix starts with some vocabulary word, followed by the best split of what remains after it.
  - Work from the end of the string towards the start; for each position try every vocabulary word that matches there (looking words up in a set, trying only the lengths that occur in the vocabulary), combine it with the stored best split of the remaining suffix, and keep the candidate with fewer words or, with an equal count, the one that is smaller word by word; the answer is the stored split for position zero, or an empty list if none exists.
followups:
  - How would you choose between splits using word frequencies instead of the word count?
  - How would you return all fewest-word splits?
  - How would a trie over the vocabulary change the inner loop?
  - Why does processing suffixes make the word-by-word tie-break simpler than processing prefixes?
common_errors:
  - Greedy longest-prefix matching, which fails when the longest word leads to a dead end.
  - Plain recursion without memoisation, which is exponential on repetitive inputs.
  - Comparing the joined strings instead of the word lists when breaking ties.
  - Returning a split that is valid but not the one with the fewest words.
