expected_concepts:
  - "single-pass scanning with a cursor instead of building a full tree"
  - "skipping a value by tracking bracket depth while jumping over string literals"
  - "escape-aware string scanning"
  - "parsing the path into key and index steps"
  - "last-duplicate-wins lookup and explicit not-found handling"
optimal_complexity: {time: "O(n + p)", space: "O(p)"}
rubric:
  excellent: "Tokenises the path, walks the document with a cursor that skips whole values (depth counting, escape-aware strings), keeps scanning objects so the last duplicate wins, distinguishes every not-found case from an empty-string value, and compacts only whitespace outside strings in a single linear pass."
  good: "Builds a small recursive-descent parser or skipper that works on the tests, with minor slips around escapes, duplicates or type mismatches fixed after testing."
  weak: "Uses string searching for the key name (which matches inside nested objects or string values), strips all whitespace including inside strings, or re-formats numbers."
  criteria:
    correctness: "All tests pass, including duplicates, escapes inside strings, root arrays and empty-string values."
    efficiency: "Linear in the document size; no repeated re-scanning of the same text per step."
    code_quality: "Small helpers (skip whitespace, skip string, skip value) with clear cursor contracts."
    edge_cases: "Empty path, wrong-type steps, index one past the end, brackets inside strings and escaped quotes."
    communication: "Explains how strings are skipped safely and why searching for the key text is unsound."
hints:
  - "You never need the whole document as a tree: you only need to find where the selected value starts and ends in the text."
  - "Write a helper that, given the index where a value starts, returns the index just past it. Strings end at the first unescaped quote; objects and arrays end where the bracket depth returns to zero, as long as you jump over string literals while counting."
  - "Split the path into key and index steps. For a key step, walk the object's members one by one: read the key string, skip the colon, remember the value start if the key matches (keep going so the last duplicate wins) and skip the value. For an index step, skip that many elements. Finally copy the selected value, dropping whitespace outside string literals and copying strings unchanged."
followups:
  - "How would you support quoted keys in the path, such as keys that contain dots or brackets?"
  - "How would you stream a multi-gigabyte document without loading it into memory?"
  - "How would you add a wildcard step that returns the values of every array element?"
  - "What would change if the document could be invalid and you had to report the first error position?"
common_errors:
  - "Searching for the quoted key text anywhere in the document, which can hit a nested object or a string value."
  - "Counting brackets that appear inside string literals."
  - "Treating an escaped quote as the end of a string."
  - "Returning the first duplicate key instead of the last."
  - "Removing spaces inside strings or normalising numbers while compacting."
