slug: json_path_value_extract
title: JSON Path Value Extract
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [backend, fullstack, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## JSON Path Value Extract

  A deployment pipeline needs to read single values out of service manifests on a minimal runner that has
  **no JSON library**. Given a valid JSON document `doc` and a `path`, return the value the path points to.

  **Paths.** A path is a sequence of steps:
  - a **key step** is a name made of `[A-Za-z0-9_]` characters; it is written first or after a `.`
    (for example `meta.owner`) and selects a member of an object;
  - an **index step** is `[k]` with a non-negative decimal integer `k` (no leading zeros) and selects the
    `k`-th element (0-based) of an array, for example `services[2].ports[0]` or `[1].name`;
  - an **empty path** selects the whole document.

  **Lookup rules.**
  - If an object contains the same key more than once, the **last** occurrence wins.
  - Object keys in `doc` never contain backslashes, so a key matches a step when its characters are equal.
  - If any step names a missing key or an index past the end, or applies a key step to a value that is not an
    object or an index step to a value that is not an array, return the empty string `""`.

  **Output.** Return the selected value in **compact form**: its exact source text with every whitespace
  character (space, tab, newline, carriage return) that lies **outside** string literals removed. Strings
  (including their quotes and escape sequences) and numbers are copied exactly as written, so `1.50E+3` stays
  `1.50E+3` and `"\u0041"` stays `"\u0041"`. Because a selected string keeps its quotes, an empty string
  value comes back as a two-character result (two quote marks), which differs from the zero-length not-found
  result.

  The examples write `doc`, `path` and the result in JSON string notation, so a quote inside them appears
  as `\"`.

  ### Example 1
  ```
  Input:  doc = "{\"service\": \"api\", \"ports\": [80, 443], \"meta\": {\"owner\": \"team-a\", \"tier\": 2}}", path = "ports[1]"
  Output: "443"
  Explanation: The value is the number 443, returned as its source text.
  ```

  ### Example 2
  ```
  Input:  doc = "{\"service\": \"api\", \"ports\": [80, 443], \"meta\": {\"owner\": \"team-a\", \"tier\": 2}}", path = "meta"
  Output: "{\"owner\":\"team-a\",\"tier\":2}"
  Explanation: Whitespace outside strings is removed; the strings themselves are copied as written.
  ```

  ### Example 3
  ```
  Input:  doc = "{\"service\": \"api\", \"ports\": [80, 443], \"meta\": {\"owner\": \"team-a\", \"tier\": 2}}", path = "meta.region"
  Output: ""
  Explanation: `meta` has no `region` key, so the result is the empty string.
  ```

  ### Constraints
  - `1 <= doc.length <= 10^5`; `doc` is valid JSON (RFC 8259) and its nesting depth is at most `500`.
  - `0 <= path.length <= 200`, and `path` follows the grammar above.
languages: [python, javascript, typescript, java, go, cpp]
