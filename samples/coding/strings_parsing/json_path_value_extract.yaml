reference_solutions:
  python: |
    def json_path_extract(doc: str, path: str) -> str:
        n = len(doc)
        blank = " \t\n\r"

        def skip_ws(i: int) -> int:
            while i < n and doc[i] in blank:
                i += 1
            return i

        def skip_string(i: int) -> int:
            """doc[i] is an opening quote; return the index just past the closing quote."""
            i += 1
            while doc[i] != '"':
                i += 2 if doc[i] == "\\" else 1
            return i + 1

        def skip_value(i: int) -> int:
            """doc[i] starts a value; return the index just past it."""
            if doc[i] == '"':
                return skip_string(i)
            if doc[i] in "{[":
                depth = 0
                while True:
                    c = doc[i]
                    if c == '"':
                        i = skip_string(i)
                        continue
                    if c in "{[":
                        depth += 1
                    elif c in "}]":
                        depth -= 1
                        if depth == 0:
                            return i + 1
                    i += 1
            while i < n and doc[i] not in ",}]" + blank:
                i += 1
            return i

        steps: list[object] = []
        i = 0
        while i < len(path):
            if path[i] == "[":
                j = path.index("]", i)
                steps.append(int(path[i + 1:j]))
                i = j + 1
            elif path[i] == ".":
                i += 1
            else:
                j = i
                while j < len(path) and path[j] not in ".[":
                    j += 1
                steps.append(path[i:j])
                i = j

        pos = skip_ws(0)
        for step in steps:
            found = -1
            if isinstance(step, str):
                if doc[pos] != "{":
                    return ""
                i = skip_ws(pos + 1)
                while doc[i] != "}":
                    key_end = skip_string(i)
                    key = doc[i + 1:key_end - 1]
                    i = skip_ws(skip_ws(key_end) + 1)  # past the colon
                    if key == step:
                        found = i  # keep scanning: the last duplicate wins
                    i = skip_ws(skip_value(i))
                    if doc[i] == ",":
                        i = skip_ws(i + 1)
            else:
                if doc[pos] != "[":
                    return ""
                i = skip_ws(pos + 1)
                index = 0
                while doc[i] != "]":
                    if index == step:
                        found = i
                        break
                    i = skip_ws(skip_value(i))
                    if doc[i] == ",":
                        i = skip_ws(i + 1)
                    index += 1
            if found < 0:
                return ""
            pos = found

        end = skip_value(pos)
        out: list[str] = []
        i = pos
        while i < end:
            if doc[i] == '"':
                j = skip_string(i)
                out.append(doc[i:j])
                i = j
            else:
                if doc[i] not in blank:
                    out.append(doc[i])
                i += 1
        return "".join(out)
  javascript: |
    function jsonPathExtract(doc, path) {
      const n = doc.length;
      const isBlank = (c) => c === " " || c === "\t" || c === "\n" || c === "\r";
      const skipWs = (i) => {
        while (i < n && isBlank(doc[i])) i++;
        return i;
      };
      const skipString = (i) => {
        i++;
        while (doc[i] !== '"') i += doc[i] === "\\" ? 2 : 1;
        return i + 1;
      };
      const skipValue = (i) => {
        if (doc[i] === '"') return skipString(i);
        if (doc[i] === "{" || doc[i] === "[") {
          let depth = 0;
          for (;;) {
            const c = doc[i];
            if (c === '"') { i = skipString(i); continue; }
            if (c === "{" || c === "[") depth++;
            else if (c === "}" || c === "]") {
              depth--;
              if (depth === 0) return i + 1;
            }
            i++;
          }
        }
        while (i < n && !",}]".includes(doc[i]) && !isBlank(doc[i])) i++;
        return i;
      };

      const steps = [];
      for (let i = 0; i < path.length; ) {
        if (path[i] === "[") {
          const j = path.indexOf("]", i);
          steps.push(Number(path.slice(i + 1, j)));
          i = j + 1;
        } else if (path[i] === ".") {
          i++;
        } else {
          let j = i;
          while (j < path.length && path[j] !== "." && path[j] !== "[") j++;
          steps.push(path.slice(i, j));
          i = j;
        }
      }

      let pos = skipWs(0);
      for (const step of steps) {
        let found = -1;
        if (typeof step === "string") {
          if (doc[pos] !== "{") return "";
          let i = skipWs(pos + 1);
          while (doc[i] !== "}") {
            const keyEnd = skipString(i);
            const key = doc.slice(i + 1, keyEnd - 1);
            i = skipWs(skipWs(keyEnd) + 1);
            if (key === step) found = i;
            i = skipWs(skipValue(i));
            if (doc[i] === ",") i = skipWs(i + 1);
          }
        } else {
          if (doc[pos] !== "[") return "";
          let i = skipWs(pos + 1);
          let index = 0;
          while (doc[i] !== "]") {
            if (index === step) { found = i; break; }
            i = skipWs(skipValue(i));
            if (doc[i] === ",") i = skipWs(i + 1);
            index++;
          }
        }
        if (found < 0) return "";
        pos = found;
      }

      const end = skipValue(pos);
      let out = "";
      for (let i = pos; i < end; ) {
        if (doc[i] === '"') {
          const j = skipString(i);
          out += doc.slice(i, j);
          i = j;
        } else {
          if (!isBlank(doc[i])) out += doc[i];
          i++;
        }
      }
      return out;
    }
