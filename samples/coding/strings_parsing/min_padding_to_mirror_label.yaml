version: 1
slug: min_padding_to_mirror_label
title: Minimum Padding to a Mirror Label
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Minimum Padding to a Mirror Label

  A warehouse labelling system prints identifiers on both faces of a transparent tag, so the identifier
  must read the same forwards and backwards (a **mirror label**). Existing identifiers cannot be
  rewritten, but the printer is allowed to **append** characters to the **end** of an identifier.

  Given an identifier `s`, return the **minimum number of characters** that must be appended to the end
  of `s` so that the result reads the same forwards and backwards. Return `0` when `s` already does,
  including when `s` is empty.

  ### Example 1
  ```
  Input:  s = "abcb"
  Output: 1
  Explanation: append "a" to get "abcba"
  ```

  ### Example 2
  ```
  Input:  s = "lab"
  Output: 2
  Explanation: append "al" to get "labal"
  ```

  ### Example 3
  ```
  Input:  s = "noon"
  Output: 0
  ```

  ### Constraints
  - `0 <= s.length <= 10^5`
  - `s` contains lowercase letters, digits, `-`, `.` and `_`
  - Aim for better than `O(n^2)` time; checking every suffix directly is too slow at the upper bound.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_padding_to_mirror
  params:
    - {name: s, type: string}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_padding_to_mirror(s: str) -> int:
        n = len(s)
        if n == 0:
            return 0
        combined = s[::-1] + "#" + s
        prefix = [0] * len(combined)
        for i in range(1, len(combined)):
            k = prefix[i - 1]
            while k > 0 and combined[i] != combined[k]:
                k = prefix[k - 1]
            if combined[i] == combined[k]:
                k += 1
            prefix[i] = k
        return n - prefix[-1]
  javascript: |
    function minPaddingToMirror(s) {
      const n = s.length;
      if (n === 0) return 0;
      const combined = s.split("").reverse().join("") + "#" + s;
      const prefix = new Array(combined.length).fill(0);
      for (let i = 1; i < combined.length; i++) {
        let k = prefix[i - 1];
        while (k > 0 && combined[i] !== combined[k]) k = prefix[k - 1];
        if (combined[i] === combined[k]) k += 1;
        prefix[i] = k;
      }
      return n - prefix[combined.length - 1];
    }
tests:
  - {id: t1, args: ["abcb"], expected: 1, description: "Example 1 - palindromic suffix bcb, append one character"}
  - {id: t2, args: ["lab"], expected: 2, description: "Example 2 - only the last character is a palindromic suffix"}
  - {id: t3, args: ["noon"], expected: 0, description: "Example 3 - already a mirror label"}
  - {id: t4, hidden: true, args: [""], expected: 0, description: "Empty label needs no padding"}
  - {id: t5, hidden: true, args: ["x"], expected: 0, description: "Single character"}
  - {id: t6, hidden: true, args: ["ab"], expected: 1, description: "Two distinct characters"}
  - {id: t7, hidden: true, args: ["aacecaaa"], expected: 5, description: "Palindromic prefix exists but only the suffix matters (prefix-padding confusion)"}
  - {id: t8, hidden: true, args: ["rack-01-kcar-x"], expected: 13, description: "Hyphens and digits; long palindrome not at the end"}
  - {id: t9, hidden: true, args: ["abababab"], expected: 1, description: "Overlapping periodic structure stresses the failure links"}
  - {id: t10, hidden: true, args: ["node.1.edonz9zz"], expected: 13, description: "Palindromic suffix of length two after a long inner palindrome"}
  - {id: t11, hidden: true, args: [""], expected: 1, description: "Stress - 1000 characters with a long run of a; quadratic suffix checks are slow"}
expected_concepts:
  - "reduction to the longest palindromic suffix"
  - "prefix function (KMP failure function) or Z-function"
  - "matching a string against its reverse with a separator"
  - "linear time versus quadratic suffix checks"
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Shows that the answer is the length minus the longest palindromic suffix, builds the reverse plus separator plus original string, computes the prefix function (or Z-function, Manacher or rolling hash with justification) in linear time, and explains why the separator is needed."
  good: "Finds the palindromic-suffix reduction and implements a correct quadratic check, then moves toward a linear method with hints."
  weak: "Tries to insert characters elsewhere, pads to the front instead of the back, or cannot connect the problem to palindromic suffixes."
  criteria:
    correctness: "All tests pass, including the empty string, single characters and strings that are already mirrors."
    efficiency: "Linear time; a quadratic solution is acknowledged as too slow for 10^5 characters."
    code_quality: "Prefix-function code with clear names and no off-by-one around the separator."
    edge_cases: "Empty input, length one, periodic strings and long runs of one character."
    communication: "Explains why the appended characters must mirror exactly the part before the palindromic suffix."
hints:
  - "Whatever you append has to mirror some leading part of the identifier. Which part of the original can be left in the middle without a partner?"
  - "The answer is the length of the string minus the length of its longest suffix that is itself a mirror. Checking every suffix one by one is quadratic, so look for a string-matching tool that finds the longest overlap between the string and its reverse."
  - "Concatenate the reversed string, a separator character that never appears in the input, and the original string. Compute the prefix function of that combined string; its final value is the length of the longest mirrored suffix, and subtracting it from the original length gives the answer."
followups:
  - "How would the answer change if you could only prepend characters to the front?"
  - "Could a rolling hash solve this, and what is the risk?"
  - "How would you also return the shortest padded label itself?"
  - "What does Manacher's algorithm offer here compared with the prefix function?"
common_errors:
  - "Finding the longest palindromic prefix instead of suffix."
  - "Omitting the separator, which lets the match run past the reversed half."
  - "Checking every suffix with a full palindrome test, which is quadratic."
  - "Returning a non-zero value for an empty string or a single character."
