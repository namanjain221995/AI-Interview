version: 1
slug: heartbeat_signal_period
title: "Heartbeat Signal Period"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Heartbeat Signal Period

  A monitoring probe samples a service's heartbeat line and records one character per sample (for
  example `H` for high and `L` for low). To detect drift, the probe needs the **period** of a recording:
  the smallest positive length `p` such that the recording is exactly its first `p` characters repeated
  `signal.length / p` times, with nothing left over.

  Write `heartbeat_period(signal)` that returns `p`. If the recording is not a whole number of repetitions
  of any shorter block, its period is its full length.

  ### Example 1
  ```
  Input:  signal = "HLLHLLHLL"
  Output: 3
  Explanation: HLL repeated 3 times.
  ```

  ### Example 2
  ```
  Input:  signal = "HLHLH"
  Output: 5
  Explanation: HL repeats but 5 is not a multiple of 2, so no shorter block tiles the whole recording.
  ```

  ### Example 3
  ```
  Input:  signal = "aaaa"
  Output: 1
  ```

  ### Constraints
  - `1 <= signal.length <= 10^5`
  - `signal` consists of printable ASCII characters.

  **Follow-up:** can you find the period in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: heartbeat_period
  params:
    - {name: signal, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def heartbeat_period(signal: str) -> int:
        n = len(signal)
        # failure[i]: length of the longest proper prefix of signal[:i + 1] that is also its suffix.
        failure = [0] * n
        k = 0
        for i in range(1, n):
            while k > 0 and signal[i] != signal[k]:
                k = failure[k - 1]
            if signal[i] == signal[k]:
                k += 1
            failure[i] = k
        p = n - failure[n - 1]
        return p if n % p == 0 else n
  javascript: |
    function heartbeatPeriod(signal) {
      const n = signal.length;
      const failure = new Array(n).fill(0);
      let k = 0;
      for (let i = 1; i < n; i++) {
        while (k > 0 && signal[i] !== signal[k]) k = failure[k - 1];
        if (signal[i] === signal[k]) k++;
        failure[i] = k;
      }
      const p = n - failure[n - 1];
      return n % p === 0 ? p : n;
    }
tests:
  - {id: t1, args: ["HLLHLLHLL"], expected: 3, description: "Example 1 - block of 3 repeated three times"}
  - {id: t2, args: ["HLHLH"], expected: 5, description: "Example 2 - partial repetition does not count"}
  - {id: t3, args: ["aaaa"], expected: 1, description: "Example 3 - single character repeated"}
  - {id: t4, hidden: true, args: ["x"], expected: 1, description: "Single character"}
  - {id: t5, hidden: true, args: ["xy"], expected: 2, description: "Two different characters"}
  - {id: t6, hidden: true, args: ["abaaba"], expected: 3, description: "Period is half the length"}
  - {id: t7, hidden: true, args: ["abababa"], expected: 7, description: "Border exists but length is not a multiple - full length"}
  - {id: t8, hidden: true, args: ["abcabcabd"], expected: 9, description: "Near miss at the last character"}
  - {id: t9, hidden: true, args: ["aaaaaaa"], expected: 1, description: "Prime length, all equal - period 1"}
  - {id: t10, hidden: true, args: ["abcababcab"], expected: 5, description: "Block with an internal border repeated twice"}
  - {id: t11, hidden: true, args: [""], expected: 1000, description: "Stress - 1000 characters, almost periodic but not tiled"}
  - {id: t12, hidden: true, args: ["LHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLHLHHLHLLH"], expected: 8, description: "160 characters with period 8"}
expected_concepts:
  - "only divisors of the length can be periods"
  - "checking a candidate block in O(n)"
  - "prefix function / longest border (KMP failure function)"
  - "doubled-string search as an alternative"
  - "O(n) optimal versus O(n * d(n)) divisor scan"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Starts with the divisor scan, then derives the O(n) solution via the longest border (prefix function) or a doubled-string search, explains why n minus the border is the period only when it divides n, and handles single characters."
  good: "Implements the divisor-based scan correctly with early exits and analyses its cost; can discuss a linear approach when prompted."
  weak: "Tries every length including non-divisors without a final check, returns the first repeated character distance, or misses the leftover-characters rule."
  criteria:
    correctness: "All tests pass, including partial repetitions, near misses and single characters."
    efficiency: "Linear time for the follow-up; the divisor scan is acceptable for the base problem."
    code_quality: "Small helper or clear loop for the candidate check; meaningful names for the border array."
    edge_cases: "Length 1, all-equal strings, lengths that are prime and strings that almost repeat."
    communication: "Explains why only divisors of the length are candidates and how the border relates to the period."
hints:
  - "A block can only tile the whole recording if its length divides the recording's length exactly."
  - "Try candidate lengths from smallest to largest among the divisors of the length and check whether every character equals the character one block earlier; for a linear solution, think about the longest prefix that is also a suffix."
  - "Compute the prefix function (longest proper prefix that is also a suffix for each position) in one pass; with border length b for the whole string, the candidate period is the length minus b, and it is the answer only when it divides the length, otherwise the answer is the full length."
followups:
  - "How would you find the period if a small number of samples may be corrupted?"
  - "How would you maintain the period as new samples are appended in real time?"
  - "How does the doubled-string trick (search for the signal inside itself concatenated twice) relate to this problem?"
common_errors:
  - "Accepting a block length that does not divide the total length."
  - "Returning the distance to the first repeat of the first character."
  - "Using the longest border directly without checking divisibility."
  - "Off-by-one errors in the prefix-function loop when the string has length 1."
