expected_concepts:
  - "single left-to-right scan with explicit state"
  - "nesting depth counter for (), [] and {}"
  - "quote state machine with backslash escapes"
  - "splitting only at depth zero outside strings"
  - "trimming and keeping empty pieces"
optimal_complexity: {time: "O(n)", space: "O(n) for the output"}
rubric:
  excellent: "Designs a single-pass scanner with explicit quote, escape and depth state, explains why a regular expression or naive split fails, handles escapes correctly (including an escaped backslash before a closing quote), keeps empty pieces, and returns an empty list for blank input."
  good: "Correct depth tracking and quotes, with a missed escape case or empty-piece rule fixed after testing."
  weak: "Splits on every comma, ignores quotes or escapes, tracks only one bracket type, or drops empty pieces."
  criteria:
    correctness: "All tests pass, including escaped quotes, escaped backslashes and brackets inside strings."
    efficiency: "One linear pass; no repeated substring rebuilding that becomes quadratic."
    code_quality: "State variables are named clearly and each character is handled by one branch of a small state machine."
    edge_cases: "Empty and blank input, trailing and repeated commas, quotes of the other kind inside strings, backslashes outside strings."
    communication: "Explains the states before coding and walks through an escaped-quote example."
hints:
  - "A plain split on commas fails because some commas are inside brackets or strings. What do you need to know at each comma to decide whether it separates arguments?"
  - "Scan the text once, character by character, keeping a counter of open brackets and a note of whether you are inside a string and which quote opened it. Inside a string, ignore brackets and commas, and remember that a backslash makes the next character ordinary."
  - "Keep four pieces of state: the current piece being built, the bracket depth, the open quote character (or none) and whether the previous character inside the string was an escaping backslash. Outside strings, opening brackets raise the depth and closing brackets lower it; a comma at depth zero finishes the current piece. At the end, add the last piece, trim spaces and tabs from every piece, and return an empty list if the whole input was blank."
followups:
  - "How would you report a helpful error with a position if the brackets were unbalanced?"
  - "How would you extend the scanner to support comments that run to the end of a line?"
  - "Why is a regular expression a poor fit for nested brackets?"
  - "How would you turn the split pieces into a typed syntax tree?"
common_errors:
  - "Splitting on every comma, including those inside brackets or strings."
  - "Treating an escaped quote as the end of the string."
  - "Treating an escaped backslash followed by a quote as an escaped quote."
  - "Counting brackets that appear inside strings."
  - "Dropping empty pieces or returning a list with one empty string for blank input."
