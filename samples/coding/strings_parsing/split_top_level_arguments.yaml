version: 1
slug: split_top_level_arguments
title: "Split Top-Level Arguments"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [backend, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Split Top-Level Arguments

  A deployment tool reads pipeline steps written in a small configuration language, for example
  `notify(team, ['ops', 'sre'], {"level": "warn, page"})`. Before each argument can be parsed on its
  own, the tool must split the text **between the outer parentheses** into its top-level arguments.

  Given that text `args`, split it at every comma that is a **top-level separator**, meaning a comma
  that is:

  - not nested inside any pair of `()`, `[]` or `{}`, and
  - not inside a quoted string. A string starts with `'` or `"` and ends at the next **unescaped**
    occurrence of the same quote character. Inside a string, a backslash `\` escapes the character
    that follows it (so `\'`, `\"` and `\\` do not end the string). Brackets and commas inside strings
    are ordinary characters.

  Remove leading and trailing spaces and tabs from each piece, but otherwise return each piece
  **exactly** as written (quotes and backslashes included), in order. Empty pieces are kept as empty
  strings, so `"a,,b"` gives `["a", "", "b"]`. If `args` is empty or contains only spaces and tabs,
  return an empty list.

  The examples write inputs and outputs as double-quoted string literals, so `\"` in them stands for
  one double-quote character and `\\` for one backslash.

  ### Example 1
  ```
  Input:  args = "region, 3, true"
  Output: ["region", "3", "true"]
  ```

  ### Example 2
  ```
  Input:  args = "team, ['ops', 'sre'], {\"level\": \"warn, page\"}"
  Output: ["team", "['ops', 'sre']", "{\"level\": \"warn, page\"}"]
  Explanation: The comma inside the quoted string and the commas inside the brackets do not split.
  ```

  ### Example 3
  ```
  Input:  args = "'it\\'s, fine', retries(2, 5)"
  Output: ["'it\\'s, fine'", "retries(2, 5)"]
  Explanation: The raw text is 'it\'s, fine', retries(2, 5). The escaped quote does not close the
  string, so the comma after "it's" is still inside it.
  ```

  ### Constraints
  - `0 <= args.length <= 10^4`
  - `args` contains printable ASCII characters, spaces and tabs (no line breaks).
  - Outside strings, brackets are balanced and correctly nested; every string is closed, and a backslash
    inside a string is always followed by another character.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: split_top_level_args
  params:
    - {name: args, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def split_top_level_args(args: str) -> list[str]:
        if args.strip(" \t") == "":
            return []
        pieces: list[str] = []
        current: list[str] = []
        depth = 0
        quote = ""          # the open quote character, or "" outside strings
        escaped = False     # previous character was a backslash inside a string
        for ch in args:
            if quote:
                if escaped:
                    escaped = False
                elif ch == "\\":
                    escaped = True
                elif ch == quote:
                    quote = ""
            elif ch in "'\"":
                quote = ch
            elif ch in "([{":
                depth += 1
            elif ch in ")]}":
                depth -= 1
            elif ch == "," and depth == 0:
                pieces.append("".join(current).strip(" \t"))
                current = []
                continue
            current.append(ch)
        pieces.append("".join(current).strip(" \t"))
        return pieces
  javascript: |
    function splitTopLevelArgs(args) {
      const trim = (s) => s.replace(/^[ \t]+|[ \t]+$/g, "");
      if (trim(args) === "") return [];
      const pieces = [];
      let current = "";
      let depth = 0;
      let quote = "";
      let escaped = false;
      for (const ch of args) {
        if (quote) {
          if (escaped) escaped = false;
          else if (ch === "\\") escaped = true;
          else if (ch === quote) quote = "";
        } else if (ch === "'" || ch === '"') {
          quote = ch;
        } else if ("([{".includes(ch)) {
          depth++;
        } else if (")]}".includes(ch)) {
          depth--;
        } else if (ch === "," && depth === 0) {
          pieces.push(trim(current));
          current = "";
          continue;
        }
        current += ch;
      }
      pieces.push(trim(current));
      return pieces;
    }
