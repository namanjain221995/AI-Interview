version: 1
slug: validate_iso_calendar_date
title: "Validate an ISO Calendar Date"
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [backend, data, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Validate an ISO Calendar Date

  A nightly import job reads shipment records from partner CSV files. The `ship_date` column must be a
  calendar date in strict `YYYY-MM-DD` form, and anything else is sent back to the partner. A string `s`
  is **valid** when:

  1. It is exactly 10 characters long, with `-` at positions 4 and 7 (0-based) and ASCII digits `0`-`9`
     everywhere else. No signs, spaces or other separators are allowed.
  2. The year `YYYY` is between `0001` and `9999`.
  3. The month `MM` is between `01` and `12`.
  4. The day `DD` is between `01` and the number of days in that month. February has 29 days in a leap
     year and 28 otherwise. A year is a leap year when it is divisible by 4, **except** years divisible by
     100, which are leap years only when they are also divisible by 400.

  Write `is_valid_iso_date(s)` that returns `true` for a valid date and `false` otherwise. Do not use a
  date library; implement the rules yourself.

  ### Example 1
  ```
  Input:  s = "2024-02-29"
  Output: true
  Explanation: 2024 is divisible by 4 and not by 100, so February has 29 days.
  ```

  ### Example 2
  ```
  Input:  s = "2023-02-29"
  Output: false
  Explanation: 2023 is not a leap year.
  ```

  ### Example 3
  ```
  Input:  s = "2024-04-31"
  Output: false
  ```

  ### Constraints
  - `0 <= s.length <= 50`
  - `s` consists of printable ASCII characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_valid_iso_date
  params:
    - {name: s, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_valid_iso_date(s: str) -> bool:
        if len(s) != 10 or s[4] != "-" or s[7] != "-":
            return False
        for i, ch in enumerate(s):
            if i not in (4, 7) and not ("0" <= ch <= "9"):
                return False
        year, month, day = int(s[0:4]), int(s[5:7]), int(s[8:10])
        if year < 1 or not 1 <= month <= 12:
            return False
        leap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
        days_in_month = [31, 29 if leap else 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]
        return 1 <= day <= days_in_month[month - 1]
  javascript: |
    function isValidIsoDate(s) {
      if (s.length !== 10 || s[4] !== "-" || s[7] !== "-") return false;
      for (let i = 0; i < s.length; i++) {
        if (i === 4 || i === 7) continue;
        if (s[i] < "0" || s[i] > "9") return false;
      }
      const year = Number(s.slice(0, 4));
      const month = Number(s.slice(5, 7));
      const day = Number(s.slice(8, 10));
      if (year < 1 || month < 1 || month > 12) return false;
      const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
      const daysInMonth = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      return day >= 1 && day <= daysInMonth[month - 1];
    }
tests:
  - {id: t1, args: ["2024-02-29"], expected: true, description: "Example 1 - leap day in a leap year"}
  - {id: t2, args: ["2023-02-29"], expected: false, description: "Example 2 - leap day in a common year"}
  - {id: t3, args: ["2024-04-31"], expected: false, description: "Example 3 - April has 30 days"}
  - {id: t4, hidden: true, args: ["1900-02-29"], expected: false, description: "Century not divisible by 400 is not a leap year"}
  - {id: t5, hidden: true, args: ["2000-02-29"], expected: true, description: "Century divisible by 400 is a leap year"}
  - {id: t6, hidden: true, args: ["0000-01-01"], expected: false, description: "Year zero is out of range"}
  - {id: t7, hidden: true, args: ["0001-01-01"], expected: true, description: "Smallest valid date"}
  - {id: t8, hidden: true, args: ["9999-12-31"], expected: true, description: "Largest valid date"}
  - {id: t9, hidden: true, args: ["2024-1-05"], expected: false, description: "Single-digit month - wrong length and layout"}
  - {id: t10, hidden: true, args: ["2024-13-01"], expected: false, description: "Month 13"}
  - {id: t11, hidden: true, args: ["2024-06-00"], expected: false, description: "Day zero"}
  - {id: t12, hidden: true, args: ["+024-01-01"], expected: false, description: "Sign character in the year"}
  - {id: t13, hidden: true, args: [" 2024-01-01"], expected: false, description: "Leading space makes it 11 characters"}
expected_concepts:
  - "validate the layout before parsing numbers"
  - "Gregorian leap-year rule with century exceptions"
  - "table of days per month"
  - "explicit ASCII digit checks"
  - "O(1) time and space"
optimal_complexity: {time: "O(1)", space: "O(1)"}
rubric:
  excellent: "Checks length, separators and ASCII digits before parsing, applies the full leap-year rule including the 400-year exception, uses a days-per-month table, rejects year zero and explains each rule with a test case."
  good: "Correct validation with a small slip (for example year zero or the 1900 case) fixed after a hint."
  weak: "Relies on a lenient parser that accepts signs or single digits, uses only the divisible-by-4 rule, or checks the day against 31 for every month."
  criteria:
    correctness: "All tests pass, including century leap years, year zero and malformed layouts."
    efficiency: "Constant work per input; no loops over dates or calendar libraries."
    code_quality: "Layout check, range checks and leap-year rule are separate and readable; days table defined once."
    edge_cases: "Year boundaries, century years, months 0 and 13, day 0, signs and extra whitespace."
    communication: "Walks through the leap-year rule with concrete years and explains why a library is not used."
hints:
  - "Make sure the string has the right shape before you try to turn any part of it into a number."
  - "Once the layout is confirmed, the month decides the maximum day, and only February depends on the year through the leap-year rule."
  - "Check the length, the two dashes at positions four and seven and that every other character is an ASCII digit; then parse year, month and day, reject year zero and months outside one to twelve, decide leap years with the divisible-by-four rule and its century exception, and compare the day against a table of month lengths."
followups:
  - "How would you also accept an optional time part such as T14:30:00Z?"
  - "How would you compute the day of the week for a valid date?"
  - "Why can lenient library parsers be dangerous for an import pipeline?"
common_errors:
  - "Treating every year divisible by 4 as a leap year, which accepts 1900-02-29."
  - "Using a lenient integer parser that accepts signs or whitespace such as +024."
  - "Accepting year 0000."
  - "Checking the day against 31 for every month."
