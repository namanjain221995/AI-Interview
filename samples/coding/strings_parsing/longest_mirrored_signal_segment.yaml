version: 1
slug: longest_mirrored_signal_segment
title: Longest Noisy Mirrored Signal Segment
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, data, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Longest Noisy Mirrored Signal Segment

  A vibration sensor encodes each reading as one character, and a symmetric burst (a stretch that looks
  the same played forwards and backwards) is an early sign of a bearing fault. The sensor is noisy, so a
  burst still counts when a few readings were garbled.

  For a segment `signal[l..r]`, pair up the characters at mirrored positions: `signal[l]` with
  `signal[r]`, `signal[l + 1]` with `signal[r - 1]`, and so on. In an odd-length segment the middle
  character has no partner. The segment is **near-mirrored** when at most `max_mismatches` of these pairs
  hold two different characters.

  Write `longest_mirrored_segment(signal, max_mismatches)` that returns the longest near-mirrored
  **contiguous** segment of `signal`.

  - If several segments have the maximum length, return the one that **starts earliest**.
  - Any single character is near-mirrored; return `""` only when `signal` is empty.

  ### Example 1
  ```
  Input:  signal = "xabcbay", max_mismatches = 0
  Output: "abcba"
  ```

  ### Example 2
  ```
  Input:  signal = "mlevxlz", max_mismatches = 1
  Output: "levxl"
  Explanation: Its pairs are (l, l) and (e, x); only one pair differs and 'v' is the unpaired middle.
  ```

  ### Example 3
  ```
  Input:  signal = "abcd", max_mismatches = 1
  Output: "abc"
  Explanation: "abcd" has two differing pairs; "abc" and "bcd" both qualify and "abc" starts earlier.
  ```

  ### Constraints
  - `0 <= signal.length <= 3000`
  - `0 <= max_mismatches <= 3000`
  - `signal` consists of lowercase English letters and digits.

  **Follow-up:** checking every segment from scratch is `O(n^3)`. Can you reach `O(n^2)` time with `O(1)`
  extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_mirrored_segment
  params:
    - {name: signal, type: "string"}
    - {name: max_mismatches, type: int}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def longest_mirrored_segment(signal: str, max_mismatches: int) -> str:
        n = len(signal)
        best_start, best_len = 0, 0
        for center in range(2 * n - 1):
            lo, hi = center // 2, (center + 1) // 2
            mismatches = 0
            # Expand while the next pair still fits the mismatch budget.
            while lo >= 0 and hi < n:
                if signal[lo] != signal[hi]:
                    if mismatches == max_mismatches:
                        break
                    mismatches += 1
                lo -= 1
                hi += 1
            start, length = lo + 1, hi - lo - 1
            if length > best_len or (length == best_len and start < best_start):
                best_start, best_len = start, length
        return signal[best_start:best_start + best_len]
  javascript: |
    function longestMirroredSegment(signal, maxMismatches) {
      const n = signal.length;
      let bestStart = 0;
      let bestLen = 0;
      for (let center = 0; center < 2 * n - 1; center++) {
        let lo = Math.floor(center / 2);
        let hi = Math.floor((center + 1) / 2);
        let mismatches = 0;
        while (lo >= 0 && hi < n) {
          if (signal[lo] !== signal[hi]) {
            if (mismatches === maxMismatches) break;
            mismatches++;
          }
          lo--;
          hi++;
        }
        const start = lo + 1;
        const length = hi - lo - 1;
        if (length > bestLen || (length === bestLen && start < bestStart)) {
          bestStart = start;
          bestLen = length;
        }
      }
      return signal.slice(bestStart, bestStart + bestLen);
    }
tests:
  - {id: t1, args: ["xabcbay", 0], expected: "abcba", description: "Example 1 - exact mirror, odd length"}
  - {id: t2, args: ["mlevxlz", 1], expected: "levxl", description: "Example 2 - one differing pair allowed"}
  - {id: t3, args: ["abcd", 1], expected: "abc", description: "Example 3 - tie between two segments broken by earliest start"}
  - {id: t4, hidden: true, args: ["", 2], expected: "", description: "Empty signal returns the empty string"}
  - {id: t5, hidden: true, args: ["7", 0], expected: "7", description: "Single character"}
  - {id: t6, hidden: true, args: ["ab12", 0], expected: "a", description: "No exact mirror longer than one character - earliest single character"}
  - {id: t7, hidden: true, args: ["xyabbaqrrq", 0], expected: "abba", description: "Even-length tie broken by earliest start"}
  - {id: t8, hidden: true, args: ["abcdef", 10], expected: "abcdef", description: "Budget larger than needed - whole signal"}
  - {id: t9, hidden: true, args: ["aaaa", 0], expected: "aaaa", description: "All characters identical"}
  - {id: t10, hidden: true, args: ["zzabcxbazz", 1], expected: "zzabcxbazz", description: "Middle mismatch absorbed by the budget makes a long even segment"}
  - {id: t11, hidden: true, args: ["q9w8e7r6t5", 2], expected: "q9w8e", description: "Budget exactly used up by an odd-length segment"}
  - {id: t12, hidden: true, args: ["", 3], expected: "aabbbabbbabbbbaaaaabaabbaabbaabaaaaabbababababbbba", description: "Stress - 1000 random characters over a two-letter alphabet with budget 3"}
expected_concepts:
  - expanding outward from each of the 2n - 1 centres (characters and gaps between them)
  - a mismatch budget that only grows as a segment widens, so each centre's widest valid segment is found by one expansion
  - odd and even length segments
  - explicit tie-breaking by earliest start
  - O(n^2) time with O(1) extra space versus O(n^3) brute force
optimal_complexity: {time: O(n^2), space: O(1)}
rubric:
  excellent: Explains that widening a segment around a fixed centre can only add mismatched pairs, so expanding from all 2n - 1 centres until the budget is exceeded finds every candidate; handles odd and even lengths, the earliest-start tie and the empty input, and states O(n^2) time and O(1) space.
  good: Correct centre-expansion or DP solution with a small fix after testing (even-length centres, the tie rule or the budget boundary), or an O(n^2) DP that uses O(n^2) memory.
  weak: Checks every segment from scratch in O(n^3), counts the unpaired middle character as a mismatch, or ignores the mismatch budget.
  criteria:
    correctness: All tests pass, including ties, even-length answers and budgets larger than needed.
    efficiency: O(n^2) time; constant extra memory is a plus.
    code_quality: One expansion loop shared by odd and even centres, clear names for the budget and the best segment.
    edge_cases: Empty signal, single character, zero budget, budget large enough for the whole signal, all-identical characters.
    communication: Argues why stopping at the first pair that exceeds the budget is safe for a fixed centre.
hints:
  - Every segment has a centre - either a character or the gap between two characters - and widening it around that centre adds one new pair at a time.
  - Around a fixed centre, the number of differing pairs can only grow as you widen, so for each centre you can expand outward until one more differing pair would exceed the budget.
  - Try all 2n - 1 centres; for each, move a left and a right index outward, counting differing pairs and stopping just before the count would exceed max_mismatches or an index leaves the string; record the resulting segment if it is longer than the best so far, or equally long but starting earlier.
followups:
  - How would you return the number of near-mirrored segments instead of the longest one?
  - Manacher's algorithm finds the longest exact mirror in O(n); why does it not extend directly to a mismatch budget?
  - How would you answer many queries with different budgets on the same signal?
  - What changes if the sensor sends a stream that is too long to keep in memory?
common_errors:
  - Forgetting even-length segments that are centred between two characters.
  - Counting the unpaired middle character of an odd-length segment as a mismatch.
  - Stopping at the first differing pair even when the budget allows more.
  - Breaking ties by the latest start or by the first centre that reaches the length, without checking the start index.
