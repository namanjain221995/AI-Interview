version: 1
slug: autocomplete_by_usage
title: "Autocomplete by Usage"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [frontend, backend, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Autocomplete by Usage

  An internal operations shell suggests completions while an engineer types. It learns from the
  session's command history: `history` lists every command that was run, oldest first, and each
  occurrence of a command counts as **one use**. Commands are compared as whole strings, so
  `kubectl get pods` and `kubectl get pods -A` are different commands.

  Given `history` and the text typed so far, `prefix`, return up to **3 distinct** commands that start
  with `prefix` (case-sensitive), ordered by:

  1. usage count, **highest first**;
  2. on equal counts, ascending **plain string order** (compare character codes one by one; a command
     that is a prefix of another comes first).

  If fewer than 3 commands match, return all of them; if none match, return an empty list. An empty
  `prefix` matches every command.

  ### Example 1
  ```
  Input:  history = ["git status", "git pull", "ls -la", "git push", "git status", "git pull", "git commit -m wip", "git push", "git status"], prefix = "git "
  Output: ["git status", "git pull", "git push"]
  Explanation: "git status" is used 3 times; "git pull" and "git push" tie with 2 uses and are ordered
  as strings. "git commit -m wip" (1 use) does not make the top 3, and "ls -la" does not match.
  ```

  ### Example 2
  ```
  Input:  history = ["make test", "make build"], prefix = "docker"
  Output: []
  ```

  ### Constraints
  - `0 <= history.length <= 10^5`
  - `1 <= history[i].length <= 100`
  - `0 <= prefix.length <= 100`
  - Commands and the prefix contain printable ASCII characters (letters, digits, spaces and symbols).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: autocomplete_commands
  params:
    - {name: history, type: "string[]"}
    - {name: prefix, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def autocomplete_commands(history: list[str], prefix: str) -> list[str]:
        usage: dict[str, int] = {}
        for command in history:
            if command.startswith(prefix):
                usage[command] = usage.get(command, 0) + 1
        # Most used first; equal counts in plain string order.
        ranked = sorted(usage, key=lambda command: (-usage[command], command))
        return ranked[:3]
  javascript: |
    function autocompleteCommands(history, prefix) {
      const usage = new Map();
      for (const command of history) {
        if (command.startsWith(prefix)) usage.set(command, (usage.get(command) || 0) + 1);
      }
      const ranked = [...usage.keys()].sort((a, b) => {
        if (usage.get(a) !== usage.get(b)) return usage.get(b) - usage.get(a);
        return a < b ? -1 : a > b ? 1 : 0;
      });
      return ranked.slice(0, 3);
    }
