expected_concepts:
  - "hash map counting of occurrences"
  - "prefix filtering"
  - "sorting by a composite key (count descending, then string ascending)"
  - "top-k selection (heap or partial sort) when many commands match"
  - "trie with per-node top suggestions for repeated queries"
optimal_complexity: {time: "O(n * L + d log d) for n history entries of length up to L and d distinct matching commands", space: "O(d)"}
rubric:
  excellent: "Counts uses with a hash map, filters by prefix, ranks with a composite key (count descending, then string order), returns at most three, handles the empty prefix, and discusses a trie or heap for repeated keystroke queries."
  good: "Correct counting and ordering, but needs a nudge on the tie-break direction or on returning distinct commands."
  weak: "Returns duplicates, orders ties incorrectly, matches substrings instead of prefixes, or ignores case sensitivity."
  criteria:
    correctness: "All tests pass, including ties, case sensitivity and commands that are prefixes of other commands."
    efficiency: "One counting pass plus a sort or heap over the distinct matching commands only."
    code_quality: "The ranking rule is expressed once as a comparator or sort key."
    edge_cases: "Empty history, empty prefix, no matches, fewer than three matches, prefix longer than commands."
    communication: "States the ordering rule explicitly and discusses how the design changes when queries arrive on every keystroke."
hints:
  - "First work out how many times each distinct command was used; the ranking only depends on those counts and the command text."
  - "Keep only the commands that begin with the typed text, then order them with a two-part rule: higher usage first and, on a tie, smaller string first."
  - "Build a map from command to usage count in one pass over the history, considering only commands that start with the prefix. Sort the distinct commands by count descending and then by plain string comparison ascending, and return the first three (or fewer if fewer exist)."
followups:
  - "How would you serve suggestions on every keystroke for a history of millions of commands?"
  - "How would a trie that stores the best three completions at each node be kept up to date when a new command runs?"
  - "How would you weight recent commands more heavily than old ones?"
  - "What changes if matching should ignore letter case but return the most-used original spelling?"
common_errors:
  - "Returning the same command several times instead of distinct commands."
  - "Breaking ties by first appearance in the history instead of by string order."
  - "Sorting ties in descending string order because the whole key was reversed."
  - "Matching the prefix anywhere in the command instead of at the start."
  - "Lower-casing commands, which merges commands that differ only in case."
