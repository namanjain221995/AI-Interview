expected_concepts:
  - processing the URL in a fixed order (fragment, query, pairs, decoding)
  - splitting a pair only at the first equals sign
  - single-pass percent-decoding with validation of the two hex digits
  - decoding keys before comparing them
  - preserving order and duplicates of repeated parameters
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Follows the parsing steps in order, splits only at the first '=', decodes keys and values in one left-to-right pass that leaves invalid escapes literal and never double-decodes, keeps repeated values in order, and explains the security relevance of consistent decoding.
  good: Correct for typical URLs, with one or two edge cases (encoded keys, invalid escapes, empty pieces) fixed after running the tests.
  weak: Uses a built-in URL parser without matching the stated rules, decodes before splitting, splits on every '=', or returns only the first value.
  criteria:
    correctness: All tests pass, including encoded keys, '=' inside values, invalid escapes and fragments.
    efficiency: Linear in the URL length; each character is decoded once.
    code_quality: A separate decode helper and a clear sequence of parsing steps.
    edge_cases: No query, empty query, empty pieces, pieces without '=', a '#' before the '?', a second '?' inside the query.
    communication: Explains why decoding must happen after splitting and why decoded text is not decoded again.
hints:
  - Handle the URL in stages - first cut off the fragment, then find the query, then split it into pairs - and only decode at the very end.
  - Decoding before splitting is a trap, because an encoded ampersand or equals sign would then look like a separator; split first, then decode the key and the value of each piece separately.
  - Cut the URL at the first '#', take what follows the first '?', split on '&' and skip empty pieces, split each piece at its first '=' (no '=' means an empty value), then decode both halves with one left-to-right scan that turns '+' into a space and a percent sign followed by two hex digits into that character while leaving any other percent sign untouched, and collect the values whose decoded key equals the name.
followups:
  - Why can decoding the whole query string before splitting it lead to parameter-injection bugs?
  - How would you support multi-byte UTF-8 sequences such as %C3%A9?
  - How should a gateway behave when two layers disagree on how to decode the same URL?
  - How would you rebuild a canonical query string (sorted, consistently encoded) for signing requests?
common_errors:
  - Decoding the whole query before splitting, so an encoded '&' or '=' acts as a separator.
  - Splitting each piece on every '=' and losing the rest of a value such as a base64 token.
  - Comparing the raw key instead of the decoded key.
  - Decoding twice, so '%2541' becomes 'A' instead of '%41', or turning a decoded '+' into a space.
  - Including the fragment in the query or splitting on a '?' that appears after the '#'.
