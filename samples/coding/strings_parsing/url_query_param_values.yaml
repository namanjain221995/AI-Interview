slug: url_query_param_values
title: URL Query Parameter Values
difficulty: medium
competency_keys: [problem_solving, code_quality]
role_tags: [backend, frontend, fullstack, security]
time_limit_minutes: 25
prompt_markdown: |
  ## URL Query Parameter Values

  An API gateway logs raw request URLs, and an audit tool needs every value a client sent for one query
  parameter (a parameter may legitimately repeat, as in `?tag=a&tag=b`). Write
  `query_param_values(url, name)` that returns all decoded values of the parameter `name`, **in the order
  they appear** in the URL.

  Parse the URL exactly like this:

  1. **Fragment:** everything from the first `#` onward is the fragment and is ignored.
  2. **Query:** in what remains, the query is everything after the **first** `?`. If there is no `?`,
     there are no parameters.
  3. **Pairs:** split the query on `&`; skip empty pieces. Split each piece at its **first** `=` into a key
     and a value; a piece without `=` is a key whose value is the empty string.
  4. **Decoding:** decode the key and the value separately, scanning left to right once: `+` becomes a
     space, and `%` followed by **two hexadecimal digits** (upper or lower case) becomes the character with
     that code. A `%` that is not followed by two hexadecimal digits is kept as a literal `%`. Decoded text
     is never decoded again, so `%2B` becomes a literal `+` (not a space).
  5. **Matching:** a pair belongs to the parameter when its **decoded** key equals `name` exactly (case
     sensitive).

  Return an empty list `[]` when the parameter does not occur.

  ### Example 1
  ```
  Input:  url = "https://shop.example.com/search?q=red+shoes&page=2&q=size%2B10", name = "q"
  Output: ["red shoes", "size+10"]
  ```

  ### Example 2
  ```
  Input:  url = "/api/items?tag=a&tag&tag=&x=1#tag=frag", name = "tag"
  Output: ["a", "", ""]
  Explanation: "tag" without "=" and "tag=" both have an empty value; the fragment is ignored.
  ```

  ### Example 3
  ```
  Input:  url = "https://status.example.com/health", name = "verbose"
  Output: []
  ```

  ### Constraints
  - `0 <= url.length <= 4000`
  - `1 <= name.length <= 50`; `name` is plain text (it is not encoded).
  - `url` and `name` contain printable ASCII characters only, and every valid `%XX` escape encodes a
    printable ASCII character (`20` to `7E`).

  **Follow-up:** how would you change the function to return every parameter at once as a map from key to
  list of values?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: query_param_values
  params:
    - {name: url, type: "string"}
    - {name: name, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    HEX_DIGITS = "0123456789abcdefABCDEF"


    def _decode(text: str) -> str:
        out: list[str] = []
        i = 0
        while i < len(text):
            ch = text[i]
            if ch == "+":
                out.append(" ")
                i += 1
            elif ch == "%" and i + 2 < len(text) and text[i + 1] in HEX_DIGITS and text[i + 2] in HEX_DIGITS:
                out.append(chr(int(text[i + 1:i + 3], 16)))
                i += 3
            else:
                out.append(ch)
                i += 1
        return "".join(out)


    def query_param_values(url: str, name: str) -> list[str]:
        url = url.split("#", 1)[0]
        q = url.find("?")
        if q < 0:
            return []
        values: list[str] = []
        for piece in url[q + 1:].split("&"):
            if not piece:
                continue
            key, _, value = piece.partition("=")
            if _decode(key) == name:
                values.append(_decode(value))
        return values
  javascript: |
    function decodeComponent(text) {
      const isHex = (c) => c !== undefined && /^[0-9a-fA-F]$/.test(c);
      let out = '';
      let i = 0;
      while (i < text.length) {
        const ch = text[i];
        if (ch === '+') {
          out += ' ';
          i++;
        } else if (ch === '%' && i + 2 < text.length && isHex(text[i + 1]) && isHex(text[i + 2])) {
          out += String.fromCharCode(parseInt(text.slice(i + 1, i + 3), 16));
          i += 3;
        } else {
          out += ch;
          i++;
        }
      }
      return out;
    }

    function queryParamValues(url, name) {
      const hash = url.indexOf('#');
      if (hash >= 0) url = url.slice(0, hash);
      const q = url.indexOf('?');
      if (q < 0) return [];
      const values = [];
      for (const piece of url.slice(q + 1).split('&')) {
        if (piece === '') continue;
        const eq = piece.indexOf('=');
        const key = eq < 0 ? piece : piece.slice(0, eq);
        const value = eq < 0 ? '' : piece.slice(eq + 1);
        if (decodeComponent(key) === name) values.push(decodeComponent(value));
      }
      return values;
    }
