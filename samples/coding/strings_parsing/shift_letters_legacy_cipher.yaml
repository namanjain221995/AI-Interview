version: 1
slug: shift_letters_legacy_cipher
title: "Legacy Device Letter Shift"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [security, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Legacy Device Letter Shift

  A fleet of older field controllers still sends its status text in a lightly scrambled form: every letter
  is moved a fixed number of places along the alphabet. The integration service has to both scramble
  outgoing commands and unscramble incoming status lines, so it needs one function that applies a shift.

  Write `shift_letters(text, shift)` that returns a new string where:

  - every lowercase ASCII letter `a`-`z` moves `shift` places forward within `a`-`z`, wrapping from `z`
    back to `a`;
  - every uppercase ASCII letter `A`-`Z` moves the same way within `A`-`Z` (case is preserved);
  - every other character (digits, spaces, punctuation) is copied unchanged.

  A negative `shift` moves letters backwards (wrapping from `a` to `z`). `shift` can be far larger than 26 in
  either direction; only its effect modulo 26 matters. Undoing a shift of `k` is a shift of `-k`.

  This is obfuscation, not encryption; it is only used for compatibility with the old devices.

  ### Example 1
  ```
  Input:  text = "Pump 3 OK, tank at 85%", shift = 3
  Output: "Sxps 3 RN, wdqn dw 85%"
  Explanation: P->S, u->x, m->p, p->s; O->R, K->N; digits, spaces and punctuation are unchanged.
  ```

  ### Example 2
  ```
  Input:  text = "Zebra-yard", shift = -2
  Output: "Xczpy-wypb"
  ```

  ### Example 3
  ```
  Input:  text = "xyz XYZ", shift = 29
  Output: "abc ABC"
  ```

  ### Constraints
  - `0 <= text.length <= 10^5`
  - `text` consists of printable ASCII characters
  - `-10^9 <= shift <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shift_letters
  params:
    - {name: text, type: "string"}
    - {name: shift, type: "int"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def shift_letters(text: str, shift: int) -> str:
        step = shift % 26  # Python's % is already non-negative for a positive modulus
        out: list[str] = []
        for ch in text:
            if "a" <= ch <= "z":
                out.append(chr((ord(ch) - ord("a") + step) % 26 + ord("a")))
            elif "A" <= ch <= "Z":
                out.append(chr((ord(ch) - ord("A") + step) % 26 + ord("A")))
            else:
                out.append(ch)
        return "".join(out)
  javascript: |
    function shiftLetters(text, shift) {
      const step = ((shift % 26) + 26) % 26; // JS % keeps the sign of the dividend
      const out = [];
      for (const ch of text) {
        const code = ch.charCodeAt(0);
        if (code >= 97 && code <= 122) {
          out.push(String.fromCharCode(((code - 97 + step) % 26) + 97));
        } else if (code >= 65 && code <= 90) {
          out.push(String.fromCharCode(((code - 65 + step) % 26) + 65));
        } else {
          out.push(ch);
        }
      }
      return out.join("");
    }
tests:
  - {id: t1, args: ["Pump 3 OK, tank at 85%", 3], expected: "Sxps 3 RN, wdqn dw 85%", description: "Example 1 - forward shift keeps case, digits and punctuation"}
  - {id: t2, args: ["Zebra-yard", -2], expected: "Xczpy-wypb", description: "Example 2 - negative shift wraps backwards past a"}
  - {id: t3, args: ["xyz XYZ", 29], expected: "abc ABC", description: "Example 3 - shift larger than the alphabet wraps forward"}
  - {id: t4, hidden: true, args: ["", 5], expected: "", description: "Empty text"}
  - {id: t5, hidden: true, args: ["Status: Nominal", 0], expected: "Status: Nominal", description: "Zero shift returns the text unchanged"}
  - {id: t6, hidden: true, args: ["Status: Nominal", 26], expected: "Status: Nominal", description: "Full-alphabet shift returns the text unchanged"}
  - {id: t7, hidden: true, args: ["abcdefghijklmnopqrstuvwxyz ABCDEFGHIJKLMNOPQRSTUVWXYZ", -1], expected: "zabcdefghijklmnopqrstuvwxy ZABCDEFGHIJKLMNOPQRSTUVWXY", description: "Every letter of both cases shifted back by one"}
  - {id: t8, hidden: true, args: ["Ping 10.0.0.1 [ok] ~ {fan=on}", 1000000000], expected: "Buzs 10.0.0.1 [aw] ~ {rmz=az}", description: "Maximum positive shift (10^9 mod 26 = 12) with mixed symbols"}
  - {id: t9, hidden: true, args: ["Ping 10.0.0.1 [ok] ~ {fan=on}", -1000000000], expected: "Dwbu 10.0.0.1 [cy] ~ {tob=cb}", description: "Maximum negative shift; language modulo of negatives is the trap"}
  - {id: t10, hidden: true, args: ["0123456789 !@#$%^&*()_+-=", 7], expected: "0123456789 !@#$%^&*()_+-=", description: "No letters at all"}
  - {id: t11, hidden: true, args: ["Mm Zz Aa", -27], expected: "Ll Yy Zz", description: "Negative shift beyond one alphabet length at both ends of the alphabet"}
  - {id: t12, hidden: true, args: ["Valve V7 pressure nominal; Pump-3 cycling at 42 rpm. Valve V7 pressure nominal; Pump-3 cycling at 42 rpm. Valve V7 pressure nominal; Pump-3 cycling at 42 rpm. Valve V7 pressure nominal; Pump-3 cycling at 42 rpm. Valve V7 pressure nominal; Pump-3 cycling at 42 rpm. Valve V7 pressure nominal; Pump-3 cycling at 42 rpm.", -13], expected: "Inyir I7 cerffher abzvany; Chzc-3 plpyvat ng 42 ecz. Inyir I7 cerffher abzvany; Chzc-3 plpyvat ng 42 ecz. Inyir I7 cerffher abzvany; Chzc-3 plpyvat ng 42 ecz. Inyir I7 cerffher abzvany; Chzc-3 plpyvat ng 42 ecz. Inyir I7 cerffher abzvany; Chzc-3 plpyvat ng 42 ecz. Inyir I7 cerffher abzvany; Chzc-3 plpyvat ng 42 ecz.", description: "Stress: long repeated status line shifted by -13"}
expected_concepts:
  - "character codes and offset from 'a' or 'A'"
  - "modular arithmetic with wrap-around"
  - "normalising a negative or huge shift into the range 0 to 25"
  - "preserving case and non-letter characters"
  - "building the output efficiently (list join or string builder)"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Reduces the shift once to 0..25 with a modulo that is safe for negatives in their language, handles each case range separately, copies other characters, builds the result in linear time and notes that shifting by -k undoes k."
  good: "Correct result after fixing the negative-modulo or wrap-around detail during testing."
  weak: "Breaks on negative or large shifts, shifts non-letters, loses case, or loops shift times per character."
  criteria:
    correctness: "All tests pass, including zero, 26, negative and very large shifts."
    efficiency: "Linear in the text length and independent of the size of the shift."
    code_quality: "Uses named offsets instead of magic numbers and avoids duplicated logic for the two cases where practical."
    edge_cases: "Empty text, text without letters, letters at both ends of the alphabet, negative shifts."
    communication: "Explains how the chosen language treats the remainder of a negative number."
hints:
  - "Only letters change, and each letter only moves within its own 26-letter alphabet; treat lowercase and uppercase separately."
  - "Turn a letter into its position from 0 to 25, add the shift, wrap the result back into 0 to 25 and convert it back to a letter. Think about what your language returns for the remainder of a negative number."
  - "Reduce the shift once at the start to a value from 0 to 25 by taking the remainder modulo 26 and adding 26 if it is negative. Then for each character: if it is a lowercase or uppercase letter, take its offset from the first letter of that case, add the reduced shift, take the remainder modulo 26 and convert back; otherwise copy it. Collect characters in a list or builder and join at the end."
followups:
  - "How would you recover the shift automatically if you only had scrambled English text?"
  - "How would you extend the scheme so the shift changes for every character (a key word)?"
  - "Why is a fixed letter shift unsuitable for protecting real data, and what would you use instead?"
  - "How would you handle letters outside ASCII, such as accented characters?"
common_errors:
  - "Using the language remainder operator on a negative shift in JavaScript, Java, Go or C++ and getting a negative offset."
  - "Shifting digits or punctuation, or turning uppercase letters into lowercase."
  - "Looping shift times per character, which is far too slow for shifts near 10^9."
  - "Adding the shift to the character code without wrapping, producing characters past z."
