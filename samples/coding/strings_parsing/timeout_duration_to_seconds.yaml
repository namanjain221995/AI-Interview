version: 1
slug: timeout_duration_to_seconds
title: "Timeout Duration to Seconds"
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [devops, sre, platform, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Timeout Duration to Seconds

  The job scheduler lets teams write timeouts in a compact form such as `2d4h30m15s`. Before a job is
  accepted, the scheduler converts the timeout to seconds and rejects anything malformed.

  A valid `spec` is **one or more components** written back to back with no separators. Each component is:

  - a non-negative whole number written with one or more decimal digits (leading zeros are allowed), then
  - exactly one **unit**: `d` (86400 seconds), `h` (3600), `m` (60) or `s` (1).

  Each unit may appear **at most once**, and units must appear in **descending order**: `d` before `h`
  before `m` before `s`. Units may be skipped, so `1d30s` is valid.

  Return the total number of seconds as a 64-bit integer, or `-1` if `spec` is invalid. A spec is invalid if
  it is empty, contains any character other than digits and the four lowercase units (including spaces,
  signs and uppercase letters), has a unit with no number in front of it, repeats a unit, has units out of
  order, or ends with digits that have no unit.

  ### Example 1
  ```
  Input:  spec = "2d4h30m15s"
  Output: 189015
  Explanation: 2 * 86400 + 4 * 3600 + 30 * 60 + 15 = 189015
  ```

  ### Example 2
  ```
  Input:  spec = "90m"
  Output: 5400
  ```

  ### Example 3
  ```
  Input:  spec = "30m1h"
  Output: -1
  ```

  ### Constraints
  - `0 <= spec.length <= 60`
  - `spec` consists of printable ASCII characters
  - Every run of consecutive digits in `spec` has at most 9 digits
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: duration_to_seconds
  params:
    - {name: spec, type: "string"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    UNIT_SECONDS = {"d": 86400, "h": 3600, "m": 60, "s": 1}
    UNIT_ORDER = "dhms"


    def duration_to_seconds(spec: str) -> int:
        if not spec:
            return -1
        total = 0
        next_allowed = 0  # index in UNIT_ORDER of the smallest-rank unit still allowed
        i, n = 0, len(spec)
        while i < n:
            start = i
            value = 0
            while i < n and "0" <= spec[i] <= "9":
                value = value * 10 + (ord(spec[i]) - ord("0"))
                i += 1
            if i == start or i == n:
                return -1  # missing number, or digits with no unit at the end
            rank = UNIT_ORDER.find(spec[i])
            if rank < next_allowed:
                return -1  # unknown unit (-1), repeated or out-of-order unit
            total += value * UNIT_SECONDS[spec[i]]
            next_allowed = rank + 1
            i += 1
        return total
  javascript: |
    const UNIT_SECONDS = { d: 86400, h: 3600, m: 60, s: 1 };
    const UNIT_ORDER = "dhms";

    function durationToSeconds(spec) {
      if (spec.length === 0) return -1;
      let total = 0;
      let nextAllowed = 0; // smallest index in UNIT_ORDER still allowed
      let i = 0;
      const n = spec.length;
      while (i < n) {
        const start = i;
        let value = 0;
        while (i < n && spec[i] >= "0" && spec[i] <= "9") {
          value = value * 10 + (spec.charCodeAt(i) - 48);
          i++;
        }
        if (i === start || i === n) return -1; // missing number, or trailing digits
        const rank = UNIT_ORDER.indexOf(spec[i]);
        if (rank < nextAllowed) return -1; // unknown, repeated or out-of-order unit
        total += value * UNIT_SECONDS[spec[i]];
        nextAllowed = rank + 1;
        i++;
      }
      return total;
    }
tests:
  - {id: t1, args: ["2d4h30m15s"], expected: 189015, description: "Example 1 - all four units in order"}
  - {id: t2, args: ["90m"], expected: 5400, description: "Example 2 - a single component may exceed the next unit's range"}
  - {id: t3, args: ["30m1h"], expected: -1, description: "Example 3 - units out of order are rejected"}
  - {id: t4, hidden: true, args: [""], expected: -1, description: "Empty spec is invalid"}
  - {id: t5, hidden: true, args: ["h30m"], expected: -1, description: "Unit with no number in front of it"}
  - {id: t6, hidden: true, args: ["15m30"], expected: -1, description: "Trailing digits without a unit"}
  - {id: t7, hidden: true, args: ["1h1h"], expected: -1, description: "Repeated unit"}
  - {id: t8, hidden: true, args: ["1H"], expected: -1, description: "Uppercase unit is unknown"}
  - {id: t9, hidden: true, args: ["1h 30m"], expected: -1, description: "Space between components is not allowed"}
  - {id: t10, hidden: true, args: ["-5s"], expected: -1, description: "Sign character is not allowed"}
  - {id: t11, hidden: true, args: ["0d0h0m0s"], expected: 0, description: "All-zero components give zero, which is valid and distinct from -1"}
  - {id: t12, hidden: true, args: ["1d007m"], expected: 86820, description: "Leading zeros are allowed and units may be skipped"}
  - {id: t13, hidden: true, args: ["999999999d999999999h999999999m999999999s"], expected: 90060999909939, description: "Largest values: total far beyond 32 bits"}
expected_concepts:
  - "hand-written tokenizer: number then unit"
  - "state tracking of the last unit seen to enforce order and uniqueness"
  - "explicit validation of every malformed case"
  - "64-bit accumulation of the total"
  - "sentinel return value distinct from a valid zero"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Writes a single-pass parser that reads digits then a unit, tracks the rank of the previous unit to reject repeats and disorder in one comparison, rejects empty input and trailing digits, accumulates in 64-bit and lists the invalid cases before coding."
  good: "Correct parser that needs one or two fixes for an invalid case (trailing digits, missing number or repeated unit) found during testing."
  weak: "Accepts malformed specs, overflows 32-bit integers, or relies on splitting tricks that silently ignore bad characters."
  criteria:
    correctness: "All tests pass, including every category of invalid input and the zero total."
    efficiency: "One left-to-right pass with constant extra space."
    code_quality: "Unit table defined once; order check expressed through a rank rather than many special cases."
    edge_cases: "Empty string, missing numbers, trailing digits, uppercase units, separators, maximum values."
    communication: "Enumerates the grammar and the rejection rules before writing code."
hints:
  - "Treat the spec as a sequence of tokens: a number made of digits, then a single unit letter, repeated until the end."
  - "Walk the string with an index, collecting digits into a number, then look at the next character as the unit. Give each unit a rank so you can tell whether it comes after the previous unit."
  - "Keep the rank of the last unit seen, starting below the rank of days. In a loop: read all digits and fail if there were none; fail if the string ended right after the digits; look up the unit, failing if it is unknown or its rank is not greater than the previous rank; add the number times the unit's seconds to a 64-bit total. Also fail on an empty spec."
followups:
  - "How would you add a weeks unit or millisecond precision without rewriting the parser?"
  - "How would you report where in the spec the error is instead of returning -1?"
  - "Should 90m be normalised to 1h30m when displaying the timeout back to users?"
  - "How would you protect against arbitrarily long digit runs that overflow even 64-bit integers?"
common_errors:
  - "Accepting trailing digits such as 15m30 by ignoring the last partial component."
  - "Allowing a unit with no number, such as h30m."
  - "Checking order but not uniqueness, or the reverse."
  - "Accumulating in a 32-bit integer and overflowing on large day counts."
  - "Returning 0 for invalid input, which cannot be told apart from a valid zero timeout."
