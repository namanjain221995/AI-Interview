slug: symmetric_serial_label
title: "Upside-Down Serial Label"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [qa, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Upside-Down Serial Label

  A hardware vendor mounts its rack devices either way up, so special-edition devices get serial labels
  that read **the same after the device is turned upside down** (rotated by 180 degrees). The QA team
  wants a check that a proposed label really has this property.

  Only ASCII letters and digits on the label count; every other character (such as `-`, `/`, `:` or a
  space) is ignored. Letters are compared **case-insensitively** (treat them as upper case). When the
  label is rotated by 180 degrees, the order of the counted characters is reversed and each character
  turns into its rotated form:

  | Character | `0` | `1` | `8` | `6` | `9` | `H` | `I` | `N` | `O` | `S` | `X` | `Z` | `M` | `W` |
  |-----------|-----|-----|-----|-----|-----|-----|-----|-----|-----|-----|-----|-----|-----|-----|
  | Rotated   | `0` | `1` | `8` | `9` | `6` | `H` | `I` | `N` | `O` | `S` | `X` | `Z` | `W` | `M` |

  Any other letter or digit has **no** rotated form, so a label containing one cannot be symmetric. The
  letter `O` and the digit `0` are different characters.

  Write `is_symmetric_serial(label)` that returns `true` if the rotated sequence of counted characters
  equals the original sequence, and `false` otherwise. A label with no letters or digits is symmetric.

  ### Example 1
  ```
  Input:  label = "SN-69-NS"
  Output: true
  Explanation: rotated 180 degrees, S-N-6-9-N-S reads S-N-6-9-N-S again
  ```

  ### Example 2
  ```
  Input:  label = "mow-1-mow"
  Output: true
  Explanation: case is ignored; M rotates to W, O to O and the middle 1 to itself
  ```

  ### Example 3
  ```
  Input:  label = "6-6"
  Output: false
  Explanation: 6 rotates to 9, so the label would read 9-9 upside down
  ```

  ### Constraints
  - `0 <= label.length <= 2 * 10^5`
  - `label` consists of printable ASCII characters.

  **Follow-up:** can you check the label in `O(1)` extra space without building a cleaned copy?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_symmetric_serial
  params:
    - {name: label, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    ROTATED = {
        "0": "0", "1": "1", "8": "8", "6": "9", "9": "6",
        "H": "H", "I": "I", "N": "N", "O": "O", "S": "S", "X": "X", "Z": "Z",
        "M": "W", "W": "M",
    }


    def is_symmetric_serial(label: str) -> bool:
        i, j = 0, len(label) - 1
        while True:
            while i <= j and not (label[i].isascii() and label[i].isalnum()):
                i += 1
            while i <= j and not (label[j].isascii() and label[j].isalnum()):
                j -= 1
            if i > j:
                return True
            left, right = label[i].upper(), label[j].upper()
            if ROTATED.get(left) != right:  # also covers the middle character when i == j
                return False
            i += 1
            j -= 1
  javascript: |
    function isSymmetricSerial(label) {
      const rotated = {
        "0": "0", "1": "1", "8": "8", "6": "9", "9": "6",
        H: "H", I: "I", N: "N", O: "O", S: "S", X: "X", Z: "Z", M: "W", W: "M",
      };
      const counted = (c) => /[A-Za-z0-9]/.test(c);
      let i = 0;
      let j = label.length - 1;
      while (true) {
        while (i <= j && !counted(label[i])) i++;
        while (i <= j && !counted(label[j])) j--;
        if (i > j) return true;
        if (rotated[label[i].toUpperCase()] !== label[j].toUpperCase()) return false;
        i++;
        j--;
      }
    }
tests:
  - {id: t1, args: ["SN-69-NS"], expected: true, description: "Example 1 - 6 and 9 swap under rotation; not a palindrome but symmetric"}
  - {id: t2, args: ["mow-1-mow"], expected: true, description: "Example 2 - lower case, M and W swap, 1 in the middle"}
  - {id: t3, args: ["6-6"], expected: false, description: "Example 3 - a palindrome that is not rotation-symmetric"}
  - {id: t4, hidden: true, args: ["--/ "], expected: true, description: "No letters or digits - symmetric"}
  - {id: t5, hidden: true, args: ["8"], expected: true, description: "Single self-rotating digit"}
  - {id: t6, hidden: true, args: ["SN6NS"], expected: false, description: "6 in the middle would have to rotate to itself - not symmetric"}
  - {id: t7, hidden: true, args: ["AHA"], expected: false, description: "A palindrome containing a letter with no rotated form"}
  - {id: t8, hidden: true, args: ["O-0"], expected: false, description: "Letter O and digit 0 are different characters"}
