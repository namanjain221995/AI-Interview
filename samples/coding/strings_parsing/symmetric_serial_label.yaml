expected_concepts:
  - "two pointers moving inwards from both ends"
  - "skipping ignored characters inside the pointer loop"
  - "lookup table for rotated characters, including pairs that swap"
  - "the middle character must rotate to itself"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Uses two pointers that skip ignored characters, normalises case, checks each outer character's rotated form against its partner through a table, handles the middle character naturally and explains O(n) time with O(1) space."
  good: "Builds a cleaned copy and compares it with its rotated reverse, or needs a nudge for the middle character or characters missing from the table."
  weak: "Implements a plain palindrome check, forgets that 6 and 9 or M and W swap, treats O and 0 as equal or crashes on labels without counted characters."
  criteria:
    correctness: "All tests pass, including palindromes that are not symmetric and symmetric labels that are not palindromes."
    efficiency: "Linear time; constant extra space with two pointers."
    code_quality: "The rotation table is data, not a chain of conditions; pointer movement is easy to follow."
    edge_cases: "Empty or separator-only labels, single characters, middle characters that do not rotate to themselves and characters without a rotated form."
    communication: "Explains how reversing and rotating combine and checks the rule on an example before coding."
hints:
  - "Turning the device upside down does two things at once: the characters come in reverse order and each one changes into its rotated form."
  - "Compare the first counted character with the last, the second with the second-to-last and so on: each pair is fine only if the rotated form of the left character is exactly the right character."
  - "Move one pointer from each end, skipping anything that is not an ASCII letter or digit and upper-casing letters; look up the left character in the rotation table and fail if it is missing or differs from the right character, and when the pointers meet on one character it must rotate to itself."
followups:
  - "How would you generate all symmetric labels of a given length?"
  - "How would you change the solution if the rotation table came from a configuration file per font?"
  - "Why does a plain palindrome check give the wrong answer here, and which tests show it?"
common_errors:
  - "Writing a palindrome check and forgetting to rotate each character."
  - "Accepting a 6 or 9 in the middle of an odd-length label."
  - "Treating the letter O and the digit 0 as the same character."
  - "Not skipping separators on both sides before comparing."
