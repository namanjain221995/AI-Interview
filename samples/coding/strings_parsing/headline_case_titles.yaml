version: 1
slug: headline_case_titles
title: "Headline Case for Docs Titles"
difficulty: easy
competency_keys: [code_quality, problem_solving]
role_tags: [frontend, fullstack, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Headline Case for Docs Titles

  The documentation site shows every page title in a consistent **headline case**, regardless of how the
  author typed it. Write a function that converts a `title` using these rules.

  - Words are separated by **single spaces**. A word is any run of non-space characters, so `end-to-end`,
    `v2` and `(beta)` are each one word.
  - Every word is rewritten as its **first character upper-cased** followed by the **rest lower-cased**.
    Upper-casing a character that is not a letter leaves it as it is, so `2FA` becomes `2fa`.
  - **Small words** are written entirely in lowercase instead: `a`, `an`, `the`, `and`, `or`, `of`, `in`,
    `on`, `to`, `for`. A word counts as small only if the **whole word** matches one of these, ignoring case
    (`THE` is small; `android`, `on-call` and `for:` are not).
  - The **first and last** words of the title are always capitalised as normal words, even when they are
    small words. A one-word title is both first and last.

  Return the converted title with the same single spaces between words.

  ### Example 1
  ```
  Input:  title = "a guide to rolling back AN outage"
  Output: "A Guide to Rolling Back an Outage"
  Explanation: The first word a is capitalised; to and AN are small words in the middle.
  ```

  ### Example 2
  ```
  Input:  title = "what to wait for"
  Output: "What to Wait For"
  ```

  ### Example 3
  ```
  Input:  title = "end-to-end TESTS for the v2 API"
  Output: "End-to-end Tests for the V2 Api"
  ```

  ### Constraints
  - `1 <= title.length <= 10^4`
  - `title` consists of printable ASCII characters
  - `title` does not start or end with a space and never contains two spaces in a row
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: headline_case
  params:
    - {name: title, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    SMALL_WORDS = {"a", "an", "the", "and", "or", "of", "in", "on", "to", "for"}


    def headline_case(title: str) -> str:
        words = title.split(" ")
        last = len(words) - 1
        out: list[str] = []
        for i, word in enumerate(words):
            lower = word.lower()
            if lower in SMALL_WORDS and 0 < i < last:
                out.append(lower)
            else:
                out.append(lower[:1].upper() + lower[1:])
        return " ".join(out)
  javascript: |
    const SMALL_WORDS = new Set(["a", "an", "the", "and", "or", "of", "in", "on", "to", "for"]);

    function headlineCase(title) {
      const words = title.split(" ");
      const last = words.length - 1;
      return words
        .map((word, i) => {
          const lower = word.toLowerCase();
          if (SMALL_WORDS.has(lower) && i > 0 && i < last) return lower;
          return lower.slice(0, 1).toUpperCase() + lower.slice(1);
        })
        .join(" ");
    }
tests:
  - {id: t1, args: ["a guide to rolling back AN outage"], expected: "A Guide to Rolling Back an Outage", description: "Example 1 - small words lowered in the middle, capitalised at the start"}
  - {id: t2, args: ["what to wait for"], expected: "What to Wait For", description: "Example 2 - small word as the last word is capitalised"}
  - {id: t3, args: ["end-to-end TESTS for the v2 API"], expected: "End-to-end Tests for the V2 Api", description: "Example 3 - hyphenated word and digits"}
  - {id: t4, hidden: true, args: ["of"], expected: "Of", description: "Single small word is both first and last"}
  - {id: t5, hidden: true, args: ["x"], expected: "X", description: "Single one-letter word"}
  - {id: t6, hidden: true, args: ["MIGRATING OF THE DATA"], expected: "Migrating of the Data", description: "All-caps input with small words in the middle"}
  - {id: t7, hidden: true, args: ["android and organisations on-call for: anthem"], expected: "Android and Organisations On-call For: Anthem", description: "Small words only match whole words, not prefixes or words with punctuation"}
  - {id: t8, hidden: true, args: ["2FA setup in 5 minutes"], expected: "2fa Setup in 5 Minutes", description: "Words starting with digits stay lowercase after the first character"}
  - {id: t9, hidden: true, args: ["(beta) the release of [new] features to"], expected: "(beta) the Release of [new] Features To", description: "Bracketed words and a trailing small word"}
  - {id: t10, hidden: true, args: ["the an a"], expected: "The an A", description: "Only small words: middle stays lower, first and last capitalised"}
  - {id: t11, hidden: true, args: ["iOS AND tvOS Or GraphQL-style queries"], expected: "Ios and Tvos or Graphql-style Queries", description: "Mixed-case words are normalised; mixed-case small words are matched"}
  - {id: t12, hidden: true, args: ["scaling THE queue of jobs for an API and a CLI scaling THE queue of jobs for an API and a CLI scaling THE queue of jobs for an API and a CLI scaling THE queue of jobs for an API and a CLI scaling THE queue of jobs for an API and a CLI to"], expected: "Scaling the Queue of Jobs for an Api and a Cli Scaling the Queue of Jobs for an Api and a Cli Scaling the Queue of Jobs for an Api and a Cli Scaling the Queue of Jobs for an Api and a Cli Scaling the Queue of Jobs for an Api and a Cli To", description: "Stress: long title of 56 words with repeated small words"}
expected_concepts:
  - "splitting on spaces and rejoining"
  - "case-insensitive lookup in a set of small words"
  - "position-aware rule for the first and last word"
  - "capitalising the first character and lower-casing the rest"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Uses a set for the small words, lower-cases before the lookup, applies the first/last exception by index, handles one-word titles and non-letter first characters, and keeps the code short and readable."
  good: "Correct after fixing one detail such as the last-word exception or lower-casing the rest of each word."
  weak: "Matches small words by substring, forgets the first or last word exception, or only capitalises without lower-casing the rest."
  criteria:
    correctness: "All tests pass, including all-caps input, single words and small words at either end."
    efficiency: "Linear in the title length with constant-time small-word lookup."
    code_quality: "Small words defined once as a named set; per-word transformation is a small, clear step."
    edge_cases: "One-word titles, titles made only of small words, words starting with digits or punctuation."
    communication: "Restates the precedence of the first/last rule over the small-word rule before coding."
hints:
  - "Process the title one word at a time and decide for each word which of two shapes it takes."
  - "Keep the small words in a set and compare each word in lowercase against it; remember that the word's position can override the small-word rule."
  - "Split on spaces and remember the index of the last word. For each word, lower-case it; if it is in the small-word set and is neither the first nor the last word, keep it fully lowercase, otherwise upper-case only its first character. Join the words back with single spaces."
followups:
  - "How would you keep known acronyms such as API or AWS fully upper-case?"
  - "How would you handle words joined by hyphens so that each part is capitalised?"
  - "How would you support titles with several spaces or tabs between words while preserving them?"
  - "Where should this rule live in a docs pipeline: at authoring time, build time or render time?"
common_errors:
  - "Checking whether a small word appears inside a word, which lowers android or anthem."
  - "Forgetting that the last word is always capitalised."
  - "Capitalising the first letter without lower-casing the rest, leaving TESTS unchanged."
  - "Crashing on a one-word title or treating it as only the first word."
