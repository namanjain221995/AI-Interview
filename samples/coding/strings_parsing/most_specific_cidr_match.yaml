expected_concepts:
  - "converting a dotted IPv4 address to a 32-bit unsigned integer"
  - "building a prefix mask (handling /0 and /32)"
  - "masking both addresses before comparing (ignoring host bits)"
  - "longest-prefix match with deterministic tie-breaking"
  - "unsigned versus signed 32-bit arithmetic pitfalls"
optimal_complexity: {time: "O(n) for n blocks", space: "O(1)"}
rubric:
  excellent: "Parses addresses into 32-bit unsigned integers, builds masks that are correct for /0 and /32, masks both sides so host bits are ignored, keeps the best prefix with a strict comparison for earliest-index ties, and discusses signed-shift pitfalls and a trie for many lookups."
  good: "Correct masking solution that needs a nudge on /0, signed integers or the tie-breaking rule."
  weak: "Compares addresses as strings or by whole octets only, breaks on /0 or on addresses at or above 128.0.0.0, or ignores the host-bit rule."
  criteria:
    correctness: "All tests pass, including /0, /31, /32, the top of the address range and duplicate networks."
    efficiency: "A single pass over the blocks with constant work per block."
    code_quality: "One helper converts dotted addresses; mask construction is explicit and commented."
    edge_cases: "Empty list, host bits set in the block address, ties between equal prefixes, 255.255.255.255 and 0.0.0.0."
    communication: "Explains why masking both sides is required and how language integer semantics affect the mask."
hints:
  - "Think of an IPv4 address as one 32-bit number instead of four separate octets. What does the prefix length tell you about which bits must agree?"
  - "Turn the address and each block address into integers, then keep only the leading prefix bits of both before comparing them. Be careful with prefix 0 and with languages whose shifts are signed or wrap at 32."
  - "For each block, build a mask with the top prefix bits set to one and the rest zero (prefix 0 gives an all-zero mask). The block contains the address when both values agree after applying the mask. Track the largest matching prefix and replace the current answer only on a strictly larger prefix, so the earliest index wins ties."
followups:
  - "How would you answer a million lookups per second against a hundred thousand blocks?"
  - "How does a binary trie keyed on address bits implement longest-prefix match?"
  - "What changes for IPv6 addresses with 128 bits?"
  - "How would you detect rules that can never match because an earlier, more specific rule shadows them?"
common_errors:
  - "Shifting by 32 to build the /0 mask, which is a no-op or undefined behaviour in several languages."
  - "Using signed 32-bit integers so addresses at or above 128.0.0.0 become negative and comparisons break."
  - "Comparing only whole octets, which fails for prefixes such as /12 or /26."
  - "Not masking the block's own address, so blocks written with host bits never match."
  - "Using a non-strict comparison when tracking the best prefix, which returns the last tied index."
