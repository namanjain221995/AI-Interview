slug: most_specific_cidr_match
title: "Most Specific CIDR Match"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, security, cloud, devops]
time_limit_minutes: 20
prompt_markdown: |
  ## Most Specific CIDR Match

  An edge firewall keeps an ordered list of rules, and each rule applies to one IPv4 network block
  written in CIDR notation, such as `10.0.0.0/8`. The number after the slash is the **prefix length**
  `p` (from `0` to `32`): a block contains an address when the first `p` bits of the address equal the
  first `p` bits of the block's address. A `/0` block therefore contains every address and a `/32`
  block contains exactly one.

  Blocks are typed by hand, so the bits after the prefix are not always zero: `10.1.2.3/8` is simply the
  same network as `10.0.0.0/8`. Ignore those host bits.

  Given a client address `ip` and the list `blocks`, return the **index** of the block that contains
  `ip` with the **longest** prefix length. If several containing blocks share that longest prefix
  length, return the **smallest** index among them. Return `-1` if no block contains `ip`.

  ### Example 1
  ```
  Input:  ip = "10.20.30.40", blocks = ["0.0.0.0/0", "10.0.0.0/8", "10.20.0.0/16", "10.21.0.0/16"]
  Output: 2
  Explanation: Blocks 0, 1 and 2 contain the address; block 2 has the longest prefix (/16).
  ```

  ### Example 2
  ```
  Input:  ip = "192.168.1.77", blocks = ["192.168.0.0/24", "172.16.0.0/12"]
  Output: -1
  Explanation: 192.168.1.77 is outside 192.168.0.0/24, which covers 192.168.0.0 to 192.168.0.255.
  ```

  ### Example 3
  ```
  Input:  ip = "172.20.5.9", blocks = ["172.20.5.16/28", "172.16.0.0/12", "172.31.255.255/12"]
  Output: 1
  Explanation: Block 0 covers only 172.20.5.16 to 172.20.5.31. Blocks 1 and 2 are the same /12
  network once host bits are ignored, so the earlier one wins.
  ```

  ### Constraints
  - `ip` is a valid dotted IPv4 address: four decimal octets from `0` to `255` without leading zeros.
  - `0 <= blocks.length <= 10^4`
  - Every block is `a.b.c.d/p` with a valid dotted address and `0 <= p <= 32`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: matching_cidr_index
  params:
    - {name: ip, type: "string"}
    - {name: blocks, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def matching_cidr_index(ip: str, blocks: list[str]) -> int:
        def to_int(dotted: str) -> int:
            value = 0
            for octet in dotted.split("."):
                value = value * 256 + int(octet)
            return value

        address = to_int(ip)
        best_index, best_prefix = -1, -1
        for index, block in enumerate(blocks):
            network, prefix_text = block.split("/")
            prefix = int(prefix_text)
            # Keep the top `prefix` bits; a /0 mask is zero and matches everything.
            mask = ((1 << 32) - 1) ^ ((1 << (32 - prefix)) - 1)
            if (to_int(network) & mask) == (address & mask) and prefix > best_prefix:
                best_index, best_prefix = index, prefix
        return best_index
  javascript: |
    function matchingCidrIndex(ip, blocks) {
      // Work with numbers in [0, 2^32) and avoid 32-bit signed bit operations.
      const toInt = (dotted) => dotted.split(".").reduce((acc, octet) => acc * 256 + Number(octet), 0);
      const address = toInt(ip);
      let bestIndex = -1;
      let bestPrefix = -1;
      blocks.forEach((block, index) => {
        const [network, prefixText] = block.split("/");
        const prefix = Number(prefixText);
        const size = 2 ** (32 - prefix); // addresses covered by the block
        const sameNetwork = Math.floor(toInt(network) / size) === Math.floor(address / size);
        if (sameNetwork && prefix > bestPrefix) {
          bestIndex = index;
          bestPrefix = prefix;
        }
      });
      return bestIndex;
    }
