expected_concepts:
  - "stack of section names indexed by depth"
  - "truncate the path when indentation decreases"
  - "split on the first colon only"
  - "skip blank and comment lines before computing depth"
  - "single pass, O(total characters)"
optimal_complexity: {time: "O(n * d)", space: "O(d)"}
rubric:
  excellent: "Keeps a path stack indexed by depth, truncates it on every non-skipped line, splits on the first colon only, trims values, and handles comments, blank lines, empty sections and multi-level dedents without special cases."
  good: "Correct stack-based solution that needs a nudge for one detail such as values containing colons, empty sections or trailing spaces after a section colon."
  weak: "Tracks only the previous line's indentation, splits on every colon, treats '#' inside values as a comment, or leaks a closed section into later keys."
  criteria:
    correctness: "All tests pass, including multi-level dedents, empty sections and repeated keys."
    efficiency: "One pass over the lines; each output costs time proportional to its path length."
    code_quality: "Clear separation of line classification (skip, section, leaf) from path maintenance; no regex trickery that hides the rules."
    edge_cases: "Empty input, comment-only files, values with colons or '#', trailing spaces after a section colon, dedent by several levels."
    communication: "Explains why the path is truncated to the current depth before the line is handled."
hints:
  - "For each line you need to know how deep it is and which sections enclose it; think about what changes when the indentation goes back up."
  - "Keep the names of the currently open sections in a list where position i holds the section at depth i; when a line arrives at depth d, everything at depth d or deeper is no longer open."
  - "Skip blank and comment lines first. For any other line, compute depth as leading spaces divided by two, cut the open-section list down to that depth, split the rest at the first colon, and either push the key as a new section (empty value) or emit the joined path plus key with the trimmed value."
followups:
  - "How would you detect and report inconsistent indentation with a line number?"
  - "How would you support list items written as '- value' under a key?"
  - "What would you change to produce environment variable names such as SERVER_TLS_ENABLED?"
  - "How would you merge two such files where the second overrides the first?"
common_errors:
  - "Splitting the line on every colon, which breaks URLs and times in values."
  - "Treating a '#' inside a value as the start of a comment."
  - "Only popping one section when the indentation decreases by several levels."
  - "Forgetting that a section opened with trailing spaces after the colon is still a section."
  - "Computing the depth of comment lines and letting them change the open sections."
