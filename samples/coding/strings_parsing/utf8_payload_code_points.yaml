expected_concepts:
  - "classify the lead byte with bit masks"
  - "validate continuation bytes as 10xxxxxx"
  - "decode the code point to detect overlong forms, surrogates and the U+10FFFF limit"
  - "bounds check for truncated sequences"
  - "single linear pass with constant memory"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Decodes each sequence with masks and shifts, checks length against the remaining bytes, validates every continuation byte, rejects overlong forms by comparing against the per-length minimum, rejects surrogates and values above U+10FFFF, and explains each rule with an example byte pattern."
  good: "Correct structural validation (lead bytes, continuation bytes, truncation) with one of the semantic checks (overlong, surrogate or maximum) added after a prompt or failing test."
  weak: "Only counts lead bytes, misses truncation at the end, or accepts overlong and surrogate encodings without recognising why they are dangerous."
  criteria:
    correctness: "All tests pass, including boundary code points that are valid and each kind of invalid sequence."
    efficiency: "One pass over the bytes with O(1) extra memory."
    code_quality: "Lead-byte classification expressed as a small table or clear branches; hex constants named or commented; no deeply nested special cases."
    edge_cases: "Empty input, truncated final sequence, stray continuation byte, overlong 2- and 3-byte forms, surrogates, U+10FFFF and just above it, lead bytes 0xF8 and above."
    communication: "Explains why overlong encodings are a security problem (they can smuggle characters such as / past filters)."
hints:
  - "Look at the top bits of each byte: they tell you whether it starts a sequence, how long that sequence is, or whether it is a continuation byte."
  - "Walk through the bytes one sequence at a time. From the lead byte you know how many continuation bytes must follow; check that they exist and all have the form one-zero followed by six payload bits. Structure alone is not enough, though, so also rebuild the actual code point."
  - "For each lead byte pick the length and its payload mask, reject it if it is a continuation byte or starts with five ones, make sure enough bytes remain, fold each continuation byte's low six bits into the value, then reject the value if it is below the minimum for that length, inside the surrogate range or above the maximum code point. Count one code point per accepted sequence and return minus one at the first failure."
followups:
  - "How would you repair invalid input with replacement characters instead of rejecting it?"
  - "How would you validate a stream that arrives in chunks that may split a sequence?"
  - "Why are overlong encodings and surrogates a security concern for input filters?"
  - "How could you speed this up for mostly-ASCII payloads?"
common_errors:
  - "Counting bytes or lead bytes without validating continuation bytes."
  - "Reading past the end of the array when the last sequence is truncated."
  - "Accepting overlong encodings such as 192 175 for the slash character."
  - "Forgetting the surrogate range or the U+10FFFF upper limit."
  - "Treating 0xF8 to 0xFF as five- or six-byte lead bytes."
