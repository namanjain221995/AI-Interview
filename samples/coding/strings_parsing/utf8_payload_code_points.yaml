slug: utf8_payload_code_points
title: UTF-8 Payload Code Points
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, network, security]
time_limit_minutes: 25
prompt_markdown: |
  ## UTF-8 Payload Code Points

  An ingestion API stores free-text fields from many clients and must reject malformed text before it
  reaches the database. You receive a field as raw bytes in `data` (integers `0` to `255`). Decide
  whether the bytes are **strictly valid UTF-8** and, if so, how many code points they encode.

  UTF-8 encodes each code point as a sequence of 1 to 4 bytes. The first (lead) byte says how long the
  sequence is; every following byte must be a **continuation byte** of the form `10xxxxxx`
  (`128` to `191`):

  | Lead byte bits | Sequence length | Payload bits |
  |----------------|-----------------|--------------|
  | `0xxxxxxx` | 1 | 7 |
  | `110xxxxx` | 2 | 5 + 6 = 11 |
  | `1110xxxx` | 3 | 4 + 6 + 6 = 16 |
  | `11110xxx` | 4 | 3 + 6 + 6 + 6 = 21 |

  The code point is the payload bits concatenated in order, from the lead byte to the last continuation
  byte. The bytes are invalid if any of these happens:

  - a byte that cannot start a sequence appears where a lead byte is expected (a continuation byte, or a
    byte starting with `11111`);
  - a sequence is cut short by the end of `data`, or one of its following bytes is not a continuation
    byte;
  - the encoding is **overlong**: the code point would fit in a shorter sequence (2-byte sequences must
    encode at least `U+0080`, 3-byte at least `U+0800`, 4-byte at least `U+10000`);
  - the code point is a **surrogate** (`U+D800` to `U+DFFF`) or is above `U+10FFFF`.

  Return the number of code points if `data` is valid, otherwise `-1`. Empty input is valid and returns `0`.

  ### Example 1
  ```
  Input:  data = [104, 105, 33]
  Output: 3
  ```

  ### Example 2
  ```
  Input:  data = [226, 130, 172, 49, 48]
  Output: 3
  Explanation: 226 130 172 is the three-byte encoding of U+20AC; 49 and 48 are one byte each, so there are 3
               code points.
  ```

  ### Example 3
  ```
  Input:  data = [192, 175]
  Output: -1
  Explanation: 192 175 would decode to U+002F, which fits in one byte, so this is an overlong encoding.
  ```

  ### Constraints
  - `0 <= data.length <= 10^4`
  - `0 <= data[i] <= 255`

  **Follow-up:** instead of rejecting the whole payload, how would you replace each invalid sequence with U+FFFD and continue?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: utf8_code_point_count
  params:
    - {name: data, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def utf8_code_point_count(data: list[int]) -> int:
        count = 0
        i, n = 0, len(data)
        while i < n:
            lead = data[i]
            if lead < 0x80:
                i += 1
                count += 1
                continue
            if 0xC0 <= lead <= 0xDF:
                length, value, minimum = 2, lead & 0x1F, 0x80
            elif 0xE0 <= lead <= 0xEF:
                length, value, minimum = 3, lead & 0x0F, 0x800
            elif 0xF0 <= lead <= 0xF7:
                length, value, minimum = 4, lead & 0x07, 0x10000
            else:
                return -1
            if i + length > n:
                return -1
            for k in range(1, length):
                byte = data[i + k]
                if byte & 0xC0 != 0x80:
                    return -1
                value = (value << 6) | (byte & 0x3F)
            if value < minimum or value > 0x10FFFF or 0xD800 <= value <= 0xDFFF:
                return -1
            i += length
            count += 1
        return count
  javascript: |
    function utf8CodePointCount(data) {
      let count = 0;
      let i = 0;
      const n = data.length;
      while (i < n) {
        const lead = data[i];
        if (lead < 0x80) {
          i++;
          count++;
          continue;
        }
        let length, value, minimum;
        if (lead >= 0xc0 && lead <= 0xdf) [length, value, minimum] = [2, lead & 0x1f, 0x80];
        else if (lead >= 0xe0 && lead <= 0xef) [length, value, minimum] = [3, lead & 0x0f, 0x800];
        else if (lead >= 0xf0 && lead <= 0xf7) [length, value, minimum] = [4, lead & 0x07, 0x10000];
        else return -1;
        if (i + length > n) return -1;
        for (let k = 1; k < length; k++) {
          const byte = data[i + k];
          if ((byte & 0xc0) !== 0x80) return -1;
          value = (value << 6) | (byte & 0x3f);
        }
        if (value < minimum || value > 0x10ffff || (value >= 0xd800 && value <= 0xdfff)) return -1;
        i += length;
        count++;
      }
      return count;
    }
