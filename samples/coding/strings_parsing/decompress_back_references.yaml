version: 1
slug: decompress_back_references
title: Decompress Back References
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, network]
time_limit_minutes: 20
prompt_markdown: |
  ## Decompress Back References

  A log archiver saves space by replacing repeated text with **back references** into the text it has
  already produced. Write the decompressor. Read `data` from left to right and build the output:

  - `<d,l>` (a `<`, a positive integer `d`, a comma, a positive integer `l`, then `>`) means: go back `d`
    characters from the current end of the output and copy `l` characters from there, one at a time,
    appending each to the output. `l` may be larger than `d`; the copy then continues into characters
    it has just produced, so `a<1,3>` produces `aaaa`.
  - `<<` is an escaped literal `<`.
  - Every other character, including `>` and `,` outside a back reference, is copied literally.

  The input is always valid: a `<` is either part of `<<` or starts a back reference, numbers have no
  leading zeros or spaces, and `d` never exceeds the length of the output produced so far.
  Return the decompressed text.

  ### Example 1
  ```
  Input:  data = "ab<2,4>c"
  Output: "abababc"
  Explanation: Starting 2 characters back, copy 4 characters: a, b, then the a and b just written.
  ```

  ### Example 2
  ```
  Input:  data = "deploy-<7,6>!"
  Output: "deploy-deploy!"
  ```

  ### Example 3
  ```
  Input:  data = "x<<y<3,2>"
  Output: "x<yx<"
  Explanation: "<<" writes one "<"; the back reference then copies "x<".
  ```

  ### Constraints
  - `0 <= data.length <= 10^4`
  - The decompressed output has at most `10^5` characters.
  - `data` contains printable ASCII characters only.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: decompress_backrefs
  params:
    - {name: data, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def decompress_backrefs(data: str) -> str:
        out: list[str] = []
        i, n = 0, len(data)
        while i < n:
            ch = data[i]
            if ch != "<":
                out.append(ch)
                i += 1
            elif data[i + 1] == "<":
                out.append("<")
                i += 2
            else:
                close = data.index(">", i)
                distance, length = (int(part) for part in data[i + 1:close].split(","))
                start = len(out) - distance
                for k in range(length):
                    out.append(out[start + k])  # may read characters appended in this loop
                i = close + 1
        return "".join(out)
  javascript: |
    function decompressBackrefs(data) {
      const out = [];
      let i = 0;
      while (i < data.length) {
        const ch = data[i];
        if (ch !== "<") {
          out.push(ch);
          i++;
        } else if (data[i + 1] === "<") {
          out.push("<");
          i += 2;
        } else {
          const close = data.indexOf(">", i);
          const [distance, length] = data.slice(i + 1, close).split(",").map(Number);
          const start = out.length - distance;
          for (let k = 0; k < length; k++) out.push(out[start + k]);
          i = close + 1;
        }
      }
      return out.join("");
    }
tests:
  - {id: t1, args: ["ab<2,4>c"], expected: "abababc", description: "Example 1 - overlapping copy longer than the distance"}
  - {id: t2, args: ["deploy-<7,6>!"], expected: "deploy-deploy!", description: "Example 2 - plain non-overlapping copy"}
  - {id: t3, args: ["x<<y<3,2>"], expected: "x<yx<", description: "Example 3 - escaped < inside the output that a reference later copies"}
  - {id: t4, hidden: true, args: [""], expected: "", description: "Empty input"}
  - {id: t5, hidden: true, args: ["a<1,9>"], expected: "aaaaaaaaaa", description: "Distance 1 run-length style expansion"}
  - {id: t6, hidden: true, args: ["ok > 3, done"], expected: "ok > 3, done", description: "Literal > and comma outside any reference"}
  - {id: t7, hidden: true, args: ["<<<1,3>"], expected: "<<<<", description: "Escape immediately followed by a reference that copies the escaped character"}
  - {id: t8, hidden: true, args: ["<<5,2>"], expected: "<5,2>", description: "Escaped < followed by text that only looks like a reference"}
  - {id: t9, hidden: true, args: ["a<<<<b"], expected: "a<<b", description: "Two consecutive escapes"}
  - {id: t10, hidden: true, args: ["0123456789<10,10><20,20>"], expected: "0123456789012345678901234567890123456789", description: "Multi-digit distance and length"}
  - {id: t11, hidden: true, args: ["GET /v1/jobs;<13,12>/42;<16,15>/logs"], expected: "GET /v1/jobs;GET /v1/jobs/42;GET /v1/jobs/42/logs", description: "References that copy text produced by an earlier reference"}
  - {id: t12, hidden: true, args: ["ab<2,2><4,4><8,8><16,16><32,32><64,64><128,128><256,256><512,512>"], expected: "", description: "Stress - repeated doubling to 1024 characters"}
expected_concepts:
  - single left-to-right scan with a small parser for the reference syntax
  - appending to a growable buffer
  - overlapping copy done character by character
  - distinguishing the escape from a reference by the next character
optimal_complexity: {time: O(input length + output length), space: O(output length)}
rubric:
  excellent: Scans once, distinguishes the escape from a reference by looking at the next character, parses both numbers, copies one character at a time so overlapping references work, uses a growable buffer instead of repeated string concatenation, and explains the overlap case with an example.
  good: Correct decoder that needs a hint or a failing test to handle overlapping copies or the escape followed by digits.
  weak: Copies the slice in one step so overlapping references come out short, treats every < as a reference, or rebuilds the whole output string on each step.
  criteria:
    correctness: All tests pass, including overlapping copies, consecutive escapes and references that copy earlier expansions.
    efficiency: Linear in input plus output size; no quadratic string rebuilding.
    code_quality: The three token kinds are handled in clearly separated branches.
    edge_cases: Empty input, distance 1, escapes next to references, multi-digit numbers.
    communication: Explains why a single slice copy is wrong when the length exceeds the distance.
hints:
  - Process the input left to right; at each position decide whether you are looking at an ordinary character, the escape or the start of a reference.
  - After a less-than sign, the next character tells you which case you are in. For a reference, find the closing bracket and read the two numbers between it and the opening bracket.
  - Keep the output in a growable buffer; for a reference, compute the start index as the current output length minus the distance, then append characters one by one from that start for the given length, so when the length exceeds the distance the loop naturally reads characters it has just appended.
followups:
  - How would you write the compressor that produces such references for repeated text?
  - How would you limit memory if only a sliding window of the last 32 KB may be referenced?
  - How would you validate untrusted input and reject references that point before the start?
  - How would the escape rule change if back references used a different delimiter?
common_errors:
  - Copying the referenced range as one slice, which truncates overlapping copies.
  - Treating the second < of an escape as the start of a reference.
  - Building the output by string concatenation in a loop, which is quadratic in some languages.
  - Off-by-one errors when computing the start index from the distance.
