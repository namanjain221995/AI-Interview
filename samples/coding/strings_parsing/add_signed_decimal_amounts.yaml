slug: add_signed_decimal_amounts
title: Add Signed Decimal Amounts
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Add Signed Decimal Amounts

  A ledger service stores money amounts as **decimal strings** because binary floating point cannot
  represent values such as `0.1` exactly, and some amounts are far larger than any built-in integer type.
  Write the routine that adds two such amounts exactly.

  Each input amount has this shape:

  - an optional leading `-` sign,
  - an integer part of **one or more digits** (it may contain leading zeros, such as `007`),
  - optionally a `.` followed by a fractional part of **one or more digits** (it may contain trailing
    zeros, such as `.500`).

  Return the exact sum `a + b` as a **normalised** decimal string:

  - no leading zeros in the integer part, except a single `0` when the integer part is zero (`0.25`, not
    `.25` or `00.25`);
  - no trailing zeros in the fractional part, and no `.` at all when the fractional part is empty;
  - a leading `-` only when the sum is negative, so a zero result is always `"0"` (never `"-0"`).

  Work digit by digit; do not convert the whole amount to a floating-point, big-integer or decimal type.

  ### Example 1
  ```
  Input:  a = "-12.50", b = "3.075"
  Output: "-9.425"
  ```

  ### Example 2
  ```
  Input:  a = "999.99", b = "0.01"
  Output: "1000"
  Explanation: The carry adds a new integer digit and the fractional part becomes all zeros.
  ```

  ### Example 3
  ```
  Input:  a = "5.5", b = "-5.50"
  Output: "0"
  ```

  ### Constraints
  - The integer part of each amount has `1` to `500` digits.
  - The fractional part, when present, has `1` to `500` digits.
  - Inputs are always well formed and may represent zero with a sign, such as `"-0.00"`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: add_decimal_strings
  params:
    - {name: a, type: string}
    - {name: b, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def add_decimal_strings(a: str, b: str) -> str:
        def parse(s: str) -> tuple[bool, str, str]:
            negative = s.startswith("-")
            if negative:
                s = s[1:]
            whole, _, frac = s.partition(".")
            return negative, whole, frac

        def compare(x: str, y: str) -> int:
            if len(x) != len(y):
                return 1 if len(x) > len(y) else -1
            return (x > y) - (x < y)

        def add(x: str, y: str) -> str:
            out, carry = [], 0
            i, j = len(x) - 1, len(y) - 1
            while i >= 0 or j >= 0 or carry:
                total = carry
                if i >= 0:
                    total += ord(x[i]) - 48
                    i -= 1
                if j >= 0:
                    total += ord(y[j]) - 48
                    j -= 1
                out.append(chr(48 + total % 10))
                carry = total // 10
            return "".join(reversed(out))

        def subtract(x: str, y: str) -> str:  # requires x >= y
            out, borrow = [], 0
            j = len(y) - 1
            for i in range(len(x) - 1, -1, -1):
                digit = ord(x[i]) - 48 - borrow
                if j >= 0:
                    digit -= ord(y[j]) - 48
                    j -= 1
                borrow = 1 if digit < 0 else 0
                out.append(chr(48 + digit + 10 * borrow))
            return "".join(reversed(out))

        neg_a, whole_a, frac_a = parse(a)
        neg_b, whole_b, frac_b = parse(b)
        scale = max(len(frac_a), len(frac_b))
        # Both amounts as integers in units of 10^-scale, without leading zeros.
        x = (whole_a + frac_a.ljust(scale, "0")).lstrip("0")
        y = (whole_b + frac_b.ljust(scale, "0")).lstrip("0")
        if neg_a == neg_b:
            magnitude, negative = add(x, y), neg_a
        else:
            order = compare(x, y)
            if order == 0:
                return "0"
            if order > 0:
                magnitude, negative = subtract(x, y), neg_a
            else:
                magnitude, negative = subtract(y, x), neg_b
        magnitude = magnitude.lstrip("0")
        if not magnitude:
            return "0"
        magnitude = magnitude.rjust(scale + 1, "0")
        cut = len(magnitude) - scale
        whole = magnitude[:cut].lstrip("0") or "0"
        frac = magnitude[cut:].rstrip("0")
        result = whole + ("." + frac if frac else "")
        return "-" + result if negative else result
  javascript: |
    function addDecimalStrings(a, b) {
      const parse = (s) => {
        const negative = s.startsWith("-");
        if (negative) s = s.slice(1);
        const dot = s.indexOf(".");
        return dot < 0 ? [negative, s, ""] : [negative, s.slice(0, dot), s.slice(dot + 1)];
      };
      const stripLeft = (s) => s.replace(/^0+/, "");
      const compare = (x, y) => {
        if (x.length !== y.length) return x.length > y.length ? 1 : -1;
        return x === y ? 0 : x > y ? 1 : -1;
      };
      const add = (x, y) => {
        const out = [];
        let carry = 0;
        for (let i = x.length - 1, j = y.length - 1; i >= 0 || j >= 0 || carry; i--, j--) {
          let total = carry;
          if (i >= 0) total += x.charCodeAt(i) - 48;
          if (j >= 0) total += y.charCodeAt(j) - 48;
          out.push(total % 10);
          carry = Math.floor(total / 10);
        }
        return out.reverse().join("");
      };
      const subtract = (x, y) => {
        const out = [];
        let borrow = 0;
        for (let i = x.length - 1, j = y.length - 1; i >= 0; i--, j--) {
          let digit = x.charCodeAt(i) - 48 - borrow;
          if (j >= 0) digit -= y.charCodeAt(j) - 48;
          borrow = digit < 0 ? 1 : 0;
          out.push(digit + 10 * borrow);
        }
        return out.reverse().join("");
      };
      const [negA, wholeA, fracA] = parse(a);
      const [negB, wholeB, fracB] = parse(b);
      const scale = Math.max(fracA.length, fracB.length);
      const x = stripLeft(wholeA + fracA.padEnd(scale, "0"));
      const y = stripLeft(wholeB + fracB.padEnd(scale, "0"));
      let magnitude;
      let negative;
      if (negA === negB) {
        magnitude = add(x, y);
        negative = negA;
      } else {
        const order = compare(x, y);
        if (order === 0) return "0";
        if (order > 0) {
          magnitude = subtract(x, y);
          negative = negA;
        } else {
          magnitude = subtract(y, x);
          negative = negB;
        }
      }
      magnitude = stripLeft(magnitude);
      if (magnitude === "") return "0";
      magnitude = magnitude.padStart(scale + 1, "0");
      const cut = magnitude.length - scale;
      const whole = stripLeft(magnitude.slice(0, cut)) || "0";
      const frac = magnitude.slice(cut).replace(/0+$/, "");
      const result = whole + (frac ? "." + frac : "");
      return negative ? "-" + result : result;
    }
