  - {id: t5, hidden: true, args: ["007.100", "-0.1"], expected: "7", description: "Leading zeros and trailing fractional zeros in the input are normalised away"}
  - {id: t6, hidden: true, args: ["-3", "10"], expected: "7", description: "Mixed signs where the second operand has the larger magnitude; result positive"}
  - {id: t7, hidden: true, args: ["0.001", "-0.002"], expected: "-0.001", description: "Negative result below one keeps the single 0 before the point"}
  - {id: t8, hidden: true, args: ["-1", "-999999999999999999999.9"], expected: "-1000000000000000000000.9", description: "Both negative with a carry chain; value exceeds 64-bit integers"}
  - {id: t9, hidden: true, args: ["100", "-99.999"], expected: "0.001", description: "Borrow ripples through every digit including the integer part"}
  - {id: t10, hidden: true, args: ["123456789012345678901234567890.5", "-123456789012345678901234567890.25"], expected: "0.25", description: "Huge operands that almost cancel; only the fraction survives"}
  - {id: t11, hidden: true, args: ["-0.5", "0.25"], expected: "-0.25", description: "Negative fraction-only result"}
  - {id: t12, hidden: true, args: [".", "0."], expected: "", description: "Stress - 500 integer digits and 300 fractional digits, carry runs through all 800 digits"}
expected_concepts:
  - aligning fractional parts by padding with zeros
  - schoolbook addition with carry and subtraction with borrow
  - comparing magnitudes to pick the sign when the signs differ
  - normalising leading zeros, trailing zeros and negative zero
optimal_complexity: {time: O(n + m), space: O(n + m)}
rubric:
  excellent: Pads the fractions to a common length, treats both amounts as digit strings, adds when the signs match and otherwise subtracts the smaller magnitude from the larger, then normalises the result (leading zeros, trailing zeros, empty fraction, negative zero) and explains the linear cost.
  good: Correct digit-by-digit arithmetic for most cases; needs a test run to fix one normalisation rule such as -0 or a trailing point.
  weak: Converts to floating point or relies on a big-number library, mishandles mixed signs, or returns un-normalised strings such as "-0" or "1000.00".
  criteria:
    correctness: All tests pass, including cancellation to zero, borrow chains and carries that add a digit.
    efficiency: Linear in the number of digits; no repeated string concatenation in an inner loop.
    code_quality: Small helpers for parse, compare, add and subtract instead of one tangled loop.
    edge_cases: Signed zero inputs, leading zeros, fraction-only results and very long operands.
    communication: Explains why floating point is unacceptable for a ledger and how the sign of the result is decided.
hints:
  - Think of each amount as a sign plus an unsigned digit string; if both fractional parts had the same length, where would the decimal point be in the result?
  - Pad the shorter fractional part with zeros so both amounts are integers in the same smallest unit; then the problem is adding or subtracting two non-negative digit strings depending on whether the signs match.
  - When the signs match, add the magnitudes with a carry from right to left and keep the sign; when they differ, compare the magnitudes by length and then lexicographically, subtract the smaller from the larger with a borrow, and take the sign of the larger. Finally reinsert the point, strip leading integer zeros and trailing fractional zeros, drop an empty fraction and return plain zero without a sign.
followups:
  - How would you extend this to subtract or multiply two amounts?
  - How would you round the result to two decimal places using banker's rounding?
  - How would you sum a whole column of a million amounts efficiently?
  - Why might a database column of type NUMERIC still be preferable to strings in production?
common_errors:
  - Parsing the amounts as floating point, which loses precision on long or fractional values.
  - Returning "-0" or "-0.0" when the amounts cancel.
  - Forgetting to align the fractional parts before adding, which misplaces digits.
  - Subtracting the second magnitude from the first without checking which is larger.
  - Leaving a trailing "." or trailing fractional zeros in the result.
