  - {id: t2, args: ["999.99", "0.01"], expected: "1000", description: "Example 2 - carry creates a new digit and the fraction disappears"}
  - {id: t3, args: ["5.5", "-5.50"], expected: "0", description: "Example 3 - exact cancellation returns 0"}
