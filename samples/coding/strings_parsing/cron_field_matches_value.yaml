slug: cron_field_matches_value
title: "Cron Field Matches Value"
difficulty: medium
competency_keys: [problem_solving, code_quality]
role_tags: [devops, sre, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Cron Field Matches Value

  A job scheduler stores each schedule as cron-style fields (minute, hour, day of month, and so on).
  To decide whether a job fires at a given moment, it checks each field separately. Your task is that
  check for **one** field.

  A field is a comma-separated list of **items**, and the field selects a value when **any** item
  selects it. Each item has one of these forms (`N`, `A`, `B` and `S` are non-negative integers):

  | item | selects |
  |------|---------|
  | `*` | every value from `min_value` to `max_value` |
  | `N` | only `N` |
  | `A-B` | every value from `A` to `B` inclusive |
  | `*/S` | `min_value`, `min_value + S`, `min_value + 2S`, ... up to `max_value` |
  | `A-B/S` | `A`, `A + S`, `A + 2S`, ... up to `B` |
  | `N/S` | `N`, `N + S`, `N + 2S`, ... up to `max_value` |

  Steps always count from the **start** of their range, not from zero. For example, with a day-of-month
  field (`min_value = 1`), `*/2` selects 1, 3, 5, ...

  Return `true` if `value` is selected by the field, otherwise `false`.

  ### Example 1
  ```
  Input:  field = "*/15", value = 30, min_value = 0, max_value = 59
  Output: true
  Explanation: */15 on minutes selects 0, 15, 30 and 45.
  ```

  ### Example 2
  ```
  Input:  field = "1-5,22", value = 7, min_value = 0, max_value = 23
  Output: false
  Explanation: The field selects hours 1 to 5 and 22.
  ```

  ### Example 3
  ```
  Input:  field = "5/20", value = 45, min_value = 0, max_value = 59
  Output: true
  Explanation: 5/20 selects 5, 25 and 45.
  ```

  ### Constraints
  - `0 <= min_value <= value <= max_value <= 10^4`
  - `field` has between 1 and 100 items, has no spaces and is well formed.
  - In every item, `min_value <= N <= max_value`, `min_value <= A <= B <= max_value` and `1 <= S <= 10^4`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cron_field_matches
  params:
    - {name: field, type: "string"}
    - {name: value, type: "int"}
    - {name: min_value, type: "int"}
    - {name: max_value, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def cron_field_matches(field: str, value: int, min_value: int, max_value: int) -> bool:
        for item in field.split(","):
            base, _, step_text = item.partition("/")
            step = int(step_text) if step_text else None
            if base == "*":
                start, end = min_value, max_value
            elif "-" in base:
                low, high = base.split("-")
                start, end = int(low), int(high)
            else:
                start = int(base)
                # A single value selects just itself; with a step it runs to the maximum.
                end = max_value if step is not None else start
            step = step or 1
            if start <= value <= end and (value - start) % step == 0:
                return True
        return False
  javascript: |
    function cronFieldMatches(field, value, minValue, maxValue) {
      for (const item of field.split(",")) {
        const [base, stepText] = item.split("/");
        const hasStep = stepText !== undefined;
        let start;
        let end;
        if (base === "*") {
          start = minValue;
          end = maxValue;
        } else if (base.includes("-")) {
          const [low, high] = base.split("-");
          start = Number(low);
          end = Number(high);
        } else {
          start = Number(base);
          end = hasStep ? maxValue : start;
        }
        const step = hasStep ? Number(stepText) : 1;
        if (value >= start && value <= end && (value - start) % step === 0) return true;
      }
      return false;
    }
tests:
  - {id: t1, args: ["*/15", 30, 0, 59], expected: true, description: "Example 1 - wildcard with a step"}
  - {id: t2, args: ["1-5,22", 7, 0, 23], expected: false, description: "Example 2 - range plus a single value, no match"}
  - {id: t3, args: ["5/20", 45, 0, 59], expected: true, description: "Example 3 - start value with a step runs to the maximum"}
  - {id: t4, hidden: true, args: ["*", 0, 0, 59], expected: true, description: "Bare wildcard at the lower bound"}
  - {id: t5, hidden: true, args: ["*/2", 2, 1, 31], expected: false, description: "Step counts from min_value 1, so even days are not selected"}
  - {id: t6, hidden: true, args: ["*/2", 31, 1, 31], expected: true, description: "Step from min_value reaches the upper bound exactly"}
  - {id: t7, hidden: true, args: ["10-50/15", 55, 0, 59], expected: false, description: "Value is aligned to the step but beyond the end of the range"}
  - {id: t8, hidden: true, args: ["10-50/15", 40, 0, 59], expected: true, description: "Value inside a stepped range"}
  - {id: t9, hidden: true, args: ["3/5", 2, 0, 59], expected: false, description: "Value below the start of a stepped item"}
  - {id: t10, hidden: true, args: ["0,30,45", 15, 0, 59], expected: false, description: "List of single values that does not include the value"}
  - {id: t11, hidden: true, args: ["1-5/2,8,10-12", 11, 0, 23], expected: true, description: "Later item in a mixed list matches"}
  - {id: t12, hidden: true, args: ["5", 50, 0, 59], expected: false, description: "A plain number selects only itself, not a range up to the maximum"}
  - {id: t13, hidden: true, args: ["2-2/7,9/100", 9, 1, 12], expected: true, description: "Degenerate one-value range and a step larger than the field"}
expected_concepts:
  - "tokenising on commas, then on '/' and '-'"
  - "normalising every item to a start, end and step"
  - "membership test with range bounds and modular arithmetic"
  - "steps anchored at the start of the range, not at zero"
  - "no need to enumerate the selected values"
optimal_complexity: {time: "O(k) for a field with k characters", space: "O(k) for the split items (O(1) with an in-place scan)"}
rubric:
  excellent: "Normalises each item into start, end and step (wildcard uses the field bounds, N/S runs to the maximum, plain N is a single value), tests membership with bounds plus a modulo anchored at the start, and keeps the parser readable with small helpers; mentions validation and the full five-field match as extensions."
  good: "Correct parsing of all forms, possibly enumerating each item's values, or needs a nudge on N/S or the step anchor."
  weak: "Anchors steps at zero, treats N/S as a single value, ignores min_value, or only handles one item per field."
  criteria:
    correctness: "All tests pass, including steps from a non-zero minimum, values past a range's end and plain single values."
    efficiency: "Each item is checked arithmetically in constant time instead of enumerating its values."
    code_quality: "Parsing is separated from matching; item forms are normalised to one representation."
    edge_cases: "Wildcards at the bounds, one-value ranges, steps larger than the field, values below a stepped start."
    communication: "Restates the item grammar and confirms the anchor of the step before coding."
hints:
  - "Every item form can be described by the same three numbers. Which three?"
  - "Turn each item into a start, an end and a step. A wildcard uses the field's bounds, a range uses its own bounds, a plain number is a range of one value, a number with a step runs to the field's maximum, and a missing step means one."
  - "Split the field on commas. For each item, separate the optional step after the slash, then work out the start and end from the part before it according to the table. The value is selected by that item when it lies between start and end inclusive and its distance from the start is a multiple of the step. Return true as soon as any item selects the value."
followups:
  - "How would you validate a field and report a useful error for input such as 5-2 or */0?"
  - "How would you compute the next time a full five-field schedule fires after a given moment?"
  - "How would you support names such as MON-FRI or JAN?"
  - "Many cron implementations treat the day-of-month and day-of-week fields with OR logic; how would that change your design?"
common_errors:
  - "Counting the step from zero instead of from the start of the range."
  - "Treating N/S as only the value N."
  - "Treating a plain N as running to the maximum."
  - "Using min 0 for every field, which breaks fields such as day of month that start at 1."
  - "Enumerating every selected value, which is slower and easy to get off by one."
