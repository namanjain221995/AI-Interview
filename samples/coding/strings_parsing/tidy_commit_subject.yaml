version: 1
slug: tidy_commit_subject
title: "Tidy a Commit Subject"
difficulty: easy
competency_keys: [code_quality, problem_solving]
role_tags: [devops, fullstack, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Tidy a Commit Subject

  A team's commit-msg hook rewrites the subject line of every commit so the history looks consistent.
  Write `tidy_commit_subject(subject)` that applies these steps **in order** (whitespace means spaces and
  tabs):

  1. Remove leading and trailing whitespace.
  2. Replace every run of one or more whitespace characters inside the text with a single space.
  3. Remove the tail made of `.` characters and spaces: repeatedly delete the last character while it is
     a `.` or a space. Periods elsewhere (such as in `2.4.1` or `e.g.`) are kept.
  4. If the first character is now a lower-case ASCII letter (`a`-`z`), change it to upper case. No other
     character changes case.

  Return the tidied subject. If nothing is left, return the empty string `""`.

  ### Example 1
  ```
  Input:  subject = "  fix   retry\tlogic in uploader.  "
  Output: "Fix retry logic in uploader"
  ```

  ### Example 2
  ```
  Input:  subject = "Bump version to 2.4.1..."
  Output: "Bump version to 2.4.1"
  ```

  ### Example 3
  ```
  Input:  subject = " . . ."
  Output: ""
  Explanation: removing trailing periods and whitespace leaves nothing
  ```

  ### Constraints
  - `0 <= subject.length <= 10^4`
  - `subject` consists of printable ASCII characters and tabs.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: tidy_commit_subject
  params:
    - {name: subject, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def tidy_commit_subject(subject: str) -> str:
        words = [w for w in subject.replace("\t", " ").split(" ") if w]
        text = " ".join(words)  # trimmed, internal whitespace runs collapsed to one space
        end = len(text)
        while end > 0 and text[end - 1] in ". ":
            end -= 1
        text = text[:end]
        if text and "a" <= text[0] <= "z":
            text = text[0].upper() + text[1:]
        return text
  javascript: |
    function tidyCommitSubject(subject) {
      const words = subject.replace(/\t/g, " ").split(" ").filter((w) => w.length > 0);
      let text = words.join(" ");
      let end = text.length;
      while (end > 0 && (text[end - 1] === "." || text[end - 1] === " ")) end--;
      text = text.slice(0, end);
      if (text.length > 0 && text[0] >= "a" && text[0] <= "z") {
        text = text[0].toUpperCase() + text.slice(1);
      }
      return text;
    }
tests:
  - {id: t1, args: ["  fix   retry\tlogic in uploader.  "], expected: "Fix retry logic in uploader", description: "Example 1 - trim, collapse spaces and a tab, drop trailing period, capitalise"}
  - {id: t2, args: ["Bump version to 2.4.1..."], expected: "Bump version to 2.4.1", description: "Example 2 - dots inside the text are kept, trailing dots removed"}
  - {id: t3, args: [" . . ."], expected: "", description: "Example 3 - subject made only of periods and spaces becomes empty"}
  - {id: t4, hidden: true, args: [""], expected: "", description: "Empty subject stays empty"}
  - {id: t5, hidden: true, args: ["Refactor billing client"], expected: "Refactor billing client", description: "Already tidy - unchanged"}
  - {id: t6, hidden: true, args: ["update docs . .. ."], expected: "Update docs", description: "Mix of periods and spaces at the end is removed completely"}
  - {id: t7, hidden: true, args: ["3rd-party SDK upgrade."], expected: "3rd-party SDK upgrade", description: "First character is a digit - no capitalisation"}
  - {id: t8, hidden: true, args: ["...wip: tidy logs"], expected: "...wip: tidy logs", description: "Leading periods are not trailing and stay; first character is not a letter"}
  - {id: t9, hidden: true, args: ["\t\t a \t"], expected: "A", description: "Single lower-case letter surrounded by tabs and spaces"}
  - {id: t10, hidden: true, args: ["aPI: Use e.g. JSON\t\t\tbodies"], expected: "API: Use e.g. JSON bodies", description: "Only the first character changes case; inner 'e.g.' kept; tab run collapsed"}
  - {id: t11, hidden: true, args: ["\t \t"], expected: "", description: "Whitespace-only subject becomes empty"}
  - {id: t12, hidden: true, args: ["\t flaky\tworker  to v2.3.1 \t e.g. v2.3.1 TTL \t to \t TTL \t to  upload retry  test API \t API worker  cache  TTL \t retry\tupload \t worker\tAPI upload fix fix \t to upload \t TTL e.g. retry  ...  v2.3.1 retry  test test e.g. \t test  fix fix  cache TTL  to add\ttest  TTL\tTTL retry \t upload  e.g. TTL\t... ...\tretry\tflaky  fix  e.g. fix\tadd \t retry  upload \t worker\t... worker\tretry add \t API \t flaky\tTTL  e.g. fix  retry \t test\t...\tto\tto\tadd API  worker  retry  add add \t upload \t worker API\tworker  flaky\tto TTL\tTTL retry \t flaky  TTL \t e.g.  cache\tAPI \t v2.3.1 add\ttest  to to  ... upload  flaky \t e.g. \t retry  test \t e.g.\ttest cache e.g. \t test\ttest cache\tretry  TTL  retry TTL \t flaky flaky cache done . .. .\t"], expected: "Flaky worker to v2.3.1 e.g. v2.3.1 TTL to TTL to upload retry test API API worker cache TTL retry upload worker API upload fix fix to upload TTL e.g. retry ... v2.3.1 retry test test e.g. test fix fix cache TTL to add test TTL TTL retry upload e.g. TTL ... ... retry flaky fix e.g. fix add retry upload worker ... worker retry add API flaky TTL e.g. fix retry test ... to to add API worker retry add add upload worker API worker flaky to TTL TTL retry flaky TTL e.g. cache API v2.3.1 add test to to ... upload flaky e.g. retry test e.g. test cache e.g. test test cache retry TTL retry TTL flaky flaky cache done", description: "About 1000 characters with mixed whitespace runs and a messy tail (stress)"}
expected_concepts:
  - "normalising whitespace by splitting and joining"
  - "trimming a tail made of a set of characters with a backwards scan"
  - "conditional capitalisation of only the first character"
  - "applying ordered transformation steps exactly as specified"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Applies the four steps in the stated order with simple, correct building blocks, handles tabs, removes the entire tail of periods and spaces, capitalises only a leading a-z letter and handles empty results."
  good: "Correct result with a nudge on one detail such as tabs, a tail like ' . .' or a subject that becomes empty."
  weak: "Removes periods inside the text, only removes one trailing period, upper-cases the whole first word or fails on an empty or whitespace-only subject."
  criteria:
    correctness: "All tests pass, including mixed whitespace, inner periods and subjects that become empty."
    efficiency: "Linear in the length of the subject; no repeated rebuilding of the whole string in a loop."
    code_quality: "Each step is visible in the code in the same order as the specification."
    edge_cases: "Empty, whitespace-only and period-only subjects, a leading digit or symbol and a single letter."
    communication: "Walks through the steps on an example and explains why their order matters."
hints:
  - "Treat the specification as a small pipeline and implement the steps one at a time, checking each on the first example."
  - "Splitting on whitespace and dropping the empty pieces gives you the words; joining them with single spaces handles both trimming and collapsing at once, as long as tabs are treated like spaces."
  - "After joining, scan backwards from the end while the character is a period or a space and cut the string there; finally, if the string is not empty and starts with a letter from a to z, replace just that first character with its upper-case form."
followups:
  - "How would you also enforce a maximum subject length without cutting a word in half?"
  - "What would change if the subject could contain non-ASCII letters that also need capitalising?"
  - "How would you test the hook so that it never changes an already tidy subject?"
common_errors:
  - "Forgetting that tabs count as whitespace, so tab runs survive."
  - "Removing only one trailing period, or periods but not the spaces between them."
  - "Removing every period in the subject, which breaks version numbers and abbreviations."
  - "Indexing the first character of an empty result, or capitalising more than the first character."
