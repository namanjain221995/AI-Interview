slug: expand_test_data_repeat_groups
title: Expand Test Data Repeat Groups
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [qa, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Expand Test Data Repeat Groups

  A QA fixture generator stores long, repetitive payloads in a compact pattern so test files stay
  readable. Write `expand_repeat_groups(pattern)` that returns the fully expanded payload.

  - A lowercase letter stands for itself.
  - A group `( ... )*N` stands for the expansion of its contents repeated `N` times. `N` is a decimal
    number from `1` to `99` with no leading zeros, and it always follows the closing parenthesis directly.
  - Groups can be nested to any depth and may be empty (`()*4` expands to `""`).

  The pattern is always well formed.

  ### Example 1
  ```
  Input:  pattern = "a(b(c)*2)*3"
  Output: "abccbccbcc"
  Explanation: "(c)*2" is "cc", so the outer group repeats "bcc" three times after the leading "a".
  ```

  ### Example 2
  ```
  Input:  pattern = "(xy)*3z"
  Output: "xyxyxyz"
  ```

  ### Example 3
  ```
  Input:  pattern = "ok"
  Output: "ok"
  ```

  ### Constraints
  - `0 <= pattern.length <= 1000`
  - `pattern` contains lowercase letters, `(`, `)`, `*` and digits, and is well formed.
  - The expanded payload has at most `10^4` characters.

  **Follow-up:** how would you report the expanded length without building the string, if it could be
  billions of characters long?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: expand_repeat_groups
  params:
    - {name: pattern, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def expand_repeat_groups(pattern: str) -> str:
        stack: list[list[str]] = [[]]  # one list of pieces per open group
        i, n = 0, len(pattern)
        while i < n:
            ch = pattern[i]
            if ch == "(":
                stack.append([])
                i += 1
            elif ch == ")":
                i += 2  # skip ')' and '*'
                start = i
                while i < n and pattern[i].isdigit():
                    i += 1
                times = int(pattern[start:i])
                body = "".join(stack.pop())
                stack[-1].append(body * times)
            else:
                stack[-1].append(ch)
                i += 1
        return "".join(stack[0])
  javascript: |
    function expandRepeatGroups(pattern) {
      const stack = [[]];
      const n = pattern.length;
      let i = 0;
      while (i < n) {
        const ch = pattern[i];
        if (ch === '(') {
          stack.push([]);
          i++;
        } else if (ch === ')') {
          i += 2;
          const start = i;
          while (i < n && pattern[i] >= '0' && pattern[i] <= '9') i++;
          const times = Number(pattern.slice(start, i));
          const body = stack.pop().join('');
          stack[stack.length - 1].push(body.repeat(times));
        } else {
          stack[stack.length - 1].push(ch);
          i++;
        }
      }
      return stack[0].join('');
    }
tests:
  - {id: t1, args: ["a(b(c)*2)*3"], expected: "abccbccbcc", description: "Example 1 - nested group"}
  - {id: t2, args: ["(xy)*3z"], expected: "xyxyxyz", description: "Example 2 - letters after a group"}
  - {id: t3, args: ["ok"], expected: "ok", description: "Example 3 - no groups"}
  - {id: t4, hidden: true, args: [""], expected: "", description: "Empty pattern"}
  - {id: t5, hidden: true, args: ["(a)*1"], expected: "a", description: "Repeat count of one"}
  - {id: t6, hidden: true, args: ["()*5q()*2"], expected: "q", description: "Empty groups expand to nothing"}
  - {id: t7, hidden: true, args: ["(ab)*12"], expected: "abababababababababababab", description: "Two-digit repeat count"}
  - {id: t8, hidden: true, args: ["((((z)*2)*2)*2)*2"], expected: "zzzzzzzzzzzzzzzz", description: "Deep nesting multiplies counts"}
  - {id: t9, hidden: true, args: ["(a)*2(b)*3c(d)*1"], expected: "aabbbcd", description: "Sibling groups and letters between them"}
  - {id: t10, hidden: true, args: ["x(y(z)*3w)*2v(u)*10"], expected: "xyzzzwyzzzwvuuuuuuuuuu", description: "Letters around nested groups at several levels"}
  - {id: t11, hidden: true, args: ["((ab)*10c)*30"], expected: "", description: "Stress - 630-character expansion"}
expected_concepts:
  - stack of partial results, one per open group
  - parsing a multi-digit repeat count after the closing parenthesis
  - building the result with a list of pieces instead of repeated string concatenation
  - recursion as an equivalent alternative to an explicit stack
optimal_complexity: {time: O(n + output), space: O(n + output)}
rubric:
  excellent: Uses an explicit stack (or clean recursive descent) where each open group collects its own pieces, parses multi-digit counts, handles empty groups and deep nesting, and relates the cost to the output size.
  good: Correct stack or recursive solution after fixing a parsing detail such as two-digit counts or text after a group.
  weak: Repeatedly searches for the innermost group and rewrites the string, mishandles nesting, or reads only one digit of the count.
  criteria:
    correctness: All tests pass, including nested, sibling, empty and two-digit groups.
    efficiency: Linear in the pattern plus the output; no repeated rescanning of the whole string.
    code_quality: Clear handling of the three token kinds and no fragile index arithmetic.
    edge_cases: Empty pattern, count of 1, empty group, deep nesting, letters before and after groups.
    communication: Explains why a stack matches the nesting and when the repetition happens.
hints:
  - Nested groups are closed in the reverse order they were opened - which data structure naturally matches that?
  - Keep a separate collection of pieces for every group that is currently open, including one for the top level; letters go into the innermost open group.
  - Push a new empty piece list on each opening parenthesis; on a closing parenthesis skip the star, read all following digits as the count, pop the innermost piece list, join it, repeat it count times and append the result to the list now on top; append letters to the top list, and join the bottom list at the end.
followups:
  - How would you compute only the expanded length, or the character at position k, without building the payload?
  - How would you validate a pattern that might be malformed and report the first error position?
  - What changes if counts can be larger than 99 and the output may not fit in memory?
  - How would you write this as a recursive-descent parser, and what is the risk with very deep nesting?
common_errors:
  - Reading only one digit of the repeat count, so "(ab)*12" repeats twice.
  - Appending a repeated group to the wrong level of the stack.
  - Building strings with repeated concatenation inside loops, which is quadratic.
  - Not handling letters that follow a closed group or an empty group.
