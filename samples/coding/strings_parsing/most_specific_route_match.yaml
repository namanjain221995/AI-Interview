slug: most_specific_route_match
title: Most Specific Route Match
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, frontend, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Most Specific Route Match

  A web framework's router decides which handler serves a request path. You are given the registered
  `routes` (in registration order) and a request `path`; return the route that handles it.

  Both routes and paths start with `/` and are split into segments by `/`. A **single trailing slash is
  ignored**, so `/api/v1/` and `/api/v1` have the same segments, and `/` has zero segments. Route
  segments come in three kinds:

  - **static** text such as `users`, which matches a path segment with exactly the same text
    (case-sensitive);
  - **param** `:name` such as `:id`, which matches any one path segment;
  - **wildcard** `*`, allowed only as the last route segment, which matches **one or more** remaining
    path segments.

  A route without a wildcard matches only paths with the same number of segments.

  If several routes match, compare them position by position over the path segments, looking at the kind
  of route segment that covers each position (a wildcard covers every position from where it starts). At
  the **first position where the kinds differ**, the route with the more specific kind wins: static beats
  param, and param beats wildcard. If no position differs, the route registered **earliest** wins.

  Return the winning route exactly as it appears in `routes`, or `""` if no route matches.

  ### Example 1
  ```
  Input:  routes = ["/users/:id", "/users/me", "/users/*"], path = "/users/me"
  Output: "/users/me"
  ```

  ### Example 2
  ```
  Input:  routes = ["/files/*", "/:section/:name/raw", "/files/:name/raw"], path = "/files/report.pdf/raw/"
  Output: "/files/:name/raw"
  Explanation: "/:section/:name/raw" loses at position 0 (param vs static); "/files/*" loses at
  position 1 (wildcard vs param).
  ```

  ### Example 3
  ```
  Input:  routes = ["/static/*", "/health"], path = "/static"
  Output: ""
  Explanation: The wildcard needs at least one segment after "static".
  ```

  ### Constraints
  - `1 <= routes.length <= 100`
  - Every route and path starts with `/`, has at most `20` segments and at most one trailing `/`; apart from
    that trailing slash no segment is empty.
  - Path segments and static route segments use letters, digits, `.`, `-` and `_`.
  - A param segment is `:` followed by at least one letter; `*` appears only as a whole, final route segment.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: select_route
  params:
    - {name: routes, type: "string[]"}
    - {name: path, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    STATIC, PARAM, WILDCARD = 2, 1, 0


    def _segments(text: str) -> list[str]:
        text = text[1:]
        if text.endswith("/"):
            text = text[:-1]
        return text.split("/") if text else []


    def _specificity(route: list[str], path: list[str]) -> list[int] | None:
        """Kind of route segment covering each path position, or None if the route does not match."""
        wildcard = bool(route) and route[-1] == "*"
        fixed = route[:-1] if wildcard else route
        if wildcard and len(path) <= len(fixed):
            return None
        if not wildcard and len(path) != len(fixed):
            return None
        kinds = []
        for segment, actual in zip(fixed, path):
            if segment.startswith(":"):
                kinds.append(PARAM)
            elif segment == actual:
                kinds.append(STATIC)
            else:
                return None
        kinds.extend([WILDCARD] * (len(path) - len(fixed)))
        return kinds


    def select_route(routes: list[str], path: str) -> str:
        path_segments = _segments(path)
        best, best_kinds = "", None
        for route in routes:
            kinds = _specificity(_segments(route), path_segments)
            # Equal-length lists compare at the first differing position; strict > keeps the earliest.
            if kinds is not None and (best_kinds is None or kinds > best_kinds):
                best, best_kinds = route, kinds
        return best
  javascript: |
    function selectRoute(routes, path) {
      const segments = (text) => {
        let body = text.slice(1);
        if (body.endsWith("/")) body = body.slice(0, -1);
        return body === "" ? [] : body.split("/");
      };
      const specificity = (route, actual) => {
        const wildcard = route.length > 0 && route[route.length - 1] === "*";
        const fixed = wildcard ? route.slice(0, -1) : route;
        if (wildcard ? actual.length <= fixed.length : actual.length !== fixed.length) return null;
        const kinds = [];
        for (let i = 0; i < fixed.length; i++) {
          if (fixed[i].startsWith(":")) kinds.push(1);
          else if (fixed[i] === actual[i]) kinds.push(2);
          else return null;
        }
        while (kinds.length < actual.length) kinds.push(0);
        return kinds;
      };
      const better = (a, b) => {
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i];
        return false;
      };
      const pathSegments = segments(path);
      let best = "";
      let bestKinds = null;
      for (const route of routes) {
        const kinds = specificity(segments(route), pathSegments);
        if (kinds !== null && (bestKinds === null || better(kinds, bestKinds))) {
          best = route;
          bestKinds = kinds;
        }
      }
      return best;
    }
