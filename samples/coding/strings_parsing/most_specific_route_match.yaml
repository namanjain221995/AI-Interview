expected_concepts:
  - splitting and normalising paths into segments
  - per-route matching with segment-count rules for wildcards
  - encoding specificity as a comparable sequence of kinds
  - stable tie-breaking by registration order
optimal_complexity: {time: O(R * S), space: O(S)}
rubric:
  excellent: Normalises routes and paths into segments, matches each route with the right count rules for wildcards, encodes each match as a sequence of kind ranks so the first differing position decides, keeps the earliest route on ties with a strict comparison, and discusses how a trie would scale to many routes.
  good: Correct linear scan with an explicit comparison function; one fix needed after tests, such as the root path or trailing slashes.
  weak: Ranks routes by counting static segments overall, lets a wildcard match zero segments, or ignores the registration-order tie rule.
  criteria:
    correctness: All tests pass, including root, trailing slashes, ties and wildcard length rules.
    efficiency: Each route is checked in time proportional to its segments; no exponential matching.
    code_quality: Matching and ranking are separate helpers; segment kinds have names rather than magic numbers.
    edge_cases: Root path, empty matches, case sensitivity, wildcard at the boundary of the path length.
    communication: Explains the specificity rule with an example where the total count of static segments misleads.
hints:
  - First decide, for each route on its own, whether it matches the path at all; only then worry about choosing between matches.
  - For a matching route, write down the kind of route segment that covers each path position. Two matching routes cover the same number of positions, so these sequences can be compared position by position.
  - Split both strings into segments after dropping the leading slash and one trailing slash; a route without a wildcard needs exactly as many segments as the path, a route ending in a wildcard needs strictly more path segments than its fixed part. Map static to 2, param to 1 and each wildcard-covered position to 0, compare the sequences lexicographically, and replace the best only when the new one is strictly greater so the earliest route wins ties.
followups:
  - How would you organise thousands of routes in a trie so that matching does not scan every route?
  - How would you also return the captured parameter values and the wildcard tail?
  - How would you detect at registration time that two routes can never be told apart?
  - What changes if params can have type constraints such as digits only?
common_errors:
  - Counting static segments across the whole route instead of deciding at the first differing position.
  - Letting a wildcard match zero segments, so the wildcard route matches its own prefix.
  - Treating "/" as one empty segment, which breaks root matching.
  - Using a non-strict comparison, so a later tied route replaces the earlier one.
