version: 1
slug: valid_merged_service_log
title: Valid Merged Service Log
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, sre, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Valid Merged Service Log

  Two services each write an ordered stream of single-character event codes, for example `S` for start,
  `R` for request and `W` for write. A log collector receives both streams and writes one merged stream.
  The collector may switch between the services at any time, but it must never reorder the events of a
  single service, drop an event or invent one.

  Given the stream of the first service `a`, the stream of the second service `b` and the collector's
  output `merged`, return `true` if `merged` can be produced by interleaving `a` and `b` while keeping the
  events of each service in their original relative order and using **every** event of both streams
  exactly once. Otherwise return `false`.

  Event codes can repeat inside a stream and can appear in both streams, so the same character in
  `merged` may have come from either service.

  ### Example 1
  ```
  Input:  a = "SRW", b = "SWR", merged = "SSRWWR"
  Output: true
  Explanation: Take S from a, S from b, R from a, W from a, W from b, R from b.
  ```

  ### Example 2
  ```
  Input:  a = "SR", b = "SW", merged = "SWRS"
  Output: false
  Explanation: The last event S would have to come before R or W in its own stream.
  ```

  ### Example 3
  ```
  Input:  a = "", b = "RW", merged = "RW"
  Output: true
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 500`
  - `0 <= merged.length <= 1000`
  - All strings contain only uppercase English letters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_valid_interleaving
  params:
    - {name: a, type: string}
    - {name: b, type: string}
    - {name: merged, type: string}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def is_valid_interleaving(a: str, b: str, merged: str) -> bool:
        n, m = len(a), len(b)
        if n + m != len(merged):
            return False
        # reachable[j]: the first i + j events of merged can use a[:i] and b[:j].
        reachable = [False] * (m + 1)
        for i in range(n + 1):
            for j in range(m + 1):
                if i == 0 and j == 0:
                    reachable[j] = True
                    continue
                k = i + j - 1
                from_a = i > 0 and reachable[j] and a[i - 1] == merged[k]
                from_b = j > 0 and reachable[j - 1] and b[j - 1] == merged[k]
                reachable[j] = from_a or from_b
        return reachable[m]
  javascript: |
    function isValidInterleaving(a, b, merged) {
      const n = a.length;
      const m = b.length;
      if (n + m !== merged.length) return false;
      const reachable = new Array(m + 1).fill(false);
      for (let i = 0; i <= n; i++) {
        for (let j = 0; j <= m; j++) {
          if (i === 0 && j === 0) {
            reachable[j] = true;
            continue;
          }
          const k = i + j - 1;
          const fromA = i > 0 && reachable[j] && a[i - 1] === merged[k];
          const fromB = j > 0 && reachable[j - 1] && b[j - 1] === merged[k];
          reachable[j] = fromA || fromB;
        }
      }
      return reachable[m];
    }
tests:
  - {id: t1, args: ["SRW", "SWR", "SSRWWR"], expected: true, description: "Example 1 - shared codes, valid interleaving"}
  - {id: t2, args: ["SR", "SW", "SWRS"], expected: false, description: "Example 2 - right characters in an impossible order"}
  - {id: t3, args: ["", "RW", "RW"], expected: true, description: "Example 3 - one stream empty"}
  - {id: t4, hidden: true, args: ["", "", ""], expected: true, description: "All three streams empty"}
  - {id: t5, hidden: true, args: ["AB", "C", "ABCD"], expected: false, description: "Length mismatch: merged has an extra event"}
  - {id: t6, hidden: true, args: ["AB", "AC", "ACAB"], expected: true, description: "Greedy taking from a first on a shared code fails; must take from b"}
  - {id: t7, hidden: true, args: ["ABC", "", "ACB"], expected: false, description: "Second stream empty and the first is reordered"}
  - {id: t8, hidden: true, args: ["AAB", "AAC", "AACAAB"], expected: true, description: "Repeated codes where the choice of source only resolves several steps later"}
  - {id: t9, hidden: true, args: ["XY", "XY", "XXYY"], expected: true, description: "Identical streams interleaved"}
  - {id: t10, hidden: true, args: ["AAAAAAAAAAAAAAAAAAAA", "AAAAAAAAAAAAAAAAAAAA", "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB"], expected: false, description: "Exponential trap - unmemoised branching explores C(40,20) paths before failing on the last event"}
  - {id: t11, hidden: true, args: ["", "", ""], expected: true, description: "Stress - 500 events per stream with a long ambiguous prefix; valid"}
expected_concepts:
  - dynamic programming over prefixes of both streams
  - the merged prefix length equals i plus j
  - early length check
  - rolling one-dimensional table for O(min(n, m)) or O(m) space
optimal_complexity: {time: O(n * m), space: O(m)}
rubric:
  excellent: Rejects length mismatches first, explains why greedy choice fails on shared codes, builds the prefix-pair table (or memoised recursion over i and j) in O(n * m) time, and reduces space to one row.
  good: Correct memoised recursion or two-dimensional table with O(n * m) time and space.
  weak: Greedy matching that prefers one stream, plain recursion without memoisation that times out, or forgets that every event must be used.
  criteria:
    correctness: All tests pass, including empty streams, length mismatches and greedy traps.
    efficiency: Polynomial O(n * m) time; exponential backtracking is not acceptable for 500 events per stream.
    code_quality: Clear state definition and boundary handling for the first row and column.
    edge_cases: Empty streams, identical streams, merged longer or shorter than both inputs combined.
    communication: States the subproblem precisely and shows why it has overlapping substructure.
hints:
  - When the next merged event matches the next event of both services, you cannot know which one to take yet; what information fully describes how far you have got?
  - The state is just how many events of the first stream and of the second stream have been used; the merged position is their sum. Many different choice sequences reach the same pair, so remember results per pair.
  - Fill a boolean table where cell (i, j) says whether the first i + j merged events can be built from the first i events of a and the first j events of b; a cell is true if the cell to its left or above is true and the matching stream's last event equals the merged event at position i + j minus one. Check the lengths first and keep only one row to save memory.
followups:
  - How would you reconstruct which service each merged event came from?
  - How would you generalise to k services, and how does the state grow?
  - If event codes never repeat across the two streams, is there a simpler linear solution?
  - How would you check validity while the merged stream is still arriving?
common_errors:
  - Greedily consuming from the first stream whenever the codes match, which fails on shared codes.
  - Forgetting the length check, so a merged stream with extra or missing events is accepted.
  - Recursing without memoisation, giving exponential time on repetitive streams.
  - Off-by-one errors in the merged index i + j - 1 at the table boundaries.
