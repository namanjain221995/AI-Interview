expected_concepts:
  - splitting a quantity into number and suffix
  - fixed-point arithmetic by scaling the fractional part to an integer
  - multiply before dividing to stay exact
  - 64-bit or arbitrary-precision accumulation
optimal_complexity: {time: O(total characters), space: O(1)}
rubric:
  excellent: Parses number and suffix cleanly, reads the digits around the point as one integer, multiplies by the suffix multiplier before dividing by the power of ten, accumulates in 64-bit (BigInt in JavaScript), and explains why floating point fails on values like 4.35M.
  good: Correct integer-based parsing with a small slip, such as a missing suffix or a 32-bit accumulator, fixed after a failing test.
  weak: Uses floating point and truncates or rounds, confuses decimal and binary prefixes, or overflows.
  criteria:
    correctness: All tests pass, including floating-point traps and the largest single quantity.
    efficiency: One pass over each string with constant work per character.
    code_quality: A single table of multipliers instead of a long chain of conditionals.
    edge_cases: Empty list, zero values, leading zeros, plain integers with fractions, mixed suffix families.
    communication: Explains the exactness and overflow reasoning, including the order of multiply and divide.
hints:
  - Separate each quantity into its numeric part and its suffix, and look the suffix up in a table of multipliers.
  - A decimal number with f fractional digits equals an integer divided by ten to the power f; read the digits on both sides of the point as one integer so you never need floating point.
  - For each quantity, form the integer from all its digits, multiply it by the suffix multiplier first and only then divide by ten to the power of the number of fractional digits (the division is exact by guarantee), and add the result to a 64-bit total; in JavaScript do this with BigInt and convert the final total.
followups:
  - How would you support the milli suffix m, which can produce fractional bytes, and decide how to round?
  - How would you validate malformed quantities and report which container is wrong?
  - How would you format the total back into the most readable binary unit?
  - What changes if the node's allocatable memory must be compared against the total per namespace?
common_errors:
  - Parsing the number as a float and truncating, which turns 4.35M into 4349999 bytes.
  - Treating k and Ki (or M and Mi) as the same multiplier.
  - Dividing before multiplying, which discards the fractional part.
  - Accumulating in a 32-bit integer or a plain JavaScript number for intermediate products.
