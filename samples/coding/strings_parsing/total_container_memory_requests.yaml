slug: total_container_memory_requests
title: Total Container Memory Requests
difficulty: medium
competency_keys: [problem_solving, code_quality]
role_tags: [devops, platform, cloud, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Total Container Memory Requests

  A capacity planner adds up the memory requested by every container scheduled on a node. Each request
  is written as a **quantity string**: a number followed by an optional unit suffix.

  - The number is one or more digits, optionally followed by a `.` and **1 to 3** fractional digits
    (`128`, `1.5`, `0.125`). Leading zeros may appear.
  - The suffix is one of:

  | Suffix | Multiplier | Suffix | Multiplier |
  |--------|------------|--------|------------|
  | (none) | 1 | | |
  | `k` | 1000 | `Ki` | 1024 |
  | `M` | 1000^2 | `Mi` | 1024^2 |
  | `G` | 1000^3 | `Gi` | 1024^3 |
  | `T` | 1000^4 | `Ti` | 1024^4 |

  Every quantity is guaranteed to describe a **whole number of bytes** (for example `1.5Gi` is exactly
  `1610612736` bytes). Return the **total number of bytes** across all quantities.

  The result must be exact. Floating-point arithmetic is not exact for values such as `4.35M`, so compute
  with integers only. Intermediate values can exceed `2^53`, so JavaScript solutions should use `BigInt`
  internally and convert the final total to a number.

  ### Example 1
  ```
  Input:  quantities = ["128Mi", "1.5Gi", "500M"]
  Output: 2244830464
  Explanation: 134217728 + 1610612736 + 500000000 bytes.
  ```

  ### Example 2
  ```
  Input:  quantities = ["1k", "1Ki", "1000"]
  Output: 3024
  ```

  ### Constraints
  - `0 <= quantities.length <= 1000`
  - Every quantity is well formed, has at most 3 fractional digits and is a whole number of bytes.
  - Every single quantity is at most `4 * 10^15` bytes and the total is at most `9 * 10^15` bytes.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: total_memory_bytes
  params:
    - {name: quantities, type: "string[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    MULTIPLIERS = {
        "": 1,
        "k": 1000, "M": 1000**2, "G": 1000**3, "T": 1000**4,
        "Ki": 1024, "Mi": 1024**2, "Gi": 1024**3, "Ti": 1024**4,
    }


    def total_memory_bytes(quantities: list[str]) -> int:
        total = 0
        for quantity in quantities:
            end = len(quantity)
            while end > 0 and not quantity[end - 1].isdigit():
                end -= 1
            number, suffix = quantity[:end], quantity[end:]
            whole, _, frac = number.partition(".")
            # number == (whole and frac digits read as one integer) / 10^len(frac)
            scaled = int(whole + frac)
            total += scaled * MULTIPLIERS[suffix] // 10 ** len(frac)
        return total
  javascript: |
    function totalMemoryBytes(quantities) {
      const multipliers = {
        "": 1n,
        k: 1000n, M: 1000n ** 2n, G: 1000n ** 3n, T: 1000n ** 4n,
        Ki: 1024n, Mi: 1024n ** 2n, Gi: 1024n ** 3n, Ti: 1024n ** 4n,
      };
      let total = 0n;
      for (const quantity of quantities) {
        let end = quantity.length;
        while (end > 0 && !(quantity[end - 1] >= "0" && quantity[end - 1] <= "9")) end--;
        const number = quantity.slice(0, end);
        const suffix = quantity.slice(end);
        const dot = number.indexOf(".");
        const whole = dot < 0 ? number : number.slice(0, dot);
        const frac = dot < 0 ? "" : number.slice(dot + 1);
        const scaled = BigInt(whole + frac);
        total += (scaled * multipliers[suffix]) / 10n ** BigInt(frac.length);
      }
      return Number(total);
    }
