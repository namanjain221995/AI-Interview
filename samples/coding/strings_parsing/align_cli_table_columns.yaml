slug: align_cli_table_columns
title: "Align CLI Table Columns"
difficulty: easy
competency_keys: [code_quality, problem_solving]
role_tags: [devops, support_engineer, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Align CLI Table Columns

  An internal command-line tool prints tabular results (pods, hosts, jobs) and wants the columns lined up.
  You receive `rows`, where every row has the **same number of cells**. Format each row as one line:

  1. The width of a column is the length of its longest cell (over all rows).
  2. Pad every cell on the **right** with spaces up to its column's width.
  3. Join the padded cells of a row with the separator `" | "` (space, pipe, space).
  4. Remove all trailing spaces from the end of the line.

  Write `align_table_columns(rows)` that returns the formatted lines in the same order as `rows`.
  Return an empty list when there are no rows.

  ### Example 1
  ```
  Input:  rows = [["NAME", "READY", "STATUS"], ["api-7f9c", "1/1", "Running"], ["worker-2", "0/1", "CrashLoopBackOff"]]
  Output: ["NAME     | READY | STATUS", "api-7f9c | 1/1   | Running", "worker-2 | 0/1   | CrashLoopBackOff"]
  ```

  ### Example 2
  ```
  Input:  rows = [["host", "notes"], ["db-1", ""], ["cache-01", "warm"]]
  Output: ["host     | notes", "db-1     |", "cache-01 | warm"]
  Explanation: the empty notes cell of db-1 is padded and then the trailing spaces are removed, leaving the separator's pipe at the end.
  ```

  ### Constraints
  - `0 <= rows.length <= 1000`
  - `1 <= rows[i].length <= 20`, and every row has the same length
  - `0 <= rows[i][j].length <= 100`
  - Cells contain printable ASCII characters (they may be empty and may contain spaces) and no tabs or newlines.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: align_table_columns
  params:
    - {name: rows, type: "string[][]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def align_table_columns(rows: list[list[str]]) -> list[str]:
        if not rows:
            return []
        widths = [max(len(row[c]) for row in rows) for c in range(len(rows[0]))]
        lines = []
        for row in rows:
            padded = [cell.ljust(widths[c]) for c, cell in enumerate(row)]
            lines.append(" | ".join(padded).rstrip(" "))
        return lines
  javascript: |
    function alignTableColumns(rows) {
      if (rows.length === 0) return [];
      const widths = rows[0].map((_, c) => Math.max(...rows.map((row) => row[c].length)));
      return rows.map((row) =>
        row
          .map((cell, c) => cell.padEnd(widths[c], " "))
          .join(" | ")
          .replace(/ +$/, "")
      );
    }
