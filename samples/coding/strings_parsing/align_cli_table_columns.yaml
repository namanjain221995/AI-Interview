expected_concepts:
  - "two passes: measure column widths, then format"
  - "right-padding to a column width"
  - "joining with a separator"
  - "stripping only trailing spaces"
  - "O(total characters) time"
optimal_complexity: {time: "O(R * C * L)", space: "O(C)"}
rubric:
  excellent: "Computes column widths in a first pass, pads and joins in a second, strips trailing spaces after joining, handles empty input and empty cells, and states the time as linear in the total output size."
  good: "Correct output with a small slip (for example stripping before joining or crashing on no rows) fixed after a hint."
  weak: "Uses the width of each row instead of each column, pads on the left, forgets to strip trailing spaces or strips spaces inside the line."
  criteria:
    correctness: "All tests pass, including empty cells, a single column and no rows."
    efficiency: "Two passes over the cells; no repeated width recomputation per row."
    code_quality: "Separate, readable width computation and formatting steps with clear names."
    edge_cases: "No rows, single column, all-empty cells and cells with trailing spaces of their own."
    communication: "Explains why widths must be known before any line is produced."
hints:
  - "You cannot format the first line until you know how wide every column needs to be."
  - "Do one pass to find the longest cell in each column, then a second pass that pads each cell to its column's width and joins them."
  - "Store one width per column as the maximum cell length in that column; then for each row right-pad every cell with spaces to that width, join the cells with space-pipe-space and trim only the spaces at the end of the joined line."
followups:
  - "How would you right-align columns that contain only numbers?"
  - "How would you cap a column at a maximum width and truncate long cells with an ellipsis?"
  - "What breaks if cells contain wide Unicode characters such as emoji or CJK text?"
common_errors:
  - "Using the longest cell of the row instead of the longest cell of the column."
  - "Stripping each cell before padding, which changes cells that contain intentional spaces in the middle columns."
  - "Leaving trailing spaces after the last cell, or removing them from inside the line as well."
  - "Reading the first row's length when the table is empty and crashing."
