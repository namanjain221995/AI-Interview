version: 1
slug: failing_app_frame_from_traceback
title: "Failing App Frame from a Traceback"
difficulty: easy
competency_keys: [debugging, problem_solving]
role_tags: [backend, sre, support_engineer, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Failing App Frame from a Traceback

  When an alert fires, the on-call engineer usually wants to jump straight to the deepest point in **their
  own code** where the failure passed through, skipping framework and library frames. Write a helper that
  finds that point in a Python-style traceback.

  The traceback is given as a list of lines, `trace`. A line is a **frame line** if, after removing any
  leading spaces, it has exactly this shape:

  ```
  File "<path>", line <number>, in <function>
  ```

  More precisely, the line (after its leading spaces) must start with `File "`, the path runs up to the next
  double quote, and that quote must be immediately followed by `, line ` and **one or more digits**. Whatever
  comes after the digits does not matter. Every other line (source code, exception messages, blank lines,
  separators between chained tracebacks) is ignored, even if it contains text that looks like a frame
  somewhere in the middle.

  Your own code is identified by `prefix`: a frame belongs to your code if its path **starts with** `prefix`
  (a plain string prefix, case-sensitive; an empty prefix matches every path).

  Return `"<path>:<number>"` for the **last** frame line in `trace` whose path starts with `prefix`, using the
  digits exactly as written. Return an empty string `""` if no frame line matches.

  ### Example 1
  ```
  Input:  trace = [
            "Traceback (most recent call last):",
            '  File "app/api/routes.py", line 88, in create_charge',
            "    return billing.charge(order)",
            '  File "app/billing/charge.py", line 42, in charge',
            "    receipt = gateway.submit(payload)",
            '  File "lib/payments/gateway.py", line 310, in submit',
            "    raise GatewayTimeout(self.url)",
            "payments.errors.GatewayTimeout: https://pay.example.test",
          ], prefix = "app/"
  Output: "app/billing/charge.py:42"
  Explanation: Three frame lines; the last one whose path starts with app/ is app/billing/charge.py at line 42.
  ```

  ### Example 2
  ```
  Input:  trace = [
            "Traceback (most recent call last):",
            '  File "lib/worker/loop.py", line 12, in run',
            "    job()",
            "ValueError: empty batch",
          ], prefix = "app/"
  Output: ""
  ```

  ### Constraints
  - `0 <= trace.length <= 10^4`
  - `0 <= trace[i].length <= 500`
  - `0 <= prefix.length <= 100`
  - All strings consist of printable ASCII characters; paths in frame lines contain no double quotes
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: failing_app_frame
  params:
    - {name: trace, type: "string[]"}
    - {name: prefix, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def failing_app_frame(trace: list[str], prefix: str) -> str:
        marker = 'File "'
        result = ""
        for line in trace:
            text = line.lstrip(" ")
            if not text.startswith(marker):
                continue
            close = text.find('"', len(marker))
            if close < 0:
                continue
            path = text[len(marker):close]
            rest = text[close + 1:]
            if not rest.startswith(", line "):
                continue
            end = len(", line ")
            while end < len(rest) and "0" <= rest[end] <= "9":
                end += 1
            if end == len(", line "):
                continue
            if path.startswith(prefix):
                result = path + ":" + rest[len(", line "):end]
        return result
  javascript: |
    function failingAppFrame(trace, prefix) {
      const marker = 'File "';
      const lineTag = ", line ";
      let result = "";
      for (const line of trace) {
        let start = 0;
        while (start < line.length && line[start] === " ") start++;
        const text = line.slice(start);
        if (!text.startsWith(marker)) continue;
        const close = text.indexOf('"', marker.length);
        if (close < 0) continue;
        const path = text.slice(marker.length, close);
        const rest = text.slice(close + 1);
        if (!rest.startsWith(lineTag)) continue;
        let end = lineTag.length;
        while (end < rest.length && rest[end] >= "0" && rest[end] <= "9") end++;
        if (end === lineTag.length) continue;
        if (path.startsWith(prefix)) result = path + ":" + rest.slice(lineTag.length, end);
      }
      return result;
    }
