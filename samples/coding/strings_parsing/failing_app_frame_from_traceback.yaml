expected_concepts:
  - "line-by-line parsing with explicit format checks"
  - "anchoring a pattern at the start of the line after stripping indentation"
  - "extracting a quoted field and a run of digits"
  - "keeping the last match while scanning"
  - "string prefix test"
optimal_complexity: {time: "O(total length of trace)", space: "O(1) beyond the output"}
rubric:
  excellent: "Parses each line with explicit, anchored checks (strip leading spaces, File quote, closing quote, the line tag, at least one digit), keeps the last match, handles the empty prefix and chained tracebacks, and explains why searching anywhere in the line is wrong."
  good: "Correct after one fix such as anchoring the match or requiring digits; clear code and correct complexity."
  weak: "Searches for File anywhere in the line, returns the first match instead of the last, or splits on commas in a way that breaks on unusual lines."
  criteria:
    correctness: "All tests pass, including decoy lines, chained tracebacks and an empty prefix."
    efficiency: "Single pass over the lines with work proportional to their length."
    code_quality: "Named constants for the markers and a small helper or clear block for parsing one line."
    edge_cases: "Empty trace, no matching frame, malformed frame lines, case-sensitive prefix."
    communication: "Restates the exact frame-line grammar and how ambiguous lines are treated before coding."
hints:
  - "Look at each line on its own and ask a yes-or-no question first: is this a frame line at all?"
  - "After removing leading spaces, a frame line must begin with the word File and an opening quote. Pull out the path up to the closing quote, then check that the expected line tag and at least one digit follow."
  - "Scan the lines in order and keep the latest answer. For each line, strip leading spaces and skip it unless it starts with File followed by a double quote; find the next double quote to cut out the path; skip the line unless the text right after that quote is a comma, a space, the word line and a space, followed by one or more digits. If the path starts with the prefix, remember the path, a colon and those digits. After the loop, return what you remembered, or an empty string."
followups:
  - "How would you also return the function name of the frame?"
  - "How would you support JavaScript or Java stack trace formats with the same interface?"
  - "How would you let users configure several prefixes and exclude test helpers inside the app directory?"
  - "Why might the deepest app frame not be where the bug actually is?"
common_errors:
  - "Searching for File anywhere in the line, so frame-like text inside a log message or exception is picked up."
  - "Returning the first matching frame (the outermost call) instead of the last."
  - "Splitting on commas or spaces and crashing on lines with unexpected shapes."
  - "Accepting a frame line with no digits after the line tag."
  - "Comparing the prefix case-insensitively or against the whole line instead of the path."
