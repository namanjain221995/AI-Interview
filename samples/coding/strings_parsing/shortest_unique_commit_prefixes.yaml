version: 1
slug: shortest_unique_commit_prefixes
title: "Shortest Unique Commit Prefixes"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [devops, backend, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Shortest Unique Commit Prefixes

  A release dashboard lists the commits included in a deployment. Full commit hashes are long, so the
  dashboard abbreviates each one to a short prefix, the way version-control tools do. An abbreviation
  is only useful if it is **unambiguous within the list**: no other hash in the list may start with
  it. For readability, an abbreviation is never shorter than `min_len` characters.

  Given the list `hashes` and `min_len`, return, for each hash **in input order**, its shortest prefix
  that

  - has at least `min_len` characters, and
  - is not a prefix of any **other** hash in the list.

  All hashes are distinct lowercase hexadecimal strings (`0`-`9`, `a`-`f`) of the **same length**, so a
  full hash is always unambiguous and an answer always exists.

  ### Example 1
  ```
  Input:  hashes = ["4f2a91c0", "4f2a9e17", "4f7b0c3d"], min_len = 4
  Output: ["4f2a91", "4f2a9e", "4f7b"]
  Explanation: The first two hashes share "4f2a9", so they need 6 characters. "4f7" already
  differs from both, but must still be 4 characters long.
  ```

  ### Example 2
  ```
  Input:  hashes = ["c0ffee12"], min_len = 3
  Output: ["c0f"]
  Explanation: A hash with no competitors only needs min_len characters.
  ```

  ### Constraints
  - `1 <= hashes.length <= 10^4`
  - `1 <= hashes[i].length <= 64`, and all hashes have the same length
  - `1 <= min_len <= hashes[i].length`
  - Hashes are distinct and contain only `0`-`9` and `a`-`f`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_unique_prefixes
  params:
    - {name: hashes, type: "string[]"}
    - {name: min_len, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def shortest_unique_prefixes(hashes: list[str], min_len: int) -> list[str]:
        def common(a: str, b: str) -> int:
            length = 0
            while length < len(a) and a[length] == b[length]:
                length += 1
            return length

        # After sorting, the hash sharing the longest prefix with any hash is a neighbour.
        order = sorted(range(len(hashes)), key=lambda i: hashes[i])
        needed = [min_len] * len(hashes)
        for k in range(len(order) - 1):
            i, j = order[k], order[k + 1]
            shared = common(hashes[i], hashes[j])
            needed[i] = max(needed[i], shared + 1)
            needed[j] = max(needed[j], shared + 1)
        return [h[:n] for h, n in zip(hashes, needed)]
  javascript: |
    function shortestUniquePrefixes(hashes, minLen) {
      const common = (a, b) => {
        let length = 0;
        while (length < a.length && a[length] === b[length]) length++;
        return length;
      };
      const order = hashes.map((_, i) => i).sort((x, y) => (hashes[x] < hashes[y] ? -1 : hashes[x] > hashes[y] ? 1 : 0));
      const needed = new Array(hashes.length).fill(minLen);
      for (let k = 0; k + 1 < order.length; k++) {
        const i = order[k];
        const j = order[k + 1];
        const shared = common(hashes[i], hashes[j]);
        needed[i] = Math.max(needed[i], shared + 1);
        needed[j] = Math.max(needed[j], shared + 1);
      }
      return hashes.map((h, i) => h.slice(0, needed[i]));
    }
