expected_concepts:
  - "sorting so that the most similar strings become neighbours"
  - "longest common prefix between adjacent strings"
  - "required length is one more than the longest shared prefix with any other hash"
  - "trie with per-node counts as an alternative"
  - "applying a minimum length and preserving input order"
optimal_complexity: {time: "O(n log n * L) for n hashes of length L (sorting dominates); a trie gives O(n * L)", space: "O(n) besides the output"}
rubric:
  excellent: "Observes that a prefix is ambiguous only if another hash shares it, derives that the answer length is max(min_len, 1 + longest common prefix with any other hash), finds that maximum via sorted neighbours or a counted trie, restores input order and explains the complexity versus the quadratic pairwise check."
  good: "Correct solution using a trie or sorting, or a pairwise comparison that is improved after prompting; handles min_len."
  weak: "Checks prefixes against every other hash for every length (cubic), ignores min_len, or returns results in sorted order."
  criteria:
    correctness: "All tests pass, including min_len padding, near-identical hashes and unsorted input."
    efficiency: "Sorting with neighbour comparison or a trie; avoids comparing every pair at every length."
    code_quality: "A small helper computes the common prefix length; input order is restored without extra searching."
    edge_cases: "Single hash, one-character hashes, min_len equal to the hash length, hashes differing only in the last character."
    communication: "Explains why only sorted neighbours need to be compared."
hints:
  - "A prefix of a hash is ambiguous exactly when some other hash starts with the same characters. How long a prefix does the most similar other hash share?"
  - "The answer length for a hash is one more than the longest prefix it shares with any other hash, but never less than min_len. To find the most similar other hash quickly, think about what sorting does to strings with long common beginnings."
  - "Sort the hashes while remembering their original positions. For each pair of adjacent hashes in sorted order, compute the length of their common beginning and raise the required length of both to that length plus one. Start every required length at min_len, then cut each original hash to its required length and return the results in the original order."
followups:
  - "How would a trie that counts how many hashes pass through each node solve the same problem?"
  - "How would you keep the abbreviations up to date as new commits are added one at a time?"
  - "Why is comparing only sorted neighbours enough to find the longest shared prefix with any other hash?"
  - "What changes if some hashes in the list could be duplicates?"
common_errors:
  - "Forgetting to apply min_len to hashes that are already unique with a shorter prefix."
  - "Returning abbreviations in sorted order instead of input order."
  - "Comparing each hash with only one sorted neighbour instead of both."
  - "Using the shared prefix length itself instead of one more than it."
  - "Checking every candidate prefix against every other hash, which is cubic in the worst case."
