  - {id: t6, hidden: true, args: [["deadbeef", "deadbeee", "dead0000", "beefdead"], 8], expected: ["deadbeef", "deadbeee", "dead0000", "beefdead"], description: "min_len equals the hash length - every answer is the full hash"}
