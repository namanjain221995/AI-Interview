slug: artifact_glob_path_match
title: Artifact Glob Path Match
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Artifact Glob Path Match

  A build server keeps artifacts only when their path matches one of the retention rules. Rules are
  written as glob patterns over `/`-separated paths, and you must implement the matcher without using a
  regular-expression engine.

  Split both the pattern and the path on `/` into **segments**. Pattern segments mean:

  - A segment that is **exactly** `**` matches **zero or more whole path segments**. So `dist/**`
    matches `dist` itself as well as everything below it, and `a/**/b` matches `a/b`.
  - In any other segment, `?` matches exactly one character, `*` matches any run of characters
    (possibly empty), and every other character matches itself. These never cross a `/`, so `**` that
    is only part of a segment (such as `a**b`) behaves like two single stars.

  Return `true` if the **entire** path matches the **entire** pattern, otherwise `false`.

  ### Example 1
  ```
  Input:  pattern = "build/**/*.jar", path = "build/libs/app-1.2.jar"
  Output: true
  ```

  ### Example 2
  ```
  Input:  pattern = "logs/*/app?.log", path = "logs/2024/06/app1.log"
  Output: false
  Explanation: the single * cannot match "2024/06" because it would cross a slash
  ```

  ### Example 3
  ```
  Input:  pattern = "src/**/test_*.py", path = "src/test_api.py"
  Output: true
  Explanation: ** matches zero segments
  ```

  ### Constraints
  - `1 <= pattern.length, path.length <= 300`
  - Neither string starts or ends with `/`, and neither contains an empty segment (`//`)
  - The pattern contains lowercase letters, digits, `.`, `_`, `-`, `/`, `?` and `*`
  - The path contains the same characters except `?` and `*`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: glob_path_match
  params:
    - {name: pattern, type: string}
    - {name: path, type: string}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def glob_path_match(pattern: str, path: str) -> bool:
        def segment_match(pat: str, text: str) -> bool:
            # can[j] is True when pat[:i] matches text[:j]
            can = [True] + [False] * len(text)
            for ch in pat:
                if ch == "*":
                    for j in range(1, len(text) + 1):
                        can[j] = can[j] or can[j - 1]
                else:
                    for j in range(len(text), 0, -1):
                        can[j] = can[j - 1] and (ch == "?" or ch == text[j - 1])
                    can[0] = False
            return can[len(text)]

        pats = pattern.split("/")
        segs = path.split("/")
        m, n = len(pats), len(segs)
        # ok[i][j] is True when pats[i:] matches segs[j:]
        ok = [[False] * (n + 1) for _ in range(m + 1)]
        ok[m][n] = True
        for i in range(m - 1, -1, -1):
            for j in range(n, -1, -1):
                if pats[i] == "**":
                    ok[i][j] = ok[i + 1][j] or (j < n and ok[i][j + 1])
                else:
                    ok[i][j] = j < n and ok[i + 1][j + 1] and segment_match(pats[i], segs[j])
        return ok[0][0]
  javascript: |
    function globPathMatch(pattern, path) {
      const segmentMatch = (pat, text) => {
        const can = new Array(text.length + 1).fill(false);
        can[0] = true;
        for (const ch of pat) {
          if (ch === "*") {
            for (let j = 1; j <= text.length; j++) can[j] = can[j] || can[j - 1];
          } else {
            for (let j = text.length; j > 0; j--) {
              can[j] = can[j - 1] && (ch === "?" || ch === text[j - 1]);
            }
            can[0] = false;
          }
        }
        return can[text.length];
      };
      const pats = pattern.split("/");
      const segs = path.split("/");
      const m = pats.length;
      const n = segs.length;
      const ok = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(false));
      ok[m][n] = true;
      for (let i = m - 1; i >= 0; i--) {
        for (let j = n; j >= 0; j--) {
          if (pats[i] === "**") {
            ok[i][j] = ok[i + 1][j] || (j < n && ok[i][j + 1]);
          } else {
            ok[i][j] = j < n && ok[i + 1][j + 1] && segmentMatch(pats[i], segs[j]);
          }
        }
      }
      return ok[0][0];
    }
