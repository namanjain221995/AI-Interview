  - {id: t6, hidden: true, args: ["*.log", "dir/x.log"], expected: false, description: "Single-segment pattern does not match a nested path"}
  - {id: t7, hidden: true, args: ["cache/a**b/x", "cache/a/q/b/x"], expected: false, description: "Double star inside a segment behaves like single stars and cannot cross slashes"}
  - {id: t8, hidden: true, args: ["cache/a**b/x", "cache/a-tmp-b/x"], expected: true, description: "Double star inside a segment matches within the segment"}
  - {id: t9, hidden: true, args: ["a/**/**/b/**/c?", "a/b/c1"], expected: true, description: "Consecutive and multiple double stars all matching zero segments"}
  - {id: t10, hidden: true, args: ["**/*a*a*a*a*a*a*b", "aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaa/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"], expected: false, description: "Backtracking stress - many stars, deep path, no match (exponential for naive recursion)"}
  - {id: t11, hidden: true, args: ["releases/v?.*/*.tar.gz", "releases/v2.10/core.tar.gz"], expected: true, description: "Dots are literal; question mark matches exactly one character"}
  - {id: t12, hidden: true, args: ["a/b", "a/b/c"], expected: false, description: "Pattern exhausted before the path - no match"}
expected_concepts:
  - "two-level matching: segments, then characters within a segment"
  - "dynamic programming over (pattern position, path position)"
  - "wildcard star as zero-or-more with memoisation instead of blind backtracking"
  - "boundary cases such as double star matching zero segments"
optimal_complexity: {time: "O(P * L) where P is the pattern length and L the path length", space: "O(P * L), reducible to O(L) per row"}
rubric:
  excellent: "Separates segment-level matching for double star from character-level matching inside a segment, uses dynamic programming or memoised recursion at both levels, handles double star matching zero segments and partial double stars, and explains why naive backtracking is exponential."
  good: "Correct recursive solution with memoisation, or a correct DP after a hint about zero-segment matches or slash crossing."
  weak: "Converts to a regular expression, lets single star cross slashes, or uses unmemoised backtracking that times out on many stars."
  criteria:
    correctness: "All tests pass, including zero-segment double stars, trailing double stars and partial double stars."
    efficiency: "Polynomial time via DP or memoisation; no exponential backtracking."
    code_quality: "Clear split between the segment matcher and the path matcher with well-named state."
    edge_cases: "Lone double star, consecutive double stars, patterns longer or shorter than the path and literal dots."
    communication: "States the DP state and transition precisely and walks through a zero-segment example."
hints:
  - "Treat the problem on two levels: whole segments for the double-star rule, and individual characters for single stars and question marks inside one segment."
  - "Plain backtracking explodes when the pattern has many stars. Define a table indexed by how much of the pattern and how much of the input has been consumed, and fill it so each state is solved once."
  - "For segments, a double-star segment at position i matches path position j if the rest of the pattern matches from j (zero segments) or the same double star matches from j plus one (it swallows one more segment). Any other segment must match the current path segment by the classic character-level wildcard table and the rest must match from the next positions."
followups:
  - "How would you add character classes such as [0-9] or negation such as [!a]?"
  - "How would you evaluate thousands of rules against millions of paths efficiently?"
  - "How should a rule that starts with a slash, anchored at the repository root, behave?"
  - "Can you reduce the memory to a single row of the table?"
common_errors:
  - "Letting single star match across slashes."
  - "Not allowing double star to match zero segments, so a/**/b fails on a/b."
  - "Treating a**b as a cross-directory wildcard."
  - "Unmemoised recursion that is exponential on patterns with many stars."
  - "Converting the pattern to a regular expression despite the restriction."
