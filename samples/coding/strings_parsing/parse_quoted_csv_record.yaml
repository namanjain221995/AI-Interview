version: 1
slug: parse_quoted_csv_record
title: Parse a Quoted CSV Record
difficulty: medium
competency_keys: [algorithms, code_quality, problem_solving]
role_tags: [data, backend, data_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## Parse a Quoted CSV Record

  A supplier sends a nightly product export as CSV, and the import job has to split each line into its
  field values without a CSV library. Write `parse_csv_record(line)` that parses **one** record using
  these rules:

  - Fields are separated by commas `,`. A line with `k` commas has `k + 1` fields, so an empty line is
    one empty field `[""]` and a trailing comma adds a final empty field.
  - A field whose **first character** is a double quote `"` is a *quoted* field. Its value is everything
    up to the matching closing quote; it may contain commas, and two quotes in a row `""` inside it stand
    for one literal quote character. The closing quote must be followed immediately by a comma or by the
    end of the line.
  - Any other field is *unquoted* and is taken **verbatim**, including leading and trailing spaces.
    An unquoted field must not contain a quote character.

  If the line breaks any rule (a quoted field is never closed, an unquoted field contains a quote, or
  anything other than a comma follows a closing quote), the record is malformed: return an empty list `[]`.

  Strings in the examples are written as JSON string literals, so `\"` is a single quote character.

  ### Example 1
  ```
  Input:  line = "sku-104,\"Widget, large\",12"
  Output: ["sku-104", "Widget, large", "12"]
  ```

  ### Example 2
  ```
  Input:  line = "\"Rated \"\"A\"\" grade\",,in stock"
  Output: ["Rated \"A\" grade", "", "in stock"]
  Explanation: The doubled quotes become literal quotes and the second field is empty.
  ```

  ### Example 3
  ```
  Input:  line = "\"unterminated,field"
  Output: []
  Explanation: The quoted field is never closed, so the record is malformed.
  ```

  ### Constraints
  - `0 <= line.length <= 10^4`
  - `line` contains printable ASCII characters only (no line breaks).

  **Follow-up:** can you parse the record in a single left-to-right pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parse_csv_record
  params:
    - {name: line, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def parse_csv_record(line: str) -> list[str]:
        fields: list[str] = []
        n = len(line)
        i = 0
        while True:
            if i < n and line[i] == '"':
                i += 1
                buf: list[str] = []
                while True:
                    if i >= n:
                        return []  # quote never closed
                    ch = line[i]
                    if ch == '"':
                        if i + 1 < n and line[i + 1] == '"':
                            buf.append('"')
                            i += 2
                        else:
                            i += 1
                            break
                    else:
                        buf.append(ch)
                        i += 1
                fields.append("".join(buf))
                if i < n and line[i] != ",":
                    return []  # text after the closing quote
            else:
                j = i
                while j < n and line[j] != ",":
                    if line[j] == '"':
                        return []  # quote inside an unquoted field
                    j += 1
                fields.append(line[i:j])
                i = j
            if i >= n:
                return fields
            i += 1  # skip the comma; a trailing comma yields one more empty field
  javascript: |
    function parseCsvRecord(line) {
      const fields = [];
      const n = line.length;
      let i = 0;
      while (true) {
        if (i < n && line[i] === '"') {
          i++;
          let buf = '';
          while (true) {
            if (i >= n) return [];
            const ch = line[i];
            if (ch === '"') {
              if (i + 1 < n && line[i + 1] === '"') {
                buf += '"';
                i += 2;
              } else {
                i++;
                break;
              }
            } else {
              buf += ch;
              i++;
            }
          }
          fields.push(buf);
          if (i < n && line[i] !== ',') return [];
        } else {
          let j = i;
          while (j < n && line[j] !== ',') {
            if (line[j] === '"') return [];
            j++;
          }
          fields.push(line.slice(i, j));
          i = j;
        }
        if (i >= n) return fields;
        i++;
      }
    }
