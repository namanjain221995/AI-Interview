expected_concepts:
  - single-pass scanner with an index into the line
  - two parsing modes (quoted and unquoted) chosen by the first character of a field
  - escaped quote handling by looking one character ahead
  - explicit malformed-input detection instead of guessing
  - splitting on commas alone is wrong because commas can sit inside quotes
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Writes a clean single-pass scanner with separate quoted and unquoted branches, handles doubled quotes with one-character lookahead, rejects all three malformed shapes, gets the empty-line and trailing-comma field counts right and explains O(n).
  good: Correct scanner for well-formed input with one or two malformed or empty-field cases fixed after running the tests.
  weak: Splits on commas first and then tries to repair quoted fields, ignores doubled quotes, or returns partial results for malformed records.
  criteria:
    correctness: All tests pass, including doubled quotes, empty fields and every malformed shape.
    efficiency: One linear pass; no repeated string concatenation in a way that becomes quadratic.
    code_quality: Clear state (index, current field, mode) and small, readable branches rather than nested special cases.
    edge_cases: Empty line, trailing comma, quoted empty field, quote at the very end, spaces around quotes.
    communication: States the field-count rule and the malformed rules before coding and walks through an escaped-quote example.
hints:
  - Splitting the line on every comma cannot work because commas may sit inside quoted fields; think about reading the line one character at a time.
  - Decide how to read each field by looking at its first character - a quote switches you into a mode where commas are ordinary characters until the closing quote.
  - Keep an index and parse field by field; in quoted mode a quote followed by another quote adds one literal quote, while a lone quote ends the field and must be followed by a comma or the end of the line; in unquoted mode read up to the next comma and fail on any quote; after each field, stop at the end of the line or skip exactly one comma and parse the next field (which may be empty).
followups:
  - How would you extend the parser to records that span several lines because a quoted field contains a newline?
  - How would you report where the record is malformed instead of returning an empty list?
  - What changes if the delimiter is configurable, for example a semicolon or a tab?
  - How would you stream a multi-gigabyte export through this parser with bounded memory?
common_errors:
  - Splitting on commas first, which breaks quoted fields that contain commas.
  - Treating a doubled quote as the end of the field, or emitting both quote characters.
  - Returning [] for an empty line instead of one empty field, or dropping the empty field after a trailing comma.
  - Trimming spaces from unquoted fields, which the rules say are kept verbatim.
  - Accepting text after a closing quote, such as a space before the next comma.
