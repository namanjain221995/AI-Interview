version: 1
slug: shortest_funnel_window
title: "Shortest Funnel Window"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [data_analyst, data, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Shortest Funnel Window

  A product analytics tool stores a session's clickstream as a string `events`, one lowercase letter per
  event (for example `v` = viewed a product, `c` = added to cart, `p` = paid). A conversion **funnel** is
  another string `funnel`: the steps a user must take **in this order**, although other events may happen
  between the steps.

  To show the tightest example of a conversion, the tool needs the **shortest contiguous stretch** of
  `events` that contains `funnel` as a subsequence (every step of the funnel appears in the stretch, in
  funnel order, not necessarily next to each other).

  Write `min_funnel_window(events, funnel)` that returns that stretch. If several stretches have the same
  minimum length, return the one that **starts earliest**. If no stretch contains the funnel, return an
  empty string.

  ### Example 1
  ```
  Input:  events = "vsvcsvcp", funnel = "vcp"
  Output: "vcp"
  Explanation: "vsvcsvcp" contains the funnel, but the stretch starting at index 5 ("vcp")
  is the shortest
  ```

  ### Example 2
  ```
  Input:  events = "vvccv", funnel = "vcp"
  Output: ""
  Explanation: nobody paid, so the funnel never completes
  ```

  ### Example 3
  ```
  Input:  events = "vxcpvycp", funnel = "vcp"
  Output: "vxcp"
  Explanation: "vxcp" (index 0) and "vycp" (index 4) both have length 4; the earlier one wins
  ```

  ### Constraints
  - `1 <= events.length <= 2 * 10^4`
  - `1 <= funnel.length <= 100`
  - Both strings consist of lowercase English letters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_funnel_window
  params:
    - {name: events, type: string}
    - {name: funnel, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def min_funnel_window(events: str, funnel: str) -> str:
        n = len(events)
        # nxt[i][c] = first index >= i where letter c occurs, or n if it never does.
        nxt: list[list[int]] = [[]] * (n + 1)
        row = [n] * 26
        nxt[n] = row
        for i in range(n - 1, -1, -1):
            row = row[:]
            row[ord(events[i]) - 97] = i
            nxt[i] = row

        best_start, best_len = -1, n + 1
        for start in range(n):
            if events[start] != funnel[0]:
                continue
            pos = start
            for step in funnel[1:]:
                pos = nxt[pos + 1][ord(step) - 97]  # earliest next occurrence keeps the window tight
                if pos == n:
                    break
            if pos == n:
                break  # a later start cannot complete the funnel either
            if pos - start + 1 < best_len:  # strict, so the earliest start wins ties
                best_start, best_len = start, pos - start + 1
        return "" if best_start < 0 else events[best_start:best_start + best_len]
  javascript: |
    function minFunnelWindow(events, funnel) {
      const n = events.length;
      const m = funnel.length;
      let bestStart = -1;
      let bestLen = n + 1;
      let i = 0;
      let j = 0;
      while (i < n) {
        if (events[i] === funnel[j]) j++;
        if (j === m) {
          // i is the end of a window; walk back to find the latest start for this end.
          const end = i;
          j = m - 1;
          while (j >= 0) {
            if (events[i] === funnel[j]) j--;
            i--;
          }
          i++;
          if (end - i + 1 < bestLen) {
            bestLen = end - i + 1;
            bestStart = i;
          }
          j = 0;
        }
        i++;
      }
      return bestStart < 0 ? "" : events.slice(bestStart, bestStart + bestLen);
    }
tests:
  - {id: t1, args: ["vsvcsvcp", "vcp"], expected: "vcp", description: "Example 1 - shortest window starts late"}
  - {id: t2, args: ["vvccv", "vcp"], expected: "", description: "Example 2 - funnel never completes"}
  - {id: t3, args: ["vxcpvycp", "vcp"], expected: "vxcp", description: "Example 3 - tie on length, earliest start wins"}
  - {id: t4, hidden: true, args: ["xyz", "y"], expected: "y", description: "Single-step funnel"}
  - {id: t5, hidden: true, args: ["abc", "abc"], expected: "abc", description: "Funnel equals the whole stream"}
  - {id: t6, hidden: true, args: ["ab", "abc"], expected: "", description: "Funnel longer than the stream"}
  - {id: t7, hidden: true, args: ["cba", "abc"], expected: "", description: "All steps present but in the wrong order"}
  - {id: t8, hidden: true, args: ["abaa", "aa"], expected: "aa", description: "Repeated step in the funnel - window 'aba' loses to 'aa'"}
  - {id: t9, hidden: true, args: ["abbbbcabcxabc", "abc"], expected: "abc", description: "Earliest start has a long window; overlapping shorter windows later, tie between two"}
  - {id: t10, hidden: true, args: ["", "vvvcccppp"], expected: "vccrrvrcvcccpcspp", description: "Stress: 1000 random events over five letters, nine-step funnel with repeated steps"}
expected_concepts:
  - "subsequence matching inside a contiguous window"
  - "greedy earliest-next-occurrence matching from each candidate start (next-occurrence table)"
  - "or a forward scan to find a window end and a backward scan to tighten its start"
  - "tie-breaking by earliest start with a strict comparison"
  - "O(n * m) time instead of checking every substring"
optimal_complexity: {time: "O(n * m) for n events and m funnel steps", space: "O(n * alphabet) for the next-occurrence table, or O(1) with the forward-backward scan"}
rubric:
  excellent: "Explains why, for a fixed start, matching each step at its earliest next occurrence gives the shortest window, implements either the next-occurrence table or the forward-backward scan in O(n * m), handles ties with a strict comparison and returns the empty string when the funnel never completes."
  good: "Correct O(n * m) or O(n * m)-ish dynamic programming over (position, step) with a small fix for ties or for the no-answer case."
  weak: "Checks every substring for the subsequence property (cubic), uses a sliding window that ignores the order of steps, or returns a later window on ties."
  criteria:
    correctness: "All tests pass, including repeated letters in the funnel, ties and funnels that never complete."
    efficiency: "Avoids the cubic brute force; handles long clickstreams within the time limit."
    code_quality: "Clear names for window start, end and funnel step; the backward tightening step is easy to follow."
    edge_cases: "Single-step funnel, funnel equal to the whole stream, funnel longer than the stream, repeated steps such as aa."
    communication: "Justifies the greedy earliest-match argument and the tie-breaking rule."
hints:
  - "Order matters but adjacency does not, so a sliding window that only counts letters is not enough; think about where a window can start and where it must end."
  - "If you fix the starting event (it must be the first funnel step), matching every later step at its earliest possible occurrence gives the shortest window for that start; finding those earliest occurrences quickly is the key."
  - "Either precompute, for every position and letter, the next index where that letter occurs and jump through the funnel from each candidate start, or scan forward until the funnel completes and then scan backward from that end matching the funnel in reverse to find the tightest start; keep a window only if it is strictly shorter than the best so far, so the earliest one wins ties."
followups:
  - "How would you count how many distinct minimal windows exist?"
  - "What if the funnel allowed a maximum time gap between consecutive steps?"
  - "How would you process a live stream where events keep arriving?"
  - "How would the solution change for a larger alphabet of event types, such as arbitrary event names?"
common_errors:
  - "Using a character-count sliding window, which accepts windows where the steps are out of order."
  - "Starting the next search from the window end instead of just after its start, which skips overlapping shorter windows."
  - "Using a non-strict comparison so a later window replaces an earlier one of the same length."
  - "Checking every substring with a subsequence test, which is cubic and too slow for long streams."
