version: 1
slug: effective_env_file_value
title: "Effective .env Value"
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [devops, backend, platform, fullstack]
time_limit_minutes: 12
prompt_markdown: |
  ## Effective .env Value

  A service reads its settings from a `.env`-style file at start-up. During an incident you need to know
  which value the service is **actually** using for one setting, but the file has grown over time and
  contains comments, leftovers and repeated definitions.

  Given the file as a list of `lines` and a `key`, write `effective_env_file_value(lines, key)` that
  returns the value the service will use. The service reads the file top to bottom with these rules
  (whitespace means spaces and tabs):

  - A line that is empty or contains only whitespace is ignored.
  - A line whose first non-whitespace character is `#` is a comment and is ignored.
  - Any other line without an `=` is ignored.
  - Every remaining line is split at its **first** `=`: the part before it is the key and the part after
    it is the value. Both are trimmed of leading and trailing whitespace; nothing else is changed (the
    value may itself contain `=` or `#`, and quotes have no special meaning).
  - Keys are **case-sensitive** and must match `key` exactly.
  - When a key is defined more than once, the **last** definition wins.

  Return the value of `key`, or the empty string `""` if `key` is never defined. A definition with an
  empty value (such as `TOKEN=`) also returns `""`.

  ### Example 1
  ```
  Input:  lines = ["# database", "DB_HOST = localhost", "DB_PORT=5432", "DB_HOST=db.internal"], key = "DB_HOST"
  Output: "db.internal"
  Explanation: the second DB_HOST line overrides the first
  ```

  ### Example 2
  ```
  Input:  lines = ["API_URL=https://api.example.com/v2?region=eu", "  # API_URL=http://old.example.com"], key = "API_URL"
  Output: "https://api.example.com/v2?region=eu"
  Explanation: only the first '=' splits the line; the indented line is a comment
  ```

  ### Example 3
  ```
  Input:  lines = ["DEBUG", "Debug=true", "DEBUG_SQL=1"], key = "DEBUG"
  Output: ""
  Explanation: keys are case-sensitive and must match exactly, so DEBUG is never defined
  ```

  ### Constraints
  - `0 <= lines.length <= 10^4`
  - `0 <= lines[i].length <= 200`; lines contain printable ASCII characters and tabs.
  - `1 <= key.length <= 50`; `key` consists of letters, digits and underscores.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: effective_env_file_value
  params:
    - {name: lines, type: "string[]"}
    - {name: key, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def effective_env_file_value(lines: list[str], key: str) -> str:
        value = ""
        for line in lines:
            stripped = line.strip(" \t")
            if not stripped or stripped.startswith("#"):
                continue
            name, sep, raw = line.partition("=")
            if not sep:
                continue
            if name.strip(" \t") == key:
                value = raw.strip(" \t")  # keep scanning: a later definition wins
        return value
  javascript: |
    function effectiveEnvFileValue(lines, key) {
      const trim = (s) => s.replace(/^[ \t]+|[ \t]+$/g, "");
      let value = "";
      for (const line of lines) {
        const stripped = trim(line);
        if (stripped === "" || stripped.startsWith("#")) continue;
        const eq = line.indexOf("=");
        if (eq === -1) continue;
        if (trim(line.slice(0, eq)) === key) value = trim(line.slice(eq + 1));
      }
      return value;
    }
