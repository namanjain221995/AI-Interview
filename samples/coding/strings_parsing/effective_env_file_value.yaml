B_HOST=v435", "", "QUEUE_URL =  v437", "# QUEUE_URL=commented-438", "DB_PORT= v439", "FEATURE_X=v440", "", "# DB_PORT=commented-442", "DB_HOST  =v443", "REGION = v444", "DB_HOST=  v445", "CACHE_TTL  =  v446", "QUEUE_URL  =  v447", "DB_PORT=v448", "", "DB_PORT=v450", "DB_HOST=  v451", "DB_PORT= v452", "# QUEUE_URL=commented-453", "WORKERS  = v454", "DB_PORT  = v455", "", "", "WORKERS  =v458", "FEATURE_X  = v459", "", "DB_PORT= v461", "# DB_HOST=commented-462", "# WORKERS=commented-463", "REGION =  v464", "", "FEATURE_X  =  v466", "CACHE_TTL  =v467", "", "", "REGION  =v470", "WORKERS =v471", "CACHE_TTL  =v472", "REGION  =  v473", "REGION  = v474", "QUEUE_URL  =v475", "FEATURE_X  =v476", "CACHE_TTL= v477", "DB_HOST  =v478", "# DB_HOST=commented-479", "# QUEUE_URL=commented-480", "CACHE_TTL=  v481", "", "# WORKERS=commented-483", "WORKERS=  v484", "", "CACHE_TTL=  v486", "DB_HOST  = v487", "# DB_PORT=commented-488", "# DB_HOST=commented-489", "", "REGION  =v491", "WORKERS  = v492", "DB_PORT=  v493", "# CACHE_TTL=commented-494", "CACHE_TTL= v495", "   #CACHE_TTL=x496", "", "CACHE_TTL  =  v498", "CACHE_TTL  =  v499", "WORKERS=16", "# WORKERS=32", "WORKERS"], "WORKERS"], expected: "16", description: "503 lines mixing comments, blanks and definitions; last real WORKERS line is near the end"}
expected_concepts:
  - "line classification: blank, comment, malformed, definition"
  - "splitting on the first separator only"
  - "trimming key and value while preserving inner characters"
  - "last definition wins, so the scan continues to the end"
optimal_complexity: {time: "O(total characters)", space: "O(1) extra besides the current line"}
rubric:
  excellent: "Classifies each line in the stated order, splits on the first '=' only, trims just the ends, compares keys exactly and keeps the last definition; explains why an empty value still counts as a definition."
  good: "Correct solution that needs a nudge on one rule such as splitting on the first '=' or indented comments."
  weak: "Splits on every '=', strips inline '#' text, compares keys case-insensitively, returns the first definition or treats an explicit empty value as undefined."
  criteria:
    correctness: "All tests pass, including values containing '=' or '#', indented comments and case differences."
    efficiency: "A single pass over the lines; no maps of every key are needed although they are acceptable."
    code_quality: "The ignore rules are easy to read and match the statement; trimming is done in one place."
    edge_cases: "Empty file, explicit empty value overriding a real one, tabs, empty key and keys that share a prefix."
    communication: "Explains how ambiguous lines are classified and checks the rules against the examples."
hints:
  - "Process the file the way the service does, one line at a time from the top, deciding first whether a line counts at all."
  - "A line only defines something if it is not blank, not a comment after leading whitespace and contains an equals sign; for such a line, cut it at the first equals sign only and trim both halves."
  - "Keep a single result variable that starts as the empty string; for every defining line whose trimmed key equals the requested key exactly, overwrite the result with its trimmed value and keep going, so the last definition is what remains at the end."
followups:
  - "How would you support an export prefix or quoted values with escaped characters?"
  - "If the service also lets real environment variables override the file, how would you report where the effective value came from?"
  - "How would you build a lint tool that warns about keys defined more than once?"
common_errors:
  - "Splitting on every '=' so values like a URL with a query string are cut short."
  - "Treating '#' in the middle of a value as the start of a comment."
  - "Only recognising comments that start in the first column."
  - "Returning the first definition, or ignoring an explicitly empty later definition."
