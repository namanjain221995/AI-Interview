expected_concepts:
  - "backtracking over three cut positions"
  - "pruning by remaining length (each octet has 1 to 3 digits)"
  - "octet validation: range 0-255 and no leading zeros"
  - "bounded search space (at most 27 cut combinations)"
  - "deterministic output ordering"
optimal_complexity: {time: "O(1) - at most 3^3 splits of at most 12 digits", space: "O(1) besides the output"}
rubric:
  excellent: "Frames the task as choosing three cut points, writes a clean backtracking or triple-loop solution with a single octet validator, prunes on remaining length, handles empty and over-long inputs up front, sorts the output and explains why the search space is constant."
  good: "Correct solution with all validation rules, possibly with an unpruned triple loop or a missed early length check that is fixed after a test fails."
  weak: "Misses the leading-zero rule or the 255 bound, drops digits or reorders them, returns duplicates or forgets to sort."
  criteria:
    correctness: "All tests pass, including leading zeros, octets of exactly 255 and inputs with no answer."
    efficiency: "Explores at most 27 split combinations; prunes when the remaining digits cannot fill the remaining octets."
    code_quality: "Octet validation lives in one helper; the recursion or loops clearly mirror the four-octet structure."
    edge_cases: "Empty input, fewer than 4 or more than 12 digits, all zeros, values just above 255."
    communication: "Explains the validity rules before coding and why sorting is needed for a deterministic answer."
hints:
  - "An address is the digit string cut into four consecutive pieces. How many digits can a single piece have?"
  - "Choose the pieces one at a time from left to right, trying lengths one, two and three, and only continue when the piece is a valid octet: no leading zero unless it is exactly the digit 0, and a value of at most 255."
  - "Use a recursive search that tracks the current position and the octets chosen so far. When four octets are chosen and every digit is used, record the joined address. Skip a length early when the digits left over could not fill the remaining octets with one to three digits each. Sort the collected addresses before returning them."
followups:
  - "How would the approach change for IPv6, with eight groups of up to four hexadecimal digits?"
  - "If some characters in the log were unreadable and could be any digit, how would you count the possible addresses?"
  - "Why is the running time effectively constant here, and what would make it grow?"
  - "How would you rank the candidates by how likely they are, using a list of known subnets?"
common_errors:
  - "Accepting octets with leading zeros such as 01 or 00."
  - "Comparing octets to 255 as strings, which mis-orders values such as 99 and 100."
  - "Accepting splits that leave digits unused at the end."
  - "Returning the addresses in discovery order instead of sorted order."
  - "Parsing an octet before checking its length, which can overflow on very long inputs in some languages."
