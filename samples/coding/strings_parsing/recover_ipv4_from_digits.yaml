slug: recover_ipv4_from_digits
title: "Recover IPv4 Addresses from Digits"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, sre, support_engineer]
time_limit_minutes: 20
prompt_markdown: |
  ## Recover IPv4 Addresses from Digits

  A log shipper on an edge firewall had a bug that stripped every `.` from the client addresses it
  recorded, so an entry such as `10.1.20.3` was written as `101203`. While reconstructing an incident
  timeline you want to list every address a damaged entry **could** have been.

  Given the string `digits`, return every valid dotted IPv4 address that uses **all** of the digits,
  **in their original order**, with exactly three dots inserted. An address is valid when:

  - it has exactly four octets separated by dots;
  - every octet is a decimal number from `0` to `255`;
  - no octet has a leading zero: `0` on its own is fine, but `00`, `01` or `010` are not.

  Return the addresses sorted in ascending order **as plain strings** (character by character, where
  `.` sorts before every digit). Each address appears once. If no valid address exists, return an empty
  list.

  ### Example 1
  ```
  Input:  digits = "19216811"
  Output: ["1.92.168.11", "19.2.168.11", "19.21.68.11", "19.216.8.11", "19.216.81.1", "192.1.68.11", "192.16.8.11", "192.16.81.1", "192.168.1.1"]
  ```

  ### Example 2
  ```
  Input:  digits = "0000"
  Output: ["0.0.0.0"]
  Explanation: Every octet must be the single digit 0.
  ```

  ### Example 3
  ```
  Input:  digits = "101203"
  Output: ["1.0.1.203", "1.0.120.3", "10.1.20.3", "10.12.0.3", "101.2.0.3"]
  ```

  ### Constraints
  - `0 <= digits.length <= 20`
  - `digits` contains only the characters `0` to `9`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: candidate_ipv4_addresses
  params:
    - {name: digits, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def candidate_ipv4_addresses(digits: str) -> list[str]:
        results: list[str] = []
        n = len(digits)
        if n < 4 or n > 12:
            return results

        def valid(part: str) -> bool:
            if part[0] == "0" and len(part) > 1:
                return False  # leading zero
            return int(part) <= 255

        def place(start: int, octets: list[str]) -> None:
            if len(octets) == 4:
                if start == n:
                    results.append(".".join(octets))
                return
            remaining_octets = 4 - len(octets)
            for size in (1, 2, 3):
                end = start + size
                if end > n:
                    break
                rest = n - end
                # Prune: the remaining digits must fit into the remaining octets.
                if rest < remaining_octets - 1 or rest > 3 * (remaining_octets - 1):
                    continue
                part = digits[start:end]
                if valid(part):
                    octets.append(part)
                    place(end, octets)
                    octets.pop()

        place(0, [])
        results.sort()
        return results
  javascript: |
    function candidateIpv4Addresses(digits) {
      const results = [];
      const n = digits.length;
      if (n < 4 || n > 12) return results;
      const valid = (part) => !(part[0] === "0" && part.length > 1) && Number(part) <= 255;
      const octets = [];
      const place = (start) => {
        if (octets.length === 4) {
          if (start === n) results.push(octets.join("."));
          return;
        }
        const remainingOctets = 4 - octets.length;
        for (let size = 1; size <= 3; size++) {
          const end = start + size;
          if (end > n) break;
          const rest = n - end;
          if (rest < remainingOctets - 1 || rest > 3 * (remainingOctets - 1)) continue;
          const part = digits.slice(start, end);
          if (valid(part)) {
            octets.push(part);
            place(end);
            octets.pop();
          }
        }
      };
      place(0);
      // Plain code-unit order: '.' sorts before every digit.
      results.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return results;
    }
