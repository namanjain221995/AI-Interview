slug: snake_to_camel_config_keys
title: "Snake Case to Camel Case Config Keys"
difficulty: easy
competency_keys: [code_quality, problem_solving]
role_tags: [frontend, fullstack, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Snake Case to Camel Case Config Keys

  A frontend receives its runtime configuration from a backend that names keys in snake_case, but the
  frontend code base uses camelCase. Some keys were typed by hand over the years and contain doubled or
  trailing underscores, so the converter has to be precise.

  Each key consists of lower-case letters, digits and underscores. Write
  `snake_to_camel_config_keys(keys)` that converts every key with these rules and returns the converted
  keys in the same order:

  - The **leading** underscores of a key (the longest prefix made only of `_`) are kept unchanged. A key
    made only of underscores is therefore returned as it is.
  - In the rest of the key, every run of one or more underscores that is followed by another character
    is a **separator**: the underscores are removed, and the character right after them is upper-cased
    if it is a letter (a digit stays as it is).
  - Underscores at the **end** of the key are removed.
  - All other characters are copied unchanged.

  ### Example 1
  ```
  Input:  keys = ["max__retry_count_", "_private_key", "timeout"]
  Output: ["maxRetryCount", "_privateKey", "timeout"]
  ```

  ### Example 2
  ```
  Input:  keys = ["level_2_cache", "ipv6_addr", "__dunder__"]
  Output: ["level2Cache", "ipv6Addr", "__dunder"]
  Explanation: the separator before 2 is dropped and 2 is unchanged; C after it is a letter and is upper-cased
  ```

  ### Constraints
  - `0 <= keys.length <= 10^4`
  - `1 <= keys[i].length <= 100`
  - `keys[i]` consists of lower-case letters `a`-`z`, digits `0`-`9` and underscores `_`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: snake_to_camel_config_keys
  params:
    - {name: keys, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def snake_to_camel_config_keys(keys: list[str]) -> list[str]:
        result: list[str] = []
        for key in keys:
            lead = len(key) - len(key.lstrip("_"))
            out = [key[:lead]]  # leading underscores are kept as they are
            upper_next = False
            for ch in key[lead:]:
                if ch == "_":
                    upper_next = True  # a run of underscores is one separator; trailing ones vanish
                    continue
                out.append(ch.upper() if upper_next and ch.isalpha() else ch)
                upper_next = False
            result.append("".join(out))
        return result
  javascript: |
    function snakeToCamelConfigKeys(keys) {
      return keys.map((key) => {
        let lead = 0;
        while (lead < key.length && key[lead] === "_") lead++;
        let out = key.slice(0, lead);
        let upperNext = false;
        for (let i = lead; i < key.length; i++) {
          const ch = key[i];
          if (ch === "_") {
            upperNext = true;
            continue;
          }
          out += upperNext && ch >= "a" && ch <= "z" ? ch.toUpperCase() : ch;
          upperNext = false;
        }
        return out;
      });
    }
