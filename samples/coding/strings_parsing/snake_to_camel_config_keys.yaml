expected_concepts:
  - "character scan with a pending-separator flag"
  - "treating a run of underscores as one separator"
  - "special handling of leading and trailing underscores"
  - "upper-casing letters only, leaving digits unchanged"
optimal_complexity: {time: "O(total characters)", space: "O(total characters) for the output"}
rubric:
  excellent: "Keeps the leading-underscore prefix, scans the rest with a flag that marks a pending separator, upper-cases only letters after a separator, drops trailing underscores naturally and builds each key in linear time."
  good: "Correct conversion that needs a nudge on one rule such as underscore runs, digits after a separator or all-underscore keys."
  weak: "Splits on single underscores and capitalises empty parts, removes leading underscores, keeps trailing underscores or crashes on a key made only of underscores."
  criteria:
    correctness: "All tests pass, including runs of underscores, leading and trailing underscores and digits after separators."
    efficiency: "Linear in the total number of characters."
    code_quality: "One small helper per key with clear state; no chains of string replacements that are hard to reason about."
    edge_cases: "Empty list, all-underscore keys, single-character keys, leading digits and duplicate keys."
    communication: "Explains how each underscore rule is implemented and checks them against the examples."
hints:
  - "Handle the three kinds of underscores separately: the ones at the very start, the ones between parts and the ones at the very end."
  - "Copy the leading underscores first, then walk the remaining characters while remembering whether you have just passed one or more underscores."
  - "For each remaining character: an underscore only sets a pending-separator flag; any other character is appended, upper-cased if the flag is set and it is a letter, and then the flag is cleared; a flag still set at the end simply means the trailing underscores are dropped."
followups:
  - "How would you write the reverse conversion, and is it always a perfect round trip?"
  - "What should happen if two different snake_case keys convert to the same camelCase key?"
  - "How would you apply the conversion recursively to a nested configuration object?"
common_errors:
  - "Splitting on '_' and capitalising each part, which produces wrong results for runs of underscores."
  - "Stripping leading underscores that mark private keys."
  - "Upper-casing a digit or the character after a leading underscore."
  - "Leaving trailing underscores in the output."
