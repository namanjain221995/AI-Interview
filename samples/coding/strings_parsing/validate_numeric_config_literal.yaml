version: 1
slug: validate_numeric_config_literal
title: Validate a Numeric Config Literal
difficulty: medium
competency_keys: [problem_solving, code_quality]
role_tags: [backend, platform, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Validate a Numeric Config Literal

  A configuration linter checks every numeric value before a config file is deployed. Write the check
  for one literal `s`. A valid literal consists of these parts, in order, with nothing else around them:

  1. **Sign (optional):** a single `+` or `-`.
  2. **Mantissa (required):** digits before and/or after **at most one** `.`. At least one digit must
     appear in the mantissa, so `5`, `5.`, `.5` and `5.5` are fine but `.` alone is not.
     Inside a run of digits a single `_` may be used as a separator, but **only between two digits**:
     `1_000.000_5` is valid, while `1__000`, `_1`, `1_`, `1_.5` and `1._5` are not.
  3. **Exponent (optional):** an `e` or `E`, then an optional single `+` or `-`, then **one or more
     digits**. Underscores are not allowed in the exponent.

  No whitespace or any other character is allowed anywhere. Return `true` if `s` is a valid literal and
  `false` otherwise.

  ### Example 1
  ```
  Input:  s = "1_000.5"
  Output: true
  ```

  ### Example 2
  ```
  Input:  s = "-.25e+3"
  Output: true
  ```

  ### Example 3
  ```
  Input:  s = "1__000"
  Output: false
  Explanation: Two separators in a row are not between two digits.
  ```

  ### Constraints
  - `0 <= s.length <= 100`
  - `s` contains printable ASCII characters only.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_valid_numeric_literal
  params:
    - {name: s, type: string}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def is_valid_numeric_literal(s: str) -> bool:
        n = len(s)
        i = 0

        def digit_run(start: int, allow_underscore: bool) -> int:
            """Index after the longest valid digit run starting at start (start if none)."""
            j = start
            while j < n and s[j].isdigit():
                j += 1
                if allow_underscore and j + 1 < n and s[j] == "_" and s[j + 1].isdigit():
                    j += 1
            return j

        if i < n and s[i] in "+-":
            i += 1
        start = i
        i = digit_run(i, True)
        digits = i - start
        if i < n and s[i] == ".":
            i += 1
            after = i
            i = digit_run(i, True)
            digits += i - after
        if digits == 0:
            return False
        if i < n and s[i] in "eE":
            i += 1
            if i < n and s[i] in "+-":
                i += 1
            exponent_start = i
            i = digit_run(i, False)
            if i == exponent_start:
                return False
        return i == n
  javascript: |
    function isValidNumericLiteral(s) {
      const n = s.length;
      const isDigit = (c) => c >= "0" && c <= "9";
      const digitRun = (start, allowUnderscore) => {
        let j = start;
        while (j < n && isDigit(s[j])) {
          j++;
          if (allowUnderscore && j + 1 < n && s[j] === "_" && isDigit(s[j + 1])) j++;
        }
        return j;
      };
      let i = 0;
      if (i < n && (s[i] === "+" || s[i] === "-")) i++;
      let start = i;
      i = digitRun(i, true);
      let digits = i - start;
      if (i < n && s[i] === ".") {
        i++;
        start = i;
        i = digitRun(i, true);
        digits += i - start;
      }
      if (digits === 0) return false;
      if (i < n && (s[i] === "e" || s[i] === "E")) {
        i++;
        if (i < n && (s[i] === "+" || s[i] === "-")) i++;
        const exponentStart = i;
        i = digitRun(i, false);
        if (i === exponentStart) return false;
      }
      return i === n;
    }
tests:
  - {id: t1, args: ["1_000.5"], expected: true, description: "Example 1 - separator between digits plus a fraction"}
  - {id: t2, args: ["-.25e+3"], expected: true, description: "Example 2 - sign, fraction-only mantissa and signed exponent"}
  - {id: t3, args: ["1__000"], expected: false, description: "Example 3 - doubled separator"}
  - {id: t4, hidden: true, args: [""], expected: false, description: "Empty string has no mantissa digit"}
  - {id: t5, hidden: true, args: ["+.e1"], expected: false, description: "Sign and point but no mantissa digit before the exponent"}
  - {id: t6, hidden: true, args: ["7."], expected: true, description: "Trailing point after a digit is a valid mantissa"}
  - {id: t7, hidden: true, args: ["1_.5"], expected: false, description: "Separator directly before the point"}
  - {id: t8, hidden: true, args: ["1e1_0"], expected: false, description: "Separator inside the exponent is not allowed"}
  - {id: t9, hidden: true, args: ["12E-07"], expected: true, description: "Uppercase exponent marker with sign and leading zeros in the exponent"}
  - {id: t10, hidden: true, args: ["3e"], expected: false, description: "Exponent marker without digits"}
  - {id: t11, hidden: true, args: [" 42"], expected: false, description: "Leading whitespace is rejected"}
  - {id: t12, hidden: true, args: ["0_1.2_3_4e+5"], expected: true, description: "Several valid separators on both sides of the point"}
  - {id: t13, hidden: true, args: ["--1"], expected: false, description: "Two signs"}
expected_concepts:
  - single left-to-right scan with an index (or a small state machine)
  - separator allowed only when both neighbours are digits
  - counting mantissa digits on both sides of the point
  - requiring the scan to consume the whole string
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Splits the grammar into sign, mantissa and exponent, scans once with clear helper logic for digit runs, enforces the between-two-digits separator rule and the at-least-one-digit rule, checks that the whole string was consumed, and walks through tricky inputs before running tests.
  good: Correct scanner or state machine that needs one or two test failures to fix corner cases such as a trailing point or a separator next to the point.
  weak: Leans on a language number parser that accepts different syntax, misses the separator rules, or accepts strings with leftover characters.
  criteria:
    correctness: All tests pass, including empty input, exponent without digits and separators next to the point.
    efficiency: One linear pass with constant extra space.
    code_quality: Grammar parts are visible in the code structure; no deeply nested special cases.
    edge_cases: Empty string, lone point, trailing point, leading whitespace, doubled signs, separators at run boundaries.
    communication: States the grammar back before coding and lists test inputs for each rule.
hints:
  - Write the rules as three consecutive parts - sign, mantissa, exponent - and think about scanning them in that order with a single index.
  - A run of digits with separators can be read with one helper that consumes a digit and then, only if the next two characters are a separator followed by a digit, consumes the separator too; count how many mantissa digits you saw on both sides of the point.
  - Skip an optional sign, read a digit run, optionally a point and another digit run, and fail if neither run had a digit; then, if an exponent marker follows, skip an optional sign and require at least one plain digit without separators. The literal is valid only if the index has reached the end of the string.
followups:
  - How would you also return the numeric value without losing precision?
  - How would you report the position and reason of the first error for the linter message?
  - How would you extend the grammar to hexadecimal literals such as 0x1F with separators?
  - Would a regular expression be a good fit here, and how would you test it?
common_errors:
  - Accepting a lone point or a sign with no digits as a mantissa.
  - Allowing a separator next to the point or at the start or end of a run.
  - Accepting an exponent marker that is not followed by digits.
  - Forgetting to check that the whole string was consumed, so trailing characters slip through.
  - Using a built-in float parser, which accepts whitespace, infinity or other syntax.
