slug: one_mismatch_pattern_positions
title: One-Mismatch Pattern Positions
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [security, backend, data_scientist]
time_limit_minutes: 35
prompt_markdown: |
  ## One-Mismatch Pattern Positions

  A security scanner looks for malware signatures that attackers have mutated slightly to dodge exact
  matching. Given a byte dump rendered as the string `text` and a non-empty signature `pattern`, report every
  start index `i` where the window `text[i .. i + len(pattern) - 1]` differs from `pattern` in **at most one**
  position (an exact match also counts).

  Return the matching start indices in **ascending order**. Return an empty list when there are none,
  including when `pattern` is longer than `text`.

  ### Example 1
  ```
  Input:  text = "deaddeafdbad", pattern = "dead"
  Output: [0, 4, 8]
  Explanation: "dead" at 0 is exact, "deaf" at 4 and "dbad" at 8 differ in one position each; windows like "adea" differ in more.
  ```

  ### Example 2
  ```
  Input:  text = "xyxyxy", pattern = "ab"
  Output: []
  Explanation: Every window differs from "ab" in two positions.
  ```

  ### Constraints
  - `0 <= text.length <= 2 * 10^5`
  - `1 <= pattern.length <= 2 * 10^5`
  - Both strings consist of lowercase English letters and digits.

  **Follow-up:** comparing the pattern against every window costs `O(n * m)`, which is too slow when both
  strings are long. Aim for `O(n + m)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: near_match_positions
  params:
    - {name: text, type: "string"}
    - {name: pattern, type: "string"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def near_match_positions(text: str, pattern: str) -> list[int]:
        n, m = len(text), len(pattern)
        if m > n:
            return []

        def z_function(s: str) -> list[int]:
            z = [0] * len(s)
            left = right = 0
            for i in range(1, len(s)):
                if i < right:
                    z[i] = min(right - i, z[i - left])
                while i + z[i] < len(s) and s[z[i]] == s[i + z[i]]:
                    z[i] += 1
                if i + z[i] > right:
                    left, right = i, i + z[i]
            return z

        # prefix[i]: how many leading pattern characters match text starting at i
        zf = z_function(pattern + "\x00" + text)
        prefix = zf[m + 1:]
        # suffix[e]: how many trailing pattern characters match text ending at e
        zb = z_function(pattern[::-1] + "\x00" + text[::-1])
        back = zb[m + 1:]
        result = []
        for i in range(n - m + 1):
            end = i + m - 1
            if prefix[i] >= m or prefix[i] + back[n - 1 - end] >= m - 1:
                result.append(i)
        return result
  javascript: |
    function nearMatchPositions(text, pattern) {
      const n = text.length, m = pattern.length;
      if (m > n) return [];
      const zFunction = (s) => {
        const z = new Array(s.length).fill(0);
        let left = 0, right = 0;
        for (let i = 1; i < s.length; i++) {
          if (i < right) z[i] = Math.min(right - i, z[i - left]);
          while (i + z[i] < s.length && s[z[i]] === s[i + z[i]]) z[i]++;
          if (i + z[i] > right) { left = i; right = i + z[i]; }
        }
        return z;
      };
      const rev = (s) => s.split("").reverse().join("");
      const zf = zFunction(pattern + "\u0000" + text);
      const zb = zFunction(rev(pattern) + "\u0000" + rev(text));
      const result = [];
      for (let i = 0; i + m <= n; i++) {
        const end = i + m - 1;
        const pre = zf[m + 1 + i], suf = zb[m + 1 + (n - 1 - end)];
        if (pre >= m || pre + suf >= m - 1) result.push(i);
      }
      return result;
    }
