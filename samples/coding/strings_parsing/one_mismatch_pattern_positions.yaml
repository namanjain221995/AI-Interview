expected_concepts:
  - "longest common prefix of the pattern with text at each position"
  - "longest common suffix of the pattern with text ending at each position"
  - "Z-function (or rolling hash with binary search) to get those lengths in linear time"
  - "combining prefix and suffix match lengths to allow one mismatch"
optimal_complexity: {time: "O(n + m)", space: "O(n + m)"}
rubric:
  excellent: "Observes that a window has at most one mismatch exactly when the matched prefix length plus the matched suffix length is at least m - 1, computes both with Z-functions on the forward and reversed strings in O(n + m), and handles m > n and exact matches."
  good: "Uses hashing with binary search for the first mismatch (O(n log m)) or a correct Z-based approach with a small indexing slip fixed after testing."
  weak: "Compares each window character by character in O(n * m), or only finds exact matches."
  criteria:
    correctness: "All tests pass, including exact matches, mismatches at either end and an empty result."
    efficiency: "Linear or near-linear time; no per-window scan of the pattern."
    code_quality: "Z-function is a reusable helper; index translation between forward and reversed strings is clearly named."
    edge_cases: "Empty text, pattern longer than text, single-character pattern, window equal to the whole text."
    communication: "States the prefix-plus-suffix condition and proves it before coding."
hints:
  - "A window with at most one mismatch looks like a matching prefix of the pattern, then at most one bad character, then a matching suffix."
  - "If you knew, for every start position, how many leading pattern characters match there, and for every end position, how many trailing pattern characters match there, each window could be checked in constant time."
  - "Run a Z-function on the pattern, a separator and the text to get the matched prefix length at each start; do the same on the reversed pattern and reversed text to get the matched suffix length at each end. A start index qualifies when the prefix length is the full pattern or the prefix plus suffix lengths reach the pattern length minus one."
followups:
  - "How would you generalise to at most k mismatches, and what would the running time become?"
  - "How does a rolling-hash solution with binary search for the first mismatch compare in speed and risk?"
  - "What changes if the scanner must also tolerate one inserted or deleted character?"
  - "How would you scan for thousands of signatures at once?"
common_errors:
  - "Forgetting that an exact match also counts as at most one mismatch."
  - "Off-by-one errors when mapping an end index in the text to the reversed string."
  - "Using a separator character that can appear in the input, which lets Z values run past the pattern."
  - "Returning a window when the pattern is longer than the text."
  - "Falling back to an O(n * m) scan that times out on long inputs."
