version: 1
slug: config_drift_report
title: "Config Drift Report"
difficulty: easy
competency_keys: [data_structures, problem_solving]
role_tags: [devops, platform, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Config Drift Report

  A deployment agent compares the configuration that is actually running on a host (`deployed`) with
  the configuration checked into the repository (`desired`). Each configuration is a list of lines of
  the form `key=value`:

  - A line is split at its **first** `=`. Everything before it is the key; everything after it is the
    value, which may be empty and may itself contain more `=` characters.
  - Keys are unique within each list and are case-sensitive.

  Return the drift report as a list of strings:

  - `"+key"` for every key that appears only in `desired` (it must be added),
  - `"-key"` for every key that appears only in `deployed` (it must be removed),
  - `"~key"` for every key that appears in both lists with **different** values (it must be changed).

  Keys whose values are identical in both lists are not reported. Order the report by **key** in
  ascending string order (by character code), ignoring the leading symbol. Return an empty list when
  there is no drift.

  ### Example 1
  ```
  Input:  deployed = ["db.host=10.0.0.5", "db.pool=20", "log.level=info"],
          desired  = ["db.host=10.0.0.7", "db.pool=20", "cache.ttl=300"]
  Output: ["+cache.ttl", "~db.host", "-log.level"]
  Explanation: Sorted keys are cache.ttl, db.host, db.pool and log.level; db.pool is identical and omitted.
  ```

  ### Example 2
  ```
  Input:  deployed = ["feature.flags=a=1,b=2", "region=eu-west"],
          desired  = ["region=eu-west", "feature.flags=a=1,b=3"]
  Output: ["~feature.flags"]
  Explanation: Only the first '=' separates key and value, so the values are "a=1,b=2" and "a=1,b=3".
  ```

  ### Constraints
  - `0 <= deployed.length, desired.length <= 1000`
  - Each line has `1` to `100` printable ASCII characters and contains at least one `=`.
  - Every key is non-empty and contains only ASCII letters, digits, `.`, `_` and `-`.
  - Keys are unique within `deployed` and unique within `desired`.

  **Follow-up:** what is the cost of your approach if both configurations were already sorted by key?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: config_drift
  params:
    - {name: deployed, type: "string[]"}
    - {name: desired, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def config_drift(deployed: list[str], desired: list[str]) -> list[str]:
        def parse(lines: list[str]) -> dict[str, str]:
            values: dict[str, str] = {}
            for line in lines:
                key, _, value = line.partition("=")
                values[key] = value
            return values

        current, target = parse(deployed), parse(desired)
        report: list[str] = []
        for key in sorted(current.keys() | target.keys()):
            if key not in current:
                report.append("+" + key)
            elif key not in target:
                report.append("-" + key)
            elif current[key] != target[key]:
                report.append("~" + key)
        return report
  javascript: |
    function configDrift(deployed, desired) {
      const parse = (lines) => {
        const values = new Map();
        for (const line of lines) {
          const at = line.indexOf("=");
          values.set(line.slice(0, at), line.slice(at + 1));
        }
        return values;
      };
      const current = parse(deployed);
      const target = parse(desired);
      const keys = [...new Set([...current.keys(), ...target.keys()])];
      keys.sort((x, y) => (x < y ? -1 : x > y ? 1 : 0));
      const report = [];
      for (const key of keys) {
        if (!current.has(key)) report.push("+" + key);
        else if (!target.has(key)) report.push("-" + key);
        else if (current.get(key) !== target.get(key)) report.push("~" + key);
      }
      return report;
    }
