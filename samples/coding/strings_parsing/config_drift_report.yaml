expected_concepts:
- parsing key=value lines at the first separator
- hash maps keyed by config key
- set union and difference of keys
- sorting by key rather than by the formatted output
optimal_complexity:
  time: O((n + m) log(n + m))
  space: O(n + m)
rubric:
  excellent: Parses each line at the first '=' into two maps, walks the sorted union of keys emitting add, remove and change markers, sorts by key rather than by the formatted string, and explains the O((n + m) log(n + m)) cost dominated by sorting.
  good: Correct map-based solution that needs a nudge on splitting at the first '=' only or on sorting by key instead of by the prefixed string.
  weak: Splits on every '=', compares lists with nested loops, sorts the output strings so the symbols decide the order, or reports identical keys.
  criteria:
    correctness: All tests pass, including values containing '=', empty values and case-sensitive keys.
    efficiency: Hash lookups plus one sort of the key union instead of quadratic pairwise comparison.
    code_quality: A small parse helper and clear names for the two configurations.
    edge_cases: Empty lists, empty values, trailing spaces in values and keys that are prefixes of each other.
    communication: States the parsing rule and the ordering rule explicitly before coding.
hints:
- Turn each list into something that lets you ask quickly what value a given key has, and remember that a value may itself contain an equals sign.
- Once both configurations are lookups, every key that matters is in the union of their key sets; decide for each key whether it was added, removed or changed.
- Split every line at the first equals sign into two maps, take the union of the keys, sort that key list, and for each key emit a plus when it is missing from deployed, a minus when it is missing from desired, or a tilde when both have it with different values, skipping keys whose values match.
followups:
- If both inputs arrived already sorted by key, how would you produce the report in linear time?
- How would you extend the report to show the old and new value for each changed key?
- How would you treat keys that differ only in letter case if the deployment target were case-insensitive?
- What would change if a key could appear more than once and the last occurrence wins?
common_errors:
- Splitting on every '=' so values such as a=1,b=2 are truncated.
- Sorting the output strings, which orders by the +, - and ~ symbols instead of by key.
- Reporting keys whose values are identical.
- Treating an empty value as a missing key.
