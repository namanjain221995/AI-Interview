version: 1
slug: split_identifier_into_words
title: "Split an Identifier into Words"
difficulty: medium
competency_keys: [algorithms, code_quality, problem_solving]
role_tags: [frontend, backend, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Split an Identifier into Words

  A code-search indexer stores every identifier as a list of lower-case words, so that searching for
  `user id` finds `getUserID`, `user_id` and `USER-ID` alike. Identifiers arrive in any naming style
  (camelCase, PascalCase, snake_case, kebab-case, SCREAMING_CASE and mixtures of them).

  Split `identifier` into words using these rules:

  - The characters `_`, `-` and space are **separators**: they end the current word and never appear
    in the output.
  - Between two adjacent letters or digits, start a new word when:
    1. a lowercase letter is followed by an uppercase letter (`getUser` → `get` | `User`);
    2. a letter is followed by a digit, or a digit by a letter (`v2beta` → `v` | `2` | `beta`);
    3. two uppercase letters are adjacent and the second one is followed by a lowercase letter: the
       second capital starts a new word (`HTTPResponse` → `HTTP` | `Response`).
  - Runs of digits stay together (`404` is one word).

  Return the words lower-cased, in their original order, with no empty words. An identifier with no
  letters or digits returns an empty list.

  ### Example 1
  ```
  Input:  identifier = "parseHTTPResponse2XX"
  Output: ["parse", "http", "response", "2", "xx"]
  ```

  ### Example 2
  ```
  Input:  identifier = "max_retry-count v2"
  Output: ["max", "retry", "count", "v", "2"]
  ```

  ### Example 3
  ```
  Input:  identifier = "getUserID"
  Output: ["get", "user", "id"]
  ```

  ### Constraints
  - `0 <= identifier.length <= 1000`
  - `identifier` contains only ASCII letters, digits, `_`, `-` and spaces.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: split_identifier_words
  params:
    - {name: identifier, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def split_identifier_words(identifier: str) -> list[str]:
        def is_upper(ch: str) -> bool:
            return "A" <= ch <= "Z"

        def is_lower(ch: str) -> bool:
            return "a" <= ch <= "z"

        def is_digit(ch: str) -> bool:
            return "0" <= ch <= "9"

        words: list[str] = []
        current: list[str] = []

        def flush() -> None:
            if current:
                words.append("".join(current).lower())
                current.clear()

        n = len(identifier)
        for i, ch in enumerate(identifier):
            if ch in "_- ":
                flush()
                continue
            if current:
                prev = current[-1]
                nxt = identifier[i + 1] if i + 1 < n else ""
                if (
                    (is_lower(prev) and is_upper(ch))
                    or (is_digit(prev) != is_digit(ch))
                    or (is_upper(prev) and is_upper(ch) and nxt != "" and is_lower(nxt))
                ):
                    flush()
            current.append(ch)
        flush()
        return words
  javascript: |
    function splitIdentifierWords(identifier) {
      const isUpper = (ch) => ch >= "A" && ch <= "Z";
      const isLower = (ch) => ch >= "a" && ch <= "z";
      const isDigit = (ch) => ch >= "0" && ch <= "9";
      const words = [];
      let current = "";
      const flush = () => {
        if (current.length > 0) words.push(current.toLowerCase());
        current = "";
      };
      for (let i = 0; i < identifier.length; i++) {
        const ch = identifier[i];
        if (ch === "_" || ch === "-" || ch === " ") {
          flush();
          continue;
        }
        if (current.length > 0) {
          const prev = current[current.length - 1];
          const next = i + 1 < identifier.length ? identifier[i + 1] : "";
          if (
            (isLower(prev) && isUpper(ch)) ||
            isDigit(prev) !== isDigit(ch) ||
            (isUpper(prev) && isUpper(ch) && next !== "" && isLower(next))
          ) {
            flush();
          }
        }
        current += ch;
      }
      flush();
      return words;
    }
tests:
  - {id: t1, args: ["parseHTTPResponse2XX"], expected: ["parse", "http", "response", "2", "xx"], description: "Example 1 - acronym followed by a word, letter-digit and digit-letter boundaries"}
  - {id: t2, args: ["max_retry-count v2"], expected: ["max", "retry", "count", "v", "2"], description: "Example 2 - all three separators plus a letter-digit boundary"}
  - {id: t3, args: ["getUserID"], expected: ["get", "user", "id"], description: "Example 3 - acronym at the end stays one word"}
  - {id: t4, hidden: true, args: [""], expected: [], description: "Empty identifier"}
  - {id: t5, hidden: true, args: ["__--  _"], expected: [], description: "Separators only"}
  - {id: t6, hidden: true, args: ["A"], expected: ["a"], description: "Single uppercase letter"}
  - {id: t7, hidden: true, args: ["XMLHttpRequest"], expected: ["xml", "http", "request"], description: "Leading acronym followed by PascalCase words"}
  - {id: t8, hidden: true, args: ["IPv6Address"], expected: ["i", "pv", "6", "address"], description: "Rule 3 applied literally: the P before a lowercase letter starts a new word"}
  - {id: t9, hidden: true, args: ["SCREAMING_SNAKE__CASE_"], expected: ["screaming", "snake", "case"], description: "Upper-case snake with doubled and trailing separators"}
  - {id: t10, hidden: true, args: ["utf8ToUTF16le"], expected: ["utf", "8", "to", "utf", "16", "le"], description: "Digits inside and after acronyms"}
  - {id: t11, hidden: true, args: ["ABCdef"], expected: ["ab", "cdef"], description: "Uppercase run followed by lowercase: only the last capital moves"}
  - {id: t12, hidden: true, args: ["build 2024-10 release"], expected: ["build", "2024", "10", "release"], description: "Digit runs stay together across separators"}
  - {id: t13, hidden: true, args: ["aB1c--Def_GHIjk 99Bottles"], expected: ["a", "b", "1", "c", "def", "gh", "ijk", "99", "bottles"], description: "Every rule in one identifier"}
expected_concepts:
- single left-to-right scan with a current-word buffer
- character classification (upper, lower, digit, separator)
- lookahead by one character for acronym boundaries
- translating precise rules into code without regex guesswork
optimal_complexity:
  time: O(n)
  space: O(n)
rubric:
  excellent: Implements one pass with a word buffer and a one-character lookahead, encodes each boundary rule explicitly, tests acronym cases such as XMLHttpRequest and getUserID before running, and keeps the code readable with small classification helpers.
  good: Handles separators, camelCase and digit boundaries correctly but needs a hint or a failing test to get the acronym rule right.
  weak: Only splits on separators or on every capital letter, emits empty words, or produces a tangle of special cases that breaks on mixed styles.
  criteria:
    correctness: All tests pass, including acronyms at the start, middle and end of an identifier.
    efficiency: Linear scan without repeated string rebuilding or backtracking.
    code_quality: Named helpers for character classes and one clearly written boundary condition.
    edge_cases: Empty input, separator-only input, repeated separators and digit runs.
    communication: Walks through a tricky example such as parseHTTPResponse2XX character by character.
hints:
- Scan the identifier once, keeping the word you are currently building, and ask at each character whether a new word should start before it.
- Separators simply finish the current word. For other characters the decision depends on the previous character and, for one of the rules, on the character after the current one.
- Keep a buffer for the current word; on a separator flush it, otherwise flush before the current character when the previous one is lowercase and this one uppercase, when exactly one of the two is a digit, or when both are uppercase and the next character is lowercase; append the character, flush at the end and lower-case every word you emit.
followups:
- How would you rebuild the identifier in a different naming style from the word list?
- How would you extend the rules to Unicode letters?
- Could a single regular expression implement these rules, and would you want to maintain it?
- How would you rank search results when a query matches only some of an identifier's words?
common_errors:
- Splitting before every uppercase letter, which turns HTTP into four words.
- Keeping the whole uppercase run together, so HTTPResponse becomes httpr and esponse or stays one word.
- Forgetting the letter-digit boundaries or splitting digit runs into single digits.
- Emitting empty words for repeated or trailing separators.
