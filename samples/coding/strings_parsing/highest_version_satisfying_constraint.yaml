version: 1
slug: highest_version_satisfying_constraint
title: "Highest Version Satisfying a Constraint"
difficulty: hard
competency_keys: [problem_solving, code_quality]
role_tags: [devops, platform, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Highest Version Satisfying a Constraint

  An internal package resolver has to pick which release of a dependency to install. It is given the
  releases that are available in the registry and the version constraint written in a service's
  manifest, and it installs the **highest** release that satisfies the constraint.

  **Versions.** Every entry of `versions` is `MAJOR.MINOR.PATCH`: three non-negative integers without
  leading zeros. Versions compare component by component from the left, **numerically**
  (`1.10.0` is higher than `1.9.7`). The list is unsorted and may contain the same version more than once.

  **Constraints.** `constraint` is one or more **ranges** separated by `||` (spaces may surround `||`).
  A version satisfies the constraint when it satisfies **at least one** range. A range is one or more
  **comparators** separated by spaces and/or commas; a version satisfies the range when it satisfies
  **all** of its comparators. There is never a space between an operator and its version.

  | Comparator | Matches versions `v` with |
  |---|---|
  | `>=X.Y.Z`, `>X.Y.Z`, `<=X.Y.Z`, `<X.Y.Z` | the usual comparison against `X.Y.Z` |
  | `=X.Y.Z` or just `X.Y.Z` | exactly `X.Y.Z` |
  | `~X.Y.Z` | `X.Y.Z <= v < X.(Y+1).0` |
  | `^X.Y.Z` | `X.Y.Z <= v <` the next release of the leftmost **non-zero** component: `^1.2.3` means `< 2.0.0`, `^0.2.3` means `< 0.3.0`, `^0.0.3` means `< 0.0.4` (and `^0.0.0` matches only `0.0.0`) |
  | `*` | every version |

  The version in a comparator may be **partial** (`X` or `X.Y`); missing components are filled with `0`
  before the comparator is applied, for every operator. So `>=2` means `>=2.0.0`, `1.4` means exactly
  `1.4.0`, `~1` means `>=1.0.0 <1.1.0` and `^0.2` means `>=0.2.0 <0.3.0`.

  Write `max_satisfying_version(versions, constraint)` that returns the highest satisfying version
  exactly as written, or an empty string if no version satisfies the constraint.

  ### Example 1
  ```
  Input:  versions = ["1.2.3", "1.4.0", "2.0.0", "1.10.1"], constraint = "^1.2.0"
  Output: "1.10.1"
  Explanation: ^1.2.0 allows 1.2.0 up to (not including) 2.0.0; 1.10.1 is the highest of those
  ```

  ### Example 2
  ```
  Input:  versions = ["0.2.5", "0.3.0", "0.2.9", "1.0.0"], constraint = "~0.2 || >=2"
  Output: "0.2.9"
  Explanation: ~0.2 is >=0.2.0 <0.3.0; nothing satisfies >=2.0.0
  ```

  ### Example 3
  ```
  Input:  versions = ["3.1.0", "3.2.0"], constraint = ">=1.0.0, <3.0.0"
  Output: ""
  ```

  ### Constraints
  - `0 <= versions.length <= 10^4`
  - Every version component is an integer from `0` to `10^9`, written without leading zeros.
  - `1 <= constraint.length <= 1000`; it is well formed: at least one range, every range has at least
    one comparator, and comparator versions have 1 to 3 components in the same range of values.
  - Only the characters `0-9 . < > = ^ ~ * | ,` and spaces appear in `constraint`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_satisfying_version
  params:
    - {name: versions, type: "string[]"}
    - {name: constraint, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    from collections.abc import Callable

    Version = tuple[int, int, int]


    def max_satisfying_version(versions: list[str], constraint: str) -> str:
        def parse(text: str) -> Version:
            parts = [int(p) for p in text.split(".")]
            parts += [0] * (3 - len(parts))
            return (parts[0], parts[1], parts[2])

        def comparator(token: str) -> Callable[[Version], bool]:
            if token == "*":
                return lambda v: True
            op = "="
            rest = token
            for candidate in (">=", "<=", ">", "<", "=", "^", "~"):
                if token.startswith(candidate):
                    op, rest = candidate, token[len(candidate):]
                    break
            base = parse(rest)
            if op == ">=":
                return lambda v: v >= base
            if op == "<=":
                return lambda v: v <= base
            if op == ">":
                return lambda v: v > base
            if op == "<":
                return lambda v: v < base
            if op == "=":
                return lambda v: v == base
            if op == "^":
                if base[0] > 0:
                    upper = (base[0] + 1, 0, 0)
                elif base[1] > 0:
                    upper = (0, base[1] + 1, 0)
                else:
                    upper = (0, 0, base[2] + 1)
            else:  # "~"
                upper = (base[0], base[1] + 1, 0)
            return lambda v: base <= v < upper

        ranges = [
            [comparator(token) for token in part.replace(",", " ").split()]
            for part in constraint.split("||")
        ]
        best: Version | None = None
        best_text = ""
        for text in versions:
            version = parse(text)
            if best is not None and version <= best:
                continue
            if any(all(check(version) for check in rng) for rng in ranges):
                best, best_text = version, text
        return best_text
  javascript: |
    function maxSatisfyingVersion(versions, constraint) {
      const parse = (text) => {
        const parts = text.split(".").map(Number);
        while (parts.length < 3) parts.push(0);
        return parts;
      };
      const cmp = (a, b) => {
        for (let i = 0; i < 3; i++) {
          if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
        }
        return 0;
      };
      const OPS = [">=", "<=", ">", "<", "=", "^", "~"];
      const comparator = (token) => {
        if (token === "*") return () => true;
        let op = "=";
        let rest = token;
        for (const candidate of OPS) {
          if (token.startsWith(candidate)) {
            op = candidate;
            rest = token.slice(candidate.length);
            break;
          }
        }
        const base = parse(rest);
        switch (op) {
          case ">=": return (v) => cmp(v, base) >= 0;
          case "<=": return (v) => cmp(v, base) <= 0;
          case ">": return (v) => cmp(v, base) > 0;
          case "<": return (v) => cmp(v, base) < 0;
          case "=": return (v) => cmp(v, base) === 0;
          default: {
            let upper;
            if (op === "~") upper = [base[0], base[1] + 1, 0];
            else if (base[0] > 0) upper = [base[0] + 1, 0, 0];
            else if (base[1] > 0) upper = [0, base[1] + 1, 0];
            else upper = [0, 0, base[2] + 1];
            return (v) => cmp(v, base) >= 0 && cmp(v, upper) < 0;
          }
        }
      };
      const ranges = constraint.split("||").map((part) =>
        part.replace(/,/g, " ").split(" ").filter((t) => t.length > 0).map(comparator)
      );
      let best = null;
      let bestText = "";
      for (const text of versions) {
        const version = parse(text);
        if (best !== null && cmp(version, best) <= 0) continue;
        if (ranges.some((rng) => rng.every((check) => check(version)))) {
          best = version;
          bestText = text;
        }
      }
      return bestText;
    }
