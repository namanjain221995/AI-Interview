expected_concepts:
  - "tokenising a small grammar: alternatives, then comparators, then operator and version"
  - "padding partial versions and comparing numeric tuples"
  - "desugaring caret and tilde into half-open intervals"
  - "OR of ANDs evaluation (disjunctive normal form)"
  - "single pass keeping the highest satisfying version"
optimal_complexity: {time: "O(V * C) for V versions and C comparators (parse the constraint once)", space: "O(C)"}
rubric:
  excellent: "Parses the constraint once into a list of ranges of predicates (or intervals), handles two-character operators before one-character ones, desugars caret and tilde exactly as specified including the zero-major cases, compares versions as numeric tuples and returns the highest match as written; code is organised into small parse and match helpers."
  good: "Correct on most rules but needs a fix for one special case (caret with leading zeros, partial versions, or comma separators), or reparses the constraint for every version."
  weak: "Compares versions as strings, treats a partial version as a wildcard instead of padding with zeros, misreads >= as > followed by =, or ignores the OR between ranges."
  criteria:
    correctness: "All tests pass, including caret on 0.x and 0.0.x, partial versions, exclusive bounds and unsatisfiable ranges."
    efficiency: "Constraint parsed once; each version checked in time proportional to the number of comparators."
    code_quality: "Separate helpers for parsing a version, building a comparator and evaluating ranges; no duplicated comparison code; the operator table is explicit."
    edge_cases: "Empty version list, duplicates, a star mixed with other comparators, contradictory ranges and very large components."
    communication: "Explains the grammar as an OR of ANDs and how caret and tilde turn into half-open intervals."
hints:
  - "Read the constraint the way the resolver does: first split it into alternatives, then split each alternative into individual comparators, and only then look at the operator and version inside each comparator."
  - "Turn every version into three numbers (padding with zeros) so that comparisons are numeric; caret and tilde can each be rewritten as a lower bound and an exclusive upper bound, and when you look for the operator, check the two-character ones before the one-character ones."
  - "Build, once, a list of ranges where each range is a list of checks against a padded version; a version is accepted when some range has all of its checks true; then scan the available versions, keep the highest accepted one by numeric comparison and return its original text, or the empty string if none was accepted."
followups:
  - "How would you add pre-release tags such as 1.2.0-rc.1, which sort before 1.2.0?"
  - "How would you report which comparator rejected the newest available version, to help users debug their manifest?"
  - "If the registry list is already sorted, how would you exploit that?"
  - "How would you validate a malformed constraint and produce a helpful error?"
common_errors:
  - "Comparing versions as strings, which ranks 1.9.0 above 1.10.0."
  - "Matching the operator one character at a time so that >= is read as > with a version starting with =."
  - "Treating ^0.2.3 like ^1.2.3 (allowing 0.9.0) or forgetting the special case for ^0.0.x."
  - "Interpreting a bare partial version such as 2.1 as any 2.1.x release instead of exactly 2.1.0."
  - "Splitting only on spaces and failing on comma-separated comparators."
