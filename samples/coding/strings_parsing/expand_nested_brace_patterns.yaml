expected_concepts:
  - "recursive descent parsing of a small grammar (sequence, group, alternative)"
  - "cartesian product of partial results"
  - "set-based deduplication followed by sorting"
  - "handling empty alternatives and single-alternative groups"
optimal_complexity: {time: "O(E * L log E) where E is the number of expansions and L their length", space: "O(E * L)"}
rubric:
  excellent: "Defines the grammar (sequence of literals and groups, group of comma-separated sequences), implements it with recursive descent or an explicit stack sharing one cursor, combines partial results by cartesian product, deduplicates with a set, sorts at the end and handles empty and single alternatives without special cases."
  good: "Correct expansion for nested inputs after a hint about where a nested group ends or about empty alternatives."
  weak: "Splits on commas at the wrong depth, handles only one nesting level, forgets deduplication or returns unsorted results."
  criteria:
    correctness: "All tests pass, including empty alternatives, duplicates, deep nesting and character-code ordering."
    efficiency: "Work proportional to the output size; no repeated re-parsing of substrings."
    code_quality: "Parser functions mirror the grammar and share a single position cursor."
    edge_cases: "No braces, a single alternative, only empty alternatives and adjacent groups."
    communication: "States the grammar before coding and explains how the cursor moves across nested groups."
hints:
  - "Describe the input as a tiny grammar: a pattern is a sequence of literal runs and groups, and a group is a list of patterns separated by commas."
  - "Write one function that parses a sequence and stops at a comma or closing brace that belongs to an outer group, and let it call itself for each alternative of a nested group, all sharing one position cursor."
  - "Keep the set of strings the sequence can produce so far, starting with just the empty string. A literal run is appended to every string in the set, while a group replaces the set with every existing string joined to every alternative's expansion. Union the alternatives' sets, and sort the final set at the end."
followups:
  - "How would you add numeric ranges such as {01..12} with zero padding?"
  - "How would you stream expansions in sorted order without materialising all of them?"
  - "How would you report a precise error position for malformed patterns?"
  - "What limits would you enforce to stop a pattern from expanding to millions of hosts?"
common_errors:
  - "Splitting on every comma instead of only commas at the current nesting depth."
  - "Dropping empty alternatives, so db{,-replica} loses db."
  - "Forgetting to deduplicate when different choices produce the same string."
  - "Sorting with a locale-aware comparison instead of character codes."
