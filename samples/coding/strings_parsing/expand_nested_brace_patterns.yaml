  - {id: t1, args: ["web-{1,2}.{eu,us{-east,-west}}"], expected: ["web-1.eu", "web-1.us-east", "web-1.us-west", "web-2.eu", "web-2.us-east", "web-2.us-west"], description: "Example 1 - nested group and cartesian product"}
  - {id: t2, args: ["db{,-replica}.{a,b}"], expected: ["db-replica.a", "db-replica.b", "db.a", "db.b"], description: "Example 2 - empty alternative; '-' sorts before '.'"}
  - {id: t3, args: ["node{1,{1,2}}"], expected: ["node1", "node2"], description: "Example 3 - duplicate expansions collapse"}
  - {id: t4, hidden: true, args: ["api.internal"], expected: ["api.internal"], description: "No braces - the pattern itself"}
  - {id: t5, hidden: true, args: ["{gateway}"], expected: ["gateway"], description: "Group with a single alternative"}
  - {id: t6, hidden: true, args: ["{,}"], expected: [""], description: "Only empty alternatives - a single empty string"}
  - {id: t7, hidden: true, args: ["{a{b{c{d,e},f},g},h}"], expected: ["abcd", "abce", "abf", "ag", "h"], description: "Four levels of nesting"}
  - {id: t8, hidden: true, args: ["{a,ab}{b,}"], expected: ["a", "ab", "abb"], description: "Different products produce the same string - deduplicate"}
  - {id: t9, hidden: true, args: ["v{1,1.0,1-rc,10}"], expected: ["v1", "v1-rc", "v1.0", "v10"], description: "Ordering by character code: '-' < '.' < digits, prefixes first"}
