version: 1
slug: expand_nested_brace_patterns
title: Expand Nested Brace Patterns
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [devops, platform, sre]
time_limit_minutes: 30
prompt_markdown: |
  ## Expand Nested Brace Patterns

  An inventory tool lets operators target many hosts with one compact pattern such as
  `web-{1,2}.{eu,us{-east,-west}}`. Implement the expansion.

  - Literal characters are lowercase letters, digits, `.` and `-`; they stand for themselves.
  - A group `{p1,p2,...}` offers alternatives separated by commas. Each alternative is itself a pattern,
    so groups can nest, and an alternative may be **empty** (`db{,-replica}` gives `db` and `db-replica`).
    A group may also have a single alternative.
  - Parts written next to each other are concatenated, so every choice of one part combines with every
    choice of the next (a cartesian product).

  Return all **distinct** expansions sorted in ascending lexicographic order by character code (so `-`
  sorts before `.`, which sorts before digits, which sort before letters, and a string sorts before any
  longer string it is a prefix of). If the empty string is one of the expansions, include it.

  ### Example 1
  ```
  Input:  pattern = "web-{1,2}.{eu,us{-east,-west}}"
  Output: ["web-1.eu", "web-1.us-east", "web-1.us-west", "web-2.eu", "web-2.us-east", "web-2.us-west"]
  ```

  ### Example 2
  ```
  Input:  pattern = "db{,-replica}.{a,b}"
  Output: ["db-replica.a", "db-replica.b", "db.a", "db.b"]
  ```

  ### Example 3
  ```
  Input:  pattern = "node{1,{1,2}}"
  Output: ["node1", "node2"]
  Explanation: node1 is produced twice but returned once
  ```

  ### Constraints
  - `1 <= pattern.length <= 200`
  - The pattern is well formed: braces are balanced, and commas appear only directly inside a group
  - The total number of expansions, counting duplicates, is at most `2000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: expand_brace_patterns
  params:
    - {name: pattern, type: string}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def expand_brace_patterns(pattern: str) -> list[str]:
        pos = 0

        def parse_sequence() -> set[str]:
            # Parse parts until a ',' or '}' that belongs to an enclosing group, or the end.
            nonlocal pos
            results = {""}
            while pos < len(pattern) and pattern[pos] not in ",}":
                if pattern[pos] == "{":
                    pos += 1
                    options: set[str] = set()
                    while True:
                        options |= parse_sequence()
                        if pattern[pos] == ",":
                            pos += 1
                            continue
                        pos += 1  # closing brace
                        break
                    results = {prefix + option for prefix in results for option in options}
                else:
                    start = pos
                    while pos < len(pattern) and pattern[pos] not in "{},":
                        pos += 1
                    literal = pattern[start:pos]
                    results = {prefix + literal for prefix in results}
            return results

        return sorted(parse_sequence())
  javascript: |
    function expandBracePatterns(pattern) {
      let pos = 0;
      const parseSequence = () => {
        let results = new Set([""]);
        while (pos < pattern.length && pattern[pos] !== "," && pattern[pos] !== "}") {
          if (pattern[pos] === "{") {
            pos += 1;
            const options = new Set();
            while (true) {
              for (const option of parseSequence()) options.add(option);
              if (pattern[pos] === ",") {
                pos += 1;
                continue;
              }
              pos += 1;
              break;
            }
            const next = new Set();
            for (const prefix of results) for (const option of options) next.add(prefix + option);
            results = next;
          } else {
            const start = pos;
            while (pos < pattern.length && !"{},".includes(pattern[pos])) pos += 1;
            const literal = pattern.slice(start, pos);
            const next = new Set();
            for (const prefix of results) next.add(prefix + literal);
            results = next;
          }
        }
        return results;
      };
      const out = [...parseSequence()];
      out.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return out;
    }
