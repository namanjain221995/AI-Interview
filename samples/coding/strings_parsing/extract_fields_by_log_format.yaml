expected_concepts:
  - "splitting the format into alternating literals and placeholders"
  - "suffix feasibility (dynamic programming from the right) over line positions"
  - "greedy leftmost-shortest reconstruction guided by the feasibility table"
  - "avoiding exponential backtracking when a match fails"
  - "anchoring both ends of the line and enforcing non-empty values"
optimal_complexity: {time: "O(n * f) where n is the line length and f the format length", space: "O(n * k) for k placeholders (O(n) with a smarter reconstruction)"}
rubric:
  excellent: "Parses the format into literals, precomputes from the right which (placeholder, position) states can still finish the line, then rebuilds the answer left to right by taking the earliest feasible end for each placeholder; explains why this gives the shortest-first split and why it stays polynomial when the line does not match."
  good: "Correct recursive search that tries the shortest value first and memoises on (placeholder index, position), or the DP with a small fix after running the tests (for example the non-empty rule or the end anchor)."
  weak: "Takes the first occurrence of each literal without checking that the rest can still match, allows empty values, ignores the end of the line, or uses unmemoised backtracking that times out on lines that do not match."
  criteria:
    correctness: "All tests pass, including tie-breaking, literals at both ends, empty-value rejection and lines that do not match."
    efficiency: "Polynomial in the line and format length; no exponential backtracking on long non-matching lines."
    code_quality: "Format parsing is separated from matching; clear names for literals, positions and the feasibility table."
    edge_cases: "Leading and trailing literals, a format that is a single placeholder, braces and spaces inside values, empty line, repeated literals."
    communication: "States the tie-breaking rule precisely and explains why the feasibility check makes the greedy reconstruction safe."
hints:
  - "Break the format into the literal pieces that sit between the placeholders; the line must then be cut so that each literal piece sits at a specific position, with a non-empty gap before each one that becomes a placeholder value."
  - "Taking the first occurrence of the next literal is not enough, because that choice can make the rest of the line impossible to match; you need to know, for every placeholder and every starting position in the line, whether the remaining part of the format can still match the rest of the line."
  - "Fill a feasibility table from the last placeholder backwards over line positions, marking where each literal can sit so that the rest still fits and the line ends exactly; then walk forwards and give each placeholder the earliest end position (at least one character long) that the table marks as feasible, which yields the shortest-first split in polynomial time."
followups:
  - "How would you support an escape so that a literal brace can appear in the format?"
  - "What changes if some placeholders are typed, for example a number-only placeholder?"
  - "How would you match one format against millions of lines efficiently, for example by compiling it once?"
  - "How would the answer differ if the last placeholder had to take the longest value instead?"
common_errors:
  - "Searching for the next literal starting at the current position, which produces an empty placeholder value."
  - "Taking the first occurrence of each literal without checking that the remaining format can still match, so a valid line is rejected."
  - "Forgetting that the last literal (or the last placeholder) must reach exactly the end of the line."
  - "Plain backtracking without memoisation, which explodes on long lines that do not match."
