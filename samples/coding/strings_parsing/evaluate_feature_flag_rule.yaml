expected_concepts:
  - "tokenisation of identifiers, keywords and parentheses"
  - "recursive descent with one function per precedence level (or shunting-yard)"
  - "unary prefix operator handling"
  - "hash set lookup for enabled flags"
optimal_complexity: {time: "O(n + e) for rule length n and e enabled names", space: "O(n) for tokens and recursion depth"}
rubric:
  excellent: "Tokenises cleanly, writes a recursive-descent parser with OR, AND and NOT levels (or a correct shunting-yard with a unary operator), consumes every token even when the result is already decided, uses a set for enabled flags and explains how the grammar encodes precedence and associativity."
  good: "Correct evaluator after a hint about NOT precedence or about consuming the right operand when short-circuiting."
  weak: "Evaluates strictly left to right ignoring precedence, uses eval or string replacement, or matches flag names as substrings."
  criteria:
    correctness: "All tests pass, including precedence mixes, chained NOT, deep nesting and whitespace without spaces around parentheses."
    efficiency: "Single pass over the tokens with constant-time flag lookups."
    code_quality: "Grammar-shaped functions with a shared cursor, or a clearly separated tokenizer and evaluator."
    edge_cases: "Lone flag, empty enabled list, duplicate enabled names and names sharing substrings."
    communication: "Writes down the grammar and explains why NOT is parsed at the lowest grammar level."
hints:
  - "First turn the rule into a list of tokens: names, the three keywords and the two parentheses. Whitespace only separates tokens."
  - "Precedence can be built into the structure of the parser: one routine for OR expressions that is made of AND expressions, which are made of NOT expressions, which are a flag, a parenthesised OR expression, or NOT applied to another NOT expression."
  - "Use a shared token position. The OR routine parses an AND expression and, while the next token is OR, skips it and parses another AND expression, combining with logical or. The AND routine does the same with NOT expressions. The NOT routine reads one token, negates a recursive call for NOT, parses an OR expression and skips the closing parenthesis for an opening one, and otherwise looks the name up in a set of enabled flags. Always parse the right operand even if the answer is already known."
followups:
  - "How would you report a helpful error for a malformed rule such as a missing parenthesis?"
  - "How would you compile the rule once and evaluate it for millions of requests?"
  - "How would you add comparisons such as country == de or percentage rollouts?"
  - "How would you detect that a rule can never be true?"
common_errors:
  - "Evaluating left to right with no precedence, so a OR b AND c is computed as (a OR b) AND c."
  - "Short-circuiting by returning early without consuming the remaining tokens of the right operand."
  - "Applying NOT to everything to its right instead of a single operand."
  - "Searching for flag names as substrings of the rule or of each other."
