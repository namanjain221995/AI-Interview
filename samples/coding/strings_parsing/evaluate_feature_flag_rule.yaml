version: 1
slug: evaluate_feature_flag_rule
title: Evaluate a Feature Flag Rule
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [backend, platform, fullstack]
time_limit_minutes: 30
prompt_markdown: |
  ## Evaluate a Feature Flag Rule

  A feature-flag service decides whether to show a feature by evaluating a targeting rule such as
  `beta AND NOT (legacy_ui OR eu_only)` against the flags that are switched on for a request.

  Rule syntax:

  - A **flag name** is a run of lowercase letters, digits and `_`. A flag is `true` if it appears in
    `enabled`, otherwise `false`.
  - The operators are the uppercase keywords `NOT`, `AND` and `OR`, plus parentheses for grouping.
  - Precedence from highest to lowest: `NOT`, then `AND`, then `OR`. `AND` and `OR` are evaluated left
    to right among equals, and `NOT` applies to the single operand that follows it (a flag, a
    parenthesised group or another `NOT`).
  - Any whitespace (spaces, tabs, newlines) may appear between tokens. Keywords and flag names are always
    separated by whitespace or a parenthesis.

  The rule is guaranteed to be well formed. Evaluate it **without** using your language's `eval` or an
  expression library, and return the result.

  ### Example 1
  ```
  Input:  rule = "beta AND NOT (legacy_ui OR eu_only)", enabled = ["beta", "dark_mode"]
  Output: true
  ```

  ### Example 2
  ```
  Input:  rule = "beta OR new_checkout AND eu_only", enabled = ["new_checkout"]
  Output: false
  Explanation: AND binds tighter, so this is beta OR (new_checkout AND eu_only)
  ```

  ### Example 3
  ```
  Input:  rule = "NOT beta AND (internal OR qa_team)", enabled = ["qa_team"]
  Output: true
  Explanation: NOT binds tighter than AND, so this is (NOT beta) AND (internal OR qa_team)
  ```

  ### Constraints
  - `1 <= rule.length <= 3000`, parentheses nest at most `100` levels deep
  - `0 <= enabled.length <= 100`; `enabled` may contain duplicates and names not used by the rule
  - Flag names match `[a-z0-9_]+`, so they never collide with the uppercase keywords
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: evaluate_flag_rule
  params:
    - {name: rule, type: string}
    - {name: enabled, type: "string[]"}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def evaluate_flag_rule(rule: str, enabled: list[str]) -> bool:
        on = set(enabled)
        tokens: list[str] = []
        i = 0
        while i < len(rule):
            ch = rule[i]
            if ch.isspace():
                i += 1
            elif ch in "()":
                tokens.append(ch)
                i += 1
            else:
                start = i
                while i < len(rule) and not rule[i].isspace() and rule[i] not in "()":
                    i += 1
                tokens.append(rule[start:i])
        pos = 0

        def parse_or() -> bool:
            nonlocal pos
            value = parse_and()
            while pos < len(tokens) and tokens[pos] == "OR":
                pos += 1
                right = parse_and()
                value = value or right
            return value

        def parse_and() -> bool:
            nonlocal pos
            value = parse_not()
            while pos < len(tokens) and tokens[pos] == "AND":
                pos += 1
                right = parse_not()
                value = value and right
            return value

        def parse_not() -> bool:
            nonlocal pos
            token = tokens[pos]
            pos += 1
            if token == "NOT":
                return not parse_not()
            if token == "(":
                value = parse_or()
                pos += 1  # closing parenthesis
                return value
            return token in on

        return parse_or()
  javascript: |
    function evaluateFlagRule(rule, enabled) {
      const on = new Set(enabled);
      const tokens = rule.match(/[()]|[^\s()]+/g) || [];
      let pos = 0;
      const parseNot = () => {
        const token = tokens[pos++];
        if (token === "NOT") return !parseNot();
        if (token === "(") {
          const value = parseOr();
          pos += 1;
          return value;
        }
        return on.has(token);
      };
      const parseAnd = () => {
        let value = parseNot();
        while (pos < tokens.length && tokens[pos] === "AND") {
          pos += 1;
          const right = parseNot();
          value = value && right;
        }
        return value;
      };
      const parseOr = () => {
        let value = parseAnd();
        while (pos < tokens.length && tokens[pos] === "OR") {
          pos += 1;
          const right = parseAnd();
          value = value || right;
        }
        return value;
      };
      return parseOr();
    }
