expected_concepts:
  - "prefix checks in the right order (headers before content)"
  - "single pass with two counters"
  - "precise reading of the line-classification contract"
  - "O(n) over the lines"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Checks the header prefixes (three signs plus a space) before the single-sign rules, handles blank added or removed lines and look-alike prefixes, keeps a single pass with two counters and explains why the order of checks matters."
  good: "Counts correctly in a single pass but needs a nudge on one edge case such as a lone + line or a four-sign line."
  weak: "Skips any line starting with three signs regardless of the space, counts hunk headers or context lines, or checks the single-sign rule before the header rule."
  criteria:
    correctness: "All tests pass, including look-alike headers, blank changed lines and multi-file diffs."
    efficiency: "One linear pass with constant extra memory; no regular expressions compiled per line."
    code_quality: "Header test is separated clearly from the add/remove classification; descriptive counter names."
    edge_cases: "Empty input, lines that are only a sign, signs without a trailing space and context lines that contain signs later on."
    communication: "States the classification order and points out the ambiguity of content that genuinely starts with three minus signs."
hints:
  - "Each line can be classified on its own by looking only at its first few characters."
  - "The order of your checks matters: decide whether a line is a file header before you decide whether it is an added or removed line."
  - "Walk the lines once with two counters; skip a line when its first four characters are three identical signs followed by a space, otherwise add one to the matching counter when the first character is a plus or a minus, and ignore everything else."
followups:
  - "How would you report the counts per file instead of for the whole diff?"
  - "How could you use the numbers in the hunk headers to cross-check the counts?"
  - "What changes if the diff arrives as one large string from a network stream?"
common_errors:
  - "Treating any line starting with three plus or minus signs as a header, which drops lines such as a four-dash rule."
  - "Checking for a leading plus before checking for the header prefix, so header lines are counted."
  - "Ignoring a line that is only a plus or a minus sign."
  - "Counting plus or minus signs anywhere in the line instead of only at the start."
