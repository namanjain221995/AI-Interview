version: 1
slug: unified_diff_change_counts
title: "Unified Diff Change Counts"
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [devops, qa, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Unified Diff Change Counts

  A pull-request bot posts a short summary such as `+12 / -3` next to every change set. It receives the
  change as a unified diff that has already been split into lines (without line terminators).

  Classify every line by how it **starts**:

  - A line that starts with `+++ ` or `--- ` (three plus signs or three minus signs **followed by a space**)
    is a file header and is never counted.
  - Any other line that starts with `+` is an **added** line, even if nothing follows the `+`.
  - Any other line that starts with `-` is a **removed** line, even if nothing follows the `-`.
  - Every other line is ignored: context lines (which start with a space), `@@` hunk headers,
    `diff --git ...`, `index ...`, `\ No newline at end of file` and empty lines.

  Write `diff_change_counts(lines)` that returns `[added, removed]`.

  ### Example 1
  ```
  Input:  lines = ["diff --git a/app/config.py b/app/config.py", "--- a/app/config.py", "+++ b/app/config.py", "@@ -1,3 +1,4 @@", " import os", "-TIMEOUT = 30", "+TIMEOUT = 45", "+RETRIES = 3", " DEBUG = False"]
  Output: [2, 1]
  Explanation: the two header lines are skipped; TIMEOUT = 45 and RETRIES = 3 are added, TIMEOUT = 30 is removed.
  ```

  ### Example 2
  ```
  Input:  lines = ["@@ -10,4 +10,3 @@", " def handle(event):", "-    log(event)", "-    return None", "+", "     process(event)"]
  Output: [1, 2]
  Explanation: the lone + is an added blank line.
  ```

  ### Example 3
  ```
  Input:  lines = ["--- /dev/null", "+++ b/README.md", "@@ -0,0 +1,2 @@", "+# Billing service", "+Handles invoices."]
  Output: [2, 0]
  ```

  ### Constraints
  - `0 <= lines.length <= 10^4`
  - `0 <= lines[i].length <= 500`
  - Lines contain printable ASCII characters only.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: diff_change_counts
  params:
    - {name: lines, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def diff_change_counts(lines: list[str]) -> list[int]:
        added = removed = 0
        for line in lines:
            if line.startswith("+++ ") or line.startswith("--- "):
                continue
            if line.startswith("+"):
                added += 1
            elif line.startswith("-"):
                removed += 1
        return [added, removed]
  javascript: |
    function diffChangeCounts(lines) {
      let added = 0;
      let removed = 0;
      for (const line of lines) {
        if (line.startsWith("+++ ") || line.startsWith("--- ")) continue;
        if (line.startsWith("+")) added++;
        else if (line.startsWith("-")) removed++;
      }
      return [added, removed];
    }
tests:
  - {id: t1, args: [["diff --git a/app/config.py b/app/config.py", "--- a/app/config.py", "+++ b/app/config.py", "@@ -1,3 +1,4 @@", " import os", "-TIMEOUT = 30", "+TIMEOUT = 45", "+RETRIES = 3", " DEBUG = False"]], expected: [2, 1], description: "Example 1 - one hunk with headers, context, one removal and two additions"}
  - {id: t2, args: [["@@ -10,4 +10,3 @@", " def handle(event):", "-    log(event)", "-    return None", "+", "     process(event)"]], expected: [1, 2], description: "Example 2 - an empty added line counts"}
  - {id: t3, args: [["--- /dev/null", "+++ b/README.md", "@@ -0,0 +1,2 @@", "+# Billing service", "+Handles invoices."]], expected: [2, 0], description: "Example 3 - new file, headers against /dev/null"}
  - {id: t4, hidden: true, args: [[]], expected: [0, 0], description: "Empty diff"}
  - {id: t5, hidden: true, args: [["+++ b/a.txt", "--- a/a.txt", "diff --git a/a.txt b/a.txt", "index 3f2a1b0..9c4d2e7 100644"]], expected: [0, 0], description: "Only headers and metadata - nothing counted"}
  - {id: t6, hidden: true, args: [["+++", "---", "++", "--"]], expected: [2, 2], description: "Plus/minus runs without the trailing space are content, not headers"}
  - {id: t7, hidden: true, args: [["++++ banner", "---- rule", "+++ b/x", "--- a/x", "+++b/x", "---a/x"]], expected: [2, 2], description: "Four signs or no space after three signs are content; only exactly three signs plus a space is a header"}
  - {id: t8, hidden: true, args: [[" +not added", " -not removed", "", "\\ No newline at end of file", "@@ -1 +1 @@ +x -y"]], expected: [0, 0], description: "Leading space, empty lines, hunk header containing + and - are ignored"}
  - {id: t9, hidden: true, args: [["-", "+", "-", "-"]], expected: [1, 3], description: "Blank removed and added lines"}
  - {id: t10, hidden: true, args: [["diff --git a/x b/x", "--- a/x", "+++ b/x", "@@ -1,2 +1,2 @@", "-a", "+b", " c", "diff --git a/y b/y", "--- a/y", "+++ b/y", "@@ -5,3 +5,1 @@", "-d", "-e", " f", "--- a/z", "+++ b/z", "@@ -1 +0,0 @@", "-gone"]], expected: [1, 4], description: "Multi-file diff - headers of every file skipped, counts summed across files"}
  - {id: t11, hidden: true, args: [["-- removed SQL comment", "--- removed line that looks like a header", "+-- added SQL comment"]], expected: [1, 1], description: "Removed line starting with two dashes counts; content that happens to start with three minus signs and a space is treated as a header by the contract"}
