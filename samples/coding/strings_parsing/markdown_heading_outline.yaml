expected_concepts:
  - "array of per-level counters with reset of deeper levels"
  - "boolean state for being inside a code fence"
  - "careful heading recognition (count of #, required space, non-empty title)"
  - "joining a prefix of the counters for the number"
  - "single pass over the lines"
optimal_complexity: {time: "O(n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Single pass with a fence flag and a six-element counter array, precise heading recognition (count, space, non-empty title, start of line), resets deeper counters and explains the 0 for skipped levels; tests the unclosed fence."
  good: "Correct numbering and fences with one recognition slip fixed after a test, such as seven hashes or a title made only of spaces."
  weak: "Uses a stack that pops on level changes but drops skipped-level zeros, treats lines inside code fences as headings, or strips # characters from titles."
  criteria:
    correctness: "All tests pass, including skipped levels, unclosed fences and invalid heading shapes."
    efficiency: "Linear in the number of lines; constant work per heading besides building the number."
    code_quality: "Heading recognition isolated in a helper or a clear block; counters indexed directly by level."
    edge_cases: "Empty page, first heading at a deep level, seven hashes, indented headings, unclosed fence, repeated titles."
    communication: "Explains why deeper counters reset but shallower ones do not."
hints:
  - "Two things change as you read the page: whether you are inside a code block, and how many headings of each level you have seen since the last shallower heading."
  - "Keep a flag for the code block and an array of six counters. When a heading of some level arrives, only that level's counter grows and every deeper counter goes back to zero; shallower counters stay as they are."
  - "For each line: if it starts with three backticks flip the flag and move on; skip it if the flag is set. Otherwise count the leading hash characters, require between one and six of them followed by a space and a non-blank remainder, trim the title, add one to that level's counter, zero all deeper counters, and join counters one through the level with dots."
followups:
  - "How would you build URL anchors for each heading and keep them unique?"
  - "How would you limit the outline to levels 1-3 while keeping the numbering correct?"
  - "How would you support setext headings (a line underlined with = or -)?"
  - "How would you render the outline as nested HTML lists?"
common_errors:
  - "Treating lines inside a fenced code block, such as shell comments, as headings."
  - "Accepting seven or more hashes, or hashes not followed by a space."
  - "Forgetting to reset deeper counters, so a new section continues the previous numbering."
  - "Dropping skipped levels so a level-3 heading under a level-1 heading is numbered 1.1 instead of 1.0.1."
  - "Removing # characters from the title instead of only trimming spaces."
