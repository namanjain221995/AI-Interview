version: 1
slug: markdown_heading_outline
title: Markdown Heading Outline
difficulty: medium
competency_keys: [data_structures, problem_solving]
role_tags: [frontend, fullstack, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Markdown Heading Outline

  A documentation site shows a numbered table of contents next to every page. Given the page source as
  a list of Markdown `lines`, build that outline.

  **Headings.** A line is a heading of level `L` when it starts (at the very first character) with
  exactly `L` `#` characters, `1 <= L <= 6`, followed by a space and a title containing at least one
  non-space character. The title is the rest of the line with leading and trailing spaces removed; any
  `#` characters inside or at the end of the title are kept. Lines such as `#tag`, `####### seven` or
  `  # indented` are not headings.

  **Code fences.** A line that starts with three backticks opens a code block, and the next such line
  closes it. The fence lines themselves and every line inside a code block are ignored. A block that is
  never closed runs to the end of the page.

  **Numbering.** Keep a counter for each level 1 to 6, all starting at `0`. For a heading of level `L`,
  add one to counter `L` and reset the counters of all deeper levels to `0`. Its number is counters
  `1..L` joined by `.`. A page that skips a level therefore shows `0` for it: a first heading of level 2
  is numbered `0.1`.

  Return `"<number> <title>"` for every heading, in page order.

  ### Example 1
  ```
  Input:  lines = [
            "# Getting Started",
            "Some intro text.",
            "## Install",
            "## Configure",
            "### Environment variables",
            "# API Reference",
            "## Auth"
          ]
  Output: [
            "1 Getting Started",
            "1.1 Install",
            "1.2 Configure",
            "1.2.1 Environment variables",
            "2 API Reference",
            "2.1 Auth"
          ]
  ```

  ### Example 2
  ```
  Input:  lines = [
            "## Overview",
            "```yaml",
            "# replicas: 3",
            "```",
            "#### Limits #",
            "## Usage",
            "#hashtag",
            "# Appendix"
          ]
  Output: [
            "0.1 Overview",
            "0.1.0.1 Limits #",
            "0.2 Usage",
            "1 Appendix"
          ]
  Explanation: The page starts at level 2, so its first number is 0.1. The fenced line is ignored. Limits skips
               level 3, so that position is 0. #hashtag has no space after the #.
  ```

  ### Constraints
  - `0 <= lines.length <= 1000`
  - Each line has at most 200 printable ASCII characters (no tabs).

  **Follow-up:** how would you also generate unique URL anchors (slugs) for each heading, given that two headings may have the same title?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: markdown_outline
  params:
    - {name: lines, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def markdown_outline(lines: list[str]) -> list[str]:
        counters = [0] * 7
        in_fence = False
        outline: list[str] = []
        for line in lines:
            if line.startswith("```"):
                in_fence = not in_fence
                continue
            if in_fence:
                continue
            level = 0
            while level < len(line) and line[level] == "#":
                level += 1
            if not 1 <= level <= 6 or line[level:level + 1] != " ":
                continue
            title = line[level:].strip()
            if not title:
                continue
            counters[level] += 1
            for deeper in range(level + 1, 7):
                counters[deeper] = 0
            number = ".".join(str(c) for c in counters[1:level + 1])
            outline.append(number + " " + title)
        return outline
  javascript: |
    function markdownOutline(lines) {
      const counters = new Array(7).fill(0);
      let inFence = false;
      const outline = [];
      for (const line of lines) {
        if (line.startsWith("```")) {
          inFence = !inFence;
          continue;
        }
        if (inFence) continue;
        let level = 0;
        while (level < line.length && line[level] === "#") level++;
        if (level < 1 || level > 6 || line[level] !== " ") continue;
        const title = line.slice(level).trim();
        if (title === "") continue;
        counters[level]++;
        for (let deeper = level + 1; deeper <= 6; deeper++) counters[deeper] = 0;
        outline.push(counters.slice(1, level + 1).join(".") + " " + title);
      }
      return outline;
    }
