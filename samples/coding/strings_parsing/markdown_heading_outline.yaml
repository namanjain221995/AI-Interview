  - {id: t1, args: [["# Getting Started", "Some intro text.", "## Install", "## Configure", "### Environment variables", "# API Reference", "## Auth"]], expected: ["1 Getting Started", "1.1 Install", "1.2 Configure", "1.2.1 Environment variables", "2 API Reference", "2.1 Auth"], description: "Example 1 - nested numbering with resets of deeper counters"}
  - {id: t2, args: [["## Overview", "```yaml", "# replicas: 3", "```", "#### Limits #", "## Usage", "#hashtag", "# Appendix"]], expected: ["0.1 Overview", "0.1.0.1 Limits #", "0.2 Usage", "1 Appendix"], description: "Example 2 - skipped levels show 0, code fence ignored, trailing # kept, no-space line rejected"}
  - {id: t3, hidden: true, args: [[]], expected: [], description: "Empty page"}
  - {id: t4, hidden: true, args: [["plain text", "####### Seven hashes", "  # indented", "#", "##   ", "###.no space"]], expected: [], description: "No valid headings: seven hashes, indented, bare hash, hashes with only spaces, punctuation instead of a space"}
  - {id: t5, hidden: true, args: [["###### Deepest", "# Top", "###### Deepest again", "##### Fifth", "###### Sixth"]], expected: ["0.0.0.0.0.1 Deepest", "1 Top", "1.0.0.0.0.1 Deepest again", "1.0.0.0.1 Fifth", "1.0.0.0.1.1 Sixth"], description: "Level 6 before any other heading and deep skips after a top-level heading"}
  - {id: t6, hidden: true, args: [["# A", "```", "# Hidden", "```", "```python", "## Also hidden", "# Still hidden"]], expected: ["1 A"], description: "Second fence never closed: everything after it is ignored"}
  - {id: t7, hidden: true, args: [["# One", "#   Padded title   ", "#  C# and F# notes ##", "## x"]], expected: ["1 One", "2 Padded title", "3 C# and F# notes ##", "3.1 x"], description: "Title trimming with extra spaces; # characters inside and at the end are kept"}
  - {id: t8, hidden: true, args: [["### c", "## b", "### c2", "# a", "### c3", "## b2", "### c4"]], expected: ["0.0.1 c", "0.1 b", "0.1.1 c2", "1 a", "1.0.1 c3", "1.1 b2", "1.1.1 c4"], description: "Starting deep, then shallower headings reset deeper counters correctly"}
  - {id: t9, hidden: true, args: [["# Same", "# Same", "## Same", "## Same", "# Same"]], expected: ["1 Same", "2 Same", "2.1 Same", "2.2 Same", "3 Same"], description: "Repeated titles are numbered independently"}
  - {id: t10, hidden: true, args: [["  ```", "# Visible because the indented backticks are not a fence", "````", "# inside four-backtick fence", "```", "# after"]], expected: ["1 Visible because the indented backticks are not a fence", "2 after"], description: "Indented backticks do not open a fence; four backticks start with three so they do"}
