expected_concepts:
  - "splitting on a separator and dropping empty segments"
  - "excluding the final file-name segment"
  - "segment-wise longest common prefix"
  - "shrinking the running prefix as each path is processed"
  - "formatting the root case"
optimal_complexity: {time: "O(total length of all paths)", space: "O(length of the longest path)"}
rubric:
  excellent: "Normalises each path into non-empty segments, drops the file name, shrinks a running segment prefix in one pass, formats the root correctly and points out why a character-level prefix gives /var/log for log and logs."
  good: "Correct segment-wise solution that needs one fix for the file-name or root case after testing."
  weak: "Uses a character-level common prefix, keeps the file name as a directory, or mishandles repeated slashes."
  criteria:
    correctness: "All tests pass, including the root answer, duplicates and file names that look like directories."
    efficiency: "Each path is split once and compared against a prefix that only shrinks; linear in total input size."
    code_quality: "Normalisation and prefix logic separated into clear steps with descriptive names."
    edge_cases: "Single path, file directly under the root, repeated and leading slashes, case differences."
    communication: "States the path rules back before coding and explains the log versus logs pitfall."
hints:
  - "Work with lists of directory names instead of raw strings, so that comparisons happen one whole name at a time."
  - "Split each path on the slash, throw away empty pieces caused by repeated slashes, and drop the last piece because it is a file. Then find the longest list prefix shared by all of them."
  - "Turn the first path into its list of directory names and keep it as the running answer. For every other path, build its directory list the same way and cut the running answer down to the number of leading names the two lists agree on. At the end, put a slash in front of the remaining names joined by slashes, which gives a single slash when nothing is left."
followups:
  - "How would you support relative segments such as . and .. safely?"
  - "If watching a directory also covered all of its subdirectories at a cost per file, when would two watch roots be cheaper than one?"
  - "How would you handle Windows paths with drive letters and backslashes?"
  - "How would you find the common directory for paths arriving as a live stream?"
common_errors:
  - "Computing a character-by-character common prefix, which returns /var/log for /var/log/a.log and /var/logs/a.log."
  - "Treating the final file name as a directory, so a single path returns the file itself."
  - "Keeping empty segments from repeated slashes, which produces doubled slashes or false mismatches."
  - "Returning an empty string instead of a single slash when only the root is shared."
