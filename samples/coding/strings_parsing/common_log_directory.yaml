version: 1
slug: common_log_directory
title: "Common Log Directory"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, sre, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Common Log Directory

  A log shipping agent can watch one directory tree per pipeline. Given the absolute paths of all log files a
  pipeline must collect, find the **deepest directory that contains every one of the files** (directly or in
  a subdirectory), so the agent watches as little as possible.

  Path rules:

  - Every path is absolute: it starts with `/`.
  - Segments are separated by one or more slashes; repeated slashes are equivalent to one, so
    `/var//log///app.log` means the segments `var`, `log`, `app.log`.
  - The **last** segment of every path is a **file name**, never a directory. Everything before it is the
    directory holding the file.
  - Segments are compared exactly (case-sensitive) and **as whole segments**, never character by character:
    `/var/log` and `/var/logs` share only `/var`.

  Return the common directory as `"/"` followed by its segments joined with single slashes, for example
  `"/var/log"`, or `"/"` when the deepest shared directory is the root. If there is a single path, the answer
  is the directory that holds that file.

  ### Example 1
  ```
  Input:  paths = ["/var/log/nginx/access.log", "/var/log/nginx/error.log", "/var/log/app/server.log"]
  Output: "/var/log"
  ```

  ### Example 2
  ```
  Input:  paths = ["/var/log/app.log", "/var/logs/app.log"]
  Output: "/var"
  Explanation: log and logs are different segments, so only /var is shared.
  ```

  ### Example 3
  ```
  Input:  paths = ["/srv//payments///worker.log"]
  Output: "/srv/payments"
  ```

  ### Constraints
  - `1 <= paths.length <= 10^4`
  - `2 <= paths[i].length <= 300`
  - Each path starts with `/`, does not end with `/`, and has at least one non-empty segment
  - Segments contain ASCII letters, digits, `.`, `-` and `_`; there are no `.` or `..` segments
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: common_log_directory
  params:
    - {name: paths, type: "string[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def common_log_directory(paths: list[str]) -> str:
        common: list[str] | None = None
        for path in paths:
            segments = [s for s in path.split("/") if s]
            directory = segments[:-1]  # the last segment is the file name
            if common is None:
                common = directory
                continue
            keep = 0
            while keep < len(common) and keep < len(directory) and common[keep] == directory[keep]:
                keep += 1
            common = common[:keep]
        return "/" + "/".join(common or [])
  javascript: |
    function commonLogDirectory(paths) {
      let common = null;
      for (const path of paths) {
        const segments = path.split("/").filter((s) => s.length > 0);
        const directory = segments.slice(0, -1); // the last segment is the file name
        if (common === null) {
          common = directory;
          continue;
        }
        let keep = 0;
        while (keep < common.length && keep < directory.length && common[keep] === directory[keep]) keep++;
        common = common.slice(0, keep);
      }
      return "/" + (common || []).join("/");
    }
