version: 1
slug: minimal_line_diff_script
title: Minimal Line Diff Script
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, devops, qa]
time_limit_minutes: 35
prompt_markdown: |
  ## Minimal Line Diff Script

  A deployment tool shows reviewers how a configuration file changed between two releases. Given the old
  file `old_lines` and the new file `new_lines` as lists of lines, produce a **diff script**: a list of entries that, read
  from top to bottom, walks through both files.

  - `" " + line` keeps a line that is in both files (one space prefix),
  - `"-" + line` deletes a line of `old_lines`,
  - `"+" + line` inserts a line of `new_lines`.

  Reading only the kept and deleted entries (without their prefix) must give `old_lines` exactly, and reading only
  the kept and inserted entries must give `new_lines` exactly.

  The script must use the **fewest deletions plus insertions** possible. Several minimal scripts can exist;
  return the one whose sequence of entry types is **lexicographically smallest** when keep < delete < insert.
  In other words, at each step keep a line if that still allows a minimal script, otherwise delete if that
  still allows one, otherwise insert. Lines compare as whole strings (case and spaces matter).

  ### Example 1
  ```
  Input:  old_lines = ["name: api", "replicas: 2", "port: 80"], new_lines = ["name: api", "replicas: 3", "port: 80"]
  Output: [" name: api", "-replicas: 2", "+replicas: 3", " port: 80"]
  Explanation: Two lines are kept, one deleted and one inserted; no script with fewer than 2 edits exists, and the delete comes before the insert.
  ```

  ### Example 2
  ```
  Input:  old_lines = ["retry", "deploy", "retry"], new_lines = ["deploy", "retry", "deploy"]
  Output: ["-retry", " deploy", " retry", "+deploy"]
  Explanation: Keeping "deploy", "retry" or keeping "retry", "deploy" both need 2 edits. The first lines differ, deleting the first "retry" still allows a minimal script, and delete ranks before insert.
  ```

  ### Constraints
  - `0 <= old_lines.length, new_lines.length <= 500`
  - `0 <= line length <= 80`; lines contain printable ASCII characters and may be empty.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: line_diff_script
  params:
    - {name: old_lines, type: "string[]"}
    - {name: new_lines, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def line_diff_script(old_lines: list[str], new_lines: list[str]) -> list[str]:
        n, m = len(old_lines), len(new_lines)
        # common[i][j]: longest common subsequence of old_lines[i:] and new_lines[j:]
        common = [[0] * (m + 1) for _ in range(n + 1)]
        for i in range(n - 1, -1, -1):
            for j in range(m - 1, -1, -1):
                if old_lines[i] == new_lines[j]:
                    common[i][j] = common[i + 1][j + 1] + 1
                else:
                    common[i][j] = max(common[i + 1][j], common[i][j + 1])
        script: list[str] = []
        i = j = 0
        while i < n or j < m:
            if i < n and j < m and old_lines[i] == new_lines[j]:
                script.append(" " + old_lines[i])
                i += 1
                j += 1
            elif i < n and common[i + 1][j] == common[i][j]:
                script.append("-" + old_lines[i])
                i += 1
            else:
                script.append("+" + new_lines[j])
                j += 1
        return script
  javascript: |
    function lineDiffScript(oldLines, newLines) {
      const n = oldLines.length, m = newLines.length;
      const common = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          common[i][j] = oldLines[i] === newLines[j]
            ? common[i + 1][j + 1] + 1
            : Math.max(common[i + 1][j], common[i][j + 1]);
        }
      }
      const script = [];
      let i = 0, j = 0;
      while (i < n || j < m) {
        if (i < n && j < m && oldLines[i] === newLines[j]) {
          script.push(" " + oldLines[i]);
          i++;
          j++;
        } else if (i < n && common[i + 1][j] === common[i][j]) {
          script.push("-" + oldLines[i]);
          i++;
        } else {
          script.push("+" + newLines[j]);
          j++;
        }
      }
      return script;
    }
