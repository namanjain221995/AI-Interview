expected_concepts:
  - "longest common subsequence as the complement of minimal edits"
  - "suffix-based DP table so greedy reconstruction can look ahead"
  - "greedy reconstruction in keep, delete, insert priority order"
  - "O(n * m) time and memory for the table"
optimal_complexity: {time: "O(n * m)", space: "O(n * m)"}
rubric:
  excellent: "Recognises that minimal deletions plus insertions equals n + m - 2 * LCS, builds the LCS table over suffixes, reconstructs greedily from the front with the keep, delete, insert priority and argues why greedy yields the lexicographically smallest minimal script; handles empty files and empty lines."
  good: "Correct LCS table and a valid minimal script, with the tie-break order fixed after testing a tie case."
  weak: "Produces a valid but non-minimal script (for example delete everything then insert everything), uses a line-by-line positional comparison, or ignores the tie-break rule."
  criteria:
    correctness: "All tests pass, including tie cases, empty files and empty lines."
    efficiency: "O(n * m) time; no exponential search over scripts."
    code_quality: "Table orientation (prefix versus suffix) is clear and the reconstruction loop is easy to follow."
    edge_cases: "Empty old or new files, identical files, empty lines and lines differing only in case or spacing."
    communication: "Explains why reconstruction must start from the front over a suffix table to honour the tie-break."
hints:
  - "Every line that is kept saves one deletion and one insertion, so the problem is really about keeping as many lines as possible in order."
  - "The kept lines form a longest common subsequence of the two files. Compute, for every pair of suffixes, the length of their longest common subsequence; then you can always tell whether a particular next step can still lead to a minimal script."
  - "Fill a table over suffixes from the bottom right. Then walk from the start of both files: if the current lines are equal, keep; otherwise delete the old line when skipping it does not reduce the common length of the remaining suffixes; otherwise insert the new line. When one file is exhausted, emit the rest of the other."
followups:
  - "Why does reconstructing from the end of a prefix table make it harder to honour this tie-break?"
  - "How does Myers' algorithm reach O((n + m) * d) time where d is the number of edits?"
  - "How would you reduce memory to O(n + m) while still producing the script (Hirschberg)?"
  - "How would you group the output into hunks with three lines of context like unified diff?"
common_errors:
  - "Comparing files position by position instead of finding a common subsequence."
  - "Building a prefix table and reconstructing backwards, which yields a different minimal script than required."
  - "Preferring insert over delete when both are optimal."
  - "Treating empty lines as missing or trimming whitespace before comparing."
  - "Forgetting to flush the remaining lines once one file is exhausted."
