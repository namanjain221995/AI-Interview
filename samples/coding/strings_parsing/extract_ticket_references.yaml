expected_concepts:
  - "single left-to-right scan with an index"
  - "explicit boundary checks before the key and after the digits"
  - "maximal run of uppercase letters as the project key"
  - "ordered de-duplication with a set plus a list"
  - "ASCII character classification without regular expressions"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Writes a clean single-pass scanner with small helper predicates, checks both boundaries and the 2-10 key length on the maximal uppercase run, de-duplicates in first-seen order and walks through the tricky cases (glued letters, 11-letter keys, hyphen chains) unprompted."
  good: "Correct scanner after fixing one boundary or length case found while testing; complexity stated correctly."
  weak: "Misses the left or right boundary rule, accepts suffixes of longer keys, loses the first-seen order or cannot finish without a regular expression."
  criteria:
    correctness: "All tests pass, including boundary characters, key-length limits and duplicates."
    efficiency: "One linear pass over the message; membership checks for de-duplication are constant time."
    code_quality: "Character-class helpers and clearly named indices for the key start, hyphen and digit end."
    edge_cases: "Empty message, reference at the very start or end, 1- and 11-letter keys, missing digits, trailing letters."
    communication: "States the boundary rule precisely before coding and explains why an 11-letter run must not yield a 10-letter match."
hints:
  - "Think of the message as a sequence of characters you walk once, deciding at each position whether a reference could start there."
  - "A reference can only start where the previous character is not a letter or digit. From there, consume the whole run of uppercase letters, then require a hyphen and at least one digit."
  - "At a valid start, measure the uppercase run and check it has 2 to 10 letters, that the next character is a hyphen and that at least one digit follows. Consume all digits, then confirm the next character is the end of the message or not a letter or digit. Record the reference in a list only if a set has not seen it, and continue scanning after the digits."
followups:
  - "How would you also accept lowercase keys but normalise them to uppercase in the output?"
  - "How would you report how many times each reference was mentioned, still in first-seen order?"
  - "If messages were streamed in chunks, how would you handle a reference split across two chunks?"
  - "How would you write the same rule as a regular expression, and which part is easy to get wrong?"
common_errors:
  - "Matching the last 10 letters of a longer uppercase run, so an 11-letter key produces a reference."
  - "Forgetting the right boundary and accepting OPS-12 inside OPS-12a."
  - "Treating underscore as a word character (as a regular-expression word boundary does) and missing OPS-12_fix."
  - "De-duplicating with a set only and returning references in arbitrary order."
  - "Accepting a key followed by a hyphen with no digits."
