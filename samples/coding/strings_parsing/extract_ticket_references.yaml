version: 1
slug: extract_ticket_references
title: "Extract Ticket References"
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [devops, backend, qa, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Extract Ticket References

  Your team's release-notes generator links each commit message to the tickets it mentions. Write a
  function that scans one commit `message` and returns every **ticket reference** in it.

  A ticket reference is:

  1. a project key of **2 to 10 uppercase letters** `A`-`Z`,
  2. followed by a single hyphen `-`,
  3. followed by **one or more digits** `0`-`9`.

  The reference must also stand on its own: the character immediately **before** the project key and the
  character immediately **after** the last digit must each be either the start/end of the message or a
  character that is **not** an ASCII letter or digit. So `xOPS-12` and `OPS-12a` contain no reference,
  while `(OPS-12)`, `OPS-12,` and `OPS-12_fix` each contain `OPS-12`. The project key is the whole run of
  uppercase letters before the hyphen, so `ABCDEFGHIJK-1` (11 letters) is not a reference.

  Return the **distinct** references in the order of their **first** appearance, exactly as written
  (`OPS-7` and `OPS-007` are different strings). Return an empty list if there are none. Do not use a
  regular-expression library; walk the characters yourself.

  ### Example 1
  ```
  Input:  message = "Fix retry storm in checkout (OPS-1432), see PAY-77."
  Output: ["OPS-1432", "PAY-77"]
  Explanation: Both references are bounded by punctuation.
  ```

  ### Example 2
  ```
  Input:  message = "xOPS-12 OPS-12a OPS- -12 ops-5 no tickets here"
  Output: []
  ```

  ### Example 3
  ```
  Input:  message = "Revert OPS-9; re-apply OPS-9 after INFRA-210 lands, then OPS-10"
  Output: ["OPS-9", "INFRA-210", "OPS-10"]
  ```

  ### Constraints
  - `0 <= message.length <= 10^4`
  - `message` consists of ASCII characters (letters, digits, punctuation, spaces and tabs; no line breaks)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: extract_ticket_references
  params:
    - {name: message, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def extract_ticket_references(message: str) -> list[str]:
        def is_upper(ch: str) -> bool:
            return "A" <= ch <= "Z"

        def is_digit(ch: str) -> bool:
            return "0" <= ch <= "9"

        def is_word(ch: str) -> bool:
            return is_upper(ch) or is_digit(ch) or "a" <= ch <= "z"

        n = len(message)
        found: list[str] = []
        seen: set[str] = set()
        i = 0
        while i < n:
            if not is_upper(message[i]) or (i > 0 and is_word(message[i - 1])):
                i += 1
                continue
            j = i
            while j < n and is_upper(message[j]):
                j += 1
            letters = j - i
            if 2 <= letters <= 10 and j < n and message[j] == "-":
                k = j + 1
                while k < n and is_digit(message[k]):
                    k += 1
                if k > j + 1 and (k == n or not is_word(message[k])):
                    ref = message[i:k]
                    if ref not in seen:
                        seen.add(ref)
                        found.append(ref)
                    i = k
                    continue
            i = j
        return found
  javascript: |
    function extractTicketReferences(message) {
      const isUpper = (ch) => ch >= "A" && ch <= "Z";
      const isDigit = (ch) => ch >= "0" && ch <= "9";
      const isWord = (ch) => isUpper(ch) || isDigit(ch) || (ch >= "a" && ch <= "z");
      const n = message.length;
      const found = [];
      const seen = new Set();
      let i = 0;
      while (i < n) {
        if (!isUpper(message[i]) || (i > 0 && isWord(message[i - 1]))) {
          i++;
          continue;
        }
        let j = i;
        while (j < n && isUpper(message[j])) j++;
        const letters = j - i;
        if (letters >= 2 && letters <= 10 && j < n && message[j] === "-") {
          let k = j + 1;
          while (k < n && isDigit(message[k])) k++;
          if (k > j + 1 && (k === n || !isWord(message[k]))) {
            const ref = message.slice(i, k);
            if (!seen.has(ref)) {
              seen.add(ref);
              found.push(ref);
            }
            i = k;
            continue;
          }
        }
        i = j;
      }
      return found;
    }
