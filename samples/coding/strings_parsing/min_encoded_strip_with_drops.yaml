expected_concepts:
  - "dynamic programming over (position, deletions remaining)"
  - "choosing the character that starts the next run and deleting the others inside it"
  - "encoded length as a step function of run length (1, 2-9, 10-99, 100)"
  - "merging runs by deleting the characters between them"
  - "O(n^2 * k) time bound"
optimal_complexity: {time: "O(n^2 * k)", space: "O(n * k)"}
rubric:
  excellent: "Defines the best encoding of each suffix with r deletions left, considers deleting the current character or making it the start of a run extended to any later point while deleting the differing characters in between, uses the digit-count step function for run cost, and argues O(n^2 * k) time with clear handling of deleting everything."
  good: "Correct memoised recursion over (index, deletions left, previous character, run length) or the run-start DP, possibly with a slower but acceptable bound."
  weak: "Greedy deletion of the shortest runs, ignores that deletions can merge runs, or forgets that run lengths of 10 and 100 add digits."
  criteria:
    correctness: "All tests pass, including full deletion, merges and multi-digit run lengths."
    efficiency: "Polynomial DP within O(n^2 * k) or close; no subset enumeration."
    code_quality: "Run cost isolated in a helper; DP indices and their meaning documented."
    edge_cases: "k = 0, k = length, single character, runs of exactly 10 and 100."
    communication: "Explains why a greedy approach fails and how merges are captured by the recurrence."
hints:
  - "Deleting characters is only worth it when it removes a short run entirely, merges two runs of the same letter, or shrinks a run's count to fewer digits. Greedy choices among these interact, so look for a recurrence."
  - "Work on suffixes with a budget of remaining deletions. At the current position you can either delete this character or decide that it starts the next run of the encoding; in the second case think about how far that run should extend."
  - "For each start position and remaining budget, try deleting the current character; otherwise scan forward, counting characters equal to the starting letter and the differing characters you would have to delete. For each end point within budget, the cost is the encoded length of that run (one character, plus the number of digits of the count when the count is at least two) plus the best answer for the rest with the reduced budget. Take the minimum."
followups:
  - "How would the recurrence change if deleting a character had a different cost per position?"
  - "How would you reconstruct which characters to delete, not just the final length?"
  - "What if instead of deleting you could change at most k characters to any letter?"
  - "Can you reduce memory by keeping only the rows the recurrence needs?"
common_errors:
  - "Greedily deleting the shortest runs, which misses merges such as deleting x in aaxaabb."
  - "Treating every run of length at least 2 as costing 2, ignoring two- and three-digit counts."
  - "Not allowing a run to skip over and delete characters that differ from its letter."
  - "Off-by-one in the remaining deletion budget when the scan deletes a character."
  - "Returning 1 instead of 0 when everything can be deleted."
