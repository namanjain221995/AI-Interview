slug: min_encoded_strip_with_drops
title: Minimum Encoded Strip with Drops
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [sre, backend, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Minimum Encoded Strip with Drops

  An edge sensor reports its state once per second as a lowercase letter, and the readings are uploaded as a
  **status strip** over a very expensive satellite link. Before upload the strip is run-length encoded: it is
  split into maximal runs of the same letter, and each run is written as

  - the letter alone if the run has length 1, or
  - the letter followed by the run length in decimal if the run has length `L >= 2`.

  For example `"aaabcc"` encodes as `"a3bc2"` (5 characters) and a run of twelve `x` becomes `"x12"`.

  Some readings are known to be noise, so the uploader may **delete at most `k` characters** from `strip`
  (any positions) before encoding; the remaining characters keep their order, and runs that become adjacent
  merge. Return the **minimum possible length** of the encoded strip. Deleting everything is allowed when
  `k` is large enough, and encodes to length `0`.

  ### Example 1
  ```
  Input:  strip = "aaxaabb", k = 1
  Output: 4
  Explanation: Delete the 'x' so the two runs of 'a' merge: "aaaaabb" encodes as "a5b2" (4 characters).
  ```

  ### Example 2
  ```
  Input:  strip = "abcd", k = 0
  Output: 4
  Explanation: With no deletions the encoding is "abcd" itself.
  ```

  ### Example 3
  ```
  Input:  strip = "abaab", k = 2
  Output: 2
  Explanation: Deleting the two 'b' characters leaves "aaa", encoded as "a3" (2 characters).
  ```

  ### Constraints
  - `1 <= strip.length <= 100`
  - `0 <= k <= strip.length`
  - `strip` consists of lowercase English letters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_encoded_length
  params:
    - {name: strip, type: "string"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_encoded_length(strip: str, k: int) -> int:
        n = len(strip)

        def run_cost(length: int) -> int:
            if length == 1:
                return 1
            return 1 + len(str(length))

        inf = float("inf")
        # best[i][r]: shortest encoding of strip[i:] when at most r more characters may be deleted
        best = [[0] * (k + 1) for _ in range(n + 1)]
        for i in range(n - 1, -1, -1):
            for r in range(k + 1):
                # option 1: delete strip[i]
                choice = best[i + 1][r - 1] if r > 0 else inf
                # option 2: strip[i] starts a run; extend it through j, deleting the other characters
                same = deleted = 0
                for j in range(i, n):
                    if strip[j] == strip[i]:
                        same += 1
                    else:
                        deleted += 1
                        if deleted > r:
                            break
                    cost = run_cost(same) + best[j + 1][r - deleted]
                    if cost < choice:
                        choice = cost
                best[i][r] = choice
        return int(best[0][k])
  javascript: |
    function minEncodedLength(strip, k) {
      const n = strip.length;
      const runCost = (len) => (len === 1 ? 1 : 1 + String(len).length);
      const best = Array.from({ length: n + 1 }, () => new Array(k + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) {
        for (let r = 0; r <= k; r++) {
          let choice = r > 0 ? best[i + 1][r - 1] : Infinity;
          let same = 0, deleted = 0;
          for (let j = i; j < n; j++) {
            if (strip[j] === strip[i]) same++;
            else if (++deleted > r) break;
            const cost = runCost(same) + best[j + 1][r - deleted];
            if (cost < choice) choice = cost;
          }
          best[i][r] = choice;
        }
      }
      return best[0][k];
    }
