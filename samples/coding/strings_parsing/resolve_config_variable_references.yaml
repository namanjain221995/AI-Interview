version: 1
slug: resolve_config_variable_references
title: Resolve Config Variable References
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [devops, platform, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Resolve Config Variable References

  A deployment tool reads a flat configuration as two parallel lists: `keys[i]` has the raw value
  `values[i]`. Keys are unique. A value may **reference** another key by writing `${key}`, and the tool
  must expand every value before shipping it.

  - A reference is `${`, then a key name, then `}`. Every `${` in the input starts a well-formed
    reference; any other `$`, `{` or `}` is literal text.
  - Resolve values **fully and recursively**: a reference is replaced by the fully resolved value of the
    referenced key.
  - A reference to a key that does not exist is replaced by the empty string.
  - If resolving a key ever leads back into a cycle (a key that references itself, directly or through
    other keys) the key resolves to the string `!CYCLE`. This applies to every key on the cycle **and**
    to every key whose resolution reaches a cycle through its references.

  Return the resolved values in the same order as `keys`.

  ### Example 1
  ```
  Input:  keys = ["host", "port", "url"], values = ["db.internal", "5432", "postgres://${host}:${port}/app"]
  Output: ["db.internal", "5432", "postgres://db.internal:5432/app"]
  ```

  ### Example 2
  ```
  Input:  keys = ["api_url", "base", "region", "mirror"], values = ["https://${base}/v1", "${region}.example.net", "${zone}eu", "${mirror}"]
  Output: ["https://eu.example.net/v1", "eu.example.net", "eu", "!CYCLE"]
  Explanation: zone does not exist so it becomes ""; mirror references itself
  ```

  ### Example 3
  ```
  Input:  keys = ["log_dir", "home", "root", "cache"], values = ["${home}/logs", "${root}", "${home}/srv", "/tmp/${cache_name}"]
  Output: ["!CYCLE", "!CYCLE", "!CYCLE", "/tmp/"]
  Explanation: home and root reference each other, and log_dir reaches that cycle
  ```

  ### Constraints
  - `0 <= keys.length == values.length <= 200`
  - Key names match `[A-Za-z0-9_.]+`; `0 <= values[i].length <= 200`
  - Every fully resolved value that is not `!CYCLE` has at most `10^4` characters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: resolve_config_variables
  params:
    - {name: keys, type: "string[]"}
    - {name: values, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def resolve_config_variables(keys: list[str], values: list[str]) -> list[str]:
        raw = dict(zip(keys, values))
        resolved: dict[str, str] = {}
        in_progress: set[str] = set()
        cycle = "!CYCLE"

        def resolve(key: str) -> str:
            if key in resolved:
                return resolved[key]
            if key in in_progress:
                return cycle
            in_progress.add(key)
            text = raw[key]
            parts: list[str] = []
            hit_cycle = False
            i = 0
            while i < len(text):
                if text.startswith("${", i):
                    end = text.index("}", i + 2)
                    name = text[i + 2:end]
                    if name in raw:
                        value = resolve(name)
                        if value == cycle:
                            hit_cycle = True
                        parts.append(value)
                    i = end + 1
                else:
                    parts.append(text[i])
                    i += 1
            in_progress.discard(key)
            resolved[key] = cycle if hit_cycle else "".join(parts)
            return resolved[key]

        return [resolve(key) for key in keys]
  javascript: |
    function resolveConfigVariables(keys, values) {
      const CYCLE = "!CYCLE";
      const raw = new Map();
      keys.forEach((key, i) => raw.set(key, values[i]));
      const resolved = new Map();
      const inProgress = new Set();
      const resolve = (key) => {
        if (resolved.has(key)) return resolved.get(key);
        if (inProgress.has(key)) return CYCLE;
        inProgress.add(key);
        const text = raw.get(key);
        let out = "";
        let hitCycle = false;
        let i = 0;
        while (i < text.length) {
          if (text.startsWith("${", i)) {
            const end = text.indexOf("}", i + 2);
            const name = text.slice(i + 2, end);
            if (raw.has(name)) {
              const value = resolve(name);
              if (value === CYCLE) hitCycle = true;
              out += value;
            }
            i = end + 1;
          } else {
            out += text[i];
            i += 1;
          }
        }
        inProgress.delete(key);
        const result = hitCycle ? CYCLE : out;
        resolved.set(key, result);
        return result;
      };
      return keys.map((key) => resolve(key));
    }
