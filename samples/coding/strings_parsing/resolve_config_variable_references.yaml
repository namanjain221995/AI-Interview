expected_concepts:
  - "references as edges of a directed graph"
  - "depth-first search with in-progress and done states (three-colour marking)"
  - "memoisation so each key is resolved once"
  - "propagating a cycle result to every key that reaches the cycle"
optimal_complexity: {time: "O(k + total output length) for k keys", space: "O(k + total output length)"}
rubric:
  excellent: "Models references as a graph, resolves with memoised DFS using in-progress and done states, distinguishes a revisit of a finished key (diamond) from a back edge (cycle), propagates the cycle marker to every dependant and discusses recursion depth and output blow-up limits."
  good: "Correct memoised resolution with cycle detection after a hint about diamonds or about keys that only reach a cycle."
  weak: "Uses a single visited set that flags diamonds as cycles, re-scans values in a loop without termination guarantees, or marks only the key where the cycle was detected."
  criteria:
    correctness: "All tests pass, including diamonds, self references, keys reaching cycles, unknown keys and literal dollar signs."
    efficiency: "Each key is resolved once thanks to memoisation."
    code_quality: "Parsing of references is separated from graph traversal; the cycle sentinel is a named constant."
    edge_cases: "Empty input, empty values, repeated references and long reference chains."
    communication: "Explains the three states of a key during DFS and why a done key is safe to reuse."
hints:
  - "Think of each key as a node and each reference as an edge to the key it mentions. Resolving a value means visiting everything it can reach."
  - "Resolve keys with a depth-first search and remember finished results. You need to tell apart a key you are still in the middle of resolving from one you have already finished, because only the first case means a cycle."
  - "Keep each key in one of three states: untouched, in progress, or done with a stored result. When resolving a key, mark it in progress, scan its value and replace each reference with the recursive result, using empty text for unknown keys. Meeting an in-progress key, or a dependency whose stored result is the cycle marker, makes the current key's result the cycle marker; otherwise store the concatenated text and mark it done."
followups:
  - "How would you report the keys that form each cycle instead of a sentinel?"
  - "How would you support default values such as ${port:-8080}?"
  - "How would you stop a malicious config from expanding into gigabytes of text?"
  - "How would you avoid deep recursion for very long reference chains?"
common_errors:
  - "Using a single visited set, which reports a cycle for a key referenced twice through a diamond."
  - "Marking only the key where the back edge was found instead of every key that reaches the cycle."
  - "Substituting repeatedly until nothing changes, which never terminates on cycles."
  - "Treating a bare dollar sign or brace as the start of a reference."
