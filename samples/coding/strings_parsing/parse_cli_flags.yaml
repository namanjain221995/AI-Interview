  - {id: t1, args: [["deploy", "--env", "staging", "--dry-run", "-vf", "--replicas=3", "web"]], expected: ["dry-run=true", "env=staging", "f=true", "replicas=3", "v=true"], description: "Example 1 - consumed value, boolean long flag, grouped short flags, = form, positionals"}
  - {id: t2, args: [["--tag=v1", "--tag", "v2", "--", "--tag=v3", "-x"]], expected: ["tag=v2"], description: "Example 2 - last assignment wins and -- stops parsing"}
  - {id: t3, hidden: true, args: [[]], expected: [], description: "No arguments"}
  - {id: t4, hidden: true, args: [["build", "-", "src/", "--"]], expected: [], description: "Only positionals, a lone dash and a terminator"}
  - {id: t5, hidden: true, args: [["--verbose"]], expected: ["verbose=true"], description: "Long flag at the end of the list is true"}
  - {id: t6, hidden: true, args: [["--label=", "--query=a=b=c", "--note=has space"]], expected: ["label=", "note=has space", "query=a=b=c"], description: "Empty value after =, value containing = signs, value containing a space"}
  - {id: t7, hidden: true, args: [["--force", "--yes", "--out", "-", "--level", "true"]], expected: ["force=true", "level=true", "out=true", "yes=true"], description: "Long flag followed by another long flag, by a lone dash (not consumed), and by a literal true"}
  - {id: t8, hidden: true, args: [["-ab", "--a=x", "-b", "--b", "-a"]], expected: ["a=true", "b=true"], description: "Short and long forms share a namespace; last write wins for both names"}
  - {id: t9, hidden: true, args: [["-Zz", "--z-index", "10", "--z1", "-a", "--0", "Y"]], expected: ["0=Y", "Z=true", "a=true", "z=true", "z-index=10", "z1=true"], description: "Character-code order: digit name, then uppercase, then lowercase, with z-index before z1 because hyphen precedes digits; --z1 is true because a short flag group follows"}
  - {id: t10, hidden: true, args: [["--a", "--", "b", "--c=1"]], expected: ["a=true"], description: "A long flag directly before -- is true and -- is not consumed as its value"}
  - {id: t11, hidden: true, args: [["--region", "eu-west-1", "--n", "-q", "pos", "--n", "--m", "x", "-pqr", "tail"]], expected: ["m=x", "n=true", "p=true", "q=true", "r=true", "region=eu-west-1"], description: "Mixed sequence: value with hyphens is consumed, repeated flag ends true, short groups"}
expected_concepts:
  - "index-based scan that can consume the next argument"
  - "first-occurrence split on ="
  - "last-write-wins map of flags"
  - "terminator handling for --"
  - "sorting output keys by character code"
optimal_complexity: {time: "O(L + k log k)", space: "O(k)"}
rubric:
  excellent: "Uses an explicit index so a value can be consumed, orders the checks correctly (-- before --name before -abc), splits on the first = only, stores into a map with last-write-wins, and sorts names by code order; explains the ambiguity of values that start with a dash."
  good: "Correct parser that needs a nudge on one rule, such as not consuming a lone dash, splitting on the first = only, or stopping at --."
  weak: "Uses a for-each loop that cannot skip a consumed value, splits on every =, treats -abc as a flag named abc, or keeps the first value of a repeated flag."
  criteria:
    correctness: "All tests pass, including the terminator, repeated flags across short and long forms, and values containing = signs."
    efficiency: "Single pass over the arguments plus sorting the distinct flag names."
    code_quality: "Each argument shape handled by a clear branch in a sensible order; no duplicated parsing logic."
    edge_cases: "Empty list, flag at the end, flag before --, lone dash, empty value after =, uppercase short flags in the sort order."
    communication: "Explains which argument shapes are checked first and why the order of checks matters."
hints:
  - "Classify each argument by its shape first: the terminator, a long flag, a group of short flags, or something positional."
  - "A long flag without an equals sign may need to look at the argument after it, so a plain for-each loop is awkward; keep an index you can advance an extra step. Store results in a map so later assignments overwrite earlier ones."
  - "Walk with an index. Stop entirely at a bare double dash. For a double-dash argument, split at the first equals sign if there is one; otherwise take the next argument as the value when it exists and does not begin with a dash (and skip it), or use true. For a single dash followed by letters, set each letter to true. Finally sort the map keys by character code and format name equals value."
followups:
  - "How would you support flags that may be repeated to build a list, such as --tag a --tag b?"
  - "How would you handle a negative number as a value, for example --offset -5?"
  - "How would you declare which flags are boolean so that --dry-run never consumes a positional argument?"
  - "How would you generate a usage message from the same flag definitions?"
common_errors:
  - "Iterating with for-each and then also processing the consumed value as a positional argument."
  - "Splitting --query=a=b=c on every equals sign."
  - "Consuming a lone - or a following short flag group as the value of a long flag."
  - "Continuing to parse flags after the -- terminator."
  - "Sorting with a locale-aware comparison so uppercase names do not come first."
