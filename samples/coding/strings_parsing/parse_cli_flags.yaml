version: 1
slug: parse_cli_flags
title: Parse CLI Flags
difficulty: medium
competency_keys: [problem_solving, code_quality]
role_tags: [platform, devops, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Parse CLI Flags

  An internal deploy CLI needs a small, dependency-free flag parser. You are given the argument list
  `argv` (without the program name). Process it from left to right:

  - `--` on its own **stops flag parsing**: it and every argument after it are positional.
  - `--name=value` sets flag `name` to `value`. The name ends at the **first** `=`; the value is the rest
    of the argument and may be empty or contain more `=` characters.
  - `--name` without `=`: if there is a next argument and it does **not** start with `-`, that next
    argument is consumed as the value. Otherwise the flag is set to `true`.
  - `-abc` (a single dash followed by letters) sets each letter as its own flag to `true`: `a`, `b` and
    `c`. Short flags never take a value.
  - A lone `-` and any argument that does not start with `-` are positional arguments, which are ignored.

  Short and long flags share one namespace (`-v` and `--v` set the same flag). If a flag is set more
  than once, the **last** assignment wins.

  Return one string `name=value` per flag, sorted by name in ascending character-code order.

  ### Example 1
  ```
  Input:  argv = ["deploy", "--env", "staging", "--dry-run", "-vf", "--replicas=3", "web"]
  Output: ["dry-run=true", "env=staging", "f=true", "replicas=3", "v=true"]
  Explanation: staging is consumed by --env. --dry-run is followed by -vf, which starts with -, so it is true.
  ```

  ### Example 2
  ```
  Input:  argv = ["--tag=v1", "--tag", "v2", "--", "--tag=v3", "-x"]
  Output: ["tag=v2"]
  Explanation: Everything after -- is positional, so --tag=v3 and -x are ignored.
  ```

  ### Constraints
  - `0 <= argv.length <= 200`
  - Every argument is non-empty and consists of printable ASCII characters.
  - Long flag names (between `--` and `=` or the end) are non-empty and use lowercase letters, digits and `-`.
  - An argument that starts with a single `-` is either a lone `-` or `-` followed by one or more ASCII letters.

  **Follow-up:** how would you report unknown flags or a flag that is missing its required value?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parse_cli_flags
  params:
    - {name: argv, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def parse_cli_flags(argv: list[str]) -> list[str]:
        flags: dict[str, str] = {}
        i, n = 0, len(argv)
        while i < n:
            arg = argv[i]
            if arg == "--":
                break
            if arg.startswith("--"):
                body = arg[2:]
                if "=" in body:
                    name, value = body.split("=", 1)
                    flags[name] = value
                elif i + 1 < n and not argv[i + 1].startswith("-"):
                    flags[body] = argv[i + 1]
                    i += 1
                else:
                    flags[body] = "true"
            elif arg.startswith("-") and len(arg) > 1:
                for letter in arg[1:]:
                    flags[letter] = "true"
            i += 1
        return [f"{name}={flags[name]}" for name in sorted(flags)]
  javascript: |
    function parseCliFlags(argv) {
      const flags = new Map();
      for (let i = 0; i < argv.length; i++) {
        const arg = argv[i];
        if (arg === "--") break;
        if (arg.startsWith("--")) {
          const body = arg.slice(2);
          const eq = body.indexOf("=");
          if (eq !== -1) {
            flags.set(body.slice(0, eq), body.slice(eq + 1));
          } else if (i + 1 < argv.length && !argv[i + 1].startsWith("-")) {
            flags.set(body, argv[i + 1]);
            i++;
          } else {
            flags.set(body, "true");
          }
        } else if (arg.startsWith("-") && arg.length > 1) {
          for (const letter of arg.slice(1)) flags.set(letter, "true");
        }
      }
      const names = [...flags.keys()].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return names.map((name) => `${name}=${flags.get(name)}`);
    }
