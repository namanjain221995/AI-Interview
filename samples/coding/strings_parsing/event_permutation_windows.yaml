expected_concepts:
  - "fixed-size sliding window"
  - "character frequency counting with a 26-slot array or hash map"
  - "incremental update when one event enters and one leaves"
  - "tracking the number of mismatched counts for O(1) window checks"
  - "O(n) time instead of sorting or recounting each window"
optimal_complexity: {time: "O(n + m) for n events and probe length m", space: "O(1) - 26 counters"}
rubric:
  excellent: "Builds the probe's letter counts, slides a fixed window updating one entering and one leaving letter per step, checks each window in constant time (mismatch counter or 26-slot comparison), handles a probe longer than the events and explains the O(n) bound."
  good: "Correct sliding window that compares full 26-slot arrays per step, or needs a hint for the first window or the off-by-one at the end."
  weak: "Sorts or recounts every window (O(n * m)), generates permutations, or misses overlapping matches."
  criteria:
    correctness: "All tests pass, including repeated letters, overlapping windows and a probe longer than the events."
    efficiency: "Linear in the length of events; constant work per slide."
    code_quality: "Clear separation of the first window and the slide; no duplicated counting code."
    edge_cases: "Probe longer than events, single-character inputs, every window matching, wrong multiplicities."
    communication: "Explains why a frequency signature identifies a rearrangement and how the window update keeps it current."
hints:
  - "Two strings are rearrangements of each other exactly when every letter appears the same number of times in both."
  - "All candidate windows have the same length. When the window moves right by one, only one event enters and one leaves, so the counts can be updated instead of rebuilt."
  - "Count the probe's letters, then count the first window of the same length. Slide the window one step at a time, adding the entering letter and removing the leaving one. Keep a running number of letters whose counts differ from the probe so each window is checked in constant time, and record the start whenever that number is zero."
followups:
  - "How would you support event codes drawn from a large alphabet such as arbitrary strings?"
  - "How would you report only non-overlapping matches?"
  - "What changes if the rule should fire when the window contains at least the probe's events (extra events allowed)?"
  - "How would you process the activity as an unbounded stream?"
common_errors:
  - "Sorting each window, which costs O(n * m log m)."
  - "Comparing only the set of letters and ignoring how many times each appears."
  - "Off-by-one errors that skip the first or the last window."
  - "Indexing out of range when the probe is longer than the events."
  - "Recomputing the full frequency table for every window."
