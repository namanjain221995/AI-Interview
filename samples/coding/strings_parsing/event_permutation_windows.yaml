slug: event_permutation_windows
title: "Event Permutation Windows"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [data, backend, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Event Permutation Windows

  A payments risk engine encodes each account action as one lowercase letter (for example `l` = login,
  `p` = password change, `w` = withdrawal), so an account's recent activity is a string `events`. A
  fraud rule is described by a **probe** string: the rule fires on any stretch of **consecutive**
  events whose length equals `probe.length` and which contains exactly the same events as `probe`,
  each the same number of times, in **any order**.

  Return every start index `i` (0-based) such that the window of `probe.length` events starting at `i`
  is a rearrangement of `probe`. Return the indices in **ascending** order; overlapping windows are all
  reported. If `probe` is longer than `events`, return an empty list.

  Activity strings can be long, so aim for a solution that is linear in `events.length`.

  ### Example 1
  ```
  Input:  events = "xplwplq", probe = "lpw"
  Output: [1, 2, 3]
  Explanation: The windows "plw", "lwp" and "wpl" each contain one p, one l and one w.
  ```

  ### Example 2
  ```
  Input:  events = "lwwpwlw", probe = "wlw"
  Output: [0, 4]
  Explanation: "lww" (start 0) and "wlw" (start 4) each contain two w and one l.
  ```

  ### Example 3
  ```
  Input:  events = "abc", probe = "abcd"
  Output: []
  ```

  ### Constraints
  - `1 <= events.length, probe.length <= 10^5`
  - `events` and `probe` contain only lowercase English letters `a` to `z`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: permutation_window_starts
  params:
    - {name: events, type: "string"}
    - {name: probe, type: "string"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def permutation_window_starts(events: str, probe: str) -> list[int]:
        m, n = len(probe), len(events)
        if m > n:
            return []
        # need[c] > 0: the window still lacks c; need[c] < 0: the window has extra c.
        need = [0] * 26
        for ch in probe:
            need[ord(ch) - 97] += 1
        for ch in events[:m]:
            need[ord(ch) - 97] -= 1
        mismatched = sum(1 for count in need if count != 0)
        starts = [0] if mismatched == 0 else []

        def adjust(index: int, delta: int) -> int:
            before = need[index]
            need[index] += delta
            if before == 0:
                return 1
            if need[index] == 0:
                return -1
            return 0

        for end in range(m, n):
            mismatched += adjust(ord(events[end]) - 97, -1)      # event enters the window
            mismatched += adjust(ord(events[end - m]) - 97, 1)   # event leaves the window
            if mismatched == 0:
                starts.append(end - m + 1)
        return starts
  javascript: |
    function permutationWindowStarts(events, probe) {
      const m = probe.length;
      const n = events.length;
      if (m > n) return [];
      const need = new Array(26).fill(0);
      for (let i = 0; i < m; i++) {
        need[probe.charCodeAt(i) - 97] += 1;
        need[events.charCodeAt(i) - 97] -= 1;
      }
      let mismatched = need.filter((count) => count !== 0).length;
      const starts = mismatched === 0 ? [0] : [];
      const adjust = (index, delta) => {
        const before = need[index];
        need[index] += delta;
        if (before === 0) return 1;
        if (need[index] === 0) return -1;
        return 0;
      };
      for (let end = m; end < n; end++) {
        mismatched += adjust(events.charCodeAt(end) - 97, -1);
        mismatched += adjust(events.charCodeAt(end - m) - 97, 1);
        if (mismatched === 0) starts.push(end - m + 1);
      }
      return starts;
    }
