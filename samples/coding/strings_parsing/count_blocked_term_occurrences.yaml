version: 1
slug: count_blocked_term_occurrences
title: Count Blocked Term Occurrences
difficulty: hard
competency_keys: [algorithms, data_structures]
role_tags: [security, backend, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Count Blocked Term Occurrences

  A content filter scans uploaded documents for blocked terms. Given the document `text` and a list of
  non-empty `terms`, return how many times each term occurs in `text` as a contiguous substring. Occurrences
  **may overlap** (in `"aaaa"` the term `"aa"` occurs 3 times).

  Return the counts in the **same order as `terms`**. If a term appears more than once in the list, every copy
  gets the full count. A term that never occurs (including one longer than `text`) gets `0`.

  ### Example 1
  ```
  Input:  text = "spamandspamx", terms = ["spam", "am", "spa", "ham"]
  Output: [2, 2, 2, 0]
  Explanation: "spam" occurs at 0 and 7, "am" at 2 and 9, "spa" at 0 and 7, and "ham" never occurs.
  ```

  ### Example 2
  ```
  Input:  text = "aaaa", terms = ["aa", "a", "a", "aaaaa"]
  Output: [3, 4, 4, 0]
  Explanation: "aa" occurs at 0, 1 and 2 (overlapping); the duplicate "a" entries both get 4.
  ```

  ### Constraints
  - `0 <= text.length <= 10^5`
  - `1 <= terms.length <= 10^4`
  - `1 <= terms[i].length` and the total length of all terms is at most `10^5`.
  - `text` and every term consist of lowercase English letters.

  **Follow-up:** scanning the text once per term costs `O(len(text) * len(terms))`, which is far too slow at the
  limits. Can you count everything in one pass over the text?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_term_occurrences
  params:
    - {name: text, type: "string"}
    - {name: terms, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def count_term_occurrences(text: str, terms: list[str]) -> list[int]:
        children: list[dict[str, int]] = [{}]
        fail = [0]
        term_node: list[int] = []
        for term in terms:
            node = 0
            for ch in term:
                nxt = children[node].get(ch)
                if nxt is None:
                    nxt = len(children)
                    children[node][ch] = nxt
                    children.append({})
                    fail.append(0)
                node = nxt
            term_node.append(node)

        # breadth-first order for failure links
        order: list[int] = []
        queue = deque(children[0].values())
        while queue:
            node = queue.popleft()
            order.append(node)
            for ch, child in children[node].items():
                f = fail[node]
                while f and ch not in children[f]:
                    f = fail[f]
                fail[child] = children[f].get(ch, 0)
                queue.append(child)

        hits = [0] * len(children)
        node = 0
        for ch in text:
            while node and ch not in children[node]:
                node = fail[node]
            node = children[node].get(ch, 0)
            hits[node] += 1

        # every visit to a node is also an occurrence of each suffix on its failure chain
        for node in reversed(order):
            hits[fail[node]] += hits[node]
        return [hits[node] for node in term_node]
  javascript: |
    function countTermOccurrences(text, terms) {
      const children = [new Map()];
      const fail = [0];
      const termNode = [];
      for (const term of terms) {
        let node = 0;
        for (const ch of term) {
          let nxt = children[node].get(ch);
          if (nxt === undefined) {
            nxt = children.length;
            children[node].set(ch, nxt);
            children.push(new Map());
            fail.push(0);
          }
          node = nxt;
        }
        termNode.push(node);
      }
      const order = [];
      const queue = [...children[0].values()];
      for (let head = 0; head < queue.length; head++) {
        const node = queue[head];
        order.push(node);
        for (const [ch, child] of children[node]) {
          let f = fail[node];
          while (f !== 0 && !children[f].has(ch)) f = fail[f];
          fail[child] = children[f].get(ch) ?? 0;
          queue.push(child);
        }
      }
      const hits = new Array(children.length).fill(0);
      let node = 0;
      for (const ch of text) {
        while (node !== 0 && !children[node].has(ch)) node = fail[node];
        node = children[node].get(ch) ?? 0;
        hits[node]++;
      }
      for (let k = order.length - 1; k >= 0; k--) hits[fail[order[k]]] += hits[order[k]];
      return termNode.map((n) => hits[n]);
    }
