expected_concepts:
  - "string normalisation pipeline (query, trailing slash, segments)"
  - "segment classification for digits, 32-hex and UUID shapes"
  - "hash map counting by normalised key"
  - "sorting by count descending with a lexicographic tie-break"
  - "O(L + k log k) time where k is the number of distinct routes"
optimal_complexity: {time: "O(L + k log k)", space: "O(k)"}
rubric:
  excellent: "Breaks normalisation into small helpers (strip query, strip trailing slash, classify segment), validates the UUID shape group by group, counts with a map and sorts with a composite key; discusses the top-k follow-up with a heap."
  good: "Correct counting and ordering with a reasonable identifier check that needs a nudge on one rule, such as the root path or the 32-hex length."
  weak: "Uses a loose regex that turns any hex-looking or alphanumeric segment into :id, forgets the tie-break, or strips the slash from the root path."
  criteria:
    correctness: "All tests pass, including near-miss hex and UUID segments and the root path."
    efficiency: "Single pass to count plus a sort of the distinct keys only."
    code_quality: "Identifier rules expressed in a readable helper; no copy-pasted checks; comparator states both sort keys."
    edge_cases: "Empty log, root path with and without a query, leading zeros, wrong-length hex, malformed UUIDs, different methods on the same path."
    communication: "Explains why the trailing-slash rule must be applied after removing the query string."
hints:
  - "Turn each line into a route key first; once every line has a key, the rest is counting and sorting."
  - "Normalise in a fixed order: cut the query, then remove a trailing slash unless the path is just the root, then look at each segment separately and decide whether it is an identifier."
  - "Write a helper that says whether a segment is all digits, exactly thirty-two hex characters, or five dash-separated hex groups of lengths 8, 4, 4, 4 and 12. Rebuild the path with :id substitutions, prefix the method, count keys in a hash map, then sort the entries by count from high to low and by key from low to high."
followups:
  - "How would you return only the 10 busiest routes from a log with millions of distinct keys?"
  - "What other identifier shapes (slugs, base64 tokens, dates) might a real service need, and how would you avoid over-merging?"
  - "How would you compute the same counts over a sliding five-minute window?"
  - "How would you group by route and by status class (2xx, 4xx, 5xx) at the same time?"
common_errors:
  - "Removing the trailing slash before dropping the query, so /orders/?page=2 keeps its slash."
  - "Turning / into an empty path by stripping its slash."
  - "Accepting any hex-looking segment of any length as an identifier."
  - "Checking a UUID only by its total length or number of dashes."
  - "Sorting by count only, so ties come out in insertion order."
