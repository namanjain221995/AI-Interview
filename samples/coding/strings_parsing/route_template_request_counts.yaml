slug: route_template_request_counts
title: Route Template Request Counts
difficulty: medium
competency_keys: [data_structures, problem_solving]
role_tags: [backend, sre, data_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Route Template Request Counts

  An SRE dashboard groups access-log traffic by **route template** rather than by raw URL, so that
  `/orders/1042` and `/orders/77` are counted together. Each entry of `lines` has the form
  `METHOD PATH STATUS`, separated by single spaces, for example `GET /orders/1042/items?page=2 200`.

  Normalise each `PATH` as follows:

  1. Drop the query string: everything from the first `?` onwards.
  2. If the remaining path is longer than `/` and ends with `/`, remove that one trailing slash.
  3. Split the path on `/` and replace every segment that is an **identifier** with `:id`. A segment is
     an identifier when it is
     - one or more decimal digits, or
     - exactly 32 hexadecimal characters, or
     - a UUID: five groups of 8, 4, 4, 4 and 12 hexadecimal characters joined by `-`.

     Hexadecimal characters are `0-9`, `a-f` and `A-F`. Any other segment (such as `v2` or `items`) is
     kept unchanged.

  The route key of a line is `METHOD` + a space + the normalised path; the status code is ignored. Count
  the lines per route key and return one string `"<route key> <count>"` per distinct key, sorted by
  **count descending**, ties broken by the route key in ascending character-code order.

  ### Example 1
  ```
  Input:  lines = [
            "GET /orders/1042/items?page=2 200",
            "GET /orders/77/items 200",
            "POST /orders 201",
            "GET /orders/9/items/ 404",
            "POST /orders/ 400"
          ]
  Output: [
            "GET /orders/:id/items 3",
            "POST /orders 2"
          ]
  ```

  ### Example 2
  ```
  Input:  lines = [
            "GET /users/3f2a9c1e-7b4d-4e8a-9c6f-0a1b2c3d4e5f/keys 200",
            "GET /users/0A1B2C3D4E5F60718293A4B5C6D7E8F9/keys 200",
            "GET /users/me/keys 200",
            "DELETE /users/42 204",
            "GET /v2/status 200"
          ]
  Output: [
            "GET /users/:id/keys 2",
            "DELETE /users/:id 1",
            "GET /users/me/keys 1",
            "GET /v2/status 1"
          ]
  Explanation: The UUID and the 32-character hex segment are both identifiers. The three routes seen once are
               ordered by their keys; DELETE sorts before GET.
  ```

  ### Constraints
  - `0 <= lines.length <= 10^4`
  - `METHOD` is an uppercase word such as `GET`, `POST`, `PUT`, `PATCH` or `DELETE`.
  - `PATH` starts with `/`, contains no spaces, and has no empty segments except possibly one trailing
    `/` before the query string.
  - `STATUS` is a three-digit number.

  **Follow-up:** the dashboard only shows the top 10 routes of a very large log. How would you avoid sorting every distinct route?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: route_template_counts
  params:
    - {name: lines, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def route_template_counts(lines: list[str]) -> list[str]:
        hex_digits = set("0123456789abcdefABCDEF")

        def is_hex(s: str) -> bool:
            return all(c in hex_digits for c in s)

        def is_id(seg: str) -> bool:
            if seg and all("0" <= c <= "9" for c in seg):
                return True
            if len(seg) == 32 and is_hex(seg):
                return True
            parts = seg.split("-")
            return [len(p) for p in parts] == [8, 4, 4, 4, 12] and all(is_hex(p) for p in parts)

        counts: dict[str, int] = {}
        for line in lines:
            method, target, _status = line.split(" ")
            path = target.split("?", 1)[0]
            if len(path) > 1 and path.endswith("/"):
                path = path[:-1]
            segments = [":id" if is_id(s) else s for s in path.split("/")]
            key = method + " " + "/".join(segments)
            counts[key] = counts.get(key, 0) + 1
        ordered = sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))
        return [f"{key} {count}" for key, count in ordered]
  javascript: |
    function routeTemplateCounts(lines) {
      const isHex = (s) => /^[0-9a-fA-F]*$/.test(s);
      const isId = (seg) => {
        if (/^[0-9]+$/.test(seg)) return true;
        if (seg.length === 32 && isHex(seg)) return true;
        const parts = seg.split("-");
        const lens = [8, 4, 4, 4, 12];
        return parts.length === 5 && parts.every((p, k) => p.length === lens[k] && isHex(p));
      };
      const counts = new Map();
      for (const line of lines) {
        const [method, target] = line.split(" ");
        let path = target.split("?")[0];
        if (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1);
        const key = method + " " + path.split("/").map((s) => (isId(s) ? ":id" : s)).join("/");
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      const entries = [...counts.entries()];
      entries.sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
      return entries.map(([key, count]) => `${key} ${count}`);
    }
