slug: did_you_mean_cli_command
title: Did You Mean? CLI Suggestion
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [platform, devops, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Did You Mean? CLI Suggestion

  An internal deployment CLI should answer a mistyped subcommand with a suggestion such as
  `unknown command "stauts" - did you mean "status"?`. Write `suggest_command(typed, commands)` that picks
  the suggestion.

  The **edit distance** between two strings is the minimum number of single-character edits needed to
  turn one into the other, where an edit inserts one character, deletes one character or replaces one
  character with another (each edit costs 1).

  - Compute the edit distance from `typed` to every command in `commands`.
  - If the smallest distance is **at most 2**, return the command with that distance. When several
    commands share the smallest distance, return the one that is **lexicographically smallest** (plain
    character-code order, so `-` sorts before letters).
  - Otherwise, or when `commands` is empty, return `""`.

  An exact match has distance 0, so it is always returned when present.

  ### Example 1
  ```
  Input:  typed = "comit", commands = ["clone", "commit", "config"]
  Output: "commit"
  ```

  ### Example 2
  ```
  Input:  typed = "stauts", commands = ["status", "stop", "start", "stash"]
  Output: "start"
  Explanation: "status" and "start" are both at distance 2, and "start" is lexicographically smaller.
  ```

  ### Example 3
  ```
  Input:  typed = "deploy", commands = ["build", "test", "lint"]
  Output: ""
  ```

  ### Constraints
  - `1 <= typed.length <= 30`
  - `0 <= commands.length <= 200`
  - `1 <= commands[i].length <= 30`; the commands are distinct.
  - All strings contain lowercase English letters and `-` only.

  **Follow-up:** can you stop computing a command's distance early once it is certain to exceed 2?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: suggest_command
  params:
    - {name: typed, type: "string"}
    - {name: commands, type: "string[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def _edit_distance(a: str, b: str) -> int:
        prev = list(range(len(b) + 1))
        for i in range(1, len(a) + 1):
            cur = [i] + [0] * len(b)
            for j in range(1, len(b) + 1):
                cost = 0 if a[i - 1] == b[j - 1] else 1
                cur[j] = min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)
            prev = cur
        return prev[len(b)]


    def suggest_command(typed: str, commands: list[str]) -> str:
        best = ""
        best_distance = 3  # only distances of at most 2 qualify
        for command in commands:
            d = _edit_distance(typed, command)
            if d < best_distance or (d == best_distance and command < best):
                best, best_distance = command, d
        return best
  javascript: |
    function editDistance(a, b) {
      let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
      for (let i = 1; i <= a.length; i++) {
        const cur = new Array(b.length + 1).fill(0);
        cur[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        }
        prev = cur;
      }
      return prev[b.length];
    }

    function suggestCommand(typed, commands) {
      let best = '';
      let bestDistance = 3;
      for (const command of commands) {
        const d = editDistance(typed, command);
        if (d < bestDistance || (d === bestDistance && command < best)) {
          best = command;
          bestDistance = d;
        }
      }
      return best;
    }
