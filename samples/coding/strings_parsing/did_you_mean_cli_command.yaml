expected_concepts:
  - edit (Levenshtein) distance by dynamic programming over prefixes
  - rolling two rows to keep memory linear in one string's length
  - threshold check and deterministic tie-breaking
  - optional early exit or length-difference pruning when the distance must exceed 2
optimal_complexity: {time: O(k * L^2), space: O(L)}
rubric:
  excellent: Defines the prefix DP recurrence clearly, implements it with two rows, applies the threshold and the lexicographic tie-break correctly, and discusses pruning (length difference above 2, banded DP or early exit when a whole row exceeds 2).
  good: Correct full-table DP with correct threshold and ties, perhaps after fixing the tie-break or an off-by-one in the base row.
  weak: Uses a heuristic such as common prefix length or character overlap, compares only equal-length strings, or ignores insertions and deletions.
  criteria:
    correctness: All tests pass, including ties, the distance-2 boundary and an empty command list.
    efficiency: O(L^2) per command (L <= 30) with linear memory; pruning is a bonus.
    code_quality: The distance function is separate from the selection logic and the recurrence is readable.
    edge_cases: Exact match, empty commands, distance exactly 2 versus 3, commands much longer or shorter than the input, hyphenated commands.
    communication: Explains the three DP transitions and why the tie-break must compare strings rather than list positions.
hints:
  - Treat the comparison of two strings as a sequence of decisions about their last characters - keep, replace, delete or insert - and think about reusing the answers for shorter prefixes.
  - Fill a table where each cell holds the distance between a prefix of the typed word and a prefix of the command; each cell depends only on its left, upper and upper-left neighbours.
  - The first row and column hold the prefix lengths; every other cell is the minimum of the cell above plus one, the cell to the left plus one, and the diagonal cell plus one only when the two current characters differ; keep only two rows, then walk the commands keeping the smallest distance that is at most 2 and, on equal distance, the lexicographically smaller command.
followups:
  - How would you prune commands whose length differs from the input by more than 2, or stop a row early once every cell exceeds 2?
  - How would you also treat swapping two adjacent characters as a single edit?
  - With thousands of commands, which index structure (for example a BK-tree) avoids comparing against all of them?
  - How would you weight typos between neighbouring keyboard keys as cheaper?
common_errors:
  - Initialising the first row or column to zero instead of the prefix lengths.
  - Adding the substitution cost even when the characters match.
  - Breaking ties by input order instead of lexicographic order.
  - Using a strict less-than 2 threshold, or returning the closest command even when it is far away.
