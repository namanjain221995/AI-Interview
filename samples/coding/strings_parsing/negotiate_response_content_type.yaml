expected_concepts:
  - "tokenising a header by commas, semicolons and equals signs"
  - "case-insensitive lookup in a hash map keyed by media range"
  - "specificity order: exact, type wildcard, full wildcard"
  - "q=0 as an explicit refusal and stable tie-breaking by server preference"
optimal_complexity: {time: "O(h + a) where h is the header length and a the total length of available types", space: "O(h)"}
rubric:
  excellent: "Parses the header once into a map from lower-cased range to weight, looks up each available type from most to least specific, treats q=0 as a refusal, keeps the first listing of repeated ranges, breaks ties by server order and covers the empty-header case without prompting."
  good: "Correct parsing and selection with a small slip such as a prefix match for type wildcards or tie order, fixed after a hint."
  weak: "Takes the maximum q across all matching ranges instead of the most specific one, ignores q=0, compares case-sensitively or returns a lower-cased type."
  criteria:
    correctness: "All tests pass, including specific q=0 overrides, repeated ranges, tie-breaking and the empty header."
    efficiency: "Parses the header once and does constant-time lookups per available type rather than rescanning the header."
    code_quality: "Parsing is separated from selection; parameter handling is small and readable."
    edge_cases: "Blank header, whitespace around separators, extra parameters, mixed case and wildcard prefixes such as image versus imagery."
    communication: "Explains why specificity must decide before weight and how ties are resolved."
hints:
  - "Split the work in two: first turn the header into a lookup of range to weight, then score each available type against that lookup."
  - "For one available type there are only three ranges that could match it: the exact type, its type with a star subtype, and the full wildcard. Check them from most to least specific and stop at the first one that is listed."
  - "Lower-case each range and keep only the first weight seen for it, defaulting to one when no q parameter exists. Then walk the available types in order, take the weight of the most specific listed range or zero if none is listed, and replace the current best only when the weight is strictly higher and above zero."
followups:
  - "How would you extend the rules to media-range parameters such as charset or version that must match?"
  - "How would you cache negotiation results for a high-traffic endpoint?"
  - "What should the gateway respond with when nothing is acceptable, and why?"
  - "How would you handle Accept-Language, where ranges like en match en-GB?"
common_errors:
  - "Taking the highest q among all matching ranges, so a broad wildcard overrides a specific refusal."
  - "Using a string prefix check for type wildcards, so image/* matches imagery/raw."
  - "Returning the lower-cased type instead of the original spelling from the available list."
  - "Breaking ties by header order instead of the server's preference order."
  - "Treating q=0 as acceptable or forgetting the default weight of one."
