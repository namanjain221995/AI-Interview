version: 1
slug: negotiate_response_content_type
title: Negotiate a Response Content Type
difficulty: medium
competency_keys: [problem_solving, code_quality]
role_tags: [backend, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Negotiate a Response Content Type

  An API gateway can render each response in several formats. Clients say which formats they will take
  in an `Accept` header, and the gateway must pick one of the formats it can produce.

  The header is a comma-separated list of **media ranges**. Each range is `type/subtype`, `type/*` or
  `*/*`, optionally followed by parameters written as `;name=value`. The parameter `q` is the client's
  preference weight, a decimal between `0` and `1` (default `1` when absent). All other parameters are
  ignored. Spaces may appear around `,`, `;` and `=`, and empty entries between commas are ignored.

  You also get `available`: the concrete types the gateway can produce (`type/subtype`, no wildcards, no
  parameters). Decide the weight of each available type as follows:

  - The **most specific** range that matches it decides its weight: an exact `type/subtype` range beats
    `type/*`, which beats `*/*`. This holds even when a broader range has a higher `q`.
  - `type/*` matches only when the whole type is equal (`image/*` does not match `imagery/raw`).
  - Matching ignores case for types, subtypes and parameter names.
  - If the same range is listed more than once, its **first** listing counts.
  - A type that no range matches, or whose deciding range has `q=0`, is **not acceptable**.

  Return the acceptable available type with the **highest weight**, spelled exactly as in `available`.
  Break ties by the **earlier position in `available`**. Return `""` if no type is acceptable. An empty
  or blank header means the client accepts anything, so return `available[0]`.

  ### Example 1
  ```
  Input:  accept = "text/html;q=0.8, application/*;q=0.5, */*;q=0.1", available = ["application/json", "text/html", "image/png"]
  Output: "text/html"
  Explanation: application/json gets 0.5 (application/*), text/html gets 0.8, image/png gets 0.1 (*/*)
  ```

  ### Example 2
  ```
  Input:  accept = "application/*;q=0.9, application/json;q=0", available = ["application/json", "application/xml"]
  Output: "application/xml"
  Explanation: the exact range refuses application/json even though application/* would allow it
  ```

  ### Example 3
  ```
  Input:  accept = "image/*", available = ["text/html", "application/json"]
  Output: ""
  ```

  ### Constraints
  - `1 <= available.length <= 50`, types are distinct ignoring case
  - Types and subtypes use letters, digits and `+ - .`
  - `0 <= accept.length <= 2000`, and the header is well formed
  - `q` values are decimals in `[0, 1]` with at most three digits after the point
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: negotiate_content_type
  params:
    - {name: accept, type: string}
    - {name: available, type: "string[]"}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def negotiate_content_type(accept: str, available: list[str]) -> str:
        if not available:
            return ""
        if not accept.strip():
            return available[0]
        ranges: dict[str, float] = {}
        for entry in accept.split(","):
            parts = entry.split(";")
            media = parts[0].strip().lower()
            if not media:
                continue
            q = 1.0
            for param in parts[1:]:
                name, _, value = param.partition("=")
                if name.strip().lower() == "q":
                    q = float(value.strip())
            if media not in ranges:
                ranges[media] = q
        best, best_q = "", 0.0
        for candidate in available:
            lowered = candidate.lower()
            main_type = lowered.split("/", 1)[0]
            q = 0.0
            for key in (lowered, main_type + "/*", "*/*"):
                if key in ranges:
                    q = ranges[key]
                    break
            if q > best_q:
                best, best_q = candidate, q
        return best
  javascript: |
    function negotiateContentType(accept, available) {
      if (available.length === 0) return "";
      if (accept.trim() === "") return available[0];
      const ranges = new Map();
      for (const entry of accept.split(",")) {
        const parts = entry.split(";");
        const media = parts[0].trim().toLowerCase();
        if (media === "") continue;
        let q = 1;
        for (const param of parts.slice(1)) {
          const eq = param.indexOf("=");
          const name = (eq === -1 ? param : param.slice(0, eq)).trim().toLowerCase();
          if (name === "q") q = parseFloat(param.slice(eq + 1).trim());
        }
        if (!ranges.has(media)) ranges.set(media, q);
      }
      let best = "";
      let bestQ = 0;
      for (const candidate of available) {
        const lowered = candidate.toLowerCase();
        const mainType = lowered.split("/")[0];
        let q = 0;
        for (const key of [lowered, mainType + "/*", "*/*"]) {
          if (ranges.has(key)) {
            q = ranges.get(key);
            break;
          }
        }
        if (q > bestQ) {
          best = candidate;
          bestQ = q;
        }
      }
      return best;
    }
