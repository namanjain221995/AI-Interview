slug: decode_telemetry_prefix_code
title: "Decode Telemetry Prefix Code"
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, network, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Decode Telemetry Prefix Code

  Battery-powered field sensors save radio time by sending each reading as a compact bit string. Every
  reading type has a binary code word: `symbols[i]` is sent as the code word `codes[i]`. The code table is
  **prefix-free**: no code word is a prefix of another code word, so a receiver reading the bits left to
  right always knows when one code word ends.

  Write `decode_telemetry_bits(bits, symbols, codes)` that decodes `bits` from left to right and returns the
  concatenation of the decoded symbols in order.

  The transmission is **corrupt** if, while decoding, the bits read since the last complete code word can
  no longer become any code word, or if the bits end in the middle of a code word. For a corrupt
  transmission return the empty string `""`. Decoding an empty `bits` string also returns `""`.

  ### Example 1
  ```
  Input:  bits = "0101100111", symbols = ["T", "H", "P", "E"], codes = ["0", "10", "110", "111"]
  Output: "THPTE"
  Explanation: 0 -> T, 10 -> H, 110 -> P, 0 -> T, 111 -> E.
  ```

  ### Example 2
  ```
  Input:  bits = "01011", symbols = ["T", "H", "P", "E"], codes = ["0", "10", "110", "111"]
  Output: ""
  Explanation: after decoding T and H, the final bits 11 are only the start of a code word.
  ```

  ### Example 3
  ```
  Input:  bits = "0011", symbols = ["A", "B", "C"], codes = ["00", "01", "10"]
  Output: ""
  ```

  ### Constraints
  - `0 <= bits.length <= 10^5`, and `bits` contains only `'0'` and `'1'`
  - `1 <= symbols.length == codes.length <= 64`
  - `1 <= codes[i].length <= 16`; every code consists of `'0'` and `'1'`, codes are distinct and prefix-free
  - `1 <= symbols[i].length <= 5`; symbols consist of printable ASCII characters (they need not be distinct)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: decode_telemetry_bits
  params:
    - {name: bits, type: "string"}
    - {name: symbols, type: "string[]"}
    - {name: codes, type: "string[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def decode_telemetry_bits(bits: str, symbols: list[str], codes: list[str]) -> str:
        table = dict(zip(codes, symbols))
        prefixes = {code[:k] for code in codes for k in range(1, len(code))}
        out: list[str] = []
        buffer = ""
        for bit in bits:
            buffer += bit
            if buffer in table:
                out.append(table[buffer])
                buffer = ""
            elif buffer not in prefixes:
                return ""
        if buffer:
            return ""
        return "".join(out)
  javascript: |
    function decodeTelemetryBits(bits, symbols, codes) {
      const table = new Map();
      const prefixes = new Set();
      codes.forEach((code, i) => {
        table.set(code, symbols[i]);
        for (let k = 1; k < code.length; k++) prefixes.add(code.slice(0, k));
      });
      const out = [];
      let buffer = "";
      for (const bit of bits) {
        buffer += bit;
        if (table.has(buffer)) {
          out.push(table.get(buffer));
          buffer = "";
        } else if (!prefixes.has(buffer)) {
          return "";
        }
      }
      return buffer.length > 0 ? "" : out.join("");
    }
tests:
  - {id: t1, args: ["0101100111", ["T", "H", "P", "E"], ["0", "10", "110", "111"]], expected: "THPTE", description: "Example 1 - complete decode"}
  - {id: t2, args: ["01011", ["T", "H", "P", "E"], ["0", "10", "110", "111"]], expected: "", description: "Example 2 - truncated final code word"}
  - {id: t3, args: ["0011", ["A", "B", "C"], ["00", "01", "10"]], expected: "", description: "Example 3 - bit pattern that matches no code word"}
  - {id: t4, hidden: true, args: ["", ["A"], ["1"]], expected: "", description: "Empty bit string"}
  - {id: t5, hidden: true, args: ["111", ["A"], ["1"]], expected: "AAA", description: "Single one-bit code repeated"}
  - {id: t6, hidden: true, args: ["0110", ["OK", "ERR", "HB"], ["0", "11", "10"]], expected: "OKERROK", description: "Multi-character symbols are concatenated"}
  - {id: t7, hidden: true, args: ["1111000", ["x", "y"], ["000", "1111"]], expected: "yx", description: "Codes of very different lengths, table not sorted by length"}
  - {id: t8, hidden: true, args: ["1101001", ["a", "b"], ["10", "11"]], expected: "", description: "Unknown pattern in the middle even though later bits would decode"}
  - {id: t9, hidden: true, args: ["0000000000000000", ["Z", "Q"], ["0000000000000000", "1"]], expected: "Z", description: "Maximum code length 16"}
  - {id: t10, hidden: true, args: ["01001", ["A", "A", "B"], ["01", "00", "1"]], expected: "AAB", description: "Two code words map to the same symbol"}
  - {id: t11, hidden: true, args: ["", ["T", "H", "P", "W", "B", "L", "!"], ["00", "010", "011", "10", "110", "1110", "1111"]], expected: "HBBHPBWLBTBT!WPBHHLWB!BWWL!HHLH!BWLTL!TH!BTP!T!!PWBLWL!WWL!BWHPTTHWHPLW!L!PWB!WBPBBWBHPLT!PBLLHL!PBBBTLLHL!BPPTTW!LWTP!TWHTPW!W!TTBB!TWLBPBPBHTPTTTBBTHWPBPHLT!PPPH!WWW!BWL!BLBTB!BPWLLLHPWPBPBPT!WBPTWBBLHTLLPWPLPBLPLWTBTLTPPLWPBBPHPHP!P!BPP!WT!!TBLLHPBHL!PHPHLWLLTTBPPL!HW!!HTPLLHBWPH!TTBHP!!!BH!PP!!L", description: "Stress - 300 code words of a 7-symbol table"}
expected_concepts:
  - "prefix-free codes decode greedily left to right"
  - "binary trie or set of proper prefixes"
  - "detecting dead ends early and truncated input at the end"
  - "hash map from code word to symbol"
  - "O(n) decoding with bounded code length"
optimal_complexity: {time: "O(n + total code length)", space: "O(total code length)"}
rubric:
  excellent: "Explains why greedy matching is safe for a prefix-free code, decodes with a binary trie or a set of prefixes, rejects dead ends immediately and truncated tails at the end, and states linear time."
  good: "Decodes correctly by growing a buffer and looking it up in a map, catching corrupt input only via a maximum-length or end check, with clear code."
  weak: "Tries to decode by repeated string replacement, misses the truncated-tail case or returns a partial result for corrupt input."
  criteria:
    correctness: "All tests pass, including empty input, truncated tails and unknown patterns in the middle."
    efficiency: "Linear in the number of bits with a trie or bounded code length; table built once."
    code_quality: "Code table built once; decoding loop has a single place where a symbol is emitted."
    edge_cases: "Empty bits, single-code tables, long codes, multi-character symbols and corruption in the middle versus at the end."
    communication: "Explains the prefix-free property and why it makes the decoding unambiguous."
hints:
  - "Because no code word is a prefix of another, the first time the bits you have collected equal a code word, that must be the right symbol."
  - "Read one bit at a time into a buffer and check it against a lookup of code words; you also need a way to notice early that the buffer can no longer become any code word."
  - "Build a map from code word to symbol and a set of all proper prefixes of the code words (or a binary trie); append each bit to the buffer, emit and clear when the buffer is a code word, fail when it is neither a code word nor a known prefix, and also fail if anything is left in the buffer after the last bit."
followups:
  - "How would you build such a code table so that frequent readings get shorter code words?"
  - "How would you resynchronise after a corrupt section instead of discarding the whole message?"
  - "How would you decode a stream that arrives in chunks whose boundaries split code words?"
common_errors:
  - "Returning the symbols decoded so far when the bits end inside a code word."
  - "Never rejecting a buffer that grows beyond every code word, so the loop keeps reading junk."
  - "Using repeated string replacement, which can match code words across symbol boundaries."
  - "Assuming every symbol is a single character."
