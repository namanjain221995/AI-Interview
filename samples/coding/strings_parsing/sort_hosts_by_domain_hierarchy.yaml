version: 1
slug: sort_hosts_by_domain_hierarchy
title: "Sort Hosts by Domain Hierarchy"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [network, devops, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Sort Hosts by Domain Hierarchy

  An infrastructure inventory report lists hostnames grouped by domain, so that every host under
  `example.com` appears together, and within it every host under `eu.example.com` appears together, and so
  on. Plain alphabetical order does not do this, because hostnames are most specific on the **left**.

  Write a function that takes a list of `hosts` and returns them in **domain-hierarchy order**:

  1. Convert every hostname to **lowercase**.
  2. Remove duplicates (after lowercasing), keeping one copy of each.
  3. Split each hostname on `.` into labels and read the labels **right to left**, so
     `api.eu.example.com` becomes `com`, `example`, `eu`, `api`.
  4. Order two hostnames by comparing these reversed label lists label by label. Two labels are compared as
     plain strings by character code (so `"10" < "9"` and `"a-b" < "ab"`). The first differing label
     decides. If one list runs out first (it is a prefix of the other), the shorter list comes first, so
     `example.com` comes before `api.example.com`.

  Return the sorted, lowercase, de-duplicated hostnames. An empty input gives an empty list.

  ### Example 1
  ```
  Input:  hosts = ["api.eu.example.com", "Example.com", "db.example.org", "cdn.example.com", "api.example.com", "EXAMPLE.COM"]
  Output: ["example.com", "api.example.com", "cdn.example.com", "api.eu.example.com", "db.example.org"]
  Explanation: Reversed labels: com.example, com.example.api, com.example.cdn, com.example.eu.api, org.example.db.
  ```

  ### Example 2
  ```
  Input:  hosts = ["web.shop.net", "shop.io", "mail.shop.net", "shop.net"]
  Output: ["shop.io", "shop.net", "mail.shop.net", "web.shop.net"]
  ```

  ### Constraints
  - `0 <= hosts.length <= 10^4`
  - `1 <= hosts[i].length <= 253`
  - Hostnames contain only ASCII letters, digits, `-` and `.`
  - No hostname starts or ends with `.` or contains two consecutive dots, so every label is non-empty
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_hosts_by_domain_hierarchy
  params:
    - {name: hosts, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def sort_hosts_by_domain_hierarchy(hosts: list[str]) -> list[str]:
        unique = {host.lower() for host in hosts}
        # Python compares lists element by element, and a shorter prefix list sorts first.
        return sorted(unique, key=lambda host: host.split(".")[::-1])
  javascript: |
    function sortHostsByDomainHierarchy(hosts) {
      const unique = [...new Set(hosts.map((h) => h.toLowerCase()))];
      const keyed = unique.map((host) => ({ host, labels: host.split(".").reverse() }));
      const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
      keyed.sort((x, y) => {
        const n = Math.min(x.labels.length, y.labels.length);
        for (let i = 0; i < n; i++) {
          const c = cmp(x.labels[i], y.labels[i]);
          if (c !== 0) return c;
        }
        return x.labels.length - y.labels.length;
      });
      return keyed.map((k) => k.host);
    }
tests:
  - {id: t1, args: [["api.eu.example.com", "Example.com", "db.example.org", "cdn.example.com", "api.example.com", "EXAMPLE.COM"]], expected: ["example.com", "api.example.com", "cdn.example.com", "api.eu.example.com", "db.example.org"], description: "Example 1 - case-insensitive duplicates and a parent domain before its children"}
  - {id: t2, args: [["web.shop.net", "shop.io", "mail.shop.net", "shop.net"]], expected: ["shop.io", "shop.net", "mail.shop.net", "web.shop.net"], description: "Example 2 - top-level label decides first"}
  - {id: t3, hidden: true, args: [[]], expected: [], description: "Empty inventory"}
  - {id: t4, hidden: true, args: [["LOCALHOST"]], expected: ["localhost"], description: "Single single-label host is lowercased"}
  - {id: t5, hidden: true, args: [["api.example.com", "example-x.com", "example.com", "x.example-x.com"]], expected: ["example.com", "api.example.com", "example-x.com", "x.example-x.com"], description: "Joined-string trap: '-' sorts before '.', but label comparison puts all of example before example-x"}
  - {id: t6, hidden: true, args: [["ns10.dns.net", "ns9.dns.net", "ns2.dns.net", "10.dns.net", "9.dns.net"]], expected: ["10.dns.net", "9.dns.net", "ns10.dns.net", "ns2.dns.net", "ns9.dns.net"], description: "Numeric-looking labels compare as strings, not numbers"}
  - {id: t7, hidden: true, args: [["a.b.c", "b.c", "c", "z.c", "a.c", "A.B.C", "C"]], expected: ["c", "a.c", "b.c", "a.b.c", "z.c"], description: "Deep prefix chain with duplicates in different case"}
  - {id: t8, hidden: true, args: [["db1.prod.corp", "db1.prod.corp", "DB1.Prod.Corp", "db1.dev.corp"]], expected: ["db1.dev.corp", "db1.prod.corp"], description: "Many duplicates collapse to one entry each"}
  - {id: t9, hidden: true, args: [["mx.a-b.org", "mx.ab.org", "mx.a.org", "a.org"]], expected: ["a.org", "mx.a.org", "mx.a-b.org", "mx.ab.org"], description: "Hyphenated label versus prefix label at the same level"}
