expected_concepts:
  - "string normalisation (lowercasing) before de-duplication"
  - "set-based de-duplication"
  - "custom sort key: reversed list of labels"
  - "lexicographic comparison of sequences with prefix-first ordering"
  - "why joining the reversed labels into one string gives the wrong order"
optimal_complexity: {time: "O(n log n * L)", space: "O(n * L)"}
rubric:
  excellent: "Normalises then de-duplicates, sorts with a reversed-label-list key (or an explicit comparator that handles the prefix case), explains why a joined string key breaks on '-' versus '.', and states O(n log n) comparisons each costing up to the hostname length."
  good: "Correct sort with a list key or comparator; needs a nudge on de-duplication after lowercasing or on the prefix rule."
  weak: "Sorts by the plain or reversed hostname string, de-duplicates before lowercasing, or compares numeric labels numerically."
  criteria:
    correctness: "All tests pass, including prefix chains, hyphenated labels and case-insensitive duplicates."
    efficiency: "One sort with a precomputed key; no quadratic de-duplication."
    code_quality: "Key extraction kept in one small, named step; comparator (if any) is symmetric and returns zero for equal keys."
    edge_cases: "Empty list, single-label hosts, duplicates differing only in case, labels that are numbers."
    communication: "Explains the comparison rule with a concrete counterexample before coding."
hints:
  - "Start by deciding what a hostname should be compared by; the rightmost label is the most important one."
  - "Lowercase first so duplicates can be removed with a set, then sort using the list of labels in reverse order as the key rather than the hostname string."
  - "Build each key by splitting the lowercase hostname on dots and reversing the pieces. Compare two keys label by label, returning at the first difference, and when one key runs out first the shorter one sorts earlier. Avoid gluing the reversed labels back into a single string, because a hyphen sorts before a dot and breaks the grouping."
followups:
  - "How would you print the result as an indented tree of domains?"
  - "How would you treat internationalised domain names written in punycode?"
  - "If the inventory had millions of hosts, how would you group them without a full sort?"
  - "How would you make the ordering ignore a trailing dot such as example.com. in fully qualified names?"
common_errors:
  - "Joining the reversed labels with dots and sorting by that string, which puts example-x.com inside the example.com group."
  - "Removing duplicates before lowercasing, leaving Example.com and example.com both in the output."
  - "Returning the original casing instead of the lowercase form."
  - "Writing a comparator that never returns zero or mishandles the case where one label list is a prefix of the other."
