expected_concepts:
  - stack of open tag names
  - tokenising tags and extracting the name
  - case-insensitive comparison
  - distinguishing mismatches from tags left open at the end
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Scans tag by tag, extracts and lower-cases the name, pushes opening tags, skips self-closing ones, compares closing tags with the stack top and returns the position immediately, then returns the length or -1 at the end; explains why a stack captures nesting and tests the self-closing and attribute cases.
  good: Correct stack solution needing one fix after tests, for example self-closing detection or case-insensitive names.
  weak: Only counts opening and closing tags, compares names by prefix, or treats any slash in a tag as self-closing.
  criteria:
    correctness: All tests pass, including crossed tags, unclosed tags, case differences and self-closing tags.
    efficiency: Single linear scan; each tag is pushed and popped at most once.
    code_quality: Name extraction is a small helper and the three tag kinds are clearly separated.
    edge_cases: Empty input, text only, closing tag first, attributes with slashes, deep nesting.
    communication: Explains the difference between the mismatch result and the unclosed result before coding.
hints:
  - Proper nesting means the most recently opened tag that is still open must be the next one closed; which data structure gives you the most recent item first?
  - Walk through the template from one less-than sign to the next greater-than sign, classify each tag as opening, closing or self-closing, and extract its name up to the first space, slash or greater-than sign in lower case.
  - Push the name of every opening tag that does not end with a slash, ignore self-closing tags, and for a closing tag return its start index if the stack is empty or its top differs from the closing name, otherwise pop. After the scan, return the length of the template if the stack still holds names, or minus one if it is empty.
followups:
  - How would you report every error instead of just the first, with a sensible recovery strategy?
  - How would you treat void elements such as br and img that are written without the closing slash?
  - How would you handle comments or quoted attribute values that contain greater-than signs?
  - How would you suggest an automatic fix for an unclosed tag?
common_errors:
  - Comparing names case-sensitively, so DIV and div do not match.
  - Treating a slash inside an attribute value as a self-closing marker.
  - Counting tags per name instead of using a stack, which accepts crossed tags.
  - Returning the index of the unmatched opening tag instead of the closing tag, or forgetting the end-of-input check.
