title: First Markup Nesting Error
difficulty: medium
competency_keys: [data_structures, debugging]
role_tags: [frontend, qa, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## First Markup Nesting Error

  An email-template linter checks that the tags in a template are properly nested before the template is
  sent to a rendering service. Given the template text `doc`, find the first nesting problem.

  Tags look like this:

  - **opening tag** `<name ...>`, for example `<td>` or `<a href="https://example.com">`;
  - **closing tag** `</name>`;
  - **self-closing tag** `<name .../>`, a tag whose text ends with `/>`, for example `<br/>` or
    `<img src="logo.png" />`. It never needs a closing tag.

  The tag name starts right after `<` (or after `</` for a closing tag) and ends at the first space, `/`
  or `>`. Names compare **case-insensitively**, so `<DIV>` is closed by `</div>`. Attributes and the text
  between tags are ignored. A `<` appears only at the start of a tag and a `>` only at the end of a tag.

  Scan the tags from left to right and return:

  - the index of the `<` of the **first closing tag** whose name does not match the innermost currently
    open tag, or that appears when no tag is open;
  - otherwise `doc.length` if some tags are still open at the end;
  - otherwise `-1`, meaning the template is well nested.

  ### Example 1
  ```
  Input:  doc = "<p>Hello <b>team</b></p>"
  Output: -1
  ```

  ### Example 2
  ```
  Input:  doc = "<div><span>x</div></span>"
  Output: 12
  Explanation: At index 12 the closing div arrives while span is the innermost open tag.
  ```

  ### Example 3
  ```
  Input:  doc = "<table><tr><td>1</td></tr>"
  Output: 26
  Explanation: The table tag is never closed, so the answer is the length of doc.
  ```

  ### Constraints
  - `0 <= doc.length <= 10^4`
  - Every tag is well formed and its name is non-empty and made of letters and digits.
  - Attribute values contain neither `<` nor `>`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_markup_error
  params:
    - {name: doc, type: string}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def first_markup_error(doc: str) -> int:
        def tag_name(text: str) -> str:
            end = 0
            while end < len(text) and text[end] not in " />":
                end += 1
            return text[:end].lower()

        open_tags: list[str] = []
        start = doc.find("<")
        while start != -1:
            end = doc.index(">", start)
            body = doc[start + 1:end]
            if body.startswith("/"):
                if not open_tags or open_tags[-1] != tag_name(body[1:]):
                    return start
                open_tags.pop()
            elif not body.endswith("/"):
                open_tags.append(tag_name(body))
            start = doc.find("<", end)
        return len(doc) if open_tags else -1
  javascript: |
    function firstMarkupError(doc) {
      const tagName = (text) => {
        let end = 0;
        while (end < text.length && !" />".includes(text[end])) end++;
        return text.slice(0, end).toLowerCase();
      };
      const openTags = [];
      let start = doc.indexOf("<");
      while (start !== -1) {
        const end = doc.indexOf(">", start);
        const body = doc.slice(start + 1, end);
        if (body.startsWith("/")) {
          if (openTags.length === 0 || openTags[openTags.length - 1] !== tagName(body.slice(1))) return start;
          openTags.pop();
        } else if (!body.endsWith("/")) {
          openTags.push(tagName(body));
        }
        start = doc.indexOf("<", end);
      }
      return openTags.length > 0 ? doc.length : -1;
    }
