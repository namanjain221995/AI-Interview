expected_concepts:
  - "hash maps recording the mapping in both directions"
  - "one-to-one (bijective) constraint versus a plain function"
  - "early exit on the first conflict"
  - "length check before the scan"
optimal_complexity: {time: "O(n)", space: "O(k) where k is the number of distinct characters"}
rubric:
  excellent: "Checks lengths first, keeps a forward and a backward map (or an equivalent first-occurrence encoding), exits on the first conflict and explains why both directions are needed with a counterexample."
  good: "Correct two-map solution that needs a prompt to add the backward check or the length check."
  weak: "Only checks the forward mapping, compares character counts or sets only, or uses quadratic searches over earlier positions without discussing it."
  criteria:
    correctness: "All tests pass, including many-to-one collisions, swaps and different lengths."
    efficiency: "Linear time with constant-time map operations; extra space bounded by the alphabet."
    code_quality: "Clear names for the two directions and an early return on conflict."
    edge_cases: "Empty labels, different lengths, identical labels, case differences and a conflict at the last position."
    communication: "Explains the difference between a consistent function and a one-to-one mapping."
hints:
  - "Walk both labels position by position and write down which target character each source character turned into."
  - "Remembering only source to target is not enough: two different source characters could both turn into the same target character, which the recoding forbids."
  - "Check the lengths first, then keep two maps, one from source to target and one from target to source; at every position, if either map already holds a different partner for the current character, return false, otherwise record the pair, and return true after the loop."
followups:
  - "How would you return the mapping itself, or the first position where it breaks?"
  - "Given many label pairs from the same script, how would you check that they all use one shared mapping?"
  - "Can you solve it by comparing first-occurrence index patterns instead of maps, and what does that cost?"
common_errors:
  - "Checking only the forward direction, which accepts abc to aaa."
  - "Comparing sorted character counts, which ignores positions."
  - "Forgetting the length check and reading past the end of the shorter label."
  - "Lower-casing the labels although characters are case-sensitive."
