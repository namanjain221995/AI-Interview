slug: consistent_warehouse_recode
title: "Consistent Warehouse Recode"
difficulty: easy
competency_keys: [data_structures, problem_solving]
role_tags: [data, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Consistent Warehouse Recode

  A warehouse migrated its bin labels to a new scheme by running a recoding script that substitutes
  characters one for one. During the data audit you find pairs of old and new labels and need to tell
  whether each pair could have been produced by such a script.

  A recoding is **consistent** if there is a mapping of characters such that:

  - every character of `source` is replaced by exactly one character, and the same source character is
    always replaced by the same target character;
  - no two **different** source characters are replaced by the same target character;
  - a character may map to itself, and characters such as `-` are recoded like any other character.

  Write `is_consistent_recode(source, target)` that returns `true` if a consistent recoding turns
  `source` into `target` position by position, and `false` otherwise. Labels of different lengths can
  never match, and two empty labels match. Characters are case-sensitive (`a` and `A` are different).

  ### Example 1
  ```
  Input:  source = "A1-B1", target = "Q7-R7"
  Output: true
  Explanation: A->Q, 1->7, - -> -, B->R; every character always maps the same way
  ```

  ### Example 2
  ```
  Input:  source = "AB-12", target = "XX-34"
  Output: false
  Explanation: A and B would both have to become X
  ```

  ### Example 3
  ```
  Input:  source = "AAB", target = "XYZ"
  Output: false
  Explanation: the first A becomes X but the second A would have to become Y
  ```

  ### Constraints
  - `0 <= source.length, target.length <= 5 * 10^4`
  - Both labels consist of printable ASCII characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_consistent_recode
  params:
    - {name: source, type: "string"}
    - {name: target, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_consistent_recode(source: str, target: str) -> bool:
        if len(source) != len(target):
            return False
        forward: dict[str, str] = {}
        backward: dict[str, str] = {}
        for s, t in zip(source, target):
            if forward.setdefault(s, t) != t:
                return False  # s was already mapped to a different character
            if backward.setdefault(t, s) != s:
                return False  # t is already the image of a different character
        return True
  javascript: |
    function isConsistentRecode(source, target) {
      if (source.length !== target.length) return false;
      const forward = new Map();
      const backward = new Map();
      for (let i = 0; i < source.length; i++) {
        const s = source[i];
        const t = target[i];
        if (forward.has(s) && forward.get(s) !== t) return false;
        if (backward.has(t) && backward.get(t) !== s) return false;
        forward.set(s, t);
        backward.set(t, s);
      }
      return true;
    }
