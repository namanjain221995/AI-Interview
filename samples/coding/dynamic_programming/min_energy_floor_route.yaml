slug: min_energy_floor_route
title: Minimum Energy Floor Route
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, mobile, frontend]
time_limit_minutes: 15
prompt_markdown: |
  ## Minimum Energy Floor Route

  A cleaning robot crosses an office floor laid out as a grid. Entering cell `(r, c)` costs `cost[r][c]`
  units of battery energy (carpet costs more than tile, ramps more than flat floor). The robot starts in
  the top-left cell and must finish in the bottom-right cell, and on every move it goes exactly one cell
  **right** or one cell **down**.

  Return the **minimum total energy** of a route, counting the cost of **both** the start cell and the
  destination cell.

  ### Example 1
  ```
  Input:  cost = [[2, 7, 1], [3, 1, 6], [8, 2, 4]]
  Output: 12
  Explanation: Down, right, down, right visits 2 + 3 + 1 + 2 + 4.
  ```

  ### Example 2
  ```
  Input:  cost = [[5, 0, 9, 1]]
  Output: 15
  Explanation: A single row leaves only one route.
  ```

  ### Example 3
  ```
  Input:  cost = [[1, 2, 3], [4, 5, 6]]
  Output: 12
  ```

  ### Constraints
  - `1 <= cost.length, cost[0].length <= 200`
  - Every row has the same length.
  - `0 <= cost[r][c] <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_energy_route
  params:
    - {name: cost, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_energy_route(cost: list[list[int]]) -> int:
        cols = len(cost[0])
        best = [0] * cols
        for r, row in enumerate(cost):
            for c in range(cols):
                if r == 0 and c == 0:
                    best[c] = row[c]
                elif r == 0:
                    best[c] = best[c - 1] + row[c]
                elif c == 0:
                    best[c] = best[c] + row[c]
                else:
                    best[c] = min(best[c], best[c - 1]) + row[c]
        return best[cols - 1]
  javascript: |
    function minEnergyRoute(cost) {
      const cols = cost[0].length;
      const best = new Array(cols).fill(0);
      for (let r = 0; r < cost.length; r++) {
        const row = cost[r];
        for (let c = 0; c < cols; c++) {
          if (r === 0 && c === 0) best[c] = row[c];
          else if (r === 0) best[c] = best[c - 1] + row[c];
          else if (c === 0) best[c] = best[c] + row[c];
          else best[c] = Math.min(best[c], best[c - 1]) + row[c];
        }
      }
      return best[cols - 1];
    }
