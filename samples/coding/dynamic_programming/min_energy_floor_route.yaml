expected_concepts:
  - "best cost into a cell = its cost + min(best from above, best from the left)"
  - "first row and first column have a single predecessor"
  - "rolling one-row table"
  - "why greedy next-step choice fails"
optimal_complexity: {time: "O(rows * cols)", space: "O(cols)"}
rubric:
  excellent: "Derives the min-of-two-neighbours recurrence, handles the first row and column cleanly, counts both endpoints, reduces memory to one row and explains O(rows * cols) time with a counterexample for greedy."
  good: "Correct 2D table (or in-place update) with the right complexity; may need a prompt on edge rows or columns."
  weak: "Greedy step-by-step choice, exhaustive route search, or omitting the start or destination cost."
  criteria:
    correctness: "All tests pass, including single row, single column and 1 x 1 grids."
    efficiency: "Each cell processed once."
    code_quality: "Boundary cases expressed without duplicated loops; input not mutated unless the candidate says so."
    edge_cases: "1 x 1 grid, single row or column, zero costs, ties."
    communication: "Explains the recurrence and why a locally cheap step can be globally wrong."
hints:
  - "The robot can only enter a cell from the cell above or the cell to the left. What does that tell you about the cheapest way to reach any cell?"
  - "The cheapest energy to reach a cell equals its own cost plus the smaller of the cheapest energies to reach the cell above and the cell to the left; cells in the first row or column have only one of those neighbours."
  - "Keep one row of best totals. Process the grid row by row and left to right: the start cell keeps its own cost, cells in the first row add their cost to the left neighbour, cells in the first column add their cost to the value above, and every other cell adds its cost to the smaller of those two values. Return the last entry after the final row."
followups:
  - "How would you also return the route itself?"
  - "If the robot could move in all four directions, why would this approach no longer work and what would you use?"
  - "Can you solve it without any extra memory, and what is the trade-off?"
common_errors:
  - "Choosing the cheaper neighbour greedily at each step."
  - "Forgetting to include the start cell or the destination cell."
  - "Treating out-of-range neighbours as zero so the first row or column takes impossible shortcuts."
  - "Mixing up rows and columns on rectangular grids."
