time_limit_minutes: 30
prompt_markdown: |
  ## Three Ad Slot Windows

  A publisher forecasts `values[i]`, the number of ad impressions expected in hour `i` of a campaign
  period. A client buys **three sponsorship windows**, each covering exactly `k` consecutive hours.
  The windows may touch but must not overlap. The publisher wants to place them so the total forecast
  impressions across the three windows is as large as possible.

  Return the **start indices** of the three windows in increasing order. If several placements reach
  the same maximum total, return the **lexicographically smallest** list of start indices (compare
  the first index, then the second, then the third).

  ### Example 1
  ```
  Input:  values = [4, 1, 3, 3, 0, 5, 2, 2, 6, 1], k = 2
  Output: [2, 5, 7]
  Explanation: The windows starting at 2, 5 and 7 cover 3 + 3, 5 + 2 and 2 + 6, a total of 21.
  ```

  ### Example 2
  ```
  Input:  values = [1, 1, 1, 1, 1, 1], k = 1
  Output: [0, 1, 2]
  Explanation: Every placement totals 3, so the smallest start indices win.
  ```

  ### Example 3
  ```
  Input:  values = [3, 3, 1, 3, 3, 1, 3, 3, 1, 3, 3], k = 2
  Output: [0, 3, 6]
  Explanation: Windows at 0, 3, 6 and 9 each total 6. Any three of them give 18, and [0, 3, 6]
  is the smallest such list.
  ```

  ### Constraints
  - `1 <= k`
  - `3 * k <= values.length <= 2 * 10^4`
  - `0 <= values[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_three_slot_windows
  params:
    - {name: values, type: "int[]"}
    - {name: k, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def best_three_slot_windows(values: list[int], k: int) -> list[int]:
        n = len(values)
        count = n - k + 1
        window = [0] * count
        total = sum(values[:k])
        window[0] = total
        for i in range(1, count):
            total += values[i + k - 1] - values[i - 1]
            window[i] = total
        left = [0] * count
        best = 0
        for i in range(count):
            if window[i] > window[best]:
                best = i
            left[i] = best
        right = [0] * count
        best = count - 1
        for i in range(count - 1, -1, -1):
            if window[i] >= window[best]:
                best = i
            right[i] = best
        answer: list[int] = []
        best_sum = -1
        for mid in range(k, count - k):
            a, c = left[mid - k], right[mid + k]
            current = window[a] + window[mid] + window[c]
            if current > best_sum:
                best_sum = current
                answer = [a, mid, c]
        return answer
  javascript: |
    function bestThreeSlotWindows(values, k) {
      const n = values.length;
      const count = n - k + 1;
      const window = new Array(count).fill(0);
      let total = 0;
      for (let i = 0; i < k; i++) total += values[i];
      window[0] = total;
      for (let i = 1; i < count; i++) {
        total += values[i + k - 1] - values[i - 1];
        window[i] = total;
      }
      const left = new Array(count).fill(0);
      let best = 0;
      for (let i = 0; i < count; i++) {
        if (window[i] > window[best]) best = i;
        left[i] = best;
      }
      const right = new Array(count).fill(0);
      best = count - 1;
      for (let i = count - 1; i >= 0; i--) {
        if (window[i] >= window[best]) best = i;
        right[i] = best;
      }
      let answer = [];
      let bestSum = -1;
      for (let mid = k; mid < count - k; mid++) {
        const a = left[mid - k];
        const c = right[mid + k];
        const current = window[a] + window[mid] + window[c];
        if (current > bestSum) {
          bestSum = current;
          answer = [a, mid, c];
        }
      }
      return answer;
    }
