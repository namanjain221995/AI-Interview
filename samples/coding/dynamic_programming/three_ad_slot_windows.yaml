expected_concepts:
  - "sliding-window sums for every possible start"
  - "fixing the middle window and choosing the best left and right windows independently"
  - "prefix best-index array from the left and suffix best-index array from the right"
  - "tie-breaking: strict comparison from the left, non-strict from the right"
  - "linear time instead of O(n^3) enumeration"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Computes all window sums, builds best-left and best-right index arrays with tie-breaking chosen deliberately to give the lexicographically smallest answer, scans middle positions in O(n) and justifies why the three choices can be made independently once the middle is fixed."
  good: "Correct O(n) or O(n * k) solution with the right tie-breaking, possibly via a general DP over (windows used, position)."
  weak: "Enumerates all triples, ignores the tie-breaking rule, or allows overlapping windows."
  criteria:
    correctness: "All tests pass, including heavy ties and the case values.length = 3 * k."
    efficiency: "Linear time after the window sums; no triple loops."
    code_quality: "Clearly named window, left-best and right-best arrays; window bounds without off-by-one errors."
    edge_cases: "All zeros, all equal values, exactly three windows fitting and the best windows touching."
    communication: "Explains why strict versus non-strict comparisons produce the smallest indices."
hints:
  - "First, how can you get the total of every window of k hours quickly? Then think about what happens if you decide where the middle window goes."
  - "Once the middle window starts at index m, the left window must start at or before m minus k and the right window at or after m plus k, and the two choices are independent. Precompute, for every position, the best window start to its left and the best window start to its right."
  - "Build the array of window sums with a sliding total. Sweep left to right keeping the index of the largest sum so far, replacing it only on a strictly larger value; sweep right to left keeping the best index, replacing it on a larger or equal value so earlier starts win ties. Then try every middle start, combine the best left start before it and the best right start after it, and keep the first combination with a strictly larger total."
followups:
  - "How would you generalise to any number of windows?"
  - "How would the solution change if the windows had different lengths?"
  - "Why does the right-to-left sweep need a non-strict comparison for the lexicographic rule?"
  - "What if impressions could be negative and the client could choose fewer than three windows?"
common_errors:
  - "Using a strict comparison in the right-to-left sweep, which picks a later start on ties."
  - "Letting the windows overlap by using m minus k plus one or m plus k minus one as the bounds."
  - "Recomputing every window sum from scratch, giving O(n * k)."
  - "Returning the maximum total instead of the start indices."
