expected_concepts:
  - "sorting so a set becomes a chain where each value divides the next"
  - "transitivity of divisibility"
  - "longest-chain DP ending at each element"
  - "O(n^2) pairwise transitions"
  - "reconstructing the set with predecessor links"
optimal_complexity: {time: "O(n^2)", space: "O(n)"}
rubric:
  excellent: "Sorts the values, explains that in a sorted valid set each member divides the next so only adjacent checks matter (transitivity), writes the longest-chain DP in O(n^2) time and O(n) memory and mentions how to recover the set."
  good: "Correct sorted O(n^2) DP with a brief justification; may need a nudge on why checking only the previous chain member is enough."
  weak: "Enumerates subsets, uses a greedy chain from the smallest value, forgets to sort, or checks only consecutive values in the input order."
  criteria:
    correctness: "All tests pass, including unsorted input, a single value and competing chains."
    efficiency: "O(n^2) after sorting; no subset enumeration."
    code_quality: "Clear naming for the per-element best length; the sort is not mutating the caller's array unexpectedly."
    edge_cases: "Single value, no compatible pairs, values near 2 * 10^9 and input in descending order."
    communication: "States the transitivity argument that reduces pairwise checks to a chain."
hints:
  - "If a divides b and b divides c, then a divides c. How could that let you avoid checking every pair in a candidate set?"
  - "Sort the values. In a valid set listed in increasing order, each member divides the next one, so the set is a chain; ask how long a chain can be if it ends at a particular value."
  - "After sorting, store for each value the length of the longest chain ending at it. For each value, look at every smaller value that divides it and extend that value's best length by one, keeping the maximum; the answer is the largest stored length overall."
followups:
  - "How would you return the actual set of sizes, and which one if there are ties?"
  - "Why does sorting make it sufficient to check divisibility against only one earlier element?"
  - "If values were small (say up to 10^6) but very numerous, could you iterate over multiples instead of pairs?"
  - "How does this relate to the longest increasing subsequence problem?"
common_errors:
  - "Forgetting to sort, so a chain that appears in a different order in the input is missed."
  - "Greedily extending from the smallest value instead of trying every predecessor."
  - "Checking divisibility only between neighbours in the original array."
  - "Enumerating all subsets, which is exponential."
  - "Returning 0 for inputs with no compatible pair instead of 1."
