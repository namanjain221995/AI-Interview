title: Divisible Batch Chain
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Divisible Batch Chain

  A data pipeline re-batches records between stages. Each supported batch size is listed in `values`
  (distinct positive integers, in no particular order). Two batch sizes are **compatible** when the larger
  one is an exact multiple of the smaller one, so batches can be split or combined without leftovers.

  The team wants to keep the largest possible set of batch sizes in which **every pair** of sizes is
  compatible. Return the **number of sizes** in the largest such set. A single size on its own always
  forms a valid set, so the answer is at least `1`.

  ### Example 1
  ```
  Input:  values = [12, 5, 3, 24, 9, 6]
  Output: 4
  Explanation: {3, 6, 12, 24}: every pair divides. Adding 9 breaks 9 and 6; 5 divides nothing else.
  ```

  ### Example 2
  ```
  Input:  values = [7, 11, 13]
  Output: 1
  Explanation: No size divides another, so the best set has one size.
  ```

  ### Example 3
  ```
  Input:  values = [4, 2, 1]
  Output: 3
  ```

  ### Constraints
  - `1 <= values.length <= 1000`
  - `1 <= values[i] <= 2 * 10^9`
  - All values are distinct.

  **Follow-up:** How would you also return the sizes in the chosen set?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_divisible_chain_size
  params:
    - {name: values, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def largest_divisible_chain_size(values: list[int]) -> int:
        nums = sorted(values)
        # best[i]: size of the largest compatible set whose largest member is nums[i].
        best = [1] * len(nums)
        for i in range(len(nums)):
            for j in range(i):
                if nums[i] % nums[j] == 0 and best[j] + 1 > best[i]:
                    best[i] = best[j] + 1
        return max(best)
  javascript: |
    function largestDivisibleChainSize(values) {
      const nums = [...values].sort((x, y) => x - y);
      const best = new Array(nums.length).fill(1);
      let answer = 0;
      for (let i = 0; i < nums.length; i++) {
        for (let j = 0; j < i; j++) {
          if (nums[i] % nums[j] === 0 && best[j] + 1 > best[i]) best[i] = best[j] + 1;
        }
        if (best[i] > answer) answer = best[i];
      }
      return answer;
    }
