  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def min_batching_cost(sizes: list[int], max_batch: int, setup_cost: int) -> int:
        n = len(sizes)
        # best[i] = minimum cost to process the first i jobs
        best = [0] + [float("inf")] * n
        for end in range(1, n + 1):
            largest = 0
            # the last batch is sizes[start:end]; grow it backwards one job at a time
            for start in range(end - 1, max(0, end - max_batch) - 1, -1):
                largest = max(largest, sizes[start])
                cost = best[start] + setup_cost + largest * (end - start)
                if cost < best[end]:
                    best[end] = cost
        return int(best[n])
  javascript: |
    function minBatchingCost(sizes, maxBatch, setupCost) {
      const n = sizes.length;
      const best = new Array(n + 1).fill(Infinity);
      best[0] = 0;
      for (let end = 1; end <= n; end++) {
        let largest = 0;
        const lowest = Math.max(0, end - maxBatch);
        for (let start = end - 1; start >= lowest; start--) {
          if (sizes[start] > largest) largest = sizes[start];
          const cost = best[start] + setupCost + largest * (end - start);
          if (cost < best[end]) best[end] = cost;
        }
      }
      return best[n];
    }
