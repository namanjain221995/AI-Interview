time_limit_minutes: 25
prompt_markdown: |
  ## Job Batching Cost

  An inference service drains a queue of jobs **in arrival order**; job `i` has `sizes[i]` tokens. The
  scheduler splits the queue into **batches of consecutive jobs** (the order never changes) and each batch
  may hold **at most `max_batch` jobs**. Inside a batch every job is padded to the size of the largest job
  in that batch, so a batch of `m` jobs whose largest job has `L` tokens costs:

  ```
  setup_cost + L * m
  ```

  Every job belongs to exactly one batch. Return the **minimum total cost** of processing the whole queue
  (an empty queue costs `0`).

  ### Example 1
  ```
  Input:  sizes = [2, 8, 3, 3, 9], max_batch = 3, setup_cost = 4
  Output: 41
  Explanation: Batches [2], [8], [3, 3], [9] cost (4 + 2) + (4 + 8) + (4 + 3 * 2) + (4 + 9) = 6 + 12 + 10 + 13 = 41. Grouping [8, 3, 3] would pad the 3s up to 8 and cost 28 for that batch alone.
  ```

  ### Example 2
  ```
  Input:  sizes = [5, 5, 5, 5], max_batch = 2, setup_cost = 10
  Output: 40
  Explanation: Two batches of two cost 2 * (10 + 5 * 2) = 40; four single-job batches would cost 60.
  ```

  ### Example 3
  ```
  Input:  sizes = [1, 10, 1], max_batch = 3, setup_cost = 0
  Output: 12
  Explanation: Each job alone costs 1 + 10 + 1 = 12, while one batch would pad everything to 10 and cost 30.
  ```

  ### Constraints
  - `0 <= sizes.length <= 2000`
  - `1 <= sizes[i] <= 10^6`
  - `1 <= max_batch <= 2000`
  - `0 <= setup_cost <= 10^9`

  **Follow-up:** the total can exceed the 32-bit range; use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
