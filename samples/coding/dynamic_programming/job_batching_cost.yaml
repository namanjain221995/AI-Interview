expected_concepts:
  - "dynamic programming over prefixes: best cost for the first i jobs"
  - "the last batch ends at i and starts at most max_batch jobs earlier"
  - "running maximum while extending the last batch backwards"
  - "greedy batch filling is not optimal"
  - "O(n * max_batch) time and O(n) space with 64-bit totals"
optimal_complexity: {time: "O(n * max_batch)", space: "O(n)"}
rubric:
  excellent: "Defines best cost for each prefix, tries every length for the last batch up to max_batch while maintaining the running maximum in O(1), shows why greedy fails, uses 64-bit totals and states O(n * max_batch) time."
  good: "Correct prefix dynamic programming, possibly recomputing the batch maximum with an extra inner loop or needing a nudge on overflow."
  weak: "Greedily fills batches to max_batch, splits wherever the size jumps, or enumerates every partition exponentially."
  criteria:
    correctness: "All tests pass, including the empty queue, max_batch of 1 and the greedy counterexample."
    efficiency: "Each job end tries at most max_batch starts with constant work per step."
    code_quality: "Clear names for the prefix cost array, the running maximum and the batch bounds."
    edge_cases: "Empty queue, single job, max_batch larger than the queue, zero setup cost and totals beyond 32 bits."
    communication: "Explains why the last batch of an optimal plan leaves an optimal plan for the jobs before it."
hints:
  - "Think about the last batch of an optimal plan. Whatever comes before it must also be planned optimally."
  - "Let the best cost for the first i jobs be the quantity you compute. The last batch ends with job i and starts somewhere between i - max_batch + 1 and i; each choice adds one batch cost to a smaller prefix."
  - "Fill an array of prefix costs from left to right, starting with zero for the empty prefix. For each end position, walk the start of the last batch backwards up to max_batch jobs, keeping the largest size seen so far, and take the minimum of the earlier prefix cost plus setup cost plus the running largest size times the batch length. Keep everything in 64-bit integers."
followups:
  - "How would you also return the batch boundaries of an optimal plan?"
  - "If max_batch were unlimited and n were 10^5, how could you speed up the transition?"
  - "What changes if the padding cost depends on the sum of sizes instead of the maximum?"
  - "How would you handle a latency rule that a batch may not wait for more than t jobs?"
common_errors:
  - "Greedily packing max_batch jobs into every batch."
  - "Recomputing the maximum of each candidate batch from scratch, giving an extra factor of max_batch."
  - "Allowing batches longer than max_batch or skipping the length-one batch."
  - "Overflowing a 32-bit integer when setup costs and sizes are large."
