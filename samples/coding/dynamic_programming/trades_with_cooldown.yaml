expected_concepts:
  - "state machine dynamic programming (holding, just sold, free)"
  - "transitions that enforce the one-day cooldown"
  - "O(n) time and O(1) space"
  - "comparison with the unconstrained greedy that sums every rise"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines three day-end states, writes the transitions that make a sale block the next day's buy, rolls them in O(1) space, returns 0 for empty or falling prices and explains why summing every rise is wrong here."
  good: "Correct O(n) solution using arrays per state, or a correct O(n^2) recurrence over the last sale day with clear reasoning."
  weak: "Sums every price rise ignoring the cooldown, tries all buy and sell combinations exponentially, or lets a buy happen the day after a sale."
  criteria:
    correctness: "Respects the cooldown and the single-unit limit on every test."
    efficiency: "Linear time with constant extra memory."
    code_quality: "Named states and simultaneous updates using previous-day values."
    edge_cases: "Empty, single-day, flat and strictly falling price lists."
    communication: "Describes the state machine and walks through a short example."
hints:
  - "At the end of any day you are in one of a small number of situations: holding a unit, having just sold one, or holding nothing and free to buy. What is the best profit in each?"
  - "Write how each situation can be reached from yesterday's situations; the cooldown means you can buy today only if yesterday you were free, not if you sold yesterday."
  - "Track three running values: holding is the larger of keeping yesterday's holding or buying today from yesterday's free state; just sold is yesterday's holding plus today's price; free is the larger of yesterday's free and yesterday's just sold; update all three from the previous day's values at once and return the larger of free and just sold at the end, never below zero."
followups:
  - "How would a fixed fee per completed trade change the transitions?"
  - "What if the cooldown lasted k days instead of one?"
  - "How would you limit the number of completed trades to at most k?"
common_errors:
  - "Summing every positive day-to-day change, which ignores the cooldown."
  - "Updating one state with today's value of another state instead of yesterday's."
  - "Allowing a buy on the day right after a sale."
  - "Returning a negative profit instead of 0 when prices only fall."
