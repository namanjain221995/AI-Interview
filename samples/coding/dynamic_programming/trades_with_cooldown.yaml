title: "Trades With Cooldown"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist]
time_limit_minutes: 25
prompt_markdown: |
  ## Trades With Cooldown

  A cloud cost team experiments with buying and reselling one unit of reserved compute credit on an
  internal spot market. `prices[d]` is the price of one unit on day `d`. A back-test should report the
  best profit a trading rule could have made under these settlement rules:

  - You hold **at most one** unit at a time, so you must sell before buying again.
  - On each day you may buy (if you hold nothing), sell (if you hold a unit), or do nothing.
  - After a sale, settlement takes a full day: if you sell on day `d`, the earliest you may buy again is
    day `d + 2`.
  - You may trade any number of times; there are no fees.

  Write `max_profit_with_cooldown(prices)` that returns the maximum total profit. Return `0` if no
  profitable trade exists (including when `prices` is empty). A unit still held at the end earns nothing.

  ### Example 1
  ```
  Input:  prices = [2, 5, 1, 6]
  Output: 5
  Explanation: Selling at 5 on day 1 would forbid buying at 1 on day 2, so the best plan is to buy at 1 on day 2 and sell at 6 on day 3.
  ```

  ### Example 2
  ```
  Input:  prices = [9, 7, 4, 3]
  Output: 0
  Explanation: Prices only fall, so no trade is profitable.
  ```

  ### Example 3
  ```
  Input:  prices = [1, 3, 2, 8]
  Output: 7
  Explanation: Buy at 1 and sell at 8 for 7; selling at 3 would block buying at 2 the next day.
  ```

  ### Constraints
  - `0 <= prices.length <= 5000`
  - `0 <= prices[d] <= 1000`

  **Follow-up:** can you solve it in a single pass with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_profit_with_cooldown
  params:
    - {name: prices, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_profit_with_cooldown(prices: list[int]) -> int:
        holding = float("-inf")  # best profit while holding a unit at the end of the day
        just_sold = float("-inf")  # best profit when a unit was sold today (must wait tomorrow)
        free = 0  # best profit while holding nothing and free to buy tomorrow
        for price in prices:
            prev_holding, prev_sold, prev_free = holding, just_sold, free
            holding = max(prev_holding, prev_free - price)
            just_sold = prev_holding + price
            free = max(prev_free, prev_sold)
        return int(max(free, just_sold, 0))
  javascript: |
    function maxProfitWithCooldown(prices) {
      let holding = -Infinity;
      let justSold = -Infinity;
      let free = 0;
      for (const price of prices) {
        const prevHolding = holding;
        const prevSold = justSold;
        const prevFree = free;
        holding = Math.max(prevHolding, prevFree - price);
        justSold = prevHolding + price;
        free = Math.max(prevFree, prevSold);
      }
      return Math.max(free, justSold, 0);
    }
