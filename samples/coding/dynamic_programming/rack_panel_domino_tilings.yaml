version: 1
slug: rack_panel_domino_tilings
title: Rack Panel Domino Tilings
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, frontend]
time_limit_minutes: 12
prompt_markdown: |
  ## Rack Panel Domino Tilings

  The unused front of a server rack is a panel area **2 units tall** and **`n` units wide**. Facilities
  closes it with identical `1 x 2` blanking plates. Each plate is mounted either **vertically** (2 tall,
  1 wide) or **horizontally** (1 tall, 2 wide). Plates may not overlap, stick out past the edge or leave
  any gap, so every unit cell of the area is covered by exactly one plate.

  Two layouts are different when some unit cell is covered by a plate in a different position. Return the
  number of distinct layouts that cover the whole area, **modulo `1_000_000_007`** (10^9 + 7).

  ### Example 1
  ```
  Input:  n = 3
  Output: 3
  Explanation: three vertical plates; one vertical plate then two stacked horizontal plates;
  two stacked horizontal plates then one vertical plate.
  ```

  ### Example 2
  ```
  Input:  n = 4
  Output: 5
  ```

  ### Example 3
  ```
  Input:  n = 1
  Output: 1
  Explanation: a single vertical plate is the only layout.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - The answer is returned modulo `10^9 + 7`; use a 64-bit integer type.

  **Follow-up:** can you compute the answer with O(1) extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_panel_tilings
  params:
    - {name: n, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_panel_tilings(n: int) -> int:
        mod = 1_000_000_007
        before, current = 1, 1  # layouts for widths 0 and 1
        for _ in range(2, n + 1):
            before, current = current, (before + current) % mod
        return current
  javascript: |
    function countPanelTilings(n) {
      const MOD = 1000000007;
      let before = 1;
      let current = 1;
      for (let width = 2; width <= n; width++) {
        const next = (before + current) % MOD;
        before = current;
        current = next;
      }
      return current;
    }
tests:
  - {id: t1, args: [3], expected: 3, description: "Example 1"}
  - {id: t2, args: [4], expected: 5, description: "Example 2"}
  - {id: t3, args: [1], expected: 1, description: "Example 3 - minimum width, one vertical plate"}
  - {id: t4, hidden: true, args: [2], expected: 2, description: "Width 2: both vertical or both horizontal; catches a wrong second base case"}
  - {id: t5, hidden: true, args: [5], expected: 8, description: "Small width that confirms the recurrence beyond the examples"}
  - {id: t6, hidden: true, args: [10], expected: 89, description: "Medium width without any modulo involved"}
  - {id: t7, hidden: true, args: [43], expected: 701408733, description: "Largest width whose raw count is still below the modulus"}
  - {id: t8, hidden: true, args: [44], expected: 134903163, description: "First width whose raw count exceeds the modulus; the modulo must be applied"}
  - {id: t9, hidden: true, args: [1000], expected: 107579939, description: "Exponential recursion without memoisation times out"}
  - {id: t10, hidden: true, args: [100000], expected: 967618232, description: "Maximum width; deep recursion overflows the stack, iteration is required"}
expected_concepts:
  - "case split on how the leftmost column is covered"
  - "recurrence f(n) = f(n - 1) + f(n - 2) with base cases f(0) = f(1) = 1"
  - "bottom-up iteration instead of exponential recursion"
  - "modular reduction after every addition"
  - "rolling two variables for O(1) memory"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Derives the recurrence from the two ways to cover the leftmost column, gets the base cases right, iterates bottom-up with two rolling variables and modular reduction, and explains O(n) time and O(1) space."
  good: "Correct DP with an O(n) table or memoised recursion and the correct modulo, with minor prompting on base cases or memory."
  weak: "Plain recursion without memoisation, wrong base cases such as two layouts for width 1, or applying the modulo only at the end."
  criteria:
    correctness: "All widths pass, including 1, 2 and the values that need the modulo."
    efficiency: "Linear time and constant extra memory; no exponential recursion."
    code_quality: "Clear names for the two previous counts and a named modulus constant."
    edge_cases: "Width 1, width 2 and the maximum width without stack overflow or integer overflow."
    communication: "Explains why the leftmost column forces exactly two cases and why they never double count."
hints:
  - "Look only at the leftmost column of the panel: in a complete layout, what can be covering its two cells?"
  - "Either one vertical plate covers the first column, or two stacked horizontal plates cover the first two columns together; each choice leaves a narrower panel of the same shape to fill."
  - "Let the count for a width be the count for one unit narrower plus the count for two units narrower, with one layout for width zero and one for width one; build up to n keeping only the last two counts and reducing modulo 10^9 + 7 after each addition."
followups:
  - "Why can the two cases for the leftmost column never produce the same layout twice?"
  - "How would you handle n up to 10^18?"
  - "How does the recurrence change for a panel 3 units tall?"
  - "What if some plates were 1 x 3 instead of 1 x 2?"
common_errors:
  - "Using two layouts for width 1 or zero layouts for width 0, which shifts every answer."
  - "Recursing without memoisation, which takes exponential time."
  - "Applying the modulo only at the end, which overflows fixed-width integers."
  - "Recursing to depth n and overflowing the call stack for the largest widths."
