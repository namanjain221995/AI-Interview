expected_concepts:
  - "splitting the score into a left part (values[i] + i) and a right part (values[j] - j)"
  - "keeping the best left part seen so far while scanning"
  - "scoring before updating so a marker is never paired with itself"
  - "single pass, O(n) time and O(1) memory"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Rewrites the score as a sum of an i-only and a j-only term, scans once keeping the best left term, handles negative answers and explains O(n) time with O(1) memory."
  good: "Reaches the linear scan with some prompting, or uses an O(n) prefix-maximum array, and states the right complexity."
  weak: "Stops at the O(n^2) double loop, pairs a marker with itself, or initialises the answer to 0 and fails on all-negative input."
  criteria:
    correctness: "All tests pass, including two-element and all-negative inputs."
    efficiency: "One pass with constant extra memory."
    code_quality: "Names the running best left term clearly and keeps the loop small."
    edge_cases: "Negative answers, ties, increasing ratings and the minimum size of two."
    communication: "Explains why the distance penalty can be split between the two endpoints."
hints:
  - "Try rewriting the score so that everything depending on i is grouped together and everything depending on j is grouped together."
  - "The score is (values[i] + i) plus (values[j] - j). For a fixed right marker j, which earlier marker should you pair it with?"
  - "Scan from left to right keeping the largest value of values[i] + i among markers already passed. At each new marker j, compute that best plus values[j] - j as a candidate answer, and only afterwards consider marker j itself as a future left endpoint. Start the answer from the first candidate rather than zero, because scores can be negative."
followups:
  - "How would you also return the pair of markers, preferring the smallest i on ties?"
  - "What changes if the distance penalty is doubled, or if the trail is a loop?"
  - "How would you answer the question for many sub-ranges of the trail?"
common_errors:
  - "Initialising the best score to 0, which is wrong when every pair scores negative."
  - "Updating the best left term before scoring, so a marker is paired with itself."
  - "Using a double loop over all pairs."
  - "Tracking the maximum value alone instead of value plus index."
