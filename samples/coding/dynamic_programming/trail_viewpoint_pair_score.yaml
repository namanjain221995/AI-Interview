version: 1
slug: trail_viewpoint_pair_score
title: Trail Viewpoint Pair Score
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, frontend, mobile, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Trail Viewpoint Pair Score

  A hiking app wants to recommend a pair of viewpoints to visit on a single walk. The viewpoints sit at
  equally spaced markers along a straight trail, and `values[i]` is the appeal rating of the viewpoint at
  marker `i` (ratings can be negative for spots that visitors tend to dislike).

  Walking between markers costs effort, so the app scores a pair of markers `i < j` as:

  ```
  score(i, j) = values[i] + values[j] - (j - i)
  ```

  Return the **maximum score** over all pairs of distinct markers `i < j`. There are always at least two
  viewpoints, so an answer always exists, and the answer may be negative.

  ### Example 1
  ```
  Input:  values = [7, 2, 5, 1, 6]
  Output: 10
  Explanation: Markers 0 and 2 give 7 + 5 - (2 - 0) = 10. Markers 0 and 4 only give 7 + 6 - 4 = 9.
  ```

  ### Example 2
  ```
  Input:  values = [3, 9, 4, 8]
  Output: 15
  Explanation: Markers 1 and 3 give 9 + 8 - (3 - 1) = 15.
  ```

  ### Example 3
  ```
  Input:  values = [1, 1]
  Output: 1
  ```

  ### Constraints
  - `2 <= values.length <= 5 * 10^4`
  - `-1000 <= values[i] <= 1000`

  **Follow-up:** checking every pair takes `O(n^2)` time. Can you do it in a single pass with `O(1)` extra
  memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_paired_score
  params:
    - {name: values, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def best_paired_score(values: list[int]) -> int:
        # score(i, j) splits into (values[i] + i) + (values[j] - j).
        best_left = values[0]  # best values[i] + i seen so far, starting with i = 0
        best = None
        for j in range(1, len(values)):
            candidate = best_left + values[j] - j
            if best is None or candidate > best:
                best = candidate
            best_left = max(best_left, values[j] + j)
        return best
  javascript: |
    function bestPairedScore(values) {
      let bestLeft = values[0];
      let best = -Infinity;
      for (let j = 1; j < values.length; j++) {
        const candidate = bestLeft + values[j] - j;
        if (candidate > best) best = candidate;
        bestLeft = Math.max(bestLeft, values[j] + j);
      }
      return best;
    }
