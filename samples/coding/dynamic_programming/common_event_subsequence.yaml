title: "Common Event Subsequence"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, qa, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Common Event Subsequence

  During a migration, the old and the new version of a service both emit an ordered trace of event names
  for the same request: `a` from the old service and `b` from the new one. To measure how closely the new
  behaviour follows the old one, QA wants the length of the **longest sequence of event names that
  appears, in order, in both traces**.

  The events of that sequence do **not** need to be adjacent in either trace, but they must keep their
  relative order in both. Event names are compared exactly (case-sensitive). Return `0` if the traces
  share no event name.

  ### Example 1
  ```
  Input:  a = ["login", "view_cart", "add_item", "checkout", "logout"], b = ["login", "add_item", "view_cart", "checkout", "pay", "logout"]
  Output: 4
  Explanation: For example login, view_cart, checkout, logout appears in order in both traces.
  view_cart and add_item cannot both be kept because their order differs.
  ```

  ### Example 2
  ```
  Input:  a = ["deploy", "verify"], b = ["rollback"]
  Output: 0
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 1000`
  - `1 <= a[i].length, b[j].length <= 40`
  - Event names contain letters, digits and underscores.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: lcs_event_overlap
  params:
    - {name: a, type: "string[]"}
    - {name: b, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def lcs_event_overlap(a: list[str], b: list[str]) -> int:
        if len(a) < len(b):
            a, b = b, a  # keep the rolling row as short as possible
        previous = [0] * (len(b) + 1)
        for event in a:
            current = [0] * (len(b) + 1)
            for j, other in enumerate(b, start=1):
                if event == other:
                    current[j] = previous[j - 1] + 1
                else:
                    current[j] = max(previous[j], current[j - 1])
            previous = current
        return previous[-1]
  javascript: |
    function lcsEventOverlap(a, b) {
      if (a.length < b.length) [a, b] = [b, a];
      let previous = new Array(b.length + 1).fill(0);
      for (const event of a) {
        const current = new Array(b.length + 1).fill(0);
        for (let j = 1; j <= b.length; j++) {
          current[j] = event === b[j - 1]
            ? previous[j - 1] + 1
            : Math.max(previous[j], current[j - 1]);
        }
        previous = current;
      }
      return previous[b.length];
    }
