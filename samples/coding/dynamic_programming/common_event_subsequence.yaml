expected_concepts:
  - "longest common subsequence DP"
  - "table over prefixes of both lists"
  - "rolling rows for O(min(n, m)) memory"
  - "exact string comparison of elements"
optimal_complexity: {time: "O(n * m)", space: "O(min(n, m))"}
rubric:
  excellent: "Defines the prefix table, states the match and skip transitions, handles empty traces, reduces memory to two rows of the shorter list and states O(n * m) time; can explain how to recover the actual sequence."
  good: "Correct full two-dimensional table or memoised recursion with O(n * m) time and memory."
  weak: "Uses a greedy two-pointer match, counts common names regardless of order, or recurses without memoisation."
  criteria:
    correctness: "All tests pass, including repeated names, reversed traces and empty inputs."
    efficiency: "Quadratic time in the trace lengths; linear memory is a plus."
    code_quality: "Table indices are offset consistently and named after what they represent."
    edge_cases: "Empty traces, identical traces, repeated names and case differences."
    communication: "Explains the recurrence and why greedy matching fails."
hints:
  - "Compare the last events of both traces: either they match and can end the common sequence, or at least one of them is not part of it."
  - "Define the answer for every pair of prefixes, one prefix of each trace, and express it through answers for shorter prefixes."
  - "Fill a table where each cell holds the best length for a prefix of each trace. When the two last events are equal, take the diagonal cell plus one; otherwise take the larger of the cell that drops the last event of one trace or of the other. You only need the previous row to compute the current one."
followups:
  - "How would you return the common sequence itself, not just its length?"
  - "How would you turn this into a similarity score between 0 and 1?"
  - "What if one trace were very long and the other very short; which one should index the rows?"
common_errors:
  - "Greedily matching the first equal event, which can skip a better alignment."
  - "Counting names present in both traces while ignoring order."
  - "Off-by-one errors between table indices and list indices."
  - "Recursing on both prefixes without memoisation, which is exponential."
