slug: balanced_two_node_split
title: "Balanced Two-Node Split"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, platform, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Balanced Two-Node Split

  A small on-premises cluster has exactly two worker nodes. Before a maintenance window, the platform
  team must pin every workload to one of the two nodes. Workload `i` has a fixed resource load
  `loads[i]` and cannot be split across nodes.

  Write `min_load_imbalance(loads)` that returns the **smallest possible absolute difference** between the
  total load on the first node and the total load on the second node.

  - Every workload goes to exactly one node; a node may end up with no workloads.
  - Only the difference matters, not which node is heavier.
  - Return `0` when there are no workloads.

  ### Example 1
  ```
  Input:  loads = [3, 1, 4, 2, 2]
  Output: 0
  Explanation: Node A gets 3 + 1 + 2 = 6 and node B gets 4 + 2 = 6.
  ```

  ### Example 2
  ```
  Input:  loads = [10, 3, 4]
  Output: 3
  Explanation: Best split is 10 against 3 + 4 = 7.
  ```

  ### Constraints
  - `0 <= loads.length <= 100`
  - `1 <= loads[i] <= 1000`
  - `sum(loads) <= 5 * 10^4`

  **Follow-up:** can you find the answer using memory proportional to the total load rather than to `loads.length * sum(loads)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_load_imbalance
  params:
    - {name: loads, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_load_imbalance(loads: list[int]) -> int:
        total = sum(loads)
        # Bit s of reachable is set when some subset of workloads sums to exactly s.
        reachable = 1
        for load in loads:
            reachable |= reachable << load
        for first_node in range(total // 2, -1, -1):
            if (reachable >> first_node) & 1:
                return total - 2 * first_node
        return total
  javascript: |
    function minLoadImbalance(loads) {
      const total = loads.reduce((acc, x) => acc + x, 0);
      const half = Math.floor(total / 2);
      const reachable = new Uint8Array(half + 1);
      reachable[0] = 1;
      for (const load of loads) {
        for (let s = half; s >= load; s--) {
          if (reachable[s - load]) reachable[s] = 1;
        }
      }
      for (let s = half; s >= 0; s--) {
        if (reachable[s]) return total - 2 * s;
      }
      return total;
    }
