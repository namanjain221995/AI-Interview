expected_concepts:
  - "reduction to subset sum: get one node as close to half the total as possible"
  - "boolean table of reachable sums"
  - "iterating sums downwards (or using a bitset) so each workload is used once"
  - "O(n * S) time where S is the total load"
  - "why greedy assignment fails"
optimal_complexity: {time: "O(n * S) where S = sum(loads)", space: "O(S)"}
rubric:
  excellent: "Reduces the task to finding the reachable subset sum closest to half the total, builds a one-dimensional reachability table (or bitset) iterated downwards, returns total minus twice that sum, handles empty input and explains the pseudo-polynomial complexity and why greedy fails."
  good: "Correct two-dimensional subset-sum table or memoised recursion with the right complexity, possibly needing a nudge towards the half-total observation."
  weak: "Assigns greedily to the lighter node, sorts and alternates, or enumerates all 2^n assignments."
  criteria:
    correctness: "Exact minimum on balanced, odd-total and dominant-workload inputs."
    efficiency: "O(n * S) time with O(S) memory for full credit."
    code_quality: "Clear reachability array and a final scan from half the total downwards."
    edge_cases: "Empty input, single workload, odd totals and one very large workload."
    communication: "Explains the half-total reduction and gives a counterexample to greedy."
hints:
  - "If one node ends up with load A, the other has the total minus A, so the gap depends only on A. Which values of A are actually possible?"
  - "Track every subset total that can be formed from the workloads seen so far; you only care about totals up to half of the overall sum."
  - "Keep a boolean array of reachable totals starting with only zero reachable; for each workload, sweep the totals from high to low and mark a total reachable if the total minus this workload was reachable; finally take the largest reachable total not exceeding half the sum and return the overall sum minus twice that value."
followups:
  - "How would you return which workloads go to each node?"
  - "What changes if there are three nodes instead of two?"
  - "If loads were as large as 10^9 but there were only 40 workloads, what technique would you use instead?"
common_errors:
  - "Greedy placement on the currently lighter node."
  - "Sweeping totals upwards in the one-dimensional table, which reuses a workload."
  - "Searching for a total equal to half and returning the wrong value when the total is odd."
  - "Returning the larger node's load instead of the difference."
