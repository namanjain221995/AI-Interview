slug: binary_fanout_route_counts
title: Binary Fan-Out Route Counts
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, network, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Binary Fan-Out Route Counts

  A packet-distribution fabric is built as a triangular mesh of switches arranged in levels. Level `0`
  has a single ingress switch, level `1` has 2 switches, and in general level `k` has `k + 1` switches
  numbered `0` to `k` from left to right.

  Switch `p` on level `k` forwards each packet to exactly one of two switches on level `k + 1`: switch
  `p` (the **left** link) or switch `p + 1` (the **right** link). Two routes are different if they make
  a different left/right choice at some level.

  Given the number of forwarding levels `depth`, return an array of length `depth + 1` whose entry `i`
  is the **number of distinct routes** from the ingress switch to switch `i` on level `depth`.

  ### Example 1
  ```
  Input:  depth = 4
  Output: [1, 4, 6, 4, 1]
  Explanation: Switch 1 on level 4 is reached by taking exactly one right link at any of the 4 levels.
  ```

  ### Example 2
  ```
  Input:  depth = 0
  Output: [1]
  Explanation: The packet is already at the ingress switch; the empty route is the only route.
  ```

  ### Constraints
  - `0 <= depth <= 50`
  - Counts can exceed the 32-bit integer range; return 64-bit integers.

  **Follow-up:** can you build the answer level by level using `O(depth)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: fanout_route_counts
  params:
    - {name: depth, type: int}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def fanout_route_counts(depth: int) -> list[int]:
        # row[p]: number of routes reaching switch p on the current level.
        row = [1]
        for _ in range(depth):
            nxt = [0] * (len(row) + 1)
            for p, count in enumerate(row):
                nxt[p] += count      # left link
                nxt[p + 1] += count  # right link
            row = nxt
        return row
  javascript: |
    function fanoutRouteCounts(depth) {
      let row = [1];
      for (let level = 0; level < depth; level++) {
        const next = new Array(row.length + 1).fill(0);
        for (let p = 0; p < row.length; p++) {
          next[p] += row[p];
          next[p + 1] += row[p];
        }
        row = next;
      }
      return row;
    }
