expected_concepts:
  - "routes into a switch are the sum of routes into its two upstream switches"
  - "building one level from the previous level"
  - "boundary switches are reached through only one incoming link"
  - "64-bit arithmetic for large counts"
  - "connection to binomial coefficients"
optimal_complexity: {time: "O(depth^2)", space: "O(depth)"}
rubric:
  excellent: "Derives that each switch's count is the sum of the counts of the two switches that link into it, builds the level row by row with correct boundaries, uses 64-bit integers, and may point out the binomial-coefficient closed form and its overflow pitfalls."
  good: "Correct level-by-level construction with a full 2D table or after a hint about 64-bit overflow."
  weak: "Enumerates all 2^depth routes, overflows 32-bit integers, or returns the wrong length."
  criteria:
    correctness: "All tests pass, including depth 0 and the maximum depth."
    efficiency: "Quadratic time in depth with one row of memory."
    code_quality: "Clear handling of the two boundary switches without index errors."
    edge_cases: "depth = 0, depth = 1 and counts beyond 32 bits."
    communication: "Explains why every route into switch p comes from switch p - 1 or switch p on the level above."
hints:
  - "Think about the last link a route takes before it arrives at a switch. Which switches on the level above could it have come from?"
  - "Switch p on a level can be reached from switch p minus one or switch p on the level above, so its count is built from the counts of at most two switches. Can you compute one level from the previous one?"
  - "Start with a level containing just the ingress switch with count one. To build the next level, give every switch a count of zero and then add each current switch's count to both of the switches it links to. Repeat depth times and use 64-bit integers because the middle counts grow quickly."
followups:
  - "How would you compute a single entry without building every level, and how would you avoid overflow?"
  - "What changes if some switches are offline and cannot forward packets?"
  - "How would you answer the question if each link had a different probability of being chosen?"
common_errors:
  - "Overflowing 32-bit integers beyond depth 30 or so."
  - "Returning depth entries instead of depth + 1."
  - "Reading outside the previous row at the boundary switches."
  - "Enumerating every left/right sequence, which takes exponential time."
