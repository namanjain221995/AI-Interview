expected_concepts:
  - "weighted interval scheduling"
  - "sorting by end time"
  - "binary search for the last compatible booking"
  - "take-or-skip recurrence over the sorted order"
  - "O(n log n) time and O(n) space with 64-bit totals"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by end time, defines the best value over a prefix, uses binary search for the last booking ending at or before the start, handles touching endpoints with the right comparison, uses 64-bit totals and explains O(n log n)."
  good: "Correct take-or-skip dynamic programming with a linear scan for the compatible booking (O(n^2)), or the O(n log n) version with a small boundary slip fixed after testing."
  weak: "Uses a greedy rule (earliest end, highest value or most bookings), treats touching bookings as overlapping, or enumerates subsets."
  criteria:
    correctness: "Optimal totals including touching endpoints, duplicates and shared end times."
    efficiency: "O(n log n) for full credit; O(n^2) is partial."
    code_quality: "Clear prefix-based state and a well-bounded binary search."
    edge_cases: "Empty list, single request, identical requests and very large values."
    communication: "Explains why greedy fails here although it works for the unweighted version."
hints:
  - "Picking the earliest-ending or the most valuable request first can both go wrong once requests have values; consider the requests in order of when they end."
  - "After sorting by end time, the best total using the first i requests either skips request i or takes it together with the best total of the requests that end no later than it starts."
  - "Keep an array of best totals over prefixes of the end-sorted list; for each request, binary search the end times for how many earlier requests finish at or before its start, then store the larger of the previous prefix best and that prefix's best plus this request's value; the last entry is the answer."
followups:
  - "How would you return the accepted requests themselves?"
  - "What changes with two identical rooms instead of one?"
  - "How would you support new requests arriving one at a time?"
common_errors:
  - "Using a strict comparison so requests that touch at an endpoint are treated as overlapping."
  - "Greedy selection by earliest end or highest value."
  - "Sorting by start time and then searching in the wrong direction."
  - "Overflowing a 32-bit total."
