prompt_markdown: |
  ## Weighted Booking Selection

  A company has one large meeting room and receives more booking requests than it can host. Each request
  is `[start, end, value]`: it occupies the room over the half-open time interval `[start, end)` and the
  facilities team has estimated its business value as `value`. Requests arrive in no particular order.

  Write `max_weighted_bookings(bookings)` that returns the **maximum total value** of a set of accepted
  requests that never use the room at the same time.

  - Two accepted requests may not overlap, but one may start exactly when another ends
    (`[1, 3)` and `[3, 5)` are compatible).
  - Accepting no requests is allowed, so the answer for an empty list is `0`.
  - The total can exceed the 32-bit integer range; return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  bookings = [[9, 12, 40], [10, 14, 70], [12, 16, 50], [14, 18, 30]]
  Output: 100
  Explanation: Accept [10, 14) and [14, 18) for 70 + 30 = 100, which beats [9, 12) and [12, 16) for 90.
  ```

  ### Example 2
  ```
  Input:  bookings = [[1, 3, 20], [3, 5, 20], [0, 6, 35]]
  Output: 40
  Explanation: The two short bookings touch at time 3 and together are worth 40, more than the long one.
  ```

  ### Constraints
  - `0 <= bookings.length <= 10^4`
  - `bookings[i].length == 3`
  - `0 <= start < end <= 10^9`
  - `1 <= value <= 10^9`

  **Follow-up:** an `O(n^2)` comparison of every pair works for small inputs; can you reach `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_weighted_bookings
  params:
