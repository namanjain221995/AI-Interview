  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right


    def max_weighted_bookings(bookings: list[list[int]]) -> int:
        ordered = sorted(bookings, key=lambda b: b[1])
        ends = [b[1] for b in ordered]
        # best[i] is the maximum value using only the first i bookings in end-time order.
        best = [0] * (len(ordered) + 1)
        for i, (start, _end, value) in enumerate(ordered):
            # Number of earlier bookings that finish no later than this one starts.
            compatible = bisect_right(ends, start, 0, i)
            best[i + 1] = max(best[i], best[compatible] + value)
        return best[-1]
  javascript: |
    function maxWeightedBookings(bookings) {
      const ordered = [...bookings].sort((a, b) => a[1] - b[1]);
      const n = ordered.length;
      const best = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) {
        const [start, , value] = ordered[i];
        let lo = 0;
        let hi = i;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (ordered[mid][1] <= start) lo = mid + 1;
          else hi = mid;
        }
        best[i + 1] = Math.max(best[i], best[lo] + value);
      }
      return best[n];
    }
