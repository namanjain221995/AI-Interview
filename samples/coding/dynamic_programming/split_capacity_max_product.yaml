version: 1
slug: split_capacity_max_product
title: Split Capacity Maximum Product
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist]
time_limit_minutes: 15
prompt_markdown: |
  ## Split Capacity Maximum Product

  A pool of `n` capacity units is shared among **at least two** worker groups. Every group receives a
  positive whole number of units, and all `n` units are assigned. The scheduler rates a split by its
  **throughput score**: the product of the group sizes.

  Return the **maximum** throughput score over all valid splits.

  ### Example 1
  ```
  Input:  n = 10
  Output: 36
  Explanation: 3 + 3 + 4 = 10 and 3 * 3 * 4 = 36.
  ```

  ### Example 2
  ```
  Input:  n = 2
  Output: 1
  Explanation: the only split is 1 + 1.
  ```

  ### Constraints
  - `2 <= n <= 100`
  - The answer can exceed the 32-bit range (it stays below 2^53); return a 64-bit integer.

  **Follow-up:** can you justify a constant-time rule for choosing the part sizes?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_split_product
  params:
    - {name: n, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_split_product(n: int) -> int:
        # best[i]: best product for capacity i split into at least two parts
        best = [0] * (n + 1)
        for i in range(2, n + 1):
            top = 0
            for first in range(1, i):
                rest = i - first
                top = max(top, first * rest, first * best[rest])
            best[i] = top
        return best[n]
  javascript: |
    function maxSplitProduct(n) {
      const best = new Array(n + 1).fill(0);
      for (let i = 2; i <= n; i++) {
        let top = 0;
        for (let first = 1; first < i; first++) {
          const rest = i - first;
          top = Math.max(top, first * rest, first * best[rest]);
        }
        best[i] = top;
      }
      return best[n];
    }
tests:
  - {id: t1, args: [10], expected: 36, description: "Example 1"}
  - {id: t2, args: [2], expected: 1, description: "Example 2 - smallest input, the split is forced"}
  - {id: t3, hidden: true, args: [3], expected: 2, description: "Forced split 1 + 2; keeping 3 whole is not allowed"}
  - {id: t4, hidden: true, args: [4], expected: 4, description: "2 + 2 equals 4 itself; the split must still happen"}
  - {id: t5, hidden: true, args: [5], expected: 6, description: "Mix of a 2 and a 3"}
  - {id: t6, hidden: true, args: [6], expected: 9, description: "Pure threes"}
  - {id: t7, hidden: true, args: [8], expected: 18, description: "Two threes and one two"}
  - {id: t8, hidden: true, args: [31], expected: 78732, description: "Remainder 1 handled as a four rather than a three plus a one"}
  - {id: t9, hidden: true, args: [58], expected: 1549681956, description: "Answer above 2^30"}
  - {id: t10, hidden: true, args: [100], expected: 7412080755407364, description: "Maximum n; answer far beyond 32 bits"}
expected_concepts:
  - "DP over capacities with a choice of the first part"
  - "distinguishing splitting the remainder further from keeping it whole"
  - "forced split at the top level for n = 2 and n = 3"
  - "greedy insight: parts of size 3, with 2s for the remainder"
  - "64-bit results"
optimal_complexity: {time: "O(n^2) DP (O(log n) with the greedy rule and fast exponentiation)", space: "O(n) for the DP (O(1) greedy)"}
rubric:
  excellent: "Builds the DP with the whole-or-split choice for the remainder, handles n = 2 and n = 3 correctly, uses 64-bit values, and explains or proves why parts of size 3 dominate."
  good: "Correct DP or correct greedy with minor prompting on the forced split or the 64-bit range."
  weak: "Brute-force enumeration of partitions, returning n for small inputs without splitting, or overflowing 32-bit integers."
  criteria:
    correctness: "All tests pass, including n = 2, 3, 4 and the maximum."
    efficiency: "Quadratic DP or better."
    code_quality: "The table meaning is clear and the forced split is not handled by fragile special cases."
    edge_cases: "Smallest inputs where splitting lowers the value, and results beyond 32 bits."
    communication: "Explains why the remainder may stay whole while the top level must split."
hints:
  - "Fix the size of the first group; what remains is a smaller capacity that you can either leave as one group or split further."
  - "For each capacity, try every first part and multiply it by the better of two options for the remainder: the remainder kept whole, or the best product already found for the remainder."
  - "Fill a table from capacity 2 up to n where each entry is the maximum, over every first part, of the first part times the larger of the remainder and the table value for the remainder; because every entry splits at least once, capacities 2 and 3 give 1 and 2, and the values you get favour parts of size 3."
followups:
  - "Can you prove that no part larger than 4 is ever needed?"
  - "How would you return the parts themselves, not only the product?"
  - "What changes if the number of groups is fixed at exactly m?"
  - "How would you handle n in the thousands, where the product needs big integers or logarithms?"
common_errors:
  - "Returning n itself for n = 2 or n = 3 because the split was not forced."
  - "Only comparing the first part times the best split of the remainder and missing the remainder kept whole."
  - "Using 32-bit integers for the product."
  - "A greedy with threes that leaves a remainder of 1 instead of turning 3 + 1 into 2 + 2."
