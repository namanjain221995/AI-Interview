version: 1
slug: pipeline_stage_dismantling
title: Pipeline Stage Dismantling
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## Pipeline Stage Dismantling

  A legacy data pipeline is a row of stages; stage `i` has an integration weight `values[i]`. The platform
  team decommissions the stages **one at a time, in any order they choose**. When a stage is removed, the
  team earns migration credit equal to

  ```
  left weight * removed stage's weight * right weight
  ```

  where *left* and *right* are the stage's **current** immediate neighbours in the row. If a stage has no
  neighbour on a side (it is at the current edge of the row), that side counts as `1`. After a removal the
  two neighbours become adjacent.

  Return the **maximum total credit** obtainable by removing every stage.

  ### Example 1
  ```
  Input:  values = [2, 4, 3]
  Output: 33
  Explanation: Remove 4 first (2 * 4 * 3 = 24), then 2 (1 * 2 * 3 = 6), then 3 (1 * 3 * 1 = 3).
  Removing them left to right instead earns only 8 + 12 + 3 = 23.
  ```

  ### Example 2
  ```
  Input:  values = [5]
  Output: 5
  ```

  ### Constraints
  - `1 <= values.length <= 300`
  - `0 <= values[i] <= 100`
  - Return the answer as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_dismantle_score
  params:
    - {name: values, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_dismantle_score(values: list[int]) -> int:
        padded = [1] + values + [1]
        size = len(padded)
        # best[lo][hi] = max credit for removing every stage strictly between
        # lo and hi while lo and hi themselves are still present.
        best = [[0] * size for _ in range(size)]
        for gap in range(2, size):
            for lo in range(size - gap):
                hi = lo + gap
                edge = padded[lo] * padded[hi]
                top = 0
                for last in range(lo + 1, hi):
                    score = best[lo][last] + best[last][hi] + edge * padded[last]
                    if score > top:
                        top = score
                best[lo][hi] = top
        return best[0][size - 1]
  javascript: |
    function maxDismantleScore(values) {
      const padded = [1, ...values, 1];
      const size = padded.length;
      const best = Array.from({ length: size }, () => new Array(size).fill(0));
      for (let gap = 2; gap < size; gap++) {
        for (let lo = 0; lo + gap < size; lo++) {
          const hi = lo + gap;
          const edge = padded[lo] * padded[hi];
          let top = 0;
          for (let last = lo + 1; last < hi; last++) {
            const score = best[lo][last] + best[last][hi] + edge * padded[last];
            if (score > top) top = score;
          }
          best[lo][hi] = top;
        }
      }
      return best[0][size - 1];
    }
tests:
  - {id: t1, args: [[2, 4, 3]], expected: 33, description: "Example 1"}
  - {id: t2, args: [[5]], expected: 5, description: "Example 2 - single stage, both sides count as 1"}
  - {id: t3, hidden: true, args: [[3, 9]], expected: 36, description: "Two stages: remove the smaller first"}
  - {id: t4, hidden: true, args: [[0, 0, 0]], expected: 0, description: "All zero weights give zero credit"}
  - {id: t5, hidden: true, args: [[7, 0, 7]], expected: 56, description: "Removing the zero first earns nothing but makes the 7s adjacent: 0 + 49 + 7 = 56"}
  - {id: t6, hidden: true, args: [[1, 1, 1, 1, 1]], expected: 5, description: "All ones: every removal earns 1"}
  - {id: t7, hidden: true, args: [[100, 100, 100, 100, 100, 100, 100, 100, 100, 100]], expected: 8010100, description: "All maximum weights: large products (multiple 10^6 terms)"}
  - {id: t8, hidden: true, args: [[9, 8, 7, 6, 5, 4, 3, 2, 1]], expected: 1530, description: "Strictly decreasing weights"}
  - {id: t9, hidden: true, args: [[4, 1, 6, 1, 8, 2, 1, 5]], expected: 547, description: "Small weights between large ones; greedy removal of the smallest is not optimal"}
  - {id: t10, hidden: true, args: [[2, 85, 21, 58, 76, 2, 0, 86, 2, 64, 78, 74, 28, 87, 58, 67, 8, 26, 38, 94, 96, 58, 58, 73, 20, 34, 59, 10, 68, 18, 49, 61, 24, 50, 82, 13, 48, 20, 31, 62, 22, 6, 15, 38, 60, 14, 7, 93, 81, 46, 52, 29, 91, 51, 70, 12, 62, 32, 66, 2]], expected: 16425554, description: "Stress: 60 pseudo-random weights; O(n^3) interval DP, exponential search times out"}
expected_concepts:
  - "think about which stage is removed last in an interval, not first"
  - "pad both ends with a weight of 1"
  - "interval DP over (left boundary, right boundary) with both boundaries still present"
  - "O(n^3) time and O(n^2) space"
optimal_complexity: {time: "O(n^3)", space: "O(n^2)"}
rubric:
  excellent: "Identifies that choosing the last stage removed in an interval makes the two sides independent, pads with 1s, fills the interval DP by increasing length, and states O(n^3) time and O(n^2) space with a clear argument."
  good: "Reaches the 'last removed' interval DP with some prompting, or writes correct memoised recursion over intervals."
  weak: "Uses a greedy order (smallest first, largest last) or tries all n! removal orders."
  criteria:
    correctness: "All tests pass, including zeros, a single stage and the stress case."
    efficiency: "O(n^3) interval DP rather than exponential search."
    code_quality: "DP indices and boundary meaning are documented; padding is explicit."
    edge_cases: "One stage, zeros, all equal weights."
    communication: "Explains why 'first removed' leads to dependent subproblems while 'last removed' does not."
hints:
  - "Deciding which stage to remove first makes the rest of the row hard to reason about, because neighbours keep changing. Try a different viewpoint on the order."
  - "Consider which stage in a stretch of the row is removed last. At that moment its neighbours are exactly the stages bounding the stretch, so the parts to its left and right become independent problems."
  - "Add a weight of one at both ends. Let the best credit for clearing everything strictly between two boundary positions be the maximum, over each stage chosen to be removed last in that gap, of the best for the left part, the best for the right part, and the product of the two boundary weights with that stage's weight. Fill this table by increasing gap length and read the answer for the two padded ends."
followups:
  - "How would you reconstruct an optimal removal order?"
  - "What changes if a missing neighbour counted as 0 instead of 1?"
  - "Why does the greedy 'remove the smallest weight first' rule fail?"
  - "How would you parallelise filling the DP table?"
common_errors:
  - "Choosing the first stage removed as the split point, which leaves the two sides dependent."
  - "Forgetting the implicit 1 at each end of the row."
  - "Filling the table in an order where sub-intervals are not computed yet."
  - "Applying a greedy rule such as always removing the smallest weight."
