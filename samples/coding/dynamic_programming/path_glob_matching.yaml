slug: path_glob_matching
title: Path Glob Matching
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, devops, backend, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Path Glob Matching

  A deployment tool decides which pipeline rules apply to a changed file by matching the file's
  repository path against each rule's **glob pattern**. You are implementing the matcher.

  The pattern is read left to right and its symbols mean:

  | Symbol | Matches |
  |--------|---------|
  | `?` | exactly **one** character that is not `/` |
  | `*` (a single star) | any run of **zero or more** characters, none of which is `/` |
  | `**` (two adjacent stars) | any run of **zero or more** characters, which **may** include `/` |
  | any other character | exactly that same character |

  Rules:

  - Two adjacent stars always form one `**`; a pattern never contains three or more stars in a row.
  - `/` in the pattern is an ordinary literal character: `a/**/b` needs a `/` on each side of whatever
    `**` matches, so it matches `a/x/b` and `a/x/y/b` but **not** `a/b`.
  - The match must cover the **whole** path, not just a prefix or a substring.

  Return `true` if the whole `path` matches the whole `pattern`, otherwise `false`.

  ### Example 1
  ```
  Input:  path = "services/api/deploy.yaml", pattern = "services/*/deploy.yaml"
  Output: true
  Explanation: The single star matches "api", which contains no slash.
  ```

  ### Example 2
  ```
  Input:  path = "services/api/v2/deploy.yaml", pattern = "services/*/deploy.yaml"
  Output: false
  Explanation: A single star cannot match "api/v2" because that run contains a slash.
  ```

  ### Example 3
  ```
  Input:  path = "services/api/v2/deploy.yaml", pattern = "services/**/deploy.yaml"
  Output: true
  Explanation: The double star matches "api/v2".
  ```

  ### Constraints
  - `0 <= path.length, pattern.length <= 200`
  - `path` contains lowercase letters, digits, `/`, `.`, `-` and `_` (never `*` or `?`).
  - `pattern` contains the same characters plus `*` and `?`, with no run of three or more `*`.

  **Follow-up:** Can you keep the extra memory proportional to the length of the path?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: glob_matches
  params:
    - {name: path, type: "string"}
    - {name: pattern, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def glob_matches(path: str, pattern: str) -> bool:
        tokens: list[str] = []
        i = 0
        while i < len(pattern):
            if pattern[i] == "*" and i + 1 < len(pattern) and pattern[i + 1] == "*":
                tokens.append("**")
                i += 2
            else:
                tokens.append(pattern[i])
                i += 1
        n = len(path)
        # nxt[i]: does path[i:] match the tokens after the current one?
        nxt = [False] * (n + 1)
        nxt[n] = True
        for k in range(len(tokens) - 1, -1, -1):
            tok = tokens[k]
            cur = [False] * (n + 1)
            for i in range(n, -1, -1):
                if tok == "**":
                    cur[i] = nxt[i] or (i < n and cur[i + 1])
                elif tok == "*":
                    cur[i] = nxt[i] or (i < n and path[i] != "/" and cur[i + 1])
                elif tok == "?":
                    cur[i] = i < n and path[i] != "/" and nxt[i + 1]
                else:
                    cur[i] = i < n and path[i] == tok and nxt[i + 1]
            nxt = cur
        return nxt[0]
  javascript: |
    function globMatches(path, pattern) {
      const tokens = [];
      for (let i = 0; i < pattern.length; ) {
        if (pattern[i] === "*" && pattern[i + 1] === "*") {
          tokens.push("**");
          i += 2;
        } else {
          tokens.push(pattern[i]);
          i += 1;
        }
      }
      const n = path.length;
      let nxt = new Array(n + 1).fill(false);
      nxt[n] = true;
      for (let k = tokens.length - 1; k >= 0; k--) {
        const tok = tokens[k];
        const cur = new Array(n + 1).fill(false);
        for (let i = n; i >= 0; i--) {
          if (tok === "**") cur[i] = nxt[i] || (i < n && cur[i + 1]);
          else if (tok === "*") cur[i] = nxt[i] || (i < n && path[i] !== "/" && cur[i + 1]);
          else if (tok === "?") cur[i] = i < n && path[i] !== "/" && nxt[i + 1];
          else cur[i] = i < n && path[i] === tok && nxt[i + 1];
        }
        nxt = cur;
      }
      return nxt[0];
    }
tests:
  - {id: t1, args: ["services/api/deploy.yaml", "services/*/deploy.yaml"], expected: true, description: "Example 1 - single star matches one directory name"}
  - {id: t2, args: ["services/api/v2/deploy.yaml", "services/*/deploy.yaml"], expected: false, description: "Example 2 - single star cannot cross a slash"}
  - {id: t3, args: ["services/api/v2/deploy.yaml", "services/**/deploy.yaml"], expected: true, description: "Example 3 - double star crosses directory levels"}
  - {id: t4, hidden: true, args: ["", "**"], expected: true, description: "Empty path against a lone double star (zero-length match)"}
  - {id: t5, hidden: true, args: ["a/b", "a/**/b"], expected: false, description: "Literal slashes around a double star are both required; a/b does not match"}
  - {id: t6, hidden: true, args: ["logs/2024-01-05.log", "logs/????-??-??.log"], expected: true, description: "Question marks each consume exactly one character"}
  - {id: t7, hidden: true, args: ["logs/2024/0105.log", "logs/?????????.log"], expected: false, description: "Question mark must not match a slash"}
  - {id: t8, hidden: true, args: ["config.yaml.bak", "*.yaml"], expected: false, description: "Whole-path match required; a matching prefix is not enough"}
  - {id: t9, hidden: true, args: ["build/out/app.js", "**.js"], expected: true, description: "Leading double star spans several directories"}
  - {id: t10, hidden: true, args: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaab", "*a*a*a*a*a*a*a*a*c"], expected: false, description: "Backtracking worst case for naive recursion; no match"}
  - {id: t11, hidden: true, args: ["src/m0/m1/m2/m3/m4/m5/m6/m7/m8/m9/m10/m11/m12/m13/m14/m15/m16/m17/m18/m19/m20/m21/m22/m23/m24/m25/m26/m27/m28/m29/main.go", "src/**/m2?/**/*.go"], expected: true, description: "Deep path mixing double star, question mark and single star"}
expected_concepts:
  - "tokenising the pattern so a double star is one symbol"
  - "dynamic programming over (path position, pattern position)"
  - "zero-length matches for star and double star"
  - "slash-aware transitions for star and question mark"
  - "avoiding exponential backtracking"
optimal_complexity: {time: "O(n * m)", space: "O(n)"}
rubric:
  excellent: "Tokenises the pattern, defines a clear (path index, token index) state, handles zero-length star matches and slash restrictions, explains why plain backtracking can blow up and gives O(n * m) time with O(n) memory."
  good: "Correct table or memoised recursion with O(n * m) time and memory; may need a nudge on the slash rule or the a/**/b case."
  weak: "Treats star and double star the same, lets question mark or single star cross a slash, matches only a prefix, or uses unbounded backtracking that times out."
  criteria:
    correctness: "All tests pass, including empty path, slash restrictions and whole-path matching."
    efficiency: "Polynomial time in the two lengths; no exponential backtracking on many stars."
    code_quality: "Pattern parsing separated from matching; each symbol's transition is easy to read."
    edge_cases: "Empty strings, adjacent stars, patterns longer than the path and stars at either end."
    communication: "States the recurrence for each symbol before coding and walks through one example."
hints:
  - "Think about the question 'does the rest of the path match the rest of the pattern?' and how each pattern symbol reduces it to a smaller version of the same question."
  - "First turn the pattern into symbols so that a pair of stars is a single symbol. A star-like symbol either matches nothing (skip the symbol) or swallows one more path character and stays in place; remember those smaller answers in a table so they are not recomputed."
  - "Fill a table indexed by path position and symbol position from the end backwards. The empty suffix matches the empty pattern; a literal or question mark needs the current character to fit and then moves both positions on; a single star may skip itself or consume one non-slash character and stay; a double star may skip itself or consume any character and stay. The answer is the entry for the start of both."
followups:
  - "Why does a recursive matcher without memoisation become exponential on a pattern like many stars separated by letters?"
  - "How would you extend the matcher with character classes such as a set of allowed letters in square brackets?"
  - "If thousands of rules are checked against every changed file, how would you avoid matching each pattern from scratch?"
  - "Can the two-row table be reduced further, or does a greedy two-pointer approach work for this syntax?"
common_errors:
  - "Letting a single star or a question mark match a slash."
  - "Treating a double star as two independent single stars, which can never cross a slash."
  - "Returning true when only a prefix of the path matches."
  - "Plain recursive backtracking with no memoisation, which times out on many stars."
  - "Forgetting that a star may match zero characters, so an empty path fails against a lone star."
