version: 1
slug: index_tree_shapes
title: Index Tree Shapes
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, dba]
time_limit_minutes: 15
prompt_markdown: |
  ## Index Tree Shapes

  A storage engine team is benchmarking how the insertion order of keys changes the shape of an
  unbalanced binary search tree index. To size the test matrix they need to know how many different
  shapes are possible.

  The index stores the keys `1, 2, ..., n`, each exactly once, in a binary search tree (every key in a
  node's left subtree is smaller than the node's key, and every key in its right subtree is larger).
  Two trees are different when their structure differs, that is, when some key has a different parent
  or sits on a different side. Return the number of **structurally distinct** binary search trees that
  hold exactly these keys. For `n = 0` the only tree is the empty tree, so the answer is `1`.

  ### Example 1
  ```
  Input:  n = 3
  Output: 5
  Explanation: With root 1 the keys 2 and 3 form two shapes on the right; root 2 gives one shape;
  root 3 gives two shapes on the left.
  ```

  ### Example 2
  ```
  Input:  n = 1
  Output: 1
  ```

  ### Constraints
  - `0 <= n <= 19`
  - The answer for every allowed `n` fits in a signed 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_bst_shapes
  params:
    - {name: n, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_bst_shapes(n: int) -> int:
        # shapes[m] = number of distinct trees holding m consecutive keys
        shapes = [0] * (n + 1)
        shapes[0] = 1
        for m in range(1, n + 1):
            total = 0
            for left in range(m):
                total += shapes[left] * shapes[m - 1 - left]
            shapes[m] = total
        return shapes[n]
  javascript: |
    function countBstShapes(n) {
      const memo = new Map();
      const count = (m) => {
        if (m <= 1) return 1;
        if (memo.has(m)) return memo.get(m);
        let total = 0;
        for (let root = 1; root <= m; root++) {
          total += count(root - 1) * count(m - root);
        }
        memo.set(m, total);
        return total;
      };
      return count(n);
    }
tests:
  - {id: t1, args: [3], expected: 5, description: "Example 1 - three keys"}
  - {id: t2, args: [1], expected: 1, description: "Example 2 - a single key"}
  - {id: t3, hidden: true, args: [0], expected: 1, description: "No keys: the empty tree counts as one"}
  - {id: t4, hidden: true, args: [2], expected: 2, description: "Two keys"}
  - {id: t5, hidden: true, args: [4], expected: 14, description: "Four keys"}
  - {id: t6, hidden: true, args: [10], expected: 16796, description: "Ten keys"}
  - {id: t7, hidden: true, args: [16], expected: 35357670, description: "Sixteen keys"}
  - {id: t8, hidden: true, args: [19], expected: 1767263190, description: "Largest allowed n"}
expected_concepts:
  - "choose each key as the root"
  - "left and right subtrees are independent, so their counts multiply"
  - "the count depends only on how many keys a subtree holds"
  - "empty subtree counts as one shape"
  - "Catalan numbers"
optimal_complexity: {time: "O(n^2)", space: "O(n)"}
rubric:
  excellent: "Derives the root-split recurrence (sum over roots of left count times right count), explains why only the number of keys matters, sets the empty tree to one, states the O(n^2) cost, and may recognise the Catalan numbers and their closed form."
  good: "Correct memoised or bottom-up recurrence with a short explanation; may need a nudge on the empty-tree base case."
  weak: "Builds every tree explicitly, adds subtree counts instead of multiplying them, or sets the empty case to zero."
  criteria:
    correctness: "All tests pass, including n = 0, n = 1 and n = 19."
    efficiency: "Quadratic DP over subtree sizes; no explicit enumeration of trees."
    code_quality: "Clear table indexed by key count with a concise double loop."
    edge_cases: "Empty tree, single key and the largest allowed n."
    communication: "Explains why left and right choices combine by multiplication."
hints:
  - "Pick a key to be the root. Which keys must end up on its left and which on its right?"
  - "Once the root is fixed, any left shape can be paired with any right shape, and the number of shapes for a block of consecutive keys depends only on how many keys it has."
  - "Build a table by key count where zero keys give one shape; for m keys add up, over every possible number of keys on the left, the left count times the right count for the remaining m minus 1 keys. The table entry for n keys is the answer."
followups:
  - "Can you compute the answer with a closed-form formula?"
  - "How would you generate all the trees, not only count them?"
  - "How many of these shapes have height at most h?"
  - "How large can n get before the count overflows 64 bits?"
common_errors:
  - "Adding the left and right counts instead of multiplying them."
  - "Treating the empty subtree as zero shapes, which makes every count zero."
  - "Plain recursion without memoisation, which repeats subproblems exponentially."
  - "Looping roots from 0 to m inclusive, which double-counts or reads past the table."
