expected_concepts:
  - "building the sequence bottom-up from the seeds"
  - "sliding window sum of the last k values instead of re-summing k terms"
  - "reducing modulo 1_000_000_007 at every step"
  - "handling n smaller than the number of seeds"
optimal_complexity: {time: "O(n)", space: "O(k)"}
rubric:
  excellent: "Builds the sequence iteratively, keeps a running sum of the last k delays (adding the new term and subtracting the one that leaves the window, with a safe modulo for negatives), handles n < k, and discusses O(k) memory with a circular buffer."
  good: "Correct O(n * k) iteration with modulo at each step, or the O(n) window with a small prompt about the negative-modulo case."
  weak: "Plain recursion without memoisation, overflow from skipping the modulo, or an off-by-one between 0-indexed n and the seed count."
  criteria:
    correctness: "All tests pass, including n = 0, n < k and very large n."
    efficiency: "Linear in n; the window sum avoids an extra factor of k."
    code_quality: "Named constant for the modulus and a clear window update."
    edge_cases: "Single seed, all-zero seeds, seeds close to the modulus and n exactly equal to k."
    communication: "Explains why intermediate values must be reduced and how subtraction interacts with the modulo."
hints:
  - "Each delay is defined only in terms of earlier delays, so you can compute them in order from the seeds rather than recursing from n downwards."
  - "Recomputing the sum of the last k delays for every step works, but notice that consecutive windows share all but one term at each end."
  - "Keep a running total of the last k delays: the next delay equals that total, then add the new delay and subtract the one that slides out of the window, reducing modulo 1_000_000_007 and correcting any negative remainder. Return a seed directly when n is smaller than k."
followups:
  - "How would you cut memory to O(k) with a circular buffer?"
  - "For n up to 10^18, how could matrix exponentiation compute d_n?"
  - "What if each new delay were capped at a maximum backoff instead of reduced modulo a prime?"
  - "How would you test this against a brute-force version?"
common_errors:
  - "Using naive recursion, which repeats work exponentially."
  - "Forgetting the modulo until the end, which overflows 64-bit integers."
  - "Subtracting the outgoing term without fixing a negative remainder."
  - "Indexing d_n as the n-th value counted from 1 instead of from 0."
