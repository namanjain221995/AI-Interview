slug: retry_backoff_recurrence
title: Retry Backoff Recurrence
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Retry Backoff Recurrence

  A message queue client retries failed deliveries with a configurable backoff schedule. The schedule
  is described by a list of `k = seeds.length` seed delays. Retry delays are numbered from `0`:

  - for `i < k`, delay `d_i = seeds[i]`;
  - for `i >= k`, delay `d_i` is the **sum of the previous `k` delays**,
    `d_(i-k) + d_(i-k+1) + ... + d_(i-1)`.

  Given `n` and `seeds`, return `d_n` **modulo `1_000_000_007`** (the delays grow very quickly).

  ### Example 1
  ```
  Input:  n = 6, seeds = [1, 2, 4]
  Output: 44
  Explanation: The delays are 1, 2, 4, 7, 13, 24, 44, so d_6 = 44.
  ```

  ### Example 2
  ```
  Input:  n = 1, seeds = [3, 5, 9]
  Output: 5
  Explanation: n < k, so the answer is the seed delay itself.
  ```

  ### Constraints
  - `0 <= n <= 10^5`
  - `1 <= seeds.length <= 50`
  - `0 <= seeds[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: backoff_delay_at
  params:
    - {name: n, type: int}
    - {name: seeds, type: "long[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def backoff_delay_at(n: int, seeds: list[int]) -> int:
        mod = 1_000_000_007
        k = len(seeds)
        delays = [s % mod for s in seeds]
        if n < k:
            return delays[n]
        window = sum(delays) % mod
        for i in range(k, n + 1):
            current = window
            delays.append(current)
            window = (window + current - delays[i - k]) % mod
        return delays[n]
  javascript: |
    function backoffDelayAt(n, seeds) {
      const MOD = 1000000007;
      const k = seeds.length;
      const delays = seeds.map((s) => Number(s) % MOD);
      if (n < k) return delays[n];
      let window = delays.reduce((a, b) => (a + b) % MOD, 0);
      for (let i = k; i <= n; i++) {
        const current = window;
        delays.push(current);
        window = (((window + current - delays[i - k]) % MOD) + MOD) % MOD;
      }
      return delays[n];
    }
