time_limit_minutes: 15
prompt_markdown: |
  ## Escalation Pyramid Minimum Cost

  Incidents are routed through an escalation pyramid. `levels[0]` holds the single entry point, and row
  `i` holds `i + 1` handling costs. From position `j` in one row, an incident can move only to position
  `j` or position `j + 1` in the next row. It visits exactly one position in every row and finishes at
  some position of the bottom row.

  The cost of a route is the sum of the costs of every position it visits, including the top one and the
  final one. Return the **minimum** route cost. Costs can be negative when a tier applies a service
  credit.

  ### Example 1
  ```
  Input:  levels = [[5], [9, 6], [4, 6, 8], [2, 7, 1, 5]]
  Output: 18
  Explanation: the route 5 -> 6 -> 6 -> 1 costs 18.
  ```

  ### Example 2
  ```
  Input:  levels = [[1], [2, 3], [10, 9, 1]]
  Output: 5
  Explanation: taking the cheaper 2 on the second row costs at least 1 + 2 + 9 = 12;
  the route 1 -> 3 -> 1 costs 5.
  ```

  ### Constraints
  - `1 <= levels.length <= 200`
  - `levels[i].length == i + 1`
  - `-10^4 <= levels[i][j] <= 10^4`

  **Follow-up:** can you use only O(rows) extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_cascade_cost
  params:
    - {name: levels, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_cascade_cost(levels: list[list[int]]) -> int:
        best = list(levels[-1])
        for row in range(len(levels) - 2, -1, -1):
            for j in range(row + 1):
                best[j] = levels[row][j] + min(best[j], best[j + 1])
        return best[0]
  javascript: |
    function minCascadeCost(levels) {
      const best = levels[levels.length - 1].slice();
      for (let row = levels.length - 2; row >= 0; row--) {
        for (let j = 0; j <= row; j++) {
          best[j] = levels[row][j] + Math.min(best[j], best[j + 1]);
        }
      }
      return best[0];
    }
