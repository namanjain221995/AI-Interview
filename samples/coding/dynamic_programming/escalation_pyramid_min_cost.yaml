expected_concepts:
  - "optimal substructure: the best cost from a position depends only on the two positions below"
  - "bottom-up DP from the last row to the top"
  - "greedy choice of the cheaper next step is not optimal"
  - "reusing one array whose length is the number of rows"
optimal_complexity: {time: "O(n^2) for n rows (linear in the number of costs)", space: "O(n)"}
rubric:
  excellent: "Explains why greedy fails, derives the bottom-up recurrence, implements it in one reusable array, handles single-row and negative inputs, and states time linear in the number of costs with O(rows) space."
  good: "Correct top-down or bottom-up DP using a full table or memoisation with the right complexity."
  weak: "Greedy next-step choice, exponential enumeration of every route, or an off-by-one that reads past the end of a row."
  criteria:
    correctness: "All tests pass, including negative costs and the single-row pyramid."
    efficiency: "Each cost is processed once; extra memory is at most one row."
    code_quality: "Clear loop bounds over rows and positions and no special casing beyond what is needed."
    edge_cases: "Single row, ties, all zeros and negative values."
    communication: "Explains why the best cost from a position only needs the best costs of the two positions below it."
hints:
  - "Picking the cheaper of the two next positions can lead into expensive rows further down; think about the best cost from a position all the way to the bottom."
  - "The best cost from a position is its own cost plus the smaller of the best costs of the two positions directly below it, and the bottom row already knows its answers."
  - "Copy the bottom row into a working array, then for each row from the second-to-last up to the top replace entry j with that row's cost at j plus the smaller of entries j and j plus 1; the single value left at position zero is the answer."
followups:
  - "How would you also return the positions of the cheapest route?"
  - "What changes if a route may also move to position j minus 1 in the next row?"
  - "Would a top-down pass work, and what would you take the minimum over at the end?"
  - "Why does greedy fail here, and can you construct a counterexample quickly?"
common_errors:
  - "Choosing the cheaper next position greedily."
  - "Enumerating every route recursively without memoisation, which is exponential."
  - "Going top-down and returning the first value of the last row instead of the minimum over the bottom row."
  - "Indexing past the end of a row when looking at position j plus 1."
