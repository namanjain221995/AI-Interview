expected_concepts:
  - "0/1 knapsack dynamic programming"
  - "state indexed by remaining or used budget"
  - "iterating budgets downwards to avoid reusing a job"
  - "O(n * budget) time and O(budget) space"
  - "64-bit accumulation of large values"
optimal_complexity: {time: "O(n * budget)", space: "O(budget)"}
rubric:
  excellent: "Recognises the 0/1 knapsack, defines the best value per budget, iterates budgets downwards in a one-dimensional array (and explains why), uses 64-bit totals, handles empty input and zero budget, and states pseudo-polynomial O(n * budget) complexity."
  good: "Correct two-dimensional table or memoised recursion over (job, budget) with the right complexity, possibly needing a hint to compress memory."
  weak: "Uses greedy by value or value-per-hour, enumerates all subsets, allows a job to run twice, or overflows 32-bit totals."
  criteria:
    correctness: "Optimal value on tight budgets, zero budgets and inputs where greedy fails."
    efficiency: "O(n * budget) time; O(budget) memory for full credit."
    code_quality: "Readable state meaning and loop direction justified in a comment or explanation."
    edge_cases: "No jobs, zero budget, jobs that never fit, zero values and large values."
    communication: "Explains why greedy fails and why the inner loop must run downwards."
hints:
  - "Ranking jobs by value or by value per GPU-hour can go wrong; try to find a small counterexample, then think about deciding job by job whether to run it."
  - "For each job you either skip it or run it and pay its cost, so the best value for a budget depends on best values for smaller budgets using only the earlier jobs."
  - "Keep one array holding the best value for every budget from zero up to the limit; for each job, sweep the budgets from high to low and take the larger of the current entry and the entry at budget minus cost plus the job's value; sweeping downwards stops a job from being counted twice, and the final entry is the answer."
followups:
  - "How would you report which jobs were chosen?"
  - "What if each job could be run any number of times?"
  - "If budgets were up to 10^9 but values were small, how would you change the state?"
common_errors:
  - "Iterating the budget upwards in the one-dimensional array, which lets a job run several times."
  - "Greedy selection by value or by value-per-hour ratio."
  - "Using 32-bit integers for the running total."
  - "Indexing the array out of bounds when a cost exceeds the budget."
