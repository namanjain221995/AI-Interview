slug: gpu_budget_job_selection
title: "GPU Budget Job Selection"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, ml, data_scientist, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## GPU Budget Job Selection

  An ML platform team has a fixed monthly allowance of GPU-hours and a backlog of training jobs. Job `i`
  needs exactly `costs[i]` GPU-hours and the product team has scored its business value as `values[i]`.
  A job is either run in full or not at all, and each job can be run at most once.

  Write `max_job_value_within_budget(costs, values, budget)` that returns the **maximum total value** of
  a set of jobs whose total cost does not exceed `budget`.

  - `costs` and `values` have the same length; position `i` in both describes the same job.
  - Running no jobs is allowed, so the answer is never negative.
  - The total value can exceed the 32-bit integer range; return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  costs = [4, 3, 2, 5], values = [40, 50, 30, 70], budget = 8
  Output: 120
  Explanation: Run the jobs costing 3 and 5 GPU-hours: value 50 + 70 = 120 using exactly 8 hours.
  ```

  ### Example 2
  ```
  Input:  costs = [6], values = [100], budget = 5
  Output: 0
  Explanation: The only job does not fit, so nothing runs.
  ```

  ### Constraints
  - `0 <= costs.length == values.length <= 100`
  - `1 <= costs[i] <= 10^4`
  - `0 <= values[i] <= 10^9`
  - `0 <= budget <= 10^4`

  **Follow-up:** can you solve it with a single array of size `budget + 1` instead of a full table?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_job_value_within_budget
  params:
    - {name: costs, type: "int[]"}
    - {name: values, type: "int[]"}
    - {name: budget, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_job_value_within_budget(costs: list[int], values: list[int], budget: int) -> int:
        # best[b] is the highest value achievable with at most b GPU-hours using the jobs seen so far.
        best = [0] * (budget + 1)
        for cost, value in zip(costs, values):
            # Walk budgets downwards so each job is counted at most once.
            for b in range(budget, cost - 1, -1):
                candidate = best[b - cost] + value
                if candidate > best[b]:
                    best[b] = candidate
        return best[budget]
  javascript: |
    function maxJobValueWithinBudget(costs, values, budget) {
      const best = new Array(budget + 1).fill(0);
      for (let i = 0; i < costs.length; i++) {
        const cost = costs[i];
        const value = values[i];
        for (let b = budget; b >= cost; b--) {
          const candidate = best[b - cost] + value;
          if (candidate > best[b]) best[b] = candidate;
        }
      }
      return best[budget];
    }
