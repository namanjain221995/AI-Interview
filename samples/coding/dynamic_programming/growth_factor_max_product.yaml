expected_concepts:
  - "track both maximum and minimum product ending at each index"
  - "negative factor swaps max and min"
  - "zero restarts the window"
  - "64-bit products"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Explains why the minimum product must be tracked (a negative can turn it into the maximum), handles zeros as restarts, uses 64-bit values, and states O(n) time and O(1) space; can also present the prefix and suffix product view."
  good: "Correct linear solution after fixing a case such as a single negative element or zeros during testing."
  weak: "Uses Kadane's maximum-sum logic with only a running maximum, tries every window in O(n^2), or initialises the best value to 0 and fails on all-negative single elements."
  criteria:
    correctness: "All tests pass, including single negatives, zeros and large products."
    efficiency: "One pass with constant extra memory."
    code_quality: "Clear names for the running high and low values and a visible swap on negatives."
    edge_cases: "Single element, zeros, odd counts of negatives and values that exceed 32 bits."
    communication: "Explains the role of the running minimum before writing code."
hints:
  - "Unlike sums, a very negative product can become the largest one after multiplying by another negative number."
  - "For each position keep track of more than one candidate product for windows that end there. What information about the previous position do you need?"
  - "Keep the largest and the smallest product of a window ending at the current position. For each new factor, the new largest is the best of the factor alone, the old largest times the factor and the old smallest times the factor (and similarly for the smallest). Update the overall best from the largest after each step, starting from the first element and using 64-bit values."
followups:
  - "How would you return the window boundaries as well as the product?"
  - "How would you solve it if products could overflow 64 bits, for example by comparing logarithms or counting negatives and zeros?"
  - "What if the factors were decimal numbers between 0 and 2?"
common_errors:
  - "Tracking only the running maximum, which misses a negative times a negative."
  - "Initialising the answer to 0, which is wrong when the only element is negative."
  - "Using 32-bit integers for products up to 10^15."
  - "Resetting on zero but forgetting that zero itself can be the answer."
