slug: growth_factor_max_product
title: "Growth Factor Maximum Product"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, data, data_scientist, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Growth Factor Maximum Product

  A metrics pipeline models a business indicator with integer **period-over-period multipliers**:
  `factors[i]` is the multiplier applied in period `i`. Multipliers may be negative (the indicator flips
  sign, for example a margin that turns into a loss) or zero (the indicator was reset).

  The compound effect of a run of periods is the **product** of their multipliers. Return the **largest
  product** of any **non-empty contiguous window** of `factors`.

  ### Example 1
  ```
  Input:  factors = [2, -3, -2, 4]
  Output: 48
  Explanation: The two negative multipliers cancel out, so the whole list gives 2 * -3 * -2 * 4 = 48.
  ```

  ### Example 2
  ```
  Input:  factors = [-2, 0, -1]
  Output: 0
  Explanation: Every window that avoids the 0 has a negative product.
  ```

  ### Example 3
  ```
  Input:  factors = [-3]
  Output: -3
  Explanation: The window must contain at least one period.
  ```

  ### Constraints
  - `1 <= factors.length <= 10^4`
  - `-1000 <= factors[i] <= 1000`
  - The absolute value of the product of **any** contiguous window is at most `10^15`, so it fits in a
    64-bit integer (and exactly in a JavaScript number).

  **Follow-up:** How would you also return the start and end index of the best window?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_product_window
  params:
    - {name: factors, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_product_window(factors: list[int]) -> int:
        # high / low: largest and smallest product of a window ending at the current period
        best = high = low = factors[0]
        for factor in factors[1:]:
            if factor < 0:
                high, low = low, high  # a negative factor swaps the extremes
            high = max(factor, high * factor)
            low = min(factor, low * factor)
            best = max(best, high)
        return best
  javascript: |
    function maxProductWindow(factors) {
      let best = factors[0];
      let high = factors[0];
      let low = factors[0];
      for (let i = 1; i < factors.length; i++) {
        const factor = factors[i];
        if (factor < 0) [high, low] = [low, high];
        high = Math.max(factor, high * factor);
        low = Math.min(factor, low * factor);
        best = Math.max(best, high);
      }
      return best === 0 ? 0 : best; // normalise a negative zero
    }
