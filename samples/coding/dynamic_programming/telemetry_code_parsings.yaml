slug: telemetry_code_parsings
title: "Telemetry Code Parsings"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, network, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Telemetry Code Parsings

  A fleet of field devices reports status as a sequence of numeric codes. To save bandwidth the firmware
  sends the codes **concatenated with no separators**, so the gateway receives only a digit string. Every
  valid code is an integer between `1` and `max_code` inclusive, written in decimal **without leading
  zeros** (so a code never starts with the digit `0`, and `0` itself is not a code).

  Return the number of different ways to split `digits` into a sequence of valid codes, using every digit
  exactly once and keeping the original order. The count can be huge, so return it **modulo
  `1_000_000_007`**. If no split is valid, return `0`.

  ### Example 1
  ```
  Input:  digits = "31204", max_code = 120
  Output: 3
  Explanation: 3 | 1 | 20 | 4, 3 | 120 | 4 and 31 | 20 | 4. Any split that starts a code
  with the 0 is invalid, and 312 is larger than max_code.
  ```

  ### Example 2
  ```
  Input:  digits = "100", max_code = 99
  Output: 0
  Explanation: 100 exceeds max_code, and splitting would leave a code that starts with 0.
  ```

  ### Example 3
  ```
  Input:  digits = "2512", max_code = 25
  Output: 4
  Explanation: 2 | 5 | 1 | 2, 25 | 1 | 2, 2 | 5 | 12 and 25 | 12.
  ```

  ### Constraints
  - `1 <= digits.length <= 10^5`
  - `digits` contains only the characters `0` to `9`
  - `1 <= max_code <= 10^9`

  **Follow-up:** How would you return one valid split (or all of them, for short inputs) instead of the count?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_code_parsings
  params:
    - {name: digits, type: "string"}
    - {name: max_code, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_code_parsings(digits: str, max_code: int) -> int:
        MOD = 1_000_000_007
        longest = len(str(max_code))  # no valid code has more digits than max_code
        n = len(digits)
        ways = [0] * (n + 1)  # ways[i] = splits of the first i digits
        ways[0] = 1
        for end in range(1, n + 1):
            total = 0
            for length in range(1, min(longest, end) + 1):
                start = end - length
                if digits[start] == "0" or ways[start] == 0:
                    continue
                if int(digits[start:end]) <= max_code:
                    total += ways[start]
            ways[end] = total % MOD
        return ways[n]
  javascript: |
    function countCodeParsings(digits, maxCode) {
      const MOD = 1000000007;
      const longest = String(maxCode).length;
      const n = digits.length;
      const ways = new Array(n + 1).fill(0);
      ways[0] = 1;
      for (let end = 1; end <= n; end++) {
        let total = 0;
        for (let length = 1; length <= Math.min(longest, end); length++) {
          const start = end - length;
          if (digits[start] === "0" || ways[start] === 0) continue;
          if (Number(digits.slice(start, end)) <= maxCode) total += ways[start];
        }
        ways[end] = total % MOD;
      }
      return ways[n];
    }
tests:
  - {id: t1, args: ["31204", 120], expected: 3, description: "Example 1 - zero must stay inside a code"}
  - {id: t2, args: ["100", 99], expected: 0, description: "Example 2 - impossible input returns 0"}
  - {id: t3, args: ["2512", 25], expected: 4, description: "Example 3 - two-digit codes up to the limit"}
  - {id: t4, hidden: true, args: ["0", 9], expected: 0, description: "Single zero digit is never a code"}
  - {id: t5, hidden: true, args: ["7", 5], expected: 0, description: "Single digit above max_code"}
  - {id: t6, hidden: true, args: ["105", 100], expected: 1, description: "Leading-zero code 05 rejected and 105 above limit; only 10 | 5"}
  - {id: t7, hidden: true, args: ["1000000000", 1000000000], expected: 1, description: "Ten-digit code exactly equal to max_code at the upper bound"}
  - {id: t8, hidden: true, args: ["1000000001", 1000000000], expected: 1, description: "Run of zeros forces a single split; 1000000001 exceeds the limit"}
  - {id: t9, hidden: true, args: ["123456789", 1000000000], expected: 256, description: "No zeros and a huge limit: every one of the 2^8 compositions is valid"}
  - {id: t10, hidden: true, args: ["", 111], expected: 509672692, description: "1000 ones with codes up to 111: tribonacci-style growth, modulo required"}
expected_concepts:
  - "dynamic programming over prefixes"
  - "leading-zero and range validation of each piece"
  - "bounded look-back by the digit length of max_code"
  - "modular arithmetic for large counts"
optimal_complexity: {time: "O(n * d) where d is the number of digits of max_code (at most 10)", space: "O(n)"}
rubric:
  excellent: "Defines ways over prefixes, looks back at most as many digits as max_code has, rejects pieces that start with zero or exceed the limit, applies the modulus on every update, and explains why the recursion without memoisation is exponential."
  good: "Correct prefix DP with a small issue fixed during testing (for example the zero rule or forgetting the modulus), or a memoised recursion with the right complexity."
  weak: "Plain recursion without memoisation, hard-codes two-digit look-back, accepts codes with leading zeros or the code 0, or loses the count to overflow."
  criteria:
    correctness: "All tests pass, including zeros, limits at 10^9 and the long input that needs the modulus."
    efficiency: "Linear in the string length times the digit count of max_code."
    code_quality: "Clear state definition and a single place where a piece is validated."
    edge_cases: "Single zero, impossible inputs, codes equal to max_code and long runs of zeros."
    communication: "States the recurrence in words before coding and justifies the bounded look-back."
hints:
  - "Think about the last code in a valid split: the remaining prefix in front of it must itself be splittable."
  - "Let the count for a prefix depend on the counts of shorter prefixes. A code can never be longer than max_code written in decimal, so you only need to look back a few positions."
  - "Store the number of splits for each prefix length, starting with one way to split the empty prefix. For each end position try every piece length up to the digit count of max_code, skip pieces that begin with zero or exceed the limit, add the count of the prefix before the piece, and keep the sum reduced modulo the given prime."
followups:
  - "How would you reduce the memory to O(d) where d is the digit count of max_code?"
  - "What changes if codes may have leading zeros but must still be at most max_code?"
  - "How would you reconstruct one valid split for diagnostics?"
common_errors:
  - "Treating 0 or a piece like 05 as a valid code."
  - "Only looking back one or two digits regardless of max_code."
  - "Applying the modulus only at the end, which overflows in fixed-width integer languages."
  - "Recursing without memoisation, which is exponential on long inputs."
