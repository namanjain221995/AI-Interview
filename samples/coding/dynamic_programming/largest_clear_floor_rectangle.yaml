expected_concepts:
  - "per-row column heights of consecutive clear tiles ending at that row"
  - "reducing each row to the largest rectangle under a histogram"
  - "monotonic stack giving the nearest lower bar on each side"
  - "sentinel bar of height zero to flush the stack"
  - "O(rows * cols) overall instead of enumerating rectangles"
optimal_complexity: {time: "O(rows * cols)", space: "O(cols)"}
rubric:
  excellent: "Builds running column heights, solves the largest-rectangle-in-histogram subproblem with a monotonic stack for every row, explains the width computation and the sentinel, and states O(rows * cols) time with O(cols) memory."
  good: "Uses column heights with a quadratic per-row histogram scan (O(rows * cols^2)) or a correct but less tidy stack, with the right answer on all tests."
  weak: "Enumerates all rectangles and checks each one, or only finds the largest square or the largest single row run."
  criteria:
    correctness: "All tests pass, including a fully occupied grid, a single row and a single column."
    efficiency: "Linear in the number of tiles with the stack-based histogram step."
    code_quality: "Histogram step isolated or clearly commented; widths computed without off-by-one errors."
    edge_cases: "Single tile, one row or column, all clear, checkerboard and staircase shapes."
    communication: "Explains why each bar popped from the stack has its width bounded by the new top and the current index."
hints:
  - "Fix the bottom row of the rectangle. For every column, how many clear tiles are stacked directly above that row, including it? What shape does that list of numbers describe?"
  - "Each row turns into a histogram of column heights, and the best rectangle with its bottom edge on that row is the largest rectangle under the histogram. For each bar you need the nearest strictly lower bar on the left and on the right."
  - "Keep a stack of column indices whose heights increase. When the current height is not taller than the bar on top, pop it: its rectangle spans from just after the new stack top to just before the current column, and its area is that width times its height. Add a final bar of height zero so every bar is popped, update the heights row by row (reset to zero on an occupied tile) and keep the maximum area."
followups:
  - "How would you also return the rectangle's corners?"
  - "What changes if the staging area must be a square?"
  - "How would you handle a grid streamed one row at a time that does not fit in memory?"
  - "How would you count all-clear rectangles instead of finding the largest one?"
common_errors:
  - "Forgetting to reset a column height to zero on an occupied tile."
  - "Computing the width from the popped index instead of the new stack top, which undercounts."
  - "Not flushing the stack at the end of each row, missing rectangles that reach the right edge."
  - "Only checking squares or single rows."
