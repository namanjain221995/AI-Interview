version: 1
slug: load_threshold_trials
title: Load Threshold Trials
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, qa, sre, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Load Threshold Trials

  A hardware lab must certify the safe load rating of a new rack-mount rail. The test press can apply
  any whole load level from `1` to `levels`. The rail has an unknown **safe threshold** `T` with
  `0 <= T <= levels`: a rail tested at a level `<= T` holds and is undamaged, while a rail tested at a
  level `> T` fails and is destroyed. `T = 0` means it fails even at level `1`.

  You have `rigs` identical rails. One **test** puts a surviving rail on the press at a level you
  choose. A rail that holds can be reused for later tests; a rail that fails cannot. Every rail behaves
  the same, and you may choose each next level based on the outcomes seen so far.

  Return the **minimum number of tests** that guarantees you can determine `T` exactly, in the worst
  case, without running out of rails before `T` is known.

  ### Example 1
  ```
  Input:  rigs = 2, levels = 6
  Output: 3
  Explanation: Test level 3 first. If it fails, T is 0, 1 or 2 and the last rail checks levels 1
  then 2. If it holds, test level 5: a failure leaves only level 4 to check, a hold leaves only
  level 6. Every outcome is settled within 3 tests, and 2 tests cannot cover 6 levels.
  ```

  ### Example 2
  ```
  Input:  rigs = 1, levels = 4
  Output: 4
  Explanation: With a single rail you cannot risk skipping a level, so you test 1, 2, 3, 4 in order.
  ```

  ### Example 3
  ```
  Input:  rigs = 3, levels = 14
  Output: 4
  ```

  ### Constraints
  - `1 <= rigs <= 100`
  - `0 <= levels <= 10^4`
  - With `levels = 0` the answer is `0`: `T` is already known.

  **Follow-up:** Can you avoid an `O(rigs * levels^2)` dynamic programme over (rails, levels)?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_trials_to_find_threshold
  params:
    - {name: rigs, type: int}
    - {name: levels, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_trials_to_find_threshold(rigs: int, levels: int) -> int:
        # covered[k] = most levels that k rigs can resolve with the trials used so far
        covered = [0] * (rigs + 1)
        trials = 0
        while covered[rigs] < levels:
            trials += 1
            for k in range(rigs, 0, -1):
                covered[k] = covered[k - 1] + covered[k] + 1
        return trials
  javascript: |
    function minTrialsToFindThreshold(rigs, levels) {
      const covered = new Array(rigs + 1).fill(0);
      let trials = 0;
      while (covered[rigs] < levels) {
        trials++;
        for (let k = rigs; k >= 1; k--) {
          covered[k] = covered[k - 1] + covered[k] + 1;
        }
      }
      return trials;
    }
tests:
  - {id: t1, args: [2, 6], expected: 3, description: "Example 1"}
  - {id: t2, args: [1, 4], expected: 4, description: "Example 2 - one rail forces a level-by-level scan"}
  - {id: t3, args: [3, 14], expected: 4, description: "Example 3"}
  - {id: t4, hidden: true, args: [1, 0], expected: 0, description: "No levels to test: answer is 0"}
  - {id: t5, hidden: true, args: [4, 1], expected: 1, description: "Single level with plenty of rails"}
  - {id: t6, hidden: true, args: [2, 2], expected: 2, description: "Two levels and two rails: still needs 2 tests"}
  - {id: t7, hidden: true, args: [2, 100], expected: 14, description: "Two rails and 100 levels"}
  - {id: t8, hidden: true, args: [3, 1000], expected: 19, description: "Three rails and 1000 levels"}
  - {id: t9, hidden: true, args: [100, 10000], expected: 14, description: "More rails than useful: answer equals ceil(log2(levels + 1))"}
  - {id: t10, hidden: true, args: [1, 10000], expected: 10000, description: "One rail at the maximum level count (linear answer)"}
  - {id: t11, hidden: true, args: [5, 5000], expected: 16, description: "Five rails and 5000 levels"}
expected_concepts:
  - "worst-case (minimax) reasoning over the outcome of each test"
  - "inverting the question: how many levels t tests and k rails can resolve"
  - "recurrence covered(t, k) = covered(t - 1, k - 1) + covered(t - 1, k) + 1"
  - "one rail degenerates to a linear scan; many rails approach binary search"
  - "updating a one-dimensional table from the highest rail count downwards"
optimal_complexity: {time: "O(rigs * answer), where answer <= levels", space: "O(rigs)"}
rubric:
  excellent: "Frames the problem as a worst-case game, inverts it to 'levels coverable with t tests and k rails', derives the additive recurrence, implements it in O(rigs * answer) time with O(rigs) memory and explains why one rail forces a linear scan."
  good: "Builds a correct DP over (rails, levels) choosing the best first test level, possibly O(rigs * levels^2) or improved with binary search on the split, and handles levels = 0 and rigs = 1."
  weak: "Uses plain binary search (ignoring that rails run out), returns the average rather than worst case, or produces an exponential recursion without memoisation."
  criteria:
    correctness: "All tests pass, including levels = 0, one rail and many rails."
    efficiency: "Avoids the cubic DP; the inverted recurrence runs in O(rigs * answer)."
    code_quality: "Clear names for tests used, rails and coverable levels; the update order is deliberate."
    edge_cases: "levels = 0, levels = 1, a single rail and more rails than useful."
    communication: "Explains the failure and survival branches and why their coverage adds up."
hints:
  - "Think about the worst case: after any test, the outcome you are least happy with decides how many more tests you need. Is there a different quantity that is easier to reason about than tests needed for a given number of levels?"
  - "Ask the inverse question: with t tests and k rails, what is the largest number of levels you can fully resolve? After the first test, a failure leaves t minus 1 tests and k minus 1 rails below that level, and a hold leaves t minus 1 tests and k rails above it."
  - "The levels coverable with t tests and k rails equal the coverage of the failure branch plus the coverage of the survival branch plus one for the tested level. Keep a one-dimensional table indexed by rail count, and for each additional test update it from the highest rail count down to one; return the first test count at which the entry for all your rails reaches the number of levels."
followups:
  - "Why does plain binary search fail when you only have two rails?"
  - "How would you also report which level to test first?"
  - "What is the answer's growth rate when rigs is at least log2(levels + 1)?"
  - "How would you adapt the approach if a test that holds also had a small chance of weakening the rail?"
common_errors:
  - "Using binary search and ignoring that failed rails are lost."
  - "Off-by-one on the range of T, forgetting that T can be 0 or equal to levels."
  - "Updating the one-dimensional table from low to high rail counts, which reuses values from the current test."
  - "Implementing the O(rigs * levels^2) DP and timing out at levels = 10^4."
