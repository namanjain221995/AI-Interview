version: 1
slug: fence_post_status_colorings
title: Fence Post Status Colorings
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, frontend, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Fence Post Status Colorings

  A data-centre yard has `n` status lamps mounted on consecutive fence posts. Each lamp is lit in one of
  `k` colours. To keep the pattern readable from a distance, **no three consecutive lamps may share the
  same colour** (two neighbours with the same colour are fine).

  Two colourings are different when at least one lamp has a different colour. Return the number of valid
  colourings, **modulo `1_000_000_007`** (10^9 + 7).

  ### Example 1
  ```
  Input:  n = 3, k = 2
  Output: 6
  Explanation: of the 2^3 = 8 colourings, only the two where all three lamps share a colour are invalid.
  ```

  ### Example 2
  ```
  Input:  n = 4, k = 3
  Output: 66
  ```

  ### Example 3
  ```
  Input:  n = 1, k = 5
  Output: 5
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `1 <= k <= 10^5`
  - The answer is returned modulo `10^9 + 7`; use 64-bit arithmetic for intermediate products.

  **Follow-up:** can you solve it in O(n) time and O(1) extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_fence_colorings
  params:
    - {name: n, type: "int"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_fence_colorings(n: int, k: int) -> int:
        mod = 1_000_000_007
        same, diff = 0, k % mod  # last two lamps equal / last two lamps different
        for _ in range(2, n + 1):
            same, diff = diff, (same + diff) * (k - 1) % mod
        return (same + diff) % mod
  javascript: |
    function countFenceColorings(n, k) {
      const MOD = 1000000007;
      let same = 0;
      let diff = k % MOD;
      for (let i = 2; i <= n; i++) {
        const nextDiff = ((same + diff) % MOD) * (k - 1) % MOD;
        same = diff;
        diff = nextDiff;
      }
      return (same + diff) % MOD;
    }
tests:
  - {id: t1, args: [3, 2], expected: 6, description: "Example 1"}
  - {id: t2, args: [4, 3], expected: 66, description: "Example 2"}
  - {id: t3, args: [1, 5], expected: 5, description: "Example 3 - single lamp"}
  - {id: t4, hidden: true, args: [1, 1], expected: 1, description: "Single lamp, single colour"}
  - {id: t5, hidden: true, args: [2, 1], expected: 1, description: "Two lamps may share the only colour"}
  - {id: t6, hidden: true, args: [3, 1], expected: 0, description: "Three lamps with one colour is impossible; answer 0"}
  - {id: t7, hidden: true, args: [2, 5], expected: 25, description: "Two lamps: every pair is valid (k squared)"}
  - {id: t8, hidden: true, args: [5, 2], expected: 16, description: "Two colours over five lamps"}
  - {id: t9, hidden: true, args: [50, 10], expected: 98786772, description: "Count far beyond 64 bits before the modulo"}
  - {id: t10, hidden: true, args: [100000, 100000], expected: 948181920, description: "Maximum n and k; needs modular arithmetic without intermediate overflow"}
expected_concepts:
  - "state split by whether the last two lamps match"
  - "transitions: a matching pair only from a differing pair; a differing pair from any valid colouring times k - 1"
  - "modular arithmetic with 64-bit intermediates"
  - "constant-memory rolling state"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines the two states clearly, derives both transitions with a justification, handles k = 1 and n = 1, reduces modulo safely with 64-bit intermediates and states O(n) time and O(1) space."
  good: "Correct DP (possibly with a table, or the single recurrence total(i) = (k - 1) * (total(i - 1) + total(i - 2))) with minor prompting on base cases."
  weak: "Brute-force enumeration of colourings, a recurrence that allows three equal lamps, or overflow from missing modular reduction."
  criteria:
    correctness: "All tests pass, including k = 1 and the maximum inputs."
    efficiency: "Linear in n with constant memory."
    code_quality: "State variables named after their meaning and a named modulus."
    edge_cases: "n = 1, n = 2, k = 1 (answer 0 from three lamps on) and very large counts."
    communication: "Explains why the matching state can only grow from the differing state."
hints:
  - "Whether the next lamp may repeat the previous colour depends only on whether the last two lamps already match."
  - "Split the valid colourings of the first i lamps into those whose last two lamps share a colour and those whose last two lamps differ, and work out how each group extends by one more lamp."
  - "A colouring ending in a matching pair comes only from one ending in a differing pair by repeating its last colour, while a colouring ending in a differing pair comes from any valid colouring of one fewer lamp using one of the k minus 1 other colours; start from k differing and zero matching for one lamp, iterate to n and return the sum modulo 10^9 + 7."
followups:
  - "How does the state space change if the rule were no four consecutive lamps of the same colour?"
  - "How could you compute the answer for n up to 10^18?"
  - "Can you express the answer as a single recurrence on the total count?"
  - "What if certain colours were not allowed next to each other?"
common_errors:
  - "Allowing three equal lamps by forgetting the matching-pair state."
  - "Getting the n = 1 or n = 2 base cases wrong."
  - "Overflowing a 32-bit integer when multiplying by k - 1 before taking the modulo."
  - "Returning k for k = 1 and n >= 3 instead of 0."
