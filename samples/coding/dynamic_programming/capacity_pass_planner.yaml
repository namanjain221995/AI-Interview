expected_concepts:
  - "DP over usage-day indices rather than calendar days"
  - "a pass only needs to start on a usage day"
  - "binary search or a moving pointer for the first day not covered"
  - "64-bit accumulation of costs"
  - "considering every pass type at every step"
optimal_complexity: {time: "O(n * k * log n)", space: "O(n)"}
rubric:
  excellent: "Argues that passes can always start on a usage day, defines the DP over day indices, finds the next uncovered day with binary search or per-type pointers, uses 64-bit costs and explains O(n * k log n) (or O(n * k)) time independent of the calendar span."
  good: "Correct DP with the right recurrence; may iterate over calendar days when days are small or scan linearly for the next uncovered day."
  weak: "Greedy choice of the cheapest-per-day pass, a DP over calendar days up to 10^9, or 32-bit overflow on the total."
  criteria:
    correctness: "All tests pass, including single days, one pass type and totals above 2^31."
    efficiency: "Work depends on the number of usage days and pass types, not on the largest day number."
    code_quality: "Clear separation of the recurrence and the next-index search; no magic sentinel collisions."
    edge_cases: "One usage day, huge durations, days far apart and passes that are never worth buying."
    communication: "Explains why the start day of a pass can be fixed to a usage day without losing optimality."
hints:
  - "Look at the earliest usage day that is not yet covered: some pass must cover it, and starting that pass any earlier than that day never helps."
  - "Define the cheapest cost to cover all usage days from index i onwards. Trying each pass type starting on days[i] tells you the first usage day that is still uncovered afterwards."
  - "Fill the costs from the last usage day back to the first, with zero cost after the end. For each index, for each pass type, find the first usage day at or beyond the current day plus the duration (binary search works because the days are sorted), and take the price plus the cost from that index; keep the minimum. Use 64-bit totals and return the cost at index zero."
followups:
  - "How would you return which passes to buy and on which days?"
  - "If days were small (at most 365), how would a calendar-day DP compare?"
  - "How can you replace the binary search with pointers that only move forward?"
  - "What changes if each pass type can be bought at most a limited number of times?"
common_errors:
  - "Choosing the pass with the lowest price per day greedily."
  - "Iterating over every calendar day up to 10^9 instead of the usage days."
  - "Off-by-one in the coverage window (a pass of length L bought on day d covers through d + L - 1)."
  - "Accumulating the total in a 32-bit integer."
  - "Hard-coding three pass types instead of looping over the given types."
