slug: capacity_pass_planner
title: Capacity Pass Planner
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, cloud, devops, data_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## Capacity Pass Planner

  A team runs a nightly load test on a shared GPU cluster, but only on certain days. Those days are given
  in `days` as **strictly increasing** day numbers. Cluster time is sold as **capacity passes**: pass type
  `j` costs `prices[j]` and, when bought on day `d`, covers the `durations[j]` consecutive days
  `d, d + 1, ..., d + durations[j] - 1`. Any pass type can be bought any number of times, on any day.

  Every day listed in `days` must be covered by at least one pass; other days do not matter. Return the
  **minimum total cost** of passes that covers all of them. The total can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  days = [1, 2, 3, 8, 20], durations = [1, 7], prices = [4, 15]
  Output: 20
  Explanation: Five 1-day passes cost 5 * 4 = 20. A 7-day pass on day 1 (15) would only replace three daily passes (12), so it never pays off.
  ```

  ### Example 2
  ```
  Input:  days = [1, 3, 5, 6, 7, 30], durations = [1, 7, 30], prices = [3, 9, 20]
  Output: 12
  Explanation: A 7-day pass on day 1 covers days 1, 3, 5, 6 and 7 for 9; a 1-day pass on day 30 costs 3. Total 12, cheaper than one 30-day pass (20).
  ```

  ### Constraints
  - `1 <= days.length <= 10^4`
  - `1 <= days[i] <= 10^9`, and `days` is strictly increasing
  - `1 <= durations.length == prices.length <= 10`
  - `1 <= durations[j] <= 10^9`
  - `1 <= prices[j] <= 10^9`

  **Follow-up:** Can you make the work per usage day independent of how far apart the days are?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_capacity_pass_cost
  params:
    - {name: days, type: "int[]"}
    - {name: durations, type: "int[]"}
    - {name: prices, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def min_capacity_pass_cost(days: list[int], durations: list[int], prices: list[int]) -> int:
        n = len(days)
        # cost[i]: cheapest way to cover days[i:]; buying a pass on days[i] is never worse than earlier.
        cost = [0] * (n + 1)
        for i in range(n - 1, -1, -1):
            best = None
            for length, price in zip(durations, prices):
                nxt = bisect_left(days, days[i] + length, i + 1)
                candidate = price + cost[nxt]
                if best is None or candidate < best:
                    best = candidate
            cost[i] = best
        return cost[0]
  javascript: |
    function minCapacityPassCost(days, durations, prices) {
      const n = days.length;
      const cost = new Array(n + 1).fill(0);
      const firstAtLeast = (target, lo) => {
        let hi = n;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (days[mid] < target) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      for (let i = n - 1; i >= 0; i--) {
        let best = Infinity;
        for (let j = 0; j < durations.length; j++) {
          const candidate = prices[j] + cost[firstAtLeast(days[i] + durations[j], i + 1)];
          if (candidate < best) best = candidate;
        }
        cost[i] = best;
      }
      return cost[0];
    }
