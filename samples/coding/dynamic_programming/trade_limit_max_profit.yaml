expected_concepts:
  - "DP over day, trades used and holding / not-holding state"
  - "rolling arrays per trade count"
  - "shortcut when k >= n / 2: sum of all positive day-to-day changes"
  - "O(n * k) time and O(k) space"
optimal_complexity: {time: "O(n * min(k, n))", space: "O(k)"}
rubric:
  excellent: "Defines holding/not-holding states per trade count, updates them in the right order with rolling arrays, adds the k >= n / 2 shortcut, handles empty input and k = 0, and states O(n * k) time and O(k) space."
  good: "Correct DP with an n by k table (or O(n^2 k) variant) and correct base cases, possibly missing the large-k shortcut."
  weak: "Greedily picks the k largest individual rises, ignores the one-unit rule, or uses exponential recursion without memoisation."
  criteria:
    correctness: "All tests pass, including k = 0, empty prices and cases where rises must be merged."
    efficiency: "O(n * k) with the unlimited-trading shortcut for large k."
    code_quality: "States are named for what they represent (holding, flat) and initialised explicitly."
    edge_cases: "Empty and single-day input, flat prices, k far larger than n."
    communication: "Explains why picking the k biggest separate rises is not always optimal."
hints:
  - "On any given day, what are the possible situations the strategy can be in, and what do you need to remember about the past to decide the next move?"
  - "Track the best cash balance for each number of trades used, separately for 'currently holding a unit' and 'not holding'. A buy moves from not-holding to holding and a sell moves back."
  - "For each price and each trade count t from one to k, the best holding balance is the better of keeping it or buying today from the not-holding balance with t minus one trades, and the best not-holding balance is the better of keeping it or selling today from the holding balance with t trades. When k is at least half the number of days, just add up every positive day-to-day increase instead."
followups:
  - "How would you add a fixed fee per completed trade?"
  - "What changes if the strategy must wait one day after selling before buying again?"
  - "How would you reconstruct the actual buy and sell days?"
  - "Can you solve the unlimited-k case in O(n) time and O(1) space, and why does it work?"
common_errors:
  - "Summing the k largest individual rises, which can double-count or miss merged trades."
  - "Allocating an n by k table when k is huge instead of using the unlimited-trades shortcut."
  - "Initialising the holding state to zero instead of negative infinity."
  - "Allowing a buy before the previous unit is sold."
