title: Trade Limit Maximum Profit
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist]
time_limit_minutes: 30
prompt_markdown: |
  ## Trade Limit Maximum Profit

  A backtesting service replays the daily closing prices of a single asset: `prices[d]` is the price on
  day `d`. A strategy under test follows two risk rules:

  - it holds **at most one unit** at any time, so it must sell before it can buy again;
  - it completes **at most `k` trades**, where a trade is one buy followed by one sell on a later day.

  Selling and buying again on the same day is allowed (it simply starts the next trade). Return the
  **maximum total profit** the strategy can achieve. If no trade can make money, return `0` (the strategy
  does nothing).

  ### Example 1
  ```
  Input:  prices = [3, 8, 2, 6, 1, 9], k = 2
  Output: 13
  Explanation: Buy at 3, sell at 8 (+5); buy at 1, sell at 9 (+8).
  ```

  ### Example 2
  ```
  Input:  prices = [3, 8, 2, 6, 1, 9], k = 1
  Output: 8
  ```

  ### Example 3
  ```
  Input:  prices = [9, 7, 4, 1], k = 3
  Output: 0
  ```

  ### Constraints
  - `0 <= prices.length <= 1000`
  - `0 <= k <= 100`
  - `0 <= prices[d] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_profit_k_trades
  params:
    - {name: prices, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_profit_k_trades(prices: list[int], k: int) -> int:
        n = len(prices)
        if n < 2 or k == 0:
            return 0
        if 2 * k >= n:
            # The trade limit cannot bind: take every upward move.
            return sum(max(0, prices[d + 1] - prices[d]) for d in range(n - 1))
        neg_inf = float("-inf")
        holding = [neg_inf] * (k + 1)  # best cash while holding, with t trades started
        flat = [0] * (k + 1)  # best cash while not holding, with t trades completed
        for price in prices:
            for t in range(1, k + 1):
                holding[t] = max(holding[t], flat[t - 1] - price)
                flat[t] = max(flat[t], holding[t] + price)
        return max(flat)
  javascript: |
    function maxProfitKTrades(prices, k) {
      const n = prices.length;
      if (n < 2 || k === 0) return 0;
      if (2 * k >= n) {
        let total = 0;
        for (let d = 0; d + 1 < n; d++) total += Math.max(0, prices[d + 1] - prices[d]);
        return total;
      }
      const holding = new Array(k + 1).fill(-Infinity);
      const flat = new Array(k + 1).fill(0);
      for (const price of prices) {
        for (let t = 1; t <= k; t++) {
          holding[t] = Math.max(holding[t], flat[t - 1] - price);
          flat[t] = Math.max(flat[t], holding[t] + price);
        }
      }
      return Math.max(...flat);
    }
