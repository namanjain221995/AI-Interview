expected_concepts:
  - "an optimal plan only orders when stock has run out, so each order covers a block of consecutive periods"
  - "dynamic programming over prefixes: best cost when the stock is empty after period i - 1"
  - "incremental holding cost when the covering order moves one period earlier"
  - "zero-demand periods need no order"
  - "O(n^2) time, O(n) space, 64-bit totals"
optimal_complexity: {time: "O(n^2)", space: "O(n)"}
rubric:
  excellent: "Argues that an order should arrive only when stock is empty, so orders cover consecutive blocks; defines the prefix state, enumerates the period of the last order, updates holding cost incrementally for O(n^2), handles zero demand and 64-bit totals."
  good: "Correct block dynamic programming, possibly O(n^3) by recomputing holding costs, or with minor prompting on zero-demand periods."
  weak: "Greedy rules such as ordering whenever holding exceeds the order cost locally, ordering every period, or enumerating every subset of order periods."
  criteria:
    correctness: "All tests pass, including empty input, all-zero demand and free ordering or holding."
    efficiency: "Quadratic time with constant work per transition."
    code_quality: "Clear names for the prefix cost array, the running holding cost and the units still to be served."
    edge_cases: "Empty input, zero-demand periods before the first order, zero costs and totals beyond 32 bits."
    communication: "Explains why carrying stock into a period where a new order is placed is never cheaper."
hints:
  - "If you place an order while units are still in stock, could you have ordered those units in the new order instead and paid less holding?"
  - "That means each order serves a block of consecutive periods and stock is empty when the next order arrives. Compute the best cost for every prefix of periods by choosing in which period the last order was placed."
  - "Keep an array of best costs for the first i periods. For each i, try every period j for the last order: its cost is the best cost before j plus the order cost plus the holding for periods j through i - 1, where each unit demanded in period t waits t - j periods. Walk j backwards and update the holding total by adding the units demanded after j times the holding cost. If period i - 1 has no demand, also allow skipping it with no order."
followups:
  - "How would you return the periods in which orders are placed?"
  - "What changes if each period has its own order cost and holding cost?"
  - "How would you handle a warehouse capacity limit on stock?"
  - "What if late delivery (backorders) is allowed at a per-unit-per-period penalty?"
common_errors:
  - "Ordering exactly each period's demand without considering combined orders."
  - "Charging holding cost for the units shipped in the period they arrive."
  - "Requiring an order in periods with zero demand."
  - "Recomputing holding costs from scratch for every pair of periods, or overflowing 32-bit totals."
