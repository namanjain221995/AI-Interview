time_limit_minutes: 25
prompt_markdown: |
  ## Inventory Reorder Plan

  A warehouse plans replenishment of a single product over `n` consecutive periods. `demand[i]` units are
  shipped to customers during period `i`, and every unit of demand must be shipped in its own period (no
  backorders and no lost sales).

  - Stock is `0` before period `0`.
  - At the start of any period you may place **one order of any quantity**. It costs a flat `order_cost`
    no matter how many units it contains and arrives immediately, in time for that period's shipments.
  - Every unit still in stock **at the end of a period** costs `holding_cost` for that period.

  Return the **minimum total cost** (ordering plus holding) of a plan that meets all demand. With no
  demand at all the answer is `0`.

  ### Example 1
  ```
  Input:  demand = [20, 30, 10], order_cost = 50, holding_cost = 1
  Output: 100
  Explanation: One order of 60 units in period 0 costs 50. 40 units remain at the end of period 0 and 10 at the end of period 1, so holding costs 40 + 10 = 50. Total 100; ordering every period would cost 150.
  ```

  ### Example 2
  ```
  Input:  demand = [10, 0, 10], order_cost = 15, holding_cost = 2
  Output: 30
  Explanation: Ordering 10 units in periods 0 and 2 costs 15 + 15 = 30. A single order in period 0 would hold 10 units for two periods: 15 + 10 * 2 * 2 = 55.
  ```

  ### Constraints
  - `0 <= demand.length <= 1000`
  - `0 <= demand[i] <= 10^4`
  - `0 <= order_cost <= 10^9`
  - `0 <= holding_cost <= 10^4`

  **Follow-up:** the total can exceed the 32-bit range; use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
