reference_solutions:
  python: |
    def min_inventory_cost(demand: list[int], order_cost: int, holding_cost: int) -> int:
        n = len(demand)
        # best[i] = minimum cost to serve periods 0..i-1 and finish period i-1 with empty stock
        best = [0] * (n + 1)
        for i in range(1, n + 1):
            options = []
            if demand[i - 1] == 0:
                options.append(best[i - 1])  # nothing to serve, no order needed
            holding = 0  # holding cost if one order at period j covers periods j..i-1
            later_units = 0  # units demanded in periods j+1..i-1
            for j in range(i - 1, -1, -1):
                holding += later_units * holding_cost  # those units now wait one more period
                options.append(best[j] + order_cost + holding)
                later_units += demand[j]
            best[i] = min(options)
        return best[n]
  javascript: |
    function minInventoryCost(demand, orderCost, holdingCost) {
      const n = demand.length;
      const best = new Array(n + 1).fill(0);
      for (let i = 1; i <= n; i++) {
        let result = demand[i - 1] === 0 ? best[i - 1] : Infinity;
        let holding = 0;
        let laterUnits = 0;
        for (let j = i - 1; j >= 0; j--) {
          holding += laterUnits * holdingCost;
          const cost = best[j] + orderCost + holding;
          if (cost < result) result = cost;
          laterUnits += demand[j];
        }
        best[i] = result;
      }
      return best[n];
    }
