version: 1
slug: min_starting_battery
title: Minimum Starting Battery
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, mobile, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Minimum Starting Battery

  A warehouse robot crosses a rectangular floor plan `grid` from the **top-left** cell to the
  **bottom-right** cell, moving only **right** or **down** one cell at a time. Each cell holds a signed
  energy value: entering a charging pad (positive value) adds that much charge, and entering a cell with a
  negative value (a ramp, a heavy load) drains that much. A zero cell changes nothing.

  The robot starts with some integer charge `S`. The value of **every** cell on its route is applied when
  the robot enters it, **including the starting cell and the destination cell**. After each cell is
  applied the charge must be **at least 1**; at 0 or below the robot shuts down. The battery has no upper
  limit.

  The robot may choose its route. Return the **minimum** starting charge `S` (always at least `1`) for which
  some route keeps the robot running all the way to the bottom-right cell.

  ### Example 1
  ```
  Input:  grid = [[-3, 2, -4], [-6, -2, 5], [4, -9, -1]]
  Output: 4
  Explanation: Route right, down, right, down applies -3, 2, -2, 5, -1. Starting with 4 the charge goes 1, 3, 1, 6, 5.
  ```

  ### Example 2
  ```
  Input:  grid = [[4]]
  Output: 1
  Explanation: The charge must be at least 1 at all times, so the answer is never below 1.
  ```

  ### Example 3
  ```
  Input:  grid = [[0, -4], [-1, 0]]
  Output: 2
  Explanation: Going down first passes 0, -1, 0; starting with 2 the charge stays at 2, 1, 1.
  ```

  ### Constraints
  - `1 <= rows, cols <= 100` (`rows = grid.length`, `cols = grid[0].length`, all rows the same length)
  - `-1000 <= grid[r][c] <= 1000`

  **Follow-up:** Can you solve it with a single row of extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_starting_battery
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_starting_battery(grid: list[list[int]]) -> int:
        rows, cols = len(grid), len(grid[0])
        inf = float("inf")
        # need[c]: minimum charge required when about to enter cell (r, c), filled bottom-up.
        need = [inf] * (cols + 1)
        for r in range(rows - 1, -1, -1):
            for c in range(cols - 1, -1, -1):
                if r == rows - 1 and c == cols - 1:
                    after = 1
                else:
                    after = min(need[c], need[c + 1])  # below (old need[c]) or to the right
                need[c] = max(1, after - grid[r][c])
        return int(need[0])
  javascript: |
    function minStartingBattery(grid) {
      const rows = grid.length;
      const cols = grid[0].length;
      const need = new Array(cols + 1).fill(Infinity);
      for (let r = rows - 1; r >= 0; r--) {
        for (let c = cols - 1; c >= 0; c--) {
          const after = r === rows - 1 && c === cols - 1 ? 1 : Math.min(need[c], need[c + 1]);
          need[c] = Math.max(1, after - grid[r][c]);
        }
      }
      return need[0];
    }
