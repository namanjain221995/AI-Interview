expected_concepts:
  - "working backwards from the destination"
  - "requirement at a cell = max(1, best requirement of the next cell minus this cell's value)"
  - "why a forward DP on accumulated charge alone is not enough"
  - "clamping the requirement at 1"
  - "single-row rolling array"
optimal_complexity: {time: "O(rows * cols)", space: "O(cols)"}
rubric:
  excellent: "Explains why a forward pass on accumulated charge fails, derives the backward requirement recurrence with the clamp at 1, applies the start and destination cells correctly and reduces memory to one row in O(rows * cols) time."
  good: "Correct backward table in O(rows * cols) time and memory, possibly after a hint about the direction of the recurrence."
  weak: "Tries a forward DP on maximum remaining charge, enumerates all routes, ignores the starting cell, or forgets the minimum of 1."
  criteria:
    correctness: "All tests pass, including single cells, forced single-row or single-column routes and all-negative grids."
    efficiency: "Each cell is processed once; no route enumeration."
    code_quality: "Boundary cells handled cleanly, for example with a sentinel instead of many special cases."
    edge_cases: "Positive start cell, positive destination, zero cells and 1xN or Nx1 grids."
    communication: "Shows with a small counterexample why the two goals (most charge left and least charge needed) differ."
hints:
  - "Tracking only the charge left at each cell going forward loses information: a route can end with more charge but dip lower along the way. Consider which direction makes the requirement easy to state."
  - "Work backwards from the destination: if you know the minimum charge needed when about to enter each neighbour you could move to, you can derive what is needed when about to enter the current cell."
  - "Fill a table from the bottom-right cell back to the top-left. On arrival at the destination the robot needs 1 after the cell is applied; for any cell, take the smaller requirement of the cell below and the cell to the right, subtract this cell's value and clamp the result to at least 1. The answer is the value at the top-left, and one row of the table is enough."
followups:
  - "Why does a forward DP that maximises the remaining charge give wrong answers? Construct a small example."
  - "How would you also return the route that achieves the minimum starting charge?"
  - "If the battery had a maximum capacity, how would the problem change?"
  - "Could you binary search the starting charge instead, and what would each check cost?"
common_errors:
  - "Running the DP forwards on accumulated charge and taking the best final value."
  - "Forgetting to apply the starting cell or the destination cell."
  - "Not clamping the requirement at 1, which allows a big charging pad to cancel an earlier shutdown."
  - "Mixing up the right and down neighbours at the last row or column."
  - "Returning 0 instead of 1 when the whole route is positive."
