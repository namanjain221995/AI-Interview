expected_concepts:
  - "the final merge splits the row into a left block and a right block"
  - "interval DP over (first segment, last segment)"
  - "prefix sums for the size of a range in O(1)"
  - "why Huffman coding does not apply when merges must be adjacent"
  - "Knuth's optimisation to O(n^2) as a follow-up"
optimal_complexity: {time: "O(n^3), or O(n^2) with Knuth's optimisation", space: "O(n^2)"}
rubric:
  excellent: "Observes that the final merge splits the row, defines interval costs with prefix-sum range totals, fills by increasing length, uses 64-bit arithmetic, explains why a Huffman heap is wrong here, and mentions Knuth's O(n^2) optimisation."
  good: "Correct O(n^3) interval DP or memoised recursion with prefix sums."
  weak: "Repeatedly merges the cheapest adjacent pair, uses a Huffman heap ignoring adjacency, or overflows 32-bit totals."
  criteria:
    correctness: "All tests pass, including the non-adjacent-smallest case and the 32-bit overflow case."
    efficiency: "O(n^3) or better with O(1) range sums."
    code_quality: "Prefix sums and DP table have documented meaning; base case is explicit."
    edge_cases: "One and two segments, equal sizes, very large sizes."
    communication: "Explains why greedy adjacent merging is not optimal with a concrete counterexample or argument."
hints:
  - "Look at the very last merge the job performs. What were the two segments it combined, in terms of the original row?"
  - "The last merge combines everything left of some split point with everything right of it, and its cost is always the total size of the whole range, whatever happened before."
  - "Let the cost of a range from i to j be the minimum over every split point k of the cost of i to k plus the cost of k plus one to j, plus the total size of i to j taken from prefix sums. A single segment costs zero; fill by increasing range length and use 64-bit totals."
followups:
  - "Why does a Huffman-style priority queue give the wrong answer here?"
  - "How does Knuth's optimisation reduce the time to O(n^2), and why does it apply?"
  - "What changes if a merge may combine three adjacent segments at once?"
  - "How would you reconstruct the merge order for the compaction job?"
common_errors:
  - "Using a min-heap to merge the two smallest segments regardless of adjacency."
  - "Greedily merging the cheapest adjacent pair at each step."
  - "Recomputing range totals with a loop inside the DP instead of prefix sums."
  - "Overflowing 32-bit integers on large sizes."
