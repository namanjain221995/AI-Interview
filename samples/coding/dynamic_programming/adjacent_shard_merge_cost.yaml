slug: adjacent_shard_merge_cost
title: Adjacent Shard Merge Cost
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, dba, data, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Adjacent Shard Merge Cost

  A time-series store keeps a row of segment files ordered by time; `sizes[i]` is the size of segment `i`.
  A compaction job repeatedly picks **two adjacent segments** and rewrites them as one segment whose size
  is their sum. Each merge costs the combined size of the two segments (the bytes rewritten). The new
  segment takes their place, so time order is preserved, and the job continues until a single segment
  remains.

  Return the **minimum total cost** to compact everything into one segment. A single segment needs no
  merges, so the answer is `0`.

  ### Example 1
  ```
  Input:  sizes = [4, 1, 3]
  Output: 12
  Explanation: Merge 1 and 3 (cost 4) into [4, 4], then merge those (cost 8). Merging 4 and 1 first costs 5 + 8 = 13.
  ```

  ### Example 2
  ```
  Input:  sizes = [9]
  Output: 0
  ```

  ### Constraints
  - `1 <= sizes.length <= 200`
  - `1 <= sizes[i] <= 10^9`
  - The answer can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_adjacent_merge_cost
  params:
    - {name: sizes, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def min_adjacent_merge_cost(sizes: list[int]) -> int:
        n = len(sizes)
        prefix = [0]
        for size in sizes:
            prefix.append(prefix[-1] + size)
        # cost[i][j] = cheapest way to merge segments i..j into one
        cost = [[0] * n for _ in range(n)]
        for length in range(2, n + 1):
            for i in range(n - length + 1):
                j = i + length - 1
                cost[i][j] = min(cost[i][k] + cost[k + 1][j] for k in range(i, j)) + prefix[j + 1] - prefix[i]
        return cost[0][n - 1]
  javascript: |
    function minAdjacentMergeCost(sizes) {
      const n = sizes.length;
      const prefix = [0];
      for (const size of sizes) prefix.push(prefix[prefix.length - 1] + size);
      const cost = Array.from({ length: n }, () => new Array(n).fill(0));
      for (let length = 2; length <= n; length++) {
        for (let i = 0; i + length - 1 < n; i++) {
          const j = i + length - 1;
          let best = Infinity;
          for (let k = i; k < j; k++) {
            const c = cost[i][k] + cost[k + 1][j];
            if (c < best) best = c;
          }
          cost[i][j] = best + prefix[j + 1] - prefix[i];
        }
      }
      return cost[0][n - 1];
    }
