expected_concepts:
  - "fix a pair of rows (top, bottom) and collapse them into column sums"
  - "Kadane's maximum subarray on the collapsed row"
  - "iterate over the smaller dimension squared"
  - "64-bit accumulation for large sums"
  - "non-empty block when every value is negative"
optimal_complexity: {time: "O(min(R, C)^2 * max(R, C))", space: "O(max(R, C))"}
rubric:
  excellent: "Reduces to 1D by fixing a row band and accumulating column sums incrementally, applies Kadane correctly for all-negative input, iterates over the smaller dimension, uses 64-bit sums and states O(min^2 * max) time."
  good: "Correct row-band plus Kadane solution or a 2D prefix-sum O(R^2 C^2) solution with a clear path to improving it."
  weak: "Brute force over all blocks with inner summation, returns 0 for all-negative grids, or overflows 32-bit sums."
  criteria:
    correctness: "All tests pass, including all-negative grids and sums above 2^31."
    efficiency: "O(R^2 * C) or better; column sums are extended rather than recomputed."
    code_quality: "Kadane is a clear helper or loop; names like top, bottom and column_sums."
    edge_cases: "Single cell, single row, single column, extremes of the value range."
    communication: "Explains the reduction from 2D to repeated 1D maximum subarray."
hints:
  - "Solve the one-dimensional version first: the best sum of a consecutive run in a single row."
  - "If you fix which rows the block spans, every column contributes a single number to the block. What problem does that leave you with?"
  - "Loop over a top row, then extend a bottom row downward while adding each row into a running array of column sums; after each extension run Kadane's maximum subarray on those column sums, starting fresh whenever the running sum goes negative, and keep the best value seen. Use 64-bit totals."
followups:
  - "How would you also return the coordinates of the best block?"
  - "Why should you iterate over the smaller dimension in the outer loops?"
  - "What if the block had to be a square?"
  - "How would you answer many queries for the sum of arbitrary blocks quickly?"
common_errors:
  - "Starting Kadane at 0 and returning 0 for an all-negative grid."
  - "Recomputing each column band sum from scratch for every bottom row."
  - "Using 32-bit accumulators so large grids overflow."
  - "Mixing up row and column indices after transposing."
