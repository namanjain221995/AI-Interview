title: Maximum Sum Floor Region
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, data, data_analyst, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Maximum Sum Floor Region

  A retail analytics team splits a store floor into a grid of cells. `grid[r][c]` is the net weekly profit
  of the shelving in that cell; it can be negative when the shelving loses money. The team wants to
  re-theme one **rectangular block** of cells: a non-empty set of consecutive rows combined with a
  non-empty set of consecutive columns.

  Return the **largest total profit** of any such block. The block must contain at least one cell, so if
  every cell is negative the answer is the least negative cell.

  ### Example 1
  ```
  Input:  grid = [[1, -2, 3], [-4, 5, 6], [2, -1, -3]]
  Output: 12
  Explanation: Rows 0..1 and columns 1..2 hold -2 + 3 + 5 + 6 = 12.
  ```

  ### Example 2
  ```
  Input:  grid = [[-3, -1], [-2, -5]]
  Output: -1
  ```

  ### Constraints
  - `1 <= grid.length, grid[r].length <= 60` (all rows have the same length)
  - `-10^9 <= grid[r][c] <= 10^9`
  - The answer can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_sum_region
  params:
    - {name: grid, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_sum_region(grid: list[list[int]]) -> int:
        rows, cols = len(grid), len(grid[0])
        if rows > cols:
            grid = [list(column) for column in zip(*grid)]
            rows, cols = cols, rows
        best = grid[0][0]
        for top in range(rows):
            column_sums = [0] * cols
            for bottom in range(top, rows):
                for c in range(cols):
                    column_sums[c] += grid[bottom][c]
                running = 0
                for c, value in enumerate(column_sums):
                    running = value if c == 0 or running < 0 else running + value
                    best = max(best, running)
        return best
  javascript: |
    function maxSumRegion(grid) {
      let g = grid;
      if (g.length > g[0].length) {
        g = g[0].map((_, c) => g.map((row) => row[c]));
      }
      const rows = g.length;
      const cols = g[0].length;
      let best = g[0][0];
      for (let top = 0; top < rows; top++) {
        const columnSums = new Array(cols).fill(0);
        for (let bottom = top; bottom < rows; bottom++) {
          let running = 0;
          for (let c = 0; c < cols; c++) {
            columnSums[c] += g[bottom][c];
            running = c === 0 || running < 0 ? columnSums[c] : running + columnSums[c];
            if (running > best) best = running;
          }
        }
      }
      return best;
    }
