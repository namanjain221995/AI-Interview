version: 1
slug: terrain_hop_energy
title: Terrain Hop Energy
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, mobile, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Terrain Hop Energy

  A survey drone inspects a pipeline by landing on a row of checkpoints. Checkpoint `i` sits at
  altitude `heights[i]`. The drone starts on checkpoint `0` and must finish on the last checkpoint. It
  only ever moves forward: from checkpoint `i` it may hop to any checkpoint `i + 1, i + 2, ...,
  i + max_jump` (as long as that checkpoint exists).

  Every hop from checkpoint `i` to checkpoint `j` costs `|heights[i] - heights[j]|` units of battery
  energy. Return the **minimum total energy** needed to reach the last checkpoint. If there is only one
  checkpoint the drone is already done and the answer is `0`.

  ### Example 1
  ```
  Input:  heights = [10, 40, 30, 25, 22], max_jump = 3
  Output: 18
  Explanation: Hop 0 -> 3 (|10 - 25| = 15) and then 3 -> 4 (|25 - 22| = 3), for 18 in total.
  ```

  ### Example 2
  ```
  Input:  heights = [10, 20, 30, 40], max_jump = 1
  Output: 30
  Explanation: With max_jump = 1 every checkpoint must be visited: 10 + 10 + 10 = 30.
  ```

  ### Constraints
  - `1 <= heights.length <= 10^4`
  - `0 <= heights[i] <= 10^4`
  - `1 <= max_jump <= 100` (`max_jump` may be larger than the number of remaining checkpoints)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_terrain_energy
  params:
    - {name: heights, type: "int[]"}
    - {name: max_jump, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_terrain_energy(heights: list[int], max_jump: int) -> int:
        n = len(heights)
        best = [0] * n
        for i in range(1, n):
            lowest = None
            for j in range(max(0, i - max_jump), i):
                cost = best[j] + abs(heights[i] - heights[j])
                if lowest is None or cost < lowest:
                    lowest = cost
            best[i] = lowest
        return best[-1]
  javascript: |
    function minTerrainEnergy(heights, maxJump) {
      const n = heights.length;
      const best = new Array(n).fill(0);
      for (let i = 1; i < n; i++) {
        let lowest = Infinity;
        for (let j = Math.max(0, i - maxJump); j < i; j++) {
          lowest = Math.min(lowest, best[j] + Math.abs(heights[i] - heights[j]));
        }
        best[i] = lowest;
      }
      return best[n - 1];
    }
