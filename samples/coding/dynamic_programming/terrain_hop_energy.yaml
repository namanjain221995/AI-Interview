expected_concepts:
  - "best[i] = minimum energy to reach checkpoint i"
  - "transition from the previous max_jump checkpoints"
  - "base case best[0] = 0 and a single-checkpoint input"
  - "O(n * max_jump) time instead of exploring every hop sequence"
optimal_complexity: {time: "O(n * max_jump)", space: "O(n)"}
rubric:
  excellent: "Spots that a greedy choice of the cheapest next hop fails, defines the minimum-energy-to-reach-i state, fills it left to right from the previous max_jump checkpoints, clamps the window at the start, and states O(n * k) time and O(n) space."
  good: "Correct bottom-up or memoised solution with a small prompt about the window bounds or the single-checkpoint case."
  weak: "Greedy hop selection, exponential recursion without memoisation, or an off-by-one window that skips allowed hops or reads before index 0."
  criteria:
    correctness: "All tests pass, including one checkpoint, max_jump larger than the array and max_jump of 1."
    efficiency: "Each checkpoint looks back at most max_jump positions; no exponential search."
    code_quality: "Clear state array, clamped loop bounds and no magic sentinel collisions."
    edge_cases: "Single checkpoint, flat terrain, a jump that can reach the end in one hop."
    communication: "Explains why the cheapest single hop is not always part of the cheapest route."
hints:
  - "Picking the cheapest next hop each time can lead the drone into an expensive stretch later. What smaller question could you answer for every checkpoint?"
  - "Ask for each checkpoint how little energy it takes to land there. That answer depends only on the answers for the few checkpoints that can hop to it."
  - "Keep an array where the entry for checkpoint i is the cheapest way to land on it; the first entry is zero, and every later entry is the minimum, over the previous max_jump checkpoints that exist, of their entry plus the altitude difference. The last entry is the answer."
followups:
  - "How would you also return the sequence of checkpoints the drone lands on?"
  - "If max_jump could be as large as the number of checkpoints, can you beat O(n^2)?"
  - "Can you reduce memory to O(max_jump)?"
  - "What changes if some checkpoints are closed and cannot be landed on?"
common_errors:
  - "Greedily taking the cheapest immediate hop, which fails when a short hop leads into a costly climb."
  - "Starting the inner loop at i - max_jump without clamping to 0."
  - "Returning the cost to the second-to-last checkpoint or forgetting the single-checkpoint case."
  - "Initialising the running minimum to 0 so every checkpoint looks free."
