expected_concepts:
  - "partition dynamic programming over prefix length and number of days"
  - "running maximum of the last day's block while scanning split points"
  - "infeasibility check when there are fewer jobs than days"
  - "O(days * n^2) time with two rolling rows of state"
optimal_complexity: {time: "O(days * n^2)", space: "O(n)"}
rubric:
  excellent: "Defines the state as the best total for the first i jobs in d days, scans the last day's start backwards with a running maximum, handles the -1 case up front, states O(days * n^2) time and reduces memory to two rows."
  good: "Correct top-down or bottom-up DP with the right complexity, needing a nudge on the running maximum or on bounding split points so earlier days stay non-empty."
  weak: "Tries greedy splits around the largest jobs, enumerates every way to cut the list, or allows empty days."
  criteria:
    correctness: "All tests pass, including days equal to the job count, a single day and the -1 case."
    efficiency: "Polynomial DP; the last block's maximum is updated incrementally rather than recomputed."
    code_quality: "Clear state definition, named sentinel for impossible states, no off-by-one in split bounds."
    edge_cases: "Single job, zero loads, more days than jobs and alternating extreme loads."
    communication: "Explains why the last day always runs a suffix and why the problem has optimal substructure."
hints:
  - "Look at the last day of any plan: it runs some suffix of the jobs, and the days before it form a smaller plan of exactly the same kind."
  - "Define the best total for running the first i jobs in exactly d days. To compute it, try every possible first job of the last day, keeping a running maximum as that day's block grows backwards."
  - "Fill a table over days and prefix length: the value for d days and i jobs is the minimum, over split points j that leave at least d minus 1 jobs for the earlier days, of the value for d minus 1 days and j jobs plus the largest load among jobs j through i minus 1. Scan j downwards from i so the block maximum updates in constant time, and return minus one immediately when there are fewer jobs than days."
followups:
  - "Can a monotonic stack remove the inner loop for each day?"
  - "How would you return the actual day boundaries, not just the total?"
  - "What changes if a day may be left empty?"
  - "How would the problem change if a day's cost were the sum of its loads instead of the maximum?"
common_errors:
  - "Greedily isolating the largest jobs on their own days."
  - "Forgetting to return -1 when there are fewer jobs than days."
  - "Allowing empty days by letting consecutive split points coincide."
  - "Recomputing the block maximum from scratch for every split point, adding a factor of n."
