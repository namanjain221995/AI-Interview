title: "Daily Peak Load Schedule"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, devops, platform, project_manager]
time_limit_minutes: 30
prompt_markdown: |
  ## Daily Peak Load Schedule

  A platform team has a list of database migration jobs that must run **in the given order**: `jobs[i]`
  is the load of job `i` in capacity units, and a job can never run on an earlier day than a job that
  comes before it in the list. The migrations must be spread over **exactly `days` days** with **at least
  one job each day**, and every job runs on exactly one day.

  The capacity reserved for a day equals the load of the **largest** job run that day. Return the
  **minimum possible total** reserved capacity over all days. If there are fewer jobs than days, no
  valid plan exists: return `-1`.

  In other words: split `jobs` into exactly `days` non-empty contiguous blocks and minimise the sum of
  the block maximums.

  ### Example 1
  ```
  Input:  jobs = [4, 2, 7, 1, 3], days = 2
  Output: 10
  Explanation: day 1 runs [4, 2, 7] and day 2 runs [1, 3]; 7 + 3 = 10
  ```

  ### Example 2
  ```
  Input:  jobs = [6, 3, 1, 8, 2, 5], days = 3
  Output: 15
  Explanation: [6, 3, 1, 8], [2] and [5] give 8 + 2 + 5 = 15
  ```

  ### Example 3
  ```
  Input:  jobs = [3, 3], days = 3
  Output: -1
  Explanation: two jobs cannot fill three days
  ```

  ### Constraints
  - `1 <= jobs.length <= 300`
  - `0 <= jobs[i] <= 1000`
  - `1 <= days <= 10`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_total_peak_load
  params:
    - {name: jobs, type: "int[]"}
    - {name: days, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_total_peak_load(jobs: list[int], days: int) -> int:
        n = len(jobs)
        if n < days:
            return -1
        inf = float("inf")
        # prev[i]: smallest total for running the first i jobs on the days planned so far
        prev = [inf] * (n + 1)
        prev[0] = 0
        for day in range(1, days + 1):
            cur = [inf] * (n + 1)
            for i in range(day, n - (days - day) + 1):
                peak = 0
                best = inf
                # this day runs jobs[j..i-1]; extend it backwards one job at a time
                for j in range(i - 1, day - 2, -1):
                    peak = max(peak, jobs[j])
                    if prev[j] + peak < best:
                        best = prev[j] + peak
                cur[i] = best
            prev = cur
        return int(prev[n])
  javascript: |
    function minTotalPeakLoad(jobs, days) {
      const n = jobs.length;
      if (n < days) return -1;
      let prev = new Array(n + 1).fill(Infinity);
      prev[0] = 0;
      for (let day = 1; day <= days; day++) {
        const cur = new Array(n + 1).fill(Infinity);
        for (let i = day; i <= n - (days - day); i++) {
          let peak = 0;
          let best = Infinity;
          // this day runs jobs[j..i-1]
          for (let j = i - 1; j >= day - 1; j--) {
            peak = Math.max(peak, jobs[j]);
            best = Math.min(best, prev[j] + peak);
          }
          cur[i] = best;
        }
        prev = cur;
      }
      return prev[n];
    }
