slug: pipeline_critical_path
title: "Pipeline Critical Path"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, devops, data, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Pipeline Critical Path

  A CI pipeline has `n` tasks numbered `0` to `n - 1`; task `i` runs for `durations[i]` minutes. Each row
  `deps[j] = [before, after]` means task `after` may only start once task `before` has **finished**. The
  dependencies never form a cycle, and the same row may appear more than once (a repeated row means the
  same as a single one).

  The build farm has **unlimited parallel runners**, so every task starts at the exact minute its last
  prerequisite finishes; tasks without prerequisites start at minute `0`. Return the minute at which the
  **last** task finishes, i.e. the total wall-clock time of the pipeline.

  ### Example 1
  ```
  Input:  durations = [3, 2, 4, 1], deps = [[0, 1], [0, 2], [1, 3], [2, 3]]
  Output: 8
  Explanation: Task 0 runs 0-3. Tasks 1 and 2 both start at 3 and finish at 5 and 7. Task 3 waits for both, starts at 7 and finishes at 8.
  ```

  ### Example 2
  ```
  Input:  durations = [5, 1, 1], deps = []
  Output: 5
  Explanation: All tasks run in parallel from minute 0; the longest takes 5 minutes.
  ```

  ### Constraints
  - `1 <= durations.length <= 10^5`
  - `0 <= durations[i] <= 10^9`
  - `0 <= deps.length <= 2 * 10^5`
  - `deps[j].length == 2`, `0 <= before, after < n`, `before != after`
  - The dependency graph is acyclic.

  **Follow-up:** the answer can exceed the 32-bit range; make sure your arithmetic does not overflow.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_pipeline_duration
  params:
    - {name: durations, type: "int[]"}
    - {name: deps, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def longest_pipeline_duration(durations: list[int], deps: list[list[int]]) -> int:
        n = len(durations)
        after_of = [[] for _ in range(n)]
        waiting = [0] * n  # unfinished prerequisite rows per task (duplicates counted)
        for before, after in deps:
            after_of[before].append(after)
            waiting[after] += 1
        start = [0] * n  # earliest start time of each task
        ready = deque(i for i in range(n) if waiting[i] == 0)
        latest = 0
        while ready:
            task = ready.popleft()
            finish = start[task] + durations[task]
            latest = max(latest, finish)
            for nxt in after_of[task]:
                start[nxt] = max(start[nxt], finish)
                waiting[nxt] -= 1
                if waiting[nxt] == 0:
                    ready.append(nxt)
        return latest
  javascript: |
    function longestPipelineDuration(durations, deps) {
      const n = durations.length;
      const afterOf = Array.from({ length: n }, () => []);
      const waiting = new Array(n).fill(0);
      for (const [before, after] of deps) {
        afterOf[before].push(after);
        waiting[after]++;
      }
      const start = new Array(n).fill(0);
      const queue = [];
      for (let i = 0; i < n; i++) if (waiting[i] === 0) queue.push(i);
      let latest = 0;
      for (let head = 0; head < queue.length; head++) {
        const task = queue[head];
        const finish = start[task] + durations[task];
        if (finish > latest) latest = finish;
        for (const next of afterOf[task]) {
          if (finish > start[next]) start[next] = finish;
          if (--waiting[next] === 0) queue.push(next);
        }
      }
      return latest;
    }
