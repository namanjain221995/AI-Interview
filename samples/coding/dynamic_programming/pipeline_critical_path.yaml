expected_concepts:
  - "the answer is the longest weighted path in a directed acyclic graph"
  - "topological order with Kahn's algorithm (in-degree counting) or DFS with memoisation"
  - "earliest start of a task is the maximum finish time of its prerequisites"
  - "64-bit arithmetic for sums of large durations"
  - "O(n + E) time and space"
optimal_complexity: {time: "O(n + E)", space: "O(n + E)"}
rubric:
  excellent: "Recognises the longest path in a DAG, processes tasks in topological order (Kahn or memoised DFS), propagates earliest start times with max, handles duplicates and 64-bit totals, and explains O(n + E)."
  good: "Correct topological or memoised solution with minor prompting on overflow, duplicates or recursion depth."
  weak: "Sums all durations, counts tasks instead of minutes, processes dependencies in input order without a topological sort, or explores every path exponentially."
  criteria:
    correctness: "All tests pass, including reverse-ordered chains, duplicate rows and disconnected components."
    efficiency: "Linear in tasks plus dependency rows; each edge is processed once."
    code_quality: "Clear adjacency list, in-degree array and start or finish arrays with descriptive names."
    edge_cases: "Single task, zero durations, duplicate rows, several sources and totals beyond 32 bits."
    communication: "Explains why the longest path, not the sum or the task count, determines the pipeline time."
hints:
  - "With unlimited runners, nothing waits for a free machine. What is the only thing that delays a task's start?"
  - "A task can start when its slowest prerequisite finishes, so finish times must be known for all prerequisites first. Which ordering of the tasks guarantees that?"
  - "Build an adjacency list and count the prerequisites of each task. Start a queue with the tasks that have none. When a task leaves the queue, its finish time is its start time plus its duration; push that finish time forward as a candidate start for each dependent task (keep the maximum) and decrement its counter, enqueuing it at zero. The answer is the largest finish time seen, kept in a 64-bit integer."
followups:
  - "How would you list the tasks on the critical path, not just its length?"
  - "How would you detect and report a cycle if the input were not guaranteed to be acyclic?"
  - "What changes if only k runners are available?"
  - "How much can a single task be delayed without delaying the whole pipeline (its slack)?"
common_errors:
  - "Adding up every duration as if the tasks ran one after another."
  - "Processing dependency rows in input order without a topological sort."
  - "Using the number of tasks on a path instead of the sum of durations."
  - "Recursive DFS without memoisation, which revisits shared subgraphs exponentially, or overflowing a 32-bit total."
