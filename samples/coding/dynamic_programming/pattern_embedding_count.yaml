version: 1
slug: pattern_embedding_count
title: Pattern Embedding Count
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, sre, security]
time_limit_minutes: 30
prompt_markdown: |
  ## Pattern Embedding Count

  A detection team encodes every event in an audit stream as a single character, so a stretch of the
  stream becomes a string `log`. A suspicious behaviour is described by a short signature `pattern`:
  the signature's events must occur **in order**, but other events may appear between them.

  An **embedding** of `pattern` in `log` is a strictly increasing list of positions
  `i_1 < i_2 < ... < i_m` in `log` such that `log[i_j] == pattern[j]` for every `j`. Two embeddings
  are different when their position lists differ, even if they spell the same characters.

  Return the number of embeddings of `pattern` in `log`, **modulo `1_000_000_007`**. An empty `pattern`
  has exactly one embedding (the empty list of positions), even when `log` is empty.

  ### Example 1
  ```
  Input:  log = "abcbc", pattern = "abc"
  Output: 3
  Explanation: The positions (0, 1, 2), (0, 1, 4) and (0, 3, 4) all spell "abc".
  ```

  ### Example 2
  ```
  Input:  log = "aaaa", pattern = "aa"
  Output: 6
  Explanation: Any 2 of the 4 positions, taken in increasing order, spell "aa".
  ```

  ### Example 3
  ```
  Input:  log = "xyz", pattern = "zy"
  Output: 0
  Explanation: "z" never appears before a "y", so the order cannot be respected.
  ```

  ### Constraints
  - `0 <= log.length <= 1000`
  - `0 <= pattern.length <= 1000`
  - `log` and `pattern` contain only lowercase English letters and digits.
  - Return the count modulo `1_000_000_007`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_pattern_embeddings
  params:
    - {name: log, type: string}
    - {name: pattern, type: string}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_pattern_embeddings(log: str, pattern: str) -> int:
        mod = 1_000_000_007
        m = len(pattern)
        ways = [1] + [0] * m
        for ch in log:
            for j in range(m, 0, -1):
                if pattern[j - 1] == ch:
                    ways[j] = (ways[j] + ways[j - 1]) % mod
        return ways[m]
  javascript: |
    function countPatternEmbeddings(log, pattern) {
      const MOD = 1000000007;
      const m = pattern.length;
      const ways = new Array(m + 1).fill(0);
      ways[0] = 1;
      for (const ch of log) {
        for (let j = m; j >= 1; j--) {
          if (pattern[j - 1] === ch) ways[j] = (ways[j] + ways[j - 1]) % MOD;
        }
      }
      return ways[m];
    }
tests:
  - {id: t1, args: ["abcbc", "abc"], expected: 3, description: "Example 1"}
  - {id: t2, args: ["aaaa", "aa"], expected: 6, description: "Example 2 - repeated characters"}
  - {id: t3, args: ["xyz", "zy"], expected: 0, description: "Example 3 - order cannot be respected"}
  - {id: t4, hidden: true, args: ["", ""], expected: 1, description: "Both strings empty: empty pattern counts once"}
  - {id: t5, hidden: true, args: ["deploy", ""], expected: 1, description: "Empty pattern on a non-empty log counts once"}
  - {id: t6, hidden: true, args: ["", "a"], expected: 0, description: "Empty log with a non-empty pattern"}
  - {id: t7, hidden: true, args: ["ab", "abc"], expected: 0, description: "Pattern longer than the log"}
  - {id: t8, hidden: true, args: ["rollbackrollback", "rob"], expected: 4, description: "Repeated signature across two copies of a word"}
  - {id: t9, hidden: true, args: ["1212121212", "12"], expected: 15, description: "Digits only, many overlapping pairs"}
  - {id: t10, hidden: true, args: ["abababababababababababababababababababababababababababababab", "abababab"], expected: 18156204, description: "Alternating 60-character log with an 8-character signature: large count still below the modulus"}
  - {id: t11, hidden: true, args: ["", ""], expected: 159835829, description: "1000 identical characters choose 500: result wraps the modulus"}
expected_concepts:
  - "dynamic programming over prefixes of log and pattern"
  - "take-or-skip recurrence when the current characters match"
  - "empty pattern as the base case with exactly one embedding"
  - "modular arithmetic applied at every addition"
  - "rolling one-dimensional table iterated backwards over the pattern"
optimal_complexity: {time: "O(n * m)", space: "O(m)"}
rubric:
  excellent: "Defines ways(i, j) as embeddings of the first j pattern characters in the first i log characters, derives the skip/take recurrence, reduces memory to O(m) by iterating the pattern backwards, applies the modulus on every addition and handles empty strings."
  good: "Correct O(n * m) table with modulus and correct base cases, possibly using O(n * m) memory."
  weak: "Enumerates subsequences or uses recursion without memoisation, forgets the modulus, or counts distinct strings instead of distinct position lists."
  criteria:
    correctness: "All tests pass, including empty inputs and a pattern longer than the log."
    efficiency: "O(n * m) time; ideally O(m) extra memory."
    code_quality: "Meaningful names for the table and indices; the modulus is a named constant."
    edge_cases: "Empty pattern, empty log, no possible match and results that wrap the modulus."
    communication: "Explains why each matching character can either be used or skipped."
hints:
  - "Think about the last character of the log: an embedding either uses it or it does not. How does that split the count into smaller versions of the same question?"
  - "Let the state be how many ways the first j characters of the pattern can be embedded in the first i characters of the log. Skipping log character i always contributes the count for the shorter log; using it is only possible when it equals pattern character j."
  - "Start with one way to embed the empty pattern. For each log character, walk the pattern positions from the end towards the start, and wherever the pattern character matches the log character add the count for the previous pattern position to the current one, taking the remainder modulo the given prime after each addition. Walking backwards stops a single log character from being used twice."
followups:
  - "How would you return the embeddings themselves, and why is that impractical at this size?"
  - "Why must the one-dimensional table be updated from the end of the pattern?"
  - "How would you count embeddings where consecutive matched events are at most d positions apart?"
  - "What changes if the log arrives as an unbounded stream and you need a running count?"
common_errors:
  - "Iterating the pattern forwards in the rolling table, so one log character is matched twice."
  - "Returning 0 for an empty pattern instead of 1."
  - "Applying the modulus only at the end, which overflows in fixed-width languages."
  - "Counting distinct matching strings instead of distinct position lists."
