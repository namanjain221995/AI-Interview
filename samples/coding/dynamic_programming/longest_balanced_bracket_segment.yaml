title: Longest Balanced Bracket Segment
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, frontend, qa]
time_limit_minutes: 25
prompt_markdown: |
  ## Longest Balanced Bracket Segment

  A template linter strips everything except parentheses from a damaged template fragment, leaving a
  string `s` made only of `(` and `)`. To show the author which part of the fragment is still intact, the
  linter highlights the **longest contiguous segment** of `s` that is a balanced bracket sequence: every
  `(` in the segment is closed by a later `)` in the segment, and no `)` appears without a matching
  earlier `(` in the segment.

  Return the **length** of that segment, or `0` if no balanced segment exists (including when `s` is empty).

  ### Example 1
  ```
  Input:  s = "())(())"
  Output: 4
  Explanation: The segment "(())" at indices 3..6 is balanced; "()" at 0..1 is shorter.
  ```

  ### Example 2
  ```
  Input:  s = ")("
  Output: 0
  ```

  ### Example 3
  ```
  Input:  s = "(()())"
  Output: 6
  ```

  ### Constraints
  - `0 <= s.length <= 3 * 10^4`
  - `s[i]` is `(` or `)`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_balanced_segment
  params:
    - {name: s, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_balanced_segment(s: str) -> int:
        # Stack of indices; the bottom entry is the index just before the
        # current candidate segment (an unmatched ')' or -1).
        stack = [-1]
        best = 0
        for i, ch in enumerate(s):
            if ch == "(":
                stack.append(i)
            else:
                stack.pop()
                if not stack:
                    stack.append(i)
                else:
                    best = max(best, i - stack[-1])
        return best
  javascript: |
    function longestBalancedSegment(s) {
      const stack = [-1];
      let best = 0;
      for (let i = 0; i < s.length; i++) {
        if (s[i] === "(") {
          stack.push(i);
        } else {
          stack.pop();
          if (stack.length === 0) {
            stack.push(i);
          } else {
            best = Math.max(best, i - stack[stack.length - 1]);
          }
        }
      }
      return best;
    }
