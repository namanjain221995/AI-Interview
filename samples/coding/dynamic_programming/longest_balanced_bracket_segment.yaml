expected_concepts:
  - "stack of indices with a sentinel for the segment start"
  - "an unmatched ')' becomes the new boundary"
  - "length computed as current index minus index below the top"
  - "alternative: two-pass left/right counter scan with O(1) space"
  - "alternative: DP over the length of the balanced segment ending at each index"
  - "O(n) time"
optimal_complexity: {time: "O(n)", space: "O(n), or O(1) with the two-pass counter scan"}
rubric:
  excellent: "Derives an O(n) solution (index stack with a boundary sentinel, DP ending at each index, or the two-direction counter scan), explains why adjacent balanced blocks join, handles empty input and unmatched brackets, and mentions the O(1)-space variant."
  good: "Correct O(n) stack or DP solution with a small bug fixed after testing on the examples."
  weak: "Checks every substring for balance in O(n^2) or worse, or only counts matched pairs without requiring contiguity."
  criteria:
    correctness: "All tests pass, including adjacent blocks and unmatched brackets on either side."
    efficiency: "Single linear pass (or two)."
    code_quality: "The stack's bottom element has a clear documented meaning."
    edge_cases: "Empty string, only one bracket type, deep nesting."
    communication: "Explains how an unmatched closing bracket splits the string into independent parts."
hints:
  - "An unmatched closing bracket can never be inside a balanced segment. What does that tell you about where segments can start?"
  - "Track positions rather than counts: when a closing bracket finds its partner, how far back does the balanced segment ending here reach?"
  - "Keep a stack of indices that starts with minus one as a boundary marker. Push the index of each opening bracket; on a closing bracket pop once, and if the stack becomes empty push the current index as the new boundary, otherwise the current index minus the index now on top is a balanced length to compare with the best."
followups:
  - "Can you solve it with O(1) extra space?"
  - "How would you return the start index of the longest segment as well?"
  - "What if the fragment could contain several bracket types such as [], {} and ()?"
  - "How would you count all balanced segments instead of finding the longest?"
common_errors:
  - "Counting matched pairs across the whole string and returning twice that number."
  - "Not joining adjacent balanced blocks such as two consecutive pairs."
  - "Popping from an empty stack on a leading closing bracket."
  - "Using a single left-to-right counter, which misses segments followed by extra opening brackets."
