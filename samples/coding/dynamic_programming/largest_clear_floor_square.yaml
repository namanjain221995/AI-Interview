expected_concepts:
  - "side[r][c] = largest clear square ending at (r, c) as its bottom-right corner"
  - "1 + minimum of the top, left and top-left neighbours"
  - "return the area (side squared), not the side"
  - "O(rows * cols) time with a single row of extra memory"
optimal_complexity: {time: "O(rows * cols)", space: "O(cols)"}
rubric:
  excellent: "Defines the bottom-right-corner state, justifies the minimum-of-three-neighbours transition, returns side squared, handles the first row and column, and reduces memory to one row while keeping the diagonal value correct."
  good: "Correct two-dimensional DP that returns the area, possibly after a prompt about the boundary cells."
  weak: "Checks every square at every position (quartic or cubic time), returns the side instead of the area, or confuses the largest square with the largest rectangle."
  criteria:
    correctness: "All tests pass, including all-occupied and all-clear grids and single rows."
    efficiency: "Linear in the number of tiles."
    code_quality: "Clear state meaning, clean boundary handling and no mutation of the input grid."
    edge_cases: "Single tile, single row or column, all occupied, and non-square grids."
    communication: "Explains why the minimum of the three neighbours limits the square."
hints:
  - "Trying every top-left corner and every size is slow. Think about squares that end at a particular tile."
  - "If a tile is clear, the largest clear square with that tile as its bottom-right corner is limited by the squares ending just above it, just left of it and diagonally above-left of it."
  - "For each clear tile, set its value to one plus the smallest of those three neighbouring values (treating cells outside the grid as zero), and occupied tiles get zero; track the largest value seen and return its square. One row of values plus the saved diagonal is enough memory."
followups:
  - "How would you find the largest clear rectangle instead of a square?"
  - "How would you count all clear squares of every size?"
  - "What if tiles are freed and occupied over time and you need the answer after each change?"
  - "How would you return the position of the square as well as its area?"
common_errors:
  - "Returning the side length instead of the area."
  - "Using the maximum instead of the minimum of the three neighbours."
  - "Overwriting the diagonal value too early in a one-row optimisation."
  - "Assuming the grid is square or indexing rows and columns the wrong way round."
