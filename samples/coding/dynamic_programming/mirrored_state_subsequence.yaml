version: 1
slug: mirrored_state_subsequence
title: "Mirrored State Subsequence"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Mirrored State Subsequence

  A conveyor controller writes one uppercase letter to its trace every tick to record its state (for
  example `I` for idle, `R` for running, `H` for hold). A reliability engineer looking for symmetric
  start-up and shut-down behaviour wants to know how long a **mirrored pattern** can be hidden inside a
  trace.

  Write `longest_mirror_subsequence(s)` that returns the length of the longest **subsequence** of `s`
  that reads the same forwards and backwards.

  - A subsequence keeps the original order of the ticks but may skip any number of them; the kept ticks
    do not have to be adjacent.
  - Any single tick on its own is a mirrored pattern of length 1.
  - Return `0` for an empty trace.

  ### Example 1
  ```
  Input:  s = "RIHRSIR"
  Output: 5
  Explanation: "RIRIR" (ticks 0, 1, 3, 5, 6) reads the same both ways; no mirrored subsequence of length 6 exists.
  ```

  ### Example 2
  ```
  Input:  s = "IRHS"
  Output: 1
  Explanation: All letters differ, so the best pattern is any single tick.
  ```

  ### Constraints
  - `0 <= s.length <= 1000`
  - `s` consists only of uppercase English letters `A-Z`.

  **Follow-up:** can you keep the extra memory to `O(n)` while staying within `O(n^2)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_mirror_subsequence
  params:
    - {name: s, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_mirror_subsequence(s: str) -> int:
        n = len(s)
        if n == 0:
            return 0
        # below[j] holds the answer for s[i + 1 .. j]; row is built for s[i .. j].
        below = [0] * n
        for i in range(n - 1, -1, -1):
            row = [0] * n
            row[i] = 1
            for j in range(i + 1, n):
                if s[i] == s[j]:
                    row[j] = below[j - 1] + 2
                else:
                    row[j] = max(below[j], row[j - 1])
            below = row
        return below[n - 1]
  javascript: |
    function longestMirrorSubsequence(s) {
      const n = s.length;
      if (n === 0) return 0;
      let below = new Array(n).fill(0);
      for (let i = n - 1; i >= 0; i--) {
        const row = new Array(n).fill(0);
        row[i] = 1;
        for (let j = i + 1; j < n; j++) {
          if (s[i] === s[j]) {
            row[j] = below[j - 1] + 2;
          } else {
            row[j] = Math.max(below[j], row[j - 1]);
          }
        }
        below = row;
      }
      return below[n - 1];
    }
tests:
  - {id: t1, args: ["RIHRSIR"], expected: 5, description: "Example 1 - mirrored pattern needs skipped ticks"}
  - {id: t2, args: ["IRHS"], expected: 1, description: "Example 2 - all distinct states"}
  - {id: t3, hidden: true, args: [""], expected: 0, description: "Empty trace returns 0"}
  - {id: t4, hidden: true, args: ["H"], expected: 1, description: "Single tick"}
  - {id: t5, hidden: true, args: ["RRRRRRRR"], expected: 8, description: "All ticks identical - whole trace, even length"}
  - {id: t6, hidden: true, args: ["SIRHRIS"], expected: 7, description: "Whole trace is already mirrored, odd length"}
  - {id: t7, hidden: true, args: ["IR"], expected: 1, description: "Two different ticks - answer 1, not 2"}
  - {id: t8, hidden: true, args: ["ABCDECBXA"], expected: 7, description: "Matching outer letters with unmatched noise letters (D, E, X) inside"}
  - {id: t9, hidden: true, args: ["HIRSHFRISHIRF"], expected: 7, description: "Medium trace with many interleaved repeats"}
  - {id: t10, hidden: true, args: [""], expected: 482, description: "Stress - 800 ticks over five states; O(2^n) recursion without memoisation times out"}
expected_concepts:
  - "interval dynamic programming over (start, end) pairs"
  - "matching end characters extend the inner answer by two"
  - "otherwise drop one end and take the better of the two"
  - "O(n^2) time with O(n) space by keeping one row"
  - "relationship to the longest common subsequence of s and its reverse"
optimal_complexity: {time: "O(n^2)", space: "O(n)"}
rubric:
  excellent: "Defines the answer for every substring range, derives the match-or-drop-an-end recurrence, fills it in a valid order, reduces memory to one or two rows and explains O(n^2) time."
  good: "Implements a correct O(n^2) table (or memoised recursion) with full O(n^2) memory and states the complexity, possibly after a hint about the recurrence."
  weak: "Confuses subsequence with contiguous substring, tries greedy matching from the ends, or enumerates subsets exponentially."
  criteria:
    correctness: "Correct for empty, single, fully mirrored and noisy traces."
    efficiency: "Quadratic time; linear extra memory for full credit."
    code_quality: "Clear meaning for each table cell and a fill order that only reads computed cells."
    edge_cases: "Empty trace, one tick, two different ticks and all-identical ticks."
    communication: "States the recurrence in words and justifies why the fill order is valid."
hints:
  - "Look at the first and last tick of the trace: what can you say about the best pattern when they are the same letter, and when they differ?"
  - "The answer for the whole trace depends only on answers for shorter ranges of ticks, so store the best length for every start and end position and reuse it."
  - "Let the best length for the range from i to j be the inner range's best plus two when both ends match, otherwise the larger of the best lengths after dropping the left end or dropping the right end; fill ranges from short to long (or i from right to left) and keep only the previous row to save memory."
followups:
  - "How would you return one longest mirrored pattern itself, not just its length?"
  - "How does this problem relate to the longest common subsequence of the trace and its reverse?"
  - "What is the fewest ticks you must delete so that the remaining trace is mirrored?"
common_errors:
  - "Treating the problem as the longest contiguous mirrored substring."
  - "Greedily pairing the outermost equal letters, which can miss a longer inner pattern."
  - "Filling the table in an order that reads cells that have not been computed yet."
  - "Returning 1 instead of 0 for an empty trace."
