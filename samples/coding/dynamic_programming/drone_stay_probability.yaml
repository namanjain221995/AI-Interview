    - {name: col, type: "int"}
  return_type: "float"
  comparison: float_tolerance
  tolerance: 1e-06
reference_solutions:
  python: |
    def drone_stay_probability(n: int, moves: int, row: int, col: int) -> float:
        # prob[r][c]: probability that the drone is at (r, c) and still flying.
        prob = [[0.0] * n for _ in range(n)]
        prob[row][col] = 1.0
        steps = ((1, 0), (-1, 0), (0, 1), (0, -1))
        for _ in range(moves):
            nxt = [[0.0] * n for _ in range(n)]
            for r in range(n):
                for c in range(n):
                    p = prob[r][c]
                    if p == 0.0:
                        continue
                    share = p / 4.0
                    for dr, dc in steps:
                        nr, nc = r + dr, c + dc
                        if 0 <= nr < n and 0 <= nc < n:
                            nxt[nr][nc] += share
            prob = nxt
        return sum(sum(line) for line in prob)
  javascript: |
    function droneStayProbability(n, moves, row, col) {
      let prob = Array.from({ length: n }, () => new Array(n).fill(0));
      prob[row][col] = 1;
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      for (let m = 0; m < moves; m++) {
        const nxt = Array.from({ length: n }, () => new Array(n).fill(0));
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            const p = prob[r][c];
            if (p === 0) continue;
            const share = p / 4;
            for (const [dr, dc] of steps) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < n && nc >= 0 && nc < n) nxt[nr][nc] += share;
            }
          }
        }
        prob = nxt;
      }
      let total = 0;
      for (const line of prob) for (const p of line) total += p;
      return total;
    }
