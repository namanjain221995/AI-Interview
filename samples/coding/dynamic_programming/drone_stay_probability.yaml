title: Drone Stay Probability
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, data_scientist, ml, mobile]
time_limit_minutes: 25
prompt_markdown: |
  ## Drone Stay Probability

  A test drone is flying inside a fenced `n x n` survey area divided into cells; rows and columns are
  numbered `0` to `n - 1`. It starts in cell (`row`, `col`). A faulty controller then makes it take
  exactly `moves` steps. Each step goes one cell **up**, **down**, **left** or **right**, each with
  probability `1/4`, independently of every other step.

  If a step would take the drone outside the area, the drone lands at the boundary and the flight is
  **over**: it takes no further steps and never re-enters, even if later steps would have led back.

  Return the probability that the drone is **still inside the area after all `moves` steps**. With
  `moves = 0` the drone never leaves, so the answer is `1`. Answers within `1e-6` of the exact value are
  accepted.

  ### Example 1
  ```
  Input:  n = 3, moves = 1, row = 0, col = 0
  Output: 0.5
  Explanation: From the corner, down and right stay inside; up and left leave. 2 of 4 directions.
  ```

  ### Example 2
  ```
  Input:  n = 3, moves = 2, row = 1, col = 1
  Output: 0.75
  Explanation: The first step always lands on an edge cell; from there 3 of the 4 directions stay inside.
  ```

  ### Example 3
  ```
  Input:  n = 2, moves = 3, row = 0, col = 0
  Output: 0.125
  Explanation: Each step keeps the drone inside with probability 1/2, so (1/2)^3.
  ```

  ### Constraints
  - `1 <= n <= 25`
  - `0 <= moves <= 100`
  - `0 <= row, col < n`

  **Follow-up:** Can you keep only two `n x n` layers in memory, whatever the number of moves?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: drone_stay_probability
  params:
    - {name: n, type: "int"}
    - {name: moves, type: "int"}
