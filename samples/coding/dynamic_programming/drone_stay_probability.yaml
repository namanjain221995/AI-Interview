expected_concepts:
  - "probability distribution over cells per step"
  - "dynamic programming over (steps taken, row, col)"
  - "dropping mass that leaves the area (absorbing boundary)"
  - "summing remaining mass at the end"
  - "two-layer rolling arrays"
  - "why enumerating all 4^moves paths is infeasible"
optimal_complexity: {time: "O(moves * n^2)", space: "O(n^2)"}
rubric:
  excellent: "Models the probability of being at each cell after each step, drops mass that leaves, sums the remainder, uses two layers and explains O(moves * n^2) time against the 4^moves brute force."
  good: "Correct memoised recursion or forward DP with the right complexity; may keep all layers in memory."
  weak: "Simulates random flights (Monte Carlo) and returns an estimate, enumerates every path, or lets the drone re-enter after leaving."
  criteria:
    correctness: "All tests pass within tolerance, including zero moves and the 1x1 area."
    efficiency: "Polynomial in n and moves; no path enumeration or sampling."
    code_quality: "Clear direction table and bounds check; no duplicated logic per direction."
    edge_cases: "moves = 0, n = 1, corner and edge starts and the largest inputs."
    communication: "Explains why outcomes outside the area are simply discarded and why the remaining mass is the answer."
hints:
  - "Instead of following individual flights, think about the chance of the drone being in each cell after a given number of steps."
  - "If you know, for every cell, the probability of being there and still flying after k steps, each cell passes a quarter of its probability to each neighbour that lies inside the area; the quarters that would go outside are simply lost."
  - "Keep an n by n table of probabilities, starting with 1 at the start cell. For each of the moves, build a fresh table where every cell sends one quarter of its value to each in-bounds neighbour, then replace the old table. After the last step, add up all the values in the table to get the answer."
followups:
  - "How would you compute the expected number of steps the drone survives instead?"
  - "If the four directions had different probabilities, what would change?"
  - "Could you solve it top-down with memoisation on (steps left, row, col)? Compare the memory use."
  - "For very large move counts, how could matrix exponentiation or symmetry help?"
common_errors:
  - "Letting probability that left the area flow back in on later steps."
  - "Updating the table in place, so a cell's new value is spread again in the same step."
  - "Estimating with random simulation instead of computing the exact probability."
  - "Returning a fraction of moves or a count instead of a probability."
  - "Recursing over all 4^moves paths without memoisation."
