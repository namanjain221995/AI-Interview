version: 1
slug: digit_sum_id_count
title: Digit Sum ID Count
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Digit Sum ID Count

  An asset registry hands out numeric IDs `1, 2, 3, ...`. A legacy sharding rule routes an asset to a
  bucket by the **sum of the decimal digits** of its ID (for example, ID `4071` has digit sum
  `4 + 0 + 7 + 1 = 12`). Before rebalancing, the platform team needs to know how many IDs would land in
  one bucket.

  Given `limit` and `digit_sum`, return how many integers `x` with `1 <= x <= limit` have a decimal
  digit sum of exactly `digit_sum`. `limit` can be far too large to loop over every ID.

  ### Example 1
  ```
  Input:  limit = 20, digit_sum = 2
  Output: 3
  Explanation: The IDs are 2, 11 and 20.
  ```

  ### Example 2
  ```
  Input:  limit = 100, digit_sum = 10
  Output: 9
  Explanation: 19, 28, 37, 46, 55, 64, 73, 82 and 91.
  ```

  ### Example 3
  ```
  Input:  limit = 1000, digit_sum = 1
  Output: 4
  Explanation: 1, 10, 100 and 1000.
  ```

  ### Constraints
  - `1 <= limit <= 10^15`
  - `0 <= digit_sum <= 135`
  - The answer fits in a signed 64-bit integer. Use 64-bit arithmetic for `limit` and the count.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_ids_with_digit_sum
  params:
    - {name: limit, type: long}
    - {name: digit_sum, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_ids_with_digit_sum(limit: int, digit_sum: int) -> int:
        digits = [int(ch) for ch in str(limit)]
        if digit_sum < 0 or digit_sum > 9 * len(digits):
            return 0
        # ways[l][s] = number of length-l digit strings (leading zeros allowed) with digit sum s
        ways = [[0] * (digit_sum + 1) for _ in range(len(digits) + 1)]
        ways[0][0] = 1
        for length in range(1, len(digits) + 1):
            for s in range(digit_sum + 1):
                ways[length][s] = sum(ways[length - 1][s - d] for d in range(10) if s - d >= 0)
        count = 0
        remaining = digit_sum
        for i, top in enumerate(digits):
            rest = len(digits) - i - 1
            for d in range(top):
                if remaining - d >= 0:
                    count += ways[rest][remaining - d]
            remaining -= top
            if remaining < 0:
                break
        if remaining == 0:
            count += 1  # limit itself
        if digit_sum == 0:
            count -= 1  # exclude the number 0
        return count
  javascript: |
    function countIdsWithDigitSum(limit, digitSum) {
      const digits = String(limit).split('').map(Number);
      const len = digits.length;
      if (digitSum < 0 || digitSum > 9 * len) return 0;
      const ways = Array.from({ length: len + 1 }, () => new Array(digitSum + 1).fill(0));
      ways[0][0] = 1;
      for (let l = 1; l <= len; l++) {
        for (let s = 0; s <= digitSum; s++) {
          let total = 0;
          for (let d = 0; d <= 9 && d <= s; d++) total += ways[l - 1][s - d];
          ways[l][s] = total;
        }
      }
      let count = 0;
      let remaining = digitSum;
      for (let i = 0; i < len; i++) {
        const rest = len - i - 1;
        for (let d = 0; d < digits[i]; d++) {
          if (remaining - d >= 0) count += ways[rest][remaining - d];
        }
        remaining -= digits[i];
        if (remaining < 0) break;
      }
      if (remaining === 0) count += 1;
      if (digitSum === 0) count -= 1;
      return count;
    }
tests:
  - {id: t1, args: [20, 2], expected: 3, description: "Example 1"}
  - {id: t2, args: [100, 10], expected: 9, description: "Example 2"}
  - {id: t3, args: [1000, 1], expected: 4, description: "Example 3 - limit itself matches"}
  - {id: t4, hidden: true, args: [1, 1], expected: 1, description: "Smallest limit"}
  - {id: t5, hidden: true, args: [5, 0], expected: 0, description: "digit_sum 0: zero is not an ID"}
  - {id: t6, hidden: true, args: [99, 30], expected: 0, description: "Sum unreachable for two-digit numbers"}
  - {id: t7, hidden: true, args: [1000000000000000, 1], expected: 16, description: "Power of ten limit with digit sum 1"}
  - {id: t8, hidden: true, args: [999999999999999, 135], expected: 1, description: "Fifteen nines: only the limit itself reaches 135"}
  - {id: t9, hidden: true, args: [1000000000000000, 67], expected: 35460394945125, description: "Largest limit with a middle digit sum (big count)"}
  - {id: t10, hidden: true, args: [123456789012345, 45], expected: 1270678927403, description: "Irregular 15-digit limit exercising every tight position"}
  - {id: t11, hidden: true, args: [987654321, 20], expected: 2714291, description: "Nine-digit limit with descending digits"}
expected_concepts:
  - "digit DP: walking the digits of limit from most significant to least"
  - "tight versus free prefix: once a digit is below limit's digit, the rest is unconstrained"
  - "precomputed counts of free-length digit strings with a given sum"
  - "including limit itself and excluding zero"
  - "O(digits * 10 * digit_sum) instead of iterating up to limit"
optimal_complexity: {time: "O(D * 10 * digit_sum) where D is the number of digits of limit", space: "O(D * digit_sum)"}
rubric:
  excellent: "Explains the tight-prefix idea, precomputes how many free digit strings of each length reach each sum (or memoises a digit DP with a tight flag), handles limit itself and the exclusion of zero, prunes impossible sums and uses 64-bit counts."
  good: "Correct memoised digit DP with a tight flag, with minor prompting on the boundary cases."
  weak: "Iterates over every ID, mixes up the inclusive bound, or counts zero for digit_sum = 0."
  criteria:
    correctness: "All tests pass, including digit_sum = 0, unreachable sums and limits that are powers of ten."
    efficiency: "Work depends on the number of digits, not the value of limit."
    code_quality: "The tight and free parts are clearly separated; table dimensions are justified."
    edge_cases: "limit = 1, digit_sum = 0, sums above 9 times the digit count, and limit itself matching."
    communication: "Explains why placing a smaller digit frees all later positions."
hints:
  - "Looping to limit is impossible, but limit has at most 16 digits. Think about building an ID digit by digit from the most significant position and comparing it with limit as you go."
  - "While your prefix equals limit's prefix you are constrained; the moment you place a digit smaller than limit's digit at some position, every later position may be any digit. Counting digit strings of a given length with a given sum is a small DP of its own."
  - "Precompute, for every length up to the number of digits and every sum up to digit_sum, how many digit strings (leading zeros allowed) reach that sum. Walk limit's digits keeping the sum still needed; at each position add, for every smaller digit, the number of free strings for the remaining positions that reach the remaining sum, then subtract limit's digit and stop if the need goes negative. Add one if limit itself matches, and remove the all-zero string when digit_sum is zero."
followups:
  - "How would you count IDs in an arbitrary range [low, high]?"
  - "How would you return the k-th smallest ID with the given digit sum?"
  - "What changes if IDs are written in base 16?"
  - "How would you produce the size of every bucket at once?"
common_errors:
  - "Counting 0 as an ID when digit_sum is 0."
  - "Forgetting to count limit itself."
  - "Using 32-bit integers for limit or the count."
  - "Continuing after the remaining sum goes negative, which adds invalid strings."
