version: 1
slug: failure_streak_probability
title: Failure Streak Probability
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, data_scientist, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Failure Streak Probability

  An uptime monitor runs `n` health checks against a service, one after another. Each check **fails**
  independently with probability `p` and passes otherwise. The paging policy raises an alert the moment
  **`k` or more consecutive checks have failed**.

  Return the probability that the alert is raised **at least once** during the `n` checks. Answers within
  `1e-6` of the expected value are accepted.

  ### Example 1
  ```
  Input:  n = 3, k = 2, p = 0.5
  Output: 0.375
  Explanation: Of the 8 equally likely pass/fail sequences, FFP, PFF and FFF contain two failures in a row.
  ```

  ### Example 2
  ```
  Input:  n = 4, k = 1, p = 0.25
  Output: 0.68359375
  Explanation: With k = 1 any single failure pages, so the answer is 1 - 0.75^4.
  ```

  ### Example 3
  ```
  Input:  n = 5, k = 3, p = 0.5
  Output: 0.25
  ```

  ### Constraints
  - `1 <= k <= n <= 1000`
  - `0.0 <= p <= 1.0`

  **Follow-up:** can you make the running time independent of `k`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: prob_streak_at_least
  params:
    - {name: n, type: "int"}
    - {name: k, type: "int"}
    - {name: p, type: "float"}
  return_type: "float"
  comparison: float_tolerance
  tolerance: 1e-06
reference_solutions:
  python: |
    def prob_streak_at_least(n: int, k: int, p: float) -> float:
        # quiet[j] = probability that no alert has fired yet and the current
        # run of consecutive failures has length exactly j (0 <= j < k).
        quiet = [0.0] * k
        quiet[0] = 1.0
        for _ in range(n):
            nxt = [0.0] * k
            nxt[0] = sum(quiet) * (1.0 - p)
            for j in range(k - 1):
                nxt[j + 1] = quiet[j] * p
            quiet = nxt
        return 1.0 - sum(quiet)
  javascript: |
    function probStreakAtLeast(n, k, p) {
      let quiet = new Array(k).fill(0);
      quiet[0] = 1;
      for (let step = 0; step < n; step++) {
        const nxt = new Array(k).fill(0);
        let total = 0;
        for (const v of quiet) total += v;
        nxt[0] = total * (1 - p);
        for (let j = 0; j + 1 < k; j++) nxt[j + 1] = quiet[j] * p;
        quiet = nxt;
      }
      let remaining = 0;
      for (const v of quiet) remaining += v;
      return 1 - remaining;
    }
tests:
  - {id: t1, args: [3, 2, 0.5], expected: 0.375, description: "Example 1"}
  - {id: t2, args: [4, 1, 0.25], expected: 0.68359375, description: "Example 2 - k = 1 means any failure pages"}
  - {id: t3, args: [5, 3, 0.5], expected: 0.25, description: "Example 3"}
  - {id: t4, hidden: true, args: [1, 1, 0.37], expected: 0.37, description: "Minimum size: one check, k = 1, answer equals p"}
  - {id: t5, hidden: true, args: [6, 6, 0.5], expected: 0.015625, description: "k equals n: only the all-fail sequence pages (1/64)"}
  - {id: t6, hidden: true, args: [10, 3, 0.0], expected: 0.0, description: "p = 0: checks never fail, probability must be exactly 0"}
  - {id: t7, hidden: true, args: [10, 4, 1.0], expected: 1.0, description: "p = 1: every check fails, probability must be 1"}
  - {id: t8, hidden: true, args: [30, 5, 0.75], expected: 0.9443400179918838, description: "High failure rate over a moderate window"}
  - {id: t9, hidden: true, args: [365, 4, 0.1], expected: 0.03207737366849717, description: "Daily checks for a year with a low failure rate"}
  - {id: t10, hidden: true, args: [1000, 10, 0.5], expected: 0.38544975241248125, description: "Stress: n = 1000 with k = 10; catches exponential enumeration"}
  - {id: t11, hidden: true, args: [1000, 1000, 0.999], expected: 0.36769542477096406, description: "Worst case k = n = 1000; answer is 0.999^1000, an O(n*k) DP must still finish"}
expected_concepts:
  - "complementary counting: probability that no alert fires"
  - "DP state is the length of the current failure run"
  - "transition: a pass resets the run, a failure extends it"
  - "dropping (absorbing) states that reach k failures"
  - "O(n * k) time with O(k) rolling memory"
optimal_complexity: {time: "O(n * k), or O(n) with a running-sum recurrence", space: "O(k)"}
rubric:
  excellent: "Models the problem as the complement of 'no run of k failures', defines a clean DP over the current run length, keeps only the previous step, handles p = 0 and p = 1, states O(n * k) time and O(k) space, and can sketch the O(n) recurrence."
  good: "Correct DP over position and run length (possibly a full n by k table) with the right complexity after some prompting."
  weak: "Enumerates all 2^n outcomes, multiplies probabilities as if runs were independent, or only counts runs of exactly k."
  criteria:
    correctness: "All tests pass within tolerance, including p = 0, p = 1 and k = n."
    efficiency: "Polynomial DP; no enumeration of outcome sequences."
    code_quality: "State meaning is documented; rolling arrays instead of a large table."
    edge_cases: "k = 1, k = n, n = 1 and the extreme probabilities."
    communication: "Explains why counting the complement is easier than counting alerts directly."
hints:
  - "It is easier to compute the probability that the alert never fires and subtract it from one."
  - "While no alert has fired, the only thing that matters about the past is how many failures in a row end the sequence so far."
  - "Keep, for every run length from zero to k minus one, the probability of being in that state with no alert yet; each new check moves all mass to run length zero with probability one minus p, or shifts a run up by one with probability p, and mass that would reach k is dropped. The answer is one minus the remaining mass after n checks."
followups:
  - "How would you get O(n) time regardless of k?"
  - "How would you return the expected number of separate alerts instead of the probability of at least one?"
  - "What changes if each check has its own failure probability?"
  - "How would you guard against floating-point underflow for very long runs?"
common_errors:
  - "Enumerating every pass/fail sequence, which is exponential in n."
  - "Counting only runs of exactly k failures instead of k or more."
  - "Assuming non-overlapping windows of k checks are the only places an alert can start."
  - "Forgetting that a passing check resets the run length to zero."
