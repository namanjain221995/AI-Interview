version: 1
slug: min_token_segmentation
title: "Minimum Token Segmentation"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, llm, ml, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Minimum Token Segmentation

  An LLM platform team is evaluating a custom vocabulary for a domain-specific tokenizer. Shorter token
  sequences mean cheaper prompts, so for each sample text they want the **fewest tokens** the vocabulary
  can produce.

  Write `min_token_segmentation(text, vocabulary)` that returns the minimum number of vocabulary entries
  whose concatenation, in order, equals `text` exactly.

  - Any entry may be used any number of times, and `vocabulary` may contain duplicates.
  - Tokens must cover `text` completely, with no gaps and no overlaps.
  - Return `0` when `text` is empty, and `-1` when `text` cannot be built from the vocabulary.

  ### Example 1
  ```
  Input:  text = "unbreakable", vocabulary = ["un", "break", "able", "unbreak", "a", "ble"]
  Output: 2
  Explanation: "unbreak" + "able" uses 2 tokens; "un" + "break" + "able" would use 3.
  ```

  ### Example 2
  ```
  Input:  text = "tokenizer", vocabulary = ["token", "iz", "ize", "r", "to", "ken", "e"]
  Output: 3
  Explanation: "token" + "ize" + "r".
  ```

  ### Example 3
  ```
  Input:  text = "graph", vocabulary = ["gr", "ap", "raph"]
  Output: -1
  Explanation: No combination of entries spells "graph".
  ```

  ### Constraints
  - `0 <= text.length <= 300`
  - `0 <= vocabulary.length <= 200`
  - `1 <= vocabulary[i].length <= 20`
  - `text` and every entry consist only of lowercase English letters.

  **Follow-up:** what is the running time of your approach in terms of the text length and the longest entry, and how would a trie of the vocabulary change it?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_token_segmentation
  params:
    - {name: text, type: "string"}
    - {name: vocabulary, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_token_segmentation(text: str, vocabulary: list[str]) -> int:
        vocab = set(vocabulary)
        lengths = sorted({len(token) for token in vocab})
        n = len(text)
        unreachable = n + 1
        # fewest[i] is the minimum number of tokens that build text[:i].
        fewest = [unreachable] * (n + 1)
        fewest[0] = 0
        for i in range(n):
            if fewest[i] == unreachable:
                continue
            for length in lengths:
                end = i + length
                if end > n:
                    break
                if fewest[i] + 1 < fewest[end] and text[i:end] in vocab:
                    fewest[end] = fewest[i] + 1
        return fewest[n] if fewest[n] != unreachable else -1
  javascript: |
    function minTokenSegmentation(text, vocabulary) {
      const vocab = new Set(vocabulary);
      const lengths = [...new Set([...vocab].map((t) => t.length))].sort((a, b) => a - b);
      const n = text.length;
      const unreachable = n + 1;
      const fewest = new Array(n + 1).fill(unreachable);
      fewest[0] = 0;
      for (let i = 0; i < n; i++) {
        if (fewest[i] === unreachable) continue;
        for (const length of lengths) {
          const end = i + length;
          if (end > n) break;
          if (fewest[i] + 1 < fewest[end] && vocab.has(text.slice(i, end))) {
            fewest[end] = fewest[i] + 1;
          }
        }
      }
      return fewest[n] !== unreachable ? fewest[n] : -1;
    }
tests:
  - {id: t1, args: ["unbreakable", ["un", "break", "able", "unbreak", "a", "ble"]], expected: 2, description: "Example 1 - longer token gives fewer pieces"}
  - {id: t2, args: ["tokenizer", ["token", "iz", "ize", "r", "to", "ken", "e"]], expected: 3, description: "Example 2 - three tokens, several valid splits"}
  - {id: t3, args: ["graph", ["gr", "ap", "raph"]], expected: -1, description: "Example 3 - impossible segmentation"}
  - {id: t4, hidden: true, args: ["", ["a"]], expected: 0, description: "Empty text needs 0 tokens"}
  - {id: t5, hidden: true, args: ["abc", []], expected: -1, description: "Empty vocabulary with non-empty text returns -1"}
  - {id: t6, hidden: true, args: ["xyzab", ["xyza", "xyz", "ab"]], expected: 2, description: "Greedy longest-first takes xyza and dead-ends; correct answer needs xyz + ab"}
  - {id: t7, hidden: true, args: ["aaaaaaa", ["aaa", "aa"]], expected: 3, description: "Greedy longest-first leaves one character; optimum is aaa + aa + aa"}
  - {id: t8, hidden: true, args: ["logloglog", ["log", "log", "lo", "g", "loglog"]], expected: 2, description: "Duplicate entries in the vocabulary"}
  - {id: t9, hidden: true, args: ["id", ["identifier", "i", "d"]], expected: 2, description: "Entry longer than the text must be skipped safely"}
  - {id: t10, hidden: true, args: ["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaab", ["a", "aa", "aaa", "aaaa"]], expected: -1, description: "Unreachable last character; plain recursion without memoisation explodes"}
  - {id: t11, hidden: true, args: ["trtrreamindatareinglakeeamdataingtrresstdataamreeamdatainamtrinatrdatareamareamtrstrdatdatinadatasdattreamaaamdataregeamdatreamdatalakegsretramaameamlaketrreainaminglakereindataaadattrdatastsreamdatareamaglakestininredattreameamgtrdatstdatintrdataamlakeingtramreamlakereamglakestdatsreamream", ["st", "ream", "ing", "re", "am", "s", "tr", "eam", "in", "g", "data", "dat", "a", "lake", "stream", "streaming", "datalake", "amin", "ingre", "lakes"]], expected: 115, description: "Stress - text of about 300 characters with overlapping prefixes in the vocabulary"}
expected_concepts:
  - "dynamic programming over prefix lengths"
  - "hash set (or trie) for constant-time token lookups"
  - "minimisation rather than a yes/no reachability check"
  - "only trying token lengths that exist in the vocabulary"
  - "why greedy longest-match is wrong"
optimal_complexity: {time: "O(n * L^2) with L = longest entry (O(n * L) with a trie)", space: "O(n + total vocabulary length)"}
rubric:
  excellent: "Defines the best token count for every prefix, iterates positions with vocabulary lookups via a set or trie, returns 0 and -1 correctly, explains why greedy fails with a counterexample and states the complexity in terms of text length and entry length."
  good: "Correct prefix DP or memoised recursion with set lookups, perhaps trying every vocabulary entry at each position, with the right edge-case results."
  weak: "Uses greedy longest-match, plain exponential recursion, returns a boolean-style answer instead of the minimum, or mishandles the empty text."
  criteria:
    correctness: "Exact minimum on reachable texts, -1 on impossible ones and 0 on empty text."
    efficiency: "Polynomial in the text length; avoids recomputing the same suffix or prefix."
    code_quality: "Clear meaning for the table and a sentinel for unreachable positions."
    edge_cases: "Empty text, empty vocabulary, duplicates and entries longer than the text."
    communication: "Gives a counterexample to greedy and explains the state definition."
hints:
  - "If you knew the fewest tokens needed for every shorter prefix of the text, how would you extend that to a longer prefix?"
  - "Keep a table indexed by prefix length; a prefix ending at position j can be finished by any vocabulary entry that matches the text exactly just before j."
  - "Start with zero tokens for the empty prefix and mark every other prefix unreachable; from each reachable position, try every entry length that appears in the vocabulary, look the substring up in a set and keep the smaller count at the end position; the answer is the value for the full length, or minus one if it is still unreachable."
followups:
  - "How would you return the actual token sequence, and which one if several are optimal?"
  - "How would you weight tokens by cost instead of counting them?"
  - "Real tokenizers such as BPE are greedy by design; when does that differ from this minimum?"
common_errors:
  - "Greedily taking the longest matching entry at each position."
  - "Plain recursion without memoisation, which is exponential on texts like many a's followed by b."
  - "Returning 1 or -1 for an empty text instead of 0."
  - "Slicing past the end of the text or comparing every entry character by character without a set."
