expected_concepts:
  - "ways[v] after h hops = number of sequences ending at v"
  - "push counts along every edge once per hop"
  - "sum over all end services at the end"
  - "modulo 1_000_000_007 on every addition"
  - "O(hops * (n + edges)) instead of enumerating paths"
optimal_complexity: {time: "O(hops * (n + E))", space: "O(n + E)"}
rubric:
  excellent: "Keeps a count per service for the current number of hops, advances it one hop at a time by pushing counts along every edge, applies the modulo throughout, sums the final row, handles hops = 0, and mentions matrix exponentiation for very large hop counts."
  good: "Correct layered DP or memoised recursion on (service, hops left) with the modulo; may need a prompt for hops = 0 or the final sum."
  weak: "Enumerates paths with DFS or BFS (exponential), counts only simple paths, or returns the count for a single end service."
  criteria:
    correctness: "All tests pass, including hops = 0, dead ends and self-calls."
    efficiency: "Linear in hops times the graph size; no explicit path enumeration."
    code_quality: "Adjacency handled cleanly with a fresh row per hop so counts do not leak within a step."
    edge_cases: "No edges, a starting service without outgoing calls, self-loops and very long sequences."
    communication: "Explains why updating the row in place would double count within a hop."
hints:
  - "Listing every sequence explodes quickly. What do you really need to know about the sequences of a given length?"
  - "Only the number of sequences that currently end at each service matters; one more hop moves those counts along the outgoing edges."
  - "Keep an array of counts per service with a single one at start; for each hop build a fresh array by adding each service's count to every service it can call, reducing modulo 1_000_000_007, then return the sum of the final array."
followups:
  - "How would you handle hops up to 10^18?"
  - "What if each call had a latency and you needed the number of sequences within a latency budget?"
  - "How would you count only sequences that end at a specific service?"
  - "What changes if a sequence may not call the same service twice in a row?"
common_errors:
  - "Updating the count array in place so a count travels several edges in one hop."
  - "Returning 0 for hops = 0 instead of 1."
  - "Enumerating paths explicitly, which is exponential in hops."
  - "Forgetting the modulo on intermediate sums."
