version: 1
slug: service_hop_sequences
title: Service Hop Sequences
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, network, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Service Hop Sequences

  A platform team is estimating how many distinct request paths a tracing system may need to record. The
  service mesh has `n` services numbered `0` to `n - 1`, and `edges` lists the allowed directed calls:
  `[u, v]` means service `u` may call service `v`. A service may be allowed to call itself (`u = v`),
  and no call `[u, v]` is listed twice.

  A **call sequence** starts at service `start` and follows exactly `hops` calls, each along an allowed
  edge. It may end at any service, and services (and edges) may be revisited. Two sequences are
  different when their lists of visited services differ. Return the number of call sequences
  **modulo `1_000_000_007`**. With `hops = 0` the only sequence is the one that stays at `start`, so the
  answer is `1`.

  ### Example 1
  ```
  Input:  n = 3, edges = [[0, 1], [1, 2], [2, 0], [0, 2]], start = 0, hops = 3
  Output: 3
  Explanation: 0 -> 1 -> 2 -> 0, 0 -> 2 -> 0 -> 1 and 0 -> 2 -> 0 -> 2.
  ```

  ### Example 2
  ```
  Input:  n = 2, edges = [[0, 1]], start = 1, hops = 1
  Output: 0
  Explanation: Service 1 has no outgoing calls, so no sequence of one hop exists.
  ```

  ### Constraints
  - `1 <= n <= 100`
  - `0 <= edges.length <= 1000`, each `edges[i] = [u, v]` with `0 <= u, v < n`, no duplicates
  - `0 <= start < n`
  - `0 <= hops <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_hop_sequences
  params:
    - {name: n, type: int}
    - {name: edges, type: "int[][]"}
    - {name: start, type: int}
    - {name: hops, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_hop_sequences(n: int, edges: list[list[int]], start: int, hops: int) -> int:
        mod = 1_000_000_007
        # ways[v] = number of sequences of the current length that end at service v
        ways = [0] * n
        ways[start] = 1
        for _ in range(hops):
            nxt = [0] * n
            for u, v in edges:
                if ways[u]:
                    nxt[v] = (nxt[v] + ways[u]) % mod
            ways = nxt
        return sum(ways) % mod
  javascript: |
    function countHopSequences(n, edges, start, hops) {
      const MOD = 1000000007;
      const out = Array.from({ length: n }, () => []);
      for (const [u, v] of edges) out[u].push(v);
      let ways = new Array(n).fill(0);
      ways[start] = 1;
      for (let h = 0; h < hops; h++) {
        const next = new Array(n).fill(0);
        for (let u = 0; u < n; u++) {
          if (ways[u] === 0) continue;
          for (const v of out[u]) next[v] = (next[v] + ways[u]) % MOD;
        }
        ways = next;
      }
      let total = 0;
      for (const w of ways) total = (total + w) % MOD;
      return total;
    }
