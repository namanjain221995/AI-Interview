title: Twin Robot Collection
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, mobile]
time_limit_minutes: 30
prompt_markdown: |
  ## Twin Robot Collection

  A fulfilment centre lays out its pick zone as a grid: `grid[r][c]` is the number of items waiting in
  bay `(r, c)`. Two picking robots work the zone together:

  - Robot A starts in the top-left bay `(0, 0)` and robot B in the top-right bay `(0, cols - 1)`.
  - On every step **both** robots move down exactly one row. A robot in column `c` moves to column
    `c - 1`, `c` or `c + 1` of the next row and must stay inside the grid.
  - A robot collects every item in each bay it visits, including its start bay. If both robots are in
    the same bay at the same time, its items are collected **once**.
  - The run ends when the robots reach the bottom row.

  Return the **maximum total number of items** the two robots can collect.

  ### Example 1
  ```
  Input:  grid = [[4, 0, 2, 6],
                  [1, 3, 5, 0],
                  [0, 7, 2, 1]]
  Output: 27
  Explanation: Robot A visits columns 0, 1, 1 and collects 4 + 3 + 7 = 14.
  Robot B visits columns 3, 2, 2 and collects 6 + 5 + 2 = 13. Total 27.
  ```

  ### Example 2
  ```
  Input:  grid = [[5], [3], [2]]
  Output: 10
  Explanation: With a single column both robots share every bay, so each bay counts once.
  ```

  ### Constraints
  - `1 <= rows, cols <= 70`
  - `0 <= grid[r][c] <= 100`
  - When `cols = 1` both robots start in the same bay.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_two_robot_collection
  params:
    - {name: grid, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def max_two_robot_collection(grid: list[list[int]]) -> int:
        rows, cols = len(grid), len(grid[0])
        neg = float("-inf")
        dp = [[neg] * cols for _ in range(cols)]
        first = grid[0][0] + (grid[0][cols - 1] if cols > 1 else 0)
        dp[0][cols - 1] = first
        for r in range(1, rows):
            nxt = [[neg] * cols for _ in range(cols)]
            for a in range(cols):
                for b in range(cols):
                    if dp[a][b] == neg:
                        continue
                    for na in (a - 1, a, a + 1):
                        if not 0 <= na < cols:
                            continue
                        for nb in (b - 1, b, b + 1):
                            if not 0 <= nb < cols:
                                continue
                            gain = grid[r][na] + (grid[r][nb] if nb != na else 0)
                            if dp[a][b] + gain > nxt[na][nb]:
                                nxt[na][nb] = dp[a][b] + gain
            dp = nxt
        return int(max(max(row) for row in dp))
  javascript: |
    function maxTwoRobotCollection(grid) {
      const rows = grid.length;
      const cols = grid[0].length;
      const NEG = -Infinity;
      const fresh = () => Array.from({ length: cols }, () => new Array(cols).fill(NEG));
      let dp = fresh();
      dp[0][cols - 1] = grid[0][0] + (cols > 1 ? grid[0][cols - 1] : 0);
      for (let r = 1; r < rows; r++) {
        const next = fresh();
        for (let a = 0; a < cols; a++) {
          for (let b = 0; b < cols; b++) {
            if (dp[a][b] === NEG) continue;
            for (let na = a - 1; na <= a + 1; na++) {
              if (na < 0 || na >= cols) continue;
              for (let nb = b - 1; nb <= b + 1; nb++) {
                if (nb < 0 || nb >= cols) continue;
                const gain = grid[r][na] + (nb !== na ? grid[r][nb] : 0);
                if (dp[a][b] + gain > next[na][nb]) next[na][nb] = dp[a][b] + gain;
              }
            }
          }
        }
        dp = next;
      }
      let best = NEG;
      for (const row of dp) for (const v of row) if (v > best) best = v;
      return best;
    }
