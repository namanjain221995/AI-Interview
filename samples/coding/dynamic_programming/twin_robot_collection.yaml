expected_concepts:
  - "joint state (row, column of A, column of B) because the robots move in lockstep"
  - "nine combined moves per step"
  - "counting a shared bay once"
  - "row-by-row DP keeping only the previous row's cols x cols table"
  - "why optimising each robot separately is wrong"
optimal_complexity: {time: "O(rows * cols^2)", space: "O(cols^2)"}
rubric:
  excellent: "Recognises that both robots share the row index, defines the DP over (column of A, column of B) per row, handles the shared-bay rule, rolls the table to O(cols^2) memory and explains why greedy or independent paths fail."
  good: "Correct memoised recursion or 3D table over (row, colA, colB) with the right complexity and the shared-bay rule."
  weak: "Optimises each robot independently, double-counts shared bays, or enumerates all path pairs."
  criteria:
    correctness: "All tests pass, including a single row, a single column and paths that want the same bay."
    efficiency: "O(rows * cols^2) states with constant work per transition."
    code_quality: "Bounds checks and the unreachable-state sentinel are clear; no duplicated move logic."
    edge_cases: "One column (shared start), one row, all zeros and a large value both robots compete for."
    communication: "Explains why the two paths must be optimised jointly."
hints:
  - "Both robots move down one row on every step, so they are always on the same row. What is the smallest description of where the pair is at any moment?"
  - "Use a state made of the current row plus the column of each robot. From one state there are at most nine next states, and the value gained is the two bays on the new row, counted once if the columns coincide."
  - "Process rows top to bottom with a cols by cols table of the best total for each pair of columns, starting with only the pair (0, last column) reachable. For each reachable pair try the three moves of each robot, skip moves that leave the grid, add the collected items (once when both land in the same bay) and keep the maximum per new pair; the answer is the best entry after the last row."
followups:
  - "Why does running a single-robot DP twice, removing the first robot's items, give a wrong answer?"
  - "How would you reconstruct both routes?"
  - "How would the state grow with three robots?"
  - "What changes if a robot may also stay on the same row for a step?"
common_errors:
  - "Optimising robot A first and then robot B on what remains."
  - "Adding a shared bay's items twice."
  - "Starting both robots from every column instead of the fixed corners."
  - "Allowing moves outside the grid or treating unreachable states as zero."
