slug: hop_limited_cheapest_route
title: "Hop-Limited Cheapest Route"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, network, backend, cloud]
time_limit_minutes: 25
prompt_markdown: |
  ## Hop-Limited Cheapest Route

  A platform team replicates backups between `n` cloud regions numbered `0` to `n - 1`. Each row
  `links[i] = [u, v, cost]` is a **one-way** transfer link from region `u` to region `v` that charges
  `cost` credits per backup copy. A copy can be relayed through intermediate regions, but every extra
  relay adds lag, so a route may use **at most `max_hops` links**.

  Return the minimum total cost of moving a copy from region `src` to region `dst` using **at most
  `max_hops` links**.

  - If `src == dst`, the answer is `0` (no links are needed).
  - If no route within the hop limit exists, return `-1`.
  - Several links may join the same pair of regions, and a route may pass through a region more than once.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1, 100], [1, 2, 100], [2, 3, 100], [0, 2, 500], [1, 3, 600]], src = 0, dst = 3, max_hops = 2
  Output: 600
  Explanation: The route 0 -> 1 -> 2 -> 3 costs 300 but uses 3 links. With at most 2 links the options are 0 -> 2 -> 3 (600) and 0 -> 1 -> 3 (700), so the answer is 600.
  ```

  ### Example 2
  ```
  Input:  n = 3, links = [[0, 1, 5], [1, 2, 5], [0, 2, 20]], src = 0, dst = 2, max_hops = 2
  Output: 10
  Explanation: 0 -> 1 -> 2 costs 10 using 2 links, cheaper than the direct link at 20.
  ```

  ### Example 3
  ```
  Input:  n = 3, links = [[0, 1, 4], [1, 0, 4]], src = 0, dst = 2, max_hops = 5
  Output: -1
  Explanation: No link leads into region 2.
  ```

  ### Constraints
  - `1 <= n <= 100`
  - `0 <= links.length <= 5000`
  - `links[i].length == 3`, `0 <= u, v < n`, `u != v`
  - `0 <= cost <= 10^4`
  - `0 <= src, dst < n`
  - `0 <= max_hops <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cheapest_route_with_hop_limit
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
    - {name: src, type: "int"}
    - {name: dst, type: "int"}
    - {name: max_hops, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def cheapest_route_with_hop_limit(n: int, links: list[list[int]], src: int, dst: int, max_hops: int) -> int:
        inf = float("inf")
        # best[v] = cheapest cost to reach v using at most the number of links processed so far
        best = [inf] * n
        best[src] = 0
        for _ in range(max_hops):
            nxt = best[:]  # relax from the previous round only, so each round adds at most one link
            changed = False
            for u, v, cost in links:
                if best[u] != inf and best[u] + cost < nxt[v]:
                    nxt[v] = best[u] + cost
                    changed = True
            best = nxt
            if not changed:
                break
        return -1 if best[dst] == inf else int(best[dst])
  javascript: |
    function cheapestRouteWithHopLimit(n, links, src, dst, maxHops) {
      let best = new Array(n).fill(Infinity);
      best[src] = 0;
      for (let round = 0; round < maxHops; round++) {
        const next = best.slice();
        let changed = false;
        for (const [u, v, cost] of links) {
          if (best[u] !== Infinity && best[u] + cost < next[v]) {
            next[v] = best[u] + cost;
            changed = true;
          }
        }
        best = next;
        if (!changed) break;
      }
      return best[dst] === Infinity ? -1 : best[dst];
    }
