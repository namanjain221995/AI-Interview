expected_concepts:
  - "Bellman-Ford style relaxation limited to max_hops rounds"
  - "relaxing from a copy of the previous round so each round adds at most one link"
  - "plain Dijkstra on cost alone ignores the hop limit; a (region, hops) state fixes it"
  - "early exit when a round changes nothing"
  - "O(max_hops * (n + E)) time and O(n) space"
optimal_complexity: {time: "O(max_hops * (n + E))", space: "O(n)"}
rubric:
  excellent: "Explains why plain shortest paths fail under a hop limit, runs max_hops rounds of relaxation from a snapshot of the previous round (or Dijkstra over region-and-hops states), handles src == dst, -1 and parallel links, and states the complexity."
  good: "Correct hop-limited relaxation or BFS by layers with minor prompting, possibly with an O(max_hops * n) table."
  weak: "Uses Dijkstra on cost alone, relaxes in place so a single round chains several links, or explores every route by brute force."
  criteria:
    correctness: "All tests pass, including the in-place relaxation trap, zero hop budget and unreachable destinations."
    efficiency: "Polynomial in n, links and max_hops; no enumeration of all routes."
    code_quality: "Clear separation between the previous and the next round; meaningful names for budget and cost arrays."
    edge_cases: "src == dst, max_hops = 0, one-way links, parallel links, zero-cost links and cycles."
    communication: "Explains why each round must read only the previous round's costs."
hints:
  - "Ask a smaller question first: what is the cheapest cost to reach each region using at most one link? Then at most two?"
  - "If you know the cheapest cost to every region with at most h links, one more pass over all links gives the answer for at most h + 1 links. Repeat that max_hops times."
  - "Keep an array of best costs initialised to infinity except zero at the source. For each of max_hops rounds, copy the array, relax every link reading costs from the old array and writing into the copy, then replace the old array. Reading from the copy instead would let one round chain several links. Return minus one if the destination is still infinite."
followups:
  - "Why does reading from the array you are updating break the hop limit?"
  - "How would you adapt Dijkstra so it respects the hop limit, and when would it be faster?"
  - "How would you also return the list of regions on the cheapest route?"
  - "What changes if links can have negative cost (for example a credit for using a link)?"
common_errors:
  - "Relaxing links in place, letting one round use several links and ignoring the hop budget."
  - "Running ordinary Dijkstra on cost and discarding routes that are cheaper but use more links."
  - "Treating max_hops as the number of intermediate regions instead of the number of links."
  - "Returning a sentinel infinity instead of -1 when the destination is unreachable."
