slug: replica_quorum_probability
title: "Replica Quorum Probability"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, data_scientist, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Replica Quorum Probability

  A storage cluster keeps `n` replicas of a dataset. From health-check history you estimate that
  replica `i` is healthy at any given moment with probability `probs[i]`, independently of every other
  replica. A read quorum is available when **at least `k`** replicas are healthy.

  Return the probability that a quorum is available. Answers within `1e-6` of the exact value are
  accepted.

  ### Example 1
  ```
  Input:  probs = [0.9, 0.8, 0.7], k = 2
  Output: 0.902
  Explanation: exactly two healthy: 0.9*0.8*0.3 + 0.9*0.2*0.7 + 0.1*0.8*0.7 = 0.398; all three: 0.504; total 0.902
  ```

  ### Example 2
  ```
  Input:  probs = [0.5, 0.5, 0.5, 0.5], k = 3
  Output: 0.3125
  Explanation: 5 of the 16 equally likely outcomes have at least 3 healthy replicas
  ```

  ### Constraints
  - `1 <= probs.length <= 1000`
  - `0 <= probs[i] <= 1`
  - `0 <= k <= probs.length`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: prob_at_least_k_healthy
  params:
    - {name: probs, type: "float[]"}
    - {name: k, type: "int"}
  return_type: "float"
  comparison: float_tolerance
  tolerance: 0.000001
reference_solutions:
  python: |
    def prob_at_least_k_healthy(probs: list[float], k: int) -> float:
        # dist[c] = probability that exactly c of the replicas seen so far are healthy
        dist = [1.0] + [0.0] * len(probs)
        for i, p in enumerate(probs):
            for c in range(i + 1, 0, -1):
                dist[c] = dist[c] * (1 - p) + dist[c - 1] * p
            dist[0] *= 1 - p
        return sum(dist[k:])
  javascript: |
    function probAtLeastKHealthy(probs, k) {
      const dist = new Array(probs.length + 1).fill(0);
      dist[0] = 1;
      for (let i = 0; i < probs.length; i++) {
        const p = probs[i];
        for (let c = i + 1; c > 0; c--) {
          dist[c] = dist[c] * (1 - p) + dist[c - 1] * p;
        }
        dist[0] *= 1 - p;
      }
      let total = 0;
      for (let c = k; c <= probs.length; c++) total += dist[c];
      return total;
    }
