expected_concepts:
  - "dynamic programming over the number of healthy replicas"
  - "adding one independent replica at a time"
  - "in-place update from high counts to low"
  - "summing the tail of the distribution"
  - "avoiding 2^n enumeration"
optimal_complexity: {time: "O(n^2) (O(n * k) if counts are capped at k)", space: "O(n)"}
rubric:
  excellent: "Builds the distribution of the healthy count one replica at a time, updates it in place in the right order, sums the tail from k, handles k = 0 and states O(n^2) or O(n*k) time."
  good: "Correct two-dimensional DP over replicas and counts, or the one-dimensional version after a hint."
  weak: "Enumerates all 2^n outcomes, returns the probability of exactly k, or mixes up p and 1 - p."
  criteria:
    correctness: "Passes all tests within tolerance, including k = 0, k = n and certain replicas."
    efficiency: "Polynomial DP instead of exponential enumeration of outcomes."
    code_quality: "The distribution array and its update rule are clearly named and commented."
    edge_cases: "Handles probabilities of exactly 0 or 1 and quorum sizes at both extremes."
    communication: "Explains why independence lets each replica be added with a simple recurrence."
hints:
  - "Listing every combination of healthy and unhealthy replicas is exponential; try adding replicas one at a time instead."
  - "Track the probability that exactly c of the replicas considered so far are healthy, for every c. How does adding one more replica change those values?"
  - "Keep an array where entry c is the probability that exactly c replicas so far are healthy, starting with certainty for zero replicas. For a new replica with probability p, each new entry is the old entry times one minus p plus the entry one count lower times p; update from the highest count down to reuse one array. At the end, sum the entries from k upward."
followups:
  - "How could you cap the array at k entries so the work becomes O(n*k)?"
  - "When would a normal approximation be good enough, and what error would it introduce?"
  - "How would correlated failures, such as replicas sharing a rack, change the model?"
common_errors:
  - "Enumerating all 2^n outcomes."
  - "Updating counts in increasing order in place, which reuses already-updated values."
  - "Returning the probability of exactly k healthy replicas instead of at least k."
  - "Mishandling k = 0, which must always give probability 1."
