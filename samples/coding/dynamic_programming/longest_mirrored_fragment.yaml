version: 1
slug: longest_mirrored_fragment
title: "Longest Mirrored Fragment"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, frontend, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Mirrored Fragment

  A UI test recorder stores every captured interaction as one character (letters and digits), so a test
  session becomes a string. When a session contains a long stretch that plays back identically in reverse,
  it often means a page was opened and then backed out of step by step, and the QA team wants to flag it.

  Write `longest_mirror_fragment(s)` that returns the longest **contiguous** fragment of `s` that reads
  the same forwards and backwards.

  - If several fragments share the maximum length, return the one that **starts earliest** in `s`.
  - A single character is a mirrored fragment, so any non-empty `s` has an answer of length at least 1.
  - Return the empty string `""` when `s` is empty.

  ### Example 1
  ```
  Input:  s = "xabacdcz"
  Output: "aba"
  Explanation: "aba" and "cdc" both have length 3; "aba" starts earlier.
  ```

  ### Example 2
  ```
  Input:  s = "q11qz"
  Output: "q11q"
  Explanation: The even-length fragment "q11q" is the longest.
  ```

  ### Constraints
  - `0 <= s.length <= 1000`
  - `s` consists only of lowercase English letters and digits.

  **Follow-up:** the straightforward check of every fragment is `O(n^3)`. Can you reach `O(n^2)` time with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_mirror_fragment
  params:
    - {name: s, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def longest_mirror_fragment(s: str) -> str:
        n = len(s)
        best_start, best_len = 0, 0
        # Centres 0 .. 2n-2: even centres sit on a character, odd centres between two characters.
        for centre in range(2 * n - 1):
            lo = centre // 2
            hi = lo + centre % 2
            while lo >= 0 and hi < n and s[lo] == s[hi]:
                lo -= 1
                hi += 1
            length = hi - lo - 1
            start = lo + 1
            if length > best_len or (length == best_len and start < best_start):
                best_start, best_len = start, length
        return s[best_start:best_start + best_len]
  javascript: |
    function longestMirrorFragment(s) {
      const n = s.length;
      let bestStart = 0;
      let bestLen = 0;
      for (let centre = 0; centre < 2 * n - 1; centre++) {
        let lo = Math.floor(centre / 2);
        let hi = lo + (centre % 2);
        while (lo >= 0 && hi < n && s[lo] === s[hi]) {
          lo--;
          hi++;
        }
        const length = hi - lo - 1;
        const start = lo + 1;
        if (length > bestLen || (length === bestLen && start < bestStart)) {
          bestStart = start;
          bestLen = length;
        }
      }
      return s.slice(bestStart, bestStart + bestLen);
    }
tests:
  - {id: t1, args: ["xabacdcz"], expected: "aba", description: "Example 1 - tie between two odd-length fragments broken by start index"}
  - {id: t2, args: ["q11qz"], expected: "q11q", description: "Example 2 - even-length answer"}
  - {id: t3, hidden: true, args: [""], expected: "", description: "Empty input returns the empty string"}
  - {id: t4, hidden: true, args: ["7"], expected: "7", description: "Single character"}
  - {id: t5, hidden: true, args: ["abcd"], expected: "a", description: "All distinct - first character wins the tie of length 1"}
  - {id: t6, hidden: true, args: ["9mm9kk9mm9"], expected: "9mm9kk9mm9", description: "Whole string mirrored, even length with repeated inner pairs"}
  - {id: t7, hidden: true, args: ["aaaa"], expected: "aaaa", description: "All identical characters"}
  - {id: t8, hidden: true, args: ["abcbxyyx"], expected: "xyyx", description: "Later even fragment (4) beats earlier odd fragment (3)"}
  - {id: t9, hidden: true, args: ["k1abba2cddc3"], expected: "abba", description: "Two equal even fragments; earliest start must be kept, not overwritten"}
  - {id: t10, hidden: true, args: [""], expected: "cababccccbcacbabacaaaabbaccaaazaaaccabbaaaacababcacbccccbabac", description: "Stress - 1000 characters with a planted 61-character mirrored fragment; O(n^3) checking is too slow in slower languages"}
expected_concepts:
  - "expanding outwards from each of the 2n-1 centres"
  - "handling odd and even fragment lengths"
  - "tie-breaking by earliest start"
  - "O(n^2) time and O(1) extra space versus O(n^3) brute force"
  - "awareness of Manacher's linear-time algorithm as an optional extension"
optimal_complexity: {time: "O(n^2)", space: "O(1)"}
rubric:
  excellent: "Expands around all 2n-1 centres (or uses an O(n^2) table and then removes it), handles odd and even lengths and the earliest-start tie rule explicitly, returns the empty string for empty input and explains the complexity; may mention Manacher's algorithm."
  good: "Correct O(n^2) solution using a boolean table of mirrored ranges, or centre expansion with a minor tie-break slip fixed after a test."
  weak: "Checks every fragment in O(n^3), misses even-length fragments, confuses fragments with subsequences, or returns the last instead of the earliest fragment on ties."
  criteria:
    correctness: "Right fragment for odd, even, tied, single-character and empty inputs."
    efficiency: "Quadratic time with constant extra memory."
    code_quality: "One expansion helper used for both centre kinds; start and length tracked rather than slicing in the loop."
    edge_cases: "Empty string, one character, all-distinct and all-identical strings."
    communication: "Explains why there are 2n-1 centres and how the tie rule is enforced."
hints:
  - "Every mirrored fragment has a middle point. Think about growing a fragment outwards from that middle rather than testing every start and end pair."
  - "A middle point can be a single character (odd length) or the gap between two neighbouring characters (even length), so there are about twice as many middles as characters."
  - "For each of the 2n-1 middles, move a left and a right position outwards while the characters match, record the start and length you reached, and replace the best only when the new length is strictly longer or equally long with an earlier start; return the empty string when nothing was recorded."
followups:
  - "How does Manacher's algorithm reuse earlier expansions to reach linear time?"
  - "How would you count all mirrored fragments instead of returning the longest?"
  - "What changes if the answer should ignore case or skip separator characters?"
common_errors:
  - "Only expanding around characters and missing even-length fragments."
  - "Overwriting the answer on equal length, which returns the latest instead of the earliest fragment."
  - "Off-by-one errors when converting the final expansion bounds back to a start and length."
  - "Treating the problem as a subsequence problem."
