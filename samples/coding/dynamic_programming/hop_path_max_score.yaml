expected_concepts:
  - "dynamic programming over the best total to reach each stage"
  - "sliding window maximum of previous DP values"
  - "monotonic double-ended queue"
  - "heap-based O(n log n) alternative"
  - "64-bit totals"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Writes the recurrence best[i] = scores[i] + max of the previous k bests, maintains the window maximum with a monotonic deque, handles n = 1 and 64-bit totals and states O(n) time."
  good: "Correct DP with a heap (O(n log n)) or the deque solution after a hint."
  weak: "Uses an O(n*k) rescan without improving it, hops greedily to the best visible stage, or forgets eviction from the window."
  criteria:
    correctness: "Passes all tests, including a single stage, all-negative scores and large values."
    efficiency: "O(n) with a monotonic deque, or O(n log n) with a heap, not O(n*k)."
    code_quality: "The deque invariant (indices with decreasing totals inside the window) is clear in the code."
    edge_cases: "Handles k at least n - 1, k = 1 and totals beyond 32 bits."
    communication: "Explains why an index dominated by a newer, larger total can be discarded permanently."
hints:
  - "The best total for reaching a stage depends only on the best totals of the k stages just before it."
  - "Rescanning those k values for every stage costs O(n*k). You need the maximum of a sliding window of DP values, maintained as the window moves forward."
  - "Keep a double-ended queue of stage indices whose best totals are in decreasing order. For each stage, drop indices from the front that are more than k stages behind, set this stage's total to its score plus the total at the front, then remove indices from the back whose totals are not larger than the new one before appending the current index."
followups:
  - "How would a max-heap version work, and what would it cost?"
  - "How would you reconstruct the stages the job lands on?"
  - "What if every hop also had a fixed cost that grew with its length?"
common_errors:
  - "Greedily hopping to the best stage in reach, which can miss better stages later."
  - "Rescanning the last k totals for every stage, giving O(n*k) time."
  - "Forgetting to evict indices that have fallen out of the window."
  - "Using 32-bit integers for the totals."
