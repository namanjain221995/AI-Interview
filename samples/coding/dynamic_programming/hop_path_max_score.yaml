slug: hop_path_max_score
title: "Hop Path Maximum Score"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Hop Path Maximum Score

  A batch job moves through a pipeline of stages numbered `0` to `n - 1`. Landing on stage `i` adds
  `scores[i]` to the job's score; scores can be negative (costly stages). The job starts on stage `0`
  and must finish on stage `n - 1`. From stage `i` it may hop forward to any stage from `i + 1` to
  `i + k` (never past the last stage), and it collects the score of every stage it lands on, including
  the first and the last.

  Return the **maximum total score** of a path from the first stage to the last.

  ### Example 1
  ```
  Input:  scores = [3, -6, 2, -4, -1, 5], k = 2
  Output: 9
  Explanation: land on stages 0, 2, 4 and 5: 3 + 2 + (-1) + 5 = 9
  ```

  ### Example 2
  ```
  Input:  scores = [5, -20, -30, -10, 8], k = 3
  Output: 3
  Explanation: the last stage is out of reach from stage 0, so the best path is 0, 3, 4: 5 + (-10) + 8 = 3
  ```

  ### Constraints
  - `1 <= scores.length <= 10^5`
  - `-10^9 <= scores[i] <= 10^9`
  - `1 <= k <= 10^5`
  - The answer can exceed the 32-bit integer range.

  **Follow-up:** an `O(n * k)` solution is too slow for the largest inputs; aim for `O(n)` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_score_hop_path
  params:
    - {name: scores, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def max_score_hop_path(scores: list[int], k: int) -> int:
        best = [0] * len(scores)
        best[0] = scores[0]
        window: deque[int] = deque([0])  # indices with decreasing best values
        for i in range(1, len(scores)):
            while window[0] < i - k:
                window.popleft()
            best[i] = scores[i] + best[window[0]]
            while window and best[window[-1]] <= best[i]:
                window.pop()
            window.append(i)
        return best[-1]
  javascript: |
    function maxScoreHopPath(scores, k) {
      const n = scores.length;
      const best = new Array(n).fill(0);
      best[0] = scores[0];
      const window = new Array(n);
      let head = 0;
      let tail = 0;
      window[tail++] = 0;
      for (let i = 1; i < n; i++) {
        while (window[head] < i - k) head++;
        best[i] = scores[i] + best[window[head]];
        while (tail > head && best[window[tail - 1]] <= best[i]) tail--;
        window[tail++] = i;
      }
      return best[n - 1];
    }
