version: 1
slug: voucher_combinations
title: "Voucher Combinations"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, fullstack, data_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Voucher Combinations

  A retail checkout service accepts store vouchers in a few fixed face values, listed in `denominations`
  (all values are distinct, and a customer may hold any number of vouchers of each value). Product wants to
  know how flexible the scheme is for a basket total of `amount`.

  Return the number of **different combinations** of vouchers whose face values add up to exactly `amount`.
  A combination is defined by how many vouchers of each value it uses, so the **order does not matter**:
  `2 + 5` and `5 + 2` are the same combination.

  - An `amount` of `0` has exactly one combination: use no vouchers.
  - The count can be very large, so return it **modulo `1_000_000_007`**.

  ### Example 1
  ```
  Input:  denominations = [2, 5, 10], amount = 10
  Output: 3
  Explanation: 10, 5 + 5, and 2 + 2 + 2 + 2 + 2.
  ```

  ### Example 2
  ```
  Input:  denominations = [3, 7], amount = 5
  Output: 0
  ```

  ### Example 3
  ```
  Input:  denominations = [4], amount = 0
  Output: 1
  ```

  ### Constraints
  - `1 <= denominations.length <= 100`
  - `1 <= denominations[i] <= 10^4`, all distinct
  - `0 <= amount <= 10^4`

  **Follow-up:** How would the solution change if order mattered, so that `2 + 5` and `5 + 2` were counted separately?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_voucher_combinations
  params:
    - {name: denominations, type: "int[]"}
    - {name: amount, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_voucher_combinations(denominations: list[int], amount: int) -> int:
        MOD = 1_000_000_007
        ways = [1] + [0] * amount  # ways[t] = combinations reaching total t
        # Denominations in the outer loop: each combination is built in one fixed order.
        for value in denominations:
            for total in range(value, amount + 1):
                ways[total] = (ways[total] + ways[total - value]) % MOD
        return ways[amount]
  javascript: |
    function countVoucherCombinations(denominations, amount) {
      const MOD = 1000000007;
      const ways = new Array(amount + 1).fill(0);
      ways[0] = 1;
      for (const value of denominations) {
        for (let total = value; total <= amount; total++) {
          ways[total] = (ways[total] + ways[total - value]) % MOD;
        }
      }
      return ways[amount];
    }
tests:
  - {id: t1, args: [[2, 5, 10], 10], expected: 3, description: "Example 1"}
  - {id: t2, args: [[3, 7], 5], expected: 0, description: "Example 2 - unreachable amount gives 0"}
  - {id: t3, args: [[4], 0], expected: 1, description: "Example 3 - amount 0 has one empty combination"}
  - {id: t4, hidden: true, args: [[1, 2], 4], expected: 3, description: "Order must not matter: 3 combinations, an ordered count would give 5"}
  - {id: t5, hidden: true, args: [[3, 5, 7], 1], expected: 0, description: "Amount smaller than every denomination"}
  - {id: t6, hidden: true, args: [[1000, 1], 999], expected: 1, description: "Large denomination never fits; only all ones"}
  - {id: t7, hidden: true, args: [[7], 49], expected: 1, description: "Single denomination dividing the amount"}
  - {id: t8, hidden: true, args: [[25, 10, 5, 1], 100], expected: 242, description: "Unsorted denominations, medium count"}
  - {id: t9, hidden: true, args: [[1], 10000], expected: 1, description: "Maximum amount with only unit vouchers"}
  - {id: t10, hidden: true, args: [[1, 2, 5, 10, 20, 50, 100, 200], 10000], expected: 296710490, description: "Count far above the modulus at the maximum amount"}
expected_concepts:
  - "counting DP over totals"
  - "outer loop over denominations to avoid counting permutations"
  - "base case of one way to make zero"
  - "modular arithmetic"
optimal_complexity: {time: "O(k * amount) where k is the number of denominations", space: "O(amount)"}
rubric:
  excellent: "Builds the one-dimensional counting table with denominations in the outer loop, explains why swapping the loops counts ordered sequences instead, sets the empty-combination base case, applies the modulus on each update and states O(k * amount) time with O(amount) space."
  good: "Correct two-dimensional DP or memoised recursion over (denomination index, remaining amount), or the 1-D version after fixing the loop order during testing."
  weak: "Counts ordered sequences, enumerates combinations explicitly, forgets the modulus, or returns 0 for amount 0."
  criteria:
    correctness: "All tests pass, including the order-sensitivity case and the large count."
    efficiency: "Pseudo-polynomial table in the number of denominations times the amount."
    code_quality: "Clear table meaning and loop order with a short comment on why it is in that order."
    edge_cases: "Amount 0, unreachable amounts and denominations larger than the amount."
    communication: "Explains the difference between counting combinations and counting sequences."
hints:
  - "Think about one denomination at a time: a combination either uses no vouchers of the current value, or at least one of them."
  - "If you count totals one by one and try every denomination for each total, you count 2 then 5 and 5 then 2 separately. Fix an order in which denominations are introduced so each combination is built only once."
  - "Keep a count for every total from zero to the amount, starting with one way to make zero. Process denominations one at a time; for each one, sweep the totals upward from its value and add the count for the total minus that value. Reduce modulo the prime at every addition."
followups:
  - "How would you count ordered sequences of vouchers instead, and why does the loop order change the answer?"
  - "What if each voucher value had a limited supply?"
  - "How would you list the combinations when the count is small?"
common_errors:
  - "Putting the totals in the outer loop, which counts permutations instead of combinations."
  - "Initialising the zero total to 0 instead of 1."
  - "Forgetting the modulus and overflowing 32-bit or 64-bit counters."
  - "Recursing over all combinations without memoisation."
