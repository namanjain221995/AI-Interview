expected_concepts:
  - "reusing the answer for i shifted right by one (or i with its lowest set bit cleared)"
  - "bottom-up table where every entry depends on a smaller index"
  - "O(n) time instead of counting bits one number at a time"
  - "including both 0 and n in the output"
optimal_complexity: {time: "O(n)", space: "O(1) extra beyond the output"}
rubric:
  excellent: "Derives a recurrence such as counts[i] = counts[i // 2] + lowest bit (or counts[i & (i - 1)] + 1), explains why the referenced entry is already filled, returns n + 1 entries and states O(n) time."
  good: "Correct table built with a recurrence after a hint, or a clean per-number bit count with an accurate O(n log n) analysis."
  weak: "Returns n entries instead of n + 1, relies only on a built-in popcount without explaining it, or converts every number to a string."
  criteria:
    correctness: "All tests pass, including n = 0 and values around powers of two."
    efficiency: "Linear time with each entry computed from one earlier entry."
    code_quality: "Short loop with a commented recurrence."
    edge_cases: "n = 0, powers of two and all-ones masks."
    communication: "Explains the relationship between i and i shifted right by one bit."
hints:
  - "Compare the binary form of a number with the binary form of the number you get by dropping its last binary digit."
  - "Dropping the last bit of i gives i divided by two, which is smaller than i, so its count is already in your table. How does the count of i differ from it?"
  - "Fill the table from 1 upwards. The count for i equals the count already stored for i divided by two (rounded down), plus one if i is odd and plus zero if it is even. Allocate n plus one entries so both 0 and n are included."
followups:
  - "Why does clearing the lowest set bit of i also give a valid recurrence?"
  - "How would you return only the masks that enable exactly k features?"
  - "How would the table change if masks were 64-bit and n could be huge?"
common_errors:
  - "Returning an array of length n and missing the entry for n itself."
  - "Counting bits of every number with an inner loop and calling it linear."
  - "Starting the loop at 0 and reading an out-of-range index."
