version: 1
slug: feature_mask_popcounts
title: Feature Mask Popcounts
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, frontend, platform]
time_limit_minutes: 12
prompt_markdown: |
  ## Feature Mask Popcounts

  A feature-flag service stores each customer configuration as an integer bit mask: bit `k` is set when
  feature `k` is enabled. For a dashboard the team wants a lookup table telling, for every mask from `0`
  up to `n`, how many features that mask enables.

  Return an array `counts` of length `n + 1` where `counts[i]` is the number of `1` bits in the binary
  representation of `i`, for every `0 <= i <= n`.

  ### Example 1
  ```
  Input:  n = 6
  Output: [0, 1, 1, 2, 1, 2, 2]
  Explanation: 0 = 0b0, 1 = 0b1, 2 = 0b10, 3 = 0b11, 4 = 0b100, 5 = 0b101, 6 = 0b110.
  ```

  ### Example 2
  ```
  Input:  n = 0
  Output: [0]
  ```

  ### Constraints
  - `0 <= n <= 10^5`

  **Follow-up:** counting the bits of each number separately takes `O(n log n)` time. Can you build the
  table in `O(n)` time by reusing entries you have already computed, without a built-in popcount?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_set_bits_table
  params:
    - {name: n, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def count_set_bits_table(n: int) -> list[int]:
        counts = [0] * (n + 1)
        for i in range(1, n + 1):
            # i has the same bits as i // 2, plus its lowest bit.
            counts[i] = counts[i >> 1] + (i & 1)
        return counts
  javascript: |
    function countSetBitsTable(n) {
      const counts = new Array(n + 1).fill(0);
      for (let i = 1; i <= n; i++) {
        counts[i] = counts[i >> 1] + (i & 1);
      }
      return counts;
    }
tests:
