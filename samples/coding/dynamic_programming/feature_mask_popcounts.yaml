  - {id: t2, args: [0], expected: [0], description: "Example 2 - only mask 0"}
  - {id: t3, hidden: true, args: [1], expected: [0, 1], description: "Smallest non-trivial table"}
  - {id: t4, hidden: true, args: [2], expected: [0, 1, 1], description: "Ends exactly on a power of two"}
  - {id: t5, hidden: true, args: [15], expected: [0, 1, 1, 2, 1, 2, 2, 3, 1, 2, 2, 3, 2, 3, 3, 4], description: "Ends on an all-ones mask (four bits set)"}
  - {id: t6, hidden: true, args: [16], expected: [0, 1, 1, 2, 1, 2, 2, 3, 1, 2, 2, 3, 2, 3, 3, 4, 1], description: "Ends one past an all-ones mask; count drops back to 1"}
