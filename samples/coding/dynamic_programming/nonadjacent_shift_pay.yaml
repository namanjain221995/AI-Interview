title: Non-Adjacent Shift Pay
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, frontend, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Non-Adjacent Shift Pay

  A contractor is offered a sequence of on-call shifts in time order, where shift `i` pays `pay[i]`.
  To avoid fatigue the agreement forbids back-to-back shifts: if the contractor takes shift `i`, they may
  not take shift `i - 1` or shift `i + 1`. Any other combination of shifts is allowed, including taking
  none.

  Return the **maximum total pay** the contractor can earn.

  - If `pay` is empty, return `0`.
  - Totals can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  pay = [4, 2, 7, 3]
  Output: 11
  Explanation: Take shifts 0 and 2 for 4 + 7.
  ```

  ### Example 2
  ```
  Input:  pay = [2, 9, 3, 1, 8]
  Output: 17
  Explanation: Take shifts 1 and 4 for 9 + 8.
  ```

  ### Example 3
  ```
  Input:  pay = []
  Output: 0
  ```

  ### Constraints
  - `0 <= pay.length <= 10^5`
  - `0 <= pay[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_shift_pay
  params:
    - {name: pay, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def max_shift_pay(pay: list[int]) -> int:
        # before: best total up to two shifts back; best: best total up to the previous shift
        before, best = 0, 0
        for amount in pay:
            before, best = best, max(best, before + amount)
        return best
  javascript: |
    function maxShiftPay(pay) {
      let before = 0;
      let best = 0;
      for (const amount of pay) {
        const next = Math.max(best, before + amount);
        before = best;
        best = next;
      }
      return best;
    }
