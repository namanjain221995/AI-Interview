expected_concepts:
  - "take-or-skip decision per shift"
  - "recurrence best(i) = max(best(i-1), best(i-2) + pay[i])"
  - "rolling two variables for O(1) memory"
  - "64-bit totals"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Frames each shift as take or skip, derives the two-term recurrence, implements it with two rolling variables, handles empty and single-element input without special cases and uses 64-bit totals."
  good: "Correct DP with an O(n) array or memoised recursion and the right complexity; may need a prompt about overflow or the empty list."
  weak: "Sums every other shift (odd or even indices), uses exponential recursion, or fails on empty input."
  criteria:
    correctness: "All tests pass, including empty input and plans that skip two shifts in a row."
    efficiency: "Linear time; constant memory for an excellent answer."
    code_quality: "Meaningful variable names and a simultaneous update of the two rolling values."
    edge_cases: "Empty list, one or two shifts, zeros and totals beyond 32 bits."
    communication: "Explains why alternating indices is not enough and how the recurrence covers skipping more than one shift."
hints:
  - "For each shift there are only two choices: take it or skip it. What does each choice mean for the shift just before it?"
  - "The best total up to shift i is either the best total up to the previous shift (skip i) or the best total up to two shifts back plus the pay for shift i (take i)."
  - "Keep two running values: the best total up to the previous shift and the best total up to the shift before that, both starting at zero. For each shift compute the larger of skipping and taking it, shift the two values along, and return the latest best value, using a 64-bit total."
followups:
  - "How would you return which shifts to take, not only the total?"
  - "What if the shifts formed a weekly cycle where the last shift is adjacent to the first?"
  - "What changes if the contractor must rest for two shifts after each shift taken?"
common_errors:
  - "Comparing only the sum of even indices with the sum of odd indices."
  - "Not handling an empty list or a single shift."
  - "Storing totals in 32-bit integers in typed languages."
  - "Updating the rolling variables in the wrong order and losing the value from two shifts back."
