slug: paired_task_sessions
title: Paired Task Sessions
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, qa]
time_limit_minutes: 12
prompt_markdown: |
  ## Paired Task Sessions

  A QA engineer works through a regression checklist whose tasks **must be handled in the given
  order**. Task `i` takes `durations[i]` minutes. Work happens in focused sessions of at most `cap`
  minutes, and a single session covers either:

  - exactly **one** task, or
  - exactly **two consecutive** tasks `i` and `i + 1` whose durations add up to **at most** `cap`.

  Every individual task fits in a session on its own (`durations[i] <= cap`). Return the **minimum
  number of sessions** needed to finish the whole checklist (`0` for an empty checklist).

  ### Example 1
  ```
  Input:  durations = [3, 5, 2, 6, 4], cap = 8
  Output: 3
  Explanation: Sessions [3, 5], [2, 6] and [4].
  ```

  ### Example 2
  ```
  Input:  durations = [4, 4, 4], cap = 7
  Output: 3
  Explanation: No two neighbouring tasks fit together, so each task needs its own session.
  ```

  ### Example 3
  ```
  Input:  durations = [5, 9, 5], cap = 10
  Output: 3
  Explanation: The two 5-minute tasks would fit together, but they are not consecutive.
  ```

  ### Constraints
  - `0 <= durations.length <= 10^5`
  - `1 <= cap <= 10^9`
  - `1 <= durations[i] <= cap`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_sessions_for_tasks
  params:
    - {name: durations, type: "int[]"}
    - {name: cap, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_sessions_for_tasks(durations: list[int], cap: int) -> int:
        # best[i] = fewest sessions for the first i tasks
        n = len(durations)
        best = [0] * (n + 1)
        for i in range(1, n + 1):
            best[i] = best[i - 1] + 1
            if i >= 2 and durations[i - 2] + durations[i - 1] <= cap:
                best[i] = min(best[i], best[i - 2] + 1)
        return best[n]
  javascript: |
    function minSessionsForTasks(durations, cap) {
      // Greedy: pair a task with its successor whenever they fit together.
      let sessions = 0;
      let i = 0;
      while (i < durations.length) {
        if (i + 1 < durations.length && durations[i] + durations[i + 1] <= cap) {
          i += 2;
        } else {
          i += 1;
        }
        sessions += 1;
      }
      return sessions;
    }
