expected_concepts:
  - "prefix state: fewest sessions for the first i tasks"
  - "two choices per step: a single task or the last two tasks together"
  - "pairs must be consecutive, so sorting is not allowed"
  - "64-bit or overflow-safe sum when durations approach 10^9"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines the prefix state with its two transitions (or proves the left-to-right greedy pairing is optimal), keeps O(1) extra memory, handles the empty list, and points out that two durations near 10^9 overflow a 32-bit sum."
  good: "Correct linear DP or greedy with a brief justification; may need a prompt about overflow or the empty input."
  weak: "Sorts the durations or pairs non-adjacent tasks, explores every pairing exponentially, or overflows when adding two large durations."
  criteria:
    correctness: "All tests pass, including the empty checklist and durations equal to cap."
    efficiency: "Single linear pass; no exponential enumeration of pairings."
    code_quality: "Clear state definition or a simple greedy loop with readable index handling."
    edge_cases: "Empty and single-task lists, a pair whose sum equals cap exactly, and very large durations."
    communication: "Explains why only consecutive pairs are allowed and why the chosen method is optimal."
hints:
  - "Think about the last session of an optimal plan: it either covers only the final task or the final two tasks."
  - "If you knew the fewest sessions for every shorter prefix of the checklist, the answer for one more task follows from at most two of those values."
  - "Let the value for the first i tasks be one more than the value for the first i minus 1 tasks, or one more than the value for the first i minus 2 tasks when the last two durations together fit within cap; take the smaller option and remember to add durations without 32-bit overflow."
followups:
  - "Can you prove that pairing greedily from the left is always optimal here?"
  - "What if a session could hold up to three consecutive tasks?"
  - "How would you return the actual grouping of tasks into sessions?"
  - "What if the tasks could be reordered freely?"
common_errors:
  - "Sorting the tasks, which breaks the required order."
  - "Pairing tasks that are not adjacent."
  - "Adding two durations near 10^9 in a 32-bit integer, so an impossible pair looks valid."
  - "Returning 1 instead of 0 for an empty checklist."
