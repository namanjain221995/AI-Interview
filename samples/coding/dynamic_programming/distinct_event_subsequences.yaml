version: 1
slug: distinct_event_subsequences
title: "Distinct Event Subsequences"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data, security]
time_limit_minutes: 30
prompt_markdown: |
  ## Distinct Event Subsequences

  A tracing system records each user session as an **event trace**: a string `s` in which every
  lowercase letter is one event code (for example `d` for deploy and `r` for rollback). Analysts want to
  know how many distinct event patterns are contained in a trace.

  A **subsequence** is obtained by deleting zero or more events without changing the order of the rest.
  Two subsequences are the **same pattern** when they are equal as strings, no matter which positions
  they were taken from.

  Return the number of distinct **non-empty** subsequences of `s`, modulo `1_000_000_007`.

  ### Example 1
  ```
  Input:  s = "ddr"
  Output: 5
  Explanation: d, r, dd, dr, ddr (dr can be formed in two ways but is one pattern)
  ```

  ### Example 2
  ```
  Input:  s = "abab"
  Output: 11
  Explanation: a, b, aa, ab, ba, bb, aab, aba, abb, bab, abab
  ```

  ### Constraints
  - `1 <= s.length <= 2000`
  - `s` consists of lowercase English letters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_distinct_event_subsequences
  params:
    - {name: s, type: "string"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_distinct_event_subsequences(s: str) -> int:
        mod = 1_000_000_007
        # ending[c]: distinct non-empty subsequences that end with event code c
        ending: dict[str, int] = {}
        total = 0
        for ch in s:
            # every distinct subsequence so far, plus the empty one, extended by ch
            new_ending = (total + 1) % mod
            total = (total - ending.get(ch, 0) + new_ending) % mod
            ending[ch] = new_ending
        return total
  javascript: |
    function countDistinctEventSubsequences(s) {
      const MOD = 1000000007;
      const ending = new Map();
      let total = 0;
      for (const ch of s) {
        const fresh = (total + 1) % MOD;
        total = (total - (ending.get(ch) || 0) + fresh + MOD) % MOD;
        ending.set(ch, fresh);
      }
      return total;
    }
tests:
  - {id: t1, args: ["ddr"], expected: 5, description: "Example 1"}
  - {id: t2, args: ["abab"], expected: 11, description: "Example 2"}
  - {id: t3, hidden: true, args: ["q"], expected: 1, description: "Single event"}
  - {id: t4, hidden: true, args: ["kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk"], expected: 40, description: "One event code repeated 40 times - only 40 distinct subsequences"}
  - {id: t5, hidden: true, args: ["abcdefghijklmnopqrstuvwxyz"], expected: 67108863, description: "All 26 codes once - 2^26 - 1 subsequences"}
  - {id: t6, hidden: true, args: ["xyzzyx"], expected: 42, description: "Palindrome with adjacent repeat"}
  - {id: t7, hidden: true, args: ["abcabcabcabcabcabcabcabcabcabcabcabcabcabcabcabcabcabcabcabc"], expected: 69376653, description: "Repeating cycle of three codes, 60 events - raw count (about 10^16) exceeds the modulus"}
  - {id: t8, hidden: true, args: [""], expected: 514539302, description: "1000 random events (stress, linear DP with modulo)"}
expected_concepts:
  - "counting distinct subsequences incrementally while scanning"
  - "per-character count of distinct patterns ending with that character"
  - "removing duplicates created by an earlier occurrence of the same character"
  - "modular subtraction kept non-negative"
  - "O(n) time with constant extra space for a fixed alphabet"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Derives the update from patterns ending in each character (or the last-occurrence formula), explains why only patterns ending in the same character can duplicate, keeps modular subtraction non-negative and gives O(n) time with 26 counters."
  good: "Correct DP with the last-occurrence subtraction, O(n) or O(26n), needing help to justify the duplicate rule or fix a negative modulo."
  weak: "Enumerates subsequences into a set, counts by positions so duplicates are counted twice, or includes the empty subsequence."
  criteria:
    correctness: "All tests pass, including a repeated single code, all 26 codes and long traces that need the modulus."
    efficiency: "Linear scan with constant work per event."
    code_quality: "Clear names for the total and the per-code counts; modulus defined once."
    edge_cases: "Single event, one code repeated, and traces whose raw count exceeds 64-bit range."
    communication: "Explains with a small example why appending a repeated code would otherwise double count."
hints:
  - "Scan the trace from left to right and ask how the set of distinct patterns changes when one more event is appended."
  - "Appending event c to every distinct pattern seen so far, and to the empty pattern, creates all patterns that end with c; the only repeats are patterns ending with c that already existed before this event."
  - "Keep the total number of distinct patterns and, for every event code, how many distinct patterns currently end with that code. When code c arrives, the number ending with c becomes the old total plus one, and the new total is the old total minus the previous count for c plus that new count. Apply the modulus after every update and add the modulus back if a subtraction goes negative."
followups:
  - "How would you count only the distinct subsequences of a fixed length k?"
  - "What changes if event codes were arbitrary integers instead of 26 letters?"
  - "How would you also count the empty pattern?"
  - "Why is storing all subsequences in a set infeasible even for 60 events?"
common_errors:
  - "Counting subsequences by positions, so patterns formed in several ways are counted more than once."
  - "Letting the running total go negative after a modular subtraction."
  - "Including the empty subsequence in the answer."
  - "Enumerating all 2^n subsets."
