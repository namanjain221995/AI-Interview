slug: dual_budget_job_count
title: Dual Budget Job Count
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, platform, devops, ml]
time_limit_minutes: 25
prompt_markdown: |
  ## Dual Budget Job Count

  A batch scheduler has a node with `cpu_cap` free CPU cores and `mem_cap` GB of free memory. There are
  `n` queued jobs; job `i` needs `cpu[i]` cores and `mem[i]` GB for its whole run, and all chosen jobs run
  at the same time on the node. Each job can be chosen **at most once**.

  Choose a set of jobs whose total cores is at most `cpu_cap` **and** whose total memory is at most
  `mem_cap`. Return the **maximum number of jobs** in such a set (`0` if no job fits).

  A job may need `0` cores or `0` GB of one resource (for example an I/O-bound job).

  ### Example 1
  ```
  Input:  cpu = [1, 4, 2, 3], mem = [5, 1, 2, 2], cpu_cap = 6, mem_cap = 5
  Output: 2
  Explanation: Job 0 needs only 1 core but takes all 5 GB, so it cannot share the node. Jobs 2 and 3 together use 5 cores and 4 GB. No three jobs fit.
  ```

  ### Example 2
  ```
  Input:  cpu = [2, 2, 2], mem = [3, 3, 3], cpu_cap = 6, mem_cap = 9
  Output: 3
  Explanation: All three jobs together use 6 cores and 9 GB, exactly the capacity.
  ```

  ### Example 3
  ```
  Input:  cpu = [5, 7], mem = [1, 1], cpu_cap = 4, mem_cap = 10
  Output: 0
  Explanation: Each job alone needs more cores than the 4 available.
  ```

  ### Constraints
  - `1 <= n == cpu.length == mem.length <= 100`
  - `0 <= cpu[i], mem[i] <= 100`
  - `0 <= cpu_cap, mem_cap <= 100`

  **Follow-up:** Why does sorting jobs by their smallest requirement not work here?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_jobs_two_budgets
  params:
    - {name: cpu, type: "int[]"}
    - {name: mem, type: "int[]"}
    - {name: cpu_cap, type: "int"}
    - {name: mem_cap, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_jobs_two_budgets(cpu: list[int], mem: list[int], cpu_cap: int, mem_cap: int) -> int:
        # best[c][m]: most jobs that fit within c cores and m GB among the jobs seen so far.
        best = [[0] * (mem_cap + 1) for _ in range(cpu_cap + 1)]
        for need_c, need_m in zip(cpu, mem):
            if need_c > cpu_cap or need_m > mem_cap:
                continue
            # Iterate budgets downwards so each job is used at most once.
            for c in range(cpu_cap, need_c - 1, -1):
                row, prev = best[c], best[c - need_c]
                for m in range(mem_cap, need_m - 1, -1):
                    if prev[m - need_m] + 1 > row[m]:
                        row[m] = prev[m - need_m] + 1
        return best[cpu_cap][mem_cap]
  javascript: |
    function maxJobsTwoBudgets(cpu, mem, cpuCap, memCap) {
      const best = Array.from({ length: cpuCap + 1 }, () => new Array(memCap + 1).fill(0));
      for (let i = 0; i < cpu.length; i++) {
        const needC = cpu[i];
        const needM = mem[i];
        if (needC > cpuCap || needM > memCap) continue;
        for (let c = cpuCap; c >= needC; c--) {
          const row = best[c];
          const prev = best[c - needC];
          for (let m = memCap; m >= needM; m--) {
            if (prev[m - needM] + 1 > row[m]) row[m] = prev[m - needM] + 1;
          }
        }
      }
      return best[cpuCap][memCap];
    }
