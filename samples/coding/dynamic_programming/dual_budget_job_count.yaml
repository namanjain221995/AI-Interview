expected_concepts:
  - "0/1 knapsack with two capacity dimensions"
  - "maximising count (each item worth 1)"
  - "iterating capacities downwards so each job is used once"
  - "why greedy by one resource fails"
  - "O(n * cpu_cap * mem_cap) time"
optimal_complexity: {time: "O(n * cpu_cap * mem_cap)", space: "O(cpu_cap * mem_cap)"}
rubric:
  excellent: "Recognises a two-dimensional 0/1 knapsack, gives a counterexample to greedy, implements the in-place table with downward iteration, handles zero-requirement jobs and states O(n * cpu_cap * mem_cap) time and O(cpu_cap * mem_cap) memory."
  good: "Correct three-dimensional table or memoised recursion with the right time complexity; memory not optimised."
  weak: "Greedy by one resource or by the sum of both, subset enumeration, or iterating capacities upwards so a job is reused."
  criteria:
    correctness: "All tests pass, including zero capacities, zero-requirement jobs and jobs that never fit."
    efficiency: "Pseudo-polynomial in the two capacities; no exponential subset search."
    code_quality: "Readable loops with named capacity indices; skips jobs that can never fit."
    edge_cases: "Zero capacity, zero requirements, duplicates and exactly-full capacity."
    communication: "Explains why the loops run from high to low budgets in the in-place version."
hints:
  - "Picking jobs with the smallest CPU (or smallest memory) first can waste the other resource; try to build a small example where that happens."
  - "This is a knapsack where every job is worth one and the knapsack has two capacities. Think of the best count achievable for every pair of remaining core and memory budgets."
  - "Keep a table indexed by cores used and memory used that holds the most jobs fitting within those budgets. For each job, update the table from the highest budgets down to the job's own requirements, taking the larger of the current entry and one plus the entry with the job's cores and memory removed; the answer is at the full capacities."
followups:
  - "How would you return which jobs to run, not just how many?"
  - "If each job also had a priority and you maximised total priority, what would change?"
  - "With capacities around 10^5 but only a few dozen jobs, which approach would you use instead?"
  - "How would you add a third resource such as GPU count, and how does the cost grow?"
common_errors:
  - "Sorting by one resource and taking jobs greedily."
  - "Iterating capacities upwards in the one-table version, which lets a job be used twice."
  - "Skipping jobs that need zero of a resource or zero of both."
  - "Tracking only one of the two budgets."
  - "Enumerating all subsets of up to 100 jobs."
