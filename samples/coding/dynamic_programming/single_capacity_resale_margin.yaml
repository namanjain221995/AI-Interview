time_limit_minutes: 12
prompt_markdown: |
  ## Single Capacity Resale Margin

  An internal capacity exchange lets teams trade reserved compute blocks. `prices[i]` is the spot price
  of one block on day `i`. Your team may make **at most one trade**: buy a single block on some day and
  resell it on a **strictly later** day.

  Return the **maximum profit** (resale price minus purchase price) the trade can make. If no trade
  would make a positive profit, return `0` (the team simply does not trade).

  ### Example 1
  ```
  Input:  prices = [9, 4, 6, 3, 8, 5]
  Output: 5
  Explanation: Buy on day 3 at 3 and resell on day 4 at 8.
  ```

  ### Example 2
  ```
  Input:  prices = [12, 10, 7, 7, 2]
  Output: 0
  Explanation: Prices never rise, so the team does not trade.
  ```

  ### Constraints
  - `1 <= prices.length <= 10^5`
  - `0 <= prices[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_single_resale_margin
  params:
    - {name: prices, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def best_single_resale_margin(prices: list[int]) -> int:
        lowest = prices[0]
        best = 0
        for price in prices[1:]:
            best = max(best, price - lowest)
            lowest = min(lowest, price)
        return best
  javascript: |
    function bestSingleResaleMargin(prices) {
      let lowest = prices[0];
      let best = 0;
      for (let i = 1; i < prices.length; i++) {
        best = Math.max(best, prices[i] - lowest);
        lowest = Math.min(lowest, prices[i]);
      }
      return best;
    }
