expected_concepts:
  - "running minimum of prices seen so far"
  - "best profit if reselling today = today's price - lowest earlier price"
  - "single pass with O(1) memory"
  - "returning zero when no profitable trade exists"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Explains the O(n^2) pair baseline, derives the running-minimum single pass, orders the update so a block is never resold on its purchase day, returns 0 for falling prices and states O(n) time with O(1) memory."
  good: "Correct linear solution, possibly with a prefix-minimum array; may need a prompt for the single-day case."
  weak: "Nested loops only, buys at the global minimum and sells at the global maximum regardless of order, or returns negative profit."
  criteria:
    correctness: "All tests pass, including falling prices and a minimum that comes after the maximum."
    efficiency: "Single linear pass."
    code_quality: "Clear names for the running minimum and best profit."
    edge_cases: "One day, flat prices, extreme values, best sale on the last day."
    communication: "Explains why only the lowest earlier price matters for each resale day."
hints:
  - "If you decided to resell on a particular day, which purchase day would you want to have chosen?"
  - "For every resale day, the best purchase is the lowest price on any earlier day. Can you keep that lowest price up to date while scanning once?"
  - "Scan the prices left to right while tracking the lowest price seen so far and the best profit so far, starting from zero. For each day, first compare today's price minus the lowest earlier price with the best profit, then update the lowest price with today's price, and return the best profit at the end."
followups:
  - "How would you return the buy and sell days, and which pair would you pick on ties?"
  - "What if the team could make any number of non-overlapping trades?"
  - "What if each trade had a fixed transaction fee?"
common_errors:
  - "Taking the global maximum minus the global minimum without checking that the minimum comes first."
  - "Resetting the best profit whenever a new lowest price appears, which loses an earlier better trade."
  - "Returning a negative value when prices only fall."
  - "Using nested loops and timing out on 10^5 days."
