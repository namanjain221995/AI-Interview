expected_concepts:
  - "sorting clips by start time"
  - "greedy extension to the farthest reachable end (jump-game style)"
  - "dynamic programming over covered prefixes as a baseline"
  - "detecting gaps and returning -1"
  - "endpoints that touch count as covered"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by start, repeatedly extends coverage to the farthest end among clips starting inside the covered range, detects gaps, argues why the greedy choice is optimal and states O(n log n) time."
  good: "Correct greedy or a correct dynamic programming solution over sorted clips with a reasonable complexity."
  weak: "Picks the longest clips first, allocates an array indexed by time up to 1e9, or loops forever on a gap."
  criteria:
    correctness: "Passes all tests, including gaps, touching clips and no clips at all."
    efficiency: "Runs in O(n log n) independent of the size of the time values."
    code_quality: "Covered end and farthest reach are tracked with clear names and a single forward scan."
    edge_cases: "Handles duplicate clips, zero-length clips and clips that extend past the duration."
    communication: "Explains why choosing the farthest-reaching clip never makes the answer worse."
hints:
  - "Some clip must cover time 0. Among the clips that do, which one is the most useful to choose first?"
  - "Once the range is covered up to some time, every clip starting at or before that time is a candidate for the next choice, and only how far it reaches matters."
  - "Sort the clips by start and keep the covered end, starting at 0. Repeatedly scan forward through the clips whose start is at most the covered end, remember the farthest end among them, count one clip and move the covered end there. If the farthest end does not go past the covered end, return minus one; stop once the covered end reaches the duration."
followups:
  - "Describe a dynamic programming formulation and compare its cost with the greedy solution."
  - "How would you return which clips were used?"
  - "What changes if each clip has a retrieval cost and you want the cheapest cover?"
common_errors:
  - "Treating touching clips such as [0, 3] and [3, 6] as leaving a gap."
  - "Looping forever when no clip extends the covered range instead of returning -1."
  - "Allocating an array indexed by time, which fails when times reach 1e9."
  - "Picking the longest clip overall instead of the farthest-reaching clip that starts within the covered range."
