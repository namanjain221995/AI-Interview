version: 1
slug: log_clip_coverage
title: "Log Clip Coverage"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Log Clip Coverage

  During an incident review you need to replay the whole time range `[0, duration]` from saved log
  clips. Each clip `clips[i] = [start, end]` contains the logs from time `start` to time `end`. Clips may
  overlap, repeat or extend past `duration`, and any part of a clip can be used.

  Choose the **fewest** clips whose union covers every moment of `[0, duration]`. Clips that only touch
  at an endpoint, such as `[0, 3]` and `[3, 6]`, join without a gap. Return that number of clips, or
  `-1` if the range cannot be covered.

  ### Example 1
  ```
  Input:  clips = [[0, 4], [2, 8], [1, 3], [7, 10], [6, 9]], duration = 10
  Output: 3
  Explanation: [0, 4], [2, 8] and [7, 10] cover [0, 10]; no two clips do
  ```

  ### Example 2
  ```
  Input:  clips = [[1, 5], [5, 9]], duration = 9
  Output: -1
  Explanation: no clip starts at time 0
  ```

  ### Example 3
  ```
  Input:  clips = [[0, 3], [3, 6], [1, 5]], duration = 6
  Output: 2
  Explanation: [0, 3] and [3, 6] touch at time 3 and together cover [0, 6]
  ```

  ### Constraints
  - `0 <= clips.length <= 10^4`
  - `clips[i].length == 2` and `0 <= start <= end <= 10^9`
  - `1 <= duration <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_clips_to_cover
  params:
    - {name: clips, type: "int[][]"}
    - {name: duration, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_clips_to_cover(clips: list[list[int]], duration: int) -> int:
        ordered = sorted(clips)
        count, covered, i = 0, 0, 0
        while covered < duration:
            farthest = covered
            while i < len(ordered) and ordered[i][0] <= covered:
                farthest = max(farthest, ordered[i][1])
                i += 1
            if farthest == covered:
                return -1
            count += 1
            covered = farthest
        return count
  javascript: |
    function minClipsToCover(clips, duration) {
      const ordered = clips.map((c) => [c[0], c[1]]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let count = 0;
      let covered = 0;
      let i = 0;
      while (covered < duration) {
        let farthest = covered;
        while (i < ordered.length && ordered[i][0] <= covered) {
          farthest = Math.max(farthest, ordered[i][1]);
          i++;
        }
        if (farthest === covered) return -1;
        count++;
        covered = farthest;
      }
      return count;
    }
