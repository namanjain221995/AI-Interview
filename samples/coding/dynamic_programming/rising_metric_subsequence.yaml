expected_concepts:
  - "O(n^2) dynamic programming over the best run ending at each day"
  - "patience-style tails array of smallest possible run endings"
  - "binary search (lower bound) for strict increase"
  - "O(n log n) time and O(n) space"
  - "difference between strict and non-strict increase"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Starts from the O(n^2) recurrence, then derives the tails array with a lower-bound binary search, explains why tails stays sorted and why lower bound enforces strictness, handles empty input and states O(n log n)."
  good: "Correct O(n^2) dynamic programming with clear state, or the O(n log n) method used correctly but with a thin explanation."
  weak: "Counts only consecutive rises, uses a greedy scan, allows equal values, or believes the tails array is itself a valid subsequence when explaining."
  criteria:
    correctness: "Right length on duplicates, decreasing input, empty input and drifting noisy data."
    efficiency: "O(n log n) for full credit; O(n^2) is partial."
    code_quality: "Clear name and meaning for the tails array and a correct binary search."
    edge_cases: "Empty list, single value, all equal and strictly decreasing inputs."
    communication: "Explains the invariant and the lower-bound versus upper-bound choice."
hints:
  - "First think about the longest rising run that ends exactly on day i: which earlier days could come right before it?"
  - "That gives a quadratic solution. To speed it up, track, for every possible run length, the smallest final reading seen so far for a run of that length; those smallest endings are always sorted."
  - "Scan the readings once; for each one, binary search for the first stored ending that is greater than or equal to it and replace it, or append when every stored ending is smaller; the number of stored endings at the end is the answer, and using greater-than-or-equal keeps the rise strict."
followups:
  - "How would you reconstruct one actual longest rising run, not just its length?"
  - "How would the solution change for non-decreasing runs where equal readings are allowed?"
  - "How would you count how many longest rising runs exist?"
common_errors:
  - "Using an upper-bound search, which lets equal readings extend a run."
  - "Looking only at consecutive days."
  - "Assuming the tails array is an actual subsequence and printing it as the answer."
  - "Returning 1 instead of 0 for an empty list."
