slug: rising_metric_subsequence
title: "Rising Metric Subsequence"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, data, backend, data_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## Rising Metric Subsequence

  A product analytics dashboard stores one reading per day for a key metric (for example daily active
  workspaces). To describe the strongest underlying growth trend, an analyst wants the longest run of
  days, in chronological order but **not necessarily consecutive**, on which every chosen reading is
  **strictly higher** than the previous chosen one.

  Write `longest_rising_metric_subsequence(values)` that returns the length of the longest strictly
  increasing subsequence of `values`.

  - Chosen days must keep their original order; days in between may be skipped.
  - Equal readings do not count as rising.
  - Return `0` for an empty list.

  ### Example 1
  ```
  Input:  values = [52, 48, 60, 55, 61, 58, 70]
  Output: 4
  Explanation: One longest rising run is 48, 55, 58, 70.
  ```

  ### Example 2
  ```
  Input:  values = [5, 5, 5]
  Output: 1
  Explanation: Equal readings are not rising, so any single day is the longest run.
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `-10^9 <= values[i] <= 10^9`

  **Follow-up:** an `O(n^2)` solution is a good start, but full efficiency credit needs `O(n log n)` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_rising_metric_subsequence
  params:
    - {name: values, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def longest_rising_metric_subsequence(values: list[int]) -> int:
        # tails[k] is the smallest possible last reading of a rising run of length k + 1.
        tails: list[int] = []
        for value in values:
            pos = bisect_left(tails, value)
            if pos == len(tails):
                tails.append(value)
            else:
                tails[pos] = value
        return len(tails)
  javascript: |
    function longestRisingMetricSubsequence(values) {
      const tails = [];
      for (const value of values) {
        let lo = 0;
        let hi = tails.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (tails[mid] < value) lo = mid + 1;
          else hi = mid;
        }
        if (lo === tails.length) tails.push(value);
        else tails[lo] = value;
      }
      return tails.length;
    }
