  - {id: t5, hidden: true, args: [1, 5], expected: 48, description: "Single row of five - 3 * 2^4"}
  - {id: t6, hidden: true, args: [5, 1], expected: 48, description: "Single column of five - same as one row of five"}
  - {id: t7, hidden: true, args: [4, 4], expected: 7812, description: "Square 4x4 grid"}
  - {id: t8, hidden: true, args: [2, 5], expected: 486, description: "Two rows at the maximum width"}
  - {id: t9, hidden: true, args: [1000, 1], expected: 32634808, description: "1000 rows of width 1 - 3 * 2^999 modulo"}
  - {id: t10, hidden: true, args: [37, 3], expected: 710125636, description: "37 rows of width 3 - modulus needed"}
  - {id: t11, hidden: true, args: [1000, 5], expected: 408208448, description: "Largest grid (stress, row-pattern DP with modulo)"}
expected_concepts:
  - "row-by-row dynamic programming over row colour patterns"
  - "enumerating the valid colourings of a single narrow row"
  - "precomputed compatibility between stacked row patterns"
  - "modular accumulation of counts"
  - "complexity bounded by rows times pattern pairs"
optimal_complexity: {time: "O(rows * P^2), P <= 48 row patterns", space: "O(P^2)"}
rubric:
  excellent: "Enumerates valid single-row patterns (at most 48), precomputes which pairs can be stacked, carries per-pattern counts down the rows with the modulus and explains the cost in terms of the pattern count; may mention matrix exponentiation for huge row counts."
  good: "Correct profile DP over rows with compatibility checked on the fly, minor help on enumerating patterns or on the modulus."
  weak: "Brute-forces all colourings, checks only one direction of adjacency, or uses the long dimension as the profile."
  criteria:
    correctness: "All tests pass, including single rows and columns, the square grids and the 1000-row cases."
    efficiency: "Work per row proportional to compatible pattern pairs; total well under a second for the largest grid."
    code_quality: "Pattern generation and compatibility kept in small, clearly named steps."
    edge_cases: "One tile, one row, one column and results that must be reduced modulo 1,000,000,007."
    communication: "Explains why only the previous row matters and why the narrow side should be the profile."
hints:
  - "The grid is narrow: a whole row has at most five tiles, so there are only a few valid ways to paint a single row on its own."
  - "Paint the grid one row at a time. Whether a row is allowed depends only on the row directly above it, so keep a count of ways for each possible colouring of the current row and carry those counts downwards."
  - "List every colouring of one row in which horizontal neighbours differ (at most 48 for five columns), and precompute which pairs of row colourings may be stacked because they differ in every column. Start every pattern with a count of one; for each further row, a pattern's new count is the sum of the previous counts of all patterns compatible with it, reduced modulo 1,000,000,007. The answer is the sum of the counts after the last row."
followups:
  - "How would you handle rows up to 10^18?"
  - "What changes if cols could be as large as 12?"
  - "How would the counts change with k colours instead of three?"
  - "For cols = 3, can you group row patterns into two types to get a closed-form recurrence?"
common_errors:
  - "Brute-forcing all 3^(rows * cols) colourings."
  - "Checking only horizontal or only vertical neighbours."
  - "Forgetting to reduce modulo 1,000,000,007, or overflowing while summing counts."
  - "Iterating over the long dimension as the row profile, which explodes the pattern count."
