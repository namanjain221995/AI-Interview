version: 1
slug: three_colour_grid_layouts
title: "Three-Colour Grid Layouts"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, frontend, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Three-Colour Grid Layouts

  A dashboard designer lays out a grid of `rows x cols` tiles and paints every tile with one of three
  theme colours. To keep panels visually separated, **any two tiles that share an edge must have
  different colours**; tiles that only touch at a corner may match.

  Return the number of valid colourings, modulo `1_000_000_007`. Two colourings are different when at
  least one tile has a different colour (the three colours are distinct, so swapping colours gives a
  different colouring).

  ### Example 1
  ```
  Input:  rows = 1, cols = 3
  Output: 12
  Explanation: 3 choices for the first tile and 2 for each following tile
  ```

  ### Example 2
  ```
  Input:  rows = 2, cols = 2
  Output: 18
  ```

  ### Example 3
  ```
  Input:  rows = 3, cols = 3
  Output: 246
  ```

  ### Constraints
  - `1 <= rows <= 1000`
  - `1 <= cols <= 5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_grid_colorings
  params:
    - {name: rows, type: "int"}
    - {name: cols, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_grid_colorings(rows: int, cols: int) -> int:
        mod = 1_000_000_007
        # every valid colouring of a single row (neighbours in the row differ)
        patterns: list[tuple[int, ...]] = [()]
        for _ in range(cols):
            patterns = [p + (c,) for p in patterns for c in range(3) if not p or p[-1] != c]
        compatible = [
            [j for j, q in enumerate(patterns) if all(a != b for a, b in zip(p, q))]
            for p in patterns
        ]
        ways = [1] * len(patterns)
        for _ in range(rows - 1):
            ways = [sum(ways[j] for j in compatible[i]) % mod for i in range(len(patterns))]
        return sum(ways) % mod
  javascript: |
    function countGridColorings(rows, cols) {
      const MOD = 1000000007;
      let patterns = [[]];
      for (let k = 0; k < cols; k++) {
        const next = [];
        for (const p of patterns) {
          for (let c = 0; c < 3; c++) {
            if (p.length === 0 || p[p.length - 1] !== c) next.push([...p, c]);
          }
        }
        patterns = next;
      }
      const compatible = patterns.map((p) =>
        patterns.map((q, j) => (p.every((a, idx) => a !== q[idx]) ? j : -1)).filter((j) => j >= 0)
      );
      let ways = patterns.map(() => 1);
      for (let r = 1; r < rows; r++) {
        ways = compatible.map((list) => list.reduce((acc, j) => (acc + ways[j]) % MOD, 0));
      }
      return ways.reduce((acc, w) => (acc + w) % MOD, 0);
    }
