version: 1
slug: replica_scale_down_steps
title: Replica Scale-Down Steps
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, devops, cloud, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Replica Scale-Down Steps

  After a traffic spike, an autoscaler must bring a service from `n` replicas down to exactly `1`. It can
  only change the replica count with these operations, each of which counts as **one step**:

  1. **Drain one:** go from `k` replicas to `k - 1`.
  2. **Halve:** if `k` is even, go from `k` to `k / 2`.
  3. **Third:** if `k` is divisible by 3, go from `k` to `k / 3`.

  Return the **minimum number of steps** needed to go from `n` replicas to `1`. If `n` is already `1`,
  return `0`.

  ### Example 1
  ```
  Input:  n = 10
  Output: 3
  Explanation: 10 -> 9 (drain one) -> 3 (third) -> 1 (third).
  Halving first (10 -> 5 -> 4 -> 2 -> 1) needs 4 steps.
  ```

  ### Example 2
  ```
  Input:  n = 1
  Output: 0
  ```

  ### Example 3
  ```
  Input:  n = 15
  Output: 4
  ```

  ### Constraints
  - `1 <= n <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_scale_down_steps
  params:
    - {name: n, type: int}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_scale_down_steps(n: int) -> int:
        # steps[k]: fewest operations to go from k replicas to 1.
        steps = [0] * (n + 1)
        for k in range(2, n + 1):
            best = steps[k - 1] + 1
            if k % 2 == 0:
                best = min(best, steps[k // 2] + 1)
            if k % 3 == 0:
                best = min(best, steps[k // 3] + 1)
            steps[k] = best
        return steps[n]
  javascript: |
    function minScaleDownSteps(n) {
      const steps = new Array(n + 1).fill(0);
      for (let k = 2; k <= n; k++) {
        let best = steps[k - 1] + 1;
        if (k % 2 === 0) best = Math.min(best, steps[k / 2] + 1);
        if (k % 3 === 0) best = Math.min(best, steps[k / 3] + 1);
        steps[k] = best;
      }
      return steps[n];
    }
tests:
  - {id: t1, args: [10], expected: 3, description: "Example 1 - halving first is a greedy trap"}
  - {id: t2, args: [1], expected: 0, description: "Example 2 - already at one replica"}
  - {id: t3, args: [15], expected: 4, description: "Example 3"}
  - {id: t4, hidden: true, args: [2], expected: 1, description: "Smallest count needing a step"}
  - {id: t5, hidden: true, args: [3], expected: 1, description: "Direct third"}
  - {id: t6, hidden: true, args: [6], expected: 2, description: "Both halve and third are possible"}
  - {id: t7, hidden: true, args: [97], expected: 7, description: "Prime - must drain before dividing"}
  - {id: t8, hidden: true, args: [729], expected: 6, description: "Power of three - repeated thirds"}
  - {id: t9, hidden: true, args: [1024], expected: 10, description: "Power of two - repeated halving"}
  - {id: t10, hidden: true, args: [100000], expected: 18, description: "Maximum n - exponential recursion without memoisation times out"}
expected_concepts:
  - "greedy division is not optimal"
  - "optimal substructure: answer for k built from answers for k - 1, k / 2 and k / 3"
  - "bottom-up table or memoised recursion"
  - "O(n) time and memory (or BFS over replica counts)"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Shows with a counterexample that greedy division fails, defines the per-count state, fills a bottom-up table (or memoises / runs BFS) and states O(n) time and memory; may mention the O(log^2 n) memoised trick."
  good: "Correct dynamic programming or BFS after realising greedy fails, with the right complexity."
  weak: "Greedy that always divides when possible, or plain recursion without memoisation that times out."
  criteria:
    correctness: "All tests pass, including n = 1, primes and powers of two and three."
    efficiency: "Linear time with each count computed once."
    code_quality: "Table indexed by replica count with the three transitions written clearly."
    edge_cases: "n = 1 returns 0; divisibility checked before dividing."
    communication: "Explains why the greedy choice fails and why the table order works."
hints:
  - "Try always dividing when you can on a count like 10. Is that really the fewest steps?"
  - "The fewest steps from k depends only on the fewest steps from the counts you can reach in one operation. Which of those are smaller than k, and how could you avoid recomputing them?"
  - "Build a table from 1 up to n where the entry for 1 is zero. For each k, take one plus the entry for k minus one, and also compare with one plus the entry for k halved when k is even and one plus the entry for k divided by three when k is divisible by three. The smallest of these is the answer for k."
followups:
  - "Return the actual sequence of operations as well as the count."
  - "How would you handle n up to 10^18? (Hint: memoised recursion over divisions only.)"
  - "What changes if each operation has a different cost?"
common_errors:
  - "Always halving or dividing by three greedily."
  - "Plain recursion without memoisation, which is exponential."
  - "Returning 1 instead of 0 for n = 1."
  - "Dividing when the count is not divisible and silently rounding down."
