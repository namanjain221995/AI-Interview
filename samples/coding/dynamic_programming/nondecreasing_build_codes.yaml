expected_concepts:
  - "DP state: count of codes of a given length ending with each symbol"
  - "transition as a prefix sum over smaller-or-equal symbols"
  - "rolling one array of size k"
  - "combinatorial view: multisets of size n from k values, (n + k - 1) choose n"
  - "modular arithmetic"
optimal_complexity: {time: "O(n * k) with prefix sums (O(n + k) with binomial coefficients and modular inverses)", space: "O(k)"}
rubric:
  excellent: "Defines the ending-symbol state, turns the transition into a running prefix sum for O(n * k) time and O(k) memory, handles k = 1 and n = 1, and recognises or derives the binomial closed form."
  good: "Correct DP with a two-dimensional table, or the closed form computed correctly, with minor prompting on the modulo."
  weak: "Enumerates codes, uses an O(n * k^2) transition without improving it, or overflows by computing factorials without modular arithmetic."
  criteria:
    correctness: "All tests pass, including k = 1 and the maximum inputs."
    efficiency: "O(n * k) or better; the transition is a running sum, not a nested loop over earlier symbols."
    code_quality: "Clear state naming and a single reusable array."
    edge_cases: "n = 1, k = 1, long codes over one symbol and large counts that need the modulo."
    communication: "Explains the state, the transition and the link to choosing a multiset."
hints:
  - "If you knew how many valid codes of some length end with each symbol, how many codes one symbol longer end with a given symbol s?"
  - "A code whose last symbol is at most s can be extended by s, so the count for codes of the next length ending in s is the total of the current counts for every symbol up to s."
  - "Start with one code of length one for each of the k symbols, then repeat n minus 1 times: replace the counts by their running totals from symbol 1 to k, reducing modulo 10^9 + 7 as you go; the answer is the sum of the final counts, which also equals choosing n items from k values with repetition allowed."
followups:
  - "What is the closed form, and how would you compute it modulo a prime?"
  - "How does the problem change if symbols must strictly increase?"
  - "How would you count codes whose adjacent symbols differ by at most 1?"
  - "What if n and k were up to 10^6?"
common_errors:
  - "Using an inner loop over all previous symbols for each symbol, giving O(n * k^2)."
  - "Off-by-one in the number of extension rounds (n instead of n - 1)."
  - "Computing factorials or binomials with plain fixed-width integers and overflowing."
  - "Forgetting the modulo on the final summation."
