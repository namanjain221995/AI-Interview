version: 1
slug: nondecreasing_build_codes
title: Non-Decreasing Build Codes
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, devops]
time_limit_minutes: 15
prompt_markdown: |
  ## Non-Decreasing Build Codes

  Release tooling stamps every build with a code of exactly `n` symbols. Each symbol is an integer from
  `1` to `k`, and the symbols must **never decrease** from left to right (each symbol is greater than or
  equal to the one before it), so codes sort the same way as the builds they describe.

  Return how many distinct codes exist, **modulo `1_000_000_007`** (10^9 + 7).

  ### Example 1
  ```
  Input:  n = 2, k = 3
  Output: 6
  Explanation: 11, 12, 13, 22, 23 and 33.
  ```

  ### Example 2
  ```
  Input:  n = 3, k = 2
  Output: 4
  Explanation: 111, 112, 122 and 222.
  ```

  ### Example 3
  ```
  Input:  n = 1, k = 5
  Output: 5
  ```

  ### Constraints
  - `1 <= n <= 1000`
  - `1 <= k <= 1000`
  - The answer is returned modulo `10^9 + 7`; use a 64-bit integer type.

  **Follow-up:** the count has a closed form. Can you find it and compute it faster than O(n * k)?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_nondecreasing_codes
  params:
    - {name: n, type: "int"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_nondecreasing_codes(n: int, k: int) -> int:
        mod = 1_000_000_007
        ending = [1] * k  # codes of the current length that end with symbol s + 1
        for _ in range(n - 1):
            running = 0
            for s in range(k):
                running = (running + ending[s]) % mod
                ending[s] = running
        return sum(ending) % mod
  javascript: |
    function countNondecreasingCodes(n, k) {
      const MOD = 1000000007;
      const ending = new Array(k).fill(1);
      for (let length = 2; length <= n; length++) {
        let running = 0;
        for (let s = 0; s < k; s++) {
          running = (running + ending[s]) % MOD;
          ending[s] = running;
        }
      }
      let total = 0;
      for (const count of ending) total = (total + count) % MOD;
      return total;
    }
