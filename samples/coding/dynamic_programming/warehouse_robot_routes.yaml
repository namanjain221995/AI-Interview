expected_concepts:
  - "routes into a cell = routes from above + routes from the left"
  - "shelf cells contribute zero routes"
  - "row-by-row table, optionally a single rolling row"
  - "modular arithmetic for large counts"
  - "blocked start or destination"
optimal_complexity: {time: "O(rows * cols)", space: "O(cols)"}
rubric:
  excellent: "Derives the above-plus-left recurrence, zeroes shelf cells, handles a blocked start or destination naturally, applies the modulo, and reduces memory to one row while explaining O(rows * cols) time."
  good: "Correct full 2D table with the modulo and the right complexity; may need a prompt for a blocked start."
  weak: "Uses the shelf-free combinatorial formula, explores routes recursively without memoisation, or lets counts flow through shelves."
  criteria:
    correctness: "All tests pass, including blocked start, blocked destination and single-row or single-column grids."
    efficiency: "Each cell is processed once; no exponential search."
    code_quality: "Boundary handling for the first row and column is clean rather than duplicated."
    edge_cases: "1 x 1 grids, blocked endpoints, single row or column with a shelf."
    communication: "Explains why only the top and left neighbours matter."
hints:
  - "A robot can only arrive at a cell from the cell directly above it or the cell directly to its left."
  - "The number of routes into a free cell is the sum of the routes into those two neighbours, and a shelf cell has no routes at all. Fill these counts in order starting from the top-left."
  - "Keep one row of counts, setting the first entry to one only if the start cell is free. Sweep the grid row by row and left to right: on a shelf set the count to zero, otherwise add the count of the left neighbour to the value already stored from the row above, reduce it modulo the prime, and return the last entry at the end."
followups:
  - "How would the solution change if the robot could also move diagonally down-right?"
  - "What if some cells had a toll and you wanted the cheapest route instead of the count?"
  - "How would you count routes that must pass through a specific charging cell?"
common_errors:
  - "Initialising the whole first row or column to one even when a shelf blocks it."
  - "Forgetting to return zero when the start cell is a shelf."
  - "Using the binomial formula, which ignores shelves."
  - "Skipping the modulo so counts overflow 64-bit integers on large grids."
