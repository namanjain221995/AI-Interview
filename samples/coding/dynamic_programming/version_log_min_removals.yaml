version: 1
slug: version_log_min_removals
title: Version Log Minimum Removals
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, devops, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Version Log Minimum Removals

  During a fleet upgrade, a rollout log records one entry per host check, in order: `'o'` when the host
  still runs the old build and `'n'` when it reports the new build. The audit report must read as a clean
  cutover: **every `'o'` entry comes before every `'n'` entry**.

  Return the **minimum number of entries to delete** so that the remaining log (entries keep their
  relative order) has no `'n'` before any `'o'`. A log that is empty or already clean needs `0`
  deletions.

  ### Example 1
  ```
  Input:  log = "oonon"
  Output: 1
  Explanation: deleting the 'n' at index 2 leaves "ooon".
  ```

  ### Example 2
  ```
  Input:  log = "nnoo"
  Output: 2
  ```

  ### Example 3
  ```
  Input:  log = "oonn"
  Output: 0
  ```

  ### Constraints
  - `0 <= log.length <= 10^5`
  - `log[i]` is `'o'` or `'n'`

  **Follow-up:** can you solve it in one pass with O(1) extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_removals_for_upgrade_order
  params:
    - {name: log, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_removals_for_upgrade_order(log: str) -> int:
        new_seen = 0  # 'n' entries so far
        best = 0      # fewest deletions that make the prefix clean
        for entry in log:
            if entry == "n":
                new_seen += 1
            else:
                best = min(best + 1, new_seen)
        return best
  javascript: |
    function minRemovalsForUpgradeOrder(log) {
      let newSeen = 0;
      let best = 0;
      for (const entry of log) {
        if (entry === "n") newSeen += 1;
        else best = Math.min(best + 1, newSeen);
      }
      return best;
    }
tests:
  - {id: t1, args: ["oonon"], expected: 1, description: "Example 1"}
  - {id: t2, args: ["nnoo"], expected: 2, description: "Example 2 - fully reversed; deleting all n or all o ties"}
  - {id: t3, args: ["oonn"], expected: 0, description: "Example 3 - already clean"}
  - {id: t4, hidden: true, args: [""], expected: 0, description: "Empty log"}
  - {id: t5, hidden: true, args: ["o"], expected: 0, description: "Single old entry"}
  - {id: t6, hidden: true, args: ["n"], expected: 0, description: "Single new entry"}
  - {id: t7, hidden: true, args: ["no"], expected: 1, description: "Smallest inversion"}
  - {id: t8, hidden: true, args: ["nnnnnnno"], expected: 1, description: "Many new entries before one old entry; delete the single o"}
  - {id: t9, hidden: true, args: ["nonononononononononono"], expected: 11, description: "Alternating entries"}
  - {id: t10, hidden: true, args: [""], expected: 454, description: "1000 mixed entries; exponential subset search times out"}
expected_concepts:
  - "cut point view: delete new-build entries before the cut and old-build entries after it"
  - "prefix and suffix counts"
  - "one-pass DP: fewest deletions for the prefix"
  - "on an old-build entry choose between deleting it and deleting every new-build entry so far"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Frames the answer as a cut point or a prefix DP, implements a single pass with O(1) memory, explains the choice made on each old-build entry and handles empty and clean logs."
  good: "Correct O(n) solution using prefix and suffix count arrays, or the DP with some prompting."
  weak: "Tries every subset or recounts both sides for every cut in O(n^2), or deletes greedily in a way that fails on inputs such as many new entries before one old entry."
  criteria:
    correctness: "All tests pass, including empty, single-entry and reversed logs."
    efficiency: "Linear time; O(1) or O(n) extra memory."
    code_quality: "Counters named for what they count; no unnecessary string building."
    edge_cases: "Empty log, all one kind and already-clean logs."
    communication: "Explains why the prefix answer only depends on the previous best and the count of new-build entries seen so far."
hints:
  - "A clean log has a cut point: every kept entry before it is an old build and every kept entry after it is a new build."
  - "For a fixed cut point the deletions are the new-build entries before it plus the old-build entries after it, and a single scan can maintain those counts for every cut."
  - "Scan left to right keeping the number of new-build entries seen and the fewest deletions that make the prefix clean; on a new-build entry just grow that count, and on an old-build entry set the best to the smaller of the previous best plus one (delete this entry) and the count of new-build entries seen (delete all of them); return the best at the end."
followups:
  - "How would you return which entries to delete?"
  - "What if there were three build versions that must appear in order?"
  - "How would you handle the log as an unbounded stream?"
  - "Can the problem be phrased as a longest non-decreasing subsequence, and what would that cost?"
common_errors:
  - "Greedily deleting the first 'n' seen, which is wrong when many 'n' entries precede a single 'o'."
  - "Recounting both sides for every cut point in O(n^2)."
  - "Ignoring the cut points at the very start and the very end of the log."
  - "Returning a non-zero answer for an empty or already clean log."
