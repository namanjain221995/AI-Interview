title: "Credit Claim Conflicts"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Credit Claim Conflicts

  A billing platform shows an account a wallet of promotional credit vouchers; `values[i]` is the face
  value of voucher `i`, and several vouchers can have the same value. To stop customers stacking
  neighbouring promotion tiers, the platform applies one rule:

  - the moment a voucher worth `v` is claimed, **every** voucher worth exactly `v - 1` or `v + 1` is voided
    and can no longer be claimed;
  - other vouchers worth `v` itself are **not** affected and can still be claimed.

  Vouchers are claimed one at a time, in any order you choose, and each voucher can be claimed at most
  once. Return the **maximum total value** that can be claimed (`0` for an empty wallet).

  ### Example 1
  ```
  Input:  values = [3, 4, 2]
  Output: 6
  Explanation: Claim 4 (voiding the 3), then claim 2: total 6. Claiming 3 first would void both 2 and 4.
  ```

  ### Example 2
  ```
  Input:  values = [2, 2, 3, 3, 3, 4]
  Output: 9
  Explanation: Claiming all three 3s gives 9 and voids the 2s and the 4. Claiming 2, 2 and 4 gives only 8.
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `1 <= values[i] <= 10^9`

  **Follow-up:** the total can exceed the 32-bit range; use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_claimable_credits
  params:
    - {name: values, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def max_claimable_credits(values: list[int]) -> int:
        totals = Counter()
        for value in values:
            totals[value] += value  # claiming one voucher of a value never blocks the others of that value
        take = skip = 0  # best totals so far with / without the previous distinct value claimed
        previous = None
        for value in sorted(totals):
            best_before = max(take, skip)
            if previous is not None and value == previous + 1:
                take = skip + totals[value]  # neighbouring tier: only allowed if the previous one was skipped
            else:
                take = best_before + totals[value]
            skip = best_before
            previous = value
        return max(take, skip)
  javascript: |
    function maxClaimableCredits(values) {
      const totals = new Map();
      for (const value of values) totals.set(value, (totals.get(value) || 0) + value);
      const distinct = [...totals.keys()].sort((a, b) => a - b);
      let take = 0;
      let skip = 0;
      let previous = null;
      for (const value of distinct) {
        const bestBefore = Math.max(take, skip);
        if (previous !== null && value === previous + 1) {
          take = skip + totals.get(value);
        } else {
          take = bestBefore + totals.get(value);
        }
        skip = bestBefore;
        previous = value;
      }
      return Math.max(take, skip);
    }
