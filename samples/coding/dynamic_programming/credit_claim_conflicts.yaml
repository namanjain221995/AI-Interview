expected_concepts:
  - "aggregate the total value per distinct face value"
  - "claiming a value means claiming every voucher of that value"
  - "sorted distinct values reduce to a take-or-skip chain where only neighbouring values conflict"
  - "values that are not consecutive never conflict, so the chain restarts"
  - "O(n log n) time for sorting, O(n) space, 64-bit totals"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Observes that a claimed value should be claimed for every voucher, sums per value, sorts the distinct values and runs a take-or-skip recurrence that only blocks when values differ by exactly 1, avoids a value-indexed array for values up to 10^9 and states O(n log n)."
  good: "Correct per-value totals and recurrence, possibly with a value-indexed array that only works for small values, or minor prompting on gaps between values."
  weak: "Greedily claims the largest voucher first, voids vouchers of the same value, or tries every subset of vouchers."
  criteria:
    correctness: "All tests pass, including duplicates, gaps between values and the empty wallet."
    efficiency: "Sorting distinct values plus a linear pass; memory independent of the largest value."
    code_quality: "Separate aggregation and decision phases with clear take and skip names."
    edge_cases: "Empty wallet, a single value, non-adjacent values and totals beyond 32 bits."
    communication: "Explains why the problem becomes a chain where only neighbouring values conflict."
hints:
  - "If claiming one voucher worth v is a good idea, is there ever a reason not to claim every other voucher worth v as well?"
  - "Collapse the wallet into one total per distinct value. Sorted, the values form a line in which you may not take two values that differ by exactly one; values further apart never interfere."
  - "Sort the distinct values and walk them keeping two running bests: the best total if the previous value was taken, and the best if it was skipped. For each value, the skip option is the larger of the two previous bests; the take option adds this value's total to the previous skip if the value is exactly one more than the previous value, or to the larger previous best otherwise. Return the larger of the two at the end."
followups:
  - "How would you also report which values to claim?"
  - "What changes if claiming v voids values within distance 2 instead of 1?"
  - "If values were bounded by 10^4, how could you avoid sorting?"
  - "How would you handle vouchers that arrive one by one while the best total is queried after each arrival?"
common_errors:
  - "Greedily claiming the largest voucher first."
  - "Treating vouchers of the same value as conflicting with each other."
  - "Allocating an array indexed by value, which fails for values up to 10^9."
  - "Applying the neighbour restriction between distinct values that are not consecutive integers."
