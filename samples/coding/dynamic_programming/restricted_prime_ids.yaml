version: 1
slug: restricted_prime_ids
title: "Restricted Prime IDs"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Restricted Prime IDs

  A legacy routing layer only accepts shard IDs that factor cleanly over a small set of approved
  primes. A positive integer is a **valid ID** when every one of its prime factors appears in `primes`.
  The number `1` has no prime factors, so it is always valid and is always the first ID.

  Imagine listing every valid ID in increasing order, each value once. Return the `n`-th value of that
  list (1-indexed).

  ### Example 1
  ```
  Input:  n = 10, primes = [2, 3, 5]
  Output: 12
  Explanation: the valid IDs start 1, 2, 3, 4, 5, 6, 8, 9, 10, 12
  ```

  ### Example 2
  ```
  Input:  n = 7, primes = [3, 7]
  Output: 49
  Explanation: the valid IDs start 1, 3, 7, 9, 21, 27, 49
  ```

  ### Example 3
  ```
  Input:  n = 1, primes = [11, 13]
  Output: 1
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `1 <= primes.length <= 50`
  - `primes` holds distinct primes with `2 <= primes[i] <= 1000`, in any order
  - The answer is at most `10^12` (it can exceed the 32-bit integer range).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nth_number_with_prime_factors
  params:
    - {name: n, type: "int"}
    - {name: primes, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def nth_number_with_prime_factors(n: int, primes: list[int]) -> int:
        ids = [1]
        pointers = [0] * len(primes)
        while len(ids) < n:
            candidates = [ids[pointers[j]] * p for j, p in enumerate(primes)]
            smallest = min(candidates)
            ids.append(smallest)
            for j, value in enumerate(candidates):
                if value == smallest:
                    pointers[j] += 1
        return ids[n - 1]
  javascript: |
    function nthNumberWithPrimeFactors(n, primes) {
      const ids = [1];
      const pointers = new Array(primes.length).fill(0);
      const candidates = new Array(primes.length);
      while (ids.length < n) {
        let smallest = Infinity;
        for (let j = 0; j < primes.length; j++) {
          candidates[j] = ids[pointers[j]] * primes[j];
          if (candidates[j] < smallest) smallest = candidates[j];
        }
        ids.push(smallest);
        for (let j = 0; j < primes.length; j++) {
          if (candidates[j] === smallest) pointers[j]++;
        }
      }
      return ids[n - 1];
    }
