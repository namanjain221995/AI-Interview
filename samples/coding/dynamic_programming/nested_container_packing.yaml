expected_concepts:
  - "sorting by one dimension to reduce the problem to one dimension"
  - "tie-break equal widths by height descending"
  - "longest strictly increasing subsequence on heights"
  - "patience-style tails array with binary search (lower bound)"
  - "O(n log n) time versus the O(n^2) DP"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by width ascending and height descending for ties, explains why that tie-break blocks equal widths, runs the binary-search LIS on heights with a strict lower bound and states O(n log n)."
  good: "Reaches the sort plus LIS reduction, perhaps first with the O(n^2) DP, and fixes the equal-width tie-break with a hint."
  weak: "Only the O(n^2) DP, sorts ties by height ascending, allows rotation or treats equal heights as nestable."
  criteria:
    correctness: "All tests pass, including identical boxes, equal widths, equal heights and the tie-break trap."
    efficiency: "Sorting plus binary search per box; no quadratic pairwise comparison."
    code_quality: "Sort key stated clearly; tails array documented; input list not mutated unexpectedly."
    edge_cases: "Single box, duplicate boxes, rotation-only fits and dimensions near 10^9."
    communication: "Explains with an example why ascending heights for equal widths would over-count."
hints:
  - "If the boxes were ordered by width, a nested sequence would be a choice of boxes whose heights increase in that order."
  - "After sorting by width, the task becomes the longest strictly increasing subsequence of heights, with one catch: two boxes of the same width must never both be picked. Choose the order of equal widths so that this cannot happen."
  - "Sort by width ascending and, for equal widths, by height descending. Then scan the heights keeping a list in which position k holds the smallest possible last height of a nested sequence of k plus one boxes; binary search for the first position whose height is not smaller than the current one and either replace it or append to the end. The final length of the list is the answer."
followups:
  - "Why must boxes of equal width be ordered by height descending?"
  - "How would you reconstruct the boxes in one longest nested sequence?"
  - "What changes if boxes may be rotated?"
  - "How would you handle three dimensions?"
common_errors:
  - "Sorting equal widths by ascending height, so two boxes of the same width join one chain."
  - "Using an upper-bound search, which lets equal heights extend a chain."
  - "Stopping at the O(n^2) DP, which is too slow for 10^5 boxes."
  - "Comparing width with height when checking whether one box fits another."
