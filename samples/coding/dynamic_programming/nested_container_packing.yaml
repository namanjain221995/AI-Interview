slug: nested_container_packing
title: "Nested Container Packing"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, devops]
time_limit_minutes: 30
prompt_markdown: |
  ## Nested Container Packing

  A warehouse ships goods in flat-pack boxes, each described as `[width, height]`. To save space on
  returns, empty boxes are stored nested: a box fits inside another only if **both** its width and its
  height are **strictly smaller**. Boxes cannot be rotated (a box's width is always compared with the
  other box's width), and each box can be used at most once.

  Return the largest number of boxes that can form a single nested sequence, where each box fits inside
  the next one.

  With up to `10^5` boxes, aim for `O(n log n)` time.

  ### Example 1
  ```
  Input:  boxes = [[4, 5], [2, 3], [6, 7], [3, 8]]
  Output: 3
  Explanation: [2, 3] fits in [4, 5], which fits in [6, 7]; [3, 8] is too tall for either
  ```

  ### Example 2
  ```
  Input:  boxes = [[3, 4], [3, 5], [3, 6]]
  Output: 1
  Explanation: all widths are equal, so no box fits strictly inside another
  ```

  ### Constraints
  - `1 <= boxes.length <= 10^5`
  - `boxes[i].length == 2`
  - `1 <= width, height <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_nested_containers
  params:
    - {name: boxes, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def max_nested_containers(boxes: list[list[int]]) -> int:
        # Width ascending; equal widths by height descending so two boxes of the
        # same width can never both join one chain.
        ordered = sorted(boxes, key=lambda box: (box[0], -box[1]))
        tails: list[int] = []  # tails[k]: smallest last height of a chain of k + 1 boxes
        for _, height in ordered:
            pos = bisect_left(tails, height)
            if pos == len(tails):
                tails.append(height)
            else:
                tails[pos] = height
        return len(tails)
  javascript: |
    function maxNestedContainers(boxes) {
      const ordered = [...boxes].sort((a, b) => (a[0] !== b[0] ? a[0] - b[0] : b[1] - a[1]));
      const tails = [];
      for (const [, height] of ordered) {
        let lo = 0;
        let hi = tails.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (tails[mid] < height) lo = mid + 1;
          else hi = mid;
        }
        tails[lo] = height;
      }
      return tails.length;
    }
