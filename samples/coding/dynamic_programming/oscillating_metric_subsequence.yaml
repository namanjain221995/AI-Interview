version: 1
slug: oscillating_metric_subsequence
title: Oscillating Metric Subsequence
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, data, data_analyst, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Oscillating Metric Subsequence

  A capacity analyst is studying how strongly a load metric swings. From the time-ordered `values`, pick
  a **subsequence** (keep some readings in their original order and drop the rest) whose successive
  differences **strictly alternate in sign**: up, down, up, ... or down, up, down, ... A difference of zero
  is neither up nor down, so two equal neighbouring picks never qualify.

  Return the length of the **longest** such subsequence. A single reading is a valid subsequence of length
  `1`, and an empty list gives `0`.

  ### Example 1
  ```
  Input:  values = [5, 9, 3, 3, 8, 2, 2, 6]
  Output: 6
  Explanation: one longest choice is 5, 9, 3, 8, 2, 6 (up, down, up, down, up).
  ```

  ### Example 2
  ```
  Input:  values = [1, 2, 3, 4, 5]
  Output: 2
  Explanation: any two different readings, such as 1 and 5.
  ```

  ### Example 3
  ```
  Input:  values = [7, 7, 7]
  Output: 1
  ```

  ### Constraints
  - `0 <= values.length <= 10^4`
  - `-10^9 <= values[i] <= 10^9`

  **Follow-up:** can you solve it in O(n) time and O(1) extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_oscillating_subsequence
  params:
    - {name: values, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_oscillating_subsequence(values: list[int]) -> int:
        if not values:
            return 0
        rise = fall = 1  # longest picks ending with an upward / a downward move
        for i in range(1, len(values)):
            if values[i] > values[i - 1]:
                rise = fall + 1
            elif values[i] < values[i - 1]:
                fall = rise + 1
        return max(rise, fall)
  javascript: |
    function longestOscillatingSubsequence(values) {
      if (values.length === 0) return 0;
      let rise = 1;
      let fall = 1;
      for (let i = 1; i < values.length; i++) {
        if (values[i] > values[i - 1]) rise = fall + 1;
        else if (values[i] < values[i - 1]) fall = rise + 1;
      }
      return Math.max(rise, fall);
    }
tests:
  - {id: t1, args: [[5, 9, 3, 3, 8, 2, 2, 6]], expected: 6, description: "Example 1"}
  - {id: t2, args: [[1, 2, 3, 4, 5]], expected: 2, description: "Example 2 - strictly increasing"}
  - {id: t3, args: [[7, 7, 7]], expected: 1, description: "Example 3 - all equal"}
  - {id: t4, hidden: true, args: [[]], expected: 0, description: "Empty list returns 0"}
  - {id: t5, hidden: true, args: [[42]], expected: 1, description: "Single reading"}
  - {id: t6, hidden: true, args: [[3, 1]], expected: 2, description: "Two different readings going down"}
  - {id: t7, hidden: true, args: [[4, 4, 4, 9, 9, 2]], expected: 3, description: "Flat start before any movement"}
  - {id: t8, hidden: true, args: [[10, 9, 8, 7, 8, 9, 10, 1]], expected: 4, description: "Long monotonic stretches collapse to their turning points"}
  - {id: t9, hidden: true, args: [[-1000000000, 1000000000, -1000000000, 1000000000]], expected: 4, description: "Extreme values alternating"}
  - {id: t10, hidden: true, args: [[-14, 10, 5, 0, -5, -10, 14, 9, 4, -1, -6, -11, 13, 8, 3, -2, -7, -12, 12, 7, 2, -3, -8, -13, 11, 6, 1, -4, -9, -14, 10, 5, 0, -5, -10, 14, 9, 4, -1, -6, -11, 13, 8, 3, -2, -7, -12, 12, 7, 2, -3, -8, -13, 11, 6, 1, -4, -9, -14, 10]], expected: 22, description: "60 generated readings with many swings"}
expected_concepts:
  - "two DP states: longest ending with a rise and longest ending with a fall"
  - "each state extends the opposite state"
  - "zero differences are skipped"
  - "greedy view: counting turning points"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines the rise and fall states, explains why a rise extends the best fall-ending length, skips equal neighbours, handles empty and single inputs, and gives O(n) time with O(1) memory."
  good: "Correct O(n^2) DP over previous indices, or a correct linear solution with some prompting on equal values or the empty input."
  weak: "Treats the problem as contiguous, counts zero differences as moves, or fails on empty or single-element input."
  criteria:
    correctness: "All tests pass, including flat stretches and the empty list."
    efficiency: "Linear time with constant memory."
    code_quality: "State variables named for what they mean; no special cases beyond the empty list."
    edge_cases: "Empty, single, all-equal and monotonic inputs."
    communication: "Explains why comparing with the immediately previous reading is enough for the transitions."
hints:
  - "Keep track separately of the best subsequence that ends with an upward move and the best one that ends with a downward move."
  - "When a reading is higher than the one before it, an upward-ending subsequence can be formed by appending it to the best downward-ending one, and the mirror image holds for a lower reading; equal readings change nothing."
  - "Keep two lengths, rise and fall, both starting at one for a non-empty list; scan adjacent pairs and when the current reading is higher set rise to fall plus one, when it is lower set fall to rise plus one, and otherwise leave both; return the larger of the two, or zero for an empty list."
followups:
  - "How would you return the subsequence itself?"
  - "What if each swing had to be at least some threshold in size?"
  - "Why is it safe to compare only with the immediately previous reading?"
  - "How does an O(n^2) DP over previous indices compare with this approach?"
common_errors:
  - "Treating the problem as a contiguous window."
  - "Counting equal neighbours as a move."
  - "Returning 1 for an empty list or 0 for a single reading."
  - "Resetting a state to 1 on a monotonic stretch instead of keeping the best length so far."
