version: 1
slug: boolean_rule_groupings
title: "Boolean Rule Groupings"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, security, qa]
time_limit_minutes: 35
prompt_markdown: |
  ## Boolean Rule Groupings

  A feature-flag service stores access rules as flat strings without parentheses, such as `T|F&T`.
  Operands are `T` (true) and `F` (false); the operators are `&` (AND), `|` (OR) and `^` (XOR). The
  format gives the operators **no precedence**, so a rule only has a meaning once it is fully grouped.

  A **full grouping** places parentheses so that every operator combines exactly two sub-expressions;
  equivalently, it fixes the order in which the operators are applied. A rule with `k` operands has
  `Catalan(k - 1)` full groupings (1, 1, 2, 5, 14, ... for `k` = 1, 2, 3, 4, 5, ...). Two groupings are
  different when their parentheses differ, even if they evaluate the same way. A single operand has
  exactly one grouping (itself).

  Return how many full groupings of `expr` evaluate to **true**, modulo `1_000_000_007`.

  ### Example 1
  ```
  Input:  expr = "F&T|T"
  Output: 1
  Explanation: (F&T)|T is true, F&(T|T) is false
  ```

  ### Example 2
  ```
  Input:  expr = "F&T|F^T"
  Output: 3
  Explanation: 3 of the 5 full groupings evaluate to true
  ```

  ### Example 3
  ```
  Input:  expr = "F|F"
  Output: 0
  ```

  ### Constraints
  - `1 <= expr.length <= 199` and `expr.length` is odd.
  - Characters at even indices are `T` or `F`; characters at odd indices are `&`, `|` or `^`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_true_groupings
  params:
    - {name: expr, type: "string"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_true_groupings(expr: str) -> int:
        mod = 1_000_000_007
        operands = expr[0::2]
        operators = expr[1::2]
        n = len(operands)
        # true[i][j] / false[i][j]: groupings of operands i..j that give True / False
        true = [[0] * n for _ in range(n)]
        false = [[0] * n for _ in range(n)]
        for i, ch in enumerate(operands):
            true[i][i] = 1 if ch == "T" else 0
            false[i][i] = 1 if ch == "F" else 0
        for span in range(1, n):
            for i in range(n - span):
                j = i + span
                t = f = 0
                for k in range(i, j):  # operators[k] is the last one applied
                    lt, lf = true[i][k], false[i][k]
                    rt, rf = true[k + 1][j], false[k + 1][j]
                    total = (lt + lf) * (rt + rf)
                    op = operators[k]
                    if op == "&":
                        ways = lt * rt
                    elif op == "|":
                        ways = total - lf * rf
                    else:
                        ways = lt * rf + lf * rt
                    t += ways
                    f += total - ways
                true[i][j] = t % mod
                false[i][j] = f % mod
        return true[0][n - 1]
  javascript: |
    function countTrueGroupings(expr) {
      const MOD = 1000000007n;
      const n = (expr.length + 1) / 2;
      const t = [];
      const f = [];
      for (let i = 0; i < n; i++) {
        t.push(new Array(n).fill(0n));
        f.push(new Array(n).fill(0n));
        t[i][i] = expr[2 * i] === 'T' ? 1n : 0n;
        f[i][i] = expr[2 * i] === 'F' ? 1n : 0n;
      }
      for (let span = 1; span < n; span++) {
        for (let i = 0; i + span < n; i++) {
          const j = i + span;
          let yes = 0n;
          let no = 0n;
          for (let k = i; k < j; k++) {
            const lt = t[i][k], lf = f[i][k], rt = t[k + 1][j], rf = f[k + 1][j];
            const total = (lt + lf) * (rt + rf);
            const op = expr[2 * k + 1];
            let ways;
            if (op === '&') ways = lt * rt;
            else if (op === '|') ways = total - lf * rf;
            else ways = lt * rf + lf * rt;
            yes += ways;
            no += total - ways;
          }
          t[i][j] = yes % MOD;
          f[i][j] = no % MOD;
        }
      }
      return Number(t[0][n - 1]);
    }
