  - {id: t3, args: ["F|F"], expected: 0, description: "Example 3 - no grouping can be true"}
  - {id: t4, hidden: true, args: ["T"], expected: 1, description: "Single true operand - one grouping"}
  - {id: t5, hidden: true, args: ["F"], expected: 0, description: "Single false operand - zero"}
  - {id: t6, hidden: true, args: ["T&T&T&T&T"], expected: 14, description: "All AND of true - every one of the 14 groupings is true"}
  - {id: t7, hidden: true, args: ["T^F^T^F^T"], expected: 14, description: "XOR chain - result does not depend on grouping, 14 groupings"}
  - {id: t8, hidden: true, args: ["T&F|T^F&T|F^T&T"], expected: 174, description: "Nine operands mixing all three operators"}
  - {id: t9, hidden: true, args: ["T|T|T|T|T|T|T|T|T|T|T|T|T|T|T|T|T|T|T|T"], expected: 767263183, description: "20 true operands joined by OR - Catalan(19) exceeds the modulus"}
  - {id: t10, hidden: true, args: ["F^F&T^F&F^T^F^T&T&T|F^T&F|F^F^T^T^T^T|T&T&F|F&F^T|F^F&F&T&F|F&T&F|T^T|T|F&T&T^T^F&F^T&T^F^F&F^T|F^T^T^T|F^F|F^F|T&T^T|T&T^T|T&T&F^T^T&T|T&T|F|T&F|T|T&F^F^F^F|T&T^F^F|T&T&F&F&F&F&T^T&F&T^T|T&T^T&F&T^F"], expected: 496995171, description: "100 random operands (stress, O(n^3) interval DP with modulo)"}
expected_concepts:
  - "interval dynamic programming over ranges of operands"
  - "choosing the last operator applied as the split point"
  - "tracking both true and false counts for every range"
  - "combining counts per operator (AND, OR, XOR)"
  - "modular arithmetic and overflow when multiplying counts"
optimal_complexity: {time: "O(n^3)", space: "O(n^2)"}
rubric:
  excellent: "Splits on the last operator applied, keeps true and false counts per operand range, derives the combination rules for all three operators, reduces modulo 1,000,000,007 with overflow-safe multiplication and states O(n^3) time where n is the number of operands."
  good: "Correct memoised recursion or table with true and false counts, minor help needed on the XOR rule or on overflow before the modulus."
  weak: "Tracks only true counts, applies normal operator precedence, or enumerates every grouping explicitly."
  criteria:
    correctness: "All tests pass, including single operands, an XOR chain and the 20-operand OR rule whose count exceeds the modulus."
    efficiency: "Cubic interval DP; no exponential enumeration of groupings."
    code_quality: "Operands and operators addressed clearly (even and odd positions); per-operator rules readable."
    edge_cases: "Single operand T or F, all-false rules and long rules where counts must be reduced."
    communication: "Explains why false counts are needed and how each operator's true count is derived."
hints:
  - "Every full grouping has exactly one operator that is applied last; it splits the rule into a left part and a right part that are grouped independently."
  - "For each contiguous range of operands, count the groupings that evaluate to true and those that evaluate to false; the counts for a range follow from the counts of its two sides for each choice of last operator."
  - "Fill a true-count table and a false-count table for ranges of increasing length. For a split at an operator with left counts (lt, lf) and right counts (rt, rf): AND is true in lt times rt ways, OR is true in every combination except lf times rf, and XOR is true in lt times rf plus lf times rt ways; the false count is all combinations minus the true ones. Reduce modulo 1,000,000,007 and make sure products of two counts cannot overflow."
followups:
  - "Why is counting only the true groupings for each range not enough?"
  - "How would you add a NAND operator?"
  - "In JavaScript, how do you multiply two counts below the modulus without losing precision?"
  - "How would you count the groupings that evaluate to false instead?"
common_errors:
  - "Tracking only true counts, which cannot handle OR and XOR correctly."
  - "Treating AND as binding tighter than OR, as in normal precedence rules."
  - "Overflowing 64-bit integers (or losing precision with JavaScript numbers) when multiplying counts."
  - "Forgetting that a single operand has exactly one grouping."
