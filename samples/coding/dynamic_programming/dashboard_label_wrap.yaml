expected_concepts:
  - "greedy line filling is not optimal for a squared penalty"
  - "dynamic programming over suffixes: best penalty for words i..n-1 starting a new line"
  - "the last line is free, which is a special case of the transition"
  - "stop extending a line as soon as it overflows the width"
  - "O(n * L) time where L is the most words that fit on one line, O(n) space"
optimal_complexity: {time: "O(n * L) where L is the most words per line (at most n)", space: "O(n)"}
rubric:
  excellent: "Shows why greedy fails, defines the suffix (or prefix) state, handles the free last line inside the transition, breaks the inner loop on overflow, uses 64-bit penalties and explains the complexity."
  good: "Correct dynamic programming with minor prompting on the last-line rule, the space accounting or overflow."
  weak: "Fills lines greedily, charges the last line, forgets the separating spaces, or enumerates every set of breaks exponentially."
  criteria:
    correctness: "All tests pass, including the greedy counterexample, a single line and exactly full lines."
    efficiency: "Each start tries only the words that fit on its line; no exponential search."
    code_quality: "Line length is updated incrementally and the last-line case is expressed clearly."
    edge_cases: "Single word, all words on one line, full-width words and penalties beyond 32 bits."
    communication: "Explains why the best layout of the remaining words does not depend on how earlier lines were broken."
hints:
  - "Try filling each line as much as possible on Example 1 and compare with other layouts. Why can a slightly emptier line early on pay off?"
  - "Once you decide which words go on the first line, the rest of the caption is the same problem on fewer words, starting on a fresh line. Can you store the answer for every starting word?"
  - "Work from the last word backwards. For each starting word, extend the line one word at a time, adding the word length plus one space and stopping once the width is exceeded. If the line reaches the final word it costs nothing; otherwise its cost is the squared slack plus the stored best for the next word. Keep the minimum, in a 64-bit integer, and return the value for the first word."
followups:
  - "How would you return the actual line breaks, not just the penalty?"
  - "What changes if the penalty is the cube of the slack, or the absolute slack?"
  - "Why does the greedy algorithm become optimal when the penalty is simply the number of lines?"
  - "How would you support words longer than the width by hyphenating them?"
common_errors:
  - "Filling every line greedily as full as possible."
  - "Charging a penalty for the last line."
  - "Forgetting the single spaces between words when computing the line length."
  - "Recomputing every line length from scratch or overflowing a 32-bit penalty."
