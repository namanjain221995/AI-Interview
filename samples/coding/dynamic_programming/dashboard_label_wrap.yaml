time_limit_minutes: 25
prompt_markdown: |
  ## Dashboard Label Wrap

  A monitoring dashboard prints a caption under each chart inside a box that is `width` characters wide.
  The caption's words must keep their order; the only choice is **where to break lines**.

  `word_lengths[i]` is the number of characters in word `i`. Words on the same line are separated by
  exactly one space, so a line holding words `i` through `j` has length

  ```
  word_lengths[i] + ... + word_lengths[j] + (j - i)
  ```

  and that length must not exceed `width`. Every word fits on a line by itself.

  Ragged right edges look untidy, so each line **except the last** adds `(width - line length)^2` to the
  layout's penalty. The last line is free, however short it is. Return the **minimum total penalty** over
  all valid layouts.

  ### Example 1
  ```
  Input:  word_lengths = [3, 2, 2, 5], width = 6
  Output: 10
  Explanation: Greedy gives "3 2" (length 6, penalty 0), "2" (penalty 16) and "5" (last line): total 16. The layout "3" (penalty 9), "2 2" (length 5, penalty 1), "5" (last line) costs only 10.
  ```

  ### Example 2
  ```
  Input:  word_lengths = [4], width = 10
  Output: 0
  Explanation: The only line is the last one, so it costs nothing.
  ```

  ### Example 3
  ```
  Input:  word_lengths = [2, 3, 4], width = 5
  Output: 13
  Explanation: No two words fit together (2 + 1 + 3 = 6 > 5), so the lines are "2" (penalty 9), "3" (penalty 4) and "4" (last line): total 13.
  ```

  ### Constraints
  - `1 <= word_lengths.length <= 5000`
  - `1 <= word_lengths[i] <= width <= 10^4`

  **Follow-up:** the penalty can exceed the 32-bit range; use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_wrap_penalty
  params:
    - {name: word_lengths, type: "int[]"}
    - {name: width, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def min_wrap_penalty(word_lengths: list[int], width: int) -> int:
        n = len(word_lengths)
        # best[i] = minimum penalty for laying out words i..n-1 starting on a fresh line
        best = [0] * (n + 1)
        for i in range(n - 1, -1, -1):
            best[i] = -1
            length = -1  # removes the space that would precede the first word
            for j in range(i, n):
                length += word_lengths[j] + 1
                if length > width:
                    break
                if j == n - 1:
                    cost = 0  # this line is the last one, which is free
                else:
                    cost = (width - length) ** 2 + best[j + 1]
                if best[i] < 0 or cost < best[i]:
                    best[i] = cost
        return best[0]
  javascript: |
    function minWrapPenalty(wordLengths, width) {
      const n = wordLengths.length;
      const best = new Array(n + 1).fill(0);
      for (let i = n - 1; i >= 0; i--) {
        best[i] = -1;
        let length = -1;
        for (let j = i; j < n; j++) {
          length += wordLengths[j] + 1;
          if (length > width) break;
          const cost = j === n - 1 ? 0 : (width - length) * (width - length) + best[j + 1];
          if (best[i] < 0 || cost < best[i]) best[i] = cost;
        }
      }
      return best[0];
    }
