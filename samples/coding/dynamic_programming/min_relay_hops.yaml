slug: min_relay_hops
title: "Minimum Relay Hops"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, network, backend, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Relay Hops

  A pipeline monitoring network places relays in a straight line, numbered `0` to `n - 1`. A message
  starts at relay `0` and must reach relay `n - 1`. Relay `i` can forward the message to **any** relay
  `j` with `i < j <= i + ranges[i]`; a relay with `ranges[i] = 0` cannot forward at all. Messages only
  travel forward.

  Return the **minimum number of forwards** needed to deliver the message from relay `0` to relay `n - 1`.

  - Return `0` when there is only one relay.
  - Return `-1` when the last relay cannot be reached.

  ### Example 1
  ```
  Input:  ranges = [2, 0, 3, 0, 0, 1, 4]
  Output: 3
  Explanation: 0 -> 2 -> 5 -> 6. Relay 2 cannot reach relay 6 directly.
  ```

  ### Example 2
  ```
  Input:  ranges = [3, 1, 0, 0, 5]
  Output: -1
  Explanation: Relays 1 to 3 are reachable, but none of them can forward past relay 3.
  ```

  ### Example 3
  ```
  Input:  ranges = [0]
  Output: 0
  ```

  ### Constraints
  - `1 <= ranges.length <= 10^4`
  - `0 <= ranges[i] <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_relay_hops
  params:
    - {name: ranges, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_relay_hops(ranges: list[int]) -> int:
        n = len(ranges)
        if n == 1:
            return 0
        hops = 0
        layer_end = 0   # farthest relay reachable with `hops` forwards
        farthest = 0    # farthest relay reachable with one more forward
        for relay in range(n - 1):
            farthest = max(farthest, relay + ranges[relay])
            if relay == layer_end:  # every relay of the current layer has been seen
                if farthest <= relay:
                    return -1
                hops += 1
                layer_end = farthest
                if layer_end >= n - 1:
                    return hops
        return -1
  javascript: |
    function minRelayHops(ranges) {
      const n = ranges.length;
      if (n === 1) return 0;
      let hops = 0;
      let layerEnd = 0;
      let farthest = 0;
      for (let relay = 0; relay < n - 1; relay++) {
        farthest = Math.max(farthest, relay + ranges[relay]);
        if (relay === layerEnd) {
          if (farthest <= relay) return -1;
          hops += 1;
          layerEnd = farthest;
          if (layerEnd >= n - 1) return hops;
        }
      }
      return -1;
    }
