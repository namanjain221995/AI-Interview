expected_concepts:
  - "breadth-first layers over reachable intervals"
  - "greedy farthest-reach per layer"
  - "detecting an unreachable end"
  - "DP baseline of fewest forwards per relay"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Starts from the fewest-forwards DP, then derives the layered greedy that tracks the end of the current layer and the farthest reach of the next, proves it is a BFS over intervals, handles the unreachable and single-relay cases and states O(n) time and O(1) space."
  good: "Correct DP or BFS solution in O(n * range) or O(n) with minor fixes for the -1 case."
  weak: "Always jumps to the farthest reachable relay, explores all paths recursively, or loops forever or returns a wrong count when the end is unreachable."
  criteria:
    correctness: "All tests pass, including unreachable inputs and the farthest-first trap."
    efficiency: "Linear time with constant memory for the greedy; the DP baseline is acceptable for a good rating."
    code_quality: "Layer boundaries are named clearly and the loop stops as soon as the end is reached."
    edge_cases: "Single relay, zero ranges, ranges far past the end and blocked paths."
    communication: "Explains why choosing the next relay by its own range alone is wrong while expanding by layers is correct."
hints:
  - "Think of all relays you can reach with exactly one forward, then all relays reachable with two forwards, and so on."
  - "The relays reachable with a given number of forwards always form a contiguous block. You only need to know where the current block ends and how far any relay inside it can reach."
  - "Scan the relays left to right while keeping the end of the current block and the farthest relay reachable from anything scanned so far. When you reach the end of the block, count one more forward and move the block end to that farthest position; if the farthest position did not move past the current relay, the last relay is unreachable. Stop as soon as the block end covers the last relay."
followups:
  - "How would you return the actual relay path, not just the number of forwards?"
  - "What changes if each forward has a different latency and you want the fastest delivery?"
  - "What if messages could also travel backwards within the range?"
common_errors:
  - "Always jumping to the relay with the largest range or the farthest index, which is not optimal."
  - "Forgetting to return -1 when a block of zero ranges cuts the line."
  - "Counting one extra forward when the last relay is reached exactly at a block end."
  - "Treating a single relay as needing one forward."
