expected_concepts:
  - "state: longest run ending with a given value"
  - "hash map from value to best run length"
  - "looking up value minus step for the predecessor"
  - "single pass in O(n) expected time versus O(n^2) pairwise dynamic programming"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Identifies that the best run ending at a sample depends only on the best run ending at value minus step seen earlier, uses a hash map in one pass, handles zero and negative steps, and states O(n) expected time and O(n) memory."
  good: "Correct O(n^2) dynamic programming over earlier indices that is improved to the hash map version with a hint, or the hash map version with a minor slip."
  weak: "Looks only at adjacent samples, sorts the input (ignoring order), or enumerates subsequences."
  criteria:
    correctness: "All tests pass, including zero and negative steps and repeated values."
    efficiency: "Single pass with constant-time lookups."
    code_quality: "Clear naming of the map (value to run length) and no special casing for the step sign."
    edge_cases: "Single sample, no run longer than one, duplicates and extreme values."
    communication: "Explains why storing the run by value (not by index) is enough."
hints:
  - "For each sample, think about the longest steady run that ends exactly at that sample."
  - "A run ending at a sample with value v must have its previous element equal to v minus step, appearing earlier. Do you need to know where it appeared, or only how long the best run ending with that value is?"
  - "Walk the samples once with a hash map from value to the longest run found so far that ends with that value. For each sample, the run ending here is one more than the map entry for the sample minus step (or one if there is none); store it under the sample's value and keep track of the largest length seen."
followups:
  - "How would you return the indices of one longest run?"
  - "What if step were not given and you had to find the longest arithmetic run for any step?"
  - "How would you process an unbounded stream of samples with limited memory?"
common_errors:
  - "Requiring the samples to be adjacent in the input."
  - "Sorting the samples, which ignores the time order."
  - "Looking up value plus step instead of value minus step."
  - "Returning 0 for inputs where no two samples form a run."
