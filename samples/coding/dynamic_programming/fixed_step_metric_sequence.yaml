slug: fixed_step_metric_sequence
title: Fixed Step Metric Sequence
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, data, data_analyst, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Fixed Step Metric Sequence

  A capacity-planning analyst is looking for steady trends in a series of metric samples recorded in time
  order. A **steady run** is a selection of samples, kept in their original order but not necessarily
  adjacent, in which every selected sample equals the previously selected sample **plus `step`**.

  Given the samples `values` and the integer `step`, return the **length of the longest steady run**.

  - `step` may be positive, zero (equal samples) or negative (a steady decline).
  - Any single sample on its own is a steady run of length `1`, so the answer is at least `1`.

  ### Example 1
  ```
  Input:  values = [3, 5, 4, 7, 9, 11, 6, 8], step = 2
  Output: 5
  Explanation: The samples 3, 5, 7, 9, 11 appear in this order and each is 2 more than the previous one.
  ```

  ### Example 2
  ```
  Input:  values = [10, 7, 8, 4, 5, 1], step = -3
  Output: 4
  Explanation: 10, 7, 4, 1.
  ```

  ### Example 3
  ```
  Input:  values = [4, 4, 2, 4], step = 0
  Output: 3
  ```

  ### Constraints
  - `1 <= values.length <= 10^5`
  - `-10^4 <= values[i], step <= 10^4`

  **Follow-up:** can you solve it in a single pass in `O(n)` expected time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_step_sequence
  params:
    - {name: values, type: "int[]"}
    - {name: step, type: int}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_step_sequence(values: list[int], step: int) -> int:
        # ending[v]: longest steady run seen so far that ends with value v.
        ending: dict[int, int] = {}
        best = 0
        for value in values:
            length = ending.get(value - step, 0) + 1
            ending[value] = length
            best = max(best, length)
        return best
  javascript: |
    function longestStepSequence(values, step) {
      const ending = new Map();
      let best = 0;
      for (const value of values) {
        const length = (ending.get(value - step) || 0) + 1;
        ending.set(value, length);
        if (length > best) best = length;
      }
      return best;
    }
