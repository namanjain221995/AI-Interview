  - {id: t4, hidden: true, args: [[]], expected: 0, description: "Empty list returns 0"}
  - {id: t5, hidden: true, args: [[0]], expected: 1, description: "Single failed check becomes a run of 1"}
  - {id: t6, hidden: true, args: [[0, 1, 1, 1, 1]], expected: 5, description: "Failure at the very start is waived"}
