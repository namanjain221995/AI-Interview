slug: healthy_streak_one_waiver
title: "Healthy Streak With One Waiver"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, devops, data_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Healthy Streak With One Waiver

  An uptime dashboard records the result of every scheduled health check for a service, oldest first:
  `checks[i]` is `1` when the check passed and `0` when it failed.

  For the monthly report the on-call lead may **waive at most one failed check**, which is then treated as
  if it had passed. Return the length of the **longest run of consecutive checks** that are all healthy
  after applying the waiver to the best possible failed check (or to none at all).

  - The run must be contiguous in the original order.
  - Using the waiver is optional; if no check failed, the whole list counts.
  - Return `0` for an empty list.

  ### Example 1
  ```
  Input:  checks = [1, 1, 0, 1, 1, 1, 0, 1]
  Output: 6
  Explanation: Waiving the failure at index 2 joins the runs of 2 and 3 healthy checks into
  indices 0..5. Waiving index 6 instead only gives indices 3..7, length 5.
  ```

  ### Example 2
  ```
  Input:  checks = [0, 0, 0]
  Output: 1
  Explanation: Only one failure can be waived, so the best run is a single check.
  ```

  ### Example 3
  ```
  Input:  checks = [1, 1, 1, 1]
  Output: 4
  ```

  ### Constraints
  - `0 <= checks.length <= 10^5`
  - `checks[i]` is `0` or `1`

  **Follow-up:** How would you generalise the solution to allow up to `k` waivers?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_streak_with_one_waiver
  params:
    - {name: checks, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_streak_with_one_waiver(checks: list[int]) -> int:
        # plain: healthy run ending here without the waiver
        # waived: best run ending here that has used the waiver (or could have)
        plain = 0
        waived = 0
        best = 0
        for check in checks:
            if check == 1:
                plain += 1
                waived += 1
            else:
                waived = plain + 1
                plain = 0
            best = max(best, waived)
        return best
  javascript: |
    function longestStreakWithOneWaiver(checks) {
      let plain = 0;
      let waived = 0;
      let best = 0;
      for (const check of checks) {
        if (check === 1) {
          plain += 1;
          waived += 1;
        } else {
          waived = plain + 1;
          plain = 0;
        }
        best = Math.max(best, waived);
      }
      return best;
    }
