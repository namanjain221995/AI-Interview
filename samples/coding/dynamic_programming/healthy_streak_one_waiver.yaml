expected_concepts:
  - "running state for the streak ending at each check"
  - "tracking with and without the waiver used"
  - "sliding window with at most one zero"
  - "single pass, constant memory"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines two running values (streak ending here without the waiver and with it), updates them in one pass, explains the transition on a failed check, handles empty and all-failed input, and states O(n) time and O(1) space; can extend to k waivers with a sliding window."
  good: "Correct linear solution via a sliding window or prefix and suffix run lengths, possibly with O(n) extra memory or a small fix found by testing."
  weak: "Tries every window or every waiver position with a rescan (quadratic), waives two failures, or returns the count of healthy checks instead of a contiguous run."
  criteria:
    correctness: "All tests pass, including adjacent failures and an empty list."
    efficiency: "Single pass with constant extra memory."
    code_quality: "State variables have clear names and the transition on a failure is easy to follow."
    edge_cases: "Empty list, all failures, no failures and failures at either end."
    communication: "Explains why a failure resets the no-waiver streak but extends the waiver streak from the previous no-waiver streak."
hints:
  - "Think about the best healthy run that ends exactly at each check, rather than about every possible window."
  - "Keep two numbers as you scan: the run ending here that has not used the waiver, and the run ending here that has used it. Decide how each changes when the current check passes or fails."
  - "On a passing check both numbers grow by one. On a failed check the waiver run becomes the previous no-waiver run plus one, and the no-waiver run resets to zero. The answer is the largest waiver run seen; it is zero for an empty list."
followups:
  - "How would you allow up to k waived failures?"
  - "How would you also return the start index of the best run?"
  - "What changes if the checks arrive as an endless stream and you must report the best run so far after every check?"
common_errors:
  - "Waiving every failure between two runs instead of only one."
  - "Forgetting the case with no failures, or the case where the waiver must be applied at an end of the list."
  - "Returning the total number of healthy checks instead of a contiguous run."
  - "Rescanning from every index, which is quadratic."
