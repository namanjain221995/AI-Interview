expected_concepts:
  - "edit distance (Levenshtein) DP"
  - "base cases of all inserts or all deletes"
  - "match versus replace, insert and delete transitions"
  - "rolling rows for O(n) memory"
optimal_complexity: {time: "O(m * n)", space: "O(min(m, n))"}
rubric:
  excellent: "Defines the prefix table with clear base rows, maps each of the three operations to a neighbouring cell, handles empty strings, keeps only two rows and states O(m * n) time; can explain how to recover the edit script."
  good: "Correct full-table or memoised solution in O(m * n) time and memory."
  weak: "Counts differing positions, compares only lengths, treats a swap as one edit, or recurses without memoisation."
  criteria:
    correctness: "All tests pass, including empty strings, case differences and transpositions."
    efficiency: "Quadratic time in the string lengths; linear memory is a plus."
    code_quality: "Each transition is labelled with the edit it represents and indices are consistent."
    edge_cases: "Empty source or target, identical strings and long insertions."
    communication: "Explains the recurrence and the meaning of each neighbouring cell before coding."
hints:
  - "Look at the last characters of both strings: if they are equal nothing needs to change there; otherwise the last edit touched one of them."
  - "Define the cost for every pair of prefixes. Turning a prefix into an empty string, or the empty string into a prefix, has an obvious cost that seeds the computation."
  - "Fill a table over prefix lengths. The first row and column count pure inserts or deletes. For each cell, if the two current characters are equal copy the diagonal; otherwise take one plus the smallest of the diagonal (replace), the cell above (delete) and the cell to the left (insert). Two rows are enough."
followups:
  - "How would you output the actual list of edits for a drift report?"
  - "How would you stop early if you only care whether the distance is at most k?"
  - "What changes if replacing a character costs more than inserting or deleting one?"
common_errors:
  - "Counting mismatched positions, which ignores inserts and deletes."
  - "Wrong base cases for empty prefixes."
  - "Mixing up which neighbouring cell means insert and which means delete, which still works but signals confusion when explaining."
  - "Recursing without memoisation, which is exponential."
