slug: config_edit_distance
title: "Config Edit Distance"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, devops, backend, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Config Edit Distance

  A configuration drift detector compares the value that is currently deployed, `source`, with the value
  declared in the repository, `target`. To rank drifts by size it needs the **minimum number of
  single-character edits** that turn `source` into `target`, where one edit is one of:

  - **insert** one character at any position,
  - **delete** one character,
  - **replace** one character with a different character.

  Characters are compared exactly (case-sensitive). Return `0` when the strings are already equal.

  ### Example 1
  ```
  Input:  source = "timeout=30", target = "timeout=300"
  Output: 1
  Explanation: Insert one 0 at the end.
  ```

  ### Example 2
  ```
  Input:  source = "replicas: 2", target = "replica: 3"
  Output: 2
  Explanation: Delete the s and replace 2 with 3.
  ```

  ### Example 3
  ```
  Input:  source = "", target = "port"
  Output: 4
  ```

  ### Constraints
  - `0 <= source.length, target.length <= 500`
  - Both strings contain printable ASCII characters only.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: config_edit_distance
  params:
    - {name: source, type: "string"}
    - {name: target, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def config_edit_distance(source: str, target: str) -> int:
        m, n = len(source), len(target)
        previous = list(range(n + 1))  # turning "" into target[:j] takes j inserts
        for i in range(1, m + 1):
            current = [i] + [0] * n     # turning source[:i] into "" takes i deletes
            for j in range(1, n + 1):
                if source[i - 1] == target[j - 1]:
                    current[j] = previous[j - 1]
                else:
                    current[j] = 1 + min(
                        previous[j - 1],  # replace
                        previous[j],      # delete from source
                        current[j - 1],   # insert into source
                    )
            previous = current
        return previous[n]
  javascript: |
    function configEditDistance(source, target) {
      const m = source.length;
      const n = target.length;
      let previous = Array.from({ length: n + 1 }, (_, j) => j);
      for (let i = 1; i <= m; i++) {
        const current = new Array(n + 1).fill(0);
        current[0] = i;
        for (let j = 1; j <= n; j++) {
          if (source[i - 1] === target[j - 1]) {
            current[j] = previous[j - 1];
          } else {
            current[j] = 1 + Math.min(previous[j - 1], previous[j], current[j - 1]);
          }
        }
        previous = current;
      }
      return previous[n];
    }
