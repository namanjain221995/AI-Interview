version: 1
slug: health_log_state_count
title: "Health Log State Count"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, devops, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Health Log State Count

  An SRE team keeps a daily status log for every service. Each day is recorded as exactly one of three
  letters:

  - `U` - the service was up all day,
  - `D` - the service was degraded,
  - `X` - the service had an outage.

  A log covering `n` days is **acceptable** for the quarterly reliability review when both rules hold:

  1. it contains **fewer than two** `X` days in total (zero or one outage), and
  2. it never contains **three or more consecutive** `D` days.

  Given `n`, return how many different `n`-day logs (strings of length `n` over the letters `U`, `D`
  and `X`) are acceptable. The count grows very quickly, so return it **modulo `1_000_000_007`**
  (10^9 + 7).

  ### Example 1
  ```
  Input:  n = 2
  Output: 8
  Explanation: There are 3 * 3 = 9 two-day logs and only "XX" has two outages.
  ```

  ### Example 2
  ```
  Input:  n = 3
  Output: 19
  Explanation: Of the 27 three-day logs, 7 have two or more outages (XXU, XUX, UXX, XXD, XDX, DXX, XXX) and 1 has three degraded days in a row (DDD), leaving 27 - 7 - 1 = 19.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - Return the count modulo `1_000_000_007`.

  **Follow-up:** how would you handle `n` up to `10^18`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_acceptable_health_logs
  params:
    - {name: n, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_acceptable_health_logs(n: int) -> int:
        mod = 1_000_000_007
        # counts[outages][trailing_degraded]: outages in {0, 1}, trailing D run in {0, 1, 2}
        counts = [[1, 0, 0], [0, 0, 0]]
        for _ in range(n):
            nxt = [[0, 0, 0], [0, 0, 0]]
            for outages in range(2):
                for run in range(3):
                    ways = counts[outages][run]
                    if ways == 0:
                        continue
                    # U: the degraded run resets
                    nxt[outages][0] = (nxt[outages][0] + ways) % mod
                    # D: allowed while the run stays below three
                    if run < 2:
                        nxt[outages][run + 1] = (nxt[outages][run + 1] + ways) % mod
                    # X: only if no outage has happened yet; it also breaks the run
                    if outages == 0:
                        nxt[1][0] = (nxt[1][0] + ways) % mod
            counts = nxt
        return sum(sum(row) for row in counts) % mod
  javascript: |
    function countAcceptableHealthLogs(n) {
      const MOD = 1000000007;
      // counts[outages][trailingDegraded]
      let counts = [[1, 0, 0], [0, 0, 0]];
      for (let day = 0; day < n; day++) {
        const next = [[0, 0, 0], [0, 0, 0]];
        for (let outages = 0; outages < 2; outages++) {
          for (let run = 0; run < 3; run++) {
            const ways = counts[outages][run];
            if (ways === 0) continue;
            next[outages][0] = (next[outages][0] + ways) % MOD;
            if (run < 2) next[outages][run + 1] = (next[outages][run + 1] + ways) % MOD;
            if (outages === 0) next[1][0] = (next[1][0] + ways) % MOD;
          }
        }
        counts = next;
      }
      let total = 0;
      for (const row of counts) for (const ways of row) total = (total + ways) % MOD;
      return total;
    }
tests:
  - {id: t1, args: [2], expected: 8, description: "Example 1"}
  - {id: t2, args: [3], expected: 19, description: "Example 2 - both rules exclude logs"}
  - {id: t3, hidden: true, args: [1], expected: 3, description: "Minimum length: U, D and X are all acceptable"}
  - {id: t4, hidden: true, args: [4], expected: 43, description: "Four days: first length where a DDD run can sit next to an X"}
  - {id: t5, hidden: true, args: [5], expected: 94, description: "Five days: checks the trailing-run reset after U and X"}
  - {id: t6, hidden: true, args: [10], expected: 3536, description: "Ten days, still below the modulus - catches off-by-one in the run limit"}
  - {id: t7, hidden: true, args: [29], expected: 9569297, description: "First length whose raw count passes 10^9 + 7; the result must be reduced"}
  - {id: t8, hidden: true, args: [80], expected: 629839153, description: "Raw count beyond the 64-bit range - every addition must be reduced modulo 10^9 + 7"}
  - {id: t9, hidden: true, args: [100000], expected: 749184020, description: "Maximum n - linear time with constant state required"}
expected_concepts:
  - "dynamic programming over a compact state: outages so far and length of the trailing degraded run"
  - "six states updated once per day"
  - "modular arithmetic applied on every addition"
  - "O(n) time with O(1) extra memory"
  - "brute force over 3^n strings as the baseline to improve on"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Identifies the six states (outage count 0-1 by trailing D run 0-2), derives the transitions for U, D and X, applies the modulus on every update, explains O(n) time and O(1) space and can sketch matrix exponentiation for huge n."
  good: "Correct dynamic programming with the right states and modulus, possibly with an O(n) table or minor prompting on the transitions."
  weak: "Enumerates all 3^n logs, forgets to reset the degraded run after U or X, lets X happen twice, or overflows by reducing only at the end."
  criteria:
    correctness: "All tests pass, including n = 1 and lengths whose raw count exceeds the modulus."
    efficiency: "Linear in n with a constant number of states; no recursion that blows the stack at n = 10^5."
    code_quality: "States are named clearly and transitions are written once per letter rather than as a long case list."
    edge_cases: "Run reset after U and X, the single allowed outage, and reduction modulo 10^9 + 7 on every addition."
    communication: "Explains why the outage count and trailing run are enough to decide every future day."
hints:
  - "Build the log one day at a time. What do you need to remember about the days so far to know which letter may come next?"
  - "Only two facts about the prefix matter: whether an outage has already happened, and how many degraded days the prefix currently ends with. That is just six combinations."
  - "Keep a count for each of the six states. For every new day: an up day keeps the outage count and resets the degraded run to zero; a degraded day extends the run only while it stays below three; an outage moves from the no-outage states to the one-outage state with the run reset. Reduce every sum modulo 10^9 + 7 and add up all six states at the end."
followups:
  - "How would you compute the answer for n up to 10^18?"
  - "How does the state change if up to k outages and at most m consecutive degraded days are allowed?"
  - "How would you count only the acceptable logs that end with an up day?"
  - "Can you list one acceptable log of length n that has the most degraded days?"
common_errors:
  - "Forgetting to reset the degraded run when an outage day occurs."
  - "Counting all logs and subtracting the bad ones, which double-counts logs that break both rules."
  - "Reducing modulo only at the end, overflowing 64-bit integers along the way."
  - "Allowing the run of degraded days to reach three before rejecting it."
