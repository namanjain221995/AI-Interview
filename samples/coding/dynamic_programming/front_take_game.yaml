expected_concepts:
  - "minimax expressed as a single score difference"
  - "suffix dynamic programming from the end of the row"
  - "forced moves when only negative values remain"
  - "O(n) time with an O(1) rolling window as a refinement"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Models the game as the best score difference for the player to move on each suffix, fills it from the back with three options per position, maps the sign to the answer, and notes the O(1)-memory rolling version."
  good: "Correct memoised minimax over the suffix index, possibly tracking two scores, with the right complexity."
  weak: "Plays greedily (takes positives, avoids negatives), allows skipping a turn, or confuses whose turn it is."
  criteria:
    correctness: "All tests pass, including a single negative value, all-zero rows and the greedy trap."
    efficiency: "Linear time; each suffix evaluated once with at most three options."
    code_quality: "State definition stated in a comment, best option initialised from a legal move rather than zero."
    edge_cases: "Single value of each sign, all negative rows and rows shorter than three at the end."
    communication: "Explains why maximising the difference is equivalent to maximising one's own score."
hints:
  - "The game position is fully described by how many values have already been taken, and both teams face the same kind of decision; think about a single score difference instead of two separate scores."
  - "Let the best achievable difference (team to move minus the other team) for the suffix starting at position i be one number. Taking k values earns their sum and then hands the other team the suffix starting k positions later."
  - "Fill these differences from the end of the row backwards: for each start, try taking one, two or three values (if that many remain), compute their sum minus the stored difference of the suffix that remains, and keep the largest option, starting from a legal move rather than from zero. The sign of the difference for the whole row decides the answer: positive means first, negative means second, zero means tie."
followups:
  - "Can you reduce the memory to O(1)?"
  - "What changes if a team may take up to k values per turn?"
  - "How would you also report the first team's best opening move?"
  - "What if values could be taken from either end of the row?"
common_errors:
  - "Greedily taking every positive value or stopping before a negative one."
  - "Initialising the best option to zero, which hides forced moves that lose points."
  - "Tracking two scores and swapping them incorrectly between turns."
  - "Reading past the end of the row when fewer than three values remain."
