slug: front_take_game
title: "Front Take Game"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist]
time_limit_minutes: 30
prompt_markdown: |
  ## Front Take Game

  At the end of a hack day, two teams settle a tie with a game on a row of signed bonus values. Starting
  with the **first** team, the teams alternate turns. On each turn the team to move must take **1, 2 or
  3** values from the **front** of the remaining row (never more than are left) and adds them to its own
  score; negative values lower the score. The game ends when the row is empty.

  Both teams play **optimally**: each always maximises its own final score. (The total of all values is
  fixed, so this is the same as maximising its score minus the other team's score.)

  Return `"first"` if the first team finishes with the higher score, `"second"` if the second team does,
  and `"tie"` if the scores are equal.

  ### Example 1
  ```
  Input:  values = [2, -1, 4, 3]
  Output: "first"
  Explanation: the first team takes 2, -1 and 4 (score 5); the second team must take 3
  ```

  ### Example 2
  ```
  Input:  values = [-1, -2, -3]
  Output: "tie"
  Explanation: the first team takes -1 and -2 (score -3); the second team must take -3
  ```

  ### Example 3
  ```
  Input:  values = [-3, -4, 9, 9]
  Output: "second"
  Explanation: every opening move leaves the second team a 9 and a higher score
  ```

  ### Constraints
  - `1 <= values.length <= 5 * 10^4`
  - `-1000 <= values[i] <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: front_take_game_result
  params:
    - {name: values, type: "int[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def front_take_game_result(values: list[int]) -> str:
        n = len(values)
        # lead[i]: best score difference (player to move minus the other player)
        # when only values[i:] remain
        lead = [0] * (n + 1)
        for i in range(n - 1, -1, -1):
            taken = 0
            best = None
            for count in range(1, 4):
                if i + count > n:
                    break
                taken += values[i + count - 1]
                option = taken - lead[i + count]
                if best is None or option > best:
                    best = option
            lead[i] = best
        if lead[0] > 0:
            return "first"
        if lead[0] < 0:
            return "second"
        return "tie"
  javascript: |
    function frontTakeGameResult(values) {
      const n = values.length;
      // lead[i]: best (mover minus other) difference when values[i..] remain
      const lead = new Array(n + 1).fill(0);
      for (let i = n - 1; i >= 0; i--) {
        let taken = 0;
        let best = -Infinity;
        for (let count = 1; count <= 3 && i + count <= n; count++) {
          taken += values[i + count - 1];
          best = Math.max(best, taken - lead[i + count]);
        }
        lead[i] = best;
      }
      if (lead[0] > 0) return 'first';
      if (lead[0] < 0) return 'second';
      return 'tie';
    }
