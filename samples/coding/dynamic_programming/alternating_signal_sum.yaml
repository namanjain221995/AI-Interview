title: "Alternating Signal Sum"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, data, data_scientist, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Alternating Signal Sum

  A vibration sensor reports a series of integer `values`. A calibration routine picks a **non-empty
  subsequence** of the readings, keeping their original order (picked readings do not need to be
  adjacent). The picked readings are combined with alternating signs: the first is added, the second
  subtracted, the third added, and so on. A pick `s0, s1, s2, s3, ...` therefore scores
  `s0 - s1 + s2 - s3 + ...`.

  Return the **maximum score** that any non-empty pick can achieve. Readings may be negative, and
  subtracting a negative reading increases the score.

  ### Example 1
  ```
  Input:  values = [6, 2, 7, 1, 4]
  Output: 14
  Explanation: pick every reading: 6 - 2 + 7 - 1 + 4 = 14
  ```

  ### Example 2
  ```
  Input:  values = [3, 9, 4, 10, 10]
  Output: 15
  Explanation: pick 9, 4 and 10: 9 - 4 + 10 = 15
  ```

  ### Example 3
  ```
  Input:  values = [-3, -8, -1]
  Output: 5
  Explanation: pick -3 and -8: -3 - (-8) = 5
  ```

  ### Constraints
  - `1 <= values.length <= 10^5`
  - `-10^9 <= values[i] <= 10^9`
  - The answer can exceed the 32-bit integer range.

  **Follow-up:** can you solve it in one pass with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_alternating_signal
  params:
    - {name: values, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_alternating_signal(values: list[int]) -> int:
        # added: best score of a pick whose last element was added (odd length)
        # subtracted: best score of a pick whose last element was subtracted (even length)
        neg_inf = float("-inf")
        added, subtracted = neg_inf, neg_inf
        for v in values:
            new_added = max(added, v, subtracted + v)
            new_subtracted = max(subtracted, added - v)
            added, subtracted = new_added, new_subtracted
        return int(max(added, subtracted))
  javascript: |
    function maxAlternatingSignal(values) {
      let added = -Infinity;
      let subtracted = -Infinity;
      for (const v of values) {
        const nextAdded = Math.max(added, v, subtracted + v);
        const nextSubtracted = Math.max(subtracted, added - v);
        added = nextAdded;
        subtracted = nextSubtracted;
      }
      return Math.max(added, subtracted);
    }
