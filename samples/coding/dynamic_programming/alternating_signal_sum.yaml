expected_concepts:
  - "dynamic programming with two states (last pick added or subtracted)"
  - "single pass with simultaneous state updates"
  - "non-empty pick for all-negative input"
  - "64-bit running totals"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines the two states precisely, updates them together in one pass, handles the non-empty requirement for all-negative input, uses 64-bit totals and states O(n) time and O(1) space."
  good: "Reaches a correct O(n) dynamic programming solution, possibly with arrays or a nudge about initial values."
  weak: "Enumerates subsequences, assumes readings are positive, or returns 0 when every reading is negative."
  criteria:
    correctness: "Passes all tests, including single readings, all-negative input and extreme values."
    efficiency: "Linear time with constant extra space instead of exponential enumeration or a quadratic table."
    code_quality: "State variables have meaningful names and both are updated from the previous step's values."
    edge_cases: "Handles a single negative reading (the answer is that reading) and totals beyond 32 bits."
    communication: "Explains what each state represents and why it is enough to remember only those two values."
hints:
  - "Scan the readings from left to right and ask what you must remember about the best picks so far to decide what to do with the next reading."
  - "Keep two running best scores: one for picks whose last reading was added and one for picks whose last reading was subtracted. The next reading either joins one of them or is ignored."
  - "For each reading, the best pick ending with an added reading is the largest of the old value, a new pick made of this reading alone, or this reading added to the best pick ending with a subtraction. The best pick ending with a subtraction is the larger of its old value or this reading subtracted from the old best added pick. Update both from the previous values and return the larger one at the end."
followups:
  - "How would you return the indices of one optimal pick as well as its score?"
  - "What changes if the pick must contain an even number of readings?"
  - "How would you answer the same question for many different sub-ranges of the readings?"
common_errors:
  - "Initialising both states to zero, which allows an empty pick and returns 0 for all-negative input."
  - "Updating the subtracted state from the already-updated added state within the same step."
  - "Assuming readings are positive and only taking local peaks and valleys."
  - "Using 32-bit integers for the running scores."
