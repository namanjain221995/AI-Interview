expected_concepts:
  - "processing words from shortest to longest"
  - "dynamic programming keyed by word in a hash map"
  - "generating predecessors by deleting one character"
  - "ignoring duplicate words"
optimal_complexity: {time: "O(n log n + n * L^2) where L is the maximum word length", space: "O(n * L)"}
rubric:
  excellent: "Sorts distinct words by length, stores the best chain ending at each word in a map, finds predecessors by deleting each character, and states O(n * L^2) time with a clear argument."
  good: "Correct solution that compares candidate pairs of adjacent lengths, or the map-based DP after a hint."
  weak: "Only checks prefixes, compares every pair of words without length grouping, or processes words in input order."
  criteria:
    correctness: "Passes all tests, including duplicates, length jumps and branching chains."
    efficiency: "Avoids pairwise comparison of all words by looking up predecessors in a hash map."
    code_quality: "Predecessor generation and the map update are short, readable and correctly ordered."
    edge_cases: "Handles an empty list, repeated words and words with no predecessor."
    communication: "Explains why processing by length guarantees every predecessor is ready before it is needed."
hints:
  - "A word can only follow a word that is exactly one character shorter, so it helps to process the words from shortest to longest."
  - "Remember, for every word already processed, the longest chain that ends at it. For a new word, which shorter words could come right before it, and how many are there?"
  - "Sort the distinct words by length and keep a map from word to best chain length. For each word, delete each of its characters in turn; whenever the shorter word is in the map, the current word can extend that chain by one. Store the best value for the word, at least 1, and track the overall maximum."
followups:
  - "How would you return one longest chain instead of only its length?"
  - "Would searching upwards by inserting every possible letter be faster or slower, and why?"
  - "How does the cost change if words can be thousands of characters long?"
common_errors:
  - "Checking only whether one word is a prefix of the next, which misses insertions in the middle."
  - "Comparing every pair of words, which is quadratic in the number of words."
  - "Processing words in input order so a longer word is handled before its predecessor."
  - "Treating rearrangements such as ab and ba as valid predecessors."
