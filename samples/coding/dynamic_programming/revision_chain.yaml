version: 1
slug: revision_chain
title: "Revision Chain"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, frontend, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Revision Chain

  A configuration tool keeps every saved draft of a short identifier as a lowercase word. A **revision
  chain** is a sequence of distinct words `w1, w2, ..., wm` from the list in which every next word is
  obtained by inserting **exactly one** character anywhere in the previous word (at the start, in the
  middle or at the end) while keeping the other characters in their order. For example `pan -> plan` is
  a valid step, but `ab -> bca` is not.

  Given the list `words`, return the length of the **longest revision chain**. A single word is a chain
  of length 1, the same word cannot be used twice in a chain, and an empty list returns `0`.

  ### Example 1
  ```
  Input:  words = ["plan", "pan", "an", "plane", "planet", "plant", "a"]
  Output: 6
  Explanation: a -> an -> pan -> plan -> plane -> planet
  ```

  ### Example 2
  ```
  Input:  words = ["ship", "deploy", "merge"]
  Output: 1
  Explanation: no word can be formed from another by inserting one character
  ```

  ### Example 3
  ```
  Input:  words = ["ab", "ba", "bca", "abc"]
  Output: 2
  Explanation: ab -> abc and ba -> bca are chains of length 2; ba -> abc is not a step because it reorders b and a
  ```

  ### Constraints
  - `0 <= words.length <= 1000`
  - `1 <= words[i].length <= 16`
  - `words[i]` consists of lowercase English letters; words may repeat
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_revision_chain
  params:
    - {name: words, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_revision_chain(words: list[str]) -> int:
        best: dict[str, int] = {}
        answer = 0
        for word in sorted(set(words), key=len):
            length = 1
            for i in range(len(word)):
                shorter = word[:i] + word[i + 1:]
                if shorter in best:
                    length = max(length, best[shorter] + 1)
            best[word] = length
            answer = max(answer, length)
        return answer
  javascript: |
    function longestRevisionChain(words) {
      const unique = [...new Set(words)].sort((a, b) => a.length - b.length);
      const best = new Map();
      let answer = 0;
      for (const word of unique) {
        let length = 1;
        for (let i = 0; i < word.length; i++) {
          const shorter = word.slice(0, i) + word.slice(i + 1);
          if (best.has(shorter)) length = Math.max(length, best.get(shorter) + 1);
        }
        best.set(word, length);
        answer = Math.max(answer, length);
      }
      return answer;
    }
