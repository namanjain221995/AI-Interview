  - {id: t3, args: [["ab", "ba", "bca", "abc"]], expected: 2, description: "Example 3 - insertion must keep the order of existing characters"}
  - {id: t4, hidden: true, args: [[]], expected: 0, description: "Empty list returns 0"}
  - {id: t5, hidden: true, args: [["release"]], expected: 1, description: "Single word"}
  - {id: t6, hidden: true, args: [["x", "x", "xy", "xy", "xyz"]], expected: 3, description: "Duplicate words do not lengthen the chain"}
  - {id: t7, hidden: true, args: [["a", "abc", "abcde"]], expected: 1, description: "Lengths jump by two - every word is its own chain"}
  - {id: t8, hidden: true, args: [["e", "ed", "eda", "edab", "zz", "zzz", "zzzz", "zzzzz", "zzzzzz"]], expected: 5, description: "Longest chain is the repeated-letter one, not the first one found"}
  - {id: t9, hidden: true, args: [["dcba", "a", "ba", "cba", "ab", "abc", "abcd", "bca", "dbca"]], expected: 4, description: "Branching: several predecessors per word, best path must be chosen"}
