expected_concepts:
  - "grouped (multiple-choice) knapsack"
  - "grouping options by service"
  - "processing one group at a time into a fresh table"
  - "marking unreachable budgets and returning -1"
  - "64-bit value totals"
optimal_complexity: {time: "O(options * budget)", space: "O(budget)"}
rubric:
  excellent: "Groups options by service, runs a multiple-choice knapsack with a fresh table per service so exactly one option is taken, marks infeasible budgets, returns -1 correctly, uses 64-bit totals and states O(options * budget) time with O(budget) memory."
  good: "Correct grouped DP with a two-dimensional table or memoised recursion; minor issues with infeasibility handling fixed after a hint."
  weak: "Plain 0/1 knapsack that may skip a service or take two options for one service, greedy best value-per-cost, or enumerating all combinations."
  criteria:
    correctness: "All tests pass, including infeasible budgets, zero costs and large values."
    efficiency: "Each option is combined with each budget once; no combination enumeration."
    code_quality: "Clear grouping step; an explicit sentinel for impossible states rather than relying on zero."
    edge_cases: "Zero budget, zero-cost options, single-option services and options listed out of order."
    communication: "Explains why reading from the previous service's table prevents choosing two options for one service."
hints:
  - "Handle the services one at a time: after deciding the first few services, what do you need to remember to decide the rest?"
  - "For the services handled so far, keep the best total value for each total cost limit. Adding the next service means trying each of its options on top of that table, and every service must contribute exactly one option."
  - "Group the options by service. Start with a table where every budget has value zero, then for each service build a new table: for each budget, try each option of that service whose cost fits and take the best of the old value at the remaining budget plus the option's value, marking a budget as impossible when nothing fits. After the last service, the entry at the full budget is the answer, or minus one if it is impossible."
followups:
  - "How would you recover the chosen option for each service?"
  - "What changes if a service may also be left out with value zero?"
  - "If costs were up to 10^9 but values were small, how would you swap the roles of cost and value in the table?"
  - "Can you prune options that are dominated (cost no lower and value no higher) before the DP?"
common_errors:
  - "Updating the same table in place, so two options from one service are combined."
  - "Treating it as a plain 0/1 knapsack where a service can be skipped."
  - "Using zero for impossible states, which hides infeasible budgets and never returns -1."
  - "Assuming options are sorted or grouped by service in the input."
  - "Overflowing a 32-bit accumulator when values are large."
