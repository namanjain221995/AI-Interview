slug: one_config_per_service
title: One Config Per Service
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, cloud, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## One Config Per Service

  A platform team is sizing `services` microservices, numbered `0` to `services - 1`, for next quarter.
  Each row of `options` is `[service, cost, value]`: one deployment configuration (instance size, replica
  count, ...) for that service, its monthly cost and the value it delivers (for example throughput
  headroom). Every service has **at least one** option.

  Pick **exactly one** option for **every** service so that the total cost is **at most** `budget`.
  Return the **maximum total value** of such a choice, or `-1` if no choice fits the budget. Options for a
  service can appear anywhere in `options`, in any order. The total value can exceed the 32-bit range.

  ### Example 1
  ```
  Input:  options = [[0, 4, 10], [0, 2, 6], [1, 3, 8], [1, 1, 3], [2, 2, 5]], services = 3, budget = 8
  Output: 19
  Explanation: The most valuable option of every service costs 4 + 3 + 2 = 9, over budget. Choosing costs 4, 1, 2 gives value 10 + 3 + 5 = 18 for cost 7; costs 2, 3, 2 give 6 + 8 + 5 = 19 for cost 7, the best.
  ```

  ### Example 2
  ```
  Input:  options = [[0, 5, 9], [1, 4, 7]], services = 2, budget = 8
  Output: -1
  Explanation: Each service has a single option and together they cost 9 > 8.
  ```

  ### Example 3
  ```
  Input:  options = [[1, 0, 2], [0, 0, 0], [1, 3, 9]], services = 2, budget = 3
  Output: 9
  Explanation: Service 0 takes its only option (cost 0). Service 1 can afford its cost-3 option, total value 9.
  ```

  ### Constraints
  - `1 <= services <= 50`
  - `services <= options.length <= 200`, each row is `[service, cost, value]`
  - `0 <= service < services`, and every service has at least one option
  - `0 <= cost <= 1000`
  - `0 <= value <= 10^9`
  - `0 <= budget <= 1000`

  **Follow-up:** How would you also report which option was chosen for each service?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_value_one_option_per_service
  params:
    - {name: options, type: "int[][]"}
    - {name: services, type: "int"}
    - {name: budget, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_value_one_option_per_service(options: list[list[int]], services: int, budget: int) -> int:
        groups: list[list[tuple[int, int]]] = [[] for _ in range(services)]
        for service, cost, value in options:
            groups[service].append((cost, value))
        # best[b]: highest value for the services handled so far with total cost <= b, or -1 if impossible.
        best = [0] * (budget + 1)
        for group in groups:
            nxt = [-1] * (budget + 1)
            for b in range(budget + 1):
                for cost, value in group:
                    if cost <= b and best[b - cost] >= 0:
                        candidate = best[b - cost] + value
                        if candidate > nxt[b]:
                            nxt[b] = candidate
            best = nxt
        return best[budget]
  javascript: |
    function maxValueOneOptionPerService(options, services, budget) {
      const groups = Array.from({ length: services }, () => []);
      for (const [service, cost, value] of options) groups[service].push([cost, value]);
      let best = new Array(budget + 1).fill(0);
      for (const group of groups) {
        const nxt = new Array(budget + 1).fill(-1);
        for (let b = 0; b <= budget; b++) {
          for (const [cost, value] of group) {
            if (cost <= b && best[b - cost] >= 0) {
              const candidate = best[b - cost] + value;
              if (candidate > nxt[b]) nxt[b] = candidate;
            }
          }
        }
        best = nxt;
      }
      return best[budget];
    }
