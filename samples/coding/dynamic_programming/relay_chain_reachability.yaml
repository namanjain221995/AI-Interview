expected_concepts:
  - "track the farthest relay reachable so far"
  - "stop when the current index is beyond the farthest reach"
  - "greedy single pass versus O(n * range) reachability table"
  - "early exit once the last relay is in range"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Starts from a reachability table or BFS, observes that reachable relays form a prefix, reduces it to a single farthest-reach variable with early exits, handles single-relay input and states O(n) time with O(1) memory."
  good: "Correct DP table or BFS with a reasonable bound, or the greedy with a minor prompt on why it is correct."
  weak: "Always takes the longest forward from each relay (which can skip the only useful relay), explores all paths recursively, or reads past the array end."
  criteria:
    correctness: "All tests pass, including single relay, ranges beyond the end and zero-range traps."
    efficiency: "Linear time for the greedy; the table approach must avoid scanning huge ranges past the end."
    code_quality: "Clear names for the farthest reach; loop bounds that cannot index out of range."
    edge_cases: "Single relay, first relay with range zero, very large ranges."
    communication: "Explains why the set of reachable relays is always a contiguous prefix."
hints:
  - "Instead of following individual forwarding chains, think about which relays are reachable at all once you have looked at relays 0 to i."
  - "The reachable relays always form a contiguous block starting at relay 0, so a single number describing how far that block extends is enough."
  - "Scan the relays in order while keeping the farthest relay number reachable so far. If the current relay lies beyond that number the packet can never get here, so return false. Otherwise extend the farthest reach with the current relay number plus its range, and return true as soon as it covers the last relay."
followups:
  - "How would you return the minimum number of forwards needed to reach the last relay?"
  - "What if packets could also travel backwards up to a relay's range?"
  - "How would you list every relay that can never receive the packet?"
common_errors:
  - "Always jumping the full range from each relay, which can skip the relay that leads onward."
  - "Not checking whether the current relay is reachable before using its range."
  - "Returning false for a single relay."
  - "Marking every relay in a huge range one by one, which is slow when ranges reach 10^5."
