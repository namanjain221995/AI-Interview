title: "Ticket Lockout Points"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, support_engineer, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Ticket Lockout Points

  A support engineer works through a queue of tickets **in order**. For each ticket `i` they either
  **resolve** it and earn `points[i]`, or **skip** it at no cost. Resolving ticket `i` takes long enough
  that the next `lockouts[i]` tickets in the queue (tickets `i + 1` through `i + lockouts[i]`) are
  reassigned to colleagues, so the engineer cannot resolve any of them. A lockout that reaches past the
  end of the queue simply ends it.

  Return the maximum total points the engineer can earn.

  ### Example 1
  ```
  Input:  points = [5, 3, 8, 2], lockouts = [1, 0, 2, 0]
  Output: 13
  Explanation: resolve ticket 0 (5 points, ticket 1 is reassigned), then ticket 2 (8 points, ticket 3 is reassigned)
  ```

  ### Example 2
  ```
  Input:  points = [2, 4, 6, 8, 10], lockouts = [0, 1, 2, 3, 4]
  Output: 16
  Explanation: resolve tickets 0, 1 and 4 for 2 + 4 + 10 = 16; resolving ticket 1 only locks out ticket 2
  ```

  ### Constraints
  - `0 <= points.length == lockouts.length <= 10^5`
  - `0 <= points[i] <= 10^9`
  - `0 <= lockouts[i] <= 10^5`
  - The answer can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_points_with_lockouts
  params:
    - {name: points, type: "int[]"}
    - {name: lockouts, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def max_points_with_lockouts(points: list[int], lockouts: list[int]) -> int:
        n = len(points)
        best = [0] * (n + 1)  # best[i] = max points from tickets i..n-1
        for i in range(n - 1, -1, -1):
            after = i + 1 + lockouts[i]
            take = points[i] + (best[after] if after < n else 0)
            best[i] = max(best[i + 1], take)
        return best[0]
  javascript: |
    function maxPointsWithLockouts(points, lockouts) {
      const n = points.length;
      const best = new Array(n + 1).fill(0);
      for (let i = n - 1; i >= 0; i--) {
        const after = i + 1 + lockouts[i];
        const take = points[i] + (after < n ? best[after] : 0);
        best[i] = Math.max(best[i + 1], take);
      }
      return best[0];
    }
