expected_concepts:
  - "suffix dynamic programming (best from ticket i to the end)"
  - "resolve-or-skip recurrence"
  - "jumping past the locked-out tickets"
  - "treating indices past the end as zero"
  - "64-bit totals"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Defines best-from-i, fills it backwards with the resolve-or-skip recurrence, handles lockouts running past the end, uses 64-bit totals and states O(n) time and space."
  good: "Correct memoised recursion or forward DP with a minor off-by-one fixed after testing."
  weak: "Greedily resolves the most valuable tickets, explores all subsets, or misindexes the lockout jump."
  criteria:
    correctness: "Passes all tests, including empty input, long lockouts and zero-point tickets."
    efficiency: "Linear time with one table instead of exponential search."
    code_quality: "The recurrence is expressed directly with a clearly named next-available index."
    edge_cases: "Handles lockouts past the end of the queue and totals beyond 32 bits."
    communication: "Explains why solving from the back makes each decision independent of earlier ones."
hints:
  - "Deciding about the first ticket is easier if you already know the best you can do starting from any later ticket."
  - "Define the best total obtainable from ticket i to the end. Resolving ticket i sends you to a specific later ticket that you can compute directly from its lockout."
  - "Fill that table from the last ticket backwards: the best from i is the larger of the best from i plus one (skip) and the points of ticket i plus the best from i plus lockouts of i plus one (resolve), treating any index at or past the end as zero. The answer is the best from ticket 0."
followups:
  - "How would you solve it with a forward pass instead of a backward one?"
  - "How would you report which tickets to resolve?"
  - "What if skipping a ticket carried a small penalty?"
common_errors:
  - "Greedily resolving the highest-value ticket first, ignoring its lockout."
  - "Indexing past the end of the table when a lockout runs off the queue."
  - "Resuming at i + lockouts[i] instead of i + lockouts[i] + 1."
  - "Using 32-bit integers for the total."
