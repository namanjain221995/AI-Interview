version: 1
slug: interleaved_stream_check
title: Interleaved Stream Check
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data, qa]
time_limit_minutes: 25
prompt_markdown: |
  ## Interleaved Stream Check

  Two producers write single-character event codes to a shared consumer. Producer A emitted the codes in
  `a` (in that order) and producer B emitted the codes in `b`. The consumer logged one combined sequence,
  `merged`. A QA check must confirm that no event was lost, duplicated or reordered **within** a producer.

  Return `true` if `merged` can be formed by taking **every** character of `a` and **every** character of
  `b` exactly once, keeping the relative order of `a`'s characters and the relative order of `b`'s
  characters (characters of the two streams may alternate in any way). Otherwise return `false`.

  The two streams may share characters, so the same code in `merged` could have come from either
  producer. Any of the three strings may be empty.

  ### Example 1
  ```
  Input:  a = "abc", b = "123", merged = "a1b2c3"
  Output: true
  Explanation: Take a, 1, b, 2, c, 3 alternately from the two streams.
  ```

  ### Example 2
  ```
  Input:  a = "abc", b = "123", merged = "a13b2c"
  Output: false
  Explanation: 3 appears before 2, but producer B emitted 2 first.
  ```

  ### Example 3
  ```
  Input:  a = "ca", b = "cb", merged = "cbca"
  Output: true
  Explanation: The first c must come from B (then b), and the remaining c, a come from A.
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 100`
  - `0 <= merged.length <= 200`
  - All strings contain lowercase letters and digits only.

  **Follow-up:** Can you use only `O(b.length)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_interleaving_of_streams
  params:
    - {name: a, type: "string"}
    - {name: b, type: "string"}
    - {name: merged, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_interleaving_of_streams(a: str, b: str, merged: str) -> bool:
        n, m = len(a), len(b)
        if n + m != len(merged):
            return False
        # ok[j]: can merged[:i + j] be formed from a[:i] and b[:j] (row i of the table)?
        ok = [False] * (m + 1)
        for i in range(n + 1):
            for j in range(m + 1):
                if i == 0 and j == 0:
                    ok[j] = True
                    continue
                from_a = i > 0 and ok[j] and a[i - 1] == merged[i + j - 1]
                from_b = j > 0 and ok[j - 1] and b[j - 1] == merged[i + j - 1]
                ok[j] = from_a or from_b
        return ok[m]
  javascript: |
    function isInterleavingOfStreams(a, b, merged) {
      const n = a.length;
      const m = b.length;
      if (n + m !== merged.length) return false;
      const ok = new Array(m + 1).fill(false);
      for (let i = 0; i <= n; i++) {
        for (let j = 0; j <= m; j++) {
          if (i === 0 && j === 0) {
            ok[j] = true;
            continue;
          }
          const fromA = i > 0 && ok[j] && a[i - 1] === merged[i + j - 1];
          const fromB = j > 0 && ok[j - 1] && b[j - 1] === merged[i + j - 1];
          ok[j] = fromA || fromB;
        }
      }
      return ok[m];
    }
tests:
  - {id: t1, args: ["abc", "123", "a1b2c3"], expected: true, description: "Example 1 - strict alternation"}
  - {id: t2, args: ["abc", "123", "a13b2c"], expected: false, description: "Example 2 - B's internal order is broken"}
  - {id: t3, args: ["ca", "cb", "cbca"], expected: true, description: "Example 3 - shared code; choosing the wrong producer for the first c fails"}
  - {id: t4, hidden: true, args: ["", "", ""], expected: true, description: "All three strings empty"}
  - {id: t5, hidden: true, args: ["", "xyz", "xyz"], expected: true, description: "One stream empty, merged equals the other"}
  - {id: t6, hidden: true, args: ["ab", "cd", "abc"], expected: false, description: "Length mismatch - an event was dropped"}
  - {id: t7, hidden: true, args: ["ab", "cd", "abcdd"], expected: false, description: "Length mismatch - an event was duplicated"}
  - {id: t8, hidden: true, args: ["aab", "aac", "aaacab"], expected: true, description: "Heavy character overlap where greedy choices go wrong"}
  - {id: t9, hidden: true, args: ["aab", "aac", "aacaba"], expected: false, description: "Right multiset of characters but no valid interleaving"}
  - {id: t10, hidden: true, args: ["babaaabaaaabbaaabaaaabaaaabbaabaaabaaaabbbbbbbaaaabbbbbaabab", "abbaabbbbbaabbaabbbbbabbaabaabaabbbaabbbabbbbbaaaaaaaababbaa", "baabbaabbbbbbaaaabaaaabbaaababaaaabbaaaaabbaaabbbbabbabaabbaaaabaabaaababbbbbbbaabbbaaabbaabbbbbbabbabaabaaaabaaabbabbaa"], expected: true, description: "Stress - two 60-char streams over a two-letter alphabet, valid interleaving"}
  - {id: t11, hidden: true, args: ["babaaabaaaabbaaabaaaabaaaabbaabaaabaaaabbbbbbbaaaabbbbbaabab", "abbaabbbbbaabbaabbbbbabbaabaabaabbbaabbbabbbbbaaaaaaaababbaa", "baabbaabbbbbbaaaabaaaabbaaababaaaabbaaaaabbaaabbbbabbabaabbaaaaababaaababbbbbbbaabbbaaabbaabbbbbbabbabaabaaaabaaabbabbaa"], expected: false, description: "Stress - same streams with one adjacent swap in merged"}
expected_concepts:
  - "length check before any work"
  - "state = how many characters consumed from each stream"
  - "two-dimensional reachability table or memoised recursion"
  - "why a greedy choice fails when the streams share characters"
  - "rolling one-row table for O(b.length) memory"
optimal_complexity: {time: "O(n * m)", space: "O(m)"}
rubric:
  excellent: "Explains why greedy fails on shared characters, defines the state as characters consumed from each stream, writes the recurrence, checks the total length first and reduces memory to one row with O(n * m) time."
  good: "Correct table or memoised recursion with O(n * m) time and memory after a hint about shared characters."
  weak: "Uses a greedy two-pointer merge, compares only character counts, or explores all choices without memoisation."
  criteria:
    correctness: "All tests pass, including empty streams, length mismatches and overlapping characters."
    efficiency: "Polynomial O(n * m) time; memory ideally one row of the table."
    code_quality: "Clear state naming; the index into merged is derived from the two counters."
    edge_cases: "Empty strings, one empty stream, length mismatches and long runs of identical characters."
    communication: "Shows a small counterexample to greedy before writing the table."
hints:
  - "If the next merged character matches the next unread character of both streams, you cannot know locally which producer sent it; you may need to explore both choices."
  - "Describe progress by how many characters you have consumed from each stream; the position in merged is then fixed by their sum, so the question becomes which pairs of counts are reachable."
  - "Build a boolean table over counts taken from a and from b. The empty prefix is reachable; a cell is reachable if the cell with one fewer from a is reachable and that character of a equals the matching merged character, or the same holds for b. Check the total length first, and keep only one row because each cell needs only its left and upper neighbours."
followups:
  - "Give a short example where always preferring stream A when both match produces the wrong answer."
  - "How would you return which producer each merged character came from, not just true or false?"
  - "How does the approach generalise to three or more producers, and what happens to the cost?"
  - "If the streams were very long but mostly had disjoint alphabets, how could you speed things up?"
common_errors:
  - "Greedy two-pointer merging that always takes from one stream when both match."
  - "Only comparing character counts, which ignores order within each stream."
  - "Forgetting the total length check, so dropped or duplicated events slip through."
  - "Off-by-one errors when indexing merged from the two counters."
  - "Unmemoised recursion that becomes exponential on long runs of a repeated character."
