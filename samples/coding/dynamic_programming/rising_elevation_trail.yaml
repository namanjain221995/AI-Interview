expected_concepts:
  - "strictly increasing steps make the cell graph acyclic"
  - "memoised depth-first search or processing cells from highest to lowest"
  - "longest path in a directed acyclic graph"
  - "strict comparison so plateaus are not crossed"
  - "O(rows * cols) time and avoiding deep recursion on long ascents"
optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: "Notices that strictly rising steps can never form a cycle, memoises the longest trail starting at each cell (memoised DFS or highest-first order), handles plateaus, mentions recursion depth on large grids and states O(rows * cols) time."
  good: "Writes a correct memoised search with some prompting and gives the right complexity, but does not discuss why no visited set is needed or the recursion-depth risk."
  weak: "Searches from every cell without memoisation, allows equal heights or diagonal moves, or keeps a visited set that blocks valid trails from other starting cells."
  criteria:
    correctness: "All tests pass, including plateaus, a flat grid, heights near 2^31 - 1 and the 900-cell ascent."
    efficiency: "Each cell's best trail is computed once; no exponential re-exploration of shared trails."
    code_quality: "Neighbour offsets defined once, clear bounds checks, memo table kept separate from the input grid."
    edge_cases: "Single cell, single row or column, completely flat grid and very large heights."
    communication: "Explains why the subproblems form a DAG and why the answer is the maximum over all starting cells."
hints:
  - "Because every step goes strictly uphill, a trail can never come back to a cell it already used. Think about what the longest trail starting from one particular cell depends on."
  - "The longest trail starting at a cell is one more than the longest trail starting at its best strictly higher neighbour. Many trails share cells, so store each cell's answer once it is known instead of recomputing it."
  - "Either run a depth-first search with a memo table holding the longest trail that starts at each cell, or visit cells from the highest elevation to the lowest so that every higher neighbour is already final; a cell's value is one plus the largest value among its strictly higher neighbours (or one if there are none), and the answer is the largest value over all cells."
followups:
  - "What would break if a step could also go onto a cell of equal height?"
  - "How would you return the cells of the longest trail, not just its length?"
  - "How do you avoid a stack overflow in a recursive solution on a 200 x 200 grid?"
  - "What changes if diagonal steps were allowed?"
common_errors:
  - "Allowing steps onto equal heights, which creates cycles and wrong answers on plateaus."
  - "Running an unmemoised search from every cell, which is exponential on long ascents."
  - "Sharing one visited set across different starting cells, which wrongly blocks valid trails."
  - "Hitting the recursion limit in Python on a long snake-shaped ascent."
