time_limit_minutes: 30
prompt_markdown: |
  ## Rising Elevation Trail

  A survey drone has mapped a hillside into a grid of elevation readings: `grid[r][c]` is the elevation of
  the cell in row `r` and column `c`. A trail designer wants the longest possible **rising trail**: a
  sequence of cells in which every step moves to an adjacent cell (up, down, left or right, never
  diagonally) whose elevation is **strictly higher** than the current cell.

  A trail may start at any cell, and a single cell on its own is a trail of length 1. Return the number
  of cells in the longest rising trail.

  ### Example 1
  ```
  Input:  grid = [[5, 1, 7], [6, 2, 8], [3, 4, 9]]
  Output: 4
  Explanation: 1 -> 2 -> 8 -> 9 is one of several rising trails with 4 cells
  ```

  ### Example 2
  ```
  Input:  grid = [[2, 9, 4], [7, 1, 3], [8, 6, 5]]
  Output: 5
  Explanation: 1 -> 3 -> 5 -> 6 -> 8
  ```

  ### Constraints
  - `1 <= grid.length <= 200` and `1 <= grid[r].length <= 200`; every row has the same length.
  - `0 <= grid[r][c] <= 2^31 - 1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_rising_trail
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_rising_trail(grid: list[list[int]]) -> int:
        if not grid or not grid[0]:
            return 0
        rows, cols = len(grid), len(grid[0])
        # Visit cells from highest to lowest: every strictly higher neighbour is
        # already final when a cell is processed.
        cells = sorted(
            ((grid[r][c], r, c) for r in range(rows) for c in range(cols)),
            reverse=True,
        )
        best = [[1] * cols for _ in range(rows)]
        answer = 0
        for value, r, c in cells:
            length = 1
            for nr, nc in ((r - 1, c), (r + 1, c), (r, c - 1), (r, c + 1)):
                if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] > value:
                    length = max(length, best[nr][nc] + 1)
            best[r][c] = length
            answer = max(answer, length)
        return answer
  javascript: |
    function longestRisingTrail(grid) {
      if (grid.length === 0 || grid[0].length === 0) return 0;
      const rows = grid.length;
      const cols = grid[0].length;
      const cells = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) cells.push([grid[r][c], r, c]);
      }
      // highest first, so every strictly higher neighbour is already final
      cells.sort((a, b) => b[0] - a[0]);
      const best = grid.map((row) => row.map(() => 1));
      const steps = [[-1, 0], [1, 0], [0, -1], [0, 1]];
      let answer = 0;
      for (const [value, r, c] of cells) {
        let length = 1;
        for (const [dr, dc] of steps) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] > value) {
            length = Math.max(length, best[nr][nc] + 1);
          }
        }
        best[r][c] = length;
        answer = Math.max(answer, length);
      }
      return answer;
    }
