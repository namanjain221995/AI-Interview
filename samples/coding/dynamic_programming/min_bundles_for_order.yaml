slug: min_bundles_for_order
title: "Minimum Bundles For Order"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, fullstack, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Bundles For Order

  A warehouse supplier only ships pre-packed bundles. `bundle_sizes` lists the bundle sizes on offer
  (units per bundle), and each size can be ordered any number of times. Each bundle carries a handling
  fee, so purchasing wants to cover an order of exactly `quantity` units with the **fewest bundles**.

  Return the minimum number of bundles whose sizes add up to **exactly** `quantity`.

  - Return `0` when `quantity` is `0`.
  - Return `-1` when no combination of bundles adds up to `quantity` exactly.
  - `bundle_sizes` may contain the same size more than once.

  ### Example 1
  ```
  Input:  bundle_sizes = [5, 12, 20], quantity = 36
  Output: 3
  Explanation: 12 + 12 + 12. Starting with the largest bundle (20) never reaches 36 exactly
  with fewer bundles.
  ```

  ### Example 2
  ```
  Input:  bundle_sizes = [4, 6], quantity = 7
  Output: -1
  Explanation: Every combination of 4 and 6 is even.
  ```

  ### Example 3
  ```
  Input:  bundle_sizes = [3], quantity = 0
  Output: 0
  ```

  ### Constraints
  - `1 <= bundle_sizes.length <= 50`
  - `1 <= bundle_sizes[i] <= 10^4`
  - `0 <= quantity <= 10^4`

  **Follow-up:** How would you return how many bundles of each size to order?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_bundles_for_order
  params:
    - {name: bundle_sizes, type: "int[]"}
    - {name: quantity, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_bundles_for_order(bundle_sizes: list[int], quantity: int) -> int:
        unreachable = quantity + 1  # more bundles than any real answer needs
        fewest = [0] + [unreachable] * quantity
        for amount in range(1, quantity + 1):
            for size in bundle_sizes:
                if size <= amount and fewest[amount - size] + 1 < fewest[amount]:
                    fewest[amount] = fewest[amount - size] + 1
        return fewest[quantity] if fewest[quantity] <= quantity else -1
  javascript: |
    function minBundlesForOrder(bundleSizes, quantity) {
      const unreachable = quantity + 1;
      const fewest = new Array(quantity + 1).fill(unreachable);
      fewest[0] = 0;
      for (let amount = 1; amount <= quantity; amount++) {
        for (const size of bundleSizes) {
          if (size <= amount && fewest[amount - size] + 1 < fewest[amount]) {
            fewest[amount] = fewest[amount - size] + 1;
          }
        }
      }
      return fewest[quantity] <= quantity ? fewest[quantity] : -1;
    }
tests:
  - {id: t1, args: [[5, 12, 20], 36], expected: 3, description: "Example 1 - largest-first greedy fails"}
  - {id: t2, args: [[4, 6], 7], expected: -1, description: "Example 2 - impossible quantity returns -1"}
  - {id: t3, args: [[3], 0], expected: 0, description: "Example 3 - zero quantity needs zero bundles"}
  - {id: t4, hidden: true, args: [[9, 4], 9], expected: 1, description: "One bundle matches the quantity exactly"}
  - {id: t5, hidden: true, args: [[50, 40], 30], expected: -1, description: "Every bundle is larger than the quantity"}
  - {id: t6, hidden: true, args: [[7, 3], 11], expected: -1, description: "Sizes coprime but 11 is still unreachable"}
  - {id: t7, hidden: true, args: [[6, 6, 4, 4], 20], expected: 4, description: "Duplicate sizes in the input"}
  - {id: t8, hidden: true, args: [[1, 333, 334], 1000], expected: 3, description: "Greedy on 334 gives 334+334+332 ones; optimum is 333+333+334"}
  - {id: t9, hidden: true, args: [[186, 419, 83, 408], 6249], expected: 20, description: "Larger mixed sizes needing many bundles"}
  - {id: t10, hidden: true, args: [[1], 10000], expected: 10000, description: "Maximum quantity with a single size of 1 (performance and the unreachable sentinel)"}
expected_concepts:
  - "unbounded knapsack / minimum coin change DP"
  - "why largest-first greedy fails"
  - "sentinel for unreachable amounts"
  - "bottom-up table over quantities"
optimal_complexity: {time: "O(quantity * k) where k is the number of bundle sizes", space: "O(quantity)"}
rubric:
  excellent: "Shows a counterexample to greedy, defines the fewest-bundles table over quantities 0..quantity with a clear unreachable sentinel, handles zero and impossible quantities, and states O(quantity * k) time with O(quantity) space; may mention BFS as an equivalent view."
  good: "Correct bottom-up or memoised DP with the right complexity, perhaps after fixing the sentinel or the -1 case in testing."
  weak: "Uses largest-first greedy, explores all combinations recursively without memoisation, or returns a large sentinel instead of -1."
  criteria:
    correctness: "All tests pass, including the greedy counterexamples and impossible quantities."
    efficiency: "Pseudo-polynomial DP in quantity times the number of sizes."
    code_quality: "Readable table with a named sentinel; no magic numbers that could overflow."
    edge_cases: "Quantity 0, sizes larger than the quantity, duplicate sizes and unreachable totals."
    communication: "Explains why greedy is unsafe and what each table entry means."
hints:
  - "Try always taking the biggest bundle that still fits on the first example. Does that give the best answer?"
  - "Solve smaller quantities first: the best way to reach a quantity ends with some bundle, and what is left before it is a smaller quantity you may already have solved."
  - "Keep the fewest bundles for every quantity from zero up to the target, starting with zero bundles for zero and an unreachable marker elsewhere. For each quantity, try every bundle size that fits and take one more than the best answer for the remaining amount. If the target is still unreachable at the end, return minus one."
followups:
  - "How would you report how many bundles of each size to buy?"
  - "What if each bundle size had a different handling fee and you wanted the cheapest order?"
  - "What if the supplier only had a limited stock of each bundle size?"
common_errors:
  - "Using largest-first greedy, which fails for sizes like 5, 12 and 20."
  - "Returning the sentinel value (or infinity) instead of -1 for impossible quantities."
  - "Using a sentinel such as the maximum integer and overflowing when adding one."
  - "Forgetting that quantity 0 needs zero bundles."
