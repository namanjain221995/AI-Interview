  - {id: t2, args: [[false, true, false, false, false, false, true], 3, 4], expected: 14, description: "Example 2 - switching off for a long gap is cheaper"}
  - {id: t3, args: [[false, false], 5, 5], expected: 0, description: "Example 3 - nothing required"}
  - {id: t4, hidden: true, args: [[], 7, 9], expected: 0, description: "Empty schedule"}
  - {id: t5, hidden: true, args: [[true], 1, 1000000000], expected: 1000000001, description: "Single required hour pays one startup plus one hour"}
  - {id: t6, hidden: true, args: [[true, false, false, true], 3, 6], expected: 18, description: "Tie - idling the 2-hour gap costs exactly one startup"}
  - {id: t7, hidden: true, args: [[false, true, false, true, false, true, false, false], 4, 0], expected: 12, description: "Free startups - only required hours are paid; trailing off hours cost nothing"}
