slug: fleet_power_schedule
title: Fleet Power Schedule
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, cloud, devops]
time_limit_minutes: 15
prompt_markdown: |
  ## Fleet Power Schedule

  A batch server is scheduled hour by hour. `required[i]` is `true` when a job needs the server during
  hour `i`. For every hour you choose whether the server is **on** or **off**:

  - An hour with the server on costs `run_cost`, whether or not a job needs it.
  - An hour with the server off is free, but the server **must** be on during every hour where
    `required[i]` is `true`.
  - The server is **off before hour 0**. Each time it goes from off (in the previous hour, or before
    hour 0) to on, you pay an extra `startup_cost` once.
  - Switching off is free, and the server may stay on or be off after the last hour at no extra cost.

  Return the **minimum total cost** of a schedule that covers every required hour. If no hour is
  required, the answer is `0`.

  ### Example 1
  ```
  Input:  required = [true, false, false, true, true, false, true], run_cost = 2, startup_cost = 5
  Output: 19
  Explanation: Start once (5) and keep the server on for all 7 hours (7 * 2 = 14). Switching off for
  the gaps would need extra startups of 5 each, which costs more than idling.
  ```

  ### Example 2
  ```
  Input:  required = [false, true, false, false, false, false, true], run_cost = 3, startup_cost = 4
  Output: 14
  Explanation: Start for hour 1 (4 + 3), switch off for hours 2-5, start again for hour 6 (4 + 3).
  Idling through the four-hour gap would cost 12 instead of 4.
  ```

  ### Example 3
  ```
  Input:  required = [false, false], run_cost = 5, startup_cost = 5
  Output: 0
  ```

  ### Constraints
  - `0 <= required.length <= 10^5`
  - `1 <= run_cost <= 10^9`
  - `0 <= startup_cost <= 10^9`
  - The answer can exceed the 32-bit integer range; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_fleet_power_cost
  params:
    - {name: required, type: "bool[]"}
    - {name: run_cost, type: int}
    - {name: startup_cost, type: int}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def min_fleet_power_cost(required: list[bool], run_cost: int, startup_cost: int) -> int:
        INF = float("inf")
        off, on = 0, INF  # cheapest cost so far ending with the server off / on
        for needed in required:
            new_on = min(on, off + startup_cost) + run_cost
            new_off = INF if needed else min(off, on)
            off, on = new_off, new_on
        return int(min(off, on))
  javascript: |
    function minFleetPowerCost(required, runCost, startupCost) {
      let off = 0;
      let on = Infinity;
      for (const needed of required) {
        const newOn = Math.min(on, off + startupCost) + runCost;
        const newOff = needed ? Infinity : Math.min(off, on);
        off = newOff;
        on = newOn;
      }
      return Math.min(off, on);
    }
