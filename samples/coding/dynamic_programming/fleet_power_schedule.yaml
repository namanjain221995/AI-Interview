expected_concepts:
  - "two states per hour: server on or server off"
  - "transition costs: startup only when going from off to on"
  - "required hours forbid the off state"
  - "O(n) time with O(1) memory by keeping only the previous hour"
  - "64-bit totals"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines the on/off states clearly, writes both transitions, forbids off on required hours, handles the empty and nothing-required cases, uses 64-bit totals and explains O(n) time and O(1) memory; may also note the equivalent gap-by-gap greedy rule."
  good: "Correct dynamic programming or gap greedy with minor slips fixed after a hint; complexity stated correctly."
  weak: "Always switches off between jobs or always idles, forgets the initial startup, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including empty input, ties and long gaps."
    efficiency: "Linear time with constant extra memory."
    code_quality: "State names that say what they mean (cost ending on or off), no special cases scattered through the loop."
    edge_cases: "Empty schedule, no required hours, zero startup cost and very large costs."
    communication: "Explains the trade-off between idling through a gap and paying another startup."
hints:
  - "At the end of each hour the server is in one of only two states. What is the cheapest way to have reached each of them?"
  - "Keep two running costs, the cheapest schedule so far that ends with the server on and the cheapest that ends with it off. Work out how each one is reached from the previous hour, remembering that a startup is paid only when coming from off."
  - "Start with cost zero for off and infinity for on. For each hour, the new on cost is the cheaper of staying on or starting from off (adding the startup cost), plus the run cost. The new off cost is the cheaper of the two previous costs, but it becomes infinity when the hour is required. The answer is the smaller of the two at the end, kept in a 64-bit integer."
followups:
  - "Show that the answer can also be computed gap by gap: idle through a gap when its length times run_cost is at most startup_cost. Why is that equivalent?"
  - "How would you also return the hours during which the server should be on?"
  - "What changes if the server has a minimum on time of k hours after each startup?"
  - "How would the solution change for a fleet of servers with a required count per hour?"
common_errors:
  - "Forgetting that the server starts off, so the first required hour also pays a startup."
  - "Allowing the off state during required hours."
  - "Summing costs in a 32-bit integer."
  - "Charging a startup for every required hour instead of only off-to-on transitions."
