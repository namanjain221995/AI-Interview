version: 1
slug: three_tier_rack_labels
title: Three-Tier Rack Labels
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, devops, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Three-Tier Rack Labels

  A data-centre row holds `n` racks side by side. Each rack must get a label for one of three service
  tiers, numbered `0`, `1` and `2`. To make mistakes easy to spot during maintenance, **two neighbouring
  racks may never carry the same tier label**.

  Relabelling is not free: `costs[i][t]` is the cost of giving rack `i` the label for tier `t` (it
  depends on how much cabling and configuration that rack would need to change).

  Return the **minimum total cost** of labelling every rack so that no two adjacent racks share a tier.
  If the row is empty, return `0`.

  ### Example 1
  ```
  Input:  costs = [[4, 9, 2], [6, 3, 8], [5, 7, 1]]
  Output: 6
  Explanation: Tiers 2, 1, 2 cost 2 + 3 + 1 = 6. Racks 0 and 2 are not neighbours, so they may share a tier.
  ```

  ### Example 2
  ```
  Input:  costs = [[1, 5, 3], [2, 9, 4]]
  Output: 5
  Explanation: The cheapest tier for both racks is 0, which is not allowed. Tiers 0, 2 (1 + 4) and
  tiers 2, 0 (3 + 2) both cost 5.
  ```

  ### Constraints
  - `0 <= costs.length <= 10^4`
  - `costs[i].length == 3`
  - `0 <= costs[i][t] <= 1000`

  **Follow-up:** can you solve it in `O(n)` time with `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_rack_label_cost
  params:
    - {name: costs, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_rack_label_cost(costs: list[list[int]]) -> int:
        # t0, t1, t2: cheapest labelling of the racks so far ending with that tier.
        t0 = t1 = t2 = 0
        for c0, c1, c2 in costs:
            t0, t1, t2 = c0 + min(t1, t2), c1 + min(t0, t2), c2 + min(t0, t1)
        return min(t0, t1, t2)
  javascript: |
    function minRackLabelCost(costs) {
      let t0 = 0;
      let t1 = 0;
      let t2 = 0;
      for (const [c0, c1, c2] of costs) {
        const n0 = c0 + Math.min(t1, t2);
        const n1 = c1 + Math.min(t0, t2);
        const n2 = c2 + Math.min(t0, t1);
        t0 = n0;
        t1 = n1;
        t2 = n2;
      }
      return Math.min(t0, t1, t2);
    }
