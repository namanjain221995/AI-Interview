expected_concepts:
  - "state: cheapest labelling of the first i racks ending with each tier"
  - "transition takes the minimum over the two other tiers of the previous rack"
  - "constant memory by keeping only three running values"
  - "why choosing the cheapest tier per rack greedily fails"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines the three per-tier states, writes the transition excluding the same tier, keeps three running values, handles an empty row, gives a counterexample to greedy and states O(n) time and O(1) memory."
  good: "Correct dynamic programming with an n by 3 table or with a minor slip fixed after a hint."
  weak: "Greedy per rack, brute force over all 3^n labellings, or allows equal tiers on neighbours."
  criteria:
    correctness: "All tests pass, including empty and single-rack rows."
    efficiency: "Linear time with constant extra memory."
    code_quality: "Simultaneous update of the three states so a new value is not read too early."
    edge_cases: "Empty row, one rack, ties and all-equal costs."
    communication: "Explains why only the previous rack's tier matters."
hints:
  - "The constraint only links a rack to its immediate neighbour. What do you need to remember about the racks you have already labelled?"
  - "For each rack and each tier, consider the cheapest way to label all racks up to this one so that this rack gets that tier. How does it depend on the same values for the previous rack?"
  - "Keep three running totals, one per tier, for the racks processed so far. For the next rack, the new total for a tier is its cost for that tier plus the smaller of the previous totals for the other two tiers; compute all three new totals from the old ones before replacing them. The answer is the smallest of the three totals, or zero for an empty row."
followups:
  - "How would you recover which tier each rack received?"
  - "Generalise to k tiers. Can you avoid an O(n * k^2) solution?"
  - "What if racks i and i + 2 must also differ?"
common_errors:
  - "Choosing the cheapest tier for each rack greedily."
  - "Updating one running total and then reading the new value when computing the next one."
  - "Failing on an empty row by indexing the first rack."
  - "Forbidding equal tiers on non-adjacent racks as well."
