title: Site Inspection Tour
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, network, sre]
time_limit_minutes: 35
prompt_markdown: |
  ## Site Inspection Tour

  A field engineer starts at the depot (site `0`) and must inspect every remote site of a small network
  rollout before returning to the depot. `dist[i][j]` is the travel time for the direct leg from site
  `i` to site `j`. Times can be **asymmetric** (one-way roads, ferries, traffic patterns), so
  `dist[i][j]` and `dist[j][i]` may differ, and they do not have to obey the triangle inequality.

  A tour starts at site `0`, visits every other site **exactly once** using direct legs, and ends with
  a leg back to site `0`. Return the **minimum total travel time** of such a tour. With a single site
  (only the depot) the answer is `0`.

  ### Example 1
  ```
  Input:  dist = [[0, 3, 9, 7],
                  [8, 0, 2, 9],
                  [4, 9, 0, 5],
                  [1, 6, 8, 0]]
  Output: 11
  Explanation: 0 -> 1 -> 2 -> 3 -> 0 costs 3 + 2 + 5 + 1 = 11. The same loop in the
  opposite direction, 0 -> 3 -> 2 -> 1 -> 0, costs 7 + 8 + 9 + 8 = 32.
  ```

  ### Example 2
  ```
  Input:  dist = [[0, 5],
                  [9, 0]]
  Output: 14
  ```

  ### Example 3
  ```
  Input:  dist = [[0, 4, 1],
                  [2, 0, 6],
                  [7, 3, 0]]
  Output: 6
  Explanation: 0 -> 2 -> 1 -> 0 costs 1 + 3 + 2 = 6, while 0 -> 1 -> 2 -> 0 costs 17.
  ```

  ### Constraints
  - `1 <= n <= 12` where `n = dist.length`, and `dist` is `n x n`
  - `dist[i][i] = 0`
  - `0 <= dist[i][j] <= 10^5`

  **Follow-up:** Trying all `(n - 1)!` orders works for tiny inputs. Can you share work between orders
  that have visited the same set of sites?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_tour_cost
  params:
    - {name: dist, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_tour_cost(dist: list[list[int]]) -> int:
        n = len(dist)
        if n == 1:
            return 0
        full = 1 << n
        inf = float("inf")
        cost = [[inf] * n for _ in range(full)]
        cost[1][0] = 0
        for mask in range(1, full):
            if not mask & 1:
                continue
            for last in range(n):
                here = cost[mask][last]
                if here == inf:
                    continue
                for nxt in range(n):
                    if mask & (1 << nxt):
                        continue
                    nmask = mask | (1 << nxt)
                    value = here + dist[last][nxt]
                    if value < cost[nmask][nxt]:
                        cost[nmask][nxt] = value
        return int(min(cost[full - 1][last] + dist[last][0] for last in range(1, n)))
  javascript: |
    function minTourCost(dist) {
      const n = dist.length;
      if (n === 1) return 0;
      const full = 1 << n;
      const cost = Array.from({ length: full }, () => new Array(n).fill(Infinity));
      cost[1][0] = 0;
      for (let mask = 1; mask < full; mask += 2) {
        for (let last = 0; last < n; last++) {
          const here = cost[mask][last];
          if (here === Infinity) continue;
          for (let next = 0; next < n; next++) {
            if (mask & (1 << next)) continue;
            const nmask = mask | (1 << next);
            const value = here + dist[last][next];
            if (value < cost[nmask][next]) cost[nmask][next] = value;
          }
        }
      }
      let best = Infinity;
      for (let last = 1; last < n; last++) best = Math.min(best, cost[full - 1][last] + dist[last][0]);
      return best;
    }
