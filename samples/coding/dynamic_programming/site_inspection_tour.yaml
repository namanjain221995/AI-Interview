expected_concepts:
  - "bitmask DP over (set of visited sites, current site)"
  - "only the visited set and the last site matter for the remaining cost"
  - "closing the tour with the leg back to site 0"
  - "O(2^n * n^2) versus O(n!) brute force"
  - "handling asymmetric costs and the single-site base case"
optimal_complexity: {time: "O(2^n * n^2)", space: "O(2^n * n)"}
rubric:
  excellent: "Defines the state as (visited mask, last site) with site 0 always in the mask, fills it in increasing mask order, closes the tour with dist[last][0], handles n = 1 and asymmetry, and explains why the state captures everything the future depends on."
  good: "Correct bitmask DP (iterative or memoised) with minor issues in the base case or extra constant factors."
  weak: "Enumerates permutations, uses a greedy nearest-site heuristic, or assumes the matrix is symmetric."
  criteria:
    correctness: "All tests pass, including one or two sites, zero-cost legs and asymmetric matrices."
    efficiency: "O(2^n * n^2) time; n = 12 runs comfortably."
    code_quality: "Bit operations are readable (named masks, clear loop bounds) and the infinity sentinel is safe."
    edge_cases: "n = 1, n = 2, all-equal costs and matrices that break the triangle inequality."
    communication: "Explains why the order of the earlier visits no longer matters once the set and last site are fixed."
hints:
  - "Trying every order of the sites repeats a lot of work. After visiting some sites, what information about the partial route actually affects the best way to finish it?"
  - "Only the set of sites already visited and the site you are standing at matter. Represent the set as a bitmask and compute the cheapest way to start at site 0, visit exactly that set and end at a given site."
  - "Create a table indexed by mask and last site, filled with a large value except the mask containing only site 0 ending at site 0, which costs zero. Process masks in increasing order; from every reachable state extend to each unvisited site by adding the leg time and keep the minimum. The answer is the smallest full-mask entry plus the leg from that last site back to site 0, or zero when there is only one site."
followups:
  - "How would you reconstruct the actual order of visits?"
  - "What changes if the engineer may end at any site instead of returning to the depot?"
  - "How would you handle 40 sites where exact DP is no longer feasible?"
  - "How would you add time windows during which each site can be inspected?"
common_errors:
  - "Forgetting the return leg to site 0."
  - "Assuming dist is symmetric and only filling half the transitions."
  - "Not handling n = 1, which has no last site other than the depot."
  - "Letting states that never include site 0 seed the table, producing tours that do not start at the depot."
