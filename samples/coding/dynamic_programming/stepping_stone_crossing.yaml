    code_quality: "State representation and the three candidate hops are expressed clearly."
    edge_cases: "Handles two pads, large coordinates and hop lengths that would drop to zero."
    communication: "Explains why the arriving hop length must be part of the state."
hints:
  - "Knowing which pad the rover is on is not enough to decide where it can go next; think about what else limits the next hop."
  - "Describe a state as the current pad together with the length of the hop that brought the rover there, and push reachable states forward from pad to pad."
  - "Keep a set of arriving hop lengths for each pad, starting with a zero-length arrival on the first pad. Visit pads in order; for each arriving length, try the three hop lengths around it that are positive, look up the landing position in a map from position to index, and add that hop length to the landing pad's set. The answer is whether the last pad's set ends up non-empty."
followups:
  - "Why can the arriving hop length at pad i never exceed i, and how does that bound the work?"
  - "How would you return the sequence of hops the rover should make?"
  - "What changes if the rover may also hop backwards?"
common_errors:
  - "Tracking only the pad and not the arriving hop length, which merges different states."
  - "Allowing a hop of length zero after a one-unit hop."
  - "Plain recursion without memoisation, which takes exponential time."
  - "Forgetting that the first hop must be exactly one unit."
