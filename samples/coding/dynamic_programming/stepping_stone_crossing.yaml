title: "Stepping Stone Crossing"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, mobile]
time_limit_minutes: 25
prompt_markdown: |
  ## Stepping Stone Crossing

  A survey rover must cross a field of charging pads laid out along a straight track. `positions` lists
  the pad positions in **strictly increasing** order, and the rover starts on the first pad, which is
  always at position `0`.

  The rover only moves forward by hops and may only land on pads. Its first hop is exactly `1` unit
  long. After a hop of `k` units, the next hop must be `k - 1`, `k` or `k + 1` units long, and every
  hop must be at least `1` unit.

  Return `true` if the rover can land on the **last** pad, otherwise `false`.

  ### Example 1
  ```
  Input:  positions = [0, 1, 2, 4, 7, 11, 16]
  Output: true
  Explanation: hops of 1, 1, 2, 3, 4 and 5 units
  ```

  ### Example 2
  ```
  Input:  positions = [0, 1, 3, 4, 9]
  Output: false
  Explanation: the rover can reach 1, 3 and 4, but from 4 it can hop at most 2 units, so 9 is out of reach
  ```

  ### Example 3
  ```
  Input:  positions = [0, 2, 3]
  Output: false
  Explanation: the first hop is 1 unit and there is no pad at position 1
  ```

  ### Constraints
  - `2 <= positions.length <= 2000`
  - `positions[0] == 0`
  - `0 <= positions[i] <= 2^31 - 1`, strictly increasing
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: can_hop_across
  params:
    - {name: positions, type: "int[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def can_hop_across(positions: list[int]) -> bool:
        index_of = {p: i for i, p in enumerate(positions)}
        hops: list[set[int]] = [set() for _ in positions]
        hops[0].add(0)
        for i, pos in enumerate(positions):
            for last in hops[i]:
                for step in (last - 1, last, last + 1):
                    if step > 0:
                        j = index_of.get(pos + step)
                        if j is not None:
                            hops[j].add(step)
        return bool(hops[-1])
  javascript: |
    function canHopAcross(positions) {
      const indexOf = new Map();
      positions.forEach((p, i) => indexOf.set(p, i));
      const hops = positions.map(() => new Set());
      hops[0].add(0);
      for (let i = 0; i < positions.length; i++) {
        for (const last of hops[i]) {
          for (const step of [last - 1, last, last + 1]) {
            if (step <= 0) continue;
            const j = indexOf.get(positions[i] + step);
            if (j !== undefined) hops[j].add(step);
          }
        }
      }
      return hops[positions.length - 1].size > 0;
    }
