slug: end_pick_margin_game
title: "End Pick Margin Game"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_scientist]
time_limit_minutes: 25
prompt_markdown: |
  ## End Pick Margin Game

  During quarterly planning two teams, **A** and **B**, split a prioritised row of budget items. `values[i]`
  is the net value of item `i`; a negative value is a liability (for example a mandatory migration) that
  still has to be taken by someone.

  The teams alternate turns and **team A moves first**. On each turn the current team must take
  **exactly one** item from either the **left end** or the **right end** of the remaining row. Play ends
  when the row is empty.

  Both teams play optimally: each one always maximises its own final total minus the other team's final
  total. Return **team A's total minus team B's total**. The result may be zero or negative.

  ### Example 1
  ```
  Input:  values = [4, 9, 2]
  Output: -3
  Explanation: If A takes 4, B takes 9 and A gets 2: 6 - 9 = -3. If A takes 2, B takes 9 and A gets 4: again -3.
  ```

  ### Example 2
  ```
  Input:  values = [6, 1, 2, 7]
  Output: 2
  Explanation: A takes 7, B's best reply is 6, then A takes 2 and B takes 1: 9 - 7 = 2. Opening with 6 instead lets B take 7 and the margin drops to 0.
  ```

  ### Constraints
  - `1 <= values.length <= 1000`
  - `-10^9 <= values[i] <= 10^9`

  **Follow-up:** can you solve it with O(n) extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: optimal_end_pick_margin
  params:
    - {name: values, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def optimal_end_pick_margin(values: list[int]) -> int:
        n = len(values)
        # margin[i] holds, for the current window length, the best (mover - opponent) score on values[i:i + length]
        margin = values[:]
        for length in range(2, n + 1):
            for i in range(n - length + 1):
                j = i + length - 1
                take_left = values[i] - margin[i + 1]
                take_right = values[j] - margin[i]
                margin[i] = max(take_left, take_right)
        return margin[0]
  javascript: |
    function optimalEndPickMargin(values) {
      const n = values.length;
      const margin = values.slice();
      for (let length = 2; length <= n; length++) {
        for (let i = 0; i + length - 1 < n; i++) {
          const j = i + length - 1;
          const takeLeft = values[i] - margin[i + 1];
          const takeRight = values[j] - margin[i];
          margin[i] = Math.max(takeLeft, takeRight);
        }
      }
      return margin[0];
    }
