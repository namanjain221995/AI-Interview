expected_concepts:
  - "zero-sum game: score each position as mover's total minus opponent's total"
  - "interval dynamic programming over the remaining window [i, j]"
  - "recurrence: take an end and subtract the opponent's best margin on the rest"
  - "greedy taking of the larger end is not optimal"
  - "O(n^2) time with an O(n) rolling array, 64-bit margins"
optimal_complexity: {time: "O(n^2)", space: "O(n)"}
rubric:
  excellent: "Defines the best margin for the player to move on each window, derives max(left value minus the inner margin, right value minus the inner margin), fills windows by increasing length (or memoises), compresses to O(n) memory, shows the greedy counterexample and handles negatives and 64-bit values."
  good: "Correct interval dynamic programming or memoised minimax in O(n^2) time and space with minor prompting."
  weak: "Takes the larger end greedily, simulates both teams with separate totals without optimal play, or explores the full game tree exponentially."
  criteria:
    correctness: "All tests pass, including liabilities, single items and the greedy trap."
    efficiency: "Quadratic time; memory O(n^2) acceptable, O(n) preferred."
    code_quality: "Clear window bounds and a single recurrence used for both teams."
    edge_cases: "One item, all negative values, zeros and margins beyond 32 bits."
    communication: "Explains why the margin formulation lets one recurrence describe both teams."
hints:
  - "Instead of tracking both teams' totals, track a single number: how far ahead the team about to move can finish on the remaining row."
  - "The remaining row is always a contiguous window of the original row. If the team to move takes the left end, the opponent then moves on the window that remains, so the mover's margin is that value minus the opponent's best margin there; the same holds for the right end."
  - "Fill a table of best margins for every window, starting with windows of length one (the margin is the single value) and growing the length. For each window take the larger of the left value minus the margin of the window without it and the right value minus the margin of the window without it. The answer is the margin of the full row; keeping only one row of the table indexed by the window start is enough."
followups:
  - "How would you return team A's own total instead of the margin?"
  - "For an even number of items with positive values, can team A always avoid losing? Why?"
  - "How would you reconstruct the sequence of optimal moves?"
  - "What changes if a team may take up to two items from the same end on its turn?"
common_errors:
  - "Always taking the larger of the two ends."
  - "Alternating maximise and minimise steps on separate totals but mixing up whose turn it is."
  - "Recursing without memoisation, which is exponential in the row length."
  - "Overflowing 32-bit integers with values up to 10^9."
