title: Steady Trend Windows
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, data, data_analyst, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Steady Trend Windows

  A monitoring job receives a series of metric `values` in time order. A **steady trend window** is a
  contiguous run of **at least 3** readings in which every consecutive difference is the same (the metric
  changes by a constant amount per step; a flat run with difference 0 counts too).

  Return the number of steady trend windows in the series. Windows that overlap or contain each other are
  counted separately. Return `0` if there are none.

  ### Example 1
  ```
  Input:  values = [3, 5, 7, 9]
  Output: 3
  Explanation: [3, 5, 7], [5, 7, 9] and [3, 5, 7, 9].
  ```

  ### Example 2
  ```
  Input:  values = [4, 4, 4, 1]
  Output: 1
  Explanation: only [4, 4, 4]; the difference then changes from 0 to -3.
  ```

  ### Example 3
  ```
  Input:  values = [10, 7]
  Output: 0
  ```

  ### Constraints
  - `0 <= values.length <= 5000`
  - `-10^6 <= values[i] <= 10^6`

  **Follow-up:** can you count them in one pass with O(1) extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_steady_trend_windows
  params:
    - {name: values, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_steady_trend_windows(values: list[int]) -> int:
        total = 0
        ending_here = 0  # steady windows that end at the current index
        for i in range(2, len(values)):
            if values[i] - values[i - 1] == values[i - 1] - values[i - 2]:
                ending_here += 1
                total += ending_here
            else:
                ending_here = 0
        return total
  javascript: |
    function countSteadyTrendWindows(values) {
      let total = 0;
      let endingHere = 0;
      for (let i = 2; i < values.length; i++) {
        if (values[i] - values[i - 1] === values[i - 1] - values[i - 2]) {
          endingHere += 1;
          total += endingHere;
        } else {
          endingHere = 0;
        }
      }
      return total;
    }
