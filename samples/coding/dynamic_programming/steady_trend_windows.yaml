expected_concepts:
  - "count of steady windows ending at each index"
  - "extending a steady window by one reading adds exactly one more window ending there"
  - "reset when the difference changes"
  - "one pass with O(1) memory"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Defines the windows-ending-here count, explains the increment and the reset, runs in one pass with O(1) memory and handles short inputs cleanly."
  good: "Correct solution via run lengths (adding (L - 1)(L - 2) / 2 per maximal run) or a DP array, with the right complexity."
  weak: "Checks every window in O(n^2) or O(n^3), misses overlapping windows, or counts windows of length 2."
  criteria:
    correctness: "All tests pass, including flat runs and runs that share an endpoint."
    efficiency: "Single linear pass."
    code_quality: "Readable names for the running count and the total; no fragile special cases."
    edge_cases: "Empty, one and two readings; runs that end at the last index."
    communication: "Explains why the number of windows ending at an index grows by exactly one while the trend continues."
hints:
  - "If a steady window ends at some index and the next reading keeps the same difference, the window extended by that reading is steady too."
  - "Count, for each end position, how many steady windows end exactly there; that number grows by one while the trend continues and drops to zero when the difference changes."
  - "Walk from the third reading onwards keeping the number of steady windows that end at the previous index; if the latest difference matches the one before it, make that number one larger, otherwise reset it to zero, and add it to the running total after each step."
followups:
  - "How would you return the longest steady window instead of the count?"
  - "What if a window counted as steady when the differences vary by at most a tolerance?"
  - "How would you count steady subsequences that are not contiguous?"
  - "How would you maintain the count as readings stream in?"
common_errors:
  - "Counting windows of length 2."
  - "Counting only maximal runs instead of every sub-window."
  - "Forgetting to reset the running count when the difference changes."
  - "Indexing out of bounds on series shorter than three readings."
