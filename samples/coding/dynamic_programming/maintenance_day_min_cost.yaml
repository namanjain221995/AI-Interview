slug: maintenance_day_min_cost
title: Maintenance Day Minimum Cost
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, sre, devops, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Maintenance Day Minimum Cost

  An operations team is planning fleet maintenance for the next `n` days. Running maintenance on day `i`
  costs `costs[i]` (overtime, spare capacity and so on). Reliability policy says the fleet may never go
  **two consecutive days without maintenance**: for every pair of adjacent days `i` and `i + 1`, at least
  one of the two must be a maintenance day. Maintenance may also run on consecutive days if that is
  cheaper overall.

  Return the **minimum total cost** of a plan that satisfies the policy.

  - With a single day there is no adjacent pair, so no maintenance is required and the answer is `0`.

  ### Example 1
  ```
  Input:  costs = [5, 1, 4, 2]
  Output: 3
  Explanation: Maintain on days 1 and 3. Day 1 covers the pairs (0, 1) and (1, 2); day 3 covers (2, 3).
  ```

  ### Example 2
  ```
  Input:  costs = [3, 8, 2, 9, 1]
  Output: 6
  Explanation: Maintain on days 0, 2 and 4 for 3 + 2 + 1.
  ```

  ### Example 3
  ```
  Input:  costs = [7]
  Output: 0
  ```

  ### Constraints
  - `1 <= costs.length <= 10^5`
  - `0 <= costs[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_patch_cost
  params:
    - {name: costs, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_patch_cost(costs: list[int]) -> int:
        # chosen: best cost so far with today maintained; skipped: best with today skipped
        chosen, skipped = costs[0], 0
        for cost in costs[1:]:
            chosen, skipped = cost + min(chosen, skipped), chosen
        return min(chosen, skipped)
  javascript: |
    function minPatchCost(costs) {
      let chosen = costs[0];
      let skipped = 0;
      for (let i = 1; i < costs.length; i++) {
        const nextChosen = costs[i] + Math.min(chosen, skipped);
        skipped = chosen;
        chosen = nextChosen;
      }
      return Math.min(chosen, skipped);
    }
