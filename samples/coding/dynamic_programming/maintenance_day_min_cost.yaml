expected_concepts:
  - "restating the policy as no two consecutive skipped days"
  - "two-state dynamic programming (day maintained or skipped)"
  - "rolling variables for O(1) memory"
  - "why greedy selection of cheap days fails"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Restates the policy as forbidding two skipped days in a row, defines the maintained/skipped states, derives both transitions, handles the single-day case naturally and explains O(n) time with O(1) memory."
  good: "Correct DP with an O(n) table or a single state array; may need a prompt on the single-day case or on why greedy fails."
  weak: "Greedy pick of cheap days, exhaustive subset search, or a recurrence that allows two skipped days in a row."
  criteria:
    correctness: "All tests pass, including one day, two days and plans that need consecutive maintenance days."
    efficiency: "Single linear pass; no subset enumeration."
    code_quality: "States named for their meaning; simultaneous update avoids reading an already-updated value."
    edge_cases: "Single day, zero costs, equal costs, cheapest day at either end."
    communication: "Explains the two states and why skipping requires the previous day to be maintained."
hints:
  - "Rephrase the policy: what pattern of two consecutive days is never allowed in a valid plan?"
  - "Walk the days in order and track two best costs so far: one where the current day is maintained and one where it is skipped. A skipped day is only allowed if the previous day was maintained."
  - "Start with the first day maintained at its own cost and skipped at zero. For each later day, maintaining it costs its price plus the smaller of the previous two values, while skipping it costs exactly the previous maintained value. Update both at once and return the smaller value after the last day."
followups:
  - "What if the policy allowed at most two consecutive days without maintenance?"
  - "How would you return the chosen days, not only the cost?"
  - "If the days formed a cycle (the last day is adjacent to the first), how would you adapt the solution?"
common_errors:
  - "Greedily choosing the cheapest days, which can leave an adjacent pair uncovered or overpay."
  - "Requiring maintenance on day 0 or on the last day instead of letting the DP decide."
  - "Updating the two states sequentially so the skipped state reads the new maintained value."
  - "Returning costs[0] instead of 0 for a single day."
