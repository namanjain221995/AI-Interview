version: 1
slug: capped_remote_day_schedules
title: Capped Remote Day Schedules
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Capped Remote Day Schedules

  A team plans its next `n` working days. Each day is marked either **office** or **remote**. To keep
  in-person collaboration regular, team policy forbids more than `max_run` remote days **in a row**.
  Two schedules are different when they differ on at least one day.

  Return the number of distinct `n`-day schedules that follow the policy, **modulo `1_000_000_007`**.

  - If `max_run = 0`, only the all-office schedule is allowed.
  - If `max_run >= n`, every one of the `2^n` schedules is allowed.

  ### Example 1
  ```
  Input:  n = 3, max_run = 1
  Output: 5
  Explanation: Writing O for office and R for remote: OOO, OOR, ORO, ROO and ROR.
  ```

  ### Example 2
  ```
  Input:  n = 4, max_run = 2
  Output: 13
  Explanation: Of the 16 schedules, only RRRR, RRRO and ORRR have more than two remote days in a row.
  ```

  ### Example 3
  ```
  Input:  n = 2, max_run = 0
  Output: 1
  ```

  ### Constraints
  - `1 <= n <= 1000`
  - `0 <= max_run <= n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_schedules_with_run_cap
  params:
    - {name: n, type: int}
    - {name: max_run, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_schedules_with_run_cap(n: int, max_run: int) -> int:
        mod = 1_000_000_007
        # ending[k]: valid schedules so far whose trailing remote streak has length k
        ending = [0] * (max_run + 1)
        ending[0] = 1
        for _ in range(n):
            total = sum(ending) % mod
            # an office day resets the streak; a remote day extends every streak below the cap
            ending = [total] + ending[:-1]
        return sum(ending) % mod
  javascript: |
    function countSchedulesWithRunCap(n, maxRun) {
      const MOD = 1000000007;
      let ending = new Array(maxRun + 1).fill(0);
      ending[0] = 1;
      for (let day = 0; day < n; day++) {
        let total = 0;
        for (const count of ending) total = (total + count) % MOD;
        const next = new Array(maxRun + 1).fill(0);
        next[0] = total;
        for (let k = 1; k <= maxRun; k++) next[k] = ending[k - 1];
        ending = next;
      }
      let answer = 0;
      for (const count of ending) answer = (answer + count) % MOD;
      return answer;
    }
tests:
  - {id: t1, args: [3, 1], expected: 5, description: "Example 1"}
  - {id: t2, args: [4, 2], expected: 13, description: "Example 2"}
  - {id: t3, args: [2, 0], expected: 1, description: "Example 3 - no remote days allowed"}
  - {id: t4, hidden: true, args: [1, 0], expected: 1, description: "Minimum n with cap zero"}
  - {id: t5, hidden: true, args: [1, 1], expected: 2, description: "Minimum n with the cap equal to n"}
  - {id: t6, hidden: true, args: [10, 10], expected: 1024, description: "Cap equals n so every schedule is allowed"}
  - {id: t7, hidden: true, args: [6, 5], expected: 63, description: "Only the all-remote schedule is excluded"}
  - {id: t8, hidden: true, args: [20, 3], expected: 547337, description: "Medium n with a small cap"}
  - {id: t9, hidden: true, args: [1000, 1], expected: 625271546, description: "Largest n with cap one; requires modulo"}
  - {id: t10, hidden: true, args: [1000, 1000], expected: 688423210, description: "Largest n with no effective cap: 2^1000 modulo the prime"}
expected_concepts:
  - "state = length of the trailing remote streak"
  - "office day resets the streak, remote day extends it"
  - "counting with dynamic programming instead of enumerating 2^n schedules"
  - "modular arithmetic"
  - "optional sliding-window sum for O(n) time"
optimal_complexity: {time: "O(n) with a sliding window sum (O(n * max_run) with the streak table)", space: "O(max_run)"}
rubric:
  excellent: "Identifies the trailing remote streak as the state, derives the reset and extend transitions, applies the modulo throughout, handles max_run = 0 and max_run = n, and can explain the sliding-window improvement to O(n)."
  good: "Correct streak-table DP in O(n * max_run) with the modulo; may need a prompt on the cap-zero case."
  weak: "Enumerates all 2^n schedules, forgets the modulo, or allows a streak of max_run + 1."
  criteria:
    correctness: "All tests pass, including cap zero, cap equal to n and large n."
    efficiency: "Polynomial time; O(n * max_run) is acceptable and O(n) is ideal."
    code_quality: "Clear state names; the shift of streak counts is easy to follow."
    edge_cases: "max_run = 0, max_run = n, n = 1."
    communication: "Explains the state and why an office day collects every previous count."
hints:
  - "Look at how a valid schedule ends: how many remote days can follow its last office day?"
  - "Count schedules by the length of their trailing remote streak. Adding an office day resets the streak to zero, and adding a remote day lengthens it by one as long as it stays within the cap."
  - "Keep a count for every trailing streak length from zero up to the cap, starting with one empty schedule at length zero. For each day, the new length-zero count is the sum of all counts, each longer length takes the old count of the length just below it, and the count at the cap is dropped. Reduce modulo the prime and return the sum of the counts after n days."
followups:
  - "How can you make each day O(1) using a running window sum?"
  - "What if the policy also capped consecutive office days?"
  - "How would you count schedules with exactly k remote days that still respect the cap?"
common_errors:
  - "Allowing a streak of length max_run + 1 because of an off-by-one in the cap."
  - "Enumerating all 2^n schedules, which is infeasible for n = 1000."
  - "Forgetting the modulo, overflowing typed integers."
  - "Returning 0 instead of 1 when max_run is 0."
