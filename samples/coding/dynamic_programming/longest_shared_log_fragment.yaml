version: 1
slug: longest_shared_log_fragment
title: Longest Shared Log Fragment
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, sre, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Longest Shared Log Fragment

  While grouping similar log lines, an on-call tool wants to know how much text two lines have in
  common. Given two log lines `a` and `b`, return the **length of the longest fragment** that appears in
  both of them.

  - A fragment is a **contiguous** run of characters (characters may not be skipped).
  - Comparison is **case-sensitive** and spaces and punctuation count as ordinary characters.
  - If the lines share no character at all (or either line is empty), return `0`.

  ### Example 1
  ```
  Input:  a = "GET /api/orders 200", b = "POST /api/orders 201"
  Output: 16
  Explanation: "T /api/orders 20" appears in both lines.
  ```

  ### Example 2
  ```
  Input:  a = "disk full", b = "cpu high"
  Output: 1
  Explanation: The lines share single characters such as "u", " " and "i", but no fragment of length 2.
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 1000`
  - `a` and `b` contain printable ASCII characters.

  **Follow-up:** the straightforward table uses `O(|a| * |b|)` memory. Can you keep only `O(|b|)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_shared_fragment
  params:
    - {name: a, type: string}
    - {name: b, type: string}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_shared_fragment(a: str, b: str) -> int:
        # prev[j]: length of the common fragment ending at a[i - 2] and b[j - 1].
        best = 0
        prev = [0] * (len(b) + 1)
        for i in range(1, len(a) + 1):
            cur = [0] * (len(b) + 1)
            for j in range(1, len(b) + 1):
                if a[i - 1] == b[j - 1]:
                    cur[j] = prev[j - 1] + 1
                    if cur[j] > best:
                        best = cur[j]
            prev = cur
        return best
  javascript: |
    function longestSharedFragment(a, b) {
      let best = 0;
      let prev = new Array(b.length + 1).fill(0);
      for (let i = 1; i <= a.length; i++) {
        const cur = new Array(b.length + 1).fill(0);
        for (let j = 1; j <= b.length; j++) {
          if (a[i - 1] === b[j - 1]) {
            cur[j] = prev[j - 1] + 1;
            if (cur[j] > best) best = cur[j];
          }
        }
        prev = cur;
      }
      return best;
    }
tests:
  - {id: t1, args: ["GET /api/orders 200", "POST /api/orders 201"], expected: 16, description: "Example 1"}
  - {id: t2, args: ["disk full", "cpu high"], expected: 1, description: "Example 2 - only single shared characters"}
  - {id: t3, hidden: true, args: ["", "worker-7 restarted"], expected: 0, description: "Empty first line"}
  - {id: t4, hidden: true, args: ["ERROR", "error"], expected: 0, description: "Case-sensitive - no shared character"}
  - {id: t5, hidden: true, args: ["cache miss", "cache miss"], expected: 10, description: "Identical lines"}
  - {id: t6, hidden: true, args: ["retry", "[warn] retry budget exhausted"], expected: 5, description: "First line is wholly contained in the second"}
  - {id: t7, hidden: true, args: ["aaaa", "aaaaaaa"], expected: 4, description: "Repeated characters - many overlapping matches"}
  - {id: t8, hidden: true, args: ["abcxyzabcd", "zabcdxyab"], expected: 5, description: "Shorter early match must not stop the search; longest match is near the end of a"}
  - {id: t9, hidden: true, args: ["ab-cd-ef", "ab_cd_ef"], expected: 2, description: "Common subsequence is long but contiguous fragments are short"}
  - {id: t10, hidden: true, args: ["", ""], expected: 40, description: "Two 1000-character lines over a tiny alphabet with a planted 40-character shared fragment"}
expected_concepts:
  - "table indexed by end positions in both strings"
  - "a match extends the diagonal value by one, a mismatch resets it to zero"
  - "tracking the best value seen anywhere in the table"
  - "O(|a| * |b|) time with a rolling row for O(|b|) memory"
  - "difference between a substring and a subsequence"
optimal_complexity: {time: "O(|a| * |b|)", space: "O(min(|a|, |b|))"}
rubric:
  excellent: "Defines the state as the longest common fragment ending at a pair of positions, resets on mismatch, tracks the global maximum, handles empty strings and reduces memory to one or two rows, stating O(|a| * |b|) time."
  good: "Correct full-table dynamic programming solution with the right complexity, possibly after a hint about resetting on mismatch."
  weak: "Computes the longest common subsequence instead, compares every pair of substrings in cubic time or worse, or ignores case sensitivity."
  criteria:
    correctness: "All tests pass, including empty lines, case differences and repeated characters."
    efficiency: "Quadratic time; memory reduced to a row is a plus."
    code_quality: "Clear off-by-one handling (padding row and column) and readable names."
    edge_cases: "Empty strings, identical strings, containment and no shared characters."
    communication: "Explains why the value resets to zero on a mismatch, unlike the subsequence version."
hints:
  - "Think about fragments that end at a particular position in a and a particular position in b at the same time."
  - "If the characters at those two end positions are equal, how long is the shared fragment ending there compared with the one ending one character earlier in both lines? What if they differ?"
  - "Build a table where each cell holds the length of the longest shared fragment ending exactly at position i of a and position j of b. When the two characters match, the cell is one more than the cell diagonally before it, otherwise it is zero. The answer is the largest value anywhere in the table, and only the previous row is needed at any time."
followups:
  - "How would you return the fragment itself, and which one if several have the same length?"
  - "What changes if you need the longest fragment shared by k log lines?"
  - "Which data structures (suffix automaton, suffix array, rolling hash with binary search) make this faster for very long lines?"
common_errors:
  - "Solving the longest common subsequence, which allows skipping characters."
  - "Returning the value of the last cell instead of the maximum over the table."
  - "Off-by-one errors when the table has no padding row and column."
  - "Lower-casing the lines although the comparison is case-sensitive."
