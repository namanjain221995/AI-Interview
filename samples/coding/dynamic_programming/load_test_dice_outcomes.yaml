slug: load_test_dice_outcomes
title: Load Test Dice Outcomes
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, qa, backend, data_scientist]
time_limit_minutes: 15
prompt_markdown: |
  ## Load Test Dice Outcomes

  A chaos-testing tool decides how many requests to fire in the next burst by rolling `dice` independent
  virtual dice. Every die has faces numbered `1, 2, ..., faces`, and the burst size is the sum of the
  values rolled.

  An outcome is the ordered list of values shown by die 1, die 2, ..., die `dice`, so rolling `(1, 2)`
  and `(2, 1)` with two dice are **different** outcomes. Return how many outcomes produce a burst of
  exactly `target` requests, **modulo `1_000_000_007`**. Return `0` when no outcome reaches `target`.

  ### Example 1
  ```
  Input:  dice = 2, faces = 6, target = 7
  Output: 6
  Explanation: (1, 6), (2, 5), (3, 4), (4, 3), (5, 2) and (6, 1).
  ```

  ### Example 2
  ```
  Input:  dice = 3, faces = 2, target = 4
  Output: 3
  Explanation: (1, 1, 2), (1, 2, 1) and (2, 1, 1).
  ```

  ### Example 3
  ```
  Input:  dice = 1, faces = 4, target = 5
  Output: 0
  Explanation: A single four-sided die can never show 5.
  ```

  ### Constraints
  - `1 <= dice <= 30`
  - `1 <= faces <= 30`
  - `1 <= target <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_dice_outcomes
  params:
    - {name: dice, type: int}
    - {name: faces, type: int}
    - {name: target, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_dice_outcomes(dice: int, faces: int, target: int) -> int:
        mod = 1_000_000_007
        # ways[s] = number of ordered outcomes of the dice rolled so far with sum s
        ways = [0] * (target + 1)
        ways[0] = 1
        for _ in range(dice):
            nxt = [0] * (target + 1)
            window = 0  # sum of ways[s - faces .. s - 1]
            for s in range(1, target + 1):
                window += ways[s - 1]
                if s - faces - 1 >= 0:
                    window -= ways[s - faces - 1]
                nxt[s] = window % mod
            ways = nxt
        return ways[target]
  javascript: |
    function countDiceOutcomes(dice, faces, target) {
      const MOD = 1000000007;
      let ways = new Array(target + 1).fill(0);
      ways[0] = 1;
      for (let d = 0; d < dice; d++) {
        const next = new Array(target + 1).fill(0);
        for (let s = 1; s <= target; s++) {
          let total = 0;
          for (let face = 1; face <= faces && face <= s; face++) {
            total += ways[s - face];
          }
          next[s] = total % MOD;
        }
        ways = next;
      }
      return ways[target];
    }
tests:
  - {id: t1, args: [2, 6, 7], expected: 6, description: "Example 1 - two standard dice"}
  - {id: t2, args: [3, 2, 4], expected: 3, description: "Example 2 - ordered outcomes are counted separately"}
  - {id: t3, args: [1, 4, 5], expected: 0, description: "Example 3 - target above the maximum face"}
  - {id: t4, hidden: true, args: [5, 6, 4], expected: 0, description: "Target below the number of dice is unreachable"}
  - {id: t5, hidden: true, args: [4, 3, 12], expected: 1, description: "Target equal to dice * faces has exactly one outcome"}
  - {id: t6, hidden: true, args: [10, 1, 10], expected: 1, description: "Single-face dice can only reach dice"}
  - {id: t7, hidden: true, args: [3, 4, 13], expected: 0, description: "Target just above dice * faces"}
  - {id: t8, hidden: true, args: [1, 30, 30], expected: 1, description: "One die at the highest face"}
  - {id: t9, hidden: true, args: [30, 30, 500], expected: 222616187, description: "Maximum dice and faces; the count needs the modulo"}
  - {id: t10, hidden: true, args: [30, 30, 1000], expected: 0, description: "Target beyond the reachable maximum of 900"}
expected_concepts:
  - "ways[d][s] = outcomes of the first d dice summing to s"
  - "each die adds a face value from 1 to faces"
  - "modulo 1_000_000_007 at every step"
  - "sliding-window or prefix sums to drop the faces factor"
  - "rolling one-dimensional table"
optimal_complexity: {time: "O(dice * target)", space: "O(target)"}
rubric:
  excellent: "Defines the dice-by-sum table, derives the transition over face values, applies the modulo throughout, reduces memory to one row, and removes the faces factor with a running window sum; notes the early exits when target is below dice or above dice * faces."
  good: "Correct O(dice * target * faces) DP with the modulo, or a memoised recursion, explained clearly."
  weak: "Enumerates every roll, counts unordered combinations instead of ordered outcomes, or overflows by skipping the modulo."
  criteria:
    correctness: "All tests pass, including unreachable targets and a single face."
    efficiency: "Polynomial DP; never enumerates faces^dice outcomes."
    code_quality: "Clear table meaning, bounded face loop and a named modulus constant."
    edge_cases: "target smaller than dice, target larger than dice * faces, faces = 1 and dice = 1."
    communication: "Explains why ordered outcomes lead to summing over the last die's value."
hints:
  - "Listing every possible roll grows as faces to the power dice. Think about what the last die contributes."
  - "The number of ways for some dice to reach a sum depends only on the ways for one fewer die to reach each smaller sum the last die could bridge."
  - "Keep a row of counts indexed by sum, starting with one way to reach zero using no dice; for each die build a new row where the count for sum s adds up the previous row's counts for s minus 1 through s minus faces, reducing modulo 1_000_000_007. A running window total avoids re-adding the faces terms each time."
followups:
  - "How would you compute the probability of hitting the target instead of a count?"
  - "Can you drop the faces factor from the running time?"
  - "What changes if the dice have different numbers of faces?"
  - "How could you answer many target queries for the same dice and faces efficiently?"
common_errors:
  - "Counting unordered multisets instead of ordered outcomes."
  - "Allowing a die to show 0 or starting faces at 0."
  - "Applying the modulo only at the end, which overflows fixed-width integers."
  - "Subtracting inside a window sum without correcting negative remainders."
