expected_concepts:
  - Kadane's algorithm (extend or restart)
  - dynamic programming on prefixes
  - 64-bit accumulation to avoid overflow
  - handling all-negative input
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Derives Kadane's algorithm from the extend-or-restart decision, uses 64-bit accumulators, handles all-negative input and explains O(n) time and O(1) space.
  good: Implements Kadane's algorithm correctly, possibly after an O(n^2) prefix-sum version, with a prompt about overflow or negatives.
  weak: Stays at O(n^2) or O(n^3), initialises the best sum to 0, or overflows 32-bit integers.
  criteria:
    correctness: All tests pass, including all-negative arrays and sums beyond 2^31.
    efficiency: Single pass with constant extra space.
    code_quality: Clear naming of the running and best sums.
    edge_cases: Single element, all negative values and large magnitudes.
    communication: Explains why restarting at the current element is safe when the running sum is negative.
hints:
  - For each position, think about the best sum of a subarray that ends exactly there.
  - The best subarray ending at index i either extends the best one ending at i - 1 or starts fresh at i — which choice is better depends on the running sum.
  - Track the best sum ending at the current element as max(current element, previous best + current element) and the overall maximum seen so far, using 64-bit integers.
followups:
  - What happens if every number is negative?
  - How would you also return the start and end indices of the best subarray?
  - How would you solve the circular version, where the subarray may wrap around the end?
  - Why can the result overflow a 32-bit integer, and how did you guard against it?
common_errors:
  - Initialising the best sum to 0, which returns 0 for all-negative arrays.
  - Accumulating in a 32-bit int in Java, C++ or Go and overflowing on large inputs.
  - Resetting the running sum to 0 before comparing, which skips single negative elements.
  - Using an O(n^2) double loop without discussing the linear approach.
