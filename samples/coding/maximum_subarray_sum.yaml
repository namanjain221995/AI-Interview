reference_solutions:
  python: |
    def max_subarray_sum(nums: list[int]) -> int:
        best = current = nums[0]
        for value in nums[1:]:
            current = max(value, current + value)
            best = max(best, current)
        return best
  javascript: |
    function maxSubarraySum(nums) {
      let best = nums[0];
      let current = nums[0];
      for (let i = 1; i < nums.length; i++) {
        current = Math.max(nums[i], current + nums[i]);
        best = Math.max(best, current);
      }
      return best;
    }
  typescript: |
    function maxSubarraySum(nums: number[]): number {
      let best = nums[0];
      let current = nums[0];
      for (let i = 1; i < nums.length; i++) {
        current = Math.max(nums[i], current + nums[i]);
        best = Math.max(best, current);
      }
      return best;
    }
  java: |
    class Solution {
        public long maxSubarraySum(int[] nums) {
            long best = nums[0];
            long current = nums[0];
            for (int i = 1; i < nums.length; i++) {
                current = Math.max(nums[i], current + nums[i]);
                best = Math.max(best, current);
            }
            return best;
        }
    }
  go: |
    package main

    func maxSubarraySum(nums []int) int64 {
    	best := int64(nums[0])
    	current := int64(nums[0])
    	for _, v := range nums[1:] {
    		x := int64(v)
    		if current+x > x {
    			current += x
    		} else {
    			current = x
    		}
    		if current > best {
    			best = current
    		}
    	}
    	return best
    }
  cpp: |
    #include <algorithm>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        long long maxSubarraySum(vector<int>& nums) {
            long long best = nums[0];
            long long current = nums[0];
            for (size_t i = 1; i < nums.size(); ++i) {
                current = max<long long>(nums[i], current + nums[i]);
                best = max(best, current);
            }
            return best;
        }
    };
