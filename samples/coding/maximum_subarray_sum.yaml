role_tags: [general, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Maximum Subarray Sum

  Given a non-empty integer array `nums`, find the **contiguous**, non-empty subarray with the largest
  sum and return that sum.

  Note that the sum can exceed the 32-bit integer range — return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  nums = [-2, 1, -3, 4, -1, 2, 1, -5, 4]
  Output: 6
  Explanation: the subarray [4, -1, 2, 1] has the largest sum, 6
  ```

  ### Example 2
  ```
  Input:  nums = [1]
  Output: 1
  ```

  ### Example 3
  ```
  Input:  nums = [5, 4, -1, 7, 8]
  Output: 23
  ```

  ### Constraints
  - `1 <= nums.length <= 10^5`
  - `-10^9 <= nums[i] <= 10^9`
