expected_concepts:
  - "LRU inclusion (stack) property: a larger LRU cache always holds a superset of a smaller one"
  - "reuse (stack) distance: distinct keys accessed since the previous access of the same key"
  - "an access hits with capacity c exactly when its stack distance is less than c"
  - "Fenwick tree (or balanced tree) over last-access positions to count distinct keys in a range"
  - "integer ceiling of the required hit count without floating point"
  - "order statistic on the sorted distances (or a histogram) to pick the capacity"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Recognises the LRU stack property, computes each access's stack distance with a Fenwick tree over last-access positions in O(n log n), derives the capacity as the k-th smallest distance plus one with an exact integer ceiling for k, and covers target 0, unreachable targets and back-to-back repeats."
  good: "Correct answers using stack distances computed with an O(n * distinct keys) recency list, or binary search over capacity with a full LRU simulation per probe, with a clear explanation of why hits grow with capacity."
  weak: "Simulates every capacity from 1 upwards without any monotonicity argument, mis-models LRU (for example FIFO eviction or counting accesses instead of distinct keys between reuses), or uses floating-point percentages that break at the boundary."
  criteria:
    correctness: "All tests pass, including exact-boundary ratios, target 0 and unreachable targets."
    efficiency: "Stack distances in O(n log n) with a Fenwick tree; recognises that binary search over capacity with simulation is O(n log n * log n) at best and per-capacity simulation is quadratic."
    code_quality: "Separates computing the distance of each access from choosing the capacity; Fenwick helpers are small and correct."
    edge_cases: "Single access, all keys distinct, the same key repeated, target 0, target 100 and ceiling rounding of the required hits."
    communication: "Explains the inclusion property and why a first access is always a miss regardless of capacity."
hints:
  - "Think about which accesses hit for a given capacity: a key that was used before is still cached only if not too many other keys were touched since its previous use."
  - "Define for every repeated access the number of distinct other keys accessed since the previous access of the same key; with capacity c the access hits exactly when that number is less than c, so you can collect these numbers once and reason about every capacity at the same time."
  - "Keep a Fenwick tree over trace positions with a one at the latest position of each key; when a key repeats, the count of ones strictly between its previous position and now is its distance, then move its one to the current position. Compute the required hits as a ceiling with integers, and if that is more than the number of repeats return minus one, otherwise sort the distances and answer the required-th smallest plus one (or one when nothing is required)."
followups:
  - "How would you report the hit ratio for every capacity from 1 to the number of distinct keys at once?"
  - "Does the same single-pass trick work for FIFO eviction? Why or why not?"
  - "The trace has a billion accesses and does not fit in memory. How would you estimate the curve with sampling?"
  - "How would the answer change if objects had different sizes and capacity were measured in bytes?"
common_errors:
  - "Counting all accesses between two uses of a key instead of distinct keys, which overstates the needed capacity."
  - "Treating a first access as a possible hit, so unreachable targets do not return -1."
  - "Computing the required hits with floating point or floor division, which is off by one at exact boundaries."
  - "Returning 0 for target 0 even though the capacity must be at least 1."
  - "Assuming hits jump to the maximum once capacity reaches the number of distinct keys and missing smaller sufficient capacities."
