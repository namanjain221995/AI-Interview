title: "Smallest LRU Cache for a Target Hit Ratio"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, platform, backend, cloud]
time_limit_minutes: 35
prompt_markdown: |
  ## Smallest LRU Cache for a Target Hit Ratio

  The platform team is sizing the in-memory cache that sits in front of a configuration service. They
  captured a production **access trace**: the keys the service looked up, in order. The cache uses
  **least-recently-used (LRU)** eviction, and memory is expensive, so they want the smallest cache that
  still meets the hit-ratio objective.

  An LRU cache with capacity `c` (the number of keys it can hold) behaves like this for each access in the
  trace, starting empty:

  - If the key is in the cache, the access is a **hit** and the key becomes the most recently used one.
  - Otherwise it is a **miss**: the key is inserted as the most recently used one, and if the cache now
    holds more than `c` keys, the least recently used key is evicted.

  Write `min_cache_capacity(accesses, target_pct)` that returns the **smallest capacity `c >= 1`** for which
  replaying the whole trace gives `hits * 100 >= target_pct * n`, where `n` is the length of the trace.
  Return `-1` if no capacity reaches the target, not even a cache large enough to hold every key.

  Keys are compared exactly (case-sensitive).

  ### Example 1
  ```
  Input:  accesses = ["a", "b", "c", "a", "b", "c", "a"], target_pct = 40
  Output: 3
  Explanation: with capacity 1 or 2 every access misses (the cyclic pattern always evicts the key that is
  needed next); with capacity 3 the last four accesses hit, and 4 * 100 >= 40 * 7
  ```

  ### Example 2
  ```
  Input:  accesses = ["user:7", "user:9", "user:7", "cfg", "user:9", "user:7", "cfg", "user:7"], target_pct = 50
  Output: 3
  Explanation: capacity 2 gives 2 hits (25%); capacity 3 gives 5 hits (62.5%)
  ```

  ### Example 3
  ```
  Input:  accesses = ["x", "y", "x", "z"], target_pct = 50
  Output: -1
  Explanation: even an unlimited cache misses the first access of x, y and z, so at most 1 of 4 accesses hits
  ```

  ### Constraints
  - `1 <= accesses.length <= 10^5`
  - `1 <= accesses[i].length <= 40`; keys are printable ASCII without spaces
  - `0 <= target_pct <= 100`

  **Follow-up:** simulating the cache once per candidate capacity is far too slow for a long trace. Can you
  get the answer for every capacity from a single pass, in `O(n log n)`?
