  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_cache_capacity(accesses: list[str], target_pct: int) -> int:
        n = len(accesses)
        tree = [0] * (n + 1)  # Fenwick tree over positions: 1 = latest access of some key

        def add(i: int, delta: int) -> None:
            i += 1
            while i <= n:
                tree[i] += delta
                i += i & -i

        def prefix(i: int) -> int:  # sum of positions 0..i-1
            total = 0
            while i > 0:
                total += tree[i]
                i -= i & -i
            return total

        last: dict[str, int] = {}
        distances: list[int] = []  # stack distance of every repeated access
        for i, key in enumerate(accesses):
            p = last.get(key)
            if p is not None:
                # distinct keys whose latest access lies strictly between p and i
                distances.append(prefix(i) - prefix(p + 1))
                add(p, -1)
            add(i, 1)
            last[key] = i

        need = (target_pct * n + 99) // 100  # smallest hit count with hits * 100 >= target_pct * n
        if need == 0:
            return 1
        if need > len(distances):
            return -1
        distances.sort()
        # an access with stack distance d hits exactly when capacity > d
        return distances[need - 1] + 1
  javascript: |
    function minCacheCapacity(accesses, targetPct) {
      const n = accesses.length;
      const tree = new Array(n + 1).fill(0);
      const add = (i, delta) => {
        for (i += 1; i <= n; i += i & -i) tree[i] += delta;
      };
      const prefix = (i) => {
        let total = 0;
        for (; i > 0; i -= i & -i) total += tree[i];
        return total;
      };
      const last = new Map();
      const distances = [];
      for (let i = 0; i < n; i++) {
        const key = accesses[i];
        if (last.has(key)) {
          const p = last.get(key);
          distances.push(prefix(i) - prefix(p + 1));
          add(p, -1);
        }
        add(i, 1);
        last.set(key, i);
      }
      const need = Math.ceil((targetPct * n) / 100);
      if (need === 0) return 1;
      if (need > distances.length) return -1;
      distances.sort((a, b) => a - b);
      return distances[need - 1] + 1;
    }
