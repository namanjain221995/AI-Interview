expected_concepts:
  - "counting occurrences with a hash map"
  - "joining two keyed data sets (full outer join semantics)"
  - "defaulting missing keys to zero"
  - "deterministic sorted output"
optimal_complexity: {time: "O(n + m + k log k)", space: "O(k)"}
rubric:
  excellent: "Counts scans with a map, considers the union of system and scanned SKUs with zero defaults on both sides, reports only differing rows as strings, sorts by sku and relates the approach to a full outer join."
  good: "Correct reconciliation that needs a nudge on unknown SKUs, never-scanned SKUs or the output format."
  weak: "Only iterates over the system SKUs and misses unknown ones (or the reverse), counts with nested loops, or returns numbers instead of strings."
  criteria:
    correctness: "All tests pass, including unknown SKUs, never-scanned SKUs and SKUs that differ only in case."
    efficiency: "One pass over the scans, one over the system SKUs and a single sort of the union."
    code_quality: "Missing values default to zero in one place and the comparison reads clearly."
    edge_cases: "Empty inputs, expected zero with no scans, only unknown SKUs and lexicographic ordering of codes with digits."
    communication: "States both one-sided cases before coding and explains the output order."
hints:
  - "Turn the list of scans into a quantity per SKU first; then you have two tables of SKU to quantity to compare."
  - "A discrepancy can come from either side, so the SKUs to check are the union of the system's SKUs and the scanned ones, with a missing side counting as zero."
  - "Count the scans in a map, build a second map from the system SKUs to their expected quantities, loop over the sorted union of both key sets, look up each side with a default of zero, and output the SKU with both numbers as strings whenever they differ."
followups:
  - "How would you write this reconciliation as one SQL query over an inventory table and a scans table?"
  - "How would you flag discrepancies only when they exceed a tolerance, such as 2 percent of the expected quantity?"
  - "If two people counted the same aisle concurrently, how would you avoid counting units twice?"
common_errors:
  - "Looping only over the system SKUs, which misses unknown scanned SKUs."
  - "Looping only over scanned SKUs, which misses SKUs that were never scanned."
  - "Reporting SKUs whose quantities match, such as an expected 0 with no scans."
  - "Sorting numerically or case-insensitively instead of by character code."
