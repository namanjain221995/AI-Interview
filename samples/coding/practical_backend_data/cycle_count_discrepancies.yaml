title: "Warehouse Cycle Count Discrepancies"
difficulty: easy
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [backend, data_analyst, business_analyst, data]
time_limit_minutes: 12
prompt_markdown: |
  ## Warehouse Cycle Count Discrepancies

  Once a week a warehouse team does a cycle count of one aisle: a handheld scanner records one entry for
  every unit it scans. The inventory system's view of the aisle is given as two parallel arrays: `skus`
  (distinct SKU codes) and `expected` (the quantity the system believes is on the shelf).

  Write `count_discrepancies(skus, expected, scans)` that reconciles the two:

  - The **counted** quantity of a SKU is the number of times it appears in `scans`.
  - A SKU that is scanned but **not** in `skus` is unknown to the system: its expected quantity is `0`.
  - A SKU in `skus` that was **never** scanned has a counted quantity of `0`.
  - Report every SKU whose expected and counted quantities differ as `[sku, expected, counted]`, with
    both numbers written as decimal strings (for example `"12"`).

  Return the rows sorted by `sku` in ascending order (character code order), or `[]` when everything
  matches. SKU codes are compared exactly (no case folding or trimming).

  ### Example 1
  ```
  Input:  skus = ["HDMI-2M", "USB-C1", "MOUSE-9"], expected = [3, 2, 1], scans = ["USB-C1", "HDMI-2M", "USB-C1", "HDMI-2M", "KB-44", "USB-C1"]
  Output: [["HDMI-2M", "3", "2"], ["KB-44", "0", "1"], ["MOUSE-9", "1", "0"], ["USB-C1", "2", "3"]]
  Explanation: HDMI-2M short by one, KB-44 unknown, MOUSE-9 never scanned, USB-C1 one extra
  ```

  ### Example 2
  ```
  Input:  skus = ["A-1", "B-2"], expected = [2, 0], scans = ["A-1", "A-1"]
  Output: []
  Explanation: B-2 expects 0 and has 0 scans, so it matches
  ```

  ### Constraints
  - `0 <= skus.length == expected.length <= 10^4`
  - `0 <= expected[i] <= 10^5`
  - `0 <= scans.length <= 10^5`
  - SKU codes are 1 to 20 characters of ASCII letters, digits and `-`, and `skus` has no duplicates
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_discrepancies
  params:
    - {name: skus, type: "string[]"}
    - {name: expected, type: "int[]"}
    - {name: scans, type: "string[]"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def count_discrepancies(skus: list[str], expected: list[int], scans: list[str]) -> list[list[str]]:
        counted: dict[str, int] = {}
        for sku in scans:
            counted[sku] = counted.get(sku, 0) + 1
        on_record = dict(zip(skus, expected))
        rows: list[list[str]] = []
        for sku in sorted(set(on_record) | set(counted)):
            want, got = on_record.get(sku, 0), counted.get(sku, 0)
            if want != got:
                rows.append([sku, str(want), str(got)])
        return rows
  javascript: |
    function countDiscrepancies(skus, expected, scans) {
      const counted = new Map();
      for (const sku of scans) counted.set(sku, (counted.get(sku) || 0) + 1);
      const onRecord = new Map();
      skus.forEach((sku, i) => onRecord.set(sku, expected[i]));
      const all = [...new Set([...onRecord.keys(), ...counted.keys()])];
      all.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      const rows = [];
      for (const sku of all) {
        const want = onRecord.get(sku) || 0;
        const got = counted.get(sku) || 0;
        if (want !== got) rows.push([sku, String(want), String(got)]);
      }
      return rows;
    }
