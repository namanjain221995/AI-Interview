  - {id: t2, args: ["sku,description\r\nA100,\"Line one\r\nLine two\"\r\nB200,plain"], expected: [["sku", "description"], ["A100", "Line one\r\nLine two"], ["B200", "plain"]], description: "Example 2 - CRLF endings, line break kept verbatim inside quotes, no final newline"}
  - {id: t3, args: ["a,b\n\"x\ny\",1\n3\n"], expected: [["#ERROR", "4"]], description: "Example 3 - wrong field count reported at the physical line where the record starts"}
  - {id: t4, hidden: true, args: [""], expected: [], description: "Empty text returns an empty list"}
  - {id: t5, hidden: true, args: ["x\n\ny\n"], expected: [["x"], [""], ["y"]], description: "Single-column document - a blank line is a record with one empty field"}
  - {id: t6, hidden: true, args: ["a,b\n1,2\n\n3,4"], expected: [["#ERROR", "3"]], description: "Blank line in a two-column document is a field-count error on line 3"}
  - {id: t7, hidden: true, args: ["a,b\n1,2\n3,4\"5\n"], expected: [["#ERROR", "3"]], description: "Stray quote inside an unquoted field (line 3)"}
  - {id: t8, hidden: true, args: ["name,qty\nbolt, \"5\"\n"], expected: [["#ERROR", "2"]], description: "Space before an opening quote makes the field unquoted, so the quote is stray (line 2)"}
  - {id: t9, hidden: true, args: ["a,b\n\"x\"y,1\n"], expected: [["#ERROR", "2"]], description: "Text after a closing quote (line 2)"}
  - {id: t10, hidden: true, args: ["k,v\n1,2\n3,\"open\nmore\nlines\n"], expected: [["#ERROR", "3"]], description: "Unterminated quote running to the end - reported at the line where its record starts (3)"}
  - {id: t11, hidden: true, args: ["\"\",\"\"\"\"\n\"a\"\"b\",\"\"\r\n\"c,\n\nd\",e"], expected: [["", "\""], ["a\"b", ""], ["c,\n\nd", "e"]], description: "Quoted empty fields, a field that is a single quote, escaped quotes and blank lines inside quotes"}
  - {id: t12, hidden: true, args: ["a,b,\r\n1,,\r\n"], expected: [["a", "b", ""], ["1", "", ""]], description: "Trailing commas give empty last fields; final CRLF adds no record"}
  - {id: t13, hidden: true, args: ["a,b\r\n\"1\r\n2\r\n3\",x\r\ny\r\n"], expected: [["#ERROR", "5"]], description: "CRLF inside a quoted field counts as one physical line each - error on line 5"}
expected_concepts:
  - character-level state machine (unquoted, quoted, after closing quote)
  - escaped quotes by doubling
  - line endings that are data inside quotes but separators outside them
  - tracking physical line numbers separately from record numbers
  - validation and precise error reporting
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Writes a single-pass state machine that handles quoted and unquoted fields, doubled quotes, both line endings, embedded line breaks and the final line ending, tracks the physical line where each record starts, detects all four error kinds and explains each state transition.
  good: Correct parsing of valid documents with a hint needed for one error kind, the CRLF handling or the line-number rule.
  weak: Splits the text on newlines or commas first, loses line breaks inside quotes, reports the record index instead of the physical line, or adds an empty record for the final line ending.
  criteria:
    correctness: All tests pass, including multi-line quoted fields, CRLF, empty fields, blank lines and every error kind.
    efficiency: One linear pass with an index into the text; no repeated string splitting or copying.
    code_quality: Explicit states or helper functions for quoted and unquoted fields; no deeply tangled flags.
    edge_cases: Empty text, a single blank line, trailing commas, a final line ending, a quoted field holding only a quote, and errors on the first record.
    communication: Explains how the parser decides whether a line ending is data or a record separator.
hints:
  - Splitting on line breaks first cannot work, because a line break inside quotes is part of a value; read the text one character at a time and remember whether you are inside a quoted field.
  - Treat each field separately - if it starts with a quote, read until a quote that is not doubled, then require a comma, a line ending or the end; otherwise read until a comma or line ending and reject any quote. Keep a running count of newline characters so you know the physical line where each record begins.
  - Loop over records with an index; save the current line number when a record starts, parse fields until you stop on a line ending or the end of the text, consume a two-character or one-character line ending, compare the field count with the first record's count, and on any violation return the error row with the saved line number. Do not start a new record when the index has reached the end of the text.
followups:
  - How would you stream a multi-gigabyte file without holding it in memory?
  - How would you support a different delimiter, or a header row that maps fields to names?
  - Instead of stopping at the first error, how would you collect every error with its line?
  - Which of these rules differ from RFC 4180 and from common spreadsheet exports?
common_errors:
  - Splitting on newlines before parsing, which breaks quoted multi-line fields.
  - Counting records instead of physical lines in the error position.
  - Producing an extra empty record for the line ending at the end of the text.
  - Leaving a carriage return at the end of the last field when the line ends with CRLF.
  - Accepting text after a closing quote or a quote inside an unquoted field.
