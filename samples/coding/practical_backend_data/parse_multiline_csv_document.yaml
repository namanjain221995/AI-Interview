version: 1
slug: parse_multiline_csv_document
title: Parse a Multi-Line CSV Document
difficulty: hard
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [backend, data, qa, fullstack]
time_limit_minutes: 35
prompt_markdown: |
  ## Parse a Multi-Line CSV Document

  Customers upload product catalogues as CSV exports from spreadsheets. Descriptions often contain
  commas, quotes and even line breaks, so splitting on newlines and commas breaks the import. Write a
  parser for the **whole document** that either returns every record or pinpoints the first broken
  one.

  **Format**

  - The document is a sequence of **records**. A record ends at a line ending, `\n` or `\r\n`, that
    is not inside a quoted field. A line ending at the very end of the text does **not** start
    another (empty) record. Every `\r` in the text is immediately followed by `\n`.
  - A record is a list of **fields** separated by commas. An empty line is a record with one empty
    field.
  - A field is **quoted** when its **first** character is `"`. Its value runs to the matching closing
    quote; inside it, `""` stands for one `"`, and commas and line breaks (`\n` or `\r\n`) are part of
    the value, kept exactly as written. After the closing quote the next character must be a comma, a
    line ending or the end of the text.
  - Any other field is **unquoted**: its value is all characters up to the next comma or line ending,
    and it must not contain `"`.

  **Errors.** A record is malformed when it has an **unterminated** quoted field, a `"` inside an
  unquoted field, characters **after a closing quote** (other than a comma or line ending), or a
  **different number of fields** than the first record. If any record is malformed, return
  `[["#ERROR", "<line>"]]`, where `<line>` is the 1-based **physical line** (counting every `\n`,
  including those inside quoted fields) on which the **first** malformed record **starts**. Otherwise
  return all records in order. An empty text returns `[]`.

  The examples write strings with escapes: `\n` is a newline, `\r` a carriage return and `\"` a
  quote character.

  ### Example 1
  ```
  Input:  text = "id,name,note\n1,\"Smith, Jo\",\"said \"\"hi\"\"\"\n2,Lee,\n"
  Output: [["id", "name", "note"], ["1", "Smith, Jo", "said \"hi\""], ["2", "Lee", ""]]
  ```

  ### Example 2
  ```
  Input:  text = "sku,description\r\nA100,\"Line one\r\nLine two\"\r\nB200,plain"
  Output: [["sku", "description"], ["A100", "Line one\r\nLine two"], ["B200", "plain"]]
  ```

  ### Example 3
  ```
  Input:  text = "a,b\n\"x\ny\",1\n3\n"
  Output: [["#ERROR", "4"]]
  Explanation: the second record starts on line 2 and spans lines 2-3 because of the quoted line
  break. The third record, "3", has one field instead of two and starts on line 4.
  ```

  ### Constraints
  - `0 <= text.length <= 10^5`
  - `text` contains printable ASCII characters, `\n` and `\r`; every `\r` is followed by `\n`
  - the result never needs more than `10^4` records
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parse_csv_document
  params:
    - {name: text, type: string}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def parse_csv_document(text: str) -> list[list[str]]:
        n = len(text)
        i = 0
        line = 1                      # physical line of position i
        records: list[list[str]] = []
        width = -1                    # field count of the first record

        def at_line_end(pos: int) -> bool:
            return pos < n and (text[pos] == "\n" or text.startswith("\r\n", pos))

        while i < n:
            start_line = line
            error = [["#ERROR", str(start_line)]]
            record: list[str] = []
            while True:
                if i < n and text[i] == '"':
                    i += 1
                    chars: list[str] = []
                    while True:
                        if i >= n:
                            return error                      # unterminated quote
                        ch = text[i]
                        if ch == '"':
                            if i + 1 < n and text[i + 1] == '"':
                                chars.append('"')
                                i += 2
                                continue
                            i += 1
                            break
                        if ch == "\n":
                            line += 1
                        chars.append(ch)
                        i += 1
                    if i < n and text[i] != "," and not at_line_end(i):
                        return error                          # text after closing quote
                    record.append("".join(chars))
                else:
                    start = i
                    while i < n and text[i] not in ',"' and not at_line_end(i):
                        i += 1
                    if i < n and text[i] == '"':
                        return error                          # stray quote
                    record.append(text[start:i])
                if i < n and text[i] == ",":
                    i += 1
                    continue
                break
            if text.startswith("\r\n", i):
                i += 2
                line += 1
            elif i < n and text[i] == "\n":
                i += 1
                line += 1
            if width < 0:
                width = len(record)
            elif len(record) != width:
                return error                                  # wrong field count
            records.append(record)
        return records
  javascript: |
    function parseCsvDocument(text) {
      const n = text.length;
      let i = 0;
      let line = 1;
      const records = [];
      let width = -1;
      const atLineEnd = (pos) => pos < n && (text[pos] === "\n" || text.startsWith("\r\n", pos));
      while (i < n) {
        const error = [["#ERROR", String(line)]];
        const record = [];
        for (;;) {
          if (i < n && text[i] === '"') {
            i++;
            let field = "";
            for (;;) {
              if (i >= n) return error;
              const ch = text[i];
              if (ch === '"') {
                if (i + 1 < n && text[i + 1] === '"') {
                  field += '"';
                  i += 2;
                  continue;
                }
                i++;
                break;
              }
              if (ch === "\n") line++;
              field += ch;
              i++;
            }
            if (i < n && text[i] !== "," && !atLineEnd(i)) return error;
            record.push(field);
          } else {
            const start = i;
            while (i < n && text[i] !== "," && text[i] !== '"' && !atLineEnd(i)) i++;
            if (i < n && text[i] === '"') return error;
            record.push(text.slice(start, i));
          }
          if (i < n && text[i] === ",") {
            i++;
            continue;
          }
          break;
        }
        if (text.startsWith("\r\n", i)) {
          i += 2;
          line++;
        } else if (i < n && text[i] === "\n") {
          i++;
          line++;
        }
        if (width < 0) width = record.length;
        else if (record.length !== width) return error;
        records.push(record);
      }
      return records;
    }
