expected_concepts:
  - "k-way merge with a max-heap keyed by the head of each shard"
  - "binary search to position each shard at the cursor"
  - "deduplicating adjacent equal ids in merged order"
  - "keyset (cursor) pagination with an exclusive bound"
optimal_complexity: {time: "O(k log n + p log k) for k shards, shard length n and page size p", space: "O(k + p)"}
rubric:
  excellent: "Positions each shard at the cursor with binary search, merges with a heap of k shard heads, skips duplicates without letting them consume page slots, stops after page_size ids and states O(k log n + p log k)."
  good: "Correct heap-based merge with a linear scan to the cursor or a small fix for duplicates after testing."
  weak: "Concatenates all shards, sorts and slices, ignores duplicates, or treats the cursor as inclusive."
  criteria:
    correctness: "All tests pass, including replicated ids, empty shards and an exclusive cursor."
    efficiency: "Work bounded by the page size and the number of shards, not by the total number of posts."
    code_quality: "Clear heap entries (id, shard, position) and a single loop with an explicit stop condition."
    edge_cases: "No shards, empty shards, cursor below everything, page_size larger than the data and fully replicated shards."
    communication: "Explains why equal ids always pop consecutively from the heap, making deduplication a comparison with the last emitted id."
hints:
  - "Each shard is already sorted, so the next id on the page must be the head of one of the shards; you never need to look deeper into a shard than its current position."
  - "Keep the current head of every shard in a priority queue ordered by id, largest first, and advance only the shard whose head you just took; skip each shard's leading ids that are not below the cursor first."
  - "Binary search each shard for the first id below before, push those heads into a max-heap, then pop repeatedly: append the id only if it differs from the last appended id, push that shard's next id, and stop when the page is full or the heap is empty."
followups:
  - "How would you make the cursor stable if two posts could share the same id or timestamp?"
  - "What changes if each shard is a remote call that returns at most 50 ids at a time?"
  - "How would you merge the shards lazily so the next page can reuse the heap from this one?"
  - "What is the cost of the concatenate-and-sort approach for a 20-item page over 100 shards of 10^5 posts?"
common_errors:
  - "Concatenating every shard and sorting, which does work proportional to all posts for a small page."
  - "Counting a replicated id more than once or letting duplicates use up page slots."
  - "Treating the cursor as inclusive, which repeats the last post of the previous page."
  - "Using a min-heap without negating ids, which returns the oldest posts first."
