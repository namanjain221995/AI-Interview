prompt_markdown: |
  ## One Page from a Sharded Timeline

  An activity timeline is stored across several database shards. Post ids are positive and grow
  with time, so newer posts have larger ids. Each shard returns its posts as a list of ids in
  **strictly descending** order (newest first). Posts are replicated for availability, so the same
  id can appear in **more than one** shard (never twice in the same shard).

  The API serves the timeline page by page with a cursor:

  - `before` is the cursor. `before = 0` means "first page"; otherwise only ids **strictly less than**
    `before` may be returned (the client passes the last id of the previous page).
  - `page_size` is the maximum number of ids to return.

  Implement `merged_feed_page(shards, before, page_size)`, which returns the next page: the
  `page_size` largest **distinct** ids that satisfy the cursor, in **descending** order. Return fewer
  ids when fewer are available, and an empty list when none are.

  Shards can be long while pages are short, so aim for a solution whose work depends on the page
  size and the number of shards rather than on the total number of posts.

  ### Example 1
  ```
  Input:  shards = [[90, 70, 40, 10], [85, 70, 30], [95, 60, 40, 5]], before = 0, page_size = 4
  Output: [95, 90, 85, 70]
  Explanation: 70 is stored on two shards but appears once.
  ```

  ### Example 2
  ```
  Input:  shards = [[90, 70, 40, 10], [85, 70, 30], [95, 60, 40, 5]], before = 70, page_size = 4
  Output: [60, 40, 30, 10]
  Explanation: the cursor 70 is exclusive, so the page starts at 60.
  ```

  ### Constraints
  - `0 <= shards.length <= 100`
  - `0 <= shards[i].length <= 10^5`, each shard strictly descending
  - `1 <= shards[i][j] <= 10^9`
  - `before == 0` or `1 <= before <= 10^9`
  - `1 <= page_size <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
