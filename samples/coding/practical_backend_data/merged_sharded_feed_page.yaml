  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def merged_feed_page(shards: list[list[int]], before: int, page_size: int) -> list[int]:
        heap: list[tuple[int, int, int]] = []
        for s, shard in enumerate(shards):
            # First position whose id is below the cursor (binary search on a descending list).
            lo, hi = 0, len(shard)
            if before > 0:
                while lo < hi:
                    mid = (lo + hi) // 2
                    if shard[mid] >= before:
                        lo = mid + 1
                    else:
                        hi = mid
            if lo < len(shard):
                heap.append((-shard[lo], s, lo))
        heapq.heapify(heap)
        page: list[int] = []
        while heap and len(page) < page_size:
            neg_id, s, i = heapq.heappop(heap)
            post_id = -neg_id
            if not page or page[-1] != post_id:
                page.append(post_id)
            if i + 1 < len(shards[s]):
                heapq.heappush(heap, (-shards[s][i + 1], s, i + 1))
        return page
  javascript: |
    function mergedFeedPage(shards, before, pageSize) {
      // Max-heap of [id, shard, index].
      const heap = [];
      const less = (a, b) => a[0] > b[0];
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!less(heap[i], heap[p])) break;
          [heap[i], heap[p]] = [heap[p], heap[i]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && less(heap[l], heap[m])) m = l;
            if (r < heap.length && less(heap[r], heap[m])) m = r;
            if (m === i) break;
            [heap[i], heap[m]] = [heap[m], heap[i]];
            i = m;
          }
        }
        return top;
      };
      shards.forEach((shard, s) => {
        let lo = 0;
        let hi = shard.length;
        if (before > 0) {
          while (lo < hi) {
            const mid = (lo + hi) >> 1;
            if (shard[mid] >= before) lo = mid + 1;
            else hi = mid;
          }
        }
        if (lo < shard.length) push([shard[lo], s, lo]);
      });
      const page = [];
      while (heap.length > 0 && page.length < pageSize) {
        const [id, s, i] = pop();
        if (page.length === 0 || page[page.length - 1] !== id) page.push(id);
        if (i + 1 < shards[s].length) push([shards[s][i + 1], s, i + 1]);
      }
      return page;
    }
