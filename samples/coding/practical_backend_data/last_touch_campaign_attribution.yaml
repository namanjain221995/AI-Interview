expected_concepts:
  - "grouping touches per user and sorting by time"
  - "binary search for the latest touch at or before the purchase"
  - "explicit tie-breaking rules"
  - "aggregation and multi-key sorting with numeric totals"
  - "parsing numbers from strings and avoiding 32-bit overflow"
optimal_complexity: {time: "O((T + P) log T + C log C) for T touches, P purchases and C campaigns", space: "O(T + C)"}
rubric:
  excellent: "Groups touches by user, sorts them by time and campaign, binary-searches each purchase, applies the inclusive lookback and tie rules, aggregates with 64-bit totals and sorts rows numerically with the name tie-break, explaining O((T + P) log T)."
  good: "Correct result using a per-user linear scan or after fixing one rule (tie-break, numeric sort or boundary) once tests fail."
  weak: "Compares times or totals as strings, uses touches after the purchase or from other users, or scans every touch for every purchase without discussing cost."
  criteria:
    correctness: "All tests pass, including ties, the inclusive lookback, direct purchases and large totals."
    efficiency: "Per-user sorted touches with binary search rather than a scan of all touches per purchase."
    code_quality: "Parsing done once, small helpers for lookup and a single sort key for the output."
    edge_cases: "No touches, no purchases, lookback 0, same-second touches and purchases, and totals beyond 32 bits."
    communication: "Explains how the attribution model choice (last touch, lookback) affects what marketing sees."
hints:
  - "For each purchase you only care about the same user's touches, so organise touches per user in a form that makes finding the latest one before a given time cheap."
  - "Sort each user's touches by time and then campaign; the latest touch at or before the purchase time can be found by binary search, and the first entry with that time is the tie-break winner."
  - "Parse times and amounts to integers, build user -> sorted list of (time, campaign), binary-search each purchase, check purchase time minus touch time against lookback, add the amount to that campaign or to (direct), then sort the rows by total descending and name ascending before converting numbers back to strings."
followups:
  - "How would you switch to first-touch or linear multi-touch attribution?"
  - "How would you compute this incrementally as touches and purchases stream in?"
  - "How would you write the same attribution in SQL?"
  - "What should happen when a purchase is refunded later?"
common_errors:
  - "Comparing times or totals as strings, so 900 sorts above 1200."
  - "Crediting a touch that happened after the purchase or a touch of another user."
  - "Using a strict comparison so a touch exactly lookback seconds old or at the same second is excluded."
  - "Accumulating totals in 32-bit integers in typed languages."
