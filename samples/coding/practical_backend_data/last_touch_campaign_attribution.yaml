version: 1
slug: last_touch_campaign_attribution
title: "Last-Touch Campaign Attribution"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, data_analyst, backend, product_manager]
time_limit_minutes: 25
prompt_markdown: |
  ## Last-Touch Campaign Attribution

  Marketing wants to know which campaigns drive revenue. The tracking export has two tables, both
  exported as text, so numbers arrive as **decimal strings**:

  - `touches[i] = [user, time, campaign]`: the user clicked an ad of `campaign` at second `time`.
  - `purchases[j] = [user, time, amount_cents]`: the user bought something worth `amount_cents`.

  Use **last-touch attribution** with a lookback window of `lookback` seconds. A purchase at time `p`
  is credited to the user's **latest** touch with `touch_time <= p` (a touch at the same second
  counts), provided `p - touch_time <= lookback`. If several of that user's touches share that latest
  time, the campaign that is smallest in plain character-code order wins. A purchase whose user has no
  such touch is credited to the campaign `"(direct)"`. Touches of other users never count.

  Implement `attribute_revenue(touches, purchases, lookback)`, which returns one row
  `[campaign, total_cents, purchase_count]` for every campaign credited with at least one purchase,
  with both numbers written as decimal strings without leading zeros. Sort rows by `total_cents`
  **numerically descending**, then by campaign name ascending (character-code order).

  Neither input is sorted.

  ### Example 1
  ```
  Input:  touches = [["u1", "100", "spring_sale"], ["u1", "400", "retarget"], ["u2", "100", "spring_sale"], ["u1", "700", "newsletter"]], purchases = [["u1", "500", "2500"], ["u2", "1000", "4000"], ["u3", "50", "1200"]], lookback = 600
  Output: [["(direct)", "5200", "2"], ["retarget", "2500", "1"]]
  Explanation: u1's purchase at 500 goes to the latest earlier touch (retarget at 400). u2's
  purchase at 1000 is 900 s after the touch, beyond the 600 s lookback, so it is direct. u1's
  touch at 700 happens after the purchase and is ignored. u3 has no touches, so its
  purchase is direct too.
  ```

  ### Example 2
  ```
  Input:  touches = [["a7", "50", "social"], ["a7", "50", "email"], ["b2", "120", "search"]], purchases = [["a7", "60", "900"], ["b2", "220", "1500"], ["a7", "55", "100"]], lookback = 100
  Output: [["search", "1500", "1"], ["email", "1000", "2"]]
  Explanation: both touches at 50 are latest; "email" < "social". The touch at 120 is exactly
  lookback seconds before the purchase at 220, so it still counts.
  ```

  ### Constraints
  - `0 <= touches.length, purchases.length <= 10^5`
  - users and campaigns are 1 to 40 characters of `a-z`, `0-9`, `_` and `-`
  - `0 <= time <= 10^12`, `1 <= amount_cents <= 10^9`, all without leading zeros
  - `0 <= lookback <= 10^9`
  - every total fits in a 53-bit integer
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: attribute_revenue
  params:
    - {name: touches, type: "string[][]"}
    - {name: purchases, type: "string[][]"}
    - {name: lookback, type: "int"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right


    def attribute_revenue(touches: list[list[str]], purchases: list[list[str]],
                          lookback: int) -> list[list[str]]:
        # Per user: touches sorted by time, then campaign, so the winner at a time comes first.
        by_user: dict[str, list[tuple[int, str]]] = {}
        for user, time, campaign in touches:
            by_user.setdefault(user, []).append((int(time), campaign))
        times_by_user: dict[str, list[int]] = {}
        for user, items in by_user.items():
            items.sort()
            times_by_user[user] = [t for t, _ in items]

        totals: dict[str, list[int]] = {}
        for user, time, amount in purchases:
            p = int(time)
            campaign = "(direct)"
            if user in by_user:
                times = times_by_user[user]
                k = bisect_right(times, p) - 1  # last touch with time <= p
                if k >= 0 and p - times[k] <= lookback:
                    first = bisect_right(times, times[k] - 1)  # first touch at that time
                    campaign = by_user[user][first][1]
            entry = totals.setdefault(campaign, [0, 0])
            entry[0] += int(amount)
            entry[1] += 1

        rows = sorted(totals.items(), key=lambda kv: (-kv[1][0], kv[0]))
        return [[name, str(total), str(count)] for name, (total, count) in rows]
  javascript: |
    function attributeRevenue(touches, purchases, lookback) {
      const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
      const byUser = new Map();
      for (const [user, time, campaign] of touches) {
        if (!byUser.has(user)) byUser.set(user, []);
        byUser.get(user).push([Number(time), campaign]);
      }
      for (const items of byUser.values()) {
        items.sort((a, b) => a[0] - b[0] || cmp(a[1], b[1]));
      }
      // Index of the last touch with time <= p, or -1.
      const lastAtOrBefore = (items, p) => {
        let lo = 0;
        let hi = items.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (items[mid][0] <= p) lo = mid + 1;
          else hi = mid;
        }
        return lo - 1;
      };
      const totals = new Map();
      for (const [user, time, amount] of purchases) {
        const p = Number(time);
        let campaign = '(direct)';
        const items = byUser.get(user);
        if (items !== undefined) {
          let k = lastAtOrBefore(items, p);
          if (k >= 0 && p - items[k][0] <= lookback) {
            while (k > 0 && items[k - 1][0] === items[k][0]) k -= 1;
            campaign = items[k][1];
          }
        }
        if (!totals.has(campaign)) totals.set(campaign, [0, 0]);
        const entry = totals.get(campaign);
        entry[0] += Number(amount);
        entry[1] += 1;
      }
      const rows = [...totals.entries()];
      rows.sort((a, b) => b[1][0] - a[1][0] || cmp(a[0], b[0]));
      return rows.map(([name, [total, count]]) => [name, String(total), String(count)]);
    }
