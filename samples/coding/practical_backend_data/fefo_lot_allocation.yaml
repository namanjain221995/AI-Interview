title: First-Expiry-First-Out Lot Allocation
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, business_analyst, general]
time_limit_minutes: 20
prompt_markdown: |
  ## First-Expiry-First-Out Lot Allocation

  A pharmacy distribution warehouse stores one medicine in several **lots**. Lot `i` has the id
  `lot_ids[i]`, can be shipped up to and including day `expiry_days[i]`, and holds `quantities[i]`
  units. Orders are processed one after another: order `j` arrives on day `order_days[j]` and asks for
  `order_qty[j]` units. Order days never decrease.

  The warehouse ships **first-expiry-first-out (FEFO)**:

  - An order may only use lots that have **not expired** on its day, that is lots with
    `expiry_days[i] >= order_days[j]`.
  - It takes units from the usable lot with the **earliest expiry day** first. Lots with the same expiry
    day are used in ascending order of `lot_id` (plain character-code order, so `"L-10"` comes before
    `"L-9"`).
  - It keeps taking from the next lot until the order is complete or no usable units are left. A
    partially filled order ships what is available; the missing units are not back-ordered.

  Units taken by an order are gone for every later order. Return a list with the number of units
  shipped for each order, in order.

  ### Example 1
  ```
  Input:  lot_ids = ["A7", "B2", "C1"], expiry_days = [10, 5, 10], quantities = [5, 3, 4],
          order_days = [1, 6, 8, 11], order_qty = [4, 6, 4, 1]
  Output: [4, 6, 2, 0]
  Explanation: day 1 takes 3 units from B2 (expires first) and 1 from A7. On day 6 B2 has expired;
  A7 and C1 share expiry day 10, so A7's 4 units go first and then 2 from C1. Day 8 gets the last 2
  units of C1. On day 11 every lot has expired.
  ```

  ### Example 2
  ```
  Input:  lot_ids = ["L-9", "L-10"], expiry_days = [3, 3], quantities = [2, 2],
          order_days = [3, 3], order_qty = [3, 5]
  Output: [3, 1]
  Explanation: a lot can still be shipped on its expiry day. "L-10" sorts before "L-9", so the first
  order empties L-10 and takes 1 unit of L-9.
  ```

  ### Constraints
  - `0 <= lot_ids.length == expiry_days.length == quantities.length <= 10^5`
  - `0 <= order_days.length == order_qty.length <= 10^5`
  - Lot ids are distinct, non-empty and made of printable ASCII characters.
  - `0 <= expiry_days[i], order_days[j] <= 10^9`, and `order_days` is non-decreasing.
  - `1 <= quantities[i] <= 10^9`, `0 <= order_qty[j] <= 10^9`
  - The total stock can exceed the 32-bit integer range.
