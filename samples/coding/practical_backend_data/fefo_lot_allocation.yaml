expected_concepts:
  - sorting lots once by (expiry day, lot id)
  - pointer that only moves forward because order days never decrease
  - partial consumption of a lot across orders
  - amortised analysis - each lot is emptied or skipped at most once
  - tie-breaking by plain character-code order of ids
optimal_complexity: {time: O(L log L + O), space: O(L)}
rubric:
  excellent: Sorts the lots once by expiry and id, walks them with a forward-only pointer that skips expired and empty lots, explains the amortised O(L log L + O) bound and handles ties, expiry-day boundaries and partial fills.
  good: Correct allocation using a heap or by re-scanning the sorted lots per order, with a slower but reasonable bound or a nudge on a tie-break or boundary rule.
  weak: Re-sorts per order, uses lots on the day after expiry, breaks ties numerically or ignores partial fills.
  criteria:
    correctness: All tests pass, including ties by id, the expiry-day boundary, zero-quantity orders and empty inputs.
    efficiency: One sort plus a linear amortised sweep over lots and orders.
    code_quality: Clear names for the remaining stock and the pointer; the expiry and empty-lot skip is in one place.
    edge_cases: No lots, no orders, order quantity 0, order larger than all stock, all lots expired, several orders on the same day.
    communication: Explains why the pointer never needs to move back and why the sort key must include the id.
hints:
  - If you sorted all lots in the order FEFO would use them, what would that order be, and does it change from one order to the next?
  - Because order days never decrease, a lot that is expired for one order is expired for every later order. Can you keep a position in the sorted lots that only ever moves forward?
  - Sort the lot indices by (expiry day, lot id). For each order, advance a pointer past lots that have expired or are empty, then take units from the lots at and after the pointer until the order is filled or the lots run out, leaving the pointer on the first lot that still has stock.
followups:
  - How would the algorithm change if order days could arrive in any order?
  - How would you also return which lots and how many units each order used, for traceability?
  - What changes if new lots are received between orders?
  - How would you reserve stock for priority orders that arrive later the same day?
common_errors:
  - Treating a lot as expired on its expiry day instead of the day after.
  - Breaking expiry ties by numeric id or by input order instead of character-code order of lot_id.
  - Re-sorting or re-scanning all lots for every order.
  - Shipping zero instead of a partial quantity when stock is short.
