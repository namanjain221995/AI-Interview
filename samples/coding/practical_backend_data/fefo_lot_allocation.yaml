reference_solutions:
  python: |
    def fefo_allocate(lot_ids: list[str], expiry_days: list[int], quantities: list[int], order_days: list[int], order_qty: list[int]) -> list[int]:
        order = sorted(range(len(lot_ids)), key=lambda i: (expiry_days[i], lot_ids[i]))
        remaining = [quantities[i] for i in order]
        expiry = [expiry_days[i] for i in order]
        pointer = 0
        shipped: list[int] = []
        for day, wanted in zip(order_days, order_qty):
            # Order days never decrease, so a lot that has expired stays expired.
            while pointer < len(order) and (expiry[pointer] < day or remaining[pointer] == 0):
                pointer += 1
            sent = 0
            k = pointer
            while sent < wanted and k < len(order):
                take = min(wanted - sent, remaining[k])
                remaining[k] -= take
                sent += take
                if remaining[k] == 0:
                    k += 1
            pointer = k
            shipped.append(sent)
        return shipped
  javascript: |
    function fefoAllocate(lotIds, expiryDays, quantities, orderDays, orderQty) {
      const order = lotIds.map((_, i) => i);
      order.sort((a, b) => {
        if (expiryDays[a] !== expiryDays[b]) return expiryDays[a] - expiryDays[b];
        return lotIds[a] < lotIds[b] ? -1 : lotIds[a] > lotIds[b] ? 1 : 0;
      });
      const remaining = order.map((i) => quantities[i]);
      const expiry = order.map((i) => expiryDays[i]);
      let pointer = 0;
      const shipped = [];
      for (let j = 0; j < orderDays.length; j++) {
        const day = orderDays[j];
        const wanted = orderQty[j];
        while (pointer < order.length && (expiry[pointer] < day || remaining[pointer] === 0)) pointer++;
        let sent = 0;
        let k = pointer;
        while (sent < wanted && k < order.length) {
          const take = Math.min(wanted - sent, remaining[k]);
          remaining[k] -= take;
          sent += take;
          if (remaining[k] === 0) k++;
        }
        pointer = k;
        shipped.push(sent);
      }
      return shipped;
    }
