expected_concepts:
  - aggregating quantities per key with hash maps
  - rule precedence implemented as an ordered if-else chain
  - integer-only percentage comparison (no floating point)
  - set of distinct orphan ids with a deterministic sort
  - 64-bit arithmetic for totals and products
optimal_complexity: {time: O(P + R + I + K log K) where K is the number of orphan ids, space: O(P + K)}
rubric:
  excellent: Aggregates receipts and invoices in one pass each with hash maps, encodes the six rules as an ordered chain that mirrors the specification, compares prices with integer arithmetic, uses 64-bit totals and returns distinct sorted orphans.
  good: Correct statuses for most lines but needs a nudge on one detail such as rule order, the exact-tolerance boundary, distinct orphans or 32-bit overflow.
  weak: Rescans all receipts and invoices for every PO line, compares prices with floating point that misjudges the boundary, or reports orphans per occurrence or unsorted.
  criteria:
    correctness: All tests pass, including precedence between rules, the tolerance boundary and orphan handling.
    efficiency: Linear aggregation with hash maps plus a sort of the orphan ids.
    code_quality: Rule chain that reads like the specification; parsing of string fields done once.
    edge_cases: Lines with no activity, zero tolerance, prices below the PO price, orphans that appear in both lists, totals above 32 bits.
    communication: Explains why the order of checks matters with a line that matches several rules.
hints:
  - Each PO line needs only a few aggregated facts. Which totals and flags would you like to have ready before deciding any status?
  - Build maps from line id to total received and total invoiced quantity, and remember which lines had at least one invoice outside the tolerance. Ids that are not on the PO go into a set of orphans.
  - Check the price with integers - multiply the absolute difference by 100 and compare with tolerance_pct times the PO price - then walk po_lines in order and apply the six rules as an if-else chain in exactly the listed order. Finally sort the orphan set and append the ORPHAN entries.
followups:
  - How would you return the amount in cents that is safe to pay for each line?
  - How would you support partial invoices that should be matched against specific receipts?
  - What changes if the tolerance is an absolute amount per line rather than a percentage?
  - How would you run this match incrementally as receipts and invoices stream in during the day?
common_errors:
  - Applying the rules in a different order, for example reporting OPEN before PRICE_VARIANCE.
  - Using floating-point percentages, which misjudges differences exactly at the tolerance.
  - Comparing only the first invoice's price instead of every invoice for the line.
  - Reporting an orphan id once per occurrence or in input order instead of distinct and sorted.
  - Summing quantities in 32-bit integers.
