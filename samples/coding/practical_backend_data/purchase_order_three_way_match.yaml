slug: purchase_order_three_way_match
title: Three-Way Match for Purchase Orders
difficulty: medium
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [backend, business_analyst, data_analyst, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Three-Way Match for Purchase Orders

  Before the accounts-payable team pays a supplier, the procurement system runs a **three-way match**:
  for every purchase-order (PO) line it compares what was **ordered**, what the warehouse **received**
  and what the supplier **invoiced**. You are given three lists whose entries are all strings:

  - `po_lines`: `[line_id, ordered_qty, unit_price_cents]`, line ids are distinct.
  - `receipts`: `[line_id, qty]`, goods receipts; a line can have any number of receipts.
  - `invoices`: `[line_id, qty, unit_price_cents]`, invoice lines; a line can have any number of them.

  For each PO line, let `received` be the total receipt quantity and `invoiced` the total invoice
  quantity for that line (0 when there are none). An invoice has a **price variance** when its price
  differs from the PO price by more than `tolerance_pct` percent of the PO price, that is when
  `|invoice_price - po_price| * 100 > tolerance_pct * po_price`.

  The line's status is the **first** rule that applies, checked in this order:

  1. `BILLED_NOT_RECEIVED` - `invoiced > received`
  2. `PRICE_VARIANCE` - at least one invoice for the line has a price variance
  3. `OPEN` - `received < ordered_qty`
  4. `OVER_RECEIVED` - `received > ordered_qty`
  5. `AWAITING_INVOICE` - `invoiced < received`
  6. `MATCHED` - otherwise

  Return one string `"<line_id>:<STATUS>"` per PO line in the order of `po_lines`, followed by
  `"<line_id>:ORPHAN"` for every **distinct** line id that appears in `receipts` or `invoices` but not in
  `po_lines`, sorted by line id in plain character-code (ASCII) order.

  ### Example 1
  ```
  Input:  po_lines = [["10", "5", "1000"], ["20", "3", "250"], ["30", "4", "999"], ["40", "2", "100"]],
          receipts = [["10", "5"], ["20", "2"], ["30", "4"], ["40", "2"], ["99", "1"]],
          invoices = [["10", "3", "1000"], ["10", "2", "1000"], ["20", "2", "250"], ["30", "4", "1050"],
                      ["40", "1", "100"], ["77", "1", "5"]],
          tolerance_pct = 2
  Output: ["10:MATCHED", "20:OPEN", "30:PRICE_VARIANCE", "40:AWAITING_INVOICE", "77:ORPHAN", "99:ORPHAN"]
  Explanation: line 30 was invoiced at 1050 against 999, a 51 cent difference, more than 2% of 999.
  ```

  ### Example 2
  ```
  Input:  po_lines = [["A1", "10", "500"], ["A2", "10", "500"], ["A3", "10", "500"]],
          receipts = [["A2", "12"], ["A3", "10"]],
          invoices = [["A1", "1", "900"], ["A2", "12", "505"], ["A3", "10", "510"]],
          tolerance_pct = 1
  Output: ["A1:BILLED_NOT_RECEIVED", "A2:OVER_RECEIVED", "A3:PRICE_VARIANCE"]
  Explanation: A1 is billed but nothing arrived, which outranks its price variance. A2's 5 cent
  difference is exactly 1% and therefore within tolerance.
  ```

  ### Constraints
  - `0 <= po_lines.length, receipts.length, invoices.length <= 10^4`
  - Line ids are non-empty strings of printable ASCII characters without `:`.
  - All quantities and prices are decimal integers without signs or leading zeros:
    `1 <= ordered_qty, qty <= 10^9`, `1 <= unit_price_cents <= 10^9`.
  - `0 <= tolerance_pct <= 100`
  - Totals and the variance products can exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: match_po_lines
  params:
    - {name: po_lines, type: "string[][]"}
    - {name: receipts, type: "string[][]"}
    - {name: invoices, type: "string[][]"}
    - {name: tolerance_pct, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def match_po_lines(po_lines: list[list[str]], receipts: list[list[str]], invoices: list[list[str]], tolerance_pct: int) -> list[str]:
        price = {line[0]: int(line[2]) for line in po_lines}
        received: dict[str, int] = {}
        invoiced: dict[str, int] = {}
        variance: set[str] = set()
        orphans: set[str] = set()
        for line_id, qty in receipts:
            if line_id not in price:
                orphans.add(line_id)
                continue
            received[line_id] = received.get(line_id, 0) + int(qty)
        for line_id, qty, unit_price in invoices:
            if line_id not in price:
                orphans.add(line_id)
                continue
            invoiced[line_id] = invoiced.get(line_id, 0) + int(qty)
            po_price = price[line_id]
            if abs(int(unit_price) - po_price) * 100 > tolerance_pct * po_price:
                variance.add(line_id)
        result: list[str] = []
        for line_id, ordered, _ in po_lines:
            got = received.get(line_id, 0)
            billed = invoiced.get(line_id, 0)
            ordered_qty = int(ordered)
            if billed > got:
                status = "BILLED_NOT_RECEIVED"
            elif line_id in variance:
                status = "PRICE_VARIANCE"
            elif got < ordered_qty:
                status = "OPEN"
            elif got > ordered_qty:
                status = "OVER_RECEIVED"
            elif billed < got:
                status = "AWAITING_INVOICE"
            else:
                status = "MATCHED"
            result.append(f"{line_id}:{status}")
        result.extend(f"{line_id}:ORPHAN" for line_id in sorted(orphans))
        return result
  javascript: |
    function matchPoLines(poLines, receipts, invoices, tolerancePct) {
      // BigInt keeps totals and variance products exact beyond 2^53.
      const price = new Map(poLines.map((l) => [l[0], BigInt(l[2])]));
      const received = new Map();
      const invoiced = new Map();
      const variance = new Set();
      const orphans = new Set();
      for (const [id, qty] of receipts) {
        if (!price.has(id)) {
          orphans.add(id);
          continue;
        }
        received.set(id, (received.get(id) ?? 0n) + BigInt(qty));
      }
      const tol = BigInt(tolerancePct);
      for (const [id, qty, unitPrice] of invoices) {
        if (!price.has(id)) {
          orphans.add(id);
          continue;
        }
        invoiced.set(id, (invoiced.get(id) ?? 0n) + BigInt(qty));
        const po = price.get(id);
        let diff = BigInt(unitPrice) - po;
        if (diff < 0n) diff = -diff;
        if (diff * 100n > tol * po) variance.add(id);
      }
      const result = [];
      for (const [id, ordered] of poLines) {
        const got = received.get(id) ?? 0n;
        const billed = invoiced.get(id) ?? 0n;
        const want = BigInt(ordered);
        let status;
        if (billed > got) status = "BILLED_NOT_RECEIVED";
        else if (variance.has(id)) status = "PRICE_VARIANCE";
        else if (got < want) status = "OPEN";
        else if (got > want) status = "OVER_RECEIVED";
        else if (billed < got) status = "AWAITING_INVOICE";
        else status = "MATCHED";
        result.push(id + ":" + status);
      }
      const extra = [...orphans].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      for (const id of extra) result.push(id + ":ORPHAN");
      return result;
    }
