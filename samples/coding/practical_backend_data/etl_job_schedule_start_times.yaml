  function_name: schedule_etl_jobs
  params:
    - {name: names, type: "string[]"}
    - {name: durations, type: "int[]"}
    - {name: deps, type: "string[][]"}
    - {name: workers, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq
    from collections import deque


    def schedule_etl_jobs(names: list[str], durations: list[int], deps: list[list[str]], workers: int) -> list[int]:
        n = len(names)
        index = {name: i for i, name in enumerate(names)}
        edges = {(index[a], index[b]) for a, b in deps}  # repeated pairs count once
        children: list[list[int]] = [[] for _ in range(n)]
        indegree = [0] * n
        for a, b in edges:
            children[a].append(b)
            indegree[b] += 1

        # Kahn's algorithm: topological order, or detect a cycle
        remaining = indegree[:]
        queue = deque(i for i in range(n) if remaining[i] == 0)
        order: list[int] = []
        while queue:
            u = queue.popleft()
            order.append(u)
            for v in children[u]:
                remaining[v] -= 1
                if remaining[v] == 0:
                    queue.append(v)
        if len(order) < n:
            return []

        # critical path = own duration + longest chain of dependents (reverse topological order)
        critical = [0] * n
        for u in reversed(order):
            critical[u] = durations[u] + max((critical[v] for v in children[u]), default=0)

        start = [-1] * n
        ready = [(-critical[i], names[i], i) for i in range(n) if indegree[i] == 0]
        heapq.heapify(ready)
        running: list[tuple[int, int]] = []  # (finish time, job)
        free = workers
        time = 0
        done = 0
        while done < n:
            while running and running[0][0] == time:
                _, u = heapq.heappop(running)
                free += 1
                done += 1
                for v in children[u]:
                    indegree[v] -= 1
                    if indegree[v] == 0:
                        heapq.heappush(ready, (-critical[v], names[v], v))
            while free > 0 and ready:
                _, _, u = heapq.heappop(ready)
                start[u] = time
                free -= 1
                heapq.heappush(running, (time + durations[u], u))
            if running:
                time = running[0][0]
        return start
  javascript: |
    class MinHeap {
      constructor(less) { this.a = []; this.less = less; }
      get size() { return this.a.length; }
      peek() { return this.a[0]; }
      push(x) {
        const a = this.a;
        a.push(x);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.a;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function scheduleEtlJobs(names, durations, deps, workers) {
      const n = names.length;
      const index = new Map(names.map((name, i) => [name, i]));
      const children = Array.from({ length: n }, () => []);
      const indegree = new Array(n).fill(0);
      const seen = new Set();
      for (const [a, b] of deps) {
        const u = index.get(a), v = index.get(b);
        const key = u * n + v;
        if (seen.has(key)) continue; // repeated pairs count once
        seen.add(key);
        children[u].push(v);
        indegree[v] += 1;
      }

      const remaining = indegree.slice();
      const order = [];
      for (let i = 0; i < n; i++) if (remaining[i] === 0) order.push(i);
      for (let k = 0; k < order.length; k++) {
        for (const v of children[order[k]]) {
          remaining[v] -= 1;
          if (remaining[v] === 0) order.push(v);
        }
      }
      if (order.length < n) return [];

      const critical = new Array(n).fill(0);
      for (let k = n - 1; k >= 0; k--) {
        const u = order[k];
        let best = 0;
        for (const v of children[u]) best = Math.max(best, critical[v]);
        critical[u] = durations[u] + best;
      }

      const byPriority = (x, y) =>
        critical[x] !== critical[y] ? critical[x] > critical[y] : names[x] < names[y];
      const ready = new MinHeap(byPriority);
      for (let i = 0; i < n; i++) if (indegree[i] === 0) ready.push(i);
      const running = new MinHeap((x, y) => x[0] < y[0]); // [finish time, job]
      const start = new Array(n).fill(-1);
      let free = workers, time = 0, done = 0;
      while (done < n) {
        while (running.size > 0 && running.peek()[0] === time) {
          const [, u] = running.pop();
          free += 1;
          done += 1;
          for (const v of children[u]) {
            indegree[v] -= 1;
            if (indegree[v] === 0) ready.push(v);
          }
        }
        while (free > 0 && ready.size > 0) {
          const u = ready.pop();
          start[u] = time;
          free -= 1;
          running.push([time + durations[u], u]);
        }
        if (running.size > 0) time = running.peek()[0];
      }
      return start;
    }
