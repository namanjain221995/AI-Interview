expected_concepts:
  - "topological sort (Kahn's algorithm) with cycle detection"
  - "longest path in a DAG by dynamic programming in reverse topological order"
  - "event-driven simulation that jumps between completion times"
  - "priority queue of ready jobs ordered by critical path then name"
  - "min-heap of running jobs by finish time"
  - "deduplicating repeated edges"
optimal_complexity: {time: "O((n + m) log n)", space: "O(n + m)"}
rubric:
  excellent: "Detects cycles with Kahn's algorithm, computes critical paths in reverse topological order, simulates with a ready heap keyed by (critical path desc, name) and a running heap keyed by finish time, processes all same-time completions before starting jobs, deduplicates edges and explains the overall complexity."
  good: "Correct simulation with a simpler structure, such as re-sorting the ready list at every event or stepping time one unit at a time on small inputs, or after a hint on same-time completions or repeated edges."
  weak: "Schedules in plain topological order ignoring priority, starts jobs before all completions at that moment are processed, uses duration instead of critical path, or loops forever on a cycle."
  criteria:
    correctness: "All tests pass, including cycles, self-dependencies, repeated pairs, ties by name and simultaneous completions."
    efficiency: "Jumps between events with heaps instead of iterating over every time unit; critical paths computed once with memoisation."
    code_quality: "Graph building, cycle check, priority computation and simulation are distinct steps with clear names."
    edge_cases: "Single job, no dependencies, more workers than jobs, long chains, large durations and repeated edges."
    communication: "Explains why critical path is a sensible priority and what the simulation does at each event."
hints:
  - "Split the problem in two: first work out each job's priority and whether a valid order exists at all, then simulate the workers over time."
  - "A topological order both detects a cycle and lets you compute every job's critical path by walking that order backwards. For the simulation you only need to look at the moments when a job finishes, not at every time unit."
  - "Build the graph with each pair counted once, run Kahn's algorithm and return an empty list if not every job was ordered, then compute the critical paths from the end of that order. Keep a heap of ready jobs ordered by largest critical path and then smallest name, and a heap of running jobs ordered by finish time; at each event time pop every job finishing now and release its dependents, then fill the free workers from the ready heap and record their start times, and jump to the next finish time."
followups:
  - "How would you compute the overall pipeline finish time and the slack of each job?"
  - "How would you adapt the simulation if workers had different speeds or jobs needed several workers?"
  - "How would you handle a job that fails and must be retried after a delay?"
  - "If the scheduler restarts mid-run, what state must be persisted to resume correctly?"
common_errors:
  - "Starting a job before processing every completion at the same moment, so a released job with higher priority is skipped."
  - "Counting a repeated dependency twice, so the dependent job never becomes ready."
  - "Using a job's own duration as the priority instead of its critical path."
  - "Breaking ties by input order instead of by name."
  - "Advancing time one unit at a time, which is far too slow for large durations."
