title: "Simulate an ETL Job Scheduler"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, platform, devops, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Simulate an ETL Job Scheduler

  The data platform runs its nightly ETL pipeline on a fixed pool of identical workers. Before changing the
  scheduler, the team wants a simulator that predicts **when each job starts**, so they can compare it with
  the real run logs.

  Job `i` is called `names[i]` (names are unique) and runs for `durations[i]` time units once started. Each
  pair `[before, after]` in `deps` means `after` may only start once `before` has **finished**. The same pair
  may appear more than once; it means the same as appearing once.

  **Priority.** The **critical path** of a job is its own duration plus the largest critical path among the
  jobs that directly depend on it (just its own duration if nothing depends on it). It is the length of the
  longest chain of work that cannot finish before this job does.

  **Scheduling rules.** There are `workers` workers and the clock starts at `0`. At every moment when a job
  finishes, and at time `0`:

  1. First process **all** jobs that finish at this moment: their workers become free, and every job whose
     dependencies have now all finished becomes **ready**.
  2. Then, while there is a free worker and a ready job, start the ready job with the **largest critical
     path**; on a tie, the job whose name is **smaller** (plain string comparison) starts first.

  A worker never stays idle while a job is ready, and jobs are never interrupted.

  Return the start time of every job, **in the order of `names`**. If the dependencies contain a cycle (so
  some job could never start), return an empty list `[]`.

  ### Example 1
  ```
  Input:  names = ["extract_orders", "extract_users", "transform_sales", "load_warehouse", "refresh_dashboard"],
          durations = [4, 2, 5, 3, 1],
          deps = [["extract_orders", "transform_sales"], ["extract_users", "transform_sales"], ["transform_sales", "load_warehouse"], ["extract_users", "refresh_dashboard"]],
          workers = 2
  Output: [0, 0, 4, 9, 2]
  Explanation: critical paths are 12, 10, 8, 3 and 1. At time 0 the two extracts start; refresh_dashboard
  waits. extract_users finishes at 2 and refresh_dashboard starts. extract_orders finishes at 4, so
  transform_sales starts at 4 and load_warehouse at 9.
  ```

  ### Example 2
  ```
  Input:  names = ["a", "b", "c", "d"], durations = [3, 3, 3, 1], deps = [["a", "d"]], workers = 1
  Output: [0, 3, 6, 9]
  Explanation: a has the largest critical path (3 + 1). At time 3, b and c are tied at 3 and b wins by
  name. At time 6, c (3) beats d (1).
  ```

  ### Example 3
  ```
  Input:  names = ["stage", "publish", "verify"], durations = [2, 2, 2], deps = [["stage", "publish"], ["publish", "verify"], ["verify", "stage"]], workers = 3
  Output: []
  ```

  ### Constraints
  - `1 <= names.length == durations.length <= 2000`
  - names are unique, non-empty, lowercase letters, digits and underscores
  - `1 <= durations[i] <= 10^5`
  - `0 <= deps.length <= 10^4`; every pair names two jobs from `names` (a job may name itself, which is a cycle)
  - `1 <= workers <= 100`

  **Follow-up:** why is "longest critical path first" a good heuristic for the overall finish time, and when
  is it not optimal?
languages: [python, javascript, typescript, java, go, cpp]
