  - {id: t2, args: [[["acct-1", "10", "plan=pro"], ["acct-1", "9", "plan=team"], ["acct-1", "010", "plan=enterprise"]]], expected: [["acct-1", "010", "plan=enterprise"]], description: "Example 2 - numeric comparison (10 beats 9) and a tie on 10 vs 010 resolved by the later delivery"}
  - {id: t3, hidden: true, args: [[]], expected: [], description: "Empty batch returns []"}
  - {id: t4, hidden: true, args: [[["p", "0", ""]]], expected: [["p", "0", ""]], description: "Single record with version 0 and an empty payload"}
  - {id: t5, hidden: true, args: [[["inv-2", "5", "a"], ["inv-1", "5", "b"], ["inv-2", "5", "c"], ["inv-2", "4", "d"], ["inv-1", "5", "e"]]], expected: [["inv-1", "5", "e"], ["inv-2", "5", "c"]], description: "Several ties on the highest version; the last delivery of that version wins and a later lower version is ignored"}
  - {id: t6, hidden: true, args: [[["Z", "1", "x"], ["a", "1", "y"], ["B", "1", "z"], ["_k", "1", "w"], ["9", "1", "v"]]], expected: [["9", "1", "v"], ["B", "1", "z"], ["Z", "1", "x"], ["_k", "1", "w"], ["a", "1", "y"]], description: "Sorting uses character codes - digits before upper case before underscore before lower case"}
  - {id: t7, hidden: true, args: [[["e", "999999999999999", "max"], ["e", "1000000000", "mid"], ["e", "99999999999999", "lower"]]], expected: [["e", "999999999999999", "max"]], description: "15-digit versions that do not fit in 32 bits; string comparison would pick the wrong one"}
  - {id: t8, hidden: true, args: [[["cfg", "2", "old"], ["cfg", "100", "new"], ["cfg", "20", "mid"], ["cfg", "0100", "replay"]]], expected: [["cfg", "0100", "replay"]], description: "String comparison of versions would pick 20; leading zeros tie with 100 and the later replay wins"}
