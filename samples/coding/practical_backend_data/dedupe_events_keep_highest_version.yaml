expected_concepts:
  - "hash map from key to the best record seen so far"
  - "numeric rather than lexicographic version comparison"
  - "deterministic tie-breaking by delivery order"
  - "sorting the final keys for a stable output order"
  - "idempotent processing of at-least-once delivery"
optimal_complexity: {time: "O(n + k log k)", space: "O(k)"}
rubric:
  excellent: "Uses one pass with a map keyed by entity_id, compares versions numerically, replaces on equal versions so the last delivery wins, returns the original records sorted by entity_id and explains why this makes the consumer idempotent."
  good: "Correct map-based solution that needs a nudge on one detail such as numeric comparison, the tie rule or the final sort."
  weak: "Compares versions as strings, keeps the first copy on ties, returns one record per input record or sorts by version instead of entity_id."
  criteria:
    correctness: "All tests pass, including leading zeros, ties on the highest version and long versions."
    efficiency: "Linear pass plus one sort of the distinct entity ids; no nested scans over the batch."
    code_quality: "The replace condition is a single clear comparison and the kept record is returned unchanged."
    edge_cases: "Empty batch, a single record, repeated identical records, out-of-order arrival and versions beyond 32 bits."
    communication: "States the tie rule explicitly and explains why string comparison of versions is wrong."
hints:
  - "You only ever need to remember one record per entity: the best one seen so far."
  - "Walk the batch once with a map from entity_id to the kept record and its version as a number; decide carefully whether an equal version should replace what you kept."
  - "Convert each version to an integer, replace the kept record when the new version is greater than or equal to the kept one so the latest delivery wins ties, and at the end sort the map's keys and output their kept records in that order."
followups:
  - "How would you handle versions longer than 18 digits without converting them to integers?"
  - "If the batch were too large for memory, how would you deduplicate it across several machines?"
  - "How would you make the warehouse load itself idempotent so replays never overwrite newer data?"
common_errors:
  - "Comparing versions as strings, so 9 beats 10 and 010 differs from 10."
  - "Using a strict comparison, which keeps the first delivery when the highest version repeats."
  - "Returning records in input order instead of sorting by entity_id."
  - "Rebuilding or reformatting the record (for example normalising the version) instead of returning it unchanged."
