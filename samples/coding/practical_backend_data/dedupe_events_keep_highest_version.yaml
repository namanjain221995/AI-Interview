version: 1
slug: dedupe_events_keep_highest_version
title: "Keep the Latest Version of Each Entity"
difficulty: easy
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [backend, data, platform, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Keep the Latest Version of Each Entity

  A change-data pipeline publishes one record every time an entity (an order, a product, a customer
  account) is saved. Delivery is **at least once** and **not ordered**: a record can arrive twice, and an
  old version can arrive after a newer one. Before loading a batch into the warehouse, the consumer keeps
  only the newest state of every entity.

  Each record is `[entity_id, version, payload]`, all strings. `version` is a non-negative integer written
  in decimal, and versions must be compared **as numbers**: `"10"` is newer than `"9"`, and `"007"` is the
  same version as `"7"`.

  Write `latest_versions(events)` that keeps exactly one record per `entity_id`:

  - the record with the **highest version**;
  - if several records share that highest version, the one that appears **last** in `events` (the most
    recent delivery wins).

  Return the kept records unchanged (exactly as they appear in the input), sorted by `entity_id` in
  ascending string order (character code order). Return `[]` for an empty batch.

  ### Example 1
  ```
  Input:  events = [["order-7", "2", "status=paid"], ["order-3", "1", "status=new"], ["order-7", "3", "status=shipped"], ["order-3", "1", "status=new"]]
  Output: [["order-3", "1", "status=new"], ["order-7", "3", "status=shipped"]]
  Explanation: order-7 keeps version 3; order-3 arrived twice with version 1
  ```

  ### Example 2
  ```
  Input:  events = [["acct-1", "10", "plan=pro"], ["acct-1", "9", "plan=team"], ["acct-1", "010", "plan=enterprise"]]
  Output: [["acct-1", "010", "plan=enterprise"]]
  Explanation: 10 > 9 numerically; "010" equals 10 and arrives later, so it replaces the first record
  ```

  ### Constraints
  - `0 <= events.length <= 10^5`
  - `events[i].length == 3`
  - `entity_id` is 1 to 40 characters of ASCII letters, digits, `-` and `_`
  - `version` is 1 to 15 decimal digits and may have leading zeros
  - `payload` is 0 to 200 printable ASCII characters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: latest_versions
  params:
    - {name: events, type: "string[][]"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def latest_versions(events: list[list[str]]) -> list[list[str]]:
        kept: dict[str, tuple[int, list[str]]] = {}
        for record in events:
            entity_id, version = record[0], int(record[1])
            current = kept.get(entity_id)
            # >= so that a later delivery of the same highest version replaces the earlier one
            if current is None or version >= current[0]:
                kept[entity_id] = (version, record)
        return [kept[entity_id][1] for entity_id in sorted(kept)]
  javascript: |
    function latestVersions(events) {
      const kept = new Map();
      for (const record of events) {
        const entityId = record[0];
        const version = Number(record[1]);
        const current = kept.get(entityId);
        if (current === undefined || version >= current.version) {
          kept.set(entityId, { version, record });
        }
      }
      const keys = [...kept.keys()].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return keys.map((key) => kept.get(key).record);
    }
