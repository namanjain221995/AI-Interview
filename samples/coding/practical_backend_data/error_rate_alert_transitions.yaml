expected_concepts:
  - "sliding window with two pointers over sorted timestamps"
  - "running counters for requests and failures in the window"
  - "grouping equal timestamps before evaluation"
  - "integer arithmetic for the percentage comparison"
  - "edge-triggered output (state changes only)"
optimal_complexity: {time: "O(n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Uses a two-pointer window with running request and failure counts, evaluates only after all requests at a timestamp, applies the exclusive lower bound and integer threshold comparison, emits only state changes and states O(n)."
  good: "Correct sliding-window solution after fixing one boundary issue such as equal timestamps or the exclusive window edge."
  weak: "Recounts the window for every request in O(n^2), evaluates between requests at the same time, or uses floating-point ratios that misjudge the exact threshold."
  criteria:
    correctness: "All tests pass, including same-time batches, exact threshold hits and the exclusive window bound."
    efficiency: "Each request enters and leaves the window once; linear overall."
    code_quality: "Clear names for the window pointers and counters, with the firing condition in one place."
    edge_cases: "Empty log, traffic below min_requests, flapping, a single timestamp and 64-bit times."
    communication: "Relates min_requests and the window to avoiding noisy alerts on low traffic."
hints:
  - "Since times are sorted, the requests inside (t - window, t] form a contiguous block of the log that only moves forward as t grows."
  - "Keep a left pointer plus running counts of requests and failures; add every request with the current time before evaluating, then drop requests from the left while their time is at most t - window."
  - "Loop over groups of equal times: add the group, advance left while times[left] <= t - window (subtracting failures), compute firing with count >= min_requests and errors * 100 >= threshold_pct * count, and append t whenever firing differs from the previous state."
followups:
  - "How would you add a cooldown so the alert cannot resolve within five minutes of firing?"
  - "How would you evaluate the alert every minute of wall-clock time instead of only at request times?"
  - "How would you run this per service for thousands of services in a streaming system?"
  - "Why is comparing errors * 100 with threshold_pct * count safer than computing a floating-point ratio?"
common_errors:
  - "Evaluating after each individual request rather than after the whole group with the same time."
  - "Keeping requests exactly window milliseconds old, which makes the lower bound inclusive."
  - "Recomputing the window from scratch for every request, which is quadratic."
  - "Emitting the state at every evaluation instead of only when it changes."
