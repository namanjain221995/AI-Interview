title: "Error-Rate Alert State Transitions"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, devops, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Error-Rate Alert State Transitions

  You are replaying a request log to test a new error-rate alert before turning it on in production.
  Request `i` arrived at `times[i]` (milliseconds; `times` is **non-decreasing**) and `failed[i]`
  tells whether it failed.

  The alert is evaluated once at every **distinct** request time `t`, after **all** requests with time
  `t` have been counted. The evaluation looks at the requests in the window `(t - window, t]`: times
  strictly greater than `t - window` and at most `t`. With `count` requests and `errors` failed
  requests in that window, the alert is **firing** when

  - `count >= min_requests`, and
  - `errors * 100 >= threshold_pct * count`.

  Otherwise it is **resolved**. The alert starts resolved and nothing is evaluated between requests.

  Return the list of times at which the state **changes**, in increasing order. The first entry (if
  any) is when the alert starts firing, the second when it resolves, and so on, alternating.

  ### Example 1
  ```
  Input:  times = [100, 200, 300, 900, 1300, 1500], failed = [true, false, true, false, false, true], window = 1000, min_requests = 3, threshold_pct = 50
  Output: [300, 1300]
  Explanation: at 300 the window (-700, 300] holds 3 requests with 2 failures (66%), so the
  alert fires. At 900 it is 2 failures out of 4 (50%), still firing. At 1300 the window
  (300, 1300] holds only the requests at 900 and 1300 (the one at 300 is exactly 1000 ms old
  and has left), which is below min_requests, so the alert resolves. At 1500 it is 1 failure
  out of 3, still resolved.
  ```

  ### Example 2
  ```
  Input:  times = [10, 10, 20, 20, 30], failed = [false, false, true, true, false], window = 100, min_requests = 3, threshold_pct = 50
  Output: [20, 30]
  Explanation: the two requests at time 20 are evaluated together: 2 failures out of 4 meets
  the 50% threshold exactly. At 30, 2 failures out of 5 is below it.
  ```

  ### Constraints
  - `0 <= times.length <= 10^5`, `failed.length == times.length`
  - `0 <= times[i] <= 10^13`, non-decreasing
  - `1 <= window <= 10^13`
  - `1 <= min_requests <= 10^5`
  - `1 <= threshold_pct <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: alert_transitions
  params:
    - {name: times, type: "long[]"}
    - {name: failed, type: "bool[]"}
    - {name: window, type: "long"}
    - {name: min_requests, type: "int"}
    - {name: threshold_pct, type: "int"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def alert_transitions(times: list[int], failed: list[bool], window: int,
                          min_requests: int, threshold_pct: int) -> list[int]:
        changes: list[int] = []
        firing = False
        left = 0
        errors = 0
        n = len(times)
        i = 0
        while i < n:
            t = times[i]
            # Add every request at time t.
            while i < n and times[i] == t:
                if failed[i]:
                    errors += 1
                i += 1
            # Drop requests that are no longer inside (t - window, t].
            while times[left] <= t - window:
                if failed[left]:
                    errors -= 1
                left += 1
            count = i - left
            now = count >= min_requests and errors * 100 >= threshold_pct * count
            if now != firing:
                changes.append(t)
                firing = now
        return changes
  javascript: |
    function alertTransitions(times, failed, window, minRequests, thresholdPct) {
      const changes = [];
      let firing = false;
      let left = 0;
      let errors = 0;
      let i = 0;
      const n = times.length;
      while (i < n) {
        const t = times[i];
        while (i < n && times[i] === t) {
          if (failed[i]) errors += 1;
          i += 1;
        }
        while (times[left] <= t - window) {
          if (failed[left]) errors -= 1;
          left += 1;
        }
        const count = i - left;
        const now = count >= minRequests && errors * 100 >= thresholdPct * count;
        if (now !== firing) {
          changes.push(t);
          firing = now;
        }
      }
      return changes;
    }
