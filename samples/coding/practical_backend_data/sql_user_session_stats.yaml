version: 1
slug: sql_user_session_stats
title: "Session Statistics from Page Views (SQL)"
difficulty: hard
competency_keys: [sql, databases]
role_tags: [data, data_analyst, backend, data_scientist]
time_limit_minutes: 30
prompt_markdown: |
  ## Session Statistics from Page Views

  The product analytics team wants per-user engagement numbers for a web app. Raw page views are stored
  with an integer Unix timestamp in seconds.

  Table `page_views`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | user_id | INTEGER | user who viewed the page |
  | viewed_at | INTEGER | Unix seconds; a user can have several views in the same second |

  Order each user's views by `viewed_at`, then by `id`. A view **starts a new session** when it is the
  user's first view, or when it comes **more than 1800 seconds** after that user's previous view. A gap of
  exactly 1800 seconds keeps the session going, so a session can last much longer than 1800 seconds in total.
  The **length** of a session is its last view's `viewed_at` minus its first view's `viewed_at` (0 for a
  session with one view).

  Return one row per user who has at least one view, with the columns:

  - `user_id`;
  - `sessions`: the number of sessions of that user;
  - `total_views`: the number of views of that user;
  - `longest_session_seconds`: the length of that user's longest session.

  Order the rows by `user_id` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite (window functions are allowed).

  ### Example 1
  ```
  page_views
  +----+---------+-----------+
  | id | user_id | viewed_at |
  +----+---------+-----------+
  | 1  | 7       | 1000      |
  | 2  | 7       | 1600      |
  | 3  | 7       | 3400      |
  | 4  | 7       | 9000      |
  | 5  | 3       | 500       |
  | 6  | 7       | 9100      |
  | 7  | 3       | 2400      |
  +----+---------+-----------+

  Output
  +---------+----------+-------------+-------------------------+
  | user_id | sessions | total_views | longest_session_seconds |
  +---------+----------+-------------+-------------------------+
  | 3       | 2        | 2           | 0                       |
  | 7       | 2        | 5           | 2400                    |
  +---------+----------+-------------+-------------------------+
  User 7: 1600 -> 3400 is exactly 1800 seconds, so the first session is 1000..3400 (2400 seconds);
  9000 starts a second session. User 3: the gap of 1900 seconds splits two one-view sessions.
  ```

  ### Example 2
  ```
  page_views
  +----+---------+-----------+
  | id | user_id | viewed_at |
  +----+---------+-----------+
  | 10 | 42      | 7200      |
  | 11 | 42      | 100       |
  | 12 | 42      | 1900      |
  | 13 | 42      | 1900      |
  +----+---------+-----------+

  Output
  +---------+----------+-------------+-------------------------+
  | user_id | sessions | total_views | longest_session_seconds |
  +---------+----------+-------------+-------------------------+
  | 42      | 2        | 4           | 1800                    |
  +---------+----------+-------------+-------------------------+
  Rows are stored out of time order. Sessions are 100..1900 (three views) and 7200.
  ```

  ### Constraints
  - The table may be empty (then no rows are returned).
  - `0 <= viewed_at <= 4 * 10^9`.
languages: [sql]
starter_code:
  sql: |
    -- Per user: number of sessions, total views and the longest session in seconds.
    SELECT user_id, 1 AS sessions, COUNT(*) AS total_views, MAX(viewed_at) - MIN(viewed_at) AS longest_session_seconds
    FROM page_views
    GROUP BY user_id
    ORDER BY user_id;
reference_solutions:
  sql: |
    WITH ordered AS (
      SELECT user_id, id, viewed_at,
             LAG(viewed_at) OVER (PARTITION BY user_id ORDER BY viewed_at, id) AS prev_at
      FROM page_views
    ),
    flagged AS (
      SELECT user_id, id, viewed_at,
             CASE WHEN prev_at IS NULL OR viewed_at - prev_at > 1800 THEN 1 ELSE 0 END AS starts_session
      FROM ordered
    ),
    numbered AS (
      SELECT user_id, viewed_at,
             SUM(starts_session) OVER (
               PARTITION BY user_id ORDER BY viewed_at, id
               ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
             ) AS session_no
      FROM flagged
    ),
    sessions AS (
      SELECT user_id, session_no, COUNT(*) AS views, MAX(viewed_at) - MIN(viewed_at) AS length_seconds
      FROM numbered
      GROUP BY user_id, session_no
    )
    SELECT user_id,
           COUNT(*) AS sessions,
           SUM(views) AS total_views,
           MAX(length_seconds) AS longest_session_seconds
    FROM sessions
    GROUP BY user_id
    ORDER BY user_id;
sql_setup: |
  CREATE TABLE page_views (
    id INTEGER PRIMARY KEY,
    user_id INTEGER NOT NULL,
    viewed_at INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - a gap of exactly 1800 seconds stays in the session; one-view sessions have length 0"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 7, 1000), (2, 7, 1600), (3, 7, 3400), (4, 7, 9000),
        (5, 3, 500), (6, 7, 9100), (7, 3, 2400);
    expected_rows: [[3, 2, 2, 0], [7, 2, 5, 2400]]
  - id: t2
    description: "Example 2 - rows inserted out of time order; two views at the same second"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (10, 42, 7200), (11, 42, 100), (12, 42, 1900), (13, 42, 1900);
    expected_rows: [[42, 2, 4, 1800]]
  - id: t3
    hidden: true
    description: "Empty table - no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Single view - one session of length 0"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES (1, 5, 123456);
    expected_rows: [[5, 1, 1, 0]]
  - id: t5
    hidden: true
    description: "Every gap is 1801 seconds - each view is its own session"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 1, 0), (2, 1, 1801), (3, 1, 3602), (4, 1, 5403);
    expected_rows: [[1, 4, 4, 0]]
  - id: t6
    hidden: true
    description: "Chain of exactly-1800 gaps - one long session of 7200 seconds (session length can exceed 1800)"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 1, 0), (2, 1, 1800), (3, 1, 3600), (4, 1, 5400), (5, 1, 7200);
    expected_rows: [[1, 1, 5, 7200]]
  - id: t7
    hidden: true
    description: "Interleaved users - gaps must be measured per user, not across the whole table"
    ordered: true
    setup_sql: |
      INSERT INTO page_views (id, user_id, viewed_at) VALUES
        (1, 2, 100), (2, 9, 150), (3, 2, 1000), (4, 9, 2000), (5, 2, 2500);
    expected_rows: [[2, 1, 3, 2400], [9, 2, 2, 0]]
  - id: t8
    hidden: true
    description: "Longest session is not the first or last; duplicates at one second"
    ordered: true
    setup_sql: |
