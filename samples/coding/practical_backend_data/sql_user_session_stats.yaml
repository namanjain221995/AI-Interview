expected_concepts:
  - "LAG over a per-user partition ordered by time with a deterministic tie-breaker"
  - "gap-and-island sessionisation with a running SUM of new-session flags"
  - "two-level aggregation: per session, then per user"
  - "inclusive versus exclusive thresholds (more than 1800 seconds)"
  - "window functions cannot be nested inside aggregates in the same SELECT"
optimal_complexity: {time: "O(n log n) for the per-user sort", space: O(n)}
rubric:
  excellent: "Flags session starts with LAG partitioned by user and ordered by (viewed_at, id), numbers sessions with a running SUM of the flags, aggregates per session and then per user, handles the exact 1800-second boundary and explains the gaps-and-islands pattern and why the aggregation needs separate CTE levels."
  good: "Correct query after a hint about the threshold, the per-user partition or the second aggregation level."
  weak: "Computes gaps across all users, counts sessions as views with a large gap but miscounts the first view, uses the overall first and last view as the session length, or tries to nest window functions inside aggregates."
  criteria:
    correctness: "All tests pass, including exact-threshold gaps, interleaved users, same-second views and the empty table."
    efficiency: "One ordered pass per user with window functions; mentions an index on (user_id, viewed_at)."
    code_quality: "Readable CTE pipeline (previous view, session flag, session number, per-session, per-user) with clear names."
    edge_cases: "Single view, all gaps above the threshold, chained gaps at exactly the threshold and duplicates at one second."
    communication: "Explains how a running sum turns start flags into session ids."
hints:
  - "First decide, view by view, whether it begins a new session; that only needs the same user's previous view."
  - "A window function can give each view the previous view time of the same user. Turn that into a one-or-zero flag for new sessions, and a running total of the flags then gives every view a session number within its user."
  - "Use LAG over a partition by user ordered by time and id to get the previous time, mark a start when it is missing or the gap is greater than 1800, take a cumulative SUM of the marks with the same partition and order to number the sessions, group by user and session number to get each session's view count and its maximum minus minimum time, and finally group by user to count sessions, add up views and take the largest length, ordered by user."
followups:
  - "How would you also report the median session length per user?"
  - "How would you make the 30-minute threshold configurable per product surface?"
  - "How would you compute sessions incrementally as new page views stream in?"
  - "Which index supports this query, and how would you partition the table for very large volumes?"
common_errors:
  - "Using greater-or-equal 1800 so an exact 30-minute gap wrongly starts a new session."
  - "Forgetting PARTITION BY user_id, so one user's view is compared with another user's."
  - "Ordering only by viewed_at, which makes the running sum non-deterministic for same-second views in some engines."
  - "Measuring the longest session as the user's last view minus first view overall."
  - "Nesting a window function inside SUM or MAX in the same query level."
