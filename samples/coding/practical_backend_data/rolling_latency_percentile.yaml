version: 1
slug: rolling_latency_percentile
title: Rolling Latency Percentile
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, backend, platform, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Rolling Latency Percentile

  A service dashboard plots a **rolling percentile** of request latency: after every new sample it
  shows, for example, the p99 of the last 1,000 requests. You are given the latency samples in
  arrival order and must produce the series the dashboard draws.

  Use the **nearest-rank** definition. For a window of `window` samples and a percentile `p`, sort the
  window's samples in ascending order (duplicates kept) and take the sample at **1-based rank**

  ```
  rank = ceil(p * window / 100)
  ```

  Return one value for every full window, from the window ending at index `window - 1` to the window
  ending at the last index, so the result has `n - window + 1` values.

  ### Example 1
  ```
  Input:  latencies = [120, 80, 95, 300, 110, 90, 400, 85], window = 4, percentile = 50
  Output: [95, 95, 95, 110, 90]
  Explanation: rank = ceil(50 * 4 / 100) = 2. The first window [120, 80, 95, 300] sorted is
  [80, 95, 120, 300], so its value is 95. The last window [110, 90, 400, 85] sorted is
  [85, 90, 110, 400], giving 90.
  ```

  ### Example 2
  ```
  Input:  latencies = [5, 1, 4, 2, 3], window = 3, percentile = 90
  Output: [5, 4, 4]
  Explanation: rank = ceil(2.7) = 3, the largest value of each window.
  ```

  ### Example 3
  ```
  Input:  latencies = [7, 3, 9], window = 1, percentile = 50
  Output: [7, 3, 9]
  ```

  ### Constraints
  - `1 <= latencies.length <= 10^5`
  - `0 <= latencies[i] <= 10^9`
  - `1 <= window <= latencies.length`
  - `1 <= percentile <= 100`
  - aim for better than sorting every window, which is `O(n * window log window)`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rolling_percentile
  params:
    - {name: latencies, type: "int[]"}
    - {name: window, type: int}
    - {name: percentile, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def rolling_percentile(latencies: list[int], window: int, percentile: int) -> list[int]:
        values = sorted(set(latencies))                 # coordinate compression
        position = {v: i + 1 for i, v in enumerate(values)}
        size = len(values)
        tree = [0] * (size + 1)                         # Fenwick tree of counts

        def add(i: int, delta: int) -> None:
            while i <= size:
                tree[i] += delta
                i += i & -i

        top_bit = 1
        while top_bit * 2 <= size:
            top_bit *= 2

        def kth(k: int) -> int:
            # Smallest compressed position whose prefix count reaches k.
            pos, bit = 0, top_bit
            while bit:
                nxt = pos + bit
                if nxt <= size and tree[nxt] < k:
                    pos = nxt
                    k -= tree[nxt]
                bit >>= 1
            return pos + 1

        rank = (percentile * window + 99) // 100        # exact integer ceil
        result: list[int] = []
        for i, value in enumerate(latencies):
            add(position[value], 1)
            if i >= window:
                add(position[latencies[i - window]], -1)
            if i >= window - 1:
                result.append(values[kth(rank) - 1])
        return result
  javascript: |
    function rollingPercentile(latencies, window, percentile) {
      const values = [...new Set(latencies)].sort((a, b) => a - b);
      const position = new Map(values.map((v, i) => [v, i + 1]));
      const size = values.length;
      const tree = new Array(size + 1).fill(0);
      const add = (i, delta) => {
        for (; i <= size; i += i & -i) tree[i] += delta;
      };
      let topBit = 1;
      while (topBit * 2 <= size) topBit *= 2;
      const kth = (k) => {
        let pos = 0;
        for (let bit = topBit; bit > 0; bit >>= 1) {
          const next = pos + bit;
          if (next <= size && tree[next] < k) {
            pos = next;
            k -= tree[next];
          }
        }
        return pos + 1;
      };
      const rank = Math.floor((percentile * window + 99) / 100);
      const result = [];
      for (let i = 0; i < latencies.length; i++) {
        add(position.get(latencies[i]), 1);
        if (i >= window) add(position.get(latencies[i - window]), -1);
        if (i >= window - 1) result.push(values[kth(rank) - 1]);
      }
      return result;
    }
