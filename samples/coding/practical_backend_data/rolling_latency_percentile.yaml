expected_concepts:
  - sliding window with insertions and deletions
  - order statistic (k-th smallest) queries
  - Fenwick tree over compressed values, or two heaps with lazy deletion, or an order-statistic tree
  - exact integer ceiling for the nearest rank
  - coordinate compression
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Derives the integer rank once, explains why re-sorting each window is too slow, and implements an O(n log n) structure (Fenwick tree with compressed values and a binary-lifting k-th query, two balanced heaps with lazy deletion, or a sorted multiset), handling duplicates and the window of 1 or n.
  good: Correct results with a sorted window maintained by binary search insertion and deletion (O(n * window) worst case), or a correct heap-based approach that needs help with lazy deletion.
  weak: Re-sorts every window without discussing the cost, computes the rank with floating point and gets off-by-one ranks, or removes the wrong duplicate when the window slides.
  criteria:
    correctness: All tests pass, including duplicates, p1 and p100, window 1 and window n, and exact rank boundaries.
    efficiency: O(log n) work per slide with a Fenwick tree, heaps or an order-statistic tree; the cost of simpler options is stated.
    code_quality: The window bookkeeping (add new sample, remove expired sample, query) is clearly separated.
    edge_cases: Equal values, extreme values, window equal to the input length and integer rank computation.
    communication: Compares the candidate data structures and their trade-offs for a live dashboard.
hints:
  - Compute the 1-based rank once with integer arithmetic; as the window slides, exactly one sample enters and one leaves, so you need a structure that supports insert, delete and "k-th smallest" quickly.
  - Keeping the window sorted with binary-search insertion works but each insert or delete still shifts elements; a counting structure indexed by value rank, or two heaps split at the rank with delayed removal, makes every step logarithmic.
  - Compress the distinct latencies to positions 1 to m, keep a Fenwick tree of how many samples of each position are in the window, add the new sample and subtract the expired one on each step, then find the smallest position whose prefix count reaches the rank by descending the tree from its highest power of two, and map it back to the latency.
followups:
  - How would you support several percentiles (p50, p95, p99) over the same window at once?
  - What changes if the window is defined by time (the last 60 seconds) rather than by count?
  - When would you accept an approximate answer, and which sketch (t-digest, HDR histogram) would you use?
  - How would you merge percentiles computed on several hosts?
common_errors:
  - Computing the rank as ceil(percentile / 100 * window) in floating point, which gives rank 8 instead of 7 for 7 percent of 100 samples.
  - Using a 0-based rank, or rounding to the nearest integer instead of up.
  - Removing every copy of the expired value from the window instead of one.
  - Re-sorting each window, which is O(n * window log window) and too slow for large windows.
