expected_concepts:
  - simulation with a running delay
  - capping before doubling to avoid overflow
  - 64-bit arithmetic for timestamps
  - inclusive deadline and attempt-count stopping conditions
optimal_complexity: {time: O(max_attempts), space: O(max_attempts) for the output}
rubric:
  excellent: Simulates with a running delay that is doubled and immediately capped, keeps every timestamp in 64-bit integers, checks the deadline before adding an attempt and explains why computing base times 2^(k-1) directly overflows.
  good: Correct schedule with a small boundary slip (deadline inclusive or the attempt count) fixed after running the tests.
  weak: Computes base times 2^(k-1) with a shift or power that overflows, forgets the attempt duration, or adds an attempt that starts after the deadline.
  criteria:
    correctness: All tests pass, including deadline 0, the inclusive deadline boundary and 70 attempts with a huge uncapped delay.
    efficiency: Linear in the number of attempts made.
    code_quality: Clear names for the running delay and next start; the two stop conditions are easy to read.
    edge_cases: Single attempt, base equal to cap, zero attempt time and a cap that is never reached.
    communication: Explains the overflow risk and why jitter is usually added in production.
hints:
  - Walk the attempts one at a time - each start time is the previous start plus the attempt duration plus the current delay.
  - Keep the current delay in a variable instead of recomputing a power of two each time, and decide where the cap and the deadline checks belong.
  - Start with the list containing 0 and a delay equal to the base; while fewer than max_attempts starts exist, compute the next start, stop if it exceeds the deadline, otherwise record it and set the delay to the minimum of the cap and twice the delay.
followups:
  - How would you add full jitter so that many clients do not retry in lockstep?
  - How would you pick base and cap values for a dependency with a 30-second timeout budget?
  - When should a client stop retrying regardless of the backoff policy (for example non-retryable status codes)?
common_errors:
  - Computing base_ms shifted left by k - 1 directly, which overflows 64-bit integers after a few dozen attempts.
  - Forgetting to add the attempt duration between attempts.
  - Treating the deadline as exclusive, or checking it after appending the attempt.
  - Using 32-bit integers for start times that exceed two billion milliseconds.
