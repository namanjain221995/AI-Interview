prompt_markdown: |
  ## Retry Schedule with Capped Exponential Backoff

  A payments client calls a flaky downstream service and retries with **capped exponential backoff**.
  To check the retry policy against the service's timeout budget, compute the exact moments at which
  the client would start each attempt if **every attempt fails**.

  - Attempt 1 starts at time `0`. Every attempt takes `attempt_ms` milliseconds before it fails.
  - After failed attempt `k` (1-based), the client waits `min(cap_ms, base_ms * 2^(k-1))` milliseconds
    and then starts attempt `k + 1`. So the delays are `base_ms`, `2 * base_ms`, `4 * base_ms`, ...
    until they reach `cap_ms`, and `cap_ms` from then on.
  - The client makes at most `max_attempts` attempts, and it never **starts** an attempt later than
    `deadline_ms` (an attempt starting exactly at `deadline_ms` is still made).

  Return the start times of all attempts that are made, in order. Attempt 1 is always made.

  With many attempts the uncapped value `base_ms * 2^(k-1)` grows far beyond 64 bits, so compute the
  delays without overflowing.

  ### Example 1
  ```
  Input:  base_ms = 100, cap_ms = 1000, attempt_ms = 50, max_attempts = 6, deadline_ms = 10000
  Output: [0, 150, 400, 850, 1700, 2750]
  Explanation: delays are 100, 200, 400, 800 and then the cap 1000; each gap adds the 50 ms attempt.
  ```

  ### Example 2
  ```
  Input:  base_ms = 500, cap_ms = 4000, attempt_ms = 200, max_attempts = 10, deadline_ms = 3000
  Output: [0, 700, 1900]
  Explanation: the fourth attempt would start at 1900 + 200 + 2000 = 4100, after the deadline.
  ```

  ### Constraints
  - `1 <= base_ms <= cap_ms <= 10^12`
  - `0 <= attempt_ms <= 10^9`
  - `1 <= max_attempts <= 1000`
  - `0 <= deadline_ms <= 10^15`
languages: [python, javascript, typescript, java, go, cpp]
