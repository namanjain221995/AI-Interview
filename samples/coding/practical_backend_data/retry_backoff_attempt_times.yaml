reference_solutions:
  python: |
    def retry_attempt_times(base_ms: int, cap_ms: int, attempt_ms: int, max_attempts: int,
                            deadline_ms: int) -> list[int]:
        starts = [0]
        delay = min(base_ms, cap_ms)
        while len(starts) < max_attempts:
            next_start = starts[-1] + attempt_ms + delay
            if next_start > deadline_ms:
                break
            starts.append(next_start)
            # Double, but never past the cap; delay <= cap_ms <= 10^12 so this cannot overflow.
            delay = min(cap_ms, delay * 2)
        return starts
  javascript: |
    function retryAttemptTimes(baseMs, capMs, attemptMs, maxAttempts, deadlineMs) {
      const starts = [0];
      let delay = Math.min(baseMs, capMs);
      while (starts.length < maxAttempts) {
        const nextStart = starts[starts.length - 1] + attemptMs + delay;
        if (nextStart > deadlineMs) break;
        starts.push(nextStart);
        delay = Math.min(capMs, delay * 2); // stays <= capMs, well inside exact double range
      }
      return starts;
    }
