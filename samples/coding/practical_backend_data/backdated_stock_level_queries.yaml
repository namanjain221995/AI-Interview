version: 1
slug: backdated_stock_level_queries
title: "Stock Levels with Backdated Movements"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, data_analyst, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Stock Levels with Backdated Movements

  A warehouse service records **stock movements** (receipts, picks, adjustments) per SKU. Scanners in the
  yard sync late, so a movement often reaches the service **after** movements that happened later in real
  time: each movement carries the `event_time` at which it physically happened, which may be earlier than
  movements already recorded. Auditors ask "what was the stock of this SKU at time `t`?" and want the answer
  **based on what the service has received so far**.

  You are given the operations in the order the service receives them. Each operation is a string with
  single-space-separated fields:

  - `"MOVE <sku> <event_time> <delta>"`: record a movement of `delta` units (negative for outgoing) that
    happened at `event_time`.
  - `"QUERY <sku> <t>"`: the answer is the sum of `delta` over all movements of that SKU **received before
    this query** whose `event_time <= t`. If there are none, the answer is `0`.

  SKUs are compared exactly (case-sensitive). Several movements may share an `event_time`. Stock may go
  negative (the counts are reconciled later). Write `answer_stock_queries(ops)` that returns the answers to
  the `QUERY` operations, in the order the queries appear.

  ### Example 1
  ```
  Input:  ops = ["MOVE WIDGET-7 100 50", "MOVE WIDGET-7 300 -20", "QUERY WIDGET-7 250", "MOVE WIDGET-7 200 -5", "QUERY WIDGET-7 250", "QUERY WIDGET-7 300"]
  Output: [50, 45, 25]
  Explanation: the first query sees only the receipt at 100 (the pick at 300 is later than 250). Then a
  backdated pick at 200 arrives, so the stock at 250 becomes 45, and at 300 it is 50 - 5 - 20 = 25.
  ```

  ### Example 2
  ```
  Input:  ops = ["QUERY BOLT-M4 10", "MOVE BOLT-M4 10 40", "MOVE NUT-M4 5 7", "QUERY BOLT-M4 10", "QUERY BOLT-M4 9", "QUERY WASHER-M4 100"]
  Output: [0, 40, 0, 0]
  Explanation: the first query comes before any movement was received. event_time 10 counts for t = 10 but
  not for t = 9. Movements of NUT-M4 never affect BOLT-M4, and WASHER-M4 has no movements at all.
  ```

  ### Constraints
  - `0 <= ops.length <= 10^5`
  - SKUs are 1 to 30 characters: letters, digits and `-`
  - `0 <= event_time, t <= 10^9`
  - `-10^9 <= delta <= 10^9`; answers fit in a signed 64-bit integer

  **Follow-up:** a linear scan per query is `O(n)` and the whole run `O(n^2)`. Can you answer every query in
  `O(log n)`, given that you may read all operations before answering?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: answer_stock_queries
  params:
    - {name: ops, type: "string[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left, bisect_right


    def answer_stock_queries(ops: list[str]) -> list[int]:
        parsed = [op.split() for op in ops]
        # offline pass: the distinct movement times of every SKU, sorted
        times: dict[str, list[int]] = {}
        for parts in parsed:
            if parts[0] == "MOVE":
                times.setdefault(parts[1], []).append(int(parts[2]))
        for sku in times:
            times[sku] = sorted(set(times[sku]))
        trees = {sku: [0] * (len(ts) + 1) for sku, ts in times.items()}  # one Fenwick tree per SKU

        answers: list[int] = []
        for parts in parsed:
            sku = parts[1]
            if parts[0] == "MOVE":
                tree, ts = trees[sku], times[sku]
                i = bisect_left(ts, int(parts[2])) + 1
                delta = int(parts[3])
                while i < len(tree):
                    tree[i] += delta
                    i += i & -i
            else:
                if sku not in times:
                    answers.append(0)
                    continue
                tree, ts = trees[sku], times[sku]
                i = bisect_right(ts, int(parts[2]))  # movements with event_time <= t
                total = 0
                while i > 0:
                    total += tree[i]
                    i -= i & -i
                answers.append(total)
        return answers
  javascript: |
    function answerStockQueries(ops) {
      const parsed = ops.map((op) => op.trim().split(/\s+/));
      const times = new Map(); // sku -> sorted distinct movement times
      for (const p of parsed) {
        if (p[0] === "MOVE") {
          if (!times.has(p[1])) times.set(p[1], []);
          times.get(p[1]).push(Number(p[2]));
        }
      }
      const trees = new Map();
      for (const [sku, ts] of times) {
        const uniq = [...new Set(ts)].sort((a, b) => a - b);
        times.set(sku, uniq);
        trees.set(sku, new Array(uniq.length + 1).fill(0));
      }
      // number of times <= t (upper bound)
      const upper = (ts, t) => {
        let lo = 0, hi = ts.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (ts[mid] <= t) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      const answers = [];
      for (const p of parsed) {
        const sku = p[1];
        const t = Number(p[2]);
        if (p[0] === "MOVE") {
          const tree = trees.get(sku);
          const delta = Number(p[3]);
          for (let i = upper(times.get(sku), t); i < tree.length; i += i & -i) tree[i] += delta;
        } else if (!times.has(sku)) {
          answers.push(0);
        } else {
          const tree = trees.get(sku);
          let total = 0;
          for (let i = upper(times.get(sku), t); i > 0; i -= i & -i) total += tree[i];
          answers.push(total);
        }
      }
      return answers;
    }
