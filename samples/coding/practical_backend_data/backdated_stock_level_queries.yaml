expected_concepts:
  - "prefix sums over time with point updates (dynamic prefix sums)"
  - "Fenwick tree (binary indexed tree) or segment tree"
  - "offline coordinate compression of event times per SKU"
  - "processing operations in arrival order so queries only see earlier movements"
  - "upper-bound binary search for an inclusive time limit"
  - "64-bit accumulation"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Reads all operations first to compress each SKU's movement times, keeps one Fenwick tree per SKU, applies movements and answers queries in arrival order with an upper-bound search for the inclusive limit, uses 64-bit sums, and explains why a sorted structure alone is not enough when movements are backdated."
  good: "Correct answers with a slower but reasoned structure, such as a sorted list per SKU with insertion and a prefix scan, or a single global Fenwick tree keyed by (sku, time) after a hint about compression."
  weak: "Scans every earlier movement for each query without discussing a faster approach, sorts all operations by time and so lets queries see later movements, or treats the time limit as exclusive."
  criteria:
    correctness: "All tests pass, including backdated movements, same-time movements, unknown SKUs, case-sensitive SKUs and large totals."
    efficiency: "O(log n) per operation after O(n log n) preprocessing; recognises the quadratic baseline."
    code_quality: "Parsing, compression and the Fenwick tree are separate and small; per-SKU state is grouped clearly."
    edge_cases: "No operations, a query before any movement, negative stock, time 0, the maximum time and SKUs that differ only by case."
    communication: "Explains the offline idea and why arrival order must still drive the simulation."
hints:
  - "Each query is a sum over one SKU's movements up to a time limit, but movements keep arriving with arbitrary times, so the set you are summing over changes between queries."
  - "You need a structure that supports adding a value at a time position and asking for the total up to a position, both quickly. Since you can read every operation before answering, you know all the time positions in advance for each SKU."
  - "First collect the distinct movement times of each SKU and sort them so every time maps to a small index. Then replay the operations in their original order with one Fenwick tree per SKU: a movement adds its delta at its time's index, and a query counts how many known times are at most t with a binary search and returns the tree's prefix sum up to that count, or zero for a SKU without movements."
followups:
  - "How would you answer the queries online, without reading the operations ahead of time?"
  - "How would you support a query for the total stock across all SKUs at time t?"
  - "In a real database, how would you model backdated movements so that stock-at-time queries stay fast?"
  - "How would you also report the earliest time at which a SKU's stock went negative?"
common_errors:
  - "Sorting all operations by event time, which lets a query see movements received after it."
  - "Using a strict comparison so a movement exactly at time t is excluded."
  - "Keeping a single running total per SKU, which ignores the time limit of the query."
  - "Accumulating in 32-bit integers and overflowing on large totals."
  - "Treating SKUs case-insensitively."
