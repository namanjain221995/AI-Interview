expected_concepts:
  - greedy sequential packing
  - two simultaneous limits (count and bytes)
  - skipping items that can never fit
  - flushing the final partial batch
optimal_complexity: {time: O(n), space: O(n) for the output}
rubric:
  excellent: Walks the records once, skips oversized ones before touching the batch, closes the batch when either limit would be broken, flushes the last batch and never emits an empty batch, explaining why the greedy order-preserving rule is required.
  good: Correct packing with a small slip such as an off-by-one on the inclusive byte limit or a missing final flush, fixed after running the tests.
  weak: Reorders records to pack tighter, emits empty batches, lets an oversized record close or join a batch, or only enforces one of the two limits.
  criteria:
    correctness: All tests pass, including all-oversized input, exact byte fits and max_items 1.
    efficiency: Single pass with constant work per record.
    code_quality: Tracks the current batch and its byte total with clear names; one place decides when to close a batch.
    edge_cases: Empty input, all records rejected, records exactly at max_bytes and oversized records in the middle.
    communication: Explains why reordering is not allowed and what a real client should do with rejected records.
hints:
  - Think of building one request at a time while walking the records, keeping track of how full it is in both dimensions.
  - Records too big to ever fit can be dropped before you look at the current batch. For the others, decide whether they still fit, or whether the batch must be closed first.
  - Keep the current list of indices and its byte total; for each acceptable record, if the batch is non-empty and adding it would exceed max_items or max_bytes, push the batch and reset; then append the record; after the loop push the batch only if it is non-empty.
followups:
  - How would you minimise the number of requests if reordering were allowed, and why is that much harder?
  - How would you report the rejected records back to the caller?
  - What would you change if the API also limited the number of requests per second?
common_errors:
  - Forgetting to send the final partial batch.
  - Emitting an empty batch when the first record is oversized or when every record is rejected.
  - Using a strict comparison so that a batch summing to exactly max_bytes is split.
  - Letting an oversized record close the current batch instead of simply skipping it.
