title: Pack Records into Bulk API Batches
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [backend, data, platform, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Pack Records into Bulk API Batches

  An export job pushes records to a search index through a bulk-ingest endpoint. Each request may carry
  **at most `max_items` records** and **at most `max_bytes` bytes** of payload in total. `sizes[i]` is
  the payload size of record `i`.

  Records must keep their relative order, so batches are built greedily:

  - Walk the records from index `0` upwards.
  - A record whose size alone is **greater than `max_bytes`** can never be sent; it is **rejected and
    skipped** (it does not close the current batch).
  - Otherwise, add the record to the current batch if the batch would still have at most `max_items`
    records and at most `max_bytes` bytes. If not, close the current batch and start a new one with
    this record.

  Return the batches in the order they are sent, each as the list of **original indices** of its
  records. If no record is accepted, return `[]`.

  ### Example 1
  ```
  Input:  sizes = [400, 300, 500, 200, 900, 100], max_items = 3, max_bytes = 1000
  Output: [[0, 1], [2, 3], [4, 5]]
  Explanation: 400 + 300 + 500 would exceed 1000 bytes, so record 2 starts a new batch; 900 + 100 fits
  exactly.
  ```

  ### Example 2
  ```
  Input:  sizes = [10, 2000, 10, 10, 10], max_items = 2, max_bytes = 100
  Output: [[0, 2], [3, 4]]
  Explanation: record 1 is larger than max_bytes and is skipped; batches hold at most 2 records.
  ```

  ### Constraints
  - `0 <= sizes.length <= 10^5`
  - `1 <= sizes[i] <= 10^6`
  - `1 <= max_items <= 10^4`
  - `1 <= max_bytes <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: pack_batches
  params:
    - {name: sizes, type: "int[]"}
    - {name: max_items, type: int}
    - {name: max_bytes, type: int}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def pack_batches(sizes: list[int], max_items: int, max_bytes: int) -> list[list[int]]:
        batches: list[list[int]] = []
        current: list[int] = []
        current_bytes = 0
        for index, size in enumerate(sizes):
            if size > max_bytes:
                continue  # can never be sent
            if current and (len(current) == max_items or current_bytes + size > max_bytes):
                batches.append(current)
                current, current_bytes = [], 0
            current.append(index)
            current_bytes += size
        if current:
            batches.append(current)
        return batches
  javascript: |
    function packBatches(sizes, maxItems, maxBytes) {
      const batches = [];
      let current = [];
      let currentBytes = 0;
      sizes.forEach((size, index) => {
        if (size > maxBytes) return; // can never be sent
        if (current.length > 0 && (current.length === maxItems || currentBytes + size > maxBytes)) {
          batches.push(current);
          current = [];
          currentBytes = 0;
        }
        current.push(index);
        currentBytes += size;
      });
      if (current.length > 0) batches.push(current);
      return batches;
    }
