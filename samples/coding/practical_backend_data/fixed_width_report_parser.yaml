expected_concepts:
  - "slicing strings by cumulative column offsets"
  - "treating missing characters as padding"
  - "trimming only spaces while keeping inner content"
  - "skipping blank records"
optimal_complexity: {time: "O(total characters read)", space: "O(output size)"}
rubric:
  excellent: "Walks the widths with a running offset, slices safely past the end of short lines, trims only surrounding spaces, skips blank lines but keeps non-blank rows with empty fields, and explains each rule with an example."
  good: "Correct parser that needs a nudge on short lines, overflow past the total width or rows whose fields are all empty."
  weak: "Splits on whitespace instead of fixed widths, crashes on short lines, trims inner spaces, or skips lines whose fields happen to be empty."
  criteria:
    correctness: "All tests pass, including short lines, overflow and blank lines."
    efficiency: "Each line is sliced once per column; no repeated rescans."
    code_quality: "The running offset is explicit and the blank-line rule is a single clear check."
    edge_cases: "Empty input, all-blank input, width-1 columns, lines ending inside a column and characters beyond the total width."
    communication: "Clarifies the difference between a blank line and a line whose fields are empty."
hints:
  - "Splitting on spaces cannot work for fixed-width data, because fields may contain spaces or touch each other; positions are what define a column."
  - "Keep a running start position: each column is the slice from that position of the given width, and the position then advances by the width. Think about what slicing does past the end of a short line."
  - "Skip a line when it contains nothing but spaces; otherwise, for each width take the slice from the current offset of that width (an out-of-range slice is empty or shorter), strip spaces from both ends of it, add it to the row and advance the offset by the width."
followups:
  - "How would you report a line that is longer than the total width instead of silently ignoring the extra characters?"
  - "How would you convert the amount column to a number and flag rows where it is not valid?"
  - "How would you infer the column widths automatically from a header line?"
common_errors:
  - "Splitting each line on whitespace, which breaks names with spaces and fields that touch."
  - "Indexing past the end of a short line and crashing instead of treating the rest as spaces."
  - "Trimming all whitespace inside a field instead of only the surrounding spaces."
  - "Skipping a non-blank line just because all of its fields are empty after trimming."
