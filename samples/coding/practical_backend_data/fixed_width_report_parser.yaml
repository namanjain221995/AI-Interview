slug: fixed_width_report_parser
title: "Parse a Fixed-Width Legacy Export"
difficulty: easy
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [backend, data, business_analyst, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Parse a Fixed-Width Legacy Export

  A decades-old billing system can only export its reports as fixed-width text: every column occupies a
  set number of characters, padded with spaces. The integration team is replacing a brittle spreadsheet
  macro with a small parser.

  Write `parse_fixed_width(lines, widths)`:

  - Column `c` of a line is the slice of `widths[c]` characters that starts right after the previous
    columns, so the first column is characters `0` to `widths[0] - 1`, the second starts at
    `widths[0]`, and so on.
  - A line **shorter** than the total width is treated as if it were padded with spaces at the end.
    Characters **beyond** the total width are ignored.
  - Each field is returned with its leading and trailing **spaces** removed (inner spaces are kept).
  - Lines that are empty or contain only spaces are **skipped**. Every other line produces one row, even
    if all of its fields come out empty.

  Return one list of fields per remaining line, in input order, or `[]` when no line remains.

  ### Example 1
  ```
  Input:  lines = ["INV-0001  ACME LTD    120.50", "INV-0002  Globex       9.99"], widths = [10, 12, 6]
  Output: [["INV-0001", "ACME LTD", "120.50"], ["INV-0002", "Globex", "9.99"]]
  Explanation: widths 10 + 12 + 6 split each line into invoice, customer and amount
  ```

  ### Example 2
  ```
  Input:  lines = ["A1  north", "", "B22 so", "    ", "C3  east  EXTRA"], widths = [4, 6]
  Output: [["A1", "north"], ["B22", "so"], ["C3", "east"]]
  Explanation: "B22 so" is shorter than 10 characters; "EXTRA" lies beyond the total width
  ```

  ### Example 3
  ```
  Input:  lines = ["  X", "AB"], widths = [2, 3, 2]
  Output: [["", "X", ""], ["AB", "", ""]]
  Explanation: "  X" is not blank, its first column is empty; "AB" leaves the last two columns empty
  ```

  ### Constraints
  - `0 <= lines.length <= 10^4`
  - `0 <= lines[i].length <= 500`
  - `1 <= widths.length <= 50`, `1 <= widths[c] <= 100`
  - Lines consist of printable ASCII characters (no tabs or line breaks)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parse_fixed_width
  params:
    - {name: lines, type: "string[]"}
    - {name: widths, type: "int[]"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def parse_fixed_width(lines: list[str], widths: list[int]) -> list[list[str]]:
        rows: list[list[str]] = []
        for line in lines:
            if line.strip(" ") == "":
                continue
            row: list[str] = []
            pos = 0
            for width in widths:
                # slicing past the end of a short line simply yields fewer (or no) characters
                row.append(line[pos:pos + width].strip(" "))
                pos += width
            rows.append(row)
        return rows
  javascript: |
    function parseFixedWidth(lines, widths) {
      const rows = [];
      for (const line of lines) {
        if (line.replace(/ /g, "") === "") continue;
        const row = [];
        let pos = 0;
        for (const width of widths) {
          row.push(line.slice(pos, pos + width).replace(/^ +| +$/g, ""));
          pos += width;
        }
        rows.push(row);
      }
      return rows;
    }
