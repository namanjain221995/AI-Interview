reference_solutions:
  python: |
    def sibling_values(writes: list[list[str]]) -> list[list[str]]:
        def parse(clock: str) -> dict[str, int]:
            vec: dict[str, int] = {}
            if clock:
                for part in clock.split(","):
                    replica, counter = part.split(":")
                    if int(counter) > 0:
                        vec[replica] = int(counter)
            return vec

        def dominated(a: dict[str, int], b: dict[str, int]) -> bool:
            # a happened before b: a <= b in every component and the clocks differ.
            if a == b:
                return False
            return all(b.get(replica, 0) >= counter for replica, counter in a.items())

        by_key: dict[str, list[tuple[str, dict[str, int]]]] = {}
        for key, value, clock in writes:
            by_key.setdefault(key, []).append((value, parse(clock)))

        result: list[list[str]] = []
        for key in sorted(by_key):
            entries = by_key[key]
            survivors = {
                value
                for value, vec in entries
                if not any(dominated(vec, other) for _, other in entries)
            }
            result.append([key, *sorted(survivors)])
        return result
  javascript: |
    function siblingValues(writes) {
      const parse = (clock) => {
        const vec = new Map();
        if (clock.length > 0) {
          for (const part of clock.split(",")) {
            const [replica, counter] = part.split(":");
            const n = Number(counter);
            if (n > 0) vec.set(replica, n);
          }
        }
        return vec;
      };
      // a happened before b: a <= b in every component and the clocks differ.
      const dominated = (a, b) => {
        let equal = a.size === b.size;
        for (const [replica, counter] of a) {
          const other = b.get(replica) || 0;
          if (other < counter) return false;
          if (other !== counter) equal = false;
        }
        return !equal;
      };
      const byKey = new Map();
      for (const [key, value, clock] of writes) {
        if (!byKey.has(key)) byKey.set(key, []);
        byKey.get(key).push([value, parse(clock)]);
      }
      const keys = [...byKey.keys()].sort();
      return keys.map((key) => {
        const entries = byKey.get(key);
        const survivors = new Set();
        for (const [value, vec] of entries) {
          if (!entries.some(([, other]) => dominated(vec, other))) survivors.add(value);
        }
        return [key, ...[...survivors].sort()];
      });
    }
