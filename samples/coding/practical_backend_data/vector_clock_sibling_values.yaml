  - {id: t1, args: [[["cart:42", "apples", "a:1"], ["cart:42", "apples,pears", "a:2"], ["cart:42", "apples,plums", "a:1,b:1"], ["profile:7", "dark", "b:3"], ["profile:7", "light", "b:2"]]], expected: [["cart:42", "apples,pears", "apples,plums"], ["profile:7", "dark"]], description: "Example 1 - one overwritten value, two concurrent siblings"}
  - {id: t2, args: [[["flag", "on", "x:1,y:0"], ["flag", "on", "x:1"], ["flag", "off", "y:1"], ["banner", "spring", ""]]], expected: [["banner", "spring"], ["flag", "off", "on"]], description: "Example 2 - zero counter equals a missing replica, duplicates collapse, empty clock"}
  - {id: t3, hidden: true, args: [[]], expected: [], description: "No writes at all returns an empty list"}
  - {id: t4, hidden: true, args: [[["k", "v", "r1:5"]]], expected: [["k", "v"]], description: "Single write survives"}
  - {id: t5, hidden: true, args: [[["k", "v1", "a:1"], ["k", "v2", "a:1,b:1"], ["k", "v3", "a:2,b:1"], ["k", "v4", "a:2,b:1,c:1"], ["k", "v5", "a:3,b:1,c:1"]]], expected: [["k", "v5"]], description: "Causal chain - only the newest write survives even though new replicas appear along the way"}
  - {id: t6, hidden: true, args: [[["k", "x", "a:1"], ["k", "x", "b:1"], ["k", "y", ""], ["k", "x", "a:1"]]], expected: [["k", "x"]], description: "Same value in two concurrent writes is listed once; the empty clock is dominated"}
  - {id: t7, hidden: true, args: [[["k", "blue", "a:2,b:1"], ["k", "green", "a:2,b:1"], ["k", "red", "b:1,a:2"], ["k", "gray", "a:1,b:1"]]], expected: [["k", "blue", "green", "red"]], description: "Identical clocks with different values are all kept (neither dominates); replica order in the clock string does not matter"}
  - {id: t8, hidden: true, args: [[["user:9", "b", "n1:1"], ["user:10", "a", "n1:1"], ["User:1", "c", "n1:1"], ["user:9", "d", "n1:1,n2:0"], ["user:9", "e", "n2:1"]]], expected: [["User:1", "c"], ["user:10", "a"], ["user:9", "b", "d", "e"]], description: "Rows sorted by key in plain character order (uppercase first, 'user:10' before 'user:9'); duplicate clock with another value kept"}
  - {id: t9, hidden: true, args: [[["metric", "low", "r1:999999999,r2:1000000000"], ["metric", "high", "r1:1000000000,r2:1000000000"], ["metric", "side", "r1:1,r2:1,r3:1"]]], expected: [["metric", "high", "side"]], description: "Counters near 10^9 compared numerically, not as strings; third replica makes a concurrent sibling"}
  - {id: t10, hidden: true, args: [[["k", "v0", "a:0,b:6"], ["k", "v1", "a:1,b:5"], ["k", "v2", "a:2,b:4"], ["k", "v3", "a:3,b:3"], ["k", "v4", "a:4,b:2"], ["k", "v5", "a:5,b:1"], ["k", "v6", "a:6,b:0"], ["k", "old0", "a:0"], ["k", "old1", "a:1"], ["k", "old2", "a:2"], ["k", "old3", "a:3"], ["k", "old4", "a:4"], ["k", "older", "b:5"], ["k", "oldest", ""]]], expected: [["k", "v0", "v1", "v2", "v3", "v4", "v5", "v6"]], description: "Seven mutually concurrent writes plus seven dominated ones - all antichain values survive"}
expected_concepts:
  - parsing a vector clock into a map with missing replicas treated as zero
  - partial order (happened-before) versus concurrency
  - grouping writes by key
  - keeping the maximal elements of each group
  - de-duplicating and sorting the surviving values
optimal_complexity: {time: "O(sum over keys of m^2 * r) where m is the writes for a key and r the replicas per clock", space: O(n * r)}
rubric:
  excellent: Parses clocks into maps with zero defaults, defines dominance precisely (less than or equal everywhere and not equal), groups by key, keeps the maximal writes, de-duplicates and sorts values and keys, and discusses the quadratic per-key cost and how equal clocks are handled.
  good: Correct grouping and dominance check with minor prompting about zero counters, equal clocks or de-duplication.
  weak: Compares clocks as strings, keeps only the write with the largest counter sum, treats equal clocks as superseding each other, or ignores replicas missing from one clock.
  criteria:
    correctness: All tests pass, including equal clocks, zero counters, duplicate values and large counters.
    efficiency: Pairwise comparison within each key only, never across keys; clocks parsed once per write.
    code_quality: Separate helpers for parsing a clock and testing dominance; clear names.
    edge_cases: Empty input, empty clocks, replicas missing from one side, explicit zero counters and identical clocks with different values.
    communication: Explains happened-before versus concurrent and why a sibling set is needed.
hints:
  - Turn each clock string into a map from replica to counter, and treat any replica that is missing as having counter zero.
  - A write survives when no other write to the same key is at least as large in every component while being a different clock; the surviving writes are the maximal elements of each key's group.
  - Group writes by key, compare every write with every other write of its key using the "less than or equal everywhere and not equal" test (dropping zero counters makes equal clocks compare as equal maps), collect the surviving values in a set, then sort the values and the keys before building the rows.
followups:
  - How would you shrink the sibling set when a client writes back a merged value?
  - Clocks can grow with every replica that ever touched a key; how would you prune them safely?
  - How would you speed up the check if a key had tens of thousands of concurrent writes?
  - How do vector clocks differ from last-writer-wins timestamps, and what does each lose?
common_errors:
  - Comparing clocks as strings or by the sum of their counters instead of component by component.
  - Forgetting that a missing replica counts as zero, so "a:2,b:0" and "a:2" are treated as different.
  - Treating two equal clocks as superseding each other, which drops both values.
  - Comparing writes across different keys.
  - Returning duplicate values or forgetting to sort values and keys.
