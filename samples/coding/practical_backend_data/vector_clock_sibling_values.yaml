slug: vector_clock_sibling_values
title: Concurrent Writes Under Vector Clocks
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, platform, sre, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Concurrent Writes Under Vector Clocks

  A replicated key-value store accepts writes on several replicas at once. Each write carries a
  **vector clock** that records how many updates from every replica the writer had already seen.
  When a client reads a key, the store must return every value that has not been superseded, so the
  client can merge conflicting versions itself.

  Each write is `[key, value, clock]`. The clock is a comma-separated list of `replica:counter`
  entries such as `"a:3,b:1"`; the empty string `""` is a valid clock. A replica that is not listed
  has counter `0`, so `"a:2,b:0"` and `"a:2"` are the same clock, and the entry order in the string
  does not matter.

  For two writes to the **same key**, write `X` is **superseded** by write `Y` when every counter of
  `X` is less than or equal to the matching counter of `Y` and the two clocks are not equal. Writes
  whose clocks are equal, or where each has a larger counter somewhere (concurrent writes), do not
  supersede each other.

  For each key, keep the values of all writes that are not superseded by any other write to that key.
  Return one row per key: `[key, value1, value2, ...]`, where the values are **distinct** and sorted
  in ascending character order. Sort the rows by `key` in ascending character order (plain character
  code comparison, so uppercase letters sort before lowercase ones).

  ### Example 1
  ```
  Input:  writes = [["cart:42", "apples", "a:1"],
                    ["cart:42", "apples,pears", "a:2"],
                    ["cart:42", "apples,plums", "a:1,b:1"],
                    ["profile:7", "dark", "b:3"],
                    ["profile:7", "light", "b:2"]]
  Output: [["cart:42", "apples,pears", "apples,plums"], ["profile:7", "dark"]]
  Explanation: "apples" (a:1) is superseded by both later writes. "a:2" and "a:1,b:1" are
  concurrent, so both values survive. For profile:7, b:2 is superseded by b:3.
  ```

  ### Example 2
  ```
  Input:  writes = [["flag", "on", "x:1,y:0"],
                    ["flag", "on", "x:1"],
                    ["flag", "off", "y:1"],
                    ["banner", "spring", ""]]
  Output: [["banner", "spring"], ["flag", "off", "on"]]
  Explanation: "x:1,y:0" equals "x:1", so the two "on" writes collapse into one value. "x:1" and
  "y:1" are concurrent. A key with a single write keeps it, whatever its clock.
  ```

  ### Constraints
  - `0 <= writes.length <= 2000`, and every key has at most 300 writes
  - `writes[i].length == 3`; keys and values are non-empty strings of printable ASCII characters
  - replica ids are non-empty strings of lowercase letters and digits, listed at most once per clock
  - `0 <= counter <= 10^9`, written in decimal without leading zeros
  - at most 10 replicas appear in one clock
languages: [python, javascript, typescript, java, go, cpp]
