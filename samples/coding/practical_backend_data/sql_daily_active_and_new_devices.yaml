version: 1
slug: sql_daily_active_and_new_devices
title: "Rolling 7-Day Active and New Devices (SQL)"
difficulty: hard
competency_keys: [sql, databases]
role_tags: [data, data_analyst, backend, product_manager]
time_limit_minutes: 30
prompt_markdown: |
  ## Rolling 7-Day Active and New Devices

  An IoT fleet dashboard tracks how many devices are reporting in. Every check-in a device sends is stored
  as one row. To keep the query free of vendor-specific date functions, days are stored as **integer day
  numbers** (day `19000` is followed by day `19001`).

  Table `device_events`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | device_id | VARCHAR(40) | a device can check in many times, also several times on one day |
  | day | INTEGER | day number of the check-in |

  Produce one row for **every day from the first to the last day that appears in the table, inclusive**,
  including days on which no device checked in. For each day `d` return:

  - `day`: the day number `d`;
  - `active_7d`: the number of **distinct** devices with at least one event on a day in `[d - 6, d]`
    (the seven days ending on `d`, both ends included);
  - `new_devices`: the number of devices whose **first-ever** event is on day `d`.

  Order the rows by `day` ascending. If the table is empty, return no rows.

  Write standard SQL that runs on both PostgreSQL and SQLite (a recursive common table expression is
  allowed; avoid date functions).

  ### Example 1
  ```
  device_events
  +----+-----------+-----+
  | id | device_id | day |
  +----+-----------+-----+
  | 1  | thermo-a  | 1   |
  | 2  | thermo-b  | 1   |
  | 3  | thermo-a  | 2   |
  | 4  | thermo-c  | 4   |
  | 5  | thermo-a  | 4   |
  | 6  | thermo-b  | 8   |
  | 7  | thermo-d  | 9   |
  +----+-----------+-----+

  Output
  +-----+-----------+-------------+
  | day | active_7d | new_devices |
  +-----+-----------+-------------+
  | 1   | 2         | 2           |
  | 2   | 2         | 0           |
  | 3   | 2         | 0           |
  | 4   | 3         | 1           |
  | 5   | 3         | 0           |
  | 6   | 3         | 0           |
  | 7   | 3         | 0           |
  | 8   | 3         | 0           |
  | 9   | 4         | 1           |
  +-----+-----------+-------------+
  Day 3 has no events but still appears. On day 8 the window is [2, 8]: thermo-a (days 2 and 4),
  thermo-c (day 4) and thermo-b (day 8); thermo-b is not new because it first appeared on day 1.
  ```

  ### Example 2
  ```
  device_events
  +----+-----------+-----+
  | id | device_id | day |
  +----+-----------+-----+
  | 1  | cam-1     | 20  |
  | 2  | cam-1     | 20  |
  | 3  | cam-2     | 22  |
  | 4  | cam-1     | 21  |
  +----+-----------+-----+

  Output
  +-----+-----------+-------------+
  | day | active_7d | new_devices |
  +-----+-----------+-------------+
  | 20  | 1         | 1           |
  | 21  | 1         | 0           |
  | 22  | 2         | 1           |
  +-----+-----------+-------------+
  cam-1 checks in twice on day 20 but is one device.
  ```

  ### Constraints
  - The table may be empty; `0 <= day <= 100000` and the last day minus the first day is at most `3650`.
languages: [sql]
starter_code:
  sql: |
    -- One row per day from the first to the last event day: day, active_7d, new_devices.
    SELECT day, COUNT(DISTINCT device_id) AS active_7d, 0 AS new_devices
    FROM device_events
    GROUP BY day
    ORDER BY day;
reference_solutions:
  sql: |
    WITH RECURSIVE bounds AS (
      SELECT MIN(day) AS first_day, MAX(day) AS last_day FROM device_events
    ),
    calendar (day) AS (
      SELECT first_day FROM bounds WHERE first_day IS NOT NULL
      UNION ALL
      SELECT c.day + 1 FROM calendar c, bounds b WHERE c.day < b.last_day
    ),
    first_seen AS (
      SELECT device_id, MIN(day) AS first_day FROM device_events GROUP BY device_id
    )
    SELECT c.day,
           (SELECT COUNT(DISTINCT e.device_id)
              FROM device_events e
             WHERE e.day BETWEEN c.day - 6 AND c.day) AS active_7d,
           (SELECT COUNT(*) FROM first_seen f WHERE f.first_day = c.day) AS new_devices
    FROM calendar c
    ORDER BY c.day;
sql_setup: |
  CREATE TABLE device_events (
    id INTEGER PRIMARY KEY,
    device_id VARCHAR(40) NOT NULL,
    day INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - days without events (3, 5-7) still appear; a device returning on day 8 is not new"
    ordered: true
    setup_sql: |
      INSERT INTO device_events (id, device_id, day) VALUES
        (1, 'thermo-a', 1), (2, 'thermo-b', 1), (3, 'thermo-a', 2), (4, 'thermo-c', 4),
        (5, 'thermo-a', 4), (6, 'thermo-b', 8), (7, 'thermo-d', 9);
    expected_rows: [[1, 2, 2], [2, 2, 0], [3, 2, 0], [4, 3, 1], [5, 3, 0], [6, 3, 0], [7, 3, 0], [8, 3, 0], [9, 4, 1]]
  - id: t2
    description: "Example 2 - duplicate events on one day count a device once; events inserted out of day order"
    ordered: true
    setup_sql: |
      INSERT INTO device_events (id, device_id, day) VALUES
        (1, 'cam-1', 20), (2, 'cam-1', 20), (3, 'cam-2', 22), (4, 'cam-1', 21);
    expected_rows: [[20, 1, 1], [21, 1, 0], [22, 2, 1]]
