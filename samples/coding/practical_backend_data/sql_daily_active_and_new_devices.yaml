expected_concepts:
  - "generating a dense calendar with WITH RECURSIVE between MIN and MAX day"
  - "COUNT(DISTINCT ...) over a sliding range of days"
  - "first-seen day per device with GROUP BY and MIN"
  - "LEFT JOIN or correlated subqueries so empty days keep zero counts"
  - "handling an empty table without producing a NULL row"
  - "why a window frame cannot count distinct values directly"
optimal_complexity: {time: "O(D * n) for the straightforward correlated form, O((D + n) log n) with pre-aggregated device-days", space: "O(D + n)"}
rubric:
  excellent: "Generates the calendar with a recursive CTE guarded against the empty table, computes first-seen days once, counts distinct devices in the inclusive seven-day range for every calendar day, explains why COUNT(DISTINCT) cannot be used as a window function in most databases and suggests de-duplicating to device-days first for performance."
  good: "Correct query after a hint about missing days, the inclusive window bounds or duplicate events."
  weak: "Groups only by days that have events so empty days disappear, counts events instead of distinct devices, or uses a seven-row window frame that counts rows rather than days."
  criteria:
    correctness: "All tests pass, including days without events, duplicate check-ins, returning devices and the empty table."
    efficiency: "Avoids recomputing the first-seen day per row; mentions reducing events to distinct (device, day) pairs and indexing day."
    code_quality: "Named CTEs for bounds, calendar and first-seen days; clear output column aliases."
    edge_cases: "Empty table, single event, long gaps, the boundary day d - 6 and many new devices on one day."
    communication: "Explains why a ROWS frame over days with events is not the same as a seven-day range."
hints:
  - "The output must contain days that have no events at all, so the rows cannot come from grouping the events table; you need a separate list of days."
  - "Build that list of days with a recursive common table expression running from the minimum to the maximum day, then for each day count devices in the seven-day range and, separately, devices whose earliest day equals it."
  - "Use one CTE for the min and max day (adding nothing when the table is empty), a recursive CTE that starts at the minimum and adds one until the maximum, and a CTE of each device's minimum day. For every calendar day, count distinct device ids among events whose day is between the calendar day minus six and the calendar day, count first-seen rows equal to the calendar day, and order by day."
followups:
  - "How would you change the query to report 30-day active devices as well, without scanning the table twice?"
  - "Which index or pre-aggregated table would make this fast on billions of events?"
  - "How would you compute the number of devices that churned (active in the previous seven days but not in the current seven)?"
  - "How would the query change if days were real DATE values in PostgreSQL?"
common_errors:
  - "Grouping by the event day only, so days without events are missing."
  - "Counting events rather than distinct devices in the window."
  - "Using an off-by-one window such as [d - 7, d] or [d - 6, d) instead of seven days ending on d."
  - "Using a ROWS BETWEEN 6 PRECEDING window over grouped days, which spans more than seven days when days are missing."
  - "Seeding the recursive CTE with a NULL day when the table is empty."
