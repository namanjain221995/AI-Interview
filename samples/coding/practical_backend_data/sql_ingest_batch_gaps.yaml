expected_concepts:
  - gaps-and-islands pattern
  - LEAD or LAG window function partitioned by source
  - removing duplicates before comparing neighbours
  - inclusive range arithmetic
  - deterministic ORDER BY
optimal_complexity: {time: "O(n log n) for the per-source sort", space: O(n)}
rubric:
  excellent: De-duplicates batch numbers, compares each number with the next one per source using LEAD (or a correlated MIN of larger numbers), emits gap_start = current + 1 and gap_end = next - 1 when the difference exceeds one, orders deterministically and explains why generating every missing number is a bad idea for large gaps.
  good: Correct result with a hint about duplicates, the inclusive bounds or partitioning by source.
  weak: Returns only per-source min and max, generates a row per missing number, compares neighbours across sources, or reports zero-length gaps caused by duplicates.
  criteria:
    correctness: All tests pass, including duplicates, single-number gaps, huge gaps and several sources.
    efficiency: One window pass over distinct rows; no number series or self-join per number.
    code_quality: Named CTEs and clear arithmetic for the inclusive bounds.
    edge_cases: Empty table, single-batch sources, re-ingested duplicates and batch numbers starting at 0.
    communication: Names the gaps-and-islands pattern and contrasts it with generating a full number series.
hints:
  - A gap shows up between two recorded numbers that are next to each other in sorted order but differ by more than one.
  - For each source, look at every distinct batch number together with the next larger one; a window function partitioned by source and ordered by batch number gives you that neighbour without a self-join.
  - Remove duplicates with DISTINCT on source and batch number, attach the next number with LEAD over a partition by source ordered by batch number, keep rows where the next number is more than one larger, output current plus one and next minus one as the inclusive range, and order by source then gap start.
followups:
  - How would you return the islands (present ranges) instead of the gaps?
  - How would you also flag missing batches after the largest number when you know the expected latest batch per source?
  - How would you write this without window functions?
  - Which index helps this query on a table with hundreds of millions of rows?
common_errors:
  - Comparing neighbours without removing duplicates, so a repeated batch looks like a gap of length zero or hides a real gap.
  - Forgetting to partition by source, which creates gaps between the last batch of one source and the first of the next.
  - Off-by-one bounds, such as returning the present numbers instead of the first and last missing ones.
  - Generating every integer between min and max, which is far too slow for large gaps.
