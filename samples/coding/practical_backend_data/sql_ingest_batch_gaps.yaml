version: 1
slug: sql_ingest_batch_gaps
title: Missing Batch Number Ranges (SQL)
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data, dba, backend, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Missing Batch Number Ranges

  Upstream systems deliver data in numbered batches, and each source numbers its own batches
  `..., 41, 42, 43, ...` without skipping. The ingestion service records every batch it loaded in
  table `ingested_batches`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | source | VARCHAR(40) | lowercase source name |
  | batch_no | INTEGER | batch number, `>= 0` |

  When a batch is re-ingested after a retry, the same `(source, batch_no)` appears more than once.

  For each source, find every range of batch numbers that is **missing** between the source's
  smallest and largest recorded `batch_no`. Return one row per maximal missing range with columns
  `source`, `gap_start` and `gap_end` (both **inclusive**), ordered by `source` ascending and then by
  `gap_start` ascending. Numbers below a source's smallest or above its largest batch are not gaps,
  and a source without gaps produces no rows.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  ingested_batches
  +----+---------+----------+
  | id | source  | batch_no |
  +----+---------+----------+
  | 1  | billing | 1        |
  | 2  | billing | 2        |
  | 3  | billing | 3        |
  | 4  | billing | 6        |
  | 5  | billing | 7        |
  | 6  | billing | 10       |
  | 7  | crm     | 5        |
  | 8  | crm     | 5        |
  | 9  | crm     | 6        |
  | 10 | crm     | 9        |
  | 11 | ledger  | 4        |
  +----+---------+----------+

  Output
  +---------+-----------+---------+
  | source  | gap_start | gap_end |
  +---------+-----------+---------+
  | billing | 4         | 5       |
  | billing | 8         | 9       |
  | crm     | 7         | 8       |
  +---------+-----------+---------+
  ```

  ### Example 2
  ```
  ingested_batches
  +----+--------+----------+
  | id | source | batch_no |
  +----+--------+----------+
  | 1  | orders | 3        |
  | 2  | orders | 4        |
  | 3  | orders | 4        |
  | 4  | orders | 5        |
  +----+--------+----------+

  Output: no rows (3, 4 and 5 are all present; the duplicate 4 is a retry).
  ```
languages: [sql]
starter_code:
  sql: |
    -- Return source, gap_start and gap_end for every missing range of batch numbers,
    -- ordered by source, then gap_start.
    SELECT source, MIN(batch_no) AS gap_start, MAX(batch_no) AS gap_end
    FROM ingested_batches
    GROUP BY source
    ORDER BY source;
reference_solutions:
  sql: |
    WITH distinct_batches AS (
      SELECT DISTINCT source, batch_no
      FROM ingested_batches
    ),
    with_next AS (
      SELECT source,
             batch_no,
             LEAD(batch_no) OVER (PARTITION BY source ORDER BY batch_no) AS next_no
      FROM distinct_batches
    )
    SELECT source, batch_no + 1 AS gap_start, next_no - 1 AS gap_end
    FROM with_next
    WHERE next_no > batch_no + 1
    ORDER BY source, gap_start;
sql_setup: |
  CREATE TABLE ingested_batches (
    id INTEGER PRIMARY KEY,
    source VARCHAR(40) NOT NULL,
    batch_no INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - two gaps in one source, a duplicate batch, a source with one batch"
    setup_sql: |
      INSERT INTO ingested_batches (id, source, batch_no) VALUES
        (1, 'billing', 1), (2, 'billing', 2), (3, 'billing', 3), (4, 'billing', 6), (5, 'billing', 7), (6, 'billing', 10), (7, 'crm', 5), (8, 'crm', 5), (9, 'crm', 6), (10, 'crm', 9), (11, 'ledger', 4);
    expected_rows: [["billing", 4, 5], ["billing", 8, 9], ["crm", 7, 8]]
    ordered: true
  - id: t2
    description: "Example 2 - contiguous batches with re-ingested duplicates produce no rows"
    setup_sql: |
      INSERT INTO ingested_batches (id, source, batch_no) VALUES
        (1, 'orders', 3), (2, 'orders', 4), (3, 'orders', 4), (4, 'orders', 5);
    expected_rows: []
    ordered: true
  - id: t3
    hidden: true
    description: "Empty table"
    expected_rows: []
    ordered: true
  - id: t4
    hidden: true
    description: "Single missing number gives gap_start = gap_end; rows inserted out of order"
    setup_sql: |
