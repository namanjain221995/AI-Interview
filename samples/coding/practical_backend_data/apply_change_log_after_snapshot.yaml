version: 1
slug: apply_change_log_after_snapshot
title: Replay a Change Log onto a Snapshot
difficulty: easy
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [backend, data, dba, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Replay a Change Log onto a Snapshot

  A new read replica of a key-value settings store is being brought up. It restores a **snapshot** and
  then catches up by replaying entries from the change log.

  - `snapshot` holds rows `[id, value]` with distinct ids. It already contains the effect of **every
    change with sequence number `<= snapshot_seq`**.
  - `changes` holds entries `[seq, op, id, value]`, all as strings. `seq` is a positive decimal number
    without leading zeros, `op` is `"PUT"` (create or overwrite the row with `value`) or `"DEL"` (delete
    the row; `value` is `""`). A `PUT` with an empty value stores an empty string; the row still exists.
  - The log transport is unreliable: entries can arrive **out of order**, and an entry can be
    **redelivered**, which repeats the same `seq` with identical content.

  Apply every distinct `seq` greater than `snapshot_seq` **exactly once**, in ascending **numeric**
  order of `seq`. Deleting an id that does not exist does nothing. Return the final rows `[id, value]`
  sorted by `id` in plain character-code (ASCII) order.

  ### Example 1
  ```
  Input:  snapshot = [["cfg:timeout", "30"], ["cfg:retries", "3"]], snapshot_seq = 7,
          changes = [["9", "PUT", "cfg:retries", "5"], ["6", "PUT", "cfg:timeout", "10"],
                     ["8", "DEL", "cfg:timeout", ""], ["10", "PUT", "cfg:region", "eu-west"],
                     ["9", "PUT", "cfg:retries", "5"]]
  Output: [["cfg:region", "eu-west"], ["cfg:retries", "5"]]
  Explanation: seq 6 is already in the snapshot and is skipped. Then seq 8 deletes cfg:timeout,
  seq 9 (delivered twice, applied once) sets cfg:retries and seq 10 creates cfg:region.
  ```

  ### Example 2
  ```
  Input:  snapshot = [], snapshot_seq = 0,
          changes = [["2", "PUT", "b", "x"], ["1", "PUT", "a", "y"], ["3", "DEL", "zz", ""]]
  Output: [["a", "y"], ["b", "x"]]
  ```

  ### Constraints
  - `0 <= snapshot.length <= 10^4`, `0 <= changes.length <= 10^4`
  - `0 <= snapshot_seq <= 2 * 10^9` and every `seq` is between `1` and `2 * 10^9`
  - Entries that share a `seq` are identical
  - Ids are 1-40 printable ASCII characters; values are 0-100 printable ASCII characters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: apply_change_log
  params:
    - {name: snapshot, type: "string[][]"}
    - {name: snapshot_seq, type: int}
    - {name: changes, type: "string[][]"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def apply_change_log(snapshot: list[list[str]], snapshot_seq: int,
                         changes: list[list[str]]) -> list[list[str]]:
        rows = {row_id: value for row_id, value in snapshot}
        pending: dict[int, list[str]] = {}  # seq -> entry; redeliveries collapse onto one key
        for entry in changes:
            seq = int(entry[0])
            if seq > snapshot_seq:
                pending[seq] = entry
        for seq in sorted(pending):
            _, op, row_id, value = pending[seq]
            if op == "PUT":
                rows[row_id] = value
            else:
                rows.pop(row_id, None)
        return [[row_id, rows[row_id]] for row_id in sorted(rows)]
  javascript: |
    function applyChangeLog(snapshot, snapshotSeq, changes) {
      const rows = new Map(snapshot.map(([id, value]) => [id, value]));
      const pending = new Map(); // seq -> entry; redeliveries collapse onto one key
      for (const entry of changes) {
        const seq = Number(entry[0]);
        if (seq > snapshotSeq) pending.set(seq, entry);
      }
      const seqs = [...pending.keys()].sort((a, b) => a - b);
      for (const seq of seqs) {
        const [, op, id, value] = pending.get(seq);
        if (op === 'PUT') rows.set(id, value);
        else rows.delete(id);
      }
      const ids = [...rows.keys()].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return ids.map((id) => [id, rows.get(id)]);
    }
