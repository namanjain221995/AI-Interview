expected_concepts:
  - hash map keyed by row id
  - filtering by snapshot sequence number
  - de-duplicating redelivered entries by seq
  - sorting by numeric sequence rather than string
  - idempotent replay
optimal_complexity: {time: O(s log s + c log c), space: O(s + c)}
rubric:
  excellent: Loads the snapshot into a map, filters entries by seq > snapshot_seq, collapses redeliveries by seq, applies them in numeric order, sorts the result by id and explains why skipping old entries and ordering by seq make the replay idempotent.
  good: Correct replay after a hint about numeric ordering of seq or about entries already contained in the snapshot.
  weak: Applies entries in arrival order, sorts seq as strings, reapplies changes below snapshot_seq, or crashes when deleting a missing id.
  criteria:
    correctness: All tests pass, including string-versus-numeric seq ordering, stale entries and recreate-after-delete.
    efficiency: One pass to collect pending entries, one sort by seq and one sort of the final ids.
    code_quality: Parses each entry once with named fields and keeps snapshot loading, replay and output separate.
    edge_cases: No changes, everything deleted, empty values, missing ids on delete and redeliveries.
    communication: Explains how the replica would behave if the replay were interrupted and restarted.
hints:
  - The snapshot already reflects some of the log, and the rest of the log is jumbled; decide which entries still matter before applying anything.
  - Keep the rows in a map by id, discard entries whose seq is not greater than snapshot_seq, and make sure each remaining seq is applied once and in the right order.
  - Collect the remaining entries in a map keyed by the integer value of seq (redeliveries overwrite themselves), apply them in ascending numeric key order with put or delete-if-present, then emit the rows sorted by id.
followups:
  - How would the replica record its progress so that a restart does not replay entries twice?
  - What would you do if two different entries arrived with the same seq?
  - How would you detect a gap in sequence numbers and decide whether it is safe to serve reads?
common_errors:
  - Sorting seq values as strings so that "10" is applied before "9".
  - Re-applying entries at or below snapshot_seq, which reverts newer snapshot values.
  - Applying entries in arrival order instead of sequence order.
  - Treating a PUT with an empty value as a delete.
