reference_solutions:
  python: |
    def keyset_next_page(created_at: list[int], ids: list[int], cursor_ts: int, cursor_id: int, page_size: int) -> list[int]:
        first_page = cursor_ts == -1 and cursor_id == -1
        after = [
            (ts, item_id)
            for ts, item_id in zip(created_at, ids)
            if first_page or (ts, item_id) < (cursor_ts, cursor_id)
        ]
        after.sort(reverse=True)  # created_at descending, then id descending
        return [item_id for _, item_id in after[:page_size]]
  javascript: |
    function keysetNextPage(createdAt, ids, cursorTs, cursorId, pageSize) {
      const firstPage = cursorTs === -1 && cursorId === -1;
      const after = [];
      for (let i = 0; i < ids.length; i++) {
        const ts = createdAt[i];
        const id = ids[i];
        if (firstPage || ts < cursorTs || (ts === cursorTs && id < cursorId)) after.push([ts, id]);
      }
      after.sort((a, b) => (a[0] !== b[0] ? b[0] - a[0] : b[1] - a[1]));
      return after.slice(0, pageSize).map((item) => item[1]);
    }
