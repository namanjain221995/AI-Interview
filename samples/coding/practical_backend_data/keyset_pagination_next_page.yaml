prompt_markdown: |
  ## Keyset Pagination for an Activity Feed

  A mobile app shows a team's activity feed, newest first. Offset paging (`?page=7`) skipped and repeated
  items whenever new activity arrived, so the API now uses a **cursor**: the client sends back the
  position of the last item it displayed, and the server returns the items that come after it.

  Item `i` has a creation time `created_at[i]` (epoch seconds) and a unique id `ids[i]`. The arrays are
  parallel and **not sorted**. The **feed order** is:

  1. `created_at` **descending** (newest first), then
  2. `id` **descending** when two items have the same `created_at`.

  Write `keyset_next_page(created_at, ids, cursor_ts, cursor_id, page_size)` that returns the ids of the
  next page:

  - The cursor `(cursor_ts, cursor_id)` is the `created_at` and id of the last item on the previous page.
    `cursor_ts = -1` and `cursor_id = -1` together mean "no cursor": return the first page.
  - An item comes **after** the cursor when it would be placed later than an item with that
    `created_at` and id in feed order: `created_at < cursor_ts`, or `created_at == cursor_ts` and
    `id < cursor_id`.
  - The cursor item may have been **deleted** since the previous page was served, so it is not
    necessarily in the arrays. The rule above still applies.
  - Return at most `page_size` ids, in feed order. Return an empty list `[]` when nothing comes after the
    cursor.

  ### Example 1
  ```
  Input:  created_at = [1700000300, 1700000100, 1700000200, 1700000100, 1700000250], ids = [41, 17, 33, 52, 8], cursor_ts = -1, cursor_id = -1, page_size = 3
  Output: [41, 8, 33]
  Explanation: feed order is 41, 8, 33, 52, 17; ids 52 and 17 share a timestamp, so 52 comes first
  ```

  ### Example 2
  ```
  Input:  created_at = [1700000300, 1700000100, 1700000200, 1700000100, 1700000250], ids = [41, 17, 33, 52, 8], cursor_ts = 1700000200, cursor_id = 33, page_size = 3
  Output: [52, 17]
  Explanation: after (1700000200, 33) come 52 and 17; only two items remain
  ```

  ### Example 3
  ```
  Input:  created_at = [500, 400, 400, 300], ids = [10, 25, 21, 7], cursor_ts = 400, cursor_id = 23, page_size = 2
  Output: [21, 7]
  Explanation: no item has id 23, but 21 sorts after (400, 23) and 25 does not
  ```

  ### Constraints
  - `0 <= created_at.length == ids.length <= 10^5`
  - `0 <= created_at[i] <= 4 * 10^9`
  - `1 <= ids[i] <= 10^15`, and all ids are distinct
  - Either `cursor_ts = cursor_id = -1`, or `0 <= cursor_ts <= 4 * 10^9` and `1 <= cursor_id <= 10^15`
  - `1 <= page_size <= 1000`

  **Follow-up:** which database index makes this query fast, and why does keyset paging stay stable when
  new items are inserted at the top of the feed?
