expected_concepts:
  - "keyset (seek) pagination with a composite sort key"
  - "lexicographic comparison of (created_at, id) tuples"
  - "tie-breaking on a unique column so the order is total"
  - "cursor positions that no longer exist in the data"
  - "sorting descending and taking a bounded prefix"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Treats (created_at, id) as one composite key, filters strictly after the cursor with the tie rule, handles the first-page sentinel and a deleted cursor without special lookups, returns ids in feed order and explains how a composite index would serve this in a database."
  good: "Correct filter and ordering with a hint on one detail such as the tie rule, the sentinel cursor or returning fewer than page_size items."
  weak: "Searches for the cursor id and fails when it was deleted, ignores the id tie-break, uses offsets, or returns items in the wrong order."
  criteria:
    correctness: "All tests pass, including ties, a deleted cursor, the first page and an exhausted feed."
    efficiency: "Filters in one pass and sorts once, or keeps a bounded heap of page_size items; no repeated scans per output item."
    code_quality: "The 'comes after' comparison is expressed once and clearly, for example as a tuple comparison or a small helper."
    edge_cases: "Empty feed, cursor at the end, cursor newer than everything, all-equal timestamps and values beyond 32 bits."
    communication: "Explains why offset paging breaks under inserts and why the unique id makes the ordering total."
hints:
  - "Think of each item's position in the feed as a pair made of its timestamp and its id; the cursor is just such a pair, whether or not that item still exists."
  - "An item belongs to the next page when its pair is smaller than the cursor pair: an older timestamp, or the same timestamp with a smaller id. You never need to find the cursor item itself."
  - "Keep every item whose pair is smaller than the cursor pair (or every item when the cursor is the minus-one sentinel), sort the kept pairs by timestamp descending and then id descending, and return the ids of the first page_size of them."
followups:
  - "Write the SQL WHERE and ORDER BY clauses for this page and name the index that supports them."
  - "How would you encode the cursor in an opaque token so clients cannot tamper with it?"
  - "How would you support paging backwards to newer items from the same cursor?"
  - "If page_size is small and the feed is huge, how could you avoid sorting everything?"
common_errors:
  - "Looking up the cursor id in the arrays and failing when that item was deleted."
  - "Comparing only timestamps, which skips or repeats items that share the cursor's timestamp."
  - "Using a non-strict comparison so the cursor item itself appears again on the next page."
  - "Sorting ties by id ascending, which disagrees with the stated feed order."
