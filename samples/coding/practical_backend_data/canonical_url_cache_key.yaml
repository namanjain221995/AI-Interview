  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def cache_key(url: str) -> str:
        sep = url.index("://")
        scheme = url[:sep].lower()
        rest = url[sep + 3:]
        hash_at = rest.find("#")
        if hash_at != -1:
            rest = rest[:hash_at]
        query = None
        question = rest.find("?")
        if question != -1:
            query = rest[question + 1:]
            rest = rest[:question]
        slash = rest.find("/")
        authority, path = (rest, "") if slash == -1 else (rest[:slash], rest[slash:])
        authority = authority.lower()
        if ":" in authority:
            host, port = authority.split(":", 1)
            if (scheme == "http" and port == "80") or (scheme == "https" and port == "443"):
                authority = host

        pieces = path.split("/")
        kept: list[str] = []
        for piece in pieces:
            if piece in ("", "."):
                continue
            if piece == "..":
                if kept:
                    kept.pop()
            else:
                kept.append(piece)
        trailing = pieces[-1] in ("", ".", "..")
        new_path = "/" + "/".join(kept) + ("/" if trailing and kept else "")

        params: list[tuple[str, str]] = []
        if query is not None:
            for param in query.split("&"):
                key = param.split("=", 1)[0]
                if key == "" or key.startswith("utm_"):
                    continue
                params.append((key, param))
        params.sort()
        result = scheme + "://" + authority + new_path
        if params:
            result += "?" + "&".join(param for _, param in params)
        return result
  javascript: |
    function cacheKey(url) {
      const sep = url.indexOf("://");
      const scheme = url.slice(0, sep).toLowerCase();
      let rest = url.slice(sep + 3);
      const hashAt = rest.indexOf("#");
      if (hashAt !== -1) rest = rest.slice(0, hashAt);
      let query = null;
      const question = rest.indexOf("?");
      if (question !== -1) {
        query = rest.slice(question + 1);
        rest = rest.slice(0, question);
      }
      const slash = rest.indexOf("/");
      let authority = slash === -1 ? rest : rest.slice(0, slash);
      const path = slash === -1 ? "" : rest.slice(slash);
      authority = authority.toLowerCase();
      const colon = authority.indexOf(":");
      if (colon !== -1) {
        const port = authority.slice(colon + 1);
        if ((scheme === "http" && port === "80") || (scheme === "https" && port === "443")) {
          authority = authority.slice(0, colon);
        }
      }

      const pieces = path.split("/");
      const kept = [];
      for (const piece of pieces) {
        if (piece === "" || piece === ".") continue;
        if (piece === "..") {
          if (kept.length > 0) kept.pop();
        } else {
          kept.push(piece);
        }
      }
      const last = pieces[pieces.length - 1];
      const trailing = last === "" || last === "." || last === "..";
      const newPath = "/" + kept.join("/") + (trailing && kept.length > 0 ? "/" : "");

      const params = [];
      if (query !== null) {
        for (const param of query.split("&")) {
          const eq = param.indexOf("=");
          const key = eq === -1 ? param : param.slice(0, eq);
          if (key === "" || key.startsWith("utm_")) continue;
          params.push([key, param]);
        }
      }
      const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
      params.sort((a, b) => cmp(a[0], b[0]) || cmp(a[1], b[1]));
      let result = scheme + "://" + authority + newPath;
      if (params.length > 0) result += "?" + params.map((p) => p[1]).join("&");
      return result;
    }
