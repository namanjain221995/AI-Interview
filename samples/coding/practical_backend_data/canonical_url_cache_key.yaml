expected_concepts:
  - splitting a URL into components in the right order (fragment, then query, then authority and path)
  - stack-based removal of dot segments with a root boundary
  - stable canonical ordering of query parameters by key then full text
  - filtering tracking parameters without decoding
  - scheme-specific default ports
optimal_complexity: {time: O(n log n) for sorting the query parameters, space: O(n)}
rubric:
  excellent: Splits the URL in a safe order (fragment first), normalises each part with a small helper, uses a stack for dot segments, sorts parameters by key and then full text, and explains why the key-then-text order differs from sorting the raw strings.
  good: Produces correct keys for most inputs but needs a nudge on one rule such as the trailing slash after .., a # before ?, the empty-key parameter or scheme-specific default ports.
  weak: Uses string replacement for // and ../ (which breaks on repeated patterns), sorts raw parameter strings, lowercases the path, or decodes and re-encodes parameters.
  criteria:
    correctness: All tests pass, including dot segments above root, # before ?, empty keys and utm_ filtering.
    efficiency: One pass per component plus a sort of the parameters.
    code_quality: Separate, named steps for authority, path and query; no fragile chained string replacements.
    edge_cases: Missing path, trailing slash rules, non-default ports, flag parameters without =, duplicate keys, an empty or fully filtered query.
    communication: Explains each normalisation rule and why the fragment must be removed before looking for ?.
hints:
  - Handle the URL in pieces. Which separator must you look for first so that a ? inside the fragment is not mistaken for the start of the query?
  - For the path, think of a stack of segments - a normal segment is pushed, .. pops if possible and empty or . pieces are ignored. Remember separately whether the original path ended in a way that implies a trailing slash.
  - For the query, split on &, compute each parameter's key as the text before the first =, filter out empty and utm_ keys, then sort pairs of (key, full parameter text) in character-code order and join the parameter texts with &.
followups:
  - Which other parts of a URL would you normalise for a real CDN (percent-encoding case, IDN hosts, trailing dots) and which are risky to change?
  - How would you make the set of ignored query parameters configurable per route?
  - Why can sorting query parameters change the meaning of some URLs, and how would you allow an opt-out?
  - How would you test that two equivalent URLs always produce the same key?
common_errors:
  - Looking for ? before removing the fragment, so a ? inside the fragment starts a fake query.
  - Sorting raw parameter strings, which puts a-b=1 before a=1 even though key a sorts first.
  - Removing ports 80 and 443 regardless of the scheme.
  - Letting .. climb above the root or producing an empty path instead of /.
  - Leaving a dangling ? when every parameter was filtered out.
