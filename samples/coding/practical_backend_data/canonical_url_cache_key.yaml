slug: canonical_url_cache_key
title: Canonical Cache Key for a URL
difficulty: medium
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [backend, fullstack, platform, frontend]
time_limit_minutes: 25
prompt_markdown: |
  ## Canonical Cache Key for a URL

  The CDN in front of an online shop caches responses by URL. Today `https://Shop.example.com/a?x=1&y=2`
  and `https://shop.example.com:443//a?y=2&x=1` are cached twice, and campaign links tagged with
  `utm_source=...` never hit the cache. Write `cache_key(url)` that turns a URL into one **canonical
  key** so equivalent URLs share a cache entry.

  The input has the shape `scheme://authority[path][?query][#fragment]`:

  - `scheme` is `http` or `https` in any letter case.
  - `authority` runs up to the first `/`, `?` or `#` after `://` (or the end) and is `host` or
    `host:port`.
  - `path` starts with `/` and runs up to the first `?` or `#`; it may be missing.
  - `query` is the text after the first `?` up to the first `#`; it exists only if that `?` comes
    **before** any `#`.
  - `fragment` is everything from the first `#`.

  Build the key as `scheme://authority` + `path`, then `?` + `query` when a query remains:

  1. **Scheme and host** are lowercased. A port equal to the scheme's default (`80` for `http`, `443`
     for `https`) is removed; any other port is kept.
  2. **Path**: split it on `/` and process the pieces left to right: skip empty pieces and `.`, a `..`
     removes the most recently kept segment (and does nothing if there is none), any other piece is
     kept. The new path is `/` followed by the kept segments joined with `/`. If the original path ended
     with `/`, `/.` or `/..` and at least one segment was kept, add a trailing `/`. A missing path, or
     one where nothing is kept, becomes `/`. Path segments keep their letter case.
  3. **Query**: split it on `&`. The key of a parameter is the text before its first `=` (the whole
     parameter if it has no `=`). Drop parameters whose key is empty (this includes empty pieces) or
     starts with `utm_` (lowercase, case-sensitive). Sort the remaining parameters by **key**, and
     parameters with the same key by their **full text**, both in plain character-code (ASCII) order.
     Keep every parameter exactly as written (no decoding, duplicates kept) and join them with `&`.
     If no parameter remains, the key has no `?`.
  4. **Fragment** is dropped.

  ### Example 1
  ```
  Input:  url = "HTTPS://Shop.Example.COM:443/Cart//items/./42?utm_source=mail&size=XL&color=red#reviews"
  Output: "https://shop.example.com/Cart/items/42?color=red&size=XL"
  ```

  ### Example 2
  ```
  Input:  url = "http://cdn.example.net:8080/a/b/../../../img.png?v=2&v=10&=x&utm_medium=cpc"
  Output: "http://cdn.example.net:8080/img.png?v=10&v=2"
  Explanation: the third .. has nothing left to remove; "v=10" sorts before "v=2" in character order.
  ```

  ### Example 3
  ```
  Input:  url = "http://API.example.org"
  Output: "http://api.example.org/"
  ```

  ### Constraints
  - `10 <= url.length <= 2000`
  - `url` contains printable ASCII characters without spaces and always contains `://`.
  - The host contains only letters, digits, `.` and `-`; there is no user info (`user@`) and no IPv6.
  - A port, when present, is 1 to 5 digits without leading zeros.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cache_key
  params:
