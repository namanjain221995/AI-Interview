expected_concepts:
  - hash map of last forwarded time per key
  - inclusive window boundary
  - updating state only on forwarded events
  - single pass over a time-ordered stream
optimal_complexity: {time: O(n), space: O(k) where k is the number of distinct keys}
rubric:
  excellent: Keeps a map from key to the time it was last forwarded, applies the inclusive boundary correctly, updates the map only when forwarding and explains why suppressed alerts must not extend the window.
  good: Correct single-pass solution after fixing the boundary comparison or the suppressed-alert update when a test fails.
  weak: Updates the last-seen time on every alert, compares against the previous alert of any key, or rescans earlier alerts for each new one.
  criteria:
    correctness: All tests pass, including window 0, duplicate timestamps and the exact boundary.
    efficiency: One pass with constant-time map operations.
    code_quality: The forward condition reads as one clear expression and the map is named for what it stores.
    edge_cases: Empty stream, single alert, case-sensitive keys and very large timestamps.
    communication: Explains how this rule differs from a sliding window that resets on every alert.
hints:
  - Each key only needs to remember one thing from the past to decide about its next alert.
  - Store, per key, the time it was last forwarded - and think carefully about which alerts are allowed to change that value.
  - Walk the alerts once with a map from key to last forwarded time; forward when the key is absent or the time difference is at least the window, and only then record the new time and the index.
followups:
  - How would you also report, for each forwarded alert, how many duplicates were suppressed since the previous one?
  - How would you bound memory if millions of distinct keys appear over a day?
  - How would the design change if alerts could arrive slightly out of order?
common_errors:
  - Updating the stored time for suppressed alerts, which can suppress a noisy key forever.
  - Using a strict comparison so that an alert exactly window seconds later is suppressed.
  - Comparing with the previous alert overall instead of the previous forwarded alert of the same key.
  - Normalising key case so that different alerts collide.
