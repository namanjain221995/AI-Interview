slug: suppress_repeat_alerts_window
title: Suppress Repeat Alerts Within a Window
difficulty: easy
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [sre, devops, platform, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## Suppress Repeat Alerts Within a Window

  An on-call alert router receives a stream of alerts. To avoid paging people repeatedly for the same
  problem, it suppresses an alert when **the same key was forwarded recently**.

  Alert `i` has key `keys[i]` and arrival time `times[i]` in seconds; `times` is non-decreasing. Process
  the alerts in order:

  - Alert `i` is **forwarded** if no alert with the same key has been forwarded before, or if
    `times[i] - last_forwarded[key] >= window`.
  - Otherwise it is **suppressed**. A suppressed alert does **not** restart the window: only forwarded
    alerts update `last_forwarded[key]`.

  Keys are case-sensitive. Return the indices of the forwarded alerts in ascending order.

  ### Example 1
  ```
  Input:  keys = ["db-cpu", "disk", "db-cpu", "db-cpu", "disk", "db-cpu"],
          times = [0, 10, 30, 60, 70, 95], window = 60
  Output: [0, 1, 3, 4]
  Explanation: alert 2 comes 30 s after db-cpu was forwarded and is suppressed; alert 3 comes exactly
  60 s after and is forwarded; alert 5 is only 35 s after alert 3.
  ```

  ### Example 2
  ```
  Input:  keys = ["queue-lag", "queue-lag", "queue-lag", "queue-lag"],
          times = [0, 40, 80, 120], window = 100
  Output: [0, 3]
  Explanation: alerts 1 and 2 are suppressed and do not restart the window, so alert 3 is measured
  from alert 0.
  ```

  ### Constraints
  - `0 <= keys.length == times.length <= 10^5`
  - `0 <= times[i] <= 10^13` and `times[i] <= times[i + 1]`
  - `0 <= window <= 10^9`
  - Keys are 1-50 printable ASCII characters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: forwarded_alerts
  params:
    - {name: keys, type: "string[]"}
    - {name: times, type: "long[]"}
    - {name: window, type: long}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def forwarded_alerts(keys: list[str], times: list[int], window: int) -> list[int]:
        last_forwarded: dict[str, int] = {}
        forwarded = []
        for i, (key, t) in enumerate(zip(keys, times)):
            last = last_forwarded.get(key)
            if last is None or t - last >= window:
                last_forwarded[key] = t
                forwarded.append(i)
        return forwarded
  javascript: |
    function forwardedAlerts(keys, times, window) {
      const lastForwarded = new Map();
      const forwarded = [];
      for (let i = 0; i < keys.length; i++) {
        const last = lastForwarded.get(keys[i]);
        if (last === undefined || times[i] - last >= window) {
          lastForwarded.set(keys[i], times[i]);
          forwarded.push(i);
        }
      }
      return forwarded;
    }
