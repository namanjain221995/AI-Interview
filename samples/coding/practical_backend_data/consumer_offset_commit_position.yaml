version: 1
slug: consumer_offset_commit_position
title: Safe Commit Offset for Out-of-Order Workers
difficulty: easy
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, data, platform, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Safe Commit Offset for Out-of-Order Workers

  A queue consumer reads a partition starting at offset `start` and hands offsets `start`, `start + 1`,
  `start + 2`, ... to a pool of parallel workers. Workers finish in any order. The consumer may only
  commit a position `p` when **every offset from `start` up to `p - 1` has completed**, so that a crash
  never skips unprocessed messages.

  `completions` lists the offsets reported as completed, in the order the reports arrive. After
  **each** report, record the **safe commit position**: the smallest offset `>= start` that has **not**
  completed yet.

  - A report for an offset that already completed (a redelivery) changes nothing.
  - A report for an offset below `start` (left over from before a rebalance) changes nothing.
  - A position is still recorded for every report, including ignored ones.

  Return the list of positions, one per report.

  ### Example 1
  ```
  Input:  start = 100, completions = [101, 100, 103, 102, 104]
  Output: [100, 102, 102, 104, 105]
  Explanation: after 101 the gap at 100 blocks the commit; once 100 is done, 100 and 101 are
  covered and the position moves to 102.
  ```

  ### Example 2
  ```
  Input:  start = 7, completions = [7, 7, 5, 9, 8]
  Output: [8, 8, 8, 8, 10]
  Explanation: the second 7 is a redelivery and 5 is below start; both leave the position at 8.
  ```

  ### Constraints
  - `0 <= start <= 10^15`
  - `0 <= completions.length <= 10^5`
  - `0 <= completions[i] <= start + 10^6`
  - Aim for amortised `O(1)` work per report
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: commit_positions
  params:
    - {name: start, type: long}
    - {name: completions, type: "long[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def commit_positions(start: int, completions: list[int]) -> list[int]:
        done: set[int] = set()  # completed offsets at or above the current position
        position = start
        result = []
        for offset in completions:
            if offset >= position:
                done.add(offset)
                while position in done:
                    done.remove(position)
                    position += 1
            result.append(position)
        return result
  javascript: |
    function commitPositions(start, completions) {
      const done = new Set(); // completed offsets at or above the current position
      let position = start;
      const result = [];
      for (const offset of completions) {
        if (offset >= position) {
          done.add(offset);
          while (done.has(position)) {
            done.delete(position);
            position++;
          }
        }
        result.push(position);
      }
      return result;
    }
