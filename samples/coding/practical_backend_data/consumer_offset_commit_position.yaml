expected_concepts:
  - set of completed offsets ahead of the commit position
  - advancing a low-water mark
  - amortised analysis (each offset passed at most once)
  - ignoring duplicates and stale offsets
optimal_complexity: {time: O(n) amortised, space: O(n)}
rubric:
  excellent: Keeps a set of completed offsets at or above the current position, advances the position while it is in the set, removes passed offsets to bound memory, ignores stale and duplicate reports and explains the amortised O(1) argument.
  good: Correct simulation that may keep passed offsets in the set or rescans from start in rare cases, fixed or explained with a hint.
  weak: Takes the maximum completed offset plus one, rescans from start after every report, or crashes on duplicates and offsets below start.
  criteria:
    correctness: All tests pass, including reverse order, far-ahead gaps, redeliveries and offsets below start.
    efficiency: Each offset enters and leaves the set at most once, so the whole run is linear.
    code_quality: A clearly named position variable and a short advance loop; 64-bit offsets throughout.
    edge_cases: Empty input, start of 0, offsets beyond 32 bits and redeliveries of offsets already committed.
    communication: Explains why committing the maximum completed offset could lose messages after a crash.
hints:
  - The commit position can only move forward, and it is blocked by the lowest offset that is still in progress.
  - Remember which offsets at or above the current position have completed; when the offset at the position completes, the position can slide forward over every consecutive completed offset.
  - Keep a hash set and a position initialised to start; for each report at or above the position add it to the set, then while the position is in the set remove it and increment the position; append the position after every report.
followups:
  - How would you bound memory if one worker hangs and thousands of later offsets complete?
  - How would this work with several partitions handled by the same consumer?
  - What delivery guarantee does committing this position give, and what must the workers do to make processing idempotent?
common_errors:
  - Committing the largest completed offset plus one, which skips offsets still being processed.
  - Rescanning every offset from start after each report, which is quadratic.
  - Letting offsets below start or redeliveries move the position or raise errors.
  - Using 32-bit integers for offsets that exceed two billion.
