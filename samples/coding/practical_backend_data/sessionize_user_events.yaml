role_tags: [data, backend, data_analyst, data_scientist]
time_limit_minutes: 20
prompt_markdown: |
  ## Sessionize a Clickstream

  The product analytics pipeline receives page-view events from many app servers, so they arrive in
  **no particular order**. Event `i` was produced by user `user_ids[i]` at second `timestamps[i]`.

  A **session** is a run of one user's events, taken in time order, where each event happened at most
  `gap` seconds after the previous one (a difference of exactly `gap` stays in the same session; a
  larger difference starts a new session). Events of different users never share a session. Several
  events of the same user at the same second are separate events of the same session.

  Implement `sessionize(user_ids, timestamps, gap)`, which returns one entry
  `[user_id, session_start, session_end, event_count]` per session, where `session_start` and
  `session_end` are the first and last timestamps of the session. Sort the entries by `user_id`
  ascending and then by `session_start` ascending.

  ### Example 1
  ```
  Input:  user_ids = [7, 3, 7, 7, 7], timestamps = [130, 500, 100, 400, 160], gap = 60
  Output: [[3, 500, 500, 1], [7, 100, 160, 3], [7, 400, 400, 1]]
  Explanation: user 7's events at 100, 130 and 160 are 30 s apart, so they form one session;
  400 starts a new one. User 3 has a single event.
  ```

  ### Example 2
  ```
  Input:  user_ids = [5, 5, 5, 5], timestamps = [60, 50, 71, 50], gap = 10
  Output: [[5, 50, 60, 3], [5, 71, 71, 1]]
  Explanation: the two events at 50 are both counted; 60 - 50 = 10 equals the gap, so it
  stays in the session, while 71 - 60 = 11 does not.
  ```

  ### Constraints
  - `0 <= user_ids.length == timestamps.length <= 10^5`
  - `1 <= user_ids[i] <= 10^6`
  - `0 <= timestamps[i] <= 2 * 10^9`
  - `0 <= gap <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sessionize
  params:
    - {name: user_ids, type: "int[]"}
    - {name: timestamps, type: "int[]"}
    - {name: gap, type: "int"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def sessionize(user_ids: list[int], timestamps: list[int], gap: int) -> list[list[int]]:
        events = sorted(zip(user_ids, timestamps))
        sessions: list[list[int]] = []
        for user, ts in events:
            last = sessions[-1] if sessions else None
            if last is not None and last[0] == user and ts - last[2] <= gap:
                last[2] = ts
                last[3] += 1
            else:
                sessions.append([user, ts, ts, 1])
        return sessions
  javascript: |
    function sessionize(userIds, timestamps, gap) {
      const order = userIds.map((_, i) => i);
      order.sort((a, b) => userIds[a] - userIds[b] || timestamps[a] - timestamps[b]);
      const sessions = [];
      for (const i of order) {
        const user = userIds[i];
        const ts = timestamps[i];
        const last = sessions.length > 0 ? sessions[sessions.length - 1] : null;
        if (last !== null && last[0] === user && ts - last[2] <= gap) {
          last[2] = ts;
          last[3] += 1;
        } else {
          sessions.push([user, ts, ts, 1]);
        }
      }
      return sessions;
    }
