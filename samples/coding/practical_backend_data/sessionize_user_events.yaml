expected_concepts:
  - "sorting by (user, timestamp)"
  - "single linear sweep comparing with the previous event"
  - "inclusive gap boundary"
  - "grouping and aggregation per session"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts events by (user, time), sweeps once extending or opening sessions with the inclusive gap test, counts duplicate timestamps and returns sessions in the required order with O(n log n) cost explained."
  good: "Correct solution that groups by user in a hash map and sorts each group, or needs a small fix for the gap boundary."
  weak: "Assumes input is already sorted, merges events across users, measures the gap from the session start instead of the previous event, or drops duplicate timestamps."
  criteria:
    correctness: "All tests pass, including unsorted input, duplicate timestamps and the inclusive boundary."
    efficiency: "One sort plus a linear sweep; no per-event rescans."
    code_quality: "Session entries built in one place with clear field updates (end and count)."
    edge_cases: "Empty input, gap 0, single events, interleaved users and extreme values."
    communication: "Explains the difference between gap-from-previous-event and fixed-length sessions."
hints:
  - "Sessions only depend on each user's events in time order, so think about how to bring those events next to each other."
  - "After sorting by user and then by timestamp, an event either continues the most recent session (same user, close enough to its last event) or starts a new one."
  - "Sort the (user, timestamp) pairs, then sweep once keeping the current session as [user, start, end, count]: if the user matches and timestamp minus end is at most gap, update end and count, otherwise append a new session starting and ending at this timestamp."
followups:
  - "How would you sessionize a stream that never ends, emitting sessions once they are closed?"
  - "What changes if events can arrive up to five minutes late?"
  - "How would you express the same logic in SQL with window functions?"
  - "How would you cap sessions at a maximum length of two hours?"
common_errors:
  - "Assuming the events are already in time order."
  - "Comparing each event with the session start instead of the previous event."
  - "Using a strict comparison so events exactly gap seconds apart start a new session."
  - "Deduplicating events with the same timestamp, which undercounts the session."
