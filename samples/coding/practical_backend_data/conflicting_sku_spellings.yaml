expected_concepts:
  - "normalising strings into a canonical key"
  - "grouping with a map from key to a set of raw values"
  - "distinguishing distinct spellings from repeated occurrences"
  - "sorting the final result deterministically"
optimal_complexity: {time: "O(n * L + k log k)", space: "O(n * L)"}
rubric:
  excellent: "Builds the normalized key exactly as specified, groups raw spellings in a set per key, ignores empty keys, returns the qualifying keys sorted and talks through why a count of occurrences is not enough."
  good: "Correct grouping solution that needs a nudge on one rule such as repeated raw strings, empty keys or the output order."
  weak: "Counts occurrences instead of distinct spellings, strips characters that should be kept, forgets to upper-case or returns raw spellings instead of keys."
  criteria:
    correctness: "All tests pass, including repeated raw strings, separator-only SKUs and kept punctuation."
    efficiency: "One pass over the input with hashing plus one sort of the qualifying keys."
    code_quality: "Normalisation lives in one small, readable step and the grouping uses a set per key."
    edge_cases: "Empty input, keys that normalize to empty, identical repeats and characters that are not removed."
    communication: "Clarifies the difference between a spelling and an occurrence before coding."
hints:
  - "First decide what makes two raw SKUs refer to the same item, then group the input by that canonical form."
  - "Compute the normalized key for each raw SKU and remember, per key, the distinct raw strings that produced it; a counter of occurrences is not the same thing."
  - "Use a map from normalized key to a set of raw strings, skip keys that come out empty, then keep only the keys whose set has two or more members and sort them before returning."
followups:
  - "How would you suggest the canonical spelling for each conflicting key?"
  - "How would you do the same check in SQL over a products table?"
  - "What changes if look-alike characters such as the letter O and the digit 0 should also be treated as equal?"
common_errors:
  - "Counting how many times a key appears rather than how many distinct raw spellings it has."
  - "Removing every non-alphanumeric character instead of only the three listed separators."
  - "Keeping SKUs whose normalized key is empty as a conflicting key."
  - "Returning keys in first-seen order instead of sorted order."
