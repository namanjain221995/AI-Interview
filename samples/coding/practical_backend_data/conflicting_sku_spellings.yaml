version: 1
slug: conflicting_sku_spellings
title: "SKUs Typed More Than One Way"
difficulty: easy
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [backend, data, data_analyst, business_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## SKUs Typed More Than One Way

  A supplier's spreadsheet is being imported into the product catalog. Its SKU column was typed by hand,
  so the same item shows up as `ab-100`, `AB100` and `Ab 100`. Before the import, a data-quality check
  lists every item whose SKU was spelled in more than one way so a merchandiser can pick the canonical
  spelling.

  The **normalized key** of a raw SKU is obtained by converting every lower-case letter `a`-`z` to upper
  case and deleting every `-`, `_` and space character. A raw SKU whose normalized key is empty (for
  example `" - "`) is ignored.

  Write `conflicting_sku_spellings(skus)` that returns the normalized keys that occur with **at least two
  different raw spellings**. Raw spellings are compared exactly, character by character, so the same raw
  string appearing several times counts as one spelling. Return the keys sorted in ascending order
  (character code order), or `[]` when no key qualifies.

  ### Example 1
  ```
  Input:  skus = ["ab-100", "AB100", "XY_7", "Ab 100", "xy_7", "QQ1"]
  Output: ["AB100", "XY7"]
  Explanation: AB100 is typed three ways, XY7 two ways, QQ1 only once
  ```

  ### Example 2
  ```
  Input:  skus = ["CBL-2M", "CBL-2M", "cbl2m ", " - ", "MNT9", "MNT9"]
  Output: ["CBL2M"]
  Explanation: "CBL-2M" twice is one spelling, "cbl2m " is a second; MNT9 is the same raw string twice
  ```

  ### Constraints
  - `0 <= skus.length <= 10^5`
  - `0 <= skus[i].length <= 40`
  - `skus[i]` consists of printable ASCII characters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: conflicting_sku_spellings
  params:
    - {name: skus, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def conflicting_sku_spellings(skus: list[str]) -> list[str]:
        spellings: dict[str, set[str]] = {}
        for raw in skus:
            key = "".join(ch for ch in raw.upper() if ch not in "-_ ")
            if key:
                spellings.setdefault(key, set()).add(raw)
        return sorted(key for key, raws in spellings.items() if len(raws) >= 2)
  javascript: |
    function conflictingSkuSpellings(skus) {
      const spellings = new Map();
      for (const raw of skus) {
        const key = raw.toUpperCase().replace(/[-_ ]/g, "");
        if (key.length === 0) continue;
        if (!spellings.has(key)) spellings.set(key, new Set());
        spellings.get(key).add(raw);
      }
      const result = [];
      for (const [key, raws] of spellings) if (raws.size >= 2) result.push(key);
      return result.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
