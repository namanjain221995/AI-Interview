slug: checkin_streak_with_holidays
title: "Device Check-in Streak with Holidays"
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, sre, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Device Check-in Streak with Holidays

  Field devices (kiosks, sensors, payment terminals) phone home with a check-in, and the fleet dashboard
  highlights the longest reliable run of each device. Days are numbered with integers (day 0 is the day
  the fleet went live). The check-in log for one device is `days`: **unsorted** and possibly containing
  the same day several times. Site holidays, when devices are switched off on purpose, are listed in
  `holidays`.

  A **streak** is a run of consecutive day numbers in which **every** day is a check-in day or a holiday,
  and at least one day is a check-in day. Holidays bridge gaps but do not add to the length: the
  **length** of a streak is the number of distinct **check-in** days in it (a day that is both a holiday
  and a check-in day counts as a check-in).

  Write `longest_checkin_streak(days, holidays)` that returns the length of the longest streak, or `0`
  when there are no check-ins.

  ### Example 1
  ```
  Input:  days = [3, 1, 2, 2, 6, 7], holidays = [4, 5]
  Output: 5
  Explanation: days 1-7 are all covered; check-ins are 1, 2, 3, 6, 7
  ```

  ### Example 2
  ```
  Input:  days = [10, 12, 20], holidays = [11, 13, 14, 15, 21]
  Output: 2
  Explanation: 10-15 is covered but only 10 and 12 are check-ins; 20-21 has one check-in
  ```

  ### Example 3
  ```
  Input:  days = [], holidays = [1, 2, 3]
  Output: 0
  Explanation: a streak needs at least one check-in day
  ```

  ### Constraints
  - `0 <= days.length, holidays.length <= 10^5`
  - `0 <= days[i], holidays[j] <= 10^9`
  - `holidays` may contain duplicates and days on which the device also checked in
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_checkin_streak
  params:
    - {name: days, type: "int[]"}
    - {name: holidays, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_checkin_streak(days: list[int], holidays: list[int]) -> int:
        checkins = set(days)
        covered = sorted(checkins | set(holidays))
        best = current = 0
        previous = None
        for day in covered:
            if previous is None or day != previous + 1:
                current = 0  # a gap ends the run
            if day in checkins:
                current += 1
                best = max(best, current)
            previous = day
        return best
  javascript: |
    function longestCheckinStreak(days, holidays) {
      const checkins = new Set(days);
      const covered = [...new Set([...days, ...holidays])].sort((a, b) => a - b);
      let best = 0;
      let current = 0;
      let previous = null;
      for (const day of covered) {
        if (previous === null || day !== previous + 1) current = 0;
        if (checkins.has(day)) {
          current += 1;
          best = Math.max(best, current);
        }
        previous = day;
      }
      return best;
    }
