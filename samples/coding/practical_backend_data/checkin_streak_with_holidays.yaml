expected_concepts:
  - "set union of check-in days and holidays"
  - "sorting distinct values and scanning consecutive runs"
  - "resetting a running counter at gaps"
  - "counting only qualifying elements inside a run"
  - "deduplication of repeated inputs"
optimal_complexity: {time: "O((n + m) log (n + m))", space: "O(n + m)"}
rubric:
  excellent: "Deduplicates with sets, scans the sorted union of check-ins and holidays, resets on gaps, counts only check-in days, returns 0 without check-ins and mentions the linear set-based alternative that starts runs only at their first day."
  good: "Correct run scan with a nudge on duplicates, on overlap between holidays and check-ins or on holiday-only runs."
  weak: "Counts holidays in the length, treats a duplicate day as a new day, ignores holidays entirely or returns a positive length when there are no check-ins."
  criteria:
    correctness: "All tests pass, including duplicates, overlapping holidays and holiday-only input."
    efficiency: "Sorting the distinct covered days once (or a hash-set walk) instead of checking every pair of days."
    code_quality: "The scan has one clear reset condition and one clear increment condition."
    edge_cases: "Empty inputs, a single day, duplicates, days that are also holidays and values near 10^9."
    communication: "Restates the length rule with an example before coding and explains why holidays bridge but do not count."
hints:
  - "Holidays behave like filler: they keep a run alive, but only real check-ins make it longer."
  - "Put check-in days and holidays together, remove duplicates and sort them; consecutive numbers in that sorted list form the candidate runs."
  - "Scan the sorted distinct union of both lists, reset a running count to zero whenever the current day is not exactly one more than the previous, add one only when the day is a check-in day, and keep the maximum of the running count."
followups:
  - "Can you do it in expected linear time with a hash set, without sorting?"
  - "How would you answer this for every device in the fleet with one SQL query?"
  - "What if a device may miss at most one non-holiday day per streak?"
common_errors:
  - "Adding holidays to the streak length."
  - "Counting a day twice when it appears repeatedly or is both a check-in and a holiday."
  - "Returning a positive number for a run made only of holidays."
  - "Forgetting to reset the running count at a gap."
