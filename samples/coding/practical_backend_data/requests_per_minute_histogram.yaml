expected_concepts:
  - "fixed-width bucketing with integer division"
  - "half-open interval boundaries"
  - "pre-sized counting array so empty buckets are zero"
  - "ignoring out-of-range data"
optimal_complexity: {time: "O(n + b) where b is the number of buckets", space: "O(b)"}
rubric:
  excellent: "Allocates one counter per bucket, maps each in-range timestamp to its bucket with integer division relative to start, gets both boundaries of the half-open range right and explains why no sort is needed."
  good: "Correct counts with a nudge on one detail such as the end boundary, offsetting by start or reporting empty minutes."
  weak: "Sorts and scans with off-by-one boundaries, buckets by absolute clock minutes instead of start, drops empty buckets or crashes on timestamps outside the range."
  criteria:
    correctness: "All tests pass, including boundary seconds, unaligned starts and out-of-range timestamps."
    efficiency: "A single pass over the timestamps plus the bucket array; sorting is unnecessary."
    code_quality: "The bucket index computation is one clear expression and the range check guards it."
    edge_cases: "No requests, a single bucket, a timestamp exactly at end, duplicates and large epoch values."
    communication: "States the half-open convention and checks the boundary seconds on an example."
hints:
  - "You know how many buckets there are before looking at any timestamp, so you can prepare all the counters up front."
  - "For a timestamp inside the range, its distance from start divided by sixty, rounded down, tells you which bucket it belongs to."
  - "Create an array of zeros with one slot per minute in the range, skip timestamps below start or at or above end, and for every other timestamp add one to the slot given by the floor of the offset from start divided by sixty."
followups:
  - "How would you compute the same histogram with SQL over a requests table?"
  - "How would you support arbitrary bucket widths, such as 5 minutes or 1 hour?"
  - "If the timestamps arrive as an endless stream, how would you keep a rolling last-hour histogram?"
common_errors:
  - "Including timestamps equal to end, which writes past the last bucket."
  - "Computing buckets from absolute clock minutes instead of offsets from start."
  - "Returning only the minutes that had requests and losing the empty ones."
  - "Using floating-point division and an off-by-one rounding at bucket edges."
