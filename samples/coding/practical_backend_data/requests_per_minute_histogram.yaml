title: "Requests per Minute Histogram"
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [sre, devops, backend, data_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Requests per Minute Histogram

  A status page draws a bar chart of traffic for a chosen time range, one bar per minute. The access log
  gives the time of every request as epoch seconds, but the log was merged from several servers, so the
  timestamps are **not sorted** and may repeat.

  Write `requests_per_minute(timestamps, start, end)` for the half-open reporting range `[start, end)`,
  where `end - start` is a positive multiple of 60:

  - Bucket `i` covers the seconds `[start + 60*i, start + 60*(i + 1))`, for `i = 0, 1, ...` up to the
    last bucket that ends at `end`.
  - Return the number of requests in every bucket, in bucket order. A minute with no requests is reported
    as `0` so the chart has no gaps.
  - Timestamps before `start` or at or after `end` are ignored.

  ### Example 1
  ```
  Input:  timestamps = [1700000065, 1700000000, 1700000059, 1700000130, 1700000060], start = 1700000000, end = 1700000180
  Output: [2, 2, 1]
  Explanation: [..000, ..060) has 2 requests, [..060, ..120) has 2, [..120, ..180) has 1
  ```

  ### Example 2
  ```
  Input:  timestamps = [100, 250, 250, 400], start = 120, end = 360
  Output: [0, 0, 2, 0]
  Explanation: 100 and 400 are outside [120, 360); both 250s land in bucket 2
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= timestamps[i] <= 4 * 10^9`
  - `0 <= start < end <= 4 * 10^9`, `end - start` is a multiple of 60 and at most `60 * 10^4`
  - `start` is not necessarily aligned to a whole minute of the clock
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: requests_per_minute
  params:
    - {name: timestamps, type: "long[]"}
    - {name: start, type: "long"}
    - {name: end, type: "long"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def requests_per_minute(timestamps: list[int], start: int, end: int) -> list[int]:
        counts = [0] * ((end - start) // 60)
        for ts in timestamps:
            if start <= ts < end:
                counts[(ts - start) // 60] += 1
        return counts
  javascript: |
    function requestsPerMinute(timestamps, start, end) {
      const counts = new Array((end - start) / 60).fill(0);
      for (const ts of timestamps) {
        if (ts >= start && ts < end) counts[Math.floor((ts - start) / 60)] += 1;
      }
      return counts;
    }
