slug: lru_cache_miss_and_eviction_count
title: LRU Cache Misses and Evictions
difficulty: easy
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, sre, platform, general]
time_limit_minutes: 15
prompt_markdown: |
  ## LRU Cache Misses and Evictions

  A profile service sits behind a read-through cache that holds at most `capacity` keys. Before
  resizing it, the team wants to replay yesterday's access log and count how the cache would behave.

  Process `accesses` in order:

  - **Hit**: the key is in the cache. It becomes the **most recently used** key.
  - **Miss**: the key is not in the cache, so it is loaded. If the cache already holds `capacity` keys,
    the **least recently used** key is first removed (an **eviction**). The loaded key becomes the most
    recently used key.

  The cache starts empty. Return `[misses, evictions]`.

  ### Example 1
  ```
  Input:  capacity = 2, accesses = ["u1", "u2", "u1", "u3", "u2", "u1"]
  Output: [5, 3]
  Explanation: u1 miss, u2 miss, u1 hit (u2 is now least recently used), u3 miss evicts u2,
  u2 miss evicts u1, u1 miss evicts u3.
  ```

  ### Example 2
  ```
  Input:  capacity = 3, accesses = ["a", "b", "a", "c", "a"]
  Output: [3, 0]
  ```

  ### Constraints
  - `1 <= capacity <= 10^5`
  - `0 <= accesses.length <= 10^5`
  - Keys are 1-30 printable ASCII characters and are case-sensitive
  - Aim for `O(1)` work per access
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: lru_misses
  params:
    - {name: capacity, type: int}
    - {name: accesses, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import OrderedDict


    def lru_misses(capacity: int, accesses: list[str]) -> list[int]:
        cache: OrderedDict[str, None] = OrderedDict()  # least recently used first
        misses = evictions = 0
        for key in accesses:
            if key in cache:
                cache.move_to_end(key)
                continue
            misses += 1
            if len(cache) == capacity:
                cache.popitem(last=False)
                evictions += 1
            cache[key] = None
        return [misses, evictions]
  javascript: |
    function lruMisses(capacity, accesses) {
      const cache = new Map(); // insertion order = least recently used first
      let misses = 0;
      let evictions = 0;
      for (const key of accesses) {
        if (cache.has(key)) {
          cache.delete(key);
          cache.set(key, true);
          continue;
        }
        misses++;
        if (cache.size === capacity) {
          cache.delete(cache.keys().next().value);
          evictions++;
        }
        cache.set(key, true);
      }
      return [misses, evictions];
    }
tests:
