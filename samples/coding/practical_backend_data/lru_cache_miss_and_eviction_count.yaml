  - {id: t2, args: [3, ["a", "b", "a", "c", "a"]], expected: [3, 0], description: "Example 2 - everything fits, no evictions"}
  - {id: t3, hidden: true, args: [4, []], expected: [0, 0], description: "Empty access log"}
  - {id: t4, hidden: true, args: [1, ["x", "y", "x", "x", "y"]], expected: [4, 3], description: "Capacity one with alternating keys and a repeated hit"}
  - {id: t5, hidden: true, args: [3, ["a", "b", "c", "d", "a", "b", "c", "d"]], expected: [8, 5], description: "Cyclic scan one larger than the cache - every access misses"}
  - {id: t6, hidden: true, args: [3, ["a", "b", "c", "a", "d", "a", "b", "e", "c"]], expected: [7, 4], description: "Distinguishes LRU from FIFO - the hit on a must protect it from eviction"}
