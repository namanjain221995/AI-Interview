expected_concepts:
  - hash map plus recency order (linked list or ordered map)
  - O(1) hit refresh and eviction
  - counting misses separately from evictions
  - first capacity misses never evict
optimal_complexity: {time: O(n), space: O(capacity)}
rubric:
  excellent: Combines a hash map with a recency-ordered structure (ordered map or doubly linked list) so every access is O(1), refreshes recency on hits, evicts only when full and explains why misses minus evictions equals the number of keys held at the end.
  good: Correct simulation with a minor inefficiency such as an O(capacity) scan to find the least recently used key.
  weak: Implements FIFO instead of LRU, forgets to refresh recency on hits, or counts every miss as an eviction.
  criteria:
    correctness: All tests pass, including capacity one, cyclic scans and the LRU-versus-FIFO case.
    efficiency: Constant time per access using a map plus a recency order.
    code_quality: Small helper or clearly separated hit and miss branches with descriptive names.
    edge_cases: Empty log, capacity larger than the key set and case-sensitive keys.
    communication: Explains the data-structure choice and its trade-offs against a simple list.
hints:
  - Two things are needed for every key in the cache - whether it is present and how recently it was used.
  - A hash map answers "is it present" quickly; pair it with something that keeps keys ordered by last use so the oldest one can be found and removed cheaply.
  - Use an ordered map (or a hash map plus a doubly linked list) where a hit moves the key to the newest end, and a miss removes the oldest key first when the size equals the capacity, counting that as an eviction before inserting the new key.
followups:
  - How would you implement the doubly linked list yourself in a language without an ordered map?
  - How would you replay the log for many capacities at once to draw a hit-rate curve?
  - What changes if entries also expire after a fixed time-to-live?
  - How does an LFU policy differ, and when would it beat LRU?
common_errors:
  - Not moving a key to the most recently used position on a hit, which turns the cache into FIFO.
  - Evicting before checking whether the key is already cached.
  - Scanning a list to find or remove keys, which is O(capacity) per access.
  - Counting an eviction on every miss, including misses while the cache still has free space.
