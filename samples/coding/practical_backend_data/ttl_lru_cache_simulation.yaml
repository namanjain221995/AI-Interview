  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq
    from collections import OrderedDict


    def run_ttl_cache(capacity: int, times: list[int], ops: list[str]) -> list[str]:
        entries: OrderedDict[str, tuple[str, int]] = OrderedDict()  # LRU first, MRU last
        expiries: list[tuple[int, str]] = []  # min-heap of (expires_at, key); may hold stale items
        results: list[str] = []
        for now, op in zip(times, ops):
            # Drop every entry that has expired by now so len(entries) counts live entries only.
            while expiries and expiries[0][0] <= now:
                _, key = heapq.heappop(expiries)
                entry = entries.get(key)
                if entry is not None and entry[1] <= now:
                    del entries[key]
            parts = op.split(" ")
            if parts[0] == "GET":
                entry = entries.get(parts[1])
                if entry is None:
                    results.append("MISS")
                else:
                    entries.move_to_end(parts[1])
                    results.append(entry[0])
            else:
                key, value, ttl = parts[1], parts[2], int(parts[3])
                if key not in entries and len(entries) >= capacity:
                    entries.popitem(last=False)
                expires_at = now + ttl
                entries[key] = (value, expires_at)
                entries.move_to_end(key)
                heapq.heappush(expiries, (expires_at, key))
        return results
  javascript: |
    function runTtlCache(capacity, times, ops) {
      // A Map iterates in insertion order: re-inserting a key makes it the most recently used.
      const entries = new Map();
      const results = [];
      for (let i = 0; i < ops.length; i++) {
        const now = times[i];
        for (const [key, entry] of entries) {
          if (entry.expiresAt <= now) entries.delete(key);
        }
        const parts = ops[i].split(" ");
        if (parts[0] === "GET") {
          const entry = entries.get(parts[1]);
          if (entry === undefined) {
            results.push("MISS");
          } else {
            entries.delete(parts[1]);
            entries.set(parts[1], entry);
            results.push(entry.value);
          }
        } else {
          const key = parts[1];
          if (!entries.has(key) && entries.size >= capacity) {
            entries.delete(entries.keys().next().value);
          }
          entries.delete(key);
          entries.set(key, { value: parts[2], expiresAt: now + Number(parts[3]) });
        }
      }
      return results;
    }
