expected_concepts:
  - hash map plus recency order (linked list or ordered map) for O(1) LRU operations
  - lazy expiry with a min-heap of expiry times
  - only live entries count toward capacity
  - a read refreshes recency but not the time-to-live
  - 64-bit time arithmetic
optimal_complexity: {time: O(n log n) with a heap for expiries, space: O(n)}
rubric:
  excellent: Combines a hash map with a recency list for O(1) LRU updates and a min-heap (or sorted structure) to drop expired entries lazily, applies the live-only capacity rule, keeps TTL unchanged on reads and uses 64-bit times.
  good: Correct simulation with an O(capacity) scan for expired entries or eviction candidates, or a nudge on one rule such as the expiry boundary or re-setting an expired key.
  weak: Counts expired entries toward capacity, refreshes the TTL on reads, evicts by insertion order instead of recency, or returns stale values after expiry.
  criteria:
    correctness: All tests pass, including expiry boundaries, re-set keys and evictions after reads.
    efficiency: Amortised O(log n) or better per operation instead of scanning the whole cache.
    code_quality: Small helpers for purge, touch and evict; the order structure and the map never disagree.
    edge_cases: Capacity 1, GET on an unknown key, SET of an existing live key, SET of an expired key when full, expiry exactly at the current time, very large times.
    communication: Explains how expiry and recency interact and why a lazy purge is correct.
hints:
  - Two separate questions decide every operation - is this entry still alive at the current time, and which live entry was used least recently?
  - An ordered map (or a hash map plus a doubly linked list) gives you the least recently used key in O(1). Expired entries can be removed lazily before each operation, since nobody can observe them anyway.
  - Before each operation, pop every entry whose expiry time is at or before now from a min-heap of (expires_at, key), skipping heap items that are stale because the key was set again. Then a GET hit moves the key to the most-recent end; a SET of a key that is not live evicts the oldest entry when the live count equals capacity, and stores the new entry at the most-recent end.
followups:
  - How would you make this cache safe for concurrent requests from many threads?
  - How would you add a sliding expiration where every read extends the TTL?
  - How does a cache like Redis expire keys without scanning all of them, and what trade-off does it accept?
  - How would you report the hit ratio per minute from this simulation?
common_errors:
  - Counting expired entries toward capacity, which evicts a live entry unnecessarily.
  - Treating an entry as live at exactly its expiry time.
  - Extending the TTL on a GET hit.
  - Evicting the oldest inserted key instead of the least recently used one.
  - Computing expiry times in 32-bit integers.
