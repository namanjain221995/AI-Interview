title: Session Cache with TTL and LRU Eviction
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, platform, sre, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Session Cache with TTL and LRU Eviction

  A login service keeps session tokens in an in-memory cache with room for `capacity` **live** entries.
  Every entry has a time-to-live, and when the cache is full the least recently used entry makes room.
  Replay a log of cache operations and return what every read would have returned.

  Operation `i` happens at time `times[i]` (times never decrease) and is one of:

  - `"SET key value ttl"` - store `value` under `key`; the entry **expires** at `times[i] + ttl`.
  - `"GET key"` - read `key`.

  Rules:

  - An entry is **expired** at every time `now >= expires_at`. Expired entries can never be read and
    do **not** count toward `capacity`.
  - **GET** of a live key returns its value and makes it the **most recently used** entry. Its expiry
    time does not change. A GET of a missing or expired key returns `"MISS"`.
  - **SET** of a key that is live replaces its value and its expiry time and makes it the most recently
    used entry; nothing is evicted.
  - **SET** of any other key (new, or present but expired) first checks the number of live entries. If
    it equals `capacity`, the **least recently used live** entry is evicted. Then the new entry is stored
    as the most recently used.
  - "Recently used" is updated only by a GET hit or a SET.

  Return the results of all GET operations in order.

  ### Example 1
  ```
  Input:  capacity = 2, times = [0, 1, 2, 3, 4, 10, 11],
          ops = ["SET a 1 10", "SET b 2 5", "GET a", "SET c 3 100", "GET b", "GET a", "GET c"]
  Output: ["1", "MISS", "MISS", "3"]
  Explanation: at time 3 the cache is full (a and b are live); the GET at time 2 made a more recent,
  so b is evicted. a expires at 0 + 10 = 10, so the GET at time 10 misses.
  ```

  ### Example 2
  ```
  Input:  capacity = 2, times = [0, 0, 5, 5, 5, 6, 6],
          ops = ["SET s1 x 5", "SET s2 y 100", "GET s1", "SET s3 z 10", "GET s2", "SET s2 w 1", "GET s2"]
  Output: ["MISS", "y", "w"]
  Explanation: s1 expired at time 5, so only s2 is live and s3 fits without an eviction. The second
  SET of s2 replaces its value and expiry time.
  ```

  ### Constraints
  - `1 <= capacity <= 10^5`
  - `0 <= ops.length == times.length <= 10^5`
  - `0 <= times[i] <= 10^15`, and `times` is non-decreasing
  - `1 <= ttl <= 10^15`, so expiry times need 64-bit integers.
  - Keys and values are non-empty and contain only letters, digits, `_`, `-`, `.` and `:`; no value is
    the text `MISS`. Tokens in an operation are separated by single spaces.
languages: [python, javascript, typescript, java, go, cpp]
