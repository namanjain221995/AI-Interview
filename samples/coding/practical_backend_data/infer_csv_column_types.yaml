slug: infer_csv_column_types
title: "Infer Column Types for a CSV Load"
difficulty: medium
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [data, backend, data_analyst, data_scientist]
time_limit_minutes: 20
prompt_markdown: |
  ## Infer Column Types for a CSV Load

  Before a CSV export is bulk-loaded into the warehouse, the loader must pick a type for every column.
  The file has already been split into cells: `rows[0]` is the **header** (unique column names, none
  containing `:`) and every later row is a data row. A data row may be **shorter** than the header;
  its missing trailing cells count as empty. Data rows are never longer than the header.

  Cells are used exactly as given (no trimming). A cell is **empty** when it is the empty string `""`.
  Type each column from its **non-empty** cells, checking the rules in this order:

  1. `empty` - the column has no non-empty cells.
  2. `bool` - every non-empty cell is `true` or `false` in any letter case (`TRUE`, `False`, ...).
  3. `int` - every non-empty cell is an optional sign (`+` or `-`) followed by one or more digits `0-9`.
  4. `float` - every non-empty cell is either an int as above or a **decimal**: an optional sign,
     then digits containing **exactly one** `.`, with at least one digit in total (`1.5`, `-.5`, `3.`
     are decimals; `.`, `1.2.3` and `1e5` are not).
  5. `string` - anything else.

  Return one entry `"name:type"` per column, in header order.

  ### Example 1
  ```
  Input:  rows = [["sku", "qty", "active", "region"], ["A-100", "3", "true", "eu"], ["A-101", "2.5", "FALSE", "42"], ["A-102", "-7", "True", "us"]]
  Output: ["sku:string", "qty:float", "active:bool", "region:string"]
  Explanation: qty mixes ints and a decimal, so it is float; region has a value that
  is not a number.
  ```

  ### Example 2
  ```
  Input:  rows = [["id", "code", "note"], ["1", "007", ""], ["2"], ["+3", "-12"]]
  Output: ["id:int", "code:int", "note:empty"]
  Explanation: the short row counts as empty for code and note. note never has a value.
  ```

  ### Constraints
  - `1 <= rows.length <= 10^4` (the header is always present)
  - `1 <= rows[0].length <= 100`
  - `0 <= rows[i].length <= rows[0].length` for data rows
  - cells contain printable ASCII characters only
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: infer_column_types
  params:
    - {name: rows, type: "string[][]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    DIGITS = set("0123456789")


    def _is_bool(cell: str) -> bool:
        return cell.lower() in ("true", "false")


    def _is_int(cell: str) -> bool:
        body = cell[1:] if cell[:1] in ("+", "-") else cell
        return len(body) > 0 and all(ch in DIGITS for ch in body)


    def _is_decimal(cell: str) -> bool:
        body = cell[1:] if cell[:1] in ("+", "-") else cell
        if body.count(".") != 1:
            return False
        digits = body.replace(".", "")
        return len(digits) > 0 and all(ch in DIGITS for ch in digits)


    def infer_column_types(rows: list[list[str]]) -> list[str]:
        header = rows[0]
        result = []
        for c, name in enumerate(header):
            values = [row[c] for row in rows[1:] if c < len(row) and row[c] != ""]
            if not values:
                kind = "empty"
            elif all(_is_bool(v) for v in values):
                kind = "bool"
            elif all(_is_int(v) for v in values):
                kind = "int"
            elif all(_is_int(v) or _is_decimal(v) for v in values):
                kind = "float"
            else:
                kind = "string"
            result.append(f"{name}:{kind}")
        return result
  javascript: |
    function inferColumnTypes(rows) {
      const isDigits = (s) => s.length > 0 && /^[0-9]+$/.test(s);
      const stripSign = (s) => (s[0] === '+' || s[0] === '-' ? s.slice(1) : s);
      const isBool = (s) => s.toLowerCase() === 'true' || s.toLowerCase() === 'false';
      const isInt = (s) => isDigits(stripSign(s));
      const isDecimal = (s) => {
        const body = stripSign(s);
        if (body.split('.').length !== 2) return false;
        return isDigits(body.replace('.', ''));
      };
      const header = rows[0];
      return header.map((name, c) => {
        const values = [];
        for (let r = 1; r < rows.length; r++) {
          if (c < rows[r].length && rows[r][c] !== '') values.push(rows[r][c]);
        }
        let kind;
        if (values.length === 0) kind = 'empty';
        else if (values.every(isBool)) kind = 'bool';
        else if (values.every(isInt)) kind = 'int';
        else if (values.every((v) => isInt(v) || isDecimal(v))) kind = 'float';
        else kind = 'string';
        return `${name}:${kind}`;
      });
    }
