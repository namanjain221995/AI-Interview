reference_solutions:
  python: |
    def parse_logfmt(line: str) -> list[list[str]]:
        pairs: list[list[str]] = []
        position: dict[str, int] = {}
        i, n = 0, len(line)
        while i < n:
            if line[i] == " ":
                i += 1
                continue
            start = i
            while i < n and line[i] != " " and line[i] != "=":
                i += 1
            key = line[start:i]
            if i < n and line[i] == "=":
                i += 1
                if i < n and line[i] == '"':
                    i += 1
                    chars: list[str] = []
                    closed = False
                    while i < n:
                        ch = line[i]
                        if ch == "\\" and i + 1 < n:
                            chars.append(line[i + 1])
                            i += 2
                        elif ch == '"':
                            closed = True
                            i += 1
                            break
                        else:
                            chars.append(ch)
                            i += 1
                    if not closed:
                        break  # cut-off line: drop this token and stop
                    value = "".join(chars)
                else:
                    value_start = i
                    while i < n and line[i] != " ":
                        i += 1
                    value = line[value_start:i]
            else:
                value = "true"
            if key in position:
                pairs[position[key]][1] = value
            else:
                position[key] = len(pairs)
                pairs.append([key, value])
        return pairs
  javascript: |
    function parseLogfmt(line) {
      const pairs = [];
      const position = new Map();
      let i = 0;
      const n = line.length;
      while (i < n) {
        if (line[i] === " ") {
          i++;
          continue;
        }
        const start = i;
        while (i < n && line[i] !== " " && line[i] !== "=") i++;
        const key = line.slice(start, i);
        let value;
        if (i < n && line[i] === "=") {
          i++;
          if (i < n && line[i] === '"') {
            i++;
            let text = "";
            let closed = false;
            while (i < n) {
              const ch = line[i];
              if (ch === "\\" && i + 1 < n) {
                text += line[i + 1];
                i += 2;
              } else if (ch === '"') {
                closed = true;
                i++;
                break;
              } else {
                text += ch;
                i++;
              }
            }
            if (!closed) break;
            value = text;
          } else {
            const valueStart = i;
            while (i < n && line[i] !== " ") i++;
            value = line.slice(valueStart, i);
          }
        } else {
          value = "true";
        }
        if (position.has(key)) {
          pairs[position.get(key)][1] = value;
        } else {
          position.set(key, pairs.length);
          pairs.push([key, value]);
        }
      }
      return pairs;
    }
