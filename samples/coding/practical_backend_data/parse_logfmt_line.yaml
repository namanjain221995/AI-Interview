expected_concepts:
  - single-pass tokenizer with an index instead of splitting on spaces
  - quoted values with backslash escapes
  - distinguishing bare keys, empty values, unquoted and quoted values
  - hash map from key to its first position for in-place overwrites
  - graceful handling of a truncated final token
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Writes a one-pass tokenizer that handles all four value forms, escapes inside quotes, multiple spaces, repeated keys kept at their first position and a cut-off quoted value, and explains why splitting on spaces or on = fails.
  good: Correct tokenizer for the common forms that needs a nudge on one rule such as repeated-key ordering, empty values or the backslash at the end of a cut-off line.
  weak: Splits the line on spaces or on =, so quoted values with spaces or values containing = break, or appends repeated keys as new pairs.
  criteria:
    correctness: All tests pass, including quoted spaces, escapes, repeated keys and truncated lines.
    efficiency: Linear in the line length with no repeated rescans or quadratic list searches for keys.
    code_quality: Clear separation between reading a key and reading each value form; readable escape handling.
    edge_cases: Empty or all-space line, bare keys, key= at the end, = and quotes inside unquoted values, a line cut off after a backslash.
    communication: States the grammar back before coding and walks through Example 2 including the escapes.
hints:
  - Splitting on spaces breaks quoted values that contain spaces. Walk through the line with an index and decide what to do based on the character you are looking at.
  - After reading a key, look at the next character. A space or the end means a bare key, an equals sign means a value follows, and the character after the equals sign tells you whether that value is empty, unquoted or quoted.
  - Keep a map from key to its index in the result list so a repeated key updates the existing pair. For a quoted value, collect characters until an unescaped quote, replacing a backslash plus the next character by that character; if you reach the end first, stop and return what you have.
followups:
  - How would you emit an error with the column of the problem instead of silently stopping?
  - How would you format pairs back into a logfmt line so that parsing the output gives the same pairs?
  - What would you change to support \n and \t escapes inside quoted values?
  - How would you parse a 2 GB log file of these lines with bounded memory?
common_errors:
  - Splitting the line on spaces, which breaks quoted values that contain spaces.
  - Splitting each token on every = instead of only the first one.
  - Appending a repeated key as a new pair or moving it to the position of its last occurrence.
  - Treating an escaped quote as the closing quote.
  - Keeping the half-parsed token when the line is cut off inside quotes.
