title: Parse a logfmt Line
difficulty: medium
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [sre, backend, platform, devops]
time_limit_minutes: 20
prompt_markdown: |
  ## Parse a logfmt Line

  Your services write structured logs in the *logfmt* style, one event per line, for example
  `level=warn msg="disk almost full" mount=/data pct=91 alert`. The log shipper needs a function that
  turns one line into an ordered list of `[key, value]` pairs.

  A line is a sequence of **tokens** separated by one or more spaces (leading and trailing spaces are
  allowed and ignored). Every token starts with a **key**: one or more characters from `A-Z`, `a-z`,
  `0-9`, `_`, `.` and `-`. What follows the key decides the value:

  - **Bare key** (the key is followed by a space or the end of the line): the value is `"true"`.
  - **`key=` followed by a space or the end of the line**: the value is the empty string.
  - **`key=` followed by a character other than `"`**: an unquoted value made of every character up to
    the next space or the end of the line. Inside an unquoted value, `=` and `"` are ordinary characters.
  - **`key="`**: a quoted value that runs until the next unescaped `"`. Inside it, `\"` stands for a
    `"` and `\\` stands for a `\`; every other character, including spaces and `=`, is taken literally.

  **Repeated keys**: when a key appears again, its value is replaced by the newer one, but the pair keeps
  the position where the key **first** appeared.

  **Broken lines**: logs are sometimes cut off mid-write. If a quoted value is never closed, stop: ignore
  that token and return the pairs parsed before it.

  Return the pairs in order of first appearance; return an empty list for a line with no tokens. In the
  examples, strings are written as string literals, so `\"` is a quote and `\\` is one backslash.

  ### Example 1
  ```
  Input:  line = "level=info msg=\"user login\" user_id=42 cached"
  Output: [["level", "info"], ["msg", "user login"], ["user_id", "42"], ["cached", "true"]]
  ```

  ### Example 2
  ```
  Input:  line = "status=200  retry= status=503 note=\"said \\\"ok\\\"\""
  Output: [["status", "503"], ["retry", ""], ["note", "said \"ok\""]]
  Explanation: status is replaced by 503 but stays first; retry has an empty value; the quoted note
  contains two escaped quotes.
  ```

  ### Example 3
  ```
  Input:  line = "svc=api err=\"timeout after 30s"
  Output: [["svc", "api"]]
  Explanation: the quoted value of err is never closed, so err is dropped.
  ```

  ### Constraints
  - `0 <= line.length <= 10^5`
  - `line` contains printable ASCII characters only (no tabs or newlines).
  - Apart from a possibly unclosed final quoted value, every line is well formed: each token starts with
    a valid key followed by a space, `=` or the end of the line; a closing quote is always followed by a
    space or the end of the line; and inside quotes a backslash is always followed by `"` or `\`, unless
    the line is cut off right after the backslash.
  - Keys are case-sensitive (`Level` and `level` are different keys).
