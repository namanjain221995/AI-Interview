  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def compact_changes(events: list[list[str]]) -> list[list[str]]:
        first: dict[str, list[str]] = {}
        last: dict[str, list[str]] = {}
        for event in events:
            key = event[1]
            if key not in first:
                first[key] = event
            last[key] = event
        result: list[list[str]] = []
        for key in sorted(first):
            op_first, _, original, _ = first[key]
            op_last, _, _, final = last[key]
            existed = op_first != "I"
            exists = op_last != "D"
            if existed and exists:
                if original != final:
                    result.append(["U", key, original, final])
            elif exists:
                result.append(["I", key, "", final])
            elif existed:
                result.append(["D", key, original, ""])
        return result
  javascript: |
    function compactChanges(events) {
      const first = new Map();
      const last = new Map();
      for (const event of events) {
        const key = event[1];
        if (!first.has(key)) first.set(key, event);
        last.set(key, event);
      }
      const keys = [...first.keys()].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      const result = [];
      for (const key of keys) {
        const [opFirst, , original] = first.get(key);
        const lastEvent = last.get(key);
        const existed = opFirst !== "I";
        const exists = lastEvent[0] !== "D";
        if (existed && exists) {
          if (original !== lastEvent[3]) result.push(["U", key, original, lastEvent[3]]);
        } else if (exists) {
          result.push(["I", key, "", lastEvent[3]]);
        } else if (existed) {
          result.push(["D", key, original, ""]);
        }
      }
      return result;
    }
