prompt_markdown: |
  ## Compact a CDC Stream to Net Changes

  A change-data-capture (CDC) connector streams every row change of a `prices` table to a data
  warehouse. Loading each event is expensive, so before every load the pipeline **compacts** a batch of
  events into the smallest set of changes with the same overall effect.

  Each event is `[op, key, before, after]`:

  - `["I", key, "", after]` - the row `key` was inserted with value `after`.
  - `["U", key, before, after]` - the row's value changed from `before` to `after`.
  - `["D", key, before, ""]` - the row was deleted; `before` is its last value.

  Events are in commit order and consistent per key: an `I` only happens when the row does not exist,
  `U` and `D` only when it exists, and each `before` equals the row's value at that moment.

  Compact each key **separately**, comparing the state before its first event in the batch with the
  state after its last event:

  - The row **existed before** the batch if its first event is `U` or `D`; its original value is that
    event's `before`.
  - The row **exists after** the batch if its last event is `I` or `U`; its final value is that event's
    `after`.

  | existed before | exists after | output |
  |---|---|---|
  | no | yes | `["I", key, "", final]` |
  | yes | no | `["D", key, original, ""]` |
  | yes | yes | `["U", key, original, final]`, or **nothing** if `original == final` |
  | no | no | nothing |

  Return the output rows sorted by `key` in plain character-code (ASCII) order.

  ### Example 1
  ```
  Input:  events = [["I", "sku-9", "", "5.00"], ["U", "sku-1", "2.50", "2.75"], ["U", "sku-9", "5.00", "4.80"],
                    ["D", "sku-1", "2.75", ""], ["I", "sku-5", "", "1.00"], ["D", "sku-5", "1.00", ""],
                    ["U", "sku-3", "7.00", "7.25"]]
  Output: [["D", "sku-1", "2.50", ""], ["U", "sku-3", "7.00", "7.25"], ["I", "sku-9", "", "4.80"]]
  Explanation: sku-5 was inserted and deleted inside the batch, so it disappears; sku-1's delete
  reports the value it had before the batch.
  ```

  ### Example 2
  ```
  Input:  events = [["U", "a", "10", "12"], ["D", "b", "3", ""], ["I", "b", "", "4"], ["U", "a", "12", "10"]]
  Output: [["U", "b", "3", "4"]]
  Explanation: a ends with its original value, so it needs no change. b was deleted and re-inserted,
  which is an update from 3 to 4.
  ```

  ### Constraints
  - `0 <= events.length <= 10^5`
  - `op` is `"I"`, `"U"` or `"D"`; keys are non-empty printable ASCII strings.
  - Values are printable ASCII strings and may be empty (an `I` or `U` can store an empty value).
  - The events are consistent per key as described above.
languages: [python, javascript, typescript, java, go, cpp]
signature:
