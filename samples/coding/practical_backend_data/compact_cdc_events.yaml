expected_concepts:
  - per-key grouping with hash maps (first and last event)
  - net effect from the state before and after the batch
  - before and after images in change-data-capture events
  - dropping no-op updates and insert-then-delete pairs
  - deterministic character-code ordering of keys
optimal_complexity: {time: O(n + k log k) for k distinct keys, space: O(k)}
rubric:
  excellent: Explains that only the first and last event per key matter, derives the four cases from existed-before and exists-after, drops insert-then-delete and no-op updates, and sorts keys in character-code order with a linear pass otherwise.
  good: Correct compaction for most patterns but needs a nudge on one case such as delete-then-insert becoming an update, the original value of a delete, or the no-op update.
  weak: Replays events into a final-state table and loses the original values, emits the last op per key unchanged, or keeps rows for keys inserted and deleted in the batch.
  criteria:
    correctness: All tests pass, including delete-then-insert, insert-then-delete and updates that revert.
    efficiency: One pass to record the first and last events plus a sort of the distinct keys.
    code_quality: The four outcomes are explicit and mirror the table; no deep nesting over op combinations.
    edge_cases: Empty batch, a single event, empty-string values, keys that differ only in letter case, long chains on one key.
    communication: Explains why intermediate events can be ignored when the stream is consistent.
hints:
  - For one key, do the events in the middle of its history matter, or only how the row looked before the first event and after the last one?
  - The first event tells you whether the row existed before the batch and, through its before image, what its original value was. The last event tells you whether the row exists afterwards and its final value.
  - Store the first and last event of every key in two hash maps. Then, for each key in sorted order, compute existed = first op is not I and exists = last op is not D, and emit I, D, U or nothing according to the table, skipping a U whose original and final values are equal.
followups:
  - How would you compact a stream that also contains events for many different tables?
  - What changes if the connector can deliver an event twice or out of order?
  - Why is dropping an insert-then-delete pair safe for the warehouse but maybe not for an audit log?
  - How would you compact in a streaming fashion with bounded memory per key?
common_errors:
  - Emitting the last op of each key unchanged, so delete-then-insert becomes an insert of an existing row.
  - Reporting a delete with the last before image instead of the value the row had before the batch.
  - Keeping a row for a key that was inserted and deleted inside the batch.
  - Emitting an update whose final value equals the original value.
  - Sorting keys case-insensitively or by first appearance.
