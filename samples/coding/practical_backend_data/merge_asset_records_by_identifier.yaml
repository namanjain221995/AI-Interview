version: 1
slug: merge_asset_records_by_identifier
title: "Merge Scanner Records into Assets"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, security, devops, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Merge Scanner Records into Assets

  The asset inventory is fed by several network scanners. Each scanner emits **records**; a record is
  a list of identifiers it observed for one machine, written as `kind:value` strings such as
  `"host:web-01"`, `"mac:0a:1b:2c"` or `"ip:10.0.0.5"`. Identifiers are compared as exact,
  case-sensitive strings, and the same identifier may be listed twice in one record.

  Two records describe the **same asset** when they share at least one identifier, either directly or
  through a chain of records (if record A shares an identifier with B, and B shares one with C, then
  A, B and C are one asset even if A and C share nothing).

  Implement `merge_asset_records(records)`, which returns the assets as groups of record **indices**:

  - every record index appears in exactly one group;
  - indices inside a group are sorted ascending;
  - groups are ordered by their smallest index;
  - a record with no identifiers shares nothing, so it forms a group on its own.

  ### Example 1
  ```
  Input:  records = [["host:web-01", "ip:10.0.0.4"], ["mac:0a:1b:2c"], ["ip:10.0.0.5", "host:web-01"], ["ip:10.0.0.5"]]
  Output: [[0, 2, 3], [1]]
  Explanation: records 0 and 2 share host:web-01, and record 3 joins them through
  ip:10.0.0.5. Record 1 shares nothing.
  ```

  ### Example 2
  ```
  Input:  records = [["host:db"], [], ["HOST:db", "mac:ff:01"], ["mac:ff:01", "mac:ff:01"], ["host:db", "ip:192.168.1.9"]]
  Output: [[0, 4], [1], [2, 3]]
  Explanation: the empty record 1 is its own asset; HOST:db and host:db differ.
  ```

  ### Constraints
  - `0 <= records.length <= 10^4`
  - `0 <= records[i].length <= 20`
  - every identifier has length 1 to 60
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: merge_asset_records
  params:
    - {name: records, type: "string[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def merge_asset_records(records: list[list[str]]) -> list[list[int]]:
        parent = list(range(len(records)))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        owner: dict[str, int] = {}
        for i, identifiers in enumerate(records):
            for ident in identifiers:
                if ident in owner:
                    a, b = find(owner[ident]), find(i)
                    if a != b:
                        # Keep the smaller index as the root.
                        if a < b:
                            parent[b] = a
                        else:
                            parent[a] = b
                else:
                    owner[ident] = i
        groups: dict[int, list[int]] = {}
        order: list[int] = []
        for i in range(len(records)):
            root = find(i)
            if root not in groups:
                groups[root] = []
                order.append(root)
            groups[root].append(i)
        return [groups[r] for r in order]
  javascript: |
    function mergeAssetRecords(records) {
      const parent = records.map((_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const owner = new Map();
      records.forEach((identifiers, i) => {
        for (const ident of identifiers) {
          if (owner.has(ident)) {
            const a = find(owner.get(ident));
            const b = find(i);
            if (a !== b) {
              if (a < b) parent[b] = a;
              else parent[a] = b;
            }
          } else {
            owner.set(ident, i);
          }
        }
      });
      const groups = new Map();
      const order = [];
      for (let i = 0; i < records.length; i++) {
        const root = find(i);
        if (!groups.has(root)) {
          groups.set(root, []);
          order.push(root);
        }
        groups.get(root).push(i);
      }
      return order.map((r) => groups.get(r));
    }
