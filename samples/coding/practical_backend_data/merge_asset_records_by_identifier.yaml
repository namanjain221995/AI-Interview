expected_concepts:
  - "union-find (disjoint set union) with path compression"
  - "hash map from identifier to the first record that used it"
  - "graph connected components as an alternative (BFS or DFS)"
  - "deterministic output ordering"
optimal_complexity: {time: "O(L * alpha(n)) plus output construction, where L is the total number of identifiers", space: "O(n + L)"}
rubric:
  excellent: "Maps each identifier to a record, unions records with union-find (or builds a graph and runs BFS), handles transitive links, empty records and duplicates, produces the required ordering and states near-linear complexity."
  good: "Correct graph or union-find solution with minor ordering or edge-case fixes after running tests."
  weak: "Compares every pair of records with set intersection only once without transitivity, or uses quadratic pairwise comparisons without discussing cost."
  criteria:
    correctness: "All tests pass, including chains that are discovered out of order and records that bridge two groups."
    efficiency: "Near-linear in the total number of identifiers; no all-pairs comparison of records."
    code_quality: "Small find and union helpers, clear names for the identifier owner map and the groups."
    edge_cases: "Empty input, empty records, repeated identifiers and case-sensitive matching."
    communication: "Explains why a record that shares identifiers with two groups must merge those groups."
hints:
  - "Think of the records as nodes in a graph, connected when they share an identifier; each asset is a connected piece of that graph."
  - "You do not need an edge between every pair of records sharing an identifier: linking each record to the first record that used the identifier is enough to keep everything connected."
  - "Keep a map from identifier to the first record index that used it and a union-find over indices; union each record with that first owner, then collect the indices by root in ascending index order so the groups come out sorted and ordered by their smallest index."
followups:
  - "How would you support adding new scanner records incrementally without recomputing everything?"
  - "What if some identifiers, such as a shared NAT ip, should not be allowed to merge assets?"
  - "How would you explain to an operator why two records were merged (which chain linked them)?"
  - "How does union by rank or size change the complexity guarantees?"
