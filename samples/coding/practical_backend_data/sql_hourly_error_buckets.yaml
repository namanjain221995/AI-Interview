expected_concepts:
  - integer division to bucket timestamps
  - GROUP BY on a computed expression
  - conditional aggregation with SUM(CASE ...) or COUNT(CASE ...)
  - deterministic ORDER BY
optimal_complexity: {time: O(n log n) for grouping and sorting, space: O(h) where h is the number of non-empty hours}
rubric:
  excellent: Buckets with (ts / 3600) * 3600, groups by that expression, counts errors with SUM(CASE WHEN status >= 500 THEN 1 ELSE 0 END), orders by hour_start and explains why integer division floors only for non-negative timestamps.
  good: Correct query after a hint about NULL from a CASE without ELSE or about the >= 500 boundary.
  weak: Uses vendor-specific date functions, groups by the raw ts, filters errors in WHERE (losing hours or totals) or omits ORDER BY.
  criteria:
    correctness: All tests pass, including hour boundaries, hours with no errors and status 499 versus 500.
    efficiency: One grouped scan; mentions an index on ts for time-range filtering.
    code_quality: Clear output aliases and the bucket expression written once or referenced consistently.
    edge_cases: Empty table, rows exactly on the hour, all-error hours and out-of-order inserts.
    communication: Explains why a WHERE status >= 500 filter would break total_requests.
hints:
  - Every request in the same hour shares the same value once its timestamp is rounded down to the hour; group on that value.
  - Integer division by 3600 followed by multiplication by 3600 rounds down for non-negative timestamps. Counting errors needs a condition inside the aggregate, not in WHERE.
  - Select (ts / 3600) * 3600 as hour_start with COUNT(*) and SUM(CASE WHEN status >= 500 THEN 1 ELSE 0 END), group by the same bucket expression and order by hour_start.
followups:
  - How would you also return hours with zero requests in a given range?
  - How would you compute the error rate as a percentage with two decimals portably?
  - Which index helps when the panel only shows the last 24 hours?
common_errors:
  - Putting status >= 500 in the WHERE clause, which drops successful requests from total_requests and hides hours without errors.
  - Writing CASE WHEN status >= 500 THEN 1 END inside SUM, which returns NULL for hours without errors.
  - Using status > 500, which misses 500 Internal Server Error.
  - Relying on GROUP BY order instead of an explicit ORDER BY.
