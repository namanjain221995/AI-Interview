version: 1
slug: sql_hourly_error_buckets
title: Hourly Request and Error Counts (SQL)
difficulty: easy
competency_keys: [sql, databases]
role_tags: [backend, sre, data_analyst, data]
time_limit_minutes: 12
prompt_markdown: |
  ## Hourly Request and Error Counts

  An API gateway writes one row per request to table `request_log`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | ts | INTEGER | request time as Unix epoch seconds (UTC), `ts >= 0` |
  | status | INTEGER | HTTP status code returned to the client |

  For an error-rate panel, return one row per **hour that has at least one request** with:

  - `hour_start`: the start of the hour, i.e. `ts` rounded **down** to a multiple of `3600`. Compute it
    with integer arithmetic on `ts`; do not use date or time functions.
  - `total_requests`: the number of requests in that hour.
  - `error_requests`: how many of them have `status >= 500` (`0` when there are none, never NULL).

  Order the rows by `hour_start` ascending. Hours without requests do not appear.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example
  ```
  request_log
  +----+------------+--------+
  | id | ts         | status |
  +----+------------+--------+
  | 1  | 1700000000 | 200    |
  | 2  | 1700001000 | 503    |
  | 3  | 1700002000 | 200    |
  | 4  | 1700003000 | 404    |
  | 5  | 1700003599 | 500    |
  | 6  | 1700010000 | 502    |
  +----+------------+--------+

  Output
  +------------+----------------+----------------+
  | hour_start | total_requests | error_requests |
  +------------+----------------+----------------+
  | 1699999200 | 3              | 1              |
  | 1700002800 | 2              | 1              |
  | 1700010000 | 1              | 1              |
  +------------+----------------+----------------+
  1700003599 is the last second of the hour that starts at 1700002800; 404 is not an error;
  1700010000 is itself a multiple of 3600.
  ```

  ### Example 2
  ```
  request_log
  +----+-------+--------+
  | id | ts    | status |
  +----+-------+--------+
  | 1  | 7200  | 200    |
  | 2  | 7300  | 301    |
  | 3  | 10799 | 404    |
  +----+-------+--------+

  Output
  +------------+----------------+----------------+
  | hour_start | total_requests | error_requests |
  +------------+----------------+----------------+
  | 7200       | 3              | 0              |
  +------------+----------------+----------------+
  ```
languages: [sql]
starter_code:
  sql: |
    -- Return hour_start, total_requests and error_requests per hour, ordered by hour_start.
    SELECT ts AS hour_start, 1 AS total_requests, 0 AS error_requests
    FROM request_log;
reference_solutions:
  sql: |
    SELECT (ts / 3600) * 3600 AS hour_start,
           COUNT(*) AS total_requests,
           SUM(CASE WHEN status >= 500 THEN 1 ELSE 0 END) AS error_requests
    FROM request_log
    GROUP BY (ts / 3600) * 3600
    ORDER BY hour_start;
sql_setup: |
  CREATE TABLE request_log (
    id INTEGER PRIMARY KEY,
    ts INTEGER NOT NULL,
    status INTEGER NOT NULL
  );
tests:
  - id: t1
    ordered: true
    description: "Example - two hours, the boundary row at ...599 stays in the earlier hour, empty hours omitted"
    setup_sql: |
      INSERT INTO request_log (id, ts, status) VALUES
        (1, 1700000000, 200), (2, 1700001000, 503), (3, 1700002000, 200), (4, 1700003000, 404), (5, 1700003599, 500),
        (6, 1700010000, 502);
    expected_rows: [[1699999200, 3, 1], [1700002800, 2, 1], [1700010000, 1, 1]]
  - id: t2
    ordered: true
    description: "Only successful requests - error_requests must be 0, not NULL"
    setup_sql: |
      INSERT INTO request_log (id, ts, status) VALUES (1, 7200, 200), (2, 7300, 301), (3, 10799, 404);
    expected_rows: [[7200, 3, 0]]
  - id: t3
    hidden: true
    ordered: true
    description: "Empty table - no rows"
    expected_rows: []
  - id: t4
    hidden: true
    ordered: true
    description: "Status 499 is not an error and 500 is; 599 is an error"
    setup_sql: |
      INSERT INTO request_log (id, ts, status) VALUES
        (1, 3600, 499), (2, 3601, 500), (3, 3602, 599), (4, 3603, 200);
    expected_rows: [[3600, 4, 2]]
  - id: t5
    hidden: true
    ordered: true
    description: "Timestamps exactly on hour boundaries and one second before"
    setup_sql: |
      INSERT INTO request_log (id, ts, status) VALUES
        (1, 0, 500), (2, 3599, 200), (3, 3600, 503), (4, 7199, 200), (5, 7200, 200);
    expected_rows: [[0, 2, 1], [3600, 2, 1], [7200, 1, 0]]
  - id: t6
    hidden: true
    ordered: true
    description: "Rows inserted out of time order; output must still be ordered by hour_start"
    setup_sql: |
      INSERT INTO request_log (id, ts, status) VALUES
        (1, 1700020000, 500), (2, 1700000500, 200), (3, 1700010000, 502), (4, 1700000001, 504);
    expected_rows: [[1699999200, 2, 1], [1700010000, 1, 1], [1700017200, 1, 1]]
  - id: t7
    hidden: true
    ordered: true
    description: "Single hour where every request failed"
    setup_sql: |
      INSERT INTO request_log (id, ts, status) VALUES
        (1, 1699999200, 500), (2, 1699999300, 502), (3, 1700002799, 503);
    expected_rows: [[1699999200, 3, 3]]
  - id: t8
    hidden: true
    ordered: true
    description: "Hours far apart with gaps in between are not filled"
    setup_sql: |
