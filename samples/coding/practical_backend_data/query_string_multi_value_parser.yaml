slug: query_string_multi_value_parser
title: "Query String Parser with Repeated Keys"
difficulty: easy
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [backend, frontend, fullstack, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Query String Parser with Repeated Keys

  A search page submits its filters as a form, and the browser serialises the form into a query string.
  Checkbox groups repeat the same field, and the front-end library writes array fields with a `[]`
  suffix, so the backend receives strings such as `brand=acme&tag[]=red&tag[]=blue+sky`. The backend
  team wants a small, dependency-free parser that groups every value by its field.

  Write `parse_query(query)`. The input is the query string **without** a leading `?`. Process it as
  follows:

  1. Split `query` on `&`. Skip empty segments (for example from `a=1&&b=2` or a trailing `&`).
  2. Split each segment at its **first** `=` into a raw key and a raw value. A segment without `=` has
     the value `""`.
  3. Decode the key and the value separately in **one left-to-right pass**: `+` becomes a space and
     `%XX` (two hexadecimal digits, upper or lower case) becomes the character with that code. Decoded
     characters are never decoded again, so `%2B` becomes a literal `+` and `%25` a literal `%`.
  4. If the decoded key ends with `[]`, remove that one suffix, so `tag[]` and `tag` are the same field.
  5. If the resulting key is empty, skip the pair.

  Return one row per distinct key, `[key, value1, value2, ...]`. Rows are ordered by the **first
  appearance** of their key and values are listed in input order. An empty query returns `[]`.

  ### Example 1
  ```
  Input:  query = "brand=acme&tag[]=red&tag[]=blue+sky&brand=globex"
  Output: [["brand", "acme", "globex"], ["tag", "red", "blue sky"]]
  Explanation: tag[] is the field tag; rows follow the first appearance of brand, then tag
  ```

  ### Example 2
  ```
  Input:  query = "q=50%25+off&&debug&sort=price%3Aasc&=orphan&tag=new&tag%5B%5D=sale"
  Output: [["q", "50% off"], ["debug", ""], ["sort", "price:asc"], ["tag", "new", "sale"]]
  Explanation: %25 is %, %3A is :, "debug" has value "", "=orphan" has an empty key, tag%5B%5D decodes to tag[]
  ```

  ### Example 3
  ```
  Input:  query = ""
  Output: []
  Explanation: no segments at all
  ```

  ### Constraints
  - `0 <= query.length <= 4000`
  - `query` contains printable ASCII characters only and no `#`
  - Every `%` is followed by two hexadecimal digits encoding a printable ASCII character (`20` to `7E`)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parse_query
  params:
    - {name: query, type: "string"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def _decode(text: str) -> str:
        out: list[str] = []
        i = 0
        while i < len(text):
            ch = text[i]
            if ch == "+":
                out.append(" ")
                i += 1
            elif ch == "%":
                out.append(chr(int(text[i + 1:i + 3], 16)))
                i += 3
            else:
                out.append(ch)
                i += 1
        return "".join(out)


    def parse_query(query: str) -> list[list[str]]:
        rows: dict[str, list[str]] = {}  # dicts keep first-insertion order
        for segment in query.split("&"):
            if not segment:
                continue
            raw_key, _, raw_value = segment.partition("=")
            key = _decode(raw_key)
            if key.endswith("[]"):
                key = key[:-2]
            if not key:
                continue
            rows.setdefault(key, [key]).append(_decode(raw_value))
        return list(rows.values())
  javascript: |
    function decodePart(text) {
      let out = "";
      let i = 0;
      while (i < text.length) {
        const ch = text[i];
        if (ch === "+") {
          out += " ";
          i += 1;
        } else if (ch === "%") {
          out += String.fromCharCode(parseInt(text.slice(i + 1, i + 3), 16));
          i += 3;
        } else {
          out += ch;
          i += 1;
        }
      }
      return out;
    }

    function parseQuery(query) {
      const rows = new Map();
      for (const segment of query.split("&")) {
        if (segment.length === 0) continue;
        const eq = segment.indexOf("=");
        const rawKey = eq === -1 ? segment : segment.slice(0, eq);
        const rawValue = eq === -1 ? "" : segment.slice(eq + 1);
        let key = decodePart(rawKey);
        if (key.endsWith("[]")) key = key.slice(0, -2);
        if (key.length === 0) continue;
        if (!rows.has(key)) rows.set(key, [key]);
        rows.get(key).push(decodePart(rawValue));
      }
      return [...rows.values()];
    }
