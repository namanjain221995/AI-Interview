expected_concepts:
  - "splitting at the first occurrence of a delimiter"
  - "single-pass percent decoding and plus-as-space"
  - "grouping values under keys while preserving insertion order"
  - "normalising array-style key suffixes"
  - "skipping empty segments and empty keys"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Follows the five steps in order, splits only at the first '=', decodes in a single pass so escaped plus and percent stay literal, strips one [] suffix after decoding, skips empty keys and keeps first-appearance order with an insertion-ordered map."
  good: "Correct parser that needs a nudge on one rule such as the first '=', double decoding, the [] suffix or row order."
  weak: "Splits on every '=', decodes twice or decodes before splitting, sorts the keys, drops keys without '=' or fails on empty segments."
  criteria:
    correctness: "All tests pass, including escaped plus and percent, empty keys and array suffixes."
    efficiency: "Each character is examined a constant number of times; grouping uses a hash map."
    code_quality: "Decoding lives in one small helper used for both keys and values; the pipeline steps are visible in order."
    edge_cases: "Empty query, separators only, values containing '=', keys that are only [], and keys differing only in case."
    communication: "Explains why decoding must happen after splitting and why it must not run twice."
hints:
  - "Treat the specification as a pipeline: split into segments, split each segment into key and value, decode, normalise the key, then group."
  - "Splitting must happen before decoding, otherwise an encoded ampersand or equals sign would be mistaken for a separator; write one decoding helper that walks the text once and use it for both parts."
  - "For every non-empty segment, cut at the first equals sign (no sign means an empty value), decode both halves in a single scan that turns plus into a space and a percent sign plus two hex digits into one character, drop one trailing [] from the key, skip empty keys, and append the value to an insertion-ordered map whose entries start with the key."
followups:
  - "How should the parser behave when a '%' is not followed by two hex digits?"
  - "How would you decode UTF-8 byte sequences such as %C3%A9 into one character?"
  - "What security problems can arise when a backend merges repeated parameters differently from a proxy in front of it?"
common_errors:
  - "Decoding the whole query before splitting, so %26 or %3D create extra segments or pairs."
  - "Splitting each segment on every '=' and losing the rest of a value that contains '='."
  - "Decoding twice, turning %2525 into % or %2B into a space."
  - "Sorting keys alphabetically instead of keeping first-appearance order."
  - "Removing the [] suffix before decoding, which misses the encoded form %5B%5D."
