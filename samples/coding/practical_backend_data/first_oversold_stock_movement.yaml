time_limit_minutes: 15
prompt_markdown: |
  ## First Movement That Oversells Stock

  A warehouse system was supposed to reject any stock movement that pushes a product below zero units,
  but a bug let some through. To find where the ledger first went wrong, you replay it.

  - `opening_skus[i]` starts the day with `opening_qty[i]` units. A SKU that is **not listed** starts
    at `0` units. SKU codes are case-sensitive.
  - Movement `j` has id `move_ids[j]`, touches SKU `move_skus[j]` and changes its balance by
    `deltas[j]` (positive for a receipt, negative for a shipment). Movements are applied **in the order
    given**, which is not necessarily the order of their ids.

  Return the **id** of the first movement after which the balance of the SKU it touched is **below
  zero**. A balance of exactly `0` is fine. Return `-1` if no movement ever makes a balance negative.

  ### Example 1
  ```
  Input:  opening_skus = ["A-100", "B-200"], opening_qty = [5, 2],
          move_ids = [101, 102, 103, 104], move_skus = ["A-100", "B-200", "A-100", "C-300"],
          deltas = [-3, 4, -3, -1]
  Output: 103
  Explanation: A-100 goes 5 -> 2 -> -1 at movement 103. Movement 104 (C-300 starts at 0) would also
  go negative, but 103 happens first.
  ```

  ### Example 2
  ```
  Input:  opening_skus = ["KB-1"], opening_qty = [1],
          move_ids = [7, 8, 9], move_skus = ["MS-2", "MS-2", "KB-1"], deltas = [3, -2, -1]
  Output: -1
  Explanation: MS-2 goes 0 -> 3 -> 1 and KB-1 goes 1 -> 0; nothing drops below zero.
  ```

  ### Constraints
  - `0 <= opening_skus.length == opening_qty.length <= 10^5`; `opening_skus` has no duplicates
  - `0 <= opening_qty[i] <= 10^6`
  - `0 <= move_ids.length == move_skus.length == deltas.length <= 10^5`
  - `move_ids` are distinct and `1 <= move_ids[j] <= 10^9`
  - `-10^4 <= deltas[j] <= 10^4`
  - SKU codes are 1-20 printable ASCII characters
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_oversell
  params:
    - {name: opening_skus, type: "string[]"}
    - {name: opening_qty, type: "int[]"}
    - {name: move_ids, type: "int[]"}
    - {name: move_skus, type: "string[]"}
    - {name: deltas, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def first_oversell(opening_skus: list[str], opening_qty: list[int], move_ids: list[int],
                       move_skus: list[str], deltas: list[int]) -> int:
        balance = dict(zip(opening_skus, opening_qty))
        for move_id, sku, delta in zip(move_ids, move_skus, deltas):
            balance[sku] = balance.get(sku, 0) + delta
            if balance[sku] < 0:
                return move_id
        return -1
  javascript: |
    function firstOversell(openingSkus, openingQty, moveIds, moveSkus, deltas) {
      const balance = new Map();
      for (let i = 0; i < openingSkus.length; i++) balance.set(openingSkus[i], openingQty[i]);
      for (let j = 0; j < moveIds.length; j++) {
        const next = (balance.get(moveSkus[j]) ?? 0) + deltas[j];
        balance.set(moveSkus[j], next);
        if (next < 0) return moveIds[j];
      }
      return -1;
    }
