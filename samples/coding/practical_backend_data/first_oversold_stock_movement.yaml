expected_concepts:
  - hash map from SKU to running balance
  - default of zero for unknown keys
  - single pass with early exit
  - returning the movement id rather than its position
optimal_complexity: {time: O(n + m), space: O(n + k) where k is the number of distinct SKUs moved}
rubric:
  excellent: Builds a map of running balances seeded from the opening stock, treats unknown SKUs as zero, stops at the first negative balance and returns its movement id, explaining the single O(n + m) pass.
  good: Correct map-based solution with a minor slip (such as returning the index or forgetting unlisted SKUs) that is fixed after running the tests.
  weak: Rescans the whole ledger for every movement, tracks one global total instead of per-SKU balances, or treats a balance of exactly zero as an oversell.
  criteria:
    correctness: All tests pass, including unlisted SKUs, case-sensitive codes and ids that are not in application order.
    efficiency: One pass over the opening list and one over the movements with constant-time map updates.
    code_quality: Clear names for the balance map and the movement fields; returns as soon as the answer is known.
    edge_cases: No movements, empty opening list, balance exactly zero and restocks after a dip.
    communication: Explains why only the SKU touched by the current movement needs checking.
hints:
  - Each movement changes exactly one product, so you only ever need to look at that product's current balance.
  - Keep a running balance per SKU in a structure with fast lookups, starting from the opening quantities and treating unknown SKUs as zero.
  - Load the opening quantities into a map, then walk the movements in order, add each delta to its SKU's entry and return that movement's id the moment the entry drops below zero; return -1 after the loop.
followups:
  - How would you report every SKU that ever went negative, with the first offending movement for each?
  - If the ledger were too large for memory but sorted by SKU, how would you process it?
  - How would you enforce the rule at write time so that concurrent shipments cannot oversell?
common_errors:
  - Returning the position of the movement instead of its id.
  - Failing on SKUs that are missing from the opening list instead of starting them at zero.
  - Flagging a balance of exactly zero as an oversell.
  - Summing all SKUs together instead of keeping a balance per SKU.
