reference_solutions:
  python: |
    import heapq


    def tumbling_window_counts(event_times: list[int], window: int, allowed_lateness: int) -> list[list[int]]:
        counts: dict[int, int] = {}  # open window start -> events counted so far
        starts: list[int] = []  # min-heap of open window starts
        watermark = None  # no event seen yet: nothing is closed
        dropped = 0
        out: list[list[int]] = []
        for t in event_times:
            start = t - t % window
            if watermark is not None and start + window <= watermark:
                dropped += 1  # its window is already closed
                continue
            if start not in counts:
                counts[start] = 0
                heapq.heappush(starts, start)
            counts[start] += 1
            candidate = t - allowed_lateness
            if watermark is None or candidate > watermark:
                watermark = candidate
                while starts and starts[0] + window <= watermark:
                    s = heapq.heappop(starts)
                    out.append([s, counts.pop(s)])
        while starts:
            s = heapq.heappop(starts)
            out.append([s, counts.pop(s)])
        out.append([-1, dropped])
        return out
  javascript: |
    function tumblingWindowCounts(eventTimes, window, allowedLateness) {
      const counts = new Map(); // open window start -> events counted so far
      let watermark = null; // no event seen yet: nothing is closed
      let dropped = 0;
      const out = [];
      const flush = (limit) => {
        const ready = [...counts.keys()].filter((s) => limit === null || s + window <= limit);
        ready.sort((a, b) => a - b);
        for (const s of ready) {
          out.push([s, counts.get(s)]);
          counts.delete(s);
        }
      };
      for (const t of eventTimes) {
        const start = t - (t % window);
        if (watermark !== null && start + window <= watermark) {
          dropped += 1;
          continue;
        }
        counts.set(start, (counts.get(start) || 0) + 1);
        const candidate = t - allowedLateness;
        if (watermark === null || candidate > watermark) {
          watermark = candidate;
          // windows only close when the watermark advances; the open set stays small in practice
          let earliest = Infinity;
          for (const s of counts.keys()) earliest = Math.min(earliest, s);
          if (earliest + window <= watermark) flush(watermark);
        }
      }
      flush(null);
      out.push([-1, dropped]);
      return out;
    }
