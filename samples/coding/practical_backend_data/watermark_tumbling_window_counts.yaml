prompt_markdown: |
  ## Tumbling Windows with a Watermark

  A metrics pipeline counts click events per time bucket. Events come from mobile clients over flaky
  networks, so they arrive **out of order**: `event_times[i]` is the time (in seconds) at which the `i`-th
  **arriving** event actually happened. The pipeline cannot wait forever for stragglers, so it uses a
  **watermark** to decide when a bucket is final.

  Rules:

  - **Windows.** Time is cut into tumbling windows `[s, s + window)` aligned to 0, so `s` is a multiple of
    `window`. An event at time `t` belongs to the window with `s = t - (t mod window)`.
  - **Watermark.** After an event is processed, the watermark is `max_seen - allowed_lateness`, where
    `max_seen` is the largest event time **accepted** so far. Before the first event there is no watermark.
  - **Closed windows.** A window is closed once `s + window <= watermark`.
  - **Processing an arrival.** If the event's window is already closed (under the watermark as it was
    before this event), the event is **dropped as late**. Otherwise it is counted in its window, then the
    watermark is updated, and every window that **has at least one counted event** and is now closed is
    **emitted** as a row `[s, count]`, in ascending `s`. Each window is emitted at most once.
  - **End of stream.** Every window that still has counted events but was not emitted yet is emitted, in
    ascending `s`.

  Windows that never received a counted event are never emitted. Write
  `tumbling_window_counts(event_times, window, allowed_lateness)` that returns all emitted rows in emission
  order, followed by one final row `[-1, dropped]` with the number of dropped events.

  ### Example 1
  ```
  Input:  event_times = [3, 7, 12, 5, 21, 14, 9, 30], window = 10, allowed_lateness = 5
  Output: [[0, 3], [10, 2], [20, 1], [30, 1], [-1, 1]]
  Explanation:
    3, 7, 12 -> watermark 12 - 5 = 7; nothing is closed
    5        -> counted in [0, 10) (the watermark is only 7)
    21       -> watermark 16 closes [0, 10): emit [0, 3]
    14       -> counted in [10, 20), which closes only at watermark 20
    9        -> its window [0, 10) is closed: dropped
    30       -> watermark 25 closes [10, 20): emit [10, 2]
    end      -> emit [20, 1] and [30, 1]; 1 event was dropped
  ```

  ### Example 2
  ```
  Input:  event_times = [100, 40, 260, 120, 55], window = 60, allowed_lateness = 0
  Output: [[60, 1], [240, 1], [-1, 3]]
  Explanation: after 100 the watermark is 100, so [0, 60) is closed and 40 is dropped. 260 moves the
  watermark to 260 and emits [60, 1]. 120 and 55 belong to windows that closed without ever receiving an
  event; they are dropped too, and those windows are never emitted.
  ```

  ### Constraints
  - `0 <= event_times.length <= 10^5`
  - `0 <= event_times[i] <= 10^9`
  - `1 <= window <= 10^9`
  - `0 <= allowed_lateness <= 10^9`

  **Follow-up:** how would you keep memory bounded if the stream never ends and windows had to be emitted
  the moment they close?
