expected_concepts:
  - "event time versus arrival order"
  - "watermark as max event time minus allowed lateness, monotonically non-decreasing"
  - "aligned window start computed with the modulo operation"
  - "min-heap or ordered map of open windows to emit closed ones in ascending start"
  - "late-event detection checked against the watermark before the update"
  - "half-open window boundaries"
optimal_complexity: {time: "O(n log n)", space: "O(number of open windows)"}
rubric:
  excellent: "Models the watermark as a monotonic value checked before each update, keeps open windows in a min-heap or ordered map keyed by start so closed windows pop in ascending order, gets the half-open boundary right, never emits empty windows and explains why late detection must use the old watermark."
  good: "Correct output with a simpler structure such as scanning all open windows after each watermark advance, or after a hint about one boundary rule."
  weak: "Groups by window after sorting all events (ignoring arrival order and lateness), drops events by comparing with the latest time instead of the window end, or emits windows that never had events."
  criteria:
    correctness: "All tests pass, including exact window-end boundaries, events for never-opened closed windows and the final summary row."
    efficiency: "Each window is pushed and popped once from a heap or ordered map; total O(n log n)."
    code_quality: "Separates computing the window start, the late check, counting and emitting; the watermark has one clear owner."
    edge_cases: "Empty stream, single event, window size 1, large lateness, huge jumps in time and decreasing times."
    communication: "Explains the trade-off between lateness (completeness) and emission delay (freshness)."
hints:
  - "Simulate the stream in arrival order: you need to know at every moment which windows are still open and what the watermark is."
  - "The watermark only moves forward, and a window closes once its end is at or below it. Check whether the incoming event's window is already closed before you move the watermark, and keep the open windows in a structure that gives you the smallest start quickly."
  - "Keep a map from window start to count plus a min-heap of open starts. For each event compute its start with the modulo, drop it if start plus window is at most the current watermark, otherwise count it, raise the watermark to the new max minus the lateness, and pop starts from the heap while start plus window is at most the watermark, emitting each with its count. At the end pop the rest in order and append the dropped total."
followups:
  - "How would you support sliding windows of size 60 that advance every 10 seconds?"
  - "Instead of dropping late events, how would you emit corrections for already-emitted windows?"
  - "What happens to the watermark if one partition of the stream goes idle, and how do real systems handle it?"
  - "How would you parallelise this across many keys, each with its own counts?"
common_errors:
  - "Updating the watermark before checking whether the current event is late."
  - "Using a closed interval for windows so an event at exactly s + window lands in the wrong window or the window closes too late."
  - "Emitting windows that never received an event, or emitting the same window twice."
  - "Sorting the events by time first, which hides lateness entirely."
  - "Letting a late event move the watermark backwards or forwards."
