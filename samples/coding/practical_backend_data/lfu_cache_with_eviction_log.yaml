expected_concepts:
  - hash map from key to value and use count
  - frequency buckets, each an ordered set in least-recently-used order
  - tracking the minimum use count for O(1) eviction
  - tie-breaking by recency inside a frequency
  - simulation with an event log
optimal_complexity: {time: O(1) average per operation, space: O(capacity)}
rubric:
  excellent: Keeps a key map plus one recency-ordered bucket per use count and a running minimum count, explains why the minimum only resets to 1 on insertion and grows by one when its bucket empties on a touch, handles updates, misses and capacity 0, and argues the O(1) bound.
  good: Correct simulation with a heap or a sorted structure keyed by (count, last use), O(log n) per operation, or the O(1) design with a hint about maintaining the minimum.
  weak: Scans every key on each eviction without discussing the cost, breaks ties by insertion time instead of most recent use, counts missed GETs, or resets the count when an existing key is updated.
  criteria:
    correctness: All tests pass, including ties, updates, misses, re-inserted keys and capacity 0.
    efficiency: O(1) average per operation with frequency buckets, or a clearly justified O(log n) alternative.
    code_quality: A single touch helper shared by GET and update, and a separate eviction step.
    edge_cases: Capacity 0 and 1, empty operations, GET of a missing key and a key evicted then re-added.
    communication: Explains the difference between LFU and LRU and when each fits.
hints:
  - Each key needs its value, its use count and some notion of when it was last used; eviction picks the smallest count first and the oldest last use second.
  - Group keys by use count, keeping each group ordered by most recent use, and remember the smallest count currently present; a touched key moves from its group to the next one, and a new key always starts in group 1.
  - Use a map from key to value and count plus a map from count to an insertion-ordered set; to touch a key, remove it from its count's set, delete that set if it empties (raising the minimum by one if it was the minimum) and append the key to the next count's set; to evict, remove the first key of the minimum count's set; after inserting a new key set the minimum to 1; skip all storage when capacity is zero.
followups:
  - How would you add time-based expiry on top of LFU?
  - LFU can keep keys that were hot long ago; how would you age the counts?
  - How would you make the cache safe for concurrent readers and writers?
  - How would you choose the capacity from the eviction log in production?
common_errors:
  - Breaking ties by insertion time instead of by the most recent use.
  - Resetting the use count when an existing key is updated by PUT.
  - Counting a GET that misses, or creating an entry for it.
  - Evicting with capacity 0 or storing a key anyway.
  - Forgetting to raise the minimum count when the last key leaves the minimum bucket.
