title: LFU Cache with an Eviction Log
difficulty: hard
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, platform, sre, general]
time_limit_minutes: 35
prompt_markdown: |
  ## LFU Cache with an Eviction Log

  A configuration service keeps hot entries in a small in-process cache. Entries that are read often
  should stay, so the team uses a **least-frequently-used** (LFU) policy, and to tune the capacity
  they want a log of what the cache did. Simulate the cache and return that log.

  The cache holds at most `capacity` keys. Each cached key has a value and a **use count**. Process
  the operations in order:

  - `"GET k"`: if `k` is cached, its use count goes up by 1 and its value is appended to the log.
    Otherwise `"MISS"` is appended and nothing else changes.
  - `"PUT k v"` for a key that is already cached: the value becomes `v` and the use count goes up by 1
    (the key is not re-inserted, so it keeps its earlier uses).
  - `"PUT k v"` for a new key: if the cache is full, first **evict** the cached key with the
    **smallest use count**; if several keys share that count, evict the one whose **most recent use**
    (GET or PUT) is the oldest. Append `"EVICT <key>"` to the log. Then store `k` with value `v` and
    use count 1. A key that was evicted and comes back starts again from count 1.
  - With `capacity = 0` nothing is ever stored, so every `GET` misses and no eviction is logged.

  `PUT` writes nothing to the log except its eviction, if any. Return the log entries in the order the
  events happened.

  ### Example 1
  ```
  Input:  capacity = 2,
          ops = ["PUT a 1", "PUT b 2", "GET a", "PUT c 3", "GET b", "GET c",
                 "PUT d 4", "GET a", "GET c", "GET d"]
  Output: ["1", "EVICT b", "MISS", "3", "EVICT a", "MISS", "3", "4"]
  Explanation: when c arrives, a has 2 uses and b has 1, so b is evicted. When d arrives, a and c
  both have 2 uses; a was last used before c, so a is evicted.
  ```

  ### Example 2
  ```
  Input:  capacity = 1,
          ops = ["PUT cfg v1", "PUT cfg v2", "GET cfg", "PUT flags on", "GET cfg", "GET flags"]
  Output: ["v2", "EVICT cfg", "MISS", "on"]
  ```

  ### Example 3
  ```
  Input:  capacity = 0, ops = ["PUT x 1", "GET x", "PUT x 2", "GET y"]
  Output: ["MISS", "MISS"]
  ```

  ### Constraints
  - `0 <= capacity <= 10^4`
  - `0 <= ops.length <= 2 * 10^5`
  - every operation is `"GET k"` or `"PUT k v"` with single spaces; keys and values are 1 to 20
    characters from lowercase letters, digits, `-` and `_`
  - aim for O(1) average time per operation
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: run_lfu_cache
  params:
    - {name: capacity, type: int}
    - {name: ops, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import OrderedDict


    def run_lfu_cache(capacity: int, ops: list[str]) -> list[str]:
        values: dict[str, str] = {}
        counts: dict[str, int] = {}
        # use count -> keys with that count, least recently used first
        buckets: dict[int, OrderedDict[str, None]] = {}
        min_count = 0
        log: list[str] = []

        def touch(key: str) -> None:
            nonlocal min_count
            count = counts[key]
            bucket = buckets[count]
            del bucket[key]
            if not bucket:
                del buckets[count]
                if min_count == count:
                    min_count = count + 1
            counts[key] = count + 1
            buckets.setdefault(count + 1, OrderedDict())[key] = None

        for op in ops:
            parts = op.split(" ")
            key = parts[1]
            if parts[0] == "GET":
                if key in values:
                    touch(key)
                    log.append(values[key])
                else:
                    log.append("MISS")
                continue
            if capacity == 0:
                continue
            if key in values:
                values[key] = parts[2]
                touch(key)
                continue
            if len(values) == capacity:
                bucket = buckets[min_count]
                victim, _ = bucket.popitem(last=False)
                if not bucket:
                    del buckets[min_count]
                del values[victim]
                del counts[victim]
                log.append("EVICT " + victim)
            values[key] = parts[2]
            counts[key] = 1
            buckets.setdefault(1, OrderedDict())[key] = None
            min_count = 1
        return log
  javascript: |
    function runLfuCache(capacity, ops) {
      const values = new Map();
      const counts = new Map();
      // use count -> Set of keys in insertion (= last use) order, least recent first
      const buckets = new Map();
      let minCount = 0;
      const log = [];
      const addToBucket = (count, key) => {
        if (!buckets.has(count)) buckets.set(count, new Set());
        buckets.get(count).add(key);
      };
      const touch = (key) => {
        const count = counts.get(key);
        const bucket = buckets.get(count);
        bucket.delete(key);
        if (bucket.size === 0) {
          buckets.delete(count);
          if (minCount === count) minCount = count + 1;
        }
        counts.set(key, count + 1);
        addToBucket(count + 1, key);
      };
      for (const op of ops) {
        const [kind, key, value] = op.split(" ");
        if (kind === "GET") {
          if (values.has(key)) {
            touch(key);
            log.push(values.get(key));
          } else {
            log.push("MISS");
          }
          continue;
        }
        if (capacity === 0) continue;
        if (values.has(key)) {
          values.set(key, value);
          touch(key);
          continue;
        }
        if (values.size === capacity) {
          const bucket = buckets.get(minCount);
          const victim = bucket.values().next().value;
          bucket.delete(victim);
          if (bucket.size === 0) buckets.delete(minCount);
          values.delete(victim);
          counts.delete(victim);
          log.push("EVICT " + victim);
        }
        values.set(key, value);
        counts.set(key, 1);
        addToBucket(1, key);
        minCount = 1;
      }
      return log;
    }
