expected_concepts:
  - custom comparator with a total order
  - parsing the core, pre-release and build parts in the right order
  - numeric versus lexical comparison
  - stable sorting for equal keys
  - numbers too large for double precision
optimal_complexity: {time: O(n log n * L) where L is the version length, space: O(n * L)}
rubric:
  excellent: Parses each version once (stripping build metadata before looking for the pre-release), writes a comparator that follows all four rules, relies on or enforces stability for ties, and handles numbers beyond 2^53 by comparing digit strings by length then lexically or with 64-bit integers.
  good: Correct comparator for core and pre-release rules with a hint about build metadata, stability or large numbers.
  weak: Sorts strings lexicographically, compares pre-release identifiers only as strings, ranks a release below its pre-release, or splits on the first hyphen anywhere in the string.
  criteria:
    correctness: All tests pass, including numeric versus alphanumeric identifiers, prefix lists, build metadata ties and very large numbers.
    efficiency: One parse per version and an O(n log n) comparison sort; no re-parsing inside the comparator in the hot path.
    code_quality: A small parse helper and an identifier comparator that read like the specification.
    edge_cases: Empty list, identical versions, hyphens in identifiers and build metadata, uppercase identifiers.
    communication: Explains why stability matters and how ties between builds are resolved.
hints:
  - Split each version into its numeric core, its list of pre-release identifiers and its build metadata, which you can discard; compare the pieces in that order.
  - A missing pre-release beats any pre-release of the same core; between two pre-releases, walk the identifiers in parallel and decide on the first difference, falling back to the length of the lists.
  - Remove everything from the plus sign first and only then split on the first hyphen; for identifiers, compare digit-only pairs by length then character by character (no leading zeros), put digit-only before alphanumeric, compare the rest by ASCII, and use a stable sort or the input index as the final tie-breaker.
followups:
  - How would you pick only the highest version without sorting the whole list?
  - How would you answer "the newest stable release" or "the newest release matching ^1.2"?
  - What would you do with strings that are not valid semantic versions?
  - Why is sort stability observable in this problem?
common_errors:
  - Sorting the raw strings, so 1.10.0 lands before 1.2.0.
  - Comparing pre-release identifiers only as strings, so alpha.10 lands before alpha.9.
  - Splitting on the first hyphen before removing the build metadata.
  - Ranking a release below its own pre-release or treating build metadata as significant.
  - Parsing 16+ digit numbers into double-precision floats, which merges distinct values.
