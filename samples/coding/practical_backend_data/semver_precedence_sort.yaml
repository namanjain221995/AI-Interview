version: 1
slug: semver_precedence_sort
title: Sort Release Versions by SemVer Precedence
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [devops, platform, backend, qa]
time_limit_minutes: 25
prompt_markdown: |
  ## Sort Release Versions by SemVer Precedence

  The release dashboard lists every build tag published for a service, and the "latest" badge goes to
  the version with the highest precedence. Plain string sorting puts `1.10.0` before `1.2.0` and
  `2.0.0-rc.1` after `2.0.0`, so you are asked to sort the tags properly.

  Every input string is a valid semantic version `MAJOR.MINOR.PATCH`, optionally followed by
  `-PRERELEASE` and then optionally by `+BUILD`. Sort them in **ascending precedence** using these
  rules:

  1. Compare `MAJOR`, then `MINOR`, then `PATCH` as **numbers**.
  2. If the three numbers are equal, a version **with** a pre-release ranks **below** the same version
     without one (`1.2.0-rc.1` < `1.2.0`).
  3. Two pre-releases are compared identifier by identifier, splitting on `.`:
     - two identifiers made only of digits compare as **numbers**;
     - two identifiers that contain a letter or a hyphen compare by **ASCII** character order;
     - a numeric identifier ranks **below** an alphanumeric one;
     - if all shared identifiers are equal, the version with **fewer** identifiers ranks lower
       (`alpha` < `alpha.1`).
  4. Build metadata (everything after `+`) is **ignored**. The pre-release is the text between the
     first `-` and the `+` (if any), so a hyphen inside the build metadata does not start a pre-release.

  Versions with equal precedence (for example `1.0.0+a` and `1.0.0+b`, or two identical strings) keep
  their **input order**. Return the original strings, reordered.

  ### Example 1
  ```
  Input:  versions = ["1.10.0", "1.2.0", "1.2.0-rc.1", "1.2.0-beta", "2.0.0",
                      "1.2.0-alpha.10", "1.2.0-alpha.9"]
  Output: ["1.2.0-alpha.9", "1.2.0-alpha.10", "1.2.0-beta", "1.2.0-rc.1", "1.2.0",
           "1.10.0", "2.0.0"]
  ```

  ### Example 2
  ```
  Input:  versions = ["1.0.0+build.7", "1.0.0-alpha", "1.0.0+build.3", "1.0.0-alpha.1",
                      "1.0.0-alpha.beta", "1.0.0-1"]
  Output: ["1.0.0-1", "1.0.0-alpha", "1.0.0-alpha.1", "1.0.0-alpha.beta",
           "1.0.0+build.7", "1.0.0+build.3"]
  Explanation: "1" is numeric, so it ranks below "alpha". "1.0.0+build.7" and "1.0.0+build.3"
  have equal precedence and keep their input order.
  ```

  ### Constraints
  - `0 <= versions.length <= 10^4`
  - every string is a valid semantic version of at most 100 characters
  - numeric parts and numeric identifiers have no leading zeros (except `0` itself) and at most 18
    digits, so they fit in a signed 64-bit integer but not always in a double
  - identifiers contain only ASCII letters, digits and `-`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_versions
  params:
    - {name: versions, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from functools import cmp_to_key


    def sort_versions(versions: list[str]) -> list[str]:
        def parse(version: str) -> tuple[list[int], list[str]]:
            core = version.split("+", 1)[0]          # build metadata never matters
            if "-" in core:
                release, pre = core.split("-", 1)    # pre-release may itself contain '-'
                return [int(x) for x in release.split(".")], pre.split(".")
            return [int(x) for x in core.split(".")], []

        def compare_ids(a: str, b: str) -> int:
            a_num, b_num = a.isdigit(), b.isdigit()
            if a_num and b_num:
                return (int(a) > int(b)) - (int(a) < int(b))
            if a_num != b_num:
                return -1 if a_num else 1            # numeric ranks below alphanumeric
            return (a > b) - (a < b)                 # ASCII order

        def compare(x: tuple[list[int], list[str]], y: tuple[list[int], list[str]]) -> int:
            if x[0] != y[0]:
                return -1 if x[0] < y[0] else 1
            pre_x, pre_y = x[1], y[1]
            if not pre_x or not pre_y:
                return (not pre_x) - (not pre_y)     # a plain release ranks above a pre-release
            for a, b in zip(pre_x, pre_y):
                result = compare_ids(a, b)
                if result:
                    return result
            return (len(pre_x) > len(pre_y)) - (len(pre_x) < len(pre_y))

        keyed = sorted(
            ((parse(v), i, v) for i, v in enumerate(versions)),
            key=cmp_to_key(lambda p, q: compare(p[0], q[0]) or (p[1] - q[1])),
        )
        return [v for _, _, v in keyed]
  javascript: |
    function sortVersions(versions) {
      const isNum = (s) => /^[0-9]+$/.test(s);
      // No leading zeros, so a longer digit string is a larger number (safe beyond 2^53).
      const compareNum = (a, b) =>
        a.length !== b.length ? (a.length < b.length ? -1 : 1) : a < b ? -1 : a > b ? 1 : 0;
      const parse = (version) => {
        const core = version.split("+")[0];
        const dash = core.indexOf("-");
        const release = (dash < 0 ? core : core.slice(0, dash)).split(".");
        const pre = dash < 0 ? [] : core.slice(dash + 1).split(".");
        return { release, pre };
      };
      const compareIds = (a, b) => {
        const aNum = isNum(a);
        const bNum = isNum(b);
        if (aNum && bNum) return compareNum(a, b);
        if (aNum !== bNum) return aNum ? -1 : 1;
        return a < b ? -1 : a > b ? 1 : 0;
      };
      const compare = (x, y) => {
        for (let i = 0; i < 3; i++) {
          const c = compareNum(x.release[i], y.release[i]);
          if (c !== 0) return c;
        }
        if (x.pre.length === 0 || y.pre.length === 0) {
          return (x.pre.length === 0 ? 1 : 0) - (y.pre.length === 0 ? 1 : 0);
        }
        const n = Math.min(x.pre.length, y.pre.length);
        for (let i = 0; i < n; i++) {
          const c = compareIds(x.pre[i], y.pre[i]);
          if (c !== 0) return c;
        }
        return x.pre.length - y.pre.length;
      };
      return versions
        .map((v, i) => ({ v, i, p: parse(v) }))
        .sort((a, b) => compare(a.p, b.p) || a.i - b.i)
        .map((e) => e.v);
    }
