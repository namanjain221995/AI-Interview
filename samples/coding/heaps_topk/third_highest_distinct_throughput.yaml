expected_concepts:
  - "tracking the top three distinct values in one pass"
  - "skipping duplicates of already tracked values"
  - "explicit empty markers instead of numeric sentinels"
  - "fallback to the maximum when fewer than three distinct values exist"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Maintains three ordered slots with explicit empty markers, skips duplicates before shifting, returns the maximum when the third slot stays empty, and explains why a sentinel like the minimum integer is fragile."
  good: "Correct one-pass solution after fixing a duplicate or sentinel bug, or a clean set-plus-sort solution with a discussion of the memory trade-off."
  weak: "Counts duplicates as distinct, returns the wrong value when fewer than three distinct values exist, or relies on a sentinel that collides with real data."
  criteria:
    correctness: "All tests pass, including duplicates, negatives, extremes and fewer than three distinct values."
    efficiency: "Single pass with constant extra memory; sorting is acknowledged as O(n log n)."
    code_quality: "Shifting logic is easy to follow; the slots have clear names and the empty state is explicit."
    edge_cases: "Single value, two distinct values, only negatives, range extremes and ascending input."
    communication: "Walks through a small example showing how values shift between the three slots."
hints:
  - "You never need more than the three largest distinct values you have seen so far; what should happen when a new value is bigger than one of them?"
  - "Keep three slots for the best, second-best and third-best distinct values, ignore values equal to any slot, and shift slots down when a larger value arrives."
  - "Start all three slots empty (not at some very small number, because real values can be very small); for each value, skip it if it equals a slot, otherwise insert it at the first slot that is empty or smaller and push the lower slots down; at the end return the third slot if it was filled and the first slot otherwise."
followups:
  - "How would you generalise this to the k-th highest distinct value for large k?"
  - "What would you return if the specification asked for an error instead of a fallback?"
  - "How does the answer change if duplicates should count separately?"
  - "How would you compute this over a sliding window of the last 1000 runs?"
common_errors:
  - "Treating duplicates as distinct values."
  - "Using the minimum 64-bit value as an empty marker and confusing it with real data."
  - "Returning the second value instead of the maximum when there are only two distinct values."
  - "Forgetting to shift the second slot into the third when a new maximum arrives."
