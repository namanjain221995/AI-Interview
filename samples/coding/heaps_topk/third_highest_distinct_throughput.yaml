time_limit_minutes: 12
prompt_markdown: |
  ## Third-Best Throughput

  A load-testing pipeline stores the requests-per-second figure of every run in `rps`. Several runs often
  produce exactly the same figure, and broken probes report negative values, which must still be treated
  as ordinary numbers.

  To avoid quoting a lucky outlier, the release notes quote the **third-highest distinct** figure: sort
  the distinct values from highest to lowest and take the third one. If there are fewer than three
  distinct values, quote the **highest** value instead.

  Aim for a single pass over `rps` with `O(1)` extra memory.

  ### Example 1
  ```
  Input:  rps = [1200, 950, 1200, 800, 400]
  Output: 800
  Explanation: the distinct values are 1200, 950, 800 and 400; the third highest is 800
  ```

  ### Example 2
  ```
  Input:  rps = [300, 300]
  Output: 300
  Explanation: only one distinct value, so the highest is quoted
  ```

  ### Example 3
  ```
  Input:  rps = [-1, 5, 2]
  Output: -1
  ```

  ### Constraints
  - `1 <= rps.length <= 10^5`
  - `-10^12 <= rps[i] <= 10^12`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: third_highest_throughput
  params:
    - {name: rps, type: "long[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def third_highest_throughput(rps: list[int]) -> int:
        first = second = third = None
        for value in rps:
            if value == first or value == second or value == third:
                continue
            if first is None or value > first:
                first, second, third = value, first, second
            elif second is None or value > second:
                second, third = value, second
            elif third is None or value > third:
                third = value
        return first if third is None else third
  javascript: |
    function thirdHighestThroughput(rps) {
      let first = null;
      let second = null;
      let third = null;
      for (const value of rps) {
        if (value === first || value === second || value === third) continue;
        if (first === null || value > first) {
          third = second;
          second = first;
          first = value;
        } else if (second === null || value > second) {
          third = second;
          second = value;
        } else if (third === null || value > third) {
          third = value;
        }
      }
      return third === null ? first : third;
    }
