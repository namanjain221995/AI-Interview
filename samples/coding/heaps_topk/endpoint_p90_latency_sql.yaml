version: 1
slug: endpoint_p90_latency_sql
title: P90 Latency per Endpoint
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data_analyst, sre, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## P90 Latency per Endpoint

  An API gateway stores one row per sampled request in table `latency_sample`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | endpoint | VARCHAR(60) | endpoint name (lowercase letters only) |
  | latency_ms | INTEGER | request latency in milliseconds, `>= 0` |

  The SRE team reports the **p90 latency** of every endpoint using the **nearest-rank** definition, so
  the reported value is always a latency that was actually observed:

  1. Sort the endpoint's `n` samples by `latency_ms` ascending (duplicates are kept and each one counts).
  2. The p90 rank is `ceil(0.9 * n)`, counting from 1. Compute it with **integer arithmetic**, for
     example `(9 * n + 9) / 10` with integer division, not with floating-point functions.
  3. The p90 is the latency at that rank.

  Return one row per endpoint that has at least one sample, with columns `endpoint` and `p90_ms`,
  ordered by `endpoint` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  latency_sample
  +----+-----------+------------+
  | id | endpoint  | latency_ms |
  +----+-----------+------------+
  | 1  | checkout  | 210        |
  | 2  | search    | 18         |
  | 3  | checkout  | 45         |
  | 4  | checkout  | 130        |
  | 5  | inventory | 12         |
  | 6  | checkout  | 45         |
  | 7  | search    | 7          |
  | 8  | checkout  | 900        |
  | 9  | checkout  | 160        |
  | 10 | checkout  | 75         |
  | 11 | search    | 30         |
  | 12 | checkout  | 98         |
  | 13 | checkout  | 140        |
  | 14 | checkout  | 61         |
  +----+-----------+------------+

  Output
  +-----------+--------+
  | endpoint  | p90_ms |
  +-----------+--------+
  | checkout  | 210    |
  | inventory | 12     |
  | search    | 30     |
  +-----------+--------+
  checkout has 10 samples, rank ceil(9.0) = 9 in [45, 45, 61, 75, 98, 130, 140, 160, 210, 900] -> 210.
  search has 3 samples, rank ceil(2.7) = 3 -> 30. A single sample is its own p90.
  ```

  ### Example 2
  ```
  latency_sample
  +----+----------+------------+
  | id | endpoint | latency_ms |
  +----+----------+------------+
  | 1  | profile  | 40         |
  | 2  | login    | 7          |
  | 3  | login    | 3          |
  | 4  | profile  | 40         |
  | 5  | login    | 11         |
  | 6  | login    | 1          |
  | 7  | profile  | 90         |
  | 8  | login    | 9          |
  | 9  | login    | 5          |
  | 10 | profile  | 40         |
  | 11 | login    | 10         |
  | 12 | login    | 2          |
  | 13 | login    | 8          |
  | 14 | profile  | 40         |
  | 15 | login    | 4          |
  | 16 | login    | 6          |
  +----+----------+------------+

  Output
  +----------+--------+
  | endpoint | p90_ms |
  +----------+--------+
  | login    | 10     |
  | profile  | 90     |
  +----------+--------+
  login has 11 samples 1..11, rank ceil(9.9) = 10 -> 10. profile has 5 samples, rank ceil(4.5) = 5 -> 90.
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `0 <= latency_ms <= 10^9`
  - `endpoint` contains only lowercase letters `a-z`
languages: [sql]
starter_code:
  sql: |
    -- Return endpoint and its nearest-rank p90 latency (p90_ms), ordered by endpoint.
    SELECT endpoint, MAX(latency_ms) AS p90_ms
    FROM latency_sample
    GROUP BY endpoint
    ORDER BY endpoint;
reference_solutions:
  sql: |
    WITH ranked AS (
      SELECT
        endpoint,
        latency_ms,
        ROW_NUMBER() OVER (PARTITION BY endpoint ORDER BY latency_ms, id) AS rn,
        COUNT(*) OVER (PARTITION BY endpoint) AS n
      FROM latency_sample
    )
    SELECT endpoint, latency_ms AS p90_ms
    FROM ranked
    WHERE rn = (9 * n + 9) / 10
    ORDER BY endpoint;
sql_setup: |
  CREATE TABLE latency_sample (
    id INTEGER PRIMARY KEY,
    endpoint VARCHAR(60) NOT NULL,
    latency_ms INTEGER NOT NULL
  );
