expected_concepts:
  - ROW_NUMBER over a partition ordered by latency
  - COUNT(*) as a window function for the partition size
  - nearest-rank percentile with an integer ceiling
  - integer division semantics across databases
  - deterministic tie-breaking among equal latencies
optimal_complexity: {time: "O(n log n) for the per-endpoint sort", space: O(n)}
rubric:
  excellent: Numbers each endpoint's samples with ROW_NUMBER, gets the partition size with COUNT(*) OVER, keeps the row whose number equals (9 * n + 9) / 10, explains why that is ceil(0.9 * n) in integer arithmetic and why ties do not affect the value, and orders the result by endpoint.
  good: Correct query after a hint about the rank formula or window functions, perhaps with a correlated subquery instead of a window count.
  weak: Uses MAX, AVG or an interpolating percentile, rounds the rank with floating-point functions that differ between databases, or forgets the ordering.
  criteria:
    correctness: All tests pass, including two-sample endpoints, n = 19 and 11 where floor and ceiling differ, and duplicates.
    efficiency: One window pass per endpoint; no correlated subquery per row.
    code_quality: A named CTE for the ranked rows and clear output column names.
    edge_cases: Empty table, single-sample endpoints, all-equal latencies and very large latencies.
    communication: Explains the nearest-rank definition and why integer arithmetic is portable and exact.
hints:
  - The p90 of one endpoint only needs that endpoint's samples in sorted order and how many there are.
  - Window functions can give each row its position inside its endpoint (sorted by latency) and the endpoint's total count in the same pass.
  - In a CTE compute ROW_NUMBER() OVER (PARTITION BY endpoint ORDER BY latency_ms, id) and COUNT(*) OVER (PARTITION BY endpoint), then keep rows where the row number equals (9 * count + 9) / 10 and order by endpoint.
followups:
  - How would you report p50, p90 and p99 in one query?
  - How does nearest rank differ from PERCENTILE_CONT, and when would you prefer each?
  - Which index helps this query on a table with billions of samples, and when would you switch to pre-aggregated histograms?
common_errors:
  - Using floor(0.9 * n) instead of the ceiling, which picks the wrong rank when 0.9 * n is not an integer.
  - Relying on CEIL or ROUND of floating-point values, which behave differently between SQLite and PostgreSQL.
  - Using an interpolating percentile that returns a value that was never observed.
  - Forgetting ORDER BY endpoint when the order of the result matters.
