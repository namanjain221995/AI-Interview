version: 1
slug: interleave_region_rollout
title: "Interleave Regional Rollouts"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, sre, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Interleave Regional Rollouts

  A release team ships a change as a series of deployments, one at a time. The plan is the string
  `regions`: one uppercase letter per deployment naming the region it goes to (a region can appear
  many times, and the order of the letters in the input does not matter). To limit the blast radius of
  a bad build, the same region must **never be deployed twice in a row**.

  Build the deployment order with this exact rule, one position at a time:

  - Among the regions that still have deployments left **and** differ from the region deployed just
    before (any region for the first position), choose the one with the **most deployments left**.
  - Break ties by the **alphabetically smaller** letter.

  Return the resulting order as a string using every letter of `regions` exactly once. If at some step
  no region can be chosen (only the previous region still has deployments left), no valid order exists
  at all, and you must return the empty string `""`. An empty plan returns `""`.

  ### Example 1
  ```
  Input:  regions = "CABBAA"
  Output: "ABABAC"
  Explanation: A has the most left (3), then B ties A at 2 but A was just used, and so on
  ```

  ### Example 2
  ```
  Input:  regions = "UEUE"
  Output: "EUEU"
  Explanation: E and U tie, so E goes first and they alternate
  ```

  ### Example 3
  ```
  Input:  regions = "PPPQ"
  Output: ""
  Explanation: three P deployments cannot be separated by a single Q
  ```

  ### Constraints
  - `0 <= regions.length <= 10^4`
  - `regions` contains only uppercase letters `A`-`Z`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rollout_order
  params:
    - {name: regions, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    import heapq
    from collections import Counter


    def rollout_order(regions: str) -> str:
        # Heap of (-remaining, region): most remaining first, then the smaller letter.
        heap = [(-count, region) for region, count in Counter(regions).items()]
        heapq.heapify(heap)
        order: list[str] = []
        while heap:
            neg, region = heapq.heappop(heap)
            if order and order[-1] == region:
                if not heap:
                    return ""  # only the previous region is left
                neg2, region2 = heapq.heappop(heap)
                heapq.heappush(heap, (neg, region))
                neg, region = neg2, region2
            order.append(region)
            if neg + 1 < 0:
                heapq.heappush(heap, (neg + 1, region))
        return "".join(order)
  javascript: |
    function rolloutOrder(regions) {
      const left = new Array(26).fill(0);
      for (const ch of regions) left[ch.charCodeAt(0) - 65]++;
      let prev = -1;
      let order = "";
      for (let step = 0; step < regions.length; step++) {
        let best = -1;
        for (let r = 0; r < 26; r++) {
          if (r !== prev && left[r] > 0 && (best === -1 || left[r] > left[best])) best = r;
        }
        if (best === -1) return "";
        left[best]--;
        order += String.fromCharCode(65 + best);
        prev = best;
      }
      return order;
    }
tests:
  - {id: t1, args: ["CABBAA"], expected: "ABABAC", description: "Example 1 - greedy with ties broken alphabetically"}
  - {id: t2, args: ["UEUE"], expected: "EUEU", description: "Example 2 - two regions alternate, smaller letter first"}
  - {id: t3, args: ["PPPQ"], expected: "", description: "Example 3 - impossible plan returns the empty string"}
  - {id: t4, hidden: true, args: [""], expected: "", description: "Empty plan"}
  - {id: t5, hidden: true, args: ["K"], expected: "K", description: "Single deployment"}
  - {id: t6, hidden: true, args: ["KK"], expected: "", description: "Two deployments to the same region are impossible"}
  - {id: t7, hidden: true, args: ["ZYX"], expected: "XYZ", description: "All counts equal: alphabetical order"}
  - {id: t8, hidden: true, args: ["AABBB"], expected: "BABAB", description: "Feasible at the boundary: max count is (n + 1) / 2 and the majority is not the smallest letter"}
  - {id: t9, hidden: true, args: ["AAAABBBCCD"], expected: "ABABACABCD", description: "Tie-breaking matters mid-way as counts shrink"}
  - {id: t10, hidden: true, args: [""], expected: "", description: "Stress: 300 deployments over 7 regions, feasible"}
  - {id: t11, hidden: true, args: [""], expected: "", description: "Stress: one region has 151 of 300 deployments, impossible"}
expected_concepts:
  - "max-heap keyed by (remaining count, letter)"
  - "setting aside the previous region for one step"
  - "feasibility: max count <= (n + 1) / 2"
  - "deterministic tie-breaking"
optimal_complexity: {time: "O(n log k) where k <= 26 is the number of regions", space: "O(k)"}
rubric:
  excellent: "Implements the rule exactly with a max-heap (or a 26-slot scan), holds back the previous region correctly, applies the alphabetical tie-break, returns \"\" at the right moment, and explains the (n + 1) / 2 feasibility bound."
  good: "Correct greedy that needs a fix for the tie-break or the impossible case after running the tests."
  weak: "Places letters without following the specified rule, sorts and interleaves halves so the output differs from the required order, or never detects the impossible case."
  criteria:
    correctness: "All tests pass, including ties, the boundary feasible case and impossible plans."
    efficiency: "O(n log 26) with a heap or O(26 n) with a scan; both are fine and the trade-off is explained."
    code_quality: "The heap key encodes both the count and the tie-break; the previous region is handled in one clear place."
    edge_cases: "Empty plan, a single region, all counts equal and a region with more than half the deployments."
    communication: "Explains why the greedy only gets stuck when one region has more than (n + 1) / 2 deployments."
hints:
  - "At each position you need the region with the most deployments left, but you are not allowed to pick the one you just used. What structure gives you the largest remaining count quickly?"
  - "Keep regions in a max-heap ordered by remaining count and then by letter. If the top is the previous region, look at the next one instead and put the top back."
  - "Pop the best region; if it equals the previous one, pop the second best (if there is none, return \"\") and push the first back. Append the chosen letter, decrement its count and push it back while it still has deployments left."
followups:
  - "Can you decide feasibility without building the order? What is the condition?"
  - "How would you generalise to \"the same region at least d positions apart\"?"
  - "If regions also had a fixed priority order that must be respected where possible, how would the key change?"
common_errors:
  - "Ignoring the alphabetical tie-break, which yields a valid but different order."
  - "Popping the previous region and losing it instead of pushing it back."
  - "Pushing a region back with a count of zero, which makes it selectable again."
  - "Returning a partial order instead of \"\" when no region can be chosen."
