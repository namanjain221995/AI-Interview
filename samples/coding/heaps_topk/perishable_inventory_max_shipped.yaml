expected_concepts:
  - earliest-deadline-first greedy
  - min-heap keyed by spoil day
  - discarding expired batches lazily
  - storing a batch with its remaining count instead of individual units
  - continuing the simulation after the last delivery
optimal_complexity: {time: "O((n + D) log n) where D is the largest shelf life", space: O(n)}
rubric:
  excellent: Explains why shipping the unit that spoils soonest is always safe (exchange argument), uses a min-heap of batches keyed by spoil day with remaining counts, discards expired batches before shipping, continues after the last delivery and states the complexity.
  good: Correct heap-based greedy after a hint about which unit to ship first, possibly storing units one by one.
  weak: Ships in arrival order (FIFO) or by largest batch, stops at the last delivery day, or pushes every unit separately without considering the cost.
  criteria:
    correctness: All tests pass, including shelf life 0, zero-unit days and shipping after the last delivery.
    efficiency: One heap push per delivery and one pop per expired or emptied batch; never one entry per unit.
    code_quality: A single day loop with clear add, expire and ship steps.
    edge_cases: Deliveries that are already spoiled, batches larger than their shelf life and long tails after the last arrival.
    communication: Justifies the earliest-spoil-first choice and the off-by-one meaning of spoiling at the start of a day.
hints:
  - On any given day you can ship one unit; ask which of the units in stock is the most urgent to get rid of.
  - Shipping the unit that spoils soonest never hurts - keep the batches in a structure that gives you the earliest spoil day quickly and drop batches that have already spoiled.
  - Walk day by day (and keep going after the last delivery while stock remains); push [i + shelf_life[i], units[i]] when a delivery arrives, pop batches whose spoil day is <= today, then ship one unit from the top batch and pop it when it is empty.
followups:
  - Why is the earliest-spoil-first choice optimal? Sketch the exchange argument.
  - How would you skip quickly over long stretches of days with no stock?
  - What changes if the warehouse can ship up to c units per day?
common_errors:
  - Shipping units in arrival order instead of by spoil day.
  - Treating the spoil day as the last day a unit can still be shipped (an off-by-one).
  - Stopping the simulation at the last delivery day although stock remains.
  - Pushing every unit individually, which is slow when batches are large.
