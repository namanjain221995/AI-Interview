reference_solutions:
  python: |
    import heapq


    def max_shipped(units: list[int], shelf_life: list[int]) -> int:
        # Min-heap of [spoil_day, remaining units]: always ship from the batch that spoils first.
        heap: list[list[int]] = []
        shipped = 0
        day = 0
        n = len(units)
        while day < n or heap:
            if day < n and units[day] > 0 and shelf_life[day] > 0:
                heapq.heappush(heap, [day + shelf_life[day], units[day]])
            while heap and heap[0][0] <= day:
                heapq.heappop(heap)
            if heap:
                shipped += 1
                heap[0][1] -= 1
                if heap[0][1] == 0:
                    heapq.heappop(heap)
            day += 1
        return shipped
  javascript: |
    function maxShipped(units, shelfLife) {
      // Min-heap of [spoilDay, remaining] ordered by spoilDay.
      const h = [];
      const up = (i) => {
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (h[p][0] <= h[i][0]) break;
          [h[i], h[p]] = [h[p], h[i]];
          i = p;
        }
      };
      const pop = () => {
        const tail = h.pop();
        if (h.length === 0) return;
        h[0] = tail;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1, r = l + 1;
          let m = i;
          if (l < h.length && h[l][0] < h[m][0]) m = l;
          if (r < h.length && h[r][0] < h[m][0]) m = r;
          if (m === i) return;
          [h[i], h[m]] = [h[m], h[i]];
          i = m;
        }
      };
      const n = units.length;
      let shipped = 0;
      for (let day = 0; day < n || h.length > 0; day++) {
        if (day < n && units[day] > 0 && shelfLife[day] > 0) {
          h.push([day + shelfLife[day], units[day]]);
          up(h.length - 1);
        }
        while (h.length > 0 && h[0][0] <= day) pop();
        if (h.length > 0) {
          shipped += 1;
          h[0][1] -= 1;
          if (h[0][1] === 0) pop();
        }
      }
      return shipped;
    }
