prompt_markdown: |
  ## Ship Before It Spoils

  A cold-storage warehouse receives perishable stock. On day `i` (days are numbered from 0) a delivery
  of `units[i]` units arrives; every unit of that delivery **spoils at the start of day
  `i + shelf_life[i]`**, so it can only be shipped on days `i, i + 1, ..., i + shelf_life[i] - 1`. A
  delivery with `units[i] = 0` brings nothing, and one with `shelf_life[i] = 0` is already spoiled on
  arrival.

  The warehouse has a single refrigerated dispatch slot, so it ships **at most one unit per day**. It
  may ship a unit on the day it arrives, and it keeps shipping on the days after the last delivery for
  as long as unspoiled stock remains.

  Return the **maximum number of units** that can be shipped before they spoil.

  ### Example 1
  ```
  Input:  units = [2, 1, 0, 3], shelf_life = [2, 4, 0, 1]
  Output: 4
  Explanation: ship the day-0 units on days 0 and 1 (they spoil on day 2), the day-1 unit on day 2
  (it lasts until day 4) and one of the day-3 units on day 3; the other two day-3 units spoil.
  ```

  ### Example 2
  ```
  Input:  units = [4, 0, 0, 1], shelf_life = [5, 0, 0, 1]
  Output: 5
  Explanation: the day-0 units last until day 4. Ship them on days 0, 1, 2 and 4, and ship the day-3
  unit, which spoils first, on day 3.
  ```

  ### Constraints
  - `1 <= units.length == shelf_life.length <= 2 * 10^4`
  - `0 <= units[i], shelf_life[i] <= 2 * 10^4`
languages: [python, javascript, typescript, java, go, cpp]
