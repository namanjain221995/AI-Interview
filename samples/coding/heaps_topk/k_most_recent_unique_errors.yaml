version: 1
slug: k_most_recent_unique_errors
title: "Most Recent Distinct Error Codes"
difficulty: easy
competency_keys: [data_structures, code_quality]
role_tags: [support_engineer, sre, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Most Recent Distinct Error Codes

  A support dashboard has a *recently seen errors* widget. The error feed `codes` lists error codes
  from **oldest to newest**, and the same code can appear many times.

  Return up to `k` **distinct** codes ordered by the time of their **most recent** occurrence, newest
  first. Each code appears at most once in the result. If fewer than `k` distinct codes exist, return
  all of them. Codes are case-sensitive (`"e500"` and `"E500"` are different codes).

  ### Example 1
  ```
  Input:  codes = ["E500", "E404", "E500", "DB_TIMEOUT", "E404"], k = 2
  Output: ["E404", "DB_TIMEOUT"]
  Explanation: E404 was seen last, DB_TIMEOUT before it; E500's latest occurrence is older than both
  ```

  ### Example 2
  ```
  Input:  codes = ["AUTH_EXPIRED", "AUTH_EXPIRED"], k = 3
  Output: ["AUTH_EXPIRED"]
  ```

  ### Example 3
  ```
  Input:  codes = ["E503", "E429", "E503", "E401", "E429", "E503"], k = 5
  Output: ["E503", "E429", "E401"]
  Explanation: only three distinct codes exist, so all of them are returned
  ```

  ### Constraints
  - `0 <= codes.length <= 10^5`
  - `0 <= k <= 10^5`
  - `1 <= codes[i].length <= 20`; codes contain letters, digits and underscores
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: recent_distinct_errors
  params:
    - {name: codes, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def recent_distinct_errors(codes: list[str], k: int) -> list[str]:
        seen: set[str] = set()
        result: list[str] = []
        # Walk from the newest entry; the first sighting of a code is its latest occurrence.
        for code in reversed(codes):
            if len(result) >= k:
                break
            if code not in seen:
                seen.add(code)
                result.append(code)
        return result
  javascript: |
    function recentDistinctErrors(codes, k) {
      const seen = new Set();
      const result = [];
      for (let i = codes.length - 1; i >= 0 && result.length < k; i--) {
        if (!seen.has(codes[i])) {
          seen.add(codes[i]);
          result.push(codes[i]);
        }
      }
      return result;
    }
tests:
  - {id: t1, args: [["E500", "E404", "E500", "DB_TIMEOUT", "E404"], 2], expected: ["E404", "DB_TIMEOUT"], description: "Example 1 - ordering by latest occurrence"}
  - {id: t2, args: [["AUTH_EXPIRED", "AUTH_EXPIRED"], 3], expected: ["AUTH_EXPIRED"], description: "Example 2 - repeated code appears once"}
  - {id: t3, args: [["E503", "E429", "E503", "E401", "E429", "E503"], 5], expected: ["E503", "E429", "E401"], description: "Example 3 - fewer distinct codes than k"}
  - {id: t4, hidden: true, args: [[], 4], expected: [], description: "Empty feed"}
  - {id: t5, hidden: true, args: [["X1"], 0], expected: [], description: "k = 0 returns an empty list"}
  - {id: t6, hidden: true, args: [["e500", "E500"], 2], expected: ["E500", "e500"], description: "Codes are case-sensitive"}
  - {id: t7, hidden: true, args: [["A", "B", "C", "D"], 2], expected: ["D", "C"], description: "All distinct - the newest k in reverse order"}
  - {id: t8, hidden: true, args: [["A", "B", "A", "B", "A"], 1], expected: ["A"], description: "k = 1 returns the newest code"}
