expected_concepts:
  - "reverse iteration from the newest entry"
  - "hash set for de-duplication"
  - "early exit once k codes are collected"
  - "O(n) time instead of sorting by last index"
optimal_complexity: {time: "O(n)", space: "O(min(n, k)) extra"}
rubric:
  excellent: "Scans from the newest entry with a hash set, appends first sightings, stops at k, handles k = 0 and explains why the first sighting from the end is the latest occurrence."
  good: "Builds a map from code to last index and sorts codes by it (O(d log d)), or reaches the reverse scan after a hint."
  weak: "Orders by first occurrence or by frequency, returns duplicates, or uses a list membership check that makes the scan quadratic."
  criteria:
    correctness: "All tests pass, including k = 0, repeated codes and case-sensitive codes."
    efficiency: "Linear scan with constant-time membership checks and an early exit."
    code_quality: "Short, readable loop with intention-revealing names."
    edge_cases: "Empty feed, k = 0, k larger than the distinct count and a code re-seen at the end."
    communication: "Explains the ordering rule and why scanning backwards removes the need to sort."
hints:
  - "Only the newest occurrence of each code decides where it goes in the result."
  - "If you read the feed from the newest end, the first time you meet a code is exactly its most recent occurrence."
  - "Walk the feed backwards with a hash set of codes already reported; append each code the first time you meet it and stop as soon as the result holds k codes or the feed runs out."
followups:
  - "How would you keep this widget current as new errors stream in (an LRU-style structure)?"
  - "How would you also return the count of each code over the feed?"
  - "What if the feed is too large to hold in memory?"
common_errors:
  - "Ordering codes by their first occurrence instead of their latest."
  - "Using a list for membership checks, which is quadratic."
  - "Not handling k = 0 or k larger than the number of distinct codes."
  - "Sorting by frequency, which answers a different question."
