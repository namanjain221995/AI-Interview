expected_concepts:
  - the border is the initial boundary because it always drains
  - min-heap of boundary tiles keyed by water level
  - expanding inward from the lowest boundary tile (a Dijkstra-like flood fill)
  - the level of a newly reached tile is the maximum of its height and the level it was reached from
  - 64-bit accumulation of the volume
optimal_complexity: {time: "O(rows * cols * log(rows * cols))", space: "O(rows * cols)"}
rubric:
  excellent: Seeds a min-heap with the border, always expands from the lowest boundary level, adds
    level - height for each newly reached lower tile and pushes max(level, height), proves why the lowest
    boundary tile fixes its neighbour's final level, uses a 64-bit total and states the complexity.
  good: Reaches the border-first min-heap expansion with a hint, or gives a correct but slower fixed-point
    relaxation, with minor gaps in the reasoning or the overflow handling.
  weak: Applies the one-dimensional left-max/right-max idea per row and column, ignores the border drain,
    or lets water leak diagonally.
  criteria:
    correctness: All tests pass, including low border tiles, nested basins and floors that hold nothing.
    efficiency: Each tile is pushed and popped once, giving O(rows * cols * log(rows * cols)).
    code_quality: The visited grid, the heap entries and the direction list are clear and not duplicated.
    edge_cases: Handles grids with fewer than three rows or columns, flat floors and totals beyond 32 bits.
    communication: Explains why the lowest frontier level is final for its unvisited neighbours.
hints:
  - Start from what you know for certain - which tiles can never hold water, and what limits the water level
    just inside them?
  - Treat the drained region as a wall that grows inward. The weakest point of that wall is its lowest tile,
    and that tile alone decides the final level of any unvisited neighbour next to it.
  - Push every border tile into a min-heap keyed by level; repeatedly pop the lowest entry, and for each
    unvisited edge neighbour add max(0, level - neighbour height) to a 64-bit total, mark it visited and push
    it with level max(level, neighbour height).
followups:
  - How would you report the water depth of every tile instead of only the total?
  - What changes if some interior tiles are floor drains that always empty?
  - How would the approach change if water could also move diagonally?
common_errors:
  - Reusing the one-dimensional technique row by row, which ignores paths that turn corners.
  - Pushing the tile's own height instead of the maximum of its height and the current level.
  - Forgetting to mark tiles visited when they are pushed, which double counts water.
  - Summing the volume in a 32-bit integer.
