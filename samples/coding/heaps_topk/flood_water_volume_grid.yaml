title: Standing Water on a Warehouse Floor
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Standing Water on a Warehouse Floor

  After a sprinkler test, a facilities team scans a warehouse floor and wants to know how much water
  will be left standing once everything that can drain has drained. The scan is a grid `heights` where
  `heights[r][c]` is the surface height of the tile in row `r`, column `c`.

  - Water moves only between tiles that share an **edge** (up, down, left, right), never diagonally.
  - Every tile in the **outer border** of the grid drains off the floor, so border tiles never hold water.
  - Water settles on a tile up to the lowest level from which it could still escape to the border, so a
    tile holds `level - height` units, where `level` is the smallest possible "highest point" along any
    edge-connected path from that tile to a border tile (counting the heights of the tiles on the path,
    the tile itself and the border tile included).

  Return the **total** number of units of standing water over the whole floor.

  ### Example 1
  ```
  Input:  heights = [[3, 3, 3, 3],
                     [3, 1, 2, 3],
                     [3, 3, 3, 3]]
  Output: 3
  Explanation: both inner tiles fill up to level 3, holding 2 and 1 units.
  ```

  ### Example 2
  ```
  Input:  heights = [[4, 4, 4, 4],
                     [4, 0, 1, 4],
                     [4, 2, 0, 2],
                     [4, 4, 4, 4]]
  Output: 5
  Explanation: the border tile of height 2 on the right lets water escape above level 2, so every
               inner tile fills only to level 2: 2 + 1 + 0 + 2 = 5.
  ```

  ### Example 3
  ```
  Input:  heights = [[5, 5, 5],
                     [5, 1, 5],
                     [5, 0, 5]]
  Output: 0
  Explanation: the tile of height 0 is on the border, so the inner tile drains through it.
  ```

  ### Constraints
  - `1 <= rows, cols <= 200`
  - `0 <= heights[r][c] <= 10^9`
  - The total volume can exceed `2^31 - 1`; return it as a 64-bit integer.

  **Follow-up:** filling one tile at a time and re-scanning until nothing changes is far too slow on a
  large floor. Can you do it in `O(rows * cols * log(rows * cols))`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: trapped_volume
  params:
    - {name: heights, type: "int[][]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def trapped_volume(heights: list[list[int]]) -> int:
        rows, cols = len(heights), len(heights[0])
        if rows < 3 or cols < 3:
            return 0
        seen = [[False] * cols for _ in range(rows)]
        frontier: list[tuple[int, int, int]] = []
        for r in range(rows):
            for c in range(cols):
                if r in (0, rows - 1) or c in (0, cols - 1):
                    seen[r][c] = True
                    heapq.heappush(frontier, (heights[r][c], r, c))
        volume = 0
        while frontier:
            # The lowest wall on the frontier decides the water level just inside it.
            level, r, c = heapq.heappop(frontier)
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols and not seen[nr][nc]:
                    seen[nr][nc] = True
                    height = heights[nr][nc]
                    if height < level:
                        volume += level - height
                    heapq.heappush(frontier, (max(level, height), nr, nc))
        return volume
  javascript: |
    function trappedVolume(heights) {
      const rows = heights.length;
      const cols = heights[0].length;
      if (rows < 3 || cols < 3) return 0;
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      const heap = []; // min-heap of [level, row, col]
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p][0] <= heap[i][0]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
            if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
            seen[r][c] = true;
            push([heights[r][c], r, c]);
          }
        }
      }
      let volume = 0;
      const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (heap.length > 0) {
        const [level, r, c] = pop();
        for (const [dr, dc] of steps) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || seen[nr][nc]) continue;
          seen[nr][nc] = true;
          const height = heights[nr][nc];
          if (height < level) volume += level - height;
          push([Math.max(level, height), nr, nc]);
        }
      }
      return volume;
    }
