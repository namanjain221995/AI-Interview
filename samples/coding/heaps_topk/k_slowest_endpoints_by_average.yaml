version: 1
slug: k_slowest_endpoints_by_average
title: Slowest Endpoints by Average Latency
difficulty: easy
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [backend, sre, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Slowest Endpoints by Average Latency

  Your monitoring tool exports one entry per request as two parallel lists: `endpoints[i]` is the route
  that served request `i` and `latencies_ms[i]` is how long that request took, in milliseconds. Group the
  requests by endpoint and report the `k` endpoints with the **highest average latency** (total latency of
  the endpoint divided by its number of requests).

  - Order the result by average latency, **highest first**.
  - When two endpoints have exactly the same average, the endpoint whose name is smaller in plain
    character-code order comes first (so `"/API"` sorts before `"/api"`).
  - Compare averages **exactly**. An endpoint with latencies `[10, 0, 0]` and one with
    `[20, 0, 0, 0, 0, 0]` both average `10/3` ms and are tied; do not round averages before comparing.
  - If there are fewer than `k` distinct endpoints, return all of them in the same order.

  ### Example 1
  ```
  Input:  endpoints = ["/login", "/search", "/login", "/cart", "/search"], latencies_ms = [120, 300, 80, 150, 100], k = 2
  Output: ["/search", "/cart"]
  Explanation: averages are /login 100, /search 200, /cart 150
  ```

  ### Example 2
  ```
  Input:  endpoints = ["/b", "/a", "/c", "/a"], latencies_ms = [50, 40, 10, 60], k = 3
  Output: ["/a", "/b", "/c"]
  Explanation: /a and /b both average 50, so /a comes first by name
  ```

  ### Example 3
  ```
  Input:  endpoints = ["/health", "/health"], latencies_ms = [5, 7], k = 3
  Output: ["/health"]
  ```

  ### Constraints
  - `1 <= endpoints.length == latencies_ms.length <= 10^4`
  - `0 <= latencies_ms[i] <= 10^5`
  - `1 <= k <= 10^4`
  - Endpoint names are 1 to 50 printable ASCII characters and are case-sensitive.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: k_slowest_endpoints
  params:
    - {name: endpoints, type: "string[]"}
    - {name: latencies_ms, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from functools import cmp_to_key


    def k_slowest_endpoints(endpoints: list[str], latencies_ms: list[int], k: int) -> list[str]:
        totals: dict[str, int] = {}
        counts: dict[str, int] = {}
        for name, ms in zip(endpoints, latencies_ms):
            totals[name] = totals.get(name, 0) + ms
            counts[name] = counts.get(name, 0) + 1

        def compare(a: str, b: str) -> int:
            # total_a / count_a vs total_b / count_b, compared without division.
            left = totals[a] * counts[b]
            right = totals[b] * counts[a]
            if left != right:
                return -1 if left > right else 1
            return -1 if a < b else (1 if a > b else 0)

        return sorted(totals, key=cmp_to_key(compare))[:k]
  javascript: |
    function kSlowestEndpoints(endpoints, latenciesMs, k) {
      const totals = new Map();
      const counts = new Map();
      for (let i = 0; i < endpoints.length; i++) {
        const name = endpoints[i];
        totals.set(name, (totals.get(name) || 0) + latenciesMs[i]);
        counts.set(name, (counts.get(name) || 0) + 1);
      }
      const names = [...totals.keys()];
      names.sort((a, b) => {
        const left = totals.get(a) * counts.get(b);
        const right = totals.get(b) * counts.get(a);
        if (left !== right) return left > right ? -1 : 1;
        return a < b ? -1 : a > b ? 1 : 0;
      });
      return names.slice(0, k);
    }
