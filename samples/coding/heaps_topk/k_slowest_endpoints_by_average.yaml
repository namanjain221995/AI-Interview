    correctness: "All tests pass, including exact ties with different request counts and case-sensitive names."
    efficiency: "Linear aggregation followed by O(m log m) sorting or O(m log k) with a bounded heap, where m is the number of distinct endpoints."
    code_quality: "Clear separation between aggregation and ranking; the comparator is short and symmetric."
    edge_cases: "Single request, zero latencies, ties of equal averages, k larger than the endpoint count."
    communication: "Explains why integer cross-multiplication is safer than comparing rounded averages and checks that the products fit in range."
hints:
  - "Before you can rank endpoints you need one number per endpoint; what do you have to collect for each route to compute its average?"
  - "Keep a running total and a request count per endpoint in a map, then order the endpoints by average, highest first, falling back to the name when two averages are equal."
  - "To compare two averages exactly, compare the first total times the second count against the second total times the first count, so no division or rounding happens; sort with that rule plus the name tie-break (or keep a heap of size k) and take the first k names."
followups:
  - "How would you keep this ranking up to date if requests keep streaming in?"
  - "Why can a bounded heap of size k beat sorting all endpoints, and when does it stop mattering?"
  - "Would you rank by average, median or p99 latency in production, and why?"
  - "How large can the cross-multiplied products get under these constraints?"
common_errors:
  - "Rounding averages before comparing, which merges or splits endpoints incorrectly."
  - "Forgetting the name tie-break, or comparing names case-insensitively."
  - "Slicing before sorting, or failing when k is larger than the number of endpoints."
  - "Averaging per request instead of per endpoint."
