expected_concepts:
  - "aggregate sum and count per key with a hash map"
  - "exact comparison of averages by cross-multiplying sums and counts"
  - "custom ordering with a secondary tie-break on name"
  - "bounded heap of size k or a full sort of the distinct endpoints"
optimal_complexity: {time: "O(n + m log k)", space: "O(m)"}
rubric:
  excellent: "Aggregates totals and counts in one pass, compares averages exactly by cross-multiplication, applies the name tie-break, handles k above the endpoint count and discusses a size-k heap versus sorting all m endpoints."
  good: "Correct aggregation and ordering with a full sort; reaches the exact comparison or the tie-break after a test or a nudge."
  weak: "Sorts raw requests instead of per-endpoint averages, rounds averages, ignores ties, or fails when k exceeds the number of endpoints."
