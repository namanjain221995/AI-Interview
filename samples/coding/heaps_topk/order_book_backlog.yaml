expected_concepts:
  - two priority queues (max-heap of bids, min-heap of asks)
  - greedy matching against the best price on the other side
  - partial fills that leave the resting order in place
  - 64-bit accumulation of the remaining amounts
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Uses a max-heap for buys and a min-heap for sells, matches the incoming order against the best opposite price in a loop with partial fills, explains why each order is pushed and popped at most once for O(n log n) total, and sums the remainder in 64 bits.
  good: Correct heap-based simulation with a minor slip (for example a missed equal-price trade or 32-bit sum) fixed after a test or a hint.
  weak: Scans or re-sorts the whole book for every order, matches against the wrong end of the book, or simulates one unit at a time.
  criteria:
    correctness: All tests pass, including equal prices, partial fills across several levels and an empty input.
    efficiency: O(log n) per heap operation and amortised O(1) heap operations per order; no per-unit loops.
    code_quality: Symmetric buy and sell handling without duplicated, diverging branches; clear names for book sides.
    edge_cases: Equal prices trade, orders that never cross, totals beyond 32 bits and an empty order list.
    communication: Explains why the best opposite price is always the right one to trade against first.
hints:
  - For an incoming order, only one resting order on the other side matters at any moment - the one with the best price for it.
  - Keep each side of the book in a structure that gives you the cheapest sell or the highest buy quickly, and let an incoming order trade against it repeatedly while prices cross.
  - Use a min-heap of sells and a max-heap of buys storing remaining amounts; trade the minimum of the two amounts, pop the resting order when it reaches zero, push any remainder of the incoming order, and finally add up every remaining amount in a 64-bit total.
followups:
  - How would you also report the total traded volume, or the price of each trade?
  - What changes if orders can be cancelled by id after they rest in the book?
  - How would you enforce first-come-first-served among resting orders that share a price?
  - What if the answer had to be reported modulo a large prime because amounts were even larger?
common_errors:
  - Matching an incoming buy against the most expensive sell instead of the cheapest one.
  - Using strict comparisons so that orders at exactly the same price never trade.
  - Simulating the trade one unit at a time, which is far too slow for amounts up to 10^9.
  - Summing the remaining amounts in a 32-bit integer.
