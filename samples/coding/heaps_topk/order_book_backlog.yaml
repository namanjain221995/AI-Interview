title: Order Book Backlog
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, data, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Order Book Backlog

  An internal marketplace lets teams trade spare GPU-hours with each other. Every order is a triple
  `[price, amount, side]`:

  - `side = 0` is a **buy** order: the team wants `amount` units and pays at most `price` per unit;
  - `side = 1` is a **sell** order: the team offers `amount` units and accepts at least `price` per unit.

  The exchange processes the orders one at a time, in the given order, against the **book** of orders
  that are still waiting (initially empty):

  - An incoming **buy** looks at the resting sell orders, **cheapest first**. While it still needs units
    and the cheapest resting sell has a price `<=` the buy price, the two orders trade
    `min(remaining buy amount, remaining sell amount)` units and both amounts shrink by that number. A
    sell order whose amount reaches 0 leaves the book.
  - An incoming **sell** does the same against the resting buy orders, **highest price first**, while
    the highest resting buy has a price `>=` the sell price.
  - When the incoming order is completely filled, or no resting order on the other side qualifies,
    matching stops and any unfilled remainder of the incoming order joins the book at its own price.

  Return the **total number of units** (buy and sell sides together) still resting in the book after
  every order has been processed. When several resting orders on one side share a price, the order in
  which they trade does not change this total.

  ### Example 1
  ```
  Input:  orders = [[10, 5, 0], [15, 2, 1], [25, 1, 1], [30, 4, 0]]
  Output: 6
  Explanation: the buy of 5 at 10 and the sells of 2 at 15 and 1 at 25 cannot trade, so they rest.
  The buy of 4 at 30 takes 2 units at 15, then 1 unit at 25, and its last unit rests.
  The book holds 5 + 1 = 6 units.
  ```

  ### Example 2
  ```
  Input:  orders = [[7, 1000000000, 0], [7, 999999999, 1], [5, 3, 1], [6, 8, 0]]
  Output: 6
  Explanation: equal prices trade, so the sell at 7 leaves 1 unit of the buy at 7; the sell of 3 at 5
  takes that unit and rests with 2; the buy of 8 at 6 takes those 2 and rests with 6.
  ```

  ### Constraints
  - `0 <= orders.length <= 10^5`
  - `orders[i].length == 3`
  - `1 <= price, amount <= 10^9`
  - `side` is `0` or `1`
  - The answer can exceed the 32-bit integer range; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
