  return_type: long
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def resting_amount(orders: list[list[int]]) -> int:
        # Each heap entry is [key, sequence, remaining amount]; the key is the price for sells
        # (cheapest first) and the negated price for buys (highest first).
        buys: list[list[int]] = []
        sells: list[list[int]] = []
        for seq, (price, amount, side) in enumerate(orders):
            if side == 0:
                book, own, crosses, own_key = sells, buys, (lambda top: top[0] <= price), -price
            else:
                book, own, crosses, own_key = buys, sells, (lambda top: -top[0] >= price), price
            while amount > 0 and book and crosses(book[0]):
                traded = min(amount, book[0][2])
                amount -= traded
                book[0][2] -= traded
                if book[0][2] == 0:
                    heapq.heappop(book)
            if amount > 0:
                heapq.heappush(own, [own_key, seq, amount])
        return sum(entry[2] for entry in buys) + sum(entry[2] for entry in sells)
  javascript: |
    class MinHeap {
      constructor() { this.items = []; }
      get size() { return this.items.length; }
      peek() { return this.items[0]; }
      static less(a, b) { return a[0] !== b[0] ? a[0] < b[0] : a[1] < b[1]; }
      push(item) {
        const h = this.items;
        h.push(item);
        let i = h.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!MinHeap.less(h[i], h[p])) break;
          [h[i], h[p]] = [h[p], h[i]];
          i = p;
        }
      }
      pop() {
        const h = this.items;
        const top = h[0];
        const last = h.pop();
        if (h.length > 0) {
          h[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let m = i;
            if (l < h.length && MinHeap.less(h[l], h[m])) m = l;
            if (r < h.length && MinHeap.less(h[r], h[m])) m = r;
            if (m === i) break;
            [h[i], h[m]] = [h[m], h[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function restingAmount(orders) {
      // Entries are [key, sequence, remaining]; key = price for sells, -price for buys.
      const buys = new MinHeap();
      const sells = new MinHeap();
      orders.forEach(([price, amount, side], seq) => {
        const book = side === 0 ? sells : buys;
        const own = side === 0 ? buys : sells;
        const crosses = side === 0 ? (top) => top[0] <= price : (top) => -top[0] >= price;
        let left = amount;
        while (left > 0 && book.size > 0 && crosses(book.peek())) {
          const top = book.peek();
          const traded = Math.min(left, top[2]);
          left -= traded;
          top[2] -= traded;
          if (top[2] === 0) book.pop();
        }
        if (left > 0) own.push([side === 0 ? -price : price, seq, left]);
      });
      let total = 0;
      for (const entry of buys.items) total += entry[2];
      for (const entry of sells.items) total += entry[2];
      return total;
    }
