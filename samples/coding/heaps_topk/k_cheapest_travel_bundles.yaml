slug: k_cheapest_travel_bundles
title: "Cheapest Flight and Hotel Bundles"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [backend, fullstack, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Cheapest Flight and Hotel Bundles

  A travel-booking backend builds package deals for a search page. It has the prices of the matching
  flight offers in `flights` and of the matching hotel offers in `hotels`, each list **sorted in
  non-decreasing order**. A **bundle** is one flight offer plus one hotel offer, and it costs the sum of
  the two prices. Every (flight offer, hotel offer) pair is a different bundle, even when two bundles end
  up with the same cost.

  Return the costs of the `k` **cheapest** bundles in non-decreasing order. If fewer than `k` bundles
  exist (including when either list is empty), return the costs of all of them.

  The lists can be long, so building and sorting every one of the `flights.length * hotels.length`
  bundles is too slow; aim for roughly `O(k log k)` time.

  ### Example 1
  ```
  Input:  flights = [100, 150, 300], hotels = [80, 90, 200], k = 4
  Output: [180, 190, 230, 240]
  Explanation: the four cheapest pairs are 100+80, 100+90, 150+80 and 150+90
  ```

  ### Example 2
  ```
  Input:  flights = [50], hotels = [20, 20], k = 5
  Output: [70, 70]
  Explanation: only two bundles exist, and they cost the same
  ```

  ### Constraints
  - `0 <= flights.length, hotels.length <= 10^4`
  - `1 <= flights[i], hotels[j] <= 10^6`
  - both lists are sorted in non-decreasing order
  - `1 <= k <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cheapest_bundles
  params:
    - {name: flights, type: "int[]"}
    - {name: hotels, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def cheapest_bundles(flights: list[int], hotels: list[int], k: int) -> list[int]:
        if not flights or not hotels:
            return []
        # Each flight starts paired with the cheapest hotel; entries are (cost, flight, hotel).
        heap = [(flights[i] + hotels[0], i, 0) for i in range(min(k, len(flights)))]
        heapq.heapify(heap)
        costs: list[int] = []
        while heap and len(costs) < k:
            cost, i, j = heapq.heappop(heap)
            costs.append(cost)
            if j + 1 < len(hotels):
                heapq.heappush(heap, (flights[i] + hotels[j + 1], i, j + 1))
        return costs
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(x) {
        const a = this.items;
        a.push(x);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function cheapestBundles(flights, hotels, k) {
      if (flights.length === 0 || hotels.length === 0) return [];
      // Each flight starts paired with the cheapest hotel; entries are [cost, flight, hotel].
      const heap = new MinHeap((a, b) => a[0] < b[0]);
      for (let i = 0; i < Math.min(k, flights.length); i++) heap.push([flights[i] + hotels[0], i, 0]);
      const costs = [];
      while (heap.size > 0 && costs.length < k) {
        const [cost, i, j] = heap.pop();
        costs.push(cost);
        if (j + 1 < hotels.length) heap.push([flights[i] + hotels[j + 1], i, j + 1]);
      }
      return costs;
    }
