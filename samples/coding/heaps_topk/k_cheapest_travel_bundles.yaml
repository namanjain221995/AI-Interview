expected_concepts:
  - "min-heap frontier over the implicit sorted matrix of pair sums"
  - "seeding with each flight paired with the cheapest hotel (at most k seeds)"
  - "advancing only the hotel index of the popped pair to avoid duplicates"
  - "stopping after k pops or when the heap is empty"
optimal_complexity: {time: "O(k log k)", space: "O(k)"}
rubric:
  excellent: "Treats the pair sums as a sorted matrix, seeds a min-heap with at most k (flight, cheapest hotel) pairs, advances one index per pop without duplicates, handles empty lists and k beyond the bundle count, and states O(k log k)."
  good: "Heap-based solution that works but seeds all flights or uses a visited set for (i, j) pairs, with correct complexity discussion."
  weak: "Generates and sorts all pairs, misses bundles because it only moves along one list, or deduplicates equal costs."
  criteria:
    correctness: "All tests pass, including empty lists, ties and k larger than the number of bundles."
    efficiency: "O(k log k) time and O(k) heap size, independent of the product of list lengths."
    code_quality: "Heap entries are clearly structured and the stopping condition is easy to read."
    edge_cases: "Either list empty, k = 1, k at or above the total bundle count, equal prices."
    communication: "Explains why each pair is pushed at most once and why the next candidate after (i, j) is (i, j + 1)."
hints:
  - "Picture all bundle costs as a grid where row i is a flight and column j a hotel. Because both lists are sorted, how are the values in each row and column ordered?"
  - "The cheapest bundle is at the top-left corner. Once you take a bundle, only a few neighbouring cells can become the next candidates; keep the candidates in a structure that hands you the cheapest one quickly."
  - "Put (flights[i] + hotels[0], i, 0) for the first min(k, number of flights) flights into a min-heap. Pop k times; after popping (i, j) push (i, j + 1) if that hotel exists. The popped costs are the answer."
followups:
  - "How would you return the actual (flight, hotel) index pairs instead of only the costs?"
  - "How could you find just the k-th cheapest cost with binary search on the answer?"
  - "What changes if bundles must use distinct flight offers (each flight used at most once)?"
common_errors:
  - "Pushing both (i + 1, j) and (i, j + 1) without a visited set, which produces duplicate bundles."
  - "Building all n * m sums, which is too slow and memory hungry for long lists."
  - "Deduplicating equal costs even though different pairs are different bundles."
  - "Indexing hotels[0] when the hotel list is empty."
