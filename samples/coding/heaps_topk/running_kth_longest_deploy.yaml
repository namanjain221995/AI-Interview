expected_concepts:
  - "min-heap of size k holding the k largest values"
  - "heap top as the k-th largest element"
  - "streaming / online processing"
  - "duplicates counted as separate elements"
optimal_complexity: {time: "O(n log k)", space: "O(k)"}
rubric:
  excellent: "Keeps a min-heap capped at k, replaces the top only when a longer duration arrives, reports the top once the heap is full and -1 before, and explains O(log k) per arrival versus re-sorting."
  good: "Correct heap solution with small slips (for example the -1 boundary) fixed by testing."
  weak: "Re-sorts all durations on every arrival without discussing the cost, uses a max-heap of everything, or mishandles duplicates or the -1 phase."
  criteria:
    correctness: "All tests pass, including empty input, k larger than n, duplicates and ascending input."
    efficiency: "O(log k) per arrival and O(k) memory."
    code_quality: "Heap direction and invariant are documented; the report expression is a single clear condition."
    edge_cases: "Empty stream, k above the number of arrivals, k = 1, duplicates and large values."
    communication: "States the invariant that the heap holds the k longest durations so its smallest element is the answer."
hints:
  - "Only the k longest durations seen so far can ever matter for the report; which of those k values is the one you report?"
  - "Keep the k longest durations in a min-heap, so the smallest of them, which is the k-th longest overall, sits on top."
  - "For each arrival, push it if the heap has fewer than k items; otherwise replace the top only when the new duration is strictly longer than it; then report the top if the heap holds exactly k items and minus one otherwise."
followups:
  - "How would you report the k-th longest deployment within the last hour only?"
  - "What if k could change between arrivals?"
  - "How would you report the running median instead?"
  - "Why is a min-heap the right choice rather than a max-heap here?"
common_errors:
  - "Using a max-heap and popping k times per arrival."
  - "Reporting a value before k deployments have arrived."
  - "Ignoring duplicates (treating equal durations as one)."
  - "Reporting the largest element of the heap instead of its smallest."
