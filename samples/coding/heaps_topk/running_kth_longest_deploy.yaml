version: 1
slug: running_kth_longest_deploy
title: Running Kth-Longest Deployment
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [devops, sre, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Running Kth-Longest Deployment

  A release dashboard shows a "slow deploy" threshold equal to the `k`-th longest deployment so far.
  Deployment durations (in seconds) arrive one at a time in `durations`. After each arrival, report the
  `k`-th longest duration among **all deployments seen so far**, where equal durations count separately
  (in `[60, 60, 10]` the longest is `60`, the second longest is also `60`, the third longest is `10`).
  While fewer than `k` deployments have arrived, report `-1`.

  Return the list of reports, one per arrival, in arrival order.

  ### Example 1
  ```
  Input:  durations = [30, 12, 45, 12, 60], k = 2
  Output: [-1, 12, 30, 30, 45]
  Explanation: after 12 the second longest of {30, 12} is 12; after 45 it is 30; after 60 it is 45
  ```

  ### Example 2
  ```
  Input:  durations = [7, 7, 3], k = 1
  Output: [7, 7, 7]
  Explanation: with k = 1 the report is the running maximum
  ```

  ### Example 3
  ```
  Input:  durations = [50, 40], k = 3
  Output: [-1, -1]
  ```

  ### Constraints
  - `0 <= durations.length <= 10^4`
  - `1 <= durations[i] <= 10^9`
  - `1 <= k <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: running_kth_longest
  params:
    - {name: durations, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def running_kth_longest(durations: list[int], k: int) -> list[int]:
        top: list[int] = []  # min-heap holding the k longest durations so far
        reports: list[int] = []
        for d in durations:
            if len(top) < k:
                heapq.heappush(top, d)
            elif d > top[0]:
                heapq.heapreplace(top, d)
            reports.append(top[0] if len(top) == k else -1)
        return reports
  javascript: |
    function runningKthLongest(durations, k) {
      const heap = [];
      const up = (i) => {
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p] <= heap[i]) return;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const down = (i) => {
        while (true) {
          const l = 2 * i + 1;
          const r = l + 1;
          let s = i;
          if (l < heap.length && heap[l] < heap[s]) s = l;
          if (r < heap.length && heap[r] < heap[s]) s = r;
          if (s === i) return;
          [heap[s], heap[i]] = [heap[i], heap[s]];
          i = s;
        }
      };
      const reports = [];
      for (const d of durations) {
        if (heap.length < k) {
          heap.push(d);
          up(heap.length - 1);
        } else if (d > heap[0]) {
          heap[0] = d;
          down(0);
        }
        reports.push(heap.length === k ? heap[0] : -1);
      }
      return reports;
    }
