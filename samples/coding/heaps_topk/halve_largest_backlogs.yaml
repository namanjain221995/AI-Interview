expected_concepts:
  - "max-heap to repeatedly select the current largest value"
  - "greedy simulation of k operations"
  - "floor division semantics (a backlog of 1 cannot shrink)"
  - "64-bit total across many queues"
optimal_complexity: {time: "O(n + k log n)", space: "O(n)"}
rubric:
  excellent: "Builds a max-heap in O(n), simulates k bursts with one pop and push (or replace) each, applies floor division correctly, stops early when the largest backlog is at most 1, and sums in 64 bits."
  good: "Correct heap simulation with minor slips fixed by testing; complexity explained."
  weak: "Rescans the whole array for the maximum on every burst without discussing the cost, subtracts ceil instead of floor, or overflows the total."
  criteria:
    correctness: "All tests pass, including k = 0, empty queues, ties and very large k."
    efficiency: "O(n + k log n) with a heap instead of O(n * k) linear scans."
    code_quality: "The update rule is written once and reads like the statement; the heap direction (max via negation) is clear."
    edge_cases: "k = 0, zeros, ones, ties for the maximum and totals beyond 32 bits."
    communication: "Explains why the choice among tied queues does not change the final total and when the simulation can stop early."
hints:
  - "Each burst needs the queue that is largest right now, and that can change after every burst; what structure gives you the current maximum cheaply?"
  - "Use a max-heap of backlogs: take the top, reduce it by half rounded down, put the reduced value back, and repeat k times."
  - "Heapify all backlogs as a max-heap, then k times replace the top value v with v minus floor of v over two (you can stop once the top is 1 or less, since nothing changes any more); finally add up everything left in the heap using a 64-bit total."
followups:
  - "How would you return which queue each burst went to?"
  - "If k were up to 10^12, how could you avoid simulating every burst?"
  - "What changes if a burst removes a fixed number of messages instead of half?"
  - "Why does it not matter which of several tied queues gets the burst?"
common_errors:
  - "Subtracting ceil(backlog / 2) instead of floor(backlog / 2)."
  - "Finding the maximum with a linear scan on every burst for large inputs."
  - "Using a min-heap by mistake, draining the smallest queue."
  - "Summing into a 32-bit integer."
