version: 1
slug: halve_largest_backlogs
title: Drain the Biggest Backlogs
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, sre, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Drain the Biggest Backlogs

  During an incident several message queues are falling behind; `backlogs[i]` is the number of unprocessed
  messages in queue `i`. The on-call engineer can launch `k` extra worker bursts, one after another. Each
  burst is always pointed at the queue with the **currently largest** backlog and processes
  `floor(backlog / 2)` messages from it (a queue holding `7` messages drops to `4`). The same queue can
  receive several bursts. If several queues share the largest backlog, any of them may be chosen; the
  final answer is the same.

  Return the **total number of messages left** across all queues after all `k` bursts.

  ### Example 1
  ```
  Input:  backlogs = [10, 4, 7], k = 3
  Output: 11
  Explanation: 10 -> 5, then 7 -> 4, then 5 -> 3; the queues hold 3, 4 and 4
  ```

  ### Example 2
  ```
  Input:  backlogs = [1, 1], k = 5
  Output: 2
  Explanation: floor(1 / 2) is 0, so the bursts cannot drain anything
  ```

  ### Example 3
  ```
  Input:  backlogs = [100], k = 2
  Output: 25
  Explanation: 100 -> 50 -> 25
  ```

  ### Constraints
  - `1 <= backlogs.length <= 10^5`
  - `0 <= backlogs[i] <= 10^9`
  - `0 <= k <= 10^5`
  - The total can exceed the 32-bit range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: remaining_backlog
  params:
    - {name: backlogs, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def remaining_backlog(backlogs: list[int], k: int) -> int:
        heap = [-b for b in backlogs]  # max-heap through negation
        heapq.heapify(heap)
        for _ in range(k):
            largest = -heap[0]
            if largest <= 1:
                break  # nothing left to drain: floor(1 / 2) == 0
            heapq.heapreplace(heap, -(largest - largest // 2))
        return -sum(heap)
  javascript: |
    function remainingBacklog(backlogs, k) {
      const heap = [...backlogs];
      const swap = (a, b) => { const t = heap[a]; heap[a] = heap[b]; heap[b] = t; };
      const siftDown = (i) => {
        const n = heap.length;
        while (true) {
          const l = 2 * i + 1;
          const r = l + 1;
          let best = i;
          if (l < n && heap[l] > heap[best]) best = l;
          if (r < n && heap[r] > heap[best]) best = r;
          if (best === i) return;
          swap(i, best);
          i = best;
        }
      };
      for (let i = Math.floor(heap.length / 2) - 1; i >= 0; i--) siftDown(i);
      for (let step = 0; step < k; step++) {
        const largest = heap[0];
        if (largest <= 1) break;
        heap[0] = largest - Math.floor(largest / 2);
        siftDown(0);
      }
      let total = 0;
      for (const b of heap) total += b;
      return total;
    }
