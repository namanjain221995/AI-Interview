  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def min_cable_cost(sites: list[list[int]]) -> int:
        n = len(sites)
        in_tree = [False] * n
        # cheapest[i] = cheapest cable from site i to any site already in the tree
        cheapest = [float("inf")] * n
        cheapest[0] = 0
        total = 0
        for _ in range(n):
            u = -1
            for i in range(n):
                if not in_tree[i] and (u == -1 or cheapest[i] < cheapest[u]):
                    u = i
            in_tree[u] = True
            total += cheapest[u]
            ux, uy = sites[u]
            for v in range(n):
                if not in_tree[v]:
                    distance = abs(sites[v][0] - ux) + abs(sites[v][1] - uy)
                    if distance < cheapest[v]:
                        cheapest[v] = distance
        return int(total)
  javascript: |
    function minCableCost(sites) {
      const n = sites.length;
      const inTree = new Array(n).fill(false);
      // cheapest[i] = cheapest cable from site i to any site already in the tree
      const cheapest = new Array(n).fill(Infinity);
      cheapest[0] = 0;
      let total = 0;
      for (let step = 0; step < n; step++) {
        let u = -1;
        for (let i = 0; i < n; i++) {
          if (!inTree[i] && (u === -1 || cheapest[i] < cheapest[u])) u = i;
        }
        inTree[u] = true;
        total += cheapest[u];
        const [ux, uy] = sites[u];
        for (let v = 0; v < n; v++) {
          if (inTree[v]) continue;
          const distance = Math.abs(sites[v][0] - ux) + Math.abs(sites[v][1] - uy);
          if (distance < cheapest[v]) cheapest[v] = distance;
        }
      }
      return total;
    }
