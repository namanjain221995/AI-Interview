expected_concepts:
  - minimum spanning tree on a complete graph
  - Prim's algorithm (dense O(n^2) array version or heap-based)
  - Kruskal with union-find as an alternative and its O(n^2 log n) edge sort
  - 64-bit distances and totals
optimal_complexity: {time: "O(n^2)", space: O(n)}
rubric:
  excellent: Identifies a minimum spanning tree on the complete graph, chooses the dense O(n^2) Prim (or explains why a heap-based Prim or Kruskal over all n^2 edges is slower here), uses 64-bit arithmetic and justifies correctness with the cut property.
  good: Correct Kruskal with union-find or heap-based Prim over all pairs, with the complexity stated, after a hint about spanning trees.
  weak: Connects each site to its nearest neighbour only, chains sites in input or sorted order, or overflows on large coordinates.
  criteria:
    correctness: All tests pass, including duplicates, collinear sites and coordinates at the limits.
    efficiency: O(n^2) without materialising and sorting every pair is the target; O(n^2 log n) is acceptable.
    code_quality: Clear names for the tree membership and best-connection arrays.
    edge_cases: Single site, duplicate positions, many equal-cost ties and 4 * 10^9 distances.
    communication: Explains why a greedy cheapest-crossing-edge choice is always safe.
hints:
  - Think of the sites as nodes of a graph where every pair is joined by an edge weighted by the Manhattan distance. What kind of subgraph connects all nodes at minimum total weight?
  - You need a minimum spanning tree. Growing it one site at a time works well here - keep, for every site outside the tree, the cheapest cable to any site inside it.
  - Use Prim's algorithm with an array instead of a heap. Start from site 0, repeatedly pick the outside site with the smallest best-connection cost, add that cost to a 64-bit total, then update every remaining site's best cost with its distance to the newly added site. That is n rounds of O(n) work.
followups:
  - When would a heap-based Prim beat the array version, and why not here?
  - How would you list the cables that were chosen?
  - Manhattan MSTs can be built from only O(n) candidate edges - how might you find them?
common_errors:
  - Linking each site only to its nearest neighbour, which can leave the network in disconnected groups.
  - Sorting sites by x and chaining them, which is not minimal.
  - Computing distances in 32-bit integers when coordinates reach plus or minus 10^9.
  - Using Kruskal without union-find path compression on 500,000 edges and running slowly.
