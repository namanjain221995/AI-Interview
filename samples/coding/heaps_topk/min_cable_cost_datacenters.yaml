slug: min_cable_cost_datacenters
title: Cheapest Fibre Between Data Centers
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [network, cloud, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Cheapest Fibre Between Data Centers

  A network team is planning a private fibre backbone between data center sites. `sites[i] = [x, y]` is
  the position of site `i` on the planning grid (in metres). Fibre follows street ducts, so a cable laid
  directly between sites `i` and `j` costs their **Manhattan distance** `|x_i - x_j| + |y_i - y_j|`.

  A cable may be laid between **any** two sites, and traffic can be routed through intermediate sites.
  Return the **minimum total cost** of a set of cables that connects every site to every other site
  (directly or through other sites). With a single site no cable is needed and the answer is `0`.

  Several sites may share the same position; connecting them costs `0`.

  ### Example 1
  ```
  Input:  sites = [[1, 1], [4, 1], [4, 5], [9, 3]]
  Output: 14
  Explanation: Lay [1, 1]-[4, 1] for 3, [4, 1]-[4, 5] for 4 and [4, 5]-[9, 3] for 7 (connecting [9, 3]
  to [4, 1] also costs 7). Total 3 + 4 + 7 = 14.
  ```

  ### Example 2
  ```
  Input:  sites = [[-2, 3], [0, 0], [3, -1]]
  Output: 9
  Explanation: [-2, 3]-[0, 0] costs 5 and [0, 0]-[3, -1] costs 4; the direct cable between the outer
  sites would cost 9 on its own.
  ```

  ### Constraints
  - `1 <= sites.length <= 1000`
  - `sites[i].length == 2`
  - `-10^9 <= x, y <= 10^9`
  - A single distance can reach `4 * 10^9`, so use 64-bit integers for distances and the total.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_cable_cost
  params:
