expected_concepts:
  - greedy choice of the largest affordable gain
  - sorting projects by requirement and sweeping a pointer
  - max-heap of unlocked gains
  - stopping early when nothing is affordable
  - 64-bit arithmetic for the budget
optimal_complexity: {time: O((n + k) log n), space: O(n)}
rubric:
  excellent: Argues that taking the largest gain among affordable projects never hurts because the budget only grows, sorts by requirement and moves unlocked projects into a max-heap, stops when the heap is empty or k projects are done, and keeps the budget in 64 bits.
  good: Correct greedy with sorting and a heap after a hint, or a correct but slower O(n * k) scan with a clear plan to optimise.
  weak: Picks the cheapest or the best gain-to-requirement project, subtracts the requirement from the budget, or tries every order with backtracking.
  criteria:
    correctness: All tests pass, including k larger than the number of projects, nothing affordable, and zero-gain projects.
    efficiency: Each project enters and leaves the heap at most once; O((n + k) log n) total.
    code_quality: Clear separation of the unlock sweep and the selection step; meaningful names for the pointer and heap.
    edge_cases: Budgets beyond 32 bits, requirements equal to the current budget and ties in requirements.
    communication: Explains why the greedy choice is safe and why the requirement is not deducted.
hints:
  - Because the budget never goes down, a project you can afford now stays affordable forever - which of the affordable projects should go first?
  - Taking the largest gain among the projects you can currently start is always at least as good as any other choice; you only need a fast way to see the affordable projects as the budget grows.
  - Sort projects by requirement, and before each of the k steps move every project whose requirement is <= the budget into a max-heap of gains; pop the largest gain and add it to the budget, stopping early when the heap is empty.
followups:
  - Why does the greedy argument fail if completing a project could also cost credits?
  - How would you return the chosen project indices as well?
  - What if k were as large as 10^9 - which part of the loop would you change?
common_errors:
  - Deducting the requirement from the budget when a project starts.
  - Choosing the project with the smallest requirement instead of the largest gain among affordable ones.
  - Rescanning all projects on every step, giving O(n * k) time.
  - Overflowing a 32-bit budget when gains add up.
