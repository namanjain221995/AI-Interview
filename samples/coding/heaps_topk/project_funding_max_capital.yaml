slug: project_funding_max_capital
title: Fund Projects to Grow the Budget
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, tech_lead, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Fund Projects to Grow the Budget

  A platform group runs an internal investment programme. It starts the quarter with `w` budget credits
  and has a list of candidate projects. Project `i` can only be **started** while the group holds at
  least `required[i]` credits (the requirement is a threshold to show the group can absorb the risk,
  it is **not spent**), and **completing** it adds `gain[i]` credits to the budget.

  Projects are done **one after another**, each at most once, and the group has time for **at most
  `k`** of them (it may stop earlier). Choose the projects and their order to maximise the final budget
  and return that maximum.

  ### Example 1
  ```
  Input:  k = 2, w = 1, gain = [2, 5, 4], required = [0, 3, 1]
  Output: 10
  Explanation: with 1 credit only projects 0 and 2 can start; doing project 2 first raises the budget
  to 5, which unlocks project 1 (+5) for a final budget of 10.
  ```

  ### Example 2
  ```
  Input:  k = 3, w = 0, gain = [3, 6, 1], required = [1, 2, 5]
  Output: 0
  Explanation: no project can start with 0 credits, so the budget stays at 0.
  ```

  ### Constraints
  - `1 <= k <= 10^5`
  - `0 <= w <= 10^9`
  - `1 <= gain.length == required.length <= 10^5`
  - `0 <= gain[i] <= 10^9`
  - `0 <= required[i] <= 10^12`
  - The answer fits in a signed 64-bit integer (it is at most `10^9 + 10^5 * 10^9`).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_capital
  params:
    - {name: k, type: int}
    - {name: w, type: long}
    - {name: gain, type: "int[]"}
    - {name: required, type: "long[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def max_capital(k: int, w: int, gain: list[int], required: list[int]) -> int:
        projects = sorted(zip(required, gain))
        available: list[int] = []  # max-heap of gains (negated) of projects we can start
        nxt = 0
        for _ in range(k):
            while nxt < len(projects) and projects[nxt][0] <= w:
                heapq.heappush(available, -projects[nxt][1])
                nxt += 1
            if not available:
                break
            w += -heapq.heappop(available)
        return w
  javascript: |
    function maxCapital(k, w, gain, required) {
      const order = gain.map((_, i) => i).sort((a, b) => required[a] - required[b]);
      // Max-heap of gains.
      const h = [];
      const push = (v) => {
        h.push(v);
        let i = h.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (h[p] >= h[i]) break;
          [h[i], h[p]] = [h[p], h[i]];
          i = p;
        }
      };
      const pop = () => {
        const top = h[0];
        const tail = h.pop();
        if (h.length > 0) {
          h[0] = tail;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let m = i;
            if (l < h.length && h[l] > h[m]) m = l;
            if (r < h.length && h[r] > h[m]) m = r;
            if (m === i) break;
            [h[i], h[m]] = [h[m], h[i]];
            i = m;
          }
        }
        return top;
      };
      let next = 0;
      for (let done = 0; done < k; done++) {
        while (next < order.length && required[order[next]] <= w) {
          push(gain[order[next]]);
          next++;
        }
        if (h.length === 0) break;
        w += pop();
      }
      return w;
    }
