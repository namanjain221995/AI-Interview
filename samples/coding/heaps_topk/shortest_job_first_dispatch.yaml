reference_solutions:
  python: |
    import heapq


    def dispatch_order(tasks: list[list[int]]) -> list[int]:
        by_enqueue = sorted(range(len(tasks)), key=lambda i: tasks[i][0])
        queue: list[tuple[int, int]] = []  # (duration, index) of tasks waiting to run
        order: list[int] = []
        time = 0
        nxt = 0
        while nxt < len(by_enqueue) or queue:
            if not queue and time < tasks[by_enqueue[nxt]][0]:
                time = tasks[by_enqueue[nxt]][0]  # idle until the next task arrives
            while nxt < len(by_enqueue) and tasks[by_enqueue[nxt]][0] <= time:
                i = by_enqueue[nxt]
                heapq.heappush(queue, (tasks[i][1], i))
                nxt += 1
            duration, i = heapq.heappop(queue)
            order.append(i)
            time += duration
        return order
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(x) {
        const a = this.items;
        a.push(x);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function dispatchOrder(tasks) {
      const byEnqueue = tasks.map((_, i) => i).sort((a, b) => tasks[a][0] - tasks[b][0]);
      // Queue entries are [duration, index]; shorter first, then smaller index.
      const queue = new MinHeap((a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]));
      const order = [];
      let time = 0;
      let next = 0;
      while (next < byEnqueue.length || queue.size > 0) {
        if (queue.size === 0 && time < tasks[byEnqueue[next]][0]) time = tasks[byEnqueue[next]][0];
        while (next < byEnqueue.length && tasks[byEnqueue[next]][0] <= time) {
          const i = byEnqueue[next++];
          queue.push([tasks[i][1], i]);
        }
        const [duration, i] = queue.pop();
        order.push(i);
        time += duration;
      }
      return order;
    }
