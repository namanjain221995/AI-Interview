time_limit_minutes: 25
prompt_markdown: |
  ## Shortest-Job-First Dispatcher

  A background worker runs one task at a time and never interrupts a running task. Task `i` is
  `tasks[i] = [enqueue_time, duration]`: it lands in the worker's queue at `enqueue_time` and, once
  started, keeps the worker busy for `duration` time units. The list is in no particular order.

  The worker follows these rules, starting idle at time `0`:

  - Whenever the worker is idle and the queue is non-empty, it starts the queued task with the
    **shortest duration**; ties go to the task with the **smaller index** in `tasks`.
  - A task enqueued at exactly the moment the worker finishes (or becomes idle) is already in the queue
    and can be chosen.
  - If the worker is idle and the queue is empty, it waits until the next task is enqueued.

  Return the indices of the tasks **in the order the worker starts them**. For an empty list, return an
  empty list.

  ### Example 1
  ```
  Input:  tasks = [[1, 4], [2, 2], [3, 1], [4, 3]]
  Output: [0, 2, 1, 3]
  Explanation: task 0 runs from 1 to 5; by then tasks 1, 2 and 3 are queued and run shortest first: 2, 1, 3
  ```

  ### Example 2
  ```
  Input:  tasks = [[5, 3], [5, 3], [5, 1]]
  Output: [2, 0, 1]
  Explanation: task 2 is shortest; tasks 0 and 1 tie on duration, so the smaller index goes first
  ```

  ### Example 3
  ```
  Input:  tasks = [[0, 2], [10, 1], [3, 4]]
  Output: [0, 2, 1]
  Explanation: the worker idles from 2 to 3 and from 7 to 10 waiting for the next task
  ```

  ### Constraints
  - `0 <= tasks.length <= 10^5`
  - `tasks[i].length == 2`
  - `0 <= enqueue_time <= 10^9`
  - `1 <= duration <= 10^9`
  - times can exceed 32 bits while the worker runs (up to about `10^14`); use 64-bit arithmetic where
    your language needs it
languages: [python, javascript, typescript, java, go, cpp]
