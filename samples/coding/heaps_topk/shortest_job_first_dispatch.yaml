expected_concepts:
  - "sorting tasks by enqueue time while keeping their original indices"
  - "min-heap of queued tasks keyed by (duration, index)"
  - "jumping the clock forward when the worker is idle and the queue is empty"
  - "64-bit time arithmetic"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts indices by enqueue time, keeps a (duration, index) min-heap, moves every task with enqueue_time <= current time into it, jumps the clock across idle gaps, and states O(n log n) with 64-bit time."
  good: "Correct heap simulation that needs a hint on idle gaps, the tie rule or tasks enqueued exactly at the finish time."
  weak: "Scans all remaining tasks at every step in O(n^2), picks by enqueue time instead of duration, or loses the original indices when sorting."
  criteria:
    correctness: "All tests pass, including idle gaps, duration ties and tasks enqueued exactly at the finish time."
    efficiency: "Each task is pushed and popped once: O(n log n) overall."
    code_quality: "The simulation loop has clear phases (advance clock, enqueue arrivals, start the best task)."
    edge_cases: "No tasks, one task, all tasks at the same time, large times that need 64-bit integers."
    communication: "Explains why the heap key must include the index for deterministic tie-breaking."
hints:
  - "Simulate the worker's clock. At each moment it becomes idle, which tasks are candidates, and which one does it want?"
  - "Process tasks in order of enqueue time so you can add arrivals as the clock advances, and keep waiting tasks in a structure that always yields the shortest one (index as tie-breaker)."
  - "Sort task indices by enqueue time. Loop: if nothing is queued, move the clock to the next enqueue time; push every task with enqueue_time <= clock as (duration, index) into a min-heap; pop one, record its index and add its duration to the clock."
followups:
  - "How would you compute the average waiting time under this policy?"
  - "What changes if the worker may preempt a running task when a shorter one arrives?"
  - "How would you extend the dispatcher to several identical workers?"
common_errors:
  - "Forgetting to jump the clock forward when the queue is empty, which loops forever or starts tasks early."
  - "Adding tasks with enqueue_time strictly less than the clock, so tasks arriving exactly at the finish time are missed."
  - "Breaking duration ties by enqueue time instead of by index."
  - "Sorting the tasks themselves and losing their original indices."
