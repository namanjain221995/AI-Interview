version: 1
slug: ci_runner_assignment_by_weight
title: Assign CI Jobs to Weighted Runners
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [devops, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Assign CI Jobs to Weighted Runners

  A CI system has a pool of build runners. `weights[r]` is the cost weight of runner `r` (a smaller
  weight means a cheaper runner). Jobs arrive one per second: job `j` becomes **ready at second `j`**
  and needs `durations[j]` seconds on a runner.

  The scheduler works like this at every second `t`:

  1. Every runner whose current job finishes at or before second `t` becomes free.
  2. Ready jobs that have not started yet are taken **in index order**. Each one is given to the free
     runner with the **smallest weight**; ties go to the **smaller runner index**. A job given to a runner
     at second `t` occupies it until second `t + durations[j]`.
  3. If ready jobs are still waiting and no runner is free, they wait (keeping their order) until a
     runner frees up.

  Return a list where element `j` is the index of the runner that runs job `j`.

  ### Example 1
  ```
  Input:  weights = [3, 3, 2], durations = [1, 2, 3, 2, 1, 2]
  Output: [2, 2, 0, 2, 1, 2]
  Explanation: Runner 2 (weight 2) takes job 0 at t=0 and job 1 at t=1 (busy until t=3). Job 2 at t=2
  gets runner 0 (weight 3, smaller index than runner 1). Runner 2 is free again at t=3 for job 3. Job 4
  at t=4 gets runner 1. At t=5 every runner is free and job 5 gets runner 2.
  ```

  ### Example 2
  ```
  Input:  weights = [5, 1], durations = [3, 3, 1, 2, 1]
  Output: [1, 0, 1, 1, 0]
  Explanation: Jobs 0 and 1 occupy both runners. Job 2 waits until runner 1 frees at t=3. At t=4 both
  runners are free: job 3 takes runner 1 (lighter) and job 4 takes runner 0.
  ```

  ### Constraints
  - `1 <= weights.length <= 2 * 10^5`
  - `1 <= durations.length <= 2 * 10^5`
  - `1 <= weights[r] <= 2 * 10^5`
  - `1 <= durations[j] <= 2 * 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: assign_runners
  params:
    - {name: weights, type: "int[]"}
    - {name: durations, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def assign_runners(weights: list[int], durations: list[int]) -> list[int]:
        free = [(weight, runner) for runner, weight in enumerate(weights)]
        heapq.heapify(free)
        busy: list[tuple[int, int, int]] = []  # (free_at, weight, runner)
        result: list[int] = []
        now = 0

        def release(until: int) -> None:
            while busy and busy[0][0] <= until:
                _, weight, runner = heapq.heappop(busy)
                heapq.heappush(free, (weight, runner))

        for job, duration in enumerate(durations):
            now = max(now, job)
            release(now)
            if not free:
                now = busy[0][0]
                release(now)
            weight, runner = heapq.heappop(free)
            result.append(runner)
            heapq.heappush(busy, (now + duration, weight, runner))
        return result
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(item) {
        const a = this.items;
        a.push(item);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function assignRunners(weights, durations) {
      const lexLess = (a, b) => {
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] < b[i];
        return false;
      };
      const free = new MinHeap(lexLess); // [weight, runner]
      const busy = new MinHeap(lexLess); // [freeAt, weight, runner]
      weights.forEach((w, r) => free.push([w, r]));
      const release = (until) => {
        while (busy.size > 0 && busy.peek()[0] <= until) {
          const [, w, r] = busy.pop();
          free.push([w, r]);
        }
      };
      const result = [];
      let now = 0;
      for (let job = 0; job < durations.length; job++) {
        now = Math.max(now, job);
        release(now);
        if (free.size === 0) {
          now = busy.peek()[0];
          release(now);
        }
        const [w, r] = free.pop();
        result.push(r);
        busy.push([now + durations[job], w, r]);
      }
      return result;
    }
