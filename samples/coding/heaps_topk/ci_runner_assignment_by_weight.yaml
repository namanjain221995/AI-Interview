expected_concepts:
  - min-heap of free runners keyed by (weight, index)
  - min-heap of busy runners keyed by finish time
  - jumping the clock to the next finish time instead of ticking second by second
  - 64-bit time when many long jobs queue up
optimal_complexity: {time: "O((n + m) log n) for n runners and m jobs", space: O(n + m)}
rubric:
  excellent: Uses two heaps (free by weight and index, busy by finish time), jumps the clock to the earliest finish when nothing is free, releases every runner that finishes by the current time before choosing, notes that time can exceed 32 bits and states O((n + m) log n).
  good: Correct two-heap simulation with a hint about clock jumps or about releasing several runners at once.
  weak: Simulates second by second, scans all runners for each job, or picks the runner that finished first instead of the lightest free one.
  criteria:
    correctness: All tests pass, including simultaneous releases, ties on weight and long waits.
    efficiency: Each job does O(log n) heap work; no per-second loop over idle time.
    code_quality: The two heaps and the clock variable have clear roles and names.
    edge_cases: One runner, one job, equal weights, unit durations and maximum durations.
    communication: Explains why the clock never moves backwards and why jobs keep index order.
hints:
  - Separate the runners into those that are free right now and those that are busy. What does each group need to answer quickly?
  - Free runners must give you the smallest (weight, index); busy runners must tell you who finishes next. When nothing is free, you do not need to tick second by second.
  - Keep a min-heap of free runners by (weight, index) and a min-heap of busy runners by (finish time, weight, index). For job j set the clock to max(clock, j), move every busy runner with finish time <= clock back to the free heap, and if the free heap is empty jump the clock to the earliest finish time and release again before assigning.
followups:
  - How would you also return the second at which each job starts?
  - What changes if jobs have priorities and the highest-priority waiting job goes first?
  - How would you handle runners that can be added or removed while jobs run?
common_errors:
  - Moving only one runner back to the free heap when several finish at the same time.
  - Choosing the runner that becomes free first instead of the lightest runner among all free ones.
  - Advancing the clock one second at a time, which is far too slow for long durations.
  - Keeping the clock in a 32-bit integer when long queues push finish times past 2^31.
