title: "Netting Settlement Batches"
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, general, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Netting Settlement Batches

  A payments reconciliation job nets pending settlement batches against each other. In every round it
  takes the **two largest** pending amounts, `x >= y`:

  - if `x == y`, the two batches cancel out and both are removed;
  - otherwise both are removed and a new pending batch of `x - y` is added.

  The job stops as soon as at most one batch is pending. Given the pending `amounts`, return the amount
  of the batch that remains, or `0` when nothing remains.

  ### Example 1
  ```
  Input:  amounts = [8, 3, 5, 6, 1]
  Output: 1
  Explanation: 8 and 6 leave 2 -> [3, 5, 1, 2]; 5 and 3 leave 2 -> [1, 2, 2]; 2 and 2 cancel -> [1]
  ```

  ### Example 2
  ```
  Input:  amounts = [4, 4]
  Output: 0
  Explanation: the only two batches cancel each other
  ```

  ### Example 3
  ```
  Input:  amounts = [9, 3, 3, 3]
  Output: 0
  Explanation: 9 and 3 leave 6; 6 and 3 leave 3; 3 and 3 cancel
  ```

  ### Constraints
  - `0 <= amounts.length <= 10^4`
  - `1 <= amounts[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: last_remaining_amount
  params:
    - {name: amounts, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def last_remaining_amount(amounts: list[int]) -> int:
        # heapq is a min-heap, so store negated amounts.
        heap = [-a for a in amounts]
        heapq.heapify(heap)
        while len(heap) > 1:
            x = -heapq.heappop(heap)
            y = -heapq.heappop(heap)
            if x != y:
                heapq.heappush(heap, -(x - y))
        return -heap[0] if heap else 0
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(value) {
        const a = this.items;
        a.push(value);
        let i = a.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.less(a[i], a[parent])) break;
          [a[i], a[parent]] = [a[parent], a[i]];
          i = parent;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function lastRemainingAmount(amounts) {
      const heap = new MinHeap((a, b) => a > b);
      for (const a of amounts) heap.push(a);
      while (heap.size > 1) {
        const x = heap.pop();
        const y = heap.pop();
        if (x !== y) heap.push(x - y);
      }
      return heap.size === 1 ? heap.peek() : 0;
    }
