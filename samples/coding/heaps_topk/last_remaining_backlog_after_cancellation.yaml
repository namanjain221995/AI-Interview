expected_concepts:
  - "max-heap (or negated min-heap)"
  - "repeated extraction of the two largest values"
  - "simulation until at most one item remains"
  - "O(n log n) versus re-sorting every round"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Uses a max-heap (or negated min-heap), pops two per round, pushes only non-zero differences, returns 0 for an empty heap and explains O(n log n) versus re-sorting each round."
  good: "Correct simulation with a heap after first proposing to sort every round, or with a minor slip on the empty case fixed when prompted."
  weak: "Re-sorts the whole list every round without recognising the cost, pushes zero differences that change the answer, or fails on empty input."
  criteria:
    correctness: "All tests pass, including empty input, a single batch and complete cancellation."
    efficiency: "Each round costs O(log n); total O(n log n)."
    code_quality: "Clear handling of the min-heap negation and the termination condition."
    edge_cases: "Empty pool, single batch, all-equal amounts and large values."
    communication: "Explains why the number of rounds is bounded by n."
hints:
  - "Each round needs the two largest pending amounts, and the pool changes after every round, so re-sorting each time is wasteful."
  - "Use a structure that returns the current maximum quickly and accepts new amounts cheaply; in a language with only a min-heap, store negated values."
  - "Put every amount into a max-heap; while it holds at least two items pop the two largest, push their difference back only when it is not zero, and finally return the single remaining amount or zero if the heap is empty."
followups:
  - "Why does every round remove at least one batch, and what does that say about the number of rounds?"
  - "What if you wanted the smallest possible remaining amount over any choice of pairs?"
  - "How would you log which batches were netted together?"
common_errors:
  - "Pushing a zero difference back into the pool."
  - "Reading the top of an empty heap at the end instead of returning 0."
  - "Forgetting to negate values back when using a min-heap as a max-heap."
  - "Sorting the whole list every round, which is O(n^2 log n)."
