slug: max_spot_instances_within_budget
title: "Spot Instances Within Budget"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [cloud, devops, platform]
time_limit_minutes: 12
prompt_markdown: |
  ## Spot Instances Within Budget

  A batch-processing team buys spare compute on a spot market. Each offer `prices[i]` is the hourly
  price of one instance in cents, and each offer can be bought **at most once**. The total hourly price
  of the offers bought must not exceed `budget` cents.

  Return the **maximum number of instances** the team can buy.

  - Offers with a price of `0` are free and always worth taking.
  - Buying nothing is allowed, so the answer is at least `0`.

  ### Example 1
  ```
  Input:  prices = [120, 45, 300, 80, 60], budget = 200
  Output: 3
  Explanation: 45 + 60 + 80 = 185 fits; adding 120 would cost 305
  ```

  ### Example 2
  ```
  Input:  prices = [500, 700], budget = 400
  Output: 0
  ```

  ### Example 3
  ```
  Input:  prices = [30, 30, 30], budget = 90
  Output: 3
  Explanation: the budget is spent exactly
  ```

  ### Constraints
  - `0 <= prices.length <= 10^5`
  - `0 <= prices[i] <= 10^9`
  - `0 <= budget <= 10^15`
  - Use a 64-bit running total; the sum of prices can exceed the 32-bit range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_instances
  params:
    - {name: prices, type: "int[]"}
    - {name: budget, type: "long"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def max_instances(prices: list[int], budget: int) -> int:
        heap = list(prices)
        heapq.heapify(heap)
        spent = 0
        count = 0
        # Cheapest offers first: each purchase leaves the most room for the next.
        while heap and spent + heap[0] <= budget:
            spent += heapq.heappop(heap)
            count += 1
        return count
  javascript: |
    function maxInstances(prices, budget) {
      const sorted = prices.slice().sort((a, b) => a - b);
      let spent = 0;
      let count = 0;
      for (const price of sorted) {
        if (spent + price > budget) break;
        spent += price;
        count++;
      }
      return count;
    }
