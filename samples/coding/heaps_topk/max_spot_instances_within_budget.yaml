expected_concepts:
  - "greedy: buy the cheapest offers first"
  - "sorting or a min-heap"
  - "exchange argument for optimality"
  - "64-bit running total"
optimal_complexity: {time: "O(n log n)", space: "O(n) for the heap or sorted copy"}
rubric:
  excellent: "Takes offers cheapest first via sorting or a min-heap, argues optimality with an exchange argument, stops at the first offer that does not fit, uses a 64-bit total and covers zero prices and an empty list."
  good: "Correct greedy with sorting, with the optimality argument or overflow consideration supplied after a prompt."
  weak: "Tries subsets or a knapsack DP for a count-maximisation problem, picks offers in input order, or continues after the first unaffordable price in a way that breaks the count."
  criteria:
    correctness: "All tests pass, including zero prices, exact budget matches and large budgets."
    efficiency: "O(n log n) sort or heap; no exponential search."
    code_quality: "Simple loop with a clear stopping condition."
    edge_cases: "Empty input, zero budget, free offers and totals beyond 32 bits."
    communication: "Explains why swapping any chosen offer for a cheaper unchosen one never hurts."
hints:
  - "You want as many purchases as possible, not the most expensive ones; which offers should you consider first?"
  - "Buying a cheaper offer instead of a pricier one never leaves you with less budget, so look at the prices in increasing order."
  - "Sort the prices ascending or pop them from a min-heap, adding each next cheapest price to a 64-bit running total while it stays within the budget, and return how many you added before the first price that would overflow it."
followups:
  - "If prices are bounded by a small value, can you beat O(n log n)?"
  - "What if each offer also had a performance score and you wanted the most compute within budget?"
  - "How would you answer many budget queries over the same offers quickly?"
common_errors:
  - "Buying offers in the given order instead of cheapest first."
  - "Reaching for a knapsack DP when the goal is only to maximise the count."
  - "Accumulating the spend in a 32-bit integer."
  - "Skipping free offers or mishandling a zero budget."
