    - {name: burst_credits, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def furthest_cluster(loads: list[int], spare_units: int, burst_credits: int) -> int:
        # Min-heap of the increases currently covered by burst credits.
        credited: list[int] = []
        for i in range(len(loads) - 1):
            rise = loads[i + 1] - loads[i]
            if rise <= 0:
                continue
            heapq.heappush(credited, rise)
            if len(credited) > burst_credits:
                # Too many credited increases: pay the smallest one with spare units instead.
                spare_units -= heapq.heappop(credited)
                if spare_units < 0:
                    return i
        return len(loads) - 1
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(item) {
        const a = this.items;
        a.push(item);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function furthestCluster(loads, spareUnits, burstCredits) {
      // Min-heap of the increases currently covered by burst credits.
      const credited = new MinHeap((a, b) => a < b);
      let spare = spareUnits;
      for (let i = 0; i + 1 < loads.length; i++) {
        const rise = loads[i + 1] - loads[i];
        if (rise <= 0) continue;
        credited.push(rise);
        if (credited.size > burstCredits) {
          spare -= credited.pop();
          if (spare < 0) return i;
        }
      }
      return loads.length - 1;
    }
