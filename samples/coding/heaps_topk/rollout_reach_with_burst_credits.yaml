expected_concepts:
  - greedy - burst credits should cover the largest increases seen so far
  - min-heap of size burst_credits holding the credited increases
  - 64-bit accumulation of spare units
  - stopping at the first move that cannot be paid
optimal_complexity: {time: "O(n log c) where c = burst_credits", space: O(c)}
rubric:
  excellent: Argues that, for any prefix, credits are best spent on its largest increases, implements it with a bounded min-heap that moves the smallest credited increase to spare units, uses 64-bit arithmetic and states O(n log c).
  good: Correct greedy with a heap after a hint, or a correct but slower approach such as binary search on the answer with sorting, explaining the trade-off.
  weak: Spends credits (or spare units) first-come-first-served, tries every assignment, or overflows 32-bit counters.
  criteria:
    correctness: All tests pass, including both greedy traps and the exact-budget cases.
    efficiency: O(n log c) with a heap; a recursive search over choices is not acceptable.
    code_quality: The heap's invariant (it holds the increases currently covered by credits) is clear from names or a comment.
    edge_cases: Single cluster, zero credits, zero spare units, flat and decreasing stretches.
    communication: Explains why replacing a credited increase with a smaller one never hurts.
hints:
  - Moves to an equal or lower load are free, so only the positive increases matter. For a fixed destination, which of those increases would you rather cover with credits?
  - Credits should always cover the largest increases on the path so far. Walk forward and keep track of which increases are currently covered by credits, adjusting as bigger ones appear.
  - Push every increase into a min-heap; when the heap holds more increases than you have credits, pop the smallest one and pay it from spare units. The first time spare units go negative, the current index is the answer.
followups:
  - How would you answer many queries with different spare_units values for the same loads?
  - What if a credit could only cover increases up to a fixed maximum size?
  - Could you solve it with binary search on the answer instead, and what would it cost?
common_errors:
  - Using credits on the first increases encountered instead of the largest ones.
  - Paying with spare units whenever they suffice, which wastes them on a large increase that a credit should cover.
  - Returning i + 1 instead of i when the move from i to i + 1 cannot be paid.
  - Accumulating spare units in a 32-bit integer.
