prompt_markdown: |
  ## How Far Can the Rollout Go

  A canary release moves through a fixed sequence of clusters, starting at cluster `0` and advancing one
  cluster at a time (it can never skip a cluster). `loads[i]` is the baseline load level of cluster `i`.

  Moving from cluster `i` to cluster `i + 1`:

  - is **free** when `loads[i + 1] <= loads[i]`;
  - otherwise needs extra headroom for the increase `loads[i + 1] - loads[i]`, which you cover in one of
    two ways:
    - spend exactly that many **spare capacity units** from a shared pool of `spare_units`, or
    - spend one **burst credit**, which covers an increase of any size on its own. You have
      `burst_credits` of them.

  Spare units and credits are never refunded. Return the **largest cluster index** the rollout can
  reach if you decide optimally which increases to cover with credits. If the rollout cannot leave
  cluster `0`, return `0`.

  ### Example 1
  ```
  Input:  loads = [3, 7, 5, 6, 12, 10, 14], spare_units = 4, burst_credits = 1
  Output: 3
  Explanation: The increases on the way are 4 (0->1), 1 (2->3), 6 (3->4) and 4 (5->6). Reaching
  cluster 4 would need the credit on the 6 and 4 + 1 = 5 spare units, but only 4 are available.
  Cluster 3 is reachable (credit on the first increase, 1 spare unit for the second).
  ```

  ### Example 2
  ```
  Input:  loads = [10, 4, 8, 8, 9, 2], spare_units = 5, burst_credits = 0
  Output: 5
  Explanation: The increases 4 and 1 use all 5 spare units; the other moves are free.
  ```

  ### Constraints
  - `1 <= loads.length <= 10^5`
  - `1 <= loads[i] <= 10^9`
  - `0 <= spare_units <= 10^15` (use a 64-bit integer)
  - `0 <= burst_credits <= loads.length`
languages: [python, javascript, typescript, java, go, cpp]
