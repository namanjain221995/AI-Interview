version: 1
slug: lowest_free_port_allocator
title: Lowest Free Port Allocator
difficulty: easy
competency_keys: [data_structures, code_quality]
role_tags: [backend, platform, network]
time_limit_minutes: 15
prompt_markdown: |
  ## Lowest Free Port Allocator

  A local dev-environment manager hands out TCP ports to preview containers, starting at port `base`. It
  processes `operations` in order:

  - `"alloc"`: pick the **lowest port `>= base` that is not currently allocated**, mark it allocated and
    return it.
  - `"free P"` (for example `"free 8001"`): release port `P` so it can be handed out again. If `P` is not
    currently allocated (never handed out, already freed, or below `base`), the operation is ignored.

  Return the list of ports returned by the `"alloc"` operations, in the order they were processed. Return
  an empty list if there are no `"alloc"` operations.

  ### Example 1
  ```
  Input:  base = 8000, operations = ["alloc", "alloc", "alloc", "free 8001", "alloc", "alloc"]
  Output: [8000, 8001, 8002, 8001, 8003]
  Explanation: 8001 is released and is the lowest free port at the fourth alloc
  ```

  ### Example 2
  ```
  Input:  base = 3000, operations = ["free 3000", "alloc", "free 3000", "free 3000", "alloc", "alloc"]
  Output: [3000, 3000, 3001]
  Explanation: the first free is ignored (3000 was not allocated yet) and the repeated free is ignored too
  ```

  ### Constraints
  - `1 <= base <= 50000`
  - `0 <= operations.length <= 10^4`
  - Each operation is exactly `"alloc"` or `"free P"` with a single space and `0 <= P <= 70000`.
  - You never need to worry about running out of ports.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: allocate_ports
  params:
    - {name: base, type: "int"}
    - {name: operations, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def allocate_ports(base: int, operations: list[str]) -> list[int]:
        next_fresh = base               # every port >= next_fresh has never been handed out
        released: list[int] = []        # min-heap of free ports below next_fresh
        allocated: set[int] = set()
        result: list[int] = []
        for op in operations:
            if op == "alloc":
                port = heapq.heappop(released) if released else next_fresh
                if port == next_fresh:
                    next_fresh += 1
                allocated.add(port)
                result.append(port)
            else:
                port = int(op.split()[1])
                if port in allocated:
                    allocated.remove(port)
                    heapq.heappush(released, port)
        return result
  javascript: |
    function allocatePorts(base, operations) {
      const heap = [];
      const push = (v) => {
        heap.push(v);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p] <= heap[i]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          while (true) {
            const l = 2 * i + 1;
            const r = l + 1;
            let s = i;
            if (l < heap.length && heap[l] < heap[s]) s = l;
            if (r < heap.length && heap[r] < heap[s]) s = r;
            if (s === i) break;
            [heap[s], heap[i]] = [heap[i], heap[s]];
            i = s;
          }
        }
        return top;
      };
      let nextFresh = base;
      const allocated = new Set();
      const result = [];
      for (const op of operations) {
        if (op === "alloc") {
          let port;
          if (heap.length > 0) {
            port = pop();
          } else {
            port = nextFresh;
            nextFresh += 1;
          }
          allocated.add(port);
          result.push(port);
        } else {
          const port = Number(op.split(" ")[1]);
          if (allocated.has(port)) {
            allocated.delete(port);
            push(port);
          }
        }
      }
      return result;
    }
