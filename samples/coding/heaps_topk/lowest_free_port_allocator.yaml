expected_concepts:
  - "min-heap of released ports combined with a high-water mark counter"
  - "set of currently allocated ports to validate frees"
  - "ignoring invalid or duplicate releases"
  - "parsing simple command strings"
optimal_complexity: {time: "O(q log q)", space: "O(q)"}
rubric:
  excellent: "Combines a high-water mark for never-used ports with a min-heap of released ports and a set of allocated ports, ignores invalid and duplicate frees, and explains O(log q) per operation versus scanning upward from base."
  good: "Correct solution with a sorted structure or a linear scan from base; the heap improvement is discussed when prompted."
  weak: "Pushes a port to the free pool on every free (so duplicate frees hand the same port out twice), forgets to reuse released ports, or scans from base on every alloc without noticing the cost."
  criteria:
    correctness: "All tests pass, including ignored frees, double frees and reuse in ascending order."
    efficiency: "O(log q) per operation with a heap and a set; a linear scan per alloc is identified as O(q^2) worst case."
    code_quality: "Command parsing is isolated and the allocator state (high-water mark, heap, set) is clearly named."
    edge_cases: "No allocs, frees below base, frees of never-allocated or already freed ports, base at the limit."
    communication: "Explains the invariant that every port in the heap is below the high-water mark and not allocated."
hints:
  - "Ports split into two groups: ports that were never handed out and ports that were handed out and later released. Which of the two always contains the lowest free port when it is not empty?"
  - "Keep a counter for the next never-used port and a min-heap of released ports; an alloc takes from the heap when it is non-empty and otherwise uses the counter."
  - "Also keep a set of currently allocated ports: a free only moves a port into the heap if the port is in that set (and removes it from the set), so duplicate or bogus frees are ignored; an alloc pops the smallest released port if there is one, otherwise hands out the counter and increments it, then records the port as allocated."
followups:
  - "How would you add an upper bound on the port range and report exhaustion?"
