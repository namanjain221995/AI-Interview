expected_concepts:
  - "k-way merge with a min-heap holding one cursor per feed"
  - "heap entries carry the feed index and position, not just the value"
  - "skipping empty feeds when seeding the heap"
  - "O(N log k) time versus O(N log N) for concatenate-and-sort"
optimal_complexity: {time: "O(N log k)", space: "O(k) besides the output"}
rubric:
  excellent: "Implements the heap-based k-way merge with (price, feed, position) entries, skips empty feeds, keeps duplicates, and explains O(N log k) versus re-sorting; may mention pairwise divide-and-conquer merging as an equivalent alternative."
  good: "Correct heap merge or divide-and-conquer pairwise merge that needs a small fix (for example empty feeds or tuple comparison) and states the complexity."
  weak: "Concatenates and sorts without discussing the sorted inputs, repeatedly scans all feeds for the minimum in O(N * k), or drops duplicates."
  criteria:
    correctness: "All tests pass, including no feeds, empty feeds and duplicates across feeds."
    efficiency: "O(N log k) time with O(k) extra memory for the heap."
    code_quality: "Clear cursor handling; heap entries are well-defined and comparisons never fall back to comparing lists or objects."
    edge_cases: "Empty outer list, empty inner feeds, a single feed and equal prices."
    communication: "Explains why the smallest unread price is always at the front of some feed."
hints:
  - "Since every feed is sorted, where in each feed is the smallest price you have not output yet?"
  - "At any moment you only need to compare the front price of each feed; a structure that repeatedly gives you the minimum of k candidates cheaply would help."
  - "Push the first price of every non-empty feed into a min-heap together with its feed index and position; pop the minimum, append it, and push the next price from the same feed if there is one."
followups:
  - "How does merging the feeds pairwise in rounds (divide and conquer) compare in complexity?"
  - "How would you merge feeds that are unbounded streams, emitting prices as soon as it is safe?"
  - "What would you change to drop duplicate prices instead of keeping them?"
common_errors:
  - "Seeding the heap with an empty feed and indexing past its end."
  - "Pushing only values into the heap, then losing track of which feed to advance."
  - "Scanning all k feed fronts on every step, giving O(N * k) time."
  - "Removing duplicate prices that the output must keep."
