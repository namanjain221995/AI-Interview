slug: merge_sorted_price_feeds
title: "Merge Sorted Price Feeds"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [backend, data, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Merge Sorted Price Feeds

  A market-data service subscribes to several exchange feeds. For one trading interval, each feed
  delivers the quoted prices (in cents) it saw, **already sorted in non-decreasing order**. Some feeds can
  be silent for the interval and deliver an empty list, and the same price can appear several times in
  one feed or across feeds.

  Write `merge_feeds(feeds)` that returns **all** prices from all feeds in one list sorted in
  non-decreasing order. Keep every duplicate: the output length equals the total number of prices. If
  there are no prices at all, return an empty list.

  Concatenating everything and sorting again ignores the work the feeds already did. With `k` feeds and
  `N` prices in total, aim for `O(N log k)` time.

  ### Example 1
  ```
  Input:  feeds = [[101, 104, 109], [102, 103, 110], [104, 105]]
  Output: [101, 102, 103, 104, 104, 105, 109, 110]
  ```

  ### Example 2
  ```
  Input:  feeds = [[], [250, 250], [], [180]]
  Output: [180, 250, 250]
  Explanation: the silent feeds contribute nothing; both copies of 250 are kept
  ```

  ### Constraints
  - `0 <= feeds.length <= 10^4` (the number of feeds `k`)
  - `0 <= feeds[i].length <= 10^4`, and the total number of prices `N` is at most `10^5`
  - `0 <= feeds[i][j] <= 10^9`
  - each `feeds[i]` is sorted in non-decreasing order
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: merge_feeds
  params:
    - {name: feeds, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def merge_feeds(feeds: list[list[int]]) -> list[int]:
        # Heap entries: (price, feed index, position in that feed).
        heap = [(feed[0], i, 0) for i, feed in enumerate(feeds) if feed]
        heapq.heapify(heap)
        merged: list[int] = []
        while heap:
            price, i, j = heapq.heappop(heap)
            merged.append(price)
            if j + 1 < len(feeds[i]):
                heapq.heappush(heap, (feeds[i][j + 1], i, j + 1))
        return merged
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(x) {
        const a = this.items;
        a.push(x);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function mergeFeeds(feeds) {
      // Heap entries: [price, feed index, position in that feed].
      const heap = new MinHeap((a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]));
      feeds.forEach((feed, i) => {
        if (feed.length > 0) heap.push([feed[0], i, 0]);
      });
      const merged = [];
      while (heap.size > 0) {
        const [price, i, j] = heap.pop();
        merged.push(price);
        if (j + 1 < feeds[i].length) heap.push([feeds[i][j + 1], i, j + 1]);
      }
      return merged;
    }
