expected_concepts:
  - priority queue ordered by (count, latest request time)
  - lazy deletion of outdated heap entries
  - hash maps for the current count and latest request of each item
  - resetting state when an item is removed
  - parsing simple command strings
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Keeps per-item count and latest-request maps with a heap keyed by (count, latest request), skips outdated entries lazily (or uses an ordered set with explicit removal), resets an item fully on promotion and explains why each heap entry is popped at most once.
  good: Correct solution with a heap or ordered structure after a hint about stale entries or the tie-breaking rule.
  weak: Scans every pending item on each pop, breaks ties by first request instead of latest, or keeps an item's old count after it is promoted.
  criteria:
    correctness: All tests pass, including ties, re-requests after promotion and pops on an empty set.
    efficiency: O(log n) amortised per operation; no full scan per pop.
    code_quality: Parsing, state updates and the selection rule are separated clearly with readable names.
    edge_cases: Pop on an empty set, a single item pushed many times, and large item ids.
    communication: States the ordering key and the validity check for heap entries before coding.
hints:
  - Each pop needs the item with the largest count, breaking ties by the most recent request - think about which structure gives you that maximum quickly while counts keep changing.
  - Instead of updating an item's heap entry when it is pushed again, push a fresh entry and recognise old entries later by comparing them with the item's current count and latest request.
  - Store count and latest request time per item in maps; on push, update them and push (count, time, item) into a max-heap; on pop, discard top entries that no longer match the maps, output the first valid item and delete it from both maps.
followups:
  - How would you support a "pop" that serves only one pending request of the hottest item instead of all of them?
  - Can you make every operation O(1) using buckets of items per count?
  - How would you bound memory if the heap collects many outdated entries?
common_errors:
  - Breaking ties by the item's first request instead of its most recent one.
  - Not resetting the count when an item is promoted, so a later request continues from the old count.
  - Returning an outdated heap entry for an item that was already promoted.
  - Scanning all pending items on every pop, which is quadratic in the worst case.
