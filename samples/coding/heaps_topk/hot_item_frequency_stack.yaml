prompt_markdown: |
  ## Hot Item Promotion Queue

  A content delivery network notices requests for items that are not yet cached at the edge and
  records them as **pending**. A background job repeatedly promotes the hottest pending item to the
  edge cache. You receive the operations `operations` in order; each one is either:

  - `"push x"`: a request for item `x` arrived. The item's **pending count** grows by 1 (an item that
    is not pending starts at 1) and this becomes the item's **latest request**;
  - `"pop"`: promote one item. Pick the pending item with the **largest pending count**; if several
    items share that count, pick the one whose latest request is the **most recent**. Remove that item
    from the pending set completely (all of its pending requests are served at once, so a later
    `"push"` of the same item starts again at count 1) and output its id. If nothing is pending,
    output `-1` and change nothing.

  Return the outputs of all `"pop"` operations, in order.

  ### Example 1
  ```
  Input:  operations = ["push 7", "push 3", "push 7", "push 5", "push 3", "pop", "push 5", "pop", "pop", "pop"]
  Output: [3, 5, 7, -1]
  Explanation: before the first pop, 7 and 3 both have 2 pending requests and 3 was requested last, so 3
  goes first. The second push of 5 gives it count 2 with a more recent request than 7, so 5 is next,
  then 7; the last pop finds nothing pending.
  ```

  ### Example 2
  ```
  Input:  operations = ["pop", "push 42", "pop", "push 42", "push 8", "pop"]
  Output: [-1, 42, 8]
  Explanation: after 42 is promoted its count is reset, so the new request for 42 and the request for 8
  both have count 1, and 8 is the more recent one.
  ```

  ### Constraints
  - `1 <= operations.length <= 2 * 10^4`
  - Every operation is exactly `"pop"` or `"push x"` with a single space, where `x` is an integer with
    `0 <= x <= 10^9` written without leading zeros.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: run_tracker
  params:
    - {name: operations, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def run_tracker(operations: list[str]) -> list[int]:
        count: dict[int, int] = {}
        last: dict[int, int] = {}
        # Entries (-count, -request_time, item): the smallest tuple is the hottest, freshest item.
        heap: list[tuple[int, int, int]] = []
        output: list[int] = []
        for time, op in enumerate(operations):
            if op.startswith("push"):
                item = int(op.split()[1])
                count[item] = count.get(item, 0) + 1
                last[item] = time
                heapq.heappush(heap, (-count[item], -time, item))
                continue
            promoted = -1
            while heap:
                neg_count, neg_time, item = heapq.heappop(heap)
                # Valid only if it describes the item's current state (lazy deletion).
                if count.get(item) == -neg_count and last.get(item) == -neg_time:
                    promoted = item
                    del count[item]
                    del last[item]
                    break
            output.append(promoted)
        return output
  javascript: |
    function runTracker(operations) {
      const count = new Map();
      const last = new Map();
      // Max-heap of [count, time, item]: higher count first, then more recent time.
      const h = [];
      const less = (a, b) => (a[0] !== b[0] ? a[0] > b[0] : a[1] > b[1]);
      const push = (e) => {
        h.push(e);
        let i = h.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!less(h[i], h[p])) break;
          [h[i], h[p]] = [h[p], h[i]];
          i = p;
        }
      };
      const pop = () => {
        const top = h[0];
        const tail = h.pop();
        if (h.length > 0) {
          h[0] = tail;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let m = i;
            if (l < h.length && less(h[l], h[m])) m = l;
            if (r < h.length && less(h[r], h[m])) m = r;
            if (m === i) break;
            [h[i], h[m]] = [h[m], h[i]];
            i = m;
          }
        }
        return top;
      };
      const output = [];
      operations.forEach((op, time) => {
        if (op.startsWith("push")) {
          const item = Number(op.split(" ")[1]);
          const c = (count.get(item) || 0) + 1;
          count.set(item, c);
          last.set(item, time);
          push([c, time, item]);
          return;
        }
        let promoted = -1;
        while (h.length > 0) {
          const [c, t, item] = pop();
          if (count.get(item) === c && last.get(item) === t) {
            promoted = item;
            count.delete(item);
            last.delete(item);
            break;
          }
        }
        output.push(promoted);
      });
      return output;
    }
