expected_concepts:
  - "sorting jobs by start time"
  - "min-heap of agent free times (or a sweep over sorted start and end events)"
  - "half-open ranges: an end at t is processed before a start at t"
  - "the answer equals the maximum number of simultaneously running jobs"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts by start and keeps a min-heap of free times (or sweeps sorted start and end events), handles the half-open boundary correctly, argues why the result is the maximum overlap and states O(n log n)."
  good: "Correct heap or sweep solution that needs a nudge on the boundary rule or on the empty input."
  weak: "Counts overlaps pairwise in O(n^2), checks only adjacent jobs, or treats a job ending at t as still busy at t."
  criteria:
    correctness: "All tests pass, including back-to-back jobs, identical jobs and nested ranges."
    efficiency: "O(n log n) time dominated by sorting; heap operations are O(log n)."
    code_quality: "Clear names (free_at, busy) and no mutation of the caller's list without saying so."
    edge_cases: "No jobs, one job, equal starts, an end equal to another job's start."
    communication: "Explains the greedy choice of reusing the agent that frees up earliest."
hints:
  - "If you process jobs in order of their start time, what do you need to know about the agents that are already busy?"
  - "When a job starts, the only busy agent worth checking is the one that becomes free the earliest; a structure that always gives you that minimum helps."
  - "Sort jobs by start, keep a min-heap of end times; for each job, if the smallest end is at most its start, replace that end with the job's end, otherwise push a new end. The heap size at the end is the answer."
followups:
  - "How would you also return which agent runs each job?"
  - "What changes if ranges were closed, so a job ending at t still blocks a job starting at t?"
  - "If only m agents exist, how would you find the jobs that cannot run on time?"
common_errors:
  - "Using a strict comparison so an agent freed at t cannot take a job starting at t."
  - "Comparing each job only with the previous one in sorted order instead of with all running jobs."
  - "Forgetting to sort by start time before the sweep."
  - "Returning 1 instead of 0 for an empty schedule."
