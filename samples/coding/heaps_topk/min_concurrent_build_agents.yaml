slug: min_concurrent_build_agents
title: "Minimum Build Agents"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, platform, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Build Agents

  A CI system has a fixed schedule of jobs for the night. Job `i` is `jobs[i] = [start, end]` and must
  run **exactly** from `start` until `end` (minutes after midnight). Ranges are **half-open**: the job
  occupies its build agent at every moment `t` with `start <= t < end`, so an agent whose job ends at
  `t` can begin another job that starts at `t`.

  Each job needs one build agent to itself for its whole range, and any agent can run any job. Return
  the **minimum number of agents** that lets every job run as scheduled. With no jobs, return `0`.

  The jobs are listed in no particular order.

  ### Example 1
  ```
  Input:  jobs = [[0, 30], [5, 10], [15, 20]]
  Output: 2
  Explanation: the long job overlaps each short one, but the short ones never overlap each other
  ```

  ### Example 2
  ```
  Input:  jobs = [[540, 600], [60, 300], [300, 540]]
  Output: 1
  Explanation: each job starts exactly when the previous one ends, so one agent runs all three
  ```

  ### Constraints
  - `0 <= jobs.length <= 10^4`
  - `jobs[i].length == 2`
  - `0 <= start < end <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_build_agents
  params:
    - {name: jobs, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def min_build_agents(jobs: list[list[int]]) -> int:
        # Min-heap of the times at which the agents in use become free.
        free_at: list[int] = []
        for start, end in sorted(jobs):
            if free_at and free_at[0] <= start:
                heapq.heapreplace(free_at, end)  # reuse the agent that frees up first
            else:
                heapq.heappush(free_at, end)
        return len(free_at)
  javascript: |
    function minBuildAgents(jobs) {
      // Sweep over sorted start and end times; an end at t is processed before a start at t.
      const starts = jobs.map((j) => j[0]).sort((a, b) => a - b);
      const ends = jobs.map((j) => j[1]).sort((a, b) => a - b);
      let busy = 0;
      let best = 0;
      let e = 0;
      for (const s of starts) {
        while (e < ends.length && ends[e] <= s) {
          busy--;
          e++;
        }
        busy++;
        best = Math.max(best, busy);
      }
      return best;
    }
