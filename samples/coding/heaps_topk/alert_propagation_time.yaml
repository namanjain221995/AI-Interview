version: 1
slug: alert_propagation_time
title: Alert Propagation Time
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [sre, network, backend]
time_limit_minutes: 22
prompt_markdown: |
  ## Alert Propagation Time

  A critical alert is raised on service `source` at time `0` and spreads through a mesh of `n` services
  numbered `0` to `n - 1`. Each entry `links[i] = [from, to, delay_ms]` is a **one-way** forwarding
  link: as soon as service `from` has the alert, it reaches service `to` after `delay_ms` milliseconds.
  Every service forwards the alert on all of its outgoing links the moment it first receives it.

  Each service receives the alert at the earliest time any path from `source` delivers it. Return the
  time at which the **last** service receives the alert, or `-1` if at least one service is never
  reached.

  Links may repeat between the same pair of services (with different delays), a link may point from a
  service to itself, and cycles are allowed.

  ### Example 1
  ```
  Input:  n = 4, links = [[0, 1, 5], [0, 2, 2], [2, 1, 1], [1, 3, 4], [2, 3, 9]], source = 0
  Output: 7
  Explanation: Service 2 gets the alert at 2, service 1 at 3 (via 2, faster than the direct 5) and
  service 3 at 7 (via 1). The last arrival is at 7.
  ```

  ### Example 2
  ```
  Input:  n = 3, links = [[0, 1, 4], [1, 0, 4]], source = 1
  Output: -1
  Explanation: No link leads to service 2.
  ```

  ### Constraints
  - `1 <= n <= 10^4`
  - `0 <= links.length <= 2 * 10^4`
  - `links[i].length == 3`, `0 <= from, to < n`
  - `0 <= delay_ms <= 10^4`
  - `0 <= source < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: propagation_time
  params:
    - {name: n, type: int}
    - {name: links, type: "int[][]"}
    - {name: source, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def propagation_time(n: int, links: list[list[int]], source: int) -> int:
        outgoing: list[list[tuple[int, int]]] = [[] for _ in range(n)]
        for start, end, delay in links:
            outgoing[start].append((end, delay))
        arrival = [-1] * n
        heap = [(0, source)]
        reached = 0
        latest = 0
        while heap:
            time, service = heapq.heappop(heap)
            if arrival[service] != -1:
                continue  # already settled with an earlier time
            arrival[service] = time
            reached += 1
            latest = time
            for nxt, delay in outgoing[service]:
                if arrival[nxt] == -1:
                    heapq.heappush(heap, (time + delay, nxt))
        return latest if reached == n else -1
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(item) {
        const a = this.items;
        a.push(item);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function propagationTime(n, links, source) {
      const outgoing = Array.from({ length: n }, () => []);
      for (const [start, end, delay] of links) outgoing[start].push([end, delay]);
      const arrival = new Array(n).fill(-1);
      const heap = new MinHeap((a, b) => a[0] < b[0]);
      heap.push([0, source]);
      let reached = 0;
      let latest = 0;
      while (heap.size > 0) {
        const [time, service] = heap.pop();
        if (arrival[service] !== -1) continue;
        arrival[service] = time;
        reached++;
        latest = time;
        for (const [next, delay] of outgoing[service]) {
          if (arrival[next] === -1) heap.push([time + delay, next]);
        }
      }
      return reached === n ? latest : -1;
    }
