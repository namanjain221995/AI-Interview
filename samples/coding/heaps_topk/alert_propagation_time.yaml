expected_concepts:
  - single-source shortest paths with non-negative weights (Dijkstra)
  - min-heap keyed by arrival time with lazy deletion of stale entries
  - adjacency list for a directed graph with parallel edges
  - answer is the maximum shortest distance, or -1 if any node is unreachable
optimal_complexity: {time: "O((n + e) log e) for e links", space: O(n + e)}
rubric:
  excellent: Recognises single-source shortest paths with non-negative delays, implements Dijkstra with a heap and lazy deletion, explains why BFS is wrong with weighted links, handles unreachable services and parallel links, and states O((n + e) log e).
  good: Correct Dijkstra with minor prompting, or Bellman-Ford with a clear explanation of its O(n * e) cost.
  weak: Uses plain BFS (fewest hops), takes the first time a node is pushed instead of popped, or forgets the unreachable case.
  criteria:
    correctness: All tests pass, including parallel links, zero delays, self-loops and unreachable services.
    efficiency: Heap-based Dijkstra; each node is settled once.
    code_quality: Clear adjacency construction and a readable settle step.
    edge_cases: Single service, links pointing only toward the source and disconnected components.
    communication: Explains why the first time a service is popped from the heap is its fastest arrival.
hints:
  - Each service receives the alert along its fastest path. Which classic graph problem computes the fastest time from one start node to every other node when all delays are non-negative?
  - Always expand the service with the smallest known arrival time next; once a service has been expanded, its time can no longer improve.
  - Build an adjacency list, push (0, source) into a min-heap, and repeatedly pop the earliest entry; skip services that are already settled, otherwise record the time and push each neighbour with time + delay. The answer is the largest recorded time, or -1 if fewer than n services were settled.
followups:
  - How would you also report which path the alert took to the last service?
  - What changes if some links could have negative adjustments (for example clock skew corrections)?
  - How would you find the single link whose removal delays the last arrival the most?
common_errors:
  - Using BFS by hop count, which ignores the delays.
  - Marking a service as done when it is first pushed instead of when it is popped, which keeps a slower arrival.
  - Returning the largest delay seen instead of the largest shortest arrival time.
  - Forgetting to return -1 when some service is never reached.
