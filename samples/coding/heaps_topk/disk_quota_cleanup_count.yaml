slug: disk_quota_cleanup_count
title: Disk Quota Cleanup
difficulty: easy
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [devops, sre, platform, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Disk Quota Cleanup

  A CI build server keeps its log files on a volume with a byte quota. `sizes[i]` is the size of log file
  `i` in bytes. When the total size of all files exceeds `quota`, a cleanup job runs: it repeatedly deletes
  the **largest remaining file** until the total is **at most** `quota`.

  Return how many files the cleanup job deletes. Return `0` when the volume is already within its quota.
  Because `quota` is never negative, deleting every file always brings the volume within quota.

  ### Example 1
  ```
  Input:  sizes = [400, 100, 250, 900, 50], quota = 600
  Output: 2
  Explanation: the total is 1700; deleting 900 leaves 800 and deleting 400 leaves 400, which fits
  ```

  ### Example 2
  ```
  Input:  sizes = [30, 20], quota = 100
  Output: 0
  ```

  ### Example 3
  ```
  Input:  sizes = [5, 5, 5], quota = 0
  Output: 3
  ```

  ### Constraints
  - `0 <= sizes.length <= 10^4`
  - `1 <= sizes[i] <= 10^11`
  - `0 <= quota <= 10^15`
  - Totals can exceed the 32-bit range; use 64-bit arithmetic.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: files_to_delete
  params:
    - {name: sizes, type: "long[]"}
    - {name: quota, type: "long"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def files_to_delete(sizes: list[int], quota: int) -> int:
        total = sum(sizes)
        heap = [-size for size in sizes]  # max-heap through negation
        heapq.heapify(heap)
        deleted = 0
        while total > quota:
            total += heapq.heappop(heap)  # adds the negated size, i.e. subtracts it
            deleted += 1
        return deleted
  javascript: |
    function filesToDelete(sizes, quota) {
      let total = 0;
      for (const size of sizes) total += size;
      const ordered = [...sizes].sort((a, b) => b - a);
      let deleted = 0;
      while (total > quota) {
        total -= ordered[deleted];
        deleted += 1;
      }
      return deleted;
    }
