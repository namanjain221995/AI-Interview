expected_concepts:
  - "greedy removal of the largest element first"
  - "max-heap (or descending sort) to fetch the largest remaining file"
  - "tracking the running total instead of re-summing"
  - "64-bit arithmetic for byte totals"
optimal_complexity: {time: "O(n + d log n)", space: "O(n)"}
rubric:
  excellent: "Computes the total once, uses a max-heap or a descending sort to remove the largest files while the total exceeds the quota, handles the at-most boundary and empty input, and explains heapify plus d pops versus a full sort."
  good: "Correct sort-based solution with the right boundary; complexity stated with minor prompting."
  weak: "Re-sums the list after every deletion, uses a strict boundary that deletes one file too many, or overflows 32-bit totals."
  criteria:
    correctness: "All tests pass, including the exact-quota boundary, an empty list and large sizes."
    efficiency: "O(n log n) by sorting or O(n + d log n) with heapify, where d is the number of deletions."
    code_quality: "Running total maintained incrementally; the loop condition reads directly as the rule in the statement."
    edge_cases: "Empty list, already within quota, quota of zero, duplicate sizes and 64-bit totals."
    communication: "Explains why deleting the largest file first is what the job does and how the heap avoids sorting everything."
hints:
  - "You only care about the total size and which file is currently the largest; how could you get the largest remaining file quickly every time?"
  - "Compute the total once, then keep removing the largest file and subtracting its size until the total is no longer above the quota, counting the removals."
  - "Put all sizes into a max-heap (or sort them from largest to smallest), and while the running total is strictly greater than the quota pop the next largest size, subtract it and increase the counter; the counter is the answer, and the loop never runs when the volume already fits."
followups:
  - "If you had to report which files were deleted, what would you return and in what order?"
  - "How would you handle files arriving continuously while the cleanup job runs?"
  - "When is heapify plus a few pops faster than sorting all files?"
  - "What if old files should be deleted first instead of large ones?"
common_errors:
  - "Using total >= quota as the loop condition and deleting one file too many."
  - "Recomputing the sum of all remaining files on every iteration."
  - "Accumulating totals in a 32-bit integer."
  - "Indexing past the end of the list on empty input."
