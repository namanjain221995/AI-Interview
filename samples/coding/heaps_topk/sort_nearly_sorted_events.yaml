prompt_markdown: |
  ## Repair Slightly Shuffled Event Stream

  An event collector merges small per-host buffers, so the timestamps it emits are *almost* in order:
  every timestamp is **at most `k` positions away** from the position it would occupy in the fully
  sorted sequence. The input is guaranteed to have this property.

  Given `timestamps` (milliseconds since an epoch) and `k`, return the timestamps sorted in
  **non-decreasing** order. Equal timestamps are all kept.

  Aim for `O(n log k)` time and `O(k)` extra memory besides the output, which beats a general sort when
  `k` is small.

  ### Example 1
  ```
  Input:  timestamps = [1003, 1001, 1002, 1006, 1004, 1005], k = 2
  Output: [1001, 1002, 1003, 1004, 1005, 1006]
  Explanation: 1001 and 1002 each moved one place, 1003 two places, so k = 2 is enough
  ```

  ### Example 2
  ```
  Input:  timestamps = [1717000000005, 1717000000000, 1717000000010], k = 1
  Output: [1717000000000, 1717000000005, 1717000000010]
  ```

  ### Example 3
  ```
  Input:  timestamps = [7, 7, 3, 9], k = 2
  Output: [3, 7, 7, 9]
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= k <= 10^5` (`k` may be larger than the length)
  - `-10^15 <= timestamps[i] <= 10^15`
  - Every timestamp is at most `k` positions from its sorted position.
languages: [python, javascript, typescript, java, go, cpp]
