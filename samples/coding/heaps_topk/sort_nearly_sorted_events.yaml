  weak: "Only sorts the whole array without discussing the k-sorted property, uses a heap of size k (dropping the boundary case) or loses duplicates."
  criteria:
    correctness: "All tests pass, including k = 0, k larger than the length and duplicates."
    efficiency: "Heap never holds more than k + 1 items, giving O(n log k)."
    code_quality: "Simple loop with a clear emit-when-window-is-full rule and a final drain."
    edge_cases: "Empty input, k = 0, fully reversed input, negative and large timestamps."
    communication: "Justifies the window size of k + 1 with the displacement guarantee."
hints:
  - "If every timestamp is at most k places from where it belongs, where can the smallest remaining timestamp be hiding?"
  - "The smallest timestamp not yet emitted must be among the next k + 1 unread entries, so keep just those candidates in a structure that gives the minimum quickly."
  - "Push timestamps into a min-heap as you read them; whenever the heap holds more than k items pop its minimum to the output, and after the last timestamp pop everything that remains, so the heap never exceeds k + 1 items."
followups:
  - "How would you do this on an unbounded stream, emitting events as soon as they are safe?"
  - "What happens if the guarantee is violated by one late event - how could you detect it?"
  - "Could insertion sort be competitive here, and for which k?"
common_errors:
  - "Keeping only k items in the heap instead of k + 1 before emitting, which can emit a value too early."
  - "Forgetting to drain the heap after the input ends."
  - "Sorting the whole input and ignoring the k-sorted structure."
  - "Using a 32-bit type for millisecond timestamps."
