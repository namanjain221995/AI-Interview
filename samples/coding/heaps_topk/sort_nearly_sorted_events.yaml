reference_solutions:
  python: |
    import heapq


    def repair_order(timestamps: list[int], k: int) -> list[int]:
        window: list[int] = []
        result: list[int] = []
        for value in timestamps:
            heapq.heappush(window, value)
            # The smallest of k + 1 consecutive candidates is final.
            if len(window) > k:
                result.append(heapq.heappop(window))
        while window:
            result.append(heapq.heappop(window))
        return result
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(value) {
        const a = this.items;
        a.push(value);
        let i = a.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.less(a[i], a[parent])) break;
          [a[i], a[parent]] = [a[parent], a[i]];
          i = parent;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function repairOrder(timestamps, k) {
      const window = new MinHeap((a, b) => a < b);
      const result = [];
      for (const value of timestamps) {
        window.push(value);
        if (window.size > k) result.push(window.pop());
      }
      while (window.size > 0) result.push(window.pop());
      return result;
    }
