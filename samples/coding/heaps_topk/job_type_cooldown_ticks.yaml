version: 1
slug: job_type_cooldown_ticks
title: "Rate-Limited Job Types"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Rate-Limited Job Types

  A batch worker drains a backlog of jobs. Every job has a type, written as one uppercase letter, and
  the backlog is the string `job_types` (one letter per job). The worker runs on a clock of numbered
  ticks and can run **one job per tick**, or stay **idle** for a tick.

  Each job type talks to an external API with a rate limit: after a job of type `X` runs on tick `t`,
  the next job of type `X` may run no earlier than tick `t + cooldown + 1`. Jobs of different types have
  no restriction between them, and the worker may run the jobs in **any order** it likes.

  Return the **minimum number of ticks** needed to finish every job, counting idle ticks in between.
  Ticks after the last job do not count; an empty backlog needs `0` ticks.

  ### Example 1
  ```
  Input:  job_types = "AAABBC", cooldown = 2
  Output: 7
  Explanation: one optimal schedule is A B C A B idle A
  ```

  ### Example 2
  ```
  Input:  job_types = "ABCABC", cooldown = 2
  Output: 6
  Explanation: A B C A B C needs no idle ticks
  ```

  ### Example 3
  ```
  Input:  job_types = "DDDD", cooldown = 1
  Output: 7
  Explanation: D idle D idle D idle D
  ```

  ### Constraints
  - `0 <= job_types.length <= 10^4`
  - `job_types` contains only uppercase letters `A`-`Z`
  - `0 <= cooldown <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_ticks
  params:
    - {name: job_types, type: "string"}
    - {name: cooldown, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    import heapq
    from collections import Counter, deque


    def min_ticks(job_types: str, cooldown: int) -> int:
        # Max-heap of remaining job counts per type, plus a queue of types cooling down.
        ready = [-count for count in Counter(job_types).values()]
        heapq.heapify(ready)
        cooling: deque[tuple[int, int]] = deque()  # (last tick of the cooldown, -remaining)
        tick = 0
        while ready or cooling:
            tick += 1
            if ready:
                remaining = heapq.heappop(ready) + 1  # run the type with the most jobs left
                if remaining:
                    cooling.append((tick + cooldown, remaining))
            if cooling and cooling[0][0] == tick:
                heapq.heappush(ready, cooling.popleft()[1])
        return tick
  javascript: |
    function minTicks(jobTypes, cooldown) {
      if (jobTypes.length === 0) return 0;
      const counts = new Array(26).fill(0);
      for (const ch of jobTypes) counts[ch.charCodeAt(0) - 65]++;
      const most = Math.max(...counts);
      const typesWithMost = counts.filter((c) => c === most).length;
      // The busiest type forces (most - 1) full cycles of cooldown + 1 ticks plus a final partial cycle.
      return Math.max(jobTypes.length, (most - 1) * (cooldown + 1) + typesWithMost);
    }
tests:
  - {id: t1, args: ["AAABBC", 2], expected: 7, description: "Example 1 - the most frequent type forces one idle tick"}
  - {id: t2, args: ["ABCABC", 2], expected: 6, description: "Example 2 - enough variety to fill every gap"}
  - {id: t3, args: ["DDDD", 1], expected: 7, description: "Example 3 - a single type alternates with idle ticks"}
  - {id: t4, hidden: true, args: ["", 5], expected: 0, description: "Empty backlog"}
  - {id: t5, hidden: true, args: ["Z", 100], expected: 1, description: "Single job with a huge cooldown"}
  - {id: t6, hidden: true, args: ["AABB", 0], expected: 4, description: "Zero cooldown means no idle time"}
  - {id: t7, hidden: true, args: ["AAABBBCCC", 2], expected: 9, description: "Three types tied for the maximum count"}
  - {id: t8, hidden: true, args: ["AAABBBCC", 3], expected: 10, description: "Two types tied at the maximum with a cooldown longer than the number of types"}
  - {id: t9, hidden: true, args: ["AAAB", 100], expected: 203, description: "Large cooldown dominated by one type"}
  - {id: t10, hidden: true, args: ["ABCDEFGHIJKLMNOPQRSTUVWXYZABCDEFGHIJKLMNOPQRSTUVWXYZ", 25], expected: 52, description: "All 26 types twice with cooldown 25: no idle tick needed"}
  - {id: t11, hidden: true, args: ["", 4], expected: 1676, description: "Stress: 1000 jobs skewed towards one type"}
expected_concepts:
  - "greedy: always run the available type with the most jobs left"
  - "max-heap of remaining counts plus a cooldown queue"
  - "counting argument: (max_count - 1) * (cooldown + 1) + number of types with max_count"
  - "the answer is at least the number of jobs"
optimal_complexity: {time: "O(n) counting (O(T log 26) for the heap simulation over T ticks)", space: "O(1) (26 job types)"}
rubric:
  excellent: "Explains why the most frequent type is the bottleneck, derives max(n, (max - 1) * (cooldown + 1) + ties) or implements the heap plus cooldown-queue simulation with a correctness argument, and handles the empty backlog and zero cooldown."
  good: "Correct heap simulation without the closed form, or the formula with a partial justification."
  weak: "Runs jobs in the given order, schedules round-robin without regard to counts, or misses the max(n, ...) term."
  criteria:
    correctness: "All tests pass, including ties at the maximum count, zero cooldown and backlogs that need no idle ticks."
    efficiency: "O(n) with counting, or a heap simulation bounded by the number of ticks."
    code_quality: "Clear separation of counting and scheduling; no special cases scattered through the loop."
    edge_cases: "Empty backlog, a single job, cooldown 0 and many distinct types."
    communication: "Explains the frame picture: the busiest type splits the timeline into cooldown + 1 slots."
hints:
  - "Which job type makes the schedule long? Think about the type that has the most jobs and what must happen between two of its runs."
  - "Lay out the busiest type first: its runs split the timeline into frames of cooldown + 1 ticks. Other jobs fill the gaps; idle ticks appear only when there are not enough of them. Greedily running the type with the most jobs left achieves this."
  - "Either simulate with a max-heap of remaining counts and a queue of types cooling down, or compute (max_count - 1) * (cooldown + 1) + (number of types that have max_count) and return the larger of that and the number of jobs."
followups:
  - "How would you output an actual schedule, with idle ticks, rather than only its length?"
  - "What changes if each job type had its own cooldown?"
  - "What if the jobs had to run in the given order (no reordering)?"
common_errors:
  - "Forgetting that when there is enough variety no idle tick is needed, so the answer can never be less than the number of jobs."
  - "Ignoring that several types can share the maximum count, which adds to the last frame."
  - "Using cooldown instead of cooldown + 1 as the frame length."
  - "Counting idle ticks after the last job."
