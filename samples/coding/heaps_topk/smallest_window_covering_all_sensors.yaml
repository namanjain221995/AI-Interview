slug: smallest_window_covering_all_sensors
title: Shortest Window Seeing Every Sensor
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, sre, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Shortest Window Seeing Every Sensor

  A plant monitoring system wants to replay a short slice of history in which **every** sensor was heard
  from at least once. Sensor `i` reported events at the timestamps in `readings[i]`, which is non-empty and
  strictly increasing.

  Find the inclusive time range `[a, b]` with `a <= b` that contains **at least one timestamp from every
  sensor** and has the smallest length `b - a`. If several ranges share the smallest length, return the one
  with the **smallest** `a`. Return the range as `[a, b]`.

  ### Example 1
  ```
  Input:  readings = [[2, 9, 15], [5, 11, 20], [8, 13]]
  Output: [8, 11]
  Explanation: [8, 11] contains 9 (sensor 0), 11 (sensor 1) and 8 (sensor 2); no shorter range covers
               all three sensors.
  ```

  ### Example 2
  ```
  Input:  readings = [[1, 10], [4, 13]]
  Output: [1, 4]
  Explanation: [1, 4] and [10, 13] both have length 3; the one that starts earlier wins.
  ```

  ### Example 3
  ```
  Input:  readings = [[7, 12]]
  Output: [7, 7]
  ```

  ### Constraints
  - `1 <= readings.length <= 3000`
  - `1 <= readings[i].length`, and the total number of readings is at most `10^5`
  - `0 <= readings[i][j] <= 10^9`
  - Each `readings[i]` is strictly increasing; different sensors may share timestamps.

  **Follow-up:** merging everything and checking every start against every sensor is slow. Can you solve it
  in `O(N log k)`, where `N` is the total number of readings and `k` the number of sensors?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: covering_window
  params:
    - {name: readings, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def covering_window(readings: list[list[int]]) -> list[int]:
        # One pointer per sensor; the heap holds the current reading of every sensor.
        heap = [(times[0], sensor, 0) for sensor, times in enumerate(readings)]
        heapq.heapify(heap)
        high = max(times[0] for times in readings)
        best = [heap[0][0], high]
        while True:
            low, sensor, idx = heapq.heappop(heap)
            if high - low < best[1] - best[0]:
                best = [low, high]
            if idx + 1 == len(readings[sensor]):
                # This sensor has no later reading, so no window can start after low.
                return best
            nxt = readings[sensor][idx + 1]
            high = max(high, nxt)
            heapq.heappush(heap, (nxt, sensor, idx + 1))
  javascript: |
    function coveringWindow(readings) {
      const heap = []; // min-heap of [time, sensor, index]
      const less = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!less(heap[i], heap[p])) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && less(heap[l], heap[m])) m = l;
            if (r < heap.length && less(heap[r], heap[m])) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      let high = -Infinity;
      readings.forEach((times, sensor) => {
        push([times[0], sensor, 0]);
        high = Math.max(high, times[0]);
      });
      let best = [heap[0][0], high];
      for (;;) {
        const [low, sensor, idx] = pop();
        if (high - low < best[1] - best[0]) best = [low, high];
        if (idx + 1 === readings[sensor].length) return best;
        const next = readings[sensor][idx + 1];
        high = Math.max(high, next);
        push([next, sensor, idx + 1]);
      }
    }
