expected_concepts:
  - one pointer per sensor, like a k-way merge
  - min-heap of the current reading of every sensor
  - tracking the running maximum of the current readings
  - advancing only the sensor that holds the minimum
  - stopping as soon as one sensor runs out of readings
  - tie-breaking on the earliest start
optimal_complexity: {time: "O(N log k)", space: "O(k)"}
rubric:
  excellent: Keeps one current reading per sensor in a min-heap with a running maximum, evaluates
    [heap minimum, maximum] after each step, advances the minimum's sensor, stops when it is exhausted,
    explains why skipping other moves loses no candidate and why strict improvement yields the earliest start,
    and states O(N log k).
  good: Finds the heap-based k-way pointer walk or an equivalent sliding window over all readings merged and
    tagged by sensor, with minor slips in the stopping rule or the tie-break.
  weak: Tries every pair of timestamps or every start against every sensor, or forgets that each sensor must be
    represented.
  criteria:
    correctness: All tests pass, including single sensors, identical sensors and ties in window length.
    efficiency: Each reading enters the heap once; O(N log k) time and O(k) extra space.
    code_quality: Heap entries carry the sensor and position clearly; the running maximum is updated in one place.
    edge_cases: Handles one sensor, one reading per sensor, shared timestamps and the earliest-start tie-break.
    communication: Explains why only the sensor holding the minimum should move forward.
hints:
  - Suppose you hold one reading from every sensor. The range they span is [smallest, largest] - which single
    reading could you replace to possibly get a shorter range?
  - Only moving the sensor that currently holds the smallest reading can help; you need a structure that always
    gives you that smallest reading quickly while readings keep changing.
  - Put the first reading of every sensor into a min-heap and remember the largest of them; repeatedly pop the
    minimum, record [minimum, largest] if it is strictly shorter than the best so far, then push that sensor's
    next reading and update the largest. Stop when the popped sensor has no next reading.
followups:
  - How would you solve it with a sliding window over all readings merged into one sorted list?
  - What changes if each window must contain at least two readings from every sensor?
  - How would you handle readings that arrive as live streams instead of complete lists?
common_errors:
  - Continuing after a sensor is exhausted, which produces windows that miss that sensor.
  - Updating the best window on equal length, which returns a later start on ties.
  - Forgetting to update the running maximum when a new reading is pushed.
  - Comparing only adjacent sensors instead of all of them at once.
