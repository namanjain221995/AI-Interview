slug: max_ledger_sum_after_k_sign_flips
title: "Ledger Sign Corrections"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_analyst, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Ledger Sign Corrections

  A bank-feed import sometimes stores ledger entries with the wrong sign. Before the period totals are
  published, a correction step must apply **exactly `k` sign flips**. A flip picks one entry and
  multiplies it by `-1`; the same entry may be flipped more than once (two flips on one entry restore
  its original value).

  Given the signed `entries` (amounts in cents) and `k`, return the **largest possible ledger total**
  (the sum of all entries) after exactly `k` flips.

  - All `k` flips must be used.
  - The order of the entries does not matter for the total.

  ### Example 1
  ```
  Input:  entries = [4, -2, 3], k = 1
  Output: 9
  Explanation: flip -2 to get 4 + 2 + 3 = 9
  ```

  ### Example 2
  ```
  Input:  entries = [3, -1, 0, 2], k = 3
  Output: 6
  Explanation: flip -1, then spend the two remaining flips on the 0 (or twice on any one entry)
  ```

  ### Example 3
  ```
  Input:  entries = [-5, -3, 2, 7], k = 3
  Output: 13
  Explanation: flip -5 and -3; the third flip must land somewhere, and flipping 2 costs the least: 5 + 3 - 2 + 7 = 13
  ```

  ### Constraints
  - `1 <= entries.length <= 10^5`
  - `-10^9 <= entries[i] <= 10^9`
  - `1 <= k <= 10^5`
  - The total can exceed the 32-bit integer range; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_total_after_flips
  params:
    - {name: entries, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def max_total_after_flips(entries: list[int], k: int) -> int:
        heap = list(entries)
        heapq.heapify(heap)
        # Correct the most negative entry first while flips remain.
        while k > 0 and heap[0] < 0:
            smallest = heapq.heappop(heap)
            heapq.heappush(heap, -smallest)
            k -= 1
        total = sum(heap)
        # Pairs of leftover flips cancel; an odd leftover flip hits the smallest value.
        if k % 2 == 1:
            total -= 2 * heap[0]
        return total
  javascript: |
    function maxTotalAfterFlips(entries, k) {
      const values = entries.slice().sort((a, b) => a - b);
      let left = k;
      for (let i = 0; i < values.length && left > 0 && values[i] < 0; i++) {
        values[i] = -values[i];
        left--;
      }
      let total = 0;
      let smallest = Infinity;
      for (const v of values) {
        total += v;
        smallest = Math.min(smallest, v);
      }
      if (left % 2 === 1) total -= 2 * smallest;
      return total;
    }
