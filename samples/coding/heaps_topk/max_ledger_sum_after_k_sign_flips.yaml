expected_concepts:
  - "greedy: flip the most negative entries first"
  - "min-heap or sorting to find the smallest current value"
  - "parity of the leftover flips"
  - "64-bit accumulation of the total"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Explains why flipping the most negative entries first is optimal, handles leftover flips by parity (subtracting twice the smallest absolute value only when an odd number remain), uses a 64-bit total and states the complexity."
  good: "Reaches a correct greedy solution with a heap or sorting, needing a prompt about the leftover-flip parity or the entry that was just corrected."
  weak: "Flips arbitrary or only the first k negatives without handling leftover flips, ignores that all k flips must be used, or simulates every flip with a full rescan."
  criteria:
    correctness: "All tests pass, including odd leftover flips, zeros and k larger than the number of negatives."
    efficiency: "O(n log n) via sorting or O(n + k log n) via a heap; no repeated full scans per flip."
    code_quality: "Clear separation between correcting negatives and resolving the remaining flips."
    edge_cases: "Single entry, zeros, duplicates, all negatives and very large k."
    communication: "Explains the exchange argument for the greedy choice and why leftover flips only matter by parity."
hints:
  - "A flip helps the total most when it turns the most negative entry positive; which entries would you correct first?"
  - "Keep correcting the smallest current value while it is negative; once nothing negative is left, think about what pairs of leftover flips do and what a single leftover flip costs."
  - "Use a min-heap or sort the entries: flip the most negative entries one at a time while flips remain, then if an odd number of flips is left subtract twice the smallest absolute value from the total, otherwise keep the total as it is."
followups:
  - "Can you do it in O(n log n) with a single sort instead of a heap, or in O(n) when k is small?"
  - "What changes if each entry may be flipped at most once?"
  - "How would you report which entries were flipped?"
common_errors:
  - "Ignoring flips left over after every negative entry is corrected."
  - "Subtracting twice the smallest original value instead of the smallest value after the corrections."
  - "Accumulating the total in a 32-bit integer."
  - "Treating k as an upper bound instead of an exact number of flips."
