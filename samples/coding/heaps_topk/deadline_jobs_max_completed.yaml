expected_concepts:
  - processing jobs in order of deadline
  - max-heap of the durations chosen so far
  - exchange argument - replacing the longest chosen job never lowers the count and frees the most time
  - 64-bit running total of durations
  - O(n log n) time
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: Sorts by deadline, keeps the chosen durations in a max-heap and evicts the longest one whenever the
    running total passes the current deadline, justifies it with an exchange argument, uses a 64-bit total and
    states O(n log n).
  good: Reaches the deadline-ordered greedy with the heap after a hint, or gives a correct O(n^2) dynamic
    programme over deadlines, with minor gaps in the justification.
  weak: Sorts by duration or by deadline and greedily accepts jobs that fit without ever replacing one, or
    enumerates subsets.
  criteria:
    correctness: All tests pass, including jobs that can never finish and cases where an early long job must be
      dropped.
    efficiency: One sort plus one heap push and at most one pop per job.
    code_quality: The running total and the heap stay in sync, with clear names for the chosen set.
    edge_cases: Handles no jobs, ties in deadlines, duplicates and totals beyond 32 bits.
    communication: Explains why evicting the longest chosen job keeps the set feasible and the count optimal.
hints:
  - Think about the order in which a chosen set of jobs should run - if any order works, which order always
    works?
  - Walk the jobs by increasing deadline and keep a tentative set; when the set no longer finishes in time,
    one job has to go - which one hurts the future least?
  - Keep the chosen durations in a max-heap and their sum in a 64-bit counter; add each job in deadline
    order, and whenever the sum exceeds the current deadline, remove the largest duration from the heap and
    the sum. The heap size at the end is the answer.
followups:
  - How would you return which jobs to run, in order, rather than only how many?
  - What changes if each job also has a profit and you want to maximise the total profit instead of the count?
  - How would you adapt the approach if two identical machines were available?
common_errors:
  - Accepting a job only if it fits and never reconsidering earlier choices.
  - Evicting the most recent job instead of the longest one.
  - Sorting by duration, which ignores tight deadlines.
  - Accumulating the total in a 32-bit integer.
