title: Most Batch Jobs Before Their Deadlines
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, platform]
time_limit_minutes: 30
prompt_markdown: |
  ## Most Batch Jobs Before Their Deadlines

  A reporting team owns a single machine that runs batch jobs **one at a time**, starting at time `0`.
  Job `i` is `jobs[i] = [duration, deadline]`: once started it runs for `duration` time units without
  interruption, and its report is useful only if the job **finishes at or before** `deadline`.

  The team may run the jobs in any order and may skip any job entirely; a skipped job uses no machine
  time. Return the **maximum number of jobs** that can be finished on time.

  ### Example 1
  ```
  Input:  jobs = [[3, 5], [2, 4], [4, 9], [3, 7]]
  Output: 3
  Explanation: run [2, 4] (finishes at 2), then [3, 5] (finishes at 5), then [4, 9] (finishes at 9).
  All four jobs need 12 time units, which is past every deadline.
  ```

  ### Example 2
  ```
  Input:  jobs = [[5, 5], [1, 6], [1, 6], [1, 6]]
  Output: 3
  Explanation: skipping the 5-unit job lets the three 1-unit jobs finish at 1, 2 and 3.
  ```

  ### Example 3
  ```
  Input:  jobs = [[7, 3], [2, 2]]
  Output: 1
  Explanation: the first job can never finish by time 3; the second finishes at 2.
  ```

  ### Constraints
  - `0 <= jobs.length <= 10^5`
  - `jobs[i].length == 2`
  - `1 <= duration, deadline <= 10^9`
  - Jobs are listed in no particular order. The total running time of several jobs can exceed
    `2^31 - 1`.

  **Follow-up:** trying every subset or every order is exponential. Can you solve it in `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_completed
  params:
    - {name: jobs, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def max_completed(jobs: list[list[int]]) -> int:
        chosen: list[int] = []  # max-heap of chosen durations (stored negated)
        total = 0
        for duration, deadline in sorted(jobs, key=lambda job: job[1]):
            heapq.heappush(chosen, -duration)
            total += duration
            if total > deadline:
                # Drop the longest chosen job: one job fewer, but the most time freed.
                total += heapq.heappop(chosen)
        return len(chosen)
  javascript: |
    function maxCompleted(jobs) {
      const sorted = [...jobs].sort((a, b) => a[1] - b[1]);
      const heap = []; // max-heap of chosen durations
      const push = (v) => {
        heap.push(v);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p] >= heap[i]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l] > heap[m]) m = l;
            if (r < heap.length && heap[r] > heap[m]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      let total = 0;
      for (const [duration, deadline] of sorted) {
        push(duration);
        total += duration;
        if (total > deadline) total -= pop();
      }
      return heap.length;
    }
