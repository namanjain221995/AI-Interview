slug: hire_cheapest_machines_from_both_ends
title: Reclaim Machines from Both Ends
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [cloud, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Reclaim Machines from Both Ends

  A batch job needs `k` more machines, and the only source is a decommission queue. `costs[i]` is the
  cost of reactivating the machine at position `i` of the queue. The queue tool is limited: it can only
  inspect machines near the two ends.

  The job runs `k` rounds. In each round:

  1. The **candidates** are the first `c` remaining machines and the last `c` remaining machines. If
     fewer than `2 * c` machines remain, the two windows overlap and every remaining machine is a
     candidate (a machine is never counted twice).
  2. The candidate with the **lowest cost** is reactivated. If several candidates share the lowest
     cost, the one with the **smallest original index** wins.
  3. That machine leaves the queue; the remaining machines keep their order, so the windows of the next
     round may reach further in.

  Return the **total cost** of the `k` reactivated machines.

  ### Example 1
  ```
  Input:  costs = [6, 2, 9, 4, 4, 8, 3, 7], k = 3, c = 2
  Output: 11
  Explanation: Round 1 sees 6, 2 and 3, 7 and takes 2. Round 2 sees 6, 9 and 3, 7 and takes 3.
  Round 3 sees 6, 9 and 8, 7 and takes 6. Total 2 + 3 + 6 = 11.
  ```

  ### Example 2
  ```
  Input:  costs = [5, 1, 100, 100, 100, 5], k = 2, c = 1
  Output: 6
  Explanation: Round 1 sees the two 5s and takes the one at index 0 (smaller index). Round 2 then sees
  1 and 5 and takes 1. Total 5 + 1 = 6.
  ```

  ### Constraints
  - `1 <= costs.length <= 10^5`
  - `1 <= costs[i] <= 10^9`
  - `1 <= k <= costs.length`
  - `1 <= c <= costs.length`
  - The total can exceed 32-bit range; return a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: total_reactivation_cost
  params:
    - {name: costs, type: "int[]"}
    - {name: k, type: int}
    - {name: c, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def total_reactivation_cost(costs: list[int], k: int, c: int) -> int:
        left, right = 0, len(costs) - 1  # machines strictly between the windows
        front: list[tuple[int, int]] = []  # (cost, index) of the front window
        back: list[tuple[int, int]] = []  # (cost, index) of the back window
        total = 0
        for _ in range(k):
            while len(front) < c and left <= right:
                heapq.heappush(front, (costs[left], left))
                left += 1
            while len(back) < c and left <= right:
                heapq.heappush(back, (costs[right], right))
                right -= 1
            # Back indices are always larger, so on equal cost the front window wins.
            if back and (not front or back[0][0] < front[0][0]):
                total += heapq.heappop(back)[0]
            else:
                total += heapq.heappop(front)[0]
        return total
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(item) {
        const a = this.items;
        a.push(item);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function totalReactivationCost(costs, k, c) {
      const byCostThenIndex = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);
      const front = new MinHeap(byCostThenIndex);
      const back = new MinHeap(byCostThenIndex);
      let left = 0;
      let right = costs.length - 1;
      let total = 0;
      for (let round = 0; round < k; round++) {
        while (front.size < c && left <= right) {
          front.push([costs[left], left]);
          left++;
        }
        while (back.size < c && left <= right) {
          back.push([costs[right], right]);
          right--;
        }
        if (back.size > 0 && (front.size === 0 || back.peek()[0] < front.peek()[0])) {
          total += back.pop()[0];
        } else {
          total += front.pop()[0];
        }
      }
      return total;
    }
