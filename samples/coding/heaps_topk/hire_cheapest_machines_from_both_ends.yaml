expected_concepts:
  - two min-heaps, one per window, keyed by (cost, index)
  - two pointers marking the unseen middle of the queue
  - refilling only the window that lost a machine
  - tie-breaking by original index and 64-bit totals
optimal_complexity: {time: "O((k + c) log c)", space: O(c)}
rubric:
  excellent: Uses two heaps for the front and back windows plus two pointers for the untouched middle, refills only the window that lost a machine, handles the overlap when fewer than 2c machines remain, applies the index tie-break correctly and states O((k + c) log c).
  good: Correct heap-based solution with a hint about the overlap or the tie-break, or a single heap with side tags that is slightly harder to follow.
  weak: Rescans both windows each round in O(k * c) or rebuilds the list after each removal, or double-counts machines when the windows overlap.
  criteria:
    correctness: All tests pass, including ties between the ends, overlapping windows and k = n.
    efficiency: Each machine enters a heap at most once; no linear rescans per round.
    code_quality: Clear names for the two windows and the middle pointers; the tie rule is visible in the comparison.
    edge_cases: Single machine, c larger than the queue, c = 1, equal costs and totals beyond 32 bits.
    communication: Explains why a machine never moves between windows and why the front wins ties.
hints:
  - Simulating each round by scanning both windows works but repeats a lot of work. What changes between one round and the next?
  - Only one machine leaves per round, and only its window needs a new machine from the untouched middle. Keep each window in a structure that gives you its cheapest machine quickly.
  - Keep a min-heap of (cost, index) for the front window and one for the back window, plus left and right pointers into the untouched middle. Each round refill both heaps up to c while left <= right, take the cheaper heap top (the front wins on equal cost) and add its cost to a 64-bit total.
followups:
  - How would you return the indices of the reactivated machines in order?
  - What if costs could change while the rounds are running?
  - How does the solution change if the two windows have different sizes?
common_errors:
  - Adding a machine to both heaps when the windows overlap, so it can be taken twice.
  - Breaking ties toward the back window, which removes the wrong machine and changes later windows.
  - Refilling from the wrong end after a removal.
  - Summing the costs in a 32-bit integer.
