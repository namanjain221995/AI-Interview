version: 1
slug: extra_reviewers_max_pass_ratio
title: Assign Extra Reviewers
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [tech_lead, qa, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Assign Extra Reviewers

  Before a release, every team reports its review results as `[passed, total]`: `total` changes went
  through review and `passed` of them were approved. The release dashboard shows the **readiness
  score**, the plain average of `passed / total` over all teams (every team weighs the same, whatever
  its size).

  You can still assign `extra` senior reviewers. Each one pairs with a single team on one more change
  that is **guaranteed to pass**, which adds 1 to both `passed` and `total` of that team. A team may
  receive any number of the extra reviewers (including none), and every reviewer must be assigned.

  Return the **highest readiness score** you can reach. Answers within `10^-6` of the exact value are
  accepted.

  ### Example 1
  ```
  Input:  teams = [[1, 2], [3, 5], [2, 2]], extra = 2
  Output: 0.7833333333333333
  Explanation: give both reviewers to the first team: [3, 4], [3, 5], [2, 2]
  -> (0.75 + 0.6 + 1.0) / 3 = 0.78333...
  ```

  ### Example 2
  ```
  Input:  teams = [[4, 4], [0, 3]], extra = 3
  Output: 0.75
  Explanation: the first team is already at 1.0; the second becomes [3, 6] -> (1.0 + 0.5) / 2
  ```

  ### Constraints
  - `1 <= teams.length <= 10^5`
  - `teams[i].length == 2`
  - `1 <= total <= 10^5` and `0 <= passed <= total`
  - `0 <= extra <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_average_ratio
  params:
    - {name: teams, type: "int[][]"}
    - {name: extra, type: int}
  return_type: float
  comparison: float_tolerance
reference_solutions:
  python: |
    import heapq


    def max_average_ratio(teams: list[list[int]], extra: int) -> float:
        def gain(passed: int, total: int) -> float:
            # Increase of passed / total when one guaranteed pass is added.
            return (total - passed) / (total * (total + 1))

        heap = [(-gain(p, t), p, t) for p, t in teams]
        heapq.heapify(heap)
        for _ in range(extra):
            _, p, t = heapq.heappop(heap)
            heapq.heappush(heap, (-gain(p + 1, t + 1), p + 1, t + 1))
        return sum(p / t for _, p, t in heap) / len(teams)
  javascript: |
    function maxAverageRatio(teams, extra) {
      const gain = (p, t) => (t - p) / (t * (t + 1));
      // Max-heap on gain; entries are [gain, passed, total].
      const h = teams.map(([p, t]) => [gain(p, t), p, t]);
      const less = (a, b) => a[0] > b[0];
      const down = (i) => {
        for (;;) {
          const l = 2 * i + 1, r = l + 1;
          let m = i;
          if (l < h.length && less(h[l], h[m])) m = l;
          if (r < h.length && less(h[r], h[m])) m = r;
          if (m === i) return;
          [h[i], h[m]] = [h[m], h[i]];
          i = m;
        }
      };
      for (let i = (h.length >> 1) - 1; i >= 0; i--) down(i);
      for (let k = 0; k < extra; k++) {
        const p = h[0][1] + 1, t = h[0][2] + 1;
        h[0] = [gain(p, t), p, t];
        down(0);
      }
      let sum = 0;
      for (const [, p, t] of h) sum += p / t;
      return sum / teams.length;
    }
