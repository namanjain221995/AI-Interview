expected_concepts:
  - greedy choice by marginal gain
  - max-heap keyed on the improvement of one more pass
  - diminishing returns of adding to the same team
  - floating-point accumulation and tolerance
optimal_complexity: {time: O((n + extra) log n), space: O(n)}
rubric:
  excellent: Derives the marginal gain (total - passed) / (total * (total + 1)), argues that gains shrink for a team as it receives more reviewers so the greedy choice is optimal, implements it with a max-heap in O((n + extra) log n) and handles extra = 0 and perfect teams.
  good: Implements the heap-based greedy correctly after a hint about marginal gain, with a loose justification.
  weak: Gives reviewers to the team with the lowest ratio or the smallest total, or rescans every team for every reviewer without discussing the cost.
  criteria:
    correctness: All tests pass within tolerance, including extra = 0, already perfect teams and many reviewers on one team.
    efficiency: One heap operation per reviewer; no O(n) scan per reviewer.
    code_quality: A named helper for the gain and no integer-division bugs.
    edge_cases: Teams with passed = total (zero gain), a single team, and ties between equal gains.
    communication: Explains why the lowest ratio is not always the best target and why the greedy choice is safe.
hints:
  - Think about how much the average improves if one reviewer goes to a particular team, and whether that improvement changes after the team receives more reviewers.
  - The improvement for a team is (passed + 1) / (total + 1) - passed / total; it shrinks each time the same team gets another reviewer, so a greedy choice of the largest improvement works.
  - Put every team in a max-heap keyed by that improvement; for each reviewer pop the best team, add 1 to both of its numbers, push it back with its new improvement, and finally average passed / total over all teams.
followups:
  - Why does the greedy choice give an optimal answer here? Sketch an exchange argument.
  - How would you handle extra up to 10^12 efficiently?
  - What changes if teams were weighted by their total number of changes instead of equally?
common_errors:
  - Choosing the team with the lowest pass ratio instead of the largest marginal gain.
  - Using integer division when computing ratios or gains.
  - Rescanning every team for every reviewer, which is O(n * extra).
  - Forgetting to recompute the gain after a team receives a reviewer.
