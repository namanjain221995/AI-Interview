expected_concepts:
  - "max-heap with lazy deletion of expired samples (or a monotonic deque)"
  - "half-open time window (t - w, t] driven by timestamps instead of a fixed count"
  - "amortised analysis: each sample is pushed and removed at most once"
  - "O(n log n) with a heap or O(n) with a deque"
optimal_complexity: {time: "O(n) with a monotonic deque, O(n log n) with a heap", space: "O(n)"}
rubric:
  excellent: "Uses a max-heap with lazy expiry or a monotonic deque, gets the half-open boundary right, explains the amortised bound, and compares the O(n log n) heap with the O(n) deque."
  good: "Correct heap or deque solution with a small fix after testing (for example the boundary at exactly w seconds)."
  weak: "Rescans the window for every sample in O(n^2), assumes a fixed number of samples per window, or includes samples exactly w seconds old."
  criteria:
    correctness: "All tests pass, including gaps larger than w and samples exactly w seconds apart."
    efficiency: "Each sample enters and leaves the structure once; O(n log n) or O(n) overall."
    code_quality: "Clear separation of insert, expire and read steps; meaningful names."
    edge_cases: "Empty input, one sample, huge w, equal values and decreasing runs."
    communication: "Explains why an expired element can safely stay in the heap until it reaches the top."
hints:
  - "The window is defined by time, not by a fixed number of samples. As you move to the next sample, which samples can leave the window, and do you need them removed immediately?"
  - "A max-heap gives the peak quickly. Expired samples only matter when they would be reported as the peak, so you can remove them only when they reach the top of the heap."
  - "Push (cpu, timestamp) for each sample into a max-heap, then pop from the top while its timestamp is at most t - w; the top is the answer. Alternatively keep a deque of indices with decreasing cpu, dropping smaller values from the back and expired ones from the front."
followups:
  - "How would you report the minimum and the maximum at the same time?"
  - "How would you compute the median over the same time window?"
  - "If samples could arrive slightly out of order, what would you change?"
common_errors:
  - "Treating w as a number of samples instead of a time span."
  - "Using a non-strict lower bound (timestamp >= t - w), so a sample exactly w seconds old still counts."
  - "Removing arbitrary elements from a heap by searching it, which is O(n) per removal."
  - "Keeping equal values in the deque in the wrong order, or popping expired entries only once per step."
