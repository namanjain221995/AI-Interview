version: 1
slug: sliding_window_peak_cpu
title: "Rolling Peak CPU over Irregular Samples"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [sre, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Rolling Peak CPU over Irregular Samples

  A metrics agent reports CPU usage (in millicores) for a host, but not at a fixed rate: under load it
  skips beats, so the gaps between samples vary. Each sample is `samples[i] = [timestamp, cpu]`, with
  timestamps in seconds and **strictly increasing** along the list.

  The dashboard shows a "peak over the last `w` seconds" line. For every sample `i` with timestamp `t`,
  its value is the largest `cpu` among the samples whose timestamp lies in the half-open interval
  `(t - w, t]`, that is, samples taken **less than** `w` seconds before `t`, plus sample `i` itself.
  A sample exactly `w` seconds older than `t` no longer counts.

  Return one value per sample, in the same order as `samples`. For an empty input, return an empty
  list.

  Rescanning the window for every sample can cost `O(n^2)` when `w` is large; aim for `O(n log n)` or
  better.

  ### Example 1
  ```
  Input:  samples = [[1, 40], [2, 55], [4, 30], [7, 20], [8, 65], [9, 10]], w = 3
  Output: [40, 55, 55, 20, 65, 65]
  Explanation: at t = 4 the window (1, 4] holds the samples at 2 and 4, so the peak is 55; at t = 7 the window (4, 7] holds only the sample at 7
  ```

  ### Example 2
  ```
  Input:  samples = [[10, 500], [20, 800], [30, 300]], w = 1
  Output: [500, 800, 300]
  Explanation: with w = 1 every window contains only the sample itself
  ```

  ### Constraints
  - `0 <= samples.length <= 10^5`
  - `samples[i].length == 2`
  - `0 <= timestamp <= 10^9`, strictly increasing along `samples`
  - `0 <= cpu <= 10^6`
  - `1 <= w <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rolling_peaks
  params:
    - {name: samples, type: "int[][]"}
    - {name: w, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def rolling_peaks(samples: list[list[int]], w: int) -> list[int]:
        # Max-heap of (-cpu, timestamp); expired entries are discarded lazily when they reach the top.
        heap: list[tuple[int, int]] = []
        peaks: list[int] = []
        for t, cpu in samples:
            heapq.heappush(heap, (-cpu, t))
            while heap[0][1] <= t - w:
                heapq.heappop(heap)
            peaks.append(-heap[0][0])
        return peaks
  javascript: |
    function rollingPeaks(samples, w) {
      // Monotonic deque of sample indices whose cpu values are strictly decreasing.
      const dq = [];
      let head = 0;
      const peaks = [];
      for (let i = 0; i < samples.length; i++) {
        const [t, cpu] = samples[i];
        while (dq.length > head && samples[dq[dq.length - 1]][1] <= cpu) dq.pop();
        dq.push(i);
        while (samples[dq[head]][0] <= t - w) head++;
        peaks.push(samples[dq[head]][1]);
      }
      return peaks;
    }
