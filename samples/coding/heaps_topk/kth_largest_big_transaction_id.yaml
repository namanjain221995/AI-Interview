title: "Kth Largest Oversized Transaction ID"
difficulty: easy
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [backend, data, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Kth Largest Oversized Transaction ID

  A payments platform hands out transaction IDs as **decimal strings**. IDs grew past what a 64-bit
  integer can hold a long time ago, so they must be handled as text: an ID can be up to 100 digits long.
  Every ID consists of digits only and has **no leading zeros** (the only ID that starts with `0` is
  `"0"` itself).

  For a reconciliation report you need the **`k`-th largest** ID in a batch, comparing IDs by their
  numeric value. The batch can contain the same ID more than once (a retried write); every copy counts
  as its own entry, so in `["7", "7", "3"]` both the 1st and the 2nd largest are `"7"`.

  Write `kth_largest_id(ids, k)` that returns the `k`-th largest ID, as a string written exactly as it
  appears in the input.

  Plain string comparison is not enough (as text, `"950"` compares greater than `"1200"`), and converting to a
  built-in integer type overflows in most languages.

  ### Example 1
  ```
  Input:  ids = ["950", "1200", "87", "4410"], k = 2
  Output: "1200"
  Explanation: by value the order is 4410 > 1200 > 950 > 87; as plain text "950" would wrongly rank first
  ```

  ### Example 2
  ```
  Input:  ids = ["18446744073709551617", "9", "18446744073709551616", "18446744073709551617"], k = 2
  Output: "18446744073709551617"
  Explanation: the two copies of the largest ID are the 1st and 2nd largest entries
  ```

  ### Example 3
  ```
  Input:  ids = ["305", "41", "305", "1999"], k = 4
  Output: "41"
  ```

  ### Constraints
  - `1 <= ids.length <= 10^4`
  - `1 <= ids[i].length <= 100`
  - `ids[i]` contains only the digits `0`-`9` and has no leading zeros unless it is exactly `"0"`
  - `1 <= k <= ids.length`

  **Follow-up:** can you do it in `O(n log k)` comparisons using only `O(k)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: kth_largest_id
  params:
    - {name: ids, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def kth_largest_id(ids: list[str], k: int) -> str:
        # Without leading zeros, a longer ID is always larger; equal lengths compare as text.
        heap: list[tuple[int, str]] = []
        for tx in ids:
            heapq.heappush(heap, (len(tx), tx))
            if len(heap) > k:
                heapq.heappop(heap)
        return heap[0][1]
  javascript: |
    function kthLargestId(ids, k) {
      // Without leading zeros, a longer ID is always larger; equal lengths compare as text.
      const compare = (a, b) => {
        if (a.length !== b.length) return a.length - b.length;
        return a < b ? -1 : a > b ? 1 : 0;
      };
      const sorted = [...ids].sort((a, b) => compare(b, a));
      return sorted[k - 1];
    }
