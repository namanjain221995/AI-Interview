expected_concepts:
  - "numeric comparison of digit strings by length then lexicographically"
  - "min-heap of size k holding the k largest seen so far"
  - "duplicates count as separate entries"
  - "avoiding integer overflow by never parsing the IDs"
optimal_complexity: {time: "O(n log k * L) where L is the ID length", space: "O(k)"}
rubric:
  excellent: "Defines a correct length-then-text comparator, keeps a size-k min-heap (or explains quickselect), counts duplicates, and states O(n log k) comparisons with O(k) memory."
  good: "Sorts with a correct numeric comparator in O(n log n) and returns the k-th entry; handles duplicates."
  weak: "Compares IDs as plain strings, parses them into 64-bit integers, or removes duplicates."
  criteria:
    correctness: "All tests pass, including IDs longer than 64 bits, duplicates and k equal to the batch size."
    efficiency: "O(n log k) comparisons with a bounded heap; a full sort is acceptable but noted as O(n log n)."
    code_quality: "The comparison rule lives in one small, well-named helper; the input list is not mutated unexpectedly."
    edge_cases: "Single ID, the ID \"0\", all identical IDs and equal-length IDs differing only in late digits."
    communication: "Explains why no leading zeros makes length a valid first comparison key."
hints:
  - "Two decimal strings without leading zeros can be compared without converting them: which property of the strings tells you the bigger number most of the time?"
  - "Compare by length first and only fall back to a character-by-character comparison when the lengths are equal. Then think about which structure keeps just the k largest values seen so far."
  - "Keep a min-heap ordered by (length, text) and push every ID; whenever the heap holds more than k entries pop the smallest. After the scan the heap's minimum is the k-th largest ID."
followups:
  - "How would the comparison change if IDs could have leading zeros or a minus sign?"
  - "What is the expected running time of quickselect here, and when would you prefer it over the heap?"
  - "How would you answer the same query over a stream of IDs too large to keep in memory?"
common_errors:
  - "Comparing the IDs as plain strings, which ranks \"950\" above \"1200\"."
  - "Parsing IDs into 64-bit integers or floating point numbers, which overflows or loses precision."
  - "Deduplicating the IDs, so repeated entries are not counted separately."
  - "Using a max-heap of all n IDs and popping k times without noting the O(n) memory cost."
