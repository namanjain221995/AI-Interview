expected_concepts:
  - "size-k min-heap for top-k selection"
  - "composite ordering key for tie-breaking"
  - "restoring original order by index"
  - "O(n log k) versus sorting everything"
optimal_complexity: {time: "O(n log k)", space: "O(k)"}
rubric:
  excellent: "Keeps a size-k min-heap keyed by score and arrival index so the weakest and latest alert is evicted first, sorts the kept indices to restore arrival order, handles k = 0 and states O(n log k)."
  good: "Sorts indices by score descending and index ascending, takes the first k and re-sorts by index; correct but O(n log n), with the heap version discussed when prompted."
  weak: "Returns scores sorted by value, ignores the tie rule, or loses track of positions by working with values only."
  criteria:
    correctness: "All tests pass, including ties at the cut-off, k = 0 and k equal to the length."
    efficiency: "O(n log k) with a bounded heap, or O(n log n) with a justified sort."
    code_quality: "Explicit, readable tie-breaking key and no repeated scans for the minimum."
    edge_cases: "Empty input, k = 0, all-equal scores and negative scores."
    communication: "Explains how the tie rule is encoded in the heap ordering."
hints:
  - "You need to remember where each chosen alert came from, not just its score, so you can list the chosen alerts by arrival at the end."
  - "Keep only the k best alerts seen so far; the one you would evict next is the lowest score and, among equal scores, the one that arrived last."
  - "Maintain a min-heap of pairs of score and negated index, pushing each alert and popping whenever the heap grows past k; then sort the surviving indices ascending and return the scores at those indices."
followups:
  - "How would you keep this digest up to date as alerts stream in?"
  - "Could quickselect beat the heap here, and what about stability of ties?"
  - "What changes if later alerts should win ties instead?"
common_errors:
  - "Returning the chosen scores in descending score order instead of arrival order."
  - "Breaking ties in favour of later alerts."
  - "Popping from the heap before pushing when k is 0, which reads an empty heap."
  - "Selecting by value and then looking up indices with a search that maps duplicates to the same position."
