version: 1
slug: k_largest_in_original_order
title: "Top Alerts in Arrival Order"
difficulty: easy
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [sre, backend, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Top Alerts in Arrival Order

  An on-call digest shows only the `k` most severe alerts of the last hour, but lists them in the order
  they **arrived** so responders can follow the timeline. Each alert has an anomaly score (higher is
  more severe; scores can be negative).

  Given `scores` in arrival order and `k`, choose the `k` alerts with the highest scores. When several
  alerts share the score at the cut-off, choose the ones that **arrived earlier**. Return the chosen
  alerts' scores in their original arrival order.

  - `k = 0` returns an empty list; `k` equal to the number of alerts returns every score unchanged.

  ### Example 1
  ```
  Input:  scores = [3, 9, 1, 7, 9, 2], k = 3
  Output: [9, 7, 9]
  Explanation: the chosen alerts are 9 (index 1), 7 (index 3) and 9 (index 4), listed by index
  ```

  ### Example 2
  ```
  Input:  scores = [5, 3, 5, 3], k = 3
  Output: [5, 3, 5]
  Explanation: the 3 at index 1 beats the 3 at index 3 because it arrived earlier
  ```

  ### Example 3
  ```
  Input:  scores = [-2, -8, -5], k = 2
  Output: [-2, -5]
  ```

  ### Constraints
  - `0 <= scores.length <= 10^5`
  - `0 <= k <= scores.length`
  - `-10^9 <= scores[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: top_alerts_in_order
  params:
    - {name: scores, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def top_alerts_in_order(scores: list[int], k: int) -> list[int]:
        # Min-heap of (score, -index): the root is the weakest kept alert,
        # i.e. the lowest score and, among equal scores, the latest arrival.
        kept: list[tuple[int, int]] = []
        for index, score in enumerate(scores):
            heapq.heappush(kept, (score, -index))
            if len(kept) > k:
                heapq.heappop(kept)
        indices = sorted(-neg for _, neg in kept)
        return [scores[i] for i in indices]
  javascript: |
    function topAlertsInOrder(scores, k) {
      const order = scores.map((_, i) => i);
      order.sort((a, b) => (scores[b] - scores[a]) || (a - b));
      const chosen = order.slice(0, k).sort((a, b) => a - b);
      return chosen.map((i) => scores[i]);
    }
