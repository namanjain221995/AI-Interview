slug: metric_corrections_min_max
title: Metric Store with Corrections
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [sre, data, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Metric Store with Corrections

  A time-series store keeps **one value per timestamp** for a single gauge (for example queue depth).
  Agents send records `[timestamp, value]`, but the network delivers them **out of order**, and an agent
  that notices a bad reading re-sends the same timestamp with a fixed value. So when a record arrives:

  - if its timestamp is new, the store adds it;
  - if the timestamp is already stored, the new value **replaces** the stored one (it is a correction,
    even when the value happens to be the same).

  After applying each record, the dashboard shows the **highest** and the **lowest** value currently
  stored (across all distinct timestamps, using each timestamp's latest value).

  Given `records` in arrival order, return a list with one pair `[max, min]` per record, in the same
  order.

  ### Example 1
  ```
  Input:  records = [[5, 40], [2, 10], [9, 70], [9, 15], [2, 50]]
  Output: [[40, 40], [40, 10], [70, 10], [40, 10], [50, 15]]
  Explanation: after the fourth record timestamp 9 holds 15, so 70 is gone and the stored values are
  {40, 10, 15}; after the fifth, timestamp 2 holds 50 and the values are {40, 50, 15}.
  ```

  ### Example 2
  ```
  Input:  records = [[1, -3], [1, -3], [1, 8]]
  Output: [[-3, -3], [-3, -3], [8, 8]]
  Explanation: every record targets timestamp 1, so only one value is ever stored.
  ```

  ### Constraints
  - `1 <= records.length <= 10^5`
  - `records[i].length == 2`
  - `0 <= timestamp <= 10^9`
  - `-10^9 <= value <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_max_after_each
  params:
    - {name: records, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def min_max_after_each(records: list[list[int]]) -> list[list[int]]:
        latest: dict[int, int] = {}
        high: list[tuple[int, int]] = []  # (-value, timestamp): max-heap
        low: list[tuple[int, int]] = []  # (value, timestamp): min-heap
        result: list[list[int]] = []
        for timestamp, value in records:
            latest[timestamp] = value
            heapq.heappush(high, (-value, timestamp))
            heapq.heappush(low, (value, timestamp))
            # Lazy deletion: an entry is stale when its timestamp now holds another value.
            while latest[high[0][1]] != -high[0][0]:
                heapq.heappop(high)
            while latest[low[0][1]] != low[0][0]:
                heapq.heappop(low)
            result.append([-high[0][0], low[0][0]])
        return result
  javascript: |
    class Heap {
      constructor(less) { this.items = []; this.less = less; }
      get size() { return this.items.length; }
      peek() { return this.items[0]; }
      push(item) {
        const h = this.items;
        h.push(item);
        let i = h.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(h[i], h[p])) break;
          [h[i], h[p]] = [h[p], h[i]];
          i = p;
        }
      }
      pop() {
        const h = this.items;
        const top = h[0];
        const last = h.pop();
        if (h.length > 0) {
          h[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1, r = l + 1;
            let m = i;
            if (l < h.length && this.less(h[l], h[m])) m = l;
            if (r < h.length && this.less(h[r], h[m])) m = r;
            if (m === i) break;
            [h[i], h[m]] = [h[m], h[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function minMaxAfterEach(records) {
      const latest = new Map();
      const high = new Heap((a, b) => a[0] > b[0]);
      const low = new Heap((a, b) => a[0] < b[0]);
      const result = [];
      for (const [timestamp, value] of records) {
        latest.set(timestamp, value);
        high.push([value, timestamp]);
        low.push([value, timestamp]);
        while (latest.get(high.peek()[1]) !== high.peek()[0]) high.pop();
        while (latest.get(low.peek()[1]) !== low.peek()[0]) low.pop();
        result.push([high.peek()[0], low.peek()[0]]);
      }
      return result;
    }
