ption: "300 records over 40 timestamps - frequent corrections with values in +-10^6"}
expected_concepts:
  - max-heap and min-heap over the stored values
  - lazy deletion by checking entries against the latest value per timestamp
  - hash map from timestamp to its current value
  - alternative with an ordered multiset or sorted map of value counts
  - duplicate values held by different timestamps
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Keeps a map of the latest value per timestamp plus a max-heap and a min-heap, discards stale heap tops lazily (or uses an ordered multiset with counts), explains why duplicates across timestamps are safe and why the total work is O(n log n).
  good: Correct solution with heaps or a sorted structure after a hint about stale entries or duplicate values.
  weak: Recomputes the maximum and minimum by scanning every stored value after each record, or deletes a value from a plain set and loses a duplicate held by another timestamp.
  criteria:
    correctness: All tests pass, including corrections to the same value, duplicate values across timestamps and negative values.
    efficiency: O(log n) amortised per record; no full scan of the stored values per record.
    code_quality: Clear separation between updating the store and reading the extremes; a small helper or loop for discarding stale tops.
    edge_cases: Repeated corrections of one timestamp, equal values on different timestamps and extreme values.
    communication: Explains when a heap entry becomes stale and why each entry is popped at most once.
hints:
  - Keep the latest value of every timestamp in a map; the hard part is answering the maximum and minimum quickly after a value is replaced.
  - Heaps cannot delete arbitrary entries cheaply, but you do not need to delete immediately - an outdated entry can be recognised when it reaches the top.
  - Push (value, timestamp) into a max-heap and a min-heap on every record; before reading a top, pop entries whose value no longer equals the map's value for that timestamp. Each entry is pushed and popped once, so the total is O(n log n).
followups:
  - How would you support deleting a timestamp entirely?
  - How would you also report the median after each record?
  - How would an ordered map of value to count compare with lazy deletion in memory use when corrections are rare or frequent?
  - What changes if only the last W timestamps (by time, not arrival) should be considered?
common_errors:
  - Removing the old value from a plain set, which also drops the same value stored for another timestamp.
  - Keeping stale heap entries and reporting a value that was already corrected away.
  - Scanning all stored values after every record, which is O(n^2) overall.
  - Treating a correction as an extra value instead of a replacement.
