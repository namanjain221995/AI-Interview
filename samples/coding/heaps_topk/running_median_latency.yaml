expected_concepts:
  - two heaps - a max-heap for the lower half and a min-heap for the upper half
  - rebalancing so the halves differ in size by at most one
  - reading the median from the heap tops in O(1)
  - avoiding integer overflow when averaging two large values
optimal_complexity: {time: "O(n log n) total, O(log n) per arrival", space: O(n)}
rubric:
  excellent: Designs the two-heap structure unprompted, states and maintains the size invariant, reads the median from the tops, avoids overflow when averaging, and explains O(log n) per arrival versus re-sorting.
  good: Correct two-heap solution after a hint, or an insertion into a sorted list (O(n) per arrival) with a clear explanation of why heaps are better.
  weak: Re-sorts the whole prefix after every arrival, returns integer medians, or breaks the balance invariant on duplicates.
  criteria:
    correctness: All tests pass, including even counts, duplicates and values near 10^9.
    efficiency: O(log n) per arrival with two heaps.
    code_quality: The invariant between the two heaps is stated in a comment or obvious from names.
    edge_cases: Single value, all equal, monotonic streams and averaging large values.
    communication: Explains which heap a new value goes to and how rebalancing works.
hints:
  - The median only depends on the values around the middle of the sorted order. Could you split what you have seen so far into a lower half and an upper half?
  - Keep the lower half in a structure that gives its largest value quickly and the upper half in one that gives its smallest value quickly, and keep their sizes within one of each other.
  - Use a max-heap for the lower half and a min-heap for the upper half. Push each value into the correct heap, move one top across if the sizes differ by more than one (lower may hold one extra), then the median is the lower top or the mean of both tops.
followups:
  - How would you support removing old latencies so the median covers only the last N arrivals?
  - If latencies are integers in a small range (say 0-5000 ms), what simpler structure works?
  - How would you report the 99th percentile instead of the median?
common_errors:
  - Averaging two values near 10^9 in 32-bit integer arithmetic.
  - Letting the heaps drift apart in size, so the tops are no longer the middle values.
  - Using integer division for the even-count median.
  - Sorting the whole prefix on every arrival.
