slug: running_median_latency
title: Running Median Latency
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [sre, backend, data]
time_limit_minutes: 22
prompt_markdown: |
  ## Running Median Latency

  An API gateway reports request latencies (in microseconds) to a live dashboard one at a time, in
  arrival order. After **every** arrival, the dashboard shows the **median of all latencies received so
  far**:

  - when the count is odd, the median is the middle value in sorted order;
  - when the count is even, it is the **mean of the two middle values** (it may be fractional).

  Given the latencies in arrival order, return a list of the same length where element `i` is the
  median after the first `i + 1` arrivals. Answers within `1e-6` (relative to the size of the value)
  are accepted.

  The stream can be long, so re-sorting everything after each arrival is too slow; aim for
  `O(log n)` work per arrival.

  ### Example 1
  ```
  Input:  latencies = [120, 80, 95, 300]
  Output: [120.0, 100.0, 95.0, 107.5]
  Explanation: After two arrivals the sorted values are 80, 120 (median 100). After four they are
  80, 95, 120, 300, so the median is (95 + 120) / 2 = 107.5.
  ```

  ### Example 2
  ```
  Input:  latencies = [40, 10, 70, 20, 30]
  Output: [40.0, 25.0, 40.0, 30.0, 30.0]
  ```

  ### Constraints
  - `1 <= latencies.length <= 10^5`
  - `0 <= latencies[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: running_medians
  params:
    - {name: latencies, type: "int[]"}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    import heapq


    def running_medians(latencies: list[int]) -> list[float]:
        low: list[int] = []  # max-heap (negated) holding the smaller half
        high: list[int] = []  # min-heap holding the larger half
        medians: list[float] = []
        for value in latencies:
            if low and value > -low[0]:
                heapq.heappush(high, value)
            else:
                heapq.heappush(low, -value)
            # Keep len(low) == len(high) or len(low) == len(high) + 1.
            if len(low) > len(high) + 1:
                heapq.heappush(high, -heapq.heappop(low))
            elif len(high) > len(low):
                heapq.heappush(low, -heapq.heappop(high))
            if len(low) > len(high):
                medians.append(float(-low[0]))
            else:
                medians.append((-low[0] + high[0]) / 2)
        return medians
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(item) {
        const a = this.items;
        a.push(item);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function runningMedians(latencies) {
      const low = new MinHeap((a, b) => a > b); // max-heap for the smaller half
      const high = new MinHeap((a, b) => a < b); // min-heap for the larger half
      const medians = [];
      for (const value of latencies) {
        if (low.size > 0 && value > low.peek()) high.push(value);
        else low.push(value);
        if (low.size > high.size + 1) high.push(low.pop());
        else if (high.size > low.size) low.push(high.pop());
        medians.push(low.size > high.size ? low.peek() : (low.peek() + high.peek()) / 2);
      }
      return medians;
    }
