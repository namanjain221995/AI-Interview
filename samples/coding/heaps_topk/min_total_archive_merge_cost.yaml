version: 1
slug: min_total_archive_merge_cost
title: Cheapest Way to Merge Log Archives
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, devops]
time_limit_minutes: 20
prompt_markdown: |
  ## Cheapest Way to Merge Log Archives

  Every night each service writes its own compressed log archive; `sizes[i]` is the size of archive `i` in
  megabytes. A compaction job must combine all of them into a **single** archive. It can only combine
  **two archives at a time**: combining archives of sizes `a` and `b` reads both, writes a new archive of
  size `a + b`, and costs `a + b` units of I/O. Any two existing archives can be combined, in any order,
  including archives produced by earlier combinations.

  Return the **minimum total cost** to end up with exactly one archive. With zero or one archive nothing
  has to be combined and the cost is `0`.

  ### Example 1
  ```
  Input:  sizes = [4, 3, 6]
  Output: 20
  Explanation: combine 3 and 4 (cost 7), then 7 and 6 (cost 13); total 20
  ```

  ### Example 2
  ```
  Input:  sizes = [2, 2, 2, 2]
  Output: 16
  Explanation: combine 2+2 twice (cost 4 each), then 4+4 (cost 8); total 16
  ```

  ### Example 3
  ```
  Input:  sizes = [10]
  Output: 0
  ```

  ### Constraints
  - `0 <= sizes.length <= 10^4`
  - `1 <= sizes[i] <= 10^9`
  - The answer fits in a signed 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_merge_cost
  params:
    - {name: sizes, type: "long[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def min_merge_cost(sizes: list[int]) -> int:
        heap = list(sizes)
        heapq.heapify(heap)
        total = 0
        while len(heap) > 1:
            merged = heapq.heappop(heap) + heapq.heappop(heap)
            total += merged
            heapq.heappush(heap, merged)
        return total
  javascript: |
    function minMergeCost(sizes) {
      // Two-queue method: originals sorted ascending, merged results are produced in ascending order.
      const originals = [...sizes].sort((a, b) => a - b);
      const merged = [];
      let i = 0;
      let m = 0;
      const takeSmallest = () => {
        if (m >= merged.length || (i < originals.length && originals[i] <= merged[m])) {
          return originals[i++];
        }
        return merged[m++];
      };
      let total = 0;
      while ((originals.length - i) + (merged.length - m) > 1) {
        const combined = takeSmallest() + takeSmallest();
        total += combined;
        merged.push(combined);
      }
      return total;
    }
