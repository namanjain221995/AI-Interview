expected_concepts:
  - "greedy: always combine the two smallest archives"
  - "min-heap (priority queue) of current archive sizes"
  - "exchange argument for why the greedy choice is optimal"
  - "64-bit accumulation of the total cost"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Recognises that every byte is paid once per merge it takes part in, combines the two smallest archives with a min-heap, gives an exchange argument for optimality, handles zero or one archive and uses 64-bit totals."
  good: "Implements the min-heap greedy correctly after exploring examples; the optimality argument is informal."
  weak: "Merges in input order or sorts once and folds left, which fails when merged results become larger than later inputs, or cannot explain why the greedy choice works."
  criteria:
    correctness: "All tests pass, including empty input, a single archive and inputs where merged sizes interleave with originals."
    efficiency: "O(n log n) with a heap (or sort plus two queues); no quadratic re-sorting."
    code_quality: "Heap usage is idiomatic; the loop condition is the number of remaining archives."
    edge_cases: "Zero or one archive, equal sizes, very large sizes and an odd number of archives."
    communication: "Explains the cost model (larger archives should be merged later because they are reread fewer times) before coding."
hints:
  - "Each archive's size is paid again every time the archive it sits in takes part in a merge; which archives would you want to be involved in the fewest merges?"
  - "Merging the two smallest archives available right now is always a safe choice, and the merged result goes back into the pool as a new candidate."
  - "Keep all sizes in a min-heap; while more than one archive remains, pop the two smallest, add their sum to the running cost and push the sum back; the running cost at the end is the answer, and it starts and stays zero for zero or one archive."
followups:
  - "Can you prove that combining the two smallest archives first never loses optimality?"
  - "If the inputs are already sorted, how can you avoid a heap entirely?"
  - "What changes if the job may combine up to three archives at once?"
  - "How would the answer change if only adjacent archives could be combined?"
common_errors:
  - "Sorting once and merging left to right, ignoring that merged archives can outgrow later inputs."
  - "Counting the cost of the final archive size instead of the sum of every merge."
  - "Returning a non-zero cost for a single archive."
  - "Using 32-bit integers for the running cost."
