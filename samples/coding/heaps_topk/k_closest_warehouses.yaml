version: 1
slug: k_closest_warehouses
title: Nearest Warehouses to a Depot
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Nearest Warehouses to a Depot

  A delivery company models its region as a grid with the central depot at `(0, 0)`. `locations[i]` is
  `[x, y]`, the grid position of warehouse `i`. To plan tomorrow's shuttle loop, dispatch needs the `k`
  warehouses that are closest to the depot by straight-line (Euclidean) distance.

  Return the **indices** of those `k` warehouses:

  - ordered by distance to the depot, **nearest first**;
  - warehouses at exactly the same distance are ordered by **smaller index first**.

  Distances can be compared exactly with squared distances `x*x + y*y`; no square roots are needed.

  ### Example 1
  ```
  Input:  locations = [[3, 4], [1, 1], [-2, 2], [0, 5]], k = 2
  Output: [1, 2]
  Explanation: squared distances are 25, 2, 8 and 25
  ```

  ### Example 2
  ```
  Input:  locations = [[2, 0], [0, -2], [1, 1]], k = 2
  Output: [2, 0]
  Explanation: squared distances are 4, 4 and 2; warehouses 0 and 1 tie, so the smaller index wins
  ```

  ### Constraints
  - `1 <= k <= locations.length <= 10^4`
  - `locations[i].length == 2`
  - `-10^4 <= x, y <= 10^4`
  - Several warehouses may share the same position.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: k_closest_warehouses
  params:
    - {name: locations, type: "int[][]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def k_closest_warehouses(locations: list[list[int]], k: int) -> list[int]:
        # Max-heap of the k best (distance, index) pairs seen so far, stored negated.
        heap: list[tuple[int, int]] = []
        for index, (x, y) in enumerate(locations):
            entry = (-(x * x + y * y), -index)
            if len(heap) < k:
                heapq.heappush(heap, entry)
            elif entry > heap[0]:
                heapq.heapreplace(heap, entry)
        best = sorted((-d, -i) for d, i in heap)
        return [index for _, index in best]
  javascript: |
    function kClosestWarehouses(locations, k) {
      const order = locations.map((p, index) => [p[0] * p[0] + p[1] * p[1], index]);
      order.sort((a, b) => (a[0] !== b[0] ? a[0] - b[0] : a[1] - b[1]));
      return order.slice(0, k).map((entry) => entry[1]);
    }
