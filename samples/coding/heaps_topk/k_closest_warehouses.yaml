expected_concepts:
  - "squared Euclidean distance to avoid floating point"
  - "bounded max-heap of size k or a full sort"
  - "composite ordering key (distance, index) for deterministic ties"
  - "returning indices rather than coordinates"
optimal_complexity: {time: "O(n log k)", space: "O(k)"}
rubric:
  excellent: "Uses squared distances, keeps a size-k max-heap keyed by (distance, index) or sorts with that key, returns indices in the required order, and contrasts O(n log k) with O(n log n) and quickselect."
  good: "Correct sort-based solution with the composite key; heap idea discussed when prompted."
  weak: "Uses floating-point square roots with an unstable tie order, returns coordinates instead of indices, or ignores the index tie-break."
  criteria:
    correctness: "All tests pass, including equal distances, duplicate positions and k equal to n."
    efficiency: "O(n log k) with a bounded heap; O(n log n) sorting is acceptable for these limits."
    code_quality: "Distance computed in one helper or expression; the ordering key is explicit."
    edge_cases: "Single warehouse, warehouse at the origin, ties, duplicates and extreme coordinates."
    communication: "Explains why squared distances preserve order and how the heap evicts the worst candidate."
hints:
  - "Comparing distances does not require the distances themselves; what simpler quantity preserves their order without square roots?"
  - "Give every warehouse the key made of its squared distance followed by its index, and you need the k smallest keys in ascending order."
  - "Either sort all warehouses by the pair squared distance then index and take the first k, or keep a max-heap of at most k pairs and replace its top whenever a smaller pair arrives; at the end, order the kept pairs ascending and return just the indices."
followups:
  - "How does quickselect compare with the heap for this task?"
  - "What if warehouses arrive as a stream and the list never fits in memory?"
  - "How would you answer many queries with different depot positions?"
  - "What changes if distance is measured along roads (Manhattan distance)?"
common_errors:
  - "Taking square roots and comparing floats, which can break exact ties."
  - "Returning coordinates instead of indices."
  - "Dropping the index tie-break, so equal distances come out in arbitrary order."
  - "Using a min-heap of all n points when only k need to be kept."
