title: Lowest-Energy Drone Survey Route
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Lowest-Energy Drone Survey Route

  A survey drone flies over a site mapped as a grid of cells. `altitudes[r][c]` is the ground altitude of
  cell `(r, c)` in metres, or `-1` for a **no-fly** cell the drone may never enter. The drone starts over
  the top-left cell `(0, 0)` and must reach the bottom-right cell `(rows - 1, cols - 1)`. In one move it
  flies to the neighbouring cell up, down, left or right, staying inside the grid; it may revisit cells.

  Battery use per move:

  - every move costs `1` energy unit for the flight itself, and
  - climbing costs extra: moving from altitude `a` to a **higher** altitude `b` costs `b - a` more units.
    Moving to an equal or lower altitude costs nothing extra.

  Return the **minimum total energy** needed to reach the goal, `0` if the grid is `1 x 1`, or `-1` if
  the goal cannot be reached at all.

  ### Example 1
  ```
  Input:  altitudes = [[1, 5, 2], [2, 9, 3], [4, 4, 4]]
  Output: 7
  Explanation: Down the left column and along the bottom row the moves cost 2 (1 -> 2), 3 (2 -> 4),
  1 and 1, total 7. Along the top row and down the right column they cost 5 + 1 + 2 + 2 = 10.
  ```

  ### Example 2
  ```
  Input:  altitudes = [[6, -1, 0], [7, -1, 1], [2, 3, 9]]
  Output: 12
  Explanation: The middle column is no-fly, so the drone flies 6 -> 7 -> 2 -> 3 -> 9 at a cost of
  2 + 1 + 2 + 7 = 12.
  ```

  ### Constraints
  - `1 <= rows, cols <= 100` where `rows = altitudes.length` and `cols = altitudes[r].length`
  - `altitudes[r][c] == -1` (no-fly) or `0 <= altitudes[r][c] <= 10^4`
  - The start and goal cells are never no-fly cells.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_route_effort
  params:
    - {name: altitudes, type: "int[][]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def min_route_effort(altitudes: list[list[int]]) -> int:
        rows, cols = len(altitudes), len(altitudes[0])
        goal = (rows - 1, cols - 1)
        best = [[-1] * cols for _ in range(rows)]  # settled minimum energy, -1 = not yet
        heap = [(0, 0, 0)]
        while heap:
            energy, r, c = heapq.heappop(heap)
            if best[r][c] != -1:
                continue
            best[r][c] = energy
            if (r, c) == goal:
                return energy
            for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                if 0 <= nr < rows and 0 <= nc < cols and altitudes[nr][nc] != -1 and best[nr][nc] == -1:
                    climb = max(0, altitudes[nr][nc] - altitudes[r][c])
                    heapq.heappush(heap, (energy + 1 + climb, nr, nc))
        return -1
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(item) {
        const a = this.items;
        a.push(item);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function minRouteEffort(altitudes) {
      const rows = altitudes.length;
      const cols = altitudes[0].length;
      const best = Array.from({ length: rows }, () => new Array(cols).fill(-1));
      const heap = new MinHeap((a, b) => a[0] < b[0]);
      heap.push([0, 0, 0]);
      const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
      while (heap.size > 0) {
        const [energy, r, c] = heap.pop();
        if (best[r][c] !== -1) continue;
        best[r][c] = energy;
        if (r === rows - 1 && c === cols - 1) return energy;
        for (const [dr, dc] of moves) {
          const nr = r + dr;
          const nc = c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          if (altitudes[nr][nc] === -1 || best[nr][nc] !== -1) continue;
          const climb = Math.max(0, altitudes[nr][nc] - altitudes[r][c]);
          heap.push([energy + 1 + climb, nr, nc]);
        }
      }
      return -1;
    }
