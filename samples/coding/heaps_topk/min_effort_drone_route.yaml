expected_concepts:
  - grid as an implicit weighted graph with asymmetric edge costs (climbing versus descending)
  - Dijkstra with a min-heap keyed by accumulated energy
  - skipping no-fly cells and detecting an unreachable goal
  - early exit when the goal is settled
optimal_complexity: {time: "O(R * C * log(R * C))", space: O(R * C)}
rubric:
  excellent: Models cells as nodes with direction-dependent move costs, explains why BFS by move count and a DP that only moves right and down are both wrong, implements Dijkstra with lazy deletion and an early exit, handles no-fly cells and the unreachable case and states O(RC log RC).
  good: Correct Dijkstra after a hint about weighted moves, with small slips in the unreachable or 1 x 1 cases.
  weak: Uses BFS by number of moves, a right/down-only DP, or charges absolute altitude differences in both directions.
  criteria:
    correctness: All tests pass, including routes that must turn back up or left, no-fly walls and the unreachable goal.
    efficiency: Each cell is settled once with heap-based Dijkstra.
    code_quality: The move-cost rule lives in one place; neighbour checks are clear.
    edge_cases: 1 x 1 grid, single row or column, flat grids and maximum altitudes.
    communication: Explains that costs are non-negative, which is what makes Dijkstra correct here.
hints:
  - Treat each cell as a node and each allowed move as an edge. Are all edges equally expensive, and is the cost the same in both directions?
  - Because move costs differ but are never negative, the fewest-moves route is not necessarily the cheapest. Which shortest-path algorithm handles non-negative weights?
  - Run Dijkstra from (0, 0) with a min-heap of (energy, row, col); when you pop a cell for the first time its energy is final, and each neighbour that is inside the grid and not no-fly gets energy + 1 + max(0, its altitude - current altitude). Return the energy when the goal is popped, or -1 if the heap empties first.
followups:
  - How would you return the actual route, not just its energy?
  - What changes if descending also costs energy (for example half of the drop)?
  - If the drone had a fixed battery capacity, how would you check whether a route exists within it?
common_errors:
  - Using BFS by number of moves, which ignores climbing cost.
  - Only allowing right and down moves; cheap routes sometimes go up or left around a ridge or a no-fly wall.
  - Charging |b - a| for descents as well as climbs.
  - Entering no-fly cells or returning a large sentinel instead of -1 when the goal is unreachable.
