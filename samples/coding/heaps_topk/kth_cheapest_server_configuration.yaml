title: Kth Cheapest Server Build
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [cloud, backend, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## Kth Cheapest Server Build

  A hardware quoting tool assembles a server by choosing **exactly one option from each component list**:
  `options[0]` might be the CPU prices, `options[1]` the memory prices, `options[2]` the disk prices, and so
  on. Each list holds prices sorted in **non-decreasing** order. The price of a build is the sum of the prices
  of its chosen options.

  Sales wants a price ladder, so given `k` return the price of the **k-th cheapest build** (1-based). Every
  combination of options is a different build, even when two options have the same price or two builds cost
  the same, so `k` counts builds, not distinct prices.

  ### Example 1
  ```
  Input:  options = [[100, 150, 400], [80, 90], [30, 60]], k = 4
  Output: 250
  Explanation: the cheapest builds cost 210, 220, 240, 250, 260, ... so the fourth costs 250.
  ```

  ### Example 2
  ```
  Input:  options = [[5, 5], [1, 2]], k = 2
  Output: 6
  Explanation: the four builds cost 6, 6, 7 and 7.
  ```

  ### Example 3
  ```
  Input:  options = [[20, 35], [7, 9, 40], [3]], k = 1
  Output: 30
  ```

  ### Constraints
  - `1 <= options.length <= 20`
  - `1 <= options[i].length <= 100`
  - `1 <= options[i][j] <= 10^6`, and each `options[i]` is sorted in non-decreasing order
  - `1 <= k <= 2000`, and `k` is at most the total number of builds

  **Follow-up:** the number of builds can reach `100^20`, so listing them is out of the question. Can you
  answer in roughly `O(m * k * log k)` time for `m` component lists?
