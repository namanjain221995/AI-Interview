expected_concepts:
  - only the k cheapest partial builds can lead to the k cheapest full builds
  - merging component lists one at a time
  - k smallest pair sums of two sorted lists with a min-heap
  - avoiding enumeration of the full cartesian product
  - O(m * k * log k) time
optimal_complexity: {time: "O(m * k * log k)", space: "O(k)"}
rubric:
  excellent: Argues that only the k cheapest partial builds matter, folds the components in one at a time with a
    min-heap that yields the k smallest pair sums of two sorted lists, counts equal prices separately and states
    O(m * k * log k).
  good: Reaches a correct heap-based solution, for example a best-first search over index tuples with a visited
    set, or the pairwise merge with a less tight bound, after a hint.
  weak: Enumerates all builds, keeps only distinct prices, or greedily bumps one component at a time without a
    priority queue.
  criteria:
    correctness: All tests pass, including ties, single-option components and k equal to the number of builds.
    efficiency: Never materialises more than k partial builds per step.
    code_quality: The pair-sum merge is a small, clearly named routine applied once per component.
    edge_cases: Handles one component, repeated prices and k at the boundaries.
    communication: Explains why truncating to k partial builds after each merge cannot lose an answer.
hints:
  - The cheapest build is easy. Think about how the cheapest builds over the first two components relate to the
    cheapest builds over all of them.
  - If a partial build is not among the k cheapest partial builds, no full build that extends it can be among the
    k cheapest full builds - so you can merge one component at a time and keep only k sums.
  - To merge a sorted list of k partial sums with a sorted price list, push (sum[i] + price[0], i, 0) for every i
    into a min-heap; pop the smallest k times, and after popping (i, j) push (sum[i] + price[j + 1], i, j + 1).
    Repeat for every component and return the k-th value.
followups:
  - How would you return the chosen option indices of the k-th cheapest build?
  - How would you answer with k distinct prices instead of counting builds?
  - What if k could be as large as 10^9 - could binary search on the price help?
common_errors:
  - Deduplicating equal prices, which miscounts k.
  - Enumerating the full product of the lists.
  - Increasing only one component at a time greedily, which skips builds that change two components.
  - Using a best-first search over index tuples without a visited set, which yields the same build twice.
