reference_solutions:
  python: |
    import heapq


    def kth_cheapest_build(options: list[list[int]], k: int) -> int:
        # cheapest[i] is the i-th cheapest partial build over the components merged so far (k at most).
        cheapest = options[0][:k]
        for prices in options[1:]:
            heap = [(total + prices[0], i, 0) for i, total in enumerate(cheapest)]
            heapq.heapify(heap)
            merged: list[int] = []
            while heap and len(merged) < k:
                total, i, j = heapq.heappop(heap)
                merged.append(total)
                if j + 1 < len(prices):
                    heapq.heappush(heap, (cheapest[i] + prices[j + 1], i, j + 1))
            cheapest = merged
        return cheapest[k - 1]
  javascript: |
    function kthCheapestBuild(options, k) {
      let cheapest = options[0].slice(0, k);
      for (let c = 1; c < options.length; c++) {
        const prices = options[c];
        const heap = []; // min-heap of [total, i, j]
        const push = (item) => {
          heap.push(item);
          let x = heap.length - 1;
          while (x > 0) {
            const p = (x - 1) >> 1;
            if (heap[p][0] <= heap[x][0]) break;
            [heap[p], heap[x]] = [heap[x], heap[p]];
            x = p;
          }
        };
        const pop = () => {
          const top = heap[0];
          const last = heap.pop();
          if (heap.length > 0) {
            heap[0] = last;
            let x = 0;
            for (;;) {
              const l = 2 * x + 1;
              const r = l + 1;
              let m = x;
              if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
              if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
              if (m === x) break;
              [heap[m], heap[x]] = [heap[x], heap[m]];
              x = m;
            }
          }
          return top;
        };
        cheapest.forEach((total, i) => push([total + prices[0], i, 0]));
        const merged = [];
        while (heap.length > 0 && merged.length < k) {
          const [total, i, j] = pop();
          merged.push(total);
          if (j + 1 < prices.length) push([cheapest[i] + prices[j + 1], i, j + 1]);
        }
        cheapest = merged;
      }
      return cheapest[k - 1];
    }
