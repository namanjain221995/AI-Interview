title: Highest Active Promotion Over Time
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, fullstack, data]
time_limit_minutes: 30
prompt_markdown: |
  ## Highest Active Promotion Over Time

  An online store has a single headline banner. Marketing schedules promotions, where
  `promotions[i] = [start, end, level]` means promotion `i` is active on the **half-open** time range
  `[start, end)` with priority tier `level`.

  At every moment the banner shows the active promotion with the **highest** `level`. If several active
  promotions share that level, the one with the **smallest index** `i` is shown. When no promotion is active
  the banner is empty.

  For the campaign report, return an array `airtime` with one entry per promotion, in input order, where
  `airtime[i]` is the total number of time units during which promotion `i` was on the banner (`0` if it was
  never shown).

  ### Example 1
  ```
  Input:  promotions = [[0, 10, 2], [3, 6, 5], [4, 12, 5]]
  Output: [3, 3, 6]
  Explanation: promotion 0 shows on [0, 3); promotion 1 on [3, 6) (it wins the tie with promotion 2 on
               [4, 6) because its index is smaller); promotion 2 on [6, 12).
  ```

  ### Example 2
  ```
  Input:  promotions = [[5, 8, 1], [1, 3, 4], [2, 9, 1]]
  Output: [3, 2, 3]
  Explanation: promotion 1 shows on [1, 3); promotion 2 on [3, 5) and [8, 9); promotion 0 on [5, 8),
               where it ties with promotion 2 and has the smaller index.
  ```

  ### Constraints
  - `0 <= promotions.length <= 10^5`
  - `promotions[i].length == 3`
  - `0 <= start < end <= 10^9`
  - `1 <= level <= 10^6`
  - Promotions are listed in no particular order and may repeat.

  **Follow-up:** checking every promotion between every pair of boundaries is `O(n^2)`. Can you produce the
  report in `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: headline_airtime
  params:
