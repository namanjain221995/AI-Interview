expected_concepts:
  - sweep over the sorted start and end boundaries
  - priority queue ordered by level, then by index
  - lazy deletion of promotions that have already ended
  - crediting the elapsed time between consecutive boundaries to the current winner
  - half-open intervals at the boundaries
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: Sweeps the sorted boundaries, adds starting promotions to a heap keyed by (level descending, index
    ascending), lazily discards ended ones, credits each gap to the heap top, handles the half-open ends and ties
    exactly and states O(n log n).
  good: Reaches the sweep with a heap or an ordered set, with a small slip in tie-breaking or boundary handling
    that is fixed once pointed out.
  weak: Checks every promotion for every boundary gap, simulates every time unit, or ignores the tie-break by
    index.
  criteria:
    correctness: All tests pass, including ties, duplicates, gaps and fully shadowed promotions.
    efficiency: Each promotion is pushed and popped at most once after an O(n log n) sort.
    code_quality: Heap ordering and lazy removal are expressed once with clear names.
    edge_cases: Handles no promotions, touching intervals, empty gaps and very large times.
    communication: Explains why stale heap entries can be removed lazily and why time between boundaries has a
      single winner.
hints:
  - Between two consecutive start or end times nothing changes, so the banner shows a single promotion for that
    whole stretch - focus on those boundary points.
  - Sweep the boundaries in time order and keep the active promotions in a structure that always gives you the
    highest level (breaking ties by index) quickly; promotions that have ended do not have to be removed right away.
  - Sort promotions by start and collect all distinct boundary times; at each time t push every promotion that
    starts at or before t into a heap ordered by (higher level, lower index), pop entries whose end is at or
    before t, and add the gap to the next boundary to the airtime of the heap top.
followups:
  - How would you also return the ordered list of banner changes for a dashboard?
  - What changes if promotions can be cancelled early while the sweep is running?
  - How would you handle several banners that show the top three promotions at once?
common_errors:
  - Treating the end time as active, which gives promotions one extra unit at each end.
  - Breaking ties by start time or by level only instead of by the smallest index.
  - Reading the heap top before discarding promotions that have already ended.
  - Counting time while the banner is empty.
