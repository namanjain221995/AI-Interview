reference_solutions:
  python: |
    import heapq


    def headline_airtime(promotions: list[list[int]]) -> list[int]:
        airtime = [0] * len(promotions)
        order = sorted(range(len(promotions)), key=lambda i: promotions[i][0])
        times = sorted({t for start, end, _ in promotions for t in (start, end)})
        active: list[tuple[int, int, int]] = []  # (-level, index, end): best level first, then lowest index
        nxt = 0
        for t, t_next in zip(times, times[1:]):
            while nxt < len(order) and promotions[order[nxt]][0] <= t:
                i = order[nxt]
                heapq.heappush(active, (-promotions[i][2], i, promotions[i][1]))
                nxt += 1
            while active and active[0][2] <= t:
                heapq.heappop(active)  # lazily drop promotions that have already ended
            if active:
                airtime[active[0][1]] += t_next - t
        return airtime
  javascript: |
    function headlineAirtime(promotions) {
      const n = promotions.length;
      const airtime = new Array(n).fill(0);
      const order = [...Array(n).keys()].sort((a, b) => promotions[a][0] - promotions[b][0]);
      const times = [...new Set(promotions.flatMap(([start, end]) => [start, end]))].sort((a, b) => a - b);
      // Max-heap entries [level, index, end]: higher level first, then lower index.
      const heap = [];
      const better = (a, b) => a[0] > b[0] || (a[0] === b[0] && a[1] < b[1]);
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!better(heap[i], heap[p])) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && better(heap[l], heap[m])) m = l;
            if (r < heap.length && better(heap[r], heap[m])) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
      };
      let next = 0;
      for (let k = 0; k + 1 < times.length; k++) {
        const t = times[k];
        while (next < n && promotions[order[next]][0] <= t) {
          const i = order[next++];
          push([promotions[i][2], i, promotions[i][1]]);
        }
        while (heap.length > 0 && heap[0][2] <= t) pop();
        if (heap.length > 0) airtime[heap[0][1]] += times[k + 1] - t;
      }
      return airtime;
    }
