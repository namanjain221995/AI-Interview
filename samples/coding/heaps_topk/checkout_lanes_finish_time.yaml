  - "min-heap of lane free times"
  - "event-driven simulation"
  - "tracking the maximum finish time"
  - "64-bit time accumulation"
optimal_complexity: {time: "O(n log m) for m lanes", space: "O(m)"}
rubric:
  excellent: "Simulates with a min-heap of lane free times, explains why the lane index does not change the answer, tracks the maximum finish rather than the last assignment, uses 64-bit times and states O(n log m)."
  good: "Correct simulation, possibly with a linear scan over lanes per customer (O(n * m)), and recognises the heap improvement when prompted."
  weak: "Returns the finish of the last customer served, tries to balance loads optimally instead of simulating the line, or mishandles the empty input."
  criteria:
    correctness: "All tests pass, including more lanes than customers and the long job served last."
    efficiency: "Uses a heap for O(n log m) rather than scanning every lane per customer."
    code_quality: "Readable names for free times and finish times and no special-case clutter for the first customers."
    edge_cases: "Empty line, one lane, many lanes, equal durations and very large durations."
    communication: "Explains the simulation rules and the difference from an optimal scheduling problem."
hints:
  - "For each customer you only need to know the earliest minute any lane becomes free."
  - "Store the minute at which each lane next becomes free in a structure that hands back the smallest value quickly."
  - "Start a min-heap with one zero per lane; for each customer in line order pop the earliest free minute, add the service time, push the new free minute back and keep the largest finish time seen, returning zero when nobody is in line."
followups:
  - "How would you also report which lane each customer used, honouring the lowest-number tie rule?"
  - "What if customers arrive over time instead of all waiting at minute 0?"
  - "If you could reorder the line, what ordering heuristic would reduce the finish time?"
common_errors:
  - "Returning the finish time of the last customer served instead of the latest finish over all lanes."
  - "Scanning every lane for every customer, which is O(n * m)."
  - "Optimising the assignment instead of simulating the fixed line order."
  - "Overflowing a 32-bit accumulator with large service times."
