time_limit_minutes: 15
prompt_markdown: |
  ## Checkout Lanes Finish Time

  A store simulator models opening time: every customer is already standing in **one shared line** at
  minute `0`, and there are `lanes` checkout lanes numbered from `0`. Customers leave the line strictly
  in order. The customer at the front walks to the lane that becomes free **earliest** (on a tie, the
  lane with the lowest number) and occupies it for `service_times[i]` minutes. A lane is free again at
  the exact minute its customer finishes, and the next customer can start there at that same minute.

  Return the minute at which the **last customer to finish** is done. With no customers, return `0`.

  - Customers are never reordered; you are simulating the line, not searching for a better assignment.

  ### Example 1
  ```
  Input:  service_times = [5, 3, 8, 2, 4], lanes = 2
  Output: 11
  Explanation: lane 0 serves 5 (until 5), lane 1 serves 3 (until 3); 8 goes to lane 1 (until 11); 2 goes to lane 0 (until 7); 4 goes to lane 0 (until 11)
  ```

  ### Example 2
  ```
  Input:  service_times = [4, 4, 4], lanes = 5
  Output: 4
  Explanation: every customer gets an idle lane at minute 0
  ```

  ### Example 3
  ```
  Input:  service_times = [], lanes = 3
  Output: 0
  ```

  ### Constraints
  - `0 <= service_times.length <= 10^5`
  - `1 <= service_times[i] <= 10^9`
  - `1 <= lanes <= 10^4`
  - The answer can exceed the 32-bit integer range; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
