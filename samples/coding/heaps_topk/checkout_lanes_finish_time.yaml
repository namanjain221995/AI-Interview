    - {name: lanes, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def checkout_finish_time(service_times: list[int], lanes: int) -> int:
        # Each heap item is the minute a lane becomes free.
        free_at = [0] * min(lanes, max(1, len(service_times)))
        latest = 0
        for duration in service_times:
            start = heapq.heappop(free_at)
            finish = start + duration
            latest = max(latest, finish)
            heapq.heappush(free_at, finish)
        return latest
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(value) {
        const a = this.items;
        a.push(value);
        let i = a.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!this.less(a[i], a[parent])) break;
          [a[i], a[parent]] = [a[parent], a[i]];
          i = parent;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function checkoutFinishTime(serviceTimes, lanes) {
      const freeAt = new MinHeap((a, b) => a < b);
      const used = Math.min(lanes, Math.max(1, serviceTimes.length));
      for (let i = 0; i < used; i++) freeAt.push(0);
      let latest = 0;
      for (const duration of serviceTimes) {
        const finish = freeAt.pop() + duration;
        latest = Math.max(latest, finish);
        freeAt.push(finish);
      }
      return latest;
    }
