reference_solutions:
  python: |
    from collections import defaultdict


    def group_anagrams(strs: list[str]) -> list[list[str]]:
        groups: dict[str, list[str]] = defaultdict(list)
        for word in strs:
            groups["".join(sorted(word))].append(word)
        return list(groups.values())
  javascript: |
    function groupAnagrams(strs) {
      const groups = new Map();
      for (const word of strs) {
        const key = [...word].sort().join("");
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(word);
      }
      return [...groups.values()];
    }
  typescript: |
    function groupAnagrams(strs: string[]): string[][] {
      const groups = new Map<string, string[]>();
      for (const word of strs) {
        const key = [...word].sort().join("");
        const group = groups.get(key);
        if (group) group.push(word);
        else groups.set(key, [word]);
      }
      return [...groups.values()];
    }
  java: |
    import java.util.*;

    class Solution {
        public String[][] groupAnagrams(String[] strs) {
            Map<String, List<String>> groups = new LinkedHashMap<>();
            for (String word : strs) {
                char[] chars = word.toCharArray();
                Arrays.sort(chars);
                groups.computeIfAbsent(new String(chars), key -> new ArrayList<>()).add(word);
            }
            String[][] result = new String[groups.size()][];
            int i = 0;
            for (List<String> group : groups.values()) result[i++] = group.toArray(new String[0]);
            return result;
        }
    }
  go: |
    package main

    import "sort"

    func groupAnagrams(strs []string) [][]string {
    	index := map[string]int{}
    	groups := [][]string{}
    	for _, word := range strs {
    		b := []byte(word)
    		sort.Slice(b, func(i, j int) bool { return b[i] < b[j] })
    		key := string(b)
    		if i, ok := index[key]; ok {
    			groups[i] = append(groups[i], word)
    		} else {
    			index[key] = len(groups)
    			groups = append(groups, []string{word})
    		}
    	}
    	return groups
    }
  cpp: |
    #include <algorithm>
    #include <string>
    #include <unordered_map>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        vector<vector<string>> groupAnagrams(vector<string>& strs) {
            unordered_map<string, size_t> index;
            vector<vector<string>> groups;
            for (const string& word : strs) {
                string key = word;
                sort(key.begin(), key.end());
                auto it = index.find(key);
                if (it == index.end()) {
                    index.emplace(key, groups.size());
                    groups.push_back({word});
                } else {
                    groups[it->second].push_back(word);
                }
            }
            return groups;
        }
    };
