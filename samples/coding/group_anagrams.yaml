prompt_markdown: |
  ## Group Anagrams

  Given an array of strings `strs`, group the words that are **anagrams** of each other (they use the
  same letters the same number of times, in any order).

  Return the groups in **any order**; the words inside a group may also be in any order. The checker
  compares a canonical form: every group is sorted, then the list of groups is sorted.

  ### Example 1
  ```
  Input:  strs = ["eat", "tea", "tan", "ate", "nat", "bat"]
  Output: [["bat"], ["nat", "tan"], ["ate", "eat", "tea"]]
  ```

  ### Example 2
  ```
  Input:  strs = [""]
  Output: [[""]]
  ```

  ### Example 3
  ```
  Input:  strs = ["a"]
  Output: [["a"]]
  ```

  ### Constraints
  - `0 <= strs.length <= 10^4`
  - `0 <= strs[i].length <= 100`
  - `strs[i]` consists of lower-case English letters. Duplicate words are kept in their group.
languages: [python, javascript, typescript, java, go, cpp]
