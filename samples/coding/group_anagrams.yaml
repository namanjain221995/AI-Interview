expected_concepts:
  - canonical key per anagram class (sorted letters or letter counts)
  - hash map from key to group
  - O(n * k log k) versus O(n * k) keys
optimal_complexity: {time: "O(n * k log k) with sorted keys, O(n * k) with count keys", space: "O(n * k)"}
rubric:
  excellent: Chooses a canonical key (sorted string or 26-letter count signature), groups with a hash map, keeps duplicates, and compares the complexity of both key choices.
  good: Correct sorted-key grouping with complexity stated after a prompt.
  weak: Compares every pair of words, drops duplicate words, or uses a key that collides (such as the letter set without counts).
  criteria:
    correctness: All tests pass, including duplicates, empty words and different multiplicities.
    efficiency: One pass with a hash map; no pairwise comparisons.
    code_quality: The key function is clear and isolated.
    edge_cases: Empty input, empty strings and repeated words.
    communication: Explains why the chosen key is identical for all anagrams and different otherwise.
hints:
  - What property do all anagrams of a word share that non-anagrams don't?
  - If you turn each word into a canonical key that is identical for all of its anagrams, grouping becomes a dictionary problem.
  - Use the word's letters in sorted order (or its 26 letter counts) as a key in a hash map from key to list of words, then return the map's values.
followups:
  - Why does a set of letters not work as the key, but a sorted string or count vector does?
  - What is the complexity with sorted keys versus count keys, and when does the difference matter?
  - How would you handle Unicode words or case-insensitive grouping?
  - How would you distribute this grouping across machines for a billion words?
common_errors:
  - Using the set of letters as the key, which merges "aab" with "abb".
  - Dropping duplicate words by storing groups as sets.
  - Comparing every pair of words, giving O(n^2 * k) time.
  - Mutating the input words while building keys.
