  go: |
    package main

    func productExceptSelf(nums []int) []int {
    	n := len(nums)
    	answer := make([]int, n)
    	prefix := 1
    	for i := 0; i < n; i++ {
    		answer[i] = prefix
    		prefix *= nums[i]
    	}
    	suffix := 1
    	for i := n - 1; i >= 0; i-- {
    		answer[i] *= suffix
    		suffix *= nums[i]
    	}
    	return answer
    }
  cpp: |
    #include <vector>
    using namespace std;

    class Solution {
    public:
        vector<int> productExceptSelf(vector<int>& nums) {
            int n = nums.size();
            vector<int> answer(n, 1);
            int prefix = 1;
            for (int i = 0; i < n; ++i) {
                answer[i] = prefix;
                prefix *= nums[i];
            }
            int suffix = 1;
            for (int i = n - 1; i >= 0; --i) {
                answer[i] *= suffix;
                suffix *= nums[i];
            }
            return answer;
        }
    };
