reference_solutions:
  python: |
    def product_except_self(nums: list[int]) -> list[int]:
        n = len(nums)
        answer = [1] * n
        prefix = 1
        for i in range(n):
            answer[i] = prefix
            prefix *= nums[i]
        suffix = 1
        for i in range(n - 1, -1, -1):
            answer[i] *= suffix
            suffix *= nums[i]
        return answer
  javascript: |
    function productExceptSelf(nums) {
      const n = nums.length;
      const answer = new Array(n).fill(1);
      let prefix = 1;
      for (let i = 0; i < n; i++) {
        answer[i] = prefix;
        prefix *= nums[i];
      }
      let suffix = 1;
      for (let i = n - 1; i >= 0; i--) {
        answer[i] *= suffix;
        suffix *= nums[i];
      }
      return answer;
    }
  typescript: |
    function productExceptSelf(nums: number[]): number[] {
      const n = nums.length;
      const answer: number[] = new Array<number>(n).fill(1);
      let prefix = 1;
      for (let i = 0; i < n; i++) {
        answer[i] = prefix;
        prefix *= nums[i];
      }
      let suffix = 1;
      for (let i = n - 1; i >= 0; i--) {
        answer[i] *= suffix;
        suffix *= nums[i];
      }
      return answer;
    }
  java: |
    class Solution {
