expected_concepts:
  - prefix products
  - suffix products
  - reusing the output array for O(1) extra space
  - handling zeros without division
optimal_complexity: {time: O(n), space: "O(1) extra, output excluded"}
rubric:
  excellent: Derives prefix and suffix products, folds them into the output array for O(1) extra space, explains why division fails with zeros, and handles negatives.
  good: Correct solution with separate prefix and suffix arrays (O(n) extra space).
  weak: Uses division (wrong with zeros), or computes each product with a nested loop.
  criteria:
    correctness: All tests pass, including one zero, two zeros and negative numbers.
    efficiency: Two linear passes; no nested loops.
    code_quality: Clear prefix/suffix naming and loop direction.
    edge_cases: Zeros, negative numbers and the minimum length of two.
    communication: Explains what answer[i] holds after each pass.
hints:
  - The product of everything except nums[i] splits into two parts — what is to the left of i and what is to the right of i.
  - If you knew the product of all elements before each index and the product of all elements after it, each answer would be a single multiplication.
  - In a forward pass store the running product of elements before i in answer[i]; in a backward pass multiply answer[i] by a running product of elements after i.
followups:
  - Why doesn't dividing the total product by nums[i] work for this input?
  - What happens when the array contains one zero, or two?
  - How would you handle values whose products overflow 64-bit integers?
common_errors:
  - Dividing the total product by nums[i], which fails when the input contains zeros.
  - Including nums[i] itself in the prefix or suffix due to an off-by-one in the update order.
  - Nested loops giving O(n^2) time.
  - Allocating two extra arrays without considering the O(1) extra-space follow-up.
