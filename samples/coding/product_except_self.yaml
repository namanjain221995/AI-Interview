title: Product of Array Except Self
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Product of Array Except Self

  Given an integer array `nums`, return an array `answer` where `answer[i]` is the product of every
  element of `nums` **except** `nums[i]`.

  - Do **not** use division.
  - The product of any prefix or suffix of `nums` fits in a 32-bit integer.

  ### Example 1
  ```
  Input:  nums = [1, 2, 3, 4]
  Output: [24, 12, 8, 6]
  ```

  ### Example 2
  ```
  Input:  nums = [-1, 1, 0, -3, 3]
  Output: [0, 0, 9, 0, 0]
  ```

  ### Constraints
  - `2 <= nums.length <= 10^5`
  - `-30 <= nums[i] <= 30`

  **Follow-up:** can you use only `O(1)` extra space besides the output array?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: product_except_self
  params:
    - {name: nums, type: "int[]"}
  return_type: "int[]"
  comparison: exact
