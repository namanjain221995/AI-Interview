expected_concepts:
  - "total cost is a convex piecewise-linear function of the target"
  - "weighted median minimises a weighted sum of absolute deviations"
  - "sorting heights together with their costs"
  - "prefix sums of weights to find where half the total weight is reached"
  - "64-bit accumulation of the final cost"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Explains why the optimum lies at a weighted median, sorts heights with their costs, finds the first height where the running weight reaches half the total, accumulates the cost in 64-bit and argues correctness via the slope of the cost function."
  good: "Reaches an O(n log n) solution, for example binary or ternary search on the convex cost or prefix sums over sorted heights, with correct 64-bit handling after a hint."
  weak: "Tries every integer height in the full range, uses the unweighted median or the mean, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including duplicate heights, a dominating cost and the 64-bit cases."
    efficiency: "Sorting dominates; the median search and final sum are linear."
    code_quality: "Keeps each height paired with its cost while sorting and does not mutate the inputs unexpectedly."
    edge_cases: "Single rack, already aligned racks, ties at exactly half the weight and very large products."
    communication: "Describes how moving the target by one centimetre changes the cost and why that points to the weighted median."
hints:
  - "Think about how the total cost changes when you raise the target by one centimetre: which racks get cheaper and which get more expensive?"
  - "The cost only gets worse once the total weight of racks below the target exceeds the weight of racks above it, so the best target is one of the existing heights."
  - "Sort racks by height while keeping each cost attached, walk upwards adding costs until the running total reaches at least half of all costs, use that height as the target and sum the weighted distances with 64-bit arithmetic."
followups:
  - "How would you answer many queries of the form 'what is the cost to align at height t' quickly?"
  - "What changes if moving a shelf up and moving it down have different per-centimetre costs?"
  - "How would you handle a constraint that the target must lie within a given range?"
  - "Can you find the weighted median in linear expected time without a full sort?"
common_errors:
  - "Using the arithmetic mean or the unweighted median of the heights."
  - "Scanning every height between the minimum and maximum, which is far too slow for the value range."
  - "Accumulating the total in a 32-bit integer and overflowing on large inputs."
  - "Sorting heights and costs independently so they no longer belong to the same rack."
