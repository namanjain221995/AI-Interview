slug: min_cost_align_shelf_heights
title: Cheapest Shelf Height Alignment
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_scientist, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Cheapest Shelf Height Alignment

  A warehouse is re-racking an aisle so that one shelf level lines up across every rack, which lets a
  picking robot travel along it without adjusting its arm. Rack `i` currently has that shelf at
  `heights[i]` centimetres. Moving the shelf of rack `i` up or down by one centimetre costs `costs[i]`
  (racks that hold heavier stock cost more to adjust).

  Choose a single integer target height and move every shelf to it. Return the **minimum total cost**.
  The cost of rack `i` is `|heights[i] - target| * costs[i]`, and the answer is a 64-bit integer.

  ### Example 1
  ```
  Input:  heights = [3, 8, 5], costs = [2, 1, 4]
  Output: 7
  Explanation: align at 5: |3 - 5| * 2 + |8 - 5| * 1 + 0 = 4 + 3 = 7.
  ```

  ### Example 2
  ```
  Input:  heights = [10, 20, 30, 40], costs = [1, 1, 1, 100]
  Output: 60
  Explanation: the heavy rack stays at 40 and the others move 30 + 20 + 10 centimetres.
  ```

  ### Example 3
  ```
  Input:  heights = [7, 7, 7], costs = [5, 9, 2]
  Output: 0
  ```

  ### Constraints
  - `1 <= heights.length == costs.length <= 10^5`
  - `1 <= heights[i] <= 10^6`
  - `1 <= costs[i] <= 10^4`
  - The answer fits in a signed 64-bit integer (it can exceed `2^31 - 1`).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_cost_align_shelf_heights
  params:
    - {name: heights, type: "int[]"}
    - {name: costs, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def min_cost_align_shelf_heights(heights: list[int], costs: list[int]) -> int:
        shelves = sorted(zip(heights, costs))
        total_weight = sum(costs)
        running = 0
        target = shelves[0][0]
        for height, cost in shelves:
            running += cost
            if 2 * running >= total_weight:
                target = height
                break
        return sum(abs(height - target) * cost for height, cost in shelves)
  javascript: |
    function minCostAlignShelfHeights(heights, costs) {
      const order = heights.map((_, i) => i).sort((a, b) => heights[a] - heights[b]);
      let totalWeight = 0;
      for (const c of costs) totalWeight += c;
      let running = 0;
      let target = heights[order[0]];
      for (const i of order) {
        running += costs[i];
        if (2 * running >= totalWeight) {
          target = heights[i];
          break;
        }
      }
      let result = 0;
      for (let i = 0; i < heights.length; i++) result += Math.abs(heights[i] - target) * costs[i];
      return result;
    }
