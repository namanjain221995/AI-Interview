expected_concepts:
  - "strict majority means count > n / 2"
  - "hash map counting in O(n) time and O(n) space"
  - "Boyer-Moore majority vote for O(1) space"
  - "verification pass for the voting candidate"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Solves it with a counting map, then derives the Boyer-Moore voting algorithm for O(1) memory, explains why the candidate must be verified with a second pass and handles the exact-half and empty cases."
  good: "Correct hash-map counting solution with the strict-majority check; may describe voting without implementing verification."
  weak: "Returns the most frequent version even without a majority, treats exactly half as a majority, or returns an unverified voting candidate."
  criteria:
    correctness: "All tests pass, including ties at exactly half and inputs with no majority."
    efficiency: "Linear time; constant extra memory for the voting solution, linear for counting."
    code_quality: "Clear separation between finding a candidate and confirming it; integer arithmetic avoids division rounding mistakes."
    edge_cases: "Empty input, single replica, exact half, scattered majority."
    communication: "Explains why the voting algorithm only guarantees a correct answer when a majority exists."
hints:
  - "Start with the straightforward way: how many times does each version appear, and what threshold must the winner beat?"
  - "A majority element survives if you repeatedly cancel pairs of different values, which lets you track a single candidate and a counter instead of a full table."
  - "Keep a candidate and a counter: when the counter is zero adopt the current version, add one for a matching version and subtract one otherwise. The surviving candidate is only a guess, so count its occurrences in a second pass and return it only if twice that count exceeds the number of replicas, otherwise minus one."
followups:
  - "Why can the voting pass return a candidate that is not a majority, and what input shows it?"
  - "How would you find every version that runs on more than a third of the replicas?"
  - "How would you compute the majority across several shards that each report their own counts?"
  - "Why is comparing twice the count with the length safer than dividing the length by two?"
common_errors:
  - "Returning the voting candidate without a verification pass."
  - "Using greater-than-or-equal to half, which accepts a tie."
  - "Integer division mistakes such as comparing the count with length divided by two using a non-strict test on odd lengths."
  - "Returning the most frequent version when it is not a majority."
