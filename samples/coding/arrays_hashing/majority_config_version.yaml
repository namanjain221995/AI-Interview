version: 1
slug: majority_config_version
title: Majority Config Version
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, platform, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Majority Config Version

  During a rolling config push every replica of a service reports the config version it is currently
  running. The control plane only declares the push settled when one version is running on a **strict
  majority** of replicas.

  Given `versions`, where `versions[i]` is the version reported by replica `i`, return the version that
  appears **more than `versions.length / 2` times**. If no version has a strict majority (including when
  there are no replicas), return `-1`. Exactly half is **not** a majority.

  ### Example 1
  ```
  Input:  versions = [7, 7, 3, 7, 5]
  Output: 7
  Explanation: Version 7 runs on 3 of 5 replicas, which is more than half.
  ```

  ### Example 2
  ```
  Input:  versions = [2, 2, 4, 4]
  Output: -1
  Explanation: Version 2 and version 4 each run on exactly half of the replicas; that is not a strict majority.
  ```

  ### Example 3
  ```
  Input:  versions = [9]
  Output: 9
  ```

  ### Constraints
  - `0 <= versions.length <= 10^5`
  - `1 <= versions[i] <= 10^9`

  **Follow-up:** Can you do it in O(n) time with O(1) extra memory? Be careful: a candidate found that way still has to be confirmed.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: majority_config_version
  params:
    - {name: versions, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def majority_config_version(versions: list[int]) -> int:
        candidate, count = -1, 0
        for version in versions:
            if count == 0:
                candidate = version
            count += 1 if version == candidate else -1
        if candidate != -1 and 2 * versions.count(candidate) > len(versions):
            return candidate
        return -1
  javascript: |
    function majorityConfigVersion(versions) {
      const counts = new Map();
      for (const v of versions) {
        const c = (counts.get(v) || 0) + 1;
        counts.set(v, c);
        if (2 * c > versions.length) return v;
      }
      return -1;
    }
