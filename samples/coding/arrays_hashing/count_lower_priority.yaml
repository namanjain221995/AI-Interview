slug: count_lower_priority
title: How Many Tickets Rank Lower
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [support_engineer, backend, qa]
time_limit_minutes: 12
prompt_markdown: |
  ## How Many Tickets Rank Lower

  A support queue stores the priority score of every open ticket in `priorities`. Scores are whole
  numbers from `0` to `100`. Next to each ticket the dashboard shows how many **other** tickets have a
  **strictly lower** score.

  Return an array `result` of the same length where `result[i]` is the number of tickets whose score is
  strictly lower than `priorities[i]`. Tickets with an equal score are not counted. The output keeps the
  input order.

  ### Example 1
  ```
  Input:  priorities = [40, 10, 25, 25, 60]
  Output: [3, 0, 1, 1, 4]
  Explanation: Score 40 is above 10 and both 25s; the two 25s only outrank the 10.
  ```

  ### Example 2
  ```
  Input:  priorities = [7, 7, 7]
  Output: [0, 0, 0]
  Explanation: No ticket has a strictly lower score than another.
  ```

  ### Constraints
  - `0 <= priorities.length <= 10^5`
  - `0 <= priorities[i] <= 100`

  **Follow-up:** the brute-force comparison of every pair is `O(n^2)`; can you make it linear in the
  number of tickets plus the number of possible scores?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_lower_priority
  params:
    - {name: priorities, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def count_lower_priority(priorities: list[int]) -> list[int]:
        counts = [0] * 101
        for score in priorities:
            counts[score] += 1
        lower = [0] * 101  # lower[v] = number of tickets with a score strictly below v
        running = 0
        for value in range(101):
            lower[value] = running
            running += counts[value]
        return [lower[score] for score in priorities]
  javascript: |
    function countLowerPriority(priorities) {
      const counts = new Array(101).fill(0);
      for (const score of priorities) counts[score] += 1;
      const lower = new Array(101).fill(0);
      let running = 0;
      for (let value = 0; value <= 100; value++) {
        lower[value] = running;
        running += counts[value];
      }
      return priorities.map((score) => lower[score]);
    }
