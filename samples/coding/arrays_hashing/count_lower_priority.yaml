expected_concepts:
  - "counting sort style frequency table"
  - "prefix sums over the value range"
  - "strictly lower versus lower-or-equal"
  - "preserving input order in the output"
optimal_complexity: {time: "O(n + k) where k = 101", space: "O(k)"}
rubric:
  excellent: "Uses the bounded score range to build a frequency table, converts it to exclusive prefix sums, answers each ticket in O(1) and explains the O(n + k) complexity compared with sorting or brute force."
  good: "Sorts a copy and uses the first index of each value (O(n log n)), or reaches the counting solution with a hint, with correct handling of equal scores."
  weak: "Only the nested-loop O(n^2) comparison, or counts tickets with equal scores as lower."
  criteria:
    correctness: "All tests pass, including equal scores, boundary scores 0 and 100 and an empty queue."
    efficiency: "Linear in n plus the size of the score range; no per-ticket scan."
    code_quality: "Clear separation between counting, prefix accumulation and the final lookup."
    edge_cases: "Empty input, single ticket, all-equal scores and the score 0 having no lower values."
    communication: "Explains why the score bound makes counting better than sorting."
hints:
  - "Comparing every ticket with every other ticket works but is quadratic; notice how small the range of possible scores is."
  - "Count how many tickets have each score from 0 to 100; the answer for a score depends only on the counts of the scores below it."
  - "Build a frequency table of size 101, turn it into running totals so that each entry holds the number of tickets with a strictly smaller score, then read the answer for every ticket from that table in input order."
followups:
  - "How would you solve it if scores could be any 32-bit integer?"
  - "How would you answer the same question for lower-or-equal scores, excluding the ticket itself?"
  - "If tickets keep arriving and leaving, which data structure would let you answer each query quickly?"
common_errors:
  - "Using an inclusive prefix sum, which counts tickets with equal scores as lower."
  - "Sorting the input in place and then returning answers in sorted order instead of input order."
  - "Sizing the frequency table as 100 instead of 101, which drops the score 100."
