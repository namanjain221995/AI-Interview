expected_concepts:
  - "two passes: left neighbour constraint then right neighbour constraint"
  - "taking the maximum in the second pass to keep the first pass valid"
  - "equal neighbours impose no constraint"
  - "64-bit total"
  - "O(n) time with O(n) space (O(1) possible with slope counting)"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Derives the two-pass solution, explains why the second pass takes the maximum, handles equal neighbours, uses a 64-bit total, and mentions the O(1)-space up/down run counting variant."
  good: "Correct two-pass solution reached with a hint, or a correct but repeated relaxation that is then improved."
  weak: "Single pass that fails on decreasing runs, gives equal neighbours equal points by rule, or repeats relaxation until stable in O(n^2)."
  criteria:
    correctness: "All tests pass, including plateaus, peaks and monotone inputs."
    efficiency: "Linear time; constant number of passes."
    code_quality: "Each pass has a clear purpose; the total is accumulated in a 64-bit variable."
    edge_cases: "Single reviewer, all equal, strictly decreasing and very large score gaps."
    communication: "Explains why the peak needs the larger of its two side requirements."
hints:
  - "Consider the rule against the left neighbour and the rule against the right neighbour separately."
  - "One sweep from left to right can satisfy every left-neighbour requirement; a second sweep from right to left can satisfy the right-neighbour requirements, as long as it never lowers a value set by the first sweep."
  - "Start everyone at one point; going left to right, give a reviewer one more than the left neighbour when their score is higher; then going right to left, when a reviewer scores higher than the right neighbour, raise their points to one more than that neighbour if that is larger than what they already have; finally add up all points."
followups:
  - "Can you compute the total in O(1) extra space?"
  - "How would the answer change if equal neighbours had to receive equal points?"
  - "What if the reviewers sat in a circle instead of a line?"
common_errors:
  - "Overwriting points in the second pass instead of taking the maximum, which breaks left-neighbour rules at peaks."
  - "Giving equal-score neighbours equal points or forcing an order between them."
  - "Using a single pass that only looks at the left neighbour."
  - "Accumulating the total in a 32-bit integer."
