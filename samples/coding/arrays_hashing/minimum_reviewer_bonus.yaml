slug: minimum_reviewer_bonus
title: Minimum Reviewer Bonus Points
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, tech_lead, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Minimum Reviewer Bonus Points

  An engineering org runs a code-review rotation. The reviewers on this sprint's rotation are listed in
  rotation order, and `scores[i]` is the number of review comments reviewer `i` resolved this sprint.
  Recognition points are handed out under two rules:

  1. Every reviewer receives **at least 1** point.
  2. If a reviewer's score is **strictly higher** than that of an **adjacent** reviewer in the list, they
     must receive **more** points than that neighbour.

  Neighbours with equal scores have no constraint between them. Return the **minimum total number of
  points** that satisfies both rules, as a 64-bit integer.

  ### Example 1
  ```
  Input:  scores = [3, 1, 2]
  Output: 5
  Explanation: Points [2, 1, 2] give a total of 5.
  ```

  ### Example 2
  ```
  Input:  scores = [1, 2, 2, 3]
  Output: 6
  Explanation: Points [1, 2, 1, 2]: the two reviewers scoring 2 are equal, so the second may receive fewer points.
  ```

  ### Example 3
  ```
  Input:  scores = [1, 4, 7, 5, 2]
  Output: 9
  Explanation: Points [1, 2, 3, 2, 1].
  ```

  ### Constraints
  - `1 <= scores.length <= 10^5`
  - `0 <= scores[i] <= 10^9`
  - The total can exceed `2^31 - 1`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: minimum_reviewer_bonus
  params:
    - {name: scores, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def minimum_reviewer_bonus(scores: list[int]) -> int:
        n = len(scores)
        points = [1] * n
        # Left-to-right pass: satisfy the rule against the left neighbour.
        for i in range(1, n):
            if scores[i] > scores[i - 1]:
                points[i] = points[i - 1] + 1
        # Right-to-left pass: satisfy the rule against the right neighbour without breaking the first.
        for i in range(n - 2, -1, -1):
            if scores[i] > scores[i + 1]:
                points[i] = max(points[i], points[i + 1] + 1)
        return sum(points)
  javascript: |
    function minimumReviewerBonus(scores) {
      const n = scores.length;
      const points = new Array(n).fill(1);
      for (let i = 1; i < n; i++) {
        if (scores[i] > scores[i - 1]) points[i] = points[i - 1] + 1;
      }
      for (let i = n - 2; i >= 0; i--) {
        if (scores[i] > scores[i + 1]) points[i] = Math.max(points[i], points[i + 1] + 1);
      }
      let total = 0;
      for (const p of points) total += p;
      return total;
    }
