expected_concepts:
  - "hash map from value to last seen index"
  - "comparing each occurrence only with the previous occurrence"
  - "single linear pass"
  - "sentinel result when no repeat exists"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Explains that only consecutive occurrences of the same id can give the minimum, uses a last-seen hash map in one pass, returns -1 when nothing repeats and states O(n) time and space."
  good: "Correct hash map solution that may store all positions per id before scanning them, or needs a hint to drop the nested loop."
  weak: "Nested loops over all pairs without improvement, compares with the first occurrence instead of the most recent one, or returns 0 instead of -1."
  criteria:
    correctness: "All tests pass, including ids that appear three or more times and logs with no repeats."
    efficiency: "Linear time and linear memory for the hash map."
    code_quality: "Clear names such as last_seen, and the map update placed after the comparison."
    edge_cases: "Single element, adjacent repeats, a repeat spanning the whole log and no repeat at all."
    communication: "Justifies why comparing with the most recent previous occurrence is enough."
hints:
  - "Only pairs of equal ids matter, and for a given id the best pair never has another occurrence of that same id between its two ends."
  - "For each id it is enough to compare every occurrence with its most recent previous occurrence, so remember where each id was last seen."
  - "Scan once with a hash map from id to its last index; when the current id is already in the map, the window from that index to the current one is a candidate, keep the minimum, then overwrite the stored index, and return minus one if no candidate ever appeared."
followups:
  - "How would you return the window boundaries instead of the length?"
  - "How would you check whether any id repeats within a window of at most k requests using only O(k) memory?"
  - "What changes if the log is far too large for one machine's memory?"
common_errors:
  - "Storing only the first occurrence of each id, which misses closer later repeats."
  - "Reporting j - i instead of j - i + 1 as the window length."
  - "Returning 0 or the input length instead of -1 when every id is distinct."
