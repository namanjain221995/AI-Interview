slug: shortest_repeat_window
title: Shortest Window With a Repeated Session
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [security, backend, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Shortest Window With a Repeated Session

  A rate-limiting proxy logs the session id of every request, in arrival order, in `session_ids`. To
  spot rapid replays, the security team wants the length of the **shortest contiguous window** of
  requests in which some session id appears **at least twice**.

  Positions are 0-indexed. A window from position `i` to position `j` (with `i < j`) has length `j - i + 1`. Return the length of
  the shortest such window, or `-1` if every session id in the log is distinct.

  ### Example 1
  ```
  Input:  session_ids = [14, 7, 3, 9, 7, 14]
  Output: 4
  Explanation: Session 7 repeats at positions 1 and 4 (length 4); session 14 needs length 6.
  ```

  ### Example 2
  ```
  Input:  session_ids = [1, 2, 3]
  Output: -1
  Explanation: Every session id is distinct.
  ```

  ### Example 3
  ```
  Input:  session_ids = [11, 4, 11, 4, 4]
  Output: 2
  Explanation: Session 4 repeats at positions 3 and 4.
  ```

  ### Constraints
  - `1 <= session_ids.length <= 10^5`
  - `0 <= session_ids[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_repeat_window
  params:
    - {name: session_ids, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def shortest_repeat_window(session_ids: list[int]) -> int:
        last_seen: dict[int, int] = {}
        best = -1
        for i, session in enumerate(session_ids):
            if session in last_seen:
                length = i - last_seen[session] + 1
                if best == -1 or length < best:
                    best = length
            last_seen[session] = i
        return best
  javascript: |
    function shortestRepeatWindow(sessionIds) {
      const lastSeen = new Map();
      let best = -1;
      for (let i = 0; i < sessionIds.length; i++) {
        const session = sessionIds[i];
        if (lastSeen.has(session)) {
          const length = i - lastSeen.get(session) + 1;
          if (best === -1 || length < best) best = length;
        }
        lastSeen.set(session, i);
      }
      return best;
    }
