version: 1
slug: first_overdraft_index
title: First Overdraft in a Ledger
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, fullstack, data_analyst, general]
time_limit_minutes: 12
prompt_markdown: |
  ## First Overdraft in a Ledger

  A payments ledger starts an account at `opening_balance` (in cents) and then applies `transactions`
  in order: a positive value is a deposit and a negative value is a withdrawal.

  Return the **smallest index `i`** such that, right after `transactions[i]` has been applied, the
  running balance is **strictly below zero**. A balance of exactly `0` is not an overdraft. If the
  balance never goes negative, return `-1`.

  Balances can grow far beyond the 32-bit integer range, so use 64-bit arithmetic for the running total.

  ### Example 1
  ```
  Input:  opening_balance = 100, transactions = [-30, -50, 20, -45]
  Output: 3
  Explanation: The running balance is 70, 20, 40, then -5 after index 3.
  ```

  ### Example 2
  ```
  Input:  opening_balance = 0, transactions = [10, -10, 5]
  Output: -1
  Explanation: The balance touches exactly 0 after index 1, which is not an overdraft.
  ```

  ### Example 3
  ```
  Input:  opening_balance = 50, transactions = [-60, 100, -200]
  Output: 0
  Explanation: The balance is -10 right after index 0; the later dip does not matter.
  ```

  ### Constraints
  - `0 <= opening_balance <= 10^12`
  - `0 <= transactions.length <= 10^5`
  - `-10^9 <= transactions[i] <= 10^9`

  **Follow-up:** How would you report every period during which the account was overdrawn instead of only the first index?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_overdraft_index
  params:
    - {name: opening_balance, type: "long"}
    - {name: transactions, type: "long[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def first_overdraft_index(opening_balance: int, transactions: list[int]) -> int:
        balance = opening_balance
        for index, amount in enumerate(transactions):
            balance += amount
            if balance < 0:
                return index
        return -1
  javascript: |
    function firstOverdraftIndex(openingBalance, transactions) {
      let balance = openingBalance;
      for (let i = 0; i < transactions.length; i++) {
        balance += transactions[i];
        if (balance < 0) return i;
      }
      return -1;
    }
tests:
  - {id: t1, args: [100, [-30, -50, 20, -45]], expected: 3, description: "Example 1"}
  - {id: t2, args: [0, [10, -10, 5]], expected: -1, description: "Example 2 - zero balance is not an overdraft"}
  - {id: t3, args: [50, [-60, 100, -200]], expected: 0, description: "Example 3 - only the first overdraft counts"}
  - {id: t4, hidden: true, args: [500, []], expected: -1, description: "No transactions returns -1"}
  - {id: t5, hidden: true, args: [0, [-1]], expected: 0, description: "Minimum overdraft on the first transaction from a zero balance"}
  - {id: t6, hidden: true, args: [0, [1000000000, 1000000000, 1000000000, -1000000000, -1000000000, -1000000000]], expected: -1, description: "Running total passes 2^31 and returns to exactly zero; 32-bit overflow would report a false overdraft"}
  - {id: t7, hidden: true, args: [1000000000000, [-1000000000, -1000000000, -1000000000, -1000000000, -1000000000, 1000000000]], expected: -1, description: "Opening balance above 32-bit range never goes negative"}
  - {id: t8, hidden: true, args: [3000000000, [-1000000000, -1000000000, -1000000000, -1]], expected: 3, description: "64-bit opening balance drained to zero and then one cent below"}
  - {id: t9, hidden: true, args: [5, [5, 5, 5, 5]], expected: -1, description: "Deposits only"}
