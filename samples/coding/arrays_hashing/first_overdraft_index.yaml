expected_concepts:
  - "running (prefix) sum"
  - "strictly negative versus zero boundary"
  - "64-bit accumulation to avoid overflow"
  - "early return on the first match"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Keeps a single 64-bit running balance, returns on the first strictly negative value, explains why zero is not an overdraft and why a 32-bit total could wrap, and states O(n) time with O(1) space."
  good: "Correct running-sum solution; needs a test run to fix the zero boundary or the integer width."
  weak: "Recomputes the sum of the prefix for every index, treats a zero balance as overdrawn, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including the zero boundary and the large-value cases."
    efficiency: "One pass with constant extra memory."
    code_quality: "Uses a 64-bit balance variable (long, int64, long long) in typed languages and names it clearly."
    edge_cases: "Empty transaction list, overdraft on the very first transaction and balances above 2^31."
    communication: "Calls out the integer-width risk before running tests."
hints:
  - "Think about what the account balance is after each transaction, and how it relates to the balance after the previous one."
  - "You only need one running total that you update as you go; check it right after each transaction is applied."
  - "Start a 64-bit running balance at the opening balance, add each transaction in order, and return the current index the first time the balance is strictly less than zero; if the loop ends, return minus one."
followups:
  - "Why does a 32-bit running total give a wrong answer on some inputs even though every individual transaction fits in 32 bits?"
  - "How would you answer the same question for many different opening balances efficiently?"
  - "What would change if transactions arrived out of order with timestamps?"
  - "How would you find the lowest balance the account ever reached?"
common_errors:
  - "Using less-than-or-equal and reporting a balance of exactly zero as an overdraft."
  - "Accumulating in a 32-bit int in Java, Go or C++, which wraps around on large totals."
  - "Checking the balance before applying the transaction, which is off by one index."
  - "Recomputing each prefix sum from scratch, giving O(n^2) time."
