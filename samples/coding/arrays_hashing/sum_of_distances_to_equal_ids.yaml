expected_concepts: [grouping positions by id with a hash map, prefix sums of positions per id, splitting |i - j| into left and right contributions, 64-bit accumulation]
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Splits each sum into the contribution from earlier and later equal positions, keeps a running count and position total per id (two passes or one grouped pass), uses 64-bit arithmetic, and states O(n) time and space.
  good: Groups positions by id and uses prefix sums inside each group, reaching linear time with some guidance.
  weak: Stays with the quadratic comparison of all equal pairs, or overflows 32-bit integers on large inputs.
  criteria: {correctness: 'All tests pass, including unique ids, all-equal ids and negative ids.', efficiency: Linear time; each position is processed a constant number of times., code_quality: Running counters per id are named clearly and the two directions are symmetric., edge_cases: 'Empty input, single element and ids that appear once.', communication: Derives the count times position minus total formula before coding it.}
hints: ['Only positions that hold the same id affect each other, so think about each id''s list of positions separately.', 'For one position, the distances to equal ids on its left add up to (how many there are) times the position minus the sum of their positions; the right side is symmetric. Running totals give both without an inner loop.', 'Scan left to right keeping, for every id, how many times it has appeared and the sum of those positions, and add count times i minus that sum; then scan right to left doing the mirror image and add sum minus count times i. Use 64-bit values for the totals.']
followups: ['Can you do it in a single pass per id group using the group''s total position sum?', 'How would you compute the sum of squared distances instead?', 'What if the log is too large for memory but sorted by id?']
common_errors: ['Comparing every pair of equal positions, which is quadratic when one id dominates.', 'Accumulating in 32-bit integers, which overflows for long runs of the same id.', Including the position itself or counting each pair twice.]
