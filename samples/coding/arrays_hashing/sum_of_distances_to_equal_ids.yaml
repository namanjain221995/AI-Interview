version: 1
slug: sum_of_distances_to_equal_ids
title: Distances to Matching Request IDs
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Distances to Matching Request IDs

  A tracing pipeline records request ids in arrival order, and client retries reuse the id of the
  original request. To measure how spread out retries are, compute for every position `i` the sum of
  `|i - j|` over all **other** positions `j` where `ids[j] == ids[i]`.

  Return an array of the same length as `ids` where element `i` is that sum. A position whose id
  appears only once gets `0`. Sums can exceed the 32-bit integer range, so return 64-bit values.

  **Follow-up:** the straightforward approach compares every pair of positions; aim for `O(n)` time.

  ### Example 1
  ```
  Input:  ids = [4, 4, 9, 4, 9, 1]
  Output: [4, 3, 2, 5, 2, 0]
  Explanation: Id 4 is at positions 0, 1 and 3, so position 0 gets 1 + 3 = 4, position 1 gets 1 + 2 = 3 and position 3 gets 3 + 2 = 5. Id 9 at positions 2 and 4 gives 2 each; id 1 appears once.
  ```

  ### Example 2
  ```
  Input:  ids = [-6, 15, 8]
  Output: [0, 0, 0]
  ```

  ### Constraints
  - `0 <= ids.length <= 10^5`
  - `-10^9 <= ids[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sum_of_distances_to_equal_ids
  params:
  - {name: ids, type: 'int[]'}
  return_type: long[]
  comparison: exact
reference_solutions:
  python: |
    def sum_of_distances_to_equal_ids(ids: list[int]) -> list[int]:
        n = len(ids)
        result = [0] * n
        count: dict[int, int] = {}
        total: dict[int, int] = {}
        for i, value in enumerate(ids):
            c = count.get(value, 0)
            result[i] += c * i - total.get(value, 0)
            count[value] = c + 1
            total[value] = total.get(value, 0) + i
        count.clear()
        total.clear()
        for i in range(n - 1, -1, -1):
            value = ids[i]
            c = count.get(value, 0)
            result[i] += total.get(value, 0) - c * i
            count[value] = c + 1
            total[value] = total.get(value, 0) + i
        return result
  javascript: |
    function sumOfDistancesToEqualIds(ids) {
      const n = ids.length;
      const result = new Array(n).fill(0);
      let count = new Map();
      let total = new Map();
      for (let i = 0; i < n; i++) {
        const c = count.get(ids[i]) || 0;
        const s = total.get(ids[i]) || 0;
        result[i] += c * i - s;
        count.set(ids[i], c + 1);
        total.set(ids[i], s + i);
      }
      count = new Map();
      total = new Map();
      for (let i = n - 1; i >= 0; i--) {
        const c = count.get(ids[i]) || 0;
        const s = total.get(ids[i]) || 0;
        result[i] += s - c * i;
        count.set(ids[i], c + 1);
        total.set(ids[i], s + i);
      }
      return result;
    }
