slug: longest_rebalanceable_event_prefix
title: Longest Rebalanceable Event Prefix
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, sre]
time_limit_minutes: 35
prompt_markdown: |
  ## Longest Rebalanceable Event Prefix

  An ingestion pipeline tags every incoming event with a numeric event type. A batch of events is
  **balanced** when every event type that appears in it appears the **same number of times**.

  Operators may discard **exactly one** event from a batch to balance it. For the stream `events`, consider
  each prefix `events[0..L-1]` (`1 <= L <= events.length`) as a batch. Return the **largest `L`** such that
  removing exactly one event from that prefix leaves a balanced batch.

  - A batch that becomes empty after the removal counts as balanced, so `L = 1` always qualifies.
  - A batch in which only one event type remains counts as balanced.
  - The removed event can be any event of the prefix; you only return the length `L`.

  ### Example 1
  ```
  Input:  events = [6, 6, 6, 3, 3, 8, 8, 8]
  Output: 7
  Explanation: The first 7 events contain type 6 three times and types 3 and 8 twice each. Removing one 6
               leaves every type exactly twice. With all 8 events (3, 2 and 3 occurrences) no single
               removal balances the batch.
  ```

  ### Example 2
  ```
  Input:  events = [5, 5, 9, 9, 2, 1, 1, 1]
  Output: 7
  Explanation: In the first 7 events types 5, 9 and 1 appear twice and type 2 once; dropping the 2 balances
               them. The 8th event gives counts 2, 2, 1 and 3, which one removal cannot fix.
  ```

  ### Constraints
  - `1 <= events.length <= 10^5`
  - `1 <= events[i] <= 10^9`

  **Follow-up:** can you do it in a single pass in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_rebalanceable_event_prefix
  params:
    - {name: events, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_rebalanceable_event_prefix(events: list[int]) -> int:
        count: dict[int, int] = {}  # event type -> occurrences so far
        types_with: dict[int, int] = {}  # occurrence count -> number of types with that count
        max_freq = 0
        best = 0
        for i, event in enumerate(events):
            old = count.get(event, 0)
            if old:
                types_with[old] -= 1
            count[event] = old + 1
            types_with[old + 1] = types_with.get(old + 1, 0) + 1
            max_freq = max(max_freq, old + 1)
            length = i + 1
            at_max = types_with[max_freq]
            if max_freq == 1:
                best = length  # all types distinct: drop any one event
            elif max_freq * at_max == length - 1:
                best = length  # every type at max_freq plus one lone event to drop
            elif at_max == 1 and (max_freq - 1) * types_with.get(max_freq - 1, 0) + max_freq == length:
                best = length  # one type sits one above all the others: drop one of its events
        return best
  javascript: |
    function longestRebalanceableEventPrefix(events) {
      const count = new Map();
      const typesWith = new Map();
      let maxFreq = 0;
      let best = 0;
      for (let i = 0; i < events.length; i++) {
        const old = count.get(events[i]) || 0;
        if (old) typesWith.set(old, typesWith.get(old) - 1);
        count.set(events[i], old + 1);
        typesWith.set(old + 1, (typesWith.get(old + 1) || 0) + 1);
        maxFreq = Math.max(maxFreq, old + 1);
        const length = i + 1;
        const atMax = typesWith.get(maxFreq);
        if (maxFreq === 1) {
          best = length;
        } else if (maxFreq * atMax === length - 1) {
          best = length;
        } else if (atMax === 1 && (maxFreq - 1) * (typesWith.get(maxFreq - 1) || 0) + maxFreq === length) {
          best = length;
        }
      }
      return best;
    }
