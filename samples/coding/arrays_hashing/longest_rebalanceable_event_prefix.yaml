expected_concepts:
  - frequency map of each event type
  - count-of-counts map (how many types have each frequency)
  - tracking the maximum frequency incrementally
  - "the three valid shapes: all distinct, one lone extra event, one type one above the rest"
  - single pass O(n) instead of re-checking every prefix
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Identifies the exact shapes a balanceable prefix can take, maintains type counts and a count-of-counts map with the running maximum, checks the shapes in O(1) per event and handles the single-type and all-distinct cases cleanly, with an O(n) argument.
  good: Reaches a correct solution with the frequency maps but needs help pinning down one of the shapes or the single-type case, or checks each prefix in O(number of distinct counts).
  weak: Recomputes counts for every prefix and tries every removal (O(n^2) or worse), or misses the lone-event and one-above cases.
  criteria:
    correctness: All tests pass, including a single event, a single type and all-distinct prefixes.
    efficiency: O(1) work per event using the count-of-counts map; overall O(n) time and space.
    code_quality: Updates both maps in one place and names the shape checks clearly.
    edge_cases: Single type, every type distinct, large type ids and prefixes that stop qualifying.
    communication: Explains why only those shapes can be balanced by removing one event.
hints:
  - Think about what the type counts of a prefix must look like for one removal to make them all equal.
  - "There are only a few possible shapes: every type appears once, every type shares a count except one type that appears once, or one type appears exactly one more time than all the others. Which totals let you recognise each shape?"
  - Keep a map from type to count and a second map from count to the number of types with that count, plus the running maximum count. After each event, the prefix qualifies when the maximum is one, when the maximum times its number of types equals the length minus one, or when exactly one type holds the maximum and the maximum minus one times its number of types plus the maximum equals the length.
followups:
  - How would the conditions change if you could remove up to two events?
  - How would you answer the same question for every prefix of a stream that never ends, using bounded memory per type?
  - Why can the maximum count be tracked without ever decreasing it?
  - What would change if you had to report which event type to drop?
common_errors:
  - Forgetting the case where only one event type remains after the removal.
  - Only handling the lone-event shape and missing the one-type-above-the-rest shape (or vice versa).
  - Leaving stale entries in the count-of-counts map when a type moves from one count to the next.
  - Rebuilding the frequency map for every prefix, which is quadratic.
