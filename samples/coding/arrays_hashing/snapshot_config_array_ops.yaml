slug: snapshot_config_array_ops
title: Versioned Config Array
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, platform, dba]
time_limit_minutes: 25
prompt_markdown: |
  ## Versioned Config Array

  A feature-flag service keeps an array of `length` integer config values, all starting at `0`. Operators
  change values and take numbered snapshots so that any past version can be audited later. Simulate the
  service for a list of operations `ops`, each a string in one of these forms (single spaces, no extra
  whitespace):

  - `"set i v"` — set the current value at index `i` to `v`.
  - `"snap"` — take a snapshot of the whole array. Snapshots are numbered `0, 1, 2, ...` in the order they
    are taken; output the new snapshot's id.
  - `"get i s"` — output the value index `i` held **at the moment snapshot `s` was taken**. Changes made
    after snapshot `s` do not affect the result.

  Return the outputs of every `snap` and `get` operation, in the order the operations appear. `set`
  produces no output.

  Memory must grow with the number of `set` operations, not with snapshots times `length`: copying the
  whole array on every snapshot is not acceptable.

  ### Example 1
  ```
  Input:  length = 3, ops = ["set 0 5", "snap", "set 0 6", "get 0 0", "snap", "get 0 1", "get 2 1"]
  Output: [0, 5, 1, 6, 0]
  Explanation: Snapshot 0 saw index 0 as 5, snapshot 1 saw it as 6, and index 2 was never set.
  ```

  ### Example 2
  ```
  Input:  length = 2, ops = ["snap", "snap", "set 1 -4", "snap", "get 1 1", "get 1 2"]
  Output: [0, 1, 2, 0, -4]
  Explanation: Index 1 was still 0 when snapshot 1 was taken and -4 when snapshot 2 was taken.
  ```

  ### Constraints
  - `1 <= length <= 10^5`
  - `1 <= ops.length <= 2 * 10^4`
  - `0 <= i < length`
  - `-10^9 <= v <= 10^9`
  - For every `get i s`, snapshot `s` has already been taken (`0 <= s < number of snaps so far`).
languages: [python, javascript, typescript, java, go, cpp]
