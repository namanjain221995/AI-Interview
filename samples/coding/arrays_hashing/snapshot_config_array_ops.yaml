expected_concepts:
  - per-index change history instead of full copies
  - recording the snapshot id with each change
  - binary search for the last change at or before a snapshot
  - overwriting repeated sets within the same snapshot epoch
optimal_complexity: {time: O(q log q), space: O(length + q)}
rubric:
  excellent: Stores a per-index list of (snapshot id, value) changes, overwrites the last entry when the id has not advanced, answers each get by binary search for the last change at or before the snapshot, and states O(log q) per get and memory proportional to the number of sets.
  good: Correct per-index history with a linear scan for gets, or the binary search version after fixing an off-by-one found by testing.
  weak: Copies the whole array on every snapshot, records changes against the wrong snapshot id, or returns values set after the requested snapshot.
  criteria:
    correctness: All tests pass, including sets after a snapshot and indices that were never set.
    efficiency: Memory grows with the number of sets and gets run in logarithmic time per query.
    code_quality: Operation parsing is clean and the history structure is clearly named.
    edge_cases: No snapshots, repeated sets before one snapshot, values reset to zero and many idle snapshots.
    communication: Explains why a change made before snapshot s is tagged with id s and how the search uses that.
hints:
  - Copying the whole array on every snapshot wastes memory when only a few values change. What is the minimum you need to remember for each index?
  - For each index, keep a history of changes tagged with the id the next snapshot will receive. A query then needs the latest change whose tag is not greater than the requested snapshot.
  - Give every index a list of pairs of snapshot id and value starting with id zero and value zero; on a set, overwrite the last pair if its id equals the current snapshot counter or append otherwise; on a get, binary search the list for the last pair with id at most s and return its value.
followups:
  - How would you support deleting old snapshots to reclaim memory?
  - What if values were large configuration documents rather than integers?
  - How would you persist this structure so it survives a restart?
  - How would the design change if reads vastly outnumber writes?
common_errors:
  - Taking a full copy of the array on every snapshot, which exceeds memory limits.
  - Tagging a change with the id of the previous snapshot, which leaks the change into a snapshot taken before it.
  - Appending a pair for every set within the same snapshot epoch and then searching for the first matching id, which returns a stale value.
  - Forgetting that indices never set must read as 0.
