reference_solutions:
  python: |
    from bisect import bisect_right


    def snapshot_config_array_ops(length: int, ops: list[str]) -> list[int]:
        # history[i] holds (snap_id, value) pairs in increasing snap_id order.
        history: list[list[tuple[int, int]]] = [[(0, 0)] for _ in range(length)]
        snap_id = 0
        out: list[int] = []
        for op in ops:
            parts = op.split()
            if parts[0] == "set":
                index, value = int(parts[1]), int(parts[2])
                entries = history[index]
                if entries[-1][0] == snap_id:
                    entries[-1] = (snap_id, value)
                else:
                    entries.append((snap_id, value))
            elif parts[0] == "snap":
                out.append(snap_id)
                snap_id += 1
            else:
                index, snap = int(parts[1]), int(parts[2])
                entries = history[index]
                pos = bisect_right(entries, (snap, float("inf"))) - 1
                out.append(entries[pos][1])
        return out
  javascript: |
    function snapshotConfigArrayOps(length, ops) {
      // history[i] holds [snapId, value] pairs in increasing snapId order.
      const history = Array.from({ length }, () => [[0, 0]]);
      let snapId = 0;
      const out = [];
      for (const op of ops) {
        const parts = op.split(" ");
        if (parts[0] === "set") {
          const entries = history[Number(parts[1])];
          const value = Number(parts[2]);
          if (entries[entries.length - 1][0] === snapId) entries[entries.length - 1][1] = value;
          else entries.push([snapId, value]);
        } else if (parts[0] === "snap") {
          out.push(snapId);
          snapId++;
        } else {
          const entries = history[Number(parts[1])];
          const snap = Number(parts[2]);
          let lo = 0, hi = entries.length - 1;
          while (lo < hi) {
            const mid = (lo + hi + 1) >> 1;
            if (entries[mid][0] <= snap) lo = mid;
            else hi = mid - 1;
          }
          out.push(entries[lo][1]);
        }
      }
      return out;
    }
