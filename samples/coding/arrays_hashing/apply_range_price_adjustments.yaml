slug: apply_range_price_adjustments
title: Bulk Range Price Adjustments
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, fullstack, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Bulk Range Price Adjustments

  A product catalog stores prices in cents, ordered by SKU position: `prices[i]` is the base price of the
  item at position `i`. The merchandising team submits a batch of bulk adjustments, where each entry
  `[l, r, delta]` adds `delta` cents (which may be negative) to **every** price at positions `l` through
  `r` **inclusive**.

  Apply the whole batch and return the final prices as a list of 64-bit integers in position order. The
  order in which adjustments are listed does not matter because they only add. Do not clamp results: a
  price that ends up below zero is returned as is (a later validation step flags it).

  Both the catalog and the batch can be large, so applying each adjustment position by position is too
  slow; aim for `O(n + q)` time where `q` is the number of adjustments.

  ### Example 1
  ```
  Input:  prices = [100, 250, 80, 40, 300], adjustments = [[0, 2, 15], [1, 4, -30], [3, 3, 5]]
  Output: [115, 235, 65, 15, 270]
  Explanation: Position 1 receives +15 and -30; position 3 receives -30 and +5.
  ```

  ### Example 2
  ```
  Input:  prices = [999], adjustments = []
  Output: [999]
  ```

  ### Constraints
  - `1 <= prices.length <= 10^5`
  - `0 <= prices[i] <= 10^12`
  - `0 <= adjustments.length <= 10^5`
  - `adjustments[j].length == 3` and `0 <= l <= r < prices.length`
  - `-10^6 <= delta <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: apply_range_price_adjustments
  params:
    - {name: prices, type: "long[]"}
    - {name: adjustments, type: "int[][]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def apply_range_price_adjustments(prices: list[int], adjustments: list[list[int]]) -> list[int]:
        n = len(prices)
        diff = [0] * (n + 1)  # diff[i] = change in the running delta at position i
        for left, right, delta in adjustments:
            diff[left] += delta
            diff[right + 1] -= delta
        result = []
        running = 0
        for i in range(n):
            running += diff[i]
            result.append(prices[i] + running)
        return result
  javascript: |
    function applyRangePriceAdjustments(prices, adjustments) {
      const n = prices.length;
      const diff = new Array(n + 1).fill(0); // change in the running delta at each position
      for (const [left, right, delta] of adjustments) {
        diff[left] += delta;
        diff[right + 1] -= delta;
      }
      const result = [];
      let running = 0;
      for (let i = 0; i < n; i++) {
        running += diff[i];
        result.push(prices[i] + running);
      }
      return result;
    }
