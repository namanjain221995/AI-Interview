expected_concepts: [difference array, prefix sum to materialize the running delta, O(n + q) instead of O(n * q), inclusive right boundary handled at r + 1, 64-bit arithmetic]
optimal_complexity: {time: O(n + q), space: O(n)}
rubric:
  excellent: Recognises the difference-array technique, marks +delta at l and -delta at r + 1 with a sentinel slot, rebuilds with one running sum, keeps everything in 64-bit integers and explains O(n + q) versus the O(n * q) loop.
  good: Correct difference-array solution after a hint, or fixes an off-by-one at the right boundary after running the tests.
  weak: Applies each adjustment position by position, mishandles the inclusive right end, or overflows 32-bit integers.
  criteria: {correctness: 'All tests pass, including empty batches, full-range adjustments and negative results.', efficiency: Each adjustment is recorded in constant time and the prices are rebuilt in one pass., code_quality: Clear names for the delta markers and the running total; no special-casing of the last index beyond a sentinel slot., edge_cases: 'Empty batch, adjustments touching the last index, cancelling adjustments and very large prices.', communication: Explains why a prefix sum of the markers equals the total delta at each position.}
hints: ['Instead of touching every position in a range, can you record only where the effect of an adjustment starts and where it stops?', 'Keep a separate array of changes: an adjustment adds its delta where the range begins and removes it just after the range ends. Walking that array with a running total gives the combined delta at each position.', 'Allocate a markers array one longer than the catalog. For each adjustment add delta at index l and subtract delta at index r plus one. Then walk the positions from left to right, accumulate the markers into a running total and add that total to each base price, using 64-bit integers throughout.']
followups: ['How would you answer ''what is the price at position i'' between adjustments if they arrive one at a time?', 'What data structure supports both range adjustments and range-sum queries online?', 'How would you extend the idea to rectangular adjustments on a two-dimensional grid?', 'What would change if adjustments were percentage changes instead of fixed amounts?']
common_errors: ['Subtracting the delta at index r instead of r + 1, which drops the adjustment from the last position of the range.', Indexing past the end of the markers array when r is the last position because no sentinel slot was allocated., Using 32-bit integers for prices or the running total., 'Applying each adjustment with a loop over its range, which is O(n * q) and times out on large batches.']
