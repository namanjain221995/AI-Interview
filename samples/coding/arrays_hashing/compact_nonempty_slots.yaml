time_limit_minutes: 12
prompt_markdown: |
  ## Compact Shelf Slots

  A storage shelf is modelled as an array `slots` of item ids, where `0` marks an empty slot. Before a
  stock count the shelf is compacted: every item is pushed towards the front of the shelf so that all
  empty slots end up at the back.

  Rearrange `slots` so that all non-zero item ids come first, **in the same relative order** as in the
  input, followed by all the zeros, and return the rearranged array. The array keeps its length.

  The intended solution rearranges the array **in place** using O(1) extra memory (returning the same
  array afterwards is fine).

  ### Example 1
  ```
  Input:  slots = [7, 0, 0, 12, 0, 4]
  Output: [7, 12, 4, 0, 0, 0]
  ```

  ### Example 2
  ```
  Input:  slots = [5, 0, 0]
  Output: [5, 0, 0]
  ```

  ### Example 3
  ```
  Input:  slots = [0, 0, 8, 8]
  Output: [8, 8, 0, 0]
  ```

  ### Constraints
  - `0 <= slots.length <= 10^5`
  - `0 <= slots[i] <= 10^9`

  **Follow-up:** Can you do it in one pass while minimising the number of writes to the array?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: compact_nonempty_slots
  params:
    - {name: slots, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def compact_nonempty_slots(slots: list[int]) -> list[int]:
        write = 0
        for read in range(len(slots)):
            if slots[read] != 0:
                slots[write], slots[read] = slots[read], slots[write]
                write += 1
        return slots
  javascript: |
    function compactNonemptySlots(slots) {
      let write = 0;
      for (let read = 0; read < slots.length; read++) {
        if (slots[read] !== 0) {
          const tmp = slots[write];
          slots[write] = slots[read];
          slots[read] = tmp;
          write++;
        }
      }
      return slots;
    }
