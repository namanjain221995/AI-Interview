expected_concepts:
  - "two pointers: read and write indices"
  - "stable partition preserving relative order"
  - "in-place update with O(1) extra memory"
  - "swap versus overwrite-then-fill"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Uses a read pointer and a write pointer to compact in place in one pass, preserves order, explains why it is stable, states O(n) time and O(1) memory and discusses swap versus overwrite-then-fill."
  good: "Correct in-place two-pointer solution, or a clear extra-array solution with a convincing plan for the in-place version."
  weak: "Removes and appends zeros inside the loop (quadratic and index-skipping bugs), breaks relative order, or changes the array length."
  criteria:
    correctness: "All tests pass, including all-zero and no-zero shelves."
    efficiency: "Linear time with constant extra memory."
    code_quality: "Readable pointer names such as read and write; no mutation of the array while iterating it with a for-each that changes length."
    edge_cases: "Empty array, single element, all zeros and duplicate ids."
    communication: "Explains the invariant that everything before the write pointer is final."
hints:
  - "Imagine walking along the shelf with one hand while the other hand marks the next position where an item should go."
  - "Use two indices: one that reads every slot and one that points to where the next non-zero item belongs; zeros simply get skipped by the reader."
  - "Advance a read index over the whole array and keep a write index starting at zero; whenever the read index finds a non-zero item, swap it into the write position and move the write index forward. Items keep their order because they are written in the order they are read, and the zeros collect behind them."
followups:
  - "Which approach writes to the array fewer times: swapping, or copying items forward and filling zeros at the end?"
  - "How would you compact the shelf if empty slots should move to the front instead?"
  - "What changes if the order of items does not need to be preserved?"
  - "How would you do this for a linked list of slots?"
common_errors:
  - "Deleting zeros and appending them while iterating, which skips elements and costs O(n^2)."
  - "Swapping items from the end into gaps, which breaks the relative order."
  - "Allocating a second array when the task asks for O(1) extra memory without acknowledging the trade-off."
  - "Returning only the non-zero items and changing the array length."
