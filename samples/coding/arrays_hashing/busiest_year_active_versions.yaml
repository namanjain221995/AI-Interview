version: 1
slug: busiest_year_active_versions
title: Year With the Most Supported Versions
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [platform, devops, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Year With the Most Supported Versions

  A platform team tracks the support window of every product version it has shipped. `spans[i] =
  [launch, retire]` means version `i` is supported in every year from `launch` up to and including
  `retire - 1`; it is **no longer** supported in year `retire`.

  Return the **earliest** year in which the number of supported versions is the greatest.

  ### Example 1
  ```
  Input:  spans = [[2001, 2005], [2003, 2008], [2004, 2006]]
  Output: 2004
  Explanation: In 2004 all three versions are supported.
  ```

  ### Example 2
  ```
  Input:  spans = [[2010, 2012], [2012, 2015]]
  Output: 2010
  Explanation: The first version retires in 2012, the year the second launches,
               so every supported year has exactly one version; the earliest is 2010.
  ```

  ### Constraints
  - `1 <= spans.length <= 10^4`
  - `spans[i].length == 2`
  - `1990 <= launch < retire <= 2100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: busiest_year_active_versions
  params:
    - {name: spans, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def busiest_year_active_versions(spans: list[list[int]]) -> int:
        first_year, last_year = 1990, 2100
        delta = [0] * (last_year - first_year + 1)
        for launch, retire in spans:
            delta[launch - first_year] += 1
            delta[retire - first_year] -= 1
        best_year, best_count, running = first_year, -1, 0
        for offset in range(last_year - first_year):  # supported years run up to 2099
            running += delta[offset]
            if running > best_count:
                best_count, best_year = running, first_year + offset
        return best_year
  javascript: |
    function busiestYearActiveVersions(spans) {
      const firstYear = 1990;
      const lastYear = 2100;
      const delta = new Array(lastYear - firstYear + 1).fill(0);
      for (const [launch, retire] of spans) {
        delta[launch - firstYear] += 1;
        delta[retire - firstYear] -= 1;
      }
      let bestYear = firstYear;
      let bestCount = -1;
      let running = 0;
      for (let offset = 0; offset < lastYear - firstYear; offset++) {
        running += delta[offset];
        if (running > bestCount) {
          bestCount = running;
          bestYear = firstYear + offset;
        }
      }
      return bestYear;
    }
