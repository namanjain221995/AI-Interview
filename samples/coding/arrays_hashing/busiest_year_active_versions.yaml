expected_concepts:
  - "difference array over a bounded range"
  - "prefix sum sweep"
  - "half-open intervals (retire year excluded)"
  - "earliest-year tie-breaking with a strict comparison"
optimal_complexity: {time: "O(n + Y) where Y = 111 years", space: "O(Y)"}
rubric:
  excellent: "Uses a difference array indexed by year offset, adds at launch and subtracts at retire, sweeps with a running total using a strict comparison for the earliest maximum, and explains why this beats incrementing every year of every span."
  good: "Correct solution that increments a counter for each year of each span (O(n * Y)) or sorts launch and retire events, with correct half-open handling."
  weak: "Counts the retire year as supported, returns the latest year among ties, or compares every year against every span without noting the cost."
  criteria:
    correctness: "All tests pass, including back-to-back spans, the 2099 boundary and ties between peaks."
    efficiency: "Linear in the number of spans plus the fixed year range."
    code_quality: "Named constants for the year bounds and clear offset arithmetic."
    edge_cases: "Single span, spans at both range limits, identical spans and equal peaks."
    communication: "States the half-open interval rule and how ties are resolved."
hints:
  - "The range of possible years is tiny and fixed, so you can afford to keep a number for every single year."
  - "Rather than adding one to every year of every span, record only where each span starts counting and where it stops, then recover the per-year totals with a running sum."
  - "Use an array indexed by year minus 1990, add one at each launch year and subtract one at each retire year, then sweep the years in increasing order with a running total and remember the first year whose total is strictly greater than the best seen so far."
followups:
  - "How would you solve it if the years were unbounded, for example timestamps in seconds?"
  - "How would you return every year that reaches the maximum instead of the earliest one?"
  - "What changes if the retire year is also counted as supported?"
common_errors:
  - "Treating the retire year as supported, which merges back-to-back spans into a false overlap."
  - "Using a greater-or-equal comparison during the sweep, which returns the latest year among ties."
  - "Sizing the difference array too small so a retire year of 2100 falls outside it."
