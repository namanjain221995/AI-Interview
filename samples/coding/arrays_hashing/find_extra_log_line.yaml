rubric:
  excellent: "Counts lines of the second capture, subtracts the first, returns the line with a positive remainder, explains why a set difference fails for duplicates and states the complexity in terms of total characters."
  good: "Correct counting or sorting solution, possibly after a nudge about the duplicate case."
  weak: "Uses a set difference that misses duplicated extra lines, compares positions instead of contents, or uses a quadratic list removal."
