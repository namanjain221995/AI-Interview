    correctness: "All tests pass, including the case where the extra line duplicates an existing one."
    efficiency: "Linear in the total input size with hashing, or O(n log n) comparisons with sorting."
    code_quality: "Simple counting code with a single return point for the answer."
    edge_cases: "Empty first capture, all lines identical and lines differing only in case or spacing."
    communication: "Explains why the order of lines cannot be relied on and why a set is not enough."
hints:
  - "The order of the lines is not reliable, and the extra line can be a copy of one you have already seen, so think about what a plain set would miss."
  - "Track how many times each distinct line appears in the second capture and compare that with the first capture."
  - "Build a map from line to count over the second capture, decrease the count for every line of the first capture, and return the only line whose count is still above zero."
