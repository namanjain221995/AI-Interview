  - "How would you report every extra and every missing line if the captures could differ in many places?"
  - "If both captures were too large for memory, how could you find the extra line?"
  - "Would hashing each line and combining the hashes with XOR be safe? What could go wrong?"
  - "How would the solution change if lines could also be lost, not only added?"
common_errors:
  - "Using a set difference, which returns nothing when the extra line duplicates an existing line."
  - "Comparing the captures position by position even though the order changed."
  - "Removing each matched line from a list with a linear search, which is quadratic."
  - "Normalising case or whitespace, which merges lines that are actually different."
