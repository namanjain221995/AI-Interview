version: 1
slug: find_extra_log_line
title: "The Extra Log Line"
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [qa, devops, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## The Extra Log Line

  A batch job writes one log line per request. After an automatic retry you capture the log again. The
  second capture `after` contains **every** line of the first capture `before` (possibly in a different
  order) plus **exactly one** additional line. The additional line may be brand new, or it may be an exact
  copy of a line that already appears one or more times.

  Return the additional line. Lines are compared exactly, character by character (case and spaces
  matter).

  ### Example 1
  ```
  Input:  before = ["GET /health 200", "POST /orders 201"], after = ["POST /orders 201", "GET /health 200", "GET /health 200"]
  Output: "GET /health 200"
  Explanation: GET /health 200 appears once before the retry and twice after it
  ```

  ### Example 2
  ```
  Input:  before = ["deploy started", "deploy finished"], after = ["deploy finished", "cache warmed", "deploy started"]
  Output: "cache warmed"
  ```

  ### Constraints
  - `0 <= before.length <= 10^4`
  - `after.length == before.length + 1`
  - `1 <= line.length <= 200`, printable ASCII
  - `after` is a reordering of `before` plus exactly one extra line
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_extra_log_line
  params:
    - {name: before, type: "string[]"}
    - {name: after, type: "string[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def find_extra_log_line(before: list[str], after: list[str]) -> str:
        counts = Counter(after)
        counts.subtract(before)
        for line, count in counts.items():
            if count > 0:
                return line
        return ""
  javascript: |
    function findExtraLogLine(before, after) {
      const counts = new Map();
      for (const line of after) counts.set(line, (counts.get(line) || 0) + 1);
      for (const line of before) counts.set(line, counts.get(line) - 1);
      for (const [line, count] of counts) {
        if (count > 0) return line;
      }
      return "";
    }
