rubric:
  excellent: Parses each token cleanly, groups full paths by content in one hash map, drops singleton groups, states linear time and space, and discusses how a real deduplicator would hash large files in stages.
  good: Correct hash-map grouping with minor parsing slips fixed after a test run; complexity stated when asked.
