version: 1
slug: duplicate_payload_groups
title: Duplicate Artifacts by Content
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, devops, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Duplicate Artifacts by Content

  A storage audit of a build cache produces one line per directory. Each line starts with the
  directory path, followed by one or more files written as `name(content)`, all separated by single
  spaces. For example, `"builds/web index.js(a91f) app.css(07bc)"` describes the file
  `builds/web/index.js` with content `a91f` and the file `builds/web/app.css` with content `07bc`.

  Find the wasted space: return every group of **two or more** full paths whose contents are exactly
  identical. A full path is the directory, a `/`, and the file name.

  - Files whose content is unique are not reported. Return `[]` when there are no duplicates.
  - Groups may be returned in any order, and the paths inside a group in any order.
  - Contents are compared as whole strings: `ab` and `abc` are different contents.

  ### Example 1
  ```
  Input:  entries = ["releases/v1 app.tar(c0ffee) notes.txt(a1b2)", "releases/v2 app.tar(c0ffee) notes.txt(d4e5)", "cache old.txt(a1b2) app.tar(c0ffee)"]
  Output: [["releases/v1/app.tar", "releases/v2/app.tar", "cache/app.tar"], ["releases/v1/notes.txt", "cache/old.txt"]]
  ```

  ### Example 2
  ```
  Input:  entries = ["logs a.log(x1) b.log(x2)", "tmp c.log(x3)"]
  Output: []
  ```

  ### Constraints
  - `0 <= entries.length <= 1000`
  - Every entry has a directory followed by at least one file token; tokens are separated by single spaces.
  - Directory paths and file names use letters, digits, `.`, `_` and `-` (directories may also contain `/`, never as the last character); they contain no spaces or parentheses.
  - Every content is 1 to 50 lowercase letters or digits.
  - The total number of files is at most `10^4`, and every full path appears at most once.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: duplicate_payload_groups
  params:
  - {name: entries, type: 'string[]'}
  return_type: string[][]
  comparison: unordered
reference_solutions:
  python: |
    def duplicate_payload_groups(entries: list[str]) -> list[list[str]]:
        by_content: dict[str, list[str]] = {}
        for entry in entries:
            directory, *files = entry.split(" ")
            for token in files:
                open_at = token.index("(")
                name = token[:open_at]
                content = token[open_at + 1 : -1]
                by_content.setdefault(content, []).append(directory + "/" + name)
        return [paths for paths in by_content.values() if len(paths) >= 2]
  javascript: |
    function duplicatePayloadGroups(entries) {
      const byContent = new Map();
      for (const entry of entries) {
        const tokens = entry.split(" ");
        const directory = tokens[0];
        for (let i = 1; i < tokens.length; i++) {
          const token = tokens[i];
          const openAt = token.indexOf("(");
          const name = token.slice(0, openAt);
          const content = token.slice(openAt + 1, token.length - 1);
          if (!byContent.has(content)) byContent.set(content, []);
          byContent.get(content).push(directory + "/" + name);
        }
      }
      const groups = [];
      for (const paths of byContent.values()) {
        if (paths.length >= 2) groups.push(paths);
      }
      return groups;
    }
