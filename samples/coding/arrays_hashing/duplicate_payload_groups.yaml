  criteria: {correctness: 'All tests pass, including prefix-like contents and empty input.', efficiency: One pass over all files with a hash map; no pairwise comparison of files., code_quality: 'Parsing is isolated and readable; variable names describe directory, name and content.', edge_cases: 'Empty input, single files, all-identical directories and same names in different directories.', communication: Explains the parsing contract and why the content string is the grouping key.}
