time_limit_minutes: 20
prompt_markdown: |
  ## Quarantine Faulty Sensor Lines

  A factory floor is monitored by an `m x n` grid of sensors. Sensors in the same row share a power line
  and sensors in the same column share a data bus. A reading of `0` means the sensor reported a fault.

  Before the readings go to the dashboard, every line touched by a fault is quarantined:

  - If a sensor reads `0`, set **every** reading in its row and **every** reading in its column to `0`.
  - Only faults present in the **original** grid count. Zeros written during quarantine do not spread
    further.
  - All other readings are returned unchanged.

  Return the resulting grid. You may modify `grid` in place and return it.

  ### Example 1
  ```
  Input:  grid = [[3, 1, 4], [1, 0, 9], [2, 6, 5]]
  Output: [[3, 0, 4], [0, 0, 0], [2, 0, 5]]
  Explanation: The fault at row 1, column 1 clears row 1 and column 1.
  ```

  ### Example 2
  ```
  Input:  grid = [[0, 2, 3, 0], [4, 5, 6, 7], [8, 9, 1, 2]]
  Output: [[0, 0, 0, 0], [0, 5, 6, 0], [0, 9, 1, 0]]
  Explanation: Both faults sit in row 0, so row 0, column 0 and column 3 are cleared; zeros written there do not clear rows 1 and 2.
  ```

  ### Constraints
  - `1 <= m, n <= 200` where `m = grid.length` and `n = grid[i].length`
  - All rows have the same length.
  - `-10^6 <= grid[i][j] <= 10^6`

  **Follow-up:** an `O(m + n)` memory solution is straightforward; can you use only `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: quarantine_sensor_lines
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def quarantine_sensor_lines(grid: list[list[int]]) -> list[list[int]]:
        m, n = len(grid), len(grid[0])
        first_row_faulty = any(grid[0][c] == 0 for c in range(n))
        first_col_faulty = any(grid[r][0] == 0 for r in range(m))
        # Use the first row and column as markers for the rest of the grid.
        for r in range(1, m):
            for c in range(1, n):
                if grid[r][c] == 0:
                    grid[r][0] = 0
                    grid[0][c] = 0
        for r in range(1, m):
            for c in range(1, n):
                if grid[r][0] == 0 or grid[0][c] == 0:
                    grid[r][c] = 0
        if first_row_faulty:
            for c in range(n):
                grid[0][c] = 0
        if first_col_faulty:
            for r in range(m):
                grid[r][0] = 0
        return grid
  javascript: |
    function quarantineSensorLines(grid) {
      const m = grid.length, n = grid[0].length;
      const firstRowFaulty = grid[0].some((v) => v === 0);
      const firstColFaulty = grid.some((row) => row[0] === 0);
      // Use the first row and column as markers for the rest of the grid.
      for (let r = 1; r < m; r++) {
        for (let c = 1; c < n; c++) {
          if (grid[r][c] === 0) {
            grid[r][0] = 0;
            grid[0][c] = 0;
          }
        }
      }
      for (let r = 1; r < m; r++) {
        for (let c = 1; c < n; c++) {
          if (grid[r][0] === 0 || grid[0][c] === 0) grid[r][c] = 0;
        }
      }
      if (firstRowFaulty) for (let c = 0; c < n; c++) grid[0][c] = 0;
      if (firstColFaulty) for (let r = 0; r < m; r++) grid[r][0] = 0;
      return grid;
    }
