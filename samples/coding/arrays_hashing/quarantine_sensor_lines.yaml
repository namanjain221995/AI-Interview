expected_concepts:
  - separating detection from writing so new zeros do not spread
  - row and column fault flags (O(m + n) memory)
  - reusing the first row and column as marker storage for O(1) memory
  - handling the first row and column with separate flags
optimal_complexity: {time: O(m * n), space: O(1)}
rubric:
  excellent: Explains why decisions must use only original faults, presents the O(m + n) flag solution, then the in-place marker version using the first row and column with separate flags for them, and states O(m * n) time and O(1) extra space.
  good: Correct O(m + n) memory solution with row and column flags, or the O(1) version after fixing a first-row or first-column bug.
  weak: Zeros spread through the grid because new zeros are treated as faults, copies the whole grid without reasoning, or mishandles the first row and column.
  criteria:
    correctness: All tests pass, including faults in the first row, first column and corners.
    efficiency: A constant number of passes over the grid; memory beyond the grid is O(m + n) or O(1).
    code_quality: The marking and clearing phases are clearly separated and named.
    edge_cases: Single row, single column, no faults, all faults.
    communication: Explains the cascade problem and how the marker approach avoids it.
hints:
  - If you start writing zeros as soon as you find a fault, later checks may mistake those new zeros for original faults. Separate finding from writing.
  - It is enough to know which rows and which columns contain an original fault; record that first, then clear in a second pass.
  - For constant memory, store the row and column fault marks in the first column and first row of the grid itself, remember separately whether the first row and first column originally had a fault, clear the inner cells from the marks, and handle the first row and column last.
followups:
  - Why must the first row and first column be cleared last in the in-place version?
  - How would you handle a sparse grid with millions of sensors but only a few faults?
  - What if a fault should only clear its row and column within a radius of k sensors?
  - How would you process the grid if it arrives one row at a time from a stream?
common_errors:
  - Writing zeros immediately while scanning, so the whole grid cascades to zero.
  - In the in-place version, using one shared corner cell as the mark for both the first row and the first column.
  - Clearing the first row or column before the inner cells, which destroys the marks.
  - Assuming the grid is square.
