time_limit_minutes: 30
prompt_markdown: |
  ## Most Independent Sort Batches

  A release-tracking service stores a long list of build numbers and needs them in non-decreasing order.
  To parallelise the work, the list is cut into **contiguous batches**; each batch is sorted on its own
  worker and the sorted batches are concatenated back together in their original order.

  Given `versions`, return the **largest number of batches** you can cut the list into so that the
  concatenated result equals the whole list sorted in non-decreasing order. Duplicate build numbers are
  allowed. Every element belongs to exactly one batch, and a single batch containing the whole list is
  always valid.

  ### Example 1
  ```
  Input:  versions = [9, 7, 5, 3, 1]
  Output: 1
  Explanation: any cut leaves a larger number in front of a smaller one, so only one batch works.
  ```

  ### Example 2
  ```
  Input:  versions = [2, 1, 3, 4, 4]
  Output: 4
  Explanation: [2, 1] | [3] | [4] | [4]
  ```

  ### Example 3
  ```
  Input:  versions = [1, 3, 2, 3, 5, 4]
  Output: 4
  Explanation: [1] | [3, 2] | [3] | [5, 4]
  ```

  ### Constraints
  - `1 <= versions.length <= 10^5`
  - `0 <= versions[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_independent_sort_batches
  params:
    - {name: versions, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def max_independent_sort_batches(versions: list[int]) -> int:
        n = len(versions)
        suffix_min = versions[:]
        for i in range(n - 2, -1, -1):
            suffix_min[i] = min(versions[i], suffix_min[i + 1])
        batches = 1
        prefix_max = versions[0]
        for i in range(n - 1):
            prefix_max = max(prefix_max, versions[i])
            if prefix_max <= suffix_min[i + 1]:
                batches += 1
        return batches
  javascript: |
    function maxIndependentSortBatches(versions) {
      const n = versions.length;
      const suffixMin = versions.slice();
      for (let i = n - 2; i >= 0; i--) suffixMin[i] = Math.min(versions[i], suffixMin[i + 1]);
      let batches = 1;
      let prefixMax = versions[0];
      for (let i = 0; i < n - 1; i++) {
        prefixMax = Math.max(prefixMax, versions[i]);
        if (prefixMax <= suffixMin[i + 1]) batches++;
      }
      return batches;
    }
