expected_concepts:
  - "a cut is valid when everything before it is at most everything after it"
  - "prefix maximum compared with suffix minimum"
  - "handling duplicates with a non-strict comparison"
  - "counting valid cut positions independently"
  - "monotonic stack alternative that merges batches"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "States the cut condition (prefix maximum at most suffix minimum), proves cuts are independent so every valid cut can be taken, implements it in O(n) with duplicates handled and mentions the monotonic stack alternative."
  good: "Implements the prefix-maximum and suffix-minimum idea correctly, possibly fixing the comparison for duplicates after a failing test."
  weak: "Assumes distinct values or a permutation, compares sorted positions without handling duplicates, or tries all ways to cut the list."
  criteria:
    correctness: "All tests pass, including all-equal values, already sorted input and a small value at the end."
    efficiency: "Linear time with two passes, or O(n log n) by comparing against the sorted list with a clear argument."
    code_quality: "Clear names for the running maximum and the suffix minimum array; no needless copies of the whole list per position."
    edge_cases: "Single element, duplicates across a boundary and extreme values."
    communication: "Explains why choosing every valid cut gives the maximum number of batches."
hints:
  - "Consider a single cut between two positions: what must be true about the numbers on its left compared with the numbers on its right?"
  - "A cut is safe exactly when the largest value before it is no larger than the smallest value after it, and safe cuts do not interfere with each other."
  - "Precompute the minimum of every suffix, then scan from the left keeping the running maximum and count each position where that maximum is at most the minimum of the remaining suffix; the answer is that count plus one."
followups:
  - "How would you return the batch boundaries themselves instead of just the count?"
  - "Can you solve it with a single pass and a stack instead of a suffix array?"
  - "What changes if the list must end up in non-increasing order?"
  - "How would you balance the batches if there were a fixed number of workers?"
common_errors:
  - "Using a strict comparison, which refuses to cut between equal build numbers."
  - "Assuming the values form a permutation of 0 to n minus 1 and comparing with the index."
  - "Comparing each element only with its neighbour instead of with the whole prefix and suffix."
  - "Forgetting to count the final batch, returning one less than the answer."
