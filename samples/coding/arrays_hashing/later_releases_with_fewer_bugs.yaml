reference_solutions:
  python: |
    def later_releases_with_fewer_bugs(bugs: list[int]) -> list[int]:
        # Compress values to ranks 1..m, then sweep from the right with a Fenwick tree.
        ranks = {value: rank for rank, value in enumerate(sorted(set(bugs)), start=1)}
        size = len(ranks)
        tree = [0] * (size + 1)

        def add(position: int) -> None:
            while position <= size:
                tree[position] += 1
                position += position & -position

        def prefix(position: int) -> int:
            total = 0
            while position > 0:
                total += tree[position]
                position -= position & -position
            return total

        result = [0] * len(bugs)
        for i in range(len(bugs) - 1, -1, -1):
            rank = ranks[bugs[i]]
            result[i] = prefix(rank - 1)
            add(rank)
        return result
  javascript: |
    function laterReleasesWithFewerBugs(bugs) {
      const sorted = [...new Set(bugs)].sort((a, b) => a - b);
      const ranks = new Map();
      sorted.forEach((value, index) => ranks.set(value, index + 1));
      const size = sorted.length;
      const tree = new Array(size + 1).fill(0);
      const add = (position) => {
        for (; position <= size; position += position & -position) tree[position] += 1;
      };
      const prefix = (position) => {
        let total = 0;
        for (; position > 0; position -= position & -position) total += tree[position];
        return total;
      };
      const result = new Array(bugs.length).fill(0);
      for (let i = bugs.length - 1; i >= 0; i--) {
        const rank = ranks.get(bugs[i]);
        result[i] = prefix(rank - 1);
        add(rank);
      }
      return result;
    }
