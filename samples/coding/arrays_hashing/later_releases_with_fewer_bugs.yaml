expected_concepts:
  - "process releases from the right and query how many smaller values were seen"
  - "Fenwick (binary indexed) tree or merge sort with index tracking"
  - "coordinate compression of large values"
  - "strict comparison with ties"
  - "O(n log n) versus the O(n^2) brute force"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Explains the O(n^2) baseline, then implements a right-to-left Fenwick tree with coordinate compression (or merge sort carrying original indices), handles ties strictly, and justifies O(n log n)."
  good: "Correct O(n log n) approach with guidance, or a clear plan for it plus a correct quadratic solution."
  weak: "Only the nested-loop solution, counts equal values as fewer, or indexes an array directly by values up to 10^9."
  criteria:
    correctness: "All tests pass, including ties, empty input and large values."
    efficiency: "O(n log n) time and O(n) space after compression."
    code_quality: "The tree operations are small helpers; the rank mapping is built once."
    edge_cases: "Empty and single-element inputs, monotone sequences and repeated values."
    communication: "Explains why querying before inserting the current release excludes it from its own count."
hints:
  - "Think about walking from the most recent release backwards and asking a question about the releases you have already passed."
  - "While scanning from the right, you need to know how many already-seen counts are strictly below the current one, and to add the current one afterwards; a structure supporting both in logarithmic time over compressed ranks does this."
  - "Map each distinct bug count to its rank in sorted order, then go from the last release to the first; for each release query a binary indexed tree for how many ranks below its own have been added, store that as its answer, and then add its rank to the tree."
followups:
  - "How would the merge-sort version keep track of original positions?"
  - "How would you count later releases with strictly more bugs instead?"
  - "What if releases arrive one by one and you must answer for earlier releases on demand?"
common_errors:
  - "Counting equal bug counts as fewer by querying the current rank instead of the rank below it."
  - "Adding the current release to the tree before querying, so it counts itself."
  - "Allocating a tree indexed by raw values up to 10^9 instead of compressing."
  - "Sorting the input and losing the mapping back to original positions."
