time_limit_minutes: 35
prompt_markdown: |
  ## Later Releases With Fewer Bugs

  The QA team tracks how many bugs were reported against each release. `bugs[i]` is the bug count of the
  `i`-th release in chronological order.

  For every release, count how many **later** releases had **strictly fewer** bugs than it did. Return an
  array `result` of the same length where `result[i]` is the number of indices `j > i` with
  `bugs[j] < bugs[i]`.

  - Releases with an equal bug count are not counted.
  - Return an empty array for an empty input.

  **Goal:** an `O(n log n)` solution.

  ### Example 1
  ```
  Input:  bugs = [4, 1, 3, 1, 0]
  Output: [4, 1, 2, 1, 0]
  Explanation: Release 0 (4 bugs) is followed by 1, 3, 1 and 0, all fewer. Release 2 (3 bugs) is followed by 1 and 0.
  ```

  ### Example 2
  ```
  Input:  bugs = [2, 2, 2]
  Output: [0, 0, 0]
  Explanation: Equal counts never count as fewer.
  ```

  ### Constraints
  - `0 <= bugs.length <= 10^5`
  - `0 <= bugs[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
