slug: unpaired_request_id
title: The Request Without a Response
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, network, general]
time_limit_minutes: 12
prompt_markdown: |
  ## The Request Without a Response

  A tracing proxy logs a request id when a request leaves a service and logs the same id again when
  the matching response comes back. You receive the captured ids in `ids`, in arbitrary order. Every id
  appears **exactly twice**, except for one request that never received a response: its id appears
  **exactly once**.

  Return the id of the request without a response.

  ### Example 1
  ```
  Input:  ids = [7, 3, 9, 3, 7]
  Output: 9
  Explanation: 7 and 3 both appear twice; 9 appears once.
  ```

  ### Example 2
  ```
  Input:  ids = [42]
  Output: 42
  ```

  ### Example 3
  ```
  Input:  ids = [5, 1000000, 8, 5, 8]
  Output: 1000000
  ```

  ### Constraints
  - `1 <= ids.length < 10^5`, and `ids.length` is odd
  - `0 <= ids[i] <= 2^31 - 1`
  - Exactly one id appears once; every other id appears exactly twice.

  **Follow-up:** can you do it in `O(n)` time with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: unpaired_request_id
  params:
    - {name: ids, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def unpaired_request_id(ids: list[int]) -> int:
        lonely = 0
        for request_id in ids:
            lonely ^= request_id  # equal ids cancel out
        return lonely
  javascript: |
    function unpairedRequestId(ids) {
      let lonely = 0;
      for (const id of ids) lonely ^= id; // equal ids cancel out
      return lonely;
    }
