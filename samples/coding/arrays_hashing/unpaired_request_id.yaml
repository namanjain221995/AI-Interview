expected_concepts:
  - XOR of equal values is zero
  - XOR is commutative and associative, so order does not matter
  - constant extra space
  - hash map or set baseline with O(n) space
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Starts from a counting or set baseline, then derives the XOR solution with O(1) space and explains why pairs cancel regardless of order.
  good: Correct hash-set or counting solution in O(n) time, or the XOR solution with a partial explanation.
  weak: Sorts and compares neighbours incorrectly, uses nested loops, or assumes the pairs are adjacent.
  criteria:
    correctness: All tests pass, including an unpaired id of 0 and ids at the 32-bit limit.
    efficiency: Linear time; constant extra space for the follow-up.
    code_quality: Single accumulator with a clear name; no unnecessary data structures.
    edge_cases: Single entry, unpaired id at either end and the value 0.
    communication: Explains the cancellation property behind XOR.
hints:
  - A simple first version can count how often each id appears; what is the space cost of that?
  - Look for an operation that cancels a value combined with itself and does not care about the order in which values are combined.
  - Start an accumulator at zero and fold every id into it with bitwise XOR; every paired id cancels itself out, so only the id that appears once remains.
followups:
  - What if every id appeared three times except one?
  - What if two different requests were missing responses?
  - How would you find the unpaired id if the trace were too large to fit in memory?
common_errors:
  - Assuming the request and response ids are adjacent in the trace.
  - Sorting the ids and stepping by two without handling the unpaired id at the end.
  - Using addition and subtraction tricks that overflow or fail when the order is arbitrary.
