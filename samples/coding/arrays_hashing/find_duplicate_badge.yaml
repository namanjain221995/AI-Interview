expected_concepts: [pigeonhole principle, viewing the array as a linked structure from index to value, Floyd cycle detection (tortoise and hare), finding the cycle entrance, 'alternative: binary search on the value range by counting', not mutating the input]
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Starts from the set or sort baseline, explains why the constraints rule it out, models the list as a functional graph whose cycle entrance is the clone, implements both phases of Floyd's algorithm correctly and states O(n) time and O(1) space; may also mention binary search on values as an O(n log n) constant-space alternative.
  good: Reaches a constant-space, non-mutating solution such as binary search on the value range with counting, or Floyd's algorithm with some guidance.
  weak: Uses a hash set or sorts or marks the input in place despite the requirement, or the cycle-detection solution returns the meeting point instead of the cycle entrance.
  criteria: {correctness: 'All tests pass, including a clone that appears many times and n = 1.', efficiency: Linear time and constant extra space without touching the input., code_quality: Two clearly separated phases with meaningful names for the slow and fast pointers., edge_cases: 'Clone at the first or last position, clone equal to 1 or n and several missing numbers.', communication: Explains why a repeated value creates a cycle and why restarting one pointer finds its entrance.}
hints: ['With n + 1 entries drawn from only n possible numbers, a repeat must exist. Without extra memory and without changing the list, what structure could the values themselves describe?', 'Read each entry as a pointer from its position to the position named by its value. Because two positions point at the same place, following the pointers from position zero must eventually run into a cycle, and the cycle starts at the cloned number.', 'Use a slow pointer that follows one link per step and a fast pointer that follows two until they meet inside the cycle. Then restart one pointer at the beginning and advance both one link per step; the value where they meet again is the entrance of the cycle, which is the cloned badge number.']
followups: ['Why does restarting one pointer from the beginning lead both pointers to the cycle entrance?', 'How would a binary search over the range 1 to n work here, and what is its complexity?', 'Why does the same approach fail if values could be 0 or larger than n?', 'How would you find all repeated numbers if more than one badge could be cloned?']
common_errors: [Returning the first meeting point of the two pointers instead of running the second phase., 'Sorting or negating entries in place, which violates the no-modification requirement.', 'Using the sum formula, which only works when the clone appears exactly twice and nothing is missing.', 'Starting the pointers from index 1 or confusing indices with values, which can loop forever.']
