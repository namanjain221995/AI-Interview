title: The Cloned Badge Number
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [security, backend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## The Cloned Badge Number

  A building has `n` access badges numbered `1` to `n`. During an audit, the door controllers export a
  scan list `badges` with exactly `n + 1` entries, each a badge number between `1` and `n`. Every badge
  number appears **at most once**, except for one cloned badge number that appears **two or more times**
  (some badge numbers may therefore be missing from the list).

  Return the cloned badge number.

  The audit tool runs on a constrained appliance, so your solution **must not modify** `badges` and
  should use only **constant extra memory**. Sorting a copy or storing seen numbers in a set is a valid
  starting point but does not meet that requirement.

  ### Example 1
  ```
  Input:  badges = [2, 5, 1, 4, 5, 3]
  Output: 5
  Explanation: Badge 5 was scanned twice.
  ```

  ### Example 2
  ```
  Input:  badges = [4, 4, 1, 4, 2]
  Output: 4
  Explanation: Badge 4 appears three times; badge 3 never appears.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `badges.length == n + 1`
  - `1 <= badges[i] <= n`
  - Exactly one badge number appears more than once; all others appear at most once.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_duplicate_badge
  params:
    - {name: badges, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def find_duplicate_badge(badges: list[int]) -> int:
        # Treat badges as a function i -> badges[i]; the cloned number is where the cycle starts.
        slow = fast = badges[0]
        while True:
            slow = badges[slow]
            fast = badges[badges[fast]]
            if slow == fast:
                break
        slow = badges[0]
        while slow != fast:
            slow = badges[slow]
            fast = badges[fast]
        return slow
  javascript: |
    function findDuplicateBadge(badges) {
      // Treat badges as a function i -> badges[i]; the cloned number is where the cycle starts.
      let slow = badges[0];
      let fast = badges[0];
      do {
        slow = badges[slow];
        fast = badges[badges[fast]];
      } while (slow !== fast);
      slow = badges[0];
      while (slow !== fast) {
        slow = badges[slow];
        fast = badges[fast];
      }
      return slow;
    }
