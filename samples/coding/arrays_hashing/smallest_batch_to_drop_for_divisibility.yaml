    - {name: p, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def smallest_batch_to_drop_for_divisibility(batches: list[int], p: int) -> int:
        need = sum(batches) % p  # remainder the removed run must have
        if need == 0:
            return 0
        last_index = {0: -1}  # prefix remainder -> latest index where it occurred
        prefix = 0
        best = len(batches)
        for i, units in enumerate(batches):
            prefix = (prefix + units) % p
            wanted = (prefix - need) % p
            if wanted in last_index:
                best = min(best, i - last_index[wanted])
            last_index[prefix] = i
        return -1 if best == len(batches) else best
  javascript: |
    function smallestBatchToDropForDivisibility(batches, p) {
      let need = 0;
      for (const units of batches) need = (need + units) % p;
      if (need === 0) return 0;
      const lastIndex = new Map([[0, -1]]);
      let prefix = 0;
      let best = batches.length;
      for (let i = 0; i < batches.length; i++) {
        prefix = (prefix + batches[i]) % p;
        const wanted = (prefix - need + p) % p;
        if (lastIndex.has(wanted)) best = Math.min(best, i - lastIndex.get(wanted));
        lastIndex.set(prefix, i);
      }
      return best === batches.length ? -1 : best;
    }
