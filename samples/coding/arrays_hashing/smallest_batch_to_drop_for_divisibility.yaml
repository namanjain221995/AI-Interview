expected_concepts:
  - "the removed run must have the same remainder modulo p as the total"
  - "prefix sums modulo p to describe every contiguous run"
  - "hash map from prefix remainder to its latest index to get the shortest run"
  - "disallowing removal of the whole array and keeping sums bounded with modulo"
optimal_complexity: {time: "O(n)", space: "O(min(n, p))"}
rubric:
  excellent: "Derives that the dropped run must leave remainder zero, so its sum must be congruent to the total modulo p; uses prefix remainders with a map of the latest index, handles negative modulo in languages that need it, rejects removing everything and states O(n)."
  good: "Correct prefix-remainder solution after a nudge, with a small fix such as storing the first index instead of the latest or forgetting the full-array rule."
  weak: "Tries all runs in O(n^2), computes the total without guarding against overflow, or returns n instead of -1 when only the whole array works."
  criteria:
    correctness: "All tests pass, including already-divisible totals, impossible cases and p = 1."
    efficiency: "Single pass with a hash map keyed by prefix remainder."
    code_quality: "Keeps values reduced modulo p; clear names for the needed remainder and prefix remainder."
    edge_cases: "Single batch, p larger than the total, large values and the whole-array restriction."
    communication: "Explains why the latest index (not the first) gives the shortest run."
hints:
  - "Instead of thinking about what remains, think about what the removed run must look like in terms of remainders modulo p."
  - "The removed run's sum must have the same remainder as the whole total; any contiguous run's sum is a difference of two prefix sums, so look at prefix sums modulo p."
  - "Compute the needed remainder from the total, then walk the batches keeping a running prefix remainder and a map from each remainder to the most recent index where it appeared (seeded with remainder zero at index minus one); at each step look up the remainder that is the current prefix minus the need, modulo p, track the shortest gap, and reject an answer equal to the full length."
followups:
  - "Why do you store the most recent index of each remainder rather than the first?"
  - "How would the answer change if you could hold back any set of batches, not just a contiguous run?"
  - "What if you had to hold back at least one batch even when the total is already divisible?"
  - "How would you return which run to hold back, preferring the earliest one on ties?"
common_errors:
  - "Allowing the whole array to be removed and returning n instead of -1."
  - "Using the first occurrence of a prefix remainder, which yields longer runs than necessary."
  - "Negative results from the remainder operator in JavaScript, Java, Go or C++ when subtracting the need."
  - "Summing all batches in a 32-bit integer, which overflows."
