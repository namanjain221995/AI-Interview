time_limit_minutes: 20
prompt_markdown: |
  ## Drop a Run of Batches to Fill Pallets Exactly

  A warehouse receives a shipment as a sequence of batches, where `batches[i]` is the number of units in
  the `i`-th batch in arrival order. Units are loaded onto pallets that each hold exactly `p` units, and
  the dock only accepts the shipment when **every pallet is full**, i.e. the total number of units is
  divisible by `p`.

  You may hold back **one contiguous run** of batches (possibly an empty run) to make the remaining total
  divisible by `p`. Holding back **every** batch is not allowed. Return the **length of the shortest run**
  to hold back, `0` if the total is already divisible, or `-1` if it is impossible.

  ### Example 1
  ```
  Input:  batches = [6, 3, 5, 2], p = 9
  Output: 2
  Explanation: The total is 16. Holding back [5, 2] leaves 6 + 3 = 9 units, which fills one pallet. No
               single batch works.
  ```

  ### Example 2
  ```
  Input:  batches = [4, 4, 4], p = 3
  Output: 0
  Explanation: The total of 12 units is already divisible by 3.
  ```

  ### Example 3
  ```
  Input:  batches = [1, 2, 3], p = 7
  Output: -1
  Explanation: Only holding back every batch would leave a total divisible by 7, which is not allowed.
  ```

  ### Constraints
  - `1 <= batches.length <= 10^5`
  - `1 <= batches[i] <= 10^9`
  - `1 <= p <= 10^9`
  - The total number of units may exceed the 32-bit integer range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_batch_to_drop_for_divisibility
  params:
