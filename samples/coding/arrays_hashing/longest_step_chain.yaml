title: "Longest Fixed-Step Build Chain"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, devops, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Fixed-Step Build Chain

  A deployment log lists the build numbers that were rolled out, in the order they were deployed:
  `versions[i]` is the `i`-th deployment. A **chain** is a subsequence of deployments, taken in log order
  (not necessarily adjacent), in which every build number equals the previous one **plus `step`**. `step`
  can be positive, negative or zero; with zero, a chain is a run of redeployments of the same build.

  Return the length of the **longest chain**. A single deployment is a chain of length `1`.

  ### Example 1
  ```
  Input:  versions = [3, 5, 4, 7, 6, 9, 8], step = 2
  Output: 4
  Explanation: 3, 5, 7, 9 appear in that order and each is 2 more than the previous one.
  ```

  ### Example 2
  ```
  Input:  versions = [12, 11, 13, 10, 9], step = -1
  Output: 4
  Explanation: 12, 11, 10, 9 is a chain with step -1. The 13 cannot extend it.
  ```

  ### Example 3
  ```
  Input:  versions = [4, 4, 1, 4], step = 0
  Output: 3
  Explanation: With step 0, the three deployments of build 4 form the longest chain.
  ```

  ### Constraints
  - `1 <= versions.length <= 10^5`
  - `-10^4 <= versions[i], step <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_step_chain
  params:
    - {name: versions, type: "int[]"}
    - {name: step, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_step_chain(versions: list[int], step: int) -> int:
        best_ending: dict[int, int] = {}  # build number -> longest chain ending at it so far
        best = 0
        for version in versions:
            length = best_ending.get(version - step, 0) + 1
            best_ending[version] = max(best_ending.get(version, 0), length)
            best = max(best, length)
        return best
  javascript: |
    function longestStepChain(versions, step) {
      const bestEnding = new Map();
      let best = 0;
      for (const version of versions) {
        const length = (bestEnding.get(version - step) || 0) + 1;
        bestEnding.set(version, Math.max(bestEnding.get(version) || 0, length));
        best = Math.max(best, length);
      }
      return best;
    }
