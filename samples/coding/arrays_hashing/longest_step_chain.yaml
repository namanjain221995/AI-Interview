expected_concepts:
  - "dynamic programming over values: longest chain ending at a given value"
  - "hash map keyed by value instead of by index"
  - "single left-to-right pass preserves log order"
  - "zero and negative steps handled by the same recurrence"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Derives the recurrence 'longest chain ending at v is one more than the chain ending at v - step', stores it in a hash map keyed by value during one pass, shows it handles zero and negative steps, and states O(n)."
  good: "Correct hash map solution after starting from O(n^2) dynamic programming, or a small fix for the zero-step case."
  weak: "Sorts the values (losing log order), stays at O(n^2), or only counts contiguous runs."
  criteria:
    correctness: "All tests pass, including negative and zero steps and reverse-ordered values."
    efficiency: "Linear time with a value-keyed map."
    code_quality: "Clear names for the map and the current length; no unnecessary nested loops."
    edge_cases: "Single element, no valid pairs, duplicates and step zero."
    communication: "Explains why processing in log order guarantees that only earlier deployments extend a chain."
hints:
  - "For each deployment, ask which build number would have to appear earlier in the log for this one to extend a chain."
  - "If you knew the longest chain ending at the build number current minus step among earlier deployments, the chain ending here would be one longer."
  - "Walk the log once with a hash map from build number to the longest chain ending at that number so far; for each entry, read the value stored for the number minus step (zero if absent), add one, store the result under the current number and track the overall maximum."
followups:
  - "Why does sorting the input break the problem?"
  - "How would you reconstruct one longest chain, not just its length?"
  - "What changes if step can be any value and you want the longest arithmetic subsequence overall?"
  - "If values were bounded to a small range, could you use an array instead of a map?"
common_errors:
  - "Sorting the input, which ignores the order of deployments."
  - "Counting only adjacent elements (contiguous runs) instead of subsequences."
  - "Looking up current plus step instead of current minus step, which builds chains in the wrong direction."
  - "Initialising chains to zero instead of one, returning 0 for a single deployment."
