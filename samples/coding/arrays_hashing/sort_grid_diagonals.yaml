expected_concepts:
  - "cells on the same top-left to bottom-right diagonal share j - i"
  - "group values by diagonal key, sort each group, and write back"
  - "row-major traversal visits each diagonal from its top-left end"
  - "numeric (not lexicographic) sorting"
optimal_complexity: {time: "O(m * n * log(min(m, n)))", space: "O(m * n)"}
rubric:
  excellent: "Identifies j - i as the diagonal key, groups and sorts each diagonal (or walks each diagonal from its start cell), writes values back in order, uses a numeric comparator, and gives O(mn log min(m, n))."
  good: "Correct solution walking each diagonal from the first row and first column, possibly with a small fix to the starting cells or bounds after testing."
  weak: "Sorts rows or columns instead of diagonals, misses diagonals that start in the first column, or sorts numbers lexicographically."
  criteria:
    correctness: "All tests pass, including non-square grids, single rows and single columns."
    efficiency: "Each value is sorted once within its diagonal; no repeated bubble passes over the grid."
    code_quality: "Clear diagonal key or start-cell loop; bounds checks are easy to follow."
    edge_cases: "1 x 1, single row or column, negatives, duplicates and descending input."
    communication: "Explains why j - i is constant along a diagonal and why each diagonal has at most min(m, n) cells."
hints:
  - "Find a simple quantity computed from the row and column index that stays the same for every cell along one diagonal."
  - "Cells on the same top-left to bottom-right diagonal share the value column minus row, so you can collect each diagonal's values under that key."
  - "Group the values by column minus row, sort each group in ascending order, then traverse the grid row by row and place the next smallest value of each cell's group into that cell, since row-major order reaches every diagonal from its top-left end first."
followups:
  - "Can you do it in O(min(m, n)) extra space by processing one diagonal at a time?"
  - "How would you sort the anti-diagonals (top-right to bottom-left) instead?"
  - "If values were small integers, how could counting sort change the complexity?"
  - "How would you verify the result without re-sorting?"
common_errors:
  - "Using the default JavaScript sort, which orders numbers as strings."
  - "Only starting diagonals from the first row and forgetting those that start in the first column."
  - "Using i + j as the key, which groups anti-diagonals instead."
  - "Sorting into descending order or writing values back from the wrong end of the diagonal."
