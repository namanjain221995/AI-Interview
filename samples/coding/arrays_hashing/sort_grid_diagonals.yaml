prompt_markdown: |
  ## Sort Each Diagonal of a Shift Grid

  A rota planner shows job durations in an `m x n` grid. The planner treats every diagonal that runs from
  the top-left towards the bottom-right as one *rotation lane*: cell `(i, j)` belongs to lane `j - i`, so
  cells `(0, 0)`, `(1, 1)`, `(2, 2)`, ... form one lane, cells `(0, 1)`, `(1, 2)`, ... form another, and
  so on. Some lanes contain a single cell.

  Rearrange the values **within each lane** so they are in **ascending order** going from the lane's
  top-left cell to its bottom-right cell, and return the resulting grid. Values never move to a different
  lane. Return a grid with the same dimensions (you may build a new grid or update the input).

  ### Example 1
  ```
  Input:  grid = [[9, 4, 7], [5, 2, 8], [6, 1, 3]]
  Output: [[2, 4, 7], [1, 3, 8], [6, 5, 9]]
  Explanation: Lane 0 holds 9, 2, 3 and becomes 2, 3, 9. Lane -1 holds 5, 1 and becomes 1, 5. The
               lanes [4, 8], [7] and [6] are already in order.
  ```

  ### Example 2
  ```
  Input:  grid = [[4, 8], [7, 1], [3, 5], [9, 2]]
  Output: [[1, 8], [5, 4], [2, 7], [9, 3]]
  Explanation: Lane 0 (4, 1), lane -1 (7, 5) and lane -2 (3, 2) are each sorted; lanes with one cell
               do not change.
  ```

  ### Example 3
  ```
  Input:  grid = [[30, 10, 20]]
  Output: [[30, 10, 20]]
  ```

  ### Constraints
  - `1 <= m == grid.length <= 100`
  - `1 <= n == grid[i].length <= 100`
  - `-10^5 <= grid[i][j] <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_grid_diagonals
  params:
