  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def sort_grid_diagonals(grid: list[list[int]]) -> list[list[int]]:
        m, n = len(grid), len(grid[0])
        lanes: dict[int, list[int]] = {}
        for i in range(m):
            for j in range(n):
                lanes.setdefault(j - i, []).append(grid[i][j])
        for values in lanes.values():
            values.sort(reverse=True)  # pop() then yields the smallest value first
        result = [[0] * n for _ in range(m)]
        for i in range(m):  # row-major order visits each lane from its top-left end
            for j in range(n):
                result[i][j] = lanes[j - i].pop()
        return result
  javascript: |
    function sortGridDiagonals(grid) {
      const m = grid.length;
      const n = grid[0].length;
      const lanes = new Map();
      for (let i = 0; i < m; i++) {
        for (let j = 0; j < n; j++) {
          const lane = j - i;
          if (!lanes.has(lane)) lanes.set(lane, []);
          lanes.get(lane).push(grid[i][j]);
        }
      }
      for (const values of lanes.values()) values.sort((a, b) => b - a);
      const result = [];
      for (let i = 0; i < m; i++) {
        const row = [];
        for (let j = 0; j < n; j++) row.push(lanes.get(j - i).pop());
        result.push(row);
      }
      return result;
    }
