expected_concepts:
  - "count interior panel boundaries by their running-sum position"
  - "hash map from position to number of rows with a boundary there"
  - "answer is rows minus the most shared boundary"
  - "excluding the right wall (last prefix sum)"
optimal_complexity: {time: "O(P) where P is the total number of panels", space: "O(P)"}
rubric:
  excellent: "Reframes crossing panels as maximising aligned boundaries, counts prefix-sum positions in a hash map while skipping the right wall, returns rows minus the best count, and explains O(P) time without depending on the width W."
  good: "Correct hash map solution after a nudge, possibly with a small fix for the right wall or for rows that are a single panel."
  weak: "Scans every position from 1 to W (infeasible for large widths), counts the outer edge as a boundary, or returns the number of aligned boundaries instead of crossed panels."
  criteria:
    correctness: "All tests pass, including single-panel rows and rows that share no boundaries."
    efficiency: "Linear in the number of panels; independent of the width W."
    code_quality: "Clear names for the running position and the boundary counts; no mutation of the input."
    edge_cases: "Single row, single-panel rows, very wide panels and ties between positions."
    communication: "Explains why minimising crossings equals maximising the rows that have a boundary at the same position."
hints:
  - "Instead of counting crossed panels directly, think about where the cable would cross nothing in a given row."
  - "A row is not crossed exactly at the running totals of its panel widths, so count how many rows have a boundary at each such position."
  - "Walk each row accumulating widths, skip the final panel so the right wall is never counted, keep a hash map from position to the number of rows with a boundary there, and subtract the largest count from the number of rows."
followups:
  - "Why can you ignore positions that are not a boundary in any row?"
  - "What would you return if the rack could be up to 2^40 units wide?"
  - "How would you return the best position itself, choosing the leftmost one on ties?"
  - "How would the approach change if two cables had to be placed?"
common_errors:
  - "Counting the right wall (the full row width) as a boundary, which gives 0 for every input."
  - "Iterating over every position from 1 to W, which is far too slow when widths are large."
  - "Returning the maximum boundary count instead of rows minus that count."
  - "Using a 32-bit position in a language where the running sum of widths could overflow."
