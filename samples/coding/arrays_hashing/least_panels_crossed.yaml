time_limit_minutes: 20
prompt_markdown: |
  ## Cable Run Through Patch Panels

  A network rack has a stack of horizontal rows of patch panels. Row `i` is described by `rows[i]`, the
  widths of its panels from left to right, and every row has the **same total width** `W`.

  You need to run one vertical cable straight down the front of the rack at an integer position `x`
  measured from the left edge, with `0 < x < W` (the outer left and right edges are not allowed). In each
  row the cable either runs along the boundary between two neighbouring panels of that row, or it
  **crosses** a panel. Return the **minimum number of panels the cable must cross** over all allowed
  positions.

  ### Example 1
  ```
  Input:  rows = [[2, 1, 3], [1, 2, 3], [3, 3], [2, 2, 2]]
  Output: 1
  Explanation: At x = 3 the cable runs along a panel boundary in the first three rows and crosses one
               panel in the last row.
  ```

  ### Example 2
  ```
  Input:  rows = [[4], [4], [4]]
  Output: 3
  Explanation: Every row is a single panel, so every allowed position crosses all three rows.
  ```

  ### Constraints
  - `1 <= rows.length <= 10^4`
  - `1 <= rows[i].length <= 10^4`, and the total number of panels is at most `2 * 10^4`
  - `1 <= rows[i][j]`, and every row sums to the same `W` with `2 <= W <= 2^31 - 1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: least_panels_crossed
  params:
    - {name: rows, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def least_panels_crossed(rows: list[list[int]]) -> int:
        boundary_counts: dict[int, int] = {}
        most_shared = 0
        for row in rows:
            position = 0
            for width in row[:-1]:  # the right wall is not an allowed position
                position += width
                count = boundary_counts.get(position, 0) + 1
                boundary_counts[position] = count
                most_shared = max(most_shared, count)
        return len(rows) - most_shared
  javascript: |
    function leastPanelsCrossed(rows) {
      const boundaryCounts = new Map();
      let mostShared = 0;
      for (const row of rows) {
        let position = 0;
        for (let j = 0; j < row.length - 1; j++) {
          position += row[j];
          const count = (boundaryCounts.get(position) || 0) + 1;
          boundaryCounts.set(position, count);
          if (count > mostShared) mostShared = count;
        }
      }
      return rows.length - mostShared;
    }
