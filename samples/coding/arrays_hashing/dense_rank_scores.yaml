version: 1
slug: dense_rank_scores
title: "Leaderboard Dense Ranks"
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [frontend, fullstack, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Leaderboard Dense Ranks

  A hackathon leaderboard receives the final score of every team in `scores`, in the order the teams
  registered. Scores can be negative because late submissions earn penalty points. The leaderboard shows
  a **dense rank** next to each team:

  - the highest score gets rank `1`,
  - teams with equal scores share the same rank,
  - the next lower distinct score gets the next integer rank, with **no gaps**.

  Return a list of ranks aligned with the input, so the `i`-th rank belongs to the team whose score is
  `scores[i]`. An empty input returns an empty list.

  ### Example 1
  ```
  Input:  scores = [70, 95, 70, 88]
  Output: [3, 1, 3, 2]
  Explanation: 95 is first, 88 is second and both teams with 70 share third
  ```

  ### Example 2
  ```
  Input:  scores = [50, 50, 50]
  Output: [1, 1, 1]
  ```

  ### Example 3
  ```
  Input:  scores = [10, -5, 40, 40, 25]
  Output: [3, 4, 1, 1, 2]
  Explanation: after the shared rank 1 the next score gets rank 2, not rank 3
  ```

  ### Constraints
  - `0 <= scores.length <= 10^5`
  - `-10^9 <= scores[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: dense_rank_scores
  params:
    - {name: scores, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def dense_rank_scores(scores: list[int]) -> list[int]:
        distinct = sorted(set(scores), reverse=True)
        rank_of = {score: rank for rank, score in enumerate(distinct, start=1)}
        return [rank_of[score] for score in scores]
  javascript: |
    function denseRankScores(scores) {
      const distinct = [...new Set(scores)].sort((a, b) => b - a);
      const rankOf = new Map();
      distinct.forEach((score, i) => rankOf.set(score, i + 1));
      return scores.map((score) => rankOf.get(score));
    }
