expected_concepts:
  - "de-duplicating scores before ranking"
  - "sorting distinct scores in descending order"
  - "hash map from score to rank"
  - "preserving the input order in the output"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts the distinct scores descending, maps each score to its 1-based dense rank, returns ranks in input order, avoids overflowing comparators and explains O(n log n) time and O(n) space."
  good: "Correct sort-based solution, perhaps after fixing the no-gap rule or the input-order requirement."
  weak: "Produces competition ranks with gaps, returns ranks in sorted order, or counts higher scores per team in O(n^2)."
  criteria:
    correctness: "All tests pass, including ties at the top, negative scores and empty input."
    efficiency: "Sorting the distinct values dominates; lookups are constant time."
    code_quality: "A clear score-to-rank map and no index juggling with the sorted array."
    edge_cases: "Empty input, a single team, all teams tied and extreme values."
    communication: "Distinguishes dense ranking from competition ranking with gaps before coding."
hints:
  - "A team's dense rank depends only on how many distinct scores are higher than its own."
  - "Removing duplicates and ordering the remaining scores from highest to lowest gives each distinct score its rank by position."
  - "Collect the distinct scores, sort them in descending order, store each score with its 1-based position in a map, then walk the original list and look up the rank of every score so the output keeps the input order."
followups:
  - "How would you produce competition ranks (1, 1, 3) instead of dense ranks (1, 1, 2)?"
  - "How would you keep ranks up to date as new scores arrive one at a time?"
  - "If scores were small integers in a known range, could you avoid comparison sorting?"
  - "How would you express the same ranking in SQL?"
common_errors:
  - "Leaving gaps after ties, which produces competition ranks instead of dense ranks."
  - "Returning the ranks in sorted order instead of aligned with the input."
  - "Sorting numbers as strings or with a subtraction comparator that can overflow in some languages."
  - "Counting higher scores separately for each team, which is quadratic."
