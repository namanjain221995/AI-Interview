slug: smallest_unused_port
title: Smallest Unused Port Number
difficulty: hard
competency_keys: [algorithms, code_quality, problem_solving]
role_tags: [backend, network, devops]
time_limit_minutes: 30
prompt_markdown: |
  ## Smallest Unused Port Number

  A host agent allocates ports for new sidecar processes. It receives a raw snapshot `ports` of the values
  reported by running processes. The snapshot is unsorted and noisy: it can contain duplicates, `0`, and
  negative placeholder values meaning "not assigned yet".

  Return the **smallest positive integer** that does **not** appear in `ports`; that is the port the agent
  hands out next.

  **Requirement:** run in `O(n)` time using only `O(1)` extra memory. You may rearrange or overwrite the
  contents of `ports` while you work.

  ### Example 1
  ```
  Input:  ports = [2, 5, 1, 0, 3]
  Output: 4
  Explanation: 1, 2 and 3 are taken; 4 is the first free value.
  ```

  ### Example 2
  ```
  Input:  ports = [-1, 7, 8, 9]
  Output: 1
  Explanation: No positive value from 1 upwards is taken, so 1 is free.
  ```

  ### Example 3
  ```
  Input:  ports = [1, 1, 2, 2]
  Output: 3
  ```

  ### Constraints
  - `0 <= ports.length <= 10^5`
  - `-2^31 <= ports[i] <= 2^31 - 1`

  **Note:** sorting (`O(n log n)`) or a hash set (`O(n)` extra memory) gives correct answers but does not meet the requirement.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_unused_port
  params:
    - {name: ports, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def smallest_unused_port(ports: list[int]) -> int:
        n = len(ports)
        # Place every value v in 1..n at index v - 1 by swapping.
        for i in range(n):
            while 1 <= ports[i] <= n and ports[ports[i] - 1] != ports[i]:
                target = ports[i] - 1
                ports[i], ports[target] = ports[target], ports[i]
        for i in range(n):
            if ports[i] != i + 1:
                return i + 1
        return n + 1
  javascript: |
    function smallestUnusedPort(ports) {
      const n = ports.length;
      for (let i = 0; i < n; i++) {
        while (ports[i] >= 1 && ports[i] <= n && ports[ports[i] - 1] !== ports[i]) {
          const target = ports[i] - 1;
          const tmp = ports[target];
          ports[target] = ports[i];
          ports[i] = tmp;
        }
      }
      for (let i = 0; i < n; i++) {
        if (ports[i] !== i + 1) return i + 1;
      }
      return n + 1;
    }
