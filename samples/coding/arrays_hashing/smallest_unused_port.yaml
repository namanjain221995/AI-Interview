expected_concepts:
  - "the answer always lies in 1..n+1"
  - "using the input array itself as a presence table"
  - "cyclic placement of value v at index v - 1"
  - "guarding the swap loop against duplicates and out-of-range values"
  - "O(n) amortised argument: each swap fixes one position"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Observes the answer lies in 1..n+1, uses in-place placement (or sign marking after cleaning out non-positives), guards against duplicates and out-of-range values, and argues the amortised O(n) bound with O(1) extra space."
  good: "Starts with a hash set or sort, then reaches a working in-place approach with some guidance; minor bugs fixed by testing."
  weak: "Stops at a hash set or sort without addressing the memory requirement, or writes a swap loop that never terminates on duplicates."
  criteria:
    correctness: "All tests pass, including empty input, duplicates, extremes and a full permutation."
    efficiency: "Linear time and constant extra memory; explains why the nested loop is still linear overall."
    code_quality: "Swap logic is clear and avoids reading the target index after it has changed; names explain the invariant."
    edge_cases: "Empty array, only non-positive values, values above n, 32-bit extremes and repeated values."
    communication: "Discusses that the input is modified and when that would be unacceptable in production."
hints:
  - "In a list of n numbers, what range must the answer fall into?"
  - "Only values from 1 to n can affect the answer, and there are exactly n slots in the array, so the array itself can record which of those values are present."
  - "Keep swapping each in-range value into the slot whose position is one less than the value, stopping when the value is out of range or the target slot already holds the same value; afterwards the first slot that does not hold its matching value gives the answer, and if every slot matches the answer is n plus one."
followups:
  - "Why is the nested swap loop still O(n) in total?"
  - "How would you solve it without modifying the input, and what does that cost?"
  - "How would you find the k smallest unused values?"
  - "What changes if the snapshot is streamed and cannot be stored?"
common_errors:
  - "Swapping without checking whether the target already holds the same value, which loops forever on duplicates."
  - "Computing the target index after the swap has already changed the current slot."
  - "Returning n instead of n + 1 when every value 1..n is present."
  - "Using sign marking without first neutralising zeros and negatives."
