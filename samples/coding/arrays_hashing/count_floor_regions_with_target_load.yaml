time_limit_minutes: 35
prompt_markdown: |
  ## Floor Regions With an Exact Load

  A data-centre floor is divided into an `m x n` grid of tiles. `grid[r][c]` is the **net power load** of a
  tile in kilowatts; it can be negative where on-site batteries feed power back.

  A **region** is a non-empty, axis-aligned rectangle of whole tiles: every tile in rows `r1..r2` and columns
  `c1..c2` (`r1 <= r2`, `c1 <= c2`). Two regions are different when they cover a different set of tiles.

  Return the **number of regions** whose total load is exactly `target`, as a 64-bit integer.

  ### Example 1
  ```
  Input:  grid = [[1, -1, 0], [2, 0, -2]], target = 0
  Output: 6
  Explanation: Row 0 contributes [1, -1], [1, -1, 0] and the single tile 0; row 1 contributes [2, 0, -2]
               and its single tile 0; the whole 2 x 3 grid also sums to 0.
  ```

  ### Example 2
  ```
  Input:  grid = [[3, 1], [1, 3]], target = 4
  Output: 4
  Explanation: Both rows (3 + 1, 1 + 3) and both columns (3 + 1, 1 + 3) add up to 4.
  ```

  ### Constraints
  - `1 <= m, n <= 100`
  - `-1000 <= grid[r][c] <= 1000`
  - `-10^8 <= target <= 10^8`

  **Follow-up:** the brute force over all rectangles is `O(m^2 * n^2)`. Can you reach `O(m^2 * n)` (or better
  when one dimension is much smaller than the other)?
languages: [python, javascript, typescript, java, go, cpp]
