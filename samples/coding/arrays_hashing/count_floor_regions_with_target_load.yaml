expected_concepts:
  - fixing a pair of rows and compressing the band into column sums
  - "1D subarray-sum counting with prefix sums and a hash map"
  - seeding the prefix map with zero
  - iterating over pairs of the smaller dimension
  - incremental column totals as the bottom row moves down
optimal_complexity: {time: "O(min(m, n)^2 * max(m, n))", space: "O(max(m, n))"}
rubric:
  excellent: Reduces the 2D problem to the 1D subarray-sum count by fixing a top and bottom row and accumulating column sums, counts matches with a prefix-sum hash map seeded with zero, pairs over the smaller dimension and explains the O(m^2 n) bound.
  good: Finds the row-pair compression and the hash map but needs prompting on the zero seed or on looking up before inserting, or recomputes column sums from scratch for each pair.
  weak: Enumerates every rectangle (O(m^2 n^2) or slower), or uses a sliding window that assumes non-negative loads.
  criteria:
    correctness: All tests pass, including single rows, single columns, all-zero grids and negative targets.
    efficiency: O(m^2 n) using incremental column sums and an O(n) hash-map pass per row pair.
    code_quality: Separates the 1D counting step from the row-pair loop; clear names for the band sums.
    edge_cases: "1 x 1 grids, negative values, a zero target, no matches and very many matches."
    communication: Explains why a sliding window fails with negative loads and why the zero seed is needed.
hints:
  - "Start from the one-dimensional version: how would you count subarrays of a list that add up to a target when values can be negative?"
  - If you fix the top and bottom rows of a region, the rows in between collapse into a single list of column totals, and the question becomes the one-dimensional count again.
  - For every top row, walk the bottom row downwards while adding each row into running column totals; for each band, sweep the column totals with a running prefix sum and a hash map of how many times each prefix sum has appeared (starting with zero seen once), adding the count of prefix sum minus target at each step.
followups:
  - Which dimension should the row pairs range over when m is 3 and n is 10^5?
  - How would you find the region with the largest total load not exceeding the target?
  - How would you answer many queries with different targets on the same grid?
  - Why does a two-pointer sliding window not work here?
common_errors:
  - Using a sliding window, which only works when all loads are non-negative.
  - Forgetting to seed the prefix-sum map with zero, which misses regions that start at the first column.
  - Inserting the current prefix sum before looking up its complement, which counts empty regions when the target is zero.
  - Recomputing the column totals of every band from scratch, which adds a factor of m to the running time.
