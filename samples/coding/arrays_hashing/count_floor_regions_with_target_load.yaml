reference_solutions:
  python: |
    def count_floor_regions_with_target_load(grid: list[list[int]], target: int) -> int:
        if len(grid) > len(grid[0]):
            grid = [list(column) for column in zip(*grid)]  # pair up the shorter dimension
        rows, cols = len(grid), len(grid[0])
        total = 0
        for top in range(rows):
            column_sums = [0] * cols
            for bottom in range(top, rows):
                row = grid[bottom]
                for c in range(cols):
                    column_sums[c] += row[c]
                seen = {0: 1}  # prefix sum -> how many times it occurred
                running = 0
                for value in column_sums:
                    running += value
                    total += seen.get(running - target, 0)
                    seen[running] = seen.get(running, 0) + 1
        return total
  javascript: |
    function countFloorRegionsWithTargetLoad(grid, target) {
      if (grid.length > grid[0].length) {
        grid = grid[0].map((_, c) => grid.map((row) => row[c]));
      }
      const rows = grid.length;
      const cols = grid[0].length;
      let total = 0;
      for (let top = 0; top < rows; top++) {
        const columnSums = new Array(cols).fill(0);
        for (let bottom = top; bottom < rows; bottom++) {
          const row = grid[bottom];
          for (let c = 0; c < cols; c++) columnSums[c] += row[c];
          const seen = new Map([[0, 1]]);
          let running = 0;
          for (const value of columnSums) {
            running += value;
            total += seen.get(running - target) || 0;
            seen.set(running, (seen.get(running) || 0) + 1);
          }
        }
      }
      return total;
    }
