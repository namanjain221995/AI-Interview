slug: longest_repeated_log_segment
title: Longest Repeated Log Segment
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, security, sre]
time_limit_minutes: 35
prompt_markdown: |
  ## Longest Repeated Log Segment

  A security team compacts a log into a string of lowercase letters and looks for payload fragments that
  were replayed. Return the **longest contiguous segment** of `log` that occurs **at least twice**, starting at
  two different positions. The occurrences may **overlap**.

  - If several segments share the maximum length, return the **lexicographically smallest** one.
  - If no segment occurs twice, return the empty string `""`.

  ### Example 1
  ```
  Input:  log = "abcabcab"
  Output: "abcab"
  Explanation: "abcab" starts at index 0 and at index 3; the two occurrences overlap, which is allowed.
  ```

  ### Example 2
  ```
  Input:  log = "cdzabzcdab"
  Output: "ab"
  Explanation: No segment of length 3 repeats. Both "cd" and "ab" occur twice, and "ab" is smaller.
  ```

  ### Example 3
  ```
  Input:  log = "xyz"
  Output: ""
  ```

  ### Constraints
  - `1 <= log.length <= 3 * 10^4`
  - `log` consists of lowercase English letters only.

  **Follow-up:** checking every length and every pair of positions is far too slow at the upper limit. Can you
  get close to `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_repeated_log_segment
  params:
    - {name: log, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def longest_repeated_log_segment(log: str) -> str:
        n = len(log)
        mod1, mod2, base = 1_000_000_007, 998_244_353, 131

        def repeated_starts(length: int) -> list[int]:
            """First start of every window of this length that occurs at least twice."""
            power1, power2 = pow(base, length, mod1), pow(base, length, mod2)
            h1 = h2 = 0
            first: dict[tuple[int, int], int] = {}
            repeated: dict[tuple[int, int], int] = {}
            for i, ch in enumerate(log):
                h1 = (h1 * base + ord(ch)) % mod1
                h2 = (h2 * base + ord(ch)) % mod2
                if i >= length:
                    old = ord(log[i - length])
                    h1 = (h1 - old * power1) % mod1
                    h2 = (h2 - old * power2) % mod2
                if i >= length - 1:
                    key = (h1, h2)
                    if key in first:
                        repeated[key] = first[key]
                    else:
                        first[key] = i - length + 1
            return list(repeated.values())

        low, high, best = 1, n - 1, 0  # a repeat of length L implies one of every shorter length
        while low <= high:
            mid = (low + high) // 2
            if repeated_starts(mid):
                best, low = mid, mid + 1
            else:
                high = mid - 1
        if best == 0:
            return ""
        return min(log[start:start + best] for start in repeated_starts(best))
  javascript: |
    function longestRepeatedLogSegment(log) {
      const n = log.length;
      const mod1 = 1000000007;
      const mod2 = 998244353;
      const base = 131;

      function repeatedStarts(length) {
        let power1 = 1;
        let power2 = 1;
        for (let i = 0; i < length; i++) {
          power1 = (power1 * base) % mod1;
          power2 = (power2 * base) % mod2;
        }
        let h1 = 0;
        let h2 = 0;
        const first = new Map();
        const repeated = new Map();
        for (let i = 0; i < n; i++) {
          const code = log.charCodeAt(i);
          h1 = (h1 * base + code) % mod1;
          h2 = (h2 * base + code) % mod2;
          if (i >= length) {
            const old = log.charCodeAt(i - length);
            h1 = (((h1 - old * power1) % mod1) + mod1) % mod1;
            h2 = (((h2 - old * power2) % mod2) + mod2) % mod2;
          }
          if (i >= length - 1) {
            const key = h1 + ":" + h2;
            if (first.has(key)) repeated.set(key, first.get(key));
            else first.set(key, i - length + 1);
          }
        }
        return [...repeated.values()];
      }

      let low = 1;
      let high = n - 1;
      let best = 0;
      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        if (repeatedStarts(mid).length > 0) {
          best = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }
      if (best === 0) return "";
      let answer = null;
      for (const start of repeatedStarts(best)) {
        const candidate = log.slice(start, start + best);
        if (answer === null || candidate < answer) answer = candidate;
      }
      return answer;
    }
