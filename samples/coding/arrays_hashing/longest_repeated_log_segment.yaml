  - {id: t6, hidden: true, args: ["aaaaa"], expected: "aaaa", description: Single repeated character - maximal overlap}
  - {id: t7, hidden: true, args: ["pingpingpong"], expected: "pingp", description: Answer extends past the shared prefix of the two words}
  - {id: t8, hidden: true, args: ["qwertyuiopiop"], expected: "iop", description: Repeated segment at the very end of the log}
  - {id: t9, hidden: true, args: ["xyzmabcqxyzpabc"], expected: "abc", description: Tie at length 3 between two different segments}
  - {id: t10, hidden: true, args: ["abcdefghij"], expected: "", description: All characters distinct}
  - {id: t11, hidden: true, args: [""], expected: "ccadbabacdbdababdcbdbabdbbaabbbbccbbbbdcc", description: "1000 characters with a planted 40-character repeat - needs better than cubic time"}
expected_concepts:
  - "monotonic property: a repeat of length L implies a repeat of every shorter length"
  - binary search on the segment length
  - rolling (Rabin-Karp) hash with a hash set of windows
  - collision awareness (double hashing or verification)
  - suffix array with LCP as an alternative
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: States the monotonic property, binary searches the length with an O(n) rolling-hash check per length, addresses hash collisions, then gathers all repeated windows at the best length to pick the lexicographically smallest; may mention suffix arrays with LCP as the deterministic alternative.
  good: Correct binary search with a set of substrings (slicing each window) or a rolling hash with minor issues in the tie-breaking or collision handling.
  weak: Compares all pairs of positions for every length (cubic or worse) or returns the first repeated segment found instead of the smallest on ties.
  criteria:
    correctness: All tests pass, including overlapping repeats, ties and logs with no repeat.
    efficiency: O(n log n) expected time via binary search and a linear rolling-hash pass per length.
    code_quality: The per-length check is a separate, well-named helper; modular arithmetic is correct for negatives.
    edge_cases: Length-1 logs, all-equal characters, repeats at the end and ties on length.
    communication: Explains why binary search is valid and how collisions are made negligible or verified.
hints:
  - If some segment of length L appears twice, what can you say about segments of length L minus one?
  - That property lets you binary search on the length; you then only need a fast way to decide whether any window of a fixed length appears twice.
  - For a fixed length, slide a polynomial rolling hash across the log and store each window's hash with its first start position; a hash seen before means a repeat (use two moduli or compare the actual text to rule out collisions). After the search, collect every repeated window at the best length and return the smallest one.
followups:
  - How would a suffix array with an LCP array solve this deterministically?
  - How would you return the segment that repeats the most times instead of the longest one?
  - What if occurrences were not allowed to overlap?
  - How would you find the longest segment shared by two different logs?
common_errors:
  - Returning the first repeated segment found at the best length instead of the lexicographically smallest.
  - Taking the remainder of a negative number in languages where it stays negative when removing the outgoing character.
  - Trusting a single small hash without considering collisions.
  - Searching lengths up to n instead of n minus one, or treating the same start position as a repeat.
