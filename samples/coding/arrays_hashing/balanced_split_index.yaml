version: 1
slug: balanced_split_index
title: Balanced Deployment Split Point
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, devops, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Balanced Deployment Split Point

  A rollout batch lists hosts in deployment order, each with a risk weight. After manual adjustments a
  weight can be zero or negative. The release tool wants to pause at a **pivot host** so that the risk
  already deployed equals the risk still to come.

  Return the **smallest index `i`** such that the sum of `weights` strictly to the **left** of `i`
  equals the sum strictly to the **right** of `i`. The pivot host itself belongs to neither side, and an
  empty side sums to `0`. If no such index exists, return `-1`.

  ### Example 1
  ```
  Input:  weights = [3, 1, 5, 2, 2]
  Output: 2
  Explanation: Left of index 2 is 3 + 1 = 4 and right of it is 2 + 2 = 4.
  ```

  ### Example 2
  ```
  Input:  weights = [4, -2, 7]
  Output: -1
  Explanation: The left/right sums are 0/5, 4/7 and 2/0; none of them match.
  ```

  ### Example 3
  ```
  Input:  weights = [9, 3, -5, 2]
  Output: 0
  Explanation: At index 0 the left side is empty (0) and the right side is 3 + (-5) + 2 = 0.
  ```

  ### Constraints
  - `1 <= weights.length <= 10^4`
  - `-1000 <= weights[i] <= 1000`

  **Follow-up:** Can you solve it with O(1) extra memory and at most two passes over the array?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: balanced_split_index
  params:
    - {name: weights, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def balanced_split_index(weights: list[int]) -> int:
        total = sum(weights)
        left = 0
        for index, weight in enumerate(weights):
            right = total - left - weight
            if left == right:
                return index
            left += weight
        return -1
  javascript: |
    function balancedSplitIndex(weights) {
      let total = 0;
      for (const w of weights) total += w;
      let left = 0;
      for (let i = 0; i < weights.length; i++) {
        const right = total - left - weights[i];
        if (left === right) return i;
        left += weights[i];
      }
      return -1;
    }
