expected_concepts:
  - "total sum computed once"
  - "running left sum with right = total - left - current"
  - "excluding the pivot element from both sides"
  - "returning the smallest index on ties"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Computes the total once, sweeps with a running left sum deriving the right sum, excludes the pivot from both sides, returns the first match and explains O(n) time with O(1) space."
  good: "Correct solution with prefix sums (possibly an O(n) prefix array) and the right complexity."
  weak: "Recomputes both side sums for every index in O(n^2), includes the pivot in one side, or returns the last match."
  criteria:
    correctness: "All tests pass, including pivots at both ends and all-zero input."
    efficiency: "Two linear passes and constant extra memory."
    code_quality: "Clear names for total, left and right; updates the left sum after the comparison."
    edge_cases: "Single element, negative weights, ties and no answer."
    communication: "Explains how the right-hand sum is derived from the total without a second inner loop."
hints:
  - "If you knew the total weight of the whole batch, what would you need to know at each index to get the right-hand sum?"
  - "Keep a running sum of everything to the left of the current index; the right side is the total minus the left side minus the current weight."
  - "Compute the total in one pass, then sweep left to right: derive the right sum from total, left sum and the current weight, return the index as soon as the left and right sums match, and only then add the current weight to the left sum; return minus one if nothing matches."
followups:
  - "Why must you compare before adding the current weight to the running left sum?"
  - "How would you return every balanced index instead of the first?"
  - "What changes if the pivot host should count towards the left side?"
  - "Could negative weights make a sliding-window approach fail here? Why or why not?"
common_errors:
  - "Adding the current weight to the left sum before comparing, which counts the pivot on the left."
  - "Recomputing both sides with inner loops for every index."
  - "Returning the last balanced index rather than the smallest."
  - "Assuming an answer always exists and never returning -1."
