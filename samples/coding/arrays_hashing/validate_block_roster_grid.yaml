expected_concepts:
  - hash sets per row, column and pod
  - mapping a cell to its pod with integer division by block
  - single pass with early exit on the first conflict
  - skipping unassigned zero cells
optimal_complexity: {time: O(n^2), space: O(n^2)}
rubric:
  excellent: Scans the grid once, maps each cell to its pod with integer division, checks row, column and pod sets with early exit, skips zeros, and states O(n^2) time and space.
  good: Correct solution using three separate passes or slightly redundant structures, or after a fix to the pod index found by testing.
  weak: Treats zeros as duplicates, computes the pod index incorrectly, assumes ids are 1..n or that block equals 3, or misses one of the three rules.
  criteria:
    correctness: All tests pass, including pod-only conflicts and block sizes of 1 and n.
    efficiency: Each cell is checked once against constant-time set lookups.
    code_quality: The pod index computation is clear and the three rules share one code path.
    edge_cases: Empty or 1 x 1 grids, all zeros, block equal to 1 or n, and large ids.
    communication: Explains how a cell maps to its pod and why zeros are skipped.
hints:
  - You need to detect a repeated engineer id within three kinds of groups. Which data structure answers "have I seen this id in this group before" quickly?
  - Keep one set of seen ids for every row, every column and every pod. The pod of a cell can be computed from its row and column with integer division by the block size.
  - Walk every cell once, skip zeros, compute the pod index from the row divided by block and the column divided by block, and return false as soon as the id is already in the set for its row, its column or its pod; otherwise add it to all three and return true at the end.
followups:
  - How would you report all conflicts instead of stopping at the first one?
  - How would you validate an update to a single cell in O(1) time if the sets were kept between updates?
  - What changes if pods are rectangles of block rows by another number of columns?
  - Could you use bit masks instead of hash sets, and when would that help?
common_errors:
  - Counting the unassigned value zero as a repeated id.
  - Computing the pod index with the wrong divisor or mixing up rows and columns.
  - Hard-coding a pod size of 3 or assuming ids are between 1 and n.
  - Only checking rows and columns and forgetting the pods.
