reference_solutions:
  python: |
    def validate_block_roster_grid(grid: list[list[int]], block: int) -> bool:
        n = len(grid)
        seen: set[tuple] = set()
        for r in range(n):
            for c in range(n):
                engineer = grid[r][c]
                if engineer == 0:
                    continue
                keys = (
                    ("row", r, engineer),
                    ("col", c, engineer),
                    ("box", r // block, c // block, engineer),
                )
                for key in keys:
                    if key in seen:
                        return False
                    seen.add(key)
        return True
  javascript: |
    function validateBlockRosterGrid(grid, block) {
      const n = grid.length;
      const seen = new Set();
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const engineer = grid[r][c];
          if (engineer === 0) continue;
          const box = Math.floor(r / block) + "," + Math.floor(c / block);
          const keys = ["r" + r + ":" + engineer, "c" + c + ":" + engineer, "b" + box + ":" + engineer];
          for (const key of keys) {
            if (seen.has(key)) return false;
            seen.add(key);
          }
        }
      }
      return true;
    }
