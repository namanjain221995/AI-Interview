expected_concepts:
  - "frequency counting with a hash map"
  - "tracking first and last occurrence of each value"
  - "tie-breaking among values with equal frequency"
  - "single linear pass"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Observes that for a peak code the best segment spans its first to last occurrence, records count and first index per code in one pass, handles ties by minimum length and states O(n) time and space."
  good: "Correct two-pass solution (count, then first/last positions) with the right tie handling, perhaps after a nudge."
  weak: "Enumerates all segments and recounts frequencies, or picks an arbitrary peak code instead of the best among ties."
  criteria:
    correctness: "All tests pass, including ties at the peak frequency and logs where every code is distinct."
    efficiency: "Linear time with hash maps; avoids enumerating segments."
    code_quality: "Clear bookkeeping structures (first index, count) and a simple update rule."
    edge_cases: "Single element, all identical, all distinct, negative and extreme code values."
    communication: "Explains why the shortest segment for a code must run from its first to its last occurrence."
hints:
  - "Start by working out which codes reach the peak frequency; for one such code, ask where its shortest segment must start and end."
  - "For a code that appears f times, the shortest segment containing all of its occurrences runs from its first occurrence to its last occurrence, so record the first index, last index and count of every code."
  - "In one pass keep each code's count and first index in hash maps; whenever a code's count beats the best count so far, or ties it with a shorter span from its first index to the current index, update the best count and best length, and return the best length at the end."
followups:
  - "How would you return the segment itself (start and end indices) instead of its length?"
  - "What if the log is a stream and you must report the answer after every new code?"
  - "How would the problem change if the segment needed the peak code to appear at least k times for a given k?"
common_errors:
  - "Choosing the first code that reaches the peak frequency and ignoring other codes with the same frequency."
  - "Computing last minus first without adding one, giving an off-by-one length."
  - "Recomputing frequencies for every candidate segment, which is quadratic or worse."
