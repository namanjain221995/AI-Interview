slug: shortest_segment_with_peak_frequency
title: Shortest Segment Holding the Busiest Error
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, support_engineer, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Shortest Segment Holding the Busiest Error

  An on-call engineer exported the error codes a service emitted, in order, into the array `codes`.
  The **peak frequency** of the log is the largest number of times any single code appears in it.

  The engineer wants to zoom in on the smallest slice of the log that still explains the peak: find
  the **shortest contiguous segment** of `codes` in which some code appears exactly as many times as the
  peak frequency of the whole log. Return the **length** of that segment.

  If several codes share the peak frequency, consider all of them and return the smallest length.

  ### Example 1
  ```
  Input:  codes = [500, 404, 404, 500, 503]
  Output: 2
  Explanation: The peak frequency is 2 (codes 500 and 404).
               Code 404 needs only the segment [404, 404]; code 500 needs length 4.
  ```

  ### Example 2
  ```
  Input:  codes = [42, 17, 17, 99, 42, 17]
  Output: 5
  Explanation: Code 17 appears 3 times, at positions 1, 2 and 5.
  ```

  ### Constraints
  - `1 <= codes.length <= 10^5`
  - `-10^9 <= codes[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_segment_with_peak_frequency
  params:
    - {name: codes, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def shortest_segment_with_peak_frequency(codes: list[int]) -> int:
        first: dict[int, int] = {}
        count: dict[int, int] = {}
        best_count, best_length = 0, 0
        for i, code in enumerate(codes):
            if code not in first:
                first[code] = i
            count[code] = count.get(code, 0) + 1
            length = i - first[code] + 1
            if count[code] > best_count or (count[code] == best_count and length < best_length):
                best_count, best_length = count[code], length
        return best_length
  javascript: |
    function shortestSegmentWithPeakFrequency(codes) {
      const first = new Map();
      const count = new Map();
      let bestCount = 0;
      let bestLength = 0;
      for (let i = 0; i < codes.length; i++) {
        const code = codes[i];
        if (!first.has(code)) first.set(code, i);
        const c = (count.get(code) || 0) + 1;
        count.set(code, c);
        const length = i - first.get(code) + 1;
        if (c > bestCount || (c === bestCount && length < bestLength)) {
          bestCount = c;
          bestLength = length;
        }
      }
      return bestLength;
    }
