expected_concepts:
  - "prefix sums"
  - "total must be divisible by three"
  - "counting earlier one-third prefixes when a two-thirds prefix is reached"
  - "ordering of the check versus the update so both cuts stay distinct"
  - "64-bit result for the count"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Derives the one-pass prefix-sum count, explains why the two-thirds check precedes the one-third update (zero-total case) and why the scan stops before the last step, and returns a 64-bit count in O(n) time and O(1) space."
  good: "Correct solution using a prefix array and suffix counts, or the one-pass solution after fixing the zero-total edge case."
  weak: "Tries every pair of cuts with repeated sums (O(n^2) or worse), lets a stage be empty, or ignores negative costs."
  criteria:
    correctness: "All tests pass, including zero totals, negative costs and inputs shorter than three."
    efficiency: "Single linear pass with constant extra memory."
    code_quality: "Names make the roles of the two cuts obvious; the loop bound documents the non-empty last stage."
    edge_cases: "Length below three, total not divisible by three, all zeros and alternating signs."
    communication: "Explains why the count must be 64-bit and why the update order matters."
hints:
  - "If the three stages have equal totals, what must each stage total be in terms of the whole pipeline?"
  - "With running prefix sums, the first cut sits where the prefix equals one third of the total and the second cut where the prefix equals two thirds; you only need to pair them in the right order."
  - "Scan once while keeping the running sum and a count of positions so far whose prefix equals one third; at each position before the last step, if the prefix equals two thirds add that count to the answer, and only afterwards bump the count if the prefix equals one third."
followups:
  - "How would you generalise to k equal stages?"
  - "How would you return the actual cut positions of every balanced split?"
  - "What if stages could differ by at most a tolerance instead of being exactly equal?"
common_errors:
  - "Incrementing the one-third count before checking two thirds, which pairs a cut with itself when the total is zero."
  - "Scanning to the final step so the last stage can be empty."
  - "Returning a 32-bit count that overflows on long runs of zeros."
  - "Assuming costs are non-negative and stopping at the first matching prefix."
