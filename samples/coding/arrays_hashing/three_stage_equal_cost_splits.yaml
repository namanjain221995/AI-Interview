slug: three_stage_equal_cost_splits
title: Three Equal-Cost Pipeline Stages
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Three Equal-Cost Pipeline Stages

  A release pipeline is a fixed sequence of steps. `costs[i]` is the net compute cost of step `i`; it can
  be negative when a step returns credit (for example a cache warm-up that saves work later).

  The pipeline must be split into three consecutive, **non-empty** stages (build, verify, deploy) by
  placing two cuts, so that every step belongs to exactly one stage and the steps keep their order. A split
  is **balanced** when the three stages have exactly the same total cost.

  Return the **number of different balanced splits**. A cut at position `k` (`1 <= k <= n - 1`) goes just before step
  `k`; two splits differ if at least one cut is in a different position. Return `0` if there are fewer than three steps or no balanced split exists.

  The count can exceed the 32-bit range, so return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  costs = [1, 2, 3, 0, 3]
  Output: 2
  Explanation: Total 9, so each stage must cost 3: [1, 2] | [3] | [0, 3] and [1, 2] | [3, 0] | [3].
  ```

  ### Example 2
  ```
  Input:  costs = [0, 0, 0, 0]
  Output: 3
  Explanation: Every stage costs 0 for any pair of cuts: positions (1, 2), (1, 3) and (2, 3).
  ```

  ### Example 3
  ```
  Input:  costs = [4, -1, 0, 3, 2, 1, 0]
  Output: 2
  ```

  ### Constraints
  - `0 <= costs.length <= 10^5`
  - `-10^4 <= costs[i] <= 10^4`
  - The answer may be larger than `2^31 - 1`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: three_stage_equal_cost_splits
  params:
    - {name: costs, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def three_stage_equal_cost_splits(costs: list[int]) -> int:
        n = len(costs)
        total = sum(costs)
        if n < 3 or total % 3 != 0:
            return 0
        third = total // 3
        prefix = 0
        first_cuts = 0  # prefixes ending before the current step whose sum equals one third
        ways = 0
        # The second stage must end at index n - 2 at the latest so the last stage is non-empty.
        for end in range(n - 1):
            prefix += costs[end]
            if prefix == 2 * third:
                ways += first_cuts
            if prefix == third:
                first_cuts += 1
        return ways
  javascript: |
    function threeStageEqualCostSplits(costs) {
      const n = costs.length;
      let total = 0;
      for (const c of costs) total += c;
      if (n < 3 || total % 3 !== 0) return 0;
      const third = total / 3;
      let prefix = 0;
      let firstCuts = 0;
      let ways = 0;
      for (let end = 0; end < n - 1; end++) {
        prefix += costs[end];
        if (prefix === 2 * third) ways += firstCuts;
        if (prefix === third) firstCuts += 1;
      }
      return ways;
    }
