version: 1
slug: min_removals_unique_tag_counts
title: Make Tag Counts Distinct
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Make Tag Counts Distinct

  A labelling tool records one lowercase letter per tagged item, so the string `tags` lists the tag of
  every item in a batch. The dashboard that charts tag volumes can only draw a tag if its item count differs
  from every other tag's count.

  You may delete individual characters (untag items). Return the **minimum number of deletions** needed so
  that no two letters that are **still present** in `tags` have the same count.

  - A letter whose count drops to zero is no longer present and does not conflict with anything.
  - The order of the remaining characters does not matter; only the counts do.
  - An empty string needs `0` deletions.

  ### Example 1
  ```
  Input:  tags = "aabbcc"
  Output: 3
  Explanation: Counts are 2, 2 and 2. Keep one letter at 2, reduce another to 1 (1 deletion) and remove the third entirely (2 deletions).
  ```

  ### Example 2
  ```
  Input:  tags = "aaabbc"
  Output: 0
  Explanation: Counts 3, 2 and 1 are already distinct.
  ```

  ### Example 3
  ```
  Input:  tags = "bbbaaacc"
  Output: 2
  Explanation: Counts are 3, 3 and 2. Reduce one 3 to 2 and the existing 2 to 1, for 2 deletions in total.
  ```

  ### Constraints
  - `0 <= tags.length <= 10^5`
  - `tags` contains only lowercase English letters `a`-`z`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_removals_unique_tag_counts
  params:
    - {name: tags, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def min_removals_unique_tag_counts(tags: str) -> int:
        counts = sorted(Counter(tags).values(), reverse=True)
        deletions = 0
        limit = len(tags)  # the highest count the next letter may keep
        for count in counts:
            keep = min(count, limit)
            deletions += count - keep
            limit = max(keep - 1, 0)
        return deletions
  javascript: |
    function minRemovalsUniqueTagCounts(tags) {
      const freq = new Map();
      for (const ch of tags) freq.set(ch, (freq.get(ch) || 0) + 1);
      const counts = [...freq.values()].sort((a, b) => b - a);
      let deletions = 0;
      let limit = tags.length;
      for (const count of counts) {
        const keep = Math.min(count, limit);
        deletions += count - keep;
        limit = Math.max(keep - 1, 0);
      }
      return deletions;
    }
tests:
  - {id: t1, args: ["aabbcc"], expected: 3, description: "Example 1 - three-way tie, one letter removed entirely"}
  - {id: t2, args: ["aaabbc"], expected: 0, description: "Example 2 - already distinct"}
  - {id: t3, args: ["bbbaaacc"], expected: 2, description: "Example 3 - reduction cascades into an existing count"}
  - {id: t4, hidden: true, args: [""], expected: 0, description: "Empty string"}
  - {id: t5, hidden: true, args: ["z"], expected: 0, description: "Single character"}
  - {id: t6, hidden: true, args: ["abcdefghijklmnopqrstuvwxyz"], expected: 25, description: "All 26 letters once - all but one must be deleted"}
  - {id: t7, hidden: true, args: ["aaaabbbbccccdddd"], expected: 6, description: "Four-way tie at 4 - staircase down to 4, 3, 2, 1"}
  - {id: t8, hidden: true, args: ["qqqqqwwwwweeeeerrrrrttttty"], expected: 11, description: "Ties high up plus a singleton that ends up removed"}
  - {id: t9, hidden: true, args: ["ppppppppppkkkkkkkkkkmmmmmmmmmmxyz"], expected: 5, description: "Large ties plus several singletons"}
  - {id: t10, hidden: true, args: [""], expected: 1, description: "Stress - 1000 characters with long runs"}
expected_concepts:
  - "frequency counting with a 26-slot array or hash map"
  - "greedy: process counts from largest to smallest and cap each below the previous kept count"
  - "letters reduced to zero no longer conflict"
  - "O(n) counting plus O(k log k) for k distinct letters"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Counts letters, sorts the counts descending and caps each one just below the previous kept count (or uses a used-count set), explains why the greedy is optimal and that zero counts never conflict, and gives O(n) time with O(1) extra space for a fixed alphabet."
  good: "Correct greedy using a set of used counts that decrements on collision, with the right complexity after a hint."
  weak: "Deletes whole letters on any collision, treats zero as a conflicting count, or tries subsets of deletions."
  criteria:
    correctness: "All tests pass, including empty input, all-distinct letters and multi-way ties."
    efficiency: "Linear in the string length; the work on counts is bounded by the alphabet size."
    code_quality: "Separates counting from the greedy pass; meaningful names such as keep and limit."
    edge_cases: "Empty string, single letter, all 26 letters once and cascades where a reduced count hits an existing one."
    communication: "Argues why lowering the smaller of two colliding counts never costs more than lowering the larger."
hints:
  - "Only the number of times each letter appears matters, not where it appears."
  - "Handle the counts from largest to smallest; each count must end up strictly below the count you kept for the previous letter, unless it reaches zero."
  - "Sort the counts in descending order and track the highest count still allowed; for each count keep the smaller of the count and that allowance, add the difference to the answer, and set the allowance to one less than what you kept, never going below zero."
followups:
  - "How does the solution change if deleting a character of letter x costs a weight w(x)?"
  - "What if the alphabet were all Unicode code points instead of 26 letters?"
  - "How would you return which characters to delete, not just how many?"
common_errors:
  - "Treating a count of zero as a value that must also be unique, which over-counts deletions."
  - "Only comparing each count with its neighbour in the original order instead of handling them in sorted order."
  - "Letting the allowance go negative and adding negative deletions."
  - "Deleting a whole letter whenever two counts collide instead of decrementing by one."
