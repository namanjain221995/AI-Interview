role_tags: [security, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Repeated Payload Fingerprints

  An intrusion-detection rule flags byte patterns that recur inside a single request payload. Given a
  `payload` made of lowercase letters and digits and a window size `length`, return every substring of
  exactly `length` characters that occurs **at least twice** in `payload`.

  - Occurrences may overlap.
  - List each repeated substring once, sorted in ascending lexicographic order by character code
    (digits sort before letters).
  - Return `[]` when nothing repeats, including when `length` is greater than the payload length.

  ### Example 1
  ```
  Input:  payload = "ab12ab12ab", length = 4
  Output: ["12ab", "ab12", "b12a"]
  Explanation: The windows are ab12, b12a, 12ab, 2ab1, ab12, b12a, 12ab; only 2ab1 occurs once.
  ```

  ### Example 2
  ```
  Input:  payload = "zzzz", length = 3
  Output: ["zzz"]
  ```

  ### Constraints
  - `0 <= payload.length <= 10^4`
  - `1 <= length <= 10^4`
  - `payload` contains only lowercase English letters and digits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: repeated_fingerprints
  params:
  - {name: payload, type: string}
  - {name: length, type: int}
  return_type: string[]
  comparison: exact
reference_solutions:
  python: |
    def repeated_fingerprints(payload: str, length: int) -> list[str]:
        seen: set[str] = set()
        repeated: set[str] = set()
        for start in range(len(payload) - length + 1):
            window = payload[start : start + length]
            if window in seen:
                repeated.add(window)
            else:
                seen.add(window)
        return sorted(repeated)
  javascript: |
    function repeatedFingerprints(payload, length) {
      const seen = new Set();
      const repeated = new Set();
      for (let start = 0; start + length <= payload.length; start++) {
        const window = payload.slice(start, start + length);
        if (seen.has(window)) repeated.add(window);
        else seen.add(window);
      }
      return [...repeated].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
