expected_concepts: [fixed-size sliding window over a string, hash set of windows already seen, separate set so each repeat is reported once, rolling hash for long windows, sorting the result]
optimal_complexity: {time: 'O(n * L) with substring hashing, O(n) expected with a rolling hash, plus sorting the output', space: O(n * L)}
rubric:
  excellent: Slides a window with seen and repeated sets, reports each repeat once in sorted order, handles length greater than the payload, and explains a rolling hash for long windows including collision handling.
  good: Correct set-based solution with sorted output; rolling hash mentioned after a prompt.
  weak: Compares every pair of windows, lists repeats multiple times, misses overlapping occurrences, or crashes when length exceeds the payload.
  criteria: {correctness: 'All tests pass, including overlaps, windows that repeat three times and an empty payload.', efficiency: One pass with hashing; no pairwise window comparison., code_quality: Loop bounds are clear and the two sets have descriptive names., edge_cases: 'Empty payload, length equal to or larger than the payload, and length one.', communication: Explains the cost of hashing each window and when a rolling hash pays off.}
hints: ['Every candidate is one of the windows of the given size, so look at each window exactly once.', Remember the windows you have already met in a set; meeting one again means it repeats. Make sure a window that appears three times is still reported only once., 'Slide a window across the payload, keep one set of windows seen and another set of windows seen at least twice, and finally return the second set in sorted order. For very long windows, a rolling hash avoids rebuilding each substring.']
followups: ['How would a rolling hash change the complexity, and how would you deal with hash collisions?', 'What changes if you need the start positions of every repeated window?', 'How would you find the longest substring that repeats, for any window size?']
common_errors: ['Adding a window to the result every time it is seen again, producing duplicates in the output.', Looping to the payload length instead of payload length minus window length plus one., Returning the windows in discovery order instead of sorted order.]
