title: Minimum Fleet From Peer Reports
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, platform, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Fleet From Peer Reports

  An inventory survey asked some devices in an edge fleet one question: how many **other** devices in
  the fleet run exactly the same firmware build as you? `reports[i]` is the answer from the `i`-th
  surveyed device.

  - Every device runs exactly one firmware build, and every answer is accurate.
  - Each surveyed device answered once, but not every device in the fleet was surveyed.

  Return the **smallest total number of devices** (surveyed or not) the fleet could contain while
  agreeing with every report. Return `0` when there are no reports.

  ### Example 1
  ```
  Input:  reports = [2, 0, 2, 1]
  Output: 6
  Explanation: The two devices answering 2 can share one build of 3 devices (one unsurveyed). The device answering 0 is alone on its build. The device answering 1 needs one unsurveyed partner. 3 + 1 + 2 = 6.
  ```

  ### Example 2
  ```
  Input:  reports = [3, 3, 3, 3, 3]
  Output: 8
  Explanation: A build where each device sees 3 others holds 4 devices, so five devices answering 3 need two such builds: 8 devices.
  ```

  ### Constraints
  - `0 <= reports.length <= 1000`
  - `0 <= reports[i] < 1000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: minimum_fleet_from_peer_reports
  params:
  - {name: reports, type: 'int[]'}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def minimum_fleet_from_peer_reports(reports: list[int]) -> int:
        counts: dict[int, int] = {}
        for answer in reports:
            counts[answer] = counts.get(answer, 0) + 1
        total = 0
        for answer, devices in counts.items():
            build_size = answer + 1
            builds = (devices + build_size - 1) // build_size
            total += builds * build_size
        return total
  javascript: |
    function minimumFleetFromPeerReports(reports) {
      const counts = new Map();
      for (const answer of reports) counts.set(answer, (counts.get(answer) || 0) + 1);
      let total = 0;
      for (const [answer, devices] of counts) {
        const buildSize = answer + 1;
        total += Math.ceil(devices / buildSize) * buildSize;
      }
      return total;
    }
