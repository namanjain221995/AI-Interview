expected_concepts: [devices with different answers cannot share a build, an answer r implies a build of exactly r + 1 devices, ceiling division to count builds per answer, hash map of answer counts]
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Derives that answer r means a build of r + 1 devices, groups equal answers, uses ceiling division per answer, and proves the bound is achievable and minimal.
  good: Reaches the per-answer ceiling formula with some prompting and implements it correctly.
  weak: Adds r + 1 for every distinct answer only, adds r + 1 for every device, or mishandles answers of zero.
  criteria: {correctness: 'All tests pass, including zero answers and groups that overflow one build.', efficiency: Linear counting pass and one pass over distinct answers., code_quality: Ceiling division written clearly without floating-point pitfalls., edge_cases: 'Empty input, answers of zero and a single large answer.', communication: Explains both why devices with different answers are on different builds and why groups of r + 1 are packed fully.}
hints: [Two devices that gave different answers can never run the same build. Consider each answer value on its own., 'A device answering r sits on a build with exactly r + 1 devices, so at most r + 1 of the devices that answered r can share one build.', 'For each distinct answer r reported by c devices you need the ceiling of c divided by r + 1 builds, each contributing r + 1 devices; add these up over all answers.']
followups: [Prove that packing devices with equal answers into as few builds as possible is optimal., 'In the smallest fleet, how many devices were never surveyed, and how many builds are in use?', 'If every device in the fleet had answered, how would you detect a set of reports that cannot all be accurate?']
common_errors: ['Counting r + 1 once per distinct answer, ignoring that too many equal answers overflow one build.', 'Counting r + 1 for every device, which double counts devices that share a build.', Using floating-point division for the ceiling and getting rounding errors.]
