expected_concepts:
  - single pass counting exact matches
  - per-digit frequency counts of the unmatched positions
  - minimum of the two counts per digit for misplaced matches
  - not double counting exact matches as misplaced
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Counts exact matches in one pass while tallying unmatched digits of each string in fixed-size arrays, sums the per-digit minimum for misplaced matches, explains why that respects the use-at-most-once rule, and states O(n) time and O(1) space.
  good: Correct answer with a hash map or two passes, or after fixing a duplicate-digit bug found by testing.
  weak: Counts every guess digit present anywhere in the secret, double counts exact matches, or uses an O(n^2) matching loop without discussing better.
  criteria:
    correctness: All tests pass, including repeated digits and fully exact or fully misplaced guesses.
    efficiency: Linear time; the digit alphabet is fixed so the counters are constant size.
    code_quality: Clear names for the exact count and the leftover digit tallies.
    edge_cases: Length 1, all exact, repeated digits in either string and leading zeros.
    communication: Walks through the repeated-digit example to justify the minimum rule.
hints:
  - Exact matches are easy to count position by position. The tricky part is the misplaced count when digits repeat.
  - After setting aside the exact positions, think about how many times each digit is still available in the secret and how many times it was still asked for in the guess.
  - In one pass count exact positions and, for every non-exact position, tally the secret digit and the guess digit separately in ten counters each; the misplaced score is the sum over digits of the smaller of the two tallies.
followups:
  - How would you score codes over a larger alphabet, such as letters and digits?
  - How would you choose the next guess to narrow down the secret as fast as possible?
  - Can you compute both scores in a single counter array instead of two?
  - What changes if guess and secret could have different lengths?
common_errors:
  - Counting a guess digit as misplaced whenever it appears anywhere in the secret, ignoring how many times.
  - Counting exact matches again as misplaced.
  - Matching misplaced digits before exact ones, which can steal a digit that should have been exact.
  - Converting the code to an integer, which drops leading zeros.
