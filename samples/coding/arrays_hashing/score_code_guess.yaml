version: 1
slug: score_code_guess
title: Score an Unlock Code Guess
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [frontend, mobile, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Score an Unlock Code Guess

  A mobile app's onboarding tutorial includes a small puzzle: the player tries to guess a secret unlock
  code made of digits, and after each attempt the app shows feedback. You are writing the scoring
  function.

  Given two digit strings `secret` and `guess` of equal length, return `[exact, misplaced]` where:

  - `exact` is the number of positions `i` where `guess[i] == secret[i]`.
  - `misplaced` is the number of **additional** digit matches: digits of `guess` that appear in `secret`
    but not at the same position.
  - Every digit of `secret` and every digit of `guess` can take part in **at most one** match, and exact
    matches are claimed first. So a guess digit repeated more often than it occurs in the secret only
    scores as many times as the secret can supply it.

  ### Example 1
  ```
  Input:  secret = "4271", guess = "1247"
  Output: [1, 3]
  Explanation: Only the 2 is in the right place; 1, 4 and 7 are in the secret at other positions.
  ```

  ### Example 2
  ```
  Input:  secret = "5530", guess = "3555"
  Output: [1, 2]
  Explanation: The 5 at index 1 is exact. The secret has one more 5 and one 3 left, so the two extra 5s in the guess earn only one misplaced point, plus one for the 3.
  ```

  ### Constraints
  - `1 <= secret.length <= 1000`
  - `guess.length == secret.length`
  - `secret` and `guess` contain only the digits `0`-`9` (leading zeros allowed)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: score_code_guess
  params:
    - {name: secret, type: "string"}
    - {name: guess, type: "string"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def score_code_guess(secret: str, guess: str) -> list[int]:
        exact = 0
        secret_left = [0] * 10
        guess_left = [0] * 10
        for s, g in zip(secret, guess):
            if s == g:
                exact += 1
            else:
                secret_left[ord(s) - 48] += 1
                guess_left[ord(g) - 48] += 1
        misplaced = sum(min(secret_left[d], guess_left[d]) for d in range(10))
        return [exact, misplaced]
  javascript: |
    function scoreCodeGuess(secret, guess) {
      let exact = 0;
      const secretLeft = new Array(10).fill(0);
      const guessLeft = new Array(10).fill(0);
      for (let i = 0; i < secret.length; i++) {
        if (secret[i] === guess[i]) {
          exact++;
        } else {
          secretLeft[secret.charCodeAt(i) - 48]++;
          guessLeft[guess.charCodeAt(i) - 48]++;
        }
      }
      let misplaced = 0;
      for (let d = 0; d < 10; d++) misplaced += Math.min(secretLeft[d], guessLeft[d]);
      return [exact, misplaced];
    }
