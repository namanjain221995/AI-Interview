expected_concepts:
  - "greedy: the cheapest k tasks minimise the time for k tasks"
  - sorting the durations once
  - prefix sums of sorted durations
  - binary search (upper bound) per budget
  - 64-bit running totals
optimal_complexity: {time: O((n + q) log n), space: O(n)}
rubric:
  excellent: Justifies the greedy choice of the shortest tasks, sorts once, builds prefix sums and answers each budget with an upper-bound binary search, using 64-bit sums and stating O((n + q) log n).
  good: Correct greedy with sorting and prefix sums but a linear scan per budget, or a binary search that needed a fix at the boundary.
  weak: Re-sorts per budget, tries subsets, treats the budget as a strict limit, or overflows the running total.
  criteria:
    correctness: All tests pass, including budgets that exactly equal a prefix sum and a budget of zero.
    efficiency: One sort plus a logarithmic search per budget.
    code_quality: Does not mutate the caller's input; the binary search has clear invariants.
    edge_cases: Zero budget, budgets above the total, duplicate durations and sums beyond 32 bits.
    communication: Explains why taking the shortest tasks first is always optimal.
hints:
  - If you want to finish as many tasks as possible, which tasks would you pick first?
  - After sorting the durations, the time needed for the k cheapest tasks is a running total; the answer for a budget is how many running totals stay within it.
  - Sort the durations once, build the running totals with a 64-bit accumulator, and for each budget binary search for the first running total that is strictly greater than the budget; its index is the count.
followups:
  - How would you also return which tasks were chosen for each budget?
  - What changes if tasks keep arriving between questions?
  - If budgets arrive sorted, can you answer them with a single sweep instead of binary searches?
common_errors:
  - Using a strict comparison so a budget exactly equal to a running total is under-counted by one.
  - Accumulating the running total in a 32-bit integer.
  - Sorting the durations again for every budget.
  - Sorting the budgets and losing the original answer order.
