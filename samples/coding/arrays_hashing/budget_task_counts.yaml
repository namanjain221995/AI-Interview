version: 1
slug: budget_task_counts
title: Tasks That Fit Each Budget
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Tasks That Fit Each Budget

  A batch runner keeps a backlog of independent maintenance tasks; `durations[i]` is how many minutes
  task `i` takes. Operators ask capacity questions: *"If I have `budget` minutes, what is the largest
  number of different tasks I could finish?"* A chosen set of tasks fits when the sum of their durations
  is **at most** the budget. Each task can be chosen at most once per question.

  Return an array `answers` with the same length as `budgets`, where `answers[j]` is the maximum number of
  tasks that fit in `budgets[j]`. Every question is answered against the full backlog; answering one
  does not use up any tasks.

  ### Example 1
  ```
  Input:  durations = [4, 2, 7, 1], budgets = [3, 10, 0, 20]
  Output: [2, 3, 0, 4]
  Explanation: the cheapest tasks are 1, 2, 4, 7. Budget 3 fits 1 + 2, budget 10 fits 1 + 2 + 4, budget 0 fits nothing and budget 20 fits all four.
  ```

  ### Example 2
  ```
  Input:  durations = [5, 5, 5], budgets = [4, 5, 14, 15]
  Output: [0, 1, 2, 3]
  ```

  ### Constraints
  - `1 <= durations.length <= 10^4`
  - `1 <= durations[i] <= 10^9`
  - `1 <= budgets.length <= 10^4`
  - `0 <= budgets[j] <= 2 * 10^9`
  - The sum of all durations can exceed the 32-bit integer range.

  **Follow-up:** can you answer all questions in `O((n + q) log n)` time instead of re-scanning the backlog for each one?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: budget_task_counts
  params:
    - {name: durations, type: "int[]"}
    - {name: budgets, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right
    from itertools import accumulate


    def budget_task_counts(durations: list[int], budgets: list[int]) -> list[int]:
        # Cheapest tasks first: prefix[k - 1] is the least time needed to finish k tasks.
        prefix = list(accumulate(sorted(durations)))
        return [bisect_right(prefix, budget) for budget in budgets]
  javascript: |
    function budgetTaskCounts(durations, budgets) {
      const sorted = [...durations].sort((a, b) => a - b);
      const prefix = [];
      let running = 0;
      for (const d of sorted) {
        running += d;
        prefix.push(running);
      }
      return budgets.map((budget) => {
        let lo = 0;
        let hi = prefix.length; // first index whose prefix exceeds the budget
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (prefix[mid] <= budget) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      });
    }
