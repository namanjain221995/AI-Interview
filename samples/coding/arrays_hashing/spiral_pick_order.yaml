expected_concepts:
  - boundary pointers (top, bottom, left, right) shrinking after each side
  - guarding the bottom-row and left-column passes for single rows or columns
  - direction vector plus visited marks as an alternative
  - every cell visited exactly once, O(m * n)
optimal_complexity: {time: O(m * n), space: O(1)}
rubric:
  excellent: Uses four shrinking boundaries (or a direction-turn simulation) with correct guards for single rows and columns, verifies on a non-square rack and states O(m * n) time with O(1) extra space beyond the output.
  good: Correct traversal after fixing a duplicate-visit bug on a non-square rack found by testing, or uses a visited grid with O(m * n) extra space.
  weak: Revisits bins on single-row or single-column racks, skips the inner ring, or only works for square racks.
  criteria:
    correctness: All tests pass, including single rows, single columns and tall or wide racks.
    efficiency: Each bin is read once; no repeated scanning of the rack.
    code_quality: Boundary names are clear and the four passes are easy to follow.
    edge_cases: 1 x 1, single row, single column, and racks whose last ring is a single line.
    communication: Walks through a 3 x 4 example and explains why the extra guards are needed.
hints:
  - Think of the route as peeling the rack one outer ring at a time, with each ring made of four straight passes.
  - Keep track of the first and last unvisited row and column, and shrink the matching boundary right after each straight pass.
  - Walk the top row, then the right column, then the bottom row backwards, then the left column upwards, moving the boundary after each pass; only do the bottom-row and left-column passes if the boundaries have not crossed, otherwise a single row or column gets visited twice.
followups:
  - How would you generate the route counter-clockwise, or starting from a different corner?
  - How would you fill an empty m x n rack with the numbers 1 to m * n in spiral order?
  - Can you produce the route lazily, one bin at a time, as an iterator?
  - How would you return the route from the centre outwards instead?
common_errors:
  - Missing the guard before the bottom-row or left-column pass, which revisits bins on non-square racks.
  - Off-by-one boundaries so the corner bins are visited twice or skipped.
  - Assuming the rack is square.
  - Looping on visited cells forever in the direction-vector approach when the turn check is wrong.
