expected_concepts:
  - index mapping for a 90 degree clockwise rotation
  - transpose followed by reversing each row
  - in-place rotation with O(1) extra memory (layer-by-layer four-way swap as an alternative)
  - odd versus even grid sizes
optimal_complexity: {time: O(n^2), space: O(1)}
rubric:
  excellent: Derives the index mapping, implements the in-place transpose-then-mirror (or four-way layer swap) without off-by-one errors, explains why it is a clockwise turn and states O(n^2) time with O(1) extra space.
  good: Correct rotation using a new grid (O(n^2) extra space), or the in-place version after a small fix found by testing.
  weak: Rotates counter-clockwise, only transposes, or the layer swap overwrites cells before they are saved.
  criteria:
    correctness: All tests pass for odd and even sizes, including 1 x 1.
    efficiency: Every cell is touched a constant number of times; the in-place version uses O(1) extra memory.
    code_quality: Clear separation of the transpose and mirror steps or well-named layer and offset variables.
    edge_cases: 1 x 1 grid, odd centre cell, duplicate values and negative codes.
    communication: Explains the index mapping and checks it on a small example before coding.
hints:
  - Work out where the cell at row r and column c ends up after a quarter turn clockwise, and check it on a 2 x 2 grid.
  - A clockwise quarter turn can be built from two simpler in-place reshuffles of the grid, each of which only swaps pairs of cells.
  - Swap every cell above the main diagonal with its mirror below the diagonal (a transpose), then reverse each row from left to right; the result is the clockwise rotation and needs no second grid.
followups:
  - How would you rotate counter-clockwise, or by 180 degrees, with the same building blocks?
  - How would you rotate a rectangular m x n map, and why can that not be done in place in the same way?
  - What if the kiosk only needs to read the rotated map, never store it — can you avoid moving data at all?
  - How would you rotate by k quarter turns efficiently for large k?
common_errors:
  - Reversing the rows before transposing, which produces a counter-clockwise rotation.
  - Transposing over the whole grid instead of one triangle, which swaps every pair twice and leaves the grid unchanged.
  - Off-by-one errors in the layer bounds of the four-way swap, especially on odd sizes.
  - Writing into the same grid while still reading from it in the naive mapping, which overwrites values.
