role_tags: [frontend, mobile, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Rotate a Seat Map Clockwise

  A venue's ticketing kiosks store each hall's seat map as a square grid of seat codes, with row 0
  nearest the stage. Some kiosks are mounted in portrait orientation, so the map they display has to be
  turned **90 degrees clockwise** first.

  Given an `n x n` grid `grid`, return the grid rotated 90 degrees clockwise:

  - The first row of the input becomes the **last column** of the output (read top to bottom), the second
    row becomes the second-to-last column, and so on.
  - Equivalently, `result[r][c] = grid[n - 1 - c][r]`.
  - Seat codes are arbitrary integers that may repeat or be negative; move them, never change them.

  You may rotate `grid` in place and return it, or build and return a new grid.

  ### Example 1
  ```
  Input:  grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]
  Output: [[7, 4, 1], [8, 5, 2], [9, 6, 3]]
  Explanation: Row [1, 2, 3] becomes the last column and row [7, 8, 9] becomes the first column.
  ```

  ### Example 2
  ```
  Input:  grid = [[11, 12], [21, 22]]
  Output: [[21, 11], [22, 12]]
  ```

  ### Constraints
  - `1 <= n <= 100`
  - `grid.length == n` and `grid[i].length == n`
  - `-1000 <= grid[i][j] <= 1000`

  **Follow-up:** can you rotate the grid in place using only `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rotate_seat_map_clockwise
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def rotate_seat_map_clockwise(grid: list[list[int]]) -> list[list[int]]:
        n = len(grid)
        # Transpose across the main diagonal, then mirror every row.
        for i in range(n):
            for j in range(i + 1, n):
                grid[i][j], grid[j][i] = grid[j][i], grid[i][j]
        for row in grid:
            row.reverse()
        return grid
  javascript: |
    function rotateSeatMapClockwise(grid) {
      const n = grid.length;
      // Transpose across the main diagonal, then mirror every row.
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const tmp = grid[i][j];
          grid[i][j] = grid[j][i];
          grid[j][i] = tmp;
        }
      }
      for (const row of grid) row.reverse();
      return grid;
    }
