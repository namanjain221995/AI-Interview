expected_concepts: [2D prefix sums (summed-area table), inclusion-exclusion with four corner lookups, padding row and column to avoid boundary checks, O(1) per query after O(m * n) preprocessing, 64-bit totals]
optimal_complexity: {time: O(m * n + q), space: O(m * n)}
rubric:
  excellent: Builds a padded summed-area table in one pass, answers each query with the four-corner inclusion-exclusion formula, keeps totals in 64-bit integers, and explains the O(m * n + q) cost versus summing each rectangle.
  good: Correct prefix-sum solution, possibly row-wise prefix sums with O(rows) per query, or a 2D table that needed a fix for off-by-one indexing.
  weak: Sums every rectangle cell by cell, gets the inclusion-exclusion signs wrong, or overflows 32-bit integers.
  criteria: {correctness: 'All tests pass, including single-row, single-column and full-floor queries.', efficiency: Preprocessing proportional to the grid size and constant work per query., code_quality: A padded table with a clear definition of what each cell stores; no scattered boundary conditionals., edge_cases: 'No queries, one-bay rectangles, rectangles touching the first row or column and totals above the 32-bit range.', communication: Explains why the top-left overlap is added back after subtracting the strips above and to the left.}
hints: ['If you knew the total of every rectangle that starts at the top-left corner of the floor, could you combine a few of them to get any other rectangle?', 'Precompute a table where each cell holds the total of all bays above and to the left of it, inclusive. A query rectangle is that corner total minus the strip above it and the strip to its left, plus the overlap that was subtracted twice.', 'Allocate the table with one extra row and column of zeros so the first row and column need no special cases. Fill each cell from the cell above plus the running total of the current row. For a query, take the cell just past the bottom-right corner, subtract the cells at the top edge and at the left edge, add back the cell diagonally before the top-left corner, and keep everything in 64-bit integers.']
followups: ['How would you support updates to single bays between queries without rebuilding the whole table?', 'How much memory does the table need for a 10^4 x 10^4 floor, and how could you reduce it?', 'How would you find the rectangle of a fixed size with the largest total?', 'Would the approach change if bays could hold negative values, for example pending outbound shipments?']
common_errors: [Getting the inclusion-exclusion signs wrong and subtracting the overlap twice., Off-by-one indexing between the unpadded grid and the padded table., 'Storing the table in 32-bit integers, which overflows on large floors.', 'Recomputing each rectangle cell by cell, which is too slow for many queries.']
