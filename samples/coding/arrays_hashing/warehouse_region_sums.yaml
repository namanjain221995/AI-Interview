time_limit_minutes: 25
prompt_markdown: |
  ## Warehouse Floor Region Totals

  A warehouse floor is mapped as an `m x n` grid of storage bays. `grid[r][c]` is the number of units
  stored in the bay at row `r`, column `c` (rows and columns are 0-indexed).

  Planners send many region queries. Each query `[r1, c1, r2, c2]` describes the rectangle whose top-left
  bay is `(r1, c1)` and whose bottom-right bay is `(r2, c2)`, **both inclusive**. Return the total number
  of units inside each rectangle, as 64-bit integers, in the **same order as the queries**. Return an
  empty list when there are no queries.

  The grid does not change between queries, and a large floor can receive up to `10^5` queries that each
  cover most of it, so summing every rectangle bay by bay is too slow. Answer each query in constant time
  after a single preprocessing pass over the grid.

  ### Example 1
  ```
  Input:  grid = [[3, 0, 1, 4], [5, 6, 3, 2], [1, 2, 0, 1]], queries = [[0, 0, 1, 1], [1, 1, 2, 3], [0, 0, 2, 3]]
  Output: [14, 14, 28]
  Explanation: The first query covers 3 + 0 + 5 + 6; the second covers 6 + 3 + 2 + 2 + 0 + 1; the third is the whole floor.
  ```

  ### Example 2
  ```
  Input:  grid = [[7]], queries = [[0, 0, 0, 0]]
  Output: [7]
  ```

  ### Constraints
  - `1 <= m, n <= 500`
  - `0 <= grid[r][c] <= 10^9`
  - `0 <= queries.length <= 10^5`
  - `0 <= r1 <= r2 < m` and `0 <= c1 <= c2 < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: warehouse_region_sums
  params:
    - {name: grid, type: "int[][]"}
    - {name: queries, type: "int[][]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def warehouse_region_sums(grid: list[list[int]], queries: list[list[int]]) -> list[int]:
        rows, cols = len(grid), len(grid[0])
        # pre[r][c] = total of the rectangle with corners (0, 0) and (r - 1, c - 1)
        pre = [[0] * (cols + 1) for _ in range(rows + 1)]
        for r in range(rows):
            row_total = 0
            for c in range(cols):
                row_total += grid[r][c]
                pre[r + 1][c + 1] = pre[r][c + 1] + row_total
        totals = []
        for r1, c1, r2, c2 in queries:
            totals.append(pre[r2 + 1][c2 + 1] - pre[r1][c2 + 1] - pre[r2 + 1][c1] + pre[r1][c1])
        return totals
  javascript: |
    function warehouseRegionSums(grid, queries) {
      const rows = grid.length;
      const cols = grid[0].length;
      // pre[r][c] = total of the rectangle with corners (0, 0) and (r - 1, c - 1)
      const pre = Array.from({ length: rows + 1 }, () => new Array(cols + 1).fill(0));
      for (let r = 0; r < rows; r++) {
        let rowTotal = 0;
        for (let c = 0; c < cols; c++) {
          rowTotal += grid[r][c];
          pre[r + 1][c + 1] = pre[r][c + 1] + rowTotal;
        }
      }
      return queries.map(
        ([r1, c1, r2, c2]) => pre[r2 + 1][c2 + 1] - pre[r1][c2 + 1] - pre[r2 + 1][c1] + pre[r1][c1],
      );
    }
