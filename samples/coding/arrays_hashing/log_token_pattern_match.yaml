version: 1
slug: log_token_pattern_match
title: Log Line Shape Matcher
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [qa, backend, frontend]
time_limit_minutes: 15
prompt_markdown: |
  ## Log Line Shape Matcher

  A log-analysis tool describes the **shape** of a log line with a short template made of lowercase
  letters, one letter per token. A tokenised log line `tokens` matches a template `pattern` when:

  - `pattern` and `tokens` have the same length, and
  - there is a **one-to-one** correspondence between letters and tokens: wherever the same letter
    appears, the token is the same, and different letters always correspond to different tokens.

  Return `true` if `tokens` matches `pattern`, otherwise `false`. Tokens are compared exactly
  (case-sensitive). An empty pattern matches only an empty token list.

  ### Example 1
  ```
  Input:  pattern = "abca", tokens = ["GET", "/users", "200", "GET"]
  Output: true
  ```

  ### Example 2
  ```
  Input:  pattern = "abca", tokens = ["GET", "/users", "200", "POST"]
  Output: false
  Explanation: Letter a would have to stand for both GET and POST.
  ```

  ### Example 3
  ```
  Input:  pattern = "ab", tokens = ["GET", "GET"]
  Output: false
  Explanation: Letters a and b are different, so they must correspond to different tokens.
  ```

  ### Constraints
  - `0 <= pattern.length <= 300`
  - `0 <= tokens.length <= 300`
  - `pattern` contains only lowercase English letters.
  - Each token is a non-empty string of at most 20 printable ASCII characters without spaces.

  **Follow-up:** Can you decide the answer in a single pass and stop as soon as a mismatch is found?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: log_token_pattern_match
  params:
    - {name: pattern, type: "string"}
    - {name: tokens, type: "string[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def log_token_pattern_match(pattern: str, tokens: list[str]) -> bool:
        if len(pattern) != len(tokens):
            return False
        letter_to_token: dict[str, str] = {}
        token_to_letter: dict[str, str] = {}
        for letter, token in zip(pattern, tokens):
            if letter_to_token.setdefault(letter, token) != token:
                return False
            if token_to_letter.setdefault(token, letter) != letter:
                return False
        return True
  javascript: |
    function logTokenPatternMatch(pattern, tokens) {
      if (pattern.length !== tokens.length) return false;
      const letterToToken = new Map();
      const tokenToLetter = new Map();
      for (let i = 0; i < pattern.length; i++) {
        const letter = pattern[i];
        const token = tokens[i];
        if (letterToToken.has(letter) && letterToToken.get(letter) !== token) return false;
        if (tokenToLetter.has(token) && tokenToLetter.get(token) !== letter) return false;
        letterToToken.set(letter, token);
        tokenToLetter.set(token, letter);
      }
      return true;
    }
tests:
  - {id: t1, args: ["abca", ["GET", "/users", "200", "GET"]], expected: true, description: "Example 1"}
  - {id: t2, args: ["abca", ["GET", "/users", "200", "POST"]], expected: false, description: "Example 2 - same letter, different tokens"}
  - {id: t3, args: ["ab", ["GET", "GET"]], expected: false, description: "Example 3 - different letters, same token"}
  - {id: t4, hidden: true, args: ["", []], expected: true, description: "Empty pattern and empty token list match"}
  - {id: t5, hidden: true, args: ["", ["INFO"]], expected: false, description: "Empty pattern against a non-empty line"}
  - {id: t6, hidden: true, args: ["aab", ["x", "x"]], expected: false, description: "Length mismatch"}
  - {id: t7, hidden: true, args: ["ab", ["b", "a"]], expected: true, description: "Tokens equal to letters of the pattern but swapped; still a valid bijection"}
  - {id: t8, hidden: true, args: ["ab", ["constructor", "toString"]], expected: true, description: "Tokens that collide with built-in object property names in JavaScript"}
  - {id: t9, hidden: true, args: ["aaaa", ["WARN", "WARN", "WARN", "warn"]], expected: false, description: "Case-sensitive token comparison breaks at the end"}
  - {id: t10, hidden: true, args: ["abcabc", ["ts", "svc", "msg", "ts", "svc", "msg"]], expected: true, description: "Repeated three-token cycle"}
  - {id: t11, hidden: true, args: ["abcdefghijklmnopqrstuvwxyzz", ["t0", "t1", "t2", "t3", "t4", "t5", "t6", "t7", "t8", "t9", "t10", "t11", "t12", "t13", "t14", "t15", "t16", "t17", "t18", "t19", "t20", "t21", "t22", "t23", "t24", "t25", "t0"]], expected: false, description: "26 distinct letters where the final repeated letter maps to the wrong token"}
expected_concepts:
  - "bijection check needs both directions"
  - "two hash maps (or map plus set of used tokens)"
  - "early exit on length mismatch"
  - "O(n) time with O(n) space"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Checks lengths first, maintains letter-to-token and token-to-letter maps (or a map plus a used set), explains why both directions are needed and covers empty inputs and case sensitivity."
  good: "Correct solution with two maps; may miss the reverse direction initially and fix it after a failing test."
  weak: "Checks only one direction, compares lengths after indexing out of bounds, or relies on plain JavaScript objects that collide with built-in property names."
  criteria:
    correctness: "All tests pass, including both injectivity failures and the empty cases."
    efficiency: "Single pass with constant-time map operations."
    code_quality: "Uses real map or dictionary types rather than object literals with prototype properties; clear names for both directions."
    edge_cases: "Empty inputs, length mismatch, tokens that look like letters, and case differences."
    communication: "Explains what a one-to-one mapping means with a counter-example for each direction."
hints:
  - "What has to be true about the lengths, and what does it mean for the same letter or for two different letters to appear in the template?"
  - "Remembering which token each letter maps to catches one kind of mismatch; think of an input that slips through a single map and what extra record would catch it."
  - "If the lengths differ return false. Otherwise walk both sequences together keeping a letter-to-token map and a token-to-letter map; if either map already holds a different partner for the current pair, return false, otherwise record the pair, and return true at the end."
followups:
  - "Give an input that passes a check using only the letter-to-token map but should fail."
  - "How would you match a log line that is a single space-separated string instead of a token list?"
  - "How would you group thousands of log lines by their shape efficiently?"
  - "What problems could arise with plain JavaScript objects used as maps here?"
common_errors:
  - "Checking only that each letter maps to a consistent token, so two letters may share a token."
  - "Forgetting the length check and indexing past the end of the shorter sequence."
  - "Using a plain JavaScript object, where tokens such as constructor or toString read inherited properties."
  - "Lower-casing tokens before comparing, which breaks exact matching."
