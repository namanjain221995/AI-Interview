expected_concepts:
  - difference of totals must be even
  - required gap a_points - b_points equals half the difference
  - hash set of one squad's estimates for O(1) partner lookup
  - tie-breaking by the smallest a_points
  - O(n + m) instead of checking every pair
optimal_complexity: {time: O(n + m), space: O(m)}
rubric:
  excellent: Derives that a_points - b_points must equal half the total difference, rejects odd differences, uses a hash set for linear-time lookup, applies the tie-break and handles the already-balanced case.
  good: Reaches the half-difference insight and a correct set-based or sorted solution, possibly after fixing the tie-break or the odd-difference case.
  weak: Tries every pair without deriving the formula, ignores the tie-break, or returns a swap when the difference is odd.
  criteria:
    correctness: All tests pass, including empty results and already-equal totals.
    efficiency: Linear time with a hash set; a sort-plus-two-pointer solution is acceptable with the right complexity stated.
    code_quality: Names the required gap clearly (for example shift or delta) and avoids recomputing sums inside the loop.
    edge_cases: Odd differences, squad B heavier than squad A, duplicate estimates and single-ticket squads.
    communication: Explains the algebra behind the half-difference before coding.
hints:
  - Write down how each squad's total changes when A gives away a ticket worth x and receives one worth y.
  - Setting the two new totals equal fixes the exact gap between x and y; what does that say when the totals differ by an odd number?
  - Compute half of the total difference, put squad B's estimates in a hash set, then scan squad A's estimates and keep the smallest one whose partner, the estimate minus that half difference, is in the set.
followups:
  - How would you return every distinct balancing swap instead of one?
  - What changes if each squad may swap up to two tickets?
  - How would you solve it with O(1) extra space if both arrays were already sorted?
common_errors:
  - Forgetting that an odd difference can never be balanced.
  - Using the full difference instead of half of it as the required gap.
  - Returning the first valid swap found rather than the one with the smallest a_points.
  - Getting the sign of the gap wrong when squad B has the larger total.
