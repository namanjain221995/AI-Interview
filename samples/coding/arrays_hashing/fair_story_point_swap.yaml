title: Fair Story Point Swap
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [tech_lead, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Fair Story Point Swap

  Two squads are splitting the next sprint. Squad A owns tickets whose story-point estimates are
  listed in `team_a`, and squad B owns the tickets in `team_b`. To balance the load, each squad hands
  **exactly one** of its tickets to the other squad. After that single swap both squads must carry the
  same total number of story points.

  Return `[a_points, b_points]`, where `a_points` is the estimate of the ticket squad A gives away and
  `b_points` is the estimate of the ticket squad B gives away.

  - If several swaps balance the totals, return the one with the **smallest `a_points`**; if that still
    ties, the one with the smallest `b_points`.
  - If no single swap balances the totals, return an empty array `[]`.
  - A swap is required even when the totals are already equal: then only two tickets with the same
    estimate can be exchanged.

  ### Example 1
  ```
  Input:  team_a = [4, 1, 7, 6], team_b = [2, 5, 3]
  Output: [6, 2]
  Explanation: totals are 18 and 10. Giving 6 for 2 makes both 14. Giving 7 for 3 also works, but 6 < 7.
  ```

  ### Example 2
  ```
  Input:  team_a = [2, 4], team_b = [5]
  Output: []
  Explanation: totals are 6 and 5. Any swap changes the gap between the totals by an even amount, so an odd gap of 1 can never close.
  ```

  ### Example 3
  ```
  Input:  team_a = [5, 3, 2], team_b = [3, 7]
  Output: [3, 3]
  Explanation: totals are already 10 and 10, so the two tickets must have equal estimates.
  ```

  ### Constraints
  - `1 <= team_a.length, team_b.length <= 10^4`
  - `1 <= team_a[i], team_b[j] <= 10^5`
  - Estimates may repeat within a squad.

  **Follow-up:** can you solve it in `O(n + m)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: fair_story_point_swap
  params:
    - {name: team_a, type: "int[]"}
    - {name: team_b, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def fair_story_point_swap(team_a: list[int], team_b: list[int]) -> list[int]:
        diff = sum(team_a) - sum(team_b)
        if diff % 2 != 0:
            return []
        shift = diff // 2  # a_points - b_points must equal this
        available = set(team_b)
        best = None
        for a in team_a:
            if a - shift in available and (best is None or a < best):
                best = a
        return [] if best is None else [best, best - shift]
  javascript: |
    function fairStoryPointSwap(teamA, teamB) {
      const sumA = teamA.reduce((s, v) => s + v, 0);
      const sumB = teamB.reduce((s, v) => s + v, 0);
      const diff = sumA - sumB;
      if (diff % 2 !== 0) return [];
      const shift = diff / 2;
      const available = new Set(teamB);
      let best = null;
      for (const a of teamA) {
        if (available.has(a - shift) && (best === null || a < best)) best = a;
      }
      return best === null ? [] : [best, best - shift];
    }
