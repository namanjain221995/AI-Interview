version: 1
slug: sort_by_environment_priority
title: Order Events by Environment Priority
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, platform, frontend]
time_limit_minutes: 15
prompt_markdown: |
  ## Order Events by Environment Priority

  A release dashboard receives deployment events, each identified only by the name of the environment it
  targets, in `events`. The team also keeps a list `priority` of **distinct** environment names in the
  order they want to see them.

  Return the events reordered as follows:

  1. Events whose environment appears in `priority` come first, grouped in the order those environments
     appear in `priority`. Every event is kept, including duplicates.
  2. All remaining events follow, sorted in **ascending lexicographic order** (plain character-by-character
     comparison of the names, so `"prod"` comes before `"prod-10"`, which comes before `"prod-2"`).

  Environments listed in `priority` that have no events contribute nothing to the output.

  ### Example 1
  ```
  Input:  events = ["staging", "prod", "dev", "qa", "prod", "staging"], priority = ["prod", "staging"]
  Output: ["prod", "prod", "staging", "staging", "dev", "qa"]
  Explanation: prod and staging lead in priority order; dev and qa follow alphabetically.
  ```

  ### Example 2
  ```
  Input:  events = ["sandbox", "canary", "perf"], priority = ["prod"]
  Output: ["canary", "perf", "sandbox"]
  Explanation: prod has no events, so everything is sorted alphabetically.
  ```

  ### Constraints
  - `0 <= events.length <= 10^4`
  - `0 <= priority.length <= 100`
  - Every name has 1 to 20 characters, each a lowercase English letter, a digit or `-`.
  - The names in `priority` are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_by_environment_priority
  params:
    - {name: events, type: "string[]"}
    - {name: priority, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def sort_by_environment_priority(events: list[str], priority: list[str]) -> list[str]:
        rank = {env: i for i, env in enumerate(priority)}
        buckets: list[list[str]] = [[] for _ in priority]
        rest: list[str] = []
        for env in events:
            if env in rank:
                buckets[rank[env]].append(env)
            else:
                rest.append(env)
        ordered: list[str] = []
        for bucket in buckets:
            ordered.extend(bucket)
        return ordered + sorted(rest)
  javascript: |
    function sortByEnvironmentPriority(events, priority) {
      const rank = new Map(priority.map((env, i) => [env, i]));
      const buckets = priority.map(() => []);
      const rest = [];
      for (const env of events) {
        if (rank.has(env)) buckets[rank.get(env)].push(env);
        else rest.push(env);
      }
      rest.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return buckets.flat().concat(rest);
    }
