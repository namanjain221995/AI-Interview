expected_concepts:
  - "hash map from name to priority rank"
  - "bucketing or counting by rank"
  - "custom ordering versus default lexicographic sort"
  - "stable handling of duplicates"
optimal_complexity: {time: "O(n + m log m) where m is the number of unprioritised events", space: "O(n + p)"}
rubric:
  excellent: "Builds a rank map from the priority list, buckets or counts prioritised events by rank, sorts only the leftover events, and explains the cost compared with a single sort using a composite key."
  good: "Correct single sort with a composite key (rank for prioritised names, then the name itself) giving O(n log n), or the bucket approach after a hint."
  weak: "Searches the priority list linearly for every comparison, drops duplicates, or sorts the leftover names numerically or by length."
  criteria:
    correctness: "All tests pass, including empty inputs, priority names with no events and names containing digits and hyphens."
    efficiency: "Constant-time rank lookups; sorting limited to the events outside the priority list."
    code_quality: "Clear separation between the prioritised part and the sorted tail; no mutation surprises."
    edge_cases: "Empty events, empty priority list, all events prioritised and none prioritised."
    communication: "States the ordering rules explicitly and explains how ties within one environment are handled."
hints:
  - "Split the events into two groups first: those whose environment appears in the priority list and those whose environment does not."
  - "A hash map from environment name to its position in the priority list tells you in constant time both whether an event is prioritised and where its group belongs."
  - "Collect the prioritised events into one bucket per priority position and output the buckets in that order, then sort only the leftover events with ordinary string comparison and append them at the end."
followups:
  - "How would you do this with a single call to a sort function and a custom key?"
  - "What if the leftover events had to keep their original arrival order instead of being sorted?"
  - "How would you adapt the solution if names could contain uppercase letters and the comparison had to ignore case?"
common_errors:
  - "Looking up each event's rank with a linear search through the priority list inside a comparator."
  - "Deduplicating events so repeated environments appear only once."
  - "Sorting the tail numerically or by length so that prod-2 is placed before prod-10."
