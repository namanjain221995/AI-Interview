  - {id: t2, args: [["sandbox", "canary", "perf"], ["prod"]], expected: ["canary", "perf", "sandbox"], description: "Example 2 - no event matches the priority list"}
  - {id: t3, hidden: true, args: [[], ["prod"]], expected: [], description: "No events at all"}
  - {id: t4, hidden: true, args: [["dev", "prod"], []], expected: ["dev", "prod"], description: "Empty priority list so everything is sorted"}
  - {id: t5, hidden: true, args: [["qa", "qa", "qa"], ["qa"]], expected: ["qa", "qa", "qa"], description: "All events share one prioritised environment"}
  - {id: t6, hidden: true, args: [["dev", "prod"], ["eu-west", "prod", "dev"]], expected: ["prod", "dev"], description: "Priority list includes an environment with no events"}
  - {id: t7, hidden: true, args: [["prod-2", "prod", "prod-10", "dev"], ["dev"]], expected: ["dev", "prod", "prod-10", "prod-2"], description: "Lexicographic tail with prefixes and digits (not numeric order)"}
  - {id: t8, hidden: true, args: [["us-east", "eu-west", "ap-south", "us-east"], ["us-east", "ap-south", "eu-west"]], expected: ["us-east", "us-east", "ap-south", "eu-west"], description: "Priority order is not alphabetical and must be respected"}
  - {id: t9, hidden: true, args: [["b", "a", "c", "a", "d", "b", "e", "c"], ["c", "a"]], expected: ["c", "c", "a", "a", "b", "b", "d", "e"], description: "Duplicates interleaved in both groups"}
