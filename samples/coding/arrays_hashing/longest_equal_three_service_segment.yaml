version: 1
slug: longest_equal_three_service_segment
title: Longest Evenly Split Traffic Segment
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, sre, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Longest Evenly Split Traffic Segment

  A load balancer spreads requests across three backend services named `x`, `y` and `z`. Its request log
  is a string `log` where the `i`-th character is the service that handled the `i`-th request.

  The SRE team wants the longest stretch of consecutive requests during which traffic was split
  **perfectly evenly**: the stretch contains exactly as many `x` as `y` as `z` requests.

  Return the length of the longest contiguous substring of `log` in which the three letters occur the
  same number of times. A balanced substring must contain every service at least once, so return `0`
  when no non-empty balanced substring exists (including when `log` is empty).

  ### Example 1
  ```
  Input:  log = "xxyzzyxy"
  Output: 6
  Explanation: The stretch "xyzzyx" (indices 1 to 6) has two requests for each service; no longer stretch is balanced.
  ```

  ### Example 2
  ```
  Input:  log = "xxyy"
  Output: 0
  Explanation: Without any z request no non-empty stretch can be balanced.
  ```

  ### Constraints
  - `0 <= log.length <= 10^5`
  - `log` contains only the characters `x`, `y` and `z`

  **Follow-up:** checking every substring is `O(n^2)`; aim for `O(n)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_equal_three_service_segment
  params:
    - {name: log, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_equal_three_service_segment(log: str) -> int:
        first_seen: dict[tuple[int, int], int] = {(0, 0): -1}
        x = y = z = 0
        best = 0
        for i, ch in enumerate(log):
            if ch == "x":
                x += 1
            elif ch == "y":
                y += 1
            else:
                z += 1
            key = (x - y, y - z)
            if key in first_seen:
                best = max(best, i - first_seen[key])
            else:
                first_seen[key] = i
        return best
  javascript: |
    function longestEqualThreeServiceSegment(log) {
      const firstSeen = new Map([["0,0", -1]]);
      let x = 0, y = 0, z = 0, best = 0;
      for (let i = 0; i < log.length; i++) {
        const ch = log[i];
        if (ch === "x") x++;
        else if (ch === "y") y++;
        else z++;
        const key = (x - y) + "," + (y - z);
        if (firstSeen.has(key)) best = Math.max(best, i - firstSeen.get(key));
        else firstSeen.set(key, i);
      }
      return best;
    }
tests:
  - {id: t1, args: ["xxyzzyxy"], expected: 6, description: "Example 1 - balanced segment in the middle"}
  - {id: t2, args: ["xxyy"], expected: 0, description: "Example 2 - service z never appears"}
  - {id: t3, hidden: true, args: [""], expected: 0, description: "Empty log"}
  - {id: t4, hidden: true, args: ["y"], expected: 0, description: "Single request"}
  - {id: t5, hidden: true, args: ["zyx"], expected: 3, description: "Whole log of length 3 is balanced"}
  - {id: t6, hidden: true, args: ["xxxyyyzzz"], expected: 9, description: "Whole log balanced with grouped runs"}
  - {id: t7, hidden: true, args: ["xxxxxxyzx"], expected: 3, description: "Balanced segment only near the end after a long skewed prefix"}
  - {id: t8, hidden: true, args: ["xyzxyzxyzxyzxxxx"], expected: 12, description: "Balanced prefix followed by an unbalanced tail - must use the initial empty prefix"}
  - {id: t9, hidden: true, args: ["xyyzzxxyyzzxxyyzzxxyyzzxxyyzzxy"], expected: 30, description: "Repeated balanced blocks - longest spans several blocks"}
  - {id: t10, hidden: true, args: ["xxxxyxxxxxxxxxxxyxxxxxyxxxxyxyxxxxxyxxxxzyxyyzzyzyyyyyzyyyyyyyzzyyyyyyyyyyyyzzyyyyy"], expected: 12, description: "Skewed traffic around a short balanced core (checked against brute force)"}
  - {id: t11, hidden: true, args: [""], expected: 504, description: "900 random requests (checked against brute force)"}
expected_concepts:
  - prefix counts for each letter
  - encoding balance as the pair of differences (x minus y, y minus z)
  - hash map from difference pair to its first index
  - seeding the map with the empty prefix
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Observes that a substring is balanced exactly when the two prefix differences are equal at both ends, stores the first index of each difference pair seeded with the empty prefix, and states O(n) time and space with a clear argument.
  good: Reaches the prefix-difference idea with a hint and implements it with minor fixes, or gives a correct O(n^2) prefix-count solution and explains the faster approach.
  weak: Only checks every substring with fresh counts (O(n^3)), uses a single difference that misses cases, or forgets the empty prefix.
  criteria:
    correctness: All tests pass, including balanced prefixes and logs with no balanced stretch.
    efficiency: One pass with a hash map keyed by the difference pair.
    code_quality: The key construction is clear and the first-occurrence rule is explicit.
    edge_cases: Empty log, a missing service, whole-log balance and balance starting at index 0.
    communication: Explains why equal difference pairs at two prefixes imply equal counts in between.
hints:
  - Think about running counts of x, y and z from the start of the log. What has to be true about the counts at the start and the end of a balanced stretch?
  - A stretch is balanced when the counts of all three letters grow by the same amount across it, which means the differences between the counts are the same at both ends of the stretch.
  - Walk the log keeping the pair of differences x count minus y count and y count minus z count, remember the first index where each pair occurred with the empty prefix stored at index minus one, and whenever a pair repeats, the distance back to its first index is a balanced length to compare with the best so far.
followups:
  - How would you generalise this to k services?
  - How would you return the start and end positions of the longest segment, breaking ties by the earliest start?
  - What if you wanted the longest segment where no service exceeds the others by more than one request?
  - How would you process an unbounded log stream with limited memory?
common_errors:
  - Tracking only one difference, which treats strings like xxyy as balanced.
  - Forgetting to seed the empty prefix, which misses balanced segments starting at index 0.
  - Overwriting the stored index for a difference pair, which shortens the answer.
  - Returning a non-zero length when one of the services never appears.
