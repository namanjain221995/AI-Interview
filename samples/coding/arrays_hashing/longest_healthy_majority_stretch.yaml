title: "Longest Mostly-Healthy Stretch"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, devops, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Mostly-Healthy Stretch

  A synthetic monitor probes a service once a minute and records each probe's latency in milliseconds in
  `latencies`, in time order. A probe is **healthy** when its latency is **less than or equal to** `slo`,
  and **failing** otherwise.

  Return the length of the **longest contiguous stretch** of probes in which healthy probes **strictly
  outnumber** failing ones. If no such stretch exists, return `0`.

  Aim for a solution that is linear in the number of probes.

  ### Example 1
  ```
  Input:  latencies = [120, 300, 80, 95, 400, 410, 90], slo = 100
  Output: 5
  Explanation: The stretch [80, 95, 400, 410, 90] has three healthy probes and two failing ones. No
               longer stretch has a healthy majority.
  ```

  ### Example 2
  ```
  Input:  latencies = [250, 180], slo = 150
  Output: 0
  Explanation: Both probes fail, so no stretch has a healthy majority.
  ```

  ### Example 3
  ```
  Input:  latencies = [100, 101], slo = 100
  Output: 1
  Explanation: A latency equal to the SLO is healthy. The whole stretch is a 1-1 tie, which is not a
               strict majority.
  ```

  ### Constraints
  - `1 <= latencies.length <= 10^5`
  - `0 <= latencies[i], slo <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_healthy_majority_stretch
  params:
    - {name: latencies, type: "int[]"}
    - {name: slo, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_healthy_majority_stretch(latencies: list[int], slo: int) -> int:
        # balance = healthy minus failing over the prefix; it changes by exactly 1 per probe.
        first_seen: dict[int, int] = {}
        balance = 0
        best = 0
        for i, latency in enumerate(latencies):
            balance += 1 if latency <= slo else -1
            if balance > 0:
                best = i + 1  # the whole prefix has a healthy majority
            else:
                # The earliest prefix with balance - 1 gives the longest window ending here with sum 1.
                if balance - 1 in first_seen:
                    best = max(best, i - first_seen[balance - 1])
                if balance not in first_seen:
                    first_seen[balance] = i
        return best
  javascript: |
    function longestHealthyMajorityStretch(latencies, slo) {
      const firstSeen = new Map();
      let balance = 0;
      let best = 0;
      for (let i = 0; i < latencies.length; i++) {
        balance += latencies[i] <= slo ? 1 : -1;
        if (balance > 0) {
          best = i + 1;
        } else {
          if (firstSeen.has(balance - 1)) best = Math.max(best, i - firstSeen.get(balance - 1));
          if (!firstSeen.has(balance)) firstSeen.set(balance, i);
        }
      }
      return best;
    }
