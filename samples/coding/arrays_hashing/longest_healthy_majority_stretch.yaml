expected_concepts:
  - "map healthy to +1 and failing to -1 so the task becomes longest subarray with positive sum"
  - "prefix balance with a hash map of first occurrence"
  - "the balance changes by one per step, so only balance minus one needs to be looked up"
  - "whole-prefix case when the balance is already positive"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Converts probes to +1/-1, uses a running balance with a first-occurrence map, explains why looking up only balance minus one suffices because the balance moves in unit steps, handles the positive-prefix case and states O(n)."
  good: "Correct prefix-sum solution with first-occurrence map after a hint, or an O(n log n) approach (for example sorting prefix sums) with correct reasoning."
  weak: "Uses an O(n^2) scan of all windows, applies a sliding window that assumes monotonic validity, or treats latency equal to the SLO as failing."
  criteria:
    correctness: "All tests pass, including ties, all-failing input and the latency-equals-SLO boundary."
    efficiency: "Linear time with a hash map (or an array offset by n) for first occurrences."
    code_quality: "Clear naming for balance and first occurrence; stores only the first index of each balance."
    edge_cases: "All failing returns 0, all healthy returns n, single probe, ties of equal length."
    communication: "Explains why a two-pointer sliding window does not work and why the earliest index matters."
hints:
  - "Turn each probe into a score so that a stretch with a healthy majority is simply a stretch whose total score is positive."
  - "With healthy as plus one and failing as minus one, keep a running balance; a window from just after index j to index i is good when the balance at i is greater than the balance at j."
  - "Record the first index at which each balance value appears; if the current balance is positive the whole prefix works, otherwise look up the first index of the current balance minus one, because the balance moves in steps of one so that earlier index is the furthest possible start."
followups:
  - "Why does a classic two-pointer sliding window not work here?"
  - "How would you return the start and end index of the stretch, preferring the earliest on ties?"
  - "What changes if you need healthy probes to be at least twice the failing ones?"
  - "How would you maintain the answer as new probes stream in?"
common_errors:
  - "Treating a latency equal to the SLO as failing."
  - "Overwriting the first-seen index of a balance with later indices, which shortens windows."
  - "Looking up only balance minus one without handling the case where the whole prefix is positive."
  - "Using a sliding window that shrinks greedily, which misses windows whose validity is not monotonic."
