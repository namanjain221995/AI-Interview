title: Parcels Between Dividers
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, frontend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Parcels Between Dividers

  A sorting conveyor is photographed as a string `belt`, where `'*'` is a parcel and `'|'` is a divider.
  Each query `[l, r]` (0-indexed, inclusive) asks about the segment `belt[l..r]` on its own: how many
  parcels in that segment have a divider **inside the segment** somewhere to their left **and**
  somewhere to their right?

  Return the answers as an array in the same order as `queries`.

  **Follow-up:** answer all queries in `O(n + q)` total time.

  ### Example 1
  ```
  Input:  belt = "**|**|***|", queries = [[2, 5], [5, 9]]
  Output: [2, 3]
  Explanation: belt[2..5] is |**| with 2 enclosed parcels; belt[5..9] is |***| with 3.
  ```

  ### Example 2
  ```
  Input:  belt = "*|*|**|*", queries = [[0, 7], [1, 2], [3, 7], [0, 0]]
  Output: [3, 0, 2, 0]
  Explanation: In the whole belt the dividers at 1 and 6 enclose 3 parcels; belt[1..2] has only one divider.
  ```

  ### Constraints
  - `1 <= belt.length <= 10^5`
  - `belt` contains only `'*'` and `'|'`.
  - `0 <= queries.length <= 10^5`
  - `queries[i].length == 2` and `0 <= l <= r < belt.length`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: items_between_barriers
  params:
  - {name: belt, type: string}
  - {name: queries, type: 'int[][]'}
  return_type: int[]
  comparison: exact
reference_solutions:
  python: |
    def items_between_barriers(belt: str, queries: list[list[int]]) -> list[int]:
        n = len(belt)
        parcels_before = [0] * (n + 1)
        for i, ch in enumerate(belt):
            parcels_before[i + 1] = parcels_before[i] + (ch == "*")
        prev_divider = [-1] * n
        last = -1
        for i in range(n):
            if belt[i] == "|":
                last = i
            prev_divider[i] = last
        next_divider = [n] * n
        last = n
        for i in range(n - 1, -1, -1):
            if belt[i] == "|":
                last = i
            next_divider[i] = last
        answers = []
        for l, r in queries:
            left = next_divider[l]
            right = prev_divider[r]
            answers.append(parcels_before[right] - parcels_before[left] if left < right else 0)
        return answers
  javascript: |
    function itemsBetweenBarriers(belt, queries) {
      const n = belt.length;
      const parcelsBefore = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) parcelsBefore[i + 1] = parcelsBefore[i] + (belt[i] === "*" ? 1 : 0);
      const prevDivider = new Array(n).fill(-1);
      let last = -1;
      for (let i = 0; i < n; i++) {
        if (belt[i] === "|") last = i;
        prevDivider[i] = last;
      }
      const nextDivider = new Array(n).fill(n);
      last = n;
      for (let i = n - 1; i >= 0; i--) {
        if (belt[i] === "|") last = i;
        nextDivider[i] = last;
      }
      return queries.map(([l, r]) => {
        const left = nextDivider[l];
        const right = prevDivider[r];
        return left < right ? parcelsBefore[right] - parcelsBefore[left] : 0;
      });
    }
