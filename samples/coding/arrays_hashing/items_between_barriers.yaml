expected_concepts: [prefix sums of parcels, nearest divider to the right of l and to the left of r, O(n) preprocessing and O(1) per query, empty answer when the two dividers do not bracket anything]
optimal_complexity: {time: O(n + q), space: O(n)}
rubric:
  excellent: Observes that only the first divider at or after l and the last at or before r matter, precomputes nearest-divider arrays and parcel prefix sums, answers each query in O(1), and handles segments with fewer than two dividers.
  good: Uses prefix sums plus binary search over divider positions (O((n + q) log n)) or reaches the linear version with a hint.
  weak: Scans every segment character by character for each query, or counts parcels outside the outermost dividers.
  criteria: {correctness: 'All tests pass, including segments without dividers and queries of length one.', efficiency: Linear preprocessing and constant time per query., code_quality: Arrays have clear names and the sentinel values for missing dividers are explicit., edge_cases: 'No dividers, one divider, no queries and segment ends that sit on dividers.', communication: Explains why the outermost dividers inside the segment determine the answer.}
hints: ['Inside a segment, which dividers actually matter for deciding whether a parcel is enclosed?', 'Only the first divider at or after l and the last divider at or before r matter; every parcel between those two is enclosed. Can you find both without scanning the segment?', 'Precompute, for every index, the nearest divider at or to its right and the nearest at or to its left, plus a prefix count of parcels. For a query, take the divider nearest to l on the right and the one nearest to r on the left; if the first is before the second, the answer is the parcel count between them, otherwise zero.']
followups: ['How would you support updates where a parcel becomes a divider or the other way round?', 'What changes if a parcel needs dividers within a maximum distance on both sides?', Compare the binary search approach over divider positions with the nearest-divider arrays.]
common_errors: ['Scanning each segment, which is O(n * q) in the worst case.', Counting parcels before the first divider or after the last one in the segment., Off-by-one errors in the prefix sums when converting inclusive query bounds., Not returning zero when the segment contains fewer than two dividers.]
