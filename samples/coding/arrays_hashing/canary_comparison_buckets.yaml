slug: canary_comparison_buckets
title: Canary Builds That Rarely Lose
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [qa, devops, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Canary Builds That Rarely Lose

  A release pipeline runs head-to-head canary comparisons between builds. Each result is recorded as
  `[better_build, worse_build]`: the first build beat the second on the canary metrics, so the second
  build **lost** that comparison. The same pair may be compared more than once, and every recorded
  result counts.

  Considering only builds that appear in at least one result, return a two-element array:

  - `answer[0]`: the builds that never lost a comparison, in ascending order;
  - `answer[1]`: the builds that lost exactly one comparison, in ascending order.

  Either list may be empty.

  ### Example 1
  ```
  Input:  results = [[12, 4], [7, 4], [4, 15], [9, 15], [9, 3], [12, 9], [3, 20], [20, 15], [11, 20]]
  Output: [[7, 11, 12], [3, 9]]
  Explanation: builds 7, 11 and 12 never lost; 3 and 9 lost once; 4 and 20 lost twice and 15 lost three times.
  ```

  ### Example 2
  ```
  Input:  results = [[5, 8], [8, 5], [5, 8]]
  Output: [[], [5]]
  Explanation: the pair was compared three times. Build 5 lost once and build 8 lost twice, so no build is unbeaten.
  ```

  ### Constraints
  - `1 <= results.length <= 10^5`
  - `results[i].length == 2`
  - `1 <= results[i][0], results[i][1] <= 10^5`
  - `results[i][0] != results[i][1]`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: canary_comparison_buckets
  params:
    - {name: results, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def canary_comparison_buckets(results: list[list[int]]) -> list[list[int]]:
        losses: dict[int, int] = {}
        for better, worse in results:
            losses.setdefault(better, 0)
            losses[worse] = losses.get(worse, 0) + 1
        never_lost = sorted(build for build, count in losses.items() if count == 0)
        lost_once = sorted(build for build, count in losses.items() if count == 1)
        return [never_lost, lost_once]
  javascript: |
    function canaryComparisonBuckets(results) {
      const losses = new Map();
      for (const [better, worse] of results) {
        if (!losses.has(better)) losses.set(better, 0);
        losses.set(worse, (losses.get(worse) || 0) + 1);
      }
      const neverLost = [];
      const lostOnce = [];
      for (const [build, count] of losses) {
        if (count === 0) neverLost.push(build);
        else if (count === 1) lostOnce.push(build);
      }
      neverLost.sort((a, b) => a - b);
      lostOnce.sort((a, b) => a - b);
      return [neverLost, lostOnce];
    }
