expected_concepts:
  - hash map from build id to loss count
  - registering winners with zero losses
  - single pass over the results
  - sorting each output list
optimal_complexity: {time: O(n + b log b) where b is the number of distinct builds, space: O(b)}
rubric:
  excellent: Counts losses in one pass with a hash map, registers winners with zero losses, filters and sorts both lists and explains the complexity in terms of results and distinct builds.
  good: Correct counting solution with a small fix, such as remembering builds that never lost or sorting the output.
  weak: Misses builds that only appear as winners, counts duplicate comparisons once, or rescans the results for every build.
  criteria:
    correctness: All tests pass, including cycles and repeated comparisons.
    efficiency: Linear counting followed by sorting only the distinct builds.
    code_quality: One clear data structure for loss counts rather than several parallel sets.
    edge_cases: Single comparison, repeated pairs, cycles and empty output lists.
    communication: States how winners that never lose are kept in the result.
hints:
  - What single number per build tells you which list, if any, it belongs to?
  - Keep a map from build id to how many times it lost, and make sure builds that only ever win are also present in that map.
  - "Walk the results once: make sure the better build is in the map with at least zero, add one to the worse build's count, then collect the builds with zero and with one loss and sort each list ascending."
followups:
  - How would you return builds grouped by every loss count?
  - What changes if results stream in and you must answer at any time?
  - If build ids are dense small integers, how could you avoid the sort?
common_errors:
  - Forgetting builds that appear only as winners, so the first list is empty.
  - Deduplicating repeated comparisons, which undercounts losses.
  - Returning the lists in insertion order instead of ascending order.
