expected_concepts:
  - "hash set of ids seen so far"
  - "single left-to-right pass with an early return"
  - "distinguishing the earliest second occurrence from the earliest first occurrence"
  - "O(n) time and O(n) space versus O(n^2) nested loops"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "States the contract precisely (earliest second occurrence), uses one pass with a hash set and an early return, handles empty input, and explains O(n) time and space plus the sorting alternative when memory is tight."
  good: "Correct hash-set solution with the right complexity; may need a test run to settle which repeated id should be returned."
  weak: "Returns the id whose first occurrence is earliest, uses nested loops without discussing cost, or crashes on an empty stream."
  criteria:
    correctness: "All tests pass, including the case where a later-starting id repeats first."
    efficiency: "Linear time with a hash set; avoids rescanning the prefix for every element."
    code_quality: "Short loop with a clear name for the set and an early return; no unnecessary counting pass."
    edge_cases: "Empty stream, single element, all distinct and an id repeated many times."
    communication: "Explains why checking the set before inserting gives exactly the earliest second occurrence."
hints:
  - "Walk through the stream as the consumer would; at each id, what do you need to know to decide whether it is a replay?"
  - "Keep a record of every id seen so far in a structure with constant-time membership checks, and stop as soon as the current id is already in it."
  - "Scan left to right with a hash set: if the current id is already in the set return it immediately, otherwise add it; if the loop finishes without a hit, return minus one. This finds the earliest second occurrence because you stop at the first index whose id appeared before."
followups:
  - "Why is returning the id whose first occurrence is earliest a different (and wrong) answer here?"
  - "If you were allowed to reorder the input, how would sorting change the time and memory cost, and what would you lose?"
  - "How would you detect replays across an unbounded stream with limited memory, and what error would you accept?"
  - "How would you return every replayed id instead of only the first?"
common_errors:
  - "Counting all ids first and returning the first id in the input with a count above one, which returns the earliest first occurrence instead of the earliest replay."
  - "Adding the id to the set before checking membership, so every id looks like a replay."
  - "Using nested loops and timing out on the large stress case."
  - "Returning 0 or null instead of -1 when there is no replay."
