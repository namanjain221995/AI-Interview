title: First Replayed Order
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, qa, general]
time_limit_minutes: 12
prompt_markdown: |
  ## First Replayed Order

  An order-ingestion service reads order ids from a message stream. After a consumer restart the
  stream sometimes **replays** orders that were already delivered, so an id shows up a second time.

  Given `order_ids` in arrival order, find the first moment a replay happens: scanning from left to
  right, return the id of the **first element that has already been seen earlier in the stream**. In
  other words, among all ids that occur more than once, return the one whose second occurrence has the
  smallest index.

  - If every id is distinct, return `-1`.
  - Order ids are positive, so `-1` can never be a real id.

  ### Example 1
  ```
  Input:  order_ids = [4021, 4022, 4023, 4022, 4021]
  Output: 4022
  Explanation: 4022 is seen again at index 3, before 4021 is seen again at index 4.
  ```

  ### Example 2
  ```
  Input:  order_ids = [7, 8, 9]
  Output: -1
  ```

  ### Example 3
  ```
  Input:  order_ids = [12, 30, 30, 12]
  Output: 30
  Explanation: 30 repeats at index 2; 12 only repeats later, at index 3.
  ```

  ### Constraints
  - `0 <= order_ids.length <= 10^5`
  - `1 <= order_ids[i] <= 10^9`

  **Follow-up:** Can you do it in a single pass? What does that cost in memory, and what could you do if memory were tight?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_repeated_order_id
  params:
    - {name: order_ids, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def first_repeated_order_id(order_ids: list[int]) -> int:
        seen: set[int] = set()
        for order_id in order_ids:
            if order_id in seen:
                return order_id
            seen.add(order_id)
        return -1
  javascript: |
    function firstRepeatedOrderId(orderIds) {
      const seen = new Set();
      for (const id of orderIds) {
        if (seen.has(id)) return id;
        seen.add(id);
      }
      return -1;
    }
