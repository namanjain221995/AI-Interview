expected_concepts:
  - "prefix sums turn window totals into differences of two prefixes"
  - "counting pairs with a bounded difference"
  - "merge-sort divide and conquer with two moving pointers (or a Fenwick tree over compressed prefixes)"
  - "64-bit prefix sums and result"
  - "O(n log n) versus the O(n^2) brute force"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Reformulates the problem as counting prefix pairs with a bounded difference, implements merge-sort counting with two monotone pointers or a Fenwick tree with coordinate compression, uses 64-bit sums, and justifies O(n log n)."
  good: "Correct O(n^2) prefix-sum solution with a clear plan for the O(n log n) version, or the fast version with minor bugs fixed through testing."
  weak: "Recomputes window sums in O(n^3), uses a sliding window that assumes non-negative values, or overflows 32-bit sums."
  criteria:
    correctness: "All tests pass, including negative values, zero-width bands and large totals."
    efficiency: "O(n log n) time; explains why the two pointers only move forward within a merge step."
    code_quality: "The counting step and the merge step are clearly separated; inclusive bounds are handled consistently."
    edge_cases: "Single element, all negatives, equal prefix values and bands that include every window."
    communication: "Explains why a plain sliding window fails when values can be negative."
hints:
  - "Express the total of a window from i to j using running totals of the array."
  - "A window total is the difference of two prefix sums, so the task becomes counting pairs of prefixes, one earlier and one later, whose difference lies in the band; sorting halves of the prefix list makes that counting fast."
  - "Run a merge sort over the prefix sums; before merging two sorted halves, for each prefix in the left half advance two pointers through the right half, one to the first value at least the left value plus low and one past the last value at most the left value plus high, and add the gap between them to the count."
followups:
  - "How would you solve it with a Fenwick tree or an order-statistics tree instead?"
  - "What if the values were all non-negative; is there a simpler linear approach?"
  - "How would you handle a stream where windows are limited to the last k seconds?"
common_errors:
  - "Using a two-pointer sliding window that only works for non-negative values."
  - "Storing prefix sums in 32-bit integers."
  - "Forgetting the empty prefix (zero) at the start, which misses windows that begin at index 0."
  - "Mixing strict and inclusive comparisons for low and high."
