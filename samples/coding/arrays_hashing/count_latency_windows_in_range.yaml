version: 1
slug: count_latency_windows_in_range
title: Windows With Total in a Target Band
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, sre, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Windows With Total in a Target Band

  An SRE dashboard records, for every second, how much the p99 latency of a service moved compared with
  the previous second: `values[i]` is the change in milliseconds at second `i` and can be negative. The
  total drift over a window of consecutive seconds is the sum of the changes in that window.

  Given an inclusive band `[low, high]`, count the **contiguous, non-empty windows** whose total drift lies
  in the band, that is `low <= sum(values[i..j]) <= high` for `i <= j`.

  Return the count as a 64-bit integer.

  **Goal:** better than checking every window; aim for `O(n log n)`.

  ### Example 1
  ```
  Input:  values = [3, -1, 2], low = 1, high = 3
  Output: 4
  Explanation: Windows [3], [2], [3, -1] and [-1, 2] have totals 3, 2, 2 and 1; [-1] and [3, -1, 2] fall outside.
  ```

  ### Example 2
  ```
  Input:  values = [5, -5, 5, -5], low = 0, high = 0
  Output: 4
  Explanation: The zero-total windows are [5, -5] (twice), [-5, 5] and the whole array.
  ```

  ### Constraints
  - `1 <= values.length <= 10^5`
  - `-10^9 <= values[i] <= 10^9`
  - `-10^9 <= low <= high <= 10^9`
  - Window totals can exceed the 32-bit range.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_latency_windows_in_range
  params:
    - {name: values, type: "int[]"}
    - {name: low, type: "int"}
    - {name: high, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_latency_windows_in_range(values: list[int], low: int, high: int) -> int:
        prefix = [0]
        for v in values:
            prefix.append(prefix[-1] + v)

        def count(lo: int, hi: int) -> int:
            # Counts pairs i < j in prefix[lo:hi] with low <= prefix[j] - prefix[i] <= high,
            # and leaves prefix[lo:hi] sorted.
            if hi - lo <= 1:
                return 0
            mid = (lo + hi) // 2
            total = count(lo, mid) + count(mid, hi)
            start = end = mid
            for i in range(lo, mid):
                while start < hi and prefix[start] - prefix[i] < low:
                    start += 1
                while end < hi and prefix[end] - prefix[i] <= high:
                    end += 1
                total += end - start
            merged = []
            a, b = lo, mid
            while a < mid and b < hi:
                if prefix[a] <= prefix[b]:
                    merged.append(prefix[a])
                    a += 1
                else:
                    merged.append(prefix[b])
                    b += 1
            merged.extend(prefix[a:mid])
            merged.extend(prefix[b:hi])
            prefix[lo:hi] = merged
            return total

        return count(0, len(prefix))
  javascript: |
    function countLatencyWindowsInRange(values, low, high) {
      const prefix = [0];
      for (const v of values) prefix.push(prefix[prefix.length - 1] + v);
      const buffer = new Array(prefix.length);

      function count(lo, hi) {
        if (hi - lo <= 1) return 0;
        const mid = (lo + hi) >> 1;
        let total = count(lo, mid) + count(mid, hi);
        let start = mid;
        let end = mid;
        for (let i = lo; i < mid; i++) {
          while (start < hi && prefix[start] - prefix[i] < low) start++;
          while (end < hi && prefix[end] - prefix[i] <= high) end++;
          total += end - start;
        }
        let a = lo;
        let b = mid;
        let k = lo;
        while (a < mid && b < hi) buffer[k++] = prefix[a] <= prefix[b] ? prefix[a++] : prefix[b++];
        while (a < mid) buffer[k++] = prefix[a++];
        while (b < hi) buffer[k++] = prefix[b++];
        for (let t = lo; t < hi; t++) prefix[t] = buffer[t];
        return total;
      }

      return count(0, prefix.length);
    }
