expected_concepts: [at most two values can exceed n / 3, extended Boyer-Moore majority vote with two candidates, verification pass after candidate selection, strict versus non-strict threshold, hash-map counting baseline]
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Argues that at most two values can be entrenched, implements the two-candidate vote with a second counting pass, applies the strict floor(n / 3) threshold, avoids duplicate candidates and returns them sorted; states O(n) time and O(1) space.
  good: Correct hash-map counting solution with the right threshold and ordering, and can describe the constant-space idea when prompted.
  weak: Uses a non-strict threshold, skips the verification pass after voting, returns unsorted or duplicate values, or sorts and scans without addressing the follow-up.
  criteria: {correctness: 'All tests pass, including exact-thirds inputs and n below 3.', efficiency: Linear time; the follow-up solution uses constant extra space., code_quality: Readable candidate and vote bookkeeping with the verification pass clearly separated., edge_cases: 'Single node, two nodes, all equal values, negative values and exactly-at-threshold counts.', communication: Explains why removing triples of distinct values cannot eliminate a value that occurs more than a third of the time.}
hints: ['Imagine repeatedly crossing out three reports that carry three different versions. Could a version reported by more than a third of the nodes ever be crossed out completely?','Since at most two versions qualify, try to keep just two candidates while scanning, cancelling a vote from each whenever you see a version that matches neither, and confirm the survivors afterwards.', 'Track two candidates with vote counters: a matching version adds a vote, a free slot adopts the new version with one vote, and otherwise both counters drop by one. After the scan, count each surviving candidate in a second pass, keep it only if its count is strictly greater than the floor of n divided by three, and return the kept versions in ascending order.']
followups: ['Why can removing three distinct values at a time never eliminate a version that appears more than n / 3 times?', 'How would you generalise to every value that appears more than n / k times?', 'How would you answer this over a stream too large to scan twice?', 'How would you report the entrenched versions per region if each node also carried a region tag?']
common_errors: [Using greater-than-or-equal instead of strictly greater than floor(n / 3)., 'Returning the vote survivors without the verification pass, which reports versions that are not entrenched.', Returning the same version twice when both candidate slots end up holding it., Forgetting to sort the result in ascending order.]
