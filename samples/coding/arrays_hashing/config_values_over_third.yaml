title: Config Values Held by Over a Third
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Config Values Held by Over a Third

  During a configuration drift check, each of the `n` nodes in a fleet reports the version number of a
  setting it currently runs; `values[i]` is the version reported by node `i`. A version is considered
  **entrenched** when it is reported **strictly more than** `floor(n / 3)` times.

  Return every entrenched version, sorted in **ascending** order. Return an empty list if there is none.
  (At most two versions can be entrenched at the same time.)

  A hash-map count is a fine first solution. The follow-up asks for `O(n)` time with `O(1)` extra space.

  ### Example 1
  ```
  Input:  values = [7, 2, 7, 9, 2, 7, 2]
  Output: [2, 7]
  Explanation: n = 7 so the threshold is 2; versions 2 and 7 are each reported 3 times.
  ```

  ### Example 2
  ```
  Input:  values = [5, 1, 9, 5, 1, 9]
  Output: []
  Explanation: n = 6 so the threshold is 2; no version is reported more than 2 times.
  ```

  ### Example 3
  ```
  Input:  values = [-3]
  Output: [-3]
  ```

  ### Constraints
  - `1 <= values.length <= 5 * 10^4`
  - `-2^31 <= values[i] <= 2^31 - 1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: config_values_over_third
  params:
    - {name: values, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def config_values_over_third(values: list[int]) -> list[int]:
        # Extended majority vote: keep two candidates and their vote balances.
        first, second, votes_first, votes_second = None, None, 0, 0
        for value in values:
            if value == first:
                votes_first += 1
            elif value == second:
                votes_second += 1
            elif votes_first == 0:
                first, votes_first = value, 1
            elif votes_second == 0:
                second, votes_second = value, 1
            else:
                votes_first -= 1
                votes_second -= 1
        threshold = len(values) // 3
        result = [c for c in (first, second) if c is not None and values.count(c) > threshold]
        return sorted(set(result))
  javascript: |
    function configValuesOverThird(values) {
      // Extended majority vote: keep two candidates and their vote balances.
      let first = null;
      let second = null;
      let votesFirst = 0;
      let votesSecond = 0;
      for (const value of values) {
        if (value === first) votesFirst += 1;
        else if (value === second) votesSecond += 1;
        else if (votesFirst === 0) { first = value; votesFirst = 1; }
        else if (votesSecond === 0) { second = value; votesSecond = 1; }
        else { votesFirst -= 1; votesSecond -= 1; }
      }
      const threshold = Math.floor(values.length / 3);
      const result = [];
      for (const candidate of [first, second]) {
        if (candidate === null || result.includes(candidate)) continue;
        let count = 0;
        for (const value of values) if (value === candidate) count += 1;
        if (count > threshold) result.push(candidate);
      }
      return result.sort((a, b) => a - b);
    }
