expected_concepts:
  - "anchor each point and group the others by direction"
  - "direction key as a gcd-reduced integer pair with a normalised sign"
  - "counting duplicate positions separately from directions"
  - "avoiding floating-point slopes and division by zero"
  - "O(n^2) time with a per-anchor hash map"
optimal_complexity: {time: "O(n^2 log C)", space: "O(n)"}
rubric:
  excellent: "Anchors each point, keys directions by gcd-reduced pairs with normalised sign, handles duplicates and vertical lines, explains why floats are unsafe, and states O(n^2) time (times the gcd cost) with O(n) space per anchor."
  good: "Correct anchor-and-hash solution that needs a nudge on sign normalisation or duplicates."
  weak: "Uses floating-point slopes without discussing precision, ignores duplicates, or tests every triple in O(n^3) without improvement."
  criteria:
    correctness: "All tests pass, including duplicates, vertical lines and opposite directions."
    efficiency: "Quadratic time; the per-anchor map is reset each iteration."
    code_quality: "A helper produces the normalised direction key; duplicate handling is explicit."
    edge_cases: "Zero, one or two beacons, all beacons coincident, vertical and horizontal lines."
    communication: "Explains why two different reduced pairs can never describe the same direction once the sign is normalised."
hints:
  - "Fix one beacon as an anchor; every line through it is determined by a direction to another beacon."
  - "Group the other beacons by their direction from the anchor in a hash map, but represent the direction exactly with integers rather than as a decimal slope; beacons at the same spot as the anchor fit every line."
  - "For each anchor, take the difference in x and y to every later beacon, divide both by their greatest common divisor and flip both signs when needed (for example so the x difference is positive, or the y difference is positive when x is zero) so the pair has one canonical form, count how often each pair occurs, and add the anchor itself plus any beacons sitting exactly on it to the largest count."
followups:
  - "Why is a floating-point slope unsafe for large coordinates?"
  - "How would you return the actual beacons on the best line?"
  - "How would you extend the idea to points in three dimensions?"
common_errors:
  - "Keying directions by a float slope, which breaks on vertical lines and large coordinates."
  - "Forgetting to normalise the sign, so opposite vectors are counted as different directions."
  - "Ignoring beacons at the same position as the anchor or counting them only once."
  - "Returning 1 for a single beacon but failing on the empty input."
