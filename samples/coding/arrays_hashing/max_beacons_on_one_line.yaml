reference_solutions:
  python: |
    from math import gcd


    def max_beacons_on_one_line(points: list[list[int]]) -> int:
        n = len(points)
        if n <= 2:
            return n
        best = 0
        for i in range(n):
            x1, y1 = points[i]
            directions: dict[tuple[int, int], int] = {}
            same = 0
            local = 0
            for j in range(i + 1, n):
                dx = points[j][0] - x1
                dy = points[j][1] - y1
                if dx == 0 and dy == 0:
                    same += 1
                    continue
                g = gcd(dx, dy)
                dx //= g
                dy //= g
                # Normalise the sign so opposite vectors share one key.
                if dx < 0 or (dx == 0 and dy < 0):
                    dx, dy = -dx, -dy
                directions[(dx, dy)] = directions.get((dx, dy), 0) + 1
                local = max(local, directions[(dx, dy)])
            best = max(best, local + same + 1)
        return best
  javascript: |
    function maxBeaconsOnOneLine(points) {
      const n = points.length;
      if (n <= 2) return n;
      const gcd = (a, b) => {
        a = Math.abs(a);
        b = Math.abs(b);
        while (b !== 0) {
          const t = a % b;
          a = b;
          b = t;
        }
        return a;
      };
      let best = 0;
      for (let i = 0; i < n; i++) {
        const directions = new Map();
        let same = 0;
        let local = 0;
        for (let j = i + 1; j < n; j++) {
          let dx = points[j][0] - points[i][0];
          let dy = points[j][1] - points[i][1];
          if (dx === 0 && dy === 0) {
            same++;
            continue;
          }
          const g = gcd(dx, dy);
          dx /= g;
          dy /= g;
          if (dx < 0 || (dx === 0 && dy < 0)) {
            dx = -dx;
            dy = -dy;
          }
          const key = dx + "," + dy;
          const count = (directions.get(key) || 0) + 1;
          directions.set(key, count);
          if (count > local) local = count;
        }
        best = Math.max(best, local + same + 1);
      }
      return best;
    }
