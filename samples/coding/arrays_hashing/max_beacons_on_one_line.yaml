role_tags: [backend, data_scientist, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Most Beacons on One Straight Line

  A warehouse places positioning beacons on an integer floor grid. `points[i] = [x, y]` is the position of
  beacon `i`. To plan a straight calibration sweep, the operations team wants to know the **maximum number
  of beacons that lie on a single straight line** (in any direction, including vertical and horizontal).

  - Two beacons can share the same position; they are still counted separately.
  - Any one or two beacons always lie on a common line.
  - Return `0` when there are no beacons.

  Compare directions **exactly**. Floating-point slopes can make two different directions look equal (or
  equal directions look different), so they are not a reliable key.

  ### Example 1
  ```
  Input:  points = [[0, 0], [2, 1], [4, 2], [1, 3], [6, 3]]
  Output: 4
  Explanation: [0, 0], [2, 1], [4, 2] and [6, 3] all lie on the line y = x / 2.
  ```

  ### Example 2
  ```
  Input:  points = [[1, 2], [1, 2], [3, 5], [5, 1]]
  Output: 3
  Explanation: The two beacons at [1, 2] plus any other beacon form a line of 3.
  ```

  ### Example 3
  ```
  Input:  points = [[3, -1], [-2, 4], [0, 2], [5, 5], [1, 1], [-4, 6], [7, 0]]
  Output: 5
  ```

  ### Constraints
  - `0 <= points.length <= 300`
  - `points[i].length == 2`
  - `-10^4 <= x, y <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
