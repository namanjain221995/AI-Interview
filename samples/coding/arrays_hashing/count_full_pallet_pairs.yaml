expected_concepts:
  - only remainders modulo capacity matter
  - complementary remainder (capacity - r) mod capacity
  - hash map of remainder counts built in one pass
  - counting pairs with earlier elements to keep i < j
  - 64-bit counter
optimal_complexity: {time: O(n), space: "O(min(n, capacity))"}
rubric:
  excellent: Reduces weights to remainders, pairs each with the complementary remainder seen so far in one pass, handles remainder zero and the half-capacity case, uses a 64-bit count and states O(n).
  good: Correct remainder-counting solution, possibly in two passes with a combinatorial formula, after a fix to remainder zero or the half case.
  weak: Stays with the O(n^2) double loop, double counts pairs, or forgets that remainder zero pairs with itself.
  criteria:
    correctness: All tests pass, including capacity 1 and the half-capacity remainder.
    efficiency: Single linear pass with a hash map (or an array when capacity is small).
    code_quality: The complementary remainder is computed in one clear expression.
    edge_cases: Single shipment, remainder zero, even capacity half remainder and large counts.
    communication: Explains why counting earlier elements avoids double counting.
hints:
  - Does the full weight matter, or only what is left over after dividing by the capacity?
  - Two weights fill whole pallets exactly when their remainders add up to zero or to the capacity, so for each remainder there is exactly one partner remainder.
  - Walk the weights once, keeping a count of each remainder seen so far; for each weight add the count of its partner remainder, which is the capacity minus the remainder taken modulo the capacity, and only then record its own remainder.
followups:
  - How would you count triples whose sum is a multiple of the capacity?
  - What changes if weights can be negative, for example corrections?
  - If the capacity is small, what data structure would you use instead of a hash map?
common_errors:
  - Looking up the partner remainder as capacity minus remainder without the final modulo, which misses remainder zero.
  - Adding the current remainder before the lookup, which pairs a shipment with itself.
  - Accumulating the count in a 32-bit integer.
  - Counting both (i, j) and (j, i).
