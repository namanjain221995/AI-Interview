slug: count_full_pallet_pairs
title: Shipment Pairs That Fill Whole Pallets
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Shipment Pairs That Fill Whole Pallets

  A warehouse consolidates shipments two at a time. Each pallet holds exactly `capacity` kilograms,
  and the loading team only wants pairs of shipments that fill a whole number of pallets with nothing
  left over: the combined weight `weights[i] + weights[j]` must be an exact multiple of `capacity`.

  Count the index pairs `(i, j)` with `i < j` that satisfy this. Pairs are counted by index, so equal
  weights at different positions form different pairs. Return the count as a 64-bit integer.

  ### Example 1
  ```
  Input:  weights = [3, 7, 6, 14, 10, 4], capacity = 10
  Output: 3
  Explanation: the pairs are 3 + 7 = 10, 6 + 14 = 20 and 6 + 4 = 10.
  ```

  ### Example 2
  ```
  Input:  weights = [5, 5, 5], capacity = 5
  Output: 3
  Explanation: every pair sums to 10, a multiple of 5.
  ```

  ### Constraints
  - `1 <= weights.length <= 10^5`
  - `1 <= weights[i] <= 10^9`
  - `1 <= capacity <= 10^9`
  - The number of pairs can exceed the 32-bit integer range.

  **Follow-up:** can you do better than checking every pair?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_full_pallet_pairs
  params:
    - {name: weights, type: "int[]"}
    - {name: capacity, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_full_pallet_pairs(weights: list[int], capacity: int) -> int:
        seen: dict[int, int] = {}  # remainder -> how many earlier shipments have it
        pairs = 0
        for weight in weights:
            remainder = weight % capacity
            partner = (capacity - remainder) % capacity
            pairs += seen.get(partner, 0)
            seen[remainder] = seen.get(remainder, 0) + 1
        return pairs
  javascript: |
    function countFullPalletPairs(weights, capacity) {
      const seen = new Map(); // remainder -> how many earlier shipments have it
      let pairs = 0;
      for (const weight of weights) {
        const remainder = weight % capacity;
        const partner = (capacity - remainder) % capacity;
        pairs += seen.get(partner) || 0;
        seen.set(remainder, (seen.get(remainder) || 0) + 1);
      }
      return pairs;
    }
