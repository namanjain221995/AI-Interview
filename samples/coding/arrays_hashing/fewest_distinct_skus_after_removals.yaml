role_tags: [backend, data_analyst, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Fewest SKUs After Clearance

  A clearance shelf holds one product unit per slot, and `skus[i]` is the SKU id of the unit in slot
  `i`. To simplify the next stock count, exactly `k` units must be taken off the shelf, and you may
  choose which ones.

  Return the **minimum number of distinct SKU ids** that can remain on the shelf after removing
  exactly `k` units.

  ### Example 1
  ```
  Input:  skus = [30, 11, 30, 52, 11, 30], k = 2
  Output: 2
  Explanation: Removing the single unit of SKU 52 and one unit of SKU 11 leaves SKUs 11 and 30. No choice of 2 units clears two SKUs.
  ```

  ### Example 2
  ```
  Input:  skus = [8, 8, 15, 23, 23, 23, 15, 41], k = 5
  Output: 1
  Explanation: Clear SKU 41 (1 unit), SKU 8 (2 units) and SKU 15 (2 units); only SKU 23 remains.
  ```

  ### Constraints
  - `0 <= skus.length <= 10^5`
  - `1 <= skus[i] <= 10^9`
  - `0 <= k <= skus.length`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: fewest_distinct_skus_after_removals
  params:
  - {name: skus, type: 'int[]'}
  - {name: k, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def fewest_distinct_skus_after_removals(skus: list[int], k: int) -> int:
        counts: dict[int, int] = {}
        for sku in skus:
            counts[sku] = counts.get(sku, 0) + 1
        remaining = len(counts)
        for units in sorted(counts.values()):
            if units > k:
                break
            k -= units
            remaining -= 1
        return remaining
  javascript: |
    function fewestDistinctSkusAfterRemovals(skus, k) {
      const counts = new Map();
      for (const sku of skus) counts.set(sku, (counts.get(sku) || 0) + 1);
      const sizes = [...counts.values()].sort((a, b) => a - b);
      let remaining = sizes.length;
      for (const units of sizes) {
        if (units > k) break;
        k -= units;
        remaining--;
      }
      return remaining;
    }
