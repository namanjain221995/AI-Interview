expected_concepts: [counting units per SKU with a hash map, greedy removal of the smallest groups first, partial removal of a group never reduces the distinct count, sorting counts (or bucketing by count)]
optimal_complexity: {time: 'O(n log n), or O(n) with counting sort on the counts', space: O(n)}
rubric:
  excellent: Counts units per SKU, argues why clearing the smallest groups first is optimal, handles k = 0 and k = n, and mentions bucketing counts for linear time.
  good: Correct count-and-sort greedy with the justification given after a prompt.
  weak: Removes the most frequent SKU first, removes units one at a time without counting, or miscounts when k runs out mid-group.
  criteria: {correctness: 'All tests pass, including k = 0, k = n and leftover removals.', efficiency: Counting plus a sort of the distinct counts; no repeated scans of the shelf., code_quality: Clear separation of counting and the greedy loop; early exit when the next group does not fit., edge_cases: 'Empty shelf, a single SKU and ties among group sizes.', communication: Explains the exchange argument for the greedy choice.}
hints: [A SKU only stops counting as distinct when every one of its units is removed., 'Count the units for each SKU. Which SKUs are cheapest to make disappear completely?', Sort the per-SKU counts in ascending order and keep subtracting them from k while the next count still fits; the answer is the number of SKUs whose counts you could not subtract.]
followups: ['Can you avoid the comparison sort, given that every count is at most the shelf size?', 'What if each unit had a removal cost and you had a budget instead of a fixed k?', 'How would you answer many different values of k for the same shelf quickly?']
common_errors: [Removing units from the most common SKU first., Decrementing the distinct count for a partially removed SKU., Forgetting that leftover removals after the greedy loop do not change the answer.]
