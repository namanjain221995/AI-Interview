title: Near-Duplicate Price Ticks
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, security]
time_limit_minutes: 30
prompt_markdown: |
  ## Near-Duplicate Price Ticks

  A market-data gateway receives price ticks in order, stored in `prices` (integer prices in the smallest
  currency unit). A replayed or jittered tick shows up as two ticks that are close both in **position** and in
  **price**.

  Return `true` if there exist two **different** indices `i` and `j` such that

  - `|i - j| <= max_index_gap`, and
  - `|prices[i] - prices[j]| <= max_value_gap`.

  Otherwise return `false`.

  ### Example 1
  ```
  Input:  prices = [12, 40, 15, 70], max_index_gap = 2, max_value_gap = 3
  Output: true
  Explanation: Indices 0 and 2 are 2 positions apart and their prices differ by 3.
  ```

  ### Example 2
  ```
  Input:  prices = [5, 20, 5], max_index_gap = 1, max_value_gap = 0
  Output: false
  Explanation: The two prices of 5 are 2 positions apart, more than max_index_gap = 1.
  ```

  ### Constraints
  - `1 <= prices.length <= 10^5`
  - `-2^31 <= prices[i] <= 2^31 - 1`
  - `0 <= max_index_gap <= 10^5`
  - `0 <= max_value_gap <= 2^31 - 1`

  **Follow-up:** a balanced search tree over the last `max_index_gap` prices gives `O(n log k)`. Can you reach
  `O(n)` expected time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: near_duplicate_price_ticks
  params:
    - {name: prices, type: "int[]"}
    - {name: max_index_gap, type: "int"}
    - {name: max_value_gap, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def near_duplicate_price_ticks(prices: list[int], max_index_gap: int, max_value_gap: int) -> bool:
        if max_index_gap <= 0:
            return False
        width = max_value_gap + 1  # two prices in the same bucket are always close enough
        buckets: dict[int, int] = {}  # bucket id -> the one price of the window stored there
        for i, price in enumerate(prices):
            bucket = price // width  # floor division keeps negative prices in the right bucket
            if bucket in buckets:
                return True
            if bucket - 1 in buckets and price - buckets[bucket - 1] <= max_value_gap:
                return True
            if bucket + 1 in buckets and buckets[bucket + 1] - price <= max_value_gap:
                return True
            buckets[bucket] = price
            if i >= max_index_gap:
                del buckets[prices[i - max_index_gap] // width]  # slide the index window forward
        return False
  javascript: |
    function nearDuplicatePriceTicks(prices, maxIndexGap, maxValueGap) {
      if (maxIndexGap <= 0) return false;
      const width = maxValueGap + 1;
      const buckets = new Map();
      for (let i = 0; i < prices.length; i++) {
        const price = prices[i];
        const bucket = Math.floor(price / width);
        if (buckets.has(bucket)) return true;
        if (buckets.has(bucket - 1) && price - buckets.get(bucket - 1) <= maxValueGap) return true;
        if (buckets.has(bucket + 1) && buckets.get(bucket + 1) - price <= maxValueGap) return true;
        buckets.set(bucket, price);
        if (i >= maxIndexGap) buckets.delete(Math.floor(prices[i - maxIndexGap] / width));
      }
      return false;
    }
