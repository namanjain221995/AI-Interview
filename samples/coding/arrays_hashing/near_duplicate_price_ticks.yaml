expected_concepts:
  - sliding window over the last max_index_gap indices
  - bucketing values by width max_value_gap + 1
  - checking the same and adjacent buckets only
  - floor division for negative values
  - "64-bit arithmetic for differences"
optimal_complexity: {time: O(n), space: "O(min(n, max_index_gap))"}
rubric:
  excellent: Uses buckets of width max_value_gap + 1 over a sliding index window, explains why a bucket never holds two window elements, checks the neighbouring buckets, evicts the outgoing index, and handles negatives and overflow; contrasts with the ordered-set O(n log k) approach.
  good: Correct ordered-set (tree) solution in O(n log k), or a bucket solution that needs help with negative bucket ids or overflow.
  weak: Compares every pair within the window (O(n k)) without improvement, or ignores the index constraint.
  criteria:
    correctness: All tests pass, including zero gaps, negative prices and extreme values.
    efficiency: O(n) expected time with a hash map of buckets holding at most max_index_gap entries.
    code_quality: Bucket id computation is in one helper; eviction is next to insertion and easy to verify.
    edge_cases: max_index_gap of zero, single tick, prices around zero and differences beyond 32 bits.
    communication: Explains the bucket width choice and why only adjacent buckets need checking.
hints:
  - Only the last few ticks matter at any moment. How could you keep just those and query them for a price that is close to the current one?
  - An ordered structure answers the closest-price question in logarithmic time. To do better, think about splitting the price axis into ranges so that any two prices in the same range are automatically close.
  - Use ranges of width max value gap plus one keyed by the floor of price divided by the width; a second price in the same range is an immediate match, otherwise check the two neighbouring ranges with an explicit difference test. Keep only the ranges of ticks inside the index window by removing the tick that falls out after each step, and use 64-bit arithmetic.
followups:
  - Why can each bucket hold at most one price from the current window?
  - How would you return the pair of indices instead of a boolean?
  - How would you handle an unbounded stream where ticks arrive with timestamps instead of indices?
  - Compare the tree-based and bucket-based solutions for memory and worst-case time.
common_errors:
  - Truncating division towards zero for negative prices, which puts -1 and 1 in the same bucket.
  - Using width max_value_gap instead of max_value_gap plus one, which fails or divides by zero when the gap is 0.
  - Computing the price difference in 32-bit arithmetic and overflowing.
  - Forgetting to evict the tick that leaves the index window.
