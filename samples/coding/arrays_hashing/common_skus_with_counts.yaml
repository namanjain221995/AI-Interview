expected_concepts:
  - "frequency map (multiset) of one list"
  - "decrementing counts while scanning the other list"
  - "sorting the result numerically"
  - "two-pointer merge as an alternative when both lists are sorted"
optimal_complexity: {time: "O(n + m + k log k) where k is the result size", space: "O(min(n, m))"}
rubric:
  excellent: "Counts the smaller list in a hash map, decrements while scanning the larger one, sorts the result numerically, discusses the sorted two-pointer alternative and states the complexity."
  good: "Correct counting or sort-and-merge solution, possibly needing a reminder about numeric sorting or the min-count rule."
  weak: "Uses set intersection and loses duplicates, removes elements from a list inside a loop (quadratic), or returns unsorted output."
  criteria:
    correctness: "All tests pass, including repeated SKUs and empty warehouses."
    efficiency: "Linear counting plus a sort of the result, or O(n log n + m log m) with two pointers."
    code_quality: "Counts the smaller side and keeps the decrement logic in one place."
    edge_cases: "Empty lists, nothing in common, identical lists and large ids."
    communication: "Explains why a plain set intersection is not enough."
hints:
  - "A plain set intersection loses information here; think about what you need to remember about each SKU in one warehouse."
  - "Count how many units of each SKU one warehouse holds, then walk the other warehouse and use up those counts as you find matches."
  - "Build a count map from the shorter list; for each SKU in the longer list, if its remaining count is above zero, add it to the result and decrease the count; finally sort the result numerically in ascending order."
followups:
  - "If both lists were already sorted, how would you compute the result with O(1) extra space?"
  - "What if one warehouse list is far too large for memory but the other is small?"
  - "How would you return each shared SKU once together with its shared count instead of repeating it?"
  - "How would you extend this to more than two warehouses?"
common_errors:
  - "Using a set intersection, which keeps each SKU only once."
  - "Sorting numbers with a default string comparison in JavaScript, which misorders large ids."
  - "Forgetting to decrement the count, so a SKU is matched more times than one side holds."
  - "Removing matched items from a list with a linear search, which makes the solution quadratic."
