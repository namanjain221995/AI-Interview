slug: common_skus_with_counts
title: "Stock Shared by Two Warehouses"
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Stock Shared by Two Warehouses

  Two warehouses export their stock as lists of SKU ids, with **one entry per physical unit**: if a
  warehouse holds three units of SKU `104`, the id `104` appears three times in its list. The lists are in
  no particular order.

  To plan a balancing transfer you need the stock that both warehouses hold in common. Return a list in
  which every SKU appears exactly `min(count in warehouse_a, count in warehouse_b)` times, sorted in
  **ascending** order. SKUs held by only one warehouse do not appear. Return an empty list when the
  warehouses share nothing.

  ### Example 1
  ```
  Input:  warehouse_a = [104, 220, 104, 310, 220, 104], warehouse_b = [220, 104, 104, 999]
  Output: [104, 104, 220]
  Explanation: 104 is held 3 and 2 times, 220 is held 2 and 1 times, 310 and 999 are held by one warehouse only
  ```

  ### Example 2
  ```
  Input:  warehouse_a = [5, 6], warehouse_b = [7, 8]
  Output: []
  ```

  ### Constraints
  - `0 <= warehouse_a.length, warehouse_b.length <= 10^5`
  - `1 <= warehouse_a[i], warehouse_b[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: common_skus_with_counts
  params:
    - {name: warehouse_a, type: "int[]"}
    - {name: warehouse_b, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def common_skus_with_counts(warehouse_a: list[int], warehouse_b: list[int]) -> list[int]:
        small, large = sorted((warehouse_a, warehouse_b), key=len)
        remaining = Counter(small)
        shared: list[int] = []
        for sku in large:
            if remaining[sku] > 0:
                remaining[sku] -= 1
                shared.append(sku)
        shared.sort()
        return shared
  javascript: |
    function commonSkusWithCounts(warehouseA, warehouseB) {
      const [small, large] = warehouseA.length <= warehouseB.length
        ? [warehouseA, warehouseB]
        : [warehouseB, warehouseA];
      const remaining = new Map();
      for (const sku of small) remaining.set(sku, (remaining.get(sku) || 0) + 1);
      const shared = [];
      for (const sku of large) {
        const left = remaining.get(sku) || 0;
        if (left > 0) {
          remaining.set(sku, left - 1);
          shared.push(sku);
        }
      }
      return shared.sort((x, y) => x - y);
    }
