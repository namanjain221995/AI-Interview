expected_concepts:
  - "prefix sums with a leading zero"
  - "inclusive range as prefix[r + 1] - prefix[l]"
  - "64-bit totals to avoid overflow"
  - "O(n + q) total time versus O(n * q) naive summing"
optimal_complexity: {time: "O(n + q)", space: "O(n)"}
rubric:
  excellent: "Builds a prefix-sum array with a leading zero, answers each inclusive window in O(1), uses 64-bit totals, keeps the query order and explains O(n + q) versus the naive O(n * q)."
  good: "Correct prefix-sum solution with a small off-by-one or overflow fix found while testing."
  weak: "Sums each window with a loop (quadratic for many queries), mishandles the inclusive end, or overflows 32-bit integers."
  criteria:
    correctness: "All tests pass, including single-minute windows and totals above 2^31."
    efficiency: "Linear preprocessing and constant time per query."
    code_quality: "A clear prefix definition (prefix[i] is the sum of the first i values) avoids special cases for l = 0."
    edge_cases: "No queries, a single minute, repeated windows and all-zero data."
    communication: "States the prefix invariant and explains the 64-bit requirement."
hints:
  - "Summing every window from scratch repeats a lot of work when windows overlap; what could you compute once up front?"
  - "If you knew the running total of all minutes up to each position, the total of any window would be the difference of two running totals."
  - "Build a running-total array one longer than the input where entry i is the sum of the first i minutes, using 64-bit integers; the answer for a window from l to r inclusive is the entry at r plus one minus the entry at l."
followups:
  - "What would you do if minute counts could be updated between queries?"
  - "How would you extend the idea to a two-dimensional grid of service by minute?"
  - "How would you find the window of a fixed length with the highest total?"
  - "What is the memory cost for a full year of per-minute data, and how could you reduce it?"
common_errors:
  - "Using a prefix array without a leading zero and mishandling windows that start at minute 0."
  - "Treating the right end as exclusive, which drops the last minute of each window."
  - "Accumulating totals in 32-bit integers, which overflows on busy services."
  - "Looping over every window for every query, which is too slow for 10^5 queries."
