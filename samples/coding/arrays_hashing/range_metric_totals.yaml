slug: range_metric_totals
title: "Metric Totals Over Many Windows"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [data, sre, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Metric Totals Over Many Windows

  A monitoring dashboard stores the request count of one service for every minute of the day in
  `values`, where `values[i]` is the count for minute `i`. Engineers open many panels at once, and each
  panel asks for the total number of requests in a window `[l, r]` of minutes (0-based, **both ends
  inclusive**).

  Given `values` and the list of `queries`, return a list whose `j`-th entry is the total for
  `queries[j]`, in the same order as the queries. Totals can exceed the 32-bit integer range, so use
  64-bit arithmetic. Return an empty list when there are no queries.

  ### Example 1
  ```
  Input:  values = [120, 80, 0, 340, 60], queries = [[0, 1], [1, 3], [4, 4], [0, 4]]
  Output: [200, 420, 60, 600]
  Explanation: 120 + 80 = 200, 80 + 0 + 340 = 420, 60, and the full total 600
  ```

  ### Example 2
  ```
  Input:  values = [7], queries = [[0, 0], [0, 0]]
  Output: [7, 7]
  ```

  ### Constraints
  - `1 <= values.length <= 10^5`
  - `0 <= values[i] <= 10^9`
  - `0 <= queries.length <= 10^5`
  - `queries[j].length == 2` and `0 <= l <= r < values.length`

  **Follow-up:** with up to `10^5` queries, each answer should take `O(1)` time after preprocessing.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: range_metric_totals
  params:
    - {name: values, type: "int[]"}
    - {name: queries, type: "int[][]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def range_metric_totals(values: list[int], queries: list[list[int]]) -> list[int]:
        # prefix[i] holds the total of values[0..i-1].
        prefix = [0] * (len(values) + 1)
        for i, value in enumerate(values):
            prefix[i + 1] = prefix[i] + value
        return [prefix[r + 1] - prefix[l] for l, r in queries]
  javascript: |
    function rangeMetricTotals(values, queries) {
      const prefix = new Array(values.length + 1).fill(0);
      for (let i = 0; i < values.length; i++) prefix[i + 1] = prefix[i] + values[i];
      return queries.map(([l, r]) => prefix[r + 1] - prefix[l]);
    }
