version: 1
slug: complete_kits_from_parts
title: Complete Kits From Spare Parts
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Complete Kits From Spare Parts

  A warehouse labels each spare part with a single lowercase letter. The contents of a parts bin are
  given as the string `parts`, where every character is one physical part. A kit recipe is the string
  `kit`, listing the parts one kit consumes; a letter that appears several times in `kit` means the kit
  needs that many of that part.

  Return the **maximum number of complete kits** that can be assembled from the bin. Each physical part
  can be used in at most one kit. The order of letters in either string does not matter.

  ### Example 1
  ```
  Input:  parts = "bacxbcabca", kit = "abc"
  Output: 3
  Explanation: The bin has 3 a, 3 b and 3 c parts (plus an unused x), enough for 3 kits.
  ```

  ### Example 2
  ```
  Input:  parts = "lloopp", kit = "loop"
  Output: 1
  Explanation: Each kit needs two o parts and the bin has only two, so one kit is the limit.
  ```

  ### Example 3
  ```
  Input:  parts = "wrench", kit = "z"
  Output: 0
  ```

  ### Constraints
  - `0 <= parts.length <= 10^5`
  - `1 <= kit.length <= 100`
  - `parts` and `kit` contain only lowercase English letters `a`-`z`.

  **Follow-up:** What is the time and memory cost of your solution in terms of the two string lengths and the alphabet size?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: complete_kits_from_parts
  params:
    - {name: parts, type: "string"}
    - {name: kit, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def complete_kits_from_parts(parts: str, kit: str) -> int:
        have = Counter(parts)
        need = Counter(kit)
        return min(have[letter] // amount for letter, amount in need.items())
  javascript: |
    function completeKitsFromParts(parts, kit) {
      const have = new Array(26).fill(0);
      const need = new Array(26).fill(0);
      for (const ch of parts) have[ch.charCodeAt(0) - 97]++;
      for (const ch of kit) need[ch.charCodeAt(0) - 97]++;
      let best = Infinity;
      for (let i = 0; i < 26; i++) {
        if (need[i] > 0) best = Math.min(best, Math.floor(have[i] / need[i]));
      }
      return best;
    }
tests:
  - {id: t1, args: ["bacxbcabca", "abc"], expected: 3, description: "Example 1"}
  - {id: t2, args: ["lloopp", "loop"], expected: 1, description: "Example 2 - repeated letter in the kit is the bottleneck"}
  - {id: t3, args: ["wrench", "z"], expected: 0, description: "Example 3 - a required part is missing entirely"}
  - {id: t4, hidden: true, args: ["", "a"], expected: 0, description: "Empty bin builds nothing"}
  - {id: t5, hidden: true, args: ["ab", "aabb"], expected: 0, description: "Kit larger than the whole bin"}
  - {id: t6, hidden: true, args: ["qqqqqqq", "q"], expected: 7, description: "Single-letter kit equals the count of that letter"}
  - {id: t7, hidden: true, args: ["nnuuttssnnuuttss", "nuts"], expected: 4, description: "Exact multiple of the kit, letters in different order"}
  - {id: t8, hidden: true, args: ["aaaaaaaaaaab", "aaab"], expected: 1, description: "Most-used letter is not the bottleneck; integer division per letter"}
  - {id: t9, hidden: true, args: ["zyxwvutsrqponmlkjihgfedcbazyxwvutsrqponmlkjihgfedcb", "abcdefghijklmnopqrstuvwxyz"], expected: 1, description: "Full alphabet kit where only a is short"}
  - {id: t10, hidden: true, args: ["", "gears"], expected: 198, description: "1000-character bin with extra copies of one part"}
expected_concepts:
  - "frequency counting with a hash map or fixed 26-slot array"
  - "per-letter integer division of available by required"
  - "minimum over required letters only"
  - "O(p + k) time with O(1) alphabet-sized memory"
optimal_complexity: {time: "O(p + k)", space: "O(1)"}
rubric:
  excellent: "Counts both strings, takes the minimum of available divided by required over the letters the kit needs, handles repeated kit letters and empty bins, and explains O(p + k) time with alphabet-bounded memory."
  good: "Correct counting solution; may initially ignore repeated letters in the kit and fix it after tests."
  weak: "Simulates building kits one by one with repeated string removal, ignores letter multiplicity in the kit, or divides by letters the kit does not use."
  criteria:
    correctness: "All tests pass, including repeated kit letters and missing parts."
    efficiency: "Linear in the input lengths; no repeated string scanning or deletion."
    code_quality: "Clear names for the two count tables and a single minimum computation."
    edge_cases: "Empty bin, kit longer than the bin, and letters absent from the bin."
    communication: "Explains why each letter limits the answer independently."
hints:
  - "The order of letters does not matter. What information about each string is actually enough to answer the question?"
  - "Count how many of each letter the bin has and how many of each letter one kit needs; each needed letter on its own caps the number of kits."
  - "Build letter counts for both strings, then for every letter the kit needs compute the bin count divided by the kit count, rounded down, and return the smallest of those quotients; letters the kit does not use are ignored."
followups:
  - "How would you handle parts identified by arbitrary string codes instead of single letters?"
  - "If several different kit recipes compete for the same bin, how would you reason about the best mix?"
  - "What changes if the bin is restocked continuously and you must answer after every delivery?"
  - "Why is simulating kit by kit slower, and by how much in the worst case?"
common_errors:
  - "Ignoring how many times a letter appears in the kit, which overcounts kits for recipes like loop."
  - "Taking the minimum over all 26 letters, including ones the kit does not need, which returns 0 or divides by zero."
  - "Removing characters from the string repeatedly, giving quadratic time."
  - "Returning a non-integer result instead of rounding each quotient down."
