slug: longest_consecutive_build_run
title: Longest Run of Consecutive Build Numbers
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, backend, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Run of Consecutive Build Numbers

  An artifact store keeps the binaries of past CI builds, but retention jobs have deleted many of them.
  You receive `builds`, the build numbers still present, listed in **arbitrary order** and possibly with
  **duplicates** (the same build can be stored for several platforms).

  The release team wants to know the longest stretch of builds they could bisect without a gap: the size
  of the largest set of **consecutive integers** `x, x + 1, ..., x + L - 1` that are **all** present in
  `builds`. Duplicates count once. Return `L`, or `0` when `builds` is empty.

  Aim for `O(n)` expected time; sorting the list first is a valid but slower baseline.

  ### Example 1
  ```
  Input:  builds = [104, 101, 230, 102, 103, 231]
  Output: 4
  Explanation: Builds 101, 102, 103 and 104 are all present; 230 and 231 form a shorter run.
  ```

  ### Example 2
  ```
  Input:  builds = [7, 7, 8, 5, 6, 6, 20]
  Output: 4
  Explanation: The run is 5, 6, 7, 8; the repeated 6 and 7 do not lengthen it.
  ```

  ### Example 3
  ```
  Input:  builds = []
  Output: 0
  ```

  ### Constraints
  - `0 <= builds.length <= 10^5`
  - `-2^31 <= builds[i] <= 2^31 - 1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_consecutive_build_run
  params:
    - {name: builds, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_consecutive_build_run(builds: list[int]) -> int:
        present = set(builds)
        best = 0
        for build in present:
            if build - 1 in present:
                continue  # not the first build of its run
            length = 1
            while build + length in present:
                length += 1
            best = max(best, length)
        return best
  javascript: |
    function longestConsecutiveBuildRun(builds) {
      const present = new Set(builds);
      let best = 0;
      for (const build of present) {
        if (present.has(build - 1)) continue; // not the first build of its run
        let length = 1;
        while (present.has(build + length)) length += 1;
        best = Math.max(best, length);
      }
      return best;
    }
