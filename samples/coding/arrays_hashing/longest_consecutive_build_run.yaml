expected_concepts: [hash set for O(1) membership, only start counting at the first element of a run, deduplication, sorting baseline and its O(n log n) cost, integer overflow when probing past the maximum value]
optimal_complexity: {time: O(n) expected, space: O(n)}
rubric:
  excellent: Puts the builds in a hash set, extends a run only from values whose predecessor is missing, explains why that makes the total work linear, handles empty input and duplicates, and mentions the sort-based alternative and overflow near the 32-bit maximum.
  good: Correct sort-and-scan or hash-set solution with duplicates handled, possibly needing a hint to reach linear time.
  weak: Counts duplicates as extra length, fails on empty input, or scans forward from every element making it quadratic.
  criteria: {correctness: 'All tests pass, including duplicates, negative numbers and the empty list.', efficiency: Linear expected time; each value is visited a constant number of times., code_quality: Clear separation between the start-of-run check and the counting loop., edge_cases: 'Empty list, single build, only duplicates and values at the 32-bit boundary.', communication: Explains the amortized argument for why the inner loop does not make it quadratic.}
hints: ['Sorting would make runs easy to see, but can you answer whether a given build number is present in constant time instead?', 'Put every build number into a hash set. A run can be measured by walking upward from its smallest member, so think about how to recognise that smallest member.', 'Iterate over the distinct values in the set; skip a value whenever the value one below it is also present, because it is not the start of a run. Otherwise count upward while the next value is present and keep the longest count, so every value is walked over at most once.']
followups: ['Why is the algorithm linear even though it contains a nested loop?', 'How would you return the first and last build number of the longest run instead of its length?', 'What changes if builds arrive one at a time and you must report the longest run after each arrival?', 'When would sorting be the better choice in practice despite the extra log factor?']
common_errors: [Counting duplicate build numbers as part of the run length after sorting., 'Starting a scan from every value, which makes the solution quadratic on long runs.', Returning 1 instead of 0 for an empty list., Computing the next value with 32-bit arithmetic so that the maximum integer wraps around to the minimum.]
