expected_concepts:
  - "only 22 possible target sums because values are bounded by 2^20"
  - "running hash map of counts of earlier values (complement lookup per power)"
  - "counting before inserting so i < j and no self-pairing"
  - "64-bit accumulator for the pair count"
optimal_complexity: {time: "O(n log M) where M is the maximum value", space: "O(n)"}
rubric:
  excellent: "Notices the bounded number of powers, scans once with a count map checking every power before inserting the current value, uses a 64-bit counter, and states O(22 n) time with O(n) space."
  good: "Correct power-by-power complement counting with minor fixes after testing, such as the 2^21 upper bound or inserting after lookups."
  weak: "Checks all pairs in O(n^2), counts self-pairs or both orders, treats 0 as a power of two, or overflows a 32-bit counter."
  criteria:
    correctness: "All tests pass, including zeros, duplicates and the maximum values."
    efficiency: "Linear in n times the number of powers; no pairwise scan."
    code_quality: "Clear bound on the powers; counter type wide enough; no repeated work per pair."
    edge_cases: "Single element, zeros only, equal values and the 2^21 sum."
    communication: "Explains why each pair is counted exactly once and where the 64-bit requirement comes from."
hints:
  - "There are not many powers of two that two bounded sizes could possibly add up to; how many are there?"
  - "For each power of two, this becomes a pair-sum problem: for the current fragment, how many earlier fragments have exactly the complement size?"
  - "Keep a hash map of how many times each size has been seen so far; for each fragment, add the stored count of power minus size for every power from 1 up to 2^21, then insert the fragment, and keep the total in a 64-bit integer."
followups:
  - "Why is it important to look up complements before inserting the current fragment?"
  - "If values were unbounded, how would you bound the number of powers to check?"
  - "How would you count triples whose sum is a power of two?"
  - "How would you solve it if the sizes were sorted and memory were very limited?"
common_errors:
  - "Stopping at 2^20 and missing pairs whose sum is 2^21."
  - "Counting the pair (i, i) when a value is half a power of two."
  - "Treating 0 as a power of two or starting the powers at 2 and missing sums of 1."
  - "Accumulating the count in a 32-bit integer."
