role_tags: [backend, data, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Buffer Fragments That Fill a Power-of-Two Block

  A memory allocator keeps a list of free fragments, where `amounts[i]` is the size of the `i`-th fragment
  in KiB. Two fragments can be merged into one aligned block only when their combined size is **exactly a
  power of two** (`1, 2, 4, 8, ...`). Note that `0` is not a power of two.

  Count the index pairs `(i, j)` with `i < j` such that `amounts[i] + amounts[j]` is a power of two.
  Fragments with equal sizes at different indices form different pairs. The count can exceed the 32-bit
  integer range, so return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  amounts = [1, 3, 5, 7, 9]
  Output: 4
  Explanation: The pairs are 1 + 3 = 4, 1 + 7 = 8, 3 + 5 = 8 and 7 + 9 = 16.
  ```

  ### Example 2
  ```
  Input:  amounts = [0, 0, 1, 1]
  Output: 5
  Explanation: Each of the four pairs of a 0 with a 1 sums to 1, and the two 1s sum to 2. The two 0s
               sum to 0, which is not a power of two.
  ```

  ### Constraints
  - `1 <= amounts.length <= 10^5`
  - `0 <= amounts[i] <= 2^20`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: power_of_two_sum_pairs
  params:
    - {name: amounts, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def power_of_two_sum_pairs(amounts: list[int]) -> int:
        seen: dict[int, int] = {}  # size -> how many earlier fragments have it
        pairs = 0
        for size in amounts:
            power = 1
            while power <= 1 << 21:  # the largest possible sum is 2^20 + 2^20
                pairs += seen.get(power - size, 0)
                power <<= 1
            seen[size] = seen.get(size, 0) + 1
        return pairs
  javascript: |
    function powerOfTwoSumPairs(amounts) {
      const seen = new Map();
      let pairs = 0;
      for (const size of amounts) {
        for (let power = 1; power <= 2 ** 21; power *= 2) {
          pairs += seen.get(power - size) || 0;
        }
        seen.set(size, (seen.get(size) || 0) + 1);
      }
      return pairs;
    }
