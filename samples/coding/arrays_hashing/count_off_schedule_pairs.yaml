time_limit_minutes: 20
prompt_markdown: |
  ## Off-Schedule Job Pairs

  A scheduler is supposed to start one run of a job on every tick. `times[i]` is the tick at which run
  number `i` actually started. Clock skew and queueing delays mean the values are not necessarily
  increasing, and two runs can share a tick.

  Two runs `i < j` are **consistent** when the gap between their start ticks equals the gap between
  their run numbers, that is `times[j] - times[i] == j - i`. Every other pair is **off schedule**.

  Return the number of off-schedule pairs `(i, j)` with `i < j`. The count can exceed the 32-bit
  integer range, so return a 64-bit value.

  ### Example 1
  ```
  Input:  times = [2, 5, 4, 3, 6]
  Output: 7
  Explanation: Runs 0, 2 and 4 are pairwise consistent (for example times[2] - times[0] = 4 - 2 = 2 = 2 - 0). That is 3 consistent pairs, so 7 of the 10 pairs are off schedule.
  ```

  ### Example 2
  ```
  Input:  times = [-2, -1, 0, 1]
  Output: 0
  Explanation: Every run started exactly on schedule, so every pair is consistent.
  ```

  ### Constraints
  - `0 <= times.length <= 10^5`
  - `-10^9 <= times[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_off_schedule_pairs
  params:
  - {name: times, type: 'int[]'}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_off_schedule_pairs(times: list[int]) -> int:
        n = len(times)
        seen: dict[int, int] = {}
        consistent = 0
        for i, tick in enumerate(times):
            key = tick - i
            consistent += seen.get(key, 0)
            seen[key] = seen.get(key, 0) + 1
        return n * (n - 1) // 2 - consistent
  javascript: |
    function countOffSchedulePairs(times) {
      const n = times.length;
      const seen = new Map();
      let consistent = 0;
      for (let i = 0; i < n; i++) {
        const key = times[i] - i;
        const c = seen.get(key) || 0;
        consistent += c;
        seen.set(key, c + 1);
      }
      return (n * (n - 1)) / 2 - consistent;
    }
