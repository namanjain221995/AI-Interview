expected_concepts: ['rearranging the condition to times[i] - i == times[j] - j', counting equal keys with a hash map, 'complement counting: total pairs minus consistent pairs', 64-bit arithmetic for pair counts]
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Rewrites the condition so each side depends on one index, counts equal keys in one pass, subtracts from n(n - 1)/2 using 64-bit integers, and explains why the complement is easier to count.
  good: Finds the key transformation with a nudge and implements the hash map count correctly.
  weak: Checks every pair directly, or overflows when computing n(n - 1)/2 in 32-bit arithmetic.
  criteria: {correctness: 'All tests pass, including empty input, duplicates and decreasing ticks.', efficiency: Single pass with a hash map; no nested loop., code_quality: The key is named and computed in one place; total pairs computed once., edge_cases: 'Zero or one run, repeated ticks and extreme values.', communication: Shows the algebra that turns the pair condition into a per-index key.}
hints: [Counting the pairs that are consistent might be easier than counting the off-schedule ones directly., Rearrange the condition so that everything about run i is on one side and everything about run j is on the other., 'Each run gets the key tick minus run number; runs with equal keys are consistent with each other. Count equal keys with a hash map as you go, then subtract that total from n times n minus one over two, all in 64-bit arithmetic.']
followups: ['What if a pair also counted as consistent when the gaps differ by at most one tick?', 'How would you report which run is most often involved in off-schedule pairs?', 'How would you process the runs as a stream and keep the count up to date?']
common_errors: [Checking all pairs with a nested loop., 'Computing n times n minus one in 32-bit integers, which overflows for large n.', 'Using times[i] + i as the key instead of times[i] - i.']
