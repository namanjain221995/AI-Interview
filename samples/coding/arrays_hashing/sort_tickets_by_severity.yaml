slug: sort_tickets_by_severity
title: One-Pass Severity Sort
difficulty: medium
competency_keys: [algorithms, code_quality, problem_solving]
role_tags: [backend, support_engineer, general]
time_limit_minutes: 20
prompt_markdown: |
  ## One-Pass Severity Sort

  An incident queue stores the severity of each open ticket, where `0` is critical, `1` is major and
  `2` is minor; no other values occur. The on-call dashboard needs the queue reordered so that all
  critical tickets come first, then all major ones, then all minor ones (ascending severity).

  Return the reordered list. You may rearrange `severities` in place and return it.

  The queue lives in a memory-constrained agent, so the intended solution makes a **single pass** over the
  list, rearranges it **in place** with `O(1)` extra space, and uses **neither** a library sort **nor** a
  separate counting pass.

  ### Example 1
  ```
  Input:  severities = [2, 0, 1, 2, 1, 0, 0]
  Output: [0, 0, 0, 1, 1, 2, 2]
  ```

  ### Example 2
  ```
  Input:  severities = [2, 2, 0]
  Output: [0, 2, 2]
  ```

  ### Constraints
  - `0 <= severities.length <= 10^5`
  - `severities[i]` is `0`, `1` or `2`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_tickets_by_severity
  params:
    - {name: severities, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def sort_tickets_by_severity(severities: list[int]) -> list[int]:
        # Invariant: [0, low) are 0s, [low, mid) are 1s, (high, end] are 2s, [mid, high] unknown.
        low, mid, high = 0, 0, len(severities) - 1
        while mid <= high:
            if severities[mid] == 0:
                severities[low], severities[mid] = severities[mid], severities[low]
                low += 1
                mid += 1
            elif severities[mid] == 1:
                mid += 1
            else:
                severities[mid], severities[high] = severities[high], severities[mid]
                high -= 1  # do not advance mid: the swapped-in value is still unclassified
        return severities
  javascript: |
    function sortTicketsBySeverity(severities) {
      // Invariant: [0, low) are 0s, [low, mid) are 1s, (high, end] are 2s, [mid, high] unknown.
      let low = 0;
      let mid = 0;
      let high = severities.length - 1;
      while (mid <= high) {
        if (severities[mid] === 0) {
          [severities[low], severities[mid]] = [severities[mid], severities[low]];
          low += 1;
          mid += 1;
        } else if (severities[mid] === 1) {
          mid += 1;
        } else {
          [severities[mid], severities[high]] = [severities[high], severities[mid]];
          high -= 1; // do not advance mid: the swapped-in value is still unclassified
        }
      }
      return severities;
    }
