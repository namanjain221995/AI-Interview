expected_concepts: [three-way partitioning (Dutch national flag), 'loop invariant with low, mid and high pointers', in-place swaps with O(1) extra space, not advancing mid after swapping with high, counting sort as the two-pass baseline]
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: States the three-region invariant up front, implements the single-pass partition with correct pointer movement (mid not advanced after a swap with high), and contrasts it with the two-pass counting approach and a library sort.
  good: Correct single-pass partition after fixing a pointer bug, or a clean two-pass counting solution with a clear explanation of how to make it one pass.
  weak: Relies on a library sort, uses extra arrays, or the partition advances mid after swapping with high and misplaces values.
  criteria: {correctness: 'All tests pass, including empty, single-element and reverse-sorted queues.', efficiency: One pass with constant extra space., code_quality: Pointer names and a comment that make the invariant obvious; no redundant swaps or special cases., edge_cases: 'Empty queue, single value, all equal values and queues missing one of the severities.', communication: Explains the invariant and why each branch preserves it.}
hints: ['There are only three possible values. Could you grow a block of critical tickets at the front and a block of minor tickets at the back while you scan?', 'Keep three boundaries: the end of the critical block, the current position being examined, and the start of the minor block. Everything between the current position and the minor block is still unclassified.', 'Scan while the current position has not passed the start of the minor block. A critical ticket is swapped to the end of the critical block and both of those boundaries move forward; a major ticket just moves the current position forward; a minor ticket is swapped with the last unclassified slot and only the minor boundary moves back, because the ticket that arrived still has to be examined.']
followups: ['Why must the current position stay put after swapping a minor ticket into place?', 'Is this partition stable, and does stability matter if each ticket carries more data than its severity?', 'How would you generalise to k severity levels, and what would the complexity be?', 'How does this partition relate to the three-way partition used in quicksort with many duplicate keys?']
common_errors: ['Advancing the current position after swapping with the minor boundary, which can leave a misplaced value behind.', Using a strict less-than loop condition so the last unclassified ticket is never examined., 'Falling back to a library sort or a counting array, which misses the point of the exercise.', Index errors on an empty queue when the minor boundary starts at minus one.]
