version: 1
slug: find_root_approver
title: Find the Root Approver
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [security, backend, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Find the Root Approver

  A platform team keeps a registry of `n` internal services labelled `1` to `n`. Each pair `[a, b]` in
  `trusts` records that service `a` accepts change approvals signed by service `b`; in short,
  **service `a` trusts service `b`**. Trust is one-directional: `[a, b]` says nothing about whether `b`
  trusts `a`.

  The registry export is assembled from several audit logs and is **not deduplicated**: the same pair
  can appear more than once, and a repeated pair still means only that `a` trusts `b`.

  The **root approver** is the service that:

  - trusts **no** other service, and
  - is trusted by **every** other service.

  Return the label of the root approver, or `-1` if no service meets both conditions. At most one
  service can meet both conditions.

  ### Example 1
  ```
  Input:  n = 3, trusts = [[1, 3], [2, 3]]
  Output: 3
  Explanation: Services 1 and 2 both trust 3, and 3 trusts nobody.
  ```

  ### Example 2
  ```
  Input:  n = 4, trusts = [[1, 4], [2, 4], [3, 4], [4, 2]]
  Output: -1
  Explanation: Service 4 is trusted by everyone, but it trusts service 2.
  ```

  ### Example 3
  ```
  Input:  n = 3, trusts = [[1, 3], [1, 3]]
  Output: -1
  Explanation: The pair [1, 3] is logged twice, but service 2 does not trust service 3.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `0 <= trusts.length <= 2 * 10^5`
  - `trusts[i].length == 2` and `1 <= trusts[i][0], trusts[i][1] <= n`
  - `trusts[i][0] != trusts[i][1]` (no service trusts itself)
  - The same pair may appear more than once.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_root_approver
  params:
    - {name: n, type: "int"}
    - {name: trusts, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def find_root_approver(n: int, trusts: list[list[int]]) -> int:
        # A root never appears as the truster, so it must be the only such service.
        trusts_someone = [False] * (n + 1)
        for truster, _ in trusts:
            trusts_someone[truster] = True
        candidates = [s for s in range(1, n + 1) if not trusts_someone[s]]
        if len(candidates) != 1:
            return -1
        root = candidates[0]
        # Count distinct services that trust the candidate; repeated pairs count once.
        trusted_by = [False] * (n + 1)
        distinct = 0
        for truster, trusted in trusts:
            if trusted == root and not trusted_by[truster]:
                trusted_by[truster] = True
                distinct += 1
        return root if distinct == n - 1 else -1
  javascript: |
    function findRootApprover(n, trusts) {
      const trustsSomeone = new Array(n + 1).fill(false);
      for (const [truster] of trusts) trustsSomeone[truster] = true;
      let root = -1;
      for (let service = 1; service <= n; service++) {
        if (!trustsSomeone[service]) {
          if (root !== -1) return -1; // two services trust nobody
          root = service;
        }
      }
      if (root === -1) return -1;
      const trustedBy = new Array(n + 1).fill(false);
      let distinct = 0;
      for (const [truster, trusted] of trusts) {
        if (trusted === root && !trustedBy[truster]) {
          trustedBy[truster] = true;
          distinct += 1;
        }
      }
      return distinct === n - 1 ? root : -1;
    }
