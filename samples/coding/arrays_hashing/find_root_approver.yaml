expected_concepts:
  - "in-degree and out-degree reasoning on a directed graph"
  - "deduplicating repeated edges before counting"
  - "narrowing to a single candidate before verifying it"
  - "handling n = 1 and an empty pair list"
optimal_complexity: {time: "O(n + t)", space: "O(n)"}
rubric:
  excellent: "Notices that repeated pairs break raw degree counting, narrows the search to the single service that never trusts anyone, counts distinct trusters of that candidate with a boolean array, handles n = 1 and explains O(n + t) time with O(n) extra memory."
  good: "Deduplicates the pairs with a set and then applies in-degree and out-degree (or net score) counting, giving O(n + t) time with O(t) extra memory, or reaches the candidate approach after a hint about repeated pairs."
  weak: "Counts raw in-degree without handling repeated pairs, checks only that a service is trusted and not that it trusts nobody, or builds an n by n matrix that does not fit the constraints."
  criteria:
    correctness: "All tests pass, including repeated pairs, the single-service case and a candidate that is trusted by all but trusts another service."
    efficiency: "Linear in the number of services plus the number of pairs; no quadratic matrix or per-service rescans."
    code_quality: "Arrays indexed by label with clear names; the candidate search and the verification are clearly separated."
    edge_cases: "Covers n = 1, an empty pair list, repeated pairs, mutual trust, cycles and more than one service that trusts nobody."
    communication: "Explains why at most one service can be the root and why repeated pairs must be counted once."
hints:
  - "Describe the root purely in terms of the pairs: how many pairs name it as the truster, and how many different services name it as the trusted one? Keep in mind that a repeated pair says nothing new."
  - "If a root exists, every other service trusts it, so the root is the only service that never appears as a truster; find that single candidate first and only then check who trusts it."
  - "Mark every service that appears as a truster; if the number of unmarked services is not exactly one the answer is minus one. Otherwise walk the pairs again, mark each distinct service that trusts the unmarked one in a boolean array, and return the candidate only if exactly n minus one services were marked."
followups:
  - "Why can there never be two root approvers?"
  - "If the export were guaranteed to be deduplicated, how would a single net score per service solve it in one pass?"
  - "If you could only ask a trusts(a, b) oracle instead of receiving the pair list, how would you find the root with O(n) queries?"
  - "How would the answer change if trust were transitive?"
common_errors:
  - "Adding one per pair to a trusted counter, so a repeated pair makes a service look trusted by more services than really trust it."
  - "Checking only that a service is trusted by n - 1 others and forgetting that it must trust nobody."
  - "Returning -1 for n = 1 even though a lone service with no pairs satisfies both conditions."
  - "Using 0-based arrays of size n and indexing out of range with label n."
  - "Building an n by n matrix, which is quadratic in memory for n up to 10^5."
