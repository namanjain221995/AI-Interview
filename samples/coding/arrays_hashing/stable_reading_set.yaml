title: Largest Near-Stable Reading Set
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data_scientist, data, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Largest Near-Stable Reading Set

  A temperature sensor reported a series of integer readings in `readings`. An analyst wants to pick a
  **set of readings** (any positions, not necessarily adjacent, each position used at most once) whose
  largest value minus its smallest value is **exactly `1`**. Such a set is called near-stable.

  Return the size of the largest near-stable set, or `0` if no near-stable set exists. A set in which
  every reading is equal has a difference of `0` and is **not** near-stable.

  ### Example 1
  ```
  Input:  readings = [20, 21, 21, 23, 20, 22, 21]
  Output: 5
  Explanation: Take both 20s and all three 21s.
  ```

  ### Example 2
  ```
  Input:  readings = [5, 5, 5]
  Output: 0
  Explanation: Every set has a difference of 0.
  ```

  ### Example 3
  ```
  Input:  readings = [-3, -2, -2, -4]
  Output: 3
  Explanation: Take -3 and both -2s.
  ```

  ### Constraints
  - `1 <= readings.length <= 10^5`
  - `-10^9 <= readings[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: stable_reading_set
  params:
    - {name: readings, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def stable_reading_set(readings: list[int]) -> int:
        counts = Counter(readings)
        best = 0
        for value, count in counts.items():
            if value + 1 in counts:
                best = max(best, count + counts[value + 1])
        return best
  javascript: |
    function stableReadingSet(readings) {
      const counts = new Map();
      for (const r of readings) counts.set(r, (counts.get(r) || 0) + 1);
      let best = 0;
      for (const [value, count] of counts) {
        if (counts.has(value + 1)) best = Math.max(best, count + counts.get(value + 1));
      }
      return best;
    }
