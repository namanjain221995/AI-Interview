expected_concepts:
  - "frequency counting with a hash map"
  - "reducing a subset search to pairs of consecutive values"
  - "order of elements does not matter"
  - "returning zero when no consecutive pair exists"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Argues that a near-stable set contains exactly two consecutive values, builds a frequency map, checks each value against its successor and states O(n) time and space; also mentions the O(n log n) sorting alternative."
  good: "Correct solution with a frequency map or sorting plus a sliding window, possibly after a hint about consecutive values."
  weak: "Tries to enumerate subsets, counts all-equal sets as valid, or only looks at adjacent positions in the original order."
  criteria:
    correctness: "All tests pass, including all-equal readings and inputs with no consecutive values."
    efficiency: "Linear time with a hash map, or O(n log n) with sorting."
    code_quality: "Short, readable counting loop with clearly named variables."
    edge_cases: "Single reading, negative values, extremes near the 32-bit bounds and inputs that should return 0."
    communication: "Explains why only two distinct, consecutive values can appear in a near-stable set."
hints:
  - "Think about which distinct values can appear together in a near-stable set and how far apart they can be."
  - "Only two distinct values can appear, and they must be consecutive integers; since positions do not matter, count how many times each value occurs."
  - "Build a frequency map, then for every value whose successor (the value plus one) is also in the map, consider the sum of both frequencies and keep the largest; if no value has its successor, the answer is zero."
followups:
  - "How would you solve it with O(1) extra space if you are allowed to sort the input?"
  - "How would you generalise to a set whose largest minus smallest is at most k?"
  - "What if the readings arrive as a stream and you must keep the answer up to date?"
common_errors:
  - "Counting a set of identical readings as near-stable and returning its size instead of 0."
  - "Treating the task as a contiguous window problem over the original order."
  - "Checking both value - 1 and value + 1 and double-counting, or forgetting to require that the successor exists."
