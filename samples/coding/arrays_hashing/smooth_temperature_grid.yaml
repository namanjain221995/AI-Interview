expected_concepts:
  - "2D grid traversal with neighbour offsets"
  - "bounds checking at edges and corners"
  - "writing to a separate output grid"
  - "integer floor division"
optimal_complexity: {time: "O(m * n)", space: "O(m * n) for the output grid"}
rubric:
  excellent: "Writes into a fresh grid, clamps the neighbour ranges to the grid bounds, counts only valid cells, uses floor division and explains O(m * n) time with a constant 3 x 3 window; may mention an in-place variant that packs results into spare bits."
  good: "Correct solution with explicit bounds checks for every neighbour, perhaps after fixing an edge or corner off-by-one."
  weak: "Updates the grid in place so later cells read smoothed values, always divides by 9, or crashes on single-row or single-column grids."
  criteria:
    correctness: "All tests pass, including 1 x 1, single-row and single-column grids."
    efficiency: "Each cell visits at most nine neighbours, giving linear time in the grid size."
    code_quality: "Neighbour iteration is expressed once (offset loop or clamped ranges) rather than eight copied branches."
    edge_cases: "Corners, edges, single row, single column and maximum readings."
    communication: "Explains why a separate output grid is needed and how the divisor varies by position."
hints:
  - "Each output cell depends only on a small fixed neighbourhood of the input, so think about how to visit that neighbourhood safely near the borders."
  - "Write the results into a new grid so that every average uses original readings, and for each cell count only the neighbours whose row and column lie inside the grid."
  - "For every cell, loop over row offsets and column offsets from minus one to plus one, skip positions outside the grid, accumulate both the sum of readings and the number of valid cells, and store the sum divided by that count rounded down in the new grid."
followups:
  - "How could you smooth with a larger k x k window efficiently, for example with 2D prefix sums?"
  - "How would you do this in place with O(1) extra memory?"
  - "If the grid were streamed one row at a time, how many rows would you need to keep in memory?"
common_errors:
  - "Modifying the input grid in place so later cells average already-smoothed values."
  - "Dividing by 9 for every cell instead of by the number of cells inside the grid."
  - "Rounding to the nearest integer instead of rounding down."
  - "Mixing up rows and columns on non-square grids and reading out of bounds."
