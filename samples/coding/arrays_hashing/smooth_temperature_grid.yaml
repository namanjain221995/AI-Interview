slug: smooth_temperature_grid
title: Smooth a Temperature Grid
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [data_scientist, frontend, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Smooth a Temperature Grid

  A datacentre heat map stores rack-inlet temperature readings in an `m x n` grid of non-negative
  integers. To reduce sensor noise, the monitoring team wants a smoothed copy of the grid.

  Each cell of the smoothed grid is the **average** of the original cell and all of its neighbours that
  lie inside the grid, **rounded down** to an integer. Neighbours are the up to eight cells that touch the
  cell horizontally, vertically or diagonally, so a corner cell averages 4 cells, an edge cell 6 and an
  interior cell 9 (fewer when the grid has a single row or column).

  Every average is computed from the **original** readings, never from cells that were already smoothed.
  Return the smoothed grid with the same dimensions as the input.

  ### Example 1
  ```
  Input:  grid = [[10, 20], [30, 40]]
  Output: [[25, 25], [25, 25]]
  Explanation: Every cell is a corner, so each averages all four readings: 100 / 4 = 25.
  ```

  ### Example 2
  ```
  Input:  grid = [[12, 0, 6], [3, 9, 0], [0, 6, 3]]
  Output: [[6, 5, 3], [5, 4, 4], [4, 3, 4]]
  Explanation: Corner (0, 2): (0 + 6 + 9 + 0) / 4 = 3.75, rounded down to 3.
               Edge (0, 1): (12 + 0 + 6 + 3 + 9 + 0) / 6 = 5. Centre: 39 / 9 = 4.33, rounded down to 4.
  ```

  ### Constraints
  - `1 <= m, n <= 200` where `m = grid.length` and `n = grid[i].length`
  - All rows have the same length.
  - `0 <= grid[i][j] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smooth_temperature_grid
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def smooth_temperature_grid(grid: list[list[int]]) -> list[list[int]]:
        rows, cols = len(grid), len(grid[0])
        result = [[0] * cols for _ in range(rows)]
        for r in range(rows):
            for c in range(cols):
                total = cells = 0
                for nr in range(max(0, r - 1), min(rows, r + 2)):
                    for nc in range(max(0, c - 1), min(cols, c + 2)):
                        total += grid[nr][nc]
                        cells += 1
                result[r][c] = total // cells
        return result
  javascript: |
    function smoothTemperatureGrid(grid) {
      const rows = grid.length;
      const cols = grid[0].length;
      const result = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          let total = 0;
          let cells = 0;
          for (let nr = Math.max(0, r - 1); nr <= Math.min(rows - 1, r + 1); nr++) {
            for (let nc = Math.max(0, c - 1); nc <= Math.min(cols - 1, c + 1); nc++) {
              total += grid[nr][nc];
              cells += 1;
            }
          }
          row.push(Math.floor(total / cells));
        }
        result.push(row);
      }
      return result;
    }
