slug: count_pallet_aligned_batches
title: Batches Divisible by Pallet Size
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, data_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## Batches Divisible by Pallet Size

  A packing line is divided into numbered slots. For every slot, `items[i]` is the **net** change in units
  recorded at that slot: a positive value means units were added to the line, a negative value means
  returned units were pulled off it.

  A **batch** is a contiguous run of one or more consecutive slots `items[i..j]` (`i <= j`). A batch is
  **pallet-aligned** when its net total is divisible by the pallet size `k`, which means the total is
  `0`, `k`, `-k`, `2k`, `-2k` and so on.

  Return the number of pallet-aligned batches. Two batches are different when they start or end at a
  different slot, even if they contain the same values. The count can exceed the 32-bit range, so return
  it as a 64-bit integer.

  ### Example 1
  ```
  Input:  items = [3, -1, 4, 2, -6], k = 3
  Output: 6
  Explanation: The aligned batches are [3], [3, -1, 4], [-1, 4], [4, 2], [4, 2, -6] (total 0) and [-6].
  ```

  ### Example 2
  ```
  Input:  items = [-1, 3, 2], k = 3
  Output: 1
  Explanation: Only [3] is aligned; [-1] totals -1, [-1, 3] totals 2, [3, 2] totals 5 and the whole line totals 4.
  ```

  ### Constraints
  - `1 <= items.length <= 10^5`
  - `-10^4 <= items[i] <= 10^4`
  - `1 <= k <= 10^4`

  **Follow-up:** the nested-loop solution is `O(n^2)`. Can you count the batches in a single pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_pallet_aligned_batches
  params:
    - {name: items, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_pallet_aligned_batches(items: list[int], k: int) -> int:
        # seen[r] = how many prefixes (including the empty one) have remainder r
        seen = {0: 1}
        running = 0
        count = 0
        for value in items:
            running = (running + value) % k  # Python's % is never negative for k > 0
            count += seen.get(running, 0)
            seen[running] = seen.get(running, 0) + 1
        return count
  javascript: |
    function countPalletAlignedBatches(items, k) {
      // seen.get(r) = how many prefixes (including the empty one) have remainder r
      const seen = new Map([[0, 1]]);
      let running = 0;
      let count = 0;
      for (const value of items) {
        running = (((running + value) % k) + k) % k; // normalize negative remainders
        const previous = seen.get(running) || 0;
        count += previous;
        seen.set(running, previous + 1);
      }
      return count;
    }
