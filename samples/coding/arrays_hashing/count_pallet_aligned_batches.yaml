optimal_complexity: {time: O(n), space: 'O(min(n, k))'}
rubric:
  excellent: Derives that a batch total is divisible by k exactly when its two bounding prefix sums share a remainder, counts remainders in one pass with the empty prefix seeded, normalizes negative remainders explicitly for the chosen language, uses a 64-bit counter and states O(n) time and O(min(n, k)) space.
  good: Reaches the prefix-remainder counting solution with some prompting, or fixes the negative-remainder or empty-prefix bug after running the tests.
  weak: Stays with the O(n^2) or O(n^3) enumeration, or the remainder approach fails on negative values or misses batches that start at slot 0.
  criteria: {correctness: 'All tests pass, including negative running totals, all zeros and k equal to 1.', efficiency: Single pass with constant-time remainder lookups; no enumeration of batches., code_quality: Clear names for the running remainder and the remainder counts; the normalization step is easy to spot., edge_cases: 'Empty-prefix seed, negative values, k larger than any total and counts that exceed the 32-bit range.', communication: Explains why equal remainders imply a divisible difference and why the remainder must be normalized.}
hints: ['Think about the running total of the line from the first slot onward: how can the total of any single batch be written using two running totals?', 'A batch total is divisible by k exactly when the two running totals that bound it leave the same remainder after dividing by k, so you only need to know how often each remainder has appeared so far.', 'Keep a hash map from remainder to the number of prefixes that produced it, starting with remainder zero seen once for the empty prefix. For each slot update the running remainder, turn a negative remainder into its positive equivalent by adding k and reducing again, add the stored count for that remainder to the answer, then increment the stored count.']
followups: ['Why does a negative running total need special care in Java, JavaScript, Go or C++ but not in Python?', 'Could you replace the hash map with an array, and when would that be the better choice?', 'How would you return the longest aligned batch instead of the number of aligned batches?', 'What changes if slot values arrive as an unbounded stream and you must report the count after each slot?']
common_errors: ['Forgetting to seed remainder zero for the empty prefix, which misses every aligned batch starting at slot 0.', 'Using a language remainder operator that returns negative values without normalizing it, so prefixes with remainders such as -1 and 2 are not matched.', 'Counting the result in a 32-bit integer, which overflows on long lines.', 'Checking only whether the running total itself is divisible by k, which counts prefixes instead of all batches.']
