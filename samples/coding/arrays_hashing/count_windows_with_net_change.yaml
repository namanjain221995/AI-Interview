version: 1
slug: count_windows_with_net_change
title: Windows With a Given Net Stock Change
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, data_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Windows With a Given Net Stock Change

  An inventory service records the net stock change of one product for every hour in `changes`:
  restocks are positive, sales and write-offs are negative, and a quiet hour is `0`.

  Count the contiguous, non-empty windows of hours whose changes add up to **exactly** `target`.
  Windows are identified by their start and end hour, so two windows with the same values at different
  positions are counted separately.

  ### Example 1
  ```
  Input:  changes = [3, -1, -2, 4, -4, 2], target = 0
  Output: 4
  Explanation: the windows [3, -1, -2], [4, -4], [-2, 4, -4, 2] and [3, -1, -2, 4, -4] each sum to 0.
  ```

  ### Example 2
  ```
  Input:  changes = [2, 3, 1, 4, 5], target = 5
  Output: 3
  Explanation: the windows [2, 3], [1, 4] and [5] sum to 5.
  ```

  ### Constraints
  - `1 <= changes.length <= 5 * 10^4`
  - `-1000 <= changes[i] <= 1000`
  - `-5 * 10^7 <= target <= 5 * 10^7`
  - The answer fits in a 32-bit signed integer.

  **Follow-up:** a sliding window does not work once values can be negative. Can you still reach `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_windows_with_net_change
  params:
    - {name: changes, type: "int[]"}
    - {name: target, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def count_windows_with_net_change(changes: list[int], target: int) -> int:
        seen: dict[int, int] = {0: 1}  # running total -> how many prefixes reached it
        running = 0
        count = 0
        for change in changes:
            running += change
            count += seen.get(running - target, 0)
            seen[running] = seen.get(running, 0) + 1
        return count
  javascript: |
    function countWindowsWithNetChange(changes, target) {
      const seen = new Map([[0, 1]]); // running total -> how many prefixes reached it
      let running = 0;
      let count = 0;
      for (const change of changes) {
        running += change;
        count += seen.get(running - target) || 0;
        seen.set(running, (seen.get(running) || 0) + 1);
      }
      return count;
    }
