expected_concepts:
  - prefix (running) sums
  - window sum as the difference of two prefix sums
  - hash map counting earlier prefix sums
  - seeding the map with the empty prefix
  - why a two-pointer sliding window fails with negative values
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Explains why a sliding window fails with negative values, rewrites a window sum as a difference of prefix sums, counts earlier prefixes in a hash map seeded with the empty prefix and states O(n) time and space.
  good: Reaches the prefix-sum hash map with some prompting, or starts from an O(n^2) prefix-sum solution and improves it.
  weak: Uses a two-pointer window that is wrong for negative values, stays at O(n^2) or O(n^3), or forgets windows that start at the first hour.
  criteria:
    correctness: All tests pass, including all-zero arrays and windows starting at index 0.
    efficiency: One pass with a hash map of running totals.
    code_quality: The map's meaning is clear from its name or a comment, and the lookup happens before the insert.
    edge_cases: Zeros, negative targets, a single hour and windows that cover the prefix.
    communication: Articulates the prefix-difference identity before coding.
hints:
  - Try expressing the sum of the hours from i to j using totals that all start at the first hour.
  - A window ending at the current hour has the target sum exactly when some earlier running total equals the current running total minus the target; how could you count those earlier totals quickly?
  - Keep a hash map from running total to how many prefixes reached it, seeded with zero seen once; for each hour update the running total, add the map's count for the running total minus the target, and only then record the current running total.
followups:
  - How would you return the longest such window instead of the count?
  - How would you solve it with a sliding window if every change were positive?
  - How would you count windows whose sum is divisible by a given number?
common_errors:
  - Using a sliding window that shrinks when the sum exceeds the target, which is wrong with negative values.
  - Not seeding the map with a running total of zero, which misses windows that start at the first hour.
  - Recording the current running total before the lookup, which counts empty windows when the target is zero.
  - Storing only whether a running total was seen instead of how many times.
