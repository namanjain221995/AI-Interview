expected_concepts:
  - "pigeonhole principle: the widest gap is at least (max - min) / (n - 1)"
  - buckets that store only their minimum and maximum
  - comparing each bucket minimum with the previous non-empty bucket maximum
  - radix sort as an alternative linear-time approach
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Derives the pigeonhole lower bound, sizes n - 1 style buckets so no answer can lie inside a bucket, keeps only bucket minima and maxima, scans non-empty buckets and justifies O(n) time and space; handles fewer than two samples and all-equal input.
  good: Correct linear solution via radix sort, or the bucket idea with minor off-by-one issues in the bucket size fixed after testing.
  weak: Sorts with a comparison sort and cannot argue for a linear-time approach, or compares only adjacent elements of the unsorted input.
  criteria:
    correctness: All tests pass, including duplicates, all-equal samples and extreme values.
    efficiency: Linear time and space; no comparison sort.
    code_quality: Bucket index computation is clear; empty buckets are represented explicitly.
    edge_cases: Fewer than two samples, all equal, two extreme values and evenly spaced input.
    communication: Explains why the maximum gap can never occur between two values in the same bucket.
hints:
  - Without sorting, what is the smallest the widest gap could possibly be, given the minimum, the maximum and the number of samples?
  - If you split the range from minimum to maximum into buckets narrower than that lower bound, two values in the same bucket can never form the widest gap.
  - Use a bucket size of the range divided by n minus one (at least one), record only the minimum and maximum of each bucket, then walk the buckets in order and compare each non-empty bucket's minimum with the maximum of the previous non-empty bucket.
followups:
  - How would radix sort solve this in linear time, and what are its constants?
  - Why must the bucket size be at least 1?
  - How would you find the k widest gaps?
  - Could you do this in a single pass over a stream with bounded memory?
common_errors:
  - Using a bucket size of zero when the range is smaller than the number of samples.
  - Comparing gaps inside a bucket, which can never be the answer, instead of across buckets.
  - Forgetting to skip empty buckets when tracking the previous maximum.
  - Not returning 0 for fewer than two samples or for all-equal samples.
