title: Widest Gap Between Latency Samples
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, backend, data]
time_limit_minutes: 30
prompt_markdown: |
  ## Widest Gap Between Latency Samples

  An SRE dashboard wants to find where a latency distribution breaks into separate clusters. You are given
  unsorted, non-negative latency samples in microseconds. Return the **largest difference between two
  neighbouring values** once the samples are sorted in ascending order. If there are fewer than two
  samples, return `0`.

  Your solution must run in **linear time** and use **linear extra space**: sorting the samples with a
  comparison sort is not the intended answer, and the interviewer will ask you to justify the bound.

  ### Example 1
  ```
  Input:  samples = [48, 3, 21, 9]
  Output: 27
  Explanation: Sorted: 3, 9, 21, 48. The neighbouring differences are 6, 12 and 27.
  ```

  ### Example 2
  ```
  Input:  samples = [17]
  Output: 0
  ```

  ### Constraints
  - `1 <= samples.length <= 10^5`
  - `0 <= samples[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: widest_latency_gap
  params:
    - {name: samples, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def widest_latency_gap(samples: list[int]) -> int:
        n = len(samples)
        if n < 2:
            return 0
        low, high = min(samples), max(samples)
        if low == high:
            return 0
        # The widest gap is at least ceil((high - low) / (n - 1)), so no answer hides inside a bucket.
        size = max(1, (high - low) // (n - 1))
        count = (high - low) // size + 1
        bucket_min: list[int | None] = [None] * count
        bucket_max: list[int | None] = [None] * count
        for value in samples:
            index = (value - low) // size
            if bucket_min[index] is None or value < bucket_min[index]:
                bucket_min[index] = value
            if bucket_max[index] is None or value > bucket_max[index]:
                bucket_max[index] = value
        widest, previous_max = 0, low
        for index in range(count):
            if bucket_min[index] is None:
                continue  # empty bucket: the gap spans it
            widest = max(widest, bucket_min[index] - previous_max)
            previous_max = bucket_max[index]
        return widest
  javascript: |
    function widestLatencyGap(samples) {
      const n = samples.length;
      if (n < 2) return 0;
      let low = samples[0];
      let high = samples[0];
      for (const value of samples) {
        if (value < low) low = value;
        if (value > high) high = value;
      }
      if (low === high) return 0;
      const size = Math.max(1, Math.floor((high - low) / (n - 1)));
      const count = Math.floor((high - low) / size) + 1;
      const bucketMin = new Array(count).fill(null);
      const bucketMax = new Array(count).fill(null);
      for (const value of samples) {
        const index = Math.floor((value - low) / size);
        if (bucketMin[index] === null || value < bucketMin[index]) bucketMin[index] = value;
        if (bucketMax[index] === null || value > bucketMax[index]) bucketMax[index] = value;
      }
      let widest = 0;
      let previousMax = low;
      for (let index = 0; index < count; index++) {
        if (bucketMin[index] === null) continue;
        widest = Math.max(widest, bucketMin[index] - previousMax);
        previousMax = bucketMax[index];
      }
      return widest;
    }
