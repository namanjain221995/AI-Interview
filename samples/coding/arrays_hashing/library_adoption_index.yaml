expected_concepts:
  - "definition of the index as a threshold on a count of qualifying services"
  - "counting buckets of size n + 1 with counts above n capped at n"
  - "suffix accumulation from the largest bucket down"
  - "O(n) time versus O(n log n) sort-based approach"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "States the sort-based baseline, then derives the capped counting-bucket solution with a suffix sum, explains why counts above n can be capped, and justifies O(n) time and space."
  good: "Correct sort-based O(n log n) solution, or the bucket solution with a small off-by-one fixed after testing."
  weak: "Tries every h with a full scan (O(n^2)), confuses the index with a maximum or median, or crashes on large counts."
  criteria:
    correctness: "All tests pass, including empty input, all zeros and very large counts."
    efficiency: "Linear time using buckets; no sorting required."
    code_quality: "Clear names for the bucket array and the running total; no magic offsets."
    edge_cases: "Empty list, a single service, counts far above n and many equal counts."
    communication: "Explains why no answer can exceed the number of services and how that bounds the buckets."
hints:
  - "What is the largest value the answer could possibly be, given how many services there are?"
  - "Because the answer never exceeds the number of services, any count larger than that can be treated as equal to it, which lets you tally counts instead of sorting them."
  - "Make a tally array of size n plus one where counts above n go into the last slot, then walk from the top slot downwards keeping a running total of services seen; the first position where that total reaches the position itself is the answer."
followups:
  - "How would you maintain the index as services report new counts one at a time?"
  - "If the counts were already sorted in descending order, how could you find the index in O(log n)?"
  - "What does the index hide that a histogram of call counts would show?"
common_errors:
  - "Indexing the bucket array with the raw count, which overflows for counts larger than n."
  - "Returning the first h where exactly h services have h calls instead of the largest valid h."
  - "Off-by-one when comparing the running total with the candidate index."
  - "Returning a non-zero value when every service reports zero calls."
