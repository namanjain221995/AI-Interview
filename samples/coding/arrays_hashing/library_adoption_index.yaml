slug: library_adoption_index
title: Internal Library Adoption Index
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [platform, tech_lead, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Internal Library Adoption Index

  The platform team publishes a shared HTTP client library and wants a single number that summarises how
  deeply it has been adopted. Every dependent service reports how many times it called the library last
  week: `call_counts[i]` is the count for service `i`.

  The **adoption index** is the largest integer `h` such that **at least `h` services** each made **at
  least `h` calls**. Return the adoption index.

  - The services are listed in no particular order.
  - If no service made any calls (or there are no services), the index is `0`.
  - Services with very large counts still contribute only one service each.

  **Goal:** an `O(n)` solution that does not sort the input.

  ### Example 1
  ```
  Input:  call_counts = [3, 0, 6, 1, 5]
  Output: 3
  Explanation: Three services (3, 6 and 5 calls) each made at least 3 calls, but only two services made at least 4.
  ```

  ### Example 2
  ```
  Input:  call_counts = [1, 4, 1]
  Output: 1
  Explanation: Only one service made at least 2 calls, while three services made at least 1.
  ```

  ### Example 3
  ```
  Input:  call_counts = [10, 10, 10]
  Output: 3
  ```

  ### Constraints
  - `0 <= call_counts.length <= 10^5`
  - `0 <= call_counts[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: library_adoption_index
  params:
    - {name: call_counts, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def library_adoption_index(call_counts: list[int]) -> int:
        n = len(call_counts)
        # buckets[c] = number of services with exactly c calls (counts above n are capped at n).
        buckets = [0] * (n + 1)
        for count in call_counts:
            buckets[min(count, n)] += 1
        at_least = 0
        for h in range(n, 0, -1):
            at_least += buckets[h]
            if at_least >= h:
                return h
        return 0
  javascript: |
    function libraryAdoptionIndex(callCounts) {
      const n = callCounts.length;
      const buckets = new Array(n + 1).fill(0);
      for (const count of callCounts) buckets[Math.min(count, n)] += 1;
      let atLeast = 0;
      for (let h = n; h > 0; h--) {
        atLeast += buckets[h];
        if (atLeast >= h) return h;
      }
      return 0;
    }
