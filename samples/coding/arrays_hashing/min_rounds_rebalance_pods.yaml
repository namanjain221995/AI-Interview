expected_concepts:
  - "feasibility check: total divisible by n"
  - net flow across each boundary from prefix sums of surpluses
  - "lower bounds: one pod per boundary per round, one pod sent per node per round"
  - the answer is the maximum of those bounds
  - greedy or exchange argument that the bound is achievable
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Checks divisibility, computes the running surplus as the net flow across each boundary, identifies both lower bounds (absolute boundary flow and a node's own surplus, but not a deficit since a node can receive from both sides) and argues they are achievable, in O(n) time and O(1) space.
  good: Finds the boundary-flow bound and the formula with some prompting on why a node's surplus but not its deficit is a separate bound.
  weak: Simulates rounds greedily (slow and often wrong) or only uses the maximum surplus or only the boundary flows.
  criteria:
    correctness: All tests pass, including indivisible totals, already balanced rows and one-ended loads.
    efficiency: Single linear pass with constant extra space.
    code_quality: The running flow and the surplus are named and the max of the bounds is explicit.
    edge_cases: Single node, zero pods, indivisible totals and very large counts.
    communication: Explains both lower bounds and why the deficit side does not create a third bound.
hints:
  - First decide when the task is impossible, then think about how many pods must cross each gap between two neighbouring nodes.
  - The number of pods that must cross the gap after node i is the total surplus of nodes zero to i, and at most one pod can cross a gap per round. Is that the only limit, given that each node can send only one pod per round?
  - Walk the row once keeping the running sum of surpluses (pods minus the per-node target); the answer is the largest of the absolute running sums and the largest single-node surplus. A deficit never adds a bound because a node can receive from both sides at once.
followups:
  - Why does a node with a large deficit not force extra rounds the way a large surplus does?
  - How would the answer change if a node could send one pod to each neighbour in the same round?
  - How would you produce an actual schedule of migrations achieving the minimum?
  - What if the nodes formed a ring instead of a row?
common_errors:
  - Forgetting the -1 case when the total is not divisible by the number of nodes.
  - Taking the absolute value of a node's surplus, which wrongly treats a deficit as a bound.
  - Using only the maximum boundary flow and missing the single-node surplus bound.
  - Simulating rounds, which is too slow and hard to prove optimal.
