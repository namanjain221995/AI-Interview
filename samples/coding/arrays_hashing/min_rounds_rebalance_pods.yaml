version: 1
slug: min_rounds_rebalance_pods
title: Rebalance Pods Across a Node Row
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [platform, sre, devops]
time_limit_minutes: 30
prompt_markdown: |
  ## Rebalance Pods Across a Node Row

  A cluster has `n` nodes connected in a row; node `i` currently runs `pods[i]` pods. Rebalancing happens in
  **rounds**. In one round, you may pick **any set of nodes**; every picked node that runs at least one pod
  migrates **exactly one** pod to **one** of its immediate neighbours (`i - 1` or `i + 1`). All migrations in a
  round happen at the same time, and a node may receive pods from both neighbours in the same round.

  Return the **minimum number of rounds** needed until every node runs the same number of pods. If the total
  number of pods cannot be split evenly across the nodes, return `-1`.

  ### Example 1
  ```
  Input:  pods = [0, 6, 0]
  Output: 4
  Explanation: The goal is 2 pods per node. The middle node must give away 4 pods and can send only one
               per round, so 4 rounds are needed (and enough).
  ```

  ### Example 2
  ```
  Input:  pods = [4, 0, 0, 4]
  Output: 2
  Explanation: Round 1: node 0 sends to node 1 and node 3 sends to node 2, giving [3, 1, 1, 3]. Round 2 repeats
               this, giving [2, 2, 2, 2].
  ```

  ### Example 3
  ```
  Input:  pods = [2, 1]
  Output: -1
  ```

  ### Constraints
  - `1 <= pods.length <= 10^4`
  - `0 <= pods[i] <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_rounds_rebalance_pods
  params:
    - {name: pods, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_rounds_rebalance_pods(pods: list[int]) -> int:
        n = len(pods)
        total = sum(pods)
        if total % n:
            return -1
        target = total // n
        rounds = 0
        flow = 0  # net pods that must cross the boundary to the right of the current node
        for count in pods:
            surplus = count - target
            flow += surplus
            # A boundary carries at most one pod per round, and a node sends at most one pod per round.
            rounds = max(rounds, abs(flow), surplus)
        return rounds
  javascript: |
    function minRoundsRebalancePods(pods) {
      const n = pods.length;
      let total = 0;
      for (const count of pods) total += count;
      if (total % n !== 0) return -1;
      const target = total / n;
      let rounds = 0;
      let flow = 0;
      for (const count of pods) {
        const surplus = count - target;
        flow += surplus;
        rounds = Math.max(rounds, Math.abs(flow), surplus);
      }
      return rounds;
    }
