    - {name: c, type: "int[]"}
    - {name: d, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_zero_balance_quads(a: list[int], b: list[int], c: list[int], d: list[int]) -> int:
        pair_sums: dict[int, int] = {}
        for x in a:
            for y in b:
                pair_sums[x + y] = pair_sums.get(x + y, 0) + 1
        total = 0
        for x in c:
            for y in d:
                total += pair_sums.get(-(x + y), 0)
        return total
  javascript: |
    function countZeroBalanceQuads(a, b, c, d) {
      const pairSums = new Map();
      for (const x of a) {
        for (const y of b) {
          pairSums.set(x + y, (pairSums.get(x + y) || 0) + 1);
        }
      }
      let total = 0;
      for (const x of c) {
        for (const y of d) {
          total += pairSums.get(-(x + y)) || 0;
        }
      }
      return total;
    }
