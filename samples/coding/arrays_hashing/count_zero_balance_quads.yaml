expected_concepts:
  - meet in the middle by splitting four lists into two pairs
  - hash map from pair sum to frequency
  - counting with multiplicities instead of listing tuples
  - 64-bit accumulator to avoid overflow
optimal_complexity: {time: O(n^2), space: O(n^2)}
rubric:
  excellent: Starts from the O(n^4) brute force, splits the lists into two pairs, counts pair sums of a and b in a hash map, looks up the negated pair sums of c and d, uses a 64-bit counter, and states O(n^2) time and space.
  good: Reaches the O(n^2) hash map solution with a hint, or an O(n^2 log n) sort-based variant, and handles duplicates correctly.
  weak: Stays at O(n^4) or O(n^3), counts distinct value combinations instead of index tuples, or overflows a 32-bit counter.
  criteria:
    correctness: All tests pass, including duplicate amounts and the all-zero stress case.
    efficiency: O(n^2) time with a frequency map; the memory trade-off is acknowledged.
    code_quality: Clear names for the pair-sum map and the running total.
    edge_cases: n = 1, no balancing tuple, extreme values and a count above 2^31.
    communication: Explains why splitting into two pairs turns one hard lookup into two easy loops.
hints:
  - Checking every combination of four picks is n to the fourth power. Can you split the four ledgers into two groups and solve each half separately?
  - If you knew how many ways the first two ledgers produce each possible sum, how would you use that while looping over picks from the last two ledgers?
  - Build a frequency map of every sum of one amount from a and one from b, then for every pick from c and d add the frequency of the negated sum c plus d to a 64-bit total.
followups:
  - How would you return the distinct value combinations instead of counting index tuples?
  - What changes if the target is an arbitrary value instead of zero?
  - How would you generalise to k ledgers, and what is the complexity?
  - If memory for n^2 pair sums is too large, what sort-based approach could you use instead?
common_errors:
  - Counting distinct sums instead of their frequencies, which undercounts duplicates.
  - Using a 32-bit counter, which overflows on large all-zero inputs.
  - Looking up the pair sum instead of its negation.
  - Deduplicating input values, which changes the count of index tuples.
