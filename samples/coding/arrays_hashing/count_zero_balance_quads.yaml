time_limit_minutes: 20
prompt_markdown: |
  ## Zero-Balance Ledger Combinations

  Finance is reconciling four regional ledgers. Each ledger is a list of signed adjustment amounts, and
  all four lists have the same length `n`. Auditors want to know how many ways one adjustment can be
  picked from **each** ledger so that the four picked amounts cancel out exactly.

  Given `a`, `b`, `c` and `d`, return the number of index tuples `(i, j, k, l)` with

  `a[i] + b[j] + c[k] + d[l] == 0`

  - Tuples are counted by **position**, so equal amounts at different indices count as different picks.
  - Return `0` when no tuple balances.
  - The count can exceed the 32-bit integer range; return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  a = [2, -1], b = [-2, 1], c = [-1, 3], d = [1, 0]
  Output: 3
  Explanation: The balancing tuples are (0, 0, 0, 0), (1, 1, 0, 0) and (1, 0, 1, 1); for example 2 + (-2) + (-1) + 1 = 0.
  ```

  ### Example 2
  ```
  Input:  a = [0], b = [0], c = [0], d = [0]
  Output: 1
  ```

  ### Constraints
  - `1 <= n <= 200`
  - `a.length == b.length == c.length == d.length == n`
  - `-10^8 <= a[i], b[i], c[i], d[i] <= 10^8`

  **Follow-up:** the brute force is `O(n^4)`; aim for `O(n^2)` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
