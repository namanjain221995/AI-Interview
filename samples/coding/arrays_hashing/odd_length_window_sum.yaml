expected_concepts:
  - brute force with prefix sums in O(n^2)
  - "contribution technique: count windows containing each position"
  - (i + 1) * (n - i) windows contain position i, ceiling half are odd
  - 64-bit accumulation
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Moves from brute force to prefix sums to the O(n) contribution formula, justifies why the odd windows containing a position are the ceiling of half of (i + 1)(n - i), and uses 64-bit arithmetic.
  good: Correct O(n^2) prefix-sum solution with a sound plan for the O(n) formula, or the formula with a small off-by-one fixed through testing.
  weak: Triple-nested brute force without improvement, includes even-length windows, or overflows a 32-bit total.
  criteria:
    correctness: All tests pass, including two-element and even-length arrays.
    efficiency: O(n) with the contribution formula; O(n^2) with prefix sums is acceptable only as a stepping stone.
    code_quality: The window-count formula is named and commented rather than inlined as a magic expression.
    edge_cases: Single element, two elements, zeros and totals beyond 32 bits.
    communication: Explains the counting argument for the number of odd windows through a position.
hints:
  - Instead of summing window by window, ask how many times each individual value gets added to the total.
  - A window containing position i is fixed by choosing a start at or before i and an end at or after i; how many such windows exist, and how many of them have odd length?
  - There are (i + 1) times (n - i) windows through position i and the odd-length ones are that count plus one, halved and rounded down; multiply each value by its count and add everything in a 64-bit total.
followups:
  - How would you compute the same total for even-length windows?
  - How would you return the total for every window length separately?
  - What changes if values can be negative?
common_errors:
  - Counting all windows through a position instead of only the odd-length ones.
  - Rounding the half count down instead of up, which is off by one when the window count is odd.
  - Accumulating the total in a 32-bit integer.
