slug: odd_length_window_sum
title: Total Over All Odd-Length Windows
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [data, backend, data_scientist]
time_limit_minutes: 15
prompt_markdown: |
  ## Total Over All Odd-Length Windows

  A monitoring job stores one non-negative metric value per minute in `values`. For a smoothing
  diagnostic, an analyst wants a single number: take **every** contiguous window whose length is odd
  (1, 3, 5, ... minutes), compute the sum of the values inside each window, and add all of those window
  sums together.

  Return that grand total as a 64-bit integer.

  ### Example 1
  ```
  Input:  values = [2, 0, 3]
  Output: 10
  Explanation: the length-1 windows sum to 2 + 0 + 3 = 5 and the only length-3 window sums to 5, so the total is 10.
  ```

  ### Example 2
  ```
  Input:  values = [4, 1, 2, 5, 3]
  Output: 55
  ```

  ### Constraints
  - `1 <= values.length <= 10^4`
  - `0 <= values[i] <= 10^4`
  - The total can exceed the 32-bit integer range.

  **Follow-up:** can you compute the total in `O(n)` time by working out how many odd-length windows contain each position?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: odd_length_window_sum
  params:
    - {name: values, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def odd_length_window_sum(values: list[int]) -> int:
        n = len(values)
        total = 0
        for i, value in enumerate(values):
            # (i + 1) choices of start and (n - i) choices of end; just over half give an odd length.
            windows = ((i + 1) * (n - i) + 1) // 2
            total += value * windows
        return total
  javascript: |
    function oddLengthWindowSum(values) {
      const n = values.length;
      let total = 0;
      for (let i = 0; i < n; i++) {
        // (i + 1) choices of start and (n - i) choices of end; just over half give an odd length.
        const windows = Math.floor(((i + 1) * (n - i) + 1) / 2);
        total += values[i] * windows;
      }
      return total;
    }
