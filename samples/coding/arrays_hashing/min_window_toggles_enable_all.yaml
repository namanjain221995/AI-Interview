expected_concepts:
  - "greedy: the leftmost disabled service forces a toggle starting there"
  - toggle order does not matter and no block is toggled twice
  - difference array or queue of active toggle ends
  - parity of active toggles determines the current state
  - infeasibility when a toggle would run past the end
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Argues the greedy (the leftmost disabled service can only be fixed by a toggle starting there), tracks active toggles with a difference array or queue and parity instead of flipping k values, detects the run-past-the-end case and states O(n).
  good: Correct greedy that flips k values per toggle (O(n k)) and improves it with a hint, or the O(n) version with a minor bug fixed after testing.
  weak: Tries combinations of toggles (exponential) or a greedy that does not start at the leftmost disabled service.
  criteria:
    correctness: All tests pass, including impossible cases, k = 1 and k = n.
    efficiency: O(n) using a difference array or sliding count of active toggles.
    code_quality: The active-toggle bookkeeping is in one place with clear names.
    edge_cases: Already enabled rows, single service, toggles that would run past the end.
    communication: Explains why the greedy choice is forced and therefore optimal.
hints:
  - Does the order of toggles matter, and would toggling the same block twice ever help?
  - "Look at the leftmost disabled service: only one block start can still fix it without disturbing services you already fixed on its left. What does that imply?"
  - Scan left to right and decide at each index whether to start a toggle there; instead of flipping k values, record where each toggle stops in a difference array and keep a running count of active toggles, so a service is currently enabled when its original value plus the active count is odd. If a needed toggle would run past the end, return -1.
followups:
  - Why is the greedy choice also optimal, not just valid?
  - How would you return the start positions of the toggles?
  - Can you reduce the extra space to O(1) by marking the input?
  - What changes if a toggle could be any length up to k?
common_errors:
  - Flipping all k values for each toggle, which is O(n k).
  - Forgetting to stop counting a toggle once the scan passes its last service.
  - Not detecting the case where a needed toggle would extend past the last service.
  - Starting toggles at positions other than the leftmost disabled service.
