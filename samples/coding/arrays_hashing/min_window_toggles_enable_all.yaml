slug: min_window_toggles_enable_all
title: Enable All Flags With Block Toggles
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, frontend, platform]
time_limit_minutes: 30
prompt_markdown: |
  ## Enable All Flags With Block Toggles

  A feature flag is rolled out across a row of `n` services: `flags[i]` is `1` if the flag is enabled on service
  `i` and `0` otherwise. The rollout tool can only **toggle a block** of exactly `k` consecutive services at once:
  every service in the block flips from `0` to `1` or from `1` to `0`. A block must lie entirely inside the row.

  Return the **minimum number of block toggles** needed to enable the flag on every service, or `-1` if it is
  impossible.

  ### Example 1
  ```
  Input:  flags = [0, 0, 1, 0, 0, 0, 0, 0], k = 3
  Output: 3
  Explanation: Toggle services 0-2: [1, 1, 0, 0, 0, 0, 0, 0]. Toggle 2-4: [1, 1, 1, 1, 1, 0, 0, 0].
               Toggle 5-7: all ones.
  ```

  ### Example 2
  ```
  Input:  flags = [1, 0, 1], k = 2
  Output: -1
  Explanation: The only blocks are services 0-1 and 1-2. Toggling 0-1 gives [0, 1, 1], toggling 1-2 gives
               [1, 1, 0] and toggling both gives [0, 0, 0].
  ```

  ### Example 3
  ```
  Input:  flags = [0, 1, 0], k = 1
  Output: 2
  ```

  ### Constraints
  - `1 <= k <= flags.length <= 10^5`
  - `flags[i]` is `0` or `1`

  **Follow-up:** simulating each toggle costs `O(k)`. Can you solve it in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_window_toggles_enable_all
  params:
    - {name: flags, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_window_toggles_enable_all(flags: list[int], k: int) -> int:
        n = len(flags)
        ending = [0] * (n + 1)  # ending[i] = toggles whose block stops just before index i
        active = 0  # toggles that cover the current index
        operations = 0
        for i in range(n):
            active -= ending[i]
            if (flags[i] + active) % 2 == 0:  # currently disabled: must start a toggle here
                if i + k > n:
                    return -1  # the block would run past the last flag
                operations += 1
                active += 1
                ending[i + k] += 1
        return operations
  javascript: |
    function minWindowTogglesEnableAll(flags, k) {
      const n = flags.length;
      const ending = new Array(n + 1).fill(0);
      let active = 0;
      let operations = 0;
      for (let i = 0; i < n; i++) {
        active -= ending[i];
        if ((flags[i] + active) % 2 === 0) {
          if (i + k > n) return -1;
          operations++;
          active++;
          ending[i + k]++;
        }
      }
      return operations;
    }
