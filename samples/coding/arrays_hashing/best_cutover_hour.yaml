expected_concepts: [prefix and suffix counts, incremental cost update when the cutover moves by one hour, earliest index on ties via strict comparison, constant extra space]
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Computes the cost of h = 0 directly, updates it by one per hour in a single scan, keeps the earliest minimum with a strict comparison, includes h = n, and uses constant extra space.
  good: Uses prefix and suffix count arrays correctly in linear time, or reaches the running update with a hint.
  weak: Recomputes the cost for every h from scratch, forgets h = n, or returns the latest hour on ties.
  criteria: {correctness: 'All tests pass, including all-idle, all-busy and tie cases.', efficiency: Linear time; constant extra space is a bonus., code_quality: The update rule is short and the tie rule is explicit., edge_cases: 'Single hour, h = 0, h = n and ties.', communication: Explains how the cost changes when the cutover moves one hour later.}
hints: ['Work out the cost of cutting over at hour 0 first. How does the cost change when the cutover moves one hour later?', 'Moving the cutover from h to h + 1 moves hour h from the after part to the before part: a busy hour stops costing, an idle hour starts costing.', 'Start with the number of busy hours as the cost of h = 0, scan the hours once subtracting one for a busy hour and adding one for an idle hour, and remember the first hour where the cost is strictly lower than the best so far; the position after the last hour is a valid answer too.']
followups: ['How would you handle hours with different weights, for example the number of requests expected?', 'What if you could schedule two cutovers (old to interim, interim to new)?', 'How would you return every hour that achieves the minimum cost?']
common_errors: ['Recomputing the full cost for every candidate hour, giving quadratic time.', Forgetting that h can equal n., 'Using less-or-equal when updating the best, which returns the latest tied hour.']
