version: 1
slug: best_cutover_hour
title: Best Hour for a Maintenance Cutover
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [devops, sre, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Best Hour for a Maintenance Cutover

  A service moves from an old cluster to a new one during a maintenance window of `n` hours. The
  capacity plan is a string `traffic` of length `n` drawn like a timeline: `traffic[i]` is `'#'` if
  hour `i` is expected to carry user traffic (busy) and `'.'` if it is idle.

  You choose a cutover hour `h` with `0 <= h <= n`; the cutover happens at the start of hour `h`, and
  `h = n` means after the last hour.

  - Every **idle** hour **before** `h` costs 1, because the old cluster is kept running for nothing.
  - Every **busy** hour **at or after** `h` costs 1, because traffic is served in degraded migration mode.

  Return the cutover hour with the **lowest total cost**. If several hours tie, return the earliest one.

  ### Example 1
  ```
  Input:  traffic = "#.##.."
  Output: 4
  Explanation: The costs for h = 0..6 are 3, 2, 3, 2, 1, 2, 3. The minimum 1 is at h = 4.
  ```

  ### Example 2
  ```
  Input:  traffic = "..#."
  Output: 0
  Explanation: The costs for h = 0..4 are 1, 2, 3, 2, 3, so cutting over immediately is cheapest.
  ```

  ### Example 3
  ```
  Input:  traffic = ".##.#"
  Output: 3
  Explanation: The costs for h = 0..5 are 3, 4, 3, 2, 3, 2. Hours 3 and 5 tie at 2; the earliest is 3.
  ```

  ### Constraints
  - `1 <= traffic.length <= 10^5`
  - `traffic` contains only `'#'` and `'.'`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_cutover_hour
  params:
  - {name: traffic, type: string}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def best_cutover_hour(traffic: str) -> int:
        cost = traffic.count("#")
        best_cost, best_hour = cost, 0
        for hour, kind in enumerate(traffic):
            cost += -1 if kind == "#" else 1
            if cost < best_cost:
                best_cost, best_hour = cost, hour + 1
        return best_hour
  javascript: |
    function bestCutoverHour(traffic) {
      let cost = 0;
      for (const kind of traffic) if (kind === "#") cost++;
      let bestCost = cost;
      let bestHour = 0;
      for (let hour = 0; hour < traffic.length; hour++) {
        cost += traffic[hour] === "#" ? -1 : 1;
        if (cost < bestCost) {
          bestCost = cost;
          bestHour = hour + 1;
        }
      }
      return bestHour;
    }
tests:
  - {id: t1, args: ["#.##.."], expected: 4, description: "Example 1 - single minimum in the middle of the window"}
  - {id: t2, args: ["..#."], expected: 0, description: "Example 2 - cutting over immediately is cheapest"}
  - {id: t3, args: [".##.#"], expected: 3, description: "Example 3 - tie between hour 3 and hour 5 resolved to the earliest"}
  - {id: t4, hidden: true, args: ["#"], expected: 1, description: "Single busy hour"}
  - {id: t5, hidden: true, args: ["."], expected: 0, description: "Single idle hour"}
  - {id: t6, hidden: true, args: [".#"], expected: 0, description: "h = 0 and h = n tie at cost 1; earliest wins"}
  - {id: t7, hidden: true, args: ["#."], expected: 1, description: "Best hour in the middle with cost 0"}
  - {id: t8, hidden: true, args: ["#.#.#.#."], expected: 1, description: "Alternating hours with many ties"}
  - {id: t9, hidden: true, args: ["..###..####."], expected: 11, description: "Best hour sits just before a trailing idle hour after the last busy block"}
