expected_concepts:
  - "using the value range 1..n to index directly"
  - "boolean presence array or set"
  - "in-place sign marking for O(1) extra space"
  - "collecting results in ascending order"
optimal_complexity: {time: "O(n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Starts with a presence array or set, then derives the in-place marking trick (negating or offsetting entries at index value - 1), handles repeated marks safely and explains O(n) time with O(1) extra space."
  good: "Correct linear solution with a boolean array or set and the right ascending order, with discussion of the space trade-off."
  weak: "Searches the list for each locker number (quadratic), sorts and mishandles duplicates, or returns numbers out of order or 0-based."
  criteria:
    correctness: "All tests pass, including no missing lockers and all-but-one missing."
    efficiency: "Linear time; constant extra space for the follow-up."
    code_quality: "Clear separation between the marking pass and the collecting pass; uses absolute values safely when marking in place."
    edge_cases: "Single locker, every claim identical, missing lockers at both ends."
    communication: "Explains why the value range 1..n allows using the array itself as the marker table."
hints:
  - "Every claim is a number between 1 and n, and there are exactly n positions in the input, which is a strong clue."
  - "A presence table indexed by locker number solves it in linear time; can the input array itself act as that table?"
  - "For each claim v, mark position v minus 1 as seen without losing its original value, for example by making it negative and reading other entries through their absolute value; afterwards every position that is still unmarked gives a missing locker, its index plus one."
followups:
  - "How would you solve it in O(1) extra memory if you are allowed to modify the input?"
  - "How would you also report which lockers were claimed more than once?"
  - "What if the claims arrive as a stream and n is too large to keep a table in memory?"
  - "How would you restore the input after marking it in place?"
common_errors:
  - "Reading a value that was already negated without taking its absolute value, which produces a negative index."
  - "Negating the same slot twice when a locker is claimed twice, which un-marks it."
  - "Returning 0-based indices instead of locker numbers."
  - "Checking membership with a linear search for every locker, which is quadratic."
