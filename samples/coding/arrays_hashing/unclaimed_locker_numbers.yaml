title: "Unclaimed Locker Numbers"
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, qa, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Unclaimed Locker Numbers

  An office has `n` lockers numbered `1` to `n`. At the end of the day the badge system exports exactly
  `n` claim records in `claims`; each record is the number of the locker that a badge scan registered. A
  flaky reader sometimes logs the same locker more than once, which pushes other lockers out of the
  export.

  Return every locker number from `1` to `n` that does **not** appear in `claims`, in **ascending** order.
  Return an empty list when every locker was claimed. Here `n` is the length of `claims`.

  ### Example 1
  ```
  Input:  claims = [2, 2, 5, 1, 5]
  Output: [3, 4]
  Explanation: lockers 2 and 5 were logged twice, so lockers 3 and 4 never appear
  ```

  ### Example 2
  ```
  Input:  claims = [3, 1, 2]
  Output: []
  ```

  ### Example 3
  ```
  Input:  claims = [1, 1]
  Output: [2]
  ```

  ### Constraints
  - `1 <= n == claims.length <= 10^5`
  - `1 <= claims[i] <= n`

  **Follow-up:** can you solve it in `O(n)` time using only `O(1)` extra memory besides the returned list
  (you may modify the input)?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: unclaimed_locker_numbers
  params:
    - {name: claims, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def unclaimed_locker_numbers(claims: list[int]) -> list[int]:
        marks = list(claims)
        # Mark locker v as claimed by making the entry at index v - 1 negative.
        for value in claims:
            slot = abs(value) - 1
            if marks[slot] > 0:
                marks[slot] = -marks[slot]
        return [i + 1 for i, value in enumerate(marks) if value > 0]
  javascript: |
    function unclaimedLockerNumbers(claims) {
      const marks = claims.slice();
      for (const value of claims) {
        const slot = Math.abs(value) - 1;
        if (marks[slot] > 0) marks[slot] = -marks[slot];
      }
      const result = [];
      for (let i = 0; i < marks.length; i++) {
        if (marks[i] > 0) result.push(i + 1);
      }
      return result;
    }
