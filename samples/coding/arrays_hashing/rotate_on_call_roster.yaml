time_limit_minutes: 12
prompt_markdown: |
  ## Rotate the On-Call Roster

  Your team stores its on-call cycle as an ordered list of chat handles: the handle at index `0` covers
  the first week of the cycle, index `1` the second week, and so on. When the cycle is re-planned, every
  handle is pushed `k` weeks later. A handle that would fall off the end wraps around to the front, so the
  handle at index `i` moves to index `(i + k) mod n`, where `n` is the length of the roster.

  Given `handles` and `k`, return the re-planned roster.

  - The relative order of the handles is preserved; only the starting point of the cycle moves.
  - `k` may be `0` or larger than the roster length.
  - The same handle may appear more than once (one person can cover several weeks).
  - An empty roster returns an empty list.

  ### Example 1
  ```
  Input:  handles = ["ash", "birch", "cedar", "dune", "elm"], k = 2
  Output: ["dune", "elm", "ash", "birch", "cedar"]
  Explanation: the last two handles, dune and elm, wrap around to the front
  ```

  ### Example 2
  ```
  Input:  handles = ["ops-1", "ops-2", "ops-3"], k = 7
  Output: ["ops-3", "ops-1", "ops-2"]
  Explanation: 7 weeks on a 3-week cycle is the same as 1 week
  ```

  ### Constraints
  - `0 <= handles.length <= 10^5`
  - `1 <= handles[i].length <= 32`, made of lowercase letters, digits and hyphens
  - `0 <= k <= 10^9`

  **Follow-up:** can you perform the rotation in place with `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rotate_on_call_roster
  params:
    - {name: handles, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def rotate_on_call_roster(handles: list[str], k: int) -> list[str]:
        n = len(handles)
        if n == 0:
            return []
        shift = k % n
        # The last `shift` handles wrap around to the front.
        return handles[n - shift:] + handles[:n - shift]
  javascript: |
    function rotateOnCallRoster(handles, k) {
      const n = handles.length;
      if (n === 0) return [];
      const shift = k % n;
      return handles.slice(n - shift).concat(handles.slice(0, n - shift));
    }
