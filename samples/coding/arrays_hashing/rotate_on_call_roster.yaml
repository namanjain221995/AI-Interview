expected_concepts:
  - "reducing k modulo the roster length"
  - "guarding the empty roster before taking a modulo"
  - "slicing or index arithmetic (i + k) mod n"
  - "in-place rotation with three reversals as an O(1) space option"
optimal_complexity: {time: "O(n)", space: "O(1) extra with in-place reversals"}
rubric:
  excellent: "Reduces k modulo n after guarding the empty roster, builds the result in one pass (slices or index arithmetic), explains the three-reversal in-place variant and states O(n) time."
  good: "Correct slicing or new-array solution with the modulo, possibly after fixing the empty-roster or large-k case when prompted."
  weak: "Rotates one step at a time k times (too slow for large k), rotates in the wrong direction, or crashes on an empty roster."
  criteria:
    correctness: "All tests pass, including k = 0, k = n and k much larger than n."
    efficiency: "Linear in the roster length and independent of the size of k."
    code_quality: "Clear name for the effective shift; no duplicated branches for special cases."
    edge_cases: "Empty roster, single handle, repeated handles and k equal to a multiple of n."
    communication: "Explains the direction of the rotation and why k can be reduced modulo n."
hints:
  - "Rotating a roster of n handles by n weeks gives back the same roster, so think about what really matters about k."
  - "Only the effective shift k modulo n matters; after reducing it, which handles end up at the front of the new roster?"
  - "Guard against an empty roster, compute the effective shift as k modulo n, then take the last shift handles followed by the first n minus shift handles; for the in-place variant reverse the whole list and then reverse the two parts separately."
followups:
  - "How would you rotate in place with O(1) extra memory?"
  - "How would you rotate to the left instead, so the cycle starts earlier?"
  - "If the roster is huge and you only need to know who is on call in week w, can you answer without rotating?"
  - "How would you handle a roster stored as a linked list?"
common_errors:
  - "Taking k modulo n without checking for an empty roster, which divides by zero in several languages."
  - "Shifting in the wrong direction so the first handles move to the end instead of the last handles to the front."
  - "Rotating one position at a time k times, which is far too slow when k is around 10^9."
  - "Forgetting to reduce k so slice bounds become negative or out of range."
