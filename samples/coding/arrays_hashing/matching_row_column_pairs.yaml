prompt_markdown: |
  ## Matching Row and Column Signatures

  A tracing system summarises traffic between `n` internal services as an `n x n` matrix `grid`, where
  `grid[i][j]` is the number of calls service `i` made to service `j` during a window.

  Row `r` is the **outbound signature** of service `r`, and column `c` is the **inbound signature** of
  service `c` (read from top to bottom). Count the pairs `(r, c)` for which row `r` and column `c` are
  **identical**: the same values in the same order. `r` and `c` may be equal, and every matching pair is
  counted, even when several rows or columns are identical to each other.

  ### Example 1
  ```
  Input:  grid = [[5, 0, 1], [0, 5, 1], [1, 2, 0]]
  Output: 1
  Explanation: Row 0 is [5, 0, 1] and column 0 is [5, 0, 1]. No other row equals a column.
  ```

  ### Example 2
  ```
  Input:  grid = [[1, 2, 1], [2, 2, 2], [1, 2, 1]]
  Output: 5
  Explanation: Rows 0 and 2 both equal columns 0 and 2 (4 pairs), and row 1 equals column 1.
  ```

  ### Example 3
  ```
  Input:  grid = [[1, 2], [3, 4]]
  Output: 0
  ```

  ### Constraints
  - `1 <= n == grid.length == grid[i].length <= 200`
  - `0 <= grid[i][j] <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: matching_row_column_pairs
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def matching_row_column_pairs(grid: list[list[int]]) -> int:
        n = len(grid)
        row_counts: dict[tuple[int, ...], int] = {}
        for row in grid:
            key = tuple(row)
            row_counts[key] = row_counts.get(key, 0) + 1
        pairs = 0
        for c in range(n):
            column = tuple(grid[r][c] for r in range(n))
            pairs += row_counts.get(column, 0)
        return pairs
  javascript: |
    function matchingRowColumnPairs(grid) {
      const n = grid.length;
      const rowCounts = new Map();
      for (const row of grid) {
        const key = row.join(',');
        rowCounts.set(key, (rowCounts.get(key) || 0) + 1);
      }
      let pairs = 0;
      for (let c = 0; c < n; c++) {
        const column = [];
        for (let r = 0; r < n; r++) column.push(grid[r][c]);
        pairs += rowCounts.get(column.join(',')) || 0;
      }
      return pairs;
    }
