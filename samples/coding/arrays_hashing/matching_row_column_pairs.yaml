expected_concepts:
  - "hashing a whole row as an immutable key (tuple or joined string with a separator)"
  - "counting duplicate rows so identical rows each pair with a matching column"
  - "O(n^2) total work versus O(n^3) pairwise comparison"
  - "order-sensitive comparison (same values in the same order)"
optimal_complexity: {time: "O(n^2)", space: "O(n^2)"}
rubric:
  excellent: "Starts from the O(n^3) comparison, then hashes each row into a count map and looks up each column, handling duplicates by adding counts; uses an unambiguous key (tuple or separator) and states O(n^2) time and space."
  good: "Correct hashing solution with a minor slip fixed after testing, such as storing a set instead of counts or building keys without separators."
  weak: "Stays at O(n^3) without discussing improvement, compares sorted values instead of ordered values, or counts each distinct row only once."
  criteria:
    correctness: "All tests pass, including duplicate rows and columns and the same values in a different order."
    efficiency: "Quadratic time by hashing rows; does not re-scan rows for each column."
    code_quality: "Separate, readable steps for counting rows and checking columns; keys built consistently."
    edge_cases: "1 x 1 grid, all-equal grid, no matches and multi-digit values that could collide without a separator."
    communication: "Explains why counts (not a set) are needed and how keys avoid collisions such as 1,12 versus 11,2."
hints:
  - "Comparing every row with every column element by element is cubic; can you summarise a whole row as a single value you can look up?"
  - "Store each row as a hashable key in a map, remembering how many times each identical row appears."
  - "Build a count map from row keys (a tuple, or values joined with a separator), then for each column build the same kind of key from top to bottom and add the stored count for that key to the answer."
followups:
  - "Why is a separator needed if you turn rows into strings?"
  - "How would you adapt this for an m x n grid comparing rows of one matrix with columns of another?"
  - "What if the matrix were too large to hold every row key in memory at once?"
  - "Could a rolling hash reduce memory, and what would you do about collisions?"
common_errors:
  - "Using a set of rows instead of counts, so duplicate rows are counted once."
  - "Concatenating numbers without a separator, so [1, 12] and [11, 2] collide."
  - "Sorting rows and columns before comparing, which ignores order."
  - "Using a mutable list as a dictionary key in Python or an array as a Map key in JavaScript (compares by reference)."
