title: "Error Code Counts in Log Ranges"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, backend, support_engineer]
time_limit_minutes: 20
prompt_markdown: |
  ## Error Code Counts in Log Ranges

  During an incident review you have the error log of a gateway as an array `codes`, where `codes[i]` is
  the status code of the `i`-th failed request in time order. Responders then ask many questions of the
  form `[l, r, code]`: *how many times does `code` appear among positions `l` to `r`, inclusive
  (0-based)?*

  Return an array with one answer per query, **in the same order as `queries`**. A code that never appears
  in the range has a count of `0`. There can be many queries, so answering each one by scanning the range
  is too slow.

  ### Example 1
  ```
  Input:  codes = [500, 404, 500, 503, 500, 404], queries = [[0, 5, 500], [1, 3, 404], [2, 2, 503]]
  Output: [3, 1, 0]
  Explanation: 500 appears at positions 0, 2 and 4. Positions 1..3 contain 404 once. Position 2 holds
               500, not 503.
  ```

  ### Example 2
  ```
  Input:  codes = [429, 429], queries = [[0, 1, 429], [1, 1, 429], [0, 1, 500]]
  Output: [2, 1, 0]
  ```

  ### Constraints
  - `1 <= codes.length <= 10^5`
  - `0 <= queries.length <= 10^5`
  - `queries[i] = [l, r, code]` with `0 <= l <= r < codes.length`
  - `0 <= codes[i], code <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: frequency_in_ranges
  params:
    - {name: codes, type: "int[]"}
    - {name: queries, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left, bisect_right


    def frequency_in_ranges(codes: list[int], queries: list[list[int]]) -> list[int]:
        positions: dict[int, list[int]] = {}
        for index, code in enumerate(codes):
            positions.setdefault(code, []).append(index)  # indices are appended in sorted order
        answers = []
        for left, right, code in queries:
            where = positions.get(code)
            if not where:
                answers.append(0)
                continue
            answers.append(bisect_right(where, right) - bisect_left(where, left))
        return answers
  javascript: |
    function frequencyInRanges(codes, queries) {
      const positions = new Map();
      codes.forEach((code, index) => {
        if (!positions.has(code)) positions.set(code, []);
        positions.get(code).push(index);
      });
      // First index in arr whose value is >= target (or > target when strict).
      const bound = (arr, target, strict) => {
        let lo = 0;
        let hi = arr.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (arr[mid] < target || (strict && arr[mid] === target)) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      return queries.map(([left, right, code]) => {
        const where = positions.get(code);
        if (!where) return 0;
        return bound(where, right, true) - bound(where, left, false);
      });
    }
