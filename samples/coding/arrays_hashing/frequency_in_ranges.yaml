expected_concepts:
  - "preprocess a map from code to its sorted list of positions"
  - "binary search for the first position >= l and the first position > r"
  - "O(log n) per query after O(n) preprocessing"
  - "inclusive range bounds and missing codes"
optimal_complexity: {time: "O(n + q log n)", space: "O(n)"}
rubric:
  excellent: "Identifies that per-query scans are O(n q), builds per-code sorted position lists in one pass, answers each query with lower and upper bound searches, handles missing codes and inclusive bounds, and states O(n + q log n)."
  good: "Correct position-list solution with a small off-by-one fixed after testing, or a correct alternative such as per-code prefix counts with a clear memory discussion."
  weak: "Scans the range for every query, or uses a per-code prefix array for every distinct code with no memory consideration, or gets inclusive bounds wrong."
  criteria:
    correctness: "All tests pass, including absent codes, single-element ranges and duplicate queries."
    efficiency: "Linear preprocessing and logarithmic work per query."
    code_quality: "Uses the standard library bisect where available or a clearly written bound helper; answers kept in query order."
    edge_cases: "Empty query list, code never present, ranges touching occurrences at either end."
    communication: "Explains why the position lists are already sorted and which bound is inclusive."
hints:
  - "Scanning each range is fine for one query but not for a hundred thousand; what could you precompute once about where each code occurs?"
  - "If you know every position where a code occurs, in increasing order, the count inside a range is the number of those positions between l and r."
  - "Build a map from code to the list of its indices (appending while walking the log keeps each list sorted), then for each query binary search for the first index at least l and the first index greater than r and subtract the two."
followups:
  - "How would you support appending new log entries while still answering queries?"
  - "When would per-code prefix counts be better than binary search, and what does that cost in memory?"
  - "How would you answer 'which code is most frequent in l..r' instead?"
  - "What changes if queries arrive offline and can be processed in any order?"
common_errors:
  - "Off-by-one bounds: using the lower bound of r instead of the upper bound, which misses an occurrence exactly at r."
  - "Scanning the range for each query, which is O(n q)."
  - "Failing on a code that does not appear in the log at all (missing key)."
  - "Returning answers in a sorted or grouped order instead of query order."
