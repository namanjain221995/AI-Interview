slug: three_maintenance_windows
title: Three Non-Overlapping Maintenance Windows
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Three Non-Overlapping Maintenance Windows

  Your SRE team runs failover drills by draining live traffic from the primary cluster onto the standby
  cluster for a fixed number of hours. A drill is only useful if the standby carries real traffic, so the
  team wants the drills to move as much traffic as possible.

  You are given `load`, where `load[i]` is the forecast traffic (in thousands of requests) that would be
  moved to the standby during hour `i`, and an integer `k`, the length of every drill in hours. Schedule
  **exactly three** drills. A drill starting at hour `s` covers hours `s, s + 1, ..., s + k - 1`, and the
  three drills must not share any hour (they may be back to back).

  Return the three start hours **in ascending order** that maximise the total load covered by the three
  drills. If several schedules reach the same maximum total, return the **lexicographically smallest**
  one (compare the first start, then the second, then the third).

  ### Example 1
  ```
  Input:  load = [4, 1, 4, 6, 2, 7, 5, 1], k = 2
  Output: [0, 2, 5]
  Explanation: the drills cover hours 0-1 (5), 2-3 (10) and 5-6 (12) for a total of 27.
  ```

  ### Example 2
  ```
  Input:  load = [3, 3, 3, 3, 3, 3, 3], k = 2
  Output: [0, 2, 4]
  Explanation: every schedule totals 18; [0, 2, 4] is the lexicographically smallest.
  ```

  ### Example 3
  ```
  Input:  load = [0, 9, 0, 0, 9, 9, 0, 9, 0], k = 1
  Output: [1, 4, 5]
  Explanation: four hours carry 9; the earliest three are chosen.
  ```

  ### Constraints
  - `1 <= k`
  - `3 * k <= load.length <= 2 * 10^4`
  - `0 <= load[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: three_maintenance_windows
  params:
    - {name: load, type: "int[]"}
    - {name: k, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def three_maintenance_windows(load: list[int], k: int) -> list[int]:
        n = len(load)
        m = n - k + 1
        window = [0] * m
        total = sum(load[:k])
        window[0] = total
        for s in range(1, m):
            total += load[s + k - 1] - load[s - 1]
            window[s] = total
        left = [0] * m
        best = 0
        for s in range(m):
            if window[s] > window[best]:
                best = s
            left[s] = best
        right = [0] * m
        best = m - 1
        for s in range(m - 1, -1, -1):
            if window[s] >= window[best]:
                best = s
            right[s] = best
        answer: list[int] = []
        best_total = -1
        for mid in range(k, m - k):
            a, c = left[mid - k], right[mid + k]
            candidate = window[a] + window[mid] + window[c]
            if candidate > best_total:
                best_total = candidate
                answer = [a, mid, c]
        return answer
  javascript: |
    function threeMaintenanceWindows(load, k) {
      const n = load.length;
      const m = n - k + 1;
      const windowSum = new Array(m).fill(0);
      let total = 0;
      for (let i = 0; i < k; i++) total += load[i];
      windowSum[0] = total;
      for (let s = 1; s < m; s++) {
        total += load[s + k - 1] - load[s - 1];
        windowSum[s] = total;
      }
      const left = new Array(m).fill(0);
      let best = 0;
      for (let s = 0; s < m; s++) {
        if (windowSum[s] > windowSum[best]) best = s;
        left[s] = best;
      }
      const right = new Array(m).fill(0);
      best = m - 1;
      for (let s = m - 1; s >= 0; s--) {
        if (windowSum[s] >= windowSum[best]) best = s;
        right[s] = best;
      }
      let answer = [];
      let bestTotal = -1;
      for (let mid = k; mid < m - k; mid++) {
        const a = left[mid - k];
        const c = right[mid + k];
        const candidate = windowSum[a] + windowSum[mid] + windowSum[c];
        if (candidate > bestTotal) {
          bestTotal = candidate;
          answer = [a, mid, c];
        }
      }
      return answer;
    }
