expected_concepts:
  - "sliding window sums for every start position"
  - "prefix best (left) and suffix best (right) arrays"
  - "fixing the middle window and combining the best left and right windows"
  - "tie-breaking towards the earliest index on both sides"
  - "why greedily taking the best single window first fails"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Computes all window sums in O(n), builds best-left and best-right index arrays with correct tie-breaking, iterates over the middle window and explains why the result is the lexicographically smallest optimum."
  good: "Reaches the O(n) left/middle/right structure or an equivalent dynamic programme, possibly needing a nudge on tie-breaking or on index bounds for the middle window."
  weak: "Uses a greedy choice of the largest window first, an O(n^3) enumeration of all triples, or returns sums instead of start indices."
  criteria:
    correctness: "All tests pass, including exact tiling (n equals 3k), all-equal loads and the greedy trap."
    efficiency: "Linear time after the window sums; no nested loops over window positions."
    code_quality: "Separate, well-named arrays for window sums and best left and right positions; index arithmetic is easy to follow."
    edge_cases: "Handles k equal to 1, n exactly 3k, all-zero loads and many tied schedules."
    communication: "Explains why fixing the middle drill decouples the problem and how the comparison operators produce the earliest tie."
hints:
  - "Start by computing the total load of every possible k-hour drill so each window can be looked up in constant time."
  - "If you fix where the middle drill starts, the left drill and the right drill can be chosen independently from the windows that end before it and start after it."
  - "Precompute, for each position, the index of the best window starting at or before it (keep the earliest on ties) and the best window starting at or after it (also earliest on ties), then try every middle start and keep a strictly better total only."
followups:
  - "How would you generalise the solution to m drills instead of exactly three?"
  - "What changes if drills must be separated by at least one idle hour?"
  - "How would you return the maximum total instead of the start hours, and does the tie-break still matter?"
  - "If the drills could have different lengths, how would the precomputation change?"
common_errors:
  - "Greedily taking the best single window first, which can block a better combination."
  - "Using the wrong comparison when scanning from the right, so ties pick a later start than necessary."
  - "Off-by-one bounds for the middle window that allow the drills to overlap or skip valid schedules."
  - "Recomputing each window sum from scratch, which turns the solution quadratic."
