title: "Throttle Duplicate Timestamps"
difficulty: easy
competency_keys: [algorithms, code_quality, problem_solving]
role_tags: [backend, sre, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Throttle Duplicate Timestamps

  An ingestion agent receives event timestamps (whole seconds, measured as offsets from a reference
  instant, so they may be negative) that are already sorted in **non-decreasing** order. To protect a
  downstream service, a throttle forwards **at most `k` events per distinct timestamp** and drops the
  rest.

  Given `timestamps` and `k`, return the timestamps that the throttle forwards.

  - When a timestamp occurs more than `k` times, the **first `k`** occurrences are kept.
  - The result keeps the original relative order, so it is still sorted in non-decreasing order.
  - An empty input produces an empty result.

  ### Example 1
  ```
  Input:  timestamps = [1700, 1700, 1700, 1701, 1705, 1705], k = 2
  Output: [1700, 1700, 1701, 1705, 1705]
  Explanation: the third copy of 1700 is dropped; 1701 and both copies of 1705 are kept
  ```

  ### Example 2
  ```
  Input:  timestamps = [42, 42, 42, 42], k = 1
  Output: [42]
  ```

  ### Example 3
  ```
  Input:  timestamps = [3, 8, 8, 9], k = 3
  Output: [3, 8, 8, 9]
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `-10^9 <= timestamps[i] <= 10^9`
  - `timestamps` is sorted in non-decreasing order
  - `1 <= k <= 10^5`

  **Follow-up:** can you compact the timestamps in place using only `O(1)` extra memory, then return the
  kept prefix?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: keep_at_most_k_sorted
  params:
    - {name: timestamps, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def keep_at_most_k_sorted(timestamps: list[int], k: int) -> list[int]:
        kept = list(timestamps)
        write = 0
        for read in range(len(kept)):
            value = kept[read]
            # Sorted input: the value k slots behind the write position is the
            # oldest kept copy that could equal this one.
            if write < k or kept[write - k] != value:
                kept[write] = value
                write += 1
        return kept[:write]
  javascript: |
    function keepAtMostKSorted(timestamps, k) {
      const kept = timestamps.slice();
      let write = 0;
      for (let read = 0; read < kept.length; read++) {
        const value = kept[read];
        if (write < k || kept[write - k] !== value) {
          kept[write] = value;
          write++;
        }
      }
      return kept.slice(0, write);
    }
