expected_concepts:
  - "using sortedness so equal values are adjacent"
  - "read and write pointers over the same array"
  - "comparing with the element k positions behind the write pointer"
  - "O(n) time with O(1) extra space"
optimal_complexity: {time: "O(n)", space: "O(1) extra (in place)"}
rubric:
  excellent: "Uses a single pass with a write pointer, compares against the element k slots behind it (or a run counter), keeps the first k copies, handles k larger than every run and explains O(n) time and O(1) extra space."
  good: "Produces a correct linear solution using a run counter or a new output list, with minor prompting on the in-place follow-up."
  weak: "Uses a hash map of counts that ignores the sorted order, removes elements from the middle of a list in a loop (quadratic), or keeps the wrong copies."
  criteria:
    correctness: "All tests pass, including k larger than every run and runs of exactly k."
    efficiency: "One linear pass; no repeated deletions from the middle of an array."
    code_quality: "Clear read and write pointer names and no special-case clutter for the first element."
    edge_cases: "Empty input, a single element, negative timestamps and k equal to 1."
    communication: "Explains why sortedness lets the check look only k slots back."
hints:
  - "Equal timestamps sit next to each other, so you only need to know how many copies of the current value you have already kept."
  - "Instead of keeping a counter, compare each incoming value with the value that sits k positions before the end of the part you have already kept."
  - "Keep a write position that starts at zero; for each value, copy it to the write position and advance only if fewer than k values have been kept so far or the kept value k positions back differs from it, then return everything before the write position."
followups:
  - "How would you do this in place in a language with fixed-size arrays, returning only the new length?"
  - "What changes if the timestamps are not sorted?"
  - "How would you throttle per sliding window of w seconds instead of per exact timestamp?"
  - "How would you apply the same throttle to an unbounded stream?"
common_errors:
  - "Reading the element k positions back before at least k values have been kept, which goes out of bounds."
  - "Looking k - 1 positions back instead of k, which keeps one copy too few of every long run."
  - "Deleting elements from the middle of a list inside the loop, which is quadratic and skips elements."
  - "Resetting a run counter incorrectly so the first element of each new run is lost."
