title: Windows With a Given Median Severity
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, data_scientist, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Windows With a Given Median Severity

  An incident tracker lists `n` incidents in the order they were opened. Each incident has a severity rank,
  and `severities` is a **permutation of `1..n`** (every rank appears exactly once).

  For a contiguous window of incidents, sort its ranks in ascending order; the window's **median** is the
  middle element. For an even-length window, the median is the **left** of the two middle elements (the
  smaller one).

  Return the **number of non-empty contiguous windows** whose median equals `k`. Return the count as a
  64-bit integer.

  ### Example 1
  ```
  Input:  severities = [2, 5, 3, 1, 4], k = 3
  Output: 7
  ```

  ### Example 2
  ```
  Input:  severities = [4, 1, 2, 3], k = 2
  Output: 5
  Explanation: The windows are [2], [2, 3], [1, 2, 3], [4, 1, 2] and [4, 1, 2, 3]. [1, 2] does not count:
               its left-middle element after sorting is 1.
  ```

  ### Constraints
  - `1 <= n == severities.length <= 2 * 10^5`
  - `severities` is a permutation of `1..n`
  - `1 <= k <= n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_windows_with_median_severity
  params:
    - {name: severities, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_windows_with_median_severity(severities: list[int], k: int) -> int:
        pivot = severities.index(k)  # every qualifying window must contain k
        # balance = (# values greater than k) - (# values smaller than k)
        left_balances: dict[int, int] = {0: 1}  # empty left extension
        balance = 0
        for i in range(pivot - 1, -1, -1):
            balance += 1 if severities[i] > k else -1
            left_balances[balance] = left_balances.get(balance, 0) + 1
        total = 0
        balance = 0
        for j in range(pivot, len(severities)):
            if j > pivot:
                balance += 1 if severities[j] > k else -1
            # odd length needs total balance 0; even length (left-middle median) needs total balance 1
            total += left_balances.get(-balance, 0) + left_balances.get(1 - balance, 0)
        return total
  javascript: |
    function countWindowsWithMedianSeverity(severities, k) {
      const pivot = severities.indexOf(k);
      const leftBalances = new Map([[0, 1]]);
      let balance = 0;
      for (let i = pivot - 1; i >= 0; i--) {
        balance += severities[i] > k ? 1 : -1;
        leftBalances.set(balance, (leftBalances.get(balance) || 0) + 1);
      }
      let total = 0;
      balance = 0;
      for (let j = pivot; j < severities.length; j++) {
        if (j > pivot) balance += severities[j] > k ? 1 : -1;
        total += (leftBalances.get(-balance) || 0) + (leftBalances.get(1 - balance) || 0);
      }
      return total;
    }
