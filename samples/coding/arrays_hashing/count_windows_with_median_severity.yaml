expected_concepts:
  - every qualifying window contains the position of k
  - mapping values to +1 (greater than k) and -1 (smaller than k)
  - balance 0 for odd length and balance 1 for even length (left-middle median)
  - counting left-side balances in a hash map and matching right-side balances
  - "64-bit count"
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Notes that windows must contain k, converts the problem to balances of greater-minus-smaller counts, derives that the total balance must be 0 or 1 under the left-middle rule, counts left balances in a map and matches right extensions in O(n), returning a 64-bit count.
  good: Correct balance idea with prompting on the even-length rule (balance 1 rather than -1) or a minor off-by-one around the pivot.
  weak: Sorts every window or maintains a sorted structure per window (O(n^2 log n) or worse), or uses the wrong even-length median.
  criteria:
    correctness: All tests pass, including k at either end, ascending and descending orders.
    efficiency: Linear time with a hash map (or array offset by n) of balances.
    code_quality: Left and right sweeps are clearly separated; the balance target is explained in a comment.
    edge_cases: Single element, k = 1, k = n and very large counts.
    communication: Explains why only the comparison with k matters, not the exact values.
hints:
  - Which incident must every qualifying window contain? And do the exact values of the other ranks matter, or only whether they are above or below k?
  - Replace ranks greater than k by plus one and smaller ranks by minus one. For k to be the median, how must the number of larger ranks compare with the number of smaller ranks in odd and in even windows?
  - The total of the plus and minus ones must be 0 for an odd window and 1 for an even window. Sweep left from k's position recording how often each partial total occurs (including the empty extension), then sweep right from k's position and, for each right total, add the counts of the left totals that bring the sum to 0 or to 1.
followups:
  - What changes if the median of an even window is the right-middle element instead?
  - How would you handle duplicate ranks (not a permutation)?
  - How would you count windows whose median is at least k?
  - Can the balance counts be stored in an array instead of a hash map?
common_errors:
  - Using balance -1 instead of +1 for even-length windows, which corresponds to the right-middle median.
  - Forgetting the empty left extension, which misses windows that start at k.
  - Counting windows that do not contain k.
  - Returning the count in a 32-bit integer when n is large.
