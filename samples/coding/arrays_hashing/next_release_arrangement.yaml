expected_concepts: [find the rightmost ascent (pivot), swap with the rightmost strictly greater element in the suffix, reverse the non-increasing suffix, wrap-around when no pivot exists, handling duplicates with non-strict comparisons, O(n) time and O(1) extra space]
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Explains why the longest non-increasing suffix cannot be increased on its own, finds the pivot, swaps it with the rightmost strictly greater id, reverses the suffix instead of sorting it, handles duplicates and the wrap-around, and states O(n) time with O(1) space.
  good: Correct algorithm with a minor fix needed for duplicates or the wrap-around case, or sorts the suffix instead of reversing it.
  weak: Generates permutations, uses strict comparisons that break on duplicates, or returns the input unchanged when the arrangement is already the greatest.
  criteria: {correctness: 'All tests pass, including duplicates, single elements and the greatest arrangement.', efficiency: Linear time with constant extra space; no permutation generation and no full sort., code_quality: 'The three steps (find pivot, swap, reverse) are clearly separated and named.', edge_cases: 'Single id, all equal ids, already greatest arrangement and duplicates on both sides of the pivot.', communication: Explains why reversing the suffix yields its smallest ordering after the swap.}
hints: ['Look at the arrangement from the right end. Which part of it is already as large as it can possibly be on its own?', 'Find the rightmost position whose id is smaller than the id right after it; everything to its right never increases. That position must grow by the smallest possible amount, and the part after it must become as small as possible.', 'If no such position exists, reverse the whole list to get the ascending arrangement. Otherwise scan from the right for the first id strictly greater than the one at that position, swap the two, and then reverse everything after the position, which is still in non-increasing order, so it becomes ascending in linear time.']
followups: ['How would you compute the previous arrangement instead of the next one?', 'How would you jump k arrangements ahead without stepping one at a time?', 'How many distinct arrangements exist for a multiset of ids, and how would you compute the rank of a given one?', 'Why does the swap keep the suffix in non-increasing order?']
common_errors: ['Stopping the pivot search at a pair of equal neighbours (a strict comparison where a non-strict one is needed), which picks a pivot with no strictly greater id to its right and either returns a wrong arrangement or runs off the start of the list.', Swapping with the first larger id found from the left instead of the rightmost strictly greater id., 'Sorting the suffix with a library sort instead of reversing it, which is correct but slower than necessary.', Forgetting the wrap-around case and returning the input unchanged when it is already the greatest arrangement.]
