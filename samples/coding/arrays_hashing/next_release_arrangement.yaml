time_limit_minutes: 25
prompt_markdown: |
  ## Next Release Train Arrangement

  A release train ships components in a fixed sequence, written as a list of component ids `order`.
  Ids may repeat because some components ship in several stages. To test every possible sequence
  exactly once, the release tooling enumerates all distinct arrangements of the same ids in
  **lexicographic order** (compare position by position; the first position that differs decides).

  Given the current arrangement, return the **next** arrangement in that enumeration: the smallest
  arrangement of the same multiset of ids that is strictly greater than `order`. If `order` is already
  the greatest arrangement, wrap around and return the **smallest** one (all ids in ascending order).

  The intended solution rearranges `order` **in place** with `O(1)` extra space; you may return the
  modified list. Generating all arrangements is not feasible.

  ### Example 1
  ```
  Input:  order = [3, 1, 4, 2]
  Output: [3, 2, 1, 4]
  ```

  ### Example 2
  ```
  Input:  order = [5, 4, 2, 2]
  Output: [2, 2, 4, 5]
  ```

  ### Example 3
  ```
  Input:  order = [1, 3, 3]
  Output: [3, 1, 3]
  ```

  ### Constraints
  - `1 <= order.length <= 100`
  - `0 <= order[i] <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: next_release_arrangement
  params:
    - {name: order, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def next_release_arrangement(order: list[int]) -> list[int]:
        n = len(order)
        pivot = n - 2
        while pivot >= 0 and order[pivot] >= order[pivot + 1]:
            pivot -= 1  # suffix after pivot is non-increasing
        if pivot >= 0:
            swap = n - 1
            while order[swap] <= order[pivot]:
                swap -= 1  # rightmost id strictly greater than the pivot
            order[pivot], order[swap] = order[swap], order[pivot]
        left, right = pivot + 1, n - 1
        while left < right:  # reverse the suffix to make it as small as possible
            order[left], order[right] = order[right], order[left]
            left += 1
            right -= 1
        return order
  javascript: |
    function nextReleaseArrangement(order) {
      const n = order.length;
      let pivot = n - 2;
      while (pivot >= 0 && order[pivot] >= order[pivot + 1]) pivot -= 1; // suffix is non-increasing
      if (pivot >= 0) {
        let swap = n - 1;
        while (order[swap] <= order[pivot]) swap -= 1; // rightmost id strictly greater than the pivot
        [order[pivot], order[swap]] = [order[swap], order[pivot]];
      }
      let left = pivot + 1;
      let right = n - 1;
      while (left < right) { // reverse the suffix to make it as small as possible
        [order[left], order[right]] = [order[right], order[left]];
        left += 1;
        right -= 1;
      }
      return order;
    }
