expected_concepts:
  - "expected sum (Gauss formula) minus actual sum, or XOR of indices and values"
  - "range [0, n] where n is the array length"
  - "O(1) extra memory without sorting"
  - "missing value at either end of the range"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Identifies the range as [0, n], uses the arithmetic-series sum or XOR for O(n) time and O(1) memory, discusses overflow of the sum approach in fixed-width languages and why XOR avoids it, and checks both ends of the range."
  good: "Correct hash-set or sorting solution with an explanation, or the sum formula without discussing overflow."
  weak: "Forgets that n itself can be missing, sorts and scans with off-by-one errors, or uses nested loops."
  criteria:
    correctness: "All tests pass, including 0 missing and n missing."
    efficiency: "Linear time and constant extra memory for the best solutions; a set is acceptable but noted as O(n) memory."
    code_quality: "Concise loop, no mutation of the caller's array, clear variable names."
    edge_cases: "Empty array, missing 0, missing n and unordered input."
    communication: "Explains the invariant behind the sum or XOR trick."
hints:
  - "You know exactly which numbers should be present. What single summary of a set of numbers would change if one of them were removed?"
  - "Compare a quantity computed from the full range 0 to n with the same quantity computed from the export; the difference reveals the missing value."
  - "Compute the sum of 0 through n with the arithmetic-series formula and subtract the sum of the export, or XOR every index, every value and n together so that each present number cancels out; whatever remains is the missing ticket."
followups:
  - "In Java or C++, when could the sum-based approach overflow, and how does XOR avoid it?"
  - "How would you find two missing numbers with O(1) extra memory?"
  - "What if the export could also contain a duplicate ticket?"
  - "If the export were sorted, how fast could you find the gap?"
common_errors:
  - "Assuming the range is 1 to n, which misses the case where 0 is absent."
  - "Sorting and checking neighbours but forgetting the case where n is missing."
  - "Using an O(n^2) search for each candidate number."
  - "Mutating the input array when the caller may still need it."
