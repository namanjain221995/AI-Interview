version: 1
slug: missing_ticket_number
title: The Missing Support Ticket
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [support_engineer, qa, general]
time_limit_minutes: 12
prompt_markdown: |
  ## The Missing Support Ticket

  A help-desk queue numbers its tickets `0, 1, 2, ..., n`. A nightly export should contain every one of
  those `n + 1` numbers, but an audit found that each export holds only `n` **distinct** numbers, in no
  particular order: exactly one ticket number is missing.

  Given the exported `tickets` (so `n = tickets.length`), return the ticket number in the range
  `[0, n]` that does not appear.

  ### Example 1
  ```
  Input:  tickets = [4, 2, 0, 1]
  Output: 3
  Explanation: The numbers 0 to 4 should be present; 3 is the one that is absent.
  ```

  ### Example 2
  ```
  Input:  tickets = [1]
  Output: 0
  Explanation: With n = 1 the range is [0, 1], and 0 is missing.
  ```

  ### Example 3
  ```
  Input:  tickets = [0, 1, 2]
  Output: 3
  Explanation: The range is [0, 3]; the top value n itself is missing.
  ```

  ### Constraints
  - `0 <= tickets.length <= 10^5`
  - `0 <= tickets[i] <= tickets.length`
  - All values in `tickets` are distinct, so exactly one number in `[0, n]` is missing.

  **Follow-up:** Can you find the missing number in O(n) time using only O(1) extra memory and without modifying the input?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: missing_ticket_number
  params:
    - {name: tickets, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def missing_ticket_number(tickets: list[int]) -> int:
        n = len(tickets)
        missing = n
        for index, ticket in enumerate(tickets):
            missing ^= index ^ ticket
        return missing
  javascript: |
    function missingTicketNumber(tickets) {
      const n = tickets.length;
      let expected = (n * (n + 1)) / 2;
      for (const t of tickets) expected -= t;
      return expected;
    }
