expected_concepts:
  - map outcomes to +1 and -1
  - running balance (prefix sum)
  - equal balance at two indices means a balanced window between them
  - hash map storing the earliest index for each balance
  - seeding balance 0 at index -1
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Recasts the task as a running balance of +1 and -1, stores the first index of each balance with zero at index -1, never overwrites earlier indices, and explains O(n) time and space.
  good: Correct prefix-balance solution after a fix such as seeding zero or keeping the earliest index, or a clear O(n^2) solution improved with guidance.
  weak: Only checks windows of fixed length, uses O(n^2) or worse without improvement, or updates the stored index to the latest occurrence.
  criteria:
    correctness: All tests pass, including fully balanced histories and inputs with no balanced window.
    efficiency: Single pass with a hash map or an array offset by n.
    code_quality: The balance variable and first-seen map are clearly named; no redundant passes.
    edge_cases: Single run, all one outcome, balanced prefix starting at index 0.
    communication: Explains why equal balances bound a window with equal counts.
hints:
  - What happens if you treat a failure as minus one and a success as plus one?
  - With that mapping, a window is balanced exactly when the running balance is the same just before its start and at its end; which earlier position gives the longest window?
  - Track the running balance and a hash map from each balance to the first index where it occurred, seeded with balance zero at index minus one; when a balance repeats, measure the distance to its first index and keep the maximum, and never overwrite a stored index.
followups:
  - How would you return the start and end of the window, choosing the earliest one on ties?
  - How could you replace the hash map with an array?
  - What changes if outcomes have three states, such as success, failure and skipped, and you want successes to equal failures?
common_errors:
  - Forgetting to seed balance zero at index minus one, which misses windows that start at the first run.
  - Overwriting the stored index with the latest occurrence, which shortens the windows found.
  - Counting zeros and ones separately for every window, leading to O(n^2) time.
