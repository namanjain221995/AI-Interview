time_limit_minutes: 20
prompt_markdown: |
  ## Longest Balanced Pass/Fail Window

  A CI dashboard keeps the history of a flaky pipeline as `outcomes`, where `1` is a successful run and
  `0` is a failed run, oldest first. The team wants to find the longest stretch of consecutive runs in
  which successes and failures occurred **equally often**.

  Return the length of the longest contiguous window that contains as many `1`s as `0`s. If no such
  window exists, return `0`.

  ### Example 1
  ```
  Input:  outcomes = [1, 0, 1, 1, 0, 0, 1]
  Output: 6
  Explanation: the first six runs contain three successes and three failures.
  ```

  ### Example 2
  ```
  Input:  outcomes = [1, 1, 1]
  Output: 0
  Explanation: there are no failures, so no window is balanced.
  ```

  ### Example 3
  ```
  Input:  outcomes = [0, 0, 1, 0, 1, 1, 1, 0, 0]
  Output: 8
  ```

  ### Constraints
  - `1 <= outcomes.length <= 10^5`
  - `outcomes[i]` is `0` or `1`

  **Follow-up:** can you do it in a single pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_balanced_outcome_window
  params:
    - {name: outcomes, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def longest_balanced_outcome_window(outcomes: list[int]) -> int:
        first_seen: dict[int, int] = {0: -1}  # balance -> earliest index where it occurred
        balance = 0
        best = 0
        for i, outcome in enumerate(outcomes):
            balance += 1 if outcome == 1 else -1
            if balance in first_seen:
                best = max(best, i - first_seen[balance])
            else:
                first_seen[balance] = i
        return best
  javascript: |
    function longestBalancedOutcomeWindow(outcomes) {
      const firstSeen = new Map([[0, -1]]); // balance -> earliest index where it occurred
      let balance = 0;
      let best = 0;
      for (let i = 0; i < outcomes.length; i++) {
        balance += outcomes[i] === 1 ? 1 : -1;
        if (firstSeen.has(balance)) best = Math.max(best, i - firstSeen.get(balance));
        else firstSeen.set(balance, i);
      }
      return best;
    }
