expected_concepts:
  - "the final block has length n, so it spans max minus min equal to n minus 1"
  - "duplicates can never all be kept, so work with distinct values"
  - "sorting the distinct ids"
  - "two-pointer sliding window over distinct values bounded by value range"
  - "answer is n minus the most ids that can stay"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Reframes the task as keeping the most servers, dedupes and sorts the ids, runs a two-pointer window whose value span is at most n minus 1, and explains why it is enough to start the block at an existing id."
  good: "Uses sorting with binary search per start value or a two-pointer window, possibly fixing duplicate handling or the window bound after a failing test."
  weak: "Tries every possible starting value across the full id range, ignores duplicates, or uses the number of distinct values in the window as n instead of the original count."
  criteria:
    correctness: "All tests pass, including all-duplicate input, far-apart ids and mixed clusters."
    efficiency: "Sorting dominates; the window is linear because both pointers only move forward."
    code_quality: "Keeps the original n separate from the number of distinct ids, with clear pointer names."
    edge_cases: "Single server, all equal ids, ids near the upper bound and gaps larger than n."
    communication: "Explains why the best block can be assumed to start at one of the kept ids."
hints:
  - "Instead of counting changes directly, ask how many servers can keep their current id."
  - "Servers that share an id cannot all keep it, and in the best block the smallest kept id can be assumed to be its first value, so only distinct sorted ids matter."
  - "Sort the distinct ids and slide a window where the right pointer advances while its id is at most the left id plus n minus 1; the widest window is the most ids you can keep, and the answer is n minus that width."
followups:
  - "How would the answer change if a reassignment could only move an id to an unused value?"
  - "How would you report which servers to reassign and to which ids?"
  - "What if the target block had to start at a fixed value?"
  - "How would you maintain the answer as servers join and leave the cluster?"
common_errors:
  - "Forgetting to remove duplicates before the window, so repeated ids are counted as kept."
  - "Using the number of distinct ids instead of n for the width of the target block."
  - "Iterating over every possible start value in the full id range, which is far too slow."
  - "Off-by-one in the window bound, allowing a block of n plus one values."
