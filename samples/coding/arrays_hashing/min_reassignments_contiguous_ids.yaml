title: Fewest Reassignments for a Contiguous ID Block
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, platform, dba]
time_limit_minutes: 30
prompt_markdown: |
  ## Fewest Reassignments for a Contiguous ID Block

  A storage cluster of `n` servers is being moved to a new placement scheme that requires the server
  ids to be **n distinct consecutive integers** (for example `40, 41, 42, 43` for four servers; the
  starting value is up to you). Today some servers share an id after a botched migration, and others
  have ids far from the rest.

  One reassignment changes a single server's id to **any** integer. Given the current `ids`, return the
  **minimum number of reassignments** needed so that the ids form a block of `n` distinct consecutive
  integers.

  ### Example 1
  ```
  Input:  ids = [14, 12, 15, 13]
  Output: 0
  Explanation: the ids are already 12, 13, 14, 15.
  ```

  ### Example 2
  ```
  Input:  ids = [101, 102, 103, 105, 106]
  Output: 1
  Explanation: change 106 to 104 to get 101..105.
  ```

  ### Example 3
  ```
  Input:  ids = [7, 7, 7, 8]
  Output: 2
  Explanation: keep one 7 and the 8, then change the other two 7s to 9 and 10 (or 5 and 6).
  ```

  ### Constraints
  - `1 <= ids.length <= 10^5`
  - `1 <= ids[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_reassignments_contiguous_ids
  params:
    - {name: ids, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_reassignments_contiguous_ids(ids: list[int]) -> int:
        n = len(ids)
        distinct = sorted(set(ids))
        best = 0
        right = 0
        for left in range(len(distinct)):
            while right < len(distinct) and distinct[right] <= distinct[left] + n - 1:
                right += 1
            best = max(best, right - left)
        return n - best
  javascript: |
    function minReassignmentsContiguousIds(ids) {
      const n = ids.length;
      const distinct = Array.from(new Set(ids)).sort((a, b) => a - b);
      let best = 0;
      let right = 0;
      for (let left = 0; left < distinct.length; left++) {
        while (right < distinct.length && distinct[right] <= distinct[left] + n - 1) right++;
        best = Math.max(best, right - left);
      }
      return n - best;
    }
