expected_concepts:
  - "frequency map of distinct values"
  - "special case for gap 0 using counts"
  - "counting by value to avoid double counting"
  - "O(n) average time versus O(n^2) pair scan"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Builds a frequency map, counts each distinct value whose partner value plus gap exists, treats gap 0 as values with count at least 2, avoids double counting and explains O(n) time and space (or a sort plus two-pointer alternative)."
  good: "Correct hash-based or sort-based solution that needs a nudge on the gap 0 case or on de-duplicating pairs."
  weak: "Counts index pairs instead of value pairs, double counts (a, b) and (b, a), or stays with an O(n^2) scan."
  criteria:
    correctness: "All tests pass, especially gap 0 and heavily duplicated prices."
    efficiency: "Linear expected time with a hash map, or O(n log n) with sorting."
    code_quality: "Separates the gap 0 branch clearly and keeps the counting loop simple."
    edge_cases: "Empty input, single price, identical prices and extreme values."
    communication: "States the counting rule (distinct value pairs) before coding and justifies the gap 0 rule."
hints:
  - "Because pairs are counted by value, duplicates matter only for one special case; think about what you need to know about each distinct price."
  - "With the set or counts of distinct prices, a positive gap means you can look up whether price plus gap exists, while a gap of zero depends on how often each price occurs."
  - "Build a map from each price to its count; for a positive gap count the distinct prices for which price plus gap is also a key, and for a zero gap count the prices whose count is at least two, looking only upward so no pair is counted twice."
followups:
  - "How would you solve it with sorting and two pointers, and what are the trade-offs?"
  - "How would you return the pairs themselves in ascending order?"
  - "What changes if the catalogue is too large for memory but sorted on disk?"
  - "How would you count pairs whose gap is at most a threshold instead of exactly equal?"
common_errors:
  - "Counting index pairs, so repeated prices inflate the answer."
  - "Looking both up and down for a partner, which counts every pair twice."
  - "Treating gap 0 like any other gap, so every single price is counted as a pair with itself."
  - "Using a nested loop over all pairs, which is quadratic on large catalogues."
