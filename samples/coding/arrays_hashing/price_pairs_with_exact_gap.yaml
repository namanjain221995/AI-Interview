prompt_markdown: |
  ## Price Points With an Exact Gap

  A pricing team is planning "upgrade" offers: for a given gap in cents, they want to know how many
  distinct pairs of price levels in the catalogue are exactly that far apart. The catalogue export
  `prices` lists the price (in cents) of every product, so the same price usually appears many times.

  Given `prices` and a non-negative integer `gap`, return the number of **distinct value pairs**
  `(a, b)` such that:

  - both `a` and `b` occur in `prices`,
  - `a <= b` and `b - a == gap`.

  Pairs are counted by **value**, not by position: a pair counts once no matter how many products share
  those prices. When `gap` is `0`, the pair `(a, a)` counts only if the price `a` occurs **at least twice**.
  Return `0` when no pair qualifies.

  ### Example 1
  ```
  Input:  prices = [1200, 1500, 900, 1200, 1800, 1500], gap = 300
  Output: 3
  Explanation: the distinct pairs are (900, 1200), (1200, 1500) and (1500, 1800)
  ```

  ### Example 2
  ```
  Input:  prices = [499, 799, 499, 799, 799, 999], gap = 0
  Output: 2
  Explanation: 499 and 799 each occur more than once; 999 occurs once
  ```

  ### Example 3
  ```
  Input:  prices = [100, 250, 400], gap = 100
  Output: 0
  ```

  ### Constraints
  - `0 <= prices.length <= 10^5`
  - `0 <= prices[i] <= 10^9`
  - `0 <= gap <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: price_pairs_with_exact_gap
  params:
    - {name: prices, type: "int[]"}
    - {name: gap, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def price_pairs_with_exact_gap(prices: list[int], gap: int) -> int:
        counts = Counter(prices)
        if gap == 0:
            return sum(1 for c in counts.values() if c >= 2)
        return sum(1 for value in counts if value + gap in counts)
  javascript: |
    function pricePairsWithExactGap(prices, gap) {
      const counts = new Map();
      for (const p of prices) counts.set(p, (counts.get(p) || 0) + 1);
      let pairs = 0;
      for (const [value, count] of counts) {
        if (gap === 0) {
          if (count >= 2) pairs++;
        } else if (counts.has(value + gap)) {
          pairs++;
        }
      }
      return pairs;
    }
