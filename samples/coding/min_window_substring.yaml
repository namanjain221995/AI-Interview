prompt_markdown: |
  ## Minimum Window Substring

  Given strings `s` and `t`, return the **shortest substring** of `s` that contains every character of
  `t` **including duplicates** (if `t` has two `a`s, the window needs at least two `a`s).

  - If no such window exists, return the empty string `""`.
  - If several windows have the same minimum length, return the **leftmost** one.
  - Matching is case-sensitive.

  ### Example 1
  ```
  Input:  s = "ADOBECODEBANC", t = "ABC"
  Output: "BANC"
  ```

  ### Example 2
  ```
  Input:  s = "a", t = "a"
  Output: "a"
  ```

  ### Example 3
  ```
  Input:  s = "a", t = "aa"
  Output: ""
  Explanation: s has only one 'a'
  ```

  ### Constraints
  - `0 <= s.length, t.length <= 10^5`
  - `s` and `t` consist of upper- and lower-case English letters.

  **Follow-up:** can you find an `O(m + n)` solution?
