  java: |
    class Solution {
        public String minWindow(String s, String t) {
            if (t.isEmpty() || t.length() > s.length()) return "";
            int[] need = new int[128];
            for (char ch : t.toCharArray()) need[ch]++;
            int missing = t.length();
            int left = 0;
            int bestStart = 0;
            int bestLen = Integer.MAX_VALUE;
            for (int right = 0; right < s.length(); right++) {
                char ch = s.charAt(right);
                if (need[ch] > 0) missing--;
                need[ch]--;
                while (missing == 0) {
                    if (right - left + 1 < bestLen) {
                        bestStart = left;
                        bestLen = right - left + 1;
                    }
                    char leftCh = s.charAt(left);
                    need[leftCh]++;
                    if (need[leftCh] > 0) missing++;
                    left++;
                }
            }
            return bestLen == Integer.MAX_VALUE ? "" : s.substring(bestStart, bestStart + bestLen);
        }
    }
  go: |
    package main

    func minWindow(s string, t string) string {
    	if len(t) == 0 || len(t) > len(s) {
    		return ""
    	}
    	var need [128]int
    	for i := 0; i < len(t); i++ {
    		need[t[i]]++
    	}
    	missing, left := len(t), 0
    	bestStart, bestLen := 0, len(s)+1
    	for right := 0; right < len(s); right++ {
    		if need[s[right]] > 0 {
    			missing--
    		}
    		need[s[right]]--
    		for missing == 0 {
    			if right-left+1 < bestLen {
    				bestStart, bestLen = left, right-left+1
    			}
    			need[s[left]]++
    			if need[s[left]] > 0 {
    				missing++
    			}
    			left++
    		}
    	}
    	if bestLen > len(s) {
    		return ""
    	}
    	return s[bestStart : bestStart+bestLen]
    }
  cpp: |
    #include <string>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        string minWindow(string s, string t) {
            if (t.empty() || t.size() > s.size()) return "";
            vector<int> need(128, 0);
            for (char ch : t) need[(unsigned char)ch]++;
            int missing = t.size();
            int left = 0;
            int bestStart = 0;
            int bestLen = s.size() + 1;
            for (int right = 0; right < (int)s.size(); ++right) {
                unsigned char ch = s[right];
                if (need[ch] > 0) --missing;
                --need[ch];
                while (missing == 0) {
                    if (right - left + 1 < bestLen) {
                        bestStart = left;
                        bestLen = right - left + 1;
                    }
                    unsigned char leftCh = s[left];
                    ++need[leftCh];
                    if (need[leftCh] > 0) ++missing;
                    ++left;
                }
            }
            return bestLen > (int)s.size() ? "" : s.substr(bestStart, bestLen);
        }
    };
