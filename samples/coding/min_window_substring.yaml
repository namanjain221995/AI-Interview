expected_concepts:
  - sliding window with two pointers
  - character counts with a missing-count invariant
  - shrinking the window from the left while it stays valid
  - O(m + n) time
optimal_complexity: {time: O(m + n), space: O(alphabet)}
rubric:
  excellent: Builds the expand-then-shrink sliding window with a single missing-count variable, handles duplicates in t and the leftmost tie rule, and proves O(m + n).
  good: Correct sliding window that re-checks all counts on each step (O(alphabet * n)), or a correct solution with minor help on duplicates.
  weak: Enumerates all substrings, ignores duplicate characters in t, or returns a window that is not minimal.
  criteria:
    correctness: All tests pass, including duplicates in t, case sensitivity and impossible inputs.
    efficiency: Each pointer moves at most n times.
    code_quality: The window invariant is explicit and the update order is easy to follow.
    edge_cases: Empty strings, t longer than s and ties between windows.
    communication: Explains when the window is valid and why shrinking keeps it minimal.
hints:
  - Think about growing a window to the right until it contains everything you need, then asking whether it can get smaller.
  - Track how many characters of t the window still lacks; when that number reaches zero, move the left edge right as long as the window stays valid, recording the smallest window seen.
  - Keep a count map of t and a missing counter; for each right index decrement the count (and missing when it was positive); while missing is zero, update the best window, then increment the count of s[left] (incrementing missing if it becomes positive) and advance left.
followups:
  - What happens when t is longer than s, or when s is empty?
  - How does your solution handle repeated characters in t?
  - How would you adapt it if the alphabet were all of Unicode?
  - How would you find the minimum window that contains t as a subsequence instead?
common_errors:
  - Treating t as a set and ignoring how many times each character is required.
  - Updating the best window after shrinking past validity, which records an invalid window.
  - Recomputing full character counts for every window, giving O(n^2) time.
  - Choosing the last minimal window instead of the leftmost one.
