reference_solutions:
  python: |
    from collections import Counter


    def min_window(s: str, t: str) -> str:
        if not t or len(t) > len(s):
            return ""
        need = Counter(t)
        missing = len(t)
        best_start, best_len = 0, len(s) + 1
        left = 0
        for right, ch in enumerate(s):
            if need[ch] > 0:
                missing -= 1
            need[ch] -= 1
            while missing == 0:
                if right - left + 1 < best_len:
                    best_start, best_len = left, right - left + 1
                need[s[left]] += 1
                if need[s[left]] > 0:
                    missing += 1
                left += 1
        return "" if best_len > len(s) else s[best_start:best_start + best_len]
  javascript: |
    function minWindow(s, t) {
      if (t.length === 0 || t.length > s.length) return "";
      const need = new Map();
      for (const ch of t) need.set(ch, (need.get(ch) || 0) + 1);
      let missing = t.length;
      let bestStart = 0;
      let bestLen = Infinity;
      let left = 0;
      for (let right = 0; right < s.length; right++) {
        const count = need.get(s[right]) || 0;
        if (count > 0) missing--;
        need.set(s[right], count - 1);
        while (missing === 0) {
          if (right - left + 1 < bestLen) {
            bestStart = left;
            bestLen = right - left + 1;
          }
          const restored = need.get(s[left]) + 1;
          need.set(s[left], restored);
          if (restored > 0) missing++;
          left++;
        }
      }
      return bestLen === Infinity ? "" : s.slice(bestStart, bestStart + bestLen);
    }
