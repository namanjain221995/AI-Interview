reference_solutions:
  python: |
    from collections import Counter


    def top_k_frequent(nums: list[int], k: int) -> list[int]:
        counts = Counter(nums)
        buckets: list[list[int]] = [[] for _ in range(len(nums) + 1)]
        for value, count in counts.items():
            buckets[count].append(value)
        result: list[int] = []
        for count in range(len(buckets) - 1, 0, -1):
            for value in buckets[count]:
                result.append(value)
                if len(result) == k:
                    return result
        return result
  javascript: |
    function topKFrequent(nums, k) {
      const counts = new Map();
      for (const n of nums) counts.set(n, (counts.get(n) || 0) + 1);
      const buckets = Array.from({ length: nums.length + 1 }, () => []);
      for (const [value, count] of counts) buckets[count].push(value);
      const result = [];
      for (let c = buckets.length - 1; c > 0 && result.length < k; c--) {
        for (const value of buckets[c]) {
          if (result.length === k) break;
          result.push(value);
        }
      }
      return result;
    }
  typescript: |
    function topKFrequent(nums: number[], k: number): number[] {
      const counts = new Map<number, number>();
      for (const n of nums) counts.set(n, (counts.get(n) ?? 0) + 1);
      const buckets: number[][] = Array.from({ length: nums.length + 1 }, () => []);
      for (const [value, count] of counts) buckets[count].push(value);
      const result: number[] = [];
      for (let c = buckets.length - 1; c > 0 && result.length < k; c--) {
        for (const value of buckets[c]) {
          if (result.length === k) break;
          result.push(value);
        }
      }
      return result;
    }
  java: |
    import java.util.*;

    class Solution {
        public int[] topKFrequent(int[] nums, int k) {
            Map<Integer, Integer> counts = new HashMap<>();
            for (int n : nums) counts.merge(n, 1, Integer::sum);
            List<List<Integer>> buckets = new ArrayList<>();
            for (int i = 0; i <= nums.length; i++) buckets.add(new ArrayList<>());
            for (Map.Entry<Integer, Integer> e : counts.entrySet()) buckets.get(e.getValue()).add(e.getKey());
            int[] result = new int[k];
            int filled = 0;
            for (int c = nums.length; c > 0 && filled < k; c--) {
                for (int value : buckets.get(c)) {
                    if (filled == k) break;
                    result[filled++] = value;
                }
            }
            return result;
        }
    }
  go: |
    package main

    func topKFrequent(nums []int, k int) []int {
    	counts := map[int]int{}
    	for _, n := range nums {
    		counts[n]++
    	}
    	buckets := make([][]int, len(nums)+1)
    	for value, count := range counts {
    		buckets[count] = append(buckets[count], value)
    	}
    	result := make([]int, 0, k)
    	for c := len(buckets) - 1; c > 0 && len(result) < k; c-- {
    		for _, value := range buckets[c] {
    			if len(result) == k {
    				break
    			}
    			result = append(result, value)
    		}
    	}
    	return result
    }
  cpp: |
    #include <unordered_map>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        vector<int> topKFrequent(vector<int>& nums, int k) {
            unordered_map<int, int> counts;
            for (int n : nums) ++counts[n];
            vector<vector<int>> buckets(nums.size() + 1);
            for (const auto& [value, count] : counts) buckets[count].push_back(value);
            vector<int> result;
            for (int c = (int)buckets.size() - 1; c > 0 && (int)result.size() < k; --c) {
                for (int value : buckets[c]) {
                    if ((int)result.size() == k) break;
                    result.push_back(value);
                }
            }
            return result;
        }
    };
