title: Top K Frequent Elements
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [general, backend, data, devops]
time_limit_minutes: 20
prompt_markdown: |
  ## Top K Frequent Elements

  Given an integer array `nums` and an integer `k`, return the `k` most frequent elements. You may
  return them in **any order**.

  The input is guaranteed to have a **unique** answer (no ties at the boundary).

  ### Example 1
  ```
  Input:  nums = [1, 1, 1, 2, 2, 3], k = 2
  Output: [1, 2]
  ```

  ### Example 2
  ```
  Input:  nums = [1], k = 1
  Output: [1]
  ```

  ### Constraints
  - `1 <= nums.length <= 10^5`
  - `-10^4 <= nums[i] <= 10^6`
  - `1 <= k <= number of distinct values`

  **Follow-up:** can you do better than `O(n log n)`?
