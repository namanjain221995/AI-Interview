expected_concepts:
  - frequency counting with a hash map
  - bucket sort by frequency (O(n)) or a size-k min-heap (O(n log k))
  - trade-offs between sorting, heaps and bucket sort
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Counts with a hash map, chooses bucket sort or a size-k heap with a clear complexity argument, and handles k equal to the number of distinct values.
  good: Counts correctly and sorts by frequency (O(n log n)), or uses a heap with minor prompting on the complexity.
  weak: Uses nested loops to count, returns the wrong number of elements, or confuses values with counts.
  criteria:
    correctness: All tests pass, including negative numbers and k equal to the distinct count.
    efficiency: Better than O(n log n) through buckets or a bounded heap, or a clear justification for sorting.
    code_quality: Counting and selection steps are clearly separated.
    edge_cases: Single element, all-equal input and k equal to the distinct count.
    communication: Compares at least two approaches and their costs.
hints:
  - Start by figuring out how often each value appears — which structure counts occurrences in one pass?
  - Once you have the counts, you only need the k largest; a full sort works, but a heap of size k or grouping values by their count can do better.
  - Count with a hash map, then put each value into a bucket indexed by its frequency (frequencies are between 1 and n) and read buckets from the highest frequency down until you have k values.
followups:
  - What is the complexity of your approach, and how does it compare with a heap of size k?
  - How would you handle ties at the k-th position if the answer were not unique?
  - How would you compute the top k over a stream that never ends, with limited memory?
common_errors:
  - Sorting the whole array of values instead of the distinct values by frequency.
  - Using a max-heap of all n values without noting the O(n log n) cost.
  - Off-by-one when sizing frequency buckets (frequencies go up to n).
  - Returning counts instead of values.
