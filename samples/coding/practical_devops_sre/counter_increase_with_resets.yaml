expected_concepts:
  - "pairwise differences over a time series"
  - "detecting counter resets from a decrease"
  - "treating a reset as growth from zero"
  - "64-bit accumulation"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Iterates over consecutive pairs, adds the difference for growth and the new value after a drop, handles short inputs, and explains why the lost requests before a restart cannot be recovered."
  good: "Correct pairwise solution that passes after a nudge on the reset rule or empty input."
  weak: "Returns last minus first, ignores drops entirely, adds the negative difference, or overflows."
  criteria:
    correctness: "All tests pass, including drops of one, consecutive restarts and large values."
    efficiency: "Single pass with constant memory."
    code_quality: "Clear pairwise loop with the reset rule in one obvious branch."
    edge_cases: "Empty and single-sample input, restarts to zero, flat counters and values beyond 32 bits."
    communication: "Explains how a reset is detected and what growth is credited for that step."
hints:
  - "Look at each pair of consecutive samples on its own and decide how much the counter grew in that step."
  - "When a sample is lower than the one before it, the only explanation is a restart; the counter then counted up from zero, which tells you how much to add for that step."
  - "Walk consecutive pairs and keep a 64-bit total: if the current value is at least the previous one add their difference, otherwise add the current value itself. Return zero when there are fewer than two samples."
followups:
  - "How would you turn this into a per-second rate over a window, and how should the window edges be extrapolated?"
  - "What false resets could appear if two replicas were scraped under the same series name?"
  - "How would you detect a restart that happened between scrapes when the counter grew past its previous value again?"
  - "How would you aggregate the increase across many instances of the same service?"
common_errors:
  - "Returning last minus first, which goes negative after a restart."
  - "Adding the negative difference on a drop, or skipping the step entirely."
  - "Treating only a drop to exactly zero as a restart."
  - "Using 32-bit integers for counters that exceed four billion."
