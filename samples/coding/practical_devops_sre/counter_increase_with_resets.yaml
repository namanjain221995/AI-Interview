version: 1
slug: counter_increase_with_resets
title: Counter Increase Across Restarts
difficulty: easy
competency_keys: [problem_solving, debugging]
role_tags: [sre, devops, platform, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Counter Increase Across Restarts

  A service exposes a `requests_total` metric that only ever goes up while the process is running.
  When the process restarts, the counter starts again from `0`. The monitoring system scrapes the
  value periodically, and you are given the scraped values `samples` in time order.

  A dashboard showed a negative request count after a deploy because it simply subtracted the first
  sample from the last. Compute the **real** number of requests counted between the first and the last
  scrape instead:

  - If a sample is greater than or equal to the previous one, the counter grew by the difference.
  - If a sample is **lower** than the previous one, the process must have restarted in between. The
    counter began again at `0`, so the whole new value counts as growth for that step.

  Return the total growth over all consecutive pairs. With fewer than two samples there is no
  interval to measure: return `0`. (Requests between the last scrape before a restart and the restart
  itself are lost; do not try to estimate them.)

  ### Example 1
  ```
  Input:  samples = [100, 150, 150, 30, 80]
  Output: 130
  Explanation: 50 + 0, then the drop to 30 is a restart (+30), then +50.
  ```

  ### Example 2
  ```
  Input:  samples = [40, 0, 0, 25]
  Output: 25
  ```

  ### Example 3
  ```
  Input:  samples = [5]
  Output: 0
  ```

  ### Constraints
  - `0 <= samples.length <= 10^5`
  - `0 <= samples[i] <= 10^12`
  - The answer fits in a signed 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: counter_increase_with_resets
  params:
    - {name: samples, type: "long[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def counter_increase_with_resets(samples: list[int]) -> int:
        total = 0
        for prev, cur in zip(samples, samples[1:]):
            if cur >= prev:
                total += cur - prev
            else:
                total += cur  # restarted from 0 since the previous scrape
        return total
  javascript: |
    function counterIncreaseWithResets(samples) {
      let total = 0;
      for (let i = 1; i < samples.length; i++) {
        const prev = samples[i - 1];
        const cur = samples[i];
        total += cur >= prev ? cur - prev : cur;
      }
      return total;
    }
