version: 1
slug: longest_slo_compliant_window
title: Longest SLO-Compliant Stretch
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [sre, data_analyst, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## Longest SLO-Compliant Stretch

  An API gateway exports two counters per minute: `total[i]`, the number of requests served in minute
  `i`, and `errors[i]`, how many of them failed. The service level objective allows an error ratio of at
  most `budget_ppm` errors per million requests.

  A **window** is a contiguous run of minutes `i..j`. It is **compliant** when its aggregate error ratio
  is within budget:

  ```
  (errors[i] + ... + errors[j]) * 1_000_000  <=  budget_ppm * (total[i] + ... + total[j])
  ```

  The ratio is computed over the whole window, so a bad minute can be part of a compliant window when
  the surrounding minutes absorb it. Minutes without traffic (`total = errors = 0`) add nothing to
  either side, so they never break compliance.

  Return the **length** (number of minutes) of the longest compliant window, or `0` if no window is
  compliant.

  ### Example 1
  ```
  Input:  total = [1000, 1500, 1200, 800, 1000, 900], errors = [0, 1, 8, 0, 1, 6], budget_ppm = 2000
  Output: 5
  Explanation: minute 2 alone is far over budget (8 errors in 1200 requests), but minutes 0..4
  have 10 errors in 5500 requests and the budget allows 11. No window of 6 minutes is compliant.
  ```

  ### Example 2
  ```
  Input:  total = [0, 400, 0, 0], errors = [0, 3, 0, 0], budget_ppm = 5000
  Output: 2
  Explanation: minute 1 exceeds the budget (3 errors where 2 are allowed); minutes 2..3 have
  no traffic and form a compliant window of length 2.
  ```

  ### Example 3
  ```
  Input:  total = [10, 20], errors = [1, 1], budget_ppm = 0
  Output: 0
  ```

  ### Constraints
  - `1 <= total.length == errors.length <= 10^5`
  - `0 <= errors[i] <= total[i] <= 5 * 10^4`
  - `0 <= budget_ppm <= 10^6`
  - Intermediate sums need 64-bit integers.

  **Follow-up:** checking every window is `O(n^2)`. Can you find the answer in `O(n log n)` or `O(n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_slo_compliant_window
  params:
    - {name: total, type: "long[]"}
    - {name: errors, type: "long[]"}
    - {name: budget_ppm, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def longest_slo_compliant_window(total: list[int], errors: list[int], budget_ppm: int) -> int:
        n = len(total)
        # Each minute's "excess": positive when it burns more than its share of the budget.
        prefix = [0] * (n + 1)
        for i in range(n):
            prefix[i + 1] = prefix[i] + errors[i] * 1_000_000 - budget_ppm * total[i]
        # Window (i, j] is compliant iff prefix[j] <= prefix[i]. Only strictly rising prefix
        # maxima are useful left ends.
        starts: list[int] = []
        for i in range(n + 1):
            if not starts or prefix[i] > prefix[starts[-1]]:
                starts.append(i)
        best = 0
        for j in range(n, -1, -1):
            while starts and prefix[starts[-1]] >= prefix[j]:
                best = max(best, j - starts.pop())
        return best
  javascript: |
    function longestSloCompliantWindow(total, errors, budgetPpm) {
      const n = total.length;
      const prefix = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) {
        prefix[i + 1] = prefix[i] + errors[i] * 1000000 - budgetPpm * total[i];
      }
      // Every |prefix| stays below 2^53 under the constraints, so doubles are exact.
      const starts = [];
      for (let i = 0; i <= n; i++) {
        if (starts.length === 0 || prefix[i] > prefix[starts[starts.length - 1]]) starts.push(i);
      }
      let best = 0;
      for (let j = n; j >= 0; j--) {
        while (starts.length > 0 && prefix[starts[starts.length - 1]] >= prefix[j]) {
          best = Math.max(best, j - starts.pop());
        }
      }
      return best;
    }
