expected_concepts:
  - transforming a ratio constraint into a sum constraint with integer weights
  - prefix sums
  - longest subarray with sum at most zero
  - monotonic stack of prefix maxima (or binary search over them)
  - 64-bit arithmetic and avoiding floating-point ratios
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Rewrites the ratio test as a per-minute weight errors * 10^6 - budget * total, reduces the task to the widest pair i < j with prefix[j] <= prefix[i], solves it in O(n) or O(n log n) with prefix maxima, and argues why sliding windows do not work with negative and positive weights.
  good: Finds the prefix-sum reformulation and a correct O(n log n) solution with a binary search over prefix maxima, or reaches the linear version with hints.
  weak: Uses floating-point ratios per minute, averages per-minute ratios instead of aggregating counts, applies a two-pointer window that assumes monotonicity, or stops at the O(n^2) scan.
  criteria:
    correctness: All tests pass, including budget 0, budget 10^6, zero-traffic minutes and windows that must contain a bad minute.
    efficiency: O(n) or O(n log n) time; explains why two pointers fail when weights can be negative.
    code_quality: Integer arithmetic only, clear naming of the prefix array and the candidate stack.
    edge_cases: Single minute, no compliant window, the entire range compliant, and equality at the budget boundary.
    communication: Explains why only strictly increasing prefix values can be the best left end.
hints:
  - Comparing ratios is awkward. Multiply out the inequality so it becomes a statement about one sum over the window being at most zero.
  - Give each minute the weight errors * 1,000,000 - budget_ppm * total. With prefix sums P, the window i..j-1 is compliant exactly when P[j] <= P[i]; you want the widest such pair with i < j.
  - A left end i is only worth considering if P[i] is larger than every earlier prefix value, so collect those strictly increasing prefix maxima in a stack. Then walk j from the right end down to 0 and pop every stack entry whose value is at least P[j], recording j minus the popped index; popped entries can never give a wider window for a smaller j.
followups:
  - How would you report the start minute of the longest window as well, choosing the earliest on ties?
  - How would you answer the question for a stream of minutes, updating the answer as each minute arrives?
  - How would the solution change if the SLO were defined on latency percentiles instead of error counts?
  - Why does a sliding window with two pointers not work here, while it does when all weights are non-negative?
common_errors:
  - Averaging per-minute error ratios instead of comparing aggregate errors with aggregate traffic.
  - Using floating-point division and failing at the exact budget boundary.
  - Overflowing 32-bit integers when multiplying errors by one million.
  - Using a two-pointer window that shrinks on violation, which misses windows that recover later.
  - Treating zero-traffic minutes as division by zero or as violations.
