version: 1
slug: change_failure_rate_by_service
title: "Change Failure Rate per Service"
difficulty: easy
competency_keys: [sql, databases]
role_tags: [devops, sre, data_analyst, dba, engineering_manager]
time_limit_minutes: 15
prompt_markdown: |
  ## Change Failure Rate per Service

  The platform team records every production deployment in one table and wants a weekly report of how
  often a change to each service goes wrong.

  Table `deployments`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | service | VARCHAR(60) | name of the deployed service |
  | status | VARCHAR(20) | `success`, `failed` or `rolled_back` |
  | deployed_at | INTEGER | Unix epoch seconds (not needed for this report) |

  A deployment **counts as failed** when its status is `failed` **or** `rolled_back`.

  For every service with **at least 3 deployments**, return:

  - `service`
  - `total_deploys`: the number of deployments of the service
  - `failed_deploys`: the number of failed deployments of the service
  - `failure_rate_pct`: `100 * failed_deploys / total_deploys`, rounded to **2 decimal places** (a
    decimal number, for example `33.33`; do not truncate with integer division)

  Services with fewer than 3 deployments are left out. Order the rows by `failure_rate_pct`
  descending, then by `service` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  deployments
  +----+----------+-------------+-------------+
  | id | service  | status      | deployed_at |
  +----+----------+-------------+-------------+
  | 1  | checkout | success     | 1700000000  |
  | 2  | checkout | failed      | 1700000600  |
  | 3  | search   | success     | 1700001200  |
  | 4  | checkout | success     | 1700001800  |
  | 5  | payments | failed      | 1700002400  |
  | 6  | checkout | rolled_back | 1700003000  |
  | 7  | search   | success     | 1700003600  |
  | 8  | auth     | failed      | 1700004200  |
  | 9  | payments | success     | 1700004800  |
  | 10 | checkout | success     | 1700005400  |
  | 11 | search   | success     | 1700006000  |
  | 12 | payments | success     | 1700006600  |
  | 13 | auth     | failed      | 1700007200  |
  +----+----------+-------------+-------------+

  Output
  +----------+---------------+----------------+------------------+
  | service  | total_deploys | failed_deploys | failure_rate_pct |
  +----------+---------------+----------------+------------------+
  | checkout | 5             | 2              | 40.0             |
  | payments | 3             | 1              | 33.33            |
  | search   | 3             | 0              | 0.0              |
  +----------+---------------+----------------+------------------+
  auth has only 2 deployments and is not reported. The rolled-back checkout deployment counts as failed.
  ```

  ### Example 2
  ```
  deployments
  +----+---------+-------------+-------------+
  | id | service | status      | deployed_at |
  +----+---------+-------------+-------------+
  | 1  | billing | success     | 1700000000  |
  | 2  | api-gw  | success     | 1700000100  |
  | 3  | worker  | failed      | 1700000200  |
  | 4  | billing | rolled_back | 1700000300  |
  | 5  | api-gw  | failed      | 1700000400  |
  | 6  | worker  | rolled_back | 1700000500  |
  | 7  | billing | success     | 1700000600  |
  | 8  | api-gw  | success     | 1700000700  |
  | 9  | worker  | failed      | 1700000800  |
  | 10 | billing | success     | 1700000900  |
  | 11 | api-gw  | success     | 1700001000  |
  +----+---------+-------------+-------------+

  Output
  +---------+---------------+----------------+------------------+
  | service | total_deploys | failed_deploys | failure_rate_pct |
  +---------+---------------+----------------+------------------+
  | worker  | 3             | 3              | 100.0            |
  | api-gw  | 4             | 1              | 25.0             |
  | billing | 4             | 1              | 25.0             |
  +---------+---------------+----------------+------------------+
  api-gw and billing tie on 25.0 and are ordered by name.
  ```

  ### Constraints
  - `0 <= rows in deployments <= 10^5`
  - `status` is always one of `success`, `failed`, `rolled_back`.
languages: [sql]
starter_code:
  sql: |
    -- For each service with at least 3 deployments, report totals, failures and the failure rate.
    SELECT service, COUNT(*) AS total_deploys, 0 AS failed_deploys, 0.0 AS failure_rate_pct
    FROM deployments
    GROUP BY service
    ORDER BY service;
reference_solutions:
  sql: |
    SELECT
      service,
      COUNT(*) AS total_deploys,
      SUM(CASE WHEN status IN ('failed', 'rolled_back') THEN 1 ELSE 0 END) AS failed_deploys,
      CAST(
        ROUND(100.0 * SUM(CASE WHEN status IN ('failed', 'rolled_back') THEN 1 ELSE 0 END) / COUNT(*), 2)
        AS DOUBLE PRECISION
      ) AS failure_rate_pct
    FROM deployments
    GROUP BY service
    HAVING COUNT(*) >= 3
    ORDER BY failure_rate_pct DESC, service ASC;
sql_setup: |
  CREATE TABLE deployments (
    id INTEGER PRIMARY KEY,
    service VARCHAR(60) NOT NULL,
    status VARCHAR(20) NOT NULL,
    deployed_at INTEGER NOT NULL
  );
