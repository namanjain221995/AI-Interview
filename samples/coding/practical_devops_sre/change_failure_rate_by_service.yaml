expected_concepts:
  - "GROUP BY with conditional aggregation (SUM over CASE WHEN)"
  - "HAVING to filter groups after aggregation"
  - "avoiding integer division with a decimal literal"
  - "ROUND to two decimals portably"
  - "deterministic ORDER BY with a tie-breaker"
optimal_complexity: {time: "O(n log n) for grouping and sorting (O(n) with hash aggregation)", space: "O(s) for s services"}
rubric:
  excellent: "Writes one GROUP BY query with a conditional SUM for failures, filters with HAVING COUNT(*) >= 3, forces decimal division before ROUND, orders by rate descending then name, and explains why WHERE cannot replace HAVING here."
  good: "Reaches a correct query but needs a nudge on integer division, the rolled_back status or the tie-breaking order."
  weak: "Uses WHERE status = 'failed' (dropping both totals and rolled_back), divides integers, forgets the minimum deploy count, or leaves the order unspecified."
  criteria:
    correctness: "All tests pass, including rolled_back failures, ties and the 3-deploy threshold."
    efficiency: "Single pass aggregation; no self-joins or one subquery per service."
    code_quality: "The failure condition is written once in a readable CASE expression, with clear output aliases."
    edge_cases: "Empty table, services below the threshold, 0 and 100 percent, repeating decimals."
    communication: "Explains conditional aggregation and why a decimal literal avoids integer division."
hints:
  - "You need two counts per service from the same rows: all deployments and only the failed ones. Think about counting conditionally inside one GROUP BY."
  - "A CASE expression inside SUM can count only the rows that are failed or rolled back, and the minimum of three deployments is a condition on the group, not on individual rows."
  - "Group by service, compute the failed count with SUM over a CASE that yields 1 for failed or rolled_back, keep groups with HAVING COUNT(*) of at least 3, multiply by 100.0 before dividing so the division is decimal, round to 2 places, and order by the rate descending then the service name."
followups:
  - "How would you restrict the report to the last 7 days using deployed_at, and which index would help?"
  - "How would you also report the mean time between a failed deploy and the next successful one?"
  - "Why can a WHERE clause on status not be used to compute the failure count here?"
common_errors:
  - "Filtering WHERE status = 'failed', which loses the total count and ignores rolled_back."
  - "Dividing two integers, which yields 0 for any rate below 100 percent on PostgreSQL and SQLite."
  - "Putting the minimum deployment count in WHERE instead of HAVING."
  - "Ordering only by the rate, which leaves ties in an arbitrary order."
