version: 1
slug: longest_successful_deploy_streak
title: Deploy Success Streaks
difficulty: hard
competency_keys: [sql, databases]
role_tags: [devops, sre, data_analyst, dba]
time_limit_minutes: 30
prompt_markdown: |
  ## Deploy Success Streaks

  The delivery pipeline records every production deployment in table `deployments`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key; ids are **not** guaranteed to follow deployment time (backfilled rows) |
  | service | TEXT | service name |
  | status | TEXT | `'success'`, `'failed'` or `'rolled_back'` |
  | deployed_at | INTEGER | epoch seconds; two deployments of a service can share a timestamp |

  A service's deployments are ordered by `deployed_at`, then by `id` for equal timestamps. A **success
  streak** is a maximal run of consecutive deployments of one service, in that order, that all have
  status `'success'`. Any other status ends the streak.

  For every service with at least one successful deployment, return:

  - `service`;
  - `longest_streak`: the number of deployments in its longest success streak;
  - `streak_start_id` and `streak_end_id`: the `id` of the first and of the last deployment of that
    streak. If several streaks share the longest length, report the **earliest** one.

  Services without any successful deployment are not returned. Order the result by `longest_streak`
  descending, then `service` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite (window functions are allowed; no date
  functions are needed).

  ### Example 1
  ```
  deployments
  +----+----------+-------------+-------------+
  | id | service  | status      | deployed_at |
  +----+----------+-------------+-------------+
  | 1  | checkout | success     | 1000        |
  | 2  | checkout | success     | 1100        |
  | 3  | search   | success     | 1150        |
  | 4  | checkout | failed      | 1200        |
  | 5  | checkout | success     | 1300        |
  | 6  | search   | rolled_back | 1350        |
  | 7  | checkout | success     | 1400        |
  | 8  | search   | success     | 1450        |
  | 9  | checkout | success     | 1500        |
  | 10 | billing  | failed      | 1600        |
  +----+----------+-------------+-------------+

  Output
  +----------+----------------+-----------------+---------------+
  | service  | longest_streak | streak_start_id | streak_end_id |
  +----------+----------------+-----------------+---------------+
  | checkout | 3              | 5               | 9             |
  | search   | 1              | 3               | 3             |
  +----------+----------------+-----------------+---------------+
  search has two one-deployment streaks; the earlier one (id 3) is reported. billing never succeeded.
  ```

  ### Example 2
  ```
  deployments
  +----+---------+---------+-------------+
  | id | service | status  | deployed_at |
  +----+---------+---------+-------------+
  | 21 | ledger  | success | 500         |
  | 20 | ledger  | success | 400         |
  | 23 | ledger  | failed  | 500         |
  | 22 | ledger  | success | 600         |
  | 24 | ledger  | success | 700         |
  +----+---------+---------+-------------+

  Output
  +---------+----------------+-----------------+---------------+
  | service | longest_streak | streak_start_id | streak_end_id |
  +---------+----------------+-----------------+---------------+
  | ledger  | 2              | 20              | 21            |
  +---------+----------------+-----------------+---------------+
  In deployment order the ids are 20, 21, 23, 22, 24 (21 and 23 share a timestamp, so id decides).
  The failure splits them into two streaks of length 2; the earlier one wins.
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `0 <= deployed_at <= 4 * 10^9`
languages: [sql]
starter_code:
  sql: |
    -- Return service, longest_streak, streak_start_id, streak_end_id for each service with a success.
    SELECT service, COUNT(*) AS longest_streak, MIN(id) AS streak_start_id, MAX(id) AS streak_end_id
    FROM deployments
    WHERE status = 'success'
    GROUP BY service
    ORDER BY longest_streak DESC, service;
reference_solutions:
  sql: |
    WITH ordered AS (
      SELECT
        id,
        service,
        status,
        ROW_NUMBER() OVER (PARTITION BY service ORDER BY deployed_at, id) AS pos,
        ROW_NUMBER() OVER (PARTITION BY service, status ORDER BY deployed_at, id) AS pos_in_status
      FROM deployments
    ),
    streaks AS (
      SELECT
        service,
        COUNT(*) AS streak_length,
        MIN(pos) AS first_pos,
        MAX(pos) AS last_pos
      FROM ordered
      WHERE status = 'success'
      GROUP BY service, pos - pos_in_status
    ),
    ranked AS (
      SELECT
        service,
        streak_length,
        first_pos,
        last_pos,
        ROW_NUMBER() OVER (PARTITION BY service ORDER BY streak_length DESC, first_pos) AS pick
      FROM streaks
    )
    SELECT
      r.service,
      r.streak_length AS longest_streak,
      s.id AS streak_start_id,
      e.id AS streak_end_id
    FROM ranked r
    JOIN ordered s ON s.service = r.service AND s.pos = r.first_pos
    JOIN ordered e ON e.service = r.service AND e.pos = r.last_pos
    WHERE r.pick = 1
    ORDER BY longest_streak DESC, r.service;
sql_setup: |
  CREATE TABLE deployments (
    id INTEGER PRIMARY KEY,
    service VARCHAR(40) NOT NULL,
    status VARCHAR(20) NOT NULL CHECK (status IN ('success', 'failed', 'rolled_back')),
    deployed_at BIGINT NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - longest streak after a failure; single-deploy tie keeps the earliest"
    ordered: true
    setup_sql: |
      INSERT INTO deployments (id, service, status, deployed_at) VALUES
        (1, 'checkout', 'success', 1000), (2, 'checkout', 'success', 1100), (3, 'search', 'success', 1150),
        (4, 'checkout', 'failed', 1200), (5, 'checkout', 'success', 1300), (6, 'search', 'rolled_back', 1350),
        (7, 'checkout', 'success', 1400), (8, 'search', 'success', 1450), (9, 'checkout', 'success', 1500),
        (10, 'billing', 'failed', 1600);
    expected_rows: [["checkout", 3, 5, 9], ["search", 1, 3, 3]]
  - id: t2
    description: "Example 2 - equal timestamps ordered by id, ids not chronological, tie keeps earliest"
    ordered: true
    setup_sql: |
      INSERT INTO deployments (id, service, status, deployed_at) VALUES
        (21, 'ledger', 'success', 500), (20, 'ledger', 'success', 400), (23, 'ledger', 'failed', 500),
        (22, 'ledger', 'success', 600), (24, 'ledger', 'success', 700);
    expected_rows: [["ledger", 2, 20, 21]]
