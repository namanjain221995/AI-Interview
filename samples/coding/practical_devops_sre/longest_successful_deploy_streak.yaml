expected_concepts:
  - gaps-and-islands with two ROW_NUMBER sequences
  - deterministic ordering with a tie-breaker column
  - picking one row per group with ROW_NUMBER and a secondary sort
  - joining back to recover boundary ids
  - multi-level ordering of the final result
optimal_complexity: {time: "O(n log n) for the per-service sorts", space: O(n)}
rubric:
  excellent: Numbers each service's deployments overall and within each status, groups successes by the difference to form streaks, picks the longest per service with ROW_NUMBER ordered by length descending and start position, recovers the start and end ids, and explains why ordering by id alone is wrong.
  good: Reaches a correct gaps-and-islands query with a hint, or uses LAG plus a running SUM to number streaks, but needs help with the earliest-streak tie-break or the boundary ids.
  weak: Counts all successes per service, orders by id instead of deployed_at, uses MIN(id)/MAX(id) as streak boundaries, or loses the tie-break between equal streaks.
  criteria:
    correctness: All tests pass, including equal timestamps, out-of-order ids, rolled-back deployments and ties between streaks.
    efficiency: Window functions over one scan per service instead of correlated subqueries per row.
    code_quality: Named CTEs (ordered, streaks, ranked) with readable aliases and explicit output column names.
    edge_cases: Empty table, services that never succeed, a single success and a service with only successes.
    communication: Explains why the difference between the two row numbers is constant inside a streak.
hints:
  - Put each service's deployments in a strict order first (deployed_at, then id) and think of a streak as an island of successes in that sequence.
  - Number every deployment within its service, and separately number it within its service and status. For consecutive successes the difference between the two numbers stays the same, and it changes after any non-success deployment.
  - Group the success rows by service and that difference to get each streak's length and first and last positions. Rank the streaks per service with ROW_NUMBER ordered by length descending then first position, keep rank 1, and join back on the positions to read the start and end ids; order by longest_streak DESC, service.
followups:
  - How would you return the current (still open) streak of each service instead of the longest one?
  - How would you solve it with LAG and a running SUM instead of two ROW_NUMBER calls?
  - Which index helps this query on a table with millions of deployments?
  - How would you report streaks per calendar week without vendor-specific date functions?
common_errors:
  - Ordering by id instead of (deployed_at, id), which breaks on backfilled rows.
  - Counting all successes per service instead of consecutive ones.
  - Taking MIN(id) and MAX(id) of the streak, which is wrong when ids are not chronological.
  - Breaking ties between equal-length streaks arbitrarily instead of choosing the earliest.
  - Treating rolled_back as a success or ignoring it instead of letting it end the streak.
