reference_solutions:
  python: |
    from bisect import bisect_left


    def consistent_hash_replica_sets(node_tokens: list[list[int]], keys: list[int], replicas: int) -> list[list[int]]:
        ring = sorted((token, node) for node, tokens in enumerate(node_tokens) for token in tokens)
        positions = [token for token, _ in ring]
        wanted = min(replicas, len(node_tokens))
        result: list[list[int]] = []
        for h in keys:
            start = bisect_left(positions, h)
            chosen: list[int] = []
            seen: set[int] = set()
            for step in range(len(ring)):
                node = ring[(start + step) % len(ring)][1]
                if node not in seen:
                    seen.add(node)
                    chosen.append(node)
                    if len(chosen) == wanted:
                        break
            result.append(chosen)
        return result
  javascript: |
    function consistentHashReplicaSets(nodeTokens, keys, replicas) {
      const ring = [];
      nodeTokens.forEach((tokens, node) => {
        for (const token of tokens) ring.push([token, node]);
      });
      ring.sort((a, b) => a[0] - b[0]);
      const wanted = Math.min(replicas, nodeTokens.length);
      const lowerBound = (h) => {
        let lo = 0;
        let hi = ring.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (ring[mid][0] < h) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      return keys.map((h) => {
        const start = lowerBound(h);
        const chosen = [];
        const seen = new Set();
        for (let step = 0; step < ring.length && chosen.length < wanted; step++) {
          const node = ring[(start + step) % ring.length][1];
          if (!seen.has(node)) {
            seen.add(node);
            chosen.push(node);
          }
        }
        return chosen;
      });
    }
