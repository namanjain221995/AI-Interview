expected_concepts:
  - flattening and sorting tokens with their owners
  - binary search (lower bound) for the first token at or after the hash
  - wrap-around walk with modular indexing
  - skipping duplicate owners with a set
  - stopping at min(replicas, number of nodes)
optimal_complexity: {time: "O(T log T + K (log T + W)) where W is the walk length", space: O(T)}
rubric:
  excellent: Sorts (token, node) pairs once, finds each starting point with a lower-bound binary search, walks with wrap-around while skipping repeated owners, caps the list at the node count and discusses the walk length when one node owns long runs of consecutive tokens.
  good: Correct placement with sorting and a linear scan for the start, or binary search after a hint.
  weak: Uses the first token strictly greater than the hash, forgets to wrap around, repeats a node in the list or loops forever when fewer nodes exist than replicas.
  criteria:
    correctness: All tests pass, including exact token hits, wrap-around and fewer nodes than replicas.
    efficiency: One sort plus a binary search per key instead of scanning the whole ring for every key.
    code_quality: The ring is built once; the walk has a clear termination condition.
    edge_cases: Hash equal to a token, hash above the largest token, a single node, no keys and replicas larger than the node count.
    communication: Explains why virtual nodes (several tokens per node) spread load and why duplicates must be skipped.
hints:
  - Put all tokens from all nodes on one sorted list, each remembering its owner; a key's placement only depends on where its hash falls in that list.
  - Use binary search to find the first token whose position is at least the hash, then move forward through the list, wrapping to the beginning after the end.
  - Sort pairs of token and owner once. For each key, find the lower-bound index, then walk up to the number of tokens in total steps using the index modulo the list length, appending an owner only the first time you see it, and stop once you have the smaller of the requested replica count and the number of nodes.
followups:
  - How does adding or removing a node change the replica lists of existing keys, and how much data moves?
  - How would you avoid placing two replicas in the same rack or availability zone?
  - If one node owns long runs of consecutive tokens, the walk can be long. How could you precompute the answer for every token position?
common_errors:
  - Searching for the first token strictly greater than the hash, which misplaces keys that hit a token exactly.
  - Forgetting the wrap-around for hashes above the largest token.
  - Looping forever when the number of nodes is smaller than the requested replica count.
  - Adding the same node twice because it owns several tokens on the walk.
