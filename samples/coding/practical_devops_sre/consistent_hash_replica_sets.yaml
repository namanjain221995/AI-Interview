title: Hash Ring Replica Placement
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [backend, platform, sre, dba]
time_limit_minutes: 25
prompt_markdown: |
  ## Hash Ring Replica Placement

  A distributed key-value store places data on a **hash ring** of positions `0` to `2^31 - 1` that wraps
  around: after the largest position comes position `0` again. Storage node `i` owns the ring positions
  (tokens) listed in `node_tokens[i]`. Every node owns at least one token and no two tokens are equal.

  To place a key with hash `h`, the store walks the ring **clockwise** (towards larger positions, wrapping
  from the end back to the start), beginning at the first token whose position is **greater than or equal
  to** `h`. Each token it passes names its owning node. A node is added to the key's replica list the first
  time one of its tokens is passed; later tokens of a node already on the list are skipped. The walk stops
  as soon as the list holds `replicas` nodes, or after every token has been visited once if there are
  fewer than `replicas` nodes in total.

  For every hash in `keys`, return its replica list (node indices in the order they were added). The
  result has one list per key, in the same order as `keys`.

  ### Example 1
  ```
  Input:  node_tokens = [[10, 70], [30, 90], [20, 40]], keys = [15, 35, 95, 30], replicas = 2
  Output: [[2, 1], [2, 0], [0, 2], [1, 2]]
  Explanation: sorted tokens are 10(n0), 20(n2), 30(n1), 40(n2), 70(n0), 90(n1). Hash 15 starts at
  token 20: n2, then n1. Hash 35 starts at 40: n2, then 70 gives n0. Hash 95 is past the last token, so
  it wraps to 10: n0, then 20 gives n2. Hash 30 starts exactly at token 30: n1, then n2.
  ```

  ### Example 2
  ```
  Input:  node_tokens = [[5, 6], [100]], keys = [4, 50, 101], replicas = 3
  Output: [[0, 1], [1, 0], [0, 1]]
  Explanation: only two nodes exist, so every list stops at two nodes even though three replicas were
  requested. Node 0 owns both 5 and 6, so the walk from 4 skips the second token of node 0.
  ```

  ### Constraints
  - `1 <= node_tokens.length <= 1000`, `1 <= node_tokens[i].length`, total tokens `T <= 10^5`
  - `0 <= node_tokens[i][j] < 2^31`, all tokens distinct
  - `0 <= keys.length <= 10^4`, `0 <= keys[k] < 2^31`
  - `1 <= replicas <= 10`
