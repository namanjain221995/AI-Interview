expected_concepts:
  - "parsing key/value lines by splitting on the first separator only"
  - "hash maps keyed by config name with last-write-wins semantics"
  - "set union of keys and classification into added, removed and changed"
  - "deterministic output ordering"
optimal_complexity: {time: "O(L + K log K) for L lines and K distinct keys", space: "O(K)"}
rubric:
  excellent: "Parses both files into maps with a first-separator split, ignores comments and blank lines, takes the sorted union of keys and classifies each in one pass; explains last-write-wins and the empty-value case without prompting."
  good: "Correct map-based solution that passes the tests, perhaps after fixing the split on values containing '=' or the ordering by key rather than by prefixed string."
  weak: "Compares the files line by line, splits on every '=' and loses part of the value, treats empty values as missing, or sorts by the prefixed entry."
  criteria:
    correctness: "All tests pass, including repeated keys, empty values, values containing '=' and empty files."
    efficiency: "Linear parsing plus one sort of the distinct keys; no nested scans of the line lists."
    code_quality: "A single reusable parse helper and a clear three-way classification."
    edge_cases: "Comments, blank lines, '#' inside a value, trailing spaces, case-sensitive keys and keys repeated in one file."
    communication: "States the parsing rules being applied and why the sort key excludes the prefix."
hints:
  - "Turn each file into a lookup from key to value first; the comparison becomes much simpler once both files are in that shape."
  - "When splitting a line, only the first equals sign separates the key from the value, and assigning into a map in file order naturally keeps the last value for a repeated key."
  - "Build one map per file while skipping empty and comment lines, then walk the union of both key sets in sorted order: a key missing from the old map is added, missing from the new map is removed, and present in both with different values is changed."
followups:
  - "How would you also report the old and new values while masking anything that looks like a secret?"
  - "How would you support quoted values or an 'export ' prefix as some .env tools do?"
  - "What if the files were too large to hold both maps in memory but were already sorted by key?"
  - "How would you flag a key that is repeated within the same file as a probable mistake?"
common_errors:
  - "Splitting on every '=' so values such as base64 tokens or URLs with query strings are truncated."
  - "Treating an empty value as a missing key, so 'RETRIES=' versus no RETRIES line is not reported."
  - "Keeping the first occurrence of a repeated key instead of the last."
  - "Sorting the output strings including their prefix, which groups entries by change type instead of by key."
