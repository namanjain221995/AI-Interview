version: 1
slug: flat_config_diff
title: Environment Config Diff
difficulty: easy
competency_keys: [data_structures, code_quality]
role_tags: [devops, platform, backend, qa]
time_limit_minutes: 12
prompt_markdown: |
  ## Environment Config Diff

  Before a release goes out, the deployment pipeline posts a short summary of how the service's
  `.env` file changed. You are given the old file and the new file, each as a list of lines, and must
  produce that summary.

  Each file is read like this:

  - A line is **ignored** if it is empty or its first character is `#` (a comment).
  - Every other line is split at its **first** `=`: the text before it is the key, everything after it is
    the value. The value may itself contain `=` characters and may be empty (`RETRIES=` sets
    `RETRIES` to the empty string).
  - If a key appears more than once in the same file, the **last** occurrence wins.
  - Keys and values are compared exactly as written (case-sensitive, no trimming).

  Return one entry for every key whose state differs between the two files:

  - `"+KEY"` if the key exists only in the new file,
  - `"-KEY"` if the key exists only in the old file,
  - `"~KEY"` if the key exists in both files with different values.

  Keys with the same value in both files are left out. Sort the entries by **key** in ascending ASCII
  order (the `+`, `-` or `~` prefix does not take part in the ordering). Return an empty list when
  nothing changed.

  ### Example 1
  ```
  Input:  old_lines = ["# api settings", "PORT=8080", "LOG_LEVEL=info", "DB_URL=postgres://db:5432/app", "FEATURE_X=on"], new_lines = ["PORT=8080", "LOG_LEVEL=debug", "", "DB_URL=postgres://db:5432/app?sslmode=require", "CACHE_TTL=300"]
  Output: ["+CACHE_TTL", "~DB_URL", "-FEATURE_X", "~LOG_LEVEL"]
  Explanation: PORT is unchanged; the comment and the blank line are ignored.
  ```

  ### Example 2
  ```
  Input:  old_lines = ["TOKEN=abc==", "MODE=blue", "MODE=green", "RETRIES="], new_lines = ["MODE=green", "TOKEN=abc=", "RETRIES=", "NEW_FLAG="]
  Output: ["+NEW_FLAG", "~TOKEN"]
  Explanation: MODE was last set to green in the old file, so it is unchanged. RETRIES is empty in both files.
  ```

  ### Constraints
  - `0 <= old_lines.length, new_lines.length <= 1000`
  - Each line has at most 200 printable ASCII characters.
  - Every line that is not ignored contains at least one `=`, and its key is non-empty and has no spaces.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: flat_config_diff
  params:
    - {name: old_lines, type: "string[]"}
    - {name: new_lines, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def flat_config_diff(old_lines: list[str], new_lines: list[str]) -> list[str]:
        def parse(lines: list[str]) -> dict[str, str]:
            values: dict[str, str] = {}
            for line in lines:
                if not line or line[0] == "#":
                    continue
                key, _, value = line.partition("=")
                values[key] = value  # a later occurrence overwrites an earlier one
            return values

        old, new = parse(old_lines), parse(new_lines)
        changes: list[str] = []
        for key in sorted(old.keys() | new.keys()):
            if key not in old:
                changes.append("+" + key)
            elif key not in new:
                changes.append("-" + key)
            elif old[key] != new[key]:
                changes.append("~" + key)
        return changes
  javascript: |
    function flatConfigDiff(oldLines, newLines) {
      function parse(lines) {
        const values = new Map();
        for (const line of lines) {
          if (line.length === 0 || line[0] === "#") continue;
          const cut = line.indexOf("=");
          values.set(line.slice(0, cut), line.slice(cut + 1));
        }
        return values;
      }

      const oldValues = parse(oldLines);
      const newValues = parse(newLines);
      const keys = [...new Set([...oldValues.keys(), ...newValues.keys()])];
      keys.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      const changes = [];
      for (const key of keys) {
        if (!oldValues.has(key)) changes.push("+" + key);
        else if (!newValues.has(key)) changes.push("-" + key);
        else if (oldValues.get(key) !== newValues.get(key)) changes.push("~" + key);
      }
      return changes;
    }
