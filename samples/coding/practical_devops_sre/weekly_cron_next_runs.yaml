  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left

    WEEK = 7 * 24 * 60


    def _expand(field: str, low: int, high: int) -> list[int]:
        values: set[int] = set()
        for item in field.split(","):
            base, _, step_text = item.partition("/")
            step = int(step_text) if step_text else 1
            if base == "*":
                start, end = low, high
            elif "-" in base:
                start_text, end_text = base.split("-")
                start, end = int(start_text), int(end_text)
            else:
                start = int(base)
                end = high if step_text else start
            values.update(range(start, end + 1, step))
        return sorted(values)


    def weekly_cron_next_runs(expression: str, after_minute: int, count: int) -> list[int]:
        minute_field, hour_field, day_field = expression.split(" ")
        minutes = _expand(minute_field, 0, 59)
        hours = _expand(hour_field, 0, 23)
        days = _expand(day_field, 0, 6)
        # Every matching offset inside one week, ascending (at most 10080 of them).
        offsets = [d * 1440 + h * 60 + m for d in days for h in hours for m in minutes]
        first = after_minute + 1
        week, index = divmod(first, WEEK)
        index = bisect_left(offsets, index)
        result: list[int] = []
        while len(result) < count:
            if index == len(offsets):
                index = 0
                week += 1
            result.append(week * WEEK + offsets[index])
            index += 1
        return result
  javascript: |
    function weeklyCronNextRuns(expression, afterMinute, count) {
      const WEEK = 7 * 24 * 60;
      const expand = (field, low, high) => {
        const values = new Set();
        for (const item of field.split(",")) {
          const [base, stepText] = item.split("/");
          const step = stepText === undefined ? 1 : Number(stepText);
          let start;
          let end;
          if (base === "*") {
            start = low;
            end = high;
          } else if (base.includes("-")) {
            [start, end] = base.split("-").map(Number);
          } else {
            start = Number(base);
            end = stepText === undefined ? start : high;
          }
          for (let v = start; v <= end; v += step) values.add(v);
        }
        return [...values].sort((a, b) => a - b);
      };
      const [minuteField, hourField, dayField] = expression.split(" ");
      const minutes = expand(minuteField, 0, 59);
      const hours = expand(hourField, 0, 23);
      const days = expand(dayField, 0, 6);
      const offsets = [];
      for (const d of days) for (const h of hours) for (const m of minutes) offsets.push(d * 1440 + h * 60 + m);
      const first = afterMinute + 1;
      let week = Math.floor(first / WEEK);
      const target = first - week * WEEK;
      let lo = 0;
      let hi = offsets.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (offsets[mid] < target) lo = mid + 1;
        else hi = mid;
      }
      let index = lo;
      const result = [];
      while (result.length < count) {
        if (index === offsets.length) {
          index = 0;
          week += 1;
        }
        result.push(week * WEEK + offsets[index]);
        index += 1;
      }
      return result;
    }
