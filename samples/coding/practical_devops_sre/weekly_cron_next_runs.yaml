expected_concepts:
  - parsing comma lists, ranges and steps into explicit value sets
  - mapping an absolute minute to day, hour and minute with div and mod
  - exploiting the weekly period to jump instead of scanning minute by minute
  - binary search or field-by-field carry to find the next match
  - 64-bit arithmetic for large minute values
optimal_complexity: {time: "O(10080 + count) per call (or O(count * log) with field-by-field jumps)", space: O(10080)}
rubric:
  excellent: Separates parsing from searching, expands each field into a sorted set including the N/S form, uses the weekly period to jump straight to the next match (precomputed week offsets with binary search, or carrying from minute to hour to day), handles the strict lower bound and week wrap-around, and uses 64-bit values.
  good: Correct parser and next-match logic after hints about the N/S form or about wrapping to the next week.
  weak: Scans minute by minute from a huge start, mis-parses N/S as a single value, includes after_minute itself or overflows 32-bit integers.
  criteria:
    correctness: All tests pass, including the N/S form, overlapping items, exact hits on after_minute and Sunday-to-Monday wrap.
    efficiency: Work is bounded by the size of one week plus the number of results, independent of after_minute.
    code_quality: A small field parser reused for all three fields and a clear next-match routine.
    edge_cases: after_minute of -1, very large after_minute, repeated or overlapping items and single-value fields.
    communication: Explains why the schedule is periodic with a period of one week and how that bounds the search.
hints:
  - Turn each field into the explicit set of values it allows. After that, the schedule is the same every week, so a week contains at most 10080 candidate minutes.
  - Express a matching minute as an offset inside the week plus a whole number of weeks. Find the first offset that is at least the starting point in the current week, and wrap to the start of the next week when you run out.
  - Expand every item (star, single value, range, and the three step forms, remembering that a single value with a step runs up to the field maximum) into sorted sets. Combine them into a sorted list of weekly offsets computed as day times 1440 plus hour times 60 plus minute. Split the first candidate minute (one after the given minute) into a week number and an offset, binary search the offset, then emit results while advancing the index and moving to the next week whenever the index reaches the end.
followups:
  - How would you add day-of-month and month fields, where the period is no longer fixed?
  - How would you handle time zones with daylight-saving transitions for the same expression?
  - How could you compute the previous run before a given minute with the same structure?
common_errors:
  - Treating N/S as just N instead of N, N + S, ... up to the maximum.
  - Returning after_minute itself when it matches, although the result must be strictly later.
  - Scanning one minute at a time, which is far too slow for sparse schedules at large minute values.
  - Forgetting to wrap from Sunday back to Monday of the next week.
