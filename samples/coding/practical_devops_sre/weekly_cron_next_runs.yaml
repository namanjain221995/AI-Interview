role_tags: [devops, platform, sre, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Weekly Cron Next Fire Times

  An internal scheduler uses a trimmed-down cron syntax with three fields separated by single spaces:

  ```
  minute hour day_of_week
  ```

  | field | allowed values |
  |-------|----------------|
  | `minute` | 0 to 59 |
  | `hour` | 0 to 23 |
  | `day_of_week` | 0 to 6, where 0 is Monday and 6 is Sunday |

  Each field is a comma-separated list of items, and the field matches a value if **any** item matches it.
  An item is one of:

  | item | meaning |
  |------|---------|
  | `*` | every allowed value |
  | `N` | exactly `N` |
  | `A-B` | every value from `A` to `B` inclusive (`A <= B`) |
  | `*/S` | every `S`-th value starting at the field's minimum: min, min + S, min + 2S, ... |
  | `A-B/S` | `A`, `A + S`, `A + 2S`, ... while the value is at most `B` |
  | `N/S` | `N`, `N + S`, `N + 2S`, ... up to the field's maximum |

  Time is measured in whole minutes since Monday 00:00 of week 0, and the week repeats forever: at minute
  `t`, the clock shows minute `t mod 60`, hour `(t div 60) mod 24` and day of week `(t div 1440) mod 7`
  (`div` is integer division).

  Return the next `count` minutes that match all three fields and are **strictly greater** than
  `after_minute`, in ascending order. Aim to jump directly to the next possible match instead of
  testing every minute one by one: matches can be up to a week (10080 minutes) apart.

  ### Example 1
  ```
  Input:  expression = "0,30 9-17 0-4", after_minute = 6795, count = 3
  Output: [6810, 10620, 10650]
  Explanation: minutes 0 and 30 of hours 9 to 17, Monday to Friday. 6795 = 4 x 1440 + 17 x 60 + 15
  is Friday 17:15, so the next run is Friday 17:30 (6810), then Monday 09:00 and 09:30 of the
  following week (10080 + 540 and 10080 + 570).
  ```

  ### Example 2
  ```
  Input:  expression = "*/15 */6 6", after_minute = 100, count = 4
  Output: [8640, 8655, 8670, 8685]
  Explanation: minutes 0, 15, 30 and 45 of hours 0, 6, 12 and 18 on Sundays. Sunday starts at
  6 x 1440 = 8640.
  ```

  ### Constraints
  - `expression` is valid: exactly three fields, every number inside its field's range, `A <= B` and
    `S >= 1`; items may overlap or repeat.
  - `-1 <= after_minute <= 10^12`
  - `1 <= count <= 1000`
languages: [python, javascript, typescript, java, go, cpp]
