reference_solutions:
  python: |
    import heapq


    def watermark_window_counts(event_times: list[int], window_seconds: int,
                                allowed_lateness: int) -> list[list[int]]:
        counts: dict[int, int] = {}
        open_starts: list[int] = []  # min-heap of starts of windows with accepted events
        emitted: list[list[int]] = []
        max_seen: int | None = None
        for i, t in enumerate(event_times):
            start = t - t % window_seconds
            watermark = None if max_seen is None else max_seen - allowed_lateness
            if watermark is not None and start + window_seconds <= watermark:
                continue  # late: its window is already closed
            if start not in counts:
                counts[start] = 0
                heapq.heappush(open_starts, start)
            counts[start] += 1
            max_seen = t if max_seen is None else max(max_seen, t)
            watermark = max_seen - allowed_lateness
            while open_starts and open_starts[0] + window_seconds <= watermark:
                s = heapq.heappop(open_starts)
                emitted.append([s, counts.pop(s), i])
        while open_starts:
            s = heapq.heappop(open_starts)
            emitted.append([s, counts.pop(s), len(event_times)])
        return emitted
  javascript: |
    function watermarkWindowCounts(eventTimes, windowSeconds, allowedLateness) {
      const heap = []; // min-heap of window starts that have accepted events
      const push = (v) => {
        heap.push(v);
        let i = heap.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (heap[p] <= heap[i]) break;
          [heap[p], heap[i]] = [heap[i], heap[p]];
          i = p;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && heap[l] < heap[m]) m = l;
            if (r < heap.length && heap[r] < heap[m]) m = r;
            if (m === i) break;
            [heap[m], heap[i]] = [heap[i], heap[m]];
            i = m;
          }
        }
        return top;
      };
      const counts = new Map();
      const emitted = [];
      let maxSeen = null;
      eventTimes.forEach((t, i) => {
        const start = t - (t % windowSeconds);
        if (maxSeen !== null && start + windowSeconds <= maxSeen - allowedLateness) return;
        if (!counts.has(start)) {
          counts.set(start, 0);
          push(start);
        }
        counts.set(start, counts.get(start) + 1);
        maxSeen = maxSeen === null ? t : Math.max(maxSeen, t);
        const watermark = maxSeen - allowedLateness;
        while (heap.length > 0 && heap[0] + windowSeconds <= watermark) {
          const s = pop();
          emitted.push([s, counts.get(s), i]);
          counts.delete(s);
        }
      });
      while (heap.length > 0) {
        const s = pop();
        emitted.push([s, counts.get(s), eventTimes.length]);
        counts.delete(s);
      }
      return emitted;
    }
