title: Late-Event Window Aggregator
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, backend, sre, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Late-Event Window Aggregator

  A metrics pipeline counts events per **tumbling window** of `window_seconds` seconds: window `k`
  covers event times `[k * window_seconds, (k + 1) * window_seconds)`, so its **start** is
  `k * window_seconds` and its **end** is `(k + 1) * window_seconds`. Events arrive over the network
  **out of order**; `event_times[i]` is the event time of the `i`-th event to arrive.

  The pipeline tracks a **watermark**: after it has accepted at least one event, the watermark is
  `max_event_time_accepted - allowed_lateness`; before that there is none. Process the events in
  arrival order. For event `i` with time `t`:

  1. If a watermark exists and the end of `t`'s window is `<=` the current watermark, the window is
     closed: the event is **late** and is dropped (it changes nothing).
  2. Otherwise the event is accepted: its window's count goes up by one, and the watermark is updated.
  3. Then every window that has accepted events, has not been emitted yet and whose end is `<=` the
     watermark is **emitted** as `[window_start, count, i]`, in ascending order of `window_start`.

  After the last event, every window that is still open is emitted in ascending order of start with
  index `n` (the number of events). Windows without accepted events are never emitted.

  Return all emitted records in emission order.

  ### Example 1
  ```
  Input:  event_times = [3, 12, 7, 25, 9, 31, 14, 40], window_seconds = 10, allowed_lateness = 5
  Output: [[0, 2, 3], [10, 1, 3], [20, 1, 7], [30, 1, 8], [40, 1, 8]]
  Explanation: time 7 arrives late but its window [0, 10) is still open (watermark 7), so it counts.
  Event 3 (time 25) moves the watermark to 20 and closes windows [0, 10) and [10, 20).
  Times 9 and 14 are dropped because their windows are closed. Event 7 (time 40) moves the
  watermark to 35 and closes [20, 30); the rest is flushed at the end with index 8.
  ```

  ### Example 2
  ```
  Input:  event_times = [0, 4, 5, 9, 10], window_seconds = 5, allowed_lateness = 0
  Output: [[0, 2, 2], [5, 2, 4], [10, 1, 5]]
  ```

  ### Constraints
  - `1 <= event_times.length <= 10^5`
  - `0 <= event_times[i] <= 10^9`
  - `1 <= window_seconds <= 10^9`
  - `0 <= allowed_lateness <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
