expected_concepts:
  - event time versus arrival order
  - watermark-driven window closing
  - min-heap or ordered map of open windows
  - hash map of per-window counts
  - dropping late data deterministically
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Models open windows with a hash map plus a min-heap (or ordered map), checks lateness against the watermark before updating it, emits closed windows in ascending start order after each event, flushes at the end with index n, and explains why an accepted event's own window can never close immediately.
  good: Correct simulation that scans all open windows after each event (quadratic in the worst case) or needs a hint about the order of the lateness check and the watermark update.
  weak: Uses arrival order instead of event time for windows, updates the watermark from dropped events, emits windows without accepted events, or forgets the final flush.
  criteria:
    correctness: All tests pass, including events exactly on a window boundary, zero lateness, huge lateness and windows that only receive late events.
    efficiency: Each window is pushed and popped once, O(n log n) overall.
    code_quality: Clear separation of the lateness check, the count update and the emission loop.
    edge_cases: A single event, identical times, a window size of one second and very large timestamps.
    communication: Explains the watermark semantics and how allowed lateness trades latency for completeness.
hints:
  - Each event belongs to exactly one window, identified by its start time t - t mod window_seconds. Keep a count per window that is still open.
  - The watermark only moves forward. Decide whether an event is late by comparing its window's end with the watermark before this event, and only then update the watermark with the accepted time.
  - Keep the starts of open windows in a min-heap (or an ordered map) next to a hash map of counts. After each accepted event, pop windows from the heap while start + window_seconds is at most the watermark and emit them with the current index; at the end, pop everything that is left with index n.
followups:
  - How would you emit an updated count when a late event arrives within an extra grace period after the window closed?
  - How would you support sliding windows of 60 seconds that advance every 10 seconds?
  - How would you bound memory if the event stream contains a few events far in the future?
  - How would the design change when events are partitioned across many workers, each with its own watermark?
common_errors:
  - Updating the watermark before checking whether the current event is late.
  - Letting dropped events advance the maximum event time.
  - Emitting windows in insertion order instead of ascending start order.
  - Forgetting to flush the remaining windows with index n.
  - Using floating-point division to compute the window start.
