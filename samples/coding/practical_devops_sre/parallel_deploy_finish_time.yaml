  return_type: int
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def parallel_deploy_finish_time(services: list[str], durations: list[int], dependencies: list[list[str]], workers: int) -> int:
        index = {name: i for i, name in enumerate(services)}
        waiting_on = [0] * len(services)
        unlocks: list[list[int]] = [[] for _ in services]
        for service, needed in dependencies:
            waiting_on[index[service]] += 1
            unlocks[index[needed]].append(index[service])
        ready = [name for i, name in enumerate(services) if waiting_on[i] == 0]
        heapq.heapify(ready)
        running: list[tuple[int, int]] = []  # (finish time, service index)
        now = finished = 0
        while True:
            while running and running[0][0] == now:
                _, done = heapq.heappop(running)
                finished += 1
                for nxt in unlocks[done]:
                    waiting_on[nxt] -= 1
                    if waiting_on[nxt] == 0:
                        heapq.heappush(ready, services[nxt])
            while ready and len(running) < workers:
                name = heapq.heappop(ready)
                heapq.heappush(running, (now + durations[index[name]], index[name]))
            if not running:
                break
            now = running[0][0]
        return now if finished == len(services) else -1
  javascript: |
    class MinHeap {
      constructor(less) {
        this.items = [];
        this.less = less;
      }
      get size() {
        return this.items.length;
      }
      peek() {
        return this.items[0];
      }
      push(value) {
        const a = this.items;
        a.push(value);
        let i = a.length - 1;
        while (i > 0) {
          const p = (i - 1) >> 1;
          if (!this.less(a[i], a[p])) break;
          [a[i], a[p]] = [a[p], a[i]];
          i = p;
        }
      }
      pop() {
        const a = this.items;
        const top = a[0];
        const last = a.pop();
        if (a.length > 0) {
          a[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < a.length && this.less(a[l], a[m])) m = l;
            if (r < a.length && this.less(a[r], a[m])) m = r;
            if (m === i) break;
            [a[i], a[m]] = [a[m], a[i]];
            i = m;
          }
        }
        return top;
      }
    }

    function parallelDeployFinishTime(services, durations, dependencies, workers) {
      const index = new Map(services.map((name, i) => [name, i]));
      const waitingOn = new Array(services.length).fill(0);
      const unlocks = services.map(() => []);
      for (const [service, needed] of dependencies) {
        waitingOn[index.get(service)] += 1;
        unlocks[index.get(needed)].push(index.get(service));
      }
      const ready = new MinHeap((x, y) => x < y);
      services.forEach((name, i) => {
        if (waitingOn[i] === 0) ready.push(name);
      });
      const running = new MinHeap((x, y) => x[0] < y[0]);
      let now = 0;
      let finished = 0;
      for (;;) {
        while (running.size > 0 && running.peek()[0] === now) {
          const [, done] = running.pop();
          finished += 1;
          for (const nxt of unlocks[done]) {
            waitingOn[nxt] -= 1;
            if (waitingOn[nxt] === 0) ready.push(services[nxt]);
          }
        }
        while (ready.size > 0 && running.size < workers) {
          const name = ready.pop();
          const i = index.get(name);
          running.push([now + durations[i], i]);
        }
        if (running.size === 0) break;
        now = running.peek()[0];
      }
      return finished === services.length ? now : -1;
    }
