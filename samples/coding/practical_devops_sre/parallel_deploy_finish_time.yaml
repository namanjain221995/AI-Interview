expected_concepts:
  - topological ordering with in-degree counts (Kahn's algorithm)
  - event-driven simulation with a min-heap of finish times
  - a second min-heap for the ready set ordered by name
  - processing all simultaneous completions before assigning slots
  - cycle detection by counting finished services
optimal_complexity: {time: "O((V + E) log V)", space: O(V + E)}
rubric:
  excellent: Builds in-degree counts and reverse edges, simulates with a heap of running finish times and a heap of ready names, jumps from event to event, processes every completion at the same instant before filling slots, detects cycles when the simulation stalls, and states O((V + E) log V).
  good: Correct simulation with a sorted ready list or a minute-by-minute clock after hints, or with a minor slip in simultaneous completions that is fixed when prompted.
  weak: Ignores the worker limit, computes only the critical path, assigns slots before processing all finishes at the same time, or loops forever on a cycle.
  criteria:
    correctness: All tests pass, including simultaneous completions, more ready services than workers, duplicates and self-dependencies.
    efficiency: Event-driven with heaps instead of advancing the clock one minute at a time.
    code_quality: Clear separation of the completion step and the assignment step; meaningful names for the two heaps.
    edge_cases: A single service, no dependencies, one worker, more workers than services, repeated pairs and cycles.
    communication: Explains why the name-ordered policy can give a later finish than the critical path and how cycles are detected.
hints:
  - Count for every service how many unfinished dependencies it still waits on, and for every service which others it unblocks. Services with a count of zero are ready.
  - Do not advance time minute by minute. Keep the running deployments ordered by finish time and jump straight to the next finish, and keep the ready services ordered by name so the policy can pick the smallest one quickly.
  - Use one min-heap of running pairs of finish time and service, and one min-heap of ready names. At each event time pop every deployment that finishes now, decrement the counts of the services it unblocks and push newly ready names. Then fill idle slots from the ready heap. Stop when nothing is running. If fewer services finished than exist, there was a cycle and the answer is minus one; otherwise it is the last event time.
followups:
  - How would you choose a better policy, for example by preferring services on the longest remaining path?
  - How would you report which services form the cycle?
  - What changes if a failed deployment must be retried once with the same duration?
common_errors:
  - Filling slots before processing every deployment that finishes at the same moment.
  - Returning the critical-path length, which ignores the worker limit and the name-ordered policy.
  - Looping forever or returning a time when a cycle prevents some services from ever starting.
  - Counting a repeated dependency pair once when adding it but twice when releasing it (or the other way round).
