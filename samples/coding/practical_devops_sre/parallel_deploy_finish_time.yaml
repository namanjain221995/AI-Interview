version: 1
slug: parallel_deploy_finish_time
title: Parallel Rollout Simulator
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, platform, sre]
time_limit_minutes: 35
prompt_markdown: |
  ## Parallel Rollout Simulator

  A release train deploys a set of microservices. Service `services[i]` takes `durations[i]` minutes to
  deploy. Each pair `[a, b]` in `dependencies` means service `a` may only **start** after service `b` has
  **finished**. The deploy tool has `workers` slots, and each slot deploys one service at a time without
  interruption.

  The tool follows this exact policy:

  1. A service is **ready** when all of its dependencies have finished and it has not started yet.
  2. At time `0`, and afterwards at every moment when at least one running deployment finishes, the tool
     first marks **all** deployments finishing at that moment as finished (which can make new services
     ready). Then, while there is an idle slot and a ready service, it starts the ready service whose name
     is **smallest in ASCII order**.
  3. Nothing else happens between those moments.

  Return the time at which the last service finishes. If the dependencies contain a cycle, some services
  can never become ready: return `-1` in that case.

  ### Example 1
  ```
  Input:  services = ["web", "api", "db", "cache", "auth"],
          durations = [1, 4, 4, 2, 3],
          dependencies = [["web", "api"], ["web", "db"], ["api", "auth"]],
          workers = 2
  Output: 8
  Explanation: at 0, auth, cache and db are ready and the two slots take auth and cache (smallest
  names). cache finishes at 2 and db takes its slot (2 to 6). auth finishes at 3, which makes api
  ready, and api takes the freed slot (3 to 7). web needs both api and db, so it starts at 7 and
  finishes at 8.
  ```

  ### Example 2
  ```
  Input:  services = ["a", "b", "c", "d"],
          durations = [1, 1, 1, 5],
          dependencies = [["a", "c"], ["c", "b"], ["b", "a"]],
          workers = 2
  Output: -1
  Explanation: a needs c, c needs b and b needs a, so none of them can ever start.
  ```

  ### Constraints
  - `1 <= services.length <= 10^4`; names are distinct and use lowercase letters, digits and `-`
  - `1 <= durations[i] <= 10^4`
  - `0 <= dependencies.length <= 5 * 10^4`; both names of every pair are in `services`, and a pair may
    repeat (a pair `[a, a]` is a cycle)
  - `1 <= workers <= 100`
languages: [python, javascript, typescript, java, go, cpp]
