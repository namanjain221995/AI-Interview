signature:
  function_name: autoscaler_replica_timeline
  params:
    - {name: demand_millicores, type: "int[]"}
    - {name: target_per_replica, type: int}
    - {name: min_replicas, type: int}
    - {name: max_replicas, type: int}
    - {name: max_scale_up, type: int}
    - {name: stabilization_minutes, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def autoscaler_replica_timeline(demand_millicores: list[int], target_per_replica: int,
                                    min_replicas: int, max_replicas: int, max_scale_up: int,
                                    stabilization_minutes: int) -> list[int]:
        current = min_replicas
        window: deque[tuple[int, int]] = deque()  # (minute, desired), desired strictly decreasing
        result: list[int] = []
        for minute, demand in enumerate(demand_millicores):
            desired = -(-demand // target_per_replica)
            desired = max(min_replicas, min(max_replicas, desired))
            while window and window[-1][1] <= desired:
                window.pop()
            window.append((minute, desired))
            while window[0][0] <= minute - stabilization_minutes:
                window.popleft()
            if desired > current:
                current = min(desired, current + max_scale_up)
            else:
                current = min(current, window[0][1])
            result.append(current)
        return result
  javascript: |
    function autoscalerReplicaTimeline(demandMillicores, targetPerReplica, minReplicas, maxReplicas,
                                       maxScaleUp, stabilizationMinutes) {
      const n = demandMillicores.length;
      const idx = new Array(n);
      const val = new Array(n);
      let head = 0;
      let tail = 0;
      let current = minReplicas;
      const result = [];
      for (let minute = 0; minute < n; minute++) {
        const demand = demandMillicores[minute];
        let desired = Math.floor(demand / targetPerReplica);
        if (desired * targetPerReplica < demand) desired++;
        desired = Math.max(minReplicas, Math.min(maxReplicas, desired));
        while (tail > head && val[tail - 1] <= desired) tail--;
        idx[tail] = minute;
        val[tail] = desired;
        tail++;
        while (idx[head] <= minute - stabilizationMinutes) head++;
        if (desired > current) {
          current = Math.min(desired, current + maxScaleUp);
        } else {
          current = Math.min(current, val[head]);
        }
        result.push(current);
      }
      return result;
    }
