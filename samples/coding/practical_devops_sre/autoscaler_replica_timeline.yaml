slug: autoscaler_replica_timeline
title: Autoscaler Replica Replay
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [platform, sre, cloud, devops]
time_limit_minutes: 35
prompt_markdown: |
  ## Autoscaler Replica Replay

  After an incident, the platform team wants to replay a day of CPU demand through the horizontal
  autoscaler's rules to see how many replicas a service would have run each minute. You receive the
  total CPU demand of the service for every minute, `demand_millicores[i]`, and the autoscaler settings.
  `target_per_replica` is the demand (in millicores) one replica should serve at the target utilisation.

  The service starts with `min_replicas` replicas. For minute `i`:

  1. The **raw desired** count is `ceil(demand_millicores[i] / target_per_replica)` (exact integer
     ceiling division).
  2. The **desired** count `desired[i]` is the raw desired count clamped to `[min_replicas, max_replicas]`.
  3. Let `current` be the replica count after the previous minute (`min_replicas` before minute 0).
     - **Scale up:** if `desired[i] > current`, the new count is `min(desired[i], current + max_scale_up)`.
     - **Scale down (stabilised):** otherwise, the new count is `min(current, recent_peak)`, where
       `recent_peak` is the largest `desired` value over the last `stabilization_minutes` minutes,
       **including minute `i`** (minutes `max(0, i - stabilization_minutes + 1)` to `i`).

  Return an array with the replica count after every minute, in minute order.

  ### Example 1
  ```
  Input:  demand_millicores = [600, 1800, 2600, 900, 400, 300, 300, 250], target_per_replica = 250,
          min_replicas = 2, max_replicas = 10, max_scale_up = 3, stabilization_minutes = 3
  Output: [3, 6, 9, 9, 9, 4, 2, 2]
  Explanation: desired = [3, 8, 10, 4, 2, 2, 2, 2]
  (minute 2 asks for 11, clamped to 10). Scale-ups are limited to +3 per minute: 2 -> 3 -> 6 -> 9.
  At minutes 3 and 4 the peak of the last three desired values is still 10, so the count stays 9.
  At minute 5 the window holds [4, 2, 2], so the count drops to 4, then to 2.
  ```

  ### Example 2
  ```
  Input:  demand_millicores = [1000, 200, 200, 3000, 3000, 200], target_per_replica = 400,
          min_replicas = 1, max_replicas = 6, max_scale_up = 10, stabilization_minutes = 1
  Output: [3, 1, 1, 6, 6, 1]
  Explanation: with a one-minute window the service scales down immediately; 3000 millicores
  would need 8 replicas but max_replicas caps the desired count at 6.
  ```

  ### Constraints
  - `1 <= demand_millicores.length <= 10^5`
  - `0 <= demand_millicores[i] <= 10^9`
  - `1 <= target_per_replica <= 10^6`
  - `1 <= min_replicas <= max_replicas <= 10^4`
  - `1 <= max_scale_up <= 10^4`
  - `1 <= stabilization_minutes <= 10^5` (it may be longer than the replay)

  **Follow-up:** recomputing the window maximum from scratch each minute costs
  `O(n * stabilization_minutes)`. Can you make the whole replay `O(n)`?
