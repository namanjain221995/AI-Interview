expected_concepts:
  - sliding window maximum with a monotonic deque
  - simulation with asymmetric scale-up and scale-down rules
  - integer ceiling division without floating point
  - clamping to configured bounds before windowing
  - O(n) amortised time
optimal_complexity: {time: O(n), space: "O(min(n, stabilization_minutes))"}
rubric:
  excellent: Separates the desired-count computation from the scaling decision, uses a monotonic deque for the stabilisation peak in O(n) total, uses exact integer ceiling division, and explains why the stored values must be the clamped desired counts.
  good: Correct simulation with a straightforward window maximum (O(n * stabilization_minutes)) or a heap, and can describe the deque improvement when prompted.
  weak: Uses floating-point ceiling that is off at exact multiples, takes the window maximum over replica counts instead of desired counts, ignores the scale-up step limit or excludes the current minute from the window.
  criteria:
    correctness: All tests pass, including exact multiples, clamping at both bounds, a window longer than the replay and a one-minute window.
    efficiency: Linear time with a monotonic deque; extra memory bounded by the window length.
    code_quality: Clear names for desired, current and the window, with the two scaling branches easy to read.
    edge_cases: Zero demand, min equal to max, huge scale-up limits and spikes that return inside the stabilisation window.
    communication: Explains the deque invariant (indices increasing, values strictly decreasing) and why each minute is pushed and popped at most once.
hints:
  - Compute each minute's clamped desired count first; the scaling decision then only needs that value, the current count and the largest desired value in a trailing window.
  - The trailing-window maximum is the expensive part. Keep a structure of candidate minutes where an older minute is useless as soon as a newer minute has a desired value at least as large.
  - Use a deque of (minute, desired) whose desired values strictly decrease from front to back. Before pushing the new minute, pop smaller-or-equal values from the back; then drop the front while it is older than the window. The front is the recent peak, and you take the minimum of it and the current count when not scaling up.
followups:
  - How would you add a scale-down rate limit (at most k replicas removed per minute) on top of the stabilisation window?
  - Real autoscalers evaluate every 15 seconds but receive metrics every minute. How would you replay that?
  - How would you replay many services with different settings in parallel over the same demand data?
  - What changes if the window is defined in seconds and samples arrive at irregular times?
common_errors:
  - Using floating-point division and ceil, which can overshoot by one at exact multiples or with large values.
  - Keeping the maximum of replica counts in the window instead of the maximum of desired counts.
  - Forgetting that the current minute belongs to the stabilisation window.
  - Applying the scale-up limit when scaling down, or clamping after the scale-up step instead of before.
  - Recomputing max(desired[i - w + 1 .. i]) from scratch each minute on long replays.
