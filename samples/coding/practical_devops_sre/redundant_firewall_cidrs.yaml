slug: redundant_firewall_cidrs
title: "Redundant Firewall Rules"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, security, cloud, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Redundant Firewall Rules

  A security team is cleaning up an edge firewall's allow-list. Each rule allows one IPv4 network written
  in CIDR notation `a.b.c.d/p` (`0 <= p <= 32`): the rule covers every address whose first `p` bits equal
  the first `p` bits of `a.b.c.d`. Rules are typed by hand, so bits after the prefix may be set:
  `10.1.2.3/16` covers exactly the same addresses as `10.1.0.0/16`. A `/0` rule covers every address.

  A rule is **redundant** when every address it covers is also covered by **one single other rule** in
  the list:

  - if the other rule covers strictly more addresses, the smaller rule is redundant whatever their order;
  - if two or more rules cover **exactly the same** addresses, the one that appears **first** is kept and
    every later copy is redundant.

  A rule that is only covered by the **union** of several smaller rules is not redundant.

  Return the indices (0-based) of all redundant rules in **ascending** order, or an empty list if there are
  none. The list can be long, so aim for better than comparing every pair of rules.

  ### Example 1
  ```
  Input:  cidrs = ["10.0.0.0/8", "10.1.2.0/24", "192.168.1.0/24", "10.1.0.0/16"]
  Output: [1, 3]
  Explanation: 10.1.2.0/24 and 10.1.0.0/16 both sit inside 10.0.0.0/8.
  ```

  ### Example 2
  ```
  Input:  cidrs = ["172.16.5.9/16", "172.16.0.0/16", "172.17.0.0/16"]
  Output: [1]
  Explanation: the first rule is 172.16.0.0/16 once host bits are cleared, so rule 1 is a later copy.
  ```

  ### Example 3
  ```
  Input:  cidrs = ["10.0.0.0/25", "10.0.0.128/25", "10.0.0.7/32"]
  Output: [2]
  Explanation: the two /25 rules together cover 10.0.0.0/24, but neither covers the other.
  ```

  ### Constraints
  - `0 <= cidrs.length <= 10^5`
  - Every entry is a valid `a.b.c.d/p` with each octet in `0..255` (no leading zeros) and `0 <= p <= 32`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: redundant_firewall_cidrs
  params:
    - {name: cidrs, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def redundant_firewall_cidrs(cidrs: list[str]) -> list[int]:
        blocks = []
        for index, cidr in enumerate(cidrs):
            address, prefix = cidr.split("/")
            value = 0
            for part in address.split("."):
                value = value * 256 + int(part)
            size = 2 ** (32 - int(prefix))
            start = value - value % size
            blocks.append((start, -(start + size - 1), index))
        blocks.sort()
        redundant = []
        furthest_end = -1
        for start, negative_end, index in blocks:
            end = -negative_end
            if end <= furthest_end:
                redundant.append(index)
            else:
                furthest_end = end
        return sorted(redundant)
  javascript: |
    function redundantFirewallCidrs(cidrs) {
      const blocks = cidrs.map((cidr, index) => {
        const [address, prefix] = cidr.split("/");
        let value = 0;
        for (const part of address.split(".")) value = value * 256 + Number(part);
        const size = 2 ** (32 - Number(prefix));
        const start = value - (value % size);
        return { start, end: start + size - 1, index };
      });
      blocks.sort((a, b) => a.start - b.start || b.end - a.end || a.index - b.index);
      const redundant = [];
      let furthestEnd = -1;
      for (const block of blocks) {
        if (block.end <= furthestEnd) redundant.push(block.index);
        else furthestEnd = block.end;
      }
      return redundant.sort((a, b) => a - b);
    }
