expected_concepts:
  - "parsing dotted-quad addresses into 32-bit integers"
  - "masking host bits to get the network range"
  - "CIDR blocks are either nested or disjoint"
  - "sort by start ascending and end descending, then sweep"
  - "deterministic tie-breaking for identical ranges"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Converts each rule to an integer range with host bits cleared, sorts by start ascending, size descending and index ascending, sweeps once keeping the furthest end seen, handles identical ranges via the index tie-break, and explains why the sweep is correct."
  good: "Correct O(n^2) containment check with clean parsing, or the sort and sweep with a small tie-breaking bug fixed after a hint."
  weak: "Compares CIDR strings textually, ignores host bits, treats identical rules as both redundant or both kept, or overflows on 32-bit signed arithmetic."
  criteria:
    correctness: "All tests pass, including duplicates, host bits, /0 and /32."
    efficiency: "Sorting and a single sweep; no pairwise comparison on large inputs."
    code_quality: "Address parsing and range computation live in a small helper; the sort key is explicit."
    edge_cases: "Empty list, identical rules, /0 rules, the top of the address space and adjacent blocks."
    communication: "Explains the nested-or-disjoint property and the tie-break order."
hints:
  - "Turn each rule into the numeric range of addresses it covers, so containment becomes a comparison of two numbers at each end."
  - "If you sort the ranges by their start, a range can only be contained in one that came before it in that order; think about what to put first when two ranges start at the same address."
  - "Sort by start ascending, then by end descending, then by original index ascending, and sweep while remembering the largest end seen so far; a range whose end does not go past that largest end is redundant, and identical ranges are handled because the earliest index sorts first."
followups:
  - "How would you also report, for each redundant rule, which rule covers it?"
  - "How would you merge adjacent blocks such as two /25s into a /24 to shorten the list further?"
  - "How would deny rules interleaved with allow rules change what counts as redundant?"
common_errors:
  - "Comparing CIDR strings by text prefix, which treats 10.1.0.0/16 and 10.10.0.0/16 as related."
  - "Forgetting to clear host bits, so 172.16.5.9/16 is not recognised as 172.16.0.0/16."
  - "Using signed 32-bit shifts, which turn addresses above 127.255.255.255 negative."
  - "Marking every copy of an identical rule as redundant instead of keeping the first."
