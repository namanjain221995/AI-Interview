reference_solutions:
  python: |
    def gfs_backup_retention(backup_days: list[int], keep_daily: int, keep_weekly: int, keep_monthly: int) -> list[int]:
        days = sorted(set(backup_days), reverse=True)
        kept = set(days[:keep_daily])
        for period, limit in ((7, keep_weekly), (30, keep_monthly)):
            seen: set[int] = set()
            for day in days:
                if len(seen) >= limit:
                    break
                bucket = day // period
                if bucket not in seen:
                    # days are scanned newest first, so this is the newest day of its bucket
                    seen.add(bucket)
                    kept.add(day)
        return sorted(kept)
  javascript: |
    function gfsBackupRetention(backupDays, keepDaily, keepWeekly, keepMonthly) {
      const days = [...new Set(backupDays)].sort((a, b) => b - a);
      const kept = new Set(days.slice(0, keepDaily));
      for (const [period, limit] of [[7, keepWeekly], [30, keepMonthly]]) {
        const seen = new Set();
        for (const day of days) {
          if (seen.size >= limit) break;
          const bucket = Math.floor(day / period);
          if (!seen.has(bucket)) {
            seen.add(bucket);
            kept.add(day);
          }
        }
      }
      return [...kept].sort((a, b) => a - b);
    }
