prompt_markdown: |
  ## Grandfather-Father-Son Backup Pruning

  A database team stores nightly snapshots and prunes them with a **grandfather-father-son** policy.
  Each snapshot is identified by the day it was taken, a day number counted from an epoch
  (`backup_days[i]`). The list is in no particular order and the same day can appear more than once
  (a retried job); all snapshots of one day count as a single backup day.

  Calendar buckets are simplified: the **week** of day `d` is `d // 7` and its **month** is `d // 30`
  (integer division).

  A backup day is **kept** when at least one of these rules selects it:

  1. **Daily:** it is one of the `keep_daily` most recent (largest) distinct backup days.
  2. **Weekly:** take the `keep_weekly` most recent weeks that contain at least one backup day; in each
     of those weeks, the most recent backup day is kept.
  3. **Monthly:** the same as the weekly rule, using months and `keep_monthly`.

  If a rule asks for more days, weeks or months than exist, it simply keeps all that exist. A count of
  `0` disables that rule. Return the kept days **without duplicates in ascending order**; return an
  empty list when nothing is kept.

  ### Example 1
  ```
  Input:  backup_days = [3, 10, 11, 12, 20, 33, 34, 34, 40, 41],
          keep_daily = 3,
          keep_weekly = 2,
          keep_monthly = 2
  Output: [20, 34, 40, 41]
  Explanation: the 3 newest days are 41, 40 and 34. The 2 newest weeks with backups are week 5
  (days 40 and 41, keep 41) and week 4 (days 33 and 34, keep 34). The 2 newest months are month 1
  (newest day 41) and month 0 (newest day 20). The union is [20, 34, 40, 41].
  ```

  ### Example 2
  ```
  Input:  backup_days = [0, 5, 6, 7, 13, 14], keep_daily = 0, keep_weekly = 3, keep_monthly = 1
  Output: [6, 13, 14]
  Explanation: no daily backups are kept. Weeks 2, 1 and 0 keep days 14, 13 and 6; month 0 keeps 14.
  ```

  ### Constraints
  - `0 <= backup_days.length <= 10^5`
  - `0 <= backup_days[i] <= 10^9`
  - `0 <= keep_daily, keep_weekly, keep_monthly <= 10^5`
