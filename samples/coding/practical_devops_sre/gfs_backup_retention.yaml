expected_concepts:
  - deduplicating days with a set
  - sorting newest first
  - bucketing by integer division
  - taking the first day seen per bucket while scanning newest first
  - union of the rule results then ascending sort
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Deduplicates and sorts newest first once, applies each rule as a single scan that keeps the first day of each new bucket until the limit is reached, unions the results in a set and returns them sorted, with O(n log n) clearly argued.
  good: Correct result with a less direct structure, for example grouping into maps of bucket to newest day and sorting the buckets, or a small fix after the duplicate test.
  weak: Counts duplicate snapshots as separate days, keeps the oldest day of a bucket, counts empty weeks toward the limit, or returns duplicates or unsorted output.
  criteria:
    correctness: All tests pass, including duplicates, disabled rules and counts larger than available.
    efficiency: One sort plus linear scans; no rescanning of the whole list per bucket.
    code_quality: The weekly and monthly rules share one helper or loop parameterised by the period.
    edge_cases: Empty input, zero counts, boundary days such as 6 and 7 or 29 and 30, very large day numbers.
    communication: Explains why scanning newest first makes the first day seen in a bucket its newest day.
hints:
  - Start by removing duplicate days and ordering them from newest to oldest; every rule is easier on that list.
  - The weekly and monthly rules are the same rule with a different bucket size, and the newest day of a bucket is the first one you meet when scanning newest first.
  - Sort the distinct days in descending order, take the first keep_daily of them, then for each bucket size scan the list keeping a set of buckets already used and add a day whenever its bucket is new, stopping once the set reaches the limit; finally return the union sorted ascending.
followups:
  - How would you also report which rule kept each backup so operators can audit the policy?
  - How would you switch to real calendar months and ISO weeks, and what would you test?
  - If snapshots arrive one per night, how could you prune incrementally instead of recomputing everything?
  - How would you add a yearly rule without duplicating code?
common_errors:
  - Treating two snapshots taken on the same day as two separate backup days.
  - Keeping the oldest day of a week or month instead of the newest.
  - Counting calendar weeks that have no backups toward keep_weekly.
  - Returning the kept days with duplicates or in descending order.
