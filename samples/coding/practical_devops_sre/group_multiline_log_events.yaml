slug: group_multiline_log_events
title: Stack Trace Line Grouping
difficulty: easy
competency_keys: [code_quality, problem_solving]
role_tags: [sre, backend, support_engineer, devops]
time_limit_minutes: 12
prompt_markdown: |
  ## Stack Trace Line Grouping

  A log shipper forwards application logs to a search cluster one record per line, which splits every
  exception across dozens of records. Configure the grouping yourself: rebuild the multi-line events
  from the raw lines.

  - A line is a **continuation** line if it starts with a space or a tab character, or if it starts with
    the exact text `Caused by:` (case-sensitive).
  - Every other line **starts a new event**.
  - An event consists of its start line followed by all continuation lines up to the next start line.

  Return the events in their original order. Each event is a single string: the start line unchanged,
  followed by each of its continuation lines with **leading** spaces and tabs removed, all joined with
  `" | "` (space, vertical bar, space). Continuation lines that appear before the first start line
  belong to an event that began before the log was captured; discard them.

  In the examples, `\t` inside a string stands for a tab character.

  ### Example 1
  ```
  Input:  lines = ["10:00:01 INFO request served", "10:00:02 ERROR payment failed", "    at billing.charge(Billing.java:42)", "Caused by: SocketTimeoutException: read timed out", "\tat net.Socket.read(Socket.java:88)", "10:00:03 INFO retry scheduled"]
  Output: ["10:00:01 INFO request served", "10:00:02 ERROR payment failed | at billing.charge(Billing.java:42) | Caused by: SocketTimeoutException: read timed out | at net.Socket.read(Socket.java:88)", "10:00:03 INFO retry scheduled"]
  ```

  ### Example 2
  ```
  Input:  lines = ["  at orphan.frame(Job.java:7)", "Caused by: stale state", "boot complete", "ready"]
  Output: ["boot complete", "ready"]
  ```

  ### Constraints
  - `0 <= lines.length <= 10^4`
  - Each line has 1 to 300 characters and contains at least one character that is not a space or tab.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: group_multiline_log_events
  params:
    - {name: lines, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def group_multiline_log_events(lines: list[str]) -> list[str]:
        events: list[list[str]] = []
        for line in lines:
            is_continuation = line[0] in " \t" or line.startswith("Caused by:")
            if not is_continuation:
                events.append([line])
            elif events:  # orphans before the first start line are dropped
                events[-1].append(line.lstrip(" \t"))
        return [" | ".join(parts) for parts in events]
  javascript: |
    function groupMultilineLogEvents(lines) {
      const events = [];
      for (const line of lines) {
        const isContinuation = line[0] === " " || line[0] === "\t" || line.startsWith("Caused by:");
        if (!isContinuation) {
          events.push([line]);
        } else if (events.length > 0) {
          events[events.length - 1].push(line.replace(/^[ \t]+/, ""));
        }
      }
      return events.map((parts) => parts.join(" | "));
    }
