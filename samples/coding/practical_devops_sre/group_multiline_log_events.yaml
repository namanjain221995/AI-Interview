expected_concepts:
  - "single-pass grouping with a current-event accumulator"
  - "precise line classification rules (leading whitespace, prefix match)"
  - "trimming only leading whitespace"
  - "handling orphan lines before the first event"
optimal_complexity: {time: "O(total characters)", space: "O(total characters) for the output"}
rubric:
  excellent: "Classifies each line with a small predicate, accumulates the current event and flushes on each start line, drops orphan continuations, trims only leading spaces and tabs, and joins with the exact separator."
  good: "Correct grouping after fixing one detail such as trailing-space trimming, the orphan rule or the case-sensitive cause marker."
  weak: "Trims all whitespace, treats 'Caused by:' as a new event, attaches orphans to a later event, or loses the last event at the end of input."
  criteria:
    correctness: "All tests pass, including orphans, mixed indentation and look-alike cause markers."
    efficiency: "One pass over the lines with linear-size output; no repeated string concatenation in a quadratic pattern."
    code_quality: "A named continuation predicate and a clear accumulate-then-join structure."
    edge_cases: "Empty input, only continuation lines, lowercase or colon-less cause text and inner whitespace."
    communication: "Restates the classification rules and how the final event is emitted."
hints:
  - "Process the lines in order and decide, for each line, whether it begins something new or belongs to what came before."
  - "Keep the event currently being built. A start line opens a new one; a continuation line is added to the open event, and if there is no open event yet it has nowhere to go."
  - "Keep a list of events, each a list of parts. For a line that does not begin with a space or tab and does not begin with the exact cause marker, append a new event holding that line. Otherwise, if any event exists, append the line with only its leading spaces and tabs removed to the latest event. Finally join each event's parts with space, bar, space."
followups:
  - "How would you make the continuation rule configurable, for example with a regular expression per application?"
  - "In a streaming shipper, when would you flush an event if the next start line never arrives?"
  - "How would you cap the size of a single event to protect the search cluster?"
  - "How would you handle interleaved output from two threads writing to the same log?"
common_errors:
  - "Trimming trailing or inner whitespace instead of only the leading indentation."
  - "Treating 'Caused by:' lines as new events because they are not indented."
  - "Attaching orphan continuation lines to the first real event."
  - "Matching the cause marker case-insensitively or without the colon."
