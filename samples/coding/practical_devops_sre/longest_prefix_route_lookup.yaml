version: 1
slug: longest_prefix_route_lookup
title: "Routing Table Lookup"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [network, cloud, platform, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Routing Table Lookup

  A software router forwards packets using a routing table. Route `i` sends traffic for the IPv4
  network `route_cidrs[i]` to the next hop `next_hops[i]`. Networks use CIDR notation `a.b.c.d/p`
  (`0 <= p <= 32`): a route matches an address when the first `p` bits of the address equal the first `p`
  bits of `a.b.c.d`. Bits after the prefix may be set by mistake and are ignored, so `10.9.9.9/16` is the
  route for `10.9.0.0/16`. The **default route** is written `0.0.0.0/0` and matches every address.

  For each address in `destinations`, pick the matching route with the **longest prefix length** and
  return its next hop. Rules:

  - If the table contains the same network with the same prefix length more than once (after ignoring
    host bits), the entry that appears **later** in the table replaces the earlier one.
  - If no route matches, the answer for that destination is `"unreachable"`.

  Return one next hop per destination, in the order of `destinations`. The table and the batch of
  destinations can both be large, so checking every route for every destination is too slow.

  ### Example 1
  ```
  Input:  route_cidrs  = ["10.0.0.0/8", "10.20.0.0/16", "10.20.30.0/24", "0.0.0.0/0"]
          next_hops    = ["core", "dc-east", "rack-30", "internet"]
          destinations = ["10.20.30.40", "10.20.99.1", "10.99.0.1", "8.8.8.8"]
  Output: ["rack-30", "dc-east", "core", "internet"]
  ```

  ### Example 2
  ```
  Input:  route_cidrs  = ["192.168.1.77/24", "192.168.1.0/24", "192.168.1.128/25"]
          next_hops    = ["old-gw", "new-gw", "dmz"]
          destinations = ["192.168.1.5", "192.168.1.200", "192.168.2.1"]
  Output: ["new-gw", "dmz", "unreachable"]
  Explanation: the first two routes are the same /24 network, so the later entry (new-gw) wins.
  192.168.2.1 matches nothing and there is no default route.
  ```

  ### Constraints
  - `0 <= route_cidrs.length == next_hops.length <= 10^5`
  - `0 <= destinations.length <= 10^5`
  - Every route is a valid `a.b.c.d/p` and every destination a valid `a.b.c.d` (octets `0..255`, no leading
    zeros).
  - Next hops are non-empty strings and are never `"unreachable"`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_prefix_route_lookup
  params:
    - {name: route_cidrs, type: "string[]"}
    - {name: next_hops, type: "string[]"}
    - {name: destinations, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def longest_prefix_route_lookup(route_cidrs: list[str], next_hops: list[str], destinations: list[str]) -> list[str]:
        def to_int(address: str) -> int:
            value = 0
            for part in address.split("."):
                value = value * 256 + int(part)
            return value

        tables: dict[int, dict[int, str]] = {}
        for cidr, hop in zip(route_cidrs, next_hops):
            address, prefix = cidr.split("/")
            length = int(prefix)
            network = to_int(address) >> (32 - length)
            tables.setdefault(length, {})[network] = hop
        lengths = sorted(tables, reverse=True)

        result = []
        for destination in destinations:
            value = to_int(destination)
            hop = "unreachable"
            for length in lengths:
                found = tables[length].get(value >> (32 - length))
                if found is not None:
                    hop = found
                    break
            result.append(hop)
        return result
  javascript: |
    function longestPrefixRouteLookup(routeCidrs, nextHops, destinations) {
      const toInt = (address) => address.split(".").reduce((acc, part) => acc * 256 + Number(part), 0);
      const tables = new Map();
      routeCidrs.forEach((cidr, i) => {
        const [address, prefix] = cidr.split("/");
        const length = Number(prefix);
        const network = Math.floor(toInt(address) / 2 ** (32 - length));
        if (!tables.has(length)) tables.set(length, new Map());
        tables.get(length).set(network, nextHops[i]);
      });
      const lengths = [...tables.keys()].sort((a, b) => b - a);
      return destinations.map((destination) => {
        const value = toInt(destination);
        for (const length of lengths) {
          const hop = tables.get(length).get(Math.floor(value / 2 ** (32 - length)));
          if (hop !== undefined) return hop;
        }
        return "unreachable";
      });
    }
