expected_concepts:
  - "parsing IPv4 addresses into 32-bit integers"
  - "masking or shifting to the network prefix"
  - "hash map per prefix length or a binary trie"
  - "checking prefix lengths from longest to shortest"
  - "last-write-wins for duplicate routes"
optimal_complexity: {time: "O((R + D) * 33) with one hash map per prefix length, or O(R * 32 + D * 32) with a binary trie", space: "O(R)"}
rubric:
  excellent: "Normalises each route to its network, builds one hash map per prefix length (or a binary trie) with later entries overwriting earlier ones, probes the populated lengths from longest to shortest for each destination, and explains why this beats scanning every route."
  good: "Correct results with a per-destination scan of all routes, or the per-length table with a small bug (duplicate handling or /0) fixed after a hint."
  weak: "Matches routes by string prefix, ignores host bits, lets the first duplicate win, or breaks on addresses above 127.255.255.255."
  criteria:
    correctness: "All tests pass, including duplicates, /0, /32 and high addresses."
    efficiency: "Each lookup costs at most 33 hash probes or 32 trie steps, independent of the table size."
    code_quality: "Address parsing and network computation are shared helpers; the table structure is clearly named."
    edge_cases: "Empty table, empty batch, default route, host bits and the top of the address space."
    communication: "Explains the longest-match rule, the duplicate rule and the chosen data structure's trade-offs."
hints:
  - "Convert addresses to numbers. Two addresses share a prefix of length p exactly when they agree after dropping their last 32 minus p bits."
  - "Group the routes by prefix length and index each group by its network number, so that checking whether some route of a given length matches an address is a single lookup."
  - "Build a map from prefix length to a map from network number to next hop, inserting routes in table order so later duplicates overwrite earlier ones; for each destination try the lengths present in the table from the longest down to zero and return the first hit, or unreachable if none hits. A binary trie over the address bits works too."
followups:
  - "How would you support adding and withdrawing routes while lookups keep running?"
  - "How does a compressed trie (as used by real routers) reduce memory compared with a plain binary trie?"
  - "How would you extend the design to IPv6 addresses?"
common_errors:
  - "Comparing addresses as strings, so 10.1.0.0/16 seems to match 10.10.1.1."
  - "Shifting by 32 for a /0 route, which is undefined or a no-op in several languages."
  - "Using signed 32-bit integers, which makes addresses from 128.0.0.0 upward negative."
  - "Keeping the first of two duplicate routes instead of the later one."
