reference_solutions:
  python: |
    def span_self_time_by_service(span_ids: list[str], parent_ids: list[str], services: list[str],
                                  starts: list[int], ends: list[int]) -> list[str]:
        children: dict[str, list[int]] = {}
        for i, parent in enumerate(parent_ids):
            if parent:
                children.setdefault(parent, []).append(i)
        totals: dict[str, int] = {}
        for i, span_id in enumerate(span_ids):
            lo, hi = starts[i], ends[i]
            clipped = []
            for c in children.get(span_id, []):
                a, b = max(lo, starts[c]), min(hi, ends[c])
                if a < b:
                    clipped.append((a, b))
            clipped.sort()
            covered = 0
            cur_a = cur_b = None
            for a, b in clipped:
                if cur_b is None or a > cur_b:
                    if cur_b is not None:
                        covered += cur_b - cur_a
                    cur_a, cur_b = a, b
                else:
                    cur_b = max(cur_b, b)
            if cur_b is not None:
                covered += cur_b - cur_a
            totals[services[i]] = totals.get(services[i], 0) + (hi - lo) - covered
        ranked = sorted(totals.items(), key=lambda item: (-item[1], item[0]))
        return [f"{service}={total}" for service, total in ranked]
  javascript: |
    function spanSelfTimeByService(spanIds, parentIds, services, starts, ends) {
      const children = new Map();
      parentIds.forEach((parent, i) => {
        if (parent === "") return;
        if (!children.has(parent)) children.set(parent, []);
        children.get(parent).push(i);
      });
      const totals = new Map();
      spanIds.forEach((spanId, i) => {
        const lo = starts[i];
        const hi = ends[i];
        const clipped = [];
        for (const c of children.get(spanId) || []) {
          const a = Math.max(lo, starts[c]);
          const b = Math.min(hi, ends[c]);
          if (a < b) clipped.push([a, b]);
        }
        clipped.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
        let covered = 0;
        let curA = null;
        let curB = null;
        for (const [a, b] of clipped) {
          if (curB === null || a > curB) {
            if (curB !== null) covered += curB - curA;
            curA = a;
            curB = b;
          } else {
            curB = Math.max(curB, b);
          }
        }
        if (curB !== null) covered += curB - curA;
        totals.set(services[i], (totals.get(services[i]) || 0) + (hi - lo) - covered);
      });
      const ranked = [...totals.entries()].sort((x, y) => {
        if (x[1] !== y[1]) return y[1] - x[1];
        return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : 0;
      });
      return ranked.map(([service, total]) => `${service}=${total}`);
    }
