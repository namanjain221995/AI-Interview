expected_concepts:
  - grouping children by parent id with a hash map
  - clipping intervals to a parent's range
  - union length of overlapping intervals (sort and merge)
  - aggregating per key and sorting with a tie-breaker
  - robustness to clock skew and missing parents
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Builds a parent-to-children index in one pass, clips each child to the parent's interval, merges the sorted clipped intervals to get the covered length, aggregates per service with 64-bit totals, and explains why only direct children are subtracted and why overlaps must be unioned rather than summed.
  good: Correct result with the right merging logic but a less efficient child lookup (for example scanning all spans per parent) or needing a hint about clipping skewed children.
  weak: Sums child durations without taking the union (so parallel calls make self time negative), subtracts all descendants, ignores clipping, or drops services with zero self time.
  criteria:
    correctness: All tests pass, including overlapping children, skewed children, missing parents and zero totals.
    efficiency: O(n log n) overall with a hash map from parent id to children; no per-span scan of every span.
    code_quality: Small helpers for clipping and union length, clear names for covered and self time.
    edge_cases: Single span, zero-length spans, children entirely outside the parent and very large timestamps.
    communication: Explains how self time differs from duration and why the definition attributes parallel waiting to the parent only once.
hints:
  - You only need each span's direct children. Build a map from parent id to the list of child spans before computing anything.
  - Children can overlap each other and can stick out of the parent. Cut every child interval down to the parent's interval first, then measure how much of the parent is covered, counting overlapping parts once.
  - For each span, sort its clipped child intervals by start and merge them while summing the merged lengths; self time is the duration minus that sum. Add it to a per-service total and sort the totals descending, breaking ties by service name.
followups:
  - How would you compute the critical path of a trace instead of self time?
  - How would you attribute self time when a span's children run asynchronously after the parent ends?
  - How would you process millions of spans per minute in a streaming pipeline where children arrive before parents?
  - How would you detect and report spans whose parent links form a cycle?
common_errors:
  - Subtracting the sum of child durations instead of the union, which double-counts parallel calls.
  - Not clipping children to the parent interval, producing negative self time under clock skew.
  - Subtracting grandchildren as well as children.
  - Dropping services whose total self time is zero.
  - Using 32-bit integers for millisecond epoch timestamps.
