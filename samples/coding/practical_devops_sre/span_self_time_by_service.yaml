slug: span_self_time_by_service
title: Trace Self-Time Breakdown
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, backend, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Trace Self-Time Breakdown

  A tracing backend wants to show which services actually burn time in a request, not just which
  services sit on the call path. You receive the spans of one or more traces as parallel arrays: span
  `i` has id `span_ids[i]`, parent id `parent_ids[i]`, belongs to service `services[i]` and covers the
  half-open interval `[starts[i], ends[i])` in milliseconds.

  - The **direct children** of a span are the spans whose `parent_ids` value equals its id. A parent
    id of `""` means "no parent"; a parent id that does not appear in `span_ids` refers to a span that
    was not collected and has no effect.
  - Because of clock skew, children can start before or end after their parent, and children can
    overlap each other (parallel calls).
  - The **self time** of a span is its duration `ends[i] - starts[i]` minus the total length of the
    **union** of its direct children's intervals, after clipping each child interval to the span's own
    interval. Grandchildren are not subtracted directly; they are already accounted for in their own
    parent's self time.

  Sum the self time per service and return one string `"service=total"` per service that appears in
  the input (also when its total is `0`), sorted by total **descending**, then service name ascending
  (plain character-code order).

  ### Example 1
  ```
  Input:  span_ids   = ["a", "b", "c", "d"]
          parent_ids = ["", "a", "a", "b"]
          services   = ["gateway", "orders", "inventory", "db"]
          starts     = [0, 10, 40, 20]
          ends       = [100, 60, 80, 50]
  Output: ["inventory=40", "db=30", "gateway=30", "orders=20"]
  Explanation: gateway's children cover [10, 60) and [40, 80), a union of 70 ms, so gateway's self
  time is 30. orders loses 30 ms to its db call. db and gateway tie at 30 and are ordered by name.
  ```

  ### Example 2
  ```
  Input:  span_ids   = ["r", "s", "t"]
          parent_ids = ["", "r", "zz"]
          services   = ["api", "cache", "api"]
          starts     = [1000, 1090, 5]
          ends       = [1100, 1130, 15]
  Output: ["api=100", "cache=40"]
  Explanation: the cache span overruns its parent; only [1090, 1100) is clipped from r, giving 90.
  Span t's parent was not collected; it adds its 10 ms to api.
  ```

  ### Constraints
  - `1 <= span_ids.length <= 10^4`; all arrays have the same length
  - Span ids are unique non-empty strings of letters and digits; `parent_ids[i] != span_ids[i]`
  - Service names are non-empty and use lowercase letters, digits and `-`
  - `0 <= starts[i] <= ends[i] <= 10^13` and `ends[i] - starts[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
