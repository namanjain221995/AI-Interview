slug: human_readable_byte_size
title: Disk Usage Formatter
difficulty: easy
competency_keys: [code_quality, problem_solving, debugging]
role_tags: [devops, platform, backend, support_engineer, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Disk Usage Formatter

  A storage dashboard lists volumes with their used space. Raw byte counts are hard to read, so the
  dashboard formats them with binary (IEC) units, where each unit is 1024 times the previous one:

  | Unit | Bytes |
  |------|-------|
  | `B`   | 1 |
  | `KiB` | 1024 |
  | `MiB` | 1024^2 |
  | `GiB` | 1024^3 |
  | `TiB` | 1024^4 |
  | `PiB` | 1024^5 |

  Given `num_bytes`, return the formatted string:

  - Use the **largest** unit whose size is less than or equal to `num_bytes` (use `B` when `num_bytes`
    is below 1024, including `0`).
  - In `B`, print the plain integer followed by a space and `B`, for example `"512 B"`.
  - In every other unit, print the value `num_bytes / unit_size` **truncated** (not rounded) to exactly
    **one** decimal place, then a space and the unit, for example `"1.5 KiB"` or `"1.0 MiB"`. Truncation
    matters near the boundary: one byte less than 1 MiB is `"1023.9 KiB"`, never `"1024.0 KiB"`.

  `num_bytes` can be as large as `2^53 - 1`, so be careful with overflow and with floating-point
  rounding in intermediate results.

  ### Example 1
  ```
  Input:  num_bytes = 1536
  Output: "1.5 KiB"
  ```

  ### Example 2
  ```
  Input:  num_bytes = 1048575
  Output: "1023.9 KiB"
  Explanation: 1048575 / 1024 = 1023.999..., truncated to one decimal.
  ```

  ### Example 3
  ```
  Input:  num_bytes = 512
  Output: "512 B"
  ```

  ### Constraints
  - `0 <= num_bytes <= 2^53 - 1` (9007199254740991)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: human_readable_byte_size
  params:
    - {name: num_bytes, type: long}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def human_readable_byte_size(num_bytes: int) -> str:
        units = ["KiB", "MiB", "GiB", "TiB", "PiB"]
        if num_bytes < 1024:
            return f"{num_bytes} B"
        size = 1024
        index = 0
        while index + 1 < len(units) and num_bytes >= size * 1024:
            size *= 1024
            index += 1
        whole = num_bytes // size
        tenth = (num_bytes % size) * 10 // size  # exact integer truncation
        return f"{whole}.{tenth} {units[index]}"
  javascript: |
    function humanReadableByteSize(numBytes) {
      // BigInt keeps every intermediate exact even when the remainder times 10 exceeds 2^53.
      const n = BigInt(numBytes);
      const units = ["KiB", "MiB", "GiB", "TiB", "PiB"];
      if (n < 1024n) return `${n} B`;
      let size = 1024n;
      let index = 0;
      while (index + 1 < units.length && n >= size * 1024n) {
        size *= 1024n;
        index += 1;
      }
      const whole = n / size;
      const tenth = ((n % size) * 10n) / size;
      return `${whole}.${tenth} ${units[index]}`;
    }
tests:
  - {id: t1, args: [1536], expected: "1.5 KiB", description: "Example 1 - one and a half KiB"}
  - {id: t2, args: [1048575], expected: "1023.9 KiB", description: "Example 2 - one byte below 1 MiB truncates to 1023.9 KiB"}
  - {id: t3, args: [512], expected: "512 B", description: "Example 3 - plain bytes"}
  - {id: t4, hidden: true, args: [0], expected: "0 B", description: "Zero bytes"}
  - {id: t5, hidden: true, args: [1023], expected: "1023 B", description: "Largest value printed in bytes"}
  - {id: t6, hidden: true, args: [1024], expected: "1.0 KiB", description: "Exact KiB boundary prints 1.0"}
  - {id: t7, hidden: true, args: [1073741824], expected: "1.0 GiB", description: "Exact GiB boundary"}
  - {id: t8, hidden: true, args: [1125899906842623], expected: "1023.9 TiB", description: "One byte below 1 PiB prints 1023.9 TiB"}
  - {id: t9, hidden: true, args: [1125899906842624], expected: "1.0 PiB", description: "Exactly 1 PiB"}
  - {id: t10, hidden: true, args: [9007199254740991], expected: "7.9 PiB", description: "Largest input 2^53 - 1 stays in PiB and truncates to 7.9"}
  - {id: t11, hidden: true, args: [5905580032], expected: "5.5 GiB", description: "5.5 GiB exactly"}
expected_concepts:
  - choosing the largest unit not exceeding the value
  - integer division and remainder for exact truncation
  - truncation versus rounding when formatting
  - overflow and floating-point precision limits for large 64-bit values
optimal_complexity: {time: "O(1) (at most six units)", space: "O(1)"}
rubric:
  excellent: "Picks the unit by comparison against powers of 1024, computes the whole part and the tenth digit with integer division and remainder, never rounds up across a unit boundary, and explains the overflow and float-precision limits for values near 2^53."
  good: "Correct unit selection and formatting; truncation or the largest values need one fix after testing."
  weak: "Uses a rounding formatter that prints 1024.0 KiB, picks units by powers of 1000, or prints bytes with a decimal."
  criteria:
    correctness: "All tests pass, including exact unit boundaries, one byte below a boundary and the largest input."
    efficiency: "Constant work: at most six comparisons and a few integer operations."
    code_quality: "Unit names live in one list; the formatting rule for bytes versus larger units is explicit."
    edge_cases: "0 bytes, 1023 and 1024 bytes, one byte below each unit, exact multiples and 2^53 - 1."
    communication: "Explains why truncating with integers is safer than formatting a floating-point quotient."
hints:
  - "First decide which unit to use by comparing the byte count with successive powers of 1024."
  - "Once the unit is fixed, the digits before the decimal point and the single digit after it can both be obtained with whole-number division and remainder, so no rounding ever happens."
  - "Handle values below 1024 as plain bytes. Otherwise grow the unit size by 1024 while the value is at least the next size and a larger unit exists; the whole part is the value divided by the size, and the tenths digit is the remainder times ten divided by the size, using exact 64-bit or big integer arithmetic."
followups:
  - "How would you support decimal units (kB, MB) as a user preference?"
  - "How would you parse a string such as 1.5 GiB back into bytes, and what precision issues arise?"
  - "How would you choose a precision that keeps the column width fixed on the dashboard?"
common_errors:
  - "Formatting with a rounding function so 1048575 bytes prints as 1024.0 KiB."
  - "Using 1000 instead of 1024 for the unit sizes."
  - "Printing bytes with a decimal place, such as 512.0 B."
  - "Losing precision by dividing as floating point and multiplying by ten near 2^53."
  - "Going past PiB or indexing outside the unit list for the largest inputs."
