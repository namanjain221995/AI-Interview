version: 1
slug: longest_health_check_outage
title: Longest Probe Outage
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, support_engineer, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Longest Probe Outage

  An uptime monitor probes a service at irregular intervals. Probe `i` ran at `timestamps[i]`
  (seconds, strictly increasing) and `healthy[i]` says whether it succeeded. For the incident report
  you need the length of the **longest outage**.

  An outage is a maximal run of consecutive failing probes:

  - it **starts** at the timestamp of the first failing probe in the run;
  - it **ends** at the timestamp of the next healthy probe after the run;
  - if the run is never followed by a healthy probe, it ends at the timestamp of the **last** probe.

  The outage's duration is `end - start`. Return the longest duration, or `0` if no probe failed (or
  there are no probes). A single failing probe at the very end therefore lasts `0` seconds.

  ### Example 1
  ```
  Input:  timestamps = [0, 10, 20, 30, 40, 50, 60], healthy = [true, false, false, true, false, true, true]
  Output: 20
  Explanation: Outages are 10 -> 30 (20 s) and 40 -> 50 (10 s).
  ```

  ### Example 2
  ```
  Input:  timestamps = [5, 15, 25, 35], healthy = [true, true, false, false]
  Output: 10
  ```

  ### Example 3
  ```
  Input:  timestamps = [100, 200], healthy = [true, true]
  Output: 0
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5` and `healthy.length == timestamps.length`
  - `0 <= timestamps[i] <= 2 * 10^9`, strictly increasing.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_health_check_outage
  params:
    - {name: timestamps, type: "int[]"}
    - {name: healthy, type: "bool[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_health_check_outage(timestamps: list[int], healthy: list[bool]) -> int:
        longest = 0
        start = None  # timestamp of the first failing probe of the current run
        for t, ok in zip(timestamps, healthy):
            if not ok:
                if start is None:
                    start = t
            elif start is not None:
                longest = max(longest, t - start)
                start = None
        if start is not None:  # never recovered: close at the last probe
            longest = max(longest, timestamps[-1] - start)
        return longest
  javascript: |
    function longestHealthCheckOutage(timestamps, healthy) {
      let longest = 0;
      let start = null;
      for (let i = 0; i < timestamps.length; i++) {
        if (!healthy[i]) {
          if (start === null) start = timestamps[i];
        } else if (start !== null) {
          longest = Math.max(longest, timestamps[i] - start);
          start = null;
        }
      }
      if (start !== null) longest = Math.max(longest, timestamps[timestamps.length - 1] - start);
      return longest;
    }
