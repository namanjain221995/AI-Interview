expected_concepts:
  - "single pass tracking the start of the current failing run"
  - "closing a run at the next healthy probe versus at the end of the data"
  - "maximum over runs measured in time, not probe count"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Tracks the start of the current failing run in one pass, closes it at the next healthy probe, handles the unrecovered tail explicitly and explains why durations use timestamps rather than probe counts."
  good: "Correct single-pass solution that needs a nudge for the tail case or the empty input."
  weak: "Measures outages in probe counts, ends a run at the last failing probe instead of the next healthy one, or forgets the run still open at the end."
  criteria:
    correctness: "All tests pass, including unrecovered outages, single failures and empty input."
    efficiency: "Linear time and constant memory."
    code_quality: "Readable state (run start or none) with a single place that records a finished outage."
    edge_cases: "Empty input, all failing, failing first probe, trailing single failure and large timestamps."
    communication: "States the end-of-outage rule clearly before coding."
hints:
  - "Walk the probes in order and think about what you need to remember while you are inside a failing run."
  - "You only need the timestamp at which the current failing run began; a healthy probe tells you the run is over and gives you its end time."
  - "Keep the start of the current run (or nothing when you are not in one). On a failing probe set it if it is empty; on a healthy probe, if a run is open, record the healthy timestamp minus the start and clear it. After the loop, close any run that is still open using the last probe's timestamp, and return the largest duration seen."
followups:
  - "How would you also return the start time of the longest outage, breaking ties by the earliest?"
  - "How would you ignore flaps, for example requiring two consecutive failures before an outage counts?"
  - "What if probes from several regions were merged and could arrive out of order?"
  - "How would you compute availability as a percentage over the whole window?"
common_errors:
  - "Ending an outage at the last failing probe rather than the next healthy one."
  - "Forgetting to close an outage that is still open when the data ends."
  - "Counting failing probes instead of measuring elapsed seconds."
  - "Indexing the last element of an empty list."
