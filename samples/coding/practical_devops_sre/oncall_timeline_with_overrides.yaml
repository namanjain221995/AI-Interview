reference_solutions:
  python: |
    import heapq


    def oncall_timeline_with_overrides(rotation: list[str], shift_hours: int, override_starts: list[int],
                                       override_ends: list[int], override_engineers: list[str],
                                       horizon_hours: int) -> list[str]:
        # The on-call engineer can only change at a shift boundary or an override endpoint.
        points = set(range(0, horizon_hours, shift_hours))
        for start, end in zip(override_starts, override_ends):
            for p in (start, end):
                if p < horizon_hours:
                    points.add(p)
        order = sorted(range(len(override_starts)), key=lambda j: override_starts[j])
        active: list[tuple[int, int]] = []  # max-heap by override index: (-index, end)
        nxt = 0
        timeline: list[str] = []
        current = None
        for hour in sorted(points):
            while nxt < len(order) and override_starts[order[nxt]] <= hour:
                j = order[nxt]
                heapq.heappush(active, (-j, override_ends[j]))
                nxt += 1
            while active and active[0][1] <= hour:
                heapq.heappop(active)  # expired; hours only grow, so it never comes back
            if active:
                engineer = override_engineers[-active[0][0]]
            else:
                engineer = rotation[(hour // shift_hours) % len(rotation)]
            if engineer != current:
                timeline.append(f"{hour} {engineer}")
                current = engineer
        return timeline
  javascript: |
    function oncallTimelineWithOverrides(rotation, shiftHours, overrideStarts, overrideEnds, overrideEngineers, horizonHours) {
      const pointSet = new Set();
      for (let h = 0; h < horizonHours; h += shiftHours) pointSet.add(h);
      for (let j = 0; j < overrideStarts.length; j++) {
        if (overrideStarts[j] < horizonHours) pointSet.add(overrideStarts[j]);
        if (overrideEnds[j] < horizonHours) pointSet.add(overrideEnds[j]);
      }
      const points = [...pointSet].sort((a, b) => a - b);
      const timeline = [];
      let current = null;
      for (const hour of points) {
        // At most 1000 overrides: scan them from the most recent one backwards.
        let engineer = null;
        for (let j = overrideStarts.length - 1; j >= 0; j--) {
          if (overrideStarts[j] <= hour && hour < overrideEnds[j]) {
            engineer = overrideEngineers[j];
            break;
          }
        }
        if (engineer === null) engineer = rotation[Math.floor(hour / shiftHours) % rotation.length];
        if (engineer !== current) {
          timeline.push(`${hour} ${engineer}`);
          current = engineer;
        }
      }
      return timeline;
    }
