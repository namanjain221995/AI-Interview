expected_concepts:
  - event points at shift boundaries and override endpoints
  - half-open intervals
  - precedence of later overrides (max index among active intervals)
  - sweep line with a heap or a per-point scan of overrides
  - emitting only changes of the on-call engineer
optimal_complexity: {time: O((S + K) log K) for S shift boundaries and K overrides, space: O(S + K)}
rubric:
  excellent: Identifies that the on-call engineer can only change at shift boundaries and override endpoints, sorts those points, determines the winning override per point with a heap of active overrides keyed by list position (or a justified scan), and emits an entry only when the engineer changes.
  good: Correct point-based solution that scans all overrides at each point, or a solution needing one fix around half-open ends or overrides beyond the horizon.
  weak: Simulates every hour, lets the earliest or the longest override win, treats override ends as inclusive, or emits duplicate entries for the same engineer.
  criteria:
    correctness: All tests pass, including nested overrides, no-op handovers and the horizon boundary.
    efficiency: Work depends on the number of shifts and overrides, not on the number of hours.
    code_quality: The base rotation lookup and the override precedence are each expressed once and clearly.
    edge_cases: Overrides starting at 0 or beyond the horizon, ending exactly at the horizon, and repeated names in the rotation.
    communication: Explains why only boundary hours need to be examined.
hints:
  - The on-call engineer can only change at a few special hours; find them instead of looking at every hour.
  - Collect every shift start below the horizon plus every override start and end below the horizon, and work out who is on call at each of those hours in increasing order.
  - At each collected hour, the winner is the override with the largest list position whose interval contains the hour (a heap of active overrides ordered by position, discarding those that have ended, does this quickly), falling back to the rotation entry for that hour; record an entry only when that engineer differs from the previous one.
followups:
  - How would you answer many queries of the form who is on call at hour h without building the whole timeline?
  - How would you represent time zones and daylight saving changes in a real scheduler?
  - How could you detect engineers who would be on call for more than 24 hours in a row?
  - What would change if overrides could be deleted and the timeline had to be updated incrementally?
common_errors:
  - Iterating over every hour of the horizon.
  - Letting the earliest override in the list win instead of the latest.
  - Treating the override end as inclusive.
  - Emitting an entry at a boundary where the same engineer stays on call.
  - Including override start hours at or after the horizon.
