prompt_markdown: |
  ## On-Call Handover Timeline

  Your paging tool needs the list of **handovers** for an on-call schedule. Hours are counted from `0`.

  - **Base rotation:** at hour `h` the engineer on call is
    `rotation[(h // shift_hours) % rotation.length]`, so each person covers `shift_hours` consecutive hours
    and the list wraps around.
  - **Overrides:** override `j` puts `override_engineers[j]` on call for every hour `h` with
    `override_starts[j] <= h < override_ends[j]` (a half-open interval). Overrides beat the base rotation,
    and when several overrides cover the same hour, the one that appears **later in the list** wins
    (it was entered more recently).

  Consider the hours `0 <= h < horizon_hours`. Return the handovers in time order as strings
  `"<hour> <engineer>"`: always one entry for hour `0`, and then an entry for every hour at which the
  on-call engineer is **different** from the engineer of the hour before. If two consecutive shifts or
  an override hand the pager to the same person, there is no entry. Parts of overrides outside the
  horizon are ignored.

  ### Example 1
  ```
  Input:  rotation = ["ana", "ben", "cho"],
          shift_hours = 8,
          override_starts = [10],
          override_ends = [14],
          override_engineers = ["dev"],
          horizon_hours = 24
  Output: ["0 ana", "8 ben", "10 dev", "14 ben", "16 cho"]
  Explanation: the base schedule is ana 0-8, ben 8-16 and cho 16-24. dev covers hours 10 to 13,
  after which ben finishes his shift.
  ```

  ### Example 2
  ```
  Input:  rotation = ["ana", "ben"],
          shift_hours = 12,
          override_starts = [6, 10, 30],
          override_ends = [20, 16, 40],
          override_engineers = ["ben", "cho", "ana"],
          horizon_hours = 36
  Output: ["0 ana", "6 ben", "10 cho", "16 ben", "24 ana"]
  Explanation: ben's override starts at hour 6; cho's override is later in the list, so it wins for
  hours 10 to 15. ben is on call from 16 through 23 (override, then his own shift), so there is no
  entry at 20. The ana override from hour 30 changes nothing because ana is already on call.
  ```

  ### Constraints
  - `1 <= rotation.length <= 50`; names are 1 to 20 lowercase letters
  - `1 <= shift_hours <= 10^9` and `1 <= horizon_hours <= 10^9`
  - At most `10^5` shifts start before the horizon (`horizon_hours / shift_hours <= 10^5`)
  - `0 <= overrides <= 1000`; `override_starts`, `override_ends` and `override_engineers` have equal
    length, and `0 <= override_starts[j] < override_ends[j] <= 10^9`
  - Simulating every single hour is too slow for a horizon of `10^9` hours.
