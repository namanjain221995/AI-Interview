slug: alert_correlation_groups
title: Correlated Alert Grouping
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [sre, devops, support_engineer, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Correlated Alert Grouping

  During an outage the paging system fires dozens of alerts, and the on-call engineer wants them folded
  into incidents. Alert `i` was raised on host `hosts[i]` for service `services[i]` at second
  `timestamps[i]`.

  Two alerts are **directly related** when they share the same host **or** the same service, **and** their
  timestamps differ by at most `window_seconds`. Relatedness is transitive: if alert A is related to B and
  B to C, then A, B and C belong to the same **incident**, even if A and C are not directly related. Every
  alert belongs to exactly one incident (an alert related to nothing forms an incident of size 1).

  Return the sizes of all incidents sorted in **descending** order (an empty list when there are no alerts).

  ### Example 1
  ```
  Input:  hosts = ["web-1", "web-1", "web-2", "web-1", "web-3"],
          services = ["api", "checkout", "checkout", "search", "search"],
          timestamps = [100, 110, 130, 610, 640],
          window_seconds = 60
  Output: [3, 2]
  Explanation: alerts 0 and 1 share host web-1 (10 s apart); alerts 1 and 2 share service checkout
  (20 s apart), so 0, 1 and 2 form one incident. Alert 3 shares host web-1 with alert 1, but 500 s is
  outside the window. Alert 4 shares service search with alert 3 (30 s apart).
  ```

  ### Example 2
  ```
  Input:  hosts = ["db-1", "db-1", "db-1", "cache-1"],
          services = ["postgres", "disk", "postgres", "redis"],
          timestamps = [0, 60, 120, 30],
          window_seconds = 60
  Output: [3, 1]
  Explanation: consecutive alerts on db-1 are exactly 60 s apart, which is within the window, so they
  chain into one incident although the first and last are 120 s apart. The cache alert is alone.
  ```

  ### Constraints
  - `0 <= n <= 10^5`, where `n` is the length of `hosts`, `services` and `timestamps`
  - Host and service names are non-empty strings of letters, digits and `-`.
  - `0 <= timestamps[i] <= 10^9`; timestamps are not sorted and may repeat
  - `0 <= window_seconds <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: alert_correlation_groups
  params:
    - {name: hosts, type: "string[]"}
    - {name: services, type: "string[]"}
    - {name: timestamps, type: "int[]"}
    - {name: window_seconds, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def alert_correlation_groups(hosts: list[str], services: list[str], timestamps: list[int], window_seconds: int) -> list[int]:
        n = len(timestamps)
        parent = list(range(n))

        def find(x: int) -> int:
            while parent[x] != x:
                parent[x] = parent[parent[x]]
                x = parent[x]
            return x

        def union(a: int, b: int) -> None:
            ra, rb = find(a), find(b)
            if ra != rb:
                parent[ra] = rb

        order = sorted(range(n), key=lambda i: timestamps[i])
        for labels in (hosts, services):
            last_seen: dict[str, int] = {}
            for i in order:
                prev = last_seen.get(labels[i])
                if prev is not None and timestamps[i] - timestamps[prev] <= window_seconds:
                    union(prev, i)
                last_seen[labels[i]] = i
        sizes: dict[int, int] = {}
        for i in range(n):
            root = find(i)
            sizes[root] = sizes.get(root, 0) + 1
        return sorted(sizes.values(), reverse=True)
  javascript: |
    function alertCorrelationGroups(hosts, services, timestamps, windowSeconds) {
      const n = timestamps.length;
      const parent = Array.from({ length: n }, (_, i) => i);
      const find = (x) => {
        while (parent[x] !== x) {
          parent[x] = parent[parent[x]];
          x = parent[x];
        }
        return x;
      };
      const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => timestamps[a] - timestamps[b]);
      for (const labels of [hosts, services]) {
        const lastSeen = new Map();
        for (const i of order) {
          const prev = lastSeen.get(labels[i]);
          if (prev !== undefined && timestamps[i] - timestamps[prev] <= windowSeconds) {
            const ra = find(prev);
            const rb = find(i);
            if (ra !== rb) parent[ra] = rb;
          }
          lastSeen.set(labels[i], i);
        }
      }
      const sizes = new Map();
      for (let i = 0; i < n; i++) {
        const root = find(i);
        sizes.set(root, (sizes.get(root) || 0) + 1);
      }
      return [...sizes.values()].sort((a, b) => b - a);
    }
