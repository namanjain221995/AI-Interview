expected_concepts:
  - connected components of an implicit graph
  - union-find (disjoint set union) with path compression
  - sorting by time so only neighbouring alerts per host or service need joining
  - why linking consecutive alerts is enough (gaps within the window chain transitively)
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Sorts alerts by time, links each alert only to the previous alert with the same host and the previous alert with the same service, merges with union-find, argues why neighbours suffice and states O(n log n).
  good: Correct components via union-find or BFS but builds edges for all pairs within the window, or needs a hint for the neighbour argument.
  weak: Compares every pair in O(n^2) without noticing, treats host and service as a combined key, ignores transitivity or uses a strict inequality at the window edge.
  criteria:
    correctness: All tests pass, including chains that only connect through a host and then a service, equal timestamps and a zero window.
    efficiency: Near-linear after sorting; no pairwise comparison of all alerts.
    code_quality: A compact union-find helper and a single loop reused for hosts and services.
    edge_cases: No alerts, a single alert, identical timestamps, window zero and gaps exactly equal to the window.
    communication: Explains why connecting only time-adjacent alerts preserves the same components as connecting all pairs.
hints:
  - Think of alerts as nodes in a graph with an edge between directly related alerts; incidents are the connected pieces of that graph.
  - You do not need every edge. If alerts on one host are sorted by time, two of them within the window are already connected through the alerts in between, so linking neighbours is enough.
  - Sort alert indices by timestamp. For hosts and then for services, remember the last alert seen with each name and merge the current alert with it in a disjoint-set structure when their gap is at most the window. Finally count the members of each set and sort those counts from largest to smallest.
followups:
  - How would you process alerts as a live stream, closing an incident once the window has passed?
  - What would you change if two alerts needed to share both the host and the service?
  - How would you pick a representative root-cause alert for each incident?
common_errors:
  - Comparing all pairs, which is quadratic for large outages.
  - Linking only alerts that share both host and service.
  - Forgetting that a chain of small gaps connects alerts that are far apart in time.
  - Not sorting by time before linking neighbours, so the neighbour argument fails.
