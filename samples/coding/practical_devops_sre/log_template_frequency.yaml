version: 1
slug: log_template_frequency
title: Log Template Mining
difficulty: medium
competency_keys: [data_structures, code_quality, problem_solving]
role_tags: [sre, backend, devops, support_engineer]
time_limit_minutes: 20
prompt_markdown: |
  ## Log Template Mining

  During an incident you want to know which **kinds** of log lines dominate, not which exact lines. Two
  lines that differ only in ids or counters should count as the same template.

  Normalise each message in `messages` like this:

  1. Split it into tokens on spaces (tokens are separated by exactly one space).
  2. Replace a token **only when the whole token** matches one of these shapes:
     - one or more decimal digits (`7`, `0042`) becomes `<NUM>`;
     - the two characters `0x` (lowercase x) followed by one or more hexadecimal digits (`0x1f`, `0xFF`)
       becomes `<HEX>`;
     - a UUID: groups of 8, 4, 4, 4 and 12 hexadecimal digits joined by `-`, in any letter case, becomes
       `<UUID>`.

     Any other token stays exactly as it is, even if it contains digits (`500ms`, `-12`, `3.5`, `id=42`,
     `42,`).
  3. Join the tokens back with single spaces. The result is the message's **template**.

  Return the `k` most frequent templates, each formatted as `"<count> <template>"`, ordered by count
  **descending**; templates with the same count are ordered by the template text ascending (plain
  character-code order). If there are fewer than `k` distinct templates, return all of them.

  ### Example 1
  ```
  Input:  messages = ["user 42 logged in", "user 7 logged in", "cache miss key 0x1f", "user 1009 logged in", "cache miss key 0xFF", "disk 3 at 91 percent"],
          k = 2
  Output: ["3 user <NUM> logged in", "2 cache miss key <HEX>"]
  ```

  ### Example 2
  ```
  Input:  messages = ["job 3f2a9c1e-0b4d-4e7a-9c2b-1d2e3f4a5b6c done in 500ms", "job 3F2A9C1E-0B4D-4E7A-9C2B-1D2E3F4A5B6D done in 750ms", "retry 2 of 5", "retry 3 of 5"],
          k = 3
  Output: ["2 retry <NUM> of <NUM>", "1 job <UUID> done in 500ms", "1 job <UUID> done in 750ms"]
  Explanation: the job lines become "job <UUID> done in 500ms" and "job <UUID> done in 750ms"
  (500ms is not a number token), two templates with count 1 each, ordered by their text.
  ```

  ### Constraints
  - `1 <= messages.length <= 10^4`
  - `1 <= messages[i].length <= 200`; messages are printable ASCII with no leading or trailing spaces and
    exactly one space between tokens
  - `1 <= k <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: log_template_frequency
  params:
    - {name: messages, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    import re
    from collections import Counter

    _NUM = re.compile(r"[0-9]+")
    _HEX = re.compile(r"0x[0-9a-fA-F]+")
    _UUID = re.compile(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}")


    def _normalise(token: str) -> str:
        if _NUM.fullmatch(token):
            return "<NUM>"
        if _HEX.fullmatch(token):
            return "<HEX>"
        if _UUID.fullmatch(token):
            return "<UUID>"
        return token


    def log_template_frequency(messages: list[str], k: int) -> list[str]:
        counts = Counter(" ".join(_normalise(t) for t in message.split(" ")) for message in messages)
        ranked = sorted(counts.items(), key=lambda item: (-item[1], item[0]))
        return [f"{count} {template}" for template, count in ranked[:k]]
  javascript: |
    const NUM_TOKEN = /^[0-9]+$/;
    const HEX_TOKEN = /^0x[0-9a-fA-F]+$/;
    const UUID_TOKEN = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;

    function normaliseToken(token) {
      if (NUM_TOKEN.test(token)) return "<NUM>";
      if (HEX_TOKEN.test(token)) return "<HEX>";
      if (UUID_TOKEN.test(token)) return "<UUID>";
      return token;
    }

    function logTemplateFrequency(messages, k) {
      const counts = new Map();
      for (const message of messages) {
        const template = message.split(" ").map(normaliseToken).join(" ");
        counts.set(template, (counts.get(template) || 0) + 1);
      }
      const ranked = [...counts.entries()].sort((a, b) => {
        if (a[1] !== b[1]) return b[1] - a[1];
        return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
      });
      return ranked.slice(0, k).map(([template, count]) => `${count} ${template}`);
    }
