expected_concepts:
  - tokenising on spaces and rebuilding the template
  - whole-token pattern matching with anchored regular expressions or explicit character checks
  - hash map counting of templates
  - sorting by count descending then key ascending
  - returning at most k results
optimal_complexity: {time: O(L + T log T) for L total characters and T distinct templates, space: O(L)}
rubric:
  excellent: Writes a small token normaliser with whole-token checks for numbers, hex and UUIDs, counts templates in a hash map, sorts with a composite key (count descending, text ascending), slices to k and explains why partial matches must not be replaced.
  good: Correct counting and ordering with one fix after the tests, such as an unanchored pattern or the tie-break direction.
  weak: Replaces digits inside tokens (turning 500ms into <NUM>ms), uses unanchored patterns, ignores the tie-break, or fails when k exceeds the number of templates.
  criteria:
    correctness: All tests pass, including near-miss tokens and ties.
    efficiency: One pass to count plus one sort of the distinct templates.
    code_quality: The normalisation rules live in one function and the patterns are named and readable.
    edge_cases: Malformed UUIDs, uppercase 0X, signed and decimal numbers, k larger than the template count.
    communication: Explains the precise matching rules and the ordering used for ties.
hints:
  - Turn every message into its template first; after that the problem is counting strings and picking the most common ones.
  - Each token should be checked as a whole against the three shapes, so a pattern must cover the token from its first to its last character, otherwise tokens like 500ms or 42, change by mistake.
  - Split each message on spaces, map each token through a function that returns the placeholder only on a full-token match, join the tokens, count the templates in a hash map, then sort the entries by count from high to low and by template text from low to high, keep the first k and format them as count, a space and the template.
followups:
  - How would you make the normaliser extensible so teams can add their own token shapes such as IP addresses?
  - How would you maintain the top k over a live log stream without re-sorting everything?
  - How would you detect templates whose count is spiking compared with the previous hour?
  - What would you change if logs were too large to hold all templates in memory?
common_errors:
  - Using an unanchored digit pattern that rewrites parts of tokens such as 500ms or v2.
  - Matching 0X with an uppercase X as hex although only the lowercase prefix is defined.
  - Breaking ties by insertion order instead of by template text.
  - Sorting templates in descending text order along with the counts.
  - Accepting UUIDs with the wrong group lengths or without hyphens.
