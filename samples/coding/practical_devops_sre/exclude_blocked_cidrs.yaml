version: 1
slug: exclude_blocked_cidrs
title: Allowlist Minus Blocklist CIDRs
difficulty: hard
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [network, security, cloud, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## Allowlist Minus Blocklist CIDRs

  A firewall generator receives two lists of IPv4 CIDR blocks written as `a.b.c.d/p`: `allowed` and
  `blocked`. The effective rule set is every IPv4 address that is in **at least one** allowed block
  and in **no** blocked block. The firewall only accepts CIDR blocks, so you must express that address
  set as CIDR blocks again.

  Input details:

  - A block `a.b.c.d/p` contains every address whose first `p` bits equal the first `p` bits of
    `a.b.c.d`. The input may have **host bits set** (`10.0.0.7/24` means `10.0.0.0/24`).
  - Blocks within each list may overlap, nest, repeat or touch.

  Return the **smallest possible number** of CIDR blocks whose union is exactly the effective address
  set, sorted by ascending start address, each written in normalised form (host bits cleared, decimal
  octets without leading zeros, for example `"10.0.0.128/25"`). Return an empty array if no address
  remains. (The smallest cover is unique, so the answer is well defined.)

  ### Example 1
  ```
  Input:  allowed = ["10.0.0.0/24"], blocked = ["10.0.0.64/26"]
  Output: ["10.0.0.0/26", "10.0.0.128/25"]
  Explanation: removing 10.0.0.64 - 10.0.0.127 leaves 10.0.0.0 - 10.0.0.63 and 10.0.0.128 - 10.0.0.255.
  ```

  ### Example 2
  ```
  Input:  allowed = ["192.168.1.7/30", "192.168.1.0/30", "172.16.5.3/32"], blocked = ["172.16.0.0/16"]
  Output: ["192.168.1.0/29"]
  Explanation: 192.168.1.7/30 is 192.168.1.4/30; together with 192.168.1.0/30 it forms one /29.
  The single address 172.16.5.3 is blocked.
  ```

  ### Example 3
  ```
  Input:  allowed = ["10.1.0.0/16"], blocked = ["10.0.0.0/8"]
  Output: []
  ```

  ### Constraints
  - `0 <= allowed.length, blocked.length <= 10^4`
  - Every entry is four decimal octets `0..255` separated by `.`, then `/` and a prefix length `0..32`.
  - `0.0.0.0/0` (2^32 addresses) is valid input, so address arithmetic needs more than 32 signed bits.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: exclude_blocked_cidrs
  params:
    - {name: allowed, type: "string[]"}
    - {name: blocked, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def exclude_blocked_cidrs(allowed, blocked):
        def to_range(cidr):
            address, prefix = cidr.split("/")
            value = 0
            for octet in address.split("."):
                value = value * 256 + int(octet)
            size = 1 << (32 - int(prefix))
            start = value - value % size
            return start, start + size - 1

        def merge(cidrs):
            merged = []
            for lo, hi in sorted(to_range(c) for c in cidrs):
                if merged and lo <= merged[-1][1] + 1:
                    merged[-1][1] = max(merged[-1][1], hi)
                else:
                    merged.append([lo, hi])
            return merged

        allow, block = merge(allowed), merge(blocked)
        remaining = []
        j = 0
        for lo, hi in allow:
            while j < len(block) and block[j][1] < lo:
                j += 1
            cur, k = lo, j
            while cur <= hi:
                if k < len(block) and block[k][0] <= hi:
                    if block[k][0] > cur:
                        remaining.append((cur, block[k][0] - 1))
                    cur = max(cur, block[k][1] + 1)
                    k += 1
                else:
                    remaining.append((cur, hi))
                    break

        result = []
        for lo, hi in remaining:
            while lo <= hi:
                size = 1 << 32 if lo == 0 else lo & -lo
                while size > hi - lo + 1:
                    size >>= 1
                octets = [(lo >> shift) & 255 for shift in (24, 16, 8, 0)]
                result.append(".".join(map(str, octets)) + "/" + str(33 - size.bit_length()))
                lo += size
        return result

  javascript: |
    function excludeBlockedCidrs(allowed, blocked) {
      const TOTAL = 4294967296; // 2^32; plain arithmetic avoids 32-bit bitwise operators
      function toRange(cidr) {
        const [address, prefix] = cidr.split("/");
        let value = 0;
        for (const octet of address.split(".")) value = value * 256 + Number(octet);
        const size = 2 ** (32 - Number(prefix));
        const start = value - (value % size);
        return [start, start + size - 1];
      }
      function merge(cidrs) {
        const ranges = cidrs.map(toRange).sort((x, y) => x[0] - y[0] || x[1] - y[1]);
        const merged = [];
        for (const [lo, hi] of ranges) {
          const last = merged[merged.length - 1];
          if (last && lo <= last[1] + 1) last[1] = Math.max(last[1], hi);
          else merged.push([lo, hi]);
        }
        return merged;
      }
      const allow = merge(allowed);
      const block = merge(blocked);
      const remaining = [];
      let j = 0;
      for (const [lo, hi] of allow) {
        while (j < block.length && block[j][1] < lo) j++;
        let cur = lo;
        let k = j;
        while (cur <= hi) {
          if (k < block.length && block[k][0] <= hi) {
            if (block[k][0] > cur) remaining.push([cur, block[k][0] - 1]);
            cur = Math.max(cur, block[k][1] + 1);
            k++;
          } else {
            remaining.push([cur, hi]);
            break;
          }
        }
      }
      const result = [];
      for (let [lo, hi] of remaining) {
        while (lo <= hi) {
          let size = 1;
          let bits = 0;
          while (size < TOTAL && lo % (size * 2) === 0 && size * 2 <= hi - lo + 1) {
            size *= 2;
            bits++;
          }
          const octets = [];
          let v = lo;
          for (let s = 0; s < 4; s++) {
            octets.unshift(v % 256);
            v = Math.floor(v / 256);
          }
          result.push(octets.join(".") + "/" + (32 - bits));
          lo += size;
        }
      }
      return result;
    }
