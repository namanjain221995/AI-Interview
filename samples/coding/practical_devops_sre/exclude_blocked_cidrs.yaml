expected_concepts:
  - converting CIDR blocks to integer address ranges (and normalising host bits)
  - merging overlapping and adjacent intervals
  - interval subtraction with a two-pointer sweep
  - greedy decomposition of a range into aligned power-of-two blocks
  - unsigned or 64-bit arithmetic for 2^32 addresses
optimal_complexity: {time: "O((a + b) log(a + b) + output)", space: O(a + b + output)}
rubric:
  excellent: Converts blocks to integer ranges with host bits cleared, merges overlapping and adjacent ranges, subtracts with a sweep, decomposes each remaining range greedily into the largest aligned block that fits, and explains why merging adjacent ranges is needed for a minimal answer and why 32-bit signed integers overflow.
  good: Correct range conversion and subtraction, and a correct greedy decomposition after a hint about alignment or adjacency; minor issues with the /0 case fixed when prompted.
  weak: Enumerates individual addresses, emits non-aligned blocks, forgets to clear host bits, returns overlapping or non-minimal blocks, or overflows on 0.0.0.0/0.
  criteria:
    correctness: All tests pass, including /0, /32, host bits set, nested and adjacent blocks and fully blocked input.
    efficiency: Works on ranges, never on individual addresses; sorting dominates the running time.
    code_quality: Separate helpers for parsing, merging, subtracting and formatting.
    edge_cases: Empty lists, the whole address space, the last address 255.255.255.255 and duplicate blocks.
    communication: Explains the alignment rule of CIDR blocks and why the greedy choice is optimal.
hints:
  - Treat every address as a 32-bit unsigned number. Then each CIDR block is a contiguous integer range whose length is a power of two and whose start is a multiple of that length.
  - Merge the allowed ranges (overlapping or touching), merge the blocked ranges, and subtract one sorted list from the other with a sweep. What remains is a set of disjoint, non-touching integer ranges.
  - Turn each remaining range [lo, hi] into blocks greedily - at lo take the largest power-of-two size that divides lo (any size if lo is 0) and still fits in the range, emit it, advance lo by that size and repeat. Use 64-bit or unsigned arithmetic so 2^32 does not overflow.
followups:
  - How would you extend the solution to IPv6?
  - How would you produce the smallest diff between yesterday's and today's rule sets?
  - If rules are evaluated in order with allow and deny actions mixed, how would you flatten them into one allow list?
  - Why is the greedy decomposition minimal, and why must adjacent remaining ranges be merged first?
common_errors:
  - Using 32-bit signed integers, so addresses above 127.255.255.255 or the /0 size overflow.
  - Forgetting to clear host bits, which shifts the block to the wrong range.
  - Emitting blocks that are not aligned to their size (for example 10.0.0.1/31).
  - Not merging touching ranges, which produces two /25 blocks instead of one /24.
  - Expanding blocks into individual addresses, which is far too slow for large prefixes.
