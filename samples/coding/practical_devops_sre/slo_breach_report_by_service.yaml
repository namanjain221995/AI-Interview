version: 1
slug: slo_breach_report_by_service
title: SLO Breach Report
difficulty: medium
competency_keys: [sql, databases]
role_tags: [sre, data_analyst, dba, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## SLO Breach Report

  The reliability team keeps each service's availability objective in table `services`:

  | column | type | notes |
  |--------|------|-------|
  | name | VARCHAR(40) | primary key |
  | target_ppm | INTEGER | target success rate in parts per million, for example `999000` = 99.9% (0 to 1000000) |

  A nightly job writes one row of request counts per service per day into `request_stats`:

  | column | type | notes |
  |--------|------|-------|
  | service | VARCHAR(40) | references `services.name` |
  | day | VARCHAR(10) | `'YYYY-MM-DD'`; `(service, day)` is the primary key |
  | total_requests | BIGINT | at least 1 |
  | failed_requests | BIGINT | between 0 and `total_requests` |

  Over **all** recorded days of a service, let `total` and `failed` be the sums of its request counts. The
  service **breaches** its objective when its failure rate is above the allowed budget, which in exact
  integer form is `failed * 1000000 > (1000000 - target_ppm) * total`. Being exactly on target is not a
  breach.

  Report every breaching service with these columns:

  - `service`
  - `total_requests` and `failed_requests`: the sums over all days
  - `availability_pct`: `ROUND(100.0 * (total - failed) / total, 3)` returned as a floating-point number
    (wrap it in `CAST(... AS DOUBLE PRECISION)` so both databases return the same type)
  - `worst_day`: the day with the lowest **daily** availability `(total_requests - failed_requests) /
    total_requests` for that service; if several days tie, the earliest day

  Services with no rows in `request_stats` are not reported. Order the result by `availability_pct`
  ascending, then `service` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite (no date functions are needed: days compare
  correctly as text).

  ### Example 1
  ```
  services                    request_stats
  +---------+------------+    +---------+------------+----------------+-----------------+
  | name    | target_ppm |    | service | day        | total_requests | failed_requests |
  +---------+------------+    +---------+------------+----------------+-----------------+
  | api     | 999000     |    | api     | 2024-05-01 | 200000         | 100             |
  | search  | 995000     |    | api     | 2024-05-02 | 100000         | 300             |
  | billing | 990000     |    | api     | 2024-05-03 | 100000         | 60              |
  +---------+------------+    | search  | 2024-05-01 | 50000          | 400             |
                              | search  | 2024-05-02 | 50000          | 120             |
                              | billing | 2024-05-01 | 1000           | 5               |
                              | billing | 2024-05-02 | 1000           | 9               |
                              +---------+------------+----------------+-----------------+

  Output
  +---------+----------------+-----------------+------------------+------------+
  | service | total_requests | failed_requests | availability_pct | worst_day  |
  +---------+----------------+-----------------+------------------+------------+
  | search  | 100000         | 520             | 99.48            | 2024-05-01 |
  | api     | 400000         | 460             | 99.885           | 2024-05-02 |
  +---------+----------------+-----------------+------------------+------------+
  api: 460 failures exceed the budget of 0.1% x 400000 = 400; its worst day is 2024-05-02 (99.7%).
  search: 520 failures exceed 0.5% x 100000 = 500. billing: 14 failures are within 1% x 2000 = 20.
  ```

  ### Example 2
  ```
  services                   request_stats
  +--------+------------+    +---------+------------+----------------+-----------------+
  | name   | target_ppm |    | service | day        | total_requests | failed_requests |
  +--------+------------+    +---------+------------+----------------+-----------------+
  | queue  | 999000     |    | queue   | 2024-06-02 | 100            | 1               |
  | auth   | 999500     |    | queue   | 2024-06-01 | 200            | 2               |
  | mailer | 999000     |    | queue   | 2024-06-03 | 700            | 2               |
  +--------+------------+    | auth    | 2024-06-01 | 500            | 1               |
                             | auth    | 2024-06-02 | 500            | 4               |
                             +---------+------------+----------------+-----------------+

  Output
  +---------+----------------+-----------------+------------------+------------+
  | service | total_requests | failed_requests | availability_pct | worst_day  |
  +---------+----------------+-----------------+------------------+------------+
  | auth    | 1000           | 5               | 99.5             | 2024-06-02 |
  | queue   | 1000           | 5               | 99.5             | 2024-06-01 |
  +---------+----------------+-----------------+------------------+------------+
  queue's daily availabilities are 99%, 99% and about 99.71%: 2024-06-01 and 2024-06-02 tie and the
  earlier day wins. queue and auth both have 99.5, so they are ordered by name. mailer has no stats
  and is not reported.
  ```

  ### Constraints
  - At most 1000 rows in `services` and `10^4` rows in `request_stats`
  - `1 <= total_requests <= 10^8` per row, so all products fit in a 64-bit integer
languages: [sql]
starter_code:
  sql: |
    -- Return service, total_requests, failed_requests, availability_pct and worst_day for breaching services.
    SELECT r.service,
           SUM(r.total_requests) AS total_requests,
           SUM(r.failed_requests) AS failed_requests,
           ROUND(100.0 * (SUM(r.total_requests) - SUM(r.failed_requests)) / SUM(r.total_requests), 3) AS availability_pct,
           MIN(r.day) AS worst_day
    FROM request_stats r
    GROUP BY r.service
    ORDER BY availability_pct, r.service;
reference_solutions:
  sql: |
    WITH totals AS (
      SELECT s.name AS service,
             s.target_ppm,
             SUM(r.total_requests) AS total_requests,
             SUM(r.failed_requests) AS failed_requests
      FROM services s
      JOIN request_stats r ON r.service = s.name
      GROUP BY s.name, s.target_ppm
    ),
    worst AS (
      -- A day is the worst when no other day of the service is strictly worse,
      -- or equally bad and earlier (ratios compared exactly by cross-multiplying).
      SELECT r.service, r.day
      FROM request_stats r
      WHERE NOT EXISTS (
        SELECT 1
        FROM request_stats o
        WHERE o.service = r.service
          AND (
            (o.total_requests - o.failed_requests) * r.total_requests
              < (r.total_requests - r.failed_requests) * o.total_requests
            OR (
              (o.total_requests - o.failed_requests) * r.total_requests
                = (r.total_requests - r.failed_requests) * o.total_requests
              AND o.day < r.day
            )
          )
      )
    )
    SELECT t.service,
           t.total_requests,
           t.failed_requests,
           CAST(
             ROUND(100.0 * (t.total_requests - t.failed_requests) / t.total_requests, 3) AS DOUBLE PRECISION
           ) AS availability_pct,
           w.day AS worst_day
    FROM totals t
    JOIN worst w ON w.service = t.service
    WHERE t.failed_requests * 1000000 > (1000000 - t.target_ppm) * t.total_requests
    ORDER BY availability_pct, t.service;
sql_setup: |
  CREATE TABLE services (
    name VARCHAR(40) PRIMARY KEY,
    target_ppm INTEGER NOT NULL
  );
  CREATE TABLE request_stats (
    service VARCHAR(40) NOT NULL REFERENCES services (name),
    day VARCHAR(10) NOT NULL,
    total_requests BIGINT NOT NULL,
    failed_requests BIGINT NOT NULL,
    PRIMARY KEY (service, day)
  );
tests:
  - id: t1
    description: "Example 1 - two breaching services ordered by availability; billing meets its target"
    ordered: true
    setup_sql: |
      INSERT INTO services (name, target_ppm) VALUES
        ('api', 999000), ('search', 995000), ('billing', 990000);
      INSERT INTO request_stats (service, day, total_requests, failed_requests) VALUES
        ('api', '2024-05-01', 200000, 100), ('api', '2024-05-02', 100000, 300), ('api', '2024-05-03', 100000, 60),
        ('search', '2024-05-01', 50000, 400), ('search', '2024-05-02', 50000, 120), ('billing', '2024-05-01', 1000, 5),
        ('billing', '2024-05-02', 1000, 9);
    expected_rows:
      - ["search", 100000, 520, 99.48, "2024-05-01"]
      - ["api", 400000, 460, 99.885, "2024-05-02"]
  - id: t2
    description: "Example 2 - equal worst-day ratios resolve to the earliest day; equal availability ordered by service; no-stats service ignored"
    ordered: true
    setup_sql: |
      INSERT INTO services (name, target_ppm) VALUES
        ('queue', 999000), ('auth', 999500), ('mailer', 999000);
      INSERT INTO request_stats (service, day, total_requests, failed_requests) VALUES
        ('queue', '2024-06-02', 100, 1), ('queue', '2024-06-01', 200, 2), ('queue', '2024-06-03', 700, 2),
        ('auth', '2024-06-01', 500, 1), ('auth', '2024-06-02', 500, 4);
    expected_rows:
      - ["auth", 1000, 5, 99.5, "2024-06-02"]
      - ["queue", 1000, 5, 99.5, "2024-06-01"]
  - id: t3
    hidden: true
    description: "Empty tables - no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Exactly on target is not a breach (strict >); target_ppm 0 never breaches; services without stats excluded"
    ordered: true
    setup_sql: |
      INSERT INTO services (name, target_ppm) VALUES
        ('edge', 999000), ('batch', 0), ('idle', 999999), ('cdn', 999000);
      INSERT INTO request_stats (service, day, total_requests, failed_requests) VALUES
        ('edge', '2024-01-01', 4000, 3), ('edge', '2024-01-02', 6000, 7), ('batch', '2024-01-01', 10, 10),
        ('cdn', '2024-01-01', 4000, 3), ('cdn', '2024-01-02', 6000, 8);
    expected_rows:
      - ["cdn", 10000, 11, 99.89, "2024-01-02"]
  - id: t5
    hidden: true
    description: "Target 100% - any failure breaches (even when availability rounds to 100.0), zero failures do not; a 0% day is the worst"
    ordered: true
    setup_sql: |
      INSERT INTO services (name, target_ppm) VALUES
        ('ledger', 1000000), ('clean', 1000000);
      INSERT INTO request_stats (service, day, total_requests, failed_requests) VALUES
        ('ledger', '2024-02-01', 1000000, 1), ('ledger', '2024-02-02', 3, 3), ('ledger', '2024-02-03', 50, 0),
        ('clean', '2024-02-01', 900, 0);
    expected_rows:
      - ["ledger", 1000053, 4, 100.0, "2024-02-02"]
  - id: t6
    hidden: true
    description: "Worst day is by ratio, not by failed count (the day with most failures has the best ratio); totals aggregated before comparing"
    ordered: true
    setup_sql: |
      INSERT INTO services (name, target_ppm) VALUES
        ('search', 999000);
      INSERT INTO request_stats (service, day, total_requests, failed_requests) VALUES
        ('search', '2024-03-01', 100000, 900), ('search', '2024-03-02', 1000, 40), ('search', '2024-03-03', 2000, 30);
    expected_rows:
      - ["search", 103000, 970, 99.058, "2024-03-02"]
  - id: t7
    hidden: true
    description: "Daily counts near 10^8 - cross-multiplication and the breach test need 64-bit arithmetic"
    ordered: true
    setup_sql: |
      INSERT INTO services (name, target_ppm) VALUES
        ('gateway', 999990), ('store', 999999);
      INSERT INTO request_stats (service, day, total_requests, failed_requests) VALUES
        ('gateway', '2024-04-01', 100000000, 1500), ('gateway', '2024-04-02', 99999999, 1499), ('gateway', '2024-04-03', 100000000, 100),
        ('store', '2024-04-01', 100000000, 99), ('store', '2024-04-02', 100000000, 102);
    expected_rows:
      - ["gateway", 299999999, 3099, 99.999, "2024-04-01"]
      - ["store", 200000000, 201, 100.0, "2024-04-02"]
  - id: t8
    hidden: true
    description: "Order by rounded availability then service; days given out of order"
    ordered: true
    setup_sql: |
      INSERT INTO services (name, target_ppm) VALUES
        ('zeta', 999000), ('alpha', 999000), ('mid', 999000), ('low', 999000);
      INSERT INTO request_stats (service, day, total_requests, failed_requests) VALUES
        ('zeta', '2024-07-02', 10000, 20), ('zeta', '2024-07-01', 10000, 21), ('alpha', '2024-07-03', 20000, 41),
        ('mid', '2024-07-01', 3000, 4), ('mid', '2024-07-05', 3000, 5), ('low', '2024-07-09', 100, 50),
        ('low', '2024-07-08', 100, 49);
    expected_rows:
      - ["low", 200, 99, 50.5, "2024-07-09"]
      - ["alpha", 20000, 41, 99.795, "2024-07-03"]
      - ["zeta", 20000, 41, 99.795, "2024-07-01"]
      - ["mid", 6000, 9, 99.85, "2024-07-05"]
expected_concepts:
  - aggregation with SUM and GROUP BY joined to a lookup table
  - exact integer comparison of rates instead of floating point
  - picking an arg-min row per group (window function or NOT EXISTS) with a tie-breaker
  - deterministic ORDER BY on a computed column
  - 64-bit arithmetic for large request counts
optimal_complexity: {time: "O(n log n) with a window function per service", space: O(n)}
rubric:
  excellent: Aggregates per service, applies the breach test in integer form, selects the worst day with ROW_NUMBER over a per-service ordering (or NOT EXISTS) with the earliest-day tie-breaker, orders deterministically and explains why integer cross-multiplication avoids rounding mistakes.
  good: Correct report after a hint about the worst-day tie-breaker or about comparing ratios rather than failure counts.
  weak: Picks the day with the most failures, compares rounded percentages against the target, mixes daily and total figures or leaves the order undefined.
  criteria:
    correctness: All tests pass, including exact-on-target services, ties on the worst day and ties on the rounded availability.
    efficiency: One aggregation plus one ranking pass per service; mentions an index on (service, day).
    code_quality: Readable CTEs with named intermediate results and explicit output column names.
    edge_cases: Empty tables, services without stats, 100% and 0% targets, days at 0% availability and very large counts.
    communication: Explains the difference between the ratio-based worst day and the day with most failures.
hints:
  - Split the work in two parts. One part totals the requests per service and decides whether it breaches; the other part finds each service's worst day. Join the two at the end.
  - Compare ratios without dividing. One day is worse than another when its successes times the other day's total are smaller than the other day's successes times its own total, and the breach test can stay in integers the same way.
  - Aggregate the sums per service joined to the targets and keep rows that fail the integer budget test. For the worst day, number each service's days ordered by daily availability ascending then day ascending and keep the first, or keep days for which no other day of the same service is strictly worse or equally bad and earlier. Join both results, compute the rounded percentage and order by it, then by service.
followups:
  - How would you report the remaining error budget for services that are not breaching?
  - How would you compute availability over a rolling 28-day window instead of all recorded days?
  - Which index supports both the aggregation and the worst-day lookup?
common_errors:
  - Choosing the day with the most failed requests instead of the lowest availability ratio.
  - Comparing a rounded percentage with the target, which misclassifies services right at the boundary.
  - Forgetting the earliest-day tie-breaker, which makes the worst day non-deterministic.
  - Using 32-bit integer arithmetic for products of large request counts.
