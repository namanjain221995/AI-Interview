expected_concepts:
  - simulating state in one pass in arrival order
  - lazy refill computed from the elapsed time instead of a per-second loop
  - capping the refill at capacity
  - rejected requests do not consume tokens
  - avoiding 32-bit overflow on elapsed time multiplied by rate
optimal_complexity: {time: O(n), space: "O(1) extra besides the output"}
rubric:
  excellent: Simulates the bucket in one pass with lazy refill from the elapsed time, caps at capacity, leaves the bucket unchanged on rejection, and avoids overflow by using 64-bit arithmetic or by comparing the gap against the missing tokens before multiplying.
  good: Correct one-pass simulation that needs a nudge on one detail such as overflow on long gaps or the no-refill rule for equal timestamps.
  weak: Loops second by second over the gaps, deducts tokens for rejected requests, forgets the capacity cap, or overflows on large gaps.
  criteria:
    correctness: All tests pass, including bursts at one timestamp, zero refill and cost above capacity.
    efficiency: Linear in the number of requests and independent of the size of the time gaps.
    code_quality: Clear state variables (tokens, previous timestamp) and a single place where refill is applied.
    edge_cases: Huge gaps with a huge rate, zero refill rate, exact-fit costs and costs above capacity.
    communication: Explains why the refill can be computed lazily and where overflow could occur.
hints:
  - You do not need to simulate every second; the bucket only matters at the moments a request arrives.
  - Keep the current token count and the previous timestamp; when a request arrives, add the tokens earned since the previous request and clamp to capacity before deciding.
  - For each request add elapsed seconds times the rate (using 64-bit arithmetic or by first checking whether the gap already refills the bucket completely), clamp to capacity, then admit and subtract only when the cost fits, otherwise record a rejection and leave the count alone.
followups:
  - How would you return, for each rejected request, the earliest second at which it would have been admitted?
  - How would you implement this limiter for millions of API keys with little memory per key?
  - What changes if tokens are refilled continuously (fractional tokens) instead of per whole second?
  - How would you share one bucket across several gateway instances?
common_errors:
  - Subtracting the cost even when the request is rejected.
  - Forgetting to cap the refilled tokens at capacity.
  - Computing the gap times the rate in 32-bit integers, which overflows on long idle periods.
  - Looping second by second through the gap, which is too slow for gaps of 10^9 seconds.
