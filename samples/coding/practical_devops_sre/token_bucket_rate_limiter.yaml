version: 1
slug: token_bucket_rate_limiter
title: Token Bucket Admission
difficulty: medium
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [backend, platform, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Token Bucket Admission

  An API gateway protects a billing service with a **token bucket**. You are given the requests that
  reached the gateway, in arrival order: request `i` arrives at second `timestamps[i]` and costs
  `costs[i]` tokens (a bulk export costs more than a single lookup). Decide which requests are admitted.

  The bucket works like this:

  - It holds at most `capacity` tokens and is **full** (exactly `capacity` tokens) when the first request
    arrives.
  - Between two consecutive requests, the bucket gains `refill_per_second` tokens for every whole second
    that passed, that is `(timestamps[i] - timestamps[i - 1]) * refill_per_second` tokens, but it never
    holds more than `capacity`. Requests that share a timestamp get no refill between them.
  - A request is **admitted** when the bucket currently holds at least `costs[i]` tokens; it then removes
    `costs[i]` tokens. Otherwise it is **rejected** and the bucket is left unchanged, so a later, cheaper
    request can still get through.

  Return a list of booleans, one per request in the input order: `true` for admitted, `false` for
  rejected.

  ### Example 1
  ```
  Input:  timestamps = [0, 0, 0, 1, 1, 5],
          costs = [2, 2, 2, 1, 2, 3],
          capacity = 5,
          refill_per_second = 1
  Output: [true, true, false, true, false, true]
  Explanation: the bucket starts with 5 tokens. At second 0 the first two requests leave 1 token
  and the third (cost 2) is rejected. At second 1 one token is added (2 in the bucket): the cost-1
  request is admitted, leaving 1, so the next cost-2 request is rejected. By second 5 the bucket is
  full again (1 + 4 = 5) and the cost-3 request is admitted.
  ```

  ### Example 2
  ```
  Input:  timestamps = [10, 10, 11, 20], costs = [4, 3, 2, 3], capacity = 3, refill_per_second = 2
  Output: [false, true, true, true]
  Explanation: a request that costs more than the capacity can never be admitted. The cost-3
  request empties the bucket; one second later 2 tokens are back, enough for the cost-2 request.
  At second 20 the bucket is capped at 3 tokens.
  ```

  ### Constraints
  - `1 <= timestamps.length == costs.length <= 10^5`
  - `0 <= timestamps[i] <= 2 * 10^9`, and `timestamps` is non-decreasing
  - `1 <= costs[i] <= 10^9`
  - `1 <= capacity <= 10^9`
  - `0 <= refill_per_second <= 10^9`
  - The refill for a long gap can be far larger than a 32-bit integer can hold.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: token_bucket_rate_limiter
  params:
    - {name: timestamps, type: "int[]"}
    - {name: costs, type: "int[]"}
    - {name: capacity, type: "int"}
    - {name: refill_per_second, type: "int"}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    def token_bucket_rate_limiter(timestamps: list[int], costs: list[int], capacity: int, refill_per_second: int) -> list[bool]:
        tokens = capacity
        previous = timestamps[0] if timestamps else 0
        decisions: list[bool] = []
        for now, cost in zip(timestamps, costs):
            elapsed = now - previous
            previous = now
            if elapsed > 0 and tokens < capacity:
                # Compare before multiplying out the whole gap so fixed-width integers never overflow.
                missing = capacity - tokens
                if refill_per_second > 0 and elapsed >= (missing + refill_per_second - 1) // refill_per_second:
                    tokens = capacity
                else:
                    tokens += elapsed * refill_per_second
            if cost <= tokens:
                tokens -= cost
                decisions.append(True)
            else:
                decisions.append(False)
        return decisions
  javascript: |
    function tokenBucketRateLimiter(timestamps, costs, capacity, refillPerSecond) {
      let tokens = capacity;
      let previous = timestamps.length > 0 ? timestamps[0] : 0;
      const decisions = [];
      for (let i = 0; i < timestamps.length; i++) {
        const elapsed = timestamps[i] - previous;
        previous = timestamps[i];
        if (elapsed > 0 && tokens < capacity) {
          const missing = capacity - tokens;
          if (refillPerSecond > 0 && elapsed >= Math.ceil(missing / refillPerSecond)) {
            tokens = capacity;
          } else {
            tokens += elapsed * refillPerSecond;
          }
        }
        if (costs[i] <= tokens) {
          tokens -= costs[i];
          decisions.push(true);
        } else {
          decisions.push(false);
        }
      }
      return decisions;
    }
