expected_concepts:
  - "path prefix matching on component boundaries"
  - "normalising a trailing slash and the root directory"
  - "64-bit accumulation of sizes"
  - "single linear scan"
optimal_complexity: {time: "O(total path length)", space: "O(1) extra"}
rubric:
  excellent: "Normalises the directory once, matches on the directory plus a separator so component boundaries are respected, handles the root and the exact-match case deliberately, and sums in 64 bits in one pass."
  good: "Correct after fixing one boundary issue such as the root directory or the trailing slash; explains the matching rule."
  weak: "Uses a plain string prefix so /var/logs matches /var/log, double counts or crashes on the root, or overflows a 32-bit total."
  criteria:
    correctness: "All tests pass, including root, trailing slash, sibling prefixes and an exact file match."
    efficiency: "One pass over the input with constant extra work per path."
    code_quality: "Clear normalisation step separated from the matching loop."
    edge_cases: "Empty input, root directory, trailing slash, nonexistent directory and large sizes."
    communication: "Explains why matching must happen on whole path components and how the root is covered."
hints:
  - "A plain 'starts with' check on the directory text is not enough; think about what separates one path component from the next."
  - "If you require the file path to start with the directory followed by a slash, sibling names such as logs versus log can no longer match. Decide what that rule means for a trailing slash and for the root."
  - "Strip any trailing slash from the directory, append exactly one slash to form the prefix (the root then becomes a single slash), and add up the sizes of the paths that start with that prefix using a 64-bit total; a path equal to the directory never starts with the prefix, so it is excluded automatically."
followups:
  - "How would you answer many directory queries over the same listing efficiently?"
  - "How would you report the top five largest subdirectories directly under the given directory?"
  - "What changes if paths may contain '..' or symbolic links?"
  - "How would you stream the listing if it had hundreds of millions of entries?"
common_errors:
  - "Plain prefix matching, so /var/logs/old.log is counted under /var/log."
  - "Appending a slash without first removing the trailing one, producing a double slash that matches nothing."
  - "Special-casing the root incorrectly so it matches nothing."
  - "Summing into a 32-bit integer."
