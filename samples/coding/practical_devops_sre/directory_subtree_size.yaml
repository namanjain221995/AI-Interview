version: 1
slug: directory_subtree_size
title: Directory Disk Usage
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [devops, sre, platform, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## Directory Disk Usage

  A disk-usage alert fired on a build host. The agent on the host has already listed every file as an
  absolute path, with `sizes[i]` holding the size in bytes of `paths[i]`. Your job is to answer the
  on-call engineer's question: how many bytes are stored **anywhere under** a given `directory`,
  including files in nested subdirectories?

  Path rules:

  - A file is under the directory only on **whole path components**: `/var/log` contains
    `/var/log/app/api.log` but **not** `/var/logs/old.log` or `/var/log-archive/x`.
  - `directory` may end with a single trailing `/` (`/var/log/` means the same as `/var/log`).
  - `directory = "/"` is the filesystem root and contains every file.
  - A file whose path is exactly equal to `directory` is not inside it and is not counted.

  Return the total size of the matching files, or `0` if none match.

  ### Example 1
  ```
  Input:  paths = ["/var/log/app/api.log", "/var/log/syslog", "/var/logs/old.log", "/etc/hosts"], sizes = [1200, 800, 5000, 40], directory = "/var/log"
  Output: 2000
  Explanation: /var/logs/old.log is in a different directory that merely starts with the same letters.
  ```

  ### Example 2
  ```
  Input:  paths = ["/var/log/app/api.log", "/var/log/syslog", "/var/logs/old.log", "/etc/hosts"], sizes = [1200, 800, 5000, 40], directory = "/"
  Output: 7040
  ```

  ### Example 3
  ```
  Input:  paths = ["/var/log/app/api.log", "/var/log/syslog", "/var/logs/old.log", "/etc/hosts"], sizes = [1200, 800, 5000, 40], directory = "/etc/hosts"
  Output: 0
  ```

  ### Constraints
  - `0 <= paths.length <= 10^4` and `sizes.length == paths.length`
  - Every path starts with `/`, has no trailing `/`, no empty components and no `.` or `..` components; paths are distinct.
  - `directory` starts with `/` and follows the same rules, except that it may end with one `/`.
  - `0 <= sizes[i] <= 10^11`; the total fits in a signed 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: directory_subtree_size
  params:
    - {name: paths, type: "string[]"}
    - {name: sizes, type: "long[]"}
    - {name: directory, type: "string"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def directory_subtree_size(paths: list[str], sizes: list[int], directory: str) -> int:
        base = directory.rstrip("/")  # "/" becomes "", so the prefix below is just "/"
        prefix = base + "/"
        total = 0
        for path, size in zip(paths, sizes):
            if path.startswith(prefix):
                total += size
        return total
  javascript: |
    function directorySubtreeSize(paths, sizes, directory) {
      let base = directory;
      while (base.endsWith("/")) base = base.slice(0, -1);
      const prefix = base + "/";
      let total = 0;
      for (let i = 0; i < paths.length; i++) {
        if (paths[i].startsWith(prefix)) total += sizes[i];
      }
      return total;
    }
tests:
  - {id: t1, args: [["/var/log/app/api.log", "/var/log/syslog", "/var/logs/old.log", "/etc/hosts"], [1200, 800, 5000, 40], "/var/log"], expected: 2000, description: "Example 1 - sibling directory sharing a prefix is excluded"}
  - {id: t2, args: [["/var/log/app/api.log", "/var/log/syslog", "/var/logs/old.log", "/etc/hosts"], [1200, 800, 5000, 40], "/"], expected: 7040, description: "Example 2 - root contains everything"}
  - {id: t3, args: [["/var/log/app/api.log", "/var/log/syslog", "/var/logs/old.log", "/etc/hosts"], [1200, 800, 5000, 40], "/etc/hosts"], expected: 0, description: "Example 3 - a file path equal to the directory is not counted"}
  - {id: t4, hidden: true, args: [[], [], "/var"], expected: 0, description: "No files at all"}
  - {id: t5, hidden: true, args: [["/opt/app/bin/server", "/opt/app/conf/app.yaml", "/opt/application/readme"], [9000, 300, 77], "/opt/app/"], expected: 9300, description: "Trailing slash on the directory and a prefix-sharing sibling"}
  - {id: t6, hidden: true, args: [["/data/app/a", "/data/app2/b", "/data/app-old/c", "/data/ap/d"], [1, 10, 100, 1000], "/data/app"], expected: 1, description: "Boundary traps - app2, app-old and a shorter name ap must not match"}
  - {id: t7, hidden: true, args: [["/a/b/c/d/e/f.txt", "/a/b/x.txt", "/a/y.txt"], [5, 7, 11], "/a/b/c"], expected: 5, description: "Deeply nested file counted from an intermediate directory"}
  - {id: t8, hidden: true, args: [["/home/ci/cache.tar", "/tmp/build.log"], [0, 25], "/nonexistent"], expected: 0, description: "Directory that matches nothing; zero-size file elsewhere"}
