slug: fixed_window_rate_limiter
title: Per-Client Fixed-Window Limiter
difficulty: easy
competency_keys: [data_structures, problem_solving]
role_tags: [backend, platform, sre, devops]
time_limit_minutes: 15
prompt_markdown: |
  ## Per-Client Fixed-Window Limiter

  A public API gateway gives every client its own quota. Time is cut into fixed, back-to-back windows of
  `window_seconds` seconds: a request at time `t` belongs to window number `floor(t / window_seconds)`,
  so with 60-second windows the times 0..59 form window 0, 60..119 window 1, and so on.

  Request `i` comes from client `client_ids[i]` at second `timestamps[i]`. Requests are processed in the
  given order, and timestamps never decrease. A request is **admitted** if its client has had fewer than
  `limit` admitted requests in the request's window so far; otherwise it is **rejected**. Rejected
  requests do not use up quota, and each client's quota is independent of every other client's.

  Return a list of booleans, one per request in input order: `true` if admitted, `false` if rejected.

  ### Example 1
  ```
  Input:  client_ids = ["ci-bot", "ci-bot", "web", "ci-bot", "ci-bot"]
          timestamps = [0, 10, 20, 59, 60], limit = 2, window_seconds = 60
  Output: [true, true, true, false, true]
  Explanation: ci-bot's third request at 59 is still in window 0, where it already has 2 admitted.
  At 60 a new window starts. The web client has its own quota.
  ```

  ### Example 2
  ```
  Input:  client_ids = ["a", "a", "a", "a"], timestamps = [5, 5, 9, 10], limit = 1, window_seconds = 10
  Output: [true, false, false, true]
  ```

  ### Constraints
  - `0 <= client_ids.length == timestamps.length <= 10^5`
  - `0 <= timestamps[i] <= 2^31 - 1`, non-decreasing
  - `0 <= limit <= 10^5`
  - `1 <= window_seconds <= 10^6`
  - client ids are non-empty strings of letters, digits, `-` and `_`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: fixed_window_rate_limiter
  params:
    - {name: client_ids, type: "string[]"}
    - {name: timestamps, type: "int[]"}
    - {name: limit, type: int}
    - {name: window_seconds, type: int}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    def fixed_window_rate_limiter(
        client_ids: list[str], timestamps: list[int], limit: int, window_seconds: int
    ) -> list[bool]:
        # client -> (window index, admitted count in that window)
        state: dict[str, tuple[int, int]] = {}
        decisions: list[bool] = []
        for client, ts in zip(client_ids, timestamps):
            window = ts // window_seconds
            current_window, count = state.get(client, (window, 0))
            if current_window != window:
                count = 0
            if count < limit:
                decisions.append(True)
                count += 1
            else:
                decisions.append(False)
            state[client] = (window, count)
        return decisions
  javascript: |
    function fixedWindowRateLimiter(clientIds, timestamps, limit, windowSeconds) {
      const state = new Map(); // client -> [window index, admitted count]
      const decisions = [];
      for (let i = 0; i < clientIds.length; i++) {
        const window = Math.floor(timestamps[i] / windowSeconds);
        let [currentWindow, count] = state.get(clientIds[i]) || [window, 0];
        if (currentWindow !== window) count = 0;
        if (count < limit) {
          decisions.push(true);
          count += 1;
        } else {
          decisions.push(false);
        }
        state.set(clientIds[i], [window, count]);
      }
      return decisions;
    }
