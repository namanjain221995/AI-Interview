expected_concepts:
  - hash map keyed by client id
  - window index from integer division
  - resetting a counter when the window changes
  - rejected requests do not consume quota
  - memory bounded by the number of distinct clients
optimal_complexity: {time: "O(n) for n requests", space: "O(c) for c distinct clients"}
rubric:
  excellent: "Keeps one window index and admitted count per client in a hash map, resets the count lazily when the window changes, never counts rejections, and discusses the burst at window boundaries and how to evict idle clients."
  good: "Correct per-client counting; one slip such as counting rejected requests or a window off-by-one is fixed after testing."
  weak: "Uses one global counter, never resets counts, or rescans all earlier requests for each new one."
  criteria:
    correctness: "All tests pass, including window boundaries, limit 0 and interleaved clients."
    efficiency: "Constant expected work per request; no rescanning of earlier requests."
    code_quality: "State per client is a small, clearly named pair; the admit decision is a single comparison."
    edge_cases: "Empty input, limit 0, window size 1, timestamps exactly on a boundary, a client returning after skipping windows and very large timestamps."
    communication: "Explains the boundary burst of fixed windows (up to twice the limit across two adjacent windows) compared with sliding windows."
hints:
  - "Each client only needs to know how many requests it has had admitted in its current window."
  - "Store, for every client, the index of the window it last used and an admitted count; when a request falls into a different window, that count starts again from zero."
  - "Walk the requests in order with a hash map from client id to a pair of window index and admitted count. Compute the window as the timestamp integer-divided by the window length, reset the count if the stored window differs, admit and increment when the count is below the limit, and otherwise reject without changing the count."
followups:
  - "Why can a client get up to twice the limit within a short span around a window boundary, and how would you prevent that?"
  - "How would you run this limiter across several gateway instances that share a Redis cluster?"
  - "How would you evict state for clients that have gone idle so memory stays bounded?"
common_errors:
  - "Counting rejected requests against the quota."
  - "Never resetting the count when a new window starts."
  - "Sharing one counter across all clients."
  - "Computing the window with floating-point division and getting boundaries wrong."
  - "Resetting the count only when the window index increases by exactly one, which fails when a client skips windows."
