expected_concepts:
  - modelling lock holders and FIFO wait queues with hash maps
  - wait-for graph with out-degree at most one
  - incremental cycle detection by following wait edges from the new edge
  - why only lock events can create a cycle
  - lock handoff semantics on unlock
optimal_complexity: {time: "O(n * w) where w is the longest wait chain", space: O(n)}
rubric:
  excellent: Models holders and FIFO queues, stores for each waiting transaction the resource it waits on (so a handoff automatically re-points the other waiters), observes that each transaction waits for at most one resource and that only a new wait can close a cycle, and checks only the chain starting at the new edge.
  good: Correct replay that rebuilds the wait-for graph and runs a full cycle detection after each event, or needs a hint about re-pointing waiters after a handoff.
  weak: Grants the lock to the newest waiter, keeps waiters pointing at the old holder after a handoff, treats re-locking an owned resource as a self-wait, or checks for cycles only at the end of the log.
  criteria:
    correctness: All tests pass, including handoffs, re-locks by the holder, multi-transaction cycles and logs without deadlock.
    efficiency: Incremental check per lock event; no full graph rebuild per event.
    code_quality: Clear state maps (holder, queue, waiting_on) and a separate lock and unlock branch.
    edge_cases: Single event, unlock with an empty queue, long wait chains without a cycle and resources that are reused after being freed.
    communication: Explains why storing the awaited resource rather than the holder avoids updating every waiter on a handoff.
hints:
  - Keep, for each resource, its holder and a FIFO queue of waiters, and for each waiting transaction the resource it is waiting for. A waiting transaction issues no events, so it waits for exactly one resource.
  - Every transaction has at most one outgoing wait edge. Ask yourself which kind of event can create a cycle - can an unlock ever close one?
  - On a lock event that makes T wait, start at the holder of the resource and repeatedly jump to the holder of the resource that transaction is waiting for. If you reach T, this event closed a cycle; if you reach a transaction that is not waiting, there is none. Looking holders up through the awaited resource keeps the edges correct after handoffs.
followups:
  - Which transaction would you abort to break the deadlock, and how would you choose it deterministically?
  - How does the model change with shared (read) and exclusive (write) locks?
  - How would you detect deadlocks across several database nodes that each only see their own locks?
  - How would you make the chain walk O(1) amortised for very long wait chains?
common_errors:
  - Handing the lock to the newest waiter instead of the front of the FIFO queue.
  - Leaving the remaining waiters pointing at the transaction that released the lock.
  - Treating a re-lock by the current holder as a wait, which creates a false self-cycle.
  - Running a full graph search after every event, which is slow on long logs.
  - Following wait edges without a stop condition, which loops forever once a cycle exists.
