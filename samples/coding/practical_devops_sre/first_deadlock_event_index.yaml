slug: first_deadlock_event_index
title: Lock Log Deadlock Detector
difficulty: hard
competency_keys: [algorithms, data_structures, debugging]
role_tags: [dba, backend, sre]
time_limit_minutes: 30
prompt_markdown: |
  ## Lock Log Deadlock Detector

  A database froze in production and you have the lock manager's event log. Replay it and find the
  moment the deadlock appeared. Each event is a string `"<txn> lock <resource>"` or
  `"<txn> unlock <resource>"`. Every resource has at most one **holder** and a FIFO **wait queue**.

  - `T lock R`:
    - if nobody holds `R`, `T` becomes its holder;
    - if `T` already holds `R`, nothing happens;
    - otherwise `T` is appended to `R`'s wait queue and is **waiting** for `R`.
  - `T unlock R` (only ever issued by the current holder of `R`): if `R`'s queue is empty, `R` becomes
    free; otherwise the transaction at the **front** of the queue is removed from it, becomes the holder
    of `R` and stops waiting.

  A waiting transaction issues no events until it is granted its lock. The **wait-for graph** has an
  edge `W -> H` for every waiting transaction `W`, where `H` is the **current** holder of the resource
  `W` is waiting for (so when a lock is handed over, the remaining waiters now wait for the new holder).

  Return the index of the **first event after which the wait-for graph contains a cycle**, or `-1` if
  that never happens.

  ### Example 1
  ```
  Input:  events = ["t1 lock orders", "t2 lock payments", "t1 lock payments", "t2 lock orders"]
  Output: 3
  Explanation: after event 2, t1 waits for t2. After event 3, t2 waits for t1: a cycle.
  ```

  ### Example 2
  ```
  Input:  events = ["a lock x", "b lock x", "c lock x", "a unlock x", "a lock y", "b lock y", "a lock x"]
  Output: 6
  Explanation: when a releases x, b (front of the queue) gets it and c now waits for b.
  b then waits for a (holder of y), which is not a cycle. Event 6 makes a wait for b: a -> b -> a.
  ```

  ### Example 3
  ```
  Input:  events = ["t1 lock a", "t2 lock a", "t1 unlock a", "t2 unlock a"]
  Output: -1
  ```

  ### Constraints
  - `1 <= events.length <= 10^4`
  - Transaction and resource names are non-empty and use letters, digits, `_` and `-`; the three parts
    of an event are separated by single spaces.
  - The log is consistent: waiting transactions issue no events and only the holder unlocks a resource.
