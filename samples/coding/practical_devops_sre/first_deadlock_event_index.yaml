reference_solutions:
  python: |
    from collections import deque


    def first_deadlock_event_index(events):
        holder = {}
        queue = {}
        waiting_on = {}
        for i, event in enumerate(events):
            txn, action, lock = event.split(" ")
            if action == "lock":
                owner = holder.get(lock)
                if owner is None:
                    holder[lock] = txn
                elif owner != txn:
                    queue.setdefault(lock, deque()).append(txn)
                    waiting_on[txn] = lock
                    current = owner
                    while current in waiting_on:
                        current = holder[waiting_on[current]]
                        if current == txn:
                            return i
            else:
                waiters = queue.get(lock)
                if waiters:
                    nxt = waiters.popleft()
                    holder[lock] = nxt
                    del waiting_on[nxt]
                else:
                    del holder[lock]
        return -1
  javascript: |
    function firstDeadlockEventIndex(events) {
      const holder = new Map();
      const queues = new Map();
      const waitingOn = new Map();
      for (let i = 0; i < events.length; i++) {
        const [txn, action, lock] = events[i].split(" ");
        if (action === "lock") {
          const owner = holder.get(lock);
          if (owner === undefined) {
            holder.set(lock, txn);
          } else if (owner !== txn) {
            if (!queues.has(lock)) queues.set(lock, []);
            queues.get(lock).push(txn);
            waitingOn.set(txn, lock);
            let current = owner;
            while (waitingOn.has(current)) {
              current = holder.get(waitingOn.get(current));
              if (current === txn) return i;
            }
          }
        } else {
          const waiters = queues.get(lock);
          if (waiters && waiters.length > 0) {
            const next = waiters.shift();
            holder.set(lock, next);
            waitingOn.delete(next);
          } else {
            holder.delete(lock);
          }
        }
      }
      return -1;
    }
