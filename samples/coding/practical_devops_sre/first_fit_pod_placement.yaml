prompt_markdown: |
  ## First-Fit Pod Scheduler

  You are writing a tiny scheduler for a test cluster. Pods are placed **in the given order**. Pod `i`
  requests `pod_cpu[i]` CPU and `pod_memory[i]` memory; node `j` offers `node_cpu[j]` CPU and
  `node_memory[j]` memory in total.

  Each pod goes to the **first node (lowest index)** whose remaining CPU **and** remaining memory are
  both at least the pod's request; that node's remaining resources then shrink by the request. If no node
  can take the pod, its result is `-1` and it consumes nothing.

  Quantities are strings in a Kubernetes-like notation:

  - **CPU** is either an integer number of millicores followed by `m` (`"250m"` is a quarter core), or a
    number of cores with at most 3 decimal places (`"2"`, `"0.5"`, `"1.125"`). One core is `1000m`.
  - **Memory** is an integer number of bytes, optionally followed by a unit: `Ki`, `Mi`, `Gi` (1024,
    1024^2, 1024^3) or `k`, `M`, `G` (1000, 1000^2, 1000^3). So `"1Gi"` is 1073741824 bytes while `"1G"`
    is 1000000000 bytes.

  Comparisons must be **exact**: `"0.1"` is exactly `100m`.

  Return a list with the node index chosen for each pod, in pod order (`-1` for a pod that was not placed).

  ### Example 1
  ```
  Input:  pod_cpu = ["500m", "1", "250m", "3", "0.75"],
          pod_memory = ["1Gi", "512Mi", "256Mi", "1Gi", "2G"],
          node_cpu = ["1", "4"],
          node_memory = ["1Gi", "8Gi"]
  Output: [0, 1, 1, -1, 1]
  Explanation: pod 0 fills node 0's memory. Pod 1 needs a full core and node 0 has only 500m
  left, so it goes to node 1, as does pod 2 (node 0 has no memory left). Pod 3 asks for 3 cores
  but node 1 has 2750m left, so it is not placed. Pod 4 (750m, 2G) fits on node 1.
  ```

  ### Example 2
  ```
  Input:  pod_cpu = ["0.1", "100m", "0.25"],
          pod_memory = ["1G", "1000M", "1000000000"],
          node_cpu = ["0.2"],
          node_memory = ["2Gi"]
  Output: [0, 0, -1]
  Explanation: "1G", "1000M" and "1000000000" are the same amount. After two pods node 0 has
  0m CPU left, so the 250m pod cannot be placed.
  ```

  ### Constraints
  - `0 <= pod_cpu.length == pod_memory.length <= 1000`
  - `1 <= node_cpu.length == node_memory.length <= 100`
  - Every CPU string is `<digits>m`, `<digits>` or `<digits>.<1 to 3 digits>`, at most 1000 cores.
  - Every memory string is `<digits>` optionally followed by one of `Ki`, `Mi`, `Gi`, `k`, `M`, `G`, and
    is at most `2^40` bytes (more than a 32-bit integer can hold).
