des with mixed units"}
expected_concepts:
  - parsing quantities into exact integer base units (millicores and bytes)
  - avoiding floating point for decimal cores
  - 64-bit integers for memory sizes
  - first-fit greedy placement with remaining capacity per node
  - checking both dimensions before committing
optimal_complexity: {time: O(P * N) for P pods and N nodes, space: O(N + P)}
rubric:
  excellent: Converts every quantity once into exact integer millicores and bytes with small helper functions, uses 64-bit values for memory, runs the first-fit loop checking both resources before committing, and explains why floating point is unsafe here.
  good: Correct placement with parsing that needs one fix after the tests, such as decimal-core truncation or the k versus Ki distinction.
  weak: Parses cores with floating point and compares floats, mixes up binary and decimal units, overflows on Gi values, or subtracts resources for pods that were not placed.
  criteria:
    correctness: All tests pass, including exact fits, unit equivalences and unplaced pods.
    efficiency: One pass over the nodes per pod; quantities are parsed once rather than inside the inner loop.
    code_quality: Separate parse helpers for CPU and memory and a clear placement loop without duplicated logic.
    edge_cases: Zero requests, decimal cores with three digits, memory above 32 bits and pods that fit nowhere.
    communication: Explains the unit system and why exact integers are needed for comparisons.
hints:
  - Turn every quantity into a whole number in the smallest unit before comparing anything.
  - CPU becomes millicores by handling the m suffix or the whole and fractional parts separately as integers, and memory becomes bytes by separating the trailing unit from the digits and multiplying by that unit's factor.
  - Parse all node capacities into remaining-CPU and remaining-memory arrays of 64-bit integers, then for each pod scan the nodes from index 0, take the first one where both remaining values are large enough, subtract the request there and record its index, or record minus one and change nothing.
followups:
  - How would best-fit or least-allocated placement change the results, and when would you prefer them?
  - How would you support more units such as Ti or exponent notation?
  - With 10^5 nodes, how could you find the first fitting node faster than a linear scan?
  - How would you add taints or node labels that restrict which pods may land on a node?
common_errors:
  - Converting decimal cores with floating point, so 0.1 three times does not fit into 0.3.
  - Truncating 1.001 times 1000 from a float and getting 1000 instead of 1001.
  - Treating k and Ki (or G and Gi) as the same multiplier.
  - Storing memory in 32-bit integers, which overflows for several Gi.
