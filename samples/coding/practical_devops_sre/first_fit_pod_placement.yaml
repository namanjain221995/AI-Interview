reference_solutions:
  python: |
    def _millicores(text: str) -> int:
        if text.endswith("m"):
            return int(text[:-1])
        whole, _, fraction = text.partition(".")
        return int(whole) * 1000 + int((fraction + "000")[:3])


    _UNITS = {"Ki": 1024, "Mi": 1024**2, "Gi": 1024**3, "k": 1000, "M": 1000**2, "G": 1000**3}


    def _bytes(text: str) -> int:
        for suffix in ("Ki", "Mi", "Gi", "k", "M", "G"):
            if text.endswith(suffix):
                return int(text[: -len(suffix)]) * _UNITS[suffix]
        return int(text)


    def first_fit_pod_placement(pod_cpu: list[str], pod_memory: list[str], node_cpu: list[str], node_memory: list[str]) -> list[int]:
        free_cpu = [_millicores(c) for c in node_cpu]
        free_mem = [_bytes(m) for m in node_memory]
        placement: list[int] = []
        for cpu_text, mem_text in zip(pod_cpu, pod_memory):
            cpu, mem = _millicores(cpu_text), _bytes(mem_text)
            chosen = -1
            for j in range(len(free_cpu)):
                if free_cpu[j] >= cpu and free_mem[j] >= mem:
                    free_cpu[j] -= cpu
                    free_mem[j] -= mem
                    chosen = j
                    break
            placement.append(chosen)
        return placement
  javascript: |
    function parseMillicores(text) {
      if (text.endsWith("m")) return parseInt(text.slice(0, -1), 10);
      const [whole, fraction = ""] = text.split(".");
      return parseInt(whole, 10) * 1000 + parseInt((fraction + "000").slice(0, 3), 10);
    }

    const MEMORY_UNITS = [["Ki", 1024], ["Mi", 1024 ** 2], ["Gi", 1024 ** 3], ["k", 1000], ["M", 1000 ** 2], ["G", 1000 ** 3]];

    function parseBytes(text) {
      for (const [suffix, factor] of MEMORY_UNITS) {
        if (text.endsWith(suffix)) return parseInt(text.slice(0, -suffix.length), 10) * factor;
      }
      return parseInt(text, 10);
    }

    function firstFitPodPlacement(podCpu, podMemory, nodeCpu, nodeMemory) {
      const freeCpu = nodeCpu.map(parseMillicores);
      const freeMem = nodeMemory.map(parseBytes);
      const placement = [];
      for (let i = 0; i < podCpu.length; i++) {
        const cpu = parseMillicores(podCpu[i]);
        const mem = parseBytes(podMemory[i]);
        let chosen = -1;
        for (let j = 0; j < freeCpu.length; j++) {
          if (freeCpu[j] >= cpu && freeMem[j] >= mem) {
            freeCpu[j] -= cpu;
            freeMem[j] -= mem;
            chosen = j;
            break;
          }
        }
        placement.push(chosen);
      }
      return placement;
    }
