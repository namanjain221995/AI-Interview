expected_concepts:
  - "parsing a structured string into a comparison key"
  - "numeric versus lexicographic comparison"
  - "custom comparator or tuple sort key"
  - "stable sorting for equal keys"
  - "handling optional parts (pre-release, build metadata)"
optimal_complexity: {time: "O(n log n * L) for n tags of length L", space: "O(n * L)"}
rubric:
  excellent: "Parses each tag once into a sort key (or a clean comparator), handles numeric versus alphanumeric identifiers, the release-above-pre-release rule, the prefix rule and build metadata, relies on a stable sort, and tests tricky cases like 1.10.0 and hyphenated identifiers aloud."
  good: "Correct core and pre-release ordering with one or two rules fixed after prompting, such as the prefix rule or build metadata."
  weak: "Sorts the strings lexicographically, compares numbers as text, or ranks a release below its pre-releases."
  criteria:
    correctness: "All tests pass, including stable ties, hyphenated identifiers and large numbers."
    efficiency: "One parse per tag and an O(n log n) sort; no re-parsing inside a quadratic loop."
    code_quality: "Parsing and comparison are separated into small, named helpers or a key function."
    edge_cases: "Empty input, build metadata, digits-only versus alphanumeric identifiers and prefix lists."
    communication: "States each precedence rule before coding it and explains how stability is guaranteed."
hints:
  - "Turn each tag into something that compares correctly on its own, instead of comparing the raw strings."
  - "Strip the build metadata first, split the rest at the first hyphen into the core and the pre-release, and remember that a missing pre-release must rank above any present one."
  - "Build a key of the three numeric core parts, then a flag that is higher for releases, then the list of pre-release identifiers where each identifier becomes a pair whose first element puts digits-only identifiers first and whose second element is the number or the text; a shorter list that matches as a prefix sorts first naturally, and a stable sort keeps equal tags in input order."
followups:
  - "How would you find the newest stable release without sorting the whole list?"
  - "How would you reject invalid tags such as 01.2.3 or 1.2.3- with clear error messages?"
  - "Why does SemVer ignore build metadata for precedence, and when could that surprise a deploy tool?"
common_errors:
  - "Comparing versions as strings, which puts 1.10.0 before 1.9.0."
  - "Splitting at every hyphen, which breaks identifiers such as hot-fix."
  - "Ranking a release below its own pre-releases because the empty pre-release sorts first."
  - "Including build metadata in the comparison, which breaks the stable order of equal tags."
