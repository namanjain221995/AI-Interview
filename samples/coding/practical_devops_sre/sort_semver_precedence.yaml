version: 1
slug: sort_semver_precedence
title: "Release Tag Ordering"
difficulty: medium
competency_keys: [algorithms, code_quality, problem_solving]
role_tags: [devops, platform, backend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Release Tag Ordering

  A release dashboard lists the tags of a service's builds and must show them from the oldest to the
  newest release line. Tags follow Semantic Versioning: `MAJOR.MINOR.PATCH`, optionally followed by
  `-PRERELEASE` and/or `+BUILD`, for example `2.4.0`, `2.4.0-rc.1` or `2.4.0-rc.1+sha.9f3c`.

  Return the tags sorted in **ascending precedence** using these rules:

  1. Compare `MAJOR`, then `MINOR`, then `PATCH` **numerically** (`1.10.0` is newer than `1.9.0`).
  2. With equal `MAJOR.MINOR.PATCH`, a tag **without** a pre-release ranks **above** any tag with one
     (`3.0.0-rc.2` comes before `3.0.0`).
  3. Two pre-releases are compared identifier by identifier, splitting at `.`, from left to right:
     - two identifiers made only of digits compare numerically;
     - two identifiers that contain any other character compare in ASCII order (so `RC` < `beta`);
     - a digits-only identifier ranks below one that is not digits-only;
     - if every identifier matches but one list is shorter, the shorter list ranks lower.
  4. Everything after the first `+` is build metadata and is **ignored** for precedence.
  5. Tags of **equal precedence keep their input order** (the sort is stable). Return the tags exactly
     as given, build metadata included.

  The pre-release part starts at the first `-` after `PATCH`; later `-` characters belong to the
  identifiers (`1.0.0-hot-fix.2` has the identifiers `hot-fix` and `2`).

  ### Example 1
  ```
  Input:  versions = ["1.10.0", "1.2.0", "1.9.3", "1.2.0-beta"]
  Output: ["1.2.0-beta", "1.2.0", "1.9.3", "1.10.0"]
  Explanation: the minor versions compare as numbers, and 1.2.0-beta is a pre-release of 1.2.0.
  ```

  ### Example 2
  ```
  Input:  versions = ["3.1.0", "3.1.0-preview.2", "3.1.0-canary.12", "3.1.0-canary", "3.1.0-canary.hotfix", "3.1.0-canary.7"]
  Output: ["3.1.0-canary", "3.1.0-canary.7", "3.1.0-canary.12", "3.1.0-canary.hotfix", "3.1.0-preview.2", "3.1.0"]
  Explanation: "canary" is a prefix of the longer lists so it is lowest; 7 < 12 numerically; a numeric
  identifier ranks below "hotfix"; "canary" < "preview" in ASCII order; the release is highest.
  ```

  ### Example 3
  ```
  Input:  versions = ["1.4.0+build.9", "1.4.0", "1.4.0+build.2", "1.3.9"]
  Output: ["1.3.9", "1.4.0+build.9", "1.4.0", "1.4.0+build.2"]
  Explanation: build metadata is ignored, so the three 1.4.0 tags are equal and keep their input order.
  ```

  ### Constraints
  - `0 <= versions.length <= 10^4`
  - Every tag is valid: `MAJOR`, `MINOR` and `PATCH` are integers between `0` and `10^9` without leading
    zeros; pre-release and build identifiers are non-empty and use only `[0-9A-Za-z-]`; digits-only
    pre-release identifiers have no leading zeros and are at most `10^9`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sort_semver_precedence
  params:
    - {name: versions, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def sort_semver_precedence(versions: list[str]) -> list[str]:
        def precedence(version: str):
            core_and_pre = version.split("+", 1)[0]
            core, _, pre = core_and_pre.partition("-")
            major, minor, patch = (int(part) for part in core.split("."))
            if not pre:
                return (major, minor, patch, 1, ())
            identifiers = tuple(
                (0, int(ident), "") if ident.isdigit() else (1, 0, ident)
                for ident in pre.split(".")
            )
            return (major, minor, patch, 0, identifiers)

        return sorted(versions, key=precedence)
  javascript: |
    function sortSemverPrecedence(versions) {
      const parse = (version) => {
        const coreAndPre = version.split("+")[0];
        const dash = coreAndPre.indexOf("-");
        const core = dash === -1 ? coreAndPre : coreAndPre.slice(0, dash);
        const pre = dash === -1 ? "" : coreAndPre.slice(dash + 1);
        const nums = core.split(".").map(Number);
        const ids = pre === "" ? [] : pre.split(".");
        return { nums, ids };
      };
      const isNumeric = (s) => /^[0-9]+$/.test(s);
      const compareIdent = (a, b) => {
        const an = isNumeric(a);
        const bn = isNumeric(b);
        if (an && bn) return Number(a) - Number(b);
        if (an) return -1;
        if (bn) return 1;
        return a < b ? -1 : a > b ? 1 : 0;
      };
      const compare = (x, y) => {
        for (let i = 0; i < 3; i++) {
          if (x.nums[i] !== y.nums[i]) return x.nums[i] - y.nums[i];
        }
        if (x.ids.length === 0 || y.ids.length === 0) {
          return (x.ids.length === 0 ? 1 : 0) - (y.ids.length === 0 ? 1 : 0);
        }
        const n = Math.min(x.ids.length, y.ids.length);
        for (let i = 0; i < n; i++) {
          const c = compareIdent(x.ids[i], y.ids[i]);
          if (c !== 0) return c;
        }
        return x.ids.length - y.ids.length;
      };
      const items = versions.map((v, i) => ({ v, i, p: parse(v) }));
      items.sort((a, b) => compare(a.p, b.p) || a.i - b.i);
      return items.map((item) => item.v);
    }
