expected_concepts:
  - recursive resolution with memoisation
  - cycle detection with an in-progress (visiting) state during depth-first search
  - propagating a failure to every dependent variable
  - a small character scanner for escapes and references
  - last-definition-wins parsing and defined-but-empty versus undefined
optimal_complexity: {time: "O(D + total resolved output) with memoisation", space: O(D + output)}
rubric:
  excellent: Writes a clean scanner for the three forms, resolves recursively with memoisation and a visiting set, propagates the cycle marker to dependents without confusing it with literal text, and explains defined-but-empty versus undefined.
  good: Correct recursive resolution and cycle detection after a hint about marking variables in progress or about the default rule.
  weak: Uses repeated string replacement that loops forever on cycles, treats $$ as the start of a reference, applies the default to empty values, or leaves dependents of a cycle partially resolved.
  criteria:
    correctness: All tests pass, including self-references, chains into a cycle, escapes and redefinitions.
    efficiency: Each variable is resolved once thanks to memoisation instead of re-expanding shared references.
    code_quality: The scanner and the resolver are separated clearly; the cycle marker is not detected by searching the output text.
    edge_cases: Empty values, undefined references with and without defaults, $$ next to a reference and no definitions at all.
    communication: Explains how the visiting state distinguishes a cycle from a variable that is simply shared by several others.
hints:
  - Treat the variables as a graph in which a reference to another defined variable is an edge; each variable's value depends on the values at the end of its edges.
  - Resolve with a recursive function plus a cache, and remember which variables are currently being resolved. Reaching one of those again means you have found a cycle.
  - Keep the last value per name. To resolve a name, scan its value left to right, copy a dollar for a doubled dollar, and for a reference either recurse (defined name) or use the default text (undefined name). Mark the name as in progress before scanning, and if any recursive call reports a cycle, store the cycle marker as this name's whole value. Cache every finished result and output the names in sorted order.
followups:
  - How would you report the exact cycle path to the operator instead of a marker?
  - Docker Compose also applies the default when the variable is set but empty. How would you support both forms?
  - What would you do to protect the renderer from values that grow exponentially through repeated references?
common_errors:
  - Substituting by repeated find-and-replace until nothing changes, which never terminates on a cycle.
  - Detecting cycles by checking whether the output contains the marker text, which breaks on dependents of cycles.
  - Using the default when the referenced variable is defined with an empty value.
  - Handling $$ after reference parsing, so a doubled dollar followed by a brace is misread as a reference.
