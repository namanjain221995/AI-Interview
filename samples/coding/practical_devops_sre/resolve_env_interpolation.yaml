reference_solutions:
  python: |
    def resolve_env_interpolation(definitions: list[str]) -> list[str]:
        raw: dict[str, str] = {}
        for line in definitions:
            name, value = line.split("=", 1)
            raw[name] = value
        resolved: dict[str, str] = {}
        broken: set[str] = set()
        visiting: set[str] = set()

        def resolve(name: str) -> bool:
            """Resolve name into resolved[name]; False when it depends on a cycle."""
            if name in resolved:
                return name not in broken
            if name in visiting:
                return False
            visiting.add(name)
            text = raw[name]
            out: list[str] = []
            ok = True
            i = 0
            while i < len(text):
                if text[i] != "$":
                    out.append(text[i])
                    i += 1
                elif text[i + 1] == "$":
                    out.append("$")
                    i += 2
                else:
                    end = text.index("}", i)
                    ref, _, default = text[i + 2:end].partition(":-")
                    if ref in raw:
                        if resolve(ref):
                            out.append(resolved[ref])
                        else:
                            ok = False
                    else:
                        out.append(default)
                    i = end + 1
            visiting.discard(name)
            if not ok:
                broken.add(name)
            resolved[name] = "".join(out) if ok else "<CYCLE>"
            return ok

        for name in raw:
            resolve(name)
        return [name + "=" + resolved[name] for name in sorted(raw)]
  javascript: |
    function resolveEnvInterpolation(definitions) {
      const raw = new Map();
      for (const line of definitions) {
        const at = line.indexOf("=");
        raw.set(line.slice(0, at), line.slice(at + 1));
      }
      const CYCLE = "<CYCLE>";
      const resolved = new Map();
      const failedNames = new Set();
      const visiting = new Set();
      // Returns null when the variable depends on a cycle.
      const resolve = (name) => {
        if (resolved.has(name)) return failedNames.has(name) ? null : resolved.get(name);
        if (visiting.has(name)) return null;
        visiting.add(name);
        const text = raw.get(name);
        let out = "";
        let failed = false;
        let i = 0;
        while (i < text.length) {
          const ch = text[i];
          if (ch !== "$") {
            out += ch;
            i += 1;
          } else if (text[i + 1] === "$") {
            out += "$";
            i += 2;
          } else {
            const end = text.indexOf("}", i);
            const inner = text.slice(i + 2, end);
            const sep = inner.indexOf(":-");
            const ref = sep >= 0 ? inner.slice(0, sep) : inner;
            const fallback = sep >= 0 ? inner.slice(sep + 2) : "";
            if (raw.has(ref)) {
              const value = resolve(ref);
              if (value === null) failed = true;
              else out += value;
            } else {
              out += fallback;
            }
            i = end + 1;
          }
        }
        visiting.delete(name);
        if (failed) failedNames.add(name);
        resolved.set(name, failed ? CYCLE : out);
        return failed ? null : out;
      };
      const names = [...raw.keys()].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return names.map((name) => {
        resolve(name);
        return name + "=" + resolved.get(name);
      });
    }
