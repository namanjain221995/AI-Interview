title: Environment Variable Interpolation
difficulty: medium
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [devops, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Environment Variable Interpolation

  A deployment pipeline renders a service's environment file before the container starts. Each entry of
  `definitions` is a line `NAME=value`: the name is the text before the **first** `=` and the value is
  everything after it. If the same name is defined more than once, only its **last** line counts, and a
  name counts as **defined** even when its value is empty.

  Inside a value, the `$` character introduces one of three forms; all other characters are copied as
  they are:

  - `$$` is a literal `$`.
  - `${X}` is replaced by the **resolved** value of variable `X`, or by the empty string if `X` is not
    defined.
  - `${X:-default}` is replaced by the resolved value of `X` if `X` is defined (even if that value is
    empty), and otherwise by the literal text `default`.

  References are resolved recursively: a referenced variable's value is itself interpolated first.
  If resolving a variable would need a variable that lies on a **reference cycle** (a chain of references
  between defined variables that leads back to where it started, including a variable referencing
  itself), then that variable's entire resolved value is the literal string `<CYCLE>`. This applies to
  every variable on the cycle and to every variable whose resolution reaches one. A default is only
  used for an undefined name, so it never creates a cycle.

  Return `"NAME=resolved"` for every distinct defined name, sorted by name in ASCII order.

  ### Example 1
  ```
  Input:  definitions = ["HOST=db.internal", "PORT=5432", "DB_URL=postgres://${HOST}:${PORT}/app", "LOGS=${LOG_DIR:-/var/log}/api", "PRICE=$$5"]
  Output: ["DB_URL=postgres://db.internal:5432/app", "HOST=db.internal", "LOGS=/var/log/api", "PORT=5432", "PRICE=$5"]
  Explanation: LOG_DIR is undefined, so its default /var/log is used. PRICE uses $$ for a literal dollar.
  ```

  ### Example 2
  ```
  Input:  definitions = ["A=x${B}", "B=${A}y", "C=${A}", "D=old", "D=new-${MISSING}", "MODE=", "RUN=[${MODE:-safe}]"]
  Output: ["A=<CYCLE>", "B=<CYCLE>", "C=<CYCLE>", "D=new-", "MODE=", "RUN=[]"]
  Explanation: A and B reference each other and C depends on A, so all three are <CYCLE>. Only the last
  line of D counts and MISSING is undefined without a default (empty). MODE is defined with an empty
  value, so RUN does not use the default.
  ```

  ### Constraints
  - `0 <= definitions.length <= 500`
  - Names match `[A-Z_][A-Z0-9_]*`; every line contains `=` and every value is at most 200 characters.
  - Every `$` in a value is part of `$$` or starts a well-formed `${X}` or `${X:-default}`, where `X` is a
    valid name and `default` contains no `$`, `{` or `}`.
  - Every resolved value is at most 10^4 characters long.
languages: [python, javascript, typescript, java, go, cpp]
