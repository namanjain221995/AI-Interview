  - {id: t2, args: [["auth", "billing", "ledger", "docs"], [["auth", "billing"], ["billing", "ledger"], ["ledger", "auth"]]], expected: [], description: "Example 2 - a cycle means no plan even for unrelated services"}
  - {id: t3, args: [["edge", "metrics", "gateway"], [["edge", "gateway"], ["edge", "gateway"], ["edge", "metrics"], ["gateway", "metrics"]]], expected: [["metrics"], ["gateway"], ["edge"]], description: "Example 3 - duplicate pair and wave from the latest dependency"}
  - {id: t4, hidden: true, args: [[], []], expected: [], description: "No services at all"}
  - {id: t5, hidden: true, args: [["zeta", "Alpha", "beta", "alpha", "_ops", "9-lives"], []], expected: [["9-lives", "Alpha", "_ops", "alpha", "beta", "zeta"]], description: "No dependencies - one wave in ASCII order (digits, uppercase, underscore, lowercase)"}
  - {id: t6, hidden: true, args: [["solo", "loop"], [["loop", "loop"]]], expected: [], description: "Self-dependency is a cycle"}
  - {id: t7, hidden: true, args: [["s5", "s4", "s3", "s2", "s1"], [["s5", "s4"], ["s4", "s3"], ["s3", "s2"], ["s2", "s1"], ["s5", "s1"], ["s5", "s4"]]], expected: [["s1"], ["s2"], ["s3"], ["s4"], ["s5"]], description: "Linear chain - one service per wave; shortcut edge must not pull s5 earlier"}
  - {id: t8, hidden: true, args: [["app", "queue", "store", "cdn", "dns", "lb"], [["app", "store"], ["app", "queue"], ["queue", "store"], ["lb", "dns"], ["cdn", "dns"], ["app", "lb"]]], expected: [["dns", "store"], ["cdn", "lb", "queue"], ["app"]], description: "Two independent subgraphs merging into one service - longest path decides the wave"}
