expected_concepts:
  - "topological sort (Kahn's algorithm) processed level by level"
  - "in-degree counting and adjacency lists"
  - "cycle detection by counting placed nodes"
  - "longest-path layering in a DAG"
  - "de-duplicating edges or counting them consistently"
optimal_complexity: {time: "O(V + E + V log V) including sorting each wave", space: "O(V + E)"}
rubric:
  excellent: "Builds adjacency lists and in-degrees, runs Kahn's algorithm one level at a time so each level is a wave, sorts each wave, detects a cycle by comparing placed services with the total, and explains why a level-by-level traversal yields the latest-dependency wave rule."
  good: "Correct waves via Kahn's algorithm or memoised longest-path DFS, with a small issue around duplicates, self-loops or sorting fixed after a hint."
  weak: "Assigns waves by BFS distance from roots (shortest path), misses cycles, or returns a flat order instead of waves."
  criteria:
    correctness: "All tests pass, including cycles, self-dependencies, duplicate pairs and shortcut edges."
    efficiency: "Linear in services plus dependencies, apart from sorting the names in each wave."
    code_quality: "Graph building, layering and cycle detection are clearly separated with meaningful names."
    edge_cases: "Empty input, isolated services, duplicate pairs, self-loops and a cycle after valid waves."
    communication: "Explains the direction of each edge and why the earliest wave equals the longest dependency chain."
hints:
  - "Model the release as a directed graph between services. Which services can go out first, and what changes once they are deployed?"
  - "Count for each service how many distinct dependencies are still not deployed. All services whose count is zero form the next wave; deploying them lowers the counts of the services that wait on them."
  - "Run Kahn's algorithm level by level: start with the services that have no dependencies, then repeatedly collect every service whose remaining count drops to zero while processing the current wave, sort each wave by name, and if fewer services were placed than exist, the graph has a cycle and the answer is empty. Remove duplicate pairs first, or count them consistently."
followups:
  - "How would you limit each wave to at most k services while keeping the plan as short as possible?"
  - "How would you report one cycle to the user instead of just returning an empty plan?"
  - "If one service fails in wave 2, which services in later waves must be held back?"
common_errors:
  - "Reversing the edge direction, which deploys services before their dependencies."
  - "Using shortest distance from a root, which puts a service too early when it also has a longer dependency chain."
  - "Forgetting cycle detection, returning a partial plan when some services can never be placed."
  - "Counting a duplicate pair twice in the in-degree but decrementing it once, leaving a service stuck."
