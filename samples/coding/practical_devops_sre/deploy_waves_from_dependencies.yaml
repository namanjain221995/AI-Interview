version: 1
slug: deploy_waves_from_dependencies
title: "Deployment Wave Planner"
difficulty: medium
competency_keys: [algorithms, data_structures]
role_tags: [devops, platform, sre, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Deployment Wave Planner

  A release train rolls out a set of services in **waves**: every service in a wave is deployed in
  parallel, and a wave starts only after the previous wave has finished.

  `services` lists every service in the release (names are distinct). Each pair `[a, b]` in
  `dependencies` means **`a` must be deployed after `b`** (so `b` has to be in an earlier wave than
  `a`). Both names of every pair appear in `services`; the same pair may be listed more than once.

  Put every service in the **earliest wave possible**:

  - a service with no dependencies goes in wave 1;
  - otherwise its wave is one more than the **latest** wave among the services it depends on.

  Return the waves in order (wave 1 first). Inside each wave, sort the names in ascending
  lexicographic (ASCII) order. If the dependencies contain a **cycle** (including a service that depends
  on itself), no valid plan exists: return an empty list. An empty `services` list also gives an empty
  list.

  ### Example 1
  ```
  Input:  services = ["api", "db", "cache", "web", "worker"]
          dependencies = [["api", "db"], ["api", "cache"], ["web", "api"], ["worker", "db"]]
  Output: [["cache", "db"], ["api", "worker"], ["web"]]
  ```

  ### Example 2
  ```
  Input:  services = ["auth", "billing", "ledger", "docs"]
          dependencies = [["auth", "billing"], ["billing", "ledger"], ["ledger", "auth"]]
  Output: []
  Explanation: auth -> billing -> ledger -> auth is a cycle, so no plan exists even for docs.
  ```

  ### Example 3
  ```
  Input:  services = ["edge", "metrics", "gateway"]
          dependencies = [["edge", "gateway"], ["edge", "gateway"], ["edge", "metrics"], ["gateway", "metrics"]]
  Output: [["metrics"], ["gateway"], ["edge"]]
  Explanation: edge waits for gateway (wave 2), so it lands in wave 3 even though it also depends on metrics.
  ```

  ### Constraints
  - `0 <= services.length <= 10^4`
  - `0 <= dependencies.length <= 5 * 10^4`
  - Service names are 1 to 30 characters from `[A-Za-z0-9_-]` and are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: deploy_waves_from_dependencies
  params:
    - {name: services, type: "string[]"}
    - {name: dependencies, type: "string[][]"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def deploy_waves_from_dependencies(services: list[str], dependencies: list[list[str]]) -> list[list[str]]:
        dependents: dict[str, list[str]] = {name: [] for name in services}
        pending: dict[str, int] = {name: 0 for name in services}
        for later, earlier in {(pair[0], pair[1]) for pair in dependencies}:
            dependents[earlier].append(later)
            pending[later] += 1

        waves: list[list[str]] = []
        current = sorted(name for name in services if pending[name] == 0)
        placed = 0
        while current:
            waves.append(current)
            placed += len(current)
            upcoming = []
            for name in current:
                for later in dependents[name]:
                    pending[later] -= 1
                    if pending[later] == 0:
                        upcoming.append(later)
            current = sorted(upcoming)
        return waves if placed == len(services) else []
  javascript: |
    function deployWavesFromDependencies(services, dependencies) {
      const dependents = new Map(services.map((name) => [name, []]));
      const pending = new Map(services.map((name) => [name, 0]));
      const seen = new Set();
      for (const [later, earlier] of dependencies) {
        const key = later + "\u0000" + earlier;
        if (seen.has(key)) continue;
        seen.add(key);
        dependents.get(earlier).push(later);
        pending.set(later, pending.get(later) + 1);
      }
      const byCodeUnit = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
      const waves = [];
      let current = services.filter((name) => pending.get(name) === 0).sort(byCodeUnit);
      let placed = 0;
      while (current.length > 0) {
        waves.push(current);
        placed += current.length;
        const upcoming = [];
        for (const name of current) {
          for (const later of dependents.get(name)) {
            pending.set(later, pending.get(later) - 1);
            if (pending.get(later) === 0) upcoming.push(later);
          }
        }
        current = upcoming.sort(byCodeUnit);
      }
      return placed === services.length ? waves : [];
    }
