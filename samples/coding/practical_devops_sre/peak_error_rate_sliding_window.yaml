expected_concepts:
  - "sliding window with two pointers over a sorted stream"
  - "half-open time interval (t - w, t]"
  - "grouping equal timestamps before evaluating a window"
  - "running error count instead of recounting"
  - "minimum sample size to avoid noisy ratios"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Uses a two-pointer window with a running error count, evaluates a window only after the last request with the same timestamp, applies the exclusive left edge correctly, enforces min_requests and returns 0.0 when nothing qualifies, with an O(n) argument."
  good: "Correct two-pointer solution that needs a hint about equal timestamps or the exclusive left edge, or a correct O(n log n) binary-search version."
  weak: "Recounts each window from scratch in O(n^2), includes requests exactly window_seconds old, or evaluates windows that stop at the current index."
  criteria:
    correctness: "All tests pass, including equal timestamps, the exclusive edge and min_requests filtering."
    efficiency: "Each request enters and leaves the window once; constant extra memory."
    code_quality: "Window maintenance and evaluation are clearly separated; the edge condition is written once."
    edge_cases: "Empty log, no errors, single request, huge window and no significant window."
    communication: "Explains why the window must include later requests with the same timestamp and why min_requests matters."
hints:
  - "Since timestamps never decrease, the requests inside the window for a time t form one contiguous stretch of the log ending at the last request stamped t."
  - "Keep a left pointer and a running error count; as the right side advances, move the left pointer past requests that are window_seconds or more older than the current time. Be careful about requests that share the current timestamp."
  - "Advance the right pointer over the log adding errors, but only evaluate a window when the next request has a larger timestamp (or the log ends); then drop requests from the left while their timestamp is at most the current time minus window_seconds, and if the remaining count reaches min_requests compare errors divided by count with the best so far, which starts at 0.0."
followups:
  - "How would you report the time range of the worst window as well as its rate?"
  - "How would you compute this in a streaming system that sees requests one by one with bounded memory?"
  - "Why can a high error rate over very few requests be misleading, and how else could you handle it?"
common_errors:
  - "Evaluating the window at every index, which leaves out later requests with the same timestamp."
  - "Using an inclusive left edge, which keeps requests that are exactly window_seconds old."
  - "Recounting the window from scratch for each request, giving quadratic time."
  - "Integer division of errors by count in languages where both are integers."
