title: "Worst Error-Rate Window"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, backend, data_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## Worst Error-Rate Window

  An on-call engineer is reviewing a request log after an incident. Request `i` arrived at
  `timestamps[i]` (whole seconds, **non-decreasing**) and `is_error[i]` says whether it failed.

  For every request time `t` in the log, look at the window of all requests whose timestamp lies in
  `(t - window_seconds, t]`, that is, strictly after `t - window_seconds` and up to and including `t`.
  Note that this window contains **every** request stamped exactly `t`, including ones that appear later
  in the log.

  A window is **significant** when it holds at least `min_requests` requests. Its error rate is
  `errors / requests` inside the window.

  Return the **highest error rate** over all significant windows, or `0.0` if no window is significant.
  Answers within `1e-6` of the expected value are accepted.

  ### Example 1
  ```
  Input:  timestamps = [1, 2, 3, 4, 10, 20]
          is_error   = [false, true, true, true, false, true]
          window_seconds = 4, min_requests = 3
  Output: 0.75
  Explanation: the window for t = 4 is (0, 4] with 4 requests and 3 errors. The window for t = 20
  holds only one (failed) request, which is below min_requests.
  ```

  ### Example 2
  ```
  Input:  timestamps = [5, 5, 5, 5, 6]
          is_error   = [true, true, false, false, false]
          window_seconds = 1, min_requests = 2
  Output: 0.5
  Explanation: the window for t = 5 holds all four requests stamped 5, so its rate is 2 / 4. The
  window for t = 6 is (5, 6] and holds one request.
  ```

  ### Example 3
  ```
  Input:  timestamps = [100, 200, 300]
          is_error   = [true, true, true]
          window_seconds = 50, min_requests = 2
  Output: 0.0
  ```

  ### Constraints
  - `0 <= timestamps.length == is_error.length <= 10^5`
  - `0 <= timestamps[i] <= 10^9`, and `timestamps[i] <= timestamps[i + 1]`
  - `1 <= window_seconds <= 10^9`
  - `1 <= min_requests <= 10^5`
  - Aim for `O(n)` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: peak_error_rate_sliding_window
  params:
    - {name: timestamps, type: "int[]"}
    - {name: is_error, type: "bool[]"}
    - {name: window_seconds, type: "int"}
    - {name: min_requests, type: "int"}
  return_type: "float"
  comparison: float_tolerance
reference_solutions:
  python: |
    def peak_error_rate_sliding_window(timestamps: list[int], is_error: list[bool], window_seconds: int, min_requests: int) -> float:
        n = len(timestamps)
        best = 0.0
        left = 0
        errors = 0
        for right in range(n):
            if is_error[right]:
                errors += 1
            if right + 1 < n and timestamps[right + 1] == timestamps[right]:
                continue
            while timestamps[left] <= timestamps[right] - window_seconds:
                if is_error[left]:
                    errors -= 1
                left += 1
            count = right - left + 1
            if count >= min_requests:
                best = max(best, errors / count)
        return best
  javascript: |
    function peakErrorRateSlidingWindow(timestamps, isError, windowSeconds, minRequests) {
      const n = timestamps.length;
      let best = 0;
      let left = 0;
      let errors = 0;
      for (let right = 0; right < n; right++) {
        if (isError[right]) errors++;
        if (right + 1 < n && timestamps[right + 1] === timestamps[right]) continue;
        while (timestamps[left] <= timestamps[right] - windowSeconds) {
          if (isError[left]) errors--;
          left++;
        }
        const count = right - left + 1;
        if (count >= minRequests) best = Math.max(best, errors / count);
      }
      return best;
    }
