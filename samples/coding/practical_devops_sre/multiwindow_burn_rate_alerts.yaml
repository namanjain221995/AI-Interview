role_tags: [sre, devops, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Multi-Window Burn-Rate Alerting

  A service has an availability SLO whose **error budget** is `budget_ppm` failed requests per million
  (for a 99.9% SLO, `budget_ppm = 1000`). The monitoring pipeline produces one data point per minute:
  `total[i]` requests and `errors[i]` failed requests in minute `i`.

  To page only for real, sustained problems, the alert checks two windows that both end at the current
  minute `i`:

  - the **long window**: minutes `i - long_window + 1` through `i`;
  - the **short window**: minutes `i - short_window + 1` through `i`.

  A window is **burning** when it has at least one request and its error rate is at least
  `burn_threshold` times the budget. With integer arithmetic only:

  `window_errors * 1_000_000 >= burn_threshold * budget_ppm * window_total`

  The alert **fires at minute `i`** when `i + 1 >= long_window` (the long window is complete) and **both**
  windows are burning. Return all minutes at which the alert fires, in ascending order.

  Sums can exceed 32-bit integers, so use 64-bit arithmetic where your language needs it. Aim for
  `O(n)` time.

  ### Example 1
  ```
  Input:  total  = [1000, 1000, 1000, 1000, 1000, 1000]
          errors = [0, 5, 30, 40, 2, 0]
          budget_ppm = 1000, long_window = 4, short_window = 2, burn_threshold = 10
  Output: [3, 4]
  Explanation: burning means an error rate of at least 10 * 0.1% = 1%. At minute 3 the long window has
  75 / 4000 and the short window 70 / 2000. At minute 5 the long window still burns (72 / 4000) but the
  short window has recovered (2 / 2000), so the alert stops.
  ```

  ### Example 2
  ```
  Input:  total  = [500, 500, 500, 500]
          errors = [0, 0, 0, 50]
          budget_ppm = 1000, long_window = 4, short_window = 1, burn_threshold = 30
  Output: []
  Explanation: the short window burns (50 / 500 = 10% >= 3%) but the long window has 50 / 2000 = 2.5%.
  ```

  ### Example 3
  ```
  Input:  total  = [200, 200]
          errors = [1, 1]
          budget_ppm = 5000, long_window = 2, short_window = 1, burn_threshold = 1
  Output: [1]
  Explanation: both windows are exactly at the threshold (0.5%), which counts as burning.
  ```

  ### Constraints
  - `0 <= total.length == errors.length <= 5000`
  - `0 <= errors[i] <= total[i] <= 10^6`
  - `1 <= budget_ppm <= 10^6`, `1 <= burn_threshold`, and `burn_threshold * budget_ppm <= 10^6`
  - `1 <= short_window <= long_window <= 5000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: multiwindow_burn_rate_alerts
  params:
    - {name: total, type: "long[]"}
    - {name: errors, type: "long[]"}
    - {name: budget_ppm, type: "int"}
    - {name: long_window, type: "int"}
    - {name: short_window, type: "int"}
    - {name: burn_threshold, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def multiwindow_burn_rate_alerts(total: list[int], errors: list[int], budget_ppm: int, long_window: int, short_window: int, burn_threshold: int) -> list[int]:
        prefix_total = [0]
        prefix_errors = [0]
        for t, e in zip(total, errors):
            prefix_total.append(prefix_total[-1] + t)
            prefix_errors.append(prefix_errors[-1] + e)
        limit = burn_threshold * budget_ppm

        def burning(start: int, end: int) -> bool:
            requests = prefix_total[end] - prefix_total[start]
            failed = prefix_errors[end] - prefix_errors[start]
            return requests > 0 and failed * 1_000_000 >= limit * requests

        firing = []
        for i in range(long_window - 1, len(total)):
            if burning(i + 1 - long_window, i + 1) and burning(i + 1 - short_window, i + 1):
                firing.append(i)
        return firing
  javascript: |
    function multiwindowBurnRateAlerts(total, errors, budgetPpm, longWindow, shortWindow, burnThreshold) {
      const n = total.length;
      const prefixTotal = [0];
      const prefixErrors = [0];
      for (let i = 0; i < n; i++) {
        prefixTotal.push(prefixTotal[i] + total[i]);
        prefixErrors.push(prefixErrors[i] + errors[i]);
      }
      const limit = BigInt(burnThreshold) * BigInt(budgetPpm);
      const burning = (start, end) => {
        const requests = prefixTotal[end] - prefixTotal[start];
        const failed = prefixErrors[end] - prefixErrors[start];
        return requests > 0 && BigInt(failed) * 1000000n >= limit * BigInt(requests);
      };
      const firing = [];
      for (let i = longWindow - 1; i < n; i++) {
        if (burning(i + 1 - longWindow, i + 1) && burning(i + 1 - shortWindow, i + 1)) firing.push(i);
      }
      return firing;
    }
