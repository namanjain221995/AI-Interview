expected_concepts:
  - "prefix sums for O(1) window totals"
  - "multi-window, multi-burn-rate SLO alerting"
  - "integer cross-multiplication instead of floating-point division"
  - "64-bit overflow awareness"
  - "guarding against empty (zero-traffic) windows"
optimal_complexity: {time: "O(n)", space: "O(n) for prefix sums (O(1) with two running window sums)"}
rubric:
  excellent: "Builds prefix sums (or two running sums), evaluates both windows in O(1) per minute only once the long window is complete, compares with integer cross-multiplication in 64-bit arithmetic, rejects zero-traffic windows, and explains why the short window makes the alert reset quickly."
  good: "Correct results with prefix sums but needs a hint on the zero-traffic guard, the threshold equality or 64-bit sums."
  weak: "Recomputes each window with a nested loop, compares floating-point rates, starts evaluating before the long window is complete, or overflows 32-bit sums."
  criteria:
    correctness: "All tests pass, including threshold equality, zero-traffic windows and large counts."
    efficiency: "Constant work per minute after a linear prefix-sum pass."
    code_quality: "A small helper decides whether a window burns; the start index and window bounds are computed once and named."
    edge_cases: "Fewer minutes than the long window, equal windows, zero traffic and maximal values."
    communication: "Explains the purpose of the two windows and why integer arithmetic avoids rounding errors."
hints:
  - "Each check needs the sum of requests and the sum of errors over a range of minutes ending now. How can you get any range sum without adding it up again every minute?"
  - "With prefix sums, a window's totals are the difference of two prefix values. Compare the error rate with the threshold by cross-multiplying instead of dividing, and remember that a window with no traffic can never burn."
  - "Build prefix sums of total and errors with 64-bit integers, then for every minute from long_window minus one onward compute both window totals by subtraction; fire when each window has a positive total and its errors times one million is at least burn_threshold times budget_ppm times its total, collecting the minute indices in order."
followups:
  - "How would you add a second alert tier (for example a 6-hour and 30-minute pair at a lower burn rate) that opens a ticket instead of paging?"
  - "How would you compute this on a live stream with constant memory per alert?"
  - "Why do multi-window alerts reduce both false pages and time-to-reset compared with a single window?"
common_errors:
  - "Summing every window from scratch, giving O(n * long_window) time."
  - "Dividing integers to get a rate, which truncates to zero, or comparing floating-point rates that miss the equality case."
  - "Accumulating totals in 32-bit integers, which overflow on high-traffic services."
  - "Treating a window with zero requests as burning or dividing by zero."
  - "Evaluating minutes before the long window is complete."
