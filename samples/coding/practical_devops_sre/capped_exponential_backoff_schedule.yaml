  - {id: t2, args: [100, 3, 5000, 10, 1500], expected: [100, 300, 900], description: "Example 2 - budget stops the plan early"}
  - {id: t3, hidden: true, args: [100, 2, 1000, 0, 10000], expected: [], description: "max_attempts 0 gives no retries"}
  - {id: t4, hidden: true, args: [1, 2, 10, 5, 0], expected: [], description: "Zero budget: even the first delay does not fit"}
  - {id: t5, hidden: true, args: [250, 1, 1000, 4, 1000], expected: [250, 250, 250, 250], description: "Multiplier 1 and the budget is met exactly"}
  - {id: t6, hidden: true, args: [5000, 2, 3000, 3, 100000], expected: [3000, 3000, 3000], description: "Base above the cap: every delay is capped"}
  - {id: t7, hidden: true, args: [1, 10, 1000000000000, 100, 5000000000000], expected: [1, 10, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000, 10000000000, 100000000000, 1000000000000, 1000000000000, 1000000000000, 1000000000000], description: "Large k with multiplier 10: naive powers overflow 64 bits; cap then budget stop"}
  - {id: t8, hidden: true, args: [1000000000000, 10, 1000000000000, 3, 1000000000000000], expected: [1000000000000, 1000000000000, 1000000000000], description: "Largest base and cap values"}
  - {id: t9, hidden: true, args: [50, 2, 400, 8, 1000], expected: [50, 100, 200, 400], description: "Budget reached exactly after the cap kicks in"}
