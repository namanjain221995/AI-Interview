expected_concepts:
  - iterative growth of the delay instead of computing a power each time
  - stopping growth once the cap is reached to avoid overflow
  - running total checked before committing each delay
  - early termination when the budget would be exceeded
optimal_complexity: {time: "O(r) where r is the number of retries returned (at most max_attempts)", space: "O(r) for the output"}
rubric:
  excellent: "Grows the delay iteratively, stops multiplying once the cap is reached so nothing overflows, checks the budget before adding each delay, and explains the stop-not-skip rule and the multiplier 1 and zero-budget cases."
  good: "Correct schedule and budget handling; overflow on large attempt counts is fixed after a hint."
  weak: "Computes the power directly and overflows, adds a delay before checking the budget, or skips a delay that does not fit and keeps going."
  criteria:
    correctness: "All tests pass, including budgets met exactly, zero budgets and zero attempts."
    efficiency: "Linear in the number of planned retries, with constant work per retry."
    code_quality: "The loop has one clear stopping rule; names such as delay, total and budget match the statement."
    edge_cases: "Multiplier 1, base above the cap, max_attempts 0, budget 0, budget equal to the total, and 60 or more attempts with large multipliers."
    communication: "Explains why the multiplication is guarded and how the approach avoids floating-point powers."
hints:
  - "Rather than computing a power for each attempt, think about how each delay relates to the one before it."
  - "Each uncapped delay is the previous one times the multiplier, but once it reaches the cap it never needs to grow again; before accepting a delay, check whether it still fits in the remaining budget."
  - "Keep the current uncapped delay and the running total. For each attempt take the smaller of the cap and the current delay, stop the whole loop if adding it would exceed the budget, otherwise record it and add it, and multiply the current delay only while it is still below the cap so the value stays small enough for 64-bit integers."
followups:
  - "How would you add full jitter so that many clients do not retry in lockstep?"
  - "How would you make the budget a wall-clock deadline that also includes the time spent on each attempt?"
  - "Which errors should never be retried, and how would the planner know?"
common_errors:
  - "Using a floating-point or integer power for every attempt, which overflows for large k."
  - "Adding the delay to the total before checking the budget, so the plan overshoots by one retry."
  - "Skipping a delay that does not fit and continuing with later ones instead of stopping."
  - "Treating a budget reached exactly as exceeded."
  - "Multiplying an already capped delay forever until it overflows and wraps negative."
