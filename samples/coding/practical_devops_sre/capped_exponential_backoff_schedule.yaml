slug: capped_exponential_backoff_schedule
title: Retry Backoff Planner
difficulty: easy
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [backend, sre, devops, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Retry Backoff Planner

  A payments client retries a failing call to an upstream service. Before retry number `k`
  (`k = 1, 2, ..., max_attempts`) it waits

  ```
  delay(k) = min(cap_ms, base_ms * multiplier^(k - 1))
  ```

  milliseconds. The client also has an overall time budget: the **sum of all delays it waits** may never
  exceed `total_budget_ms`. Retries are planned in order, and as soon as waiting the next delay would
  push the running total **above** `total_budget_ms`, the client gives up and plans no further retries
  (it does not skip ahead to a later, smaller delay). Reaching the budget exactly is allowed.

  Return the list of delays the client actually waits, in order. Return an empty list when no retry fits.

  `multiplier^(k - 1)` grows very quickly: your solution must give the right answer for large
  `max_attempts` without overflowing.

  ### Example 1
  ```
  Input:  base_ms = 100, multiplier = 2, cap_ms = 1000, max_attempts = 6, total_budget_ms = 10000
  Output: [100, 200, 400, 800, 1000, 1000]
  Explanation: the fifth delay would be 1600 but is capped at 1000; the total 3500 stays within budget.
  ```

  ### Example 2
  ```
  Input:  base_ms = 100, multiplier = 3, cap_ms = 5000, max_attempts = 10, total_budget_ms = 1500
  Output: [100, 300, 900]
  Explanation: the running total is 1300 after three retries; the fourth delay 2700 would exceed 1500.
  ```

  ### Constraints
  - `1 <= base_ms <= 10^12`
  - `1 <= multiplier <= 10`
  - `1 <= cap_ms <= 10^12`
  - `0 <= max_attempts <= 10^5`
  - `0 <= total_budget_ms <= 10^15`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: capped_exponential_backoff_schedule
  params:
    - {name: base_ms, type: long}
    - {name: multiplier, type: int}
    - {name: cap_ms, type: long}
    - {name: max_attempts, type: int}
    - {name: total_budget_ms, type: long}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def capped_exponential_backoff_schedule(
        base_ms: int, multiplier: int, cap_ms: int, max_attempts: int, total_budget_ms: int
    ) -> list[int]:
        delays: list[int] = []
        raw = base_ms  # uncapped delay, but never grown past the cap
        total = 0
        for _ in range(max_attempts):
            delay = min(cap_ms, raw)
            if total + delay > total_budget_ms:
                break
            delays.append(delay)
            total += delay
            if raw < cap_ms:
                raw *= multiplier  # raw < cap <= 10^12 and multiplier <= 10, so this fits in 64 bits
        return delays
  javascript: |
    function cappedExponentialBackoffSchedule(baseMs, multiplier, capMs, maxAttempts, totalBudgetMs) {
      const delays = [];
      let raw = baseMs;
      let total = 0;
      for (let k = 0; k < maxAttempts; k++) {
        const delay = Math.min(capMs, raw);
        if (total + delay > totalBudgetMs) break;
        delays.push(delay);
        total += delay;
        if (raw < capMs) raw *= multiplier;
      }
      return delays;
    }
tests:
