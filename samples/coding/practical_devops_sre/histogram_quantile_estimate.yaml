expected_concepts:
  - cumulative counts versus per-bucket counts
  - locating the bucket that contains the rank (linear scan or binary search)
  - linear interpolation inside a bucket
  - handling the +Inf bucket and the empty histogram
  - 64-bit counts with floating point rank
optimal_complexity: {time: O(m) for m buckets (O(log m) with binary search), space: O(1)}
rubric:
  excellent: Computes the rank once, finds the first cumulative count reaching it, handles the empty histogram and the +Inf bucket explicitly, interpolates with the previous bound and previous count (0 for the first bucket), and explains why the denominator cannot be zero.
  good: Correct interpolation with one fix needed for an edge such as the first bucket's lower bound, the +Inf bucket or q equal to 1.
  weak: Treats cumulative counts as per-bucket counts, interpolates with the wrong bounds, divides by zero on empty buckets, or returns infinity for the +Inf bucket.
  criteria:
    correctness: All tests pass, including empty buckets, rank on a boundary and q equal to 1.
    efficiency: One pass over the buckets; binary search mentioned as an option.
    code_quality: Clearly named lower, upper and before values instead of index arithmetic spread across one expression.
    edge_cases: Zero total, leading and trailing empty buckets, the +Inf bucket and very large counts.
    communication: Explains the even-spread assumption and how it can mislead for wide buckets.
hints:
  - Turn the quantile into a target position among all requests, then find which bucket that position falls into.
  - Because the counts are cumulative, the right bucket is the first one whose count reaches the target; inside it, assume the requests are evenly spread between its lower and upper bound.
  - Compute the rank as q times the last count (returning minus one when that count is zero), scan for the first index whose cumulative count is at least the rank, return the largest finite bound if that index is the +Inf bucket, and otherwise move from the previous bound toward the bucket's bound by the fraction of the bucket's own requests needed to reach the rank.
followups:
  - Why can this estimate be far from the true percentile, and how would you choose bucket bounds for an SLO?
  - How would you combine histograms from several instances before estimating the quantile?
  - How does this approach compare with keeping a sketch such as t-digest?
  - How would you use binary search here, and does it matter for 100 buckets?
common_errors:
  - Treating the cumulative counts as the number of requests in each bucket.
  - Using the bucket's own bound as the lower end, or forgetting that the first bucket starts at 0.
  - Dividing by zero when interpolating in a bucket that holds no requests.
  - Returning infinity or the next bound instead of the largest finite bound for the +Inf bucket.
  - Comparing with strictly greater instead of greater or equal, which skips the bucket when the rank equals its count.
