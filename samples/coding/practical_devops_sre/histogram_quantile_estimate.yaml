slug: histogram_quantile_estimate
title: Histogram Quantile Estimate
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, platform, devops, data_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Histogram Quantile Estimate

  A metrics agent does not keep every request latency; it only keeps a **cumulative histogram**. You are
  asked to estimate a latency percentile (for example p90) from it for an SLO dashboard.

  - `upper_bounds` holds the finite bucket bounds in seconds, strictly increasing and all positive.
  - `cumulative_counts` has **one more** entry than `upper_bounds`. For `i < upper_bounds.length`,
    `cumulative_counts[i]` is the number of requests with latency `<= upper_bounds[i]`. The last entry
    belongs to an extra **+Inf** bucket and equals the total number of requests. The counts never
    decrease.
  - `q` is the requested quantile with `0 < q <= 1` (`0.9` means p90).

  Estimate the quantile as follows:

  1. Let `total` be the last count. If `total` is `0`, return `-1.0`.
  2. Let `rank = q * total` (a real number).
  3. Find the **first** index `i` with `cumulative_counts[i] >= rank`.
  4. If `i` is the +Inf bucket (`i == upper_bounds.length`), return the largest finite bound,
     `upper_bounds[upper_bounds.length - 1]`.
  5. Otherwise the bucket spans from `lower` to `upper = upper_bounds[i]`, where `lower` is the previous
     bound (`0` for the first bucket), and holds `cumulative_counts[i] - before` requests, where `before`
     is the previous cumulative count (`0` for the first bucket). Assume the requests are spread evenly
     inside the bucket and return
     `lower + (upper - lower) * (rank - before) / (cumulative_counts[i] - before)`.

  Answers within `10^-6` relative error are accepted.

  ### Example 1
  ```
  Input:  upper_bounds = [0.1, 0.2, 0.5, 1.0], cumulative_counts = [30, 60, 90, 98, 100], q = 0.75
  Output: 0.35
  Explanation: total = 100 and rank = 75. The first cumulative count >= 75 is 90 (bucket 0.2 to
  0.5, which holds 30 requests, 60 of them before it): 0.2 + 0.3 * 15 / 30 = 0.35.
  ```

  ### Example 2
  ```
  Input:  upper_bounds = [100.0, 250.0, 500.0], cumulative_counts = [10, 40, 45, 50], q = 0.99
  Output: 500.0
  Explanation: rank = 49.5, and only the +Inf bucket reaches it, so the estimate is the largest
  finite bound.
  ```

  ### Constraints
  - `1 <= upper_bounds.length <= 100` and `cumulative_counts.length == upper_bounds.length + 1`
  - `0 < upper_bounds[0] < upper_bounds[1] < ... <= 10^6`
  - `0 <= cumulative_counts[0] <= cumulative_counts[1] <= ... <= 10^15` (counts can exceed 32 bits)
  - `0 < q <= 1`
