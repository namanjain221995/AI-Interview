reference_solutions:
  python: |
    def histogram_quantile_estimate(upper_bounds: list[float], cumulative_counts: list[int], q: float) -> float:
        total = cumulative_counts[-1]
        if total == 0:
            return -1.0
        rank = q * total
        for i, count in enumerate(cumulative_counts):
            if count >= rank:
                if i == len(upper_bounds):
                    return float(upper_bounds[-1])
                lower = upper_bounds[i - 1] if i > 0 else 0.0
                before = cumulative_counts[i - 1] if i > 0 else 0
                # count > before here: rank > 0 and the previous count was below rank
                return lower + (upper_bounds[i] - lower) * (rank - before) / (count - before)
        return float(upper_bounds[-1])
  javascript: |
    function histogramQuantileEstimate(upperBounds, cumulativeCounts, q) {
      const total = cumulativeCounts[cumulativeCounts.length - 1];
      if (total === 0) return -1.0;
      const rank = q * total;
      for (let i = 0; i < cumulativeCounts.length; i++) {
        const count = cumulativeCounts[i];
        if (count >= rank) {
          if (i === upperBounds.length) return upperBounds[upperBounds.length - 1];
          const lower = i > 0 ? upperBounds[i - 1] : 0;
          const before = i > 0 ? cumulativeCounts[i - 1] : 0;
          return lower + (upperBounds[i] - lower) * (rank - before) / (count - before);
        }
      }
      return upperBounds[upperBounds.length - 1];
    }
