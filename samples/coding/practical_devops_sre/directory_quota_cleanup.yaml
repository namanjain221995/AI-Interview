expected_concepts:
  - mapping each file to its quota ancestors on component boundaries
  - aggregating subtree totals with a hash map of directory prefixes
  - monotonicity - totals only decrease, so over-quota status never returns
  - single pass over files sorted by (mtime, path) instead of repeated rescans
  - deterministic tie-breaking
optimal_complexity: {time: "O(n log n + n * depth)", space: "O(n * depth + q)"}
rubric:
  excellent: Matches quota directories on component boundaries, precomputes each file's covering quota directories, notices that over-quota status can only turn off so one sorted pass suffices, keeps a count of over-quota directories to stop early, and explains the complexity.
  good: Correct simulation that rescans for the oldest eligible file after each deletion (or uses a heap per directory), with correct boundary matching and tie-breaking.
  weak: Matches directories with a plain string prefix (so /var/log matches /var/log-archive), deletes files under quotas that are already satisfied, stops after the first quota is fixed, or ignores nested quotas when updating totals.
  criteria:
    correctness: All tests pass, including nested quotas, the root quota, zero-byte quotas, prefix look-alike directories and mtime ties.
    efficiency: O(n log n + n * depth) with a single sorted pass; repeated full rescans are only acceptable for small inputs.
    code_quality: Path handling isolated in a helper, clear names for used bytes and limits, no string re-parsing inside the loop.
    edge_cases: Nothing to delete, quota directories without files, files under no quota and very large sizes.
    communication: Explains why a file skipped once can never become eligible later.
hints:
  - Start by working out, for every file, which quota directories it is under. Be careful that /var/log must not match /var/log-archive.
  - Directory totals only ever go down, so once a quota directory is within its limit it stays there. What does that mean for a file that is skipped because none of its quota directories is over?
  - Sort the files once by (mtime, path) and walk that order. Delete a file when any of its quota directories is currently over, subtracting its size from all of them, and stop as soon as a counter of over-quota directories reaches zero.
followups:
  - How would the algorithm change if the agent could also compress files to a tenth of their size instead of deleting them?
  - How would you handle quota directories given with a trailing slash or symbolic links?
  - If files keep arriving while the agent runs, which data structures would you keep between runs?
  - How would you choose files to delete to minimise the number of deletions instead of deleting the oldest first?
common_errors:
  - Using startswith(dir) without the trailing slash, so sibling directories with a shared prefix are counted.
  - Deleting files under every quota directory once any quota is over.
  - Forgetting to update every nested quota directory when a file is removed.
  - Breaking mtime ties by input order instead of by path.
  - Rescanning all files for every deletion, which is quadratic on large hosts.
