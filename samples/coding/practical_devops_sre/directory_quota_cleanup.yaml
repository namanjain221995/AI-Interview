version: 1
slug: directory_quota_cleanup
title: Quota-Driven Log Cleanup
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, sre, platform]
time_limit_minutes: 30
prompt_markdown: |
  ## Quota-Driven Log Cleanup

  A log-rotation agent enforces disk quotas on a host. You receive the files on disk as three parallel
  arrays (`paths[i]`, `sizes[i]` in bytes, `mtimes[i]` = last modification time) and a list of quota
  rules: directory `quota_dirs[k]` may hold at most `quota_bytes[k]` bytes in its **whole subtree**.
  Quota directories can be nested (for example `/var/log` and `/var/log/api`).

  A file is **under** a directory `d` when `d` is `/`, or when the file's path starts with `d` followed
  by `/`. Matching is on whole path components: `/var/log-archive/x.log` is **not** under `/var/log`.

  A quota directory is **over quota** while the total size of the remaining files under it is greater
  than its limit. The agent repeats this step until no quota directory is over quota:

  - Among the files that are under **at least one** over-quota directory, delete the **oldest**
    (smallest `mtime`; on equal `mtime`, the lexicographically smallest path), and subtract its size
    from every directory it is under.

  Files under no over-quota directory are never deleted. Return the deleted paths **in deletion
  order**, or an empty array if every quota already holds.

  ### Example 1
  ```
  Input:  paths = ["/var/log/api/access.log", "/var/log/api/error.log", "/var/log/worker/run.log",
                   "/var/log/worker/old.log", "/var/log-archive/a.log"]
          sizes = [400, 100, 300, 200, 999]
          mtimes = [10, 30, 20, 5, 1]
          quota_dirs = ["/var/log", "/var/log/api"], quota_bytes = [800, 450]
  Output: ["/var/log/worker/old.log", "/var/log/api/access.log"]
  Explanation: /var/log holds 1000 bytes and /var/log/api holds 500, so both are over quota.
  /var/log-archive/a.log is the oldest file but is under no quota directory. Deleting old.log brings
  /var/log to 800 (within quota), but /var/log/api is still over, so its oldest file, access.log,
  goes next.
  ```

  ### Example 2
  ```
  Input:  paths = ["/b.txt", "/a/z.txt", "/c"], sizes = [30, 30, 10], mtimes = [7, 7, 9]
          quota_dirs = ["/"], quota_bytes = [50]
  Output: ["/a/z.txt"]
  Explanation: "/" covers every file. Two files share the oldest mtime; "/a/z.txt" sorts first.
  ```

  ### Constraints
  - `1 <= paths.length == sizes.length == mtimes.length <= 10^4`
  - Paths are absolute, unique, use `/` as the separator, have no trailing `/`, no empty, `.` or `..`
    components, contain printable ASCII only and are at most 200 characters long.
  - `1 <= quota_dirs.length == quota_bytes.length <= 10^3`; quota directories are unique, are `/` or
    have the same shape as paths, and are never equal to a file path. A quota directory may contain no files.
  - `1 <= sizes[i] <= 10^11`, `0 <= mtimes[i] <= 10^9`, `0 <= quota_bytes[k] <= 10^15`
  - Lexicographic order compares character codes (plain ASCII order).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: directory_quota_cleanup
  params:
    - {name: paths, type: "string[]"}
    - {name: sizes, type: "long[]"}
    - {name: mtimes, type: "int[]"}
    - {name: quota_dirs, type: "string[]"}
    - {name: quota_bytes, type: "long[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def directory_quota_cleanup(paths: list[str], sizes: list[int], mtimes: list[int],
                                quota_dirs: list[str], quota_bytes: list[int]) -> list[str]:
        index = {d: k for k, d in enumerate(quota_dirs)}
        used = [0] * len(quota_dirs)
        covering: list[list[int]] = []  # quota directories each file is under
        for path, size in zip(paths, sizes):
            ks = [index["/"]] if "/" in index else []
            pos = path.find("/", 1)
            while pos != -1:
                k = index.get(path[:pos])
                if k is not None:
                    ks.append(k)
                pos = path.find("/", pos + 1)
            covering.append(ks)
            for k in ks:
                used[k] += size
        over = sum(1 for k in range(len(used)) if used[k] > quota_bytes[k])
        # Totals only shrink, so a directory that is within quota stays within quota. A file skipped
        # once can therefore never become eligible later: one pass in age order is enough.
        order = sorted(range(len(paths)), key=lambda i: (mtimes[i], paths[i]))
        deleted: list[str] = []
        for i in order:
            if over == 0:
                break
            if any(used[k] > quota_bytes[k] for k in covering[i]):
                deleted.append(paths[i])
                for k in covering[i]:
                    was_over = used[k] > quota_bytes[k]
                    used[k] -= sizes[i]
                    if was_over and used[k] <= quota_bytes[k]:
                        over -= 1
        return deleted
  javascript: |
    function directoryQuotaCleanup(paths, sizes, mtimes, quotaDirs, quotaBytes) {
      const index = new Map();
      quotaDirs.forEach((d, k) => index.set(d, k));
      const used = new Array(quotaDirs.length).fill(0);
      const covering = [];
      for (let i = 0; i < paths.length; i++) {
        const path = paths[i];
        const ks = index.has("/") ? [index.get("/")] : [];
        let pos = path.indexOf("/", 1);
        while (pos !== -1) {
          const k = index.get(path.slice(0, pos));
          if (k !== undefined) ks.push(k);
          pos = path.indexOf("/", pos + 1);
        }
        covering.push(ks);
        for (const k of ks) used[k] += sizes[i];
      }
      let over = 0;
      for (let k = 0; k < used.length; k++) if (used[k] > quotaBytes[k]) over++;
      const order = paths.map((_, i) => i);
      order.sort((a, b) => {
        if (mtimes[a] !== mtimes[b]) return mtimes[a] - mtimes[b];
        return paths[a] < paths[b] ? -1 : paths[a] > paths[b] ? 1 : 0;
      });
      const deleted = [];
      for (const i of order) {
        if (over === 0) break;
        if (!covering[i].some((k) => used[k] > quotaBytes[k])) continue;
        deleted.push(paths[i]);
        for (const k of covering[i]) {
          const wasOver = used[k] > quotaBytes[k];
          used[k] -= sizes[i];
          if (wasOver && used[k] <= quotaBytes[k]) over--;
        }
      }
      return deleted;
    }
