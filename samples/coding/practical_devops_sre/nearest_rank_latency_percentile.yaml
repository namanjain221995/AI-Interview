expected_concepts:
  - nearest-rank percentile definition
  - integer ceiling division
  - converting a 1-based rank to a 0-based index
  - numeric (not lexicographic) sorting
  - selection in expected O(n) as an alternative to sorting
optimal_complexity: {time: "O(n log n) with sorting, O(n) expected with quickselect", space: "O(n) for a sorted copy, O(1) extra with in-place selection"}
rubric:
  excellent: "Computes the rank with exact integer ceiling division, converts it to a 0-based index correctly, sorts numerically, handles the empty list, and mentions quickselect for O(n) expected time."
  good: "Correct sorting solution with exact rank; one off-by-one or the empty case is fixed after testing."
  weak: "Uses floating-point division that rounds the rank wrongly, indexes with the 1-based rank directly, or sorts numbers as strings."
  criteria:
    correctness: "All tests pass, including p equal to 1 and 100, ranks that divide exactly and the empty list."
    efficiency: "O(n log n) sort or expected linear selection; no repeated sorting."
    code_quality: "The rank formula is isolated and commented; the input is not mutated unexpectedly."
    edge_cases: "Empty list, single element, all duplicates, p of 100, p times n divisible by 100 and values up to 10^9."
    communication: "Explains why integer ceiling division avoids errors such as 0.07 times 100 rounding up to 8."
hints:
  - "Write the percentile as a position in the sorted list, and decide how to round when that position is not a whole number."
  - "The position is p times n over one hundred rounded up; ceiling division can be done with whole numbers alone by adding the divisor minus one before dividing."
  - "Return minus one for an empty list. Otherwise sort numerically, compute the rank as p times n plus ninety-nine, integer-divided by one hundred, and return the element at that rank minus one because positions start at one."
followups:
  - "How would you find the percentile in expected linear time without sorting?"
  - "How would you report p50, p95 and p99 for a stream of a billion latencies with bounded memory?"
  - "What are the trade-offs between nearest-rank and interpolated percentiles on dashboards?"
common_errors:
  - "Computing the rank as p divided by 100 times n in floating point, which can round 7 up to 8."
  - "Using the 1-based rank as a 0-based index and returning the next value."
  - "Sorting numbers as strings, for example the default sort in JavaScript."
  - "Rounding the rank to the nearest integer instead of rounding up."
  - "Forgetting to return -1 for an empty list."
