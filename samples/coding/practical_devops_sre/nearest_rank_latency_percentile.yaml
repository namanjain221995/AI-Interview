title: Latency Percentile Report
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, backend, devops, data_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Latency Percentile Report

  A nightly job summarises request latencies for each endpoint and reports values such as p50, p95 and
  p99. The team uses the **nearest-rank** definition so that every reported value is a latency that was
  actually observed:

  1. Sort the `n` latencies in ascending order (duplicates are kept; each one counts separately).
  2. The rank of the `p`-th percentile is `ceil(p * n / 100)`, counting from `1`.
  3. The answer is the latency at that rank.

  Given the list `latencies_ms` (in any order) and an integer `p`, return the `p`-th percentile. If
  there are no latencies, return `-1`. The rank must be exact: compute it with integer arithmetic, not
  with floating-point division.

  ### Example 1
  ```
  Input:  latencies_ms = [120, 35, 80, 35, 410, 95, 60, 70, 88, 52], p = 90
  Output: 120
  Explanation: sorted: [35, 35, 52, 60, 70, 80, 88, 95, 120, 410]; rank = ceil(90 * 10 / 100) = 9 -> 120
  ```

  ### Example 2
  ```
  Input:  latencies_ms = [18, 7, 30], p = 50
  Output: 18
  Explanation: rank = ceil(50 * 3 / 100) = ceil(1.5) = 2; sorted [7, 18, 30] -> 18
  ```

  ### Example 3
  ```
  Input:  latencies_ms = [], p = 99
  Output: -1
  ```

  ### Constraints
  - `0 <= latencies_ms.length <= 10^5`
  - `0 <= latencies_ms[i] <= 10^9`
  - `1 <= p <= 100`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nearest_rank_latency_percentile
  params:
    - {name: latencies_ms, type: "int[]"}
    - {name: p, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def nearest_rank_latency_percentile(latencies_ms: list[int], p: int) -> int:
        n = len(latencies_ms)
        if n == 0:
            return -1
        rank = (p * n + 99) // 100  # ceil(p * n / 100) in integer arithmetic
        return sorted(latencies_ms)[rank - 1]
  javascript: |
    function nearestRankLatencyPercentile(latenciesMs, p) {
      const n = latenciesMs.length;
      if (n === 0) return -1;
      const rank = Math.floor((p * n + 99) / 100);
      const sorted = [...latenciesMs].sort((a, b) => a - b);
      return sorted[rank - 1];
    }
