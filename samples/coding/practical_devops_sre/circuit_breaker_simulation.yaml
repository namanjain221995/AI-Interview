version: 1
slug: circuit_breaker_simulation
title: Circuit Breaker Replay
difficulty: medium
competency_keys: [problem_solving, code_quality, debugging]
role_tags: [backend, sre, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Circuit Breaker Replay

  A checkout service calls a flaky payment provider through a **circuit breaker**. To debug an outage you
  replay the recorded calls through the breaker logic. Call `i` happened at second `timestamps[i]`
  (non-decreasing) and `succeeded[i]` says whether the provider would have answered successfully if the
  call had been sent.

  The breaker starts **CLOSED** with a failure counter of `0` and processes the calls in order:

  - **CLOSED:** the call is sent; its decision is `"ALLOW"`. A success resets the counter to `0`. A
    failure adds one; when the counter reaches `failure_threshold`, the breaker becomes **OPEN** with
    `opened_at` set to this call's timestamp.
  - **OPEN**, call earlier than `opened_at + open_seconds`: the call is not sent; its decision is
    `"REJECT"` and its `succeeded` value is ignored.
  - **OPEN**, call at or after `opened_at + open_seconds`: the call is sent as a trial; its decision is
    `"PROBE"`. If it succeeds, the breaker becomes CLOSED with the counter reset to `0`. If it fails, the
    breaker stays OPEN with `opened_at` set to this call's timestamp.

  Return the decision for every call, in input order.

  ### Example 1
  ```
  Input:  timestamps = [0, 1, 2, 3, 4, 10, 11, 12],
          succeeded = [true, false, false, false, true, true, false, true],
          failure_threshold = 3,
          open_seconds = 5
  Output: ["ALLOW", "ALLOW", "ALLOW", "ALLOW", "REJECT", "PROBE", "ALLOW", "ALLOW"]
  Explanation: three failures in a row open the breaker at second 3. The call at second 4 is
  rejected (4 < 3 + 5). At second 10 the trial call succeeds and closes the breaker; the failure at
  11 starts a new count, and the success at 12 resets it.
  ```

  ### Example 2
  ```
  Input:  timestamps = [0, 0, 5, 6, 9, 15],
          succeeded = [false, false, false, true, true, true],
          failure_threshold = 2,
          open_seconds = 5
  Output: ["ALLOW", "ALLOW", "PROBE", "REJECT", "REJECT", "PROBE"]
  Explanation: two failures at second 0 open the breaker. The probe at 5 fails, so it reopens at 5;
  calls at 6 and 9 are rejected even though they would have succeeded. The probe at 15 succeeds.
  ```

  ### Constraints
  - `1 <= timestamps.length == succeeded.length <= 10^5`
  - `0 <= timestamps[i] <= 2 * 10^9`, non-decreasing
  - `1 <= failure_threshold <= 10^5`
  - `0 <= open_seconds <= 2 * 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: circuit_breaker_simulation
  params:
    - {name: timestamps, type: "int[]"}
    - {name: succeeded, type: "bool[]"}
    - {name: failure_threshold, type: "int"}
    - {name: open_seconds, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def circuit_breaker_simulation(timestamps: list[int], succeeded: list[bool], failure_threshold: int, open_seconds: int) -> list[str]:
        is_open = False
        failures = 0
        opened_at = 0
        decisions: list[str] = []
        for now, ok in zip(timestamps, succeeded):
            if not is_open:
                decisions.append("ALLOW")
                if ok:
                    failures = 0
                else:
                    failures += 1
                    if failures >= failure_threshold:
                        is_open, opened_at = True, now
            elif now - opened_at < open_seconds:
                # subtraction instead of opened_at + open_seconds keeps 32-bit languages safe
                decisions.append("REJECT")
            else:
                decisions.append("PROBE")
                if ok:
                    is_open, failures = False, 0
                else:
                    opened_at = now
        return decisions
  javascript: |
    function circuitBreakerSimulation(timestamps, succeeded, failureThreshold, openSeconds) {
      let isOpen = false;
      let failures = 0;
      let openedAt = 0;
      const decisions = [];
      for (let i = 0; i < timestamps.length; i++) {
        const now = timestamps[i];
        if (!isOpen) {
          decisions.push("ALLOW");
          if (succeeded[i]) {
            failures = 0;
          } else if (++failures >= failureThreshold) {
            isOpen = true;
            openedAt = now;
          }
        } else if (now - openedAt < openSeconds) {
          decisions.push("REJECT");
        } else {
          decisions.push("PROBE");
          if (succeeded[i]) {
            isOpen = false;
            failures = 0;
          } else {
            openedAt = now;
          }
        }
      }
      return decisions;
    }
tests:
  - {id: t1, args: [[0, 1, 2, 3, 4, 10, 11, 12], [true, false, false, false, true, true, false, true], 3, 5], expected: ["ALLOW", "ALLOW", "ALLOW", "ALLOW", "REJECT", "PROBE", "ALLOW", "ALLOW"], description: "Example 1"}
  - {id: t2, args: [[0, 0, 5, 6, 9, 15], [false, false, false, true, true, true], 2, 5], expected: ["ALLOW", "ALLOW", "PROBE", "REJECT", "REJECT", "PROBE"], description: "Example 2 - failed probe reopens the breaker"}
  - {id: t3, hidden: true, args: [[1, 2, 3, 4], [true, true, true, true], 1, 100], expected: ["ALLOW", "ALLOW", "ALLOW", "ALLOW"], description: "All calls succeed - the breaker never opens"}
  - {id: t4, hidden: true, args: [[0, 1, 2, 3, 4, 5, 6], [false, true, false, true, false, true, false], 2, 10], expected: ["ALLOW", "ALLOW", "ALLOW", "ALLOW", "ALLOW", "ALLOW", "ALLOW"], description: "Failures are never consecutive - a success resets the counter every time"}
  - {id: t5, hidden: true, args: [[0, 1, 2, 2, 3, 4], [false, false, true, false, false, true], 1, 1], expected: ["ALLOW", "PROBE", "PROBE", "ALLOW", "PROBE", "PROBE"], description: "Threshold 1 - every allowed failure opens; probe exactly at opened_at + open_seconds"}
  - {id: t6, hidden: true, args: [[7, 7, 7, 7, 7], [false, false, false, true, true], 1, 0], expected: ["ALLOW", "PROBE", "PROBE", "PROBE", "ALLOW"], description: "open_seconds 0 - the very next call (same timestamp) is already a probe"}
  - {id: t7, hidden: true, args: [[10, 10, 10, 14, 15, 15], [false, false, true, true, true, false], 2, 5], expected: ["ALLOW", "ALLOW", "REJECT", "REJECT", "PROBE", "ALLOW"], description: "Several calls at the same second after opening; one second before the probe time is still rejected"}
  - {id: t8, hidden: true, args: [[2000000000, 2000000000, 2000000000], [false, true, true], 1, 2000000000], expected: ["ALLOW", "REJECT", "REJECT"], description: "opened_at + open_seconds exceeds 32 bits - an int overflow would probe instead of rejecting"}
  - {id: t9, hidden: true, args: [[0, 0, 0, 100, 101, 102, 103], [false, false, false, false, false, false, false], 3, 2], expected: ["ALLOW", "ALLOW", "ALLOW", "PROBE", "REJECT", "PROBE", "REJECT"], description: "Repeated failing probes keep reopening at each probe time"}
