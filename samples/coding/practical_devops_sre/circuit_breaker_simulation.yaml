expected_concepts:
  - finite state machine with explicit states
  - consecutive failure counter reset on success
  - half-open trial call (probe) after a cool-down
  - ignoring outcomes of rejected calls
  - overflow-safe time comparison
optimal_complexity: {time: O(n), space: "O(1) extra besides the output"}
rubric:
  excellent: Models the breaker as an explicit state machine with a failure counter and opened_at, applies the CLOSED, OPEN and probe rules exactly as stated, ignores rejected outcomes, compares elapsed time without overflow, and walks through a failed probe to show the reopen behaviour.
  good: Correct replay with a small fix needed after running the tests, such as the probe boundary or resetting the counter after a successful probe.
  weak: Counts total rather than consecutive failures, lets rejected calls change the counter, probes before the cool-down ends, or forgets to restart the cool-down after a failed probe.
  criteria:
    correctness: All tests pass, including failed probes, zero cool-down and equal timestamps.
    efficiency: Single linear pass with constant extra state.
    code_quality: States are named and each transition is easy to find; no duplicated branches.
    edge_cases: Threshold 1, open_seconds 0, probes exactly at the boundary and values near the 32-bit limit.
    communication: Explains the state transitions and why rejected calls do not affect the counter.
hints:
  - Keep a small amount of state that you update call by call; you never need to look back at earlier calls.
  - Track whether the breaker is open, the number of consecutive failures and the time it last opened, and decide each call from that state before updating it.
  - When closed, record an allow and update the counter, opening when it reaches the threshold; when open, compare the time since opening with the cool-down to choose between a reject and a probe, closing on a successful probe and restarting the cool-down from now on a failed one.
followups:
  - How would you add a rule that opens the breaker when the failure rate in the last minute exceeds 50 percent?
  - How would you let several probes through during the half-open phase and decide on their combined result?
  - How would you make the cool-down grow exponentially after repeated failed probes?
  - What metrics would you emit from a breaker in production to help on-call engineers?
common_errors:
  - Counting all failures instead of consecutive ones.
  - Updating the failure counter for rejected calls.
  - Probing one second early or rejecting the call exactly at the end of the cool-down.
  - Leaving the failure counter at its old value after a successful probe.
  - Computing opened_at plus open_seconds in 32-bit integers, which overflows near the limit.
