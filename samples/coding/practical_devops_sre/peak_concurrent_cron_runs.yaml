expected_concepts:
  - expanding periodic schedules into concrete intervals within the horizon
  - sweep line over start and end events
  - ordering ends before starts at equal timestamps for half-open intervals
  - counting runs past the horizon and overlapping runs of the same job
optimal_complexity: {time: O(R log R) for R runs, space: O(R)}
rubric:
  excellent: Expands runs with the strict horizon bound, sweeps sorted start and end events with ends first on ties, justifies the tie rule from the half-open intervals and states O(R log R).
  good: Correct sweep or a heap of end times after a hint about how ties at the same minute must be ordered.
  weak: Scans every minute of the horizon, checks all pairs of runs, includes a start equal to the horizon or counts back-to-back runs as overlapping.
  criteria:
    correctness: All tests pass, including back-to-back runs, self-overlapping jobs and jobs that never start.
    efficiency: Sorting R events instead of iterating over every minute up to the horizon (which can be 10^9).
    code_quality: Events are encoded so that one sort handles the tie rule; no special-case loops.
    edge_cases: No jobs, offsets at or after the horizon, runs extending beyond the horizon and identical schedules.
    communication: Explains why an end and a start at the same minute must be processed end first.
hints:
  - First list every run as a concrete time interval. The answer only changes at the moments when some run starts or ends.
  - Sweep through those moments in time order while keeping a running count of active runs. Think carefully about a run ending at the same minute another one starts.
  - Generate a plus-one event at each start and a minus-one event at each end for every start strictly below the horizon. Sort by time, putting minus-one events before plus-one events at the same time, then walk the events, updating the count and remembering its maximum.
followups:
  - How would you also report the time window in which the peak occurs?
  - If the horizon were huge and the number of runs unbounded, how could you exploit the periodicity (for example the least common multiple of the periods)?
  - How would you answer the same question for many different horizons efficiently?
common_errors:
  - Treating intervals as closed, so a run ending at minute t overlaps a run starting at t.
  - Including a run that starts exactly at the horizon.
  - Ignoring that a long run of a job can overlap the next run of the same job.
  - Simulating minute by minute, which is too slow when times reach 10^9.
