  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def peak_concurrent_cron_runs(offsets: list[int], periods: list[int], durations: list[int], horizon: int) -> int:
        events: list[tuple[int, int]] = []
        for offset, period, duration in zip(offsets, periods, durations):
            start = offset
            while start < horizon:
                events.append((start, 1))
                events.append((start + duration, -1))
                start += period
        # At equal times the end (-1) sorts before the start (+1).
        events.sort()
        active = best = 0
        for _, delta in events:
            active += delta
            best = max(best, active)
        return best
  javascript: |
    function peakConcurrentCronRuns(offsets, periods, durations, horizon) {
      const events = [];
      for (let i = 0; i < offsets.length; i++) {
        for (let start = offsets[i]; start < horizon; start += periods[i]) {
          events.push([start, 1]);
          events.push([start + durations[i], -1]);
        }
      }
      events.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
      let active = 0;
      let best = 0;
      for (const [, delta] of events) {
        active += delta;
        if (active > best) best = active;
      }
      return best;
    }
