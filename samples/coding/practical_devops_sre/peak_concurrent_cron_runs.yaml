prompt_markdown: |
  ## Batch Job Peak Concurrency

  A shared worker pool runs `n` recurring batch jobs (report builds, backups, cache warmers). Before
  resizing the pool, the platform team wants to know the largest number of job runs that are ever in
  progress at the same moment within a planning window.

  Job `i` starts its first run at minute `offsets[i]` and then every `periods[i]` minutes, so its runs
  start at `offsets[i] + k * periods[i]` for `k = 0, 1, 2, ...`, **as long as the start is strictly before
  `horizon`**. Every run of job `i` lasts `durations[i]` minutes and occupies the half-open interval
  `[start, start + durations[i])`. A run may continue past `horizon`; it still counts. Runs of the same
  job may overlap each other (a slow job can still be running when its next run starts).

  A run that ends at minute `t` does **not** overlap a run that starts at minute `t`.

  Return the maximum number of runs that are active at the same instant, or `0` if there are no runs at
  all.

  ### Example 1
  ```
  Input:  offsets = [0, 5, 20], periods = [15, 30, 100], durations = [10, 20, 3], horizon = 50
  Output: 3
  Explanation: job 0 runs at [0, 10), [15, 25), [30, 40), [45, 55); job 1 at [5, 25), [35, 55);
  job 2 at [20, 23). During [20, 23) jobs 0, 1 and 2 are all running.
  ```

  ### Example 2
  ```
  Input:  offsets = [0, 12, 30], periods = [5, 100, 10], durations = [5, 4, 1], horizon = 15
  Output: 2
  Explanation: job 0 runs at [0, 5), [5, 10), [10, 15): back-to-back runs never overlap. Job 1 starts
  at 12 and overlaps [10, 15). Job 2's first start (30) is not before the horizon, so it never runs.
  ```

  ### Constraints
  - `0 <= n <= 10^4`, where `n` is the length of `offsets`, `periods` and `durations`
  - `0 <= offsets[i] <= 10^9`, `1 <= periods[i] <= 10^9`, `1 <= durations[i] <= 10^9`
  - `1 <= horizon <= 10^9`
  - The total number of runs over all jobs is at most `2 * 10^5`.
languages: [python, javascript, typescript, java, go, cpp]
