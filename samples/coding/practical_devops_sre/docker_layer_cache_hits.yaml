version: 1
slug: docker_layer_cache_hits
title: Build Cache Layer Reuse
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [devops, platform, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Build Cache Layer Reuse

  A CI system wants to predict, before starting a container image build, how many layers it will be
  able to take from the cache. Each instruction of the build file produces one layer. You get the
  instructions of the previous build, the instructions of the current build and the list of files in
  the build context that changed since the previous build.

  Walk the current instructions from the top. Instruction `i` is **reused** only if all of these hold:

  1. The previous build has an instruction at position `i` and it is exactly the same string.
  2. If the instruction is a `COPY` or `ADD` (its first token), none of its **source paths** was touched
     by a changed file.
  3. Every instruction before it was reused. As soon as one instruction is not reused, nothing after it
     is reused either.

  Parsing a `COPY` or `ADD` instruction: tokens are separated by single spaces; the first token is the
  keyword, the **last** token is the destination, tokens starting with `--` are flags (for example
  `--chown=app:app`), and every other token in between is a source path.

  A changed file `f` **touches** a source `s` if `s` is `.` (the whole context), or `f` equals `s`, or
  `f` lies inside directory `s` on a path-component boundary (`src` covers `src/main.py` but not
  `src2/main.py`). A trailing `/` on a source is ignored. Other instructions (such as `RUN`) are never
  affected by changed files, even if they mention a path.

  Return the number of reused layers.

  ### Example 1
  ```
  Input:  previous = ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], current = ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], changed_files = ["src/app/main.py"]
  Output: 4
  Explanation: FROM, WORKDIR, COPY requirements.txt and RUN are reused; COPY src is touched by src/app/main.py.
  ```

  ### Example 2
  ```
  Input:  previous = ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], current = ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], changed_files = ["requirements.txt"]
  Output: 2
  ```

  ### Example 3
  ```
  Input:  previous = ["FROM node:20", "COPY --chown=node:node . /home/node/app", "RUN npm ci"], current = ["FROM node:20", "COPY --chown=node:node . /home/node/app", "RUN npm ci"], changed_files = ["README.md"]
  Output: 1
  ```

  ### Constraints
  - `0 <= previous.length, current.length <= 100`
  - `0 <= changed_files.length <= 1000`
  - Instructions are non-empty, have no leading or trailing spaces, and use single spaces between tokens.
  - `COPY` and `ADD` instructions have at least one source and a destination; sources are `.` or relative paths without `./`, `..` or wildcards.
  - Changed files are relative paths without a leading `./` or a trailing `/`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: docker_layer_cache_hits
  params:
    - {name: previous, type: "string[]"}
    - {name: current, type: "string[]"}
    - {name: changed_files, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def docker_layer_cache_hits(previous: list[str], current: list[str], changed_files: list[str]) -> int:
        def touches(source: str, changed: str) -> bool:
            source = source.rstrip("/") or "."
            return source == "." or changed == source or changed.startswith(source + "/")

        reused = 0
        for i, instruction in enumerate(current):
            if i >= len(previous) or previous[i] != instruction:
                break
            tokens = instruction.split(" ")
            if tokens[0] in ("COPY", "ADD"):
                sources = [t for t in tokens[1:-1] if not t.startswith("--")]
                if any(touches(s, f) for s in sources for f in changed_files):
                    break
            reused += 1
        return reused
  javascript: |
    function dockerLayerCacheHits(previous, current, changedFiles) {
      function touches(source, changed) {
        let s = source.replace(/\/+$/, "");
        if (s === "") s = ".";
        return s === "." || changed === s || changed.startsWith(s + "/");
      }

      let reused = 0;
      for (let i = 0; i < current.length; i++) {
        if (i >= previous.length || previous[i] !== current[i]) break;
        const tokens = current[i].split(" ");
        if (tokens[0] === "COPY" || tokens[0] === "ADD") {
          const sources = tokens.slice(1, -1).filter((t) => !t.startsWith("--"));
          if (sources.some((s) => changedFiles.some((f) => touches(s, f)))) break;
        }
        reused++;
      }
      return reused;
    }
