  - {id: t1, args: [["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["src/app/main.py"]], expected: 4, description: "Example 1 - source change invalidates the COPY src layer"}
  - {id: t2, args: [["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["requirements.txt"]], expected: 2, description: "Example 2 - dependency file change invalidates the early COPY"}
  - {id: t3, args: [["FROM node:20", "COPY --chown=node:node . /home/node/app", "RUN npm ci"], ["FROM node:20", "COPY --chown=node:node . /home/node/app", "RUN npm ci"], ["README.md"]], expected: 1, description: "Example 3 - copying the whole context means any change is a miss; flags are not sources"}
  - {id: t4, hidden: true, args: [["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], []], expected: 6, description: "Identical builds and nothing changed - everything reused"}
  - {id: t5, hidden: true, args: [["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["FROM python:3.13-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], []], expected: 0, description: "First instruction differs - nothing reused"}
  - {id: t6, hidden: true, args: [[], ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], []], expected: 0, description: "No previous build"}
  - {id: t7, hidden: true, args: [["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/"], ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["docs/guide.md"]], expected: 3, description: "Current build is longer than the previous one"}
  - {id: t8, hidden: true, args: [["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt", "COPY src /app/src", "CMD python -m app"], ["FROM python:3.12-slim", "WORKDIR /app", "COPY requirements.txt /app/", "RUN pip install -r requirements.txt"], ["src/x.py"]], expected: 4, description: "Current build is shorter; the touched COPY is no longer present"}
  - {id: t9, hidden: true, args: [["FROM alpine", "COPY src /s", "COPY config/ /etc/app/", "RUN make", "COPY app /opt/app"], ["FROM alpine", "COPY src /s", "COPY config/ /etc/app/", "RUN make", "COPY app /opt/app"], ["src2/main.c", "srcs", "appendix/a.txt", "opt/app", "Makefile"]], expected: 5, description: "Boundary traps (src2, srcs, appendix), destination-like path and RUN never invalidated"}
  - {id: t10, hidden: true, args: [["FROM alpine", "ADD vendor.tar.gz /vendor", "COPY --chmod=755 bin/run.sh lib config/ /opt/", "CMD run"], ["FROM alpine", "ADD vendor.tar.gz /vendor", "COPY --chmod=755 bin/run.sh lib config/ /opt/", "CMD run"], ["config/prod/app.yaml"]], expected: 2, description: "Multi-source COPY with a flag; the third source with a trailing slash is touched"}
  - {id: t11, hidden: true, args: [["FROM alpine", "ADD vendor.tar.gz /vendor", "RUN true"], ["FROM alpine", "ADD vendor.tar.gz /vendor", "RUN false"], ["vendor.tar.gz"]], expected: 1, description: "ADD is checked like COPY; the changed archive is the exact source path"}
expected_concepts:
  - "prefix scan that stops at the first miss"
  - "tokenising instructions into keyword, flags, sources and destination"
  - "path matching on component boundaries"
  - "cache invalidation semantics of layered builds"
optimal_complexity: {time: "O(I * S * F) for I instructions, S sources per instruction and F changed files", space: "O(1) beyond tokenisation"}
rubric:
  excellent: "Scans instructions in order and stops at the first miss, parses COPY and ADD into flags, sources and destination, matches changed files on component boundaries with '.' covering everything, and explains how a set or trie of changed directories could speed up large inputs."
  good: "Correct scan and parsing with one boundary detail fixed after testing, such as trailing slashes or flags."
  weak: "Keeps counting after a miss, treats the destination or flags as sources, uses plain prefix matching, or checks RUN lines for paths."
  criteria:
    correctness: "All tests pass, including length mismatches, boundary traps, flags and whole-context copies."
    efficiency: "Linear scan over instructions with simple per-source checks; reasonable for the limits."
    code_quality: "Separate helpers for parsing an instruction and for the touch rule."
    edge_cases: "Empty previous build, shorter or longer current build, '.' sources, trailing slashes and exact file sources."
    communication: "Explains why a single miss invalidates every later layer."
hints:
  - "The cache works like a prefix: once one layer cannot be reused, nothing after it can be. Focus on deciding, for one instruction at a time, whether it is a hit."
  - "A hit first needs the same instruction at the same position. For COPY and ADD you also need the source paths: drop the keyword, the final destination and any flags, then check each changed file against each source."
  - "Loop over the current instructions and stop at the first one that is missing from the previous build or differs from it. For COPY and ADD, strip a trailing slash from every source; a source of a single dot is touched by any change, otherwise a changed file touches it when it equals the source or starts with the source followed by a slash. Stop if any source is touched; otherwise count the layer and continue."
followups:
  - "How would you support wildcard sources such as *.json?"
  - "How would you handle a .dockerignore file that excludes some changed files?"
  - "How would you reorder a build file to maximise cache reuse for typical code changes?"
  - "How would you speed up the touch check when there are thousands of changed files?"
common_errors:
  - "Continuing to count matching instructions after the first miss."
  - "Treating the destination or a --flag token as a source path."
  - "Plain prefix matching, so a change to src2/ invalidates COPY src."
  - "Forgetting that a trailing slash on a source or a '.' source changes the match."
