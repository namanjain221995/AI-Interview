expected_concepts:
  - "building a reverse adjacency list (dependency to callers)"
  - "breadth-first or iterative depth-first traversal with a visited set"
  - "cycle and duplicate-edge safety"
  - "sorted, de-duplicated output excluding the source"
optimal_complexity: {time: "O(V + E + V log V)", space: "O(V + E)"}
rubric:
  excellent: "Builds the reverse graph, traverses iteratively from the failed service with a visited set seeded with it, excludes it from the result, sorts the output, and explains why the edge direction matters."
  good: "Correct traversal that may use recursion or need a nudge on excluding the failed service or de-duplicating."
  weak: "Follows edges in the wrong direction, loops forever on cycles, returns duplicates, or only reports direct callers."
  criteria:
    correctness: "All tests pass, including cycles, self-loops, duplicate pairs and absent services."
    efficiency: "Linear in the number of services and pairs plus the final sort."
    code_quality: "Clear names for the reverse map and the visited set; no quadratic scans of the pair list per node."
    edge_cases: "Empty catalog, absent service, self-loop, diamond shapes and long chains."
    communication: "Explains the meaning of each pair and why callers, not dependencies, are impacted."
hints:
  - "Think about which direction the impact travels: from a failed dependency towards the services that call it."
  - "Index the pairs by dependency so you can quickly find every caller of a service, then explore outward from the failed service while remembering what you have already visited."
  - "Build a map from each dependency to the set of its callers. Run a breadth-first search from the failed service with a visited set that already contains it, adding each newly reached caller to a queue. At the end remove the failed service from the visited set and return the rest in sorted order."
followups:
  - "How would you report the shortest call path from each impacted service to the failed one?"
  - "How would you rank impacted services by how many hops away they are?"
  - "If some calls have a fallback and do not propagate failures, how would you model that?"
  - "How would you keep the reverse index up to date as the catalog changes?"
common_errors:
  - "Traversing from service to dependency, which lists what the failed service needs instead of who needs it."
  - "Missing a visited set, so cycles cause infinite loops or duplicates."
  - "Including the failed service in the result when a cycle reaches it again."
  - "Recursive depth-first search that overflows the stack on long chains."
