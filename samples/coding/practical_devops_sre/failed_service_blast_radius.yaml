version: 1
slug: failed_service_blast_radius
title: Outage Blast Radius
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [sre, devops, platform, backend, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Outage Blast Radius

  The service catalog records call relationships as pairs `[service, dependency]`, meaning `service`
  calls `dependency` and stops working correctly when that dependency is down. During an incident the
  on-call engineer needs to know which services might be affected.

  Given the pairs and the name of the service that `failed`, return every service that depends on it
  **directly or transitively** (a service that calls a service that calls `failed` is affected too).

  - Return the names sorted in ascending ASCII order, each once.
  - Never include `failed` itself, even if a dependency cycle leads back to it.
  - Return an empty list if nothing depends on `failed` (including when it does not appear in the
    catalog at all).

  The catalog is maintained by hand: the same pair may be listed more than once, and cycles occur.

  ### Example 1
  ```
  Input:  dependencies = [["web", "api"], ["api", "db"], ["worker", "db"], ["admin", "web"], ["api", "cache"]], failed = "db"
  Output: ["admin", "api", "web", "worker"]
  Explanation: api and worker call db directly; web calls api; admin calls web.
  ```

  ### Example 2
  ```
  Input:  dependencies = [["orders", "inventory"], ["inventory", "orders"], ["checkout", "inventory"]], failed = "orders"
  Output: ["checkout", "inventory"]
  ```

  ### Example 3
  ```
  Input:  dependencies = [["web", "api"], ["api", "db"]], failed = "web"
  Output: []
  ```

  ### Constraints
  - `0 <= dependencies.length <= 10^4`
  - `dependencies[i].length == 2`
  - Service names are 1 to 40 characters of lowercase letters, digits and `-`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: failed_service_blast_radius
  params:
    - {name: dependencies, type: "string[][]"}
    - {name: failed, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import defaultdict, deque


    def failed_service_blast_radius(dependencies: list[list[str]], failed: str) -> list[str]:
        callers: dict[str, set[str]] = defaultdict(set)  # dependency -> services that call it
        for service, dependency in dependencies:
            callers[dependency].add(service)

        impacted: set[str] = {failed}
        queue = deque([failed])
        while queue:
            current = queue.popleft()
            for caller in callers[current]:
                if caller not in impacted:
                    impacted.add(caller)
                    queue.append(caller)
        impacted.discard(failed)
        return sorted(impacted)
  javascript: |
    function failedServiceBlastRadius(dependencies, failed) {
      const callers = new Map();
      for (const [service, dependency] of dependencies) {
        if (!callers.has(dependency)) callers.set(dependency, []);
        callers.get(dependency).push(service);
      }
      const impacted = new Set([failed]);
      const queue = [failed];
      for (let head = 0; head < queue.length; head++) {
        for (const caller of callers.get(queue[head]) || []) {
          if (!impacted.has(caller)) {
            impacted.add(caller);
            queue.push(caller);
          }
        }
      }
      impacted.delete(failed);
      return [...impacted].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
