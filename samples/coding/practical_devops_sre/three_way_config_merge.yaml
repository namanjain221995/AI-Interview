expected_concepts:
  - parsing key=value lines on the first separator only
  - modelling an absent key as a distinct value (not the empty string)
  - three-way merge decision table per key
  - union of keys from all three versions in sorted order
  - last-wins handling of duplicate keys
optimal_complexity: {time: "O(L + K log K) for L lines and K distinct keys", space: O(K)}
rubric:
  excellent: Parses each file into a map in one pass, represents absence distinctly from an empty value, applies the four merge rules in order, explains the delete-versus-edit conflict and states O(L + K log K) time.
  good: Correct merge with maps after a nudge on absent versus empty values or on splitting at the first separator only.
  weak: Splits on every separator, treats a deleted key like an empty value, compares ours and theirs only, or misses keys that exist in a single file.
  criteria:
    correctness: All tests pass, including deletions on both sides, delete-versus-edit conflicts and values containing separators.
    efficiency: One pass per file into hash maps, then a sort of the distinct keys.
    code_quality: A small parse helper and a clear decision table rather than nested special cases.
    edge_cases: Comments, blank lines, empty values, duplicate keys within a file and empty files.
    communication: Explains why both sides deleting a key is not a conflict while delete-versus-edit is.
hints:
  - Turn each file into a lookup from key to value first, and decide how you will represent a key that is missing from a file so it differs from an empty value.
  - Visit every key that appears in at least one version. Comparing the three values with the four rules in the given order settles each key independently of the others.
  - Build three maps with a parser that skips blank and comment lines and splits only at the first equals sign (later lines overwrite earlier ones). Sort the union of keys, take ours when ours and theirs agree, take the side that differs from base when the other side kept base, and otherwise emit the conflict marker. Skip keys whose merged result is absent.
followups:
  - How would you report the three conflicting values so an operator can resolve them?
  - How would the merge change if the config were nested (YAML sections) instead of flat?
  - Git merges line by line rather than key by key. What does a key-aware merge gain and lose?
common_errors:
  - Splitting each line on every equals sign, which truncates values like a connection string.
  - Treating an absent key as an empty value, so a deletion and an empty assignment look the same.
  - Forgetting keys that exist only in base (deleted on both sides) or only in one branch.
  - Reporting a conflict when both sides made the identical change.
