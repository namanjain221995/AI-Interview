version: 1
slug: three_way_config_merge
title: Three-Way Config Merge
difficulty: medium
competency_keys: [problem_solving, data_structures, code_quality]
role_tags: [devops, platform, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Three-Way Config Merge

  Two operators branched the same service config file and edited their copies independently. Your
  deployment tool now has three versions of the file as lists of lines: `base` (the common ancestor),
  `ours` and `theirs`. Merge them key by key.

  **Parsing a file.** A line that is empty, contains only spaces, or whose first non-space character is
  `#` is ignored. Every other line has the form `key=value`: the key is the text before the **first**
  `=` and the value is everything after it (it may be empty and may contain more `=` characters). Keys
  and values are used exactly as written, with no trimming. If a key appears more than once in the same
  file, its **last** line wins. A key that does not appear in a file is **absent** from that file; an
  empty value (`key=`) is present, not absent.

  **Merging one key.** Let `b`, `o` and `t` be the key's value in `base`, `ours` and `theirs`
  (absent counts as a value of its own):

  1. If `o` equals `t`, the result is `o` (both sides made the same change, or neither changed it).
  2. Otherwise, if `o` equals `b`, only theirs changed it: the result is `t`.
  3. Otherwise, if `t` equals `b`, only ours changed it: the result is `o`.
  4. Otherwise both sides changed it differently: the key is a **conflict**.

  Return one string per key that appears in any of the three files, sorted by key in ASCII order:
  `"key=value"` when the merged value is present, `"!key"` when the key conflicts, and **nothing** when the
  merged result is absent (the key was deleted).

  ### Example 1
  ```
  Input:  base = ["# web tier", "replicas=2", "log_level=info", "debug=true"],
          ours = ["# web tier", "replicas=4", "log_level=info", "debug=true", "region=eu-west-1"],
          theirs = ["replicas=2", "log_level=warn"]
  Output: ["log_level=warn", "region=eu-west-1", "replicas=4"]
  Explanation: ours raised the replica count, theirs changed the log level and deleted the debug flag,
  and only ours added the region.
  ```

  ### Example 2
  ```
  Input:  base = ["timeout=30", "cache_ttl=60", "retries=3"],
          ours = ["timeout=45", "retries=3", "pool=10"],
          theirs = ["timeout=20", "cache_ttl=120", "retries=3", "pool=10"]
  Output: ["!cache_ttl", "pool=10", "retries=3", "!timeout"]
  Explanation: both sides changed timeout to different values (conflict). Ours deleted cache_ttl while
  theirs edited it (conflict: a delete against an edit). Both added the same pool value, so it is taken.
  ```

  ### Constraints
  - `0 <= base.length, ours.length, theirs.length <= 1000`
  - Every non-ignored line contains at least one `=` and a non-empty key.
  - Keys use lowercase letters, digits, `.`, `_` and `-`; lines are at most 200 characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: three_way_config_merge
  params:
    - {name: base, type: "string[]"}
    - {name: ours, type: "string[]"}
    - {name: theirs, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def three_way_config_merge(base: list[str], ours: list[str], theirs: list[str]) -> list[str]:
        def parse(lines: list[str]) -> dict[str, str]:
            values: dict[str, str] = {}
            for line in lines:
                stripped = line.strip()
                if not stripped or stripped.startswith("#"):
                    continue
                key, value = line.split("=", 1)
                values[key] = value
            return values

        b, o, t = parse(base), parse(ours), parse(theirs)
        result: list[str] = []
        for key in sorted(set(b) | set(o) | set(t)):
            bv, ov, tv = b.get(key), o.get(key), t.get(key)
            if ov == tv:
                merged = ov
            elif ov == bv:
                merged = tv
            elif tv == bv:
                merged = ov
            else:
                result.append("!" + key)
                continue
            if merged is not None:
                result.append(key + "=" + merged)
        return result
  javascript: |
    function threeWayConfigMerge(base, ours, theirs) {
      const parse = (lines) => {
        const values = new Map();
        for (const line of lines) {
          const stripped = line.trim();
          if (stripped === "" || stripped.startsWith("#")) continue;
          const at = line.indexOf("=");
          values.set(line.slice(0, at), line.slice(at + 1));
        }
        return values;
      };
      const b = parse(base), o = parse(ours), t = parse(theirs);
      const keys = [...new Set([...b.keys(), ...o.keys(), ...t.keys()])];
      keys.sort((x, y) => (x < y ? -1 : x > y ? 1 : 0));
      const result = [];
      for (const key of keys) {
        const bv = b.has(key) ? b.get(key) : null;
        const ov = o.has(key) ? o.get(key) : null;
        const tv = t.has(key) ? t.get(key) : null;
        let merged;
        if (ov === tv) merged = ov;
        else if (ov === bv) merged = tv;
        else if (tv === bv) merged = ov;
        else {
          result.push("!" + key);
          continue;
        }
        if (merged !== null) result.push(key + "=" + merged);
      }
      return result;
    }
