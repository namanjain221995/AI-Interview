reference_solutions:
  python: |
    from collections import deque


    def can_finish(num_courses: int, prerequisites: list[list[int]]) -> bool:
        indegree = [0] * num_courses
        graph: list[list[int]] = [[] for _ in range(num_courses)]
        for course, prereq in prerequisites:
            graph[prereq].append(course)
            indegree[course] += 1
        queue = deque(i for i in range(num_courses) if indegree[i] == 0)
        taken = 0
        while queue:
            node = queue.popleft()
            taken += 1
            for nxt in graph[node]:
                indegree[nxt] -= 1
                if indegree[nxt] == 0:
                    queue.append(nxt)
        return taken == num_courses
  javascript: |
    function canFinish(numCourses, prerequisites) {
      const indegree = new Array(numCourses).fill(0);
      const graph = Array.from({ length: numCourses }, () => []);
      for (const [course, prereq] of prerequisites) {
        graph[prereq].push(course);
        indegree[course]++;
      }
      const queue = [];
      for (let i = 0; i < numCourses; i++) if (indegree[i] === 0) queue.push(i);
      let taken = 0;
      for (let head = 0; head < queue.length; head++) {
        taken++;
        for (const next of graph[queue[head]]) {
          if (--indegree[next] === 0) queue.push(next);
        }
      }
      return taken === numCourses;
    }
  typescript: |
    function canFinish(numCourses: number, prerequisites: number[][]): boolean {
      const indegree: number[] = new Array<number>(numCourses).fill(0);
      const graph: number[][] = Array.from({ length: numCourses }, () => []);
      for (const [course, prereq] of prerequisites) {
        graph[prereq].push(course);
        indegree[course]++;
      }
      const queue: number[] = [];
      for (let i = 0; i < numCourses; i++) if (indegree[i] === 0) queue.push(i);
      let taken = 0;
      for (let head = 0; head < queue.length; head++) {
        taken++;
        for (const next of graph[queue[head]]) {
          if (--indegree[next] === 0) queue.push(next);
        }
      }
      return taken === numCourses;
    }
  java: |
    import java.util.*;

    class Solution {
        public boolean canFinish(int numCourses, int[][] prerequisites) {
            int[] indegree = new int[numCourses];
            List<List<Integer>> graph = new ArrayList<>();
            for (int i = 0; i < numCourses; i++) graph.add(new ArrayList<>());
            for (int[] pair : prerequisites) {
                graph.get(pair[1]).add(pair[0]);
                indegree[pair[0]]++;
            }
            Deque<Integer> queue = new ArrayDeque<>();
            for (int i = 0; i < numCourses; i++) if (indegree[i] == 0) queue.add(i);
            int taken = 0;
            while (!queue.isEmpty()) {
                int node = queue.poll();
                taken++;
                for (int next : graph.get(node)) {
                    if (--indegree[next] == 0) queue.add(next);
                }
            }
            return taken == numCourses;
        }
    }
  go: |
    package main

    func canFinish(numCourses int, prerequisites [][]int) bool {
    	indegree := make([]int, numCourses)
    	graph := make([][]int, numCourses)
    	for _, pair := range prerequisites {
    		graph[pair[1]] = append(graph[pair[1]], pair[0])
    		indegree[pair[0]]++
    	}
    	queue := []int{}
    	for i := 0; i < numCourses; i++ {
    		if indegree[i] == 0 {
    			queue = append(queue, i)
    		}
    	}
    	taken := 0
    	for head := 0; head < len(queue); head++ {
    		taken++
    		for _, next := range graph[queue[head]] {
    			indegree[next]--
    			if indegree[next] == 0 {
    				queue = append(queue, next)
    			}
    		}
    	}
    	return taken == numCourses
    }
  cpp: |
    #include <queue>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        bool canFinish(int numCourses, vector<vector<int>>& prerequisites) {
            vector<int> indegree(numCourses, 0);
            vector<vector<int>> graph(numCourses);
            for (const auto& pair : prerequisites) {
                graph[pair[1]].push_back(pair[0]);
                ++indegree[pair[0]];
            }
            queue<int> ready;
            for (int i = 0; i < numCourses; ++i) if (indegree[i] == 0) ready.push(i);
            int taken = 0;
            while (!ready.empty()) {
                int node = ready.front();
                ready.pop();
                ++taken;
                for (int next : graph[node]) {
                    if (--indegree[next] == 0) ready.push(next);
                }
            }
            return taken == numCourses;
        }
    };
