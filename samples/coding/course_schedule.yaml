expected_concepts:
  - directed graph built from prerequisite pairs
  - topological sort (Kahn's algorithm) or DFS with visit states
  - cycle detection
  - O(V + E) complexity
optimal_complexity: {time: O(V + E), space: O(V + E)}
rubric:
  excellent: Models the problem as cycle detection, implements Kahn's algorithm or three-colour DFS correctly (self-loops, duplicates, disconnected components), and explains O(V + E) and recursion-depth trade-offs.
  good: Correct topological sort or DFS with minor prompting on disconnected components or edge direction.
  weak: Only checks direct two-course cycles, reverses edge direction inconsistently, or uses a visited set that cannot distinguish "in progress" from "done".
  criteria:
    correctness: All tests pass, including self-loops, duplicates and cycles in separate components.
    efficiency: Linear in courses plus prerequisites.
    code_quality: Clear adjacency list and in-degree bookkeeping.
    edge_cases: No prerequisites, duplicate pairs, self-dependency and long chains.
    communication: Explains why a remaining positive in-degree (or a back edge) means a cycle.
hints:
  - Draw the courses as nodes and prerequisites as arrows — what shape of graph makes it impossible to finish?
  - A course with no remaining prerequisites can be taken now; taking it may unlock other courses.
  - Build an adjacency list and in-degree counts, repeatedly take courses whose in-degree is zero (Kahn's algorithm), and check whether you took all of them; any course left over is part of a cycle.
followups:
  - What happens if a course lists itself as a prerequisite?
  - How would you return a valid order in which to take the courses?
  - Why might a recursive DFS fail on a chain of 100,000 courses, and how would you avoid it?
  - How does this relate to ordering Terraform resources or database migrations?
common_errors:
  - Reversing the edge direction between building the graph and updating in-degrees.
  - Using a single visited set in DFS, which reports false cycles on diamond-shaped graphs.
  - Starting the traversal only from course 0 and missing disconnected components.
  - Deep recursion on long chains without considering stack limits.
