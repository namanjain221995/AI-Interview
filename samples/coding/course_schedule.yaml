version: 1
slug: course_schedule
title: Course Schedule (Dependency Cycle Detection)
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, devops, platform, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Course Schedule

  There are `num_courses` courses labelled `0` to `num_courses - 1`. Each pair `[a, b]` in
  `prerequisites` means you must finish course `b` before course `a`. Return `true` if it is possible to
  finish **all** courses, otherwise `false`.

  (The same problem appears as "can these services / build targets / migrations be ordered?" — it is
  cycle detection in a directed graph.)

  ### Example 1
  ```
  Input:  num_courses = 2, prerequisites = [[1, 0]]
  Output: true
  Explanation: take course 0, then course 1
  ```

  ### Example 2
  ```
  Input:  num_courses = 2, prerequisites = [[1, 0], [0, 1]]
  Output: false
  Explanation: each course requires the other
  ```

  ### Constraints
  - `1 <= num_courses <= 2000`
  - `0 <= prerequisites.length <= 5000`
  - `prerequisites[i].length == 2` and `0 <= a, b < num_courses`
  - Pairs may repeat, and a course may (invalidly) list itself as a prerequisite.
languages: [python, javascript, typescript, java, go, cpp]
