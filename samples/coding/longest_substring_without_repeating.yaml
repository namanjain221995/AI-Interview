prompt_markdown: |
  ## Longest Substring Without Repeating Characters

  Given a string `s`, return the length of the longest **substring** (a contiguous block of characters)
  in which no character appears more than once.

  ### Example 1
  ```
  Input:  s = "abcabcbb"
  Output: 3
  Explanation: "abc" has length 3
  ```

  ### Example 2
  ```
  Input:  s = "bbbbb"
  Output: 1
  ```

  ### Example 3
  ```
  Input:  s = "pwwkew"
  Output: 3
  Explanation: "wke" has length 3; "pwke" is a subsequence, not a substring
  ```

  ### Constraints
  - `0 <= s.length <= 5 * 10^4`
  - `s` consists of printable ASCII characters (letters, digits, symbols and spaces).
