reference_solutions:
  python: |
    def length_of_longest_substring(s: str) -> int:
        last_seen: dict[str, int] = {}
        start = best = 0
        for i, ch in enumerate(s):
            if last_seen.get(ch, -1) >= start:
                start = last_seen[ch] + 1
            last_seen[ch] = i
            best = max(best, i - start + 1)
        return best
  javascript: |
    function lengthOfLongestSubstring(s) {
      const lastSeen = new Map();
      let start = 0;
      let best = 0;
      for (let i = 0; i < s.length; i++) {
        const ch = s[i];
        if (lastSeen.has(ch) && lastSeen.get(ch) >= start) start = lastSeen.get(ch) + 1;
        lastSeen.set(ch, i);
        best = Math.max(best, i - start + 1);
      }
      return best;
    }
  typescript: |
    function lengthOfLongestSubstring(s: string): number {
      const lastSeen = new Map<string, number>();
      let start = 0;
      let best = 0;
      for (let i = 0; i < s.length; i++) {
        const prev = lastSeen.get(s[i]);
        if (prev !== undefined && prev >= start) start = prev + 1;
        lastSeen.set(s[i], i);
        best = Math.max(best, i - start + 1);
      }
      return best;
    }
  java: |
    import java.util.*;

    class Solution {
        public int lengthOfLongestSubstring(String s) {
            Map<Character, Integer> lastSeen = new HashMap<>();
            int start = 0;
            int best = 0;
            for (int i = 0; i < s.length(); i++) {
                char ch = s.charAt(i);
                Integer prev = lastSeen.get(ch);
                if (prev != null && prev >= start) start = prev + 1;
                lastSeen.put(ch, i);
                best = Math.max(best, i - start + 1);
            }
            return best;
        }
    }
  go: |
    package main

    func lengthOfLongestSubstring(s string) int {
    	lastSeen := map[byte]int{}
    	start, best := 0, 0
    	for i := 0; i < len(s); i++ {
    		if prev, ok := lastSeen[s[i]]; ok && prev >= start {
    			start = prev + 1
    		}
    		lastSeen[s[i]] = i
    		if i-start+1 > best {
    			best = i - start + 1
    		}
    	}
    	return best
    }
  cpp: |
    #include <algorithm>
    #include <string>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        int lengthOfLongestSubstring(string s) {
            vector<int> lastSeen(256, -1);
            int start = 0;
            int best = 0;
            for (int i = 0; i < (int)s.size(); ++i) {
                unsigned char ch = s[i];
                if (lastSeen[ch] >= start) start = lastSeen[ch] + 1;
                lastSeen[ch] = i;
                best = max(best, i - start + 1);
            }
            return best;
        }
    };
