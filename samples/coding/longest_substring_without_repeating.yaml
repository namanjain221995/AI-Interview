expected_concepts:
  - sliding window with two pointers
  - last-seen index per character
  - never moving the window start backwards
  - O(n) time
optimal_complexity: {time: O(n), space: "O(min(n, k)) for an alphabet of size k"}
rubric:
  excellent: Uses a sliding window with last-seen indices, explains why the start only moves forward ("abba"), and states O(n) time with alphabet-bounded space.
  good: Correct sliding window using a set and a shrinking left pointer, possibly after fixing one edge case.
  weak: Checks every substring (O(n^2) or worse), or resets the window incorrectly so "abba" or "dvdf" fail.
  criteria:
    correctness: All tests pass, including "abba", "dvdf" and the empty string.
    efficiency: Each character is processed a constant number of times.
    code_quality: Window boundaries are explicit and well named.
    edge_cases: Empty string, spaces, symbols and duplicates outside the window.
    communication: Explains the window invariant (no duplicates between start and i).
hints:
  - Think of a window over the string that never contains a repeated character — what should happen to the window when the next character is already inside it?
  - Remember where you last saw each character; when you meet a repeat, the new window can start just after its previous position, but never before the current start.
  - Keep start and a map of last-seen indices; for each index i, if the character was last seen at or after start, move start to that index plus one, then update the map and the best length i - start + 1.
followups:
  - What happens with the empty string or a string of identical characters?
  - How would the solution change for full Unicode text, including characters outside the Basic Multilingual Plane?
  - How would you return the substring itself rather than its length?
  - How would you allow at most two repeats of each character?
common_errors:
  - Moving the window start backwards to an older duplicate position, which breaks "abba".
  - Clearing the whole set on a repeat instead of shrinking from the left, which breaks "dvdf".
  - Checking every substring with a set, giving O(n^2) or O(n^3) time.
  - Off-by-one when computing the window length.
