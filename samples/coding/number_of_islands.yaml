reference_solutions:
  python: |
    from collections import deque


    def num_islands(grid: list[list[int]]) -> int:
        if not grid:
            return 0
        rows, cols = len(grid), len(grid[0])
        seen = [[False] * cols for _ in range(rows)]
        islands = 0
        for r in range(rows):
            for c in range(cols):
                if grid[r][c] != 1 or seen[r][c]:
                    continue
                islands += 1
                seen[r][c] = True
                queue = deque([(r, c)])
                while queue:
                    cr, cc = queue.popleft()
                    for nr, nc in ((cr + 1, cc), (cr - 1, cc), (cr, cc + 1), (cr, cc - 1)):
                        if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] == 1 and not seen[nr][nc]:
                            seen[nr][nc] = True
                            queue.append((nr, nc))
        return islands
  javascript: |
    function numIslands(grid) {
      const rows = grid.length;
      if (rows === 0) return 0;
      const cols = grid[0].length;
      const seen = Array.from({ length: rows }, () => new Array(cols).fill(false));
      let islands = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] !== 1 || seen[r][c]) continue;
          islands++;
          seen[r][c] = true;
          const stack = [[r, c]];
          while (stack.length > 0) {
            const [cr, cc] = stack.pop();
            for (const [nr, nc] of [[cr + 1, cc], [cr - 1, cc], [cr, cc + 1], [cr, cc - 1]]) {
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 1 && !seen[nr][nc]) {
                seen[nr][nc] = true;
                stack.push([nr, nc]);
              }
            }
          }
        }
      }
      return islands;
    }
  typescript: |
    function numIslands(grid: number[][]): number {
      const rows = grid.length;
      if (rows === 0) return 0;
      const cols = grid[0].length;
      const seen: boolean[][] = Array.from({ length: rows }, () => new Array<boolean>(cols).fill(false));
      let islands = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] !== 1 || seen[r][c]) continue;
          islands++;
          seen[r][c] = true;
          const stack: Array<[number, number]> = [[r, c]];
          while (stack.length > 0) {
            const [cr, cc] = stack.pop()!;
            const neighbours: Array<[number, number]> = [[cr + 1, cc], [cr - 1, cc], [cr, cc + 1], [cr, cc - 1]];
            for (const [nr, nc] of neighbours) {
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 1 && !seen[nr][nc]) {
                seen[nr][nc] = true;
                stack.push([nr, nc]);
              }
            }
          }
        }
      }
      return islands;
    }
  java: |
    import java.util.*;

    class Solution {
        public int numIslands(int[][] grid) {
            if (grid.length == 0) return 0;
            int rows = grid.length;
            int cols = grid[0].length;
            boolean[][] seen = new boolean[rows][cols];
            int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};
            int islands = 0;
            for (int r = 0; r < rows; r++) {
                for (int c = 0; c < cols; c++) {
                    if (grid[r][c] != 1 || seen[r][c]) continue;
                    islands++;
                    seen[r][c] = true;
                    Deque<int[]> stack = new ArrayDeque<>();
                    stack.push(new int[]{r, c});
                    while (!stack.isEmpty()) {
                        int[] cell = stack.pop();
                        for (int[] d : dirs) {
                            int nr = cell[0] + d[0];
                            int nc = cell[1] + d[1];
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] == 1 && !seen[nr][nc]) {
                                seen[nr][nc] = true;
                                stack.push(new int[]{nr, nc});
                            }
                        }
                    }
                }
            }
            return islands;
        }
    }
  go: |
    package main

    func numIslands(grid [][]int) int {
    	if len(grid) == 0 {
    		return 0
    	}
    	rows, cols := len(grid), len(grid[0])
    	seen := make([][]bool, rows)
    	for i := range seen {
    		seen[i] = make([]bool, cols)
    	}
    	dirs := [4][2]int{{1, 0}, {-1, 0}, {0, 1}, {0, -1}}
    	islands := 0
    	for r := 0; r < rows; r++ {
    		for c := 0; c < cols; c++ {
    			if grid[r][c] != 1 || seen[r][c] {
    				continue
    			}
    			islands++
    			seen[r][c] = true
    			stack := [][2]int{{r, c}}
    			for len(stack) > 0 {
    				cell := stack[len(stack)-1]
    				stack = stack[:len(stack)-1]
    				for _, d := range dirs {
    					nr, nc := cell[0]+d[0], cell[1]+d[1]
    					if nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] == 1 && !seen[nr][nc] {
    						seen[nr][nc] = true
    						stack = append(stack, [2]int{nr, nc})
    					}
    				}
    			}
    		}
    	}
    	return islands
    }
  cpp: |
    #include <utility>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        int numIslands(vector<vector<int>>& grid) {
            if (grid.empty()) return 0;
            int rows = grid.size();
            int cols = grid[0].size();
            vector<vector<bool>> seen(rows, vector<bool>(cols, false));
            const int dirs[4][2] = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};
            int islands = 0;
            for (int r = 0; r < rows; ++r) {
                for (int c = 0; c < cols; ++c) {
                    if (grid[r][c] != 1 || seen[r][c]) continue;
                    ++islands;
                    seen[r][c] = true;
                    vector<pair<int, int>> stack{{r, c}};
                    while (!stack.empty()) {
                        auto [cr, cc] = stack.back();
                        stack.pop_back();
                        for (const auto& d : dirs) {
                            int nr = cr + d[0];
                            int nc = cc + d[1];
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] == 1 && !seen[nr][nc]) {
                                seen[nr][nc] = true;
                                stack.push_back({nr, nc});
                            }
                        }
                    }
                }
            }
            return islands;
        }
    };
