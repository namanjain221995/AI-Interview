optimal_complexity: {time: "O(rows * cols)", space: "O(rows * cols)"}
rubric:
  excellent: Treats the grid as a graph, counts components with BFS/DFS or union-find, bounds-checks neighbours, avoids revisiting, and discusses recursion depth on large islands.
  good: Correct recursive or iterative traversal with minor help on bounds checks or the empty grid.
  weak: Counts land cells instead of components, connects diagonals, or revisits cells endlessly.
  criteria:
    correctness: All tests pass, including diagonal cells, rings and the empty grid.
    efficiency: Each cell is visited a constant number of times.
    code_quality: Neighbour iteration through a direction list rather than repeated blocks.
    edge_cases: Empty grid, single row/column and large connected regions.
    communication: Explains how visited cells are tracked and why each island is counted once.
hints:
  - Think of each land cell as a node connected to its land neighbours — what are you really counting?
  - Each time you find an unvisited land cell, you have found a new island; explore everything reachable from it so you never count it again.
  - Scan every cell; when you hit unvisited land, increment the count and run a BFS or an explicit-stack DFS over the four neighbours, marking cells visited as you push them.
followups:
  - What happens with an empty grid or a grid of all water?
  - Why can a recursive DFS fail on a 1000 x 1000 grid of land, and how do you avoid it?
  - How would you count islands if land cells were added one at a time (online)?
  - How would you also return the size of the largest island?
common_errors:
  - Counting land cells rather than connected components.
  - Treating diagonal neighbours as connected.
  - Marking cells visited only when popped, so the same cell is pushed many times.
  - Missing bounds checks on the grid edges.
