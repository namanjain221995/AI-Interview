version: 1
slug: department_top_earners
title: Department Top Three Salaries
difficulty: hard
competency_keys: [sql, databases]
role_tags: [backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Department Top Three Salaries

  Table `department`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | VARCHAR(100) | |

  Table `employee`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | VARCHAR(100) | |
  | salary | INTEGER | |
  | department_id | INTEGER | references `department.id` |

  A **top earner** of a department is an employee whose salary is among the **three highest distinct
  salaries** in that department. Return `department` (the department name), `employee` (the employee
  name) and `salary` for every top earner, in any order.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example
  ```
  department            employee
  +----+-------+        +----+-------+--------+---------------+
  | id | name  |        | id | name  | salary | department_id |
  +----+-------+        +----+-------+--------+---------------+
  | 1  | IT    |        | 1  | Joe   | 85000  | 1             |
  | 2  | Sales |        | 2  | Henry | 80000  | 2             |
  +----+-------+        | 3  | Sam   | 60000  | 2             |
                        | 4  | Max   | 90000  | 1             |
                        | 5  | Janet | 69000  | 1             |
                        | 6  | Randy | 85000  | 1             |
                        | 7  | Will  | 70000  | 1             |
                        +----+-------+--------+---------------+

  Output
  +------------+----------+--------+
  | department | employee | salary |
  +------------+----------+--------+
  | IT         | Max      | 90000  |
  | IT         | Joe      | 85000  |
  | IT         | Randy    | 85000  |
  | IT         | Will     | 70000  |
  | Sales      | Henry    | 80000  |
  | Sales      | Sam      | 60000  |
  +------------+----------+--------+
  Janet (69000) is excluded: IT's three highest distinct salaries are 90000, 85000 and 70000.
  ```
languages: [sql]
starter_code:
  sql: |
    -- Return department, employee and salary for the top three distinct salaries per department.
    SELECT d.name AS department, e.name AS employee, e.salary
    FROM employee e
    JOIN department d ON d.id = e.department_id;
reference_solutions:
  sql: |
    SELECT d.name AS department, e.name AS employee, e.salary
    FROM employee e
    JOIN department d ON d.id = e.department_id
    WHERE (
      SELECT COUNT(DISTINCT e2.salary)
      FROM employee e2
      WHERE e2.department_id = e.department_id
        AND e2.salary > e.salary
    ) < 3;
sql_setup: |
  CREATE TABLE department (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL
  );
  CREATE TABLE employee (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    salary INTEGER NOT NULL,
    department_id INTEGER NOT NULL REFERENCES department (id)
  );
tests:
  - id: t1
    description: Example - ties at second place, Janet excluded
    setup_sql: |
      INSERT INTO department (id, name) VALUES (1, 'IT'), (2, 'Sales');
      INSERT INTO employee (id, name, salary, department_id) VALUES
        (1, 'Joe', 85000, 1), (2, 'Henry', 80000, 2), (3, 'Sam', 60000, 2), (4, 'Max', 90000, 1),
        (5, 'Janet', 69000, 1), (6, 'Randy', 85000, 1), (7, 'Will', 70000, 1);
    expected_rows:
      - ["IT", "Max", 90000]
      - ["IT", "Joe", 85000]
      - ["IT", "Randy", 85000]
      - ["IT", "Will", 70000]
      - ["Sales", "Henry", 80000]
      - ["Sales", "Sam", 60000]
  - id: t2
    description: Small department - everyone qualifies
    setup_sql: |
      INSERT INTO department (id, name) VALUES (1, 'Ops');
      INSERT INTO employee (id, name, salary, department_id) VALUES (1, 'Ana', 50, 1), (2, 'Bo', 40, 1);
    expected_rows: [["Ops", "Ana", 50], ["Ops", "Bo", 40]]
  - id: t3
    hidden: true
    description: Empty tables
    expected_rows: []
  - id: t4
    hidden: true
    description: Department without employees is absent
    setup_sql: |
      INSERT INTO department (id, name) VALUES (1, 'IT'), (2, 'Legal');
      INSERT INTO employee (id, name, salary, department_id) VALUES (1, 'Joe', 10, 1);
    expected_rows: [["IT", "Joe", 10]]
  - id: t5
    hidden: true
    description: Ties at third place are all included
    setup_sql: |
      INSERT INTO department (id, name) VALUES (1, 'IT');
      INSERT INTO employee (id, name, salary, department_id) VALUES
        (1, 'A', 100, 1), (2, 'B', 90, 1), (3, 'C', 80, 1), (4, 'D', 80, 1), (5, 'E', 70, 1);
    expected_rows: [["IT", "A", 100], ["IT", "B", 90], ["IT", "C", 80], ["IT", "D", 80]]
  - id: t6
    hidden: true
    description: Everyone earns the same
    setup_sql: |
      INSERT INTO department (id, name) VALUES (1, 'IT');
      INSERT INTO employee (id, name, salary, department_id) VALUES (1, 'A', 5, 1), (2, 'B', 5, 1), (3, 'C', 5, 1), (4, 'D', 5, 1);
    expected_rows: [["IT", "A", 5], ["IT", "B", 5], ["IT", "C", 5], ["IT", "D", 5]]
  - id: t7
    hidden: true
    description: Ranking is per department, not global
    setup_sql: |
      INSERT INTO department (id, name) VALUES (1, 'IT'), (2, 'Sales');
      INSERT INTO employee (id, name, salary, department_id) VALUES
        (1, 'A', 900, 1), (2, 'B', 800, 1), (3, 'C', 700, 1), (4, 'D', 600, 1),
        (5, 'E', 50, 2), (6, 'F', 40, 2), (7, 'G', 30, 2), (8, 'H', 20, 2);
    expected_rows:
      - ["IT", "A", 900]
      - ["IT", "B", 800]
      - ["IT", "C", 700]
      - ["Sales", "E", 50]
      - ["Sales", "F", 40]
      - ["Sales", "G", 30]
  - id: t8
    hidden: true
    description: Same salary in different departments ranks independently
    setup_sql: |
      INSERT INTO department (id, name) VALUES (1, 'IT'), (2, 'HR');
      INSERT INTO employee (id, name, salary, department_id) VALUES
        (1, 'A', 100, 1), (2, 'B', 100, 2), (3, 'C', 90, 2), (4, 'D', 80, 2), (5, 'E', 70, 2);
    expected_rows: [["IT", "A", 100], ["HR", "B", 100], ["HR", "C", 90], ["HR", "D", 80]]
expected_concepts:
  - dense ranking within groups (DENSE_RANK or a correlated COUNT(DISTINCT))
  - joining to a lookup table
  - ties and distinct values
  - per-group versus global ranking
optimal_complexity: {time: "O(n log n) with window functions", space: O(n)}
rubric:
  excellent: Solves it with DENSE_RANK() OVER (PARTITION BY department) or a correlated COUNT(DISTINCT), explains why RANK or ROW_NUMBER give wrong results with ties, and discusses the cost of each approach.
  good: Correct query after a hint about distinct salaries or partitioning by department.
  weak: Uses LIMIT 3 globally, ROW_NUMBER (dropping ties), or ranks across all departments.
  criteria:
    correctness: All tests pass, including ties at the boundary and empty departments.
    efficiency: Set-based query; mentions indexes on (department_id, salary).
    code_quality: Clear aliases and output column names.
    edge_cases: Ties, departments with fewer than three salaries and empty tables.
    communication: Explains the difference between RANK, DENSE_RANK and ROW_NUMBER.
hints:
  - Think of ranking salaries separately inside each department — and of what should happen when two people share a salary.
  - An employee qualifies when fewer than three distinct salaries in their department are higher than theirs.
  - Either use DENSE_RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) <= 3 in a subquery, or filter with a correlated subquery that counts distinct higher salaries in the same department and keeps rows where that count is below 3.
followups:
  - Why does ROW_NUMBER give a different answer from DENSE_RANK here?
  - Which index would you add for this query on a large table?
  - How would you make the "top N" configurable?
common_errors:
  - Using ROW_NUMBER or LIMIT, which drops employees tied with a top earner.
  - Using RANK instead of DENSE_RANK, which skips ranks after ties.
  - Ranking across the whole company instead of per department.
