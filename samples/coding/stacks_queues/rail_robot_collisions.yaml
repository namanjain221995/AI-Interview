expected_concepts:
  - "stack of surviving carts"
  - "only right-mover followed by left-mover can collide"
  - "loop of collisions for each new left-mover"
  - "amortised O(n) because each cart is popped at most once"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Identifies that only a right-mover to the left of a left-mover can collide, uses a stack with a collision loop handling lighter, equal and heavier cases, and explains the amortised O(n) bound."
  good: "Correct stack solution after a nudge, with one of the three collision cases needing a fix."
  weak: "Simulates time steps, collides carts moving apart (left-mover followed by right-mover), or stops after the first collision of a left-mover."
  criteria:
    correctness: "All tests pass, including ties, chain collisions and carts moving apart."
    efficiency: "Linear amortised time with a single pass."
    code_quality: "Clear handling of the three collision outcomes without duplicated branches."
    edge_cases: "Empty input, no collisions at all, ties that remove both carts and a sweep that clears everything."
    communication: "Explains why carts moving apart can be ignored and why each cart is processed a bounded number of times."
hints:
  - "A collision can only happen between a cart moving right and a cart further right moving left; think about which earlier carts a new left-mover can reach."
  - "Process carts from left to right, keeping the survivors so far in a stack. A left-mover only ever fights the right-movers at the top of that stack."
  - "For each left-mover, while the stack top is a right-mover: remove the top and keep going if it is lighter, remove the top and drop the left-mover if they are equal, or drop the left-mover if the top is heavier. Push the cart if it survives; right-movers are always pushed. The stack from bottom to top is the answer."
followups:
  - "How would you also report the time of each collision if carts had positions on the rail?"
  - "What changes if carts could have different speeds?"
  - "How would you return how many carts each survivor destroyed?"
  - "Can you solve it in place, reusing the input array as the stack?"
common_errors:
  - "Treating a left-mover followed by a right-mover as a collision."
  - "Handling only one collision per left-mover instead of looping."
  - "Forgetting to remove both carts when the masses are equal."
  - "Comparing signed values instead of masses."
