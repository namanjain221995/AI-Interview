version: 1
slug: rail_robot_collisions
title: "Rail Robot Collisions"
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Rail Robot Collisions

  Autonomous carts share a single straight rail in a warehouse aisle. `robots` lists them from left to
  right. The absolute value of each entry is the cart's mass and its sign is its direction: positive
  moves right, negative moves left. All carts move at the same speed, so carts moving in the same
  direction never meet. Carts never stop or turn around.

  When two carts meet head-on, the lighter one is destroyed and the heavier one carries on unchanged;
  if both have the same mass, both are destroyed.

  Return the carts that remain once no more collisions can happen, from left to right, using their
  original signed values. Return an empty list if no cart survives.

  ### Example 1
  ```
  Input:  robots = [4, 7, -5]
  Output: [4, 7]
  Explanation: 7 and -5 meet and the lighter -5 is destroyed; 4 and 7 move in the same direction
  ```

  ### Example 2
  ```
  Input:  robots = [3, -3]
  Output: []
  Explanation: both carts have mass 3
  ```

  ### Example 3
  ```
  Input:  robots = [-2, 6, 2, -9, 5]
  Output: [-2, -9, 5]
  Explanation: -9 destroys 2 and then 6; -2 is already moving away and 5 moves away to the right
  ```

  ### Constraints
  - `0 <= robots.length <= 10^4`
  - `1 <= |robots[i]| <= 10^6` (no entry is zero)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: surviving_rail_robots
  params:
    - {name: robots, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def surviving_rail_robots(robots: list[int]) -> list[int]:
        stack: list[int] = []
        for robot in robots:
            alive = True
            while alive and robot < 0 and stack and stack[-1] > 0:
                if stack[-1] < -robot:
                    stack.pop()
                    continue
                if stack[-1] == -robot:
                    stack.pop()
                alive = False
            if alive:
                stack.append(robot)
        return stack
  javascript: |
    function survivingRailRobots(robots) {
      const stack = [];
      for (const robot of robots) {
        let alive = true;
        while (alive && robot < 0 && stack.length > 0 && stack[stack.length - 1] > 0) {
          const top = stack[stack.length - 1];
          if (top < -robot) {
            stack.pop();
            continue;
          }
          if (top === -robot) stack.pop();
          alive = false;
        }
        if (alive) stack.push(robot);
      }
      return stack;
    }
