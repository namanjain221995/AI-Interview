slug: price_guard_minimum_stack
title: "Price Guard Minimum Stack"
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, general, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Price Guard Minimum Stack

  During a flash sale, the pricing service layers temporary price overrides on top of each other: a new
  campaign pushes an override, and when a campaign ends the most recent override is removed. A price guard
  must be able to report the **lowest** override that is still active at any moment, in constant time, so
  that it can block prices below cost.

  You receive the operations as strings, in order:

  - `"push x"` - add an override of `x` cents on top;
  - `"pop"` - remove the most recently added active override; ignored if there are none;
  - `"min"` - report the lowest active override, or `-1` if there are none.

  Write `track_stack_minimums(ops)` that returns the answers to all `"min"` operations, in order. Every
  operation, including `"min"`, should take `O(1)` time.

  ### Example 1
  ```
  Input:  ops = ["push 499", "push 350", "min", "push 350", "pop", "min", "pop", "min"]
  Output: [350, 350, 499]
  Explanation: After removing one of the two 350 overrides the other is still active; after removing it too, 499 is the lowest.
  ```

  ### Example 2
  ```
  Input:  ops = ["min", "pop", "push 0", "min"]
  Output: [-1, 0]
  Explanation: The first min sees no overrides and the pop is ignored.
  ```

  ### Constraints
  - `0 <= ops.length <= 10^5`
  - Each operation is `"push x"`, `"pop"` or `"min"`.
  - `0 <= x <= 10^9`

  **Follow-up:** can you reduce the extra memory when many pushed prices are larger than the current minimum?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: track_stack_minimums
  params:
    - {name: ops, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def track_stack_minimums(ops: list[str]) -> list[int]:
        stack: list[tuple[int, int]] = []  # (price, lowest price at or below this entry)
        answers: list[int] = []
        for op in ops:
            if op == "pop":
                if stack:
                    stack.pop()
            elif op == "min":
                answers.append(stack[-1][1] if stack else -1)
            else:
                price = int(op.split()[1])
                lowest = min(price, stack[-1][1]) if stack else price
                stack.append((price, lowest))
        return answers
  javascript: |
    function trackStackMinimums(ops) {
      const prices = [];
      const lows = [];
      const answers = [];
      for (const op of ops) {
        if (op === "pop") {
          if (prices.length > 0) {
            prices.pop();
            lows.pop();
          }
        } else if (op === "min") {
          answers.push(lows.length > 0 ? lows[lows.length - 1] : -1);
        } else {
          const price = Number(op.split(" ")[1]);
          const low = lows.length > 0 ? Math.min(price, lows[lows.length - 1]) : price;
          prices.push(price);
          lows.push(low);
        }
      }
      return answers;
    }
