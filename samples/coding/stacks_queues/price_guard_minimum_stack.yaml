expected_concepts:
  - "storing the running minimum alongside each stack entry"
  - "auxiliary minimum stack"
  - "handling duplicate minimum values"
  - "O(1) per operation"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Pairs each entry with the minimum at that depth (or keeps an auxiliary min stack that handles duplicates), gives O(1) per operation, handles pops on empty and returns -1 correctly."
  good: "Correct O(1) solution reached after considering a scan-based baseline, possibly with a hint about duplicates."
  weak: "Scans the whole stack on every min, keeps a single global minimum that is wrong after a pop, or drops duplicate minimums."
  criteria:
    correctness: "All tests pass, including duplicate minimums and an emptied then refilled stack."
    efficiency: "Constant time per operation and linear total time."
    code_quality: "Parsing is separated from the stack logic; entries are self-describing."
    edge_cases: "Empty stack queries, ignored pops, extreme values, duplicates."
    communication: "Explains why a single minimum variable cannot survive pops."
hints:
  - "A single variable holding the current minimum breaks as soon as that value is popped; what extra information would let you recover the previous minimum?"
  - "The minimum of the stack only depends on the entries below the top, so you can remember, for every depth, what the minimum was when that entry was pushed."
  - "Store each pushed price together with the smaller of that price and the minimum stored in the entry below it; a pop removes the pair, and the minimum query just reads the stored minimum of the top pair or reports minus one when empty."
followups:
  - "How would you also support reporting the maximum in O(1)?"
  - "How would you build a queue that reports its minimum in amortized O(1)?"
  - "How would the design change if overrides could be removed from the middle by campaign id?"
common_errors:
  - "Keeping only one minimum variable, which is wrong after the minimum is popped."
  - "Pushing to the auxiliary stack only when strictly smaller, losing duplicates of the minimum."
  - "Scanning the stack for every min query, which is O(n) per query."
  - "Crashing on pop or min when the stack is empty."
