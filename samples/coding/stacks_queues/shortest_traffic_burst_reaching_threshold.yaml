title: Shortest Traffic Burst Reaching Threshold
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, network, backend, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Shortest Traffic Burst Reaching Threshold

  A load balancer exports, for every second, the **net change** in open connections: new connections
  minus closed ones. The value `deltas[i]` for second `i` can therefore be positive, zero or negative.

  An on-call engineer wants to know how fast the backlog can grow: find the **shortest non-empty run of
  consecutive seconds** whose deltas add up to **at least** `threshold`.

  Return the number of seconds in that run, or `-1` if no run of consecutive seconds reaches the
  threshold.

  ### Example 1
  ```
  Input:  deltas = [3, -5, 2, 4, -1, 6], threshold = 9
  Output: 3
  Explanation: seconds 3 to 5 give 4 + (-1) + 6 = 9; no run of one or two seconds reaches 9
  ```

  ### Example 2
  ```
  Input:  deltas = [-2, -1, -3], threshold = 1
  Output: -1
  ```

  ### Example 3
  ```
  Input:  deltas = [5, -10, 4, 4], threshold = 8
  Output: 2
  Explanation: the last two seconds sum to 8; any run that starts before the -10 is worse
  ```

  ### Constraints
  - `1 <= deltas.length <= 10^5`
  - `-10^9 <= deltas[i] <= 10^9`
  - `1 <= threshold <= 10^14`
  - Running totals can exceed the 32-bit range, so use 64-bit arithmetic where your language needs it.

  **Follow-up:** a sliding window that only shrinks while the sum is large enough is not correct once
  negative values appear. Can you still find the answer in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_burst_length
  params:
    - {name: deltas, type: "int[]"}
    - {name: threshold, type: long}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def shortest_burst_length(deltas: list[int], threshold: int) -> int:
        prefix = [0]
        for d in deltas:
            prefix.append(prefix[-1] + d)
        best = len(deltas) + 1
        starts: deque[int] = deque()  # candidate start indices, prefix values strictly increasing
        for end, total in enumerate(prefix):
            while starts and total - prefix[starts[0]] >= threshold:
                best = min(best, end - starts.popleft())
            while starts and prefix[starts[-1]] >= total:
                starts.pop()
            starts.append(end)
        return best if best <= len(deltas) else -1
  javascript: |
    function shortestBurstLength(deltas, threshold) {
      const n = deltas.length;
      const prefix = new Array(n + 1);
      prefix[0] = 0;
      for (let i = 0; i < n; i++) prefix[i + 1] = prefix[i] + deltas[i];
      // Deque of candidate start indices stored in an array with a moving head.
      const starts = new Array(n + 1);
      let head = 0;
      let tail = 0;
      let best = n + 1;
      for (let end = 0; end <= n; end++) {
        while (head < tail && prefix[end] - prefix[starts[head]] >= threshold) {
          best = Math.min(best, end - starts[head]);
          head++;
        }
        while (head < tail && prefix[starts[tail - 1]] >= prefix[end]) tail--;
        starts[tail++] = end;
      }
      return best <= n ? best : -1;
    }
