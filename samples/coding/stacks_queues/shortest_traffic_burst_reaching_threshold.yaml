expected_concepts:
  - prefix sums turn a run sum into a difference of two prefix values
  - why the positive-only sliding window fails with negative values
  - monotonic deque of start indices with increasing prefix values
  - popping from the front once a start is used (it can never give a shorter run later)
  - 64-bit running totals
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Explains why the two-pointer window breaks with negative deltas, rewrites the run sum with prefix sums, derives both deque rules (drop a back start whose prefix is not smaller; consume a front start once it qualifies) with a justification, implements O(n) with 64-bit totals and handles the -1 case."
  good: "Reaches a correct O(n log n) solution (for example a monotonic stack plus binary search, or a sorted structure of prefixes) or the deque solution with notable hints."
  weak: "Uses the plain sliding window that assumes non-negative values, stays at O(n^2) without improvement, or overflows 32-bit sums."
  criteria:
    correctness: "All tests pass, including no-answer cases, single elements and sums beyond 32-bit."
    efficiency: "Linear time with each prefix index entering and leaving the deque at most once."
    code_quality: "Prefix array and deque invariants are named and commented; sentinel for no answer is handled cleanly."
    edge_cases: "All-negative input, threshold met by one element, zeros and ties, long window needed."
    communication: "States and argues the two deque invariants rather than presenting them as a memorised trick."
hints:
  - "Why does the usual expand-and-shrink window break here? Try it on an example where a negative second sits in the middle of the best run."
  - "Write the sum of a run as the difference of two prefix sums. For a fixed end, you want the latest start whose prefix is small enough; which earlier starts can never be the best choice for any future end?"
  - "Keep a double-ended queue of start indices with strictly increasing prefix values: before adding a new index, remove from the back any start whose prefix is greater than or equal to the new one; at each end, while the front start makes the run reach the threshold, record the length and remove it from the front."
followups:
  - "How would you also return the start and end second of the shortest burst?"
  - "If the deltas arrived as an unbounded stream and you only cared about bursts of at most W seconds, what would you keep in memory?"
  - "How would you count how many runs reach the threshold instead of finding the shortest one?"
common_errors:
  - "Applying the positive-only sliding window, which skips valid runs after negative values."
  - "Using 32-bit integers for running sums that exceed two billion."
  - "Keeping starts whose prefix is not smaller than a later start, which breaks the monotonic property."
  - "Returning 0 instead of -1 when no run reaches the threshold."
