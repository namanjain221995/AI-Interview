title: Longest Stable Sensor Stretch
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [data, sre, ml]
time_limit_minutes: 25
prompt_markdown: |
  ## Longest Stable Sensor Stretch

  A calibration job replays the readings of one sensor in the order they were recorded. Before it
  fits a calibration curve it needs a **stable stretch**: a run of consecutive readings in which the
  highest reading and the lowest reading differ by **at most** `tolerance`.

  Given the readings and the tolerance, return the **length** of the longest stable stretch. A single
  reading is always stable, so the answer is at least `1`.

  ### Example 1
  ```
  Input:  readings = [4, 8, 6, 7, 12, 11, 10], tolerance = 2
  Output: 3
  Explanation: [8, 6, 7] (max 8, min 6) and [12, 11, 10] (max 12, min 10) are both stable.
  Every run of four consecutive readings spans more than 2.
  ```

  ### Example 2
  ```
  Input:  readings = [50, 51, 49, 50, 58, 52, 51, 50], tolerance = 2
  Output: 4
  Explanation: [50, 51, 49, 50] has max 51 and min 49.
  ```

  ### Example 3
  ```
  Input:  readings = [7, 7, 7], tolerance = 0
  Output: 3
  ```

  ### Constraints
  - `1 <= readings.length <= 10^5`
  - `0 <= readings[i] <= 10^9`
  - `0 <= tolerance <= 10^9`

  **Follow-up:** an `O(n log n)` solution with a sorted structure is acceptable; can you reach `O(n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_stable_stretch
  params:
    - {name: readings, type: "int[]"}
    - {name: tolerance, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def longest_stable_stretch(readings: list[int], tolerance: int) -> int:
        highs: deque[int] = deque()  # indices, readings non-increasing
        lows: deque[int] = deque()  # indices, readings non-decreasing
        best = 0
        left = 0
        for right, value in enumerate(readings):
            while highs and readings[highs[-1]] < value:
                highs.pop()
            highs.append(right)
            while lows and readings[lows[-1]] > value:
                lows.pop()
            lows.append(right)
            while readings[highs[0]] - readings[lows[0]] > tolerance:
                left += 1
                if highs[0] < left:
                    highs.popleft()
                if lows[0] < left:
                    lows.popleft()
            best = max(best, right - left + 1)
        return best
  javascript: |
    function longestStableStretch(readings, tolerance) {
      // Monotonic deques stored in arrays with moving head pointers.
      const highs = [];
      const lows = [];
      let hHead = 0;
      let lHead = 0;
      let left = 0;
      let best = 0;
      for (let right = 0; right < readings.length; right++) {
        const value = readings[right];
        while (highs.length > hHead && readings[highs[highs.length - 1]] < value) highs.pop();
        highs.push(right);
        while (lows.length > lHead && readings[lows[lows.length - 1]] > value) lows.pop();
        lows.push(right);
        while (readings[highs[hHead]] - readings[lows[lHead]] > tolerance) {
          left++;
          if (highs[hHead] < left) hHead++;
          if (lows[lHead] < left) lHead++;
        }
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
