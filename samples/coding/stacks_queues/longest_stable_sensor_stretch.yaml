expected_concepts:
  - "sliding window with two pointers"
  - "monotonic deque for the running maximum"
  - "monotonic deque for the running minimum"
  - "amortised O(n) because each index is pushed and popped once"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Recognises that stability is monotone in the window, slides two pointers and keeps the window maximum and minimum in two monotonic deques, explains the amortised O(n) bound and handles equal readings cleanly."
  good: "Uses a sliding window with a sorted multiset or heaps with lazy deletion for O(n log n), or reaches the deque solution with some prompting."
  weak: "Checks every start and end with a fresh max/min scan, or shrinks the window incorrectly so stretches are over- or under-counted."
  criteria:
    correctness: "All tests pass, including a single reading, zero tolerance and readings far apart."
    efficiency: "Linear time with two deques, or O(n log n) with an ordered structure; no quadratic rescans."
    code_quality: "Deques hold indices with a clear invariant; the shrink loop is short and readable."
    edge_cases: "Equal readings, a single element, and differences close to 10^9 without overflow."
    communication: "Explains why shrinking from the left is safe and why each index is processed a constant number of times."
hints:
  - "If a run of readings is stable, every shorter run inside it is stable too, so think about growing a window on the right and shrinking it on the left."
  - "The only thing you need about the current window is its maximum and its minimum; how can you keep both up to date as readings enter on the right and leave on the left?"
  - "Keep two double-ended queues of indices, one whose readings never increase from front to back for the maximum and one whose readings never decrease for the minimum; drop dominated indices from the back when a reading arrives, advance the left edge while front maximum minus front minimum exceeds the tolerance, discarding fronts that fall out of the window, and record the window length."
followups:
  - "How would you return the start index of the longest stable stretch, preferring the earliest one on ties?"
  - "How would you answer the question for a live stream where readings arrive one by one?"
  - "What changes if the stability rule were based on the average instead of the max-min spread?"
common_errors:
  - "Recomputing the maximum and minimum of the window from scratch on every step, giving quadratic time."
  - "Storing values instead of indices in the deques, so it is impossible to tell when the front leaves the window."
  - "Moving the left edge by more than one position at a time and skipping valid windows."
  - "Using non-strict comparisons inconsistently so equal readings are dropped while still inside the window."
