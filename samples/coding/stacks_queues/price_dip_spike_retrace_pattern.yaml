expected_concepts:
  - fixing the middle element and using the minimum to its left as the best dip
  - monotonic stack scanned from the right to track the best retrace value
  - strict inequalities with equal prices
  - O(n) time because every value is pushed and popped at most once
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Moves from the cubic baseline to the O(n^2) prefix-minimum idea, then derives a monotonic-stack scan (a right-to-left scan tracking the best retrace value, or prefix minimums combined with a right-to-left stack), handles equal prices strictly and proves O(n) with the push-once argument."
  good: "Reaches the O(n^2) prefix-minimum solution independently and the stack approach with hints, with correct handling of ties."
  weak: "Only checks consecutive days, uses non-strict comparisons, or stays at the triple loop."
  criteria:
    correctness: "All tests pass, including ties, negative prices and patterns spread across distant days."
    efficiency: "Linear time and space using a monotonic stack."
    code_quality: "The stack invariant is stated in a comment and variable names say which role (dip, spike, retrace) each value plays."
    edge_cases: "Fewer than three prices, all-equal prices, strictly monotonic series."
    communication: "Explains what the popped value represents and why keeping only the largest retrace is enough."
hints:
  - "Try fixing the spike day. Which dip would you want before it, and which retrace values after it would complete the pattern?"
  - "For a fixed spike, the best dip is the smallest price before it, which gives an O(n^2) method. To reach linear time, scan from the right and maintain the best candidate retrace: a value that already has a strictly larger spike somewhere to its left within the scanned part."
  - "Scan from the last day to the first with a stack of prices. If the current price is below the best retrace value seen so far, you have found the dip. Otherwise pop every stack value smaller than the current price, each popped value becomes the new retrace candidate because the current price is a larger spike before it, then push the current price."
followups:
  - "How would you return the three days of the first pattern found instead of a boolean?"
  - "How would you count how many spike days take part in at least one pattern?"
  - "How would you process prices as a live stream and raise the flag as early as possible?"
common_errors:
  - "Using a non-strict comparison so equal prices form a false pattern."
  - "Only looking at three consecutive days."
  - "Keeping the smallest instead of the largest retrace candidate, which misses valid patterns."
  - "Mixing up the order of the dip and the retrace (requiring the retrace before the spike)."
