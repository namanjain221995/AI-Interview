prompt_markdown: |
  ## Price Dip-Spike-Retrace Pattern

  A pricing team reviews the daily price history of each product and wants to flag series that show a
  **dip, then a spike, then a partial retrace**: a low price, a later higher price, and an even later
  price that falls back somewhere strictly between the two.

  Formally, given `prices` in chronological order, return `true` if there are indices `i < j < k` with

  ```
  prices[i] < prices[k] < prices[j]
  ```

  and `false` otherwise. The three days do not have to be consecutive, and all comparisons are strict.

  ### Example 1
  ```
  Input:  prices = [12, 9, 15, 11, 14]
  Output: true
  Explanation: 9 (day 1), then 15 (day 2), then 11 (day 3) gives 9 < 11 < 15
  ```

  ### Example 2
  ```
  Input:  prices = [3, 5, 7, 9]
  Output: false
  Explanation: the price only rises, so no later price ever falls back below an earlier one
  ```

  ### Example 3
  ```
  Input:  prices = [4, 7, 4, 7, 4]
  Output: false
  Explanation: every fall returns exactly to 4, which is not strictly above the dip
  ```

  ### Constraints
  - `1 <= prices.length <= 2 * 10^5`
  - `-10^9 <= prices[i] <= 10^9`

  **Follow-up:** checking every triple is `O(n^3)` and fixing the middle day is `O(n^2)`. Can you
  decide in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: has_dip_spike_retrace
  params:
    - {name: prices, type: "int[]"}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def has_dip_spike_retrace(prices: list[int]) -> bool:
        # Scan from the right. `spikes` holds candidate spike values (decreasing from bottom to top);
        # `retrace` is the largest value already known to sit to the right of a strictly larger spike.
        spikes: list[int] = []
        retrace = None
        for price in reversed(prices):
            if retrace is not None and price < retrace:
                return True  # price is the dip
            while spikes and spikes[-1] < price:
                retrace = spikes.pop()  # price can act as the spike for this smaller later value
            spikes.append(price)
        return False
  javascript: |
    function hasDipSpikeRetrace(prices) {
      const n = prices.length;
      const minBefore = new Array(n); // smallest price on days 0..j (the best dip for spike j)
      let lowest = Infinity;
      for (let j = 0; j < n; j++) {
        lowest = Math.min(lowest, prices[j]);
        minBefore[j] = lowest;
      }
      const later = []; // prices to the right of j, kept increasing from top to bottom
      for (let j = n - 1; j >= 0; j--) {
        if (prices[j] > minBefore[j]) {
          while (later.length > 0 && later[later.length - 1] <= minBefore[j]) later.pop();
          if (later.length > 0 && later[later.length - 1] < prices[j]) return true;
          later.push(prices[j]);
        }
      }
      return false;
    }
