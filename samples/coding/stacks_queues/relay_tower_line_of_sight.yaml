expected_concepts:
  - "monotonic stack scanned from the east"
  - "counting popped shorter towers as visible"
  - "first taller tower is also visible"
  - "each tower pushed and popped at most once"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Derives the right-to-left monotonic stack, explains that popped shorter towers are visible and the first taller one remaining is visible too, and proves O(n) from each tower being pushed and popped once."
  good: "Correct monotonic stack solution, possibly after a hint about scan direction, with an off-by-one on the taller tower fixed during testing."
  weak: "Only a quadratic scan tracking the running maximum between towers, or miscounts by forgetting the first taller tower or counting hidden ones."
  criteria:
    correctness: "All tests pass, including increasing, decreasing and zigzag heights."
    efficiency: "Linear time with a monotonic stack instead of an O(n^2) pairwise scan."
    code_quality: "Single loop with a clear pop-and-count step and a separate check for the taller tower."
    edge_cases: "Empty input, a single tower and the last tower always seeing zero."
    communication: "Explains why a tower hidden from one viewer stays hidden from every viewer further west that is shorter."
hints:
  - "For a fixed viewer, towers to the east stay visible only until one at least as tall as the viewer appears; after that everything is blocked."
  - "Scan from east to west keeping a stack of towers that could still be seen by someone further west; heights in it increase from top to bottom."
  - "For each tower from east to west, pop every shorter tower from the stack and count each one as visible; if a taller tower is left on top it is visible too, so add one more. Then push the current tower. Each tower is pushed and popped at most once."
followups:
  - "How would you also count towers visible to the west of each tower?"
  - "What changes if heights may repeat and an equal tower blocks the view?"
  - "How would you return the list of visible tower indices for one chosen tower efficiently?"
  - "How would you handle towers being added at the east end one at a time?"
common_errors:
  - "Forgetting to count the first taller tower that remains on the stack."
  - "Scanning from west to east and getting the visibility condition backwards."
  - "Counting towers hidden behind a taller intermediate tower."
  - "Falling back to an O(n^2) scan that times out on large inputs."
