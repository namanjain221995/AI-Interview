title: "Relay Tower Line of Sight"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [network, general, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Relay Tower Line of Sight

  Radio relay towers stand in a row along a ridge, listed from west to east in `heights`, and no two
  towers have the same height. Tower `i` has a direct line of sight to a tower `j` further east
  (`j > i`) when every tower strictly between them is **shorter than both** tower `i` and tower `j`.
  Neighbouring towers always see each other.

  Return an array of the same length where element `i` is the number of towers east of tower `i` that
  tower `i` can see. Return an empty array when there are no towers.

  ### Example 1
  ```
  Input:  heights = [10, 6, 8, 5, 11, 9]
  Output: [3, 1, 2, 1, 1, 0]
  Explanation: tower 10 sees 6, 8 and 11 (5 is hidden by 8, 9 by 11); tower 6 sees only 8; tower 8 sees 5 and 11
  ```

  ### Example 2
  ```
  Input:  heights = [3, 1, 2]
  Output: [2, 1, 0]
  Explanation: tower 3 sees 1 and 2 because 1 is shorter than both; tower 1 sees 2
  ```

  ### Constraints
  - `0 <= heights.length <= 10^5`
  - `1 <= heights[i] <= 10^9`
  - All heights are distinct
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: visible_towers_to_right
  params:
    - {name: heights, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def visible_towers_to_right(heights: list[int]) -> list[int]:
        result = [0] * len(heights)
        stack: list[int] = []
        for i in range(len(heights) - 1, -1, -1):
            seen = 0
            while stack and stack[-1] < heights[i]:
                stack.pop()
                seen += 1
            if stack:
                seen += 1
            result[i] = seen
            stack.append(heights[i])
        return result
  javascript: |
    function visibleTowersToRight(heights) {
      const result = new Array(heights.length).fill(0);
      const stack = [];
      for (let i = heights.length - 1; i >= 0; i--) {
        let seen = 0;
        while (stack.length > 0 && stack[stack.length - 1] < heights[i]) {
          stack.pop();
          seen++;
        }
        if (stack.length > 0) seen++;
        result[i] = seen;
        stack.push(heights[i]);
      }
      return result;
    }
