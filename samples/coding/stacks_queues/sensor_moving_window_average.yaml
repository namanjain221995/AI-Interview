slug: sensor_moving_window_average
title: Sensor Moving Window Average
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [data, data_scientist, ml, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Sensor Moving Window Average

  A factory dashboard plots a vibration sensor as a smoothed line. Each time a new reading arrives, the
  dashboard shows the average of the **most recent `k` readings**. Near the start of the stream fewer than
  `k` readings exist, so the average uses all readings seen so far.

  Given the integer `readings` in arrival order and the window size `k`, return a list of the same length
  where position `i` holds the average of the last `min(k, i + 1)` readings ending at position `i`.

  Answers are compared with a tolerance of `1e-6` (relative to the size of the value), so ordinary
  floating-point rounding is fine.

  ### Example 1
  ```
  Input:  readings = [4, 8, 6, 2, 10], k = 2
  Output: [4.0, 6.0, 7.0, 4.0, 6.0]
  Explanation: the first value only has one reading; afterwards each value averages the current and previous reading
  ```

  ### Example 2
  ```
  Input:  readings = [10, 20, 30, 40, 50, 60], k = 4
  Output: [10.0, 15.0, 20.0, 25.0, 35.0, 45.0]
  Explanation: the first three values average 1, 2 and 3 readings; from position 3 on, exactly 4 readings are averaged
  ```

  ### Example 3
  ```
  Input:  readings = [5, -3], k = 5
  Output: [5.0, 1.0]
  ```

  ### Constraints
  - `0 <= readings.length <= 10^5` (an empty stream returns an empty list)
  - `-10^6 <= readings[i] <= 10^6`
  - `1 <= k <= 10^5`

  **Follow-up:** recomputing every window from scratch costs `O(n * k)`; aim for `O(n)` time and
  `O(k)` extra space.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: moving_window_averages
  params:
    - {name: readings, type: "int[]"}
    - {name: k, type: int}
  return_type: "float[]"
  comparison: float_tolerance
  tolerance: 1e-06
reference_solutions:
  python: |
    from collections import deque


    def moving_window_averages(readings: list[int], k: int) -> list[float]:
        window: deque[int] = deque()
        total = 0
        averages: list[float] = []
        for value in readings:
            window.append(value)
            total += value
            if len(window) > k:
                total -= window.popleft()
            averages.append(total / len(window))
        return averages
  javascript: |
    function movingWindowAverages(readings, k) {
      // A ring of the last k readings; head is the oldest reading once the ring is full.
      const ring = new Array(Math.min(k, readings.length)).fill(0);
      let head = 0;
      let count = 0;
      let total = 0;
      const averages = [];
      for (const value of readings) {
        if (count === k) {
          total -= ring[head];
          ring[head] = value;
          head = (head + 1) % k;
        } else {
          ring[count] = value;
          count += 1;
        }
        total += value;
        averages.push(total / count);
      }
      return averages;
    }
