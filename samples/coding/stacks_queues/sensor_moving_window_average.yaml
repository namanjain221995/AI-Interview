expected_concepts:
  - queue (or ring buffer) holding the last k readings
  - running sum updated as readings enter and leave the window
  - divide by the current window size, not by k, during warm-up
  - floating-point division instead of integer division
optimal_complexity: {time: O(n), space: O(k)}
rubric:
  excellent: "Maintains a queue or ring buffer with a running sum, handles the warm-up phase by dividing by the current window size, uses floating-point division and explains O(n) time and O(k) space."
  good: "Correct running-sum solution with minor prompting, for example to fix the divisor during warm-up or to avoid keeping the whole history."
  weak: "Recomputes each window from scratch without discussing the cost, divides by k during warm-up, or uses integer division."
  criteria:
    correctness: "All tests pass within tolerance, including k larger than the stream, k = 1 and an empty stream."
    efficiency: "Linear time; each reading is added to and removed from the sum once."
    code_quality: "Clear separation of the window state (queue, sum) from the output list."
    edge_cases: "Empty input, k = 1, k at least the stream length and negative readings."
    communication: "Explains why the running sum stays correct as readings leave the window."
hints:
  - "When a new reading arrives, how does the new window differ from the previous one?"
  - "Keep the readings that are currently in the window in arrival order together with their sum, so each new reading needs only a small update rather than a full recount."
  - "Append each reading to a queue and add it to a running sum; if the queue now holds more than k readings, remove the oldest from the front and subtract it; the average is the running sum divided by the queue length, using floating-point division."
followups:
  - "How would you turn this into a class that receives readings one at a time?"
  - "How would you also report the window minimum or maximum in O(1) amortised time?"
  - "What precision issues appear if the stream runs for months with a floating-point running sum?"
common_errors:
  - "Dividing by k before the first k readings have arrived."
  - "Using integer division and losing the fractional part."
  - "Rebuilding the window sum on every reading, giving O(n * k) time."
  - "Keeping the entire history in memory instead of only the last k readings."
