title: Nested Transaction Key-Value Store
difficulty: medium
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [backend, dba, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Nested Transaction Key-Value Store

  You are building the in-memory settings store behind an internal admin console. Operators send
  commands one at a time, and changes can be grouped into **nested transactions** that are kept or
  thrown away as a unit. Simulate the store and collect its responses.

  | Command | Effect | Output |
  |---------|--------|--------|
  | `"SET <key> <value>"` | Sets `key` to `value` (overwriting any old value). | none |
  | `"GET <key>"` | Reads the current value of `key`. | the value, or `"NULL"` if the key is not set |
  | `"DELETE <key>"` | Removes `key`; deleting a key that is not set does nothing. | none |
  | `"BEGIN"` | Opens a new transaction inside the current one (if any). | none |
  | `"ROLLBACK"` | Discards every change made inside the innermost open transaction and closes it. | `"NO TRANSACTION"` if none is open |
  | `"COMMIT"` | Closes the innermost open transaction and keeps its changes: they become part of the enclosing transaction (which can still roll them back) or, if it was the outermost one, they are written to the permanent store. | `"NO TRANSACTION"` if none is open |

  `GET` always sees the latest state, including changes made in transactions that are still open.
  Transactions left open at the end are simply never closed.

  Return the list of outputs in the order they were produced.

  ### Example 1
  ```
  Input:  commands = ["SET region eu", "BEGIN", "SET region us", "GET region", "ROLLBACK", "GET region", "COMMIT"]
  Output: ["us", "eu", "NO TRANSACTION"]
  ```

  ### Example 2
  ```
  Input:  commands = ["BEGIN", "SET a 1", "BEGIN", "DELETE a", "SET b 2", "COMMIT", "GET a", "GET b", "ROLLBACK", "GET b"]
  Output: ["NULL", "2", "NULL"]
  Explanation: the inner commit hands its changes to the outer transaction, so the outer rollback still discards both the delete and the new key b
  ```

  ### Example 3
  ```
  Input:  commands = ["BEGIN", "SET mode blue", "BEGIN", "SET mode green", "COMMIT", "COMMIT", "ROLLBACK", "GET mode"]
  Output: ["NO TRANSACTION", "green"]
  ```

  ### Constraints
  - `0 <= commands.length <= 10^4`
  - Commands are exactly in the forms above, with single spaces
  - Keys and values are `1` to `20` letters or digits
  - At most `10^3` transactions are open at the same time

  **Follow-up:** can you make `GET` run in constant time no matter how deeply transactions are nested?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: run_transactional_store
  params:
