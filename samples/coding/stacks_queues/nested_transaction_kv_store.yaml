expected_concepts:
  - stack of transactions, one entry per nesting level
  - undo log or change layer per transaction
  - distinguishing a deleted key from an untouched key (tombstone or None marker)
  - commit merges the inner transaction into its parent instead of the permanent store
  - error output for ROLLBACK or COMMIT without an open transaction
optimal_complexity: {time: "O(1) per SET, GET, DELETE and BEGIN; O(m) per COMMIT or ROLLBACK for m keys changed in that transaction", space: O(k + total logged changes)}
rubric:
  excellent: "Uses a stack of per-transaction undo logs (or change layers) with an explicit marker for deleted keys, merges an inner commit into its parent, keeps GET constant time and explains the cost of COMMIT and ROLLBACK."
  good: "Reaches a correct stack-based solution, perhaps with GET scanning layers top-down or copying the whole map at BEGIN, and fixes the delete-versus-unset case after a failing test."
  weak: "Writes inner commits straight to the permanent store, cannot undo a delete, or forgets the NO TRANSACTION outputs."
  criteria:
    correctness: "All tests pass, including nested commit followed by outer rollback and deletes inside transactions."
    efficiency: "No full copy of the store per BEGIN; work per command is proportional to the keys it touches."
    code_quality: "Command parsing separated from state changes, with a small helper that records the previous value of a key."
    edge_cases: "Empty command list, GET of a missing key, DELETE of a missing key, repeated COMMIT or ROLLBACK with nothing open, open transactions at the end."
    communication: "Explains why a deleted key needs its own marker and what COMMIT means for nested levels."
hints:
  - "Each BEGIN starts a level that must be undoable on its own; think about what a rollback needs to know to put every key back exactly as it was."
  - "Keep a stack with one record per open transaction. Either store the changes made at that level, or store the value each key had before the level first touched it, and remember that 'was not set' is a value you must record too."
  - "With an undo log per level: before the first change to a key in the innermost level, save its previous value or an unset marker. ROLLBACK restores the saved values and pops the level. COMMIT pops the level and copies into the parent only the keys the parent has not saved yet, because the parent's older saved value is the one to restore."
followups:
  - "How would you add a COUNT command that returns how many keys currently hold a given value, in constant time?"
  - "How would the design change if the store had to survive a process restart?"
  - "What would you change to support several clients, each with its own open transactions, on the same store?"
common_errors:
  - "Applying an inner COMMIT directly to the permanent store, so the outer ROLLBACK cannot undo it."
  - "Representing a deleted key as missing in the layer, so GET falls through to an older value."
  - "Overwriting the parent's saved value during COMMIT and restoring the wrong value on a later rollback."
  - "Forgetting the NO TRANSACTION output or emitting output for SET and DELETE."
