  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def run_transactional_store(commands: list[str]) -> list[str]:
        current: dict[str, str] = {}
        # One undo log per open transaction: key -> value before the transaction first touched it
        # (None means the key was not set).
        logs: list[dict[str, str | None]] = []
        out: list[str] = []

        def remember(key: str) -> None:
            if logs and key not in logs[-1]:
                logs[-1][key] = current.get(key)

        for command in commands:
            parts = command.split(" ")
            op = parts[0]
            if op == "SET":
                remember(parts[1])
                current[parts[1]] = parts[2]
            elif op == "GET":
                out.append(current.get(parts[1], "NULL"))
            elif op == "DELETE":
                if parts[1] in current:
                    remember(parts[1])
                    del current[parts[1]]
            elif op == "BEGIN":
                logs.append({})
            elif not logs:
                out.append("NO TRANSACTION")
            elif op == "ROLLBACK":
                for key, old in logs.pop().items():
                    if old is None:
                        current.pop(key, None)
                    else:
                        current[key] = old
            else:  # COMMIT
                child = logs.pop()
                if logs:
                    parent = logs[-1]
                    for key, old in child.items():
                        if key not in parent:
                            parent[key] = old
        return out
  javascript: |
    function runTransactionalStore(commands) {
      const current = new Map();
      const logs = []; // per open transaction: key -> value before first touch (undefined = unset)
      const out = [];
      const remember = (key) => {
        if (logs.length > 0 && !logs[logs.length - 1].has(key)) {
          logs[logs.length - 1].set(key, current.get(key));
        }
      };
      for (const command of commands) {
        const [op, key, value] = command.split(" ");
        if (op === "SET") {
          remember(key);
          current.set(key, value);
        } else if (op === "GET") {
          out.push(current.has(key) ? current.get(key) : "NULL");
        } else if (op === "DELETE") {
          if (current.has(key)) {
            remember(key);
            current.delete(key);
          }
        } else if (op === "BEGIN") {
          logs.push(new Map());
        } else if (logs.length === 0) {
          out.push("NO TRANSACTION");
        } else if (op === "ROLLBACK") {
          for (const [k, old] of logs.pop()) {
            if (old === undefined) current.delete(k);
            else current.set(k, old);
          }
        } else {
          const child = logs.pop();
          if (logs.length > 0) {
            const parent = logs[logs.length - 1];
            for (const [k, old] of child) if (!parent.has(k)) parent.set(k, old);
          }
        }
      }
      return out;
    }
