title: "Round-Robin Job Completion Order"
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, platform, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Round-Robin Job Completion Order

  A shared batch runner executes one job at a time with a simple fairness policy. Jobs `0, 1, ..., n-1` are
  placed in a queue in id order; `durations[i]` is the number of time units job `i` needs in total.

  Each turn, the runner takes the job at the front of the queue and runs it for `min(quantum, remaining)`
  units. If the job still has work left, it goes to the **back** of the queue; otherwise it is finished and
  leaves the queue. The runner stops when the queue is empty.

  Write `round_robin_completion_order(durations, quantum)` that returns the job ids in the order in which
  they finish. Return an empty list when there are no jobs.

  ### Example 1
  ```
  Input:  durations = [5, 2, 8, 3], quantum = 3
  Output: [1, 3, 0, 2]
  Explanation: Jobs 1 and 3 finish in their first turn, job 0 in its second, job 2 in its third.
  ```

  ### Example 2
  ```
  Input:  durations = [4, 4, 4], quantum = 4
  Output: [0, 1, 2]
  Explanation: Every job fits in one turn, so they finish in queue order.
  ```

  ### Example 3
  ```
  Input:  durations = [7, 1, 7, 1], quantum = 2
  Output: [1, 3, 0, 2]
  ```

  ### Constraints
  - `0 <= durations.length <= 1000`
  - `1 <= durations[i] <= 10^4`
  - `1 <= quantum <= 10^4`

  **Follow-up:** if durations could be as large as `10^9`, simulating every turn would be too slow. Can you find the order without simulating?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: round_robin_completion_order
  params:
    - {name: durations, type: "int[]"}
    - {name: quantum, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def round_robin_completion_order(durations: list[int], quantum: int) -> list[int]:
        queue = deque((job, units) for job, units in enumerate(durations))
        finished: list[int] = []
        while queue:
            job, remaining = queue.popleft()
            remaining -= min(quantum, remaining)
            if remaining == 0:
                finished.append(job)
            else:
                queue.append((job, remaining))
        return finished
  javascript: |
    function roundRobinCompletionOrder(durations, quantum) {
      // Relative queue order never changes, so a job finishes in round ceil(d / quantum),
      // and jobs finishing in the same round finish in id order.
      const ids = durations.map((_, i) => i);
      const rounds = durations.map((d) => Math.ceil(d / quantum));
      ids.sort((a, b) => rounds[a] - rounds[b] || a - b);
      return ids;
    }
