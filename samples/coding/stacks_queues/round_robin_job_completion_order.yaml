expected_concepts:
  - "FIFO queue simulation"
  - "re-enqueueing unfinished work at the back"
  - "observing that relative queue order never changes"
  - "finish round equals ceil(duration / quantum), ties by id"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Simulates correctly with a queue, then observes that relative order is preserved so each job finishes in round ceil(d / quantum) with ties broken by id, giving an O(n log n) (or O(n + rounds) bucketed) solution independent of the durations."
  good: "Correct queue simulation with O(total turns) cost and a clear explanation of that cost."
  weak: "Re-sorts or rebuilds the queue every turn, loses track of remaining work, or returns jobs in start order."
  criteria:
    correctness: "All tests pass, including quantum larger than durations and exact multiples."
    efficiency: "Simulation proportional to total turns, or the sort-by-rounds insight for large durations."
    code_quality: "Queue entries carry the job id with its remaining work; no index juggling on a shrinking list."
    edge_cases: "Empty input, single job, quantum 1, ties within a round."
    communication: "Explains why jobs never overtake each other in the queue."
hints:
  - "Try simulating the first example by hand with a line of jobs; what happens to a job that is not yet done?"
  - "A first-in-first-out queue of (job id, remaining units) pairs mirrors the runner exactly; pop from the front and push unfinished jobs to the back."
  - "Each turn subtract the smaller of the quantum and the remaining work, record the id when it reaches zero, otherwise re-queue it; for very long jobs notice that jobs never overtake each other, so a job finishes in round ceil of duration over quantum and ties go by id."
followups:
  - "How would you report the time at which each job finishes?"
  - "How would you add priorities so that urgent jobs get a larger quantum?"
  - "What changes if new jobs can arrive while the runner is working?"
common_errors:
  - "Running every job for a full quantum and finishing it only when remaining becomes negative, off by a turn."
  - "Pushing unfinished jobs to the front instead of the back."
  - "Removing from the front of an array-backed list in a loop, which is quadratic in many languages."
  - "Breaking ties within the same round by remaining work instead of queue order."
