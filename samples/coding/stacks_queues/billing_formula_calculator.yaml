slug: billing_formula_calculator
title: Billing Formula Calculator
difficulty: hard
competency_keys: [algorithms, data_structures, code_quality]
role_tags: [backend, fullstack, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Billing Formula Calculator

  Finance analysts write invoice adjustments in a small formula language, for example
  `(1200 - 3 * 150) / 4` to split a discounted licence fee across four cost centres, or `-(40 + 5) * 2`
  for a refund. Implement `evaluate_billing_formula(expression)`, which returns the integer value of a
  formula. Using a built-in `eval` or an expression library is not allowed.

  **Grammar**
  - Integer literals are written with digits only (leading zeros are allowed, `08` is `8`); the digits
    of a literal are never separated by spaces.
  - Binary operators: `+`, `-`, `*` and `/`. Parentheses `(` and `)` group sub-formulas.
  - A `-` is a **unary minus** (negation) when it is the first token, directly follows `(`, or directly
    follows another operator, including another unary minus (so `--3` is `3` and `2 * -3` is `-6`). It
    negates the literal or parenthesised group that follows. There is no unary plus.
  - Spaces may appear anywhere between tokens and are ignored.

  **Evaluation rules**
  - `*` and `/` bind tighter than `+` and `-`; operators of equal precedence are applied left to right,
    so `20 / 4 / 2` is `(20 / 4) / 2`.
  - `/` is integer division that **truncates toward zero**: `7 / 2` is `3` and `-7 / 2` is `-3`.

  The input is always a valid formula, never divides by zero, and every literal and intermediate result
  fits comfortably in a signed 64-bit integer (see Constraints).

  ### Example 1
  ```
  Input:  expression = "(1200 - 3 * 150) / 4"
  Output: 187
  Explanation: 3 * 150 = 450, 1200 - 450 = 750, and 750 / 4 = 187.5 truncates to 187
  ```

  ### Example 2
  ```
  Input:  expression = "-(40 + 5) * 2"
  Output: -90
  ```

  ### Example 3
  ```
  Input:  expression = " 7 - 9 / -2 * 3 "
  Output: 19
  Explanation: 9 / -2 = -4 (toward zero), -4 * 3 = -12, and 7 - (-12) = 19
  ```

  ### Constraints
  - `1 <= expression.length <= 10^4`
  - `expression` contains only digits, `+ - * / ( )` and spaces, and is a valid formula.
  - Parentheses nest at most `1000` levels deep.
  - Every literal and every intermediate value has absolute value at most `10^15`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: evaluate_billing_formula
  params:
    - {name: expression, type: string}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    PRECEDENCE = {"+": 1, "-": 1, "*": 2, "/": 2, "neg": 3}


    def _apply(values: list[int], op: str) -> None:
        if op == "neg":
            values.append(-values.pop())
            return
        right = values.pop()
        left = values.pop()
        if op == "+":
            values.append(left + right)
        elif op == "-":
            values.append(left - right)
        elif op == "*":
            values.append(left * right)
        else:
            quotient = abs(left) // abs(right)
            values.append(quotient if (left < 0) == (right < 0) else -quotient)


    def evaluate_billing_formula(expression: str) -> int:
        values: list[int] = []
        ops: list[str] = []
        expect_operand = True  # True at the start, after "(" and after any operator
        i, n = 0, len(expression)
        while i < n:
            ch = expression[i]
            if ch == " ":
                i += 1
            elif ch.isdigit():
                j = i
                while j < n and expression[j].isdigit():
                    j += 1
                values.append(int(expression[i:j]))
                expect_operand = False
                i = j
            elif ch == "(":
                ops.append(ch)
                expect_operand = True
                i += 1
            elif ch == ")":
                while ops[-1] != "(":
                    _apply(values, ops.pop())
                ops.pop()
                expect_operand = False
                i += 1
            elif ch == "-" and expect_operand:
                ops.append("neg")  # prefix operator: nothing to reduce yet
                i += 1
            else:
                while ops and ops[-1] != "(" and PRECEDENCE[ops[-1]] >= PRECEDENCE[ch]:
                    _apply(values, ops.pop())
                ops.append(ch)
                expect_operand = True
                i += 1
        while ops:
            _apply(values, ops.pop())
        return values[0]
  javascript: |
    const PRECEDENCE = { "+": 1, "-": 1, "*": 2, "/": 2, neg: 3 };

    function applyOp(values, op) {
      if (op === "neg") {
        values.push(-values.pop());
        return;
      }
      const right = values.pop();
      const left = values.pop();
      if (op === "+") values.push(left + right);
      else if (op === "-") values.push(left - right);
      else if (op === "*") values.push(left * right);
      else values.push(left / right); // BigInt division truncates toward zero
    }

    function evaluateBillingFormula(expression) {
      const values = []; // BigInt operands keep every intermediate exact
      const ops = [];
      let expectOperand = true;
      let i = 0;
      const n = expression.length;
      while (i < n) {
        const ch = expression[i];
        if (ch === " ") {
          i++;
        } else if (ch >= "0" && ch <= "9") {
          let j = i;
          while (j < n && expression[j] >= "0" && expression[j] <= "9") j++;
          values.push(BigInt(expression.slice(i, j)));
          expectOperand = false;
          i = j;
        } else if (ch === "(") {
          ops.push(ch);
          expectOperand = true;
          i++;
        } else if (ch === ")") {
          while (ops[ops.length - 1] !== "(") applyOp(values, ops.pop());
          ops.pop();
          expectOperand = false;
          i++;
        } else if (ch === "-" && expectOperand) {
          ops.push("neg");
          i++;
        } else {
          while (
            ops.length > 0 &&
            ops[ops.length - 1] !== "(" &&
            PRECEDENCE[ops[ops.length - 1]] >= PRECEDENCE[ch]
          ) {
            applyOp(values, ops.pop());
          }
          ops.push(ch);
          expectOperand = true;
          i++;
        }
      }
      while (ops.length > 0) applyOp(values, ops.pop());
      return Number(values[0]);
    }
