expected_concepts:
  - tokenising multi-digit literals and skipping spaces
  - operator and operand stacks (shunting-yard) or recursive descent
  - precedence and left associativity
  - distinguishing unary from binary minus by the previous token
  - integer division truncating toward zero
  - 64-bit arithmetic
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Designs a clean tokenizer, chooses a two-stack evaluator or recursive descent and explains how precedence, left associativity, parentheses and unary minus are handled; implements truncating division correctly for negative operands, uses 64-bit arithmetic and tests tricky inputs such as 2 * -3 and --3."
  good: "Produces a working evaluator for precedence and parentheses with some prompting, but needs a hint for unary minus detection or for truncation of negative quotients."
  weak: "Evaluates strictly left to right, calls eval, uses floor division for negative results, or cannot handle nested parentheses."
  criteria:
    correctness: "All tests pass, including unary minus in every allowed position, nested groups and negative division."
    efficiency: "Single linear scan; each token is pushed and popped a constant number of times."
    code_quality: "Tokenising, precedence and operator application are separated into small, readable pieces."
    edge_cases: "Single literal, leading zeros, deep nesting, repeated unary minus, spaces everywhere and values near 10^15."
    communication: "Explains the rule for telling unary from binary minus and why truncation differs from floor division."
hints:
  - "Split the work in two: first recognise tokens (multi-digit numbers, operators, parentheses), then think about how precedence decides which operator may be applied first."
  - "A minus is unary exactly when no operand has just been completed, which you can track with one flag; keep pending operators on a stack and apply an operator only when a later operator of lower or equal precedence, a closing parenthesis or the end of input arrives."
  - "Use a value stack and an operator stack: push numbers, push '(' and unary negation directly, on ')' apply operators until the matching '(', and before pushing a binary operator apply every stacked operator of greater or equal precedence; implement division with absolute values and fix the sign so it truncates toward zero."
followups:
  - "How would you add a unary plus or an exponent operator that is right-associative?"
  - "How would you report the position of a syntax error instead of assuming valid input?"
  - "How would you support variables such as seats or unit_price looked up from a map?"
  - "Why might a billing system prefer decimal fixed-point arithmetic over integers or floats?"
common_errors:
  - "Using floor division, which gives -4 instead of -3 for -7 / 2."
  - "Treating every minus as binary, which breaks -(40 + 5) and 2 * -3."
  - "Applying operators strictly left to right, ignoring that * and / bind tighter."
  - "Reading only one digit per literal or failing on spaces inside the formula."
  - "Popping operators of equal precedence too late, which makes subtraction or division right-associative."
