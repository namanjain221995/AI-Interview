prompt_markdown: |
  ## Total Pipeline Bottleneck Cost

  A data pipeline is a chain of stages; `throughputs[i]` is how many records per second stage `i` can
  process. A capacity planner can carve out **any contiguous range of stages** `i..j` (with
  `i <= j`) and run it as its own job. Such a job is limited by its slowest stage, so its effective
  throughput is the **minimum** of `throughputs[i..j]`.

  To compare pipeline designs, the planner adds up the effective throughput of **every** contiguous
  range of stages (each range counted once). Return that total.

  ### Example 1
  ```
  Input:  throughputs = [3, 1, 2]
  Output: 9
  Explanation: The ranges [3], [1], [2], [3, 1], [1, 2] and [3, 1, 2] have minimums
  3, 1, 2, 1, 1 and 1.
  ```

  ### Example 2
  ```
  Input:  throughputs = [4, 2, 2, 5]
  Output: 25
  Explanation: Single stages give 4 + 2 + 2 + 5 = 13. Every longer range contains a 2, and there
  are 6 of them, adding 12. Note that the two equal bottlenecks must not be counted twice.
  ```

  ### Constraints
  - `1 <= throughputs.length <= 3 * 10^4`
  - `0 <= throughputs[i] <= 10^6`
  - The answer fits in a signed 64-bit integer (and below `2^53`).

  **Follow-up:** the brute force over all ranges is `O(n^2)`; can you find the total in `O(n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: sum_of_window_bottlenecks
  params:
    - {name: throughputs, type: "int[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def sum_of_window_bottlenecks(throughputs: list[int]) -> int:
        n = len(throughputs)
        # left[i]: number of start positions for which throughputs[i] is the chosen minimum
        # (previous element strictly smaller stops it); right[i]: end positions (next element
        # smaller or equal stops it). The asymmetry assigns each range to exactly one stage.
        left = [0] * n
        right = [0] * n
        stack: list[int] = []
        for i in range(n):
            while stack and throughputs[stack[-1]] >= throughputs[i]:
                stack.pop()
            left[i] = i - stack[-1] if stack else i + 1
            stack.append(i)
        stack.clear()
        for i in range(n - 1, -1, -1):
            while stack and throughputs[stack[-1]] > throughputs[i]:
                stack.pop()
            right[i] = stack[-1] - i if stack else n - i
            stack.append(i)
        return sum(throughputs[i] * left[i] * right[i] for i in range(n))
  javascript: |
    function sumOfWindowBottlenecks(throughputs) {
      const n = throughputs.length;
      const left = new Array(n);
      const right = new Array(n);
      let stack = [];
      for (let i = 0; i < n; i++) {
        while (stack.length && throughputs[stack[stack.length - 1]] >= throughputs[i]) stack.pop();
        left[i] = stack.length ? i - stack[stack.length - 1] : i + 1;
        stack.push(i);
      }
      stack = [];
      for (let i = n - 1; i >= 0; i--) {
        while (stack.length && throughputs[stack[stack.length - 1]] > throughputs[i]) stack.pop();
        right[i] = stack.length ? stack[stack.length - 1] - i : n - i;
        stack.push(i);
      }
      let total = 0;
      for (let i = 0; i < n; i++) total += throughputs[i] * left[i] * right[i];
      return total;
    }
