expected_concepts:
  - "contribution technique - count ranges where each element is the minimum"
  - "monotonic stack for previous smaller and next smaller boundaries"
  - "strict versus non-strict comparison to break ties exactly once"
  - "64-bit accumulation"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Reframes the sum as each stage's value times the number of ranges where it is the bottleneck, finds both boundaries with monotonic stacks, breaks ties with one strict and one non-strict comparison and explains why every range is counted exactly once, using 64-bit arithmetic."
  good: "Reaches the contribution idea and monotonic stacks but needs a test run to fix the tie handling or the overflow."
  weak: "Stays with the O(n^2) or O(n^3) enumeration of ranges, or double-counts ranges whose minimum appears more than once."
  criteria:
    correctness: "All tests pass, including all-equal input and zero throughputs."
    efficiency: "Linear time with one or two stack passes; no per-range work."
    code_quality: "Boundary arrays and the final sum are clearly named; the tie-breaking rule is commented."
    edge_cases: "Equal values, single stage, monotone inputs and totals that exceed 32-bit integers."
    communication: "Explains the left-times-right counting argument and why the comparisons must differ on the two sides."
hints:
  - "Instead of looking at each range and finding its minimum, flip the question: for one particular stage, in how many ranges is it the bottleneck?"
  - "A stage is the bottleneck of every range that starts after the nearest smaller stage on its left and ends before the nearest smaller stage on its right; a stack can find those nearest smaller neighbours for all stages in one pass each."
  - "Use a monotonic stack to find, for each stage, how far its range can extend left and right, multiply the two counts by its throughput and add everything up in 64-bit; when equal values occur, treat the boundary as strictly smaller on one side and smaller-or-equal on the other so each range is assigned to exactly one of the tied stages."
followups:
  - "How would you compute the sum of the range maximums, or the sum of maximum minus minimum over all ranges?"
  - "What if the answer had to be reported modulo 10^9 + 7?"
  - "How would you support appending a new stage at the end and updating the total quickly?"
common_errors:
  - "Using strict comparisons on both sides, which counts ranges with repeated minimums more than once."
  - "Using non-strict comparisons on both sides, which drops those ranges entirely."
  - "Accumulating in a 32-bit integer and overflowing on large inputs."
  - "Enumerating every range explicitly, which is quadratic."
