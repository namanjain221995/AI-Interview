version: 1
slug: evaluate_postfix_alert_rule
title: Evaluate Postfix Alert Rule
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, sre, devops]
time_limit_minutes: 15
prompt_markdown: |
  ## Evaluate Postfix Alert Rule

  An alerting engine lets operators write threshold formulas such as `(errors - retries) / 4`. Before the
  formulas are stored, a compiler turns them into **postfix** (reverse Polish) token lists, where every
  operator comes after its two operands: `(200 - 3) / 4` becomes `["200", "3", "-", "4", "/"]`.

  Given such a token list, evaluate it and return the integer result.

  - Each token is either an integer written in decimal (it may start with `-`, for example `"-7"`) or one
    of the operators `"+"`, `"-"`, `"*"`, `"/"`.
  - An operator applies to the two most recent values, with the earlier one on the left: `["9", "4", "-"]`
    means `9 - 4`.
  - Division is integer division that **truncates toward zero**: `7 / 2 = 3` and `-7 / 2 = -3`.
  - The token list is always a valid postfix expression, and no division by zero ever happens.

  ### Example 1
  ```
  Input:  tokens = ["200", "3", "-", "4", "/"]
  Output: 49
  Explanation: 200 - 3 = 197, then 197 / 4 = 49.25, truncated to 49
  ```

  ### Example 2
  ```
  Input:  tokens = ["-7", "2", "/", "10", "*", "5", "+"]
  Output: -25
  Explanation: -7 / 2 = -3 (toward zero), -3 * 10 = -30, -30 + 5 = -25
  ```

  ### Example 3
  ```
  Input:  tokens = ["60000", "60000", "*"]
  Output: 3600000000
  Explanation: the result does not fit in a 32-bit integer
  ```

  ### Constraints
  - `1 <= tokens.length <= 10^4`
  - Every number token is an integer in `[-10^6, 10^6]`.
  - The absolute value of every intermediate result and of the final result is at most `10^15`.
  - The expression is valid and never divides by zero.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: evaluate_postfix_rule
  params:
    - {name: tokens, type: "string[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def evaluate_postfix_rule(tokens: list[str]) -> int:
        stack: list[int] = []
        for token in tokens:
            if token in ("+", "-", "*", "/"):
                right = stack.pop()
                left = stack.pop()
                if token == "+":
                    stack.append(left + right)
                elif token == "-":
                    stack.append(left - right)
                elif token == "*":
                    stack.append(left * right)
                else:
                    quotient = abs(left) // abs(right)  # truncate toward zero, not floor
                    stack.append(-quotient if (left < 0) != (right < 0) else quotient)
            else:
                stack.append(int(token))
        return stack[-1]
  javascript: |
    function evaluatePostfixRule(tokens) {
      const stack = [];
      for (const token of tokens) {
        if (token === "+" || token === "-" || token === "*" || token === "/") {
          const right = stack.pop();
          const left = stack.pop();
          if (token === "+") stack.push(left + right);
          else if (token === "-") stack.push(left - right);
          else if (token === "*") stack.push(left * right);
          else stack.push(Math.trunc(left / right) + 0); // "+ 0" turns -0 into 0
        } else {
          stack.push(Number(token));
        }
      }
      return stack[stack.length - 1];
    }
