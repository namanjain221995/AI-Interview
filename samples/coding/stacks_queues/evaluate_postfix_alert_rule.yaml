expected_concepts:
  - stack of intermediate values
  - pop right operand first, then left operand
  - integer division truncating toward zero rather than flooring
  - 64-bit arithmetic for large intermediate results
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Uses a value stack in a single pass, pops operands in the correct order, implements truncation toward zero explicitly in the chosen language and explains why 64-bit integers are needed."
  good: "Correct stack evaluation with a small slip, such as floor division for negatives, that is found and fixed when testing negative examples."
  weak: "Swaps operand order for subtraction or division, uses floating-point results, or tries to rebuild an infix string instead of evaluating."
  criteria:
    correctness: "All tests pass, including negative division, single-number expressions and large products."
    efficiency: "One pass over the tokens with O(1) work per token."
    code_quality: "Clear operator dispatch and a helper or comment that makes the truncation rule obvious."
    edge_cases: "Negative number tokens versus the minus operator, quotients that truncate to zero and 64-bit intermediates."
    communication: "Explains why the stack top is the right operand and how truncation differs from floor division."
hints:
  - "Read the tokens left to right; when you meet an operator, which values does it need and where were they most recently seen?"
  - "Keep a stack of numbers: push each number, and for an operator remove the top two values, combine them and push the result back."
  - "Pop the right operand first and the left operand second, apply the operator as left op right, and for division compute the quotient of the absolute values and make it negative when exactly one operand is negative; at the end the single value left on the stack is the answer."
followups:
  - "How would you detect and report an invalid expression, such as too few operands or leftover values?"
  - "How would you add a unary operator such as abs, or a function with three arguments?"
  - "How would you convert an infix alert formula with parentheses into this postfix form?"
common_errors:
  - "Popping operands in the wrong order, so subtraction and division are reversed."
  - "Using floor division, which gives -4 instead of -3 for -7 / 2."
  - "Treating a token like \"-7\" as the minus operator because it starts with a minus sign."
  - "Using 32-bit integers, which overflow on large products."
