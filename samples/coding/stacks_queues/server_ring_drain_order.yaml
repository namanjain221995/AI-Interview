role_tags: [general, sre, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Server Ring Drain Order

  An SRE team performs a rolling drain of a cluster whose servers are labelled `1` to `n` and arranged in a
  ring (after server `n` comes server `1`). To spread the impact across racks, the drain controller counts
  active servers around the ring:

  - counting starts at server `1`, which is count `1`;
  - the server reached at count `k` is drained and leaves the ring;
  - counting restarts at `1` from the next active server after the drained one, skipping drained servers.

  This repeats until every server has been drained. Write `server_drain_order(n, k)` that returns the
  server labels in the order in which they are drained.

  ### Example 1
  ```
  Input:  n = 5, k = 2
  Output: [2, 4, 1, 5, 3]
  Explanation: Counting by twos drains 2 and 4, then wraps around to drain 1, then 5, and finally 3.
  ```

  ### Example 2
  ```
  Input:  n = 4, k = 1
  Output: [1, 2, 3, 4]
  Explanation: With k = 1 every server is drained as soon as it is counted.
  ```

  ### Example 3
  ```
  Input:  n = 4, k = 6
  Output: [2, 1, 4, 3]
  Explanation: k may be larger than the number of active servers; the count keeps wrapping around.
  ```

  ### Constraints
  - `1 <= n <= 1000`
  - `1 <= k <= 10^9`

  **Follow-up:** if you only needed the label of the last server drained, can you compute it in `O(n)` time and `O(1)` space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: server_drain_order
  params:
    - {name: n, type: "int"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def server_drain_order(n: int, k: int) -> list[int]:
        ring = list(range(1, n + 1))
        order: list[int] = []
        index = 0
        while ring:
            index = (index + k - 1) % len(ring)
            order.append(ring.pop(index))
        return order
  javascript: |
    function serverDrainOrder(n, k) {
      const ring = [];
      for (let s = 1; s <= n; s++) ring.push(s);
      const order = [];
      let index = 0;
      while (ring.length > 0) {
        index = (index + k - 1) % ring.length;
        order.push(ring.splice(index, 1)[0]);
      }
      return order;
    }
