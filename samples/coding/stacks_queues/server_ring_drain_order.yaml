expected_concepts:
  - "circular queue or ring simulation"
  - "modulo arithmetic to skip whole laps"
  - "removing an element and continuing from its successor"
  - "Josephus-style recurrence for the follow-up"
optimal_complexity: {time: "O(n^2)", space: "O(n)"}
rubric:
  excellent: "Simulates the ring with an index advanced by (k - 1) modulo the remaining size, so huge k costs nothing extra; states O(n^2) worst case from removals (or O(n log n) with an order-statistics tree) and knows the O(n) recurrence for the last survivor."
  good: "Correct queue-rotation simulation that is fine for small k, and fixes huge k with modulo after a prompt."
  weak: "Steps one server at a time for k up to 10^9, restarts counting at server 1 after every drain, or is off by one on the counting start."
  criteria:
    correctness: "All tests pass, including k larger than n and k equal to 1."
    efficiency: "Uses modulo so the cost does not depend on k."
    code_quality: "Clear index update with one modulo; no special-casing of wrap-around."
    edge_cases: "Single server, k = 1, k = n, k far larger than n."
    communication: "Explains why the index after a removal already points at the next server."
hints:
  - "Simulate the second example and then the first by hand; after a server is drained, where does the next count start?"
  - "Keep the active servers in order in a list or queue; counting k servers around a ring of size m is the same as counting k modulo m positions, so you never need more than one lap."
  - "Keep an index into the list of active servers; move it forward by k minus one modulo the current size, remove and record the server at that index, and leave the index in place because the following server has slid into that position."
followups:
  - "How would you speed up removals for n up to 10^6?"
  - "How would you compute only the last server drained?"
  - "What if each server had its own k, read from the server that was just drained?"
common_errors:
  - "Restarting the count at server 1 after every drain instead of at the next server."
  - "Advancing by k instead of k minus one, which is off by one."
  - "Stepping one server at a time when k is huge, which times out."
  - "Incrementing the index after removal and skipping the next server."
