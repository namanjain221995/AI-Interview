prompt_markdown: |
  ## JSON Bracket Nesting Depth

  A payload linter rejects request bodies that nest too deeply. Before the full parser runs, it makes a
  quick pass over the JSON-like `text` that only looks at square brackets `[ ]`, curly brackets `{ }`
  and double-quoted strings. Everything else (numbers, colons, commas, letters, parentheses, single
  quotes) is ignored, and the text does not have to be valid JSON otherwise.

  String rules:

  - Outside a string, a double quote `"` starts a string.
  - Inside a string, a backslash `\` escapes the next character, whatever it is: `\"` is a quote that
    does **not** end the string and `\\` is a backslash that does not escape what follows.
  - Inside a string, the next unescaped `"` ends the string. Brackets inside strings are ignored.
  - Outside strings, a backslash is an ordinary character.

  Return `-1` if any of these happen: a closing bracket does not match the most recently opened
  unclosed bracket (or there is none), a bracket is still open at the end, or the text ends inside a
  string. Otherwise return the **maximum nesting depth**: the largest number of brackets open at the
  same time, or `0` if the text has no brackets outside strings.

  The examples show the raw characters of `text` (in a test, `text` is an ordinary string argument).

  ### Example 1
  ```
  Input (raw text): {"order": [1, {"sku": "A]"}]}
  Output: 3
  Explanation: the object, the array and the inner object are open at the same time; the ] inside "A]" does not count
  ```

  ### Example 2
  ```
  Input (raw text): ["say \"hi\" {", []]
  Output: 2
  Explanation: the escaped quotes do not end the string, so its { is ignored; the empty array inside the outer array gives depth 2
  ```

  ### Example 3
  ```
  Input (raw text): {"ids": [1, 2}]
  Output: -1
  Explanation: } arrives while [ is the most recently opened bracket
  ```

  ### Constraints
  - `0 <= text.length <= 10^5`
  - `text` consists of printable ASCII characters
languages: [python, javascript, typescript, java, go, cpp]
