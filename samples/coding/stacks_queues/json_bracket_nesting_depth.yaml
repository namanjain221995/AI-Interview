reference_solutions:
  python: |
    def json_max_nesting_depth(text: str) -> int:
        openers = {"]": "[", "}": "{"}
        stack: list[str] = []
        deepest = 0
        in_string = False
        escaped = False
        for ch in text:
            if in_string:
                if escaped:
                    escaped = False
                elif ch == "\\":
                    escaped = True
                elif ch == '"':
                    in_string = False
                continue
            if ch == '"':
                in_string = True
            elif ch in "[{":
                stack.append(ch)
                deepest = max(deepest, len(stack))
            elif ch in "]}":
                if not stack or stack[-1] != openers[ch]:
                    return -1
                stack.pop()
        if in_string or stack:
            return -1
        return deepest
  javascript: |
    function jsonMaxNestingDepth(text) {
      const openers = { "]": "[", "}": "{" };
      const stack = [];
      let deepest = 0;
      let inString = false;
      let escaped = false;
      for (const ch of text) {
        if (inString) {
          if (escaped) escaped = false;
          else if (ch === "\\") escaped = true;
          else if (ch === '"') inString = false;
          continue;
        }
        if (ch === '"') {
          inString = true;
        } else if (ch === "[" || ch === "{") {
          stack.push(ch);
          deepest = Math.max(deepest, stack.length);
        } else if (ch === "]" || ch === "}") {
          if (stack.length === 0 || stack[stack.length - 1] !== openers[ch]) return -1;
          stack.pop();
        }
      }
      if (inString || stack.length > 0) return -1;
      return deepest;
    }
