expected_concepts:
  - "stack of open bracket kinds"
  - "string and escape state machine"
  - "maximum stack size as the depth"
  - "rejecting unterminated strings and unclosed brackets"
optimal_complexity: {time: "O(n)", space: "O(d) where d is the maximum depth"}
rubric:
  excellent: "Separates string scanning (in-string and escape flags) from bracket matching with a stack, records the maximum stack size, handles escaped backslashes before quotes correctly and rejects unterminated strings and unclosed brackets."
  good: "Correct stack-based matching and string skipping with a minor slip on escapes or the end-of-text checks, fixed after a hint."
  weak: "Counts brackets without checking their kinds or order, treats every backslash-quote pair as escaped (missing escaped backslashes), or ignores strings entirely."
  criteria:
    correctness: "All tests pass, including escaped backslashes, unterminated strings and mismatched kinds."
    efficiency: "Single linear pass with stack memory proportional to the depth."
    code_quality: "A small explicit state machine with clearly named flags instead of nested ad-hoc conditions."
    edge_cases: "Empty text, brackets only inside strings, closing before opening and deep nesting."
    communication: "Explains the escape rule and why a single counter is not enough to validate bracket kinds."
hints:
  - "Treat this as two jobs: knowing whether you are inside a string, and checking brackets only when you are not."
  - "Use a stack of open bracket kinds for the matching; its size is the current depth. For strings, a small state with an in-string flag and a just-saw-backslash flag is enough."
  - "Scan character by character. Inside a string, a backslash means the next character is skipped and an unescaped double quote ends the string. Outside, push opening brackets and record the largest stack size; on a closing bracket fail unless the top of the stack is the matching opener. At the end fail if the stack is not empty or a string is still open."
followups:
  - "How would you report the position of the first error instead of just -1?"
  - "How would you stop early once the depth exceeds a configured limit, and why does that matter for untrusted payloads?"
  - "Could you compute the depth with a counter alone if only one bracket kind existed? Why not with two?"
  - "How would you process a payload that arrives in chunks without holding it all in memory?"
common_errors:
  - "Treating a quote preceded by any backslash as escaped, which breaks strings ending in an escaped backslash."
  - "Using one counter for both bracket kinds, so mismatches like [} pass."
  - "Forgetting to fail when the text ends inside a string or with brackets still open."
  - "Counting brackets that appear inside strings."
