slug: markup_first_nesting_error
title: Markup First Nesting Error
difficulty: medium
competency_keys: [data_structures, algorithms, debugging]
role_tags: [frontend, fullstack, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Markup First Nesting Error

  A documentation build step renders pages written in a small markup language. When a page is badly
  nested, the build should point the author at the **first** place where things go wrong instead of
  failing with a vague message.

  A document is text mixed with tags. There are three kinds of tag, where `name` is 1 to 10 lowercase
  letters:

  - an opening tag `<name>`;
  - a closing tag `</name>`;
  - a self-closing tag `<name/>`, which opens and closes itself and never affects nesting.

  Every `<` in the document starts one of these tags, and `>` only appears as the end of a tag. All
  other characters are plain text and are ignored.

  Scan the document from left to right and return:

  1. the **start index** (the position of its `<`) of the first closing tag that does not close the
     innermost currently open tag - either because its name differs, or because no tag is open at all;
  2. otherwise, if some tags are still open at the end of the document, `len(doc)`;
  3. otherwise `-1` (the document is well nested).

  ### Example 1
  ```
  Input:  doc = "<doc><p>hi</p><br/></doc>"
  Output: -1
  ```

  ### Example 2
  ```
  Input:  doc = "<a><b>text</a></b>"
  Output: 10
  Explanation: "</a>" starts at index 10 while "<b>" is still the innermost open tag.
  ```

  ### Example 3
  ```
  Input:  doc = "<section><h/>intro"
  Output: 18
  Explanation: There is no bad closing tag, but <section> is never closed, so the answer is len(doc).
  ```

  ### Constraints
  - `0 <= doc.length <= 10^5`
  - Tag names are 1 to 10 lowercase ASCII letters.
  - Text characters are printable ASCII other than `<` and `>`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_markup_error_offset
  params:
    - {name: doc, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def first_markup_error_offset(doc: str) -> int:
        open_tags: list[str] = []
        i = 0
        while True:
            start = doc.find("<", i)
            if start < 0:
                break
            end = doc.index(">", start)
            inner = doc[start + 1:end]
            if inner.startswith("/"):
                if not open_tags or open_tags[-1] != inner[1:]:
                    return start
                open_tags.pop()
            elif not inner.endswith("/"):
                open_tags.append(inner)
            i = end + 1
        return len(doc) if open_tags else -1
  javascript: |
    function firstMarkupErrorOffset(doc) {
      const openTags = [];
      let i = 0;
      while (true) {
        const start = doc.indexOf("<", i);
        if (start < 0) break;
        const end = doc.indexOf(">", start);
        const inner = doc.slice(start + 1, end);
        if (inner.startsWith("/")) {
          if (!openTags.length || openTags[openTags.length - 1] !== inner.slice(1)) return start;
          openTags.pop();
        } else if (!inner.endsWith("/")) {
          openTags.push(inner);
        }
        i = end + 1;
      }
      return openTags.length ? doc.length : -1;
    }
tests:
