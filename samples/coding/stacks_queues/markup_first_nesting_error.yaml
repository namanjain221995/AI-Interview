expected_concepts:
  - "stack of open tag names"
  - "parsing tags by locating angle brackets"
  - "distinguishing opening, closing and self-closing tags"
  - "reporting the first error position versus end-of-input errors"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Scans tags in one pass, pushes opening names, ignores self-closing tags, compares each closing name with the top of the stack and returns its start index on mismatch or empty stack, then distinguishes unclosed tags (len(doc)) from a clean document (-1), explaining the precedence of the three outcomes."
  good: "Correct stack-based checker that needs a test run to fix self-closing tags, the empty-stack case or the return value for unclosed tags."
  weak: "Only counts opening versus closing tags, compares names ignoring order, or returns a boolean-style answer without the required offsets."
  criteria:
    correctness: "All tests pass, including empty input, text-only input and errors before unclosed tags."
    efficiency: "Linear time; each tag is parsed once and the stack holds at most the open tags."
    code_quality: "Tag classification is isolated in a small helper or clear branch; offsets are tracked without off-by-one errors."
    edge_cases: "Closing with nothing open, prefix-like names, self-closing tags and same-name nesting."
    communication: "Explains why the first mismatch is reported immediately while unclosed tags can only be detected at the end."
hints:
  - "Only the most recently opened tag that is still open can be closed next; which structure gives you that tag instantly?"
  - "Walk through the tags in order with a stack of open names: opening tags are pushed, self-closing tags are skipped, and each closing tag must match the top of the stack."
  - "Find each tag by locating its opening and closing angle brackets and classify it by a leading or trailing slash; on a closing tag, return the position of its opening bracket if the stack is empty or its top name differs, otherwise pop; after the last tag return the document length if the stack is not empty, or minus one if it is."
followups:
  - "How would you report every nesting error with a recovery strategy rather than only the first?"
  - "How would you support attributes such as <a href=x> and quoted values containing angle brackets?"
  - "How would you suggest an automatic fix, such as inserting the missing closing tag?"
common_errors:
  - "Treating self-closing tags as opening tags, so they appear unclosed at the end."
  - "Counting tags instead of matching names, so crossed tags look valid."
  - "Returning the index of the closing bracket or of the tag name instead of the opening angle bracket."
  - "Popping from an empty stack instead of reporting the stray closing tag."
