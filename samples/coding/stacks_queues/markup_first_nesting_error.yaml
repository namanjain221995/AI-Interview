  - {id: t2, args: ["<a><b>text</a></b>"], expected: 10, description: "Example 2 - crossed tags; error is the first wrong closing tag"}
  - {id: t3, args: ["<section><h/>intro"], expected: 18, description: "Example 3 - unclosed tag returns len(doc)"}
  - {id: t4, hidden: true, args: [""], expected: -1, description: "Empty document is well nested"}
  - {id: t5, hidden: true, args: ["plain text: 3/4 done, a=b"], expected: -1, description: "Text only, including / and = characters"}
  - {id: t6, hidden: true, args: ["</x>"], expected: 0, description: "Closing tag with nothing open at index 0"}
  - {id: t7, hidden: true, args: ["<a></a></a>"], expected: 7, description: "Extra closing tag after the document is balanced"}
  - {id: t8, hidden: true, args: ["<li><li></li>"], expected: 13, description: "Same name nested twice, one left open"}
  - {id: t9, hidden: true, args: ["<abcdefghij>x</abcdefghi>"], expected: 13, description: "Closing name is a prefix of the open name - still a mismatch"}
  - {id: t10, hidden: true, args: ["<p><q>x</p> <r>"], expected: 7, description: "Mismatch takes priority over tags left open at the end"}
