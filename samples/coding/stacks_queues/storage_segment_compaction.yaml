  - {id: t3, args: [[1, 2, 1]], expected: [1, 2, 1], description: "Example 3 - equal sizes that are never the two newest stay apart"}
  - {id: t4, hidden: true, args: [[]], expected: [], description: "Empty input returns an empty list"}
  - {id: t5, hidden: true, args: [[7]], expected: [7], description: "Single segment stays as is"}
  - {id: t6, hidden: true, args: [[16, 8, 4, 2, 1, 1]], expected: [32], description: "Last append cascades through every older segment"}
  - {id: t7, hidden: true, args: [[1, 2, 3, 4, 5]], expected: [1, 2, 3, 4, 5], description: "Strictly increasing sizes never merge"}
  - {id: t8, hidden: true, args: [[2, 2, 2]], expected: [4, 2], description: "Odd count of equal sizes leaves one unmerged segment on top"}
  - {id: t9, hidden: true, args: [[5, 3, 3, 5]], expected: [5, 6, 5], description: "Equal sizes separated by another segment do not merge directly"}
  - {id: t10, hidden: true, args: [[8, 1, 1, 2, 4, 3]], expected: [16, 3], description: "Repeated cascades into the oldest segment, then an unrelated append"}
