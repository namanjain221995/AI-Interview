expected_concepts:
  - "stack of segment sizes with changes only at the top"
  - "repeated merge loop after each push"
  - "amortised O(n) because every merge removes one segment"
  - "64-bit integers for merged sizes"
optimal_complexity: {time: "O(n) amortised", space: "O(n)"}
rubric:
  excellent: "Recognises that all activity happens at the newest end, uses a stack with a merge loop after every push, explains the amortised O(n) bound (each merge removes a segment) and uses 64-bit sizes."
  good: "Correct stack simulation with a merge loop; complexity explained loosely or the 64-bit concern raised only when prompted."
  weak: "Merges only once per append instead of looping, merges any equal pair anywhere in the list, or rescans the whole list after every append."
  criteria:
    correctness: "All tests pass, including cascades and equal sizes that are not adjacent at the top."
    efficiency: "Amortised linear time with a stack; no rescanning of the whole list per append."
    code_quality: "Short loop with a clear merge condition on the top two entries."
    edge_cases: "Empty input, a single segment, an odd number of equal sizes and values above 32 bits."
    communication: "Explains why each merge can trigger another and why the total work stays linear."
hints:
  - "Notice that appends and merges only ever touch the newest end of the list."
  - "Keep the segments in a stack; after pushing a new size, compare the top two entries repeatedly instead of rescanning the list."
  - "Push each size, then keep looping while the stack has at least two entries and the top two are equal: remove both and push one segment of double the size. The stack from bottom to top is the answer."
followups:
  - "Why is the total number of merges at most n - 1, and what does that say about the running time?"
  - "If every appended size is 1, what does the final list correspond to?"
  - "How would you change the rule to merge when the newest segment is at least as large as the previous one?"
  - "How would you report how many merges each append triggered?"
common_errors:
  - "Merging only once per append, which misses cascades such as [4, 2, 1, 1]."
  - "Merging equal segments anywhere in the list rather than only the two newest."
  - "Using 32-bit integers, which overflow on large merged sizes."
  - "Rebuilding or rescanning the whole list after each append, giving quadratic time."
