slug: storage_segment_compaction
title: "Storage Segment Compaction"
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [backend, platform, dba]
time_limit_minutes: 15
prompt_markdown: |
  ## Storage Segment Compaction

  A log-structured storage engine writes data as **segments**. Segments are appended one at a time, and
  the newest segment is always at the end of the list. Right after each append the engine runs a
  compaction step: **while** there are at least two segments and the **two newest** segments have the
  same size, it replaces those two with a single segment whose size is their sum (twice the size). The
  merged segment is now the newest one, so it may immediately merge again with the segment before it.

  Only the two newest segments are ever compared. Two equal segments that are never the two newest at
  the same moment do not merge.

  Given the segment sizes in append order, return the sizes of the segments that remain after the last
  append and its compaction, ordered from **oldest to newest**. Return an empty list when nothing was
  appended.

  ### Example 1
  ```
  Input:  sizes = [4, 2, 1, 1]
  Output: [8]
  Explanation: appending the second 1 gives [4, 2, 1, 1] -> [4, 2, 2] -> [4, 4] -> [8]
  ```

  ### Example 2
  ```
  Input:  sizes = [5, 3, 3, 6, 2]
  Output: [5, 12, 2]
  Explanation: [5, 3, 3] -> [5, 6]; appending 6 gives [5, 6, 6] -> [5, 12]; nothing matches the final 2
  ```

  ### Example 3
  ```
  Input:  sizes = [1, 2, 1]
  Output: [1, 2, 1]
  Explanation: the two 1s are never the two newest segments at the same time
  ```

  ### Constraints
  - `0 <= sizes.length <= 10^4`
  - `1 <= sizes[i] <= 10^11`
  - Merged sizes can exceed the 32-bit range: use 64-bit integers.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: compact_storage_segments
  params:
    - {name: sizes, type: "long[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def compact_storage_segments(sizes: list[int]) -> list[int]:
        stack: list[int] = []
        for size in sizes:
            stack.append(size)
            while len(stack) >= 2 and stack[-1] == stack[-2]:
                merged = stack.pop() * 2
                stack[-1] = merged
        return stack
  javascript: |
    function compactStorageSegments(sizes) {
      const stack = [];
      for (const size of sizes) {
        stack.push(size);
        while (stack.length >= 2 && stack[stack.length - 1] === stack[stack.length - 2]) {
          const merged = stack.pop() * 2;
          stack[stack.length - 1] = merged;
        }
      }
      return stack;
    }
