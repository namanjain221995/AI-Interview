  - {id: t2, args: ["rm -rf /tmp^ls -la~-l"], expected: "ls -l", description: "Example 2 - ^ clears the dangerous command; ~ erases -la but keeps the space before it"}
  - {id: t3, args: ["deploy staging  ~~prod"], expected: "prod", description: "Example 3 - The first ~ removes the two trailing spaces and staging; the second removes the space and deploy"}
  - {id: t4, hidden: true, args: [""], expected: "", description: "Empty recording"}
  - {id: t5, hidden: true, args: ["<<<~~^"], expected: "", description: "Only editing keys on an empty line"}
  - {id: t6, hidden: true, args: ["abc<<<<<d"], expected: "d", description: "More backspaces than typed characters, then new input"}
  - {id: t7, hidden: true, args: ["    ~"], expected: "", description: "Erase word on a line of only spaces empties it"}
  - {id: t8, hidden: true, args: ["  ls -l  "], expected: "  ls -l  ", description: "Leading and trailing spaces are part of the submitted line"}
  - {id: t9, hidden: true, args: ["make build^"], expected: "", description: "Clear line as the last key returns an empty line"}
  - {id: t10, hidden: true, args: ["tail -f app.log~~cat  x~y"], expected: "tail cat  y", description: "Consecutive erase-word keys and erase-word keeping the separating space"}
  - {id: t11, hidden: true, args: ["helm~<upgrade"], expected: "upgrade", description: "Backspace on the empty line left by erase word is a no-op"}
  - {id: t12, hidden: true, args: ["scale web-0 --replicas=0~~<<0^echo job1 ok  ~<xecho job2 ok  ~<xecho job3 ok  ~<xecho job4 ok  ~<xscale web-5 --replicas=5~~<<5^echo job6 ok  ~<xecho job7 ok  ~<xecho job8 ok  ~<xecho job9 ok  ~<xscale web-10 --replicas=3~~<<0^echo job11 ok  ~<xecho job12 ok  ~<xecho job13 ok  ~<xecho job14 ok  ~<xscale web-15 --replicas=1~~<<5^echo job16 ok  ~<xecho job17 ok  ~<xecho job18 ok  ~<xecho job19 ok  ~<xscale web-20 --replicas=6~~<<0^echo job21 ok  ~<xecho job22 ok  ~<xecho job23 ok  ~<xecho job24 ok  ~<xscale web-25 --replicas=4~~<<5^echo job26 ok  ~<xecho job27 ok  ~<xecho job28 ok  ~<xecho job29 ok  ~<xscale web-30 --replicas=2~~<<0^echo job31 ok  ~<xecho job32 ok  ~<xecho job33 ok  ~<xecho job34 ok  ~<xscale web-35 --replicas=0~~<<5^echo job36 ok  ~<xecho job37 ok  ~<xecho job38 ok  ~<xecho job39 ok  ~<xkubectl get pods  ~svc"], expected: "echo job36xecho job37xecho job38xecho job39xkubectl get svc", description: "Stress - about 800 keystrokes mixing all three editing keys"}
expected_concepts:
  - "stack (or string builder) of characters on the line"
  - "amortized analysis: each character is deleted at most once"
  - "word erase as two pop loops (trailing spaces, then the word)"
  - "careful no-op handling on an empty line"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Uses a stack or builder of characters, implements all three keys exactly as specified (including keeping the space before an erased word), explains the amortized O(n) bound and joins the result once at the end."
  good: "Correct stack-based replay with minor prompting on the erase-word rule or on empty-line no-ops."
  weak: "Rebuilds strings on every key (quadratic), mishandles erase-word on trailing spaces, or crashes on a backspace at an empty line."
  criteria:
    correctness: "All tests pass, including trailing spaces and erase-word on whitespace-only lines."
    efficiency: "Amortized linear time because each typed character is pushed and popped at most once."
    code_quality: "A single loop with one branch per editing key and a final join; no repeated string slicing."
    edge_cases: "Empty log, only editing keys, more deletions than typed characters, spaces preserved in the output."
    communication: "Explains why nested pop loops inside the main loop still give linear total work."
hints:
  - "Every editing key only ever touches the end of the line, so think about which data structure is cheapest to change at one end."
  - "Keep the line as a stack of characters; backspace pops one, clear empties it, and erase word pops in two phases."
  - "Push ordinary characters; for erase word first pop while the top is a space, then pop while the stack is non-empty and the top is not a space; join the stack into a string only once at the end, and note each character is popped at most once overall."
followups:
  - "How would you add left and right arrow keys that move a cursor inside the line?"
  - "How would you support an undo key that reverts the last editing key?"
  - "How would you replay a multi-line recording where Enter submits each line?"
common_errors:
  - "Deleting the space in front of the erased word, or not removing trailing spaces first."
  - "Trimming leading or trailing spaces from the final result."
  - "Using repeated string slicing, which makes the replay quadratic."
  - "Popping from an empty structure on backspace."
