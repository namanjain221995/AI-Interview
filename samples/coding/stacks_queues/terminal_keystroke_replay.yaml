version: 1
slug: terminal_keystroke_replay
title: "Terminal Keystroke Replay"
difficulty: easy
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [general, backend, devops, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Terminal Keystroke Replay

  An audit tool records the raw keystrokes an operator typed at a shell prompt before pressing Enter. To
  show reviewers which command was really submitted, the recording must be replayed. Three characters are
  editing keys; every other character types itself (spaces included):

  - `<` is **backspace**: deletes the last character on the line; does nothing on an empty line.
  - `~` is **erase word**: first deletes any spaces at the end of the line, then deletes characters from the
    end until the line is empty or its last character is a space (that space stays).
  - `^` is **clear line**: deletes everything on the line.

  Write `replay_terminal_keystrokes(log)` that returns the final line exactly as it would be submitted,
  including any leading or trailing spaces. The result may be the empty string.

  ### Example 1
  ```
  Input:  log = "git comit<<mit -m wip"
  Output: "git commit -m wip"
  Explanation: Two backspaces turn git comit into git com, then mit -m wip is typed.
  ```

  ### Example 2
  ```
  Input:  log = "rm -rf /tmp^ls -la~-l"
  Output: "ls -l"
  Explanation: ^ clears the dangerous command; ~ erases -la but keeps the space before it.
  ```

  ### Example 3
  ```
  Input:  log = "deploy staging  ~~prod"
  Output: "prod"
  Explanation: The first ~ removes the two trailing spaces and staging; the second removes the space and deploy.
  ```

  ### Constraints
  - `0 <= log.length <= 10^4`
  - `log` consists of printable ASCII characters; `<`, `~` and `^` are always editing keys.

  **Follow-up:** each editing key may delete many characters; argue why the whole replay is still linear in the length of the log.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: replay_terminal_keystrokes
  params:
    - {name: log, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def replay_terminal_keystrokes(log: str) -> str:
        line: list[str] = []
        for key in log:
            if key == "<":
                if line:
                    line.pop()
            elif key == "^":
                line.clear()
            elif key == "~":
                while line and line[-1] == " ":
                    line.pop()
                while line and line[-1] != " ":
                    line.pop()
            else:
                line.append(key)
        return "".join(line)
  javascript: |
    function replayTerminalKeystrokes(log) {
      let line = [];
      for (const key of log) {
        if (key === "<") {
          line.pop();
        } else if (key === "^") {
          line = [];
        } else if (key === "~") {
          while (line.length > 0 && line[line.length - 1] === " ") line.pop();
          while (line.length > 0 && line[line.length - 1] !== " ") line.pop();
        } else {
          line.push(key);
        }
      }
      return line.join("");
    }
tests:
