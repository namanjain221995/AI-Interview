expected_concepts:
  - "stack-based evaluation of nested expressions"
  - "operator markers to delimit variable-length argument lists"
  - "recursive descent parsing as an alternative"
  - "tokenising keywords from a compact string"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Tokenises the keywords in one pass and evaluates with an explicit stack (or a recursive descent parser with an index), pops arguments back to the matching operator on each closing parenthesis, handles any number of arguments and explains the linear time and depth-bounded space."
  good: "Correct recursive or stack-based evaluator that needs prompting on variable argument counts or on deep nesting."
  weak: "Relies on eval or repeated string replacement, assumes exactly two arguments for and/or, or mis-parses keywords."
  criteria:
    correctness: "All tests pass, including bare literals, single-argument operators and deep nesting."
    efficiency: "Linear in the rule length; no repeated rescans or string rebuilding."
    code_quality: "Keyword handling and operator application are separated and easy to extend with new operators."
    edge_cases: "Bare true/false, many arguments, long chains of not and deep single-argument nesting."
    communication: "Explains how the evaluator knows where an operator's arguments start and end."
hints:
  - "Every closing parenthesis finishes exactly one operator, and at that moment all of its arguments have already been seen."
  - "Keep a stack: push a marker for each operator keyword and a value for each literal; when a closing parenthesis arrives, the values above the most recent marker are exactly that operator's arguments."
  - "Walk the rule once, skipping opening parentheses and commas; push true or false for literals and the operator name for not, and and or; on a closing parenthesis pop values until you reach an operator name, combine them with negation, all-of or any-of, and push the result back; the single remaining value is the answer."
followups:
  - "How would you support named conditions such as region_eu that are looked up in a context map at evaluation time?"
  - "How would you short-circuit evaluation so unnecessary conditions are never resolved?"
  - "How would you report a precise error for a malformed rule such as a missing closing parenthesis?"
common_errors:
  - "Assuming and/or always take exactly two arguments."
  - "Forgetting that and/or may take a single argument."
  - "Using recursion without considering the nesting depth limit of the language."
  - "Matching keywords by first letter only, which confuses similar prefixes when the grammar grows."
