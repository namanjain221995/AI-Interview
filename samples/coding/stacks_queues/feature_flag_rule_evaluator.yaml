slug: feature_flag_rule_evaluator
title: Feature Flag Rule Evaluator
difficulty: medium
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [backend, fullstack, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Feature Flag Rule Evaluator

  A feature-flag service stores rollout rules as compact boolean expressions. By the time a rule
  reaches your code, every condition (region checks, plan checks, percentage buckets) has already been
  resolved to a literal, so only the boolean structure is left. Evaluate it.

  A rule `E` is written **without spaces** and is one of:

  - `true` or `false`;
  - `not(E)` - the negation of `E`;
  - `and(E1,E2,...)` - true when **all** of its one or more arguments are true;
  - `or(E1,E2,...)` - true when **at least one** of its one or more arguments is true.

  Expressions nest freely. Return the boolean value of `rule`.

  ### Example 1
  ```
  Input:  rule = "and(true,not(false),or(false,true))"
  Output: true
  ```

  ### Example 2
  ```
  Input:  rule = "or(false,and(true,false),not(true))"
  Output: false
  ```

  ### Example 3
  ```
  Input:  rule = "not(and(true))"
  Output: false
  Explanation: and with a single argument is just that argument.
  ```

  ### Constraints
  - `4 <= rule.length <= 2 * 10^4`
  - `rule` is always well formed according to the grammar above.
  - Nesting depth is at most `1000`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: evaluate_flag_rule
  params:
    - {name: rule, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def evaluate_flag_rule(rule: str) -> bool:
        # Stack of operator names and boolean values; an operator name marks where its arguments start.
        stack: list[object] = []
        i = 0
        while i < len(rule):
            ch = rule[i]
            if ch in "(,":
                i += 1
            elif ch == ")":
                args: list[bool] = []
                while not isinstance(stack[-1], str):
                    args.append(stack.pop())  # type: ignore[arg-type]
                op = stack.pop()
                if op == "not":
                    stack.append(not args[0])
                elif op == "and":
                    stack.append(all(args))
                else:
                    stack.append(any(args))
                i += 1
            elif rule.startswith("true", i):
                stack.append(True)
                i += 4
            elif rule.startswith("false", i):
                stack.append(False)
                i += 5
            elif rule.startswith("not", i):
                stack.append("not")
                i += 3
            elif rule.startswith("and", i):
                stack.append("and")
                i += 3
            else:  # "or"
                stack.append("or")
                i += 2
        return bool(stack[0])
  javascript: |
    function evaluateFlagRule(rule) {
      const stack = [];
      let i = 0;
      while (i < rule.length) {
        const ch = rule[i];
        if (ch === "(" || ch === ",") {
          i++;
        } else if (ch === ")") {
          const args = [];
          while (typeof stack[stack.length - 1] === "boolean") args.push(stack.pop());
          const op = stack.pop();
          if (op === "not") stack.push(!args[0]);
          else if (op === "and") stack.push(args.every(Boolean));
          else stack.push(args.some(Boolean));
          i++;
        } else if (rule.startsWith("true", i)) {
          stack.push(true);
          i += 4;
        } else if (rule.startsWith("false", i)) {
          stack.push(false);
          i += 5;
        } else if (rule.startsWith("not", i)) {
          stack.push("not");
          i += 3;
        } else if (rule.startsWith("and", i)) {
          stack.push("and");
          i += 3;
        } else {
          stack.push("or");
          i += 2;
        }
      }
      return stack[0];
    }
