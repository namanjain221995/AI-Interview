time_limit_minutes: 15
prompt_markdown: |
  ## Minimum Brace Flips to Balance

  A templating engine stores the block structure of a page as a string of curly braces. A storage bug
  corrupted some of these strings: the number and positions of the braces are intact, but some braces
  point the wrong way. The repair tool can **flip** a single brace, turning `{` into `}` or `}` into `{`.

  Given `braces`, a string made only of `{` and `}`, return the **minimum number of flips** needed to make it
  balanced, or `-1` if no sequence of flips can balance it. A string is balanced when every `{` is closed
  by a later `}` and every `}` closes an earlier `{` (properly nested). The empty string is balanced and
  needs `0` flips.

  ### Example 1
  ```
  Input:  braces = "{{{}{{"
  Output: 2
  Explanation: the braces at positions 2 and 3 already match; flipping the braces at positions 1 and 5 gives "{}{}{}"
  ```

  ### Example 2
  ```
  Input:  braces = "}{}}{"
  Output: -1
  Explanation: an odd number of braces can never be balanced
  ```

  ### Example 3
  ```
  Input:  braces = "}{{}}{"
  Output: 2
  Explanation: after the matched pairs are set aside, a leading "}" and a trailing "{" remain, and each must be flipped
  ```

  ### Constraints
  - `0 <= braces.length <= 10^5`
  - `braces` contains only the characters `{` and `}`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_brace_flips
  params:
    - {name: braces, type: string}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def min_brace_flips(braces: str) -> int:
        if len(braces) % 2 == 1:
            return -1
        open_count = 0       # unmatched opening braces so far (a stack of identical items)
        stray_closing = 0    # closing braces that had nothing to match
        for ch in braces:
            if ch == "{":
                open_count += 1
            elif open_count > 0:
                open_count -= 1
            else:
                stray_closing += 1
        # What remains looks like "}}...}{{...{": pairs of the same kind cost one flip each,
        # and a leftover odd "}" plus odd "{" cost two flips together.
        return (stray_closing + 1) // 2 + (open_count + 1) // 2
  javascript: |
    function minBraceFlips(braces) {
      if (braces.length % 2 === 1) return -1;
      const stack = [];
      for (const ch of braces) {
        if (ch === "}" && stack.length > 0 && stack[stack.length - 1] === "{") stack.pop();
        else stack.push(ch);
      }
      let closing = 0;
      for (const ch of stack) if (ch === "}") closing += 1;
      const opening = stack.length - closing;
      return Math.ceil(closing / 2) + Math.ceil(opening / 2);
    }
