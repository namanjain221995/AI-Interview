expected_concepts:
  - cancel matched pairs with a stack or an open-brace counter
  - what remains is some closing braces followed by some opening braces
  - odd total length is impossible
  - ceiling of half of each leftover count
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: "Rejects odd lengths immediately, cancels matched pairs with a counter (noting a stack of identical items reduces to a count), derives the ceiling formula for the leftovers with a short argument and states O(n) time and O(1) space."
  good: "Uses an explicit stack to cancel pairs and reaches the correct formula, perhaps after checking a few small cases by hand."
  weak: "Counts only the difference between opening and closing braces, ignoring order, or tries flips by brute force without a clear argument."
  criteria:
    correctness: "All tests pass, including odd lengths, the empty string and strings that need flips of both kinds."
    efficiency: "Single pass with constant extra memory (or a stack whose O(n) memory is acknowledged)."
    code_quality: "Clear names for unmatched opening and stray closing counts, with the final formula explained."
    edge_cases: "Empty input, already balanced input, odd length and odd leftover counts of each kind."
    communication: "Explains why the leftover pattern is closing braces then opening braces and why odd leftovers cost an extra flip."
hints:
  - "First set aside every pair of braces that already matches; what kind of pattern can the leftover braces form, and when is balancing hopeless from the start?"
  - "After cancelling matched pairs (a counter of unmatched opening braces is enough), the leftovers are some closing braces followed by some opening braces; think about how two leftovers of the same kind can be repaired."
  - "Return minus one for odd length; otherwise count stray closing braces and unmatched opening braces in one pass, then each pair of stray closing braces costs one flip and each pair of opening braces costs one flip, while a single leftover of each kind costs two, which is the ceiling of half of each count added together."
followups:
  - "How would you return one balanced string that uses the minimum number of flips?"
  - "What changes if the string can also contain square brackets and parentheses?"
  - "What if instead of flipping you may only insert braces; how many insertions are needed?"
common_errors:
  - "Using only the difference between the counts of the two brace kinds, which ignores their order."
  - "Forgetting that an odd-length string can never be balanced."
  - "Rounding down instead of up, which undercounts when one of each kind is left over."
  - "Building and modifying substrings repeatedly, which turns a linear pass into quadratic work."
