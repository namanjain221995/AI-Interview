expected_concepts:
  - stack of open calls where the top is the running function
  - attributing the span between consecutive events to the current top
  - instant timestamps so an exit at t ends the call exactly at t
  - recursion handled by pushing every call, not every distinct id
  - 64-bit totals for large timestamps
optimal_complexity: {time: O(m), space: O(m + n)}
rubric:
  excellent: "Models the log as a call stack, charges each gap between consecutive lines to the call on top, handles recursion, zero-length calls and idle gaps without special cases, uses 64-bit totals and states O(m) time with m log lines."
  good: "Reaches a correct stack-based solution, perhaps after fixing an off-by-one in how enter and exit times are charged, and gives the right complexity."
  weak: "Charges whole inclusive durations, double counts nested calls, uses 32-bit totals that overflow, or tracks one start time per id so recursion breaks."
  criteria:
    correctness: "All tests pass, including recursion, zero-length calls, idle gaps and timestamps near 10^12."
    efficiency: "One pass over the log with constant work per line."
    code_quality: "Clear parsing of each line and a single previous-timestamp variable instead of per-case bookkeeping."
    edge_cases: "Empty log, functions that never run, identical timestamps and deep nesting."
    communication: "Explains why the time since the previous line always belongs to the call on top of the stack."
hints:
  - "At any moment exactly one open call (or none) is actually running; think about which structure tells you which one it is."
  - "Keep a stack of open calls. Between two consecutive log lines nothing changes, so the whole span between them belongs to whatever is on top of the stack."
  - "Remember the timestamp of the previous line; for each new line, if the stack is not empty add the difference to the total of the id on top, then push on enter or pop on exit and update the previous timestamp. Keep totals in a 64-bit type."
followups:
  - "How would you also report inclusive runtime (time including callees) for every function?"
  - "What would change if the tracer used inclusive integer ticks, where an exit at t means the call ran through the end of tick t?"
  - "How would you detect and report a malformed log where an exit does not match the open call?"
  - "How would you extend this to several threads that each write their own interleaved lines?"
common_errors:
  - "Adding one to durations as if timestamps were inclusive ticks."
  - "Storing a single start time per function id, which breaks for recursive calls."
  - "Subtracting the callee's full duration from the caller in a second pass and getting nested sums wrong."
  - "Accumulating totals in a 32-bit integer and overflowing for timestamps near 10^12."
