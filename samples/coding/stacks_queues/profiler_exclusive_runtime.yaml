time_limit_minutes: 25
prompt_markdown: |
  ## Profiler Exclusive Runtime

  A lightweight tracer is attached to a **single-threaded** worker. Whenever a function starts or
  finishes it writes one log line of the form `"<t> enter <id>"` or `"<t> exit <id>"`, where `t` is a
  timestamp in microseconds and `id` is a function id from `0` to `n - 1`.

  The worker runs one function at a time: when function A calls function B, A is paused until B exits.
  The log is **well nested**: every `exit` closes the most recent `enter` that is still open (and has the
  same id), and every `enter` is eventually closed. Functions may call themselves (recursion).

  Timestamps are **non-decreasing instants**. The time between two consecutive lines stamped `a` and `b`
  lasts exactly `b - a` microseconds and belongs to whichever call is innermost (on top of the call
  stack) during that span. Time when no call is open belongs to nobody.

  The **exclusive runtime** of a function is the total time during which one of its calls was the
  innermost running call; time spent inside functions it called does not count. For a recursive
  function, every one of its calls contributes while it is on top.

  Return an array of length `n` whose entry `i` is the exclusive runtime of function `i`
  (`0` for functions that never ran).

  ### Example 1
  ```
  Input:  n = 3, events = ["0 enter 0", "2 enter 1", "5 enter 2", "6 exit 2", "9 exit 1", "10 exit 0"]
  Output: [3, 6, 1]
  Explanation: function 0 is on top during 0-2 and 9-10 (3 in total), function 1 during 2-5 and 6-9 (6), function 2 during 5-6 (1)
  ```

  ### Example 2
  ```
  Input:  n = 2, events = ["4 enter 1", "7 enter 1", "7 exit 1", "12 exit 1", "12 enter 0", "21 exit 0"]
  Output: [9, 8]
  Explanation: the outer call of function 1 is on top during 4-7 and 7-12, its zero-length recursive call adds nothing (8 in total); function 0 runs 12-21 (9)
  ```

  ### Example 3
  ```
  Input:  n = 2, events = ["1 enter 0", "3 exit 0", "10 enter 0", "11 exit 0"]
  Output: [3, 0]
  Explanation: the idle gap 3-10 belongs to nobody, and function 1 never ran
  ```

  ### Constraints
  - `1 <= n <= 100`
  - `0 <= events.length <= 2 * 10^4` and `events.length` is even
  - Each line is exactly `"<t> enter <id>"` or `"<t> exit <id>"` with single spaces
  - `0 <= t <= 10^12`, and timestamps never decrease from one line to the next
  - `0 <= id < n`
  - The log is well nested and every call is closed

  **Follow-up:** the totals can exceed the 32-bit range; which type do you use for them, and why?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: exclusive_runtime_per_function
  params:
    - {name: n, type: int}
    - {name: events, type: "string[]"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def exclusive_runtime_per_function(n: int, events: list[str]) -> list[int]:
        totals = [0] * n
        stack: list[int] = []  # ids of open calls, innermost last
        previous = 0
        for line in events:
            stamp, kind, ident = line.split(" ")
            t = int(stamp)
            if stack:
                totals[stack[-1]] += t - previous  # the span since the last line belongs to the top call
            if kind == "enter":
                stack.append(int(ident))
            else:
                stack.pop()
            previous = t
        return totals
  javascript: |
    function exclusiveRuntimePerFunction(n, events) {
      const totals = new Array(n).fill(0);
      const stack = []; // ids of open calls, innermost last
      let previous = 0;
      for (const line of events) {
        const [stamp, kind, ident] = line.split(" ");
        const t = Number(stamp);
        if (stack.length > 0) totals[stack[stack.length - 1]] += t - previous;
        if (kind === "enter") stack.push(Number(ident));
        else stack.pop();
        previous = t;
      }
      return totals;
    }
