expected_concepts:
  - "simulating the siding with a stack"
  - "greedy pulling whenever the top matches the next departure"
  - "pointer into the departure order"
  - "O(n) because each car is pushed and pulled at most once"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Simulates the siding with a stack, argues why pulling a matching top car immediately is always safe, uses a pointer into departures, and explains the O(n) bound from each car being pushed and pulled once."
  good: "Correct greedy stack simulation with a brief or partial justification of the greedy choice."
  weak: "Tries to enumerate push and pull sequences, checks only adjacent pairs, or assumes ids are sorted so the order can be compared numerically."
  criteria:
    correctness: "All tests pass, including impossible orders detected at the end and unsorted ids."
    efficiency: "Linear time; no backtracking or search over operation sequences."
    code_quality: "Compact simulation loop with clearly named stack and pointer."
    edge_cases: "Empty input, a single car, identical and fully reversed orders."
    communication: "Explains why delaying a pull that could happen now never helps."
hints:
  - "You never need to search: the next car to leave must be either at the open end of the siding or still on the inbound track."
  - "Simulate the yard with a stack. If the car that should leave next is at the top of the siding, pulling it right now can never hurt."
  - "Push each arriving car; after each push, keep pulling while the top of the stack equals the next wanted departure, advancing a pointer into the departure order. The order is achievable exactly when that pointer reaches the end after all arrivals."
followups:
  - "How would you return the actual list of push and pull operations when the order is achievable?"
  - "What changes if the siding can hold at most c cars?"
  - "How many different departure orders are achievable for n cars?"
  - "How would you handle two sidings that can be used in sequence?"
common_errors:
  - "Comparing car ids numerically instead of following the arrival order."
  - "Stopping after a single pull instead of pulling while the top keeps matching."
  - "Returning true based on the stack size without checking that every departure was produced."
  - "Reading past the end of departures when the stack is not empty."
