slug: rail_siding_departure_order
title: "Rail Siding Departure Order"
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Rail Siding Departure Order

  Freight cars reach a rail yard on the inbound track one at a time, in the order given by `arrivals`.
  Next to the track is a dead-end **siding**: a car pushed into it can be pulled out only after every
  car pushed in after it has been pulled out (last in, first out). The siding can hold any number of
  cars.

  At each step the yard crew does one of two things:

  - push the next arriving car into the siding, or
  - pull the car nearest the siding's open end out onto the departure track.

  A car that should leave right away is pushed in and pulled straight out again. Cars cannot return
  from the departure track, and cars on the inbound track cannot overtake each other.

  Given `arrivals` and the desired `departures` (the same car ids in some order), return `true` if the
  crew can make the cars leave in exactly the order of `departures`, otherwise `false`. With no cars
  the answer is `true`.

  ### Example 1
  ```
  Input:  arrivals = [17, 42, 8, 30], departures = [42, 30, 8, 17]
  Output: true
  Explanation: push 17, push 42, pull 42; push 8, push 30, pull 30, pull 8, pull 17
  ```

  ### Example 2
  ```
  Input:  arrivals = [5, 9, 2], departures = [2, 5, 9]
  Output: false
  Explanation: car 2 can leave only after 5 and 9 are in the siding, and then 9 blocks 5
  ```

  ### Constraints
  - `0 <= arrivals.length <= 10^4`
  - `departures.length == arrivals.length`
  - `1 <= arrivals[i] <= 10^6` and all ids in `arrivals` are distinct
  - `departures` is a permutation of `arrivals`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: siding_can_produce_order
  params:
    - {name: arrivals, type: "int[]"}
    - {name: departures, type: "int[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def siding_can_produce_order(arrivals: list[int], departures: list[int]) -> bool:
        siding: list[int] = []
        next_out = 0
        for car in arrivals:
            siding.append(car)
            while siding and next_out < len(departures) and siding[-1] == departures[next_out]:
                siding.pop()
                next_out += 1
        return next_out == len(departures)
  javascript: |
    function sidingCanProduceOrder(arrivals, departures) {
      const siding = [];
      let nextOut = 0;
      for (const car of arrivals) {
        siding.push(car);
        while (siding.length > 0 && nextOut < departures.length && siding[siding.length - 1] === departures[nextOut]) {
          siding.pop();
          nextOut++;
        }
      }
      return nextOut === departures.length;
    }
