version: 1
slug: collapse_repeated_alert_bursts
title: Collapse Repeated Alert Bursts
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [sre, devops, support_engineer]
time_limit_minutes: 20
prompt_markdown: |
  ## Collapse Repeated Alert Bursts

  An on-call pager receives a stream of alert codes such as `"DISK"` or `"CPU"`. A flapping check often
  fires the same code several times in a row, so the de-noiser applies one rule to the recorded
  sequence `codes`:

  - Whenever `k` **adjacent** entries carry the **same** code, those `k` entries are deleted together.
  - Deleting a burst closes the gap, which can line up identical codes that were separated before;
    the rule is applied again and again until no `k` adjacent identical codes remain.

  A run longer than `k` loses `k` entries per deletion (a run of `k + 1` leaves one entry behind). The
  final sequence is the same whichever burst is deleted first.

  Return the codes that survive, in their original relative order. Return an empty list if nothing
  survives.

  ### Example 1
  ```
  Input:  codes = ["CPU", "DISK", "DISK", "MEM", "MEM", "DISK", "CPU"], k = 2
  Output: ["CPU", "DISK", "CPU"]
  Explanation: "DISK","DISK" and "MEM","MEM" are deleted; the remaining CPU, DISK, CPU has no
  adjacent pair left
  ```

  ### Example 2
  ```
  Input:  codes = ["NET", "DISK", "DISK", "NET", "NET", "DISK", "DISK", "DISK", "NET"], k = 3
  Output: ["NET", "DISK", "DISK"]
  Explanation: the three adjacent DISK entries go first; that brings NET, NET next to the last NET,
  so those three go too; the first NET and a pair of DISK entries are left
  ```

  ### Example 3
  ```
  Input:  codes = ["CPU", "MEM", "MEM", "MEM", "CPU", "CPU"], k = 3
  Output: []
  ```

  ### Constraints
  - `0 <= codes.length <= 10^5`
  - `2 <= k <= 10^4`
  - Each code is a non-empty string of up to 20 uppercase letters, digits or underscores.

  **Follow-up:** rescanning the list after every deletion is `O(n^2 / k)`. Can you do it in one pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: collapse_alert_bursts
  params:
    - {name: codes, type: "string[]"}
    - {name: k, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def collapse_alert_bursts(codes: list[str], k: int) -> list[str]:
        stack: list[list] = []  # [code, run length] for the surviving runs
        for code in codes:
            if stack and stack[-1][0] == code:
                stack[-1][1] += 1
                if stack[-1][1] == k:
                    stack.pop()
            else:
                stack.append([code, 1])
        result: list[str] = []
        for code, count in stack:
            result.extend([code] * count)
        return result
  javascript: |
    function collapseAlertBursts(codes, k) {
      const stack = []; // [code, run length]
      for (const code of codes) {
        const top = stack[stack.length - 1];
        if (top !== undefined && top[0] === code) {
          top[1] += 1;
          if (top[1] === k) stack.pop();
        } else {
          stack.push([code, 1]);
        }
      }
      const result = [];
      for (const [code, count] of stack) {
        for (let i = 0; i < count; i++) result.push(code);
      }
      return result;
    }
tests:
  - {id: t1, args: [["CPU", "DISK", "DISK", "MEM", "MEM", "DISK", "CPU"], 2], expected: ["CPU", "DISK", "CPU"], description: "Example 1 - two independent pairs deleted"}
  - {id: t2, args: [["NET", "DISK", "DISK", "NET", "NET", "DISK", "DISK", "DISK", "NET"], 3], expected: ["NET", "DISK", "DISK"], description: "Example 2 - a deletion lines up a new burst"}
  - {id: t3, args: [["CPU", "MEM", "MEM", "MEM", "CPU", "CPU"], 3], expected: [], description: "Example 3 - cascade removes everything"}
  - {id: t4, hidden: true, args: [[], 2], expected: [], description: "Empty input"}
  - {id: t5, hidden: true, args: [["CPU", "CPU", "MEM", "MEM", "MEM"], 4], expected: ["CPU", "CPU", "MEM", "MEM", "MEM"], description: "k larger than every run - nothing changes"}
  - {id: t6, hidden: true, args: [["IO", "IO", "IO", "IO", "IO", "IO", "IO"], 3], expected: ["IO"], description: "Run of 7 with k = 3 leaves one entry (runs longer than k)"}
  - {id: t7, hidden: true, args: [["A", "B", "C", "D", "D", "C", "B", "A"], 2], expected: [], description: "Nested mirror - four cascading pair deletions empty the list"}
  - {id: t8, hidden: true, args: [["DISK", "NET", "NET", "DISK", "DISK", "NET", "NET", "DISK", "NET"], 2], expected: ["NET"], description: "Long chain of cascading pair deletions leaves a single entry"}
  - {id: t9, hidden: true, args: [["Z9", "X1", "X1", "Y_2", "Y_2", "Y_2", "X1", "Y_2", "Z9"], 3], expected: ["Z9", "Y_2", "Z9"], description: "Burst of X1 forms only after the inner Y_2 burst is deleted; outer codes survive"}
