expected_concepts:
  - stack of (code, run length) pairs
  - popping a run when its count reaches k
  - cascading deletions handled implicitly by exposing the previous run
  - single pass in O(n) time
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Explains why a naive rescan is quadratic, derives the stack of (code, count) runs, shows how a pop exposes the previous run so cascades need no extra work and states O(n) time and space."
  good: "Implements a correct stack-based solution with some prompting, perhaps storing every entry and counting by peeking, and states the right complexity."
  weak: "Rescans the whole list until nothing changes without discussing cost, deletes only maximal runs of exactly k, or misses cascades created by a deletion."
  criteria:
    correctness: "All tests pass, including cascades, runs longer than k and inputs where everything is deleted."
    efficiency: "Linear time; each entry is pushed and popped at most once."
    code_quality: "Clear run representation and a simple expansion of the surviving runs at the end."
    edge_cases: "Empty input, k larger than any run, runs of length k + 1 and a burst at the very end."
    communication: "Explains why the deletion order does not change the result and how cascades are captured."
hints:
  - "After deleting one burst, which entries can possibly form a new burst? Think about what ends up next to each other."
  - "Process the codes left to right and keep only what has survived so far; a new code can only extend the most recent surviving run."
  - "Keep a stack of pairs (code, count): increase the count when the incoming code matches the top, pop the pair when the count reaches k, otherwise push a new pair with count one; finally expand the pairs into the answer."
followups:
  - "How would you also report how many entries were deleted in total?"
  - "What changes if the stream never ends and you must emit codes as soon as they can no longer be deleted?"
  - "How would you handle a rule that deletes runs of k or more in one go instead of exactly k at a time?"
common_errors:
  - "Rescanning the full list after every deletion, which is quadratic on inputs with long cascades."
  - "Resetting the count to one after a pop instead of resuming the previous run's count."
  - "Deleting only when a maximal run has length exactly k, so a run of k + 1 survives untouched."
  - "Comparing with the previous input entry instead of the top of the surviving stack."
