prompt_markdown: |
  ## Parcel Stack for Ascending Delivery

  A courier van carries its parcels in a single vertical stack, and the driver follows a fixed routine
  until the stack is empty:

  1. Deliver the parcel on **top** of the stack (it leaves the van).
  2. If any parcels remain, take the parcel that is now on top and slide it to the **bottom** of the
     stack without delivering it.

  Every parcel has a distinct numeric id, and the dispatcher wants the deliveries to happen in
  **ascending id order**. Given the ids of the parcels (in any order), return the order in which the
  parcels must be stacked, listed **from top to bottom**, so that the routine delivers them in ascending
  order of id. Exactly one such order exists.

  ### Example 1
  ```
  Input:  parcel_ids = [3, 1, 4, 2]
  Output: [1, 3, 2, 4]
  Explanation: deliver 1, slide 3 to the bottom -> [2, 4, 3]; deliver 2, slide 4 -> [3, 4]; deliver 3, slide 4 -> [4]; deliver 4
  ```

  ### Example 2
  ```
  Input:  parcel_ids = [50]
  Output: [50]
  ```

  ### Example 3
  ```
  Input:  parcel_ids = [60, 10, 40, 20, 50, 30]
  Output: [10, 40, 20, 60, 30, 50]
  ```

  ### Constraints
  - `1 <= parcel_ids.length <= 10^4`
  - `-10^9 <= parcel_ids[i] <= 10^9`
  - All ids are distinct

  **Follow-up:** instead of searching for the answer, can you replay the routine on stack *positions*
  to place each id directly?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: stack_order_for_ascending_delivery
  params:
    - {name: parcel_ids, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def stack_order_for_ascending_delivery(parcel_ids: list[int]) -> list[int]:
        n = len(parcel_ids)
        positions = deque(range(n))  # stack slots, top first, in the order the routine visits them
        order = [0] * n
        for parcel in sorted(parcel_ids):
            order[positions.popleft()] = parcel  # this slot is delivered next
            if positions:
                positions.append(positions.popleft())  # the next slot slides to the bottom
        return order
  javascript: |
    function stackOrderForAscendingDelivery(parcelIds) {
      const n = parcelIds.length;
      const sorted = [...parcelIds].sort((a, b) => a - b);
      const queue = new Array(2 * n);
      let head = 0;
      let tail = 0;
      for (let i = 0; i < n; i++) queue[tail++] = i;
      const order = new Array(n);
      for (const parcel of sorted) {
        order[queue[head++]] = parcel;
        if (head < tail) queue[tail++] = queue[head++];
      }
      return order;
    }
