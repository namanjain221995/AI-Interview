expected_concepts:
  - simulate the routine on positions rather than values
  - queue to model taking from the top and adding at the bottom
  - sort ids ascending and assign them to the order in which positions are delivered
  - reverse simulation as an alternative (undo the routine from the last delivery)
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: "Recognises the stack behaves as a queue, simulates the routine on slot indices, assigns sorted ids to slots in delivery order, explains the O(n log n) sort-dominated cost and can describe the reverse simulation alternative."
  good: "Reaches the index simulation or the reverse simulation with some guidance and handles the last parcel (no slide) correctly."
  weak: "Tries permutations, simulates on values and gets confused, forgets to sort the ids, or slides a parcel after the final delivery."
  criteria:
    correctness: "All tests pass, including a single parcel, unsorted and negative ids."
    efficiency: "O(n log n) for sorting plus O(n) simulation with a proper queue, not repeated list shifts."
    code_quality: "Clear separation between computing delivery slots and filling in ids."
    edge_cases: "One parcel, two parcels, already sorted input, negative and extreme ids."
    communication: "Explains why replaying the routine on slot numbers reveals which slot each delivery comes from."
hints:
  - "Forget the ids for a moment: if the stack had slots numbered from the top, in which order would the routine deliver the slots?"
  - "Taking from the top and putting at the bottom is exactly how a queue behaves; replay the routine on a queue of slot numbers to learn the delivery order of the slots."
  - "Sort the ids. Fill a queue with slot numbers zero to n minus one; for each id in ascending order, take the front slot and write the id there, then, if slots remain, move the next front slot to the back. The filled slots are the answer from top to bottom."
followups:
  - "How would you solve it by running the routine backwards from the last delivered parcel?"
  - "What changes if the driver slides two parcels to the bottom after each delivery?"
  - "Given a stack order, how would you verify in O(n) that it delivers in ascending order?"
common_errors:
  - "Sliding a parcel to the bottom after the last delivery, which breaks the slot simulation for odd sizes."
  - "Forgetting to sort the input ids before assigning them."
  - "Using a list with removal from the front, which makes the simulation quadratic."
  - "Returning the delivery order instead of the stacking order."
