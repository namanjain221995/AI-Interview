slug: next_higher_sensor_reading
title: Next Higher Sensor Reading
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [data, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Next Higher Sensor Reading

  A pressure sensor on a pipeline reports one integer reading per minute. To flag pressure build-ups,
  the monitoring team wants to know, for every reading, which **later** reading first went above it.

  Given the list `readings` in the order they were recorded, return a list `result` of the same length
  where `result[i]` is the **value** of the first reading after position `i` that is **strictly greater**
  than `readings[i]`. If no later reading is strictly greater, `result[i]` is `-1`.

  Equal readings do not count as higher.

  ### Example 1
  ```
  Input:  readings = [3, 7, 1, 7, 8, 4]
  Output: [7, 8, 7, 8, -1, -1]
  Explanation: after the 3 the first higher reading is 7; after the first 7 the next 7 is not higher, so the answer is 8; nothing after 8 or the final 4 is higher
  ```

  ### Example 2
  ```
  Input:  readings = [9, 6, 6, 2]
  Output: [-1, -1, -1, -1]
  ```

  ### Constraints
  - `1 <= readings.length <= 10^5`
  - `-10^9 <= readings[i] <= 10^9`

  **Follow-up:** the straightforward double loop is `O(n^2)`; can you do it in a single pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: next_higher_readings
  params:
    - {name: readings, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def next_higher_readings(readings: list[int]) -> list[int]:
        result = [-1] * len(readings)
        waiting: list[int] = []  # indices still looking for a higher reading; values non-increasing
        for i, value in enumerate(readings):
            while waiting and readings[waiting[-1]] < value:
                result[waiting.pop()] = value
            waiting.append(i)
        return result
  javascript: |
    function nextHigherReadings(readings) {
      const result = new Array(readings.length).fill(-1);
      const waiting = []; // indices still looking for a higher reading
      for (let i = 0; i < readings.length; i++) {
        while (waiting.length > 0 && readings[waiting[waiting.length - 1]] < readings[i]) {
          result[waiting.pop()] = readings[i];
        }
        waiting.push(i);
      }
      return result;
    }
