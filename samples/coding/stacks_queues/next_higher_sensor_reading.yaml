expected_concepts:
  - monotonic stack of indices still waiting for an answer
  - each index is pushed and popped at most once
  - strictly greater comparison so equal readings stay on the stack
  - default answer of -1 for readings never resolved
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Starts from the O(n^2) scan, derives the monotonic stack of pending indices, handles equal readings with a strict comparison and justifies O(n) time with the push-once/pop-once argument."
  good: "Implements a correct stack solution with some prompting, or confuses values and indices briefly before fixing it, and states the right complexity."
  weak: "Only produces the nested-loop scan, treats equal readings as higher, or returns indices instead of reading values."
  criteria:
    correctness: "All tests pass, including equal readings, negatives and readings with no later higher value."
    efficiency: "Linear time; each index enters and leaves the stack at most once."
    code_quality: "Clear naming of the pending stack and a result array pre-filled with -1."
    edge_cases: "Single reading, all-equal series, strictly increasing and strictly decreasing series."
    communication: "Explains why the stack stays non-increasing from bottom to top and what a pop means."
hints:
  - "When a new reading arrives, which earlier readings could it be the answer for, and which ones can it never answer?"
  - "Keep the positions of readings that have not found their answer yet; notice their values never increase from oldest to newest, so a new reading can only resolve the most recent ones."
  - "Use a stack of indices: for each new reading, pop every index whose value is strictly smaller and record the new reading as its answer, then push the current index; anything left at the end keeps the default answer of minus one."
followups:
  - "How would you return the distance in minutes to the next higher reading instead of its value?"
  - "What changes if the readings come from a circular buffer, so the search wraps around to the start?"
  - "How would you answer the same question for the nearest higher reading to the left?"
common_errors:
  - "Using a non-strict comparison, which treats an equal reading as higher."
  - "Storing values instead of indices on the stack, which makes it impossible to write the answer into the right slot."
  - "Falling back to the O(n^2) double loop without discussing a faster approach."
  - "Forgetting to initialise unresolved answers to -1."
