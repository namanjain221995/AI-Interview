title: Bill of Materials Part Counts
difficulty: hard
competency_keys: [algorithms, data_structures, code_quality]
role_tags: [backend, data, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Bill of Materials Part Counts

  A factory's planning system stores each product's bill of materials (BOM) as one compact string.
  Before a production run, the purchasing service needs the total quantity of every part the product
  uses, with all nested sub-assemblies multiplied out.

  The BOM string `formula` is built from:

  - **Parts**: a part name is one uppercase letter followed by zero or more lowercase letters
    (`Bolt`, `Nut`, `B`). The name may be followed by a positive integer count; with no count the
    quantity is `1`. `Bolt4` means four bolts.
  - **Sub-assemblies**: a non-empty BOM wrapped in parentheses, optionally followed by a positive
    integer multiplier (default `1`). Every quantity inside the parentheses is multiplied by it.
    Sub-assemblies can be nested to any depth.

  A part may appear several times at different places in the string; its quantities are added up.
  A name is always the longest run of lowercase letters after its uppercase letter, so `BoBolt` means
  one `Bo` and one `Bolt`.

  Return one string `"Name:count"` for every distinct part, sorted by part name in ascending
  character-code order (plain string comparison).

  ### Example 1
  ```
  Input:  formula = "Frame2(Bolt4Nut4)3Panel"
  Output: ["Bolt:12", "Frame:2", "Nut:12", "Panel:1"]
  Explanation: the sub-assembly of 4 bolts and 4 nuts is used 3 times; Panel has no count, so 1
  ```

  ### Example 2
  ```
  Input:  formula = "Hinge2(Screw3(Washer2)2)4Screw"
  Output: ["Hinge:2", "Screw:13", "Washer:16"]
  Explanation: Screw = 3 * 4 + 1 = 13 and Washer = 2 * 2 * 4 = 16
  ```

  ### Example 3
  ```
  Input:  formula = "(Cable)Cable2Clip"
  Output: ["Cable:3", "Clip:1"]
  ```

  ### Constraints
  - `1 <= formula.length <= 1000`
  - `formula` contains only English letters, digits and parentheses, and is always well formed:
    parentheses are balanced, every group contains at least one part, and every count or
    multiplier directly follows a part name or a `)`.
  - Counts and multipliers are integers from `1` to `10^6` without leading zeros.
  - Every final and intermediate quantity is at most `10^12`, so use 64-bit arithmetic where your
    language needs it.

  **Follow-up:** can you do it in one left-to-right pass without recursion?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_bom_parts
  params:
    - {name: formula, type: string}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def count_bom_parts(formula: str) -> list[str]:
        stack: list[dict[str, int]] = [{}]  # one tally per open sub-assembly
        i, n = 0, len(formula)

        def read_number(pos: int) -> tuple[int, int]:
            start = pos
            while pos < n and formula[pos].isdigit():
                pos += 1
            return (int(formula[start:pos]) if pos > start else 1), pos

        while i < n:
            ch = formula[i]
            if ch == "(":
                stack.append({})
                i += 1
            elif ch == ")":
                group = stack.pop()
                mult, i = read_number(i + 1)
                top = stack[-1]
                for name, cnt in group.items():
                    top[name] = top.get(name, 0) + cnt * mult
            else:
                j = i + 1
                while j < n and formula[j].islower():
                    j += 1
                name = formula[i:j]
                cnt, i = read_number(j)
                top = stack[-1]
                top[name] = top.get(name, 0) + cnt
        totals = stack[0]
        return [f"{name}:{totals[name]}" for name in sorted(totals)]
  javascript: |
    function countBomParts(formula) {
      const n = formula.length;
      const stack = [new Map()]; // one tally per open sub-assembly
      let i = 0;
      const isDigit = (c) => c >= "0" && c <= "9";
      const isLower = (c) => c >= "a" && c <= "z";
      const readNumber = (pos) => {
        const start = pos;
        while (pos < n && isDigit(formula[pos])) pos++;
        return [pos > start ? Number(formula.slice(start, pos)) : 1, pos];
      };
      const add = (tally, name, cnt) => tally.set(name, (tally.get(name) || 0) + cnt);
      while (i < n) {
        const ch = formula[i];
        if (ch === "(") {
          stack.push(new Map());
          i++;
        } else if (ch === ")") {
          const group = stack.pop();
          const [mult, next] = readNumber(i + 1);
          i = next;
          const top = stack[stack.length - 1];
          for (const [name, cnt] of group) add(top, name, cnt * mult);
        } else {
          let j = i + 1;
          while (j < n && isLower(formula[j])) j++;
          const name = formula.slice(i, j);
          const [cnt, next] = readNumber(j);
          i = next;
          add(stack[stack.length - 1], name, cnt);
        }
      }
      const names = [...stack[0].keys()].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
      return names.map((name) => `${name}:${stack[0].get(name)}`);
    }
