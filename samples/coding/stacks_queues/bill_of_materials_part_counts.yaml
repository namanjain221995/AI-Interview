expected_concepts:
  - stack of per-level tallies (hash maps) for nested sub-assemblies
  - tokenising names as an uppercase letter plus lowercase letters and multi-digit counts
  - default quantity and multiplier of 1
  - merging a closed group into its parent multiplied by the trailing number
  - 64-bit quantities and sorting the final names
optimal_complexity: {time: O(n * d + k log k), space: O(n)}
rubric:
  excellent: "Designs a clean tokenizer, uses a stack of tallies (or recursive descent) that multiplies a closed group into its parent, handles default counts, multi-digit numbers and repeated parts, uses 64-bit quantities and sorts the names; explains the cost of merging maps at each closing parenthesis."
  good: "Reaches a correct stack or recursive solution with minor prompting, for example after fixing multi-digit counts or a missing default multiplier."
  weak: "Expands the string textually (exponential blow-up), splits names incorrectly, ignores nested multipliers or overflows 32-bit counts."
  criteria:
    correctness: "All tests pass, including nested groups without multipliers, repeated parts and names that are prefixes of other names."
    efficiency: "Single pass; each closing parenthesis merges only the parts of that group into its parent instead of re-expanding text."
    code_quality: "Separate helpers for reading a name and reading a number; no duplicated parsing logic for counts and multipliers."
    edge_cases: "Single part, group without multiplier, deep nesting, quantities beyond 32-bit, explicit count of 1."
    communication: "Explains the grammar first and why a stack mirrors the nesting of parentheses."
hints:
  - "Start by writing down the tokens you meet while scanning: a part name, a number, an opening parenthesis and a closing parenthesis. What should each one do to the running totals?"
  - "A closing parenthesis needs the totals of just the group it closes, so keep one tally per open group; nesting suggests a stack (or a recursive call per group)."
  - "Push an empty map on every opening parenthesis and add parts with their counts (default 1) to the top map; on a closing parenthesis pop the top map, read the multiplier that follows (default 1) and add each quantity times the multiplier into the new top; finally sort the names of the bottom map."
followups:
  - "How would you report a malformed BOM, such as an unmatched parenthesis or a count with no part, with a useful position in the error?"
  - "If sub-assemblies were named and referenced from a separate table, how would you detect a cycle?"
  - "What is the worst-case cost of merging maps at every closing parenthesis, and how could you reduce it?"
common_errors:
  - "Reading only one digit of a multi-digit count or multiplier."
  - "Forgetting the default count or multiplier of 1."
  - "Treating every uppercase or lowercase letter as its own part instead of reading the whole name."
  - "Using 32-bit integers for quantities that reach 10^12."
  - "Returning names in first-seen order instead of sorted order."
