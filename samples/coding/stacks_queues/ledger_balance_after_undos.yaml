role_tags: [backend, fullstack, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Ledger Balance After Undos

  A point-of-sale cash ledger starts at a balance of `0` and receives a stream of entries in order:

  - a signed amount such as `"+250"` or `"-40"` is applied to the balance and becomes an **active** amount;
  - `"UNDO k"` cancels the `k` most recently applied amounts that are still active, newest first. If fewer
    than `k` amounts are active, all of them are cancelled. A cancelled amount is reversed from the balance
    and can never be undone again or restored.

  Write `ledger_balance_after_undos(entries)` that returns the final balance. The balance may be negative
  and may exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  entries = ["+250", "-40", "+100", "UNDO 1", "-30"]
  Output: 180
  Explanation: The undo cancels +100, leaving 250 - 40 - 30.
  ```

  ### Example 2
  ```
  Input:  entries = ["+500", "UNDO 3", "+75", "-20", "UNDO 1", "UNDO 1", "+10"]
  Output: 10
  Explanation: UNDO 3 cancels the only active amount; the two UNDO 1 cancel -20 and then +75.
  ```

  ### Constraints
  - `0 <= entries.length <= 10^5`
  - An amount is `+` or `-` followed by an integer between `0` and `10^9` (no leading zeros except `0` itself).
  - An undo is `"UNDO k"` with `1 <= k <= 10^5`.

  **Follow-up:** why is the total work linear even though a single undo can cancel many amounts?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: ledger_balance_after_undos
  params:
    - {name: entries, type: "string[]"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def ledger_balance_after_undos(entries: list[str]) -> int:
        active: list[int] = []
        balance = 0
        for entry in entries:
            if entry.startswith("UNDO"):
                count = int(entry.split()[1])
                while count > 0 and active:
                    balance -= active.pop()
                    count -= 1
            else:
                amount = int(entry)
                active.append(amount)
                balance += amount
        return balance
  javascript: |
    function ledgerBalanceAfterUndos(entries) {
      const active = [];
      let balance = 0;
      for (const entry of entries) {
        if (entry.startsWith("UNDO")) {
          let count = Number(entry.split(" ")[1]);
          while (count > 0 && active.length > 0) {
            balance -= active.pop();
            count--;
          }
        } else {
          const amount = Number(entry);
          active.push(amount);
          balance += amount;
        }
      }
      return balance;
    }
