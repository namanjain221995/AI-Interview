expected_concepts:
  - "stack of active amounts"
  - "running balance updated on push and pop"
  - "amortized analysis: each amount is undone at most once"
  - "64-bit accumulation"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Keeps a stack of active amounts and a running balance, pops up to k entries per undo, explains the amortized O(n) bound and uses a 64-bit total."
  good: "Correct stack solution that recomputes the balance at the end or needs a prompt about the 32-bit range."
  weak: "Re-applies undone amounts, undoes from the oldest end, ignores the 'fewer than k' rule, or overflows."
  criteria:
    correctness: "All tests pass, including undo on an empty stack and huge k."
    efficiency: "Linear total time because each amount is pushed and popped at most once."
    code_quality: "Parsing of amounts and undo commands is clear; the balance is maintained incrementally."
    edge_cases: "Empty input, zero amounts, negative balances, sums beyond 32 bits."
    communication: "Explains why undone amounts can be discarded permanently."
hints:
  - "An undo always cancels the newest still-active amounts first; which structure gives you the newest item cheaply?"
  - "Keep the active amounts on a stack together with a running balance, so cancelling an amount is just removing it and reversing its effect."
  - "For each signed amount, push it and add it to the balance; for an undo, pop up to k amounts while the stack is non-empty and subtract each one; use a 64-bit total and note each amount can be popped only once, so the whole pass is linear."
followups:
  - "How would you add a REDO command that restores the most recently undone amounts?"
  - "How would you report the balance after every entry instead of only at the end?"
  - "What if undo cancelled amounts by transaction id rather than by recency?"
common_errors:
  - "Using a 32-bit integer for the balance."
  - "Cancelling the oldest amounts instead of the newest."
  - "Failing or going negative when k exceeds the number of active amounts."
  - "Treating '+0' or '-0' as non-entries, which shifts later undos."
