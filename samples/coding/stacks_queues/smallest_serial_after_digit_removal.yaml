version: 1
slug: smallest_serial_after_digit_removal
title: Smallest Serial After Digit Removal
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Smallest Serial After Digit Removal

  A warehouse labelling system prints numeric serials on small tags. When a serial is too long for
  the tag, the system deletes **exactly `k` digits** from it. The remaining digits keep their original
  relative order (nothing is rearranged), and the system wants the shortened serial to be the
  **smallest possible number**.

  Given `serial` (a string of decimal digits, possibly starting with `0`) and `k`, return the smallest
  number that can remain, as a string:

  - strip any leading zeros from the result;
  - return `"0"` if no digits remain or only zeros remain.

  ### Example 1
  ```
  Input:  serial = "4719203", k = 3
  Output: "1203"
  Explanation: Removing 4, 7 and 9 leaves "1203"; no other choice of three digits is smaller.
  ```

  ### Example 2
  ```
  Input:  serial = "30051", k = 1
  Output: "51"
  Explanation: Removing the 3 leaves "0051", which is the number 51.
  ```

  ### Example 3
  ```
  Input:  serial = "88", k = 2
  Output: "0"
  ```

  ### Constraints
  - `1 <= serial.length <= 10^5`
  - `serial` consists of the digits `0`-`9` only
  - `0 <= k <= serial.length`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_after_removing_digits
  params:
    - {name: serial, type: "string"}
    - {name: k, type: "int"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def smallest_after_removing_digits(serial: str, k: int) -> str:
        kept: list[str] = []
        remaining = k
        for digit in serial:
            # A larger digit before a smaller one is never worth keeping.
            while remaining and kept and kept[-1] > digit:
                kept.pop()
                remaining -= 1
            kept.append(digit)
        if remaining:
            del kept[len(kept) - remaining:]
        return "".join(kept).lstrip("0") or "0"
  javascript: |
    function smallestAfterRemovingDigits(serial, k) {
      const kept = [];
      let remaining = k;
      for (const digit of serial) {
        while (remaining > 0 && kept.length && kept[kept.length - 1] > digit) {
          kept.pop();
          remaining--;
        }
        kept.push(digit);
      }
      kept.length -= remaining;
      let start = 0;
      while (start < kept.length && kept[start] === "0") start++;
      const result = kept.slice(start).join("");
      return result === "" ? "0" : result;
    }
tests:
  - {id: t1, args: ["4719203", 3], expected: "1203", description: "Example 1 - greedy pops of larger earlier digits"}
  - {id: t2, args: ["30051", 1], expected: "51", description: "Example 2 - leading zeros exposed after removal are stripped"}
  - {id: t3, args: ["88", 2], expected: "0", description: "Example 3 - everything removed returns 0"}
  - {id: t4, hidden: true, args: ["9", 0], expected: "9", description: "Minimum input with nothing to remove"}
  - {id: t5, hidden: true, args: ["123456", 2], expected: "1234", description: "Non-decreasing serial - removals must come from the end"}
  - {id: t6, hidden: true, args: ["987654", 3], expected: "654", description: "Strictly decreasing - pops the first k digits"}
  - {id: t7, hidden: true, args: ["000123", 0], expected: "123", description: "k = 0 still strips leading zeros of the input"}
  - {id: t8, hidden: true, args: ["100200", 1], expected: "200", description: "Removing the leading 1 leaves only zeros and 200"}
  - {id: t9, hidden: true, args: ["1111111", 3], expected: "1111", description: "All identical digits - ties must not trigger pops"}
  - {id: t10, hidden: true, args: ["5337231904", 4], expected: "231904", description: "Mixed digits with duplicates; pops chain several levels deep"}
  - {id: t11, hidden: true, args: ["", 400], expected: "", description: "Stress - 1000 random digits, remove 400; result longer than any integer type"}
expected_concepts:
  - "greedy - a larger digit followed by a smaller one should be removed"
  - "monotonic non-decreasing stack of kept digits"
  - "trimming leftover removals from the end"
  - "string result rather than numeric parsing"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Argues that the leftmost position where a digit is larger than its successor is the best digit to remove, turns that into a single pass with a non-decreasing stack, trims any leftover removals from the end and normalises leading zeros and the empty result."
  good: "Finds the greedy stack solution but needs prompting for leftover removals or the leading-zero and empty cases."
  weak: "Tries all combinations of removed digits, repeats a full rescan for each removal without justification, or converts the serial to an integer and overflows."
  criteria:
    correctness: "All tests pass, including k equal to the length, k = 0 and serials with leading zeros."
    efficiency: "Linear time; each digit is pushed and popped at most once."
    code_quality: "Single loop with a clear stack invariant; normalisation handled in one place at the end."
    edge_cases: "Non-decreasing serials, repeated digits, zeros exposed at the front and removing everything."
    communication: "Explains why removing an earlier larger digit always beats removing a later one."
hints:
  - "Numbers with the same number of digits are compared from the left, so the earliest digits matter most; which digit, if removed, makes the biggest improvement?"
  - "Whenever a digit is followed by a smaller digit, deleting the larger one makes the number smaller; you can apply this rule while scanning left to right if you keep the digits you have decided to keep so far."
  - "Scan the serial with a stack of kept digits: while removals remain and the top of the stack is larger than the current digit, pop it and spend one removal, then push the current digit; afterwards drop any unused removals from the end, strip leading zeros and return zero if nothing is left."
followups:
  - "How would you produce the largest possible number instead?"
  - "What if exactly k digits must be kept rather than removed?"
  - "How would you prove the greedy choice is optimal with an exchange argument?"
common_errors:
  - "Forgetting to remove leftover digits from the end when the serial is non-decreasing."
  - "Returning an empty string instead of \"0\" when every digit is removed."
  - "Parsing the serial as an integer, which overflows for long serials and loses the leading-zero positions."
  - "Popping on equal digits, which wastes removals."
