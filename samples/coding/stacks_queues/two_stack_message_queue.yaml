title: "Message Queue From Two Stacks"
difficulty: easy
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [backend, platform, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Message Queue From Two Stacks

  A message broker running on a small embedded controller only ships a stack primitive (push, pop, look at
  the top, size). The team needs a first-in-first-out message queue on top of it, built from **two stacks**,
  where every operation runs in amortized `O(1)` time.

  Simulate the queue for a list of operations, in order:

  - `"enqueue x"` - add message id `x` at the back of the queue (no output);
  - `"dequeue"` - remove and output the message at the front, or output `-1` if the queue is empty;
  - `"peek"` - output the message at the front without removing it, or `-1` if the queue is empty;
  - `"size"` - output the number of messages currently in the queue.

  Write `simulate_two_stack_queue(ops)` that returns the outputs of all `"dequeue"`, `"peek"` and `"size"`
  operations, in order. Model the queue with two stacks rather than a built-in queue type.

  ### Example 1
  ```
  Input:  ops = ["enqueue 7", "enqueue 3", "peek", "dequeue", "enqueue 9", "size", "dequeue", "dequeue", "dequeue"]
  Output: [7, 7, 2, 3, 9, -1]
  Explanation: Messages leave in arrival order 7, 3, 9; the last dequeue finds the queue empty.
  ```

  ### Example 2
  ```
  Input:  ops = ["size", "peek", "enqueue 0", "size"]
  Output: [0, -1, 1]
  ```

  ### Constraints
  - `0 <= ops.length <= 10^5`
  - Each operation is `"enqueue x"`, `"dequeue"`, `"peek"` or `"size"`.
  - `0 <= x <= 10^9`

  **Follow-up:** explain why each message is moved between the two stacks at most once, and what that means for the total cost.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: simulate_two_stack_queue
  params:
    - {name: ops, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def simulate_two_stack_queue(ops: list[str]) -> list[int]:
        inbox: list[int] = []   # receives new messages
        outbox: list[int] = []  # top is the oldest message
        results: list[int] = []

        def refill() -> None:
            if not outbox:
                while inbox:
                    outbox.append(inbox.pop())

        for op in ops:
            if op == "dequeue":
                refill()
                results.append(outbox.pop() if outbox else -1)
            elif op == "peek":
                refill()
                results.append(outbox[-1] if outbox else -1)
            elif op == "size":
                results.append(len(inbox) + len(outbox))
            else:
                inbox.append(int(op.split()[1]))
        return results
  javascript: |
    function simulateTwoStackQueue(ops) {
      const inbox = [];
      const outbox = [];
      const results = [];
      const refill = () => {
        if (outbox.length === 0) {
          while (inbox.length > 0) outbox.push(inbox.pop());
        }
      };
      for (const op of ops) {
        if (op === "dequeue") {
          refill();
          results.push(outbox.length > 0 ? outbox.pop() : -1);
        } else if (op === "peek") {
          refill();
          results.push(outbox.length > 0 ? outbox[outbox.length - 1] : -1);
        } else if (op === "size") {
          results.push(inbox.length + outbox.length);
        } else {
          inbox.push(Number(op.split(" ")[1]));
        }
      }
      return results;
    }
