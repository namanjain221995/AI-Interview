expected_concepts:
  - "two-stack queue (inbox and outbox)"
  - "lazy transfer only when the outgoing stack is empty"
  - "amortized O(1) analysis"
  - "size as the sum of both stacks"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Uses an incoming and an outgoing stack, transfers only when the outgoing stack is empty, explains the amortized O(1) argument, and handles empty reads and size correctly."
  good: "Correct two-stack queue that may transfer more often than needed but stays correct, with complexity explained after a prompt."
  weak: "Moves everything back and forth on every operation, breaks FIFO order when enqueueing while the outgoing stack is non-empty, or uses a built-in queue and cannot explain the two-stack design."
  criteria:
    correctness: "All tests pass, including interleaved enqueues and dequeues and empty reads."
    efficiency: "Amortized constant time per operation; each message is transferred at most once."
    code_quality: "A small helper performs the lazy transfer; dequeue and peek share it."
    edge_cases: "Empty queue reads, duplicates, extreme ids, peek not removing."
    communication: "Explains why refilling only when the outgoing stack is empty preserves FIFO order."
hints:
  - "Pushing items onto one stack and then popping them all onto a second stack reverses their order; what does the second stack give you at the top?"
  - "Use one stack only for incoming messages and the other only for outgoing ones, and move items across only when you need the front and the outgoing stack has nothing."
  - "Enqueue pushes onto the incoming stack; for dequeue and peek, if the outgoing stack is empty, pop every message from the incoming stack onto it, then read or pop its top or report minus one; size is the sum of both stacks, and since each message crosses over only once the cost is amortized constant."
followups:
  - "How would you build a stack from two queues, and what does it cost?"
  - "How would you add a 'min' query to this queue in amortized O(1)?"
  - "How would you make this queue safe for one producer and one consumer thread?"
common_errors:
  - "Transferring from the incoming stack while the outgoing stack still has messages, which breaks FIFO order."
  - "Moving all messages back to the incoming stack after every dequeue, making the cost quadratic."
  - "Computing size from only one of the two stacks."
  - "Letting peek remove the front message."
