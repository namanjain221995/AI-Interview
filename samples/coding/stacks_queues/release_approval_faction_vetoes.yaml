slug: release_approval_faction_vetoes
title: Release Approval Faction Vetoes
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Release Approval Faction Vetoes

  A release board decides whether a risky deployment ships. Every reviewer belongs to one of two
  camps: `A` (wants to **approve** the release) or `B` (wants to **block** it). The string `reviewers`
  lists the camps in a fixed speaking order: `reviewers[i]` is the camp of reviewer `i`.

  The board meets in rounds. In each round the reviewers who are still on the board take one turn
  each, in increasing index order. A reviewer removed earlier in the round does not get a turn. On
  their turn a reviewer uses one **veto**: they permanently remove the opposing reviewer who would
  speak **soonest after them**. To find that reviewer, scan forward from the current position, skipping
  removed reviewers and members of the same camp, and wrap around to index `0` if needed (so an
  opponent who already spoke this round can be removed before the next round).

  As soon as every reviewer still on the board belongs to the same camp, the meeting ends and that camp
  wins. Return `"A"` or `"B"`.

  ### Example 1
  ```
  Input:  reviewers = "ABB"
  Output: "B"
  Explanation: reviewer 0 (A) removes reviewer 1 (B); reviewer 2 (B) wraps around and removes
  reviewer 0, leaving only B
  ```

  ### Example 2
  ```
  Input:  reviewers = "AABBB"
  Output: "A"
  Explanation: round 1 - reviewer 0 removes 2, reviewer 1 removes 3, reviewer 4 wraps around and
  removes 0; round 2 - reviewer 1 removes 4, leaving only A
  ```

  ### Example 3
  ```
  Input:  reviewers = "BAAB"
  Output: "B"
  ```

  ### Constraints
  - `1 <= reviewers.length <= 10^4`
  - `reviewers[i]` is `'A'` or `'B'`

  **Follow-up:** replaying the scan for every turn is `O(n^2)`. Can you simulate the meeting in `O(n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: winning_review_faction
  params:
    - {name: reviewers, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def winning_review_faction(reviewers: str) -> str:
        n = len(reviewers)
        approve: deque[int] = deque()
        block: deque[int] = deque()
        for i, camp in enumerate(reviewers):
            (approve if camp == "A" else block).append(i)
        while approve and block:
            a = approve.popleft()
            b = block.popleft()
            # Whoever speaks first removes the other and rejoins the line for the next round.
            if a < b:
                approve.append(a + n)
            else:
                block.append(b + n)
        return "A" if approve else "B"
  javascript: |
    function winningReviewFaction(reviewers) {
      const n = reviewers.length;
      const approve = [];
      const block = [];
      for (let i = 0; i < n; i++) {
        if (reviewers[i] === "A") approve.push(i);
        else block.push(i);
      }
      let ha = 0;
      let hb = 0;
      while (ha < approve.length && hb < block.length) {
        const a = approve[ha++];
        const b = block[hb++];
        if (a < b) approve.push(a + n);
        else block.push(b + n);
      }
      return ha < approve.length ? "A" : "B";
    }
tests:
  - {id: t1, args: ["ABB"], expected: "B", description: "Example 1 - the second B wraps around and removes the A"}
  - {id: t2, args: ["AABBB"], expected: "A", description: "Example 2 - smaller camp wins by speaking first"}
  - {id: t3, args: ["BAAB"], expected: "B", description: "Example 3 - survivor of round 1 acts first in round 2"}
  - {id: t4, hidden: true, args: ["A"], expected: "A", description: "Single reviewer"}
  - {id: t5, hidden: true, args: ["BBBB"], expected: "B", description: "Only one camp present - no vetoes needed"}
  - {id: t6, hidden: true, args: ["AB"], expected: "A", description: "Minimum contested board - first speaker wins"}
  - {id: t7, hidden: true, args: ["ABABABAB"], expected: "A", description: "Alternating camps of equal size"}
  - {id: t8, hidden: true, args: ["BBAAAAA"], expected: "A", description: "Majority camp wins even though the other camp speaks first"}
  - {id: t9, hidden: true, args: ["AAAAABBBBBB"], expected: "A", description: "Long blocks - the smaller camp speaks first and wins over several rounds"}
  - {id: t10, hidden: true, args: [""], expected: "B", description: "Stress: 1000 reviewers in pseudo-random order"}
expected_concepts:
  - simulation with two queues of speaking positions
  - the earlier speaker always removes the next opponent in line
  - re-queueing a survivor with index plus n for the next round
  - O(n) total work because every comparison removes one reviewer
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Restates the cyclic veto rule precisely, observes that only the front of each camp's line matters, implements the two-queue simulation with index + n re-queueing and argues O(n) time because every step removes one reviewer."
  good: "Gets a correct simulation (for example a queue of all reviewers plus pending-veto counters) with minor prompting, or a correct O(n^2) scan that is then improved toward the queue idea."
  weak: "Counts camp sizes and returns the majority, removes the first opponent from index 0 instead of the next one in speaking order, or forgets that removed reviewers lose their turn."
  criteria:
    correctness: "All tests pass, including wrap-around vetoes and inputs where the minority camp wins."
    efficiency: "Linear time using queues or counters instead of rescanning the string for every veto."
    code_quality: "Clear names for the two lines of reviewers and a loop condition that states when the meeting ends."
    edge_cases: "Single reviewer, one camp only, alternating camps and long blocks of the same camp."
    communication: "Explains why removing the soonest opponent is what the rule demands and how the next round is modelled."
hints:
  - "Simulate a few small boards by hand and notice that the reviewer who speaks earliest among all survivors always acts next."
  - "Keep each camp's surviving reviewers in speaking order; at every step only the first reviewer of each camp matters, and the one who speaks earlier removes the other."
  - "Use two queues of indices; pop the front of both, and the smaller index survives and is pushed back with its index increased by the board size so it speaks again next round, while the other is dropped; stop when one queue is empty."
followups:
  - "How would the answer change if each reviewer removed the nearest opponent before them instead of after them?"
  - "What if there were three camps and each reviewer removed the next reviewer from any other camp?"
  - "Can you solve it with a single pass and two counters of pending vetoes instead of queues?"
common_errors:
  - "Returning the camp with more members, which fails when the minority speaks first."
  - "Removing the first opponent in the whole string instead of the next one after the current speaker."
  - "Letting a reviewer who was already removed in the current round still use a veto."
  - "Re-queueing survivors with their original index, which breaks the speaking order of the next round."
