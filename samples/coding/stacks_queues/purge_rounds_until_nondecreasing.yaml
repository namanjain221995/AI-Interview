slug: purge_rounds_until_nondecreasing
title: Purge Rounds Until Non-Decreasing
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, backend, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Purge Rounds Until Non-Decreasing

  A cumulative meter (for example a disk-usage counter) should never go down, so a data-cleaning job
  treats any dip as a glitch. The job works in **rounds** over the list `readings`:

  - In one round, every reading that is **strictly smaller** than the reading immediately to its left
    *at the start of that round* is marked, and then all marked readings are removed **at the same
    time**.
  - The first reading is never removed. Equal neighbours are fine.
  - The job stops as soon as a round would remove nothing.

  Return the number of rounds that removed at least one reading. Return `0` if the list is already
  non-decreasing.

  ### Example 1
  ```
  Input:  readings = [6, 3, 4, 2, 8, 7, 9]
  Output: 2
  Explanation: round 1 removes 3, 2 and 7 -> [6, 4, 8, 9]; round 2 removes 4 -> [6, 8, 9]; nothing else is removed
  ```

  ### Example 2
  ```
  Input:  readings = [1, 2, 2, 5]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  readings = [10, 1, 2, 3, 4]
  Output: 4
  Explanation: only one reading has a larger left neighbour in each round: 1, then 2, then 3, then 4
  ```

  ### Constraints
  - `1 <= readings.length <= 10^5`
  - `-10^9 <= readings[i] <= 10^9`

  **Follow-up:** simulating round by round can take `O(n^2)` time. Can you compute the answer in `O(n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: purge_rounds_until_nondecreasing
  params:
    - {name: readings, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def purge_rounds_until_nondecreasing(readings: list[int]) -> int:
        # Stack of (value, round in which that reading is removed; 0 means it survives).
        stack: list[tuple[int, int]] = []
        rounds = 0
        for value in readings:
            removed_at = 0
            while stack and stack[-1][0] <= value:
                removed_at = max(removed_at, stack.pop()[1])
            removed_at = removed_at + 1 if stack else 0
            stack.append((value, removed_at))
            rounds = max(rounds, removed_at)
        return rounds
  javascript: |
    function purgeRoundsUntilNondecreasing(readings) {
      // Parallel stacks: value and the round in which that reading is removed (0 means it survives).
      const values = [];
      const removedAt = [];
      let rounds = 0;
      for (const value of readings) {
        let round = 0;
        while (values.length > 0 && values[values.length - 1] <= value) {
          values.pop();
          round = Math.max(round, removedAt.pop());
        }
        round = values.length > 0 ? round + 1 : 0;
        values.push(value);
        removedAt.push(round);
        rounds = Math.max(rounds, round);
      }
      return rounds;
    }
