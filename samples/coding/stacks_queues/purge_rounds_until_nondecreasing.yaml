expected_concepts:
  - simulation baseline and why it is quadratic in the worst case
  - removal round of a reading depends on the readings between it and its nearest larger left reading
  - monotonic stack of (value, removal round) pairs
  - each reading is pushed and popped at most once for O(n) time
  - equal neighbours are never removed (non-strict comparison when popping)
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Starts from a correct simulation, explains why it can be O(n^2), then derives that a reading's removal round is one more than the latest removal round among the smaller-or-equal readings between it and the nearest strictly larger reading to its left; implements this with a monotonic stack and proves O(n) with the push-once/pop-once argument."
  good: "Implements a correct round-by-round simulation with linked lists or a work queue that only re-checks affected positions, or reaches the stack solution with substantial hints."
  weak: "Only rescans the whole list every round without noticing the cost, removes readings one at a time instead of simultaneously, or mishandles equal neighbours."
  criteria:
    correctness: "All tests pass, including equal readings, negatives and long chains of removals."
    efficiency: "Linear time using a monotonic stack; a quadratic rescanning simulation is noted as the baseline only."
    code_quality: "The stack entries and the meaning of the stored round are named and commented clearly."
    edge_cases: "Single reading, already sorted input, strictly decreasing input and equal neighbours."
    communication: "Explains the simultaneous-removal rule and argues why the stored round values are correct."
hints:
  - "Simulate a few rounds by hand and record in which round each reading disappears. Which readings survive forever, and what decides the round of the others?"
  - "A reading that is removed is eventually compared with the nearest strictly larger reading to its left; it disappears one round after the last of the readings between them has gone. Can you keep candidates for that nearest larger reading in a stack?"
  - "Scan left to right with a stack of value and removal round pairs: pop every entry whose value is at most the current reading while remembering the largest round popped; if the stack is then empty the reading survives with round zero, otherwise its round is that largest popped round plus one; push it and track the maximum round."
followups:
  - "How would you return the final list of readings that survive, not just the number of rounds?"
  - "What changes if a reading is removed when it is strictly larger than its right neighbour instead?"
  - "How would you process the readings as a stream, reporting the current answer after each new reading?"
common_errors:
  - "Removing readings one by one within a round, so later comparisons use a neighbour that should still be present."
  - "Popping only strictly smaller values, which breaks the case of equal readings."
  - "Assigning round one to every removed reading, ignoring chains that must wait for earlier removals."
  - "Rescanning the entire list each round, which is O(n^2) for inputs like a large first value followed by an increasing run."
