expected_concepts:
  - "monotonic deque of indices"
  - "removing smaller samples from the back"
  - "expiring the front index when it leaves the window"
  - "each index pushed and popped at most once for O(n)"
optimal_complexity: {time: "O(n)", space: "O(k)"}
rubric:
  excellent: "Builds a decreasing deque of indices, removes dominated samples from the back and expired indices from the front, handles ties correctly and explains why the total work is O(n)."
  good: "Correct deque solution after some guidance, or a heap-based O(n log n) solution with lazy deletion explained clearly."
  weak: "Only re-scans each window in O(n * k), stores values without indices so expiry fails with duplicates, or produces the wrong number of windows."
  criteria:
    correctness: "All tests pass, including ties, k = 1 and k = n."
    efficiency: "Linear time with a monotonic deque; a heap is acceptable but not optimal."
    code_quality: "Clear separation of the three deque steps: drop smaller, push, expire."
    edge_cases: "Window of one, window covering everything, monotonic inputs and repeated values."
    communication: "Explains why a sample dominated by a newer, larger sample can never become a peak."
hints:
  - "When the window slides by one, only one sample leaves and one enters. A sample that has a newer, larger-or-equal sample in the same window can never be a peak again."
  - "Keep a double-ended queue of indices whose sample values decrease from front to back; the front then holds the peak of the current window."
  - "For each new index, remove indices from the back while their value is not greater than the new value, add the new index at the back, remove the front index if it has slid out of the window, and once at least k samples have been seen record the value at the front."
followups:
  - "How would you report the minimum and maximum of every window at the same time?"
  - "How would you adapt this to windows defined by time (for example the last 5 minutes) instead of a sample count?"
  - "What changes if samples arrive as an unbounded stream and you must emit each peak as soon as its window is complete?"
  - "When would a heap-based approach be preferable to the deque?"
common_errors:
  - "Storing values instead of indices, so the front cannot be expired correctly when values repeat."
  - "Expiring the front with an off-by-one and keeping a sample from the previous window."
  - "Recording results before the first window is full."
  - "Re-scanning each window, which is O(n * k)."
