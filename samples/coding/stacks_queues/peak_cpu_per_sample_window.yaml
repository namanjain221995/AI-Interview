slug: peak_cpu_per_sample_window
title: "Peak CPU per Sample Window"
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [sre, devops, backend, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Peak CPU per Sample Window

  A capacity report samples a service's CPU usage at fixed intervals, in millicores, giving `samples`.
  For headroom planning the team wants the **peak** of every window of `k` consecutive samples: the
  first window covers samples `0..k-1`, the next `1..k`, and so on until the window that ends at the
  last sample.

  Return the `n - k + 1` window peaks in order, from the first window to the last, where `n` is the
  number of samples.

  Re-scanning every window costs `O(n * k)`; aim for `O(n)` overall.

  ### Example 1
  ```
  Input:  samples = [30, 75, 40, 90, 20, 20, 60], k = 3
  Output: [75, 90, 90, 90, 60]
  Explanation: the windows are [30, 75, 40], [75, 40, 90], [40, 90, 20], [90, 20, 20] and [20, 20, 60]
  ```

  ### Example 2
  ```
  Input:  samples = [12, 8, 5], k = 1
  Output: [12, 8, 5]
  ```

  ### Constraints
  - `1 <= k <= n <= 10^5`
  - `0 <= samples[i] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: window_peak_cpu
  params:
    - {name: samples, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def window_peak_cpu(samples: list[int], k: int) -> list[int]:
        window: deque[int] = deque()
        peaks: list[int] = []
        for i, value in enumerate(samples):
            while window and samples[window[-1]] <= value:
                window.pop()
            window.append(i)
            if window[0] <= i - k:
                window.popleft()
            if i >= k - 1:
                peaks.append(samples[window[0]])
        return peaks
  javascript: |
    function windowPeakCpu(samples, k) {
      const window = new Array(samples.length);
      let head = 0;
      let tail = 0;
      const peaks = [];
      for (let i = 0; i < samples.length; i++) {
        while (tail > head && samples[window[tail - 1]] <= samples[i]) tail--;
        window[tail++] = i;
        if (window[head] <= i - k) head++;
        if (i >= k - 1) peaks.push(samples[window[head]]);
      }
      return peaks;
    }
