slug: deepest_call_chain_in_trace
title: Deepest Call Chain in a Trace
difficulty: easy
competency_keys: [data_structures, algorithms, debugging]
role_tags: [backend, sre, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Deepest Call Chain in a Trace

  A lightweight tracer instruments a service and writes one event each time a function starts or
  finishes: `"enter <name>"` when a call begins and `"exit <name>"` when it returns. Calls are properly
  nested, so every `exit` closes the most recently entered call that is still open.

  While debugging a stack overflow, you want the **deepest call chain** the service reached. Return the
  list of functions that were open at the **first moment** the trace reached its maximum nesting depth,
  ordered from the outermost call to the innermost one.

  - If several moments reach the same maximum depth, use the earliest one.
  - The same function name may appear several times in a chain (recursion).
  - The trace may stop while some calls are still open (the service was killed); those calls count as
    open from their `enter` event onwards.
  - For an empty trace, return an empty list.

  ### Example 1
  ```
  Input:  trace = ["enter main", "enter load_config", "exit load_config", "enter handle", "enter query", "enter retry", "exit retry", "exit query", "exit handle", "exit main"]
  Output: ["main", "handle", "query", "retry"]
  Explanation: the depth peaks at 4 when retry is entered inside query, handle and main
  ```

  ### Example 2
  ```
  Input:  trace = ["enter api", "enter auth", "exit auth", "exit api", "enter worker", "enter encode", "exit encode", "exit worker"]
  Output: ["api", "auth"]
  Explanation: depth 2 is reached twice; the chain api -> auth comes first
  ```

  ### Example 3
  ```
  Input:  trace = []
  Output: []
  ```

  ### Constraints
  - `0 <= trace.length <= 10^4`
  - Each event is `"enter <name>"` or `"exit <name>"`, where `<name>` is 1 to 30 characters of lowercase
    letters, digits and underscores.
  - Every `exit` names the innermost open call; the trace may end with calls still open.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: deepest_call_chain
  params:
    - {name: trace, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def deepest_call_chain(trace: list[str]) -> list[str]:
        # Pass 1: find the maximum depth.
        depth = 0
        max_depth = 0
        for event in trace:
            depth += 1 if event.startswith("enter ") else -1
            max_depth = max(max_depth, depth)
        if max_depth == 0:
            return []
        # Pass 2: replay with a real stack and stop the first time that depth is reached.
        stack: list[str] = []
        for event in trace:
            kind, name = event.split(" ", 1)
            if kind == "enter":
                stack.append(name)
                if len(stack) == max_depth:
                    return stack
            else:
                stack.pop()
        return stack
  javascript: |
    function deepestCallChain(trace) {
      // Single pass: snapshot the stack whenever a new strict maximum depth is reached.
      const stack = [];
      let best = [];
      for (const event of trace) {
        const space = event.indexOf(" ");
        const kind = event.slice(0, space);
        const name = event.slice(space + 1);
        if (kind === "enter") {
          stack.push(name);
          if (stack.length > best.length) best = stack.slice();
        } else {
          stack.pop();
        }
      }
      return best;
    }
