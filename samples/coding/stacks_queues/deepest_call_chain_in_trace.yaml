expected_concepts:
  - stack of currently open calls
  - push on enter, pop on exit
  - capture the chain only when a strictly greater depth is reached (earliest tie)
  - avoiding repeated full copies, for example with a first pass that finds the maximum depth
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Simulates the call stack, captures the chain at the first strict new maximum, handles truncated traces and empty input, and notes that copying at every new maximum can cost O(n^2) on a steadily deepening trace, fixing it with a two-pass replay or equivalent."
  good: "Correct stack simulation that snapshots on each new maximum, with the right tie rule and edge cases after a hint or two."
  weak: "Returns only the depth, records the stack at the last maximum instead of the first, or returns a reference to the live stack that keeps changing."
  criteria:
    correctness: "All tests pass, including ties, recursion, truncated traces and the empty trace."
    efficiency: "Linear time; the chain is copied once (or the cost of repeated copies is discussed)."
    code_quality: "Event parsing is separated from the stack logic and names are clear."
    edge_cases: "Empty trace, a single open call, ties on the maximum depth and recursive names."
    communication: "Explains the strict comparison used for the earliest tie and why the stack mirrors the open calls."
hints:
  - "At any moment, which functions are open, and in what order were they entered?"
  - "Replay the events with a stack of open calls; the depth is the stack size, and you only care about moments when an enter makes the stack deeper than ever before."
  - "Push the name on every enter and pop on every exit; when the stack size becomes strictly larger than the best depth seen so far, record a copy of the stack, or find the maximum depth in a first pass and return the stack the first time a replay reaches it; an empty trace gives an empty list."
followups:
  - "How would you also return the event index at which the deepest chain was reached?"
  - "How would you validate the trace and report the first exit that does not match the innermost open call?"
  - "How would you compute the total time spent in each function if every event carried a timestamp?"
common_errors:
  - "Using a non-strict comparison, which reports the last chain that reaches the maximum instead of the first."
  - "Returning the live stack object after more events have modified it."
  - "Assuming every call is closed, which breaks on truncated traces."
  - "Copying the full stack on every enter event, which is quadratic on deep traces."
