signature:
  function_name: editor_final_text
  params:
    - {name: commands, type: "string[]"}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def editor_final_text(commands: list[str]) -> str:
        chars: list[str] = []
        undo_stack: list[tuple[str, str]] = []  # (kind, text added or removed)
        redo_stack: list[tuple[str, str]] = []

        def apply(kind: str, text: str) -> None:
            if kind == "type":
                chars.extend(text)
            elif text:
                del chars[len(chars) - len(text):]

        def revert(kind: str, text: str) -> None:
            if kind == "type":
                del chars[len(chars) - len(text):]
            else:
                chars.extend(text)

        for command in commands:
            if command == "undo":
                if undo_stack:
                    edit = undo_stack.pop()
                    revert(*edit)
                    redo_stack.append(edit)
            elif command == "redo":
                if redo_stack:
                    edit = redo_stack.pop()
                    apply(*edit)
                    undo_stack.append(edit)
            else:
                verb, argument = command.split(" ", 1)
                if verb == "type":
                    edit = ("type", argument)
                else:
                    k = min(int(argument), len(chars))
                    edit = ("delete", "".join(chars[len(chars) - k:]) if k else "")
                apply(*edit)
                undo_stack.append(edit)
                redo_stack.clear()
        return "".join(chars)
  javascript: |
    function editorFinalText(commands) {
      let text = "";
      const undoStack = []; // [kind, text added or removed]
      const redoStack = [];
      const apply = ([kind, s]) => {
        text = kind === "type" ? text + s : text.slice(0, text.length - s.length);
      };
      const revert = ([kind, s]) => {
        text = kind === "type" ? text.slice(0, text.length - s.length) : text + s;
      };
      for (const command of commands) {
        if (command === "undo") {
          if (undoStack.length > 0) {
            const edit = undoStack.pop();
            revert(edit);
            redoStack.push(edit);
          }
        } else if (command === "redo") {
          if (redoStack.length > 0) {
            const edit = redoStack.pop();
            apply(edit);
            undoStack.push(edit);
          }
        } else {
          const space = command.indexOf(" ");
          const verb = command.slice(0, space);
          const argument = command.slice(space + 1);
          let edit;
          if (verb === "type") {
            edit = ["type", argument];
          } else {
            const k = Math.min(Number(argument), text.length);
            edit = ["delete", text.slice(text.length - k)];
          }
          apply(edit);
          undoStack.push(edit);
          redoStack.length = 0;
        }
      }
      return text;
    }
