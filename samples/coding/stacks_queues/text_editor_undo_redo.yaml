time_limit_minutes: 20
prompt_markdown: |
  ## Text Editor Undo and Redo

  A ticket-comment widget holds a single line of text that starts **empty**. Its event log replays the
  user's actions as a list of commands, and you must reconstruct the text the user ended up with.

  | Command | Effect |
  |---------|--------|
  | `"type <text>"` | Appends `<text>`: **everything after the first space**, exactly as written (it is never empty and may itself contain or start with spaces). |
  | `"delete <k>"` | Removes the last `k` characters; if the text is shorter than `k`, it becomes empty. |
  | `"undo"` | Reverts the most recent edit that has not already been undone. |
  | `"redo"` | Re-applies the edit that was undone most recently and has not been redone yet. |

  Rules:
  - Every `type` and every `delete` counts as **one edit**, even a `delete` that removes nothing
    (undoing or redoing such an edit leaves the text unchanged).
  - A new `type` or `delete` **clears the redo history**: edits undone before it can no longer be redone.
  - `undo` with nothing left to undo, and `redo` with nothing left to redo, do nothing.

  Return the final text.

  ### Example 1
  ```
  Input:  commands = ["type hello", "type  world", "delete 3", "undo", "type !"]
  Output: "hello world!"
  Explanation: the second command appends " world" (with its leading space); the delete leaves "hello wo", the undo restores "hello world", then "!" is appended
  ```

  ### Example 2
  ```
  Input:  commands = ["type abc", "undo", "undo", "redo", "redo", "delete 10", "undo", "type d", "redo"]
  Output: "abcd"
  Explanation: the second undo and the second redo have nothing to act on; "delete 10" empties the text and is undone; typing "d" clears the redo history, so the final redo does nothing
  ```

  ### Constraints
  - `0 <= commands.length <= 10^4`
  - Each command is `"type <text>"`, `"delete <k>"`, `"undo"` or `"redo"`
  - `<text>` has `1` to `100` printable ASCII characters (spaces allowed)
  - `1 <= k <= 10^4`

  **Follow-up:** storing a full copy of the text for every edit can use a lot of memory. What is the
  least information you need to keep per edit to undo and redo it?
