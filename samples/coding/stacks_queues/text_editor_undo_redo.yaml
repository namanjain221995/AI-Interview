expected_concepts:
  - two stacks for undo and redo history
  - clearing the redo stack on every new edit
  - storing the removed characters so a delete can be undone
  - clamping a delete to the current length
  - parsing only the first space so typed text keeps its spaces
optimal_complexity: {time: O(total characters typed and deleted), space: O(total characters typed and deleted)}
rubric:
  excellent: "Designs undo and redo as two stacks of reversible edits, records exactly the characters each delete removed, clears redo on a new edit, treats empty deletes and empty histories correctly, and explains the memory trade-off against full snapshots."
  good: "Gets a correct solution, possibly with full-text snapshots, and handles the redo-clearing rule after a hint or a failing case."
  weak: "Forgets to clear redo after a new edit, loses the deleted characters so undo cannot restore them, or splits the type command on every space."
  criteria:
    correctness: "All tests pass, including empty deletes, redo after a new edit and text with spaces."
    efficiency: "Work proportional to the characters each edit touches rather than copying the whole text per command."
    code_quality: "Small helpers that apply and revert one edit, so undo and redo stay symmetrical."
    edge_cases: "Empty command list, undo or redo with empty history, delete longer than the text, leading spaces in typed text."
    communication: "Explains why a delete must remember what it removed and why a new edit invalidates redo."
hints:
  - "Think of every edit as something that can be reversed; what does each kind of edit need to remember so it can be reversed later?"
  - "Use one stack of edits that can be undone and another of edits that can be redone; an undo moves an edit from the first to the second, a redo moves it back, and a fresh edit empties the second."
  - "Record a type as the text it appended and a delete as the exact characters it removed (possibly none, after clamping to the current length). Undo removes the appended text or re-appends the removed characters; redo applies the edit again. Split each command only at its first space."
followups:
  - "How would you support a cursor so that typing and deleting can happen in the middle of the text?"
  - "How would you cap the undo history at the last 100 edits without slowing every command?"
  - "How would you merge consecutive single-character types into one undo step, as many editors do?"
common_errors:
  - "Not clearing the redo stack when a new type or delete arrives."
  - "Remembering only the count k for a delete, so undo cannot restore the removed characters."
  - "Splitting on every space and losing spaces inside the typed text."
  - "Skipping deletes on empty text instead of recording them as edits, which makes a later undo revert the wrong edit."
