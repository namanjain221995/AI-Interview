expected_concepts:
  - "lane modelled as a stack or ordered list"
  - "cost depends only on the number of vans in front"
  - "removal from the middle while preserving order"
  - "ignoring arrivals in the total"
optimal_complexity: {time: "O(n * m) with a list, m = vans parked at once (O(n log n) with a Fenwick tree over arrival times)", space: "O(m)"}
rubric:
  excellent: "Models the lane as an ordered list, derives the 2k + 1 cost per retrieval without simulating each individual move, removes the van while keeping order, and can describe an O(n log n) counting approach as a follow-up."
  good: "Correct simulation with explicit temporary stacks or a list, possibly after clarifying how arrivals are counted."
  weak: "Counts arrivals, reverses the order of the waiting vans, forgets the van's own move, or loses track of vans that re-enter."
  criteria:
    correctness: "All tests pass, including re-entering vans and retrievals from the middle."
    efficiency: "One position lookup and removal per retrieval; no rebuilding of the lane from the log."
    code_quality: "Readable parsing of entries and a clear cost formula."
    edge_cases: "Empty log, only arrivals, retrieval of the van nearest the exit and of the deepest van."
    communication: "Explains why the lane order is unchanged apart from the removed van."
hints:
  - "The lane is a stack, but a retrieval from the middle temporarily removes the vans above the target and then puts them back unchanged."
  - "The cost of a retrieval depends only on how many vans are currently parked after the target; afterwards the lane is the same sequence with the target removed."
  - "Keep the lane as an ordered list. On an out entry, find the van's position, add twice the number of vans after it plus one, and remove the van while keeping the others in their order. Arrivals only append to the list and add nothing to the total."
followups:
  - "How would you make each retrieval O(log n) using arrival timestamps and a Fenwick tree?"
  - "What if waiting vans could re-enter in any order and you wanted to minimise future moves?"
  - "How would you validate the log and report the first inconsistent entry?"
  - "How would the cost change for a lane with exits at both ends?"
common_errors:
  - "Counting arrivals as moves."
  - "Forgetting the move of the retrieved van itself (using 2k instead of 2k + 1)."
  - "Putting the waiting vans back in reverse order."
  - "Assuming a van id can never reappear after it has left."
