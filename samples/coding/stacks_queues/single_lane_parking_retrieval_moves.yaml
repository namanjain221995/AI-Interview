prompt_markdown: |
  ## Single-Lane Parking Retrieval Moves

  A depot parks its service vans in a narrow dead-end lane. Vans enter and leave only through the open
  end, so the van that entered last is the one nearest the exit. The depot log `ops` is processed in
  order and each entry is one of:

  - `"in X"`: van `X` drives in and parks nearest the exit.
  - `"out X"`: van `X` has to leave. Every van parked after `X` (between `X` and the exit) drives out
    and waits (1 move each), then `X` drives out (1 move), then the waiting vans drive back in, keeping
    the order they had before (1 move each). With `k` vans in front of `X` this costs `2k + 1` moves.

  Arrivals (`"in"` entries) are not counted. Return the total number of moves made by all `"out"`
  entries. Return `0` if there are none.

  The log is always consistent: `"out X"` appears only while `X` is parked, and `"in X"` only while `X`
  is not parked (a van may come back after it has left).

  ### Example 1
  ```
  Input:  ops = ["in V1", "in V2", "in V3", "out V1", "out V3"]
  Output: 6
  Explanation: V2 and V3 move out and back for V1 (4 moves) plus V1 itself (1); the lane is then V2, V3 and V3 leaves in 1 move
  ```

  ### Example 2
  ```
  Input:  ops = ["in K7", "in M2", "out K7", "in R5", "out M2", "out R5"]
  Output: 7
  Explanation: K7 costs 3 moves, M2 costs 3 moves because R5 is in front of it, R5 costs 1 move
  ```

  ### Constraints
  - `0 <= ops.length <= 10^4`
  - Each entry is `"in "` or `"out "` followed by a van id
  - Van ids have 1 to 8 characters: uppercase letters, digits and `-`
  - The log is consistent as described above
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parking_lane_retrieval_moves
  params:
    - {name: ops, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def parking_lane_retrieval_moves(ops: list[str]) -> int:
        lane: list[str] = []
        total = 0
        for op in ops:
            action, van = op.split(" ")
            if action == "in":
                lane.append(van)
            else:
                position = lane.index(van)
                in_front = len(lane) - position - 1
                total += 2 * in_front + 1
                del lane[position]
        return total
  javascript: |
    function parkingLaneRetrievalMoves(ops) {
      const lane = [];
      let total = 0;
      for (const op of ops) {
        const [action, van] = op.split(" ");
        if (action === "in") {
          lane.push(van);
        } else {
          const position = lane.indexOf(van);
          const inFront = lane.length - position - 1;
          total += 2 * inFront + 1;
          lane.splice(position, 1);
        }
      }
      return total;
    }
