  - {id: t2, args: ["(a - b) - c ^ 2 ^ 3"], expected: ["a", "b", "-", "c", "2", "3", "^", "^", "-"], description: "Example 2 - left-associative minus and right-associative power"}
  - {id: t3, args: ["10/(2+ y)*k"], expected: ["10", "2", "y", "+", "/", "k", "*"], description: "Example 3 - multi-digit integer, irregular spacing, left-associative / and *"}
  - {id: t4, hidden: true, args: ["  Q  "], expected: ["Q"], description: "Single variable surrounded by spaces"}
  - {id: t5, hidden: true, args: ["((((2024))))"], expected: ["2024"], description: "Redundant nested parentheses around one integer"}
  - {id: t6, hidden: true, args: ["a-b-c+d"], expected: ["a", "b", "-", "c", "-", "d", "+"], description: "Chain of equal-precedence left-associative operators"}
  - {id: t7, hidden: true, args: ["2^3^2^1"], expected: ["2", "3", "2", "1", "^", "^", "^"], description: "Chain of right-associative powers must stay on the stack"}
  - {id: t8, hidden: true, args: ["a+b*c^d-e/f"], expected: ["a", "b", "c", "d", "^", "*", "+", "e", "f", "/", "-"], description: "All three precedence levels mixed"}
  - {id: t9, hidden: true, args: ["(a+b)^(c-d)*e"], expected: ["a", "b", "+", "c", "d", "-", "^", "e", "*"], description: "Parenthesised operands of a power, then a lower-precedence operator"}
  - {id: t10, hidden: true, args: ["2 ^ 3 * 4 ^ 0 / 1000"], expected: ["2", "3", "^", "4", "0", "^", "*", "1000", "/"], description: "Power followed by left-associative * and /; zero and large integers"}
