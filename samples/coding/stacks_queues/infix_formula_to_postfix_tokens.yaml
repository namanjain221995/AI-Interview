slug: infix_formula_to_postfix_tokens
title: Infix Formula to Postfix Tokens
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [backend, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Infix Formula to Postfix Tokens

  A metrics dashboard lets users define derived series with formulas such as `(errors * 100) / requests`.
  Before evaluation, the query compiler rewrites each formula into **postfix order** (operands first,
  then the operator that combines them), which a simple stack machine can execute without worrying
  about parentheses or precedence.

  The formula may contain:

  - **integers**: one or more decimal digits (keep them exactly as written, for example `"100"`);
  - **variables**: a single ASCII letter, such as `x` or `K`;
  - the binary operators `+`, `-`, `*`, `/` and `^`;
  - parentheses `(` and `)`, and any number of spaces anywhere between tokens.

  There is no unary minus. Operator rules:

  | Operator | Precedence | Associativity |
  |----------|------------|---------------|
  | `^` | highest | right (`a ^ b ^ c` means `a ^ (b ^ c)`) |
  | `*` `/` | middle | left (`a / b * c` means `(a / b) * c`) |
  | `+` `-` | lowest | left |

  Return the postfix form as a list of tokens. Parentheses never appear in the output.

  ### Example 1
  ```
  Input:  expression = "3 + 4 * x"
  Output: ["3", "4", "x", "*", "+"]
  ```

  ### Example 2
  ```
  Input:  expression = "(a - b) - c ^ 2 ^ 3"
  Output: ["a", "b", "-", "c", "2", "3", "^", "^", "-"]
  Explanation: The two "-" are left-associative, the two "^" are right-associative.
  ```

  ### Example 3
  ```
  Input:  expression = "10/(2+ y)*k"
  Output: ["10", "2", "y", "+", "/", "k", "*"]
  ```

  ### Constraints
  - `1 <= expression.length <= 10^4`
  - The expression is always a valid formula under the rules above (balanced parentheses, operators
    always between two operands, at least one operand).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: to_postfix_tokens
  params:
    - {name: expression, type: "string"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def to_postfix_tokens(expression: str) -> list[str]:
        precedence = {"+": 1, "-": 1, "*": 2, "/": 2, "^": 3}
        output: list[str] = []
        ops: list[str] = []
        i, n = 0, len(expression)
        while i < n:
            ch = expression[i]
            if ch == " ":
                i += 1
                continue
            if ch.isdigit():
                j = i
                while j < n and expression[j].isdigit():
                    j += 1
                output.append(expression[i:j])
                i = j
                continue
            if ch.isalpha():
                output.append(ch)
            elif ch == "(":
                ops.append(ch)
            elif ch == ")":
                while ops[-1] != "(":
                    output.append(ops.pop())
                ops.pop()
            else:
                # Pop operators that bind at least as tightly; for right-associative ^ only strictly tighter.
                while ops and ops[-1] != "(" and (
                    precedence[ops[-1]] > precedence[ch]
                    or (precedence[ops[-1]] == precedence[ch] and ch != "^")
                ):
                    output.append(ops.pop())
                ops.append(ch)
            i += 1
        while ops:
            output.append(ops.pop())
        return output
  javascript: |
    function toPostfixTokens(expression) {
      const precedence = { "+": 1, "-": 1, "*": 2, "/": 2, "^": 3 };
      const output = [];
      const ops = [];
      const isDigit = (c) => c >= "0" && c <= "9";
      const isLetter = (c) => (c >= "a" && c <= "z") || (c >= "A" && c <= "Z");
      let i = 0;
      while (i < expression.length) {
        const ch = expression[i];
        if (ch === " ") {
          i++;
          continue;
        }
        if (isDigit(ch)) {
          let j = i;
          while (j < expression.length && isDigit(expression[j])) j++;
          output.push(expression.slice(i, j));
          i = j;
          continue;
        }
        if (isLetter(ch)) {
          output.push(ch);
        } else if (ch === "(") {
          ops.push(ch);
        } else if (ch === ")") {
          while (ops[ops.length - 1] !== "(") output.push(ops.pop());
          ops.pop();
        } else {
          while (ops.length) {
            const top = ops[ops.length - 1];
            if (top === "(") break;
            const tighter = precedence[top] > precedence[ch];
            const sameLeft = precedence[top] === precedence[ch] && ch !== "^";
            if (!tighter && !sameLeft) break;
            output.push(ops.pop());
          }
          ops.push(ch);
        }
        i++;
      }
      while (ops.length) output.push(ops.pop());
      return output;
    }
