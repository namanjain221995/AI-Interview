expected_concepts:
  - "shunting-yard algorithm"
  - "operator stack with precedence comparison"
  - "left versus right associativity when precedences are equal"
  - "tokenising multi-digit numbers and skipping spaces"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Tokenises in one pass, implements shunting-yard with an operator stack, pops on higher precedence or equal precedence only for left-associative operators, drains to the matching parenthesis on close and explains the linear bound."
  good: "Correct shunting-yard for precedence and parentheses but needs a test run to fix right-associativity of ^ or multi-digit numbers."
  weak: "Treats all operators as left-associative, splits numbers into single digits, or emits parentheses in the output."
  criteria:
    correctness: "All tests pass, including chained powers, chained subtraction and redundant parentheses."
    efficiency: "Single pass; each operator is pushed and popped once."
    code_quality: "Precedence and associativity live in one table or helper rather than scattered conditions."
    edge_cases: "A single operand, spaces anywhere, nested parentheses and multi-digit integers."
    communication: "Explains why equal-precedence operators are popped for left associativity but not for ^."
hints:
  - "Operands can go straight to the output in the order they appear; the hard part is deciding when each operator is allowed to follow them."
  - "Hold operators on a stack until you know nothing stronger is coming; when a new operator arrives, earlier operators that bind more tightly must be emitted first, and parentheses act like a fresh bottom of the stack."
  - "Scan tokens left to right, sending numbers and letters to the output; push an opening parenthesis, and on a closing one pop operators to the output until the matching opening one, which is discarded; for an operator, pop while the top is an operator with higher precedence, or equal precedence when the incoming operator is left-associative (never for the power operator), then push it; finally pop everything left."
followups:
  - "How would you evaluate the postfix tokens given values for the variables?"
  - "How would you add unary minus so that formulas like -x ^ 2 are supported, and what should it mean?"
  - "How would you report the position of the first syntax error for an invalid formula?"
common_errors:
  - "Popping equal-precedence operators for ^, which makes it left-associative."
  - "Reading integers one digit at a time and emitting each digit as its own token."
  - "Forgetting to stop popping at an opening parenthesis when a new operator arrives."
  - "Leaving operators on the stack at the end instead of draining it."
