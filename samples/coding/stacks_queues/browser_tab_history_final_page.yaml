title: "Browser Tab History Replay"
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [frontend, fullstack, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Browser Tab History Replay

  When a customer reports "the app showed the wrong page", the support team replays the navigation log of
  that browser tab to find out which page the customer actually ended on.

  The tab always starts on the page `"home"`. Each entry of `commands` is one of:

  - `"open <url>"` - navigate to `<url>`. The page shown before is remembered in the **back** history and
    the **forward** history is discarded completely. Opening a page always counts as a navigation, even if
    it is the page already shown.
  - `"back"` - return to the most recently remembered page in the back history; the page being left is
    remembered in the forward history. Does nothing if the back history is empty.
  - `"forward"` - the reverse of `"back"`: go to the most recently remembered page in the forward history,
    and the page being left goes to the back history. Does nothing if the forward history is empty.

  Write `browser_tab_history_final_page(commands)` that returns the page shown after all commands have been
  replayed in order.

  ### Example 1
  ```
  Input:  commands = ["open docs", "open docs/api", "back", "open status", "forward"]
  Output: "status"
  Explanation: Opening status discards the forward history that held docs/api, so the final forward does nothing.
  ```

  ### Example 2
  ```
  Input:  commands = ["back", "open billing", "back", "back", "forward", "forward"]
  Output: "billing"
  Explanation: The first back and the second back hit an empty back history; the second forward hits an empty forward history.
  ```

  ### Constraints
  - `0 <= commands.length <= 10^4`
  - Every command is exactly `"back"`, `"forward"` or `"open "` followed by a URL.
  - URLs are 1 to 100 characters of lowercase letters, digits, `/`, `-`, `.` and `_` (no spaces).

  **Follow-up:** how would you also report how many pages are reachable with `back` and `forward` at the end, in `O(1)` per command?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: browser_tab_history_final_page
  params:
    - {name: commands, type: "string[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def browser_tab_history_final_page(commands: list[str]) -> str:
        current = "home"
        back: list[str] = []
        forward: list[str] = []
        for command in commands:
            if command == "back":
                if back:
                    forward.append(current)
                    current = back.pop()
            elif command == "forward":
                if forward:
                    back.append(current)
                    current = forward.pop()
            else:
                back.append(current)
                current = command.split(" ", 1)[1]
                forward.clear()
        return current
  javascript: |
    function browserTabHistoryFinalPage(commands) {
      let current = "home";
      const back = [];
      let forward = [];
      for (const command of commands) {
        if (command === "back") {
          if (back.length > 0) {
            forward.push(current);
            current = back.pop();
          }
        } else if (command === "forward") {
          if (forward.length > 0) {
            back.push(current);
            current = forward.pop();
          }
        } else {
          back.push(current);
          current = command.slice(command.indexOf(" ") + 1);
          forward = [];
        }
      }
      return current;
    }
