expected_concepts:
  - "two stacks for back and forward history"
  - "clearing the forward stack on a new navigation"
  - "no-op handling when a history is empty"
  - "O(1) work per command"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Models the back and forward histories as two stacks, moves the current page between them correctly, clears the forward stack on every open, ignores moves on empty histories and states O(1) per command."
  good: "Correct two-stack or list-with-pointer solution with a small slip fixed after a test, such as forgetting to clear forward history."
  weak: "Keeps only a single list, loses the current page on back/forward, or never discards the forward history after an open."
  criteria:
    correctness: "All tests pass, including opens after going back and moves on empty histories."
    efficiency: "Constant work per command; no rebuilding of the history lists."
    code_quality: "Clear names for current, back and forward; the URL is extracted once and simply."
    edge_cases: "Empty log, back/forward on a fresh tab, opening the page already shown."
    communication: "Explains why opening a page must invalidate the forward history."
hints:
  - "Think about which page you would return to after several backs in a row: the most recent one or the oldest one?"
  - "Keep the page currently shown separately from two last-in-first-out histories, one for going back and one for going forward."
  - "On open, push the current page onto the back stack, make the URL current and empty the forward stack; on back or forward, if the matching stack is non-empty, push the current page onto the other stack and pop the new current page from the matching one."
followups:
  - "How would you cap the back history at the last 50 pages without slowing down navigation?"
  - "How would you support a 'back 3' command efficiently?"
  - "If the tab history had to survive a browser restart, what would you persist?"
common_errors:
  - "Forgetting to clear the forward history when a new page is opened."
  - "Losing the current page because it is not pushed onto the other stack before moving."
  - "Popping from an empty stack instead of treating back/forward as a no-op."
  - "Splitting the command on every space instead of taking everything after the first space."
