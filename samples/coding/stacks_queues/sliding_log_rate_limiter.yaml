expected_concepts:
  - per-client queue of accepted timestamps
  - evicting timestamps that fall out of the half-open window from the front
  - rejected requests are never recorded
  - amortised O(1) per request because each timestamp is enqueued and dequeued once
  - hash map from client id to its queue
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Keeps a queue of accepted timestamps per client, evicts from the front using the exact (t - window, t] boundary, never records rejected requests, and argues amortised O(1) per request; discusses memory versus a fixed-window counter."
  good: "Correct per-client solution, possibly rescanning a list on each request or fixing the window boundary after a failing case, with the right complexity stated."
  weak: "Counts rejected requests, shares one budget across all clients, or gets the open and closed ends of the window wrong."
  criteria:
    correctness: "All tests pass, including equal timestamps, exact boundary expiry and independent clients."
    efficiency: "Each accepted timestamp is added and removed at most once."
    code_quality: "Clear names for the per-client log and a single eviction loop before the decision."
    edge_cases: "Bursts at one timestamp, window of 1, limit larger than the traffic, requests exactly window seconds apart."
    communication: "Explains why the oldest timestamps are always the first to expire and why rejected requests are excluded."
hints:
  - "For one client, which of its past requests can still matter for the current decision, and which can never matter again?"
  - "Keep, for each client, the timestamps of its accepted requests in arrival order; because time only moves forward, expired entries are always at the front."
  - "Use a map from client id to a queue. For each request, pop from the front while the oldest timestamp is at most t minus window, then accept and enqueue t only if the queue is shorter than the limit; rejected requests are not enqueued."
followups:
  - "How would you cap memory if a client's limit were very large, for example with a sliding-window counter approximation?"
  - "How would you implement this across several gateway instances that share one limit per client?"
  - "How would you evict state for clients that have gone quiet so the map does not grow forever?"
common_errors:
  - "Using a closed window [t - window, t], so a request exactly window seconds old still counts."
  - "Recording rejected requests, which keeps a busy client blocked forever."
  - "Using one global queue instead of one per client."
  - "Rescanning the client's full history on every request, which is quadratic for busy clients."
