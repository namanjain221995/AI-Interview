title: Sliding Log Rate Limiter
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, platform, sre, security]
time_limit_minutes: 20
prompt_markdown: |
  ## Sliding Log Rate Limiter

  An API gateway protects a backend by limiting how often each client may call it. Requests arrive in
  order; request `i` comes from client `client_ids[i]` at second `timestamps[i]` (timestamps never
  decrease, and several requests may share the same second).

  The gateway uses a **sliding window** per client. When a request arrives at time `t`, the gateway
  counts that client's **accepted** requests whose timestamps lie in the window `(t - window, t]`
  (strictly after `t - window`, up to and including `t`).

  - If that count is **less than** `limit`, the request is accepted.
  - Otherwise it is rejected. Rejected requests never count toward any later decision.

  Clients are limited independently. Return a list of booleans where entry `i` is `true` if request
  `i` was accepted.

  ### Example 1
  ```
  Input:  timestamps = [1, 2, 3, 4, 5], client_ids = ["a", "a", "a", "a", "a"], limit = 2, window = 3
  Output: [true, true, false, true, true]
  Explanation: at t=3 the window (0, 3] already holds the accepted requests at 1 and 2; at t=4 the window (1, 4] holds only the one at 2; at t=5 the window (2, 5] holds only the one at 4, because the rejected request at 3 does not count
  ```

  ### Example 2
  ```
  Input:  timestamps = [10, 10, 10, 11, 20], client_ids = ["k1", "k2", "k1", "k1", "k1"], limit = 1, window = 10
  Output: [true, true, false, false, true]
  Explanation: k2 has its own budget; for k1 the accepted request at 10 is still inside (1, 11] but has left (10, 20]
  ```

  ### Constraints
  - `1 <= timestamps.length <= 10^5` and `client_ids.length == timestamps.length`
  - `0 <= timestamps[i] <= 10^9` and `timestamps[i] <= timestamps[i + 1]`
  - Client ids are `1` to `16` letters, digits or dashes
  - `1 <= limit <= 10^4`
  - `1 <= window <= 10^9`

  **Follow-up:** the simple approach rescans every stored timestamp of the client on each request.
  Can you make each decision amortised constant time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rate_limit_decisions
  params:
    - {name: timestamps, type: "int[]"}
    - {name: client_ids, type: "string[]"}
    - {name: limit, type: int}
    - {name: window, type: int}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def rate_limit_decisions(timestamps: list[int], client_ids: list[str], limit: int, window: int) -> list[bool]:
        accepted: dict[str, deque[int]] = {}  # per client, timestamps of accepted requests, oldest first
        decisions: list[bool] = []
        for t, client in zip(timestamps, client_ids):
            log = accepted.setdefault(client, deque())
            while log and log[0] <= t - window:
                log.popleft()  # left the window (t - window, t]
            if len(log) < limit:
                log.append(t)
                decisions.append(True)
            else:
                decisions.append(False)
        return decisions
  javascript: |
    function rateLimitDecisions(timestamps, clientIds, limit, window) {
      const accepted = new Map(); // client -> {times, head}: a queue of accepted timestamps
      const decisions = [];
      for (let i = 0; i < timestamps.length; i++) {
        const t = timestamps[i];
        let log = accepted.get(clientIds[i]);
        if (!log) {
          log = { times: [], head: 0 };
          accepted.set(clientIds[i], log);
        }
        while (log.head < log.times.length && log.times[log.head] <= t - window) log.head++;
        if (log.times.length - log.head < limit) {
          log.times.push(t);
          decisions.push(true);
        } else {
          decisions.push(false);
        }
      }
      return decisions;
    }
