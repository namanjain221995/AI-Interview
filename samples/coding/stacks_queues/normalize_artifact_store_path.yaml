expected_concepts:
  - "stack of directory names"
  - "splitting on the separator and skipping empty segments"
  - "treating only exact '.' and '..' as special"
  - "joining once at the end"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Splits on the separator, keeps a stack of names, pops on '..' only when non-empty, treats only exact '.' and '..' specially, returns '/' for an empty stack and explains linear time and space."
  good: "Correct stack solution with a small slip (for example the root case or a trailing slash) fixed after testing."
  weak: "Uses string replacement such as replacing '/../' patterns, treats '...' as special, or can go above the root."
  criteria:
    correctness: "All tests pass, including root-only paths and dot-containing names."
    efficiency: "Single pass over the segments; no repeated string rewriting."
    code_quality: "Clear segment classification and a single join for the result."
    edge_cases: "Root, repeated slashes, '..' at the root, names like '...', '.x' and 'v1.2'."
    communication: "Explains why a stack matches the meaning of '..'."
hints:
  - "Look at the path one name at a time; which names change where you are, and how far back does '..' reach?"
  - "A parent segment always undoes the most recently entered directory, which is exactly last-in-first-out behaviour."
  - "Split the path on slashes, skip empty names and '.', pop the last kept name on '..' if there is one, otherwise push the name; finally join the kept names with single slashes behind a leading slash, which also yields the root for an empty list."
followups:
  - "How would you handle symbolic links whose targets are known from a lookup table?"
  - "How would you detect and reject paths that try to escape the root, instead of clamping them?"
  - "What changes if the store must also accept Windows-style backslashes?"
common_errors:
  - "Treating names such as '...' or '.x' as special segments."
  - "Popping from an empty stack on '..' at the root."
  - "Returning an empty string instead of '/' for the root."
  - "Leaving a trailing slash or doubled slashes in the result."
