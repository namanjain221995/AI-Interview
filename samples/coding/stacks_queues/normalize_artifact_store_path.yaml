slug: normalize_artifact_store_path
title: "Normalize Artifact Store Path"
difficulty: easy
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [devops, platform, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Normalize Artifact Store Path

  Build jobs upload files to an internal artifact store using absolute paths assembled by shell scripts,
  so the paths arrive messy: doubled slashes, `.` segments and `..` segments. Before a path is used as a
  storage key it must be reduced to its canonical form.

  Split the path on `/` and interpret the names between slashes:

  - an empty name (from repeated slashes) and `.` mean "stay in the current directory";
  - `..` means "go to the parent directory"; at the root it does nothing (you can never go above the root);
  - every other name, including ones made only of dots such as `...` or containing dots such as `v1.2`,
    is an ordinary directory or file name.

  Write `normalize_artifact_path(path)` that returns the canonical path: it starts with a single `/`, names
  are separated by exactly one `/`, there is no trailing slash, and the root itself is returned as `"/"`.

  ### Example 1
  ```
  Input:  path = "/builds//release/./v1.2/../v1.3/"
  Output: "/builds/release/v1.3"
  Explanation: .. leaves v1.2; the doubled slash, the . and the trailing slash disappear.
  ```

  ### Example 2
  ```
  Input:  path = "/../../cache/..."
  Output: "/cache/..."
  Explanation: Going above the root stays at the root, and ... is an ordinary name.
  ```

  ### Example 3
  ```
  Input:  path = "/tmp/./..//"
  Output: "/"
  ```

  ### Constraints
  - `1 <= path.length <= 3000`
  - `path` starts with `/` and consists of letters, digits, `.`, `_`, `-` and `/`.

  **Follow-up:** how would you resolve a relative path such as `../lib/./x` against a given working directory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: normalize_artifact_path
  params:
    - {name: path, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def normalize_artifact_path(path: str) -> str:
        parts: list[str] = []
        for name in path.split("/"):
            if name == "" or name == ".":
                continue
            if name == "..":
                if parts:
                    parts.pop()
            else:
                parts.append(name)
        return "/" + "/".join(parts)
  javascript: |
    function normalizeArtifactPath(path) {
      const parts = [];
      for (const name of path.split("/")) {
        if (name === "" || name === ".") continue;
        if (name === "..") {
          if (parts.length > 0) parts.pop();
        } else {
          parts.push(name);
        }
      }
      return "/" + parts.join("/");
    }
