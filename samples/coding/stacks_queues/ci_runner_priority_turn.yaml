expected_concepts:
  - FIFO queue simulation of the runner
  - knowing the highest waiting priority (rescan, counts per priority, or a sorted list)
  - strictly higher comparison so equal priorities keep their relative order
  - 1-based turn counter incremented only when a job actually runs
optimal_complexity: {time: O(n^2), space: O(n)}
rubric:
  excellent: "Simulates the queue cleanly, keeps per-priority counts so the highest waiting priority is known in O(1) amortised per step, uses the strict comparison and explains that the rotations can still total O(n^2) steps in the worst case."
  good: "Correct simulation that rescans the queue for a higher priority at every step, with the right turn counting and tie behaviour."
  weak: "Sorts jobs by priority and ignores queue order among equals, counts rotations as turns, or returns a 0-based answer."
  criteria:
    correctness: "All tests pass, including equal priorities ahead of the target and a single job."
    efficiency: "Avoids needless work per step (for example per-priority counts) and states the overall worst-case cost accurately."
    code_quality: "Tracks job positions rather than priorities so the target can be recognised among duplicates."
    edge_cases: "Single job, all-equal priorities, target highest and target lowest."
    communication: "Explains why equal priorities preserve queue order and what counts as a turn."
hints:
  - "Simulating the runner directly is fine at this size; what do you need to remember about each job so you can recognise the target later?"
  - "Store positions in a queue rather than priorities, because several jobs can share the target's priority; at each step you need to know whether a strictly higher priority is still waiting."
  - "Put all positions in a queue and keep a count of waiting jobs per priority; repeatedly take the front position, send it to the back if a higher priority still has waiting jobs, otherwise increase the turn counter, decrement its priority count and return the counter if this position is the target."
followups:
  - "How would you return the full run order instead of the turn of one job?"
  - "How would you handle new jobs arriving while the runner is working?"
  - "What changes if there are several runners taking jobs at the same time?"
common_errors:
  - "Tracking priorities only, so a different job with the same priority is mistaken for the target."
  - "Using a non-strict comparison, which sends jobs with equal priority to the back forever."
  - "Counting jobs moved to the back as turns."
  - "Sorting by priority, which loses the queue order among equal priorities."
