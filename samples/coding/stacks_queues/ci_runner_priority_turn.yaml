time_limit_minutes: 15
prompt_markdown: |
  ## CI Runner Priority Turn

  A single CI runner works through a queue of waiting build jobs. Each job has a priority from 1 (lowest)
  to 9 (highest). The runner repeats this step until the queue is empty:

  1. Take the job at the front of the queue.
  2. If **any** job still waiting in the queue has a **strictly higher** priority, put the taken job at
     the back of the queue without running it.
  3. Otherwise, run the job; it leaves the queue for good.

  You are given `priorities`, where `priorities[i]` is the priority of the job at position `i` (position
  `0` is the front), and `target`, the position of one job you care about. Return the **1-based turn** at
  which that job runs: `1` if it is the first job to run, `2` if one job runs before it, and so on.

  ### Example 1
  ```
  Input:  priorities = [2, 5, 3, 5, 1], target = 2
  Output: 3
  Explanation: both priority-5 jobs run first (the second 5 is not strictly higher than the first); the priority-1 and priority-2 jobs are sent to the back, then the target job (priority 3) runs third
  ```

  ### Example 2
  ```
  Input:  priorities = [4, 4, 4], target = 1
  Output: 2
  Explanation: no job is strictly higher than another, so they run in queue order
  ```

  ### Constraints
  - `1 <= priorities.length <= 1000`
  - `1 <= priorities[i] <= 9`
  - `0 <= target < priorities.length`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: runner_turn_of_job
  params:
    - {name: priorities, type: "int[]"}
    - {name: target, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def runner_turn_of_job(priorities: list[int], target: int) -> int:
        queue = deque(range(len(priorities)))
        waiting = [0] * 10  # waiting[p] = number of queued jobs with priority p
        for p in priorities:
            waiting[p] += 1
        highest = 9
        turn = 0
        while queue:
            while waiting[highest] == 0:
                highest -= 1
            job = queue.popleft()
            if priorities[job] < highest:
                queue.append(job)
                continue
            turn += 1
            waiting[priorities[job]] -= 1
            if job == target:
                return turn
        return -1
  javascript: |
    function runnerTurnOfJob(priorities, target) {
      // Plain simulation: rescan the queue for a strictly higher priority each step.
      let queue = priorities.map((p, i) => i);
      let turn = 0;
      while (queue.length > 0) {
        const job = queue.shift();
        if (queue.some((other) => priorities[other] > priorities[job])) {
          queue.push(job);
        } else {
          turn += 1;
          if (job === target) return turn;
        }
      }
      return -1;
    }
