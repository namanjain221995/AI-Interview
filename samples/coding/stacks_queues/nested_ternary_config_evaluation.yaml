expected_concepts:
  - right-to-left scan with a stack of reduced values
  - right associativity means the innermost ternary is resolved first
  - matching each question mark with its colon via a depth counter
  - single-character tokens make parsing index-based
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Explains right associativity, evaluates with a right-to-left stack (or a recursive parser that tracks the matching colon) in O(n), treats T and F results as values, and discusses avoiding deep recursion."
  good: "Reaches a correct recursive or stack solution with some help on how ':' pairs with '?', possibly with an O(n^2) branch-skipping scan."
  weak: "Evaluates left to right as if the operator were left-associative, splits on the first ':' instead of the matching one, or assumes results are always digits."
  criteria:
    correctness: "All tests pass, including nesting in both branches and T or F as the final value."
    efficiency: "Linear time; each character is pushed or consumed once."
    code_quality: "Clear handling of the condition character and of the two popped branches, with no ad hoc string slicing in a loop."
    edge_cases: "A rule that is a single value, deep nesting in the false branch and deep nesting in the true branch."
    communication: "Explains why scanning from the right guarantees both branches are already reduced when a '?' is met."
hints:
  - "Write the rule with explicit parentheses for a few examples; which ternary has to be decided first?"
  - "Because the operator groups to the right, when you read the rule from the end the two branches of any question mark are already complete values by the time you reach it."
  - "Scan from the last character to the first and push every value onto a stack, ignoring colons. On a question mark, pop the true branch and then the false branch, keep the one chosen by the character just before the question mark, push it back and skip that condition character. The single value left is the answer."
followups:
  - "How would you support multi-character values such as port numbers or region names?"
  - "How would you report the position of the first syntax error in an invalid rule?"
  - "What if conditions could be comparisons like x>3 that must be evaluated against a context map?"
common_errors:
  - "Treating the operator as left-associative and resolving the outermost question mark first with the wrong branch."
  - "Splitting at the first colon instead of the colon that matches the question mark."
  - "Treating a T or F value as a condition because it is followed by a colon."
  - "Using recursion that overflows the stack on very deep rules without discussing it."
