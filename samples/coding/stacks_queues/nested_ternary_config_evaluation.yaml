slug: nested_ternary_config_evaluation
title: Nested Ternary Config Evaluation
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [backend, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Nested Ternary Config Evaluation

  A deployment tool stores tiny routing rules in a compact, space-free format. After every condition
  has been resolved to `T` (true) or `F` (false), a rule looks like `"T?F?3:5:7"`, and the tool must
  reduce it to the single value it selects.

  The grammar is:

  ```
  rule := value | cond '?' rule ':' rule
  cond := 'T' | 'F'
  value := 'T' | 'F' | '0' ... '9'
  ```

  `c?a:b` selects `a` when `c` is `T` and `b` when `c` is `F`. The operator is **right-associative**:
  `"F?1:T?4:5"` means `F ? 1 : (T ? 4 : 5)`, and a `?` always pairs with the nearest unmatched `:` that
  follows its true branch, exactly like nested parentheses.

  Return the selected value as a one-character string.

  ### Example 1
  ```
  Input:  expr = "T?F?3:5:7"
  Output: "5"
  Explanation: the rule is T ? (F ? 3 : 5) : 7; the outer condition picks the inner rule, which picks 5
  ```

  ### Example 2
  ```
  Input:  expr = "F?1:T?4:5"
  Output: "4"
  ```

  ### Example 3
  ```
  Input:  expr = "T?T?F:5:3"
  Output: "F"
  Explanation: the selected value can itself be T or F
  ```

  ### Constraints
  - `1 <= expr.length <= 10^4`
  - `expr` is a valid rule built from the grammar above (only `T`, `F`, digits, `?` and `:`)
  - Every condition and every value is exactly one character

  **Follow-up:** can you evaluate it in one pass without recursion, so that deeply nested rules cannot
  overflow the call stack?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: evaluate_ternary_config
  params:
    - {name: expr, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def evaluate_ternary_config(expr: str) -> str:
        # Right to left, the operands of every '?' are already reduced and sit on top of the stack.
        stack: list[str] = []
        i = len(expr) - 1
        while i >= 0:
            ch = expr[i]
            if ch == "?":
                condition = expr[i - 1]
                when_true = stack.pop()
                when_false = stack.pop()
                stack.append(when_true if condition == "T" else when_false)
                i -= 2  # the condition character has been consumed
                continue
            if ch != ":":
                stack.append(ch)
            i -= 1
        return stack[-1]
  javascript: |
    function evaluateTernaryConfig(expr) {
      // Iterative descent: walk forward, skipping the branch that is not taken.
      let i = 0;
      while (i + 1 < expr.length && expr[i + 1] === "?") {
        if (expr[i] === "T") {
          i += 2; // continue into the true branch
        } else {
          // skip the true branch: find the ':' that matches this '?'
          let depth = 0;
          let j = i + 2;
          for (; j < expr.length; j++) {
            if (expr[j] === "?") depth++;
            else if (expr[j] === ":") {
              if (depth === 0) break;
              depth--;
            }
          }
          i = j + 1;
        }
      }
      return expr[i];
    }
