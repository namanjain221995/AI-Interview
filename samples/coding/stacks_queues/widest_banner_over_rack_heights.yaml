expected_concepts:
  - monotonic increasing stack of indices
  - for each rack, the widest run where it is the shortest
  - sentinel of height 0 to flush the stack at the end
  - 64-bit arithmetic for the area
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Reframes the task as finding, for every rack, how far the run can extend while that rack is the shortest; derives the increasing stack, explains how a pop fixes both boundaries, uses a sentinel or final flush and uses 64-bit arithmetic."
  good: "Reaches a correct O(n) stack solution with some prompting, or computes previous and next smaller elements in two passes, and states the complexity."
  weak: "Stays with the O(n^2) or O(n^3) enumeration of runs, forgets to flush the stack at the end, or overflows on large heights."
  criteria:
    correctness: "All tests pass, including equal heights, zero-height racks and a strictly increasing row."
    efficiency: "Linear time; each index is pushed and popped once."
    code_quality: "Clear stack invariant and a single place where the width is computed."
    edge_cases: "Empty row, a single rack, all heights equal, zeros splitting the row and very large heights."
    communication: "Explains why the popped rack's left boundary is the new top of the stack and its right boundary is the current index."
hints:
  - "In the best banner some rack is the shortest one in the run. For a fixed rack, how wide can the run be if that rack has to be the shortest?"
  - "For every rack you need the nearest strictly shorter rack on the left and on the right; a stack that keeps rack heights increasing can find these as you scan."
  - "Scan left to right with a stack of indices whose heights increase; when the current rack is not taller than the top, pop it, and its banner spans from just after the new top to just before the current index; add a final height-0 rack to flush the stack and keep the maximum area in a 64-bit value."
followups:
  - "How would you use this routine to find the largest all-free rectangle in a 2D floor grid?"
  - "How would you also return the start and end rack of the best banner?"
  - "What changes if the banner may be hung at any vertical offset rather than resting on the floor?"
common_errors:
  - "Forgetting to process the indices left on the stack after the scan."
  - "Computing the width from the popped index instead of from the new top of the stack, which undercounts runs."
  - "Multiplying in 32-bit integers, which overflows when heights are near 10^9."
  - "Enumerating every pair of boundaries, which is too slow for 10^5 racks."
