title: Widest Banner Over Rack Heights
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Widest Banner Over Rack Heights

  A distribution centre wants to hang a promotional banner across the front of a row of storage racks.
  The racks stand side by side with no gaps, every rack is exactly one unit wide, and `heights[i]` is the
  height of rack `i` in whole units.

  The banner is a rectangle that is mounted flat against the racks:

  - its bottom edge rests on the floor and it spans a **contiguous** run of whole racks;
  - it must be fully backed by racks, so it can be no taller than the **shortest** rack in that run.

  Return the largest banner **area** (width times height) that fits. A rack of height `0` cannot back
  any banner. Return `0` when `heights` is empty or every rack has height `0`.

  ### Example 1
  ```
  Input:  heights = [3, 1, 4, 4, 2, 5]
  Output: 8
  Explanation: racks 2..3 (heights 4 and 4) give 2 * 4 = 8; racks 2..5 give 4 * 2 = 8 as well
  ```

  ### Example 2
  ```
  Input:  heights = [6, 7, 5, 0, 9]
  Output: 15
  Explanation: racks 0..2 have minimum height 5, so a 3 * 5 banner fits
  ```

  ### Constraints
  - `0 <= heights.length <= 10^5`
  - `0 <= heights[i] <= 10^9`
  - The answer can exceed the 32-bit range, so return it as a 64-bit integer.

  **Follow-up:** trying every run is `O(n^2)`. Can you find the answer in a single `O(n)` pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_banner_area
  params:
    - {name: heights, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def largest_banner_area(heights: list[int]) -> int:
        best = 0
        rising: list[int] = []  # indices whose heights increase from bottom to top
        n = len(heights)
        for i in range(n + 1):
            current = heights[i] if i < n else 0  # sentinel flushes the stack
            while rising and heights[rising[-1]] >= current:
                height = heights[rising.pop()]
                left = rising[-1] + 1 if rising else 0
                best = max(best, height * (i - left))
            rising.append(i)
        return best
  javascript: |
    function largestBannerArea(heights) {
      let best = 0;
      const rising = [];
      const n = heights.length;
      for (let i = 0; i <= n; i++) {
        const current = i < n ? heights[i] : 0;
        while (rising.length > 0 && heights[rising[rising.length - 1]] >= current) {
          const height = heights[rising.pop()];
          const left = rising.length > 0 ? rising[rising.length - 1] + 1 : 0;
          best = Math.max(best, height * (i - left));
        }
        rising.push(i);
      }
      return best;
    }
