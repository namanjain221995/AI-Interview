expected_concepts:
  - stack of open groups (or recursive descent) mirroring brace nesting
  - Cartesian concatenation of the prefix set with a group's alternatives
  - union of alternatives including empty alternatives
  - de-duplication with a set and a final lexicographic sort
  - output-sensitive complexity bounded by the number of expansions
optimal_complexity: {time: O(n * E * L), space: O(E * L)}
rubric:
  excellent: "Defines the grammar clearly, implements a stack-based or recursive parser that keeps the strings built so far per nesting level, combines groups by Cartesian concatenation, handles empty alternatives and duplicates with a set, sorts once at the end and explains the output-sensitive cost."
  good: "Reaches a correct recursive or stack solution with some prompting, for example after fixing empty alternatives or duplicate removal."
  weak: "Only handles one level of braces, mixes up union and concatenation, or returns duplicates or unsorted output."
  criteria:
    correctness: "All tests pass, including nested groups, empty alternatives, duplicates and character-code ordering."
    efficiency: "Work proportional to the strings actually produced; no repeated re-parsing of the pattern."
    code_quality: "Clear separation of what happens on an opening brace, a comma, a closing brace and a literal."
    edge_cases: "No groups at all, single-alternative group, group of only empty alternatives, deep nesting."
    communication: "Explains why a comma closes one alternative and why a closing brace multiplies the outer prefix set."
hints:
  - "Think of the pattern as a tiny grammar: concatenation of parts, and groups that are unions of alternatives. What set of strings does each piece produce?"
  - "While scanning left to right, keep the set of strings built so far for the current alternative; an opening brace starts a fresh context, so the contexts of the open groups form a stack."
  - "On an opening brace push the finished alternatives of the outer group together with the current prefix set and start again from a set holding the empty string; a comma moves the current set into the group's alternatives; a closing brace does the same, then pops and pairs every saved prefix with every alternative; a literal is appended to every current string; finish with a set and a sort."
followups:
  - "How would you support numeric ranges such as {01..12} with zero padding?"
  - "If the expansion could be millions of hosts, how would you stream them in sorted order without holding them all in memory?"
  - "How would you validate a malformed pattern and point at the offending character?"
common_errors:
  - "Treating a comma as a separator at every nesting level instead of only inside the innermost open group."
  - "Dropping empty alternatives, so patterns like lb{,-eu} lose the bare name."
  - "Forgetting to remove duplicates produced by different paths through the pattern."
  - "Sorting with a numeric or locale-aware comparison instead of plain character codes."
