role_tags: [devops, platform, sre, network]
time_limit_minutes: 30
prompt_markdown: |
  ## Hostname Pattern Expansion

  An infrastructure inventory describes fleets of machines with compact hostname patterns instead of
  listing every host. Before a configuration rollout, the deploy tool must turn a pattern into the
  exact list of target hostnames.

  A pattern is a sequence of parts written one after another:

  - a **literal** character: a lowercase letter, a digit, `-` or `.`;
  - a **choice group** `{A,B,...}`: one or more alternatives separated by commas inside braces. Each
    alternative is itself a pattern (it may contain literals and further groups, or be **empty**).

  A group expands to the union of the expansions of its alternatives. Parts written one after another
  combine by concatenation of every pairing: if the first part can produce `a` or `b` and the next part
  can produce `1` or `2`, together they produce `a1`, `a2`, `b1` and `b2`.

  Return every **distinct** hostname the pattern produces, sorted in ascending character-code order
  (plain string comparison, so a string sorts before any longer string that starts with it).

  ### Example 1
  ```
  Input:  pattern = "web{1,2}-{eu,us}"
  Output: ["web1-eu", "web1-us", "web2-eu", "web2-us"]
  ```

  ### Example 2
  ```
  Input:  pattern = "lb{,-{eu,us}}"
  Output: ["lb", "lb-eu", "lb-us"]
  Explanation: the outer group's first alternative is empty, its second is "-" followed by a nested group
  ```

  ### Example 3
  ```
  Input:  pattern = "{app,ap{p,i}}{1,1}"
  Output: ["api1", "app1"]
  Explanation: "app1" can be produced four ways but is listed once
  ```

  ### Constraints
  - `1 <= pattern.length <= 200`
  - `pattern` contains only lowercase letters, digits, `-`, `.`, `{`, `}` and `,`, and is well formed:
    braces are balanced and commas appear only directly inside a group.
  - The number of expansions counted with repetition is at most `10^4`.
  - Every expanded hostname is non-empty.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: expand_hostname_pattern
  params:
    - {name: pattern, type: string}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def expand_hostname_pattern(pattern: str) -> list[str]:
        # Each frame keeps the enclosing group's finished alternatives and the strings built before the group.
        stack: list[tuple[set[str], list[str]]] = []
        alternatives: set[str] = set()
        current: list[str] = [""]
        for ch in pattern:
            if ch == "{":
                stack.append((alternatives, current))
                alternatives, current = set(), [""]
            elif ch == ",":
                alternatives.update(current)
                current = [""]
            elif ch == "}":
                alternatives.update(current)
                options = sorted(alternatives)
                alternatives, prefixes = stack.pop()
                current = list({p + o for p in prefixes for o in options})
            else:
                current = [s + ch for s in current]
        return sorted(set(current))
  javascript: |
    function expandHostnamePattern(pattern) {
      // Each frame keeps the enclosing group's finished alternatives and the strings built before the group.
      const stack = [];
      let alternatives = new Set();
      let current = [""];
      for (const ch of pattern) {
        if (ch === "{") {
          stack.push([alternatives, current]);
          alternatives = new Set();
          current = [""];
        } else if (ch === ",") {
          for (const s of current) alternatives.add(s);
          current = [""];
        } else if (ch === "}") {
          for (const s of current) alternatives.add(s);
          const options = [...alternatives];
          const [outerAlternatives, prefixes] = stack.pop();
          const combined = new Set();
          for (const p of prefixes) for (const o of options) combined.add(p + o);
          alternatives = outerAlternatives;
          current = [...combined];
        } else {
          current = current.map((s) => s + ch);
        }
      }
      return [...new Set(current)].sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
