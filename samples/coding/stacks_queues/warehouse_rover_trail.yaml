title: Warehouse Rover Trail
difficulty: medium
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [general, frontend, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Warehouse Rover Trail

  A warehouse floor is a grid of `rows x cols` cells; row `0` is the top row and column `0` the left
  column. A rover pulls a chain of carts that always occupies a contiguous path of cells: the rover
  itself is the **head** and the last cart is the **tail**. The chain starts with length `1` (just the
  rover) at cell `(0, 0)`.

  Pallets to collect appear **one at a time**, in the order given by `pallets` (each entry is
  `[row, col]`). The first pallet is on the floor from the start; as soon as a pallet is collected, the
  next one in the list appears. It is guaranteed that every pallet appears inside the grid on a cell
  the chain does **not** occupy at that moment.

  The rover then executes `moves`, a string of `U` (row - 1), `D` (row + 1), `L` (col - 1) and
  `R` (col + 1). For each move:

  1. If the target cell is outside the grid, the run **ends** and the move does not count.
  2. If the target cell holds the current pallet, the head moves there, the tail stays where it is (the
     chain grows by one) and the pallet counts as collected.
  3. Otherwise the tail cell is freed first and the head moves onto the target cell; if that cell is
     still occupied by the chain, the run **ends** and the move does not count. Because the tail moves
     away on the same step, the head **may** enter the cell the tail is leaving.

  Return `[pallets_collected, moves_completed]`, where `moves_completed` counts the moves carried out
  before the run ended (or all moves if it never ended).

  ### Example 1
  ```
  Input:  rows = 3, cols = 3, pallets = [[0, 1], [0, 2], [1, 2]], moves = "RRDLURDL"
  Output: [3, 8]
  Explanation: R, R and D collect all three pallets, so the chain has length 4 with its tail at (0, 0); the moves L, U, R, D, L then circle a 2 x 2 block, and from U onwards each move enters exactly the cell the tail is leaving, which is allowed
  ```

  ### Example 2
  ```
  Input:  rows = 3, cols = 3, pallets = [[0, 1], [0, 2], [1, 2], [1, 1]], moves = "RRDLU"
  Output: [4, 4]
  Explanation: L now collects a fourth pallet, so the chain has length 5 and only (0, 0) is freed on the next move; U targets (0, 1), which is still part of the chain, so the run ends after 4 moves
  ```

  ### Example 3
  ```
  Input:  rows = 2, cols = 2, pallets = [[1, 1]], moves = "RDLL"
  Output: [1, 3]
  Explanation: R, then D collects the pallet, then L moves to (1, 0); the last L would leave the grid
  ```

  ### Constraints
  - `1 <= rows, cols <= 100`
  - `0 <= pallets.length < rows * cols`
  - Each pallet appears inside the grid on a cell the chain does not occupy at that moment
  - `0 <= moves.length <= 10^4` and `moves` contains only `U`, `D`, `L`, `R`

  **Follow-up:** checking every cart on each move costs time proportional to the chain length. How can
  each move be handled in constant time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rover_trail_result
  params:
    - {name: rows, type: int}
    - {name: cols, type: int}
    - {name: pallets, type: "int[][]"}
    - {name: moves, type: string}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def rover_trail_result(rows: int, cols: int, pallets: list[list[int]], moves: str) -> list[int]:
        steps = {"U": (-1, 0), "D": (1, 0), "L": (0, -1), "R": (0, 1)}
        chain = deque([(0, 0)])  # tail on the left, head on the right
        occupied = {(0, 0)}
        collected = 0
        for done, move in enumerate(moves):
            dr, dc = steps[move]
            head = chain[-1]
            target = (head[0] + dr, head[1] + dc)
            if not (0 <= target[0] < rows and 0 <= target[1] < cols):
                return [collected, done]
            if collected < len(pallets) and target == tuple(pallets[collected]):
                collected += 1  # grow: keep the tail
            else:
                occupied.discard(chain.popleft())  # the tail leaves first
                if target in occupied:
                    return [collected, done]
            chain.append(target)
            occupied.add(target)
        return [collected, len(moves)]
  javascript: |
    function roverTrailResult(rows, cols, pallets, moves) {
      const steps = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
      const key = (r, c) => r * cols + c;
      const chain = [key(0, 0)]; // tail at index `tail`, head at the end
      let tail = 0;
      const occupied = new Set([key(0, 0)]);
      let headR = 0;
      let headC = 0;
      let collected = 0;
      for (let done = 0; done < moves.length; done++) {
        const [dr, dc] = steps[moves[done]];
        const r = headR + dr;
        const c = headC + dc;
        if (r < 0 || r >= rows || c < 0 || c >= cols) return [collected, done];
        const target = key(r, c);
        if (collected < pallets.length && pallets[collected][0] === r && pallets[collected][1] === c) {
          collected++;
        } else {
          occupied.delete(chain[tail++]);
          if (occupied.has(target)) return [collected, done];
        }
        chain.push(target);
        occupied.add(target);
        headR = r;
        headC = c;
      }
      return [collected, moves.length];
    }
