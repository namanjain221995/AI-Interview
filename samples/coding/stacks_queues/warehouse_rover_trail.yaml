expected_concepts:
  - deque of chain cells with the head at one end and the tail at the other
  - hash set of occupied cells for constant-time collision checks
  - freeing the tail before the collision check so the head may follow the tail
  - growth by skipping the tail removal when a pallet is collected
  - stopping at the first wall or self collision and reporting completed moves
optimal_complexity: {time: O(m + p), space: O(m)}
rubric:
  excellent: "Models the chain as a deque plus an occupied set, applies the rules in the stated order (wall, pallet growth, tail release, collision), stops exactly at the failing move and explains the O(1) per move cost."
  good: "Correct simulation that may scan the chain for collisions or need a nudge on the tail-release rule, with the right outcome on all tests."
  weak: "Checks collision before freeing the tail, counts the failing move, lets pallets appear before they are due, or keeps moving after the run ended."
  criteria:
    correctness: "All tests pass, including tail chasing, reversing at length 2 and running out of pallets."
    efficiency: "Constant work per move with a deque and a set instead of scanning the chain."
    code_quality: "A clear direction table and named head, tail and target cells; the stop conditions are easy to follow."
    edge_cases: "Empty move string, a wall on the first move, a 1 x 1 floor, all pallets collected before the moves end."
    communication: "Explains why the tail must be released before the collision check and why growth keeps the tail."
hints:
  - "Each move only changes the two ends of the chain: a new head appears and, unless the chain grows, the tail disappears. Which structure supports exactly those two operations cheaply?"
  - "Store the chain cells in a double-ended queue from tail to head, and keep a set of occupied cells so you can test a collision without walking the whole chain."
  - "For each move compute the target cell. Stop if it is off the grid. If it is the current pallet, count it and keep the tail. Otherwise remove the tail from both the queue and the set first, and only then stop if the target is still in the set. Push the target as the new head and add it to the set."
followups:
  - "How would you also return the final positions of every cart?"
  - "How would you let pallets appear at random free cells efficiently on a very large floor?"
  - "What changes if the floor wraps around at the edges instead of having walls?"
common_errors:
  - "Testing for collision before releasing the tail, which wrongly ends runs where the head follows the tail."
  - "Counting the move that hit the wall or the chain as completed."
  - "Comparing against every pallet in the list instead of only the one currently on the floor."
  - "Mixing up rows and columns or the direction of U and D."
