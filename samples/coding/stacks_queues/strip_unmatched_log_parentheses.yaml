expected_concepts:
  - "stack of indices of unpaired opening parentheses"
  - "marking positions to delete and rebuilding the string once"
  - "greedy nearest-left pairing"
  - "linear-time string building"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Keeps a stack of indices of open parentheses, marks a closing parenthesis for removal when the stack is empty, marks every index left on the stack at the end, rebuilds the line in one pass and explains the linear cost."
  good: "Correct stack solution, or a two-pass counter approach (left-to-right for ')' then right-to-left for '('), with a small fix needed for the leftover openings."
  weak: "Only counts parentheses without tracking which ones to remove, removes the wrong opening parentheses, or rebuilds the string inside the loop quadratically."
  criteria:
    correctness: "All tests pass, including empty input, lines with no parentheses and lines where nothing pairs."
    efficiency: "Linear time; the output is built once with a list or builder."
    code_quality: "Clear names for the stack of open positions and the removal set or keep flags."
    edge_cases: "Leading closings, trailing openings, nested unpaired openings and spaces next to parentheses."
    communication: "Explains why the openings left on the stack at the end are exactly the unpaired ones."
hints:
  - "Reading left to right, you always know whether a closing parenthesis can be paired, but you only learn which opening ones are unpaired once the line ends."
  - "Remember the positions of opening parentheses that are still waiting for a partner, most recent last; a closing parenthesis takes the most recent one, or is itself unpaired if none is waiting."
  - "Push the index of every opening parenthesis onto a stack; on a closing parenthesis pop if the stack is non-empty, otherwise mark that index for removal; after the scan, mark every index still on the stack as well, then build the result from the characters whose indices are not marked."
followups:
  - "How would you do it with O(1) extra space besides the output, using two passes?"
  - "How would you extend the repair to square and curly brackets, where a mismatched type should also be removed?"
  - "How would you instead return every distinct line obtainable with the minimum number of removals?"
common_errors:
  - "Only removing unpaired closing parentheses and forgetting the leftover openings."
  - "Removing the first unpaired opening parentheses from the left instead of the ones actually left on the stack."
  - "Deleting characters from the string while iterating, which shifts indices."
  - "Building the output by repeated string concatenation in a loop."
