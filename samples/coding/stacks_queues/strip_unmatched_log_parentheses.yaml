slug: strip_unmatched_log_parentheses
title: Strip Unmatched Log Parentheses
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [backend, support_engineer, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Strip Unmatched Log Parentheses

  A log shipper truncates long lines at both ends, which often cuts a parenthesised detail in half and
  leaves stray `(` or `)` characters that confuse the downstream parser. Before forwarding a line, the
  shipper repairs it.

  Pairing rule: scan the line from left to right; each `)` is paired with the **nearest `(` to its left
  that is not already paired**. A `)` with no such `(` stays unpaired, and every `(` that is never
  chosen by a later `)` stays unpaired.

  Remove exactly the unpaired parentheses and return the repaired line. All other characters (letters,
  spaces and paired parentheses) stay exactly where they were relative to each other.

  ### Example 1
  ```
  Input:  line = "db (timeout) retry)"
  Output: "db (timeout) retry"
  ```

  ### Example 2
  ```
  Input:  line = "((ok) (fail"
  Output: "(ok) fail"
  Explanation: The ")" pairs with the "(" at index 1; the "(" at index 0 and the one at index 6
  are never paired.
  ```

  ### Example 3
  ```
  Input:  line = ")))(("
  Output: ""
  ```

  ### Constraints
  - `0 <= line.length <= 10^5`
  - `line` contains only ASCII letters, spaces, `(` and `)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: strip_unmatched_parentheses
  params:
    - {name: line, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def strip_unmatched_parentheses(line: str) -> str:
        open_indices: list[int] = []
        drop: set[int] = set()
        for i, ch in enumerate(line):
            if ch == "(":
                open_indices.append(i)
            elif ch == ")":
                if open_indices:
                    open_indices.pop()
                else:
                    drop.add(i)
        drop.update(open_indices)
        return "".join(ch for i, ch in enumerate(line) if i not in drop)
  javascript: |
    function stripUnmatchedParentheses(line) {
      const openIndices = [];
      const keep = new Array(line.length).fill(true);
      for (let i = 0; i < line.length; i++) {
        if (line[i] === "(") {
          openIndices.push(i);
        } else if (line[i] === ")") {
          if (openIndices.length) openIndices.pop();
          else keep[i] = false;
        }
      }
      for (const i of openIndices) keep[i] = false;
      const parts = [];
      for (let i = 0; i < line.length; i++) if (keep[i]) parts.push(line[i]);
      return parts.join("");
    }
