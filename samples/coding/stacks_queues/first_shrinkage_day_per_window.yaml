expected_concepts:
  - prefix sums turn each window question into a comparison of two prefix totals
  - next strictly smaller element computed with a monotonic stack
  - checking whether that next smaller position falls inside the window
  - 64-bit running totals
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: "Rewrites the condition with prefix sums, recognises it as a next strictly smaller element query, solves it with a monotonic stack in O(n), maps positions back to day indices correctly and uses 64-bit totals."
  good: "Gives a correct O(n * k) scan first and reaches the prefix-sum and stack idea with hints, or has a small off-by-one between prefix positions and day indices that is fixed during testing."
  weak: "Only checks whether a window contains a negative day, treats a zero total as shrinkage, or cannot get beyond a scan whose cost is not discussed."
  criteria:
    correctness: "All tests pass, including zero totals, k = 1, k = n and totals beyond 32 bits."
    efficiency: "Linear time; each prefix position is pushed and popped at most once."
    code_quality: "The mapping between prefix positions and day indices is documented and consistent."
    edge_cases: "No shrinkage anywhere, shrinkage on the first day, drops just outside the window and large values."
    communication: "Explains why the window condition only depends on two prefix totals and why the comparison is strict."
hints:
  - "The running total from day i to day j can be written as the difference of two totals measured from the very first day; what does the shrinkage condition become in those terms?"
  - "With prefix totals, the window starting at day i shrinks on day j exactly when the prefix total after day j is strictly smaller than the prefix total before day i, so you need the next position whose prefix total is strictly smaller."
  - "Build the prefix totals, then sweep them with a stack of positions whose totals never decrease, popping every position whose total is larger than the current one and recording the current position as its next strictly smaller one; for window i, the answer is that next position minus one if it lies within the first k days, otherwise minus one."
followups:
  - "How would you answer windows of different lengths for each start day?"
  - "How would you report the first day the stock falls more than a given tolerance below the opening count?"
  - "How would this work on a stream where days keep arriving and windows close as soon as their k days are known?"
common_errors:
  - "Answering whether the window contains any negative day, which ignores earlier positive days."
  - "Using a non-strict comparison, which treats ending exactly at the opening count as shrinkage."
  - "Off-by-one errors between prefix positions and day indices."
  - "Using 32-bit running totals, which overflow on large changes."
