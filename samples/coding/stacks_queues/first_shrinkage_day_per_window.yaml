version: 1
slug: first_shrinkage_day_per_window
title: First Shrinkage Day Per Window
difficulty: medium
competency_keys: [data_structures, algorithms]
role_tags: [data_analyst, data, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## First Shrinkage Day Per Window

  A warehouse records the net stock change of one product for each day: `changes[i]` is the number of
  units received minus the units shipped or written off on day `i`. Auditors review stock in rolling
  windows of `k` consecutive days. A window that starts on day `i` opens with a stock count at the
  beginning of day `i`; the auditors want to know the **first day in the window at the end of which the
  stock is below that opening count**, that is, the first day `j` in `[i, i + k - 1]` with
  `changes[i] + changes[i + 1] + ... + changes[j] < 0`.

  Return an array of length `n - k + 1`, where `n` is the length of `changes`. Entry `i` describes the window
  starting on day `i` and holds the day index `j` described above (an index into `changes`, not an offset
  within the window), or `-1` if the stock never ends a day below the opening count in that window.

  Ending a day exactly at the opening count (a running total of zero) is **not** a shrinkage.

  ### Example 1
  ```
  Input:  changes = [3, -1, -4, 2, -2, 5], k = 3
  Output: [2, 1, 2, -1]
  Explanation: from day 0 the running totals are 3, 2, -2, so day 2 is the first shrinkage; from day 1 the first total is already -1; from day 3 the totals are 2, 0, 5 and never drop below zero
  ```

  ### Example 2
  ```
  Input:  changes = [4, -4, -1, 6], k = 2
  Output: [-1, 1, 2]
  Explanation: from day 0 the totals are 4, 0 (zero is not a shrinkage); from day 1 the first total is -4; from day 2 it is -1
  ```

  ### Constraints
  - `1 <= k <= changes.length <= 10^5`
  - `-10^9 <= changes[i] <= 10^9`
  - Running totals can exceed the 32-bit integer range.

  **Follow-up:** checking each window day by day costs `O(n * k)`; can you answer every window in `O(n)`
  total?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_loss_in_each_window
  params:
    - {name: changes, type: "int[]"}
    - {name: k, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def first_loss_in_each_window(changes: list[int], k: int) -> list[int]:
        n = len(changes)
        # prefix[m] = total change of days 0..m-1; the window from day i shrinks on day j
        # exactly when prefix[j + 1] < prefix[i].
        prefix = [0] * (n + 1)
        for m, change in enumerate(changes):
            prefix[m + 1] = prefix[m] + change
        # next_lower[i] = smallest m > i with prefix[m] < prefix[i] (n + 1 if none), via a monotonic stack.
        next_lower = [n + 1] * (n + 1)
        stack: list[int] = []
        for m in range(n + 1):
            while stack and prefix[m] < prefix[stack[-1]]:
                next_lower[stack.pop()] = m
            stack.append(m)
        result = []
        for i in range(n - k + 1):
            day = next_lower[i] - 1
            result.append(day if day <= i + k - 1 else -1)
        return result
  javascript: |
    function firstLossInEachWindow(changes, k) {
      // Scan prefix positions right to left; after popping every position whose prefix total is
      // not lower than the current one, the stack top is the next position with a strictly lower total.
      const n = changes.length;
      const prefix = new Array(n + 1).fill(0);
      for (let m = 0; m < n; m++) prefix[m + 1] = prefix[m] + changes[m];
      const nextLower = new Array(n + 1).fill(n + 1);
      const stack = [];
      for (let m = n; m >= 0; m--) {
        while (stack.length > 0 && prefix[stack[stack.length - 1]] >= prefix[m]) stack.pop();
        if (stack.length > 0) nextLower[m] = stack[stack.length - 1];
        stack.push(m);
      }
      const result = [];
      for (let i = 0; i + k <= n; i++) {
        const day = nextLower[i] - 1;
        result.push(day <= i + k - 1 ? day : -1);
      }
      return result;
    }
