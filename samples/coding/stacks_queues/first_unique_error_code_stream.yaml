version: 1
slug: first_unique_error_code_stream
title: "First One-Off Error Code"
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [sre, backend, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## First One-Off Error Code

  An alerting pipeline receives error codes one at a time. The on-call dashboard highlights a single
  **first one-off code**: among all codes received so far, the code that has appeared **exactly once**
  and arrived **earliest**. Codes are compared exactly (case-sensitive).

  Given the codes in arrival order, return an array of the same length where element `i` is the first
  one-off code after `codes[0..i]` have been received, or `""` (an empty string) if every code received
  so far has appeared at least twice. A code that has repeated never becomes one-off again, no matter
  how many more times it appears.

  ### Example 1
  ```
  Input:  codes = ["E500", "E404", "E500", "E503", "E404"]
  Output: ["E500", "E500", "E404", "E404", "E503"]
  Explanation: after the third code E500 has repeated, so E404 is the earliest one-off code; after the fifth only E503 is still one-off
  ```

  ### Example 2
  ```
  Input:  codes = ["DB_TIMEOUT", "DB_TIMEOUT", "AUTH_401"]
  Output: ["DB_TIMEOUT", "", "AUTH_401"]
  Explanation: after the second code the only code seen has repeated
  ```

  ### Constraints
  - `0 <= codes.length <= 10^5`
  - `1 <= codes[i].length <= 20`
  - `codes[i]` consists of letters, digits, `_` and `-`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_unique_code_per_prefix
  params:
    - {name: codes, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def first_unique_code_per_prefix(codes: list[str]) -> list[str]:
        counts: dict[str, int] = {}
        candidates: deque[str] = deque()
        result: list[str] = []
        for code in codes:
            counts[code] = counts.get(code, 0) + 1
            if counts[code] == 1:
                candidates.append(code)
            while candidates and counts[candidates[0]] > 1:
                candidates.popleft()
            result.append(candidates[0] if candidates else "")
        return result
  javascript: |
    function firstUniqueCodePerPrefix(codes) {
      const counts = new Map();
      const queue = [];
      let head = 0;
      const result = [];
      for (const code of codes) {
        const count = (counts.get(code) || 0) + 1;
        counts.set(code, count);
        if (count === 1) queue.push(code);
        while (head < queue.length && counts.get(queue[head]) > 1) head++;
        result.push(head < queue.length ? queue[head] : "");
      }
      return result;
    }
