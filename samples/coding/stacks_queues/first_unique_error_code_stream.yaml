expected_concepts:
  - "hash map of occurrence counts"
  - "queue of candidates in arrival order"
  - "lazy removal of repeated codes from the front"
  - "amortised O(1) work per code"
optimal_complexity: {time: "O(n) amortised (times code length for hashing)", space: "O(u) where u is the number of distinct codes"}
rubric:
  excellent: "Combines a count map with an arrival-order queue, removes repeated codes lazily from the front, explains why each code is dequeued at most once and states O(n) total time."
  good: "Correct solution with a count map and a queue or ordered map, possibly needing a nudge about lazy removal or the empty-string case."
  weak: "Rescans all codes seen so far for every prefix (quadratic), loses arrival order, or brings back a code after its third occurrence."
  criteria:
    correctness: "All tests pass, including repeated codes, case-sensitive codes and empty answers."
    efficiency: "Linear overall; each code enters and leaves the queue at most once."
    code_quality: "Clear separation of counting and front cleanup with readable names."
    edge_cases: "Empty stream, a single code, all codes identical and codes that appear three or more times."
    communication: "Explains why repeated codes can be discarded permanently and why the cleanup is amortised."
hints:
  - "For each prefix you need the earliest code whose count is exactly one; recomputing that from scratch for every prefix is quadratic."
  - "Keep counts in a hash map and keep codes in arrival order in a queue; once a code has repeated it can never be the answer again."
  - "When a code is seen for the first time, add it to the back of the queue. After updating the count, discard codes from the front while their count is above one. The front of the queue, or an empty string if the queue is empty, is the answer for this prefix."
followups:
  - "How would you support removing old codes that fall outside a time window?"
  - "What changes if the dashboard should show the three earliest one-off codes?"
  - "How would you implement this with a doubly linked list and a map so removal happens eagerly?"
  - "How much memory does this use if most codes are distinct, and how could you bound it?"
common_errors:
  - "Scanning all codes seen so far for every prefix, which is quadratic."
  - "Removing only the current code from the queue instead of cleaning up the front."
  - "Treating a code as one-off again after a third occurrence."
  - "Returning null or skipping the entry instead of an empty string when no code qualifies."
