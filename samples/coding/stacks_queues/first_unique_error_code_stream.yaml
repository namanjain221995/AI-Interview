  - {id: t2, args: [["DB_TIMEOUT", "DB_TIMEOUT", "AUTH_401"]], expected: ["DB_TIMEOUT", "", "AUTH_401"], description: "Example 2 - empty string while every code has repeated"}
  - {id: t3, hidden: true, args: [[]], expected: [], description: "Empty stream returns an empty list"}
  - {id: t4, hidden: true, args: [["X1"]], expected: ["X1"], description: "Single code is its own first one-off code"}
  - {id: t5, hidden: true, args: [["A", "A", "A", "A"]], expected: ["A", "", "", ""], description: "Same code repeated - stays empty after further copies"}
  - {id: t6, hidden: true, args: [["e500", "E500"]], expected: ["e500", "e500"], description: "Codes differing only in case are different codes"}
  - {id: t7, hidden: true, args: [["A", "B", "C", "C", "B", "A", "D"]], expected: ["A", "A", "A", "A", "A", "", "D"], description: "Repeats in reverse order empty the queue, then a new code arrives"}
  - {id: t8, hidden: true, args: [["K", "L", "K", "M", "K", "L"]], expected: ["K", "K", "L", "L", "L", "M"], description: "A third occurrence does not bring a repeated code back"}
