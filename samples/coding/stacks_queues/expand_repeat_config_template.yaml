version: 1
slug: expand_repeat_config_template
title: Expand Repeat Config Template
difficulty: medium
competency_keys: [data_structures, algorithms, code_quality]
role_tags: [backend, frontend, devops]
time_limit_minutes: 20
prompt_markdown: |
  ## Expand Repeat Config Template

  A deployment tool stores long, repetitive config fragments in a compact template syntax. A repeat
  block is written `count[fragment]` and stands for `fragment` written out `count` times in a row.
  Fragments may contain literal characters and further repeat blocks, nested to any depth.

  The template grammar is:

  - a **literal character** is an ASCII letter, `-` or `_`, and stands for itself;
  - a **repeat block** is a decimal `count` from `1` to `999` (no leading zeros), followed by `[`, a
    fragment, and `]`;
  - a fragment (and the whole template) is a sequence of zero or more literal characters and repeat
    blocks, so an empty block such as `4[]` expands to nothing.

  Given a template as the string `compressed`, return its fully expanded string.

  ### Example 1
  ```
  Input:  compressed = "2[ab3[c]]x"
  Output: "abcccabcccx"
  ```

  ### Example 2
  ```
  Input:  compressed = "3[a-]b_"
  Output: "a-a-a-b_"
  ```

  ### Example 3
  ```
  Input:  compressed = "12[z]"
  Output: "zzzzzzzzzzzz"
  Explanation: Counts can have more than one digit.
  ```

  ### Constraints
  - `0 <= compressed.length <= 10^4`
  - The template is always well formed according to the grammar above.
  - The expanded string has at most `10^5` characters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: expand_repeat_template
  params:
    - {name: compressed, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def expand_repeat_template(compressed: str) -> str:
        # Each stack frame: (pieces built at the outer level, count of the block being read).
        stack: list[tuple[list[str], int]] = []
        current: list[str] = []
        count = 0
        for ch in compressed:
            if ch.isdigit():
                count = count * 10 + int(ch)
            elif ch == "[":
                stack.append((current, count))
                current, count = [], 0
            elif ch == "]":
                outer, repeat = stack.pop()
                outer.append("".join(current) * repeat)
                current = outer
            else:
                current.append(ch)
        return "".join(current)
  javascript: |
    function expandRepeatTemplate(compressed) {
      const stack = [];
      let current = [];
      let count = 0;
      for (const ch of compressed) {
        if (ch >= "0" && ch <= "9") {
          count = count * 10 + (ch.charCodeAt(0) - 48);
        } else if (ch === "[") {
          stack.push([current, count]);
          current = [];
          count = 0;
        } else if (ch === "]") {
          const [outer, repeat] = stack.pop();
          outer.push(current.join("").repeat(repeat));
          current = outer;
        } else {
          current.push(ch);
        }
      }
      return current.join("");
    }
tests:
  - {id: t1, args: ["2[ab3[c]]x"], expected: "abcccabcccx", description: "Example 1 - nested block followed by a literal"}
  - {id: t2, args: ["3[a-]b_"], expected: "a-a-a-b_", description: "Example 2 - hyphen and underscore literals"}
  - {id: t3, args: ["12[z]"], expected: "zzzzzzzzzzzz", description: "Example 3 - multi-digit count"}
  - {id: t4, hidden: true, args: [""], expected: "", description: "Empty template expands to the empty string"}
  - {id: t5, hidden: true, args: ["plain_Key-Name"], expected: "plain_Key-Name", description: "No repeat blocks at all; mixed-case literals"}
  - {id: t6, hidden: true, args: ["x4[]y2[3[]]"], expected: "xy", description: "Empty fragments, including nested empty blocks, expand to nothing"}
  - {id: t7, hidden: true, args: ["1[1[1[q]]]"], expected: "q", description: "Deep nesting with count 1 at every level"}
  - {id: t8, hidden: true, args: ["a2[b2[c-]d]e"], expected: "abc-c-dbc-c-de", description: "Literals before, inside and after nested blocks"}
  - {id: t9, hidden: true, args: ["2[10[x]y]3[ab]"], expected: "xxxxxxxxxxyxxxxxxxxxxyababab", description: "Two-digit count inside a block; sibling blocks at top level"}
  - {id: t10, hidden: true, args: ["999[k]"], expected: "", description: "Maximum count; must not build the result by repeated string concatenation in a quadratic way"}
  - {id: t11, hidden: true, args: ["3[node-2[ab_]4[c]]2[x2[y3[z]]]"], expected: "node-ab_ab_ccccnode-ab_ab_ccccnode-ab_ab_ccccxyzzzyzzzxyzzzyzzz", description: "Mixed nested siblings at several levels"}
expected_concepts:
  - "stack of partial results for nested brackets"
  - "parsing multi-digit counts"
  - "building strings with a list and join"
  - "recursive descent as an alternative"
optimal_complexity: {time: "O(n + output length)", space: "O(n + output length)"}
rubric:
  excellent: "Parses the template in one pass with a stack (or clean recursion) that saves the outer partial result and count at each opening bracket, handles multi-digit counts and empty fragments, and explains that the cost is proportional to the input plus the output size."
  good: "Correct stack or recursive solution that needs a nudge on multi-digit counts or on empty blocks."
  weak: "Uses repeated find-and-replace of the innermost block, assumes single-digit counts, or loses the text that came before a nested block."
  criteria:
    correctness: "All tests pass, including empty templates, empty blocks and deep nesting."
    efficiency: "Linear in input plus output; partial results are built with lists or builders."
    code_quality: "Clear separation of digit, open, close and literal cases with meaningful names."
    edge_cases: "Multi-digit counts, empty fragments, literals after a block and no blocks at all."
    communication: "Explains what each stack frame stores and why it is restored at the closing bracket."
hints:
  - "When you reach a closing bracket you need two things that were known earlier: the text built before the block began and the count written in front of it."
  - "Use a stack: at an opening bracket, save the partial result and the count read so far and start a fresh fragment; at a closing bracket, repeat the fragment and attach it to the saved partial result."
  - "Scan character by character: accumulate digits into a count, push the current pieces and the count at an opening bracket and reset both, pop at a closing bracket and append the inner text repeated count times to the restored outer pieces, and append literal characters to the current pieces; join the pieces at the end."
followups:
  - "How would you report the expanded length without building the string, for templates whose output would be gigabytes?"
  - "How would you return the character at a given index of the expansion efficiently?"
  - "How would you validate a template that might be malformed and report the first bad position?"
common_errors:
  - "Reading only the last digit of a multi-digit count."
  - "Forgetting to reset the count after pushing it at an opening bracket."
  - "Losing the text that appeared before a nested block when the block closes."
  - "Building the output with quadratic string concatenation inside loops."
