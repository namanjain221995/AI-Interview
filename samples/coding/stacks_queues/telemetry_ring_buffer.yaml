prompt_markdown: |
  ## Telemetry Ring Buffer

  An embedded device keeps its latest telemetry samples in a fixed-size **ring buffer** of `capacity`
  slots while the uplink is down. Implement the buffer and replay a list of operations against it:

  - `"write x"` stores the non-negative integer `x`. If the buffer is already full, the **oldest** stored
    value is discarded to make room (newest data wins).
  - `"read"` removes the oldest stored value and outputs it. If the buffer is empty, it outputs `-1` and
    changes nothing.
  - `"size"` outputs how many values are currently stored.

  The buffer starts empty. Return the outputs of all `"read"` and `"size"` operations, in the order they
  happen (`"write"` produces no output). If there are no such operations, return an empty list.

  ### Example 1
  ```
  Input:  capacity = 3, ops = ["write 5", "write 8", "read", "write 1", "write 4", "write 9", "size", "read", "read"]
  Output: [5, 3, 1, 4]
  Explanation: the first read returns 5; writing 9 into the full buffer [8, 1, 4] discards 8, leaving [1, 4, 9]
  ```

  ### Example 2
  ```
  Input:  capacity = 1, ops = ["read", "write 7", "write 2", "size", "read", "read"]
  Output: [-1, 1, 2, -1]
  Explanation: reading an empty buffer outputs -1; writing 2 replaces 7 because the buffer holds one value
  ```

  ### Constraints
  - `1 <= capacity <= 10^5`
  - `1 <= ops.length <= 10^4`
  - Each operation is `"write x"` with `0 <= x <= 10^9`, `"read"` or `"size"`.

  **Follow-up:** every operation should take `O(1)` time, using only `O(capacity)` memory.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: simulate_ring_buffer
  params:
    - {name: capacity, type: int}
    - {name: ops, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def simulate_ring_buffer(capacity: int, ops: list[str]) -> list[int]:
        slots = [0] * capacity
        head = 0   # index of the oldest stored value
        count = 0  # number of stored values
        output: list[int] = []
        for op in ops:
            if op.startswith("write"):
                value = int(op.split()[1])
                if count == capacity:
                    # Full: overwrite the oldest slot and advance the head past it.
                    slots[head] = value
                    head = (head + 1) % capacity
                else:
                    slots[(head + count) % capacity] = value
                    count += 1
            elif op == "read":
                if count == 0:
                    output.append(-1)
                else:
                    output.append(slots[head])
                    head = (head + 1) % capacity
                    count -= 1
            else:  # size
                output.append(count)
        return output
  javascript: |
    function simulateRingBuffer(capacity, ops) {
      const slots = new Array(capacity).fill(0);
      let head = 0;
      let count = 0;
      const output = [];
      for (const op of ops) {
        if (op.startsWith("write")) {
          const value = Number(op.slice(6));
          if (count === capacity) {
            slots[head] = value;
            head = (head + 1) % capacity;
          } else {
            slots[(head + count) % capacity] = value;
            count += 1;
          }
        } else if (op === "read") {
          if (count === 0) {
            output.push(-1);
          } else {
            output.push(slots[head]);
            head = (head + 1) % capacity;
            count -= 1;
          }
        } else {
          output.push(count);
        }
      }
      return output;
    }
