expected_concepts:
  - fixed-size array used as a circular buffer
  - head index plus count (or head and tail) with modulo wrap-around
  - overwriting the oldest value when full
  - O(1) time per operation and O(capacity) memory
optimal_complexity: {time: O(n), space: O(capacity)}
rubric:
  excellent: "Implements a true ring with a fixed array, head index and count, handles full and empty states without ambiguity, keeps parsing separate from buffer logic and explains O(1) per operation."
  good: "Correct behaviour using a library deque or queue with manual eviction, or a ring with a small off-by-one fixed during testing."
  weak: "Shifts the whole array on every read or write, lets the buffer grow past capacity, or discards the newest value instead of the oldest."
  criteria:
    correctness: "All tests pass, including reads on an empty buffer, capacity 1 and long runs of overwrites."
    efficiency: "Constant time per operation; no array shifting or rebuilding."
    code_quality: "Buffer state is encapsulated (a small class or clearly named variables) and full versus empty is unambiguous."
    edge_cases: "Capacity 1, reads when empty, size when empty and wrap-around after the buffer was emptied."
    communication: "Explains how the head and count move on each operation and why full and empty can be told apart."
hints:
  - "A fixed number of slots is enough; instead of moving values around, what could you move to mark where the oldest value sits?"
  - "Keep a fixed array plus the index of the oldest value and the number of stored values; the slot for the next write can be derived from those two numbers with wrap-around."
  - "For a write, if the buffer is full overwrite the slot at the oldest index and advance that index, otherwise place the value at the oldest index plus the count, wrapped, and increase the count; for a read, output minus one when the count is zero, otherwise output the oldest slot, advance the index and decrease the count; size outputs the count."
followups:
  - "How would you make the buffer safe for one producer thread and one consumer thread?"
  - "What would change if a full buffer should reject new writes instead of discarding old data?"
  - "How would you add a peek operation, or read the newest value instead of the oldest?"
common_errors:
  - "Using only head and tail indices, which makes a full buffer look the same as an empty one."
  - "Forgetting to advance the oldest index when a write overwrites it."
  - "Shifting array elements on every read, which makes each operation O(capacity)."
  - "Including write operations in the output list."
