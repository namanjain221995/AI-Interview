time_limit_minutes: 30
prompt_markdown: |
  ## Alert Triage Frequency Stack

  An on-call tool collects firing alerts on a triage pile. The same alert id can be on the pile many
  times (every repeat firing is pushed again). When an engineer takes the next item, the tool should
  hand out the **noisiest** alert, and among equally noisy alerts the **freshest** one.

  You receive the operations `ops` in order. Each operation is one of:

  - `"push x"`: put one copy of alert id `x` on top of the pile;
  - `"pop"`: let `c` be the largest number of copies any single id currently has on the pile. Among
    the ids with `c` copies, take the one whose topmost copy is closest to the top of the pile
    (that is, pushed most recently among the copies still on the pile), remove that one copy and output
    its id. If the pile is empty, output `-1` and change nothing.

  Return the outputs of all `"pop"` operations, in order.

  ### Example 1
  ```
  Input:  ops = ["push 301", "push 118", "push 301", "push 42", "push 118", "pop", "pop", "pop", "pop", "pop", "pop"]
  Output: [118, 301, 42, 118, 301, -1]
  Explanation: 301 and 118 both have 2 copies and the top copy of 118 is fresher, so 118 goes first,
  then 301 (now the only id with 2 copies); afterwards every id has 1 copy and they leave newest first
  ```

  ### Example 2
  ```
  Input:  ops = ["pop", "push 9", "push 9", "push 3", "pop", "push 3", "pop", "pop"]
  Output: [-1, 9, 3, 3]
  ```

  ### Constraints
  - `1 <= ops.length <= 2 * 10^4`
  - Every operation is exactly `"pop"` or `"push x"` with one space, where `x` is an integer with
    `0 <= x <= 10^9` written without leading zeros.

  **Follow-up:** can every operation run in `O(1)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: simulate_frequency_stack
  params:
    - {name: ops, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def simulate_frequency_stack(ops: list[str]) -> list[int]:
        count: dict[int, int] = {}
        # levels[k] holds, in push order, the ids whose (k + 1)-th copy is on the pile.
        levels: list[list[int]] = []
        results: list[int] = []
        for op in ops:
            if op.startswith("push"):
                alert = int(op.split()[1])
                count[alert] = count.get(alert, 0) + 1
                if count[alert] > len(levels):
                    levels.append([])
                levels[count[alert] - 1].append(alert)
            elif not levels:
                results.append(-1)
            else:
                alert = levels[-1].pop()
                if not levels[-1]:
                    levels.pop()
                count[alert] -= 1
                results.append(alert)
        return results
  javascript: |
    function simulateFrequencyStack(ops) {
      const count = new Map();
      // levels[k] holds, in push order, the ids whose (k + 1)-th copy is on the pile.
      const levels = [];
      const results = [];
      for (const op of ops) {
        if (op.startsWith("push")) {
          const alert = Number(op.slice(5));
          const c = (count.get(alert) || 0) + 1;
          count.set(alert, c);
          if (c > levels.length) levels.push([]);
          levels[c - 1].push(alert);
        } else if (levels.length === 0) {
          results.push(-1);
        } else {
          const top = levels[levels.length - 1];
          const alert = top.pop();
          if (top.length === 0) levels.pop();
          count.set(alert, count.get(alert) - 1);
          results.push(alert);
        }
      }
      return results;
    }
