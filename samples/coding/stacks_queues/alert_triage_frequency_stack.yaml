expected_concepts:
  - hash map from id to its current number of copies
  - one stack per frequency level (the k-th copy of an id goes on stack k)
  - the highest non-empty level gives the answer; its top is the freshest tie
  - O(1) push and pop without scanning or a heap
  - parsing operation strings and the empty-pile sentinel
optimal_complexity: {time: O(1) per operation, space: O(n)}
rubric:
  excellent: "Derives the per-frequency stacks (or an equivalent structure) with a clear argument that the top of the highest level is exactly the most frequent and freshest id, gets O(1) per operation, handles the empty pile, and writes a tidy simulation loop with clean parsing."
  good: "Reaches a correct heap-based solution keyed by (count, push sequence) in O(log n) per operation, or the O(1) design with some hints."
  weak: "Scans the whole pile on every pop, breaks ties by id value or by the first push instead of the freshest copy, or forgets to decrement counts."
  criteria:
    correctness: "All tests pass, including ties, interleaved pushes and pops and pops on an empty pile."
    efficiency: "O(1) amortised per operation; a heap solution is acceptable but noted as O(log n)."
    code_quality: "Data structure state is encapsulated or clearly named; parsing is separated from the core logic."
    edge_cases: "Only pushes, only pops, a single id repeated, ids 0 and 10^9."
    communication: "Explains why an id appears on several level stacks at once and why that is consistent."
hints:
  - "Tie-breaking by freshness sounds like a stack, and choosing by count sounds like grouping by frequency. How could you combine the two?"
  - "When an id gets its k-th copy, record it in a group for frequency k in push order; the answer always comes from the highest frequency that has any entries."
  - "Keep a map from id to count and a list of stacks where stack k holds the ids at the moment they reached count k plus one; a push increments the count and pushes onto that level; a pop takes the top of the highest non-empty level, decrements that id's count and drops the level when it becomes empty."
followups:
  - "How would you add a peek operation, or a remove-all-copies-of-id operation, while keeping operations fast?"
  - "If alerts expire after a time-to-live, how would you remove stale copies efficiently?"
  - "How would you make the structure safe for concurrent pushes from many producers?"
common_errors:
  - "Breaking ties by the earliest push or by id value instead of the freshest copy still on the pile."
  - "Keeping only the latest frequency of each id in a single structure, so lower levels are lost after a pop."
  - "Scanning the whole pile on every pop, which is O(n) per operation."
  - "Not decrementing the count, or not dropping the empty top level, after a pop."
