version: 1
slug: metric_prefix_shared_by_k
title: Metric Prefix Shared by K Names
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [sre, devops, data, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Metric Prefix Shared by K Names

  Your monitoring dashboard groups metrics into folders automatically. Given the metric `names`
  a team publishes and a threshold `k`, the folder name is the **longest string that is a prefix
  of at least `k` entries** of `names`.

  - Every entry counts separately: a name that appears twice counts twice.
  - A name is a prefix of itself.
  - If several qualifying prefixes share the maximum length, return the lexicographically
    smallest one, comparing character codes (so `.` < digits < `_` < lowercase letters).
  - If no non-empty prefix is shared by at least `k` entries, return the empty string `""`.

  ### Example 1
  ```
  Input:  names = ["api.latency.p99", "api.latency.p50", "api.errors", "db.latency"], k = 2
  Output: "api.latency.p"
  ```
  `"api.latency.p"` is a prefix of two names; nothing longer is shared by two.

  ### Example 2
  ```
  Input:  names = ["cpu.user", "mem.free", "disk.io"], k = 2
  Output: ""
  ```

  ### Example 3
  ```
  Input:  names = ["io.writes", "db.rows", "io.wait", "db.reads"], k = 2
  Output: "db.r"
  ```
  `"db.r"` and `"io.w"` both have length 4 and are each shared by two names; `"db.r"` is smaller.

  ### Constraints
  - `1 <= names.length <= 10^4`
  - `1 <= names[i].length <= 100`
  - `names[i]` contains only lowercase English letters, digits, `.` and `_`
  - `1 <= k <= names.length`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: metric_prefix_shared_by_k
  params:
    - {name: names, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def metric_prefix_shared_by_k(names: list[str], k: int) -> str:
        # Names sharing a prefix form one contiguous block once sorted, so the
        # longest prefix shared by k names is the longest common prefix of the
        # first and last name of some window of k consecutive sorted names.
        ordered = sorted(names)
        best = ""
        for i in range(len(ordered) - k + 1):
            first, last = ordered[i], ordered[i + k - 1]
            length = 0
            limit = min(len(first), len(last))
            while length < limit and first[length] == last[length]:
                length += 1
            candidate = first[:length]
            if len(candidate) > len(best) or (len(candidate) == len(best) and candidate < best):
                best = candidate
        return best
  javascript: |
    function metricPrefixSharedByK(names, k) {
      // Default sort compares UTF-16 code units, which matches character codes here.
      const ordered = [...names].sort();
      let best = "";
      for (let i = 0; i + k - 1 < ordered.length; i++) {
        const first = ordered[i];
        const last = ordered[i + k - 1];
        const limit = Math.min(first.length, last.length);
        let length = 0;
        while (length < limit && first[length] === last[length]) length++;
        const candidate = first.slice(0, length);
        if (candidate.length > best.length || (candidate.length === best.length && candidate < best)) {
          best = candidate;
        }
      }
      return best;
    }
