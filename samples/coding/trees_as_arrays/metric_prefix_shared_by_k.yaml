expected_concepts:
- names sharing a prefix are contiguous after sorting
- longest common prefix of the first and last name in a window of k sorted names
- alternatively a trie whose nodes count how many names pass through them
- tie-breaking by length first, then lexicographic order
- duplicates counted separately and a name being a prefix of itself
optimal_complexity:
  time: O(S log n) with sorting, or O(S) with a counting trie (S = total characters)
  space: O(S)
rubric:
  excellent: Explains why sorted order makes every qualifying group contiguous (or builds a counting trie), computes the window prefix from the first and last name only, applies the length-then-lexicographic tie rule and states the complexity in terms of total characters.
  good: Reaches a correct trie or sorting solution with a small fix after testing, for example the tie rule or the empty answer.
  weak: Counts every prefix of every name against every other name (quadratic or worse), ignores duplicates, or returns the most frequent prefix instead of the longest one.
  criteria:
    correctness: All tests pass, including duplicates, a name that is a prefix of others and the empty answer.
    efficiency: Sorting plus a linear window scan, or a single trie pass; no pairwise comparison of all names.
    code_quality: Clear separation between finding the candidate prefix and comparing it with the best so far.
    edge_cases: k = 1, k equal to the number of names, equal-length ties and names that are prefixes of each other.
    communication: Argues why checking only the first and last name of a sorted window is enough.
hints:
- A prefix shared by k names must also be shared by any k names you pick from that group, so think about which names naturally end up next to each other.
- If you sort the names, all names that start with the same string sit in one contiguous block; the common prefix of a block is decided by its first and last name.
- Sort the names, slide a window of exactly k consecutive names, take the common prefix of the first and last name in each window, and keep the longest one, preferring the lexicographically smaller string on equal length.
followups:
- How would a trie that stores a pass-through count on every node solve this, and when would it beat sorting?
- How would you return every folder prefix shared by at least k names, not only the longest one?
- What changes if new metric names arrive continuously and the answer must stay up to date?
- How would you handle names given in mixed case if folders should be case-insensitive?
common_errors:
- Counting distinct names only, so duplicated metric names never reach k.
- Comparing only adjacent sorted names, which finds prefixes shared by two names instead of k.
- Returning the most common prefix rather than the longest prefix that reaches k.
- Forgetting the tie rule or comparing ties by first appearance in the input.
- Assuming a name cannot be a prefix of another name.
