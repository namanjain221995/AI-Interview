version: 1
slug: relative_path_between_dirs
title: Relative Path Between Directories
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [devops, platform, backend, fullstack]
time_limit_minutes: 12
prompt_markdown: |
  ## Relative Path Between Directories

  A deployment tool keeps several releases side by side and links each release to shared assets with
  **relative** symbolic links, so the whole tree can be moved to another host without breaking. To
  create a link inside directory `from_dir` that points at directory `to_dir`, the tool needs the
  shortest relative path that leads from `from_dir` to `to_dir`.

  Both inputs are absolute, normalised directory paths: they start with `/`, use a single `/` between
  segments, have no trailing slash (the root is written `"/"`) and contain no empty, `.` or `..`
  segments. Segments are compared exactly (case-sensitive), as whole names.

  Build the answer as follows:

  1. find the deepest directory that contains both `from_dir` and `to_dir` (it may be either of them);
  2. add one `..` for every segment you must climb from `from_dir` up to that directory;
  3. add the segments that lead down from that directory to `to_dir`, in order.

  Join the pieces with `/`, with no leading or trailing slash. If `from_dir` and `to_dir` are the same
  directory, return `"."`.

  ### Example 1
  ```
  Input:  from_dir = "/srv/app/releases/v2", to_dir = "/srv/app/shared/config"
  Output: "../../shared/config"
  Explanation: Both live under /srv/app: climb out of v2 and releases, then go down into shared/config.
  ```

  ### Example 2
  ```
  Input:  from_dir = "/srv/app/releases/v2", to_dir = "/srv/app/releases/v2"
  Output: "."
  ```

  ### Example 3
  ```
  Input:  from_dir = "/", to_dir = "/etc/nginx/conf.d"
  Output: "etc/nginx/conf.d"
  ```

  ### Constraints
  - `1 <= from_dir.length, to_dir.length <= 3000`
  - Segments contain letters, digits, `-`, `_` and `.` (but are never exactly `.` or `..`)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: relative_path_between_dirs
  params:
    - {name: from_dir, type: "string"}
    - {name: to_dir, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def relative_path_between_dirs(from_dir: str, to_dir: str) -> str:
        src = [part for part in from_dir.split("/") if part]
        dst = [part for part in to_dir.split("/") if part]
        common = 0
        while common < len(src) and common < len(dst) and src[common] == dst[common]:
            common += 1
        pieces = [".."] * (len(src) - common) + dst[common:]
        return "/".join(pieces) if pieces else "."
  javascript: |
    function relativePathBetweenDirs(fromDir, toDir) {
      const src = fromDir.split("/").filter((part) => part.length > 0);
      const dst = toDir.split("/").filter((part) => part.length > 0);
      let common = 0;
      while (common < src.length && common < dst.length && src[common] === dst[common]) common += 1;
      const pieces = [];
      for (let i = common; i < src.length; i++) pieces.push("..");
      for (let i = common; i < dst.length; i++) pieces.push(dst[i]);
      return pieces.length > 0 ? pieces.join("/") : ".";
    }
tests:
  - {id: t1, args: ["/srv/app/releases/v2", "/srv/app/shared/config"], expected: "../../shared/config", description: "Example 1 - climb two levels to /srv/app then descend into shared/config"}
  - {id: t2, args: ["/srv/app/releases/v2", "/srv/app/releases/v2"], expected: ".", description: "Example 2 - same directory returns a single dot"}
  - {id: t3, args: ["/", "/etc/nginx/conf.d"], expected: "etc/nginx/conf.d", description: "Example 3 - from the root only downward segments are needed"}
  - {id: t4, hidden: true, args: ["/home/ci/workspace/build", "/"], expected: "../../../..", description: "To the root: only .. segments, one per level"}
  - {id: t5, hidden: true, args: ["/var/log", "/var/logs/archive"], expected: "../logs/archive", description: "Prefix trap: log vs logs share only /var"}
  - {id: t6, hidden: true, args: ["/opt/tools", "/opt/tools/bin/linux"], expected: "bin/linux", description: "Target is a descendant - no .. at all"}
  - {id: t7, hidden: true, args: ["/opt/tools/bin/linux", "/opt/tools"], expected: "../..", description: "Target is an ancestor - only .. segments"}
  - {id: t8, hidden: true, args: ["/Data/exports", "/data/exports"], expected: "../../data/exports", description: "Case-sensitive: Data and data differ at the first segment"}
  - {id: t9, hidden: true, args: ["/srv/app/releases/2026.10.08-1", "/srv/app/releases/2026.10.08"], expected: "../2026.10.08", description: "Dotted sibling names that are character prefixes of each other"}
  - {id: t10, hidden: true, args: ["/", "/"], expected: ".", description: "Root to root returns a single dot"}
  - {id: t11, hidden: true, args: ["/d0/d1/d2/d3/d4/d5/d6/d7/d8/d9/d10/d11/d12/d13/d14/d15/d16/d17/d18/d19/d20/d21/d22/d23/d24/d25/d26/d27/d28/d29/d30/d31/d32/d33/d34/d35/d36/d37/d38/d39/left/x/y", "/d0/d1/d2/d3/d4/d5/d6/d7/d8/d9/d10/d11/d12/d13/d14/d15/d16/d17/d18/d19/d20/d21/d22/d23/d24/d25/d26/d27/d28/d29/d30/d31/d32/d33/d34/d35/d36/d37/d38/d39/right/z"], expected: "../../../right/z", description: "Deep shared prefix of 40 segments before the branches split"}
expected_concepts:
  - "segment-wise common prefix of two paths"
  - "one .. per remaining segment of the source"
  - "appending the remaining target segments"
  - "special cases: same directory and the root"
optimal_complexity: {time: "O(len(from_dir) + len(to_dir))", space: "O(len(from_dir) + len(to_dir))"}
rubric:
  excellent: "Splits both paths into segments, finds the shared segment prefix, emits one .. per leftover source segment followed by the leftover target segments, handles the same-directory and root cases and explains why character prefixes are wrong."
  good: "Correct answer after fixing one special case (same directory, root input or the log/logs prefix trap)."
  weak: "Uses string startswith or a character-level prefix, produces leading or trailing slashes, or returns an empty string when the directories are equal."
  criteria:
    correctness: "All tests pass, including ancestors, descendants, the root and prefix traps."
    efficiency: "Linear in the total length of the two paths."
    code_quality: "Clear names (common, ups, downs) and the special cases handled without a chain of ad hoc branches."
    edge_cases: "Same directory, root as either end, case-sensitive segments and deep shared prefixes."
    communication: "Walks through the worked example (v2 to shared/config) before coding."
hints:
  - "Work with the two lists of directory names rather than the raw strings."
  - "The names both lists start with describe the shared ancestor; everything after it in the source tells you how far to climb, and everything after it in the target tells you where to go down."
  - "Count how many leading names are equal in both lists, output one double-dot for every remaining source name, then the remaining target names, joined with single slashes; if nothing at all was produced the two directories are the same and the answer is a single dot."
followups:
  - "How would you support a target that is a file rather than a directory?"
  - "What would change if the inputs could contain . and .. segments or symlinks?"
  - "When is a relative link preferable to an absolute one in a deployment layout, and when is it worse?"
common_errors:
  - "Comparing characters instead of whole segments, so /var/log looks like an ancestor of /var/logs."
  - "Returning an empty string instead of a dot when both directories are the same."
  - "Producing a leading or trailing slash, or a double slash, when one side is the root."
  - "Counting .. segments from the target instead of the source."
