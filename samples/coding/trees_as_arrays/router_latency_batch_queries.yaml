reference_solutions:
  python: |
    def router_latency_batch_queries(parent: list[int], latency: list[int], pairs: list[list[int]]) -> list[int]:
        n = len(parent)
        children: list[list[int]] = [[] for _ in range(n)]
        root = 0
        for node, up in enumerate(parent):
            if up == -1:
                root = node
            else:
                children[up].append(node)
        depth = [0] * n
        dist = [0] * n
        order = [root]
        for node in order:
            for child in children[node]:
                depth[child] = depth[node] + 1
                dist[child] = dist[node] + latency[child]
                order.append(child)
        levels = max(1, (n - 1).bit_length())
        jump = [[node if up == -1 else up for node, up in enumerate(parent)]]
        for _ in range(1, levels):
            prev = jump[-1]
            jump.append([prev[prev[node]] for node in range(n)])

        def lowest_common(a: int, b: int) -> int:
            if depth[a] < depth[b]:
                a, b = b, a
            diff = depth[a] - depth[b]
            level = 0
            while diff:
                if diff & 1:
                    a = jump[level][a]
                diff >>= 1
                level += 1
            if a == b:
                return a
            for level in range(levels - 1, -1, -1):
                if jump[level][a] != jump[level][b]:
                    a = jump[level][a]
                    b = jump[level][b]
            return jump[0][a]

        return [dist[a] + dist[b] - 2 * dist[lowest_common(a, b)] for a, b in pairs]
  javascript: |
    function routerLatencyBatchQueries(parent, latency, pairs) {
      const n = parent.length;
      const children = Array.from({ length: n }, () => []);
      let root = 0;
      for (let node = 0; node < n; node++) {
        if (parent[node] === -1) root = node;
        else children[parent[node]].push(node);
      }
      const depth = new Array(n).fill(0);
      const dist = new Array(n).fill(0);
      const order = [root];
      for (let i = 0; i < order.length; i++) {
        const node = order[i];
        for (const child of children[node]) {
          depth[child] = depth[node] + 1;
          dist[child] = dist[node] + latency[child];
          order.push(child);
        }
      }
      let levels = 1;
      while ((1 << levels) <= n - 1) levels++;
      const jump = [parent.map((up, node) => (up === -1 ? node : up))];
      for (let level = 1; level < levels; level++) {
        const prev = jump[level - 1];
        jump.push(prev.map((up) => prev[up]));
      }
      const lowestCommon = (a, b) => {
        if (depth[a] < depth[b]) [a, b] = [b, a];
        let diff = depth[a] - depth[b];
        for (let level = 0; diff > 0; level++, diff >>= 1) {
          if (diff & 1) a = jump[level][a];
        }
        if (a === b) return a;
        for (let level = levels - 1; level >= 0; level--) {
          if (jump[level][a] !== jump[level][b]) {
            a = jump[level][a];
            b = jump[level][b];
          }
        }
        return jump[0][a];
      };
      return pairs.map(([a, b]) => dist[a] + dist[b] - 2 * dist[lowestCommon(a, b)]);
    }
