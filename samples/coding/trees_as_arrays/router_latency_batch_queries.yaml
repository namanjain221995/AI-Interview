expected_concepts:
  - "rooting the tree from the parent array (the core is not necessarily router 0)"
  - "prefix latency from the core so a route costs dist[a] + dist[b] - 2 * dist[lca]"
  - "lowest common ancestor with binary lifting (or Euler tour plus sparse table, or offline Tarjan)"
  - "iterative traversal to avoid recursion limits on chain-shaped trees"
  - "64-bit sums"
optimal_complexity: {time: "O((n + q) log n)", space: "O(n log n)"}
rubric:
  excellent: "Turns the problem into prefix distances plus a lowest common ancestor, implements binary lifting (or an equivalent LCA structure) iteratively, handles a == b, ancestor pairs and a core that is not router 0, uses 64-bit sums and states O((n + q) log n)."
  good: "Reaches the prefix-distance plus LCA idea and implements it with minor bugs fixed after prompting, or uses a correct but slower per-query walk while clearly explaining how to speed it up."
  weak: "Runs a fresh BFS or DFS per query, assumes parents have smaller indices or that router 0 is the core, or overflows 32-bit sums."
  criteria:
    correctness: "All tests pass, including self-pairs, ancestor/descendant pairs, chains and shuffled labels."
    efficiency: "Logarithmic work per query after O(n log n) preprocessing; no per-query traversal of the tree."
    code_quality: "Separate steps for building children, computing depth and distance, building the jump table and answering queries."
    edge_cases: "Single router, empty batch, zero-latency links, deep chains and totals beyond 32-bit."
    communication: "Explains why the shared part of the two root paths must be subtracted twice."
hints:
  - "If you knew the total latency from the core down to every router, how could you combine two of those totals to get the latency between any two routers?"
  - "The route between a and b goes up to their lowest common ancestor and back down, so the answer is the core distance of a plus that of b minus twice the core distance of that ancestor. The remaining problem is finding the common ancestor quickly for many pairs."
  - "Root the tree at the core, compute depth and core distance with an iterative BFS, then build a binary lifting table where entry k of a router is its ancestor 2 to the power k levels up. For each pair, lift the deeper router until both depths match, stop if they are equal, otherwise lift both together from the largest power down while their ancestors differ; the parent of either router is the common ancestor."
followups:
  - "How would you answer the queries offline in near-linear time instead?"
  - "How would the solution change if link latencies could be updated between queries?"
  - "How would you return the slowest single link on each route instead of the total?"
  - "What changes if the network is not a tree but has a few redundant links?"
common_errors:
  - "Assuming router 0 is the core or that parent indices are smaller than child indices."
  - "Walking parent pointers one step at a time per query, which is O(n) per query on a chain."
  - "Recursive DFS that overflows the stack on a 10^5-long chain."
  - "Off-by-one in the number of lifting levels, so deep chains are not lifted far enough."
  - "Using 32-bit integers for the sums."
