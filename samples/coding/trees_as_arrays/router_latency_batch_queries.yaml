slug: router_latency_batch_queries
title: Router Latency Batch Queries
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [network, backend, sre, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## Router Latency Batch Queries

  A backbone network of `n` routers, numbered `0` to `n - 1`, is wired as a **tree**: there is exactly
  one route between any two routers. The topology is given as `parent`, where `parent[i]` is the router
  that router `i` uplinks to, and exactly one router (the core) has `parent[i] == -1`. `latency[i]` is the
  latency in microseconds of the link between router `i` and `parent[i]`; the core has `latency = 0`.

  The capacity team sends a batch of `pairs`, each `[a, b]`. For every pair, return the **total latency**
  of the unique route between router `a` and router `b` (the sum of the link latencies along it). A pair
  with `a == b` has latency `0`.

  Return the answers as an array in the same order as `pairs` (an empty array when `pairs` is empty).
  Totals can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], latency = [0, 4, 7, 2, 5, 1], pairs = [[3, 4], [3, 5], [0, 0], [5, 2]]
  Output: [7, 14, 0, 1]
  Explanation: 3 -> 1 -> 4 costs 2 + 5 = 7; 3 -> 1 -> 0 -> 2 -> 5 costs 2 + 4 + 7 + 1 = 14;
  a router to itself costs 0; 5 -> 2 is a single link of latency 1.
  ```

  ### Example 2
  ```
  Input:  parent = [2, -1, 1, 2], latency = [3, 0, 10, 6], pairs = [[0, 3], [1, 0], [3, 1]]
  Output: [9, 13, 16]
  Explanation: router 1 is the core; routers 0 and 3 both uplink to router 2.
  ```

  ### Constraints
  - `1 <= n == parent.length == latency.length <= 10^5`
  - exactly one `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]` and the links form a tree
    (a parent can have a larger index than its child)
  - `latency[core] == 0` and `0 <= latency[i] <= 10^9` for every other router
  - `0 <= pairs.length <= 10^5`, `pairs[j] = [a, b]` with `0 <= a, b < n`
  - The tree can be a single long chain, so walking up one link at a time per query is too slow.
