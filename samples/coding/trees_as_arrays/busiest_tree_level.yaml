expected_concepts:
  - heap layout of a binary tree in an array (children at 2i+1 and 2i+2)
  - level boundaries at positions 2^k - 1 through 2^(k+1) - 2
  - level-order aggregation without building nodes
  - tie-breaking with a strict comparison
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Walks the array level by level using doubling widths (or computes the level from the index), skips empty slots, handles a partial last level and ties with a strict comparison, and states O(n) time with O(1) extra space.
  good: Correct answer via a queue-based BFS over indices or after building nodes, possibly with O(n) extra space or a small prompt about ties or the partial level.
  weak: Adds -1 values into totals, ignores the partial last level, returns the largest level on ties, or computes level boundaries incorrectly.
  criteria:
    correctness: All tests pass, including partial last levels, all-zero trees and ties.
    efficiency: Single pass over the array without materialising a node structure.
    code_quality: Clear names for level start, width and running best; no off-by-one in slicing.
    edge_cases: Single node, empty slots, a final level made only of -1 and exact ties.
    communication: Explains why level k starts at 2^k - 1 and how ties are resolved.
hints:
  - In this layout every level occupies a contiguous block of the array. Work out where each block starts and how wide it is.
  - Level 0 has one slot, and each following level has twice as many slots as the previous one, so you can walk the array block by block while keeping a running best total.
  - Keep a start position and a width that doubles after each level; sum the non-empty values in the current block (stopping at the end of the array), and replace the best answer only when a block total is strictly larger, so the earliest level keeps any tie.
followups:
  - How would you return the level with the largest average traffic per present relay instead?
  - How would the solution change if the tree were stored as linked nodes rather than an array?
  - Why does the heap layout become wasteful for a tall, narrow tree, and what format would you use instead?
common_errors:
  - Adding the -1 placeholders into a level total.
  - Stopping before a partial last level or reading past the end of the array.
  - Using a non-strict comparison so that ties resolve to the deepest level.
  - Computing level boundaries with an off-by-one (for example treating positions 2..5 as level 2).
