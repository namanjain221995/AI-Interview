slug: busiest_tree_level
title: Busiest Relay Level
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [general, backend, network, data]
time_limit_minutes: 12
prompt_markdown: |
  ## Busiest Relay Level

  A field deployment of sensor relays is wired as a binary tree: every relay forwards traffic to its
  parent relay, and the gateway at the top is the root. The monitoring service exports the tree as a
  flat array `tree` in **heap layout**, level by level from left to right:

  - position `0` is the gateway (it is always present),
  - the two downstream slots of position `i` are positions `2*i + 1` (left) and `2*i + 2` (right),
  - `-1` marks an empty slot; every slot below an empty slot is also `-1` (or past the end of the array),
  - any other value is the number of messages that relay handled in the last hour (`>= 0`).

  Level `0` is the gateway, level `1` holds positions `1..2`, level `2` holds positions `3..6`, and so
  on. The array may end part-way through a level; missing positions are empty.

  Return the **0-based level** whose relays handled the **largest total** number of messages. Empty
  slots contribute nothing. If several levels share the largest total, return the **smallest** such
  level.

  ### Example 1
  ```
  Input:  tree = [3, 5, 1, 4, -1, 2, 6]
  Output: 2
  Explanation: level 0 totals 3, level 1 totals 5 + 1 = 6, level 2 totals 4 + 2 + 6 = 12.
  ```

  ### Example 2
  ```
  Input:  tree = [10, 4, 6, 1, -1, -1, 3]
  Output: 0
  Explanation: levels 0 and 1 both total 10 (level 2 totals 4); the smaller level wins the tie.
  ```

  ### Constraints
  - `1 <= tree.length <= 10^4`
  - `tree[0] != -1`
  - every value is `-1` or in `0..10^5`
  - every slot below an empty slot is `-1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: busiest_tree_level
  params:
    - {name: tree, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def busiest_tree_level(tree: list[int]) -> int:
        best_level, best_total = 0, -1
        level, start, width = 0, 0, 1
        while start < len(tree):
            total = 0
            for value in tree[start:start + width]:
                if value != -1:
                    total += value
            if total > best_total:
                best_level, best_total = level, total
            start += width
            width *= 2
            level += 1
        return best_level
  javascript: |
    function busiestTreeLevel(tree) {
      let bestLevel = 0;
      let bestTotal = -1;
      let level = 0;
      let start = 0;
      let width = 1;
      while (start < tree.length) {
        let total = 0;
        const end = Math.min(start + width, tree.length);
        for (let i = start; i < end; i++) {
          if (tree[i] !== -1) total += tree[i];
        }
        if (total > bestTotal) {
          bestLevel = level;
          bestTotal = total;
        }
        start += width;
        width *= 2;
        level += 1;
      }
      return bestLevel;
    }
