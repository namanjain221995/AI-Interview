expected_concepts:
  - "array representation of a complete binary tree"
  - "parent and child index arithmetic"
  - "checking each parent-child edge once"
  - "handling a last parent with a single child"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Checks every parent-child pair exactly once (either looping over children and comparing with the parent at (i - 1) / 2, or looping over parents with bounds checks), allows equality, handles empty input and explains O(n) time and O(1) space."
  good: "Correct after fixing a bounds issue on the last parent or the integer division for the parent index."
  weak: "Only checks that the array is sorted, only compares the root with everything else, uses a strict comparison that rejects duplicates, or reads past the end of the array."
  criteria:
    correctness: "All tests pass, including duplicates, extreme values and a violation at the last leaf."
    efficiency: "Single linear pass with constant extra memory."
    code_quality: "Index arithmetic is clearly named and bounds checks are explicit."
    edge_cases: "Empty array, one element, an even-length array whose last parent has a single child."
    communication: "Explains why checking only direct parent-child pairs is enough for the whole heap property."
hints:
  - "The heap property is about direct parent and child pairs, and the positions of those pairs follow from the index formula."
  - "If every element is no larger than each of its direct children, then by following the chain the root is no larger than anything; so you only need to check each direct edge once, being careful about children that fall outside the array."
  - "Walk over every index from one to the end, compute its parent as one less than the index divided by two rounded down, and fail as soon as the parent's value is strictly greater than the child's; if the loop finishes, the snapshot is valid, which also covers empty and single-element arrays."
followups:
  - "If the snapshot is invalid, how would you repair it in O(n) instead of re-inserting every element?"
  - "How would the check change for a max-heap or for a d-ary heap with d children per node?"
  - "How would you find the first index where the snapshot became invalid, to diagnose the crash?"
common_errors:
  - "Using a strict less-than comparison, which rejects valid heaps with equal priorities."
  - "Checking that the whole array is sorted, which rejects many valid heaps."
  - "Reading the right child of the last parent without checking that it exists."
  - "Using floating-point division for the parent index in languages without integer division."
