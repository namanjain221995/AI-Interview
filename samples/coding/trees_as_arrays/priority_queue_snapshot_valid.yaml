  - {id: t2, args: [[2, 5, 3, 4, 1]], expected: false, description: "Example 2 - parent 5 at index 1 is greater than its children"}
  - {id: t3, args: [[]], expected: true, description: "Example 3 - an empty snapshot is valid"}
  - {id: t4, hidden: true, args: [[42]], expected: true, description: "Single element is valid"}
