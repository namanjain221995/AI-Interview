version: 1
slug: priority_queue_snapshot_valid
title: Priority Queue Snapshot Check
difficulty: easy
competency_keys: [data_structures, algorithms, debugging]
role_tags: [backend, general, platform, qa]
time_limit_minutes: 12
prompt_markdown: |
  ## Priority Queue Snapshot Check

  A job scheduler keeps pending jobs in a binary **min-heap** keyed by priority (lower number runs
  first). When it crashes, it writes the heap's backing array to a snapshot file, and on restart it wants
  to know whether the snapshot can be trusted or must be rebuilt.

  The array `values` stores the heap in the usual level order: the element at index `i` has its
  children at indices `2*i + 1` and `2*i + 2`, whenever those indices exist in the array.

  Return `true` if every element is **less than or equal to** each of its children (equal priorities are
  allowed), and `false` if at least one parent is greater than one of its children. An empty array and an
  array with a single element are valid snapshots.

  ### Example 1
  ```
  Input:  values = [1, 3, 2, 7, 4, 5]
  Output: true
  ```

  ### Example 2
  ```
  Input:  values = [2, 5, 3, 4, 1]
  Output: false
  Explanation: Index 1 holds 5, and its children at indices 3 and 4 hold 4 and 1.
  ```

  ### Example 3
  ```
  Input:  values = []
  Output: true
  ```

  ### Constraints
  - `0 <= values.length <= 10^5`
  - `-2^31 <= values[i] <= 2^31 - 1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: priority_queue_snapshot_valid
  params:
    - {name: values, type: "int[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def priority_queue_snapshot_valid(values: list[int]) -> bool:
        for child in range(1, len(values)):
            if values[(child - 1) // 2] > values[child]:
                return False
        return True
  javascript: |
    function priorityQueueSnapshotValid(values) {
      for (let child = 1; child < values.length; child++) {
        if (values[Math.floor((child - 1) / 2)] > values[child]) return false;
      }
      return true;
    }
