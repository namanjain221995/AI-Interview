expected_concepts:
  - "converting a parent array into child lists"
  - "post-order dynamic programming over a tree"
  - "best downward chain per node, clamped at zero"
  - "combining the two best child chains at the topmost depot of a route"
  - "iterative traversal order to avoid deep recursion"
  - "64-bit sums"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Identifies that every route has a unique topmost depot, computes for each depot the best downward chain (dropping negative child chains) in a children-before-parents order, combines the two best child chains at each depot, initialises the answer from a real depot rather than 0 so all-negative inputs work, uses 64-bit sums and explains the O(n) bound and the recursion-depth risk."
  good: "Reaches the correct post-order recurrence, possibly with a recursive DFS, and handles negative margins after a hint; mentions 64-bit totals or the deep-chain recursion risk but not both."
  weak: "Only considers routes through the hub or from the hub downwards, runs a traversal from every depot (O(n^2)) without recognising the cost, returns 0 when all margins are negative, or overflows 32-bit totals."
  criteria:
    correctness: "All tests pass, including all-negative margins, routes that avoid the hub, hubs with non-zero ids and totals beyond 32 bits."
    efficiency: "Linear time; each depot is processed once and each child chain is considered once by its parent."
    code_quality: "Separates building the child lists, ordering and the DP; the two quantities (chain ending at a depot versus route peaking at it) are clearly named."
    edge_cases: "Handles a single depot, zero and negative margins, a deep chain and a wide star."
    communication: "Explains why the value returned upward may only use one child, while the answer at a depot may use two."
hints:
  - "Every route has exactly one depot that is closest to the hub. Think about the best route whose closest-to-hub depot is a particular depot v."
  - "For each depot, compute the best value of a chain that starts there and only goes downward into its own subtree; a chain from a child is only worth adding if it is positive."
  - "Process depots children-first (for example in reverse breadth-first order). For depot v keep the two largest non-negative child chain values: v's own chain is margin[v] plus the largest, and a candidate answer is margin[v] plus both. Start the answer from an actual depot margin so all-negative inputs work."
followups:
  - "How would you also return the two endpoint depots of the best route?"
  - "What changes if each link also has a transport cost that is subtracted from the route value?"
  - "How would you answer the question if routes had to contain at least two depots?"
  - "If margins change one depot at a time, which parts of your computation need to be refreshed?"
common_errors:
  - "Starting the answer at 0, which returns 0 instead of the largest negative margin when every depot loses money."
  - "Returning margin[v] plus both child chains to the parent, which describes a fork rather than a route."
  - "Adding negative child chains instead of clamping them at zero."
  - "Assuming the hub is depot 0 or that parents have smaller ids than their children."
  - "Recursive DFS that overflows the call stack on a 10^5-depot chain, or 32-bit sums."
