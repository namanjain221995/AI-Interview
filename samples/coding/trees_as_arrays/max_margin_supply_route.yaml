slug: max_margin_supply_route
title: "Maximum-Margin Supply Route"
difficulty: hard
competency_keys: [algorithms, problem_solving, data_structures]
role_tags: [backend, data_scientist, data, general]
time_limit_minutes: 35
prompt_markdown: |
  ## Maximum-Margin Supply Route

  A distribution company runs `n` depots with ids `0` to `n - 1`, connected by supply links that
  form a single tree. The tree is given as `parent`: `parent[i]` is the depot that depot `i` is
  linked to on the way to the central hub, and the hub itself has `parent[i] == -1`. Ids are
  arbitrary, so a parent may have a larger id than its child.

  Every depot has a net margin `margin[i]` (revenue minus handling cost) for a delivery run that
  passes through it. Margins can be negative, for example at depots that need costly cold storage.

  A **route** is any sequence of one or more **distinct** depots in which every two consecutive
  depots are directly linked (in either direction). A route may start and end anywhere; it does not
  need to touch the hub, and a single depot on its own is a valid route. The value of a route is the
  sum of the margins of all depots on it.

  Return the **largest value of any route**. At least one depot always exists, so an answer always
  exists; if every margin is negative the answer is the largest single margin. The result can exceed
  the 32-bit integer range, so use 64-bit arithmetic.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], margin = [4, -2, 5, 7, 3, -1]
  Output: 14
  Explanation: The route 3 -> 1 -> 0 -> 2 is worth 7 + (-2) + 4 + 5 = 14.
  ```

  ### Example 2
  ```
  Input:  parent = [-1, 0, 1, 1], margin = [-10, 2, 6, 6]
  Output: 14
  Explanation: The route 2 -> 1 -> 3 is worth 6 + 2 + 6 = 14; adding the hub would only lower it.
  ```

  ### Example 3
  ```
  Input:  parent = [1, -1, 1], margin = [-5, -3, -4]
  Output: -3
  Explanation: Every route loses money; the best is depot 1 on its own.
  ```

  ### Constraints
  - `1 <= n == parent.length == margin.length <= 10^5`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]`
  - Following parents from any depot reaches the hub (no loops)
  - `-10^9 <= margin[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_margin_supply_route
  params:
    - {name: parent, type: "int[]"}
    - {name: margin, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def max_margin_supply_route(parent: list[int], margin: list[int]) -> int:
        n = len(parent)
        children: list[list[int]] = [[] for _ in range(n)]
        root = 0
        for depot, up in enumerate(parent):
            if up == -1:
                root = depot
            else:
                children[up].append(depot)
        # breadth-first order puts every parent before its children
        order = [root]
        for depot in order:
            order.extend(children[depot])
        # down[v] = best value of a route that starts at v and only goes into v's subtree
        down = [0] * n
        best = margin[root]
        for v in reversed(order):
            top1 = top2 = 0  # two best non-negative downward gains among the children
            for c in children[v]:
                gain = down[c]
                if gain > top1:
                    top1, top2 = gain, top1
                elif gain > top2:
                    top2 = gain
            down[v] = margin[v] + top1
            best = max(best, margin[v] + top1 + top2)
        return best
  javascript: |
    function maxMarginSupplyRoute(parent, margin) {
      const n = parent.length;
      const children = Array.from({ length: n }, () => []);
      let root = 0;
      for (let v = 0; v < n; v++) {
        if (parent[v] === -1) root = v;
        else children[parent[v]].push(v);
      }
      const order = [root];
      for (let i = 0; i < order.length; i++) {
        for (const c of children[order[i]]) order.push(c);
      }
      const down = new Array(n).fill(0);
      let best = margin[root];
      for (let i = n - 1; i >= 0; i--) {
        const v = order[i];
        let top1 = 0;
        let top2 = 0;
        for (const c of children[v]) {
          const gain = down[c];
          if (gain > top1) {
            top2 = top1;
            top1 = gain;
          } else if (gain > top2) {
            top2 = gain;
          }
        }
        down[v] = margin[v] + top1;
        best = Math.max(best, margin[v] + top1 + top2);
      }
      return best;
    }
