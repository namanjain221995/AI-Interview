expected_concepts:
- DFS entry and exit times (Euler tour) over the reporting tree
- ancestor test as interval containment of entry times
- iterative traversal to avoid recursion depth limits on deep charts
- building a manager-to-reports adjacency list from the parent array
- O(1) per query after linear preprocessing
optimal_complexity:
  time: O(n + q)
  space: O(n)
rubric:
  excellent: Builds the reports lists, records entry and exit times with an iterative DFS, answers each query by interval containment with the strictness handled, and explains O(n + q) versus the O(n * q) chain walk.
  good: Correct Euler-tour solution, possibly recursive with a raised limit or found after a hint, with the self-query case handled.
  weak: Walks up the chain for every query, recomputes a traversal per query, or answers true for approver equal to requester.
  criteria:
    correctness: All tests pass, including self queries, peers on different branches and a root that is not employee 0.
    efficiency: Linear preprocessing with constant-time queries; no per-query walk on a deep chain.
    code_quality: Clear names for the entry and exit arrays and a single, readable containment check.
    edge_cases: Single employee, no queries, repeated queries and a 1000-deep chain.
    communication: Explains why a subtree occupies a contiguous range of entry times.
hints:
- Walking up the chain answers one query, but it can take n steps per query; think about what a single traversal of the whole chart could record once.
- During a depth-first traversal, everyone below a person is visited after that person is entered and before that person is left, so each person owns a contiguous range of visit times.
- Record an entry time and an exit time for every employee with an iterative depth-first search from the top; the approver is strictly above the requester when the requester's entry time is greater than the approver's entry time and no greater than the approver's exit time.
followups:
- How would you answer the same queries if the chart changed between queries (a reorganisation moves a whole team)?
- How would you also return the closest common manager of the two people?
- Could you answer the queries offline without storing entry and exit times for everyone?
- How would the approach change if an approver could be at most three levels above the requester?
common_errors:
- Returning true when approver and requester are the same person.
- Using a recursive DFS that exceeds the recursion limit on a long chain.
- Assuming employee 0 is the top of the chart.
- Walking up the chain for every query, which is O(n) per query on a deep chart.
- Using an inclusive check on both ends of the interval, which also accepts the approver themself.
