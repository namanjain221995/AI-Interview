slug: approval_authority_queries
title: Approval Authority Queries
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, fullstack, security, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Approval Authority Queries

  An expense tool must decide who may approve whose expenses. The org chart has `n` employees
  numbered `0` to `n - 1` and is given as `parent`, where `parent[i]` is the direct manager of
  employee `i`. Exactly one employee has `parent[i] = -1`: the top of the chart.

  An approver may sign off a request only if they are **somewhere above** the requester in the
  chain of command: the requester's manager, that manager's manager, and so on up to the top.
  Nobody approves their own request.

  Each query is `[approver, requester]`. Return a list of booleans, one per query in the same
  order, that is `true` exactly when `approver` is strictly above `requester`.

  The chart can be large and there can be many queries, so walking up the chain for every query
  is too slow in the worst case.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], queries = [[0, 4], [1, 4], [2, 4], [3, 3], [4, 1]]
  Output: [true, true, false, false, false]
  ```
  Employee 0 manages 1 and 2, and 1 manages 3 and 4. Employee 2 is on a different branch from 4.

  ### Example 2
  ```
  Input:  parent = [2, 2, -1, 1], queries = [[2, 3], [3, 1], [0, 0]]
  Output: [true, false, false]
  ```

  ### Constraints
  - `1 <= n == parent.length <= 10^5`
  - exactly one `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]` and the chart is a single tree
  - `0 <= queries.length <= 10^5`
  - `queries[j].length == 2` and both values are in `[0, n - 1]`
  - the chart may be a single long chain
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: approval_authority_queries
  params:
    - {name: parent, type: "int[]"}
    - {name: queries, type: "int[][]"}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    def approval_authority_queries(parent: list[int], queries: list[list[int]]) -> list[bool]:
        n = len(parent)
        reports: list[list[int]] = [[] for _ in range(n)]
        root = -1
        for person, manager in enumerate(parent):
            if manager == -1:
                root = person
            else:
                reports[manager].append(person)
        # Iterative DFS: enter[v] < enter[u] <= leave[v] exactly when v is above u.
        enter = [0] * n
        leave = [0] * n
        clock = 0
        stack = [(root, False)]
        while stack:
            node, done = stack.pop()
            if done:
                leave[node] = clock - 1
                continue
            enter[node] = clock
            clock += 1
            stack.append((node, True))
            for report in reports[node]:
                stack.append((report, False))
        return [enter[a] < enter[r] <= leave[a] for a, r in queries]
  javascript: |
    function approvalAuthorityQueries(parent, queries) {
      const n = parent.length;
      const reports = Array.from({ length: n }, () => []);
      let root = -1;
      for (let person = 0; person < n; person++) {
        if (parent[person] === -1) root = person;
        else reports[parent[person]].push(person);
      }
      // Iterative DFS: enter[v] < enter[u] <= leave[v] exactly when v is above u.
      const enter = new Array(n).fill(0);
      const leave = new Array(n).fill(0);
      let clock = 0;
      const stack = [[root, false]];
      while (stack.length > 0) {
        const [node, done] = stack.pop();
        if (done) {
          leave[node] = clock - 1;
          continue;
        }
        enter[node] = clock++;
        stack.push([node, true]);
        for (const report of reports[node]) stack.push([report, false]);
      }
      return queries.map(([a, r]) => enter[a] < enter[r] && enter[r] <= leave[a]);
    }
