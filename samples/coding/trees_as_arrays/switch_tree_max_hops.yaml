expected_concepts:
  - "tree diameter"
  - "two BFS/DFS passes: the farthest node from any node is an endpoint of a longest path"
  - "alternative: one DFS combining the two deepest child heights at every node"
  - "undirected adjacency list built from an edge list"
  - "iterative traversal to avoid recursion limits on deep chains"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Builds an adjacency list, finds the diameter in O(n) with two traversals (or one post-order pass combining the two tallest child heights), explains why the farthest node from an arbitrary start is an endpoint of a longest path, and keeps the traversal iterative for 10^5-node chains."
  good: "Correct linear solution with minor prompting, for example a recursive DFS that would need a raised recursion limit, or an unclear argument for why two passes suffice."
  weak: "Runs a BFS from every switch (O(n^2)), returns the depth from switch 0, or only combines the two deepest branches at switch 0."
  criteria:
    correctness: "All tests pass, including trees whose longest path avoids switch 0 and the single-switch case."
    efficiency: "Linear time and memory; no per-node searches."
    code_quality: "A reusable farthest-node helper or a clear post-order height computation; no duplicated traversal code."
    edge_cases: "n = 1 with no cables, two switches, stars, long chains that break naive recursion."
    communication: "States the two-pass property or the height-combination idea and why it covers every candidate path."
hints:
  - "Pick the two switches that are farthest apart; the answer is the number of cables between them. Which switch could you be sure is one of those two?"
  - "Start a traversal from any switch and look at the switch it reaches last. That switch is always one end of a longest path in a tree."
  - "Run a BFS from switch 0 to find the farthest switch x, then run a second BFS from x; the largest distance in the second BFS is the answer. Build the neighbour lists with both directions of every cable."
followups:
  - "How would you also return the switches on that longest path?"
  - "Can you compute the answer in one traversal by combining the two tallest subtrees at every switch?"
  - "If cables had different latencies, does the two-pass approach still work?"
  - "How would you answer quickly after a new switch is attached as a leaf?"
common_errors:
  - "Returning the depth of the deepest switch from switch 0 instead of the longest path between any two switches."
  - "Adding each cable in only one direction to the adjacency list."
  - "Using recursive DFS that overflows the stack on a 10^5-switch chain."
  - "Running a search from every switch, which is quadratic."
