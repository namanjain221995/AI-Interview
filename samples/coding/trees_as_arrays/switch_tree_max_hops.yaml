title: "Longest Switch-to-Switch Hop Count"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [network, sre, backend, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Switch-to-Switch Hop Count

  An office floor has `n` network switches numbered `0` to `n - 1`. They are cabled as a **tree**:
  `links` holds exactly `n - 1` undirected cables `[a, b]`, and every switch can reach every other switch
  along exactly one path. The path between two switches costs one **hop** per cable it crosses.

  The network team sizes its frame timeouts for the worst case, so it needs the largest number of hops
  on the path between **any two** switches. Return that number. A floor with a single switch has no
  cables and the answer is `0`.

  ### Example 1
  ```
  Input:  n = 7, links = [[0, 1], [1, 2], [1, 3], [3, 4], [4, 5], [2, 6]]
  Output: 5
  Explanation: the path 6 - 2 - 1 - 3 - 4 - 5 crosses 5 cables, and no pair of switches is farther apart.
  ```

  ### Example 2
  ```
  Input:  n = 1, links = []
  Output: 0
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `links.length == n - 1`, each `links[i] = [a, b]` with `0 <= a, b < n` and `a != b`
  - The cables form a tree (connected, no cycles); a link may list its two switches in either order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: switch_tree_max_hops
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def switch_tree_max_hops(n: int, links: list[list[int]]) -> int:
        neighbours: list[list[int]] = [[] for _ in range(n)]
        for a, b in links:
            neighbours[a].append(b)
            neighbours[b].append(a)

        def farthest(start: int) -> tuple[int, int]:
            dist = [-1] * n
            dist[start] = 0
            queue = deque([start])
            last = start
            while queue:
                node = queue.popleft()
                last = node
                for nxt in neighbours[node]:
                    if dist[nxt] == -1:
                        dist[nxt] = dist[node] + 1
                        queue.append(nxt)
            return last, dist[last]

        end, _ = farthest(0)
        _, hops = farthest(end)
        return hops
  javascript: |
    function switchTreeMaxHops(n, links) {
      const neighbours = Array.from({ length: n }, () => []);
      for (const [a, b] of links) {
        neighbours[a].push(b);
        neighbours[b].push(a);
      }
      const farthest = (start) => {
        const dist = new Array(n).fill(-1);
        dist[start] = 0;
        const queue = [start];
        for (let head = 0; head < queue.length; head++) {
          const node = queue[head];
          for (const next of neighbours[node]) {
            if (dist[next] === -1) {
              dist[next] = dist[node] + 1;
              queue.push(next);
            }
          }
        }
        const last = queue[queue.length - 1];
        return [last, dist[last]];
      };
      const [end] = farthest(0);
      return farthest(end)[1];
    }
