role_tags: [network, platform, backend, cloud]
time_limit_minutes: 22
prompt_markdown: |
  ## Optimal Relay Hub Placement

  A company runs `n` sites, numbered `0` to `n - 1`, joined by `n - 1` private tunnels. `links[i] = [a, b]`
  is a two-way tunnel between sites `a` and `b`, and together the tunnels connect every site without any
  loop (the sites form a tree). Configuration pushes travel one tunnel per hop.

  You must host the configuration relay at exactly **one** site. For a candidate site, its **reach** is
  the largest number of hops from that site to any other site. Find every site whose reach is as small
  as possible and return those sites in **ascending** order. A one-site company returns `[0]`.

  ### Example 1
  ```
  Input:  n = 7, links = [[0, 1], [1, 2], [2, 3], [3, 4], [2, 5], [5, 6]]
  Output: [2]
  Explanation: from site 2 every site is at most 2 hops away; every other site has a reach of 3 or more.
  ```

  ### Example 2
  ```
  Input:  n = 4, links = [[0, 1], [1, 2], [2, 3]]
  Output: [1, 2]
  Explanation: sites 1 and 2 both have a reach of 2, while sites 0 and 3 have a reach of 3.
  ```

  ### Example 3
  ```
  Input:  n = 1, links = []
  Output: [0]
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `links.length == n - 1`, each `links[i] = [a, b]` with `0 <= a, b < n` and `a != b`
  - The tunnels form a tree; a tunnel may list its sites in either order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: optimal_relay_hub_nodes
  params:
    - {name: n, type: "int"}
    - {name: links, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def optimal_relay_hub_nodes(n: int, links: list[list[int]]) -> list[int]:
        if n == 1:
            return [0]
        neighbours: list[list[int]] = [[] for _ in range(n)]
        degree = [0] * n
        for a, b in links:
            neighbours[a].append(b)
            neighbours[b].append(a)
            degree[a] += 1
            degree[b] += 1
        layer = [v for v in range(n) if degree[v] == 1]
        remaining = n
        while remaining > 2:
            remaining -= len(layer)
            next_layer = []
            for leaf in layer:
                for nxt in neighbours[leaf]:
                    degree[nxt] -= 1
                    if degree[nxt] == 1:
                        next_layer.append(nxt)
            layer = next_layer
        return sorted(layer)
  javascript: |
    function optimalRelayHubNodes(n, links) {
      if (n === 1) return [0];
      const neighbours = Array.from({ length: n }, () => []);
      const degree = new Array(n).fill(0);
      for (const [a, b] of links) {
        neighbours[a].push(b);
        neighbours[b].push(a);
        degree[a]++;
        degree[b]++;
      }
      let layer = [];
      for (let v = 0; v < n; v++) if (degree[v] === 1) layer.push(v);
      let remaining = n;
      while (remaining > 2) {
        remaining -= layer.length;
        const nextLayer = [];
        for (const leaf of layer) {
          for (const next of neighbours[leaf]) {
            degree[next]--;
            if (degree[next] === 1) nextLayer.push(next);
          }
        }
        layer = nextLayer;
      }
      return layer.sort((x, y) => x - y);
    }
