expected_concepts:
  - "tree centre (one or two nodes)"
  - "peeling leaves layer by layer (topological trimming by degree)"
  - "alternative: middle node(s) of a diameter path found with two BFS passes"
  - "minimum eccentricity equals ceil(diameter / 2)"
  - "sorting the result"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Explains that the optimal sites are the centre of the tree, implements leaf peeling (or the middle of a diameter path) in O(n), argues why at most two sites remain, and handles n = 1 and n = 2 explicitly."
  good: "Correct linear solution with minor prompting, for example needing help with the stopping condition (remaining <= 2) or with sorting the two answers."
  weak: "Runs a BFS from every site (O(n^2)), picks the highest-degree site, or stops peeling at the wrong time and returns one site where two are optimal."
  criteria:
    correctness: "All tests pass, including spiders where the busiest site is not optimal and even chains with two answers."
    efficiency: "Linear time; each site and tunnel is processed a constant number of times."
    code_quality: "Clear degree array and layer lists, or a reusable BFS helper for the diameter approach."
    edge_cases: "One site, two sites, stars, chains, labels not in tunnel order."
    communication: "States the link between reach, the diameter and the centre and why one or two sites remain."
hints:
  - "Think about the two sites that are farthest apart. Where must the relay sit so that neither of them is too far away?"
  - "The best sites lie in the middle of a longest path. Another way to reach the middle is to strip away the outermost sites, round after round, until little is left."
  - "Track every site's degree, start with all leaves, and remove a whole layer of leaves per round, decrementing neighbours' degrees and collecting new leaves; stop when at most two sites remain and return them sorted. Treat n = 1 as [0]."
followups:
  - "What is the minimum reach itself, and how does it relate to the longest path length?"
  - "How would you find the site that minimises the total hops to all sites instead of the worst case?"
  - "If you could host two relays, how would you place them?"
  - "Prove that a tree never has more than two optimal sites."
common_errors:
  - "Running a BFS from every site to measure its reach, which is quadratic on 10^5 sites."
  - "Choosing the site with the most tunnels."
  - "Stopping the peeling one round too late and returning no sites, or one round too early and returning extra sites."
  - "Forgetting the single-site case where there are no leaves of degree 1."
