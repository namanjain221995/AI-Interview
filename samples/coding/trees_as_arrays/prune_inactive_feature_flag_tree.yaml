expected_concepts:
- heap-style indexing of children at 2i + 1 and 2i + 2
- 'post-order decision: a node survives if it or either subtree has an enabled flag'
- right-to-left sweep as an iterative post-order over array indices
- trimming trailing empty positions in the output
- bounds checks for children past the end of the array
optimal_complexity:
  time: O(n)
  space: O(n)
rubric:
  excellent: Recognises that the decision for a flag depends on its subtrees, computes it bottom-up (recursively or by a right-to-left sweep), keeps surviving indices in place, trims trailing -1 values and explains the linear cost.
  good: Correct post-order solution with a small fix after testing, such as the trimming or the out-of-range child check.
  weak: Removes only disabled leaves once, re-scans subtrees for every node, compacts the array and loses positions, or forgets to trim.
  criteria:
    correctness: All tests pass, including interior gaps, trailing padding and everything removed.
    efficiency: Each position is examined a constant number of times.
    code_quality: Index arithmetic in one place with readable bounds checks and no mutation surprises.
    edge_cases: Empty input, a single flag, an enabled root over disabled subtrees and a deep one-sided chain.
    communication: Explains why a parent can only be decided after both children.
hints:
- Whether a flag survives depends on what is below it, so think about which flags you can decide first.
- A flag stays when it is enabled or when either of its sub-flags stays; children always have larger indices than their parent in this layout.
- Walk the indices from the last one down to zero, mark a position as kept when its value is one or either child index is in range and kept, then copy kept values (others become minus one) and drop the trailing minus ones.
followups:
- How would you solve it with an explicit node structure instead of the array layout?
- What changes if a disabled flag should also be removed when it has exactly one enabled descendant?
- How would you report which flags were removed so the change can be reviewed before it is applied?
- Why is the heap-style layout wasteful for a deep, one-sided hierarchy, and what format would you use instead?
common_errors:
- Removing only disabled leaves in a single pass, which leaves disabled parents whose subtrees become empty.
- Compacting the array after removal so remaining flags change index.
- Forgetting to trim trailing -1 values or returning [-1] instead of [].
- Reading child indices past the end of the array without a bounds check.
- Treating -1 positions as disabled flags.
