role_tags: [backend, frontend, fullstack, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Prune Inactive Feature-Flag Tree

  A feature-flag service organises flags in a binary hierarchy: every flag has at most two
  sub-flags. The hierarchy is stored as an array `tree` in level order, heap style:

  - the flag at index `i` has its left sub-flag at index `2 * i + 1` and its right sub-flag at
    index `2 * i + 2`; index `0` is the top flag;
  - `tree[i]` is `1` for an enabled flag, `0` for a disabled flag and `-1` when there is no flag
    at that position; positions past the end of the array are empty too;
  - an empty position never has flags below it.

  To clean up configuration, remove every flag whose whole subtree (the flag itself and
  everything below it) contains **no enabled flag**. A disabled flag that has an enabled flag
  somewhere below it stays.

  Return the cleaned hierarchy in the same format: removed flags become `-1`, every remaining
  flag keeps its index, and trailing `-1` entries are removed. Return `[]` if no flag remains.
  The input may end with `-1` entries.

  ### Example 1
  ```
  Input:  tree = [0, 0, 1, 0, 0, -1, 0]
  Output: [0, -1, 1]
  ```
  The subtree under index 1 and the flag at index 6 contain no enabled flag and are removed.

  ### Example 2
  ```
  Input:  tree = [1, 0, 0, -1, 1, 0]
  Output: [1, 0, -1, -1, 1]
  ```
  Flag 1 stays because flag 4 below it is enabled; flags 2 and 5 are removed.

  ### Example 3
  ```
  Input:  tree = [0, 0, 0]
  Output: []
  ```

  ### Constraints
  - `0 <= tree.length <= 2047` (at most 10 levels)
  - `tree[i]` is `-1`, `0` or `1`
  - if `tree[i] == -1` then every position below `i` is `-1` or past the end
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: prune_inactive_feature_flag_tree
  params:
    - {name: tree, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def prune_inactive_feature_flag_tree(tree: list[int]) -> list[int]:
        n = len(tree)
        # Children sit at higher indices than their parent, so a right-to-left
        # sweep sees both children before the parent (a post-order without recursion).
        keep = [False] * n
        for i in range(n - 1, -1, -1):
            if tree[i] == -1:
                continue
            left, right = 2 * i + 1, 2 * i + 2
            keep[i] = (
                tree[i] == 1
                or (left < n and keep[left])
                or (right < n and keep[right])
            )
        result = [tree[i] if keep[i] else -1 for i in range(n)]
        while result and result[-1] == -1:
            result.pop()
        return result
  javascript: |
    function pruneInactiveFeatureFlagTree(tree) {
      const n = tree.length;
      // Children sit at higher indices than their parent, so a right-to-left
      // sweep sees both children before the parent (a post-order without recursion).
      const keep = new Array(n).fill(false);
      for (let i = n - 1; i >= 0; i--) {
        if (tree[i] === -1) continue;
        const left = 2 * i + 1;
        const right = 2 * i + 2;
        keep[i] = tree[i] === 1 || (left < n && keep[left]) || (right < n && keep[right]);
      }
      const result = tree.map((value, i) => (keep[i] ? value : -1));
      while (result.length > 0 && result[result.length - 1] === -1) result.pop();
      return result;
    }
