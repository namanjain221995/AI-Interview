expected_concepts:
  - "building a tree (trie) of path components"
  - "pre-order depth-first traversal"
  - "sorting children by name with a custom group order"
  - "de-duplicating repeated paths"
  - "string formatting with depth-based indentation"
optimal_complexity: {time: "O(L + E log E) where L is the total path length and E the number of entries", space: "O(L)"}
rubric:
  excellent: "Builds a nested map of directories with a file set per directory, renders it with a pre-order DFS that prints directories (sorted) before files (sorted) at each level, handles duplicates naturally through the sets and explains why sorting names per directory differs from sorting whole paths."
  good: "Correct tree and rendering with minor prompting, for example a missed duplicate or a fix to the directory-before-file rule."
  weak: "Sorts the full path strings and prints them, mixes files and directories, prints the root, or emits duplicate lines."
  criteria:
    correctness: "All tests pass, including lib versus lib-ext ordering and directories listed before alphabetically smaller files."
    efficiency: "Each path is inserted once; sorting happens per directory, not with repeated scans of the whole input."
    code_quality: "A small node structure and a recursive (or explicit-stack) renderer with clear indentation logic."
    edge_cases: "Empty input, files at the root, duplicates, deep chains, case-sensitive ordering."
    communication: "Explains the traversal order and how the indentation depth is tracked."
hints:
  - "A listing like this is just a walk over a tree of directories. What tree do the path components describe?"
  - "Insert every path into a nested structure: one entry per directory name holding its subdirectories and the set of file names inside it. Then visit it depth-first."
  - "For each directory node, sort the subdirectory names, print each as indent + name + '/' and recurse with one more level of indentation; afterwards sort and print the file names. Sets remove duplicate paths for free."
followups:
  - "How would you also print the total size of every directory next to its name?"
  - "How would you collapse chains of directories that contain exactly one subdirectory and no files into a single line such as a/b/c/?"
  - "What changes if the listing must be streamed while the paths arrive, without holding them all?"
  - "How would you render the familiar box-drawing connectors used by tree commands?"
common_errors:
  - "Sorting complete path strings, which orders lib-ext before lib/... because '-' sorts before '/'."
  - "Printing files and directories interleaved instead of directories first."
  - "Printing the same file twice when its path is repeated."
  - "Indenting by depth from the wrong origin, so top-level entries start with two spaces."
