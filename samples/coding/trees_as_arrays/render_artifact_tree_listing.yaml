version: 1
slug: render_artifact_tree_listing
title: "Render a Build Artifact Tree"
difficulty: medium
competency_keys: [algorithms, data_structures, code_quality]
role_tags: [devops, frontend, fullstack, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Render a Build Artifact Tree

  A CI pipeline uploads build artifacts and lists them as absolute file paths such as
  `"/dist/assets/logo.png"`. For the build summary page you need to show them as an indented tree.

  Build the directory tree implied by `file_paths` (a directory exists when some file lives beneath it;
  the same path may appear more than once and counts once) and return its listing as one string per line:

  - The root `/` itself is **not** printed. Entries directly under the root have depth `0`, their children
    depth `1`, and so on. Each line starts with **2 spaces per depth level**.
  - A directory line is the directory's name followed by `/`; a file line is just the file's name.
  - A directory's contents are printed right after its own line, before anything that follows it.
  - Within one directory, list all **subdirectories first**, then all **files**; each group is sorted by
    name in plain lexicographic order (compare character codes one by one, so uppercase letters come
    before lowercase and a name that is a prefix of another comes first).

  ### Example 1
  ```
  Input:  file_paths = ["/dist/app.js", "/dist/assets/logo.png", "/README.md", "/dist/assets/app.css", "/dist/index.html", "/coverage/lcov.info"]
  Output: [
    "coverage/",
    "  lcov.info",
    "dist/",
    "  assets/",
    "    app.css",
    "    logo.png",
    "  app.js",
    "  index.html",
    "README.md"
  ]
  ```
  Rendered, the output reads:
  ```
  coverage/
    lcov.info
  dist/
    assets/
      app.css
      logo.png
    app.js
    index.html
  README.md
  ```

  ### Example 2
  ```
  Input:  file_paths = ["/b.txt", "/a/z.txt", "/b.txt"]
  Output: [
    "a/",
    "  z.txt",
    "b.txt"
  ]
  Explanation: the directory a/ is listed before the file b.txt, and the duplicate path is shown once.
  ```

  ### Constraints
  - `0 <= file_paths.length <= 10^4`
  - Every path starts with `/`, has no trailing `/`, no empty, `.` or `..` components, uses printable ASCII
    other than spaces and is at most 200 characters long.
  - No path is also a directory of another path (a name is never both a file and a directory in the same
    place).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: render_artifact_tree_listing
  params:
    - {name: file_paths, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def render_artifact_tree_listing(file_paths: list[str]) -> list[str]:
        root: dict = {"dirs": {}, "files": set()}
        for path in file_paths:
            parts = path[1:].split("/")
            node = root
            for name in parts[:-1]:
                node = node["dirs"].setdefault(name, {"dirs": {}, "files": set()})
            node["files"].add(parts[-1])

        lines: list[str] = []

        def render(node: dict, depth: int) -> None:
            indent = "  " * depth
            for name in sorted(node["dirs"]):
                lines.append(indent + name + "/")
                render(node["dirs"][name], depth + 1)
            for name in sorted(node["files"]):
                lines.append(indent + name)

        render(root, 0)
        return lines
  javascript: |
    function renderArtifactTreeListing(filePaths) {
      const makeNode = () => ({ dirs: new Map(), files: new Set() });
      const root = makeNode();
      for (const path of filePaths) {
        const parts = path.slice(1).split("/");
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) {
          if (!node.dirs.has(parts[i])) node.dirs.set(parts[i], makeNode());
          node = node.dirs.get(parts[i]);
        }
        node.files.add(parts[parts.length - 1]);
      }
      const byCode = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
      const lines = [];
      const render = (node, depth) => {
        const indent = "  ".repeat(depth);
        for (const name of [...node.dirs.keys()].sort(byCode)) {
          lines.push(indent + name + "/");
          render(node.dirs.get(name), depth + 1);
        }
        for (const name of [...node.files].sort(byCode)) lines.push(indent + name);
      };
      render(root, 0);
      return lines;
    }
