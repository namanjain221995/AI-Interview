role_tags: [sre, support_engineer, backend, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## On-Call Escalation Targets

  An incident tool escalates unacknowledged pages up the on-call hierarchy. The `n` responders
  are numbered `0` to `n - 1`; `parent[i]` is the person that responder `i` escalates to, and
  exactly one person has `parent[i] = -1` (the last line of escalation).

  Each query is `[person, k]`: a page that starts at `person` and is escalated `k` times. Return,
  for every query in order, the responder who holds the page after `k` escalations. `k = 0`
  means the page stays with `person`. If the chain ends before `k` escalations are made,
  the answer for that query is `-1`.

  There can be many queries with large `k`, so walking the chain one step at a time for each
  query is too slow in the worst case.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 1, 2, 1], queries = [[3, 1], [3, 3], [4, 1], [2, 0], [3, 4]]
  Output: [2, 0, 1, 2, -1]
  ```
  From 3 the chain is 3 -> 2 -> 1 -> 0, so one escalation reaches 2, three reach 0 and four run past the top.

  ### Example 2
  ```
  Input:  parent = [3, -1, 1, 1], queries = [[0, 2], [0, 3], [1, 0]]
  Output: [1, -1, 1]
  ```

  ### Constraints
  - `1 <= n == parent.length <= 10^5`
  - exactly one `parent[i] == -1`; the other values are in `[0, n - 1]` and form a single tree
  - `0 <= queries.length <= 10^5`
  - `0 <= person <= n - 1` and `0 <= k <= 10^5`
  - the hierarchy may be a single long chain
languages: [python, javascript, typescript, java, go, cpp]
