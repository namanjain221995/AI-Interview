expected_concepts:
- 'binary lifting: a table of 2^j-th ancestors'
- decomposing k into powers of two
- stopping early once the chain runs out (-1 sentinel)
- O(n log n) preprocessing and O(log n) per query
- alternative offline approach with a DFS path stack indexed by depth
optimal_complexity:
  time: O((n + q) log n)
  space: O(n log n)
rubric:
  excellent: Builds the jump table level by level from the parent array, answers each query by walking the set bits of k, handles k = 0, k past the top and huge k, and explains the O((n + q) log n) cost against the O(n * q) naive walk; may mention the offline depth-stack alternative.
  good: Correct binary-lifting or offline DFS solution with a small fix after testing, such as propagating -1 through the table.
  weak: Walks up one step at a time for every query, or indexes the table with -1 and crashes when the chain ends.
  criteria:
    correctness: All tests pass, including k equal to the depth, k past the top and k = 0.
    efficiency: Logarithmic work per query after preprocessing; no per-step walk on a deep chain.
    code_quality: Readable table construction with the -1 sentinel handled in one place.
    edge_cases: Single responder, empty queries, very large k and a top that is not person 0.
    communication: Explains why combining power-of-two jumps reaches exactly k levels.
hints:
- Following the chain one escalation at a time can cost k steps per query; think about precomputing bigger jumps once and reusing them.
- If you knew, for every person, who is 1, 2, 4, 8, ... escalations above them, you could reach any k by combining a few of those jumps according to the binary form of k.
- Build a table level by level where the 2^(j+1)-th target of a person is the 2^j-th target of their 2^j-th target (keeping -1 once the chain ends), then for each query apply the jump for every set bit of k and stop early at -1.
followups:
- How would you answer all the queries offline in O(n + q) with one depth-first traversal?
- How would you use the same table to find the closest common escalation point of two responders?
- What changes if responders can be added at the bottom of the hierarchy while queries are being answered?
- How much memory does the table need for 10^5 people, and how could you reduce it?
common_errors:
- Walking the chain one step at a time for every query.
- Looking up jump[j][-1] when the chain has already ended, which wraps around or crashes.
- Treating k = 0 as one escalation.
- Building too few table levels so the largest jumps are missing.
- Assuming person 0 is the top of the hierarchy.
