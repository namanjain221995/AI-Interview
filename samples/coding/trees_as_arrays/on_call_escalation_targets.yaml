reference_solutions:
  python: |
    def on_call_escalation_targets(parent: list[int], queries: list[list[int]]) -> list[int]:
        n = len(parent)
        # jump[j][v] is the person 2^j escalations above v, or -1 past the top.
        jump = [list(parent)]
        while (1 << len(jump)) <= n:
            prev = jump[-1]
            jump.append([-1 if prev[v] == -1 else prev[prev[v]] for v in range(n)])
        answers = []
        for person, k in queries:
            if k >= n:
                answers.append(-1)
                continue
            level = 0
            while k and person != -1:
                if k & 1:
                    person = jump[level][person]
                k >>= 1
                level += 1
            answers.append(person)
        return answers
  javascript: |
    function onCallEscalationTargets(parent, queries) {
      const n = parent.length;
      // jump[j][v] is the person 2^j escalations above v, or -1 past the top.
      const jump = [parent.slice()];
      while (2 ** jump.length <= n) {
        const prev = jump[jump.length - 1];
        jump.push(prev.map((p) => (p === -1 ? -1 : prev[p])));
      }
      return queries.map(([start, steps]) => {
        if (steps >= n) return -1;
        let person = start;
        let k = steps;
        let level = 0;
        while (k > 0 && person !== -1) {
          if (k & 1) person = jump[level][person];
          k >>= 1;
          level++;
        }
        return person;
      });
    }
