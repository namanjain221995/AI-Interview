expected_concepts:
  - mirror symmetry of a binary tree (left subtree mirrors right subtree)
  - heap-layout index arithmetic for levels and children
  - treating positions past the end of the array as empty
  - per-level palindrome check or paired recursion over mirrored positions
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Recognises that mirroring keeps each node on its level and maps offset j to width - 1 - j, checks every padded level as a palindrome (or recurses on mirrored index pairs), treats out-of-range positions as empty, and states O(n) time.
  good: Correct paired recursion or queue over index pairs with bounds checks, possibly needing a prompt about trailing -1 entries or out-of-range positions.
  weak: Compares the left and right subtrees for equality instead of mirroring, ignores shape when values match, or reads past the end of the array.
  criteria:
    correctness: All tests pass, including identical-but-not-mirrored subtrees and arrays that end early.
    efficiency: Linear time over the array with constant or depth-bounded extra space.
    code_quality: Index arithmetic is isolated in a small helper or clearly named variables.
    edge_cases: Single node, a single child, zero-valued nodes, trailing -1 entries and a partial last level.
    communication: Explains why outer pairs and inner pairs must be compared.
hints:
  - Think about where a node ends up after a left-to-right flip. Does it change level? Which position does it take within its level?
  - Mirroring keeps every node on its level and reverses the order of the slots in that level, so the whole tree is symmetric exactly when each level reads the same forwards and backwards.
  - Walk the levels using a start position and a doubling width; compare the slot at the left end with the slot at the right end while moving both pointers inward, treating any position beyond the array as an empty slot, and stop at the first mismatch.
followups:
  - How would you write the same check recursively on linked nodes, and what is its stack depth in the worst case?
  - How would you report the first mismatching pair of positions to help an engineer fix the design?
  - What changes if the tree is stored in a compact format that omits the children of empty slots?
common_errors:
  - Comparing the left subtree with the right subtree as equal copies instead of mirror images.
  - Reading past the end of the array instead of treating missing positions as empty.
  - Checking only values and ignoring empty slots, so different shapes pass.
  - Treating a capacity of 0 as an empty slot.
