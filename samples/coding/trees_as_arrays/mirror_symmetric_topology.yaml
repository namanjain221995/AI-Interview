title: Mirror-Symmetric Topology
difficulty: easy
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [network, sre, backend, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Mirror-Symmetric Topology

  A redundant datacenter design is only accepted when its switch tree looks **identical after a
  left-to-right mirror**: flipping the whole diagram around the vertical line through the core switch
  must produce exactly the same tree, with the same port capacity at every position.

  The inventory tool exports the tree as an array `tree` in **heap layout**, level by level from left
  to right:

  - position `0` is the core switch (it is always present),
  - the two downstream slots of position `i` are positions `2*i + 1` (left) and `2*i + 2` (right),
  - `-1` marks an empty slot; every slot below an empty slot is also `-1`,
  - any other value is a port capacity (`>= 0`).

  The array may end part-way through a level and may contain extra trailing `-1` entries; positions
  past the end of the array are empty.

  Return `true` if the tree equals its own mirror image in **both shape and values**, otherwise
  `false`.

  ### Example 1
  ```
  Input:  tree = [1, 2, 2, 3, 4, 4, 3]
  Output: true
  ```

  ### Example 2
  ```
  Input:  tree = [1, 2, 2, -1, 3, -1, 3]
  Output: false
  Explanation: both level-1 switches carry a single downstream switch on the right side,
  so the mirror image puts them on the left.
  ```

  ### Example 3
  ```
  Input:  tree = [8, 5, 5, -1, -1, -1, -1, -1, -1]
  Output: true
  Explanation: trailing -1 entries are empty slots and do not break symmetry.
  ```

  ### Constraints
  - `1 <= tree.length <= 10^4`
  - `tree[0] != -1`
  - every value is `-1` or in `0..10^9`
  - every slot below an empty slot is `-1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: mirror_symmetric_topology
  params:
    - {name: tree, type: "int[]"}
  return_type: bool
  comparison: exact
reference_solutions:
  python: |
    def mirror_symmetric_topology(tree: list[int]) -> bool:
        n = len(tree)
        start, width = 0, 1
        while start < n:
            # In heap layout, the mirror of offset j in a level is offset width - 1 - j,
            # so the tree is symmetric exactly when every padded level is a palindrome.
            left, right = start, start + width - 1
            while left < right:
                a = tree[left] if left < n else -1
                b = tree[right] if right < n else -1
                if a != b:
                    return False
                left += 1
                right -= 1
            start += width
            width *= 2
        return True
  javascript: |
    function mirrorSymmetricTopology(tree) {
      const n = tree.length;
      const at = (i) => (i < n ? tree[i] : -1);
      let start = 0;
      let width = 1;
      while (start < n) {
        let left = start;
        let right = start + width - 1;
        while (left < right) {
          if (at(left) !== at(right)) return false;
          left++;
          right--;
        }
        start += width;
        width *= 2;
      }
      return true;
    }
