title: Team Headcount by Manager
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend, fullstack, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Team Headcount by Manager

  Finance is building a budget dashboard and needs, for every employee, the **headcount of the
  organisation they own**: the employee themself plus everyone who reports to them directly or
  through any number of intermediate managers.

  The reporting structure for employees `0` to `n - 1` arrives as an array `parent`, where `parent[i]`
  is employee `i`'s direct manager and the single head of the company has `parent[i] == -1`. Employee
  numbers are not ordered by seniority: a manager can have a larger number than any of their reports.

  Return an array `headcount` of length `n` where `headcount[i]` is the size of employee `i`'s
  organisation, listed in employee-number order. Someone with no reports has a headcount of 1, and the
  head of the company always has a headcount of `n`.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2]
  Output: [6, 3, 2, 1, 1, 1]
  Explanation: Employee 1 owns 1, 3 and 4; employee 2 owns 2 and 5; the head owns all six.
  ```

  ### Example 2
  ```
  Input:  parent = [2, 2, -1, 0]
  Output: [2, 1, 4, 1]
  ```

  ### Constraints
  - `1 <= parent.length <= 10^5`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]` and `parent[i] != i`
  - Following managers from any employee always reaches the head of the company (the chart is a single tree)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: team_headcount_by_manager
  params:
    - {name: parent, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def team_headcount_by_manager(parent: list[int]) -> list[int]:
        n = len(parent)
        reports: list[list[int]] = [[] for _ in range(n)]
        head = -1
        for person, manager in enumerate(parent):
            if manager == -1:
                head = person
            else:
                reports[manager].append(person)
        order = [head]
        for person in order:
            order.extend(reports[person])
        headcount = [1] * n
        for person in reversed(order):
            if parent[person] != -1:
                headcount[parent[person]] += headcount[person]
        return headcount
  javascript: |
    function teamHeadcountByManager(parent) {
      const n = parent.length;
      const reports = Array.from({ length: n }, () => []);
      let head = -1;
      for (let person = 0; person < n; person++) {
        if (parent[person] === -1) head = person;
        else reports[parent[person]].push(person);
      }
      const order = [head];
      for (let k = 0; k < order.length; k++) {
        for (const r of reports[order[k]]) order.push(r);
      }
      const headcount = new Array(n).fill(1);
      for (let k = order.length - 1; k >= 0; k--) {
        const person = order[k];
        if (parent[person] !== -1) headcount[parent[person]] += headcount[person];
      }
      return headcount;
    }
