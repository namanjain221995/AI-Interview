expected_concepts:
  - "subtree sizes in a parent-pointer tree"
  - "building child lists from a parent array"
  - "processing nodes children-before-parents (reverse BFS or post-order)"
  - "iterative traversal to avoid deep recursion"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Builds report lists, orders employees so reports are processed before their managers (reverse breadth-first order or an explicit post-order stack), accumulates headcounts into managers in one pass and explains the O(n) cost and the stack-depth concern."
  good: "Correct linear solution with a small fix after testing, or a correct recursive post-order with the deep-chain risk acknowledged."
  weak: "Walks from every employee up to the head adding one to every ancestor (quadratic on a chain), processes employees in number order assuming managers come first, or forgets to count the employee themself."
  criteria:
    correctness: "All tests pass, including chains in both numbering directions and a head that is not employee 0."
    efficiency: "Each employee is visited a constant number of times."
    code_quality: "Clear names (reports, order, headcount) and no mutation of the input array."
    edge_cases: "Single employee, flat team and deep chain."
    communication: "Explains why reports must be finished before their manager's total is final."
hints:
  - "A manager's headcount is one plus the headcounts of their direct reports."
  - "You need an order in which every employee is handled after all of their reports; the parent array alone does not give you that, but a traversal from the head does."
  - "Build each manager's list of direct reports, collect employees in breadth-first order starting from the head, then walk that list backwards and add each employee's headcount into their manager's, with every headcount starting at one."
followups:
  - "How would you return the total salary budget per manager instead of the headcount?"
  - "If one employee moves to a different manager, which headcounts change and how would you update them quickly?"
  - "How would you list the managers whose organisation exceeds a threshold, sorted by size?"
  - "Can you solve it without building child lists, using only the parent array and extra counters?"
common_errors:
  - "Starting every headcount at zero, so people without reports show 0 instead of 1."
  - "Accumulating in employee-number order, which only works when managers have smaller numbers."
  - "Adding one to every ancestor of every employee, which is quadratic on a long chain."
  - "Deep recursion that overflows the stack on a long reporting line."
