version: 1
slug: deepest_shared_directory
title: Deepest Shared Directory
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [devops, platform, backend, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Deepest Shared Directory

  A nightly backup job receives the list of **directories** that a team wants protected and can attach
  exactly one snapshot mount. To keep snapshots small, the mount should be as deep in the filesystem as
  possible while still covering every requested directory. A mount at directory `M` covers directory `D`
  when `D` is `M` itself or lies anywhere below `M`.

  Every entry in `paths` is an absolute, already normalised directory path:

  - it starts with `/` and segments are separated by a single `/`;
  - there is no trailing slash, except for the root directory, which is written `"/"`;
  - there are no empty, `.` or `..` segments.

  Directories match on **whole segments**, compared case-sensitively: `/var/log` covers
  `/var/log/nginx`, but it does **not** cover `/var/logs`, and `/Data` is different from `/data`.

  Return the deepest directory that covers all entries, in the same normalised form. Return `"/"` when
  the entries share nothing deeper than the root. If every entry is the same directory, that directory
  is the answer.

  ### Example 1
  ```
  Input:  paths = ["/srv/app/releases/v2", "/srv/app/shared/config", "/srv/app"]
  Output: "/srv/app"
  Explanation: /srv/app is requested and contains the other two, so the mount goes there.
  ```

  ### Example 2
  ```
  Input:  paths = ["/var/log/nginx", "/var/logs/archive"]
  Output: "/var"
  ```

  ### Example 3
  ```
  Input:  paths = ["/home/build", "/opt/tools"]
  Output: "/"
  ```

  ### Constraints
  - `1 <= paths.length <= 1000`
  - `1 <= paths[i].length <= 300`
  - Segments contain letters, digits, `-`, `_` and `.` (but are never exactly `.` or `..`)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: deepest_shared_directory
  params:
    - {name: paths, type: "string[]"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def deepest_shared_directory(paths: list[str]) -> str:
        def segments(path: str) -> list[str]:
            return [part for part in path.split("/") if part]

        shared = segments(paths[0])
        for path in paths[1:]:
            other = segments(path)
            keep = 0
            while keep < len(shared) and keep < len(other) and shared[keep] == other[keep]:
                keep += 1
            shared = shared[:keep]
            if not shared:
                break
        return "/" + "/".join(shared)
  javascript: |
    function deepestSharedDirectory(paths) {
      const segments = (path) => path.split("/").filter((part) => part.length > 0);
      let shared = segments(paths[0]);
      for (let i = 1; i < paths.length && shared.length > 0; i++) {
        const other = segments(paths[i]);
        let keep = 0;
        while (keep < shared.length && keep < other.length && shared[keep] === other[keep]) keep += 1;
        shared = shared.slice(0, keep);
      }
      return "/" + shared.join("/");
    }
