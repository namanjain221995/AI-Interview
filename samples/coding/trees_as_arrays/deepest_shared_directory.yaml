expected_concepts:
  - "splitting paths into segments"
  - "segment-wise common prefix rather than character-wise"
  - "shrinking the running prefix across all entries"
  - "rebuilding the normalised path including the root case"
optimal_complexity: {time: "O(total length of all paths)", space: "O(length of the longest path)"}
rubric:
  excellent: "Splits each path into segments, keeps a running shared prefix that only shrinks, compares whole segments, rebuilds the answer with the root special case and explains why a character-level prefix is wrong."
  good: "Correct segment-based solution after fixing the root output or a single off-by-one in the shrinking loop."
  weak: "Uses a character-level longest common prefix (turning /var/log and /var/logs into /var/log), returns an empty string for the root, or only compares the first two entries."
  criteria:
    correctness: "All tests pass, including prefix traps, case differences and the root as an entry."
    efficiency: "Each segment of each path is compared at most once against the running prefix."
    code_quality: "A small helper to split paths; no regex or string slicing tricks that obscure the segment logic."
    edge_cases: "Single entry, identical entries, root in the list and nothing shared."
    communication: "Explains the difference between a character prefix and a directory prefix with an example."
hints:
  - "Think of each directory as a list of names rather than a string of characters."
  - "Whatever the answer is, it is a prefix of the first directory's list of names, and each further directory can only make that prefix shorter."
  - "Split every path on the separator and drop empty parts, start the shared list as the first directory's names, and for each other directory cut the shared list at the first position where the names differ or one list ends; finally join the remaining names behind a leading slash, which gives the root when nothing is left."
followups:
  - "How would you handle paths that are not normalised (trailing slashes, repeated slashes, dot segments)?"
  - "If the backup could use up to two mounts, how would you choose them?"
  - "How would a trie of segments help if you had to answer this for many different subsets of directories?"
common_errors:
  - "Taking a character-level common prefix, which turns /var/log and /var/logs into /var/log."
  - "Returning an empty string instead of the root when nothing is shared."
  - "Forgetting that a requested directory can itself be the answer."
  - "Comparing segments case-insensitively."
