signature:
  function_name: lowest_common_manager
  params:
    - {name: parent, type: "int[]"}
    - {name: a, type: "int"}
    - {name: b, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def lowest_common_manager(parent: list[int], a: int, b: int) -> int:
        def depth(person: int) -> int:
            d = 0
            while parent[person] != -1:
                person = parent[person]
                d += 1
            return d

        da, db = depth(a), depth(b)
        while da > db:
            a = parent[a]
            da -= 1
        while db > da:
            b = parent[b]
            db -= 1
        while a != b:
            a = parent[a]
            b = parent[b]
        return a
  javascript: |
    function lowestCommonManager(parent, a, b) {
      const depth = (person) => {
        let d = 0;
        while (parent[person] !== -1) {
          person = parent[person];
          d += 1;
        }
        return d;
      };
      let da = depth(a);
      let db = depth(b);
      while (da > db) { a = parent[a]; da -= 1; }
      while (db > da) { b = parent[b]; db -= 1; }
      while (a !== b) { a = parent[a]; b = parent[b]; }
      return a;
    }
