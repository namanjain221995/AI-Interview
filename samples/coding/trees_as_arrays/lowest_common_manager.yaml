expected_concepts:
  - "lowest common ancestor in a parent-pointer tree"
  - "equalising depths before walking up together"
  - "ancestor-of-itself convention (a manages b, a == b)"
  - "alternative: mark one chain in a set and walk the other"
optimal_complexity: {time: "O(h) where h is the height of the hierarchy", space: "O(1) extra (or O(h) with a visited set)"}
rubric:
  excellent: "Computes both depths, lifts the deeper person to the same depth and walks both up together until they meet (or marks a's chain in a set and walks b's), handles a == b and ancestor cases naturally and states O(h) time."
  good: "Correct set-based or depth-based solution, possibly after fixing the case where one person manages the other."
  weak: "Returns the head of the company whenever the two are in different direct teams, ignores the case where one manages the other, or rebuilds the whole tree and searches it for every query without a reason."
  criteria:
    correctness: "All tests pass, including a == b, ancestor pairs and cousins below an intermediate manager."
    efficiency: "Only the two management chains are walked."
    code_quality: "A small helper for depth (or the chain), clear loop conditions and no input mutation."
    edge_cases: "Single person, identical people, ancestor relationship and very deep chains."
    communication: "Explains why the two walkers meet at the closest common manager once they start at equal depth."
hints:
  - "Everyone above a person forms a single chain up to the head, so the answer is the first person that appears in both chains."
  - "Either remember everyone in one person's chain (including the person) and then walk up from the other, or make both people start at the same distance from the head before moving them together."
  - "Count how many steps each person is from the head, move the deeper one up until both depths match, then step both up one manager at a time until they are the same person; that person is the answer, which also covers the cases where one manages the other or both are the same."
followups:
  - "How would you answer thousands of such queries on the same hierarchy faster (binary lifting, Euler tour)?"
  - "How would you find the closest common manager of a whole group of engineers?"
  - "What changes if the company has a matrix structure where people can have two managers?"
common_errors:
  - "Starting the comparison from the managers of a and b, which misses the case where one manages the other."
  - "Walking both people up at the same pace without equalising depths first, so they pass each other."
  - "Assuming a manager has a smaller number than their reports."
  - "Recursive depth calculation that overflows on long chains."
