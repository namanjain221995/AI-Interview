time_limit_minutes: 15
prompt_markdown: |
  ## Lowest Common Manager

  Two engineers, `a` and `b`, need a decision on a cross-team change, and the process says it goes to
  the **closest** person in the management hierarchy who is responsible for both of them.

  The hierarchy for people `0` to `n - 1` is given as `parent`, where `parent[i]` is person `i`'s direct
  manager and the single head of the company has `parent[i] == -1`. Numbers are arbitrary: a manager can
  have a larger number than their reports.

  A person is responsible for someone if they **are** that person or appear anywhere in that person's
  chain of managers. Return the person responsible for both `a` and `b` who is furthest from the head of
  the company. In particular:

  - if `a` manages `b` directly or indirectly, the answer is `a` (and vice versa);
  - if `a == b`, the answer is `a`.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2, 5], a = 3, b = 6
  Output: 0
  Explanation: 3 reports through 1 and 6 through 5 and 2; the only shared manager is 0.
  ```

  ### Example 2
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2, 5], a = 4, b = 1
  Output: 1
  ```

  ### Example 3
  ```
  Input:  parent = [3, 3, -1, 2, 0], a = 4, b = 1
  Output: 3
  ```

  ### Constraints
  - `1 <= parent.length <= 10^5`
  - `0 <= a, b < parent.length`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]` and `parent[i] != i`
  - Following managers from anyone always reaches the head of the company (a single tree)
