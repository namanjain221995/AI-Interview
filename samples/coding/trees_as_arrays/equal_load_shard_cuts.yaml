slug: equal_load_shard_cuts
title: "Equal-Load Shard Cuts"
difficulty: hard
competency_keys: [algorithms, problem_solving, data_structures]
role_tags: [backend, platform, sre, cloud]
time_limit_minutes: 35
prompt_markdown: |
  ## Equal-Load Shard Cuts

  A platform team wants to split a service mesh into independent shards that can be deployed and
  scaled separately. The mesh has `n` services with ids `0` to `n - 1`, and its call links form a
  single tree given as `parent`: `parent[i]` is the service that service `i` is linked to, and the
  single entry service has `parent[i] == -1`. Ids are arbitrary, so a parent may have a larger id
  than its child.

  `load[i]` is the steady-state load of service `i` (always at least 1). If you remove some links,
  the mesh falls apart into connected groups of services called **shards**; the load of a shard is
  the sum of the loads of its services. A set of removed links is **balanced** when every resulting
  shard has exactly the same load.

  Return the **maximum number of links** that can be removed so that the result is balanced. Removing
  no links is always balanced (one shard holding everything), so return `0` when no real split works.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1], load = [3, 1, 3, 1, 1]
  Output: 2
  Explanation: Remove the links 1-0 and 2-0. The shards {0}, {1, 3, 4} and {2} each have load 3.
  ```

  ### Example 2
  ```
  Input:  parent = [-1, 0, 1, 2, 3, 4], load = [2, 2, 2, 2, 2, 2]
  Output: 5
  Explanation: A chain of equal loads: every service can become its own shard.
  ```

  ### Example 3
  ```
  Input:  parent = [-1, 0, 0], load = [1, 2, 4]
  Output: 0
  Explanation: The total load 7 cannot be shared equally by 2 or 3 shards.
  ```

  ### Constraints
  - `1 <= n == parent.length == load.length <= 2 * 10^4`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]`
  - Following parents from any service reaches the entry service (no loops)
  - `1 <= load[i] <= 50`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: equal_load_shard_cuts
  params:
    - {name: parent, type: "int[]"}
    - {name: load, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def equal_load_shard_cuts(parent: list[int], load: list[int]) -> int:
        n = len(parent)
        children: list[list[int]] = [[] for _ in range(n)]
        root = 0
        for svc, up in enumerate(parent):
            if up == -1:
                root = svc
            else:
                children[up].append(svc)
        # breadth-first order puts every parent before its children
        order = [root]
        for svc in order:
            order.extend(children[svc])
        sub = list(load)
        for svc in reversed(order):
            if parent[svc] != -1:
                sub[parent[svc]] += sub[svc]
        total = sub[root]
        # With positive loads, k shards of load total/k exist exactly when exactly k
        # subtree sums are multiples of total/k; try the largest shard count first.
        for shards in range(min(n, total), 1, -1):
            if total % shards:
                continue
            size = total // shards
            if sum(1 for s in sub if s % size == 0) == shards:
                return shards - 1
        return 0
  javascript: |
    function equalLoadShardCuts(parent, load) {
      const n = parent.length;
      const children = Array.from({ length: n }, () => []);
      let root = 0;
      for (let v = 0; v < n; v++) {
        if (parent[v] === -1) root = v;
        else children[parent[v]].push(v);
      }
      const order = [root];
      for (let i = 0; i < order.length; i++) {
        for (const c of children[order[i]]) order.push(c);
      }
      const sub = load.slice();
      for (let i = n - 1; i > 0; i--) {
        const v = order[i];
        sub[parent[v]] += sub[v];
      }
      const total = sub[root];
      for (let shards = Math.min(n, total); shards >= 2; shards--) {
        if (total % shards !== 0) continue;
        const size = total / shards;
        let hits = 0;
        for (const s of sub) if (s % size === 0) hits++;
        if (hits === shards) return shards - 1;
      }
      return 0;
    }
