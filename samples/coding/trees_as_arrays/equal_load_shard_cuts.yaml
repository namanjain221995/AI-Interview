expected_concepts:
  - "converting a parent array into child lists"
  - "subtree sums in a children-before-parents order"
  - "the shard load must divide the total load, and at most n shards exist"
  - "a split into k shards exists exactly when k subtree sums are multiples of total / k (positive loads)"
  - "trying shard counts from largest to smallest and stopping at the first feasible one"
  - "iterative traversal order to avoid deep recursion"
optimal_complexity: {time: "O(n * d(S)) where S is the total load and d(S) its number of divisors", space: "O(n)"}
rubric:
  excellent: "Observes that the shard load must be a divisor of the total, computes subtree sums once in an iterative children-first order, and for each candidate shard count (largest first) checks feasibility in O(n), either by counting subtree sums divisible by the shard load or by a greedy post-order that cuts whenever a running sum reaches the target; justifies why the greedy cut or the count is correct with positive loads and states the O(n * d(S)) bound."
  good: "Correct divisor enumeration with a per-candidate DFS that cuts when the residual equals the target and fails when it exceeds it, possibly recursive, with a reasonable complexity argument after a hint."
  weak: "Tries subsets of links, only checks splitting into two shards, assumes the entry service is id 0 or that parents have smaller ids, or returns the number of shards instead of the number of removed links."
  criteria:
    correctness: "All tests pass, including no valid split, single services, unit loads where every link is cut and totals whose largest divisors are infeasible."
    efficiency: "Enumerates only divisors of the total up to n candidate shard counts and checks each in linear time."
    code_quality: "Builds the tree once, reuses the subtree sums across candidates and names the shard load and shard count clearly."
    edge_cases: "Handles n = 1, two services with equal and unequal loads, prime totals and deep chains."
    communication: "Explains why a node whose subtree sum is a multiple of the shard load must start a new shard, and why positive loads make the check exact."
hints:
  - "If the mesh is cut into k shards of equal load, what must be true of the total load and k? How many candidate values of k are there?"
  - "Fix a shard load t that divides the total. Work bottom-up through the tree: when the load accumulated in a subtree (minus what has already been cut off below it) reaches exactly t, that link to the parent must be removed; if it ever exceeds t, this t is impossible."
  - "Compute every subtree sum once in a children-first order. Because loads are positive, k = total / t shards are achievable exactly when exactly k subtree sums are multiples of t. Try k from min(n, total) down to 2 among the divisors of the total and return k - 1 for the first that works, otherwise 0."
followups:
  - "How would you return the actual links to remove for the best split?"
  - "What breaks in your feasibility check if some services may have load 0?"
  - "How would you handle a request for shards whose loads differ by at most a given tolerance instead of being exactly equal?"
  - "If the mesh were a general graph with cycles instead of a tree, what would change about the problem?"
common_errors:
  - "Returning the number of shards instead of the number of removed links."
  - "Trying shard loads that do not divide the total load, or trying more shards than services."
  - "Assuming the entry service is id 0 or that parents have smaller ids than their children."
  - "Recursive DFS that overflows the call stack on a 2 * 10^4-service chain."
  - "Recomputing subtree sums from scratch for each candidate with a separate quadratic pass."
