slug: record_setting_model_versions
title: Record-Setting Model Versions
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [ml, data_scientist, data, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Record-Setting Model Versions

  Your model registry tracks a lineage of `n` model versions numbered `0..n-1`. Every version except
  the base model was fine-tuned from exactly one earlier checkpoint:

  - `parent[i]` is the version that version `i` was fine-tuned from, or `-1` for the base model
    (exactly one version has `-1`),
  - version numbers are assigned by the registry, not by training order, so a parent may have a
    **larger** index than its child,
  - `score[i]` is the benchmark score of version `i` (it can be negative).

  The ancestors of a version are its parent, its parent's parent, and so on up to the base model. A
  version is **record-setting** when its score is **greater than or equal to** the score of every one
  of its ancestors. The base model has no ancestors, so it is always record-setting.

  Return the number of record-setting versions.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1, 2], score = [3, 5, 1, 4, 5, 3]
  Output: 4
  Explanation: versions 0 (base), 1 (5 >= 3), 4 (5 >= max(5, 3); ties count) and
  5 (3 >= max(1, 3)) are record-setting; 2 and 3 are not.
  ```

  ### Example 2
  ```
  Input:  parent = [2, 2, -1, 1], score = [-4, 7, 0, 7]
  Output: 3
  Explanation: the base model is version 2. Versions 2, 1 and 3 are record-setting; version 0 scores
  below its parent.
  ```

  ### Constraints
  - `1 <= n == parent.length == score.length <= 10^5`
  - exactly one `parent[i] == -1`; every other `parent[i]` is in `0..n-1` and the links form a tree
  - `-10^9 <= score[i] <= 10^9`
  - the lineage can be a single chain of `n` versions
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: record_setting_model_versions
  params:
    - {name: parent, type: "int[]"}
    - {name: score, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def record_setting_model_versions(parent: list[int], score: list[int]) -> int:
        n = len(parent)
        children: list[list[int]] = [[] for _ in range(n)]
        root = -1
        for version, p in enumerate(parent):
            if p == -1:
                root = version
            else:
                children[p].append(version)
        count = 0
        # Iterative DFS: each entry carries the best score among the node's ancestors.
        stack = [(root, None)]
        while stack:
            node, best_above = stack.pop()
            if best_above is None or score[node] >= best_above:
                count += 1
            best_here = score[node] if best_above is None else max(best_above, score[node])
            for child in children[node]:
                stack.append((child, best_here))
        return count
  javascript: |
    function recordSettingModelVersions(parent, score) {
      const n = parent.length;
      const children = Array.from({ length: n }, () => []);
      let root = -1;
      for (let v = 0; v < n; v++) {
        if (parent[v] === -1) root = v;
        else children[parent[v]].push(v);
      }
      let count = 0;
      const nodes = [root];
      const bests = [-Infinity];
      while (nodes.length > 0) {
        const node = nodes.pop();
        const bestAbove = bests.pop();
        if (score[node] >= bestAbove) count++;
        const bestHere = Math.max(bestAbove, score[node]);
        for (const child of children[node]) {
          nodes.push(child);
          bests.push(bestHere);
        }
      }
      return count;
    }
