expected_concepts:
  - building child adjacency lists from a parent array
  - depth-first or breadth-first traversal carrying a running maximum
  - iterative traversal to avoid recursion depth limits on long chains
  - locating the root instead of assuming index 0
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Builds child lists, finds the root, traverses iteratively (or with an explicit stack) while carrying the maximum ancestor score, counts ties correctly and explains O(n) time and space and why recursion can overflow on a long chain.
  good: Correct recursive or iterative traversal carrying the running maximum, with a prompt about deep chains, ties or a root that is not version 0.
  weak: Walks up the ancestor chain separately for every version (quadratic on a chain), compares only with the direct parent, or assumes version 0 is the base model.
  criteria:
    correctness: All tests pass, including ties, negative scores and roots at any index.
    efficiency: One traversal of the tree in linear time rather than per-version ancestor walks.
    code_quality: Clear separation between building the tree and traversing it; meaningful names for the running maximum.
    edge_cases: Single version, equal scores, extreme values and a 1000-long chain.
    communication: Explains why the running maximum passed down is all the state a version needs.
hints:
  - A version only needs to know one number about all of its ancestors to decide whether it sets a record. Which number?
  - Turn the parent array into lists of children so you can start at the base model and walk downwards, passing the best ancestor score along each branch.
  - Find the version whose parent is -1, then use an explicit stack of pairs (version, best score above it); count the version when its score is at least that best value, and push each child with the larger of the two values. An explicit stack keeps very long chains safe.
followups:
  - How would you list the record-setting versions sorted by version number instead of counting them?
  - What changes if a version must strictly beat every ancestor?
  - How would you answer this incrementally as new fine-tuned versions are registered one at a time?
common_errors:
  - Assuming version 0 is the base model or that parents always have smaller indices.
  - Comparing only against the direct parent instead of the maximum over all ancestors.
  - Using strict greater-than and missing versions that tie an ancestor.
  - Recursing on a long chain and hitting the language recursion limit.
