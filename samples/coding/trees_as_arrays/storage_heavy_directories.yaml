version: 1
slug: storage_heavy_directories
title: "Storage-Heavy Directories"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, sre, platform, cloud]
time_limit_minutes: 20
prompt_markdown: |
  ## Storage-Heavy Directories

  A disk audit on a build host produced a flat list of files: `file_paths[i]` is the absolute path of a
  file and `sizes[i]` its size in bytes. Directories are not listed on their own; a directory exists when
  at least one file lives somewhere beneath it. The root directory `/` contains every file.

  The **total** of a directory is the sum of the sizes of all files anywhere beneath it (directly inside
  it or in any of its subdirectories). Return every directory, including `/`, whose total is **at least**
  `threshold`.

  - Write directories as absolute paths without a trailing slash, except the root, which is `"/"`.
  - Sort the result in plain lexicographic order of the path strings (compare character codes one by
    one; a path that is a prefix of another comes first). For example `"/a-b"` sorts before `"/a/b"`
    because `-` has a smaller character code than `/`.
  - Return an empty list when no directory qualifies.

  Totals can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  file_paths = ["/var/log/app.log", "/var/log/sys.log", "/var/cache/pkg.tar", "/home/ci/build.out", "/etc/hosts"]
          sizes = [300, 200, 900, 50, 5], threshold = 500
  Output: ["/", "/var", "/var/cache", "/var/log"]
  Explanation: totals are / = 1455, /var = 1400, /var/cache = 900, /var/log = 500, /home = 50,
  /home/ci = 50 and /etc = 5.
  ```

  ### Example 2
  ```
  Input:  file_paths = ["/readme.txt"], sizes = [10], threshold = 11
  Output: []
  Explanation: the only directory is / with a total of 10.
  ```

  ### Constraints
  - `1 <= file_paths.length == sizes.length <= 10^4`
  - Every path starts with `/`, has no trailing `/`, no empty, `.` or `..` components, uses printable ASCII
    only and is at most 200 characters long.
  - Paths are distinct, and no file path is also a directory of another file.
  - `0 <= sizes[i] <= 10^11`, `0 <= threshold <= 10^15`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: storage_heavy_directories
  params:
    - {name: file_paths, type: "string[]"}
    - {name: sizes, type: "long[]"}
    - {name: threshold, type: "long"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def storage_heavy_directories(file_paths: list[str], sizes: list[int], threshold: int) -> list[str]:
        totals: dict[str, int] = {}
        for path, size in zip(file_paths, sizes):
            totals["/"] = totals.get("/", 0) + size
            cut = path.find("/", 1)
            while cut != -1:
                directory = path[:cut]
                totals[directory] = totals.get(directory, 0) + size
                cut = path.find("/", cut + 1)
        return sorted(d for d, total in totals.items() if total >= threshold)
  javascript: |
    function storageHeavyDirectories(filePaths, sizes, threshold) {
      const totals = new Map();
      const add = (dir, size) => totals.set(dir, (totals.get(dir) || 0) + size);
      for (let i = 0; i < filePaths.length; i++) {
        const path = filePaths[i];
        add("/", sizes[i]);
        let cut = path.indexOf("/", 1);
        while (cut !== -1) {
          add(path.slice(0, cut), sizes[i]);
          cut = path.indexOf("/", cut + 1);
        }
      }
      const result = [];
      for (const [dir, total] of totals) if (total >= threshold) result.push(dir);
      return result.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
