expected_concepts:
  - "aggregating subtree sums over a directory tree"
  - "hash map keyed by directory path (or an explicit trie of path components)"
  - "enumerating ancestor directories by splitting on '/'"
  - "64-bit totals"
  - "lexicographic sort by character code"
optimal_complexity: {time: "O(L + D log D) where L is the total path length and D the number of directories", space: "O(L)"}
rubric:
  excellent: "Adds each file's size to every ancestor directory (or builds a component trie and sums bottom-up) in time linear in the total path length, keys directories by whole components so /data/log and /data/logs stay separate, includes the root, uses 64-bit totals and sorts by plain string order."
  good: "Correct aggregation and output with minor prompting, for example a missed root directory or an extra pass, and the right complexity."
  weak: "Matches directories with a raw string prefix test (so /data/log absorbs /data/logs), compares every directory against every file, drops the root, or overflows 32-bit totals."
  criteria:
    correctness: "All tests pass, including the prefix-name trap, the ordering trap and totals above 2^31."
    efficiency: "Each file contributes to its ancestors once; no all-pairs comparison of directories and files."
    code_quality: "A small helper that yields ancestor directories; clear naming of totals."
    edge_cases: "Files directly under /, zero-size files, threshold 0, an exact-equality threshold, nothing qualifying."
    communication: "Explains why the cost is proportional to the total path length and how the root is represented."
hints:
  - "A file's bytes count towards every directory on the way from the root down to that file. Which directories are those for one path?"
  - "Walk each path once, cutting it at every '/', and add the file's size to a running total for each of those directory prefixes, plus the root."
  - "Use a hash map from directory string to total: for each file add its size to '/' and to path[:k] for every later position k of '/'; then keep the directories whose total is at least the threshold and sort them as plain strings."
followups:
  - "How would you report the directories ordered by total size instead, with ties broken by path?"
  - "Files are added and removed continuously; how would you keep the totals up to date cheaply?"
  - "How would you return only the smallest qualifying directories (those with no qualifying subdirectory)?"
  - "What changes if the audit also lists symbolic links that point to other directories?"
common_errors:
  - "Using a plain startswith test on directory names, so /data/log also counts files in /data/logs."
  - "Forgetting to include the root directory."
  - "Treating the last path component (the file itself) as a directory."
  - "Summing into 32-bit integers in Java, C++ or Go."
  - "Sorting with a locale-aware comparison that does not order '-' before '/'."
