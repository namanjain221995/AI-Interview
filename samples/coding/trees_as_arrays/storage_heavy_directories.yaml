  - {id: t1, args: [["/var/log/app.log", "/var/log/sys.log", "/var/cache/pkg.tar", "/home/ci/build.out", "/etc/hosts"], [300, 200, 900, 50, 5], 500], expected: ["/", "/var", "/var/cache", "/var/log"], description: "Example 1 - nested totals and a directory exactly at the threshold"}
  - {id: t2, args: [["/readme.txt"], [10], 11], expected: [], description: "Example 2 - only the root exists and it is below the threshold"}
  - {id: t3, hidden: true, args: [["/data/log/a.txt", "/data/logs/b.txt"], [1, 100], 50], expected: ["/", "/data", "/data/logs"], description: "Sibling names where one is a string prefix of the other - /data/log must not absorb /data/logs"}
  - {id: t4, hidden: true, args: [["/srv/app/x/y.bin", "/srv/app-v2/y.bin", "/srv/app.old"], [40, 40, 40], 40], expected: ["/", "/srv", "/srv/app", "/srv/app-v2", "/srv/app/x"], description: "Ordering trap - '-' sorts before '/' so /srv/app-v2 lies between /srv/app and /srv/app/x; the file /srv/app.old is not a directory"}
  - {id: t5, hidden: true, args: [["/a/b/c/d/e/f/g.dat"], [7], 7], expected: ["/", "/a", "/a/b", "/a/b/c", "/a/b/c/d", "/a/b/c/d/e", "/a/b/c/d/e/f"], description: "Single deep file - every ancestor qualifies, returned shortest first"}
  - {id: t6, hidden: true, args: [["/opt/empty/zero.lock", "/opt/tool/bin"], [0, 3], 0], expected: ["/", "/opt", "/opt/empty", "/opt/tool"], description: "Threshold 0 includes every directory, even one holding only empty files"}
  - {id: t7, hidden: true, args: [["/x.log", "/y.log", "/z.log"], [5, 6, 7], 18], expected: ["/"], description: "Files directly under the root; the root total equals the threshold exactly"}
  - {id: t8, hidden: true, args: [["/mnt/a/1.img", "/mnt/a/2.img", "/mnt/b/3.img", "/mnt/b/4.img"], [100000000000, 100000000000, 99999999999, 100000000000], 200000000000], expected: ["/", "/mnt", "/mnt/a"], description: "Sizes near 10^11 - totals overflow 32-bit, /mnt/b is one byte short"}
