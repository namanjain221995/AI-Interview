expected_concepts:
  - breadth-first decoding with a queue of present nodes and a read cursor
  - difference between compact level order and heap-index layout
  - handling dropped trailing entries as missing children
  - in-order traversal (iterative with a stack for deep trees)
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Decodes with a queue of present nodes and a cursor that consumes two entries per dequeued node, treats missing entries as absent children, explains why heap indexing fails for this format, and produces the in-order sequence iteratively in O(n) time and space.
  good: Correct queue-based decoding and a recursive in-order traversal, possibly needing a prompt about dropped trailing entries or deep paths.
  weak: Decodes with heap indices 2i+1 and 2i+2, reads past the end of the dump, treats 0 as missing or returns a pre-order or level-order sequence.
  criteria:
    correctness: All tests pass, including dropped trailing entries, gaps deeper in the tree and the empty tree.
    efficiency: Each entry is read once and each node visited once; no quadratic list operations such as popping from the front of an array repeatedly.
    code_quality: Decoding and traversal are separate steps with a clear node representation.
    edge_cases: Empty array, [-1], single node, zero values and a long single path.
    communication: Explains the invariant that the cursor always points at the next unclaimed child slot of the oldest queued node.
hints:
  - The children of a node are not at fixed positions in this dump. Which nodes have their child entries written, and in what order?
  - Rebuild the tree level by level with a queue of present nodes; each node you take from the queue claims the next two entries of the dump as its left and right children.
  - Create the root, then repeatedly dequeue a node and read two entries with a moving cursor, attaching and enqueuing each one that is present and treating minus one or a position past the end as missing; finally run an in-order traversal with an explicit stack so a long path does not overflow the call stack.
followups:
  - Write the encoder that produces this compact dump from a tree, including dropping trailing entries.
  - How would you check that a dump is valid, for example that it has no extra entries?
  - How would you rebuild the tree if the dump stored pre-order with markers instead of level order?
common_errors:
  - Decoding with heap positions 2i+1 and 2i+2, which breaks as soon as a node is missing above the last level.
  - Reading past the end of the dump instead of treating dropped entries as missing children.
  - Treating the value 0 as a missing node.
  - Recursing on a 10^4-node path and exceeding the recursion limit.
