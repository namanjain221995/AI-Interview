slug: decode_compact_tree_inorder
title: Decode a Compact Tree Dump
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, fullstack, general, qa]
time_limit_minutes: 20
prompt_markdown: |
  ## Decode a Compact Tree Dump

  A cache service persists binary search indexes as **compact level-order dumps** so that tall,
  narrow trees do not waste space. A dump `data` is produced like this:

  1. Write the root value (or `-1` if the tree is empty).
  2. Visit the **present** nodes in breadth-first order (level by level, left to right). For each one,
     write two entries: its left child value, then its right child value, using `-1` for a missing
     child.
  3. Missing children get **no** entries of their own (there is nothing below them to describe).
  4. Trailing `-1` entries at the end of the dump may be dropped; any entries that are not there are
     treated as missing children.

  Node values are non-negative and need not be distinct.

  A QA tool needs the **in-order traversal** (left subtree, node, right subtree) of the dumped tree.
  Decode `data` and return the in-order sequence of values. An empty array or `[-1]` describes the
  empty tree; return `[]` for it.

  ### Example 1
  ```
  Input:  data = [1, 2, 3, -1, 4, 5]
  Output: [2, 4, 1, 5, 3]
  Explanation: 1 has children 2 and 3; 2 has only a right child 4; 3 has a left child 5 and its
  right entry was a trailing -1 that got dropped.
  ```

  ### Example 2
  ```
  Input:  data = [7, -1, 8, -1, 9]
  Output: [7, 8, 9]
  Explanation: each node has only a right child; the missing left children get no entries.
  ```

  ### Example 3
  ```
  Input:  data = [-1]
  Output: []
  ```

  ### Constraints
  - `0 <= data.length <= 2 * 10^4 + 1`
  - the tree has at most `10^4` nodes and may be a single path of that length
  - present values are in `0..10^9`; `-1` marks a missing node
  - `data` is a valid dump (no entries beyond the children of the last present node)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: decode_compact_tree_inorder
  params:
    - {name: data, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def decode_compact_tree_inorder(data: list[int]) -> list[int]:
        if not data or data[0] == -1:
            return []
        values = [data[0]]
        left = [-1]
        right = [-1]
        queue = deque([0])
        pos = 1
        while queue and pos < len(data):
            node = queue.popleft()
            for children in (left, right):
                if pos < len(data) and data[pos] != -1:
                    values.append(data[pos])
                    left.append(-1)
                    right.append(-1)
                    children[node] = len(values) - 1
                    queue.append(len(values) - 1)
                pos += 1
        # Iterative in-order traversal (the tree can be a long path).
        result: list[int] = []
        stack: list[int] = []
        node = 0
        while stack or node != -1:
            while node != -1:
                stack.append(node)
                node = left[node]
            node = stack.pop()
            result.append(values[node])
            node = right[node]
        return result
  javascript: |
    function decodeCompactTreeInorder(data) {
      if (data.length === 0 || data[0] === -1) return [];
      const values = [data[0]];
      const left = [-1];
      const right = [-1];
      const queue = [0];
      let head = 0;
      let pos = 1;
      while (head < queue.length && pos < data.length) {
        const node = queue[head++];
        for (const children of [left, right]) {
          if (pos < data.length && data[pos] !== -1) {
            values.push(data[pos]);
            left.push(-1);
            right.push(-1);
            children[node] = values.length - 1;
            queue.push(values.length - 1);
          }
          pos++;
        }
      }
      const result = [];
      const stack = [];
      let node = 0;
      while (stack.length > 0 || node !== -1) {
        while (node !== -1) {
          stack.push(node);
          node = left[node];
        }
        node = stack.pop();
        result.push(values[node]);
        node = right[node];
      }
      return result;
    }
