expected_concepts:
  - "WITH RECURSIVE that carries the top-level ancestor id down to every descendant category"
  - "LEFT JOIN so departments without products keep a zero count"
  - "COUNT of a nullable column versus COUNT(*) after an outer join"
  - "grouping by the top-level category"
  - "deterministic ORDER BY with a tie-breaker"
optimal_complexity: {time: "O(C + P) with indexes on parent_id and category_id", space: "O(C)"}
rubric:
  excellent: "Builds a recursive CTE that maps every category to its top-level ancestor, outer-joins products, counts product ids per department so empty departments show 0, applies both sort keys and explains why COUNT(*) would report 1 for an empty department."
  good: "Correct query after a hint about carrying the root id through the recursion, the outer join or the tie-breaker."
  weak: "Counts only products attached directly to the department or its immediate subcategories, drops departments without products, or counts NULL rows from the outer join."
  criteria:
    correctness: "All tests pass, including deep chains, empty departments and ties."
    efficiency: "Each category is visited once by the recursion; mentions indexes on parent_id and category_id."
    code_quality: "Named CTE with explicit columns and clear output aliases."
    edge_cases: "Empty tables, categories without products, products on the department itself and child ids smaller than parent ids."
    communication: "Explains how the root id is propagated and why the outer join is needed."
hints:
  - "The hard part is knowing, for every category at any depth, which department it ultimately belongs to; once you have that mapping the counting is ordinary grouping."
  - "Use a recursive common table expression that starts from the top-level categories and walks down one level at a time, remembering which top-level category each row started from."
  - "Anchor the CTE on categories with a NULL parent, emitting each id as both the root and the current category. In the recursive member join categories whose parent is the current category and keep the same root. Then join departments to this mapping, LEFT JOIN products on the mapped category, count the product ids per department and order by the count descending and the name ascending."
followups:
  - "How would you report the count for every category at every level, not just the departments?"
  - "How would the query change if a product could belong to several categories?"
  - "What would you add to protect the query against a cycle introduced by a bad catalogue import?"
  - "How would you precompute this rollup if the dashboard is refreshed every few seconds?"
common_errors:
  - "Counting only products whose category is the department or one level below it."
  - "Using an inner join with products, so departments without products disappear."
  - "Using COUNT(*) after the outer join, which reports 1 instead of 0 for an empty department."
  - "Losing the top-level id in the recursive member, so descendants cannot be grouped by department."
  - "Ordering only by the count, leaving ties in an arbitrary order."
