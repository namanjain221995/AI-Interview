version: 1
slug: sql_top_category_product_rollup
title: "Top-Level Category Product Rollup (SQL)"
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data_analyst, backend, data, business_analyst]
time_limit_minutes: 25
prompt_markdown: |
  ## Top-Level Category Product Rollup

  A home-goods retailer's catalogue analysts want a department-level view of how many products each part
  of the range holds. Categories form a tree of **any depth**: a top-level category (a department) has no parent, and every
  other category has exactly one parent category. Each product is assigned to exactly one category,
  which can sit at any depth.

  Table `categories`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | VARCHAR(100) | names of top-level categories are unique |
  | parent_id | INTEGER | `categories.id` of the parent; **NULL for a top-level category** |

  Table `products`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | VARCHAR(100) | |
  | category_id | INTEGER | references `categories.id`; never NULL |

  For **every top-level category** return:

  - `category_name`: its name;
  - `product_count`: the number of products assigned to that category **or to any category below it**
    (children, grandchildren and so on).

  Top-level categories without any products must appear with `product_count = 0`. Order the rows by
  `product_count` descending, then by `category_name` ascending. If there are no categories, return no
  rows.

  Every non-NULL `parent_id` refers to an existing category and the tree has **no cycles**. Write standard
  SQL that runs on both PostgreSQL and SQLite (a recursive common table expression is expected).

  ### Example 1
  ```
  categories                         products
  +----+------------+-----------+    +----+----------------+-------------+
  | id | name       | parent_id |    | id | name           | category_id |
  +----+------------+-----------+    +----+----------------+-------------+
  | 1  | Lighting   | NULL      |    | 1  | LED bulb       | 3           |
  | 2  | Lamps      | 1         |    | 2  | Smart bulb     | 3           |
  | 3  | Bulbs      | 2         |    | 3  | Desk lamp      | 2           |
  | 4  | Outdoor    | NULL      |    | 4  | Light strip    | 1           |
  | 5  | Grills     | 4         |    | 5  | Charcoal grill | 5           |
  | 6  | Stationery | NULL      |    | 6  | Gas grill      | 5           |
  +----+------------+-----------+    | 7  | Fire pit       | 4           |
                                     +----+----------------+-------------+

  Output
  +---------------+---------------+
  | category_name | product_count |
  +---------------+---------------+
  | Lighting      | 4             |
  | Outdoor       | 3             |
  | Stationery    | 0             |
  +---------------+---------------+
  Lighting counts its own product, the lamp in Lamps and both bulbs two levels down.
  ```

  ### Example 2
  ```
  categories                          products
  +----+----------+-----------+       +----+---------+-------------+
  | id | name     | parent_id |       | id | name    | category_id |
  +----+----------+-----------+       +----+---------+-------------+
  | 10 | Office   | NULL      |       | 1  | A4 ream | 11          |
  | 11 | Paper    | 10        |       | 2  | Earbuds | 14          |
  | 12 | Audio    | NULL      |       +----+---------+-------------+
  | 13 | Headsets | 12        |
  | 14 | Wireless | 13        |
  +----+----------+-----------+

  Output
  +---------------+---------------+
  | category_name | product_count |
  +---------------+---------------+
  | Audio         | 1             |
  | Office        | 1             |
  +---------------+---------------+
  Both departments have one product, so they are ordered by name.
  ```

  ### Constraints
  - `0 <=` number of categories `<= 10^4`, `0 <=` number of products `<= 10^6`; the tree can be many levels deep.
  - Top-level category names are unique; every `products.category_id` exists in `categories`.
languages: [sql]
starter_code:
  sql: |
    -- Return category_name and product_count for every top-level category (including its subcategories).
    SELECT c.name AS category_name, COUNT(p.id) AS product_count
    FROM categories c
    LEFT JOIN products p ON p.category_id = c.id
    WHERE c.parent_id IS NULL
    GROUP BY c.id, c.name
    ORDER BY product_count DESC, category_name ASC;
reference_solutions:
  sql: |
    WITH RECURSIVE subtree (root_id, category_id) AS (
      SELECT id, id
      FROM categories
      WHERE parent_id IS NULL
      UNION ALL
      SELECT s.root_id, c.id
      FROM categories c
      JOIN subtree s ON c.parent_id = s.category_id
    )
    SELECT r.name AS category_name, COUNT(p.id) AS product_count
    FROM categories r
    JOIN subtree s ON s.root_id = r.id
    LEFT JOIN products p ON p.category_id = s.category_id
    GROUP BY r.id, r.name
    ORDER BY product_count DESC, category_name ASC;
sql_setup: |
  CREATE TABLE categories (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    parent_id INTEGER REFERENCES categories (id)
  );
  CREATE TABLE products (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    category_id INTEGER NOT NULL REFERENCES categories (id)
  );
tests:
  - id: t1
    description: "Example 1 - products two levels deep roll up; a department without products shows 0"
    ordered: true
    setup_sql: |
      INSERT INTO categories (id, name, parent_id) VALUES
        (1, 'Lighting', NULL), (2, 'Lamps', 1), (3, 'Bulbs', 2), (4, 'Outdoor', NULL), (5, 'Grills', 4),
        (6, 'Stationery', NULL);
      INSERT INTO products (id, name, category_id) VALUES
        (1, 'LED bulb', 3), (2, 'Smart bulb', 3), (3, 'Desk lamp', 2), (4, 'Light strip', 1),
        (5, 'Charcoal grill', 5), (6, 'Gas grill', 5), (7, 'Fire pit', 4);
    expected_rows: [["Lighting", 4], ["Outdoor", 3], ["Stationery", 0]]
  - id: t2
    description: "Example 2 - tie on product_count broken by category_name"
    ordered: true
    setup_sql: |
      INSERT INTO categories (id, name, parent_id) VALUES
        (10, 'Office', NULL), (11, 'Paper', 10), (12, 'Audio', NULL), (13, 'Headsets', 12), (14, 'Wireless', 13);
      INSERT INTO products (id, name, category_id) VALUES (1, 'A4 ream', 11), (2, 'Earbuds', 14);
    expected_rows: [["Audio", 1], ["Office", 1]]
