  - {id: t2, args: [["/data/cache/tmp"], ["/data", "/data/cache", "/data/cache/tmp/jobs"]], expected: 1, description: "Example 2 - ancestors of an existing directory already exist; only jobs is new"}
  - {id: t3, hidden: true, args: [[], []], expected: 0, description: "No targets at all"}
  - {id: t4, hidden: true, args: [[], ["/", "/"]], expected: 0, description: "Only the root as a target - it always exists"}
  - {id: t5, hidden: true, args: [[], ["/a/b/c/d/e"]], expected: 5, description: "Empty existing list: a five-level path creates five directories"}
  - {id: t6, hidden: true, args: [["/var/log"], ["/var/logs/app", "/var/log/app"]], expected: 3, description: "Prefix trap: /var/log existing does not cover /var/logs"}
  - {id: t7, hidden: true, args: [["/etc/nginx"], ["/etc/nginx", "/etc", "/etc/nginx"]], expected: 0, description: "Every target already exists - nothing is created"}
  - {id: t8, hidden: true, args: [[], ["/srv/x/y", "/srv/x/y", "/srv/x"]], expected: 3, description: "Repeated targets do not create directories twice"}
