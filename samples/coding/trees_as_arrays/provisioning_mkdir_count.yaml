expected_concepts:
  - "set of existing directories including all ancestors"
  - "enumerating segment prefixes of a path"
  - "counting and inserting newly created directories"
  - "whole-segment matching instead of string prefixes"
optimal_complexity: {time: "O(total length of all paths)", space: "O(total number of distinct directories)"}
rubric:
  excellent: "Seeds a set with every ancestor prefix of the existing directories, walks each target's prefixes from the top, counts and inserts the missing ones, and explains the cost in terms of total path length (or uses a segment trie)."
  good: "Correct set- or trie-based solution after fixing one detail such as forgetting ancestors of existing directories or double-counting repeated targets."
  weak: "Only checks whether the full target exists, uses string prefix tests on existing paths, or counts the root as created."
  criteria:
    correctness: "All tests pass, including repeated targets, the root and the log/logs trap."
    efficiency: "Each prefix is hashed or visited a bounded number of times; no pairwise comparison of all paths."
    code_quality: "A helper that yields prefixes keeps the main loop readable."
    edge_cases: "Empty lists, root-only targets, already-existing targets and case-sensitive names."
    communication: "Explains why ancestors of existing directories must be treated as existing too."
hints:
  - "A directory is created exactly once, the first time some target needs it and it is not already there."
  - "Keep a collection of every directory that exists so far, including all the ancestors of the existing list, and look at every ancestor of each target, not just the target itself."
  - "Turn each path into its chain of growing prefixes (the first segment, then the first two segments, and so on); add every prefix of the existing paths to a set, then for each target walk its prefixes from the top, and each time a prefix is missing add it to the set and increase the counter."
followups:
  - "How would you print the actual mkdir commands in an order that never relies on -p?"
  - "How would you report which target caused each directory to be created?"
  - "How would a trie of segments compare with a set of full prefix strings for memory use on very deep paths?"
common_errors:
  - "Not adding the ancestors of existing directories, so /data is counted as created when /data/cache/tmp existed."
  - "Testing existence with a string prefix check, which treats /var/logs as inside /var/log."
  - "Counting a directory again when a later target passes through it."
  - "Counting the root directory as created."
