version: 1
slug: provisioning_mkdir_count
title: Directories Created by Provisioning
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, platform, cloud, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Directories Created by Provisioning

  A host provisioning script prepares a fresh machine by running `mkdir -p` once for each path in
  `targets`, in order. `mkdir -p` creates the target directory together with every missing ancestor,
  and silently does nothing for directories that already exist.

  Before the script runs, the root `/`, every directory listed in `existing` **and every ancestor of
  those directories** already exist. Directories created by an earlier target of course also exist for
  later targets.

  The audit log needs to record how much the script changed. Return the **total number of directories
  that are actually created** across all targets.

  All paths are absolute and normalised: they start with `/`, use a single `/` between segments, have no
  trailing slash (the root is `"/"`) and contain no empty, `.` or `..` segments. Directory names are
  compared exactly (case-sensitive) and as whole segments, so `/var/log` existing says nothing about
  `/var/logs`.

  ### Example 1
  ```
  Input:  existing = ["/srv/app"], targets = ["/srv/app/logs/2026", "/srv/app/logs/archive", "/opt/tools"]
  Output: 5
  Explanation: Creates /srv/app/logs and /srv/app/logs/2026, then /srv/app/logs/archive, then /opt and /opt/tools.
  ```

  ### Example 2
  ```
  Input:  existing = ["/data/cache/tmp"], targets = ["/data", "/data/cache", "/data/cache/tmp/jobs"]
  Output: 1
  ```

  ### Constraints
  - `0 <= existing.length, targets.length <= 1000`
  - `1 <= existing[i].length, targets[i].length <= 300`
  - Paths may repeat within and across the two lists
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: provisioning_mkdir_count
  params:
    - {name: existing, type: "string[]"}
    - {name: targets, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def provisioning_mkdir_count(existing: list[str], targets: list[str]) -> int:
        present: set[str] = set()

        def prefixes(path: str) -> list[str]:
            out: list[str] = []
            current = ""
            for part in path.split("/"):
                if part:
                    current += "/" + part
                    out.append(current)
            return out

        for path in existing:
            present.update(prefixes(path))
        created = 0
        for path in targets:
            for directory in prefixes(path):
                if directory not in present:
                    present.add(directory)
                    created += 1
        return created
  javascript: |
    function provisioningMkdirCount(existing, targets) {
      const present = new Set();
      const prefixes = (path) => {
        const out = [];
        let current = "";
        for (const part of path.split("/")) {
          if (part.length === 0) continue;
          current += "/" + part;
          out.push(current);
        }
        return out;
      };
      for (const path of existing) for (const dir of prefixes(path)) present.add(dir);
      let created = 0;
      for (const path of targets) {
        for (const dir of prefixes(path)) {
          if (!present.has(dir)) {
            present.add(dir);
            created += 1;
          }
        }
      }
      return created;
    }
