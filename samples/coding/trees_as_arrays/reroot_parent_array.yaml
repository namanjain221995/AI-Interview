slug: reroot_parent_array
title: Re-root a Cluster Tree
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, platform, network, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Re-root a Cluster Tree

  A cluster of `n` nodes (numbered `0..n-1`) spreads membership updates over a gossip tree. The tree
  is stored as a parent array rooted at the current coordinator: `parent[i]` is the node that node
  `i` receives updates from, and the coordinator is the only node with `parent[i] == -1`.

  After a failover, node `new_root` becomes the coordinator. The physical links do **not** change
  (the same pairs of nodes stay connected); only the direction of the tree changes so that every
  update now flows outward from `new_root`.

  Return the new parent array rooted at `new_root`: `new_root` gets `-1`, and every other node points
  to its neighbour on the path towards `new_root`.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 1], new_root = 3
  Output: [1, 3, 0, -1, 1]
  Explanation: the path 3 - 1 - 0 is reversed; nodes 2 and 4 keep their parents.
  ```

  ### Example 2
  ```
  Input:  parent = [3, 3, -1, 2], new_root = 0
  Output: [-1, 3, 3, 0]
  Explanation: the old coordinator 2 now receives updates from 3, which receives them from 0.
  ```

  ### Constraints
  - `1 <= n == parent.length <= 10^5`
  - exactly one `parent[i] == -1`; the links form a tree
  - `0 <= new_root < n` (it may already be the coordinator)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: reroot_parent_array
  params:
    - {name: parent, type: "int[]"}
    - {name: new_root, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def reroot_parent_array(parent: list[int], new_root: int) -> list[int]:
        result = list(parent)
        previous, node = -1, new_root
        # Only the edges on the path from new_root up to the old root change direction.
        while node != -1:
            upstream = parent[node]
            result[node] = previous
            previous, node = node, upstream
        return result
  javascript: |
    function rerootParentArray(parent, newRoot) {
      const result = parent.slice();
      let previous = -1;
      let node = newRoot;
      while (node !== -1) {
        const upstream = parent[node];
        result[node] = previous;
        previous = node;
        node = upstream;
      }
      return result;
    }
