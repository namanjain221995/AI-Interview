expected_concepts:
  - only the path from the new root to the old root changes direction
  - reversing pointers along a path (like reversing a linked list)
  - copying the input so unchanged nodes keep their parents
  - linear time without building adjacency lists
optimal_complexity: {time: O(n), space: O(n) for the output}
rubric:
  excellent: Observes that only edges on the path from new_root to the old root flip, reverses that path in place on a copy with previous/current pointers like a linked-list reversal, and explains O(n) time with no adjacency lists.
  good: Builds an undirected adjacency list and runs a BFS or DFS from new_root to assign parents, which is correct and linear but uses more memory and code.
  weak: Overwrites parent entries before reading the next hop, loses nodes off the path, or leaves two roots in the result.
  criteria:
    correctness: All tests pass, including re-rooting at the current coordinator and long paths.
    efficiency: Linear time; ideally only the path is touched.
    code_quality: Clear previous/current naming and no mutation of the input array that the caller still needs.
    edge_cases: Single node, new_root already the root, two-node tree and a path of 1000 nodes.
    communication: Explains why nodes off the path keep their old parent.
hints:
  - Which links actually change direction when the coordinator moves? Think about nodes that are not between the new and the old coordinator.
  - Only the nodes on the path from new_root up to the old coordinator get a new parent; everything else stays the same. This is very similar to reversing a linked list.
  - Copy the array, then walk upward from new_root keeping the previously visited node; at each step save the current node's old parent first, set its new parent to the previously visited node (starting from -1), and move up until you pass the old coordinator.
followups:
  - How would you re-root many times in a row efficiently, for example once per failover drill?
  - How would you compute the depth of every node after re-rooting?
  - If the input might contain a cycle, how would you detect it while walking up?
common_errors:
  - Overwriting a node's parent before reading where to go next, which breaks the walk.
  - Modifying the input array in place when the caller still needs it.
  - Leaving the old coordinator with -1, so the result has two roots.
  - Building a full adjacency list and BFS when a simple path reversal is enough (acceptable but heavier).
