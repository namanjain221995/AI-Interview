slug: api_route_wildcard_matching
title: "API Route Wildcard Matching"
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, fullstack, platform, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## API Route Wildcard Matching

  An API gateway forwards each incoming request to a backend chosen by its **route table**. Every route
  and every request path is written as `/` followed by one or more **segments** separated by `/`, for
  example `/users/42/orders` has the segments `users`, `42`, `orders`.

  In a route, a segment that is exactly `*` is a **wildcard** that matches any single request segment;
  every other route segment matches only the identical request segment. A route matches a request only
  when both have the **same number of segments** and every segment matches.

  Several routes can match the same request. The gateway picks the **most specific** one: compare two
  matching routes segment by segment from the left, and at the first position where they differ, the route
  with a literal segment beats the route with `*`. (Two different routes that both match a request can only
  differ in this way, so the winner is always unique.)

  For each request in `requests`, return the **index** in `routes` of the route the gateway picks, or `-1`
  when no route matches. Answers are returned in the order of `requests`.

  ### Example 1
  ```
  Input:  routes   = ["/users/*/orders", "/users/me/orders", "/users/*", "/health"]
          requests = ["/users/me/orders", "/users/42/orders", "/users/42", "/users/42/carts", "/health"]
  Output: [1, 0, 2, -1, 3]
  Explanation: "/users/me/orders" matches routes 0 and 1; they first differ at the second segment, where
  route 1 is literal. "/users/42/carts" has three segments but no three-segment route ends in carts.
  ```

  ### Example 2
  ```
  Input:  routes   = ["/*/status/live", "/teams/*/*"]
          requests = ["/teams/status/live", "/ops/status/live", "/teams/status"]
  Output: [1, 0, -1]
  Explanation: for "/teams/status/live" both routes match. Route 0 has more literal segments, but route 1
  is literal at the first position where they differ, so route 1 wins.
  ```

  ### Constraints
  - `1 <= routes.length <= 10^4`, `0 <= requests.length <= 10^4`
  - Every route and request has between 1 and 20 segments and at most 200 characters in total.
  - Request segments are non-empty and use lowercase letters, digits, `-`, `_` and `.`; route segments use
    the same characters or are exactly `*`.
  - Routes are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: api_route_wildcard_matching
  params:
    - {name: routes, type: "string[]"}
    - {name: requests, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def api_route_wildcard_matching(routes: list[str], requests: list[str]) -> list[int]:
        # Each trie node: [literal children, wildcard child, route index ending here]
        root: list = [{}, None, -1]
        for index, route in enumerate(routes):
            node = root
            for seg in route[1:].split("/"):
                if seg == "*":
                    if node[1] is None:
                        node[1] = [{}, None, -1]
                    node = node[1]
                else:
                    node = node[0].setdefault(seg, [{}, None, -1])
            node[2] = index

        def best(node: list, segs: list[str], pos: int) -> int:
            if pos == len(segs):
                return node[2]
            literal = node[0].get(segs[pos])
            if literal is not None:
                found = best(literal, segs, pos + 1)
                if found != -1:
                    return found
            if node[1] is not None:
                return best(node[1], segs, pos + 1)
            return -1

        return [best(root, request[1:].split("/"), 0) for request in requests]
  javascript: |
    function apiRouteWildcardMatching(routes, requests) {
      const makeNode = () => ({ literal: new Map(), wild: null, index: -1 });
      const root = makeNode();
      routes.forEach((route, index) => {
        let node = root;
        for (const seg of route.slice(1).split("/")) {
          if (seg === "*") {
            if (node.wild === null) node.wild = makeNode();
            node = node.wild;
          } else {
            if (!node.literal.has(seg)) node.literal.set(seg, makeNode());
            node = node.literal.get(seg);
          }
        }
        node.index = index;
      });
      const best = (node, segs, pos) => {
        if (pos === segs.length) return node.index;
        const literal = node.literal.get(segs[pos]);
        if (literal !== undefined) {
          const found = best(literal, segs, pos + 1);
          if (found !== -1) return found;
        }
        return node.wild === null ? -1 : best(node.wild, segs, pos + 1);
      };
      return requests.map((request) => best(root, request.slice(1).split("/"), 0));
    }
