expected_concepts:
  - "trie keyed by path segment with a separate wildcard child"
  - "depth-first search with backtracking (literal child first, then wildcard)"
  - "lexicographic specificity order and why the first full match found is the best"
  - "matching only at the exact segment depth"
  - "alternative: sort matching candidates by a per-segment specificity key"
optimal_complexity: {time: "O(total route length) to build; per request O(s) typically, O(2^s) in the worst case of a dense wildcard table", space: "O(total route length)"}
rubric:
  excellent: "Builds a segment trie with literal children and one wildcard child, answers each request with a DFS that tries the literal child before the wildcard and backtracks when a branch dead-ends, argues that this visits routes in specificity order so the first complete match is the answer, and discusses the worst case."
  good: "Correct results with minor prompting, for example scanning all routes per request and comparing specificity keys, or a trie that needs a hint about backtracking."
  weak: "Greedily follows the literal child without backtracking, prefers the route with the most literals, lets a wildcard match several segments, or compares segments as prefixes."
  criteria:
    correctness: "All tests pass, including backtracking cases, the leftmost-difference rule and segment count mismatches."
    efficiency: "Uses a trie (or an equally selective index) so a request does not compare against every route in typical tables."
    code_quality: "Clear node structure, a small recursive helper and no string concatenation in the hot path."
    edge_cases: "No requests, catch-all routes, requests longer or shorter than every route, special characters in segments."
    communication: "Explains the specificity order and why DFS order matches it."
hints:
  - "Think of the routes as a tree whose levels are path segments. At each level a request can continue through an identical literal segment or through the wildcard."
  - "Because a literal beats a wildcard at the first difference, explore the literal branch before the wildcard branch. But a literal branch can fail deeper down, so you must be able to come back."
  - "Insert every route into a trie with a map of literal children plus one wildcard child and store the route index at its last node. For a request, run a DFS that tries the literal child, then the wildcard child, and returns the first index found exactly at the request's last segment; return -1 if both branches fail."
