expected_concepts:
  - "depth of a node in a parent-pointer tree"
  - "memoising depths so each employee is resolved once"
  - "iterative traversal instead of recursion on deep chains"
  - "not assuming managers have smaller numbers than their reports"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Computes each employee's level once (memoised walk upwards or a breadth-first pass from the head over child lists), avoids recursion depth limits on long chains, does not assume parents come first, and explains why the total work is O(n)."
  good: "Correct answer with a linear approach after a hint, or a correct recursive solution that the candidate fixes or clearly flags for the deep-chain case."
  weak: "Walks from every employee all the way to the head without memoisation (quadratic on a chain), assumes parent[i] < i, or counts edges instead of levels."
  criteria:
    correctness: "All tests pass, including a single employee and chains numbered in either direction."
    efficiency: "Linear time: each employee's level is computed once and reused."
    code_quality: "Clear separation between finding levels and taking the maximum; meaningful names such as level, manager, path."
    edge_cases: "Single employee, flat organisation, very deep chain and manager numbers larger than report numbers."
    communication: "Explains the difference between counting levels and counting reporting edges, and why recursion is risky here."
hints:
  - "An employee's level is one more than the level of their manager, and the head of the company is level 1."
  - "If you remember the level of every employee once it is known, walking upwards can stop as soon as it reaches someone whose level is already computed."
  - "For each employee, climb through managers until you hit the head or a person with a known level, remember the people you passed, then assign levels to them on the way back down; alternatively build child lists and run a breadth-first pass from the head with a queue. The answer is the largest level."
followups:
  - "How would you return the reporting line that achieves the maximum, not just its length?"
  - "How would you detect an export that contains a management loop or two heads?"
  - "If the chart changes often (one employee moves to a new manager), how would you keep the level count up to date?"
  - "What happens to a recursive solution on a chain of 100,000 people in your language?"
common_errors:
  - "Returning the number of reporting edges (levels minus one) instead of the number of levels."
  - "Assuming employee 0 is the head or that every manager has a smaller number than their reports."
  - "Recursing once per level, which overflows the call stack on long chains."
  - "Re-walking to the head from every employee without memoisation, which is quadratic on a chain."
