role_tags: [general, backend, fullstack, business_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Org Chart Level Count

  The HR system exports the company hierarchy for `n` employees, numbered `0` to `n - 1`, as a single
  array `parent`: `parent[i]` is the number of employee `i`'s direct manager, and the head of the
  company is the only employee with `parent[i] == -1`. Employee numbers come from the payroll system,
  so a manager may well have a **larger** number than the people reporting to them.

  An organisation-design review wants to know how many management levels the company has. The head of
  the company forms level 1 on their own, their direct reports are level 2, the reports of those people
  are level 3, and so on.

  Return the number of levels, that is, the number of people on the longest reporting line from the
  head of the company down to someone at the bottom (counting both ends).

  Real exports can contain very long reporting lines (think of a chain of 100,000 people), so make sure
  your approach does not run out of call stack on a deep hierarchy.

  ### Example 1
  ```
  Input:  parent = [1, -1, 1, 0, 3]
  Output: 4
  Explanation: Employee 1 is the head. The longest reporting line is 1 -> 0 -> 3 -> 4.
  ```

  ### Example 2
  ```
  Input:  parent = [4, 4, 4, 4, -1]
  Output: 2
  ```

  ### Example 3
  ```
  Input:  parent = [-1]
  Output: 1
  ```

  ### Constraints
  - `1 <= parent.length <= 10^5`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]` and `parent[i] != i`
  - Following managers from any employee always reaches the head of the company (the chart is a single tree)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: org_chart_level_count
  params:
    - {name: parent, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def org_chart_level_count(parent: list[int]) -> int:
        n = len(parent)
        level = [0] * n
        best = 0
        for start in range(n):
            path = []
            node = start
            while node != -1 and level[node] == 0:
                path.append(node)
                node = parent[node]
            known = 0 if node == -1 else level[node]
            for person in reversed(path):
                known += 1
                level[person] = known
            best = max(best, level[start])
        return best
  javascript: |
    function orgChartLevelCount(parent) {
      const n = parent.length;
      const level = new Array(n).fill(0);
      let best = 0;
      for (let start = 0; start < n; start++) {
        const path = [];
        let node = start;
        while (node !== -1 && level[node] === 0) {
          path.push(node);
          node = parent[node];
        }
        let known = node === -1 ? 0 : level[node];
        for (let k = path.length - 1; k >= 0; k--) {
          known += 1;
          level[path[k]] = known;
        }
        best = Math.max(best, level[start]);
      }
      return best;
    }
