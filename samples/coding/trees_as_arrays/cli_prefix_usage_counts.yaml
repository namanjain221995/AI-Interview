version: 1
slug: cli_prefix_usage_counts
title: CLI Prefix Usage Counts
difficulty: easy
competency_keys: [data_structures, algorithms]
role_tags: [general, backend, devops, frontend]
time_limit_minutes: 15
prompt_markdown: |
  ## CLI Prefix Usage Counts

  Your developer-tools team collects anonymous telemetry from its command-line tool. Every command a
  developer typed is recorded as a string in `commands`; the same command typed twice is recorded
  twice and counts twice.

  To decide which auto-complete suggestions to ship, product wants usage numbers for a list of
  candidate prefixes. For each string in `prefixes`, count how many recorded commands **start with**
  that prefix. A command that is exactly equal to the prefix also counts.

  Return an array of counts in the **same order** as `prefixes`.

  ### Example 1
  ```
  Input:  commands = ["git push", "git pull", "git push", "grep error", "kubectl get pods"], prefixes = ["git p", "g", "kubectl", "docker"]
  Output: [3, 4, 1, 0]
  ```

  ### Example 2
  ```
  Input:  commands = ["ls", "ls -la", "lsblk"], prefixes = ["ls", "ls ", "lsb"]
  Output: [3, 1, 1]
  Explanation: the prefix "ls " includes the trailing space, so only "ls -la" matches it.
  ```

  ### Constraints
  - `1 <= commands.length <= 1000`
  - `1 <= prefixes.length <= 1000`
  - `1 <= commands[i].length, prefixes[j].length <= 30`
  - strings contain only lowercase letters, digits, spaces and hyphens
  - prefixes may repeat
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cli_prefix_usage_counts
  params:
    - {name: commands, type: "string[]"}
    - {name: prefixes, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def cli_prefix_usage_counts(commands: list[str], prefixes: list[str]) -> list[int]:
        # Trie where every node stores how many commands pass through it.
        root: dict = {"#": 0}
        for command in commands:
            node = root
            for ch in command:
                node = node.setdefault(ch, {"#": 0})
                node["#"] += 1
        result = []
        for prefix in prefixes:
            node = root
            for ch in prefix:
                node = node.get(ch)
                if node is None:
                    break
            result.append(node["#"] if node is not None else 0)
        return result
  javascript: |
    function cliPrefixUsageCounts(commands, prefixes) {
      const root = { count: 0, next: new Map() };
      for (const command of commands) {
        let node = root;
        for (const ch of command) {
          if (!node.next.has(ch)) node.next.set(ch, { count: 0, next: new Map() });
          node = node.next.get(ch);
          node.count++;
        }
      }
      return prefixes.map((prefix) => {
        let node = root;
        for (const ch of prefix) {
          node = node.next.get(ch);
          if (node === undefined) return 0;
        }
        return node.count;
      });
    }
