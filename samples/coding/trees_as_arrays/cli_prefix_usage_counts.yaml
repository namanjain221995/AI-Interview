  - {id: t6, hidden: true, args: [["terraform plan", "terraform apply", "tf plan", "terraform-docs", "terraform"], ["terraform", "terraform ", "terraform-", "t", "tf"]], expected: [4, 2, 1, 5, 1], description: "Hyphen versus space after a shared stem"}
