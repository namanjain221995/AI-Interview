expected_concepts:
  - prefix tree (trie) with a pass-through counter at every node
  - alternative of sorting commands and binary-searching the prefix range
  - preprocessing once to answer many queries
  - exact-match and longer-than-command edge cases
optimal_complexity: {time: "O(total characters of commands + total characters of prefixes)", space: O(total characters of commands)}
rubric:
  excellent: Builds a trie that stores how many commands pass through each node (or sorts and binary-searches the prefix range), answers each prefix in time proportional to its length, handles duplicates and exact matches, and compares the approach with the brute-force scan.
  good: Correct answers with a trie or sorted search after a hint, or a clean brute-force solution that explains the cost and how to improve it.
  weak: Counts distinct commands instead of all recorded ones, mishandles exact matches or trailing spaces, or cannot explain the cost of scanning every command for every prefix.
  criteria:
    correctness: All tests pass, including duplicates, repeated prefixes and prefixes longer than any command.
    efficiency: Preprocessing so that each query costs roughly the prefix length rather than the number of commands.
    code_quality: Trie node structure and the counting rule are clear; build and query are separate steps.
    edge_cases: Exact matches, absent prefixes, hyphens versus spaces and repeated queries.
    communication: Explains the trade-off between preprocessing memory and per-query speed.
hints:
  - Many prefixes are asked against the same set of commands. What could you build once so that every question becomes cheap?
  - A prefix tree lets you follow a prefix character by character; if every node also remembers how many commands went through it, the answer is waiting at the node where the prefix ends.
  - Insert every command into a trie, incrementing a counter on each node you visit (duplicates increment it again); for each prefix walk down from the root and return the counter of the final node, or zero as soon as a character has no matching child.
followups:
  - How would you return the three most-used complete commands for each prefix instead of a count?
  - How would you solve it with sorting and binary search, and when would that be preferable to a trie?
  - How would the design change if telemetry arrived as a stream and counts had to stay current?
common_errors:
  - De-duplicating commands before counting, which undercounts repeated usage.
  - Excluding a command that is exactly equal to the prefix.
  - Trimming spaces from prefixes or commands, which changes the meaning of the query.
  - Counting the node where a prefix ends by its number of children instead of commands passing through it.
