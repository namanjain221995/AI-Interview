expected_concepts:
  - "following parent pointers to the root"
  - "excluding the starting node and including the root"
  - "handling the root as a start (empty result)"
optimal_complexity: {time: "O(d) where d is the length of the chain", space: "O(d) for the output"}
rubric:
  excellent: "Follows parent pointers iteratively from the engineer's contact until -1, returns the people in order, handles the owner as a start with an empty result and states O(depth) time."
  good: "Correct after fixing an off-by-one (including the engineer or dropping the owner)."
  weak: "Includes the engineer, omits the final owner, returns the path reversed, or builds unnecessary full-tree structures without being able to explain them."
  criteria:
    correctness: "All tests pass, including the owner as the start and long chains."
    efficiency: "Only the chain is walked; no full-tree traversal is needed."
    code_quality: "A simple loop with a clear stopping condition and descriptive names."
    edge_cases: "Single person, owner as start and a 999-step chain."
    communication: "States the inclusion rule for both ends before coding."
hints:
  - "Each person knows exactly one next contact, so the path is fully determined by repeatedly looking up the next contact."
  - "Start from the engineer's contact rather than the engineer, and stop when the lookup gives the marker for the final owner."
  - "Keep a current person equal to the engineer's contact; while it is not minus one, append it to the result and move to its own contact. If the engineer is the owner the loop never runs and the result stays empty."
followups:
  - "How would you answer many queries for the k-th person up the chain quickly?"
  - "How would you detect a misconfigured policy that contains a loop?"
  - "If some people are on leave, how would you skip them while keeping the order?"
common_errors:
  - "Including the engineer as the first element of the chain."
  - "Stopping before appending the final escalation owner."
  - "Returning the chain from the owner downwards instead of in escalation order."
  - "Using recursion, which can overflow on very long chains."
