title: Escalation Chain to the Top
difficulty: easy
competency_keys: [algorithms, data_structures]
role_tags: [general, support_engineer, sre, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Escalation Chain to the Top

  The on-call tool stores its escalation policy as a tree over people `0` to `n - 1`: `parent[i]` is the
  person that `i` escalates an incident to when they cannot resolve it, and the final escalation owner
  (who escalates to nobody) has `parent[i] == -1`. Numbers are arbitrary, so the next person in a chain
  can have a larger or smaller number.

  When an incident is assigned to `engineer`, the tool pre-computes the whole escalation path so it can
  page people quickly. Return the people the incident would pass through **in escalation order**:
  first `engineer`'s direct escalation contact, then that person's contact, and so on, ending with the
  final escalation owner. Do **not** include `engineer` themself.

  If `engineer` is the final escalation owner, return an empty array.

  ### Example 1
  ```
  Input:  parent = [-1, 0, 0, 1, 3], engineer = 4
  Output: [3, 1, 0]
  Explanation: 4 escalates to 3, 3 to 1, and 1 to the final owner 0.
  ```

  ### Example 2
  ```
  Input:  parent = [2, 2, -1, 0], engineer = 2
  Output: []
  ```

  ### Example 3
  ```
  Input:  parent = [3, 3, 3, -1], engineer = 1
  Output: [3]
  ```

  ### Constraints
  - `1 <= parent.length <= 10^5`
  - `0 <= engineer < parent.length`
  - Exactly one `i` has `parent[i] == -1`; every other `parent[i]` is in `[0, n - 1]` and `parent[i] != i`
  - Following escalation contacts from anyone always reaches the final owner (no loops)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: escalation_chain_to_root
  params:
    - {name: parent, type: "int[]"}
    - {name: engineer, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def escalation_chain_to_root(parent: list[int], engineer: int) -> list[int]:
        chain: list[int] = []
        person = parent[engineer]
        while person != -1:
            chain.append(person)
            person = parent[person]
        return chain
  javascript: |
    function escalationChainToRoot(parent, engineer) {
      const chain = [];
      let person = parent[engineer];
      while (person !== -1) {
        chain.push(person);
        person = parent[person];
      }
      return chain;
    }
