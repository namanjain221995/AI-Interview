expected_concepts:
  - "WITH RECURSIVE with an anchor member (top-level people) and a recursive member joining reports"
  - "carrying a depth counter through the recursion"
  - "UNION ALL versus UNION in recursive CTEs"
  - "termination of the recursion on acyclic data"
  - "deterministic ORDER BY on level then id"
optimal_complexity: {time: "O(n) recursion steps with an index on manager_id", space: "O(n)"}
rubric:
  excellent: "Writes a recursive CTE anchored on rows with a NULL manager_id, increments the level in the recursive member, orders by level then id, and explains termination, why fixed self-joins do not work for unknown depth, and how an index on manager_id or a cycle guard would help in production."
  good: "Correct recursive query after a hint about the anchor member, the level counter or the final ordering."
  weak: "Uses a fixed number of self-joins, anchors on a single hard-coded person, drops one of several reporting lines or returns rows in an undefined order."
  criteria:
    correctness: "All tests pass, including several top-level people, deep chains and managers with larger ids than their reports."
    efficiency: "Each person is produced once by the recursion; mentions indexing manager_id."
    code_quality: "Named CTE with explicit column list, clear aliases and a readable recursive join."
    edge_cases: "Empty table, a single person, nobody with a manager and duplicate names."
    communication: "Explains the anchor and recursive members and how the recursion stops."
hints:
  - "The depth of the hierarchy is not known in advance, so a fixed number of self-joins cannot work; think of a query that keeps expanding one management layer at a time."
  - "A recursive common table expression starts from an anchor set of rows and repeatedly joins the previous result to find the next layer; the people without a manager are the natural starting point."
  - "Anchor the recursive CTE on rows whose manager_id is NULL with level 1, and in the recursive member join employees whose manager_id equals an id already in the CTE, emitting the parent level plus one. Combine the two members with UNION ALL, then select id, name and level from the CTE ordered by level and id."
followups:
  - "How would you guard the query against a bad import that accidentally introduces a reporting cycle?"
  - "How would you also return the full management path (for example 'Priya > Marco > Tomas') for each person?"
  - "How would you count the total number of people under each manager, directly and indirectly?"
  - "Which index makes the recursive join efficient on a large directory?"
common_errors:
  - "Joining the table to itself a fixed number of times, which breaks for deeper hierarchies."
  - "Joining in the wrong direction (matching employee.id to chain.manager_id), which walks up instead of down."
  - "Starting from a single hard-coded top-level person and losing the other reporting lines."
  - "Forgetting the ORDER BY, or ordering only by level so ties come back in an arbitrary order."
