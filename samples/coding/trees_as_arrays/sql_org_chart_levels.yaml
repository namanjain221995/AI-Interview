        (55, 'L16', 58), (52, 'L17', 55), (49, 'L18', 52), (46, 'L19', 49), (43, 'L20', 46),
        (40, 'L21', 43), (37, 'L22', 40), (34, 'L23', 37), (31, 'L24', 34), (28, 'L25', 31);
    expected_rows: [[100, "L01", 1], [97, "L02", 2], [94, "L03", 3], [91, "L04", 4], [88, "L05", 5], [85, "L06", 6], [82, "L07", 7], [79, "L08", 8], [76, "L09", 9], [73, "L10", 10], [70, "L11", 11], [67, "L12", 12], [64, "L13", 13], [61, "L14", 14], [58, "L15", 15], [55, "L16", 16], [52, "L17", 17], [49, "L18", 18], [46, "L19", 19], [43, "L20", 20], [40, "L21", 21], [37, "L22", 22], [34, "L23", 23], [31, "L24", 24], [28, "L25", 25]]
  - id: t7
    hidden: true
    description: "Wide team with duplicate names - each person appears exactly once"
    ordered: true
    setup_sql: |
      INSERT INTO employees (id, name, manager_id) VALUES
        (1, 'Sam', NULL), (2, 'Sam', 1), (3, 'Alex', 1), (4, 'Alex', 1), (5, 'Kim', 1), (6, 'Sam', 3);
    expected_rows: [[1, "Sam", 1], [2, "Sam", 2], [3, "Alex", 2], [4, "Alex", 2], [5, "Kim", 2], [6, "Sam", 3]]
  - id: t8
    hidden: true
