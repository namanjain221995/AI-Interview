version: 1
slug: sql_org_chart_levels
title: "Org Chart Levels with a Recursive Query (SQL)"
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data_analyst, backend, dba, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Org Chart Levels

  The people-directory service stores the reporting structure in a single table. Every row points to
  the person's direct manager; people at the top of a reporting line have no manager. The directory UI
  needs to indent each person by how far they sit below the top.

  Table `employees`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | VARCHAR(100) | names are not unique |
  | manager_id | INTEGER | `employees.id` of the direct manager; **NULL for a top-level person** |

  Define the **level** of a person as follows:

  - a person whose `manager_id` is NULL has level `1`;
  - anyone else has level `1 +` the level of their manager.

  There can be **several** top-level people (separate reporting lines). Every non-NULL `manager_id`
  refers to an existing row and the reporting lines contain **no cycles**, so every person reaches a
  top-level person by following managers.

  Return `id`, `name` and `level` for **every** employee, ordered by `level` ascending and then by `id`
  ascending. If the table is empty, return no rows.

  Write standard SQL that runs on both PostgreSQL and SQLite (a recursive common table expression is
  expected; the depth of the hierarchy is not known in advance).

  ### Example 1
  ```
  employees
  +----+-------+------------+
  | id | name  | manager_id |
  +----+-------+------------+
  | 1  | Priya | NULL       |
  | 2  | Marco | 1          |
  | 3  | Lena  | 1          |
  | 4  | Tomas | 2          |
  | 5  | Aiko  | NULL       |
  | 6  | Noor  | 5          |
  | 7  | Ravi  | 4          |
  +----+-------+------------+

  Output
  +----+-------+-------+
  | id | name  | level |
  +----+-------+-------+
  | 1  | Priya | 1     |
  | 5  | Aiko  | 1     |
  | 2  | Marco | 2     |
  | 3  | Lena  | 2     |
  | 6  | Noor  | 2     |
  | 4  | Tomas | 3     |
  | 7  | Ravi  | 4     |
  +----+-------+-------+
  Priya and Aiko lead two separate reporting lines; Ravi reports to Tomas, who reports to Marco.
  ```

  ### Example 2
  ```
  employees
  +----+------+------------+
  | id | name | manager_id |
  +----+------+------------+
  | 1  | Eli  | 3          |
  | 2  | Fay  | 1          |
  | 3  | Dana | NULL       |
  +----+------+------------+

  Output
  +----+------+-------+
  | id | name | level |
  +----+------+-------+
  | 3  | Dana | 1     |
  | 1  | Eli  | 2     |
  | 2  | Fay  | 3     |
  +----+------+-------+
  A manager can have a larger id than the people who report to them.
  ```

  ### Constraints
  - `0 <=` number of employees `<= 10^5`; the hierarchy can be hundreds of levels deep.
  - Every non-NULL `manager_id` exists in the table and there are no cycles.
languages: [sql]
starter_code:
  sql: |
    -- Return id, name and level (top-level people are level 1), ordered by level, then id.
    SELECT id, name, 1 AS level
    FROM employees
    ORDER BY id;
reference_solutions:
  sql: |
    WITH RECURSIVE chain (id, name, level) AS (
      SELECT id, name, 1
      FROM employees
      WHERE manager_id IS NULL
      UNION ALL
      SELECT e.id, e.name, c.level + 1
      FROM employees e
      JOIN chain c ON e.manager_id = c.id
    )
    SELECT id, name, level
    FROM chain
    ORDER BY level, id;
sql_setup: |
  CREATE TABLE employees (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    manager_id INTEGER REFERENCES employees (id)
  );
tests:
  - id: t1
    description: "Example 1 - two reporting lines of different depth, ties on level ordered by id"
    ordered: true
    setup_sql: |
      INSERT INTO employees (id, name, manager_id) VALUES
        (1, 'Priya', NULL), (2, 'Marco', 1), (3, 'Lena', 1), (4, 'Tomas', 2), (5, 'Aiko', NULL),
        (6, 'Noor', 5), (7, 'Ravi', 4);
    expected_rows: [[1, "Priya", 1], [5, "Aiko", 1], [2, "Marco", 2], [3, "Lena", 2], [6, "Noor", 2], [4, "Tomas", 3], [7, "Ravi", 4]]
  - id: t2
    description: "Example 2 - managers have larger ids than their reports"
    ordered: true
    setup_sql: |
      INSERT INTO employees (id, name, manager_id) VALUES (1, 'Eli', 3), (2, 'Fay', 1), (3, 'Dana', NULL);
    expected_rows: [[3, "Dana", 1], [1, "Eli", 2], [2, "Fay", 3]]
  - id: t3
    hidden: true
    description: "Empty table - no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Single top-level person"
    ordered: true
    setup_sql: |
      INSERT INTO employees (id, name, manager_id) VALUES (42, 'Solo', NULL);
    expected_rows: [[42, "Solo", 1]]
  - id: t5
    hidden: true
    description: "Nobody has a manager - everyone is level 1, ordered by id"
    ordered: true
    setup_sql: |
      INSERT INTO employees (id, name, manager_id) VALUES (9, 'Ana', NULL), (2, 'Bo', NULL), (5, 'Cy', NULL);
    expected_rows: [[2, "Bo", 1], [5, "Cy", 1], [9, "Ana", 1]]
