version: 1
slug: popularity_ranked_autocomplete
title: "Popularity-Ranked Autocomplete"
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [frontend, fullstack, backend, product_manager]
time_limit_minutes: 22
prompt_markdown: |
  ## Popularity-Ranked Autocomplete

  The search box of an online hardware store suggests catalogue terms while a shopper types. Last
  month's analytics give the distinct terms `terms` and how often each was searched, `counts[i]` for
  `terms[i]`.

  The shopper types the string `typed` one character at a time. After **each** character, the box shows
  up to **three** terms that start with everything typed so far (`typed[0..i]`), ranked by:

  1. search count, **highest first**;
  2. on equal counts, the term that comes first in plain lexicographic order (compare character codes one
     by one; a term that is a prefix of another comes first).

  A term equal to the text typed so far also matches. When fewer than three terms match, show all of
  them; when none match, show an empty list.

  Return one list of suggestions per typed character, so the result has exactly `typed.length` lists.

  ### Example 1
  ```
  Input:  terms = ["monitor", "mouse", "mousepad", "modem", "microphone", "keyboard"]
          counts = [120, 300, 80, 15, 120, 500], typed = "mou"
  Output: [["mouse", "microphone", "monitor"], ["mouse", "monitor", "mousepad"], ["mouse", "mousepad"]]
  Explanation: after "m", microphone and monitor tie at 120 and are ordered by name; keyboard never
  matches. After "mou" only two terms match.
  ```

  ### Example 2
  ```
  Input:  terms = ["cable", "charger"], counts = [5, 5], typed = "cx"
  Output: [["cable", "charger"], []]
  ```

  ### Constraints
  - `1 <= terms.length == counts.length <= 10^4`
  - `1 <= terms[i].length <= 50`; terms are distinct and use lowercase letters `a-z` only
  - `1 <= counts[i] <= 10^9`
  - `1 <= typed.length <= 100`; `typed` uses lowercase letters `a-z` only
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: popularity_ranked_autocomplete
  params:
    - {name: terms, type: "string[]"}
    - {name: counts, type: "int[]"}
    - {name: typed, type: "string"}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def popularity_ranked_autocomplete(terms: list[str], counts: list[int], typed: str) -> list[list[str]]:
        order = sorted(range(len(terms)), key=lambda i: (-counts[i], terms[i]))
        children: list[dict[str, int]] = [{}]
        top: list[list[str]] = [[]]
        for i in order:
            node = 0
            for ch in terms[i]:
                nxt = children[node].get(ch)
                if nxt is None:
                    nxt = len(children)
                    children[node][ch] = nxt
                    children.append({})
                    top.append([])
                node = nxt
                if len(top[node]) < 3:
                    top[node].append(terms[i])
        result: list[list[str]] = []
        node = 0
        for ch in typed:
            if node != -1:
                node = children[node].get(ch, -1)
            result.append(list(top[node]) if node != -1 else [])
        return result
  javascript: |
    function popularityRankedAutocomplete(terms, counts, typed) {
      const order = terms.map((_, i) => i);
      order.sort((a, b) => {
        if (counts[a] !== counts[b]) return counts[b] - counts[a];
        return terms[a] < terms[b] ? -1 : terms[a] > terms[b] ? 1 : 0;
      });
      const children = [new Map()];
      const top = [[]];
      for (const i of order) {
        let node = 0;
        for (const ch of terms[i]) {
          let next = children[node].get(ch);
          if (next === undefined) {
            next = children.length;
            children[node].set(ch, next);
            children.push(new Map());
            top.push([]);
          }
          node = next;
          if (top[node].length < 3) top[node].push(terms[i]);
        }
      }
      const result = [];
      let node = 0;
      for (const ch of typed) {
        if (node !== -1) {
          const next = children[node].get(ch);
          node = next === undefined ? -1 : next;
        }
        result.push(node === -1 ? [] : [...top[node]]);
      }
      return result;
    }
