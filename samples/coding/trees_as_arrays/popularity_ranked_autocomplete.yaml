expected_concepts:
  - "trie (prefix tree) over the terms"
  - "precomputed top-3 list per trie node"
  - "ranking by count descending then term ascending"
  - "alternative: sort the terms once and narrow a binary-searched range per prefix"
  - "stopping early once the prefix matches nothing"
optimal_complexity: {time: "O(n log n * L + total length + typed.length) for the build and answers", space: "O(total length of the terms)"}
rubric:
  excellent: "Sorts terms once by (count desc, term asc) and inserts them into a trie that keeps the first three terms reaching each node (or narrows a sorted range with binary search per prefix), answers each typed character in O(1) or O(log n), stops after the first miss and explains the tie-breaking."
  good: "Correct trie or sorted-array solution with minor prompting, for example collecting all matches per node and sorting them on the fly, with a correct complexity analysis."
  weak: "Rescans and re-sorts every term for every typed character without discussing the cost, gets the tie-breaking wrong, or returns fewer lists than typed characters."
  criteria:
    correctness: "All tests pass, including ties at the cut-off, a term equal to the typed text and trailing empty lists."
    efficiency: "Terms are ranked once; each typed character is answered without scanning all terms."
    code_quality: "A comparator that does not overflow, clear trie node fields and no duplicated ranking logic."
    edge_cases: "No match from the first character, typed longer than any term, all counts equal, counts near 10^9."
    communication: "Explains how the build-time order guarantees that each node keeps the right three terms."
hints:
  - "Every keystroke asks the same question for a longer prefix: which terms start with it, and which three of those rank best?"
  - "A prefix tree groups terms by prefix. If you insert the terms in ranking order, the first terms that reach a node are already the best ones for that prefix."
  - "Sort the terms by count descending then name ascending, insert them in that order into a trie and keep at most three terms per node. Then walk the typed characters from the root, appending the node's list each time, and append empty lists once a character has no child."
followups:
  - "How would you update the suggestions when a term's count changes while the system is live?"
  - "How would you solve it with a sorted array and binary search instead of a trie, and which uses less memory?"
  - "How would you tolerate one typo in the typed text?"
  - "If the catalogue had 10^8 terms, how would you shard or cache the suggestions?"
common_errors:
  - "Breaking ties by input order instead of by term."
  - "Using counts[b] - counts[a] style comparators in languages where the subtraction can overflow."
  - "Returning one list fewer than the typed length, or stopping the loop at the first miss without adding the remaining empty lists."
  - "Excluding a term that is exactly equal to the typed text."
