version: 1
slug: outline_to_parent_array
title: Runbook Outline to Parent Array
difficulty: easy
competency_keys: [algorithms, data_structures, code_quality]
role_tags: [general, backend, sre, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Runbook Outline to Parent Array

  Your team writes incident runbooks as indented checklists. Before a runbook is imported into the
  automation tool, the outline has to be converted into a tree stored as a parent array.

  Each entry of `lines` is one checklist step:

  - a step at **depth** `d` starts with exactly `2*d` space characters, followed by the step text
    (the text is non-empty, does not start with a space and may contain spaces inside),
  - the first step has depth `0`,
  - every step's depth is **at most one more** than the depth of the step just before it,
  - several steps may have depth `0` (the runbook can have several top-level sections).

  Return an array `parent` with one entry per step: `parent[i]` is the index of the **nearest earlier
  step with depth `d - 1`** (the step that `i` is nested under), or `-1` when step `i` has depth `0`.

  ### Example 1
  ```
  Input:  lines = ["Restart api", "  Drain node", "    Cordon node", "  Roll pods", "Verify dashboards"]
  Output: [-1, 0, 1, 0, -1]
  ```

  ### Example 2
  ```
  Input:  lines = ["Rotate keys", "  Generate key", "  Update vault", "    Re-encrypt secrets", "    Restart consumers", "  Revoke old key"]
  Output: [-1, 0, 0, 2, 2, 0]
  ```

  ### Constraints
  - `0 <= lines.length <= 10^4`
  - each line has at most 200 characters
  - leading spaces come in pairs, and the outline rules above always hold
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: outline_to_parent_array
  params:
    - {name: lines, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def outline_to_parent_array(lines: list[str]) -> list[int]:
        # open_steps[d] is the index of the most recent step at depth d.
        open_steps: list[int] = []
        parent: list[int] = []
        for index, line in enumerate(lines):
            spaces = len(line) - len(line.lstrip(" "))
            depth = spaces // 2
            del open_steps[depth:]
            parent.append(open_steps[depth - 1] if depth > 0 else -1)
            open_steps.append(index)
        return parent
  javascript: |
    function outlineToParentArray(lines) {
      const openSteps = [];
      const parent = [];
      for (let index = 0; index < lines.length; index++) {
        const line = lines[index];
        let spaces = 0;
        while (spaces < line.length && line[spaces] === " ") spaces++;
        const depth = spaces / 2;
        openSteps.length = depth;
        parent.push(depth > 0 ? openSteps[depth - 1] : -1);
        openSteps.push(index);
      }
      return parent;
    }
