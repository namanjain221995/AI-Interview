expected_concepts:
  - stack of the most recent step at each depth
  - counting leading indentation
  - truncating the stack when the outline moves back up
  - linear single pass
optimal_complexity: {time: O(total characters), space: O(max depth)}
rubric:
  excellent: Counts leading spaces only, keeps a stack (or array indexed by depth) of the latest step per depth, truncates it on the way back up, and explains why the latest depth d - 1 step is always the parent; linear time.
  good: Correct answer with a stack or by scanning backwards for the nearest shallower step, possibly quadratic in the worst case or needing a prompt about multi-level jumps.
  weak: Uses the previous line as the parent, counts all spaces in the line instead of the leading ones, or fails when the outline jumps back several levels.
  criteria:
    correctness: All tests pass, including empty input, several top-level steps and multi-level jumps back.
    efficiency: One pass with constant work per step apart from counting indentation.
    code_quality: Indentation parsing and parent tracking are clearly separated with readable names.
    edge_cases: Empty runbook, single step, duplicate texts and internal spaces in step text.
    communication: Explains the stack invariant (one open step per depth, deepest last).
hints:
  - Once you know a step's depth, which earlier steps could possibly be its parent, and which of them is the right one?
  - The parent is always the most recent step one level shallower, so it is enough to remember the latest step seen at every depth.
  - Count only the leading spaces to get the depth, cut the list of remembered steps down to that depth, read the entry just above it (or use -1 at depth zero), then record the current step as the latest one at its depth.
followups:
  - How would you validate the outline and report the first line that breaks the indentation rules?
  - How would you convert the parent array back into an indented outline?
  - What would change if indentation could mix tabs and spaces?
common_errors:
  - Using the previous line as the parent instead of the nearest shallower step.
  - Counting every space in the line rather than only the leading indentation.
  - Forgetting to drop deeper entries when the outline moves back up, so stale steps become parents.
  - Scanning backwards from every line, which is quadratic on long chains.
