expected_concepts:
  - "trie (prefix tree)"
  - "per-node count of names passing through"
  - "first node with count 1 marks the shortest unique prefix"
  - "handling names that are prefixes of other names"
  - "linear time in the total input length"
optimal_complexity: {time: "O(total length of all names)", space: "O(total length of all names)"}
rubric:
  excellent: "Builds a trie that counts how many names pass through each node, then walks each name to the first node with count 1 (falling back to the full name), explains the linear bound in total length and keeps the output in input order."
  good: "Correct trie or sort-and-compare-neighbours solution (longest common prefix with each sorted neighbour plus one) with minor prompting; mentions the complexity."
  weak: "Compares every name against every other name for every prefix length, returns a prefix that is still shared, or crashes on names that are prefixes of others."
  criteria:
    correctness: "All tests pass, including nested prefix chains and one-letter names."
    efficiency: "Linear in the total length with a trie (or O(total length + n log n) with sorting); no all-pairs comparison."
    code_quality: "Compact trie representation, clear separation of the build and query passes."
    edge_cases: "Single name, names that are prefixes of others, shared long stems, preserving input order."
    communication: "Explains why a count of 1 at a node means no other name shares that prefix."
hints:
  - "A prefix is unambiguous exactly when only one name begins with it. How could you count, for every possible prefix, how many names begin with it?"
  - "Insert all names into a prefix tree and store at each node how many names pass through it. The answer for a name is found by walking down its own path."
  - "Walk each name from the root and stop at the first node whose pass-through count is 1; the characters so far are the answer. If you reach the end of the name without seeing count 1, return the full name."
followups:
  - "How would you solve it by sorting the names and comparing each with its neighbours?"
  - "Commands are added at runtime by plugins; how would you update the abbreviations incrementally?"
  - "How would you support aliases where two names should share the same abbreviation?"
  - "What would change if the CLI matched abbreviations case-insensitively?"
common_errors:
  - "Returning a prefix that another name also starts with because only immediate neighbours in input order were compared."
  - "Indexing past the end of a name that is a prefix of another name."
  - "Comparing all pairs of names, which is quadratic for 10^4 names."
  - "Sorting the output instead of keeping the input order."
