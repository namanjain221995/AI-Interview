version: 1
slug: shortest_unique_command_prefixes
title: "Shortest Unique Command Prefixes"
difficulty: medium
competency_keys: [data_structures, algorithms, problem_solving]
role_tags: [backend, frontend, devops, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Shortest Unique Command Prefixes

  An internal deployment CLI lets engineers type any abbreviation of a subcommand as long as it is
  unambiguous: `dep` runs `deploy` if no other subcommand starts with `dep`. The help screen should show
  the shortest abbreviation for every subcommand.

  Given the distinct lowercase subcommand names in `commands`, return a list of the same length where
  entry `i` is the **shortest prefix** of `commands[i]` that is **not** a prefix of any other name in
  `commands`.

  Some names have no such prefix because the whole name is itself the beginning of another name (for
  example `get` when `getall` also exists). For those names return the **full name**; the CLI resolves an
  exact match first.

  ### Example 1
  ```
  Input:  commands = ["deploy", "describe", "delete", "logs", "login"]
  Output: ["dep", "des", "del", "logs", "logi"]
  Explanation: "de" is shared by three commands, so each needs a third letter. "log" is shared by logs
  and login, so logs needs all four letters and login needs "logi".
  ```

  ### Example 2
  ```
  Input:  commands = ["get", "getall", "set"]
  Output: ["get", "geta", "s"]
  Explanation: every prefix of "get" is also a prefix of "getall", so "get" is returned in full.
  ```

  ### Constraints
  - `1 <= commands.length <= 10^4`
  - `1 <= commands[i].length <= 100`, and the total length of all names is at most `2 * 10^5`
  - Names contain lowercase letters `a-z` only and are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_unique_command_prefixes
  params:
    - {name: commands, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def shortest_unique_command_prefixes(commands: list[str]) -> list[str]:
        children: list[dict[str, int]] = [{}]
        passing: list[int] = [0]
        for name in commands:
            node = 0
            for ch in name:
                nxt = children[node].get(ch)
                if nxt is None:
                    nxt = len(children)
                    children[node][ch] = nxt
                    children.append({})
                    passing.append(0)
                node = nxt
                passing[node] += 1
        result: list[str] = []
        for name in commands:
            node = 0
            answer = name
            for i, ch in enumerate(name):
                node = children[node][ch]
                if passing[node] == 1:
                    answer = name[: i + 1]
                    break
            result.append(answer)
        return result
  javascript: |
    function shortestUniqueCommandPrefixes(commands) {
      const children = [new Map()];
      const passing = [0];
      for (const name of commands) {
        let node = 0;
        for (const ch of name) {
          let next = children[node].get(ch);
          if (next === undefined) {
            next = children.length;
            children[node].set(ch, next);
            children.push(new Map());
            passing.push(0);
          }
          node = next;
          passing[node]++;
        }
      }
      return commands.map((name) => {
        let node = 0;
        for (let i = 0; i < name.length; i++) {
          node = children[node].get(name[i]);
          if (passing[node] === 1) return name.slice(0, i + 1);
        }
        return name;
      });
    }
