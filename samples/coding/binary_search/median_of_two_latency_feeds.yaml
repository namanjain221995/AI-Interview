expected_concepts:
  - binary search over a partition of the shorter array
  - left half / right half invariant (max of left <= min of right)
  - sentinels for empty sides of the partition
  - odd versus even total count
  - O(log(min(m, n))) time and O(1) space
optimal_complexity: {time: "O(log(min(m, n)))", space: O(1)}
rubric:
  excellent: Derives the partition binary search on the shorter feed, uses sentinels for empty sides, handles odd and even totals and an empty feed, and explains why the search is logarithmic in the shorter length.
  good: Correct logarithmic solution after hints, or a clean linear two-pointer walk to the middle with a clear explanation of how to reach the logarithmic bound.
  weak: Concatenates and sorts the feeds, mishandles empty feeds or even totals, or uses integer division for the average.
  criteria:
    correctness: All tests pass, including an empty feed, a single sample, duplicates and non-overlapping ranges.
    efficiency: Binary search on the shorter feed without merging; linear merging is acknowledged as the baseline.
    code_quality: Partition indices and the four boundary values are named clearly; sentinels avoid special cases.
    edge_cases: Empty feed, all of one feed smaller than the other, equal values across feeds and totals of 1 and 2.
    communication: States the partition invariant and how each comparison moves the search.
hints:
  - The median splits all samples into a lower half and an upper half of (almost) equal size. If you knew how many samples of the lower half come from the first feed, would you need anything else?
  - Choose that count with binary search on the shorter feed; the count taken from the other feed then follows from the half size, and the split is valid when every value on the left is at most every value on the right.
  - For a candidate split, compare the last left value of each feed with the first right value of the other feed (using minus and plus infinity at the ends). If the first feed's left value is too large, move the split left, otherwise right; once valid, the median is the largest left value or the mean of it and the smallest right value.
followups:
  - How would you find the k-th smallest sample across the two feeds?
  - What changes with ten sorted feeds instead of two?
  - How would you estimate the median if the feeds were streams too large to store?
common_errors:
  - Binary searching the longer feed, which lets the partition index of the other feed go out of range.
  - Integer division when averaging the two middle values.
  - Forgetting sentinels, so an empty feed or a split at the very end crashes.
  - Merging both feeds fully, which is linear and ignores the stated target.
