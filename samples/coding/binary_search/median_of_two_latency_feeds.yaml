title: Median of Two Sorted Latency Feeds
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [sre, backend, data, data_scientist]
time_limit_minutes: 32
prompt_markdown: |
  ## Median of Two Sorted Latency Feeds

  Two regional collectors each send a batch of request latencies in milliseconds. Each batch arrives
  **already sorted in non-decreasing order**: `feed_a` from one region and `feed_b` from the other.
  Either batch may be empty, but together they hold at least one sample.

  The dashboard needs the **median of all samples combined**. With an odd total count the median is
  the middle value of the combined sorted order; with an even count it is the **mean of the two middle
  values** (which may be fractional).

  The feeds can be very large, so aim for a solution that does **not** merge them: the target is
  `O(log(min(m, n)))` time, where `m` and `n` are the feed lengths. Answers within `1e-6` (relative
  to the size of the value) are accepted.

  ### Example 1
  ```
  Input:  feed_a = [12, 15, 40], feed_b = [18, 22]
  Output: 18.0
  Explanation: Combined: 12, 15, 18, 22, 40. The middle value is 18.
  ```

  ### Example 2
  ```
  Input:  feed_a = [5, 9], feed_b = [7, 30]
  Output: 8.0
  Explanation: Combined: 5, 7, 9, 30. The median is (7 + 9) / 2 = 8.
  ```

  ### Example 3
  ```
  Input:  feed_a = [], feed_b = [3, 4]
  Output: 3.5
  ```

  ### Constraints
  - `0 <= feed_a.length, feed_b.length <= 10^6`
  - `1 <= feed_a.length + feed_b.length`
  - `0 <= feed_a[i], feed_b[j] <= 10^9`
  - Both feeds are sorted in non-decreasing order.

  **Follow-up:** How would you generalise the partition idea to find the k-th smallest sample?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: median_of_two_latency_feeds
  params:
    - {name: feed_a, type: "int[]"}
    - {name: feed_b, type: "int[]"}
  return_type: float
  comparison: float_tolerance
reference_solutions:
  python: |
    def median_of_two_latency_feeds(feed_a: list[int], feed_b: list[int]) -> float:
        a, b = feed_a, feed_b
        if len(a) > len(b):
            a, b = b, a
        m, n = len(a), len(b)
        half = (m + n + 1) // 2
        neg_inf, pos_inf = float("-inf"), float("inf")
        lo, hi = 0, m
        while lo <= hi:
            i = (lo + hi) // 2  # samples taken from a into the left half
            j = half - i  # samples taken from b into the left half
            a_left = a[i - 1] if i > 0 else neg_inf
            a_right = a[i] if i < m else pos_inf
            b_left = b[j - 1] if j > 0 else neg_inf
            b_right = b[j] if j < n else pos_inf
            if a_left <= b_right and b_left <= a_right:
                left_max = max(a_left, b_left)
                if (m + n) % 2 == 1:
                    return float(left_max)
                return (left_max + min(a_right, b_right)) / 2.0
            if a_left > b_right:
                hi = i - 1
            else:
                lo = i + 1
        raise ValueError("feeds must be sorted")
  javascript: |
    function medianOfTwoLatencyFeeds(feedA, feedB) {
      let a = feedA;
      let b = feedB;
      if (a.length > b.length) [a, b] = [b, a];
      const m = a.length;
      const n = b.length;
      const half = Math.floor((m + n + 1) / 2);
      let lo = 0;
      let hi = m;
      while (lo <= hi) {
        const i = Math.floor((lo + hi) / 2);
        const j = half - i;
        const aLeft = i > 0 ? a[i - 1] : -Infinity;
        const aRight = i < m ? a[i] : Infinity;
        const bLeft = j > 0 ? b[j - 1] : -Infinity;
        const bRight = j < n ? b[j] : Infinity;
        if (aLeft <= bRight && bLeft <= aRight) {
          const leftMax = Math.max(aLeft, bLeft);
          if ((m + n) % 2 === 1) return leftMax;
          return (leftMax + Math.min(aRight, bRight)) / 2;
        }
        if (aLeft > bRight) hi = i - 1;
        else lo = i + 1;
      }
      throw new Error("feeds must be sorted");
    }
