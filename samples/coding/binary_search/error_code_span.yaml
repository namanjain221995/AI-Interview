version: 1
slug: error_code_span
title: Span of an Error Code in a Sorted Log
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, backend, support_engineer, general]
time_limit_minutes: 15
prompt_markdown: |
  ## Span of an Error Code in a Sorted Log

  A log export has been sorted by numeric status `codes` in **non-decreasing** order so that support
  engineers can jump to the block of entries for one code.

  Given `codes` and a `code`, return `[first, last]`: the first and the last index holding `code`. If
  `code` does not appear (including when `codes` is empty), return `[-1, -1]`. Aim for `O(log n)`, even
  when one code fills most of the export.

  ### Example 1
  ```
  Input:  codes = [200, 404, 404, 404, 500, 503], code = 404
  Output: [1, 3]
  Explanation: Code 404 occupies indices 1 through 3.
  ```

  ### Example 2
  ```
  Input:  codes = [200, 404, 500], code = 302
  Output: [-1, -1]
  Explanation: No entry has code 302.
  ```

  ### Example 3
  ```
  Input:  codes = [], code = 500
  Output: [-1, -1]
  ```

  ### Constraints
  - `0 <= codes.length <= 10^5`
  - `0 <= codes[i], code <= 10^6`
  - `codes[i] <= codes[i + 1]`

  **Follow-up:** How would you return the spans of several codes at once without searching the whole array for each?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: error_code_span
  params:
    - {name: codes, type: "int[]"}
    - {name: code, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def error_code_span(codes: list[int], code: int) -> list[int]:
        def first_index(predicate) -> int:
            # first index where predicate(codes[i]) is true, or len(codes)
            low, high = 0, len(codes)
            while low < high:
                mid = (low + high) // 2
                if predicate(codes[mid]):
                    high = mid
                else:
                    low = mid + 1
            return low

        start = first_index(lambda value: value >= code)
        if start == len(codes) or codes[start] != code:
            return [-1, -1]
        end = first_index(lambda value: value > code) - 1
        return [start, end]
  javascript: |
    function errorCodeSpan(codes, code) {
      const firstIndex = (predicate) => {
        let low = 0;
        let high = codes.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (predicate(codes[mid])) high = mid;
          else low = mid + 1;
        }
        return low;
      };
      const start = firstIndex((v) => v >= code);
      if (start === codes.length || codes[start] !== code) return [-1, -1];
      const end = firstIndex((v) => v > code) - 1;
      return [start, end];
    }
