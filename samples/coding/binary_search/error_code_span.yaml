expected_concepts:
  - "two boundary binary searches (lower and upper bound)"
  - "checking presence after the lower bound"
  - "avoiding linear expansion from a found index"
  - "half-open search ranges"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Runs two boundary searches (first index >= code and first index > code), checks presence after the first, shares one helper for both, and explains why expanding outwards from a hit is O(n) in the worst case."
  good: "Correct two-search solution with a minor fix needed for absent codes or the empty array."
  weak: "Finds one occurrence and walks left and right linearly, or returns wrong indices when the code fills the whole array."
  criteria:
    correctness: "All tests pass, including absent codes, the empty array and a code that fills every slot."
    efficiency: "Two O(log n) searches; no linear walk around a hit."
    code_quality: "One parameterised search helper rather than two near-identical loops."
    edge_cases: "Empty input, single element, code at either end, code outside the stored range."
    communication: "Explains the difference between the two boundaries and why the second one minus one is the last index."
hints:
  - "All entries for one code sit in a single contiguous block, so the answer is just the two ends of that block."
  - "A single binary search that stops on any match is not enough; run one search that keeps going left on a match and one that keeps going right."
  - "Find the first index whose code is at least the target; if it is past the end or holds a different code, return [-1, -1]; otherwise find the first index whose code is greater than the target and subtract one for the last index."
followups:
  - "Why is finding one match and then walking outwards O(n) in the worst case?"
  - "How would you count the entries for a code using the same two searches?"
  - "If the export were sorted by code and then by timestamp, how would you find the first 404 after a given time?"
  - "How would you test the boundary searches thoroughly?"
common_errors:
  - "Expanding left and right from any match, which is linear when one code dominates the log."
  - "Forgetting to check that the lower-bound index really holds the code before returning it."
  - "Reading codes[start] when start equals the array length."
  - "Mixing up >= and > so both searches return the same boundary."
