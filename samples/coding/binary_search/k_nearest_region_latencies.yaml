prompt_markdown: |
  ## Latency Band Covering K Regions

  A global load balancer measures the round-trip latency from its probe to every region it can route to.
  `latencies` holds those measurements in milliseconds, sorted in **non-decreasing** order (two regions can
  have the same latency).

  Each client profile has an ideal latency `x`. To spread a client's traffic, the balancer wants at least
  `k` regions whose latency lies in the band `[x - d, x + d]` (both ends included). For every `x` in
  `targets`, return the **smallest integer `d >= 0`** for which at least `k` regions fall inside the band.
  Answers go in the same order as `targets`.

  There can be up to 10^5 regions and 10^5 targets, so sorting the distances again for every target is too
  slow; aim for a logarithmic number of steps per target.

  ### Example 1
  ```
  Input:  latencies = [12, 20, 31, 33, 47, 80], targets = [30, 50, 0], k = 3
  Output: [10, 19, 31]
  Explanation: for x = 30 the three closest latencies are 31, 33 and 20 (1, 3 and 10 away), so d = 10.
               For x = 50 they are 47, 33 and 31 (3, 17 and 19 away). For x = 0 they are 12, 20 and
               31.
  ```

  ### Example 2
  ```
  Input:  latencies = [5, 5, 5, 9], targets = [5, 7], k = 2
  Output: [0, 2]
  Explanation: three regions sit exactly at 5, so d = 0 for x = 5. For x = 7 every region is 2 away.
  ```

  ### Constraints
  - `1 <= k <= latencies.length <= 10^5`
  - `0 <= latencies[i] <= 10^6`, sorted in non-decreasing order
  - `1 <= targets.length <= 10^5`
  - `0 <= targets[j] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: k_nearest_region_latencies
  params:
    - {name: latencies, type: "int[]"}
    - {name: targets, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def k_nearest_region_latencies(latencies: list[int], targets: list[int], k: int) -> list[int]:
        n = len(latencies)
        result = []
        for x in targets:
            # left edge of the k values closest to x (they always form a contiguous window)
            lo, hi = 0, n - k
            while lo < hi:
                mid = (lo + hi) // 2
                if x - latencies[mid] > latencies[mid + k] - x:
                    lo = mid + 1
                else:
                    hi = mid
            result.append(max(abs(x - latencies[lo]), abs(latencies[lo + k - 1] - x)))
        return result
  javascript: |
    function kNearestRegionLatencies(latencies, targets, k) {
      const n = latencies.length;
      return targets.map((x) => {
        let lo = 0;
        let hi = n - k;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (x - latencies[mid] > latencies[mid + k] - x) lo = mid + 1;
          else hi = mid;
        }
        return Math.max(Math.abs(x - latencies[lo]), Math.abs(latencies[lo + k - 1] - x));
      });
    }
