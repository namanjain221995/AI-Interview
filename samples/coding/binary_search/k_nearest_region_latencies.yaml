expected_concepts:
  - "the k closest values in a sorted array form a contiguous window"
  - "binary search on the window's left edge by comparing both ends"
  - "the band width is the larger distance at the window's two ends"
  - "O(log n) per target instead of re-sorting distances"
optimal_complexity: {time: "O(q log n) for q targets", space: "O(1) extra"}
rubric:
  excellent: "Recognises that the k nearest values form a contiguous window, binary searches its left edge by comparing the distances of the elements just outside, derives d from the two window ends and states O(q log n)."
  good: "Reaches a correct logarithmic solution with prompting, for example binary searching d and counting with two bound searches in O(q log n log V)."
  weak: "Recomputes and sorts all distances per target, or expands two pointers from the insertion point in O(k) per target without discussing a faster option."
  criteria:
    correctness: "All tests pass, including duplicates, k equal to n and targets outside the data range."
    efficiency: "Logarithmic work per target after no preprocessing beyond the given sorted order."
    code_quality: "A clear window search with well-named bounds and no special cases scattered through the loop."
    edge_cases: "Handles a single region, all-equal latencies, values at the limits and targets in large gaps."
    communication: "Explains why the window comparison is monotonic and how ties between the two sides are handled."
hints:
  - "In a sorted list, the k values closest to a target always sit next to each other; the band only needs to reach the outermost of them."
  - "Try to find where that block of k values starts: compare a candidate start with the value just past the block's end to decide whether the block should slide right."
  - "Binary search the start position between zero and n minus k; slide right when the target is farther from the value at the start than from the value just after the block, and the answer is the larger of the distances from the target to the first and last values of the final block."
followups:
  - "How would you answer with a binary search on d instead, and what does it cost per target?"
  - "What if latencies were updated continuously between queries?"
  - "How would you return the indices of the chosen regions rather than the band width?"
common_errors:
  - "Recomputing and sorting every distance for each target."
  - "Comparing absolute distances in the window search, which can slide the window the wrong way when the target lies beyond the candidate window."
  - "Off-by-one in the search range (it must go up to n minus k inclusive)."
  - "Returning the distance of the k-th element after the insertion point instead of the k-th closest overall."
