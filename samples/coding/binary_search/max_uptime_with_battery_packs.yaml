expected_concepts:
  - "monotonic feasibility: if all servers can run T minutes, they can run any shorter time"
  - binary search on the answer between 0 and sum / n
  - "capping each pack at T minutes: sum of min(battery, T) >= n * T"
  - why a pack longer than T is effectively worth only T minutes
  - 64-bit arithmetic for the total charge and n * T
  - greedy alternative that sets aside the largest packs while they exceed the average
optimal_complexity: {time: O(m log(sum / n)), space: O(1)}
rubric:
  excellent: Explains why a pack can contribute at most T minutes, derives the condition sum(min(b, T)) >= n * T (and why it is sufficient by rotating packs), binary searches T with 64-bit arithmetic and states the complexity; may mention the sort-and-peel greedy as an alternative.
  good: Implements the binary search with the correct capped-sum check but needs prompting on sufficiency, overflow or the upper bound.
  weak: Returns sum / n without capping large packs, simulates minute by minute, or overflows 32-bit integers.
  criteria:
    correctness: All tests pass, including a single dominant pack and answers above 2^31.
    efficiency: O(m) per check and O(log(sum / n)) checks; no per-minute simulation.
    code_quality: Feasibility is a small named helper; search bounds and the mid rounding avoid infinite loops.
    edge_cases: n = 1, n equal to the number of packs, equal packs, one huge pack and very large totals.
    communication: Argues both directions of the feasibility condition clearly.
hints:
  - Suppose someone claims the servers can all run for T minutes. What is the most a single pack can possibly contribute towards that, no matter how cleverly it is swapped?
  - A pack can contribute at most min(charge, T) server-minutes, and the servers need n * T in total; this test gets easier as T shrinks, so you can search for the largest T that passes.
  - Binary search T between 0 and the total charge divided by n, and accept T when the sum of min(battery, T) over all packs is at least n * T (rotating packs fills every server-minute). Use 64-bit arithmetic for the sums and products.
followups:
  - Can you prove that the condition is also sufficient, by describing how to schedule the packs?
  - How would you solve it without binary search by sorting the packs?
  - What if swaps take one minute of downtime for the affected server?
  - What if servers draw power at different rates?
common_errors:
  - Returning total charge divided by n without capping packs that are longer than the runtime.
  - Overflowing a 32-bit integer when summing charges or computing n * T.
  - Choosing mid as (low + high) / 2 with low = mid on success, which loops forever.
  - Simulating minute by minute, which is far too slow for charges up to 10^9.
