time_limit_minutes: 30
prompt_markdown: |
  ## Maximum Uptime with Swappable Battery Packs

  During a grid outage, a field team keeps `n` edge servers alive on hot-swappable battery packs. The
  servers form a quorum, so they are only useful while **all `n` run at the same time**. Pack `i`
  holds `batteries[i]` minutes of charge.

  - At the start of every minute, each server is assigned one pack, and a pack can power **at most one
    server** in any given minute.
  - Swaps are instant and only happen at whole-minute boundaries; a pack can be moved to a different
    server at any boundary, and a partly used pack keeps its remaining charge.
  - A pack with no charge left cannot be used.

  Return the maximum number of whole minutes during which all `n` servers run together.

  ### Example 1
  ```
  Input:  n = 2, batteries = [3, 3, 3]
  Output: 4
  Explanation: call the packs P, Q and R. Use P and Q in minute 1, P and R in minute 2, P and Q in
  minute 3, and Q and R in minute 4. A fifth minute would need 10 minutes of charge, but only 9 exist.
  ```

  ### Example 2
  ```
  Input:  n = 2, batteries = [1, 1, 1, 1]
  Output: 2
  ```

  ### Example 3
  ```
  Input:  n = 3, batteries = [10, 2, 2, 2]
  Output: 3
  Explanation: the 10-minute pack can only ever power one server per minute, so in 3 minutes it
  contributes at most 3; the three small packs supply the other 6 server-minutes.
  ```

  ### Constraints
  - `1 <= n <= batteries.length <= 10^5`
  - `1 <= batteries[i] <= 10^9`
  - The answer can exceed `2^31 - 1`; return it as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_uptime_with_battery_packs
  params:
    - {name: n, type: int}
    - {name: batteries, type: "int[]"}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def max_uptime_with_battery_packs(n: int, batteries: list[int]) -> int:
        def feasible(minutes: int) -> bool:
            # A pack never powers two servers in the same minute, so it contributes at most `minutes`.
            return sum(min(b, minutes) for b in batteries) >= n * minutes

        low, high = 0, sum(batteries) // n
        while low < high:
            mid = (low + high + 1) // 2
            if feasible(mid):
                low = mid
            else:
                high = mid - 1
        return low
  javascript: |
    function maxUptimeWithBatteryPacks(n, batteries) {
      let total = 0;
      for (const b of batteries) total += b;

      function feasible(minutes) {
        // A pack never powers two servers in the same minute, so it contributes at most `minutes`.
        let usable = 0;
        for (const b of batteries) usable += Math.min(b, minutes);
        return usable >= n * minutes;
      }

      let low = 0;
      let high = Math.floor(total / n);
      while (low < high) {
        const mid = Math.floor((low + high + 1) / 2);
        if (feasible(mid)) low = mid;
        else high = mid - 1;
      }
      return low;
    }
