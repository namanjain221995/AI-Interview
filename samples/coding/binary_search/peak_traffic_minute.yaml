slug: peak_traffic_minute
title: "Peak Traffic Minute"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [sre, data_analyst, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Peak Traffic Minute

  A load-test harness ramps an API up and then back down. It records the number of requests served in
  each minute of the run in `traffic`, where `traffic[i]` is the count for minute `i`.

  The ramp profile is guaranteed to have a single peak: the counts **strictly increase** minute by minute
  up to one peak minute and then **strictly decrease** until the end of the run. The peak is never the
  first or the last minute.

  Return the **index** of the peak minute. The capacity report is generated for very long runs, so aim for
  an `O(log n)` solution rather than scanning every minute.

  ### Example 1
  ```
  Input:  traffic = [120, 340, 510, 260, 90]
  Output: 2
  Explanation: Traffic climbs to 510 at minute 2 and falls afterwards.
  ```

  ### Example 2
  ```
  Input:  traffic = [5, 9, 4]
  Output: 1
  Explanation: The only minute that is neither first nor last is the peak.
  ```

  ### Example 3
  ```
  Input:  traffic = [10, 20, 30, 40, 35]
  Output: 3
  Explanation: The counts only drop once, after minute 3.
  ```

  ### Constraints
  - `3 <= traffic.length <= 10^5`
  - `0 <= traffic[i] <= 10^9`
  - There is exactly one index `p` with `0 < p < traffic.length - 1` such that `traffic` strictly
    increases on `[0, p]` and strictly decreases on `[p, traffic.length - 1]`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: peak_traffic_minute
  params:
    - {name: traffic, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def peak_traffic_minute(traffic: list[int]) -> int:
        low, high = 0, len(traffic) - 1
        while low < high:
            mid = (low + high) // 2
            if traffic[mid] < traffic[mid + 1]:
                low = mid + 1  # still climbing: the peak is to the right
            else:
                high = mid  # descending (or at the peak): the peak is mid or to the left
        return low
  javascript: |
    function peakTrafficMinute(traffic) {
      let low = 0;
      let high = traffic.length - 1;
      while (low < high) {
        const mid = (low + high) >> 1;
        if (traffic[mid] < traffic[mid + 1]) low = mid + 1;
        else high = mid;
      }
      return low;
    }
