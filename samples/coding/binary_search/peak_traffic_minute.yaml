expected_concepts:
  - "binary search on a monotonic condition rather than on a target value"
  - "comparing an element with its right neighbour to decide the slope"
  - "loop invariant that the peak stays inside [low, high]"
  - "O(log n) versus a linear scan"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Explains that comparing traffic[mid] with traffic[mid + 1] tells which side of the peak mid is on, keeps the invariant that the peak lies in [low, high], never reads out of bounds and states O(log n) time with O(1) space."
  good: "Correct binary search after a nudge about what to compare, or a correct linear scan quickly improved to logarithmic time."
  weak: "Only scans linearly, compares against a fixed target value, or has an off-by-one that loops forever or reads past the end of the array."
  criteria:
    correctness: "All tests pass, including peaks at index 1 and index n-2."
    efficiency: "Logarithmic number of comparisons with constant extra memory."
    code_quality: "Clear low/high names, one comparison per step and no special-casing of the ends."
    edge_cases: "Minimum length 3, peak next to either end, and values up to 10^9."
    communication: "States the loop invariant and why the loop terminates."
hints:
  - "Pick any minute in the middle. Is there something about its neighbours that tells you whether the peak is to its left or to its right?"
  - "If the count at a minute is smaller than the count one minute later, the run is still ramping up there. What does that say about where the peak can be?"
  - "Keep a low and a high index that always contain the peak. Look at the middle index and its right neighbour: if the right neighbour is larger, move low past the middle, otherwise move high to the middle. Stop when low and high meet and return that index."
followups:
  - "What would break if the ramp could stay flat for several minutes (equal neighbouring counts)?"
  - "How would you find any local peak if the series could have many of them?"
  - "How would you find the peak if traffic were a function you could only query, with an unknown length?"
  - "Why is it safe to compare with the right neighbour without checking the index bounds?"
common_errors:
  - "Using a while condition of low <= high together with high = mid, which never terminates."
  - "Comparing with the left neighbour at mid = 0 and reading index -1."
  - "Searching for the maximum value with a linear scan and calling it binary search."
  - "Returning the peak count instead of the peak index."
