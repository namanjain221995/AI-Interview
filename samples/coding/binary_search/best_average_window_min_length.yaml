expected_concepts:
  - binary search on a real-valued answer
  - reduction - average >= x iff the sum of (value - x) is >= 0
  - prefix sums with a running minimum of earlier prefixes
  - enforcing the minimum window length in the running minimum
  - O(n log(range / precision)) time
optimal_complexity: {time: "O(n log(R / eps))", space: O(n)}
rubric:
  excellent: Reduces "some window averages at least x" to a non-negative shifted sum, checks it in linear time with prefix sums and a running minimum that lags min_len behind, binary searches x between the minimum and maximum value to the required precision, and explains why the search is valid.
  good: Correct binary search with a linear check after a hint about subtracting the candidate average, or a correct O(n^2) prefix-sum solution with a clear plan for the faster approach.
  weak: Only considers windows of exactly min_len, uses a sliding window that assumes longer windows are always worse, or stops the binary search with too little precision.
  criteria:
    correctness: All tests pass within tolerance, including all-negative metrics, min_len = n and min_len = 1.
    efficiency: O(n log(range / precision)); the quadratic baseline is named and improved.
    code_quality: The feasibility check is a separate function with clear prefix-sum indexing.
    edge_cases: Single element, all values equal, negative values and a best window longer than min_len.
    communication: Explains the monotonicity of the check and the chosen stopping precision.
hints:
  - Instead of computing the best average directly, ask a yes/no question - is there a window of length at least min_len whose average is at least some value x?
  - A window averages at least x exactly when the sum of (value minus x) over it is non-negative. With prefix sums of the shifted values, you need a later prefix minus an earlier one, at least min_len positions apart, to be non-negative.
  - Binary search x between the smallest and largest metric. For each x, scan the shifted prefix sums once while keeping the minimum prefix seen up to min_len positions behind the current end; if the current prefix minus that minimum is non-negative, x is achievable. Stop when the range is far below 1e-5.
followups:
  - How would you also return the start and end of the best window?
  - Is there an exact algorithm that avoids floating-point binary search?
  - What changes if the window must also be at most max_len minutes long?
common_errors:
  - Only checking windows of exactly min_len minutes.
  - Letting the running minimum include prefixes that are fewer than min_len positions before the end.
  - Stopping the binary search after too few iterations for the required precision.
  - Integer division when computing an average.
