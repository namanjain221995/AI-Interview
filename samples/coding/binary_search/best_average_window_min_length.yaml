slug: best_average_window_min_length
title: Best Average Metric Window of Minimum Length
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [data_scientist, data, sre, ml]
time_limit_minutes: 35
prompt_markdown: |
  ## Best Average Metric Window of Minimum Length

  A capacity report scores each minute of a service's day with an integer in `metrics` (a net
  throughput delta, so values can be negative). Short spikes are noise, so the report only considers
  **contiguous windows of at least `min_len` minutes**.

  Return the **maximum average** of `metrics[i..j]` over all windows with `j - i + 1 >= min_len`.
  The best window may be longer than `min_len`.

  Answers within `1e-5` (relative to the size of the value) are accepted.

  ### Example 1
  ```
  Input:  metrics = [2, 10, 1, 1, 8, 8], min_len = 4
  Output: 5.6
  Explanation: The window [10, 1, 1, 8, 8] has length 5 and average 28 / 5 = 5.6. Every window of
  length exactly 4 averages at most 5.
  ```

  ### Example 2
  ```
  Input:  metrics = [-5, -1, -8], min_len = 2
  Output: -3.0
  Explanation: The windows are [-5, -1] (average -3), [-1, -8] (average -4.5) and the whole list (average -14 / 3).
  ```

  ### Example 3
  ```
  Input:  metrics = [4, -2, 7, 1, -6, 9, 3], min_len = 3
  Output: 3.0
  ```

  ### Constraints
  - `1 <= min_len <= metrics.length <= 10^4`
  - `-10^4 <= metrics[i] <= 10^4`

  **Follow-up:** Checking every window is quadratic. Can you decide quickly whether *some* window
  averages at least a given value `x`, and use that to home in on the answer?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_average_window_min_length
  params:
    - {name: metrics, type: "int[]"}
    - {name: min_len, type: int}
  return_type: float
  comparison: float_tolerance
  tolerance: 0.00001
reference_solutions:
  python: |
    def best_average_window_min_length(metrics: list[int], min_len: int) -> float:
        n = len(metrics)
        prefix = [0] * (n + 1)
        for i, value in enumerate(metrics):
            prefix[i + 1] = prefix[i] + value
        best = prefix[n] / n  # the whole list is always a valid window

        def some_window_reaches(target: float) -> bool:
            # Is there a window of length >= min_len whose sum of (value - target) is >= 0?
            nonlocal best
            min_shifted, min_start = float("inf"), 0
            for end in range(min_len, n + 1):
                start = end - min_len
                shifted = prefix[start] - target * start
                if shifted < min_shifted:
                    min_shifted, min_start = shifted, start
                if prefix[end] - target * end - min_shifted >= 0:
                    # Keep the exact average of the window that proved the target.
                    best = max(best, (prefix[end] - prefix[min_start]) / (end - min_start))
                    return True
            return False

        lo, hi = float(min(metrics)), float(max(metrics))
        for _ in range(100):
            mid = (lo + hi) / 2
            if some_window_reaches(mid):
                lo = mid
            else:
                hi = mid
        return best
  javascript: |
    function bestAverageWindowMinLength(metrics, minLen) {
      const n = metrics.length;
      const prefix = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) prefix[i + 1] = prefix[i] + metrics[i];
      let best = prefix[n] / n;

      const someWindowReaches = (target) => {
        let minShifted = Infinity;
        let minStart = 0;
        for (let end = minLen; end <= n; end++) {
          const start = end - minLen;
          const shifted = prefix[start] - target * start;
          if (shifted < minShifted) {
            minShifted = shifted;
            minStart = start;
          }
          if (prefix[end] - target * end - minShifted >= 0) {
            best = Math.max(best, (prefix[end] - prefix[minStart]) / (end - minStart));
            return true;
          }
        }
        return false;
      };

      let lo = Math.min(...metrics);
      let hi = Math.max(...metrics);
      for (let iter = 0; iter < 100; iter++) {
        const mid = (lo + hi) / 2;
        if (someWindowReaches(mid)) lo = mid;
        else hi = mid;
      }
      return best;
    }
