expected_concepts:
  - "sorted rows allow a binary search for the first negative cell"
  - "sorted columns allow a staircase walk from a corner"
  - "O(m log n) versus O(m + n) versus brute-force O(m * n)"
  - "zero is not negative (strict comparison)"
optimal_complexity: {time: "O(m + n)", space: "O(1)"}
rubric:
  excellent: "Uses the ordering of both rows and columns, explains the staircase walk from a corner in O(m + n) (or a per-row binary search in O(m log n) and then improves it) and handles zeros and fully negative rows correctly."
  good: "Correct per-row binary search or a correct staircase walk with minor prompting, and states the complexity."
  weak: "Only scans every cell without using the ordering, or counts zeros as negative, or has off-by-one errors at the row boundary."
  criteria:
    correctness: "All tests pass, including single cells, all-negative grids and zeros next to negatives."
    efficiency: "Exploits the sorted order: O(m log n) is acceptable, O(m + n) is best; O(m * n) is noted as the baseline."
    code_quality: "Clear loop invariant, readable index names, no needless copying of rows."
    edge_cases: "Single row, single column, all-negative and no-negative grids, and zero values."
    communication: "Explains why one negative cell implies every cell below it in that column is negative."
hints:
  - "Scanning every cell works, but the grid is sorted in two directions. What does one negative cell tell you about its neighbours?"
  - "Within a single row the negatives form a suffix, so you could binary search for where they begin. Columns are sorted too, which allows something even faster."
  - "Start at the top-right corner. If the cell is negative, every cell below it in that column is negative, so add the number of remaining rows and step one column left; otherwise step one row down. Stop when you leave the grid."
followups:
  - "Why does the staircase walk visit at most m + n cells?"
  - "Would the walk still work if you started from the bottom-left corner instead?"
  - "If only the rows were sorted, which approach would you use and what would it cost?"
  - "How would you count cells below a threshold other than zero?"
common_errors:
  - "Counting zero cells as negative by using a non-strict comparison."
  - "Ignoring the sorted order and scanning every cell without discussing a faster approach."
  - "Off-by-one errors in the binary search when an entire row is negative or no cell is negative."
  - "Starting the staircase walk from the top-left corner, where both directions decrease and no decision can be made."
