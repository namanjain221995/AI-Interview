role_tags: [data, qa, general, data_scientist]
time_limit_minutes: 15
prompt_markdown: |
  ## Count Negative Calibration Drift

  A calibration rig measures how far a batch of sensors drifts from a reference instrument. Each row of
  the result `grid` is a temperature setpoint and each column a humidity setpoint, both increasing. Drift
  gets worse as either setpoint rises, so the exported grid has two guarantees:

  - every **row** is sorted in **non-increasing** order from left to right, and
  - every **column** is sorted in **non-increasing** order from top to bottom.

  A **negative** cell means the sensors under-read at that combination and the setting must be flagged
  for recalibration. Return the **number of negative cells** in `grid`. A cell equal to `0` is not
  negative.

  ### Example 1
  ```
  Input:  grid = [[5, 2, 0, -3], [3, 1, -1, -4], [0, -2, -2, -6]]
  Output: 6
  Explanation: Row 0 has one negative cell, row 1 has two and row 2 has three; the zeros do not count.
  ```

  ### Example 2
  ```
  Input:  grid = [[9, 4], [6, 1]]
  Output: 0
  Explanation: Every reading is positive, so nothing needs recalibration.
  ```

  ### Example 3
  ```
  Input:  grid = [[-2, -5, -7]]
  Output: 3
  ```

  ### Constraints
  - `1 <= m, n <= 100`, where `m = grid.length` and every row has the same length `n`
  - `-1000 <= grid[i][j] <= 1000`
  - Every row and every column of `grid` is sorted in non-increasing order.

  **Follow-up:** A binary search in every row gives `O(m log n)`. Can you count the negatives in `O(m + n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_negative_drift_cells
  params:
    - {name: grid, type: "int[][]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_negative_drift_cells(grid: list[list[int]]) -> int:
        # Staircase walk from the top-right corner: when a cell is negative, every
        # cell below it in the same column is negative too.
        rows = len(grid)
        if rows == 0:
            return 0
        row, col = 0, len(grid[0]) - 1
        count = 0
        while row < rows and col >= 0:
            if grid[row][col] < 0:
                count += rows - row
                col -= 1
            else:
                row += 1
        return count
  javascript: |
    function countNegativeDriftCells(grid) {
      // Binary search in each row for the first negative cell.
      let count = 0;
      for (const row of grid) {
        let lo = 0;
        let hi = row.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (row[mid] < 0) hi = mid;
          else lo = mid + 1;
        }
        count += row.length - lo;
      }
      return count;
    }
