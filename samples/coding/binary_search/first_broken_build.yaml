slug: first_broken_build
title: First Broken Build in a Bisect Run
difficulty: easy
competency_keys: [algorithms, debugging, problem_solving]
role_tags: [general, devops, qa, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## First Broken Build in a Bisect Run

  A test suite started failing somewhere in a range of builds, and a bisect tool has recorded one flag
  per build in build order: `is_broken[i]` is `true` when build `i` fails the suite. Once a build is
  broken, every later build is broken too, so the array is zero or more `false` values followed by zero
  or more `true` values.

  Return the index of the **first broken build**, or `-1` if every build is healthy (this includes an
  empty array). Reading a flag is expensive in the real tool (each read is a full test run), so aim for
  `O(log n)` flag reads.

  ### Example 1
  ```
  Input:  is_broken = [false, false, true, true, true]
  Output: 2
  Explanation: Builds 0 and 1 pass; build 2 is the first failure.
  ```

  ### Example 2
  ```
  Input:  is_broken = [false, false, false]
  Output: -1
  Explanation: No build is broken, so the answer is -1.
  ```

  ### Example 3
  ```
  Input:  is_broken = [true, true]
  Output: 0
  ```

  ### Constraints
  - `0 <= is_broken.length <= 10^5`
  - `is_broken` is some number of `false` values followed by some number of `true` values.

  **Follow-up:** If the suite is flaky and a healthy build occasionally reports broken, how would you make the bisect more trustworthy?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_broken_build
  params:
    - {name: is_broken, type: "bool[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def first_broken_build(is_broken: list[bool]) -> int:
        low, high = 0, len(is_broken)  # answer lies in [low, high]
        while low < high:
            mid = (low + high) // 2
            if is_broken[mid]:
                high = mid
            else:
                low = mid + 1
        return low if low < len(is_broken) else -1
  javascript: |
    function firstBrokenBuild(isBroken) {
      let low = 0;
      let high = isBroken.length;
      while (low < high) {
        const mid = (low + high) >> 1;
        if (isBroken[mid]) high = mid;
        else low = mid + 1;
      }
      return low < isBroken.length ? low : -1;
    }
