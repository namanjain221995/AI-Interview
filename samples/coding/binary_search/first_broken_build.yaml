expected_concepts:
  - "binary search on a monotone predicate"
  - "lower-bound style search for the first true value"
  - "half-open search range"
  - "minimising expensive probes"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Recognises the false-then-true shape as a monotone predicate, writes a lower-bound search that converges on the first true index, handles the empty and all-healthy cases with one final check and states O(log n) reads."
  good: "Correct binary search with a separate special case or two (empty array, all false) and the right complexity."
  weak: "Scans linearly, returns the last healthy index instead of the first broken one, or fails on the empty or all-healthy arrays."
  criteria:
    correctness: "All tests pass, including an empty array, all-healthy and all-broken inputs."
    efficiency: "O(log n) flag reads, constant extra memory."
    code_quality: "A single loop whose invariant (the answer lies in [low, high]) is easy to see."
    edge_cases: "Empty array, length one, the break at index 0 and at the last index."
    communication: "Connects the search to git bisect and explains why each probe halves the suspects."
hints:
  - "The flags only ever switch from healthy to broken once, so looking at a single build tells you on which side of the switch it lies."
  - "Search for the boundary: if the middle build is broken, the first broken build is there or earlier; if it is healthy, it must be later."
  - "Keep low at 0 and high at the array length; while low < high, take the middle, set high to the middle when it is broken or low to middle plus one when it is healthy; at the end low is the answer unless it equals the length, in which case return -1."
followups:
  - "How many test runs does your approach need for 10^5 builds, compared with a linear scan?"
  - "How does this relate to what git bisect does on a commit history?"
  - "How would you change the search if you could run several builds' tests in parallel per round?"
  - "What if the flags were not monotone, for example a fix landed and a later build broke again?"
common_errors:
  - "Returning low without checking whether it equals the array length, which reports a broken build that does not exist."
  - "Setting high = mid - 1 when the middle is broken, which can skip the first broken build."
  - "Using an inclusive range with high = mid, which can loop forever."
  - "Scanning from the start, which costs one test run per build."
