expected_concepts:
  - longest increasing subsequence with a minimum step
  - "tails array: smallest ending value for each chain length"
  - "binary search (upper bound) for the last chain that can be extended by d"
  - "replace a tail only when the new value is smaller"
  - O(n^2) dynamic programming as the baseline
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: "Starts from the O(n^2) DP, generalises the patience-style tails array to the minimum step (upper bound on d - min_increase, replace only when smaller), argues why tails stays sorted, and covers min_increase = 0 and the empty input."
  good: "Correct O(n^2) DP with a clear recurrence, or the O(n log n) version with a small bug in the replacement rule or the bound that is fixed after testing."
  weak: "Looks only at consecutive builds, applies the standard strictly increasing LIS without the minimum step, or tries all subsets."
  criteria:
    correctness: "All tests pass, including min_increase = 0, equality at exactly min_increase and the empty input."
    efficiency: "O(n log n) with a sorted tails array; the O(n^2) DP is acknowledged as the baseline."
    code_quality: "The meaning of tails is stated and the search uses an explicit upper bound."
    edge_cases: "No builds, one build, strictly decreasing durations, all equal durations and min_increase larger than every gap."
    communication: "Explains why replacing a tail with a larger value would be wrong and why only one tail changes per build."
hints:
  - "Start with a dynamic programme: for each build, what is the longest chain that ends exactly at that build, given the chains ending at earlier builds?"
  - "To go faster, keep for every chain length the smallest duration that such a chain can end with. Smaller endings are always at least as useful later, and these values are sorted."
  - "For each duration d, binary search the tails list for the number of entries that are <= d - min_increase (an upper bound); those chain lengths can be extended. Append d if that number equals the list length, otherwise overwrite the entry at that position only if d is smaller. The answer is the final list length."
followups:
  - "How would you return the builds that form one longest chain, not just its length?"
  - "What changes if the increase must be at least a percentage of the previous duration rather than a fixed number of seconds?"
  - "How would you track the answer as new builds arrive one at a time?"
common_errors:
  - "Using the standard LIS lower bound on d instead of an upper bound on d - min_increase."
  - "Overwriting tails[j] with d even when d is larger, which loses a better (smaller) chain ending."
  - "Only comparing each build with the one immediately before it, which finds a contiguous run instead of a chain."
  - "Treating min_increase = 0 as strictly increasing, so equal durations do not chain."
