title: Longest Rising Build-Duration Chain
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [devops, data_scientist, backend, qa]
time_limit_minutes: 25
prompt_markdown: |
  ## Longest Rising Build-Duration Chain

  A CI team suspects their pipeline is slowly getting slower. They have the duration of every build, in
  seconds, in chronological order: `durations[i]` is the duration of build `i`. Small run-to-run noise
  should not count as a slowdown, so they only care about increases of at least `min_increase` seconds.

  A **slowdown chain** is a selection of builds, kept in chronological order (builds in between may be
  skipped), in which every selected build took **at least `min_increase` seconds longer** than the
  previously selected build. A single build on its own is a chain of length 1.

  Return the length of the longest slowdown chain, or `0` if there are no builds.

  - `min_increase = 0` means equal durations may follow each other in a chain.
  - Builds must keep their original order; you may not reorder them.

  Aim for `O(n log n)` time; an `O(n^2)` solution is a reasonable starting point but too slow for the
  largest inputs.

  ### Example 1
  ```
  Input:  durations = [310, 295, 330, 340, 320, 365, 350, 400], min_increase = 10
  Output: 5
  Explanation: 310, 330, 340, 365, 400 rise by 20, 10, 25 and 35 seconds.
  ```

  ### Example 2
  ```
  Input:  durations = [120, 140, 135, 150, 152, 170], min_increase = 15
  Output: 4
  Explanation: 120, 135, 150, 170 works. Starting with 120, 140 leaves only 170 as a valid next build, because 150 and 152 are less than 15 seconds above 140.
  ```

  ### Example 3
  ```
  Input:  durations = [200, 200, 180, 200], min_increase = 0
  Output: 3
  ```

  ### Constraints
  - `0 <= durations.length <= 10^5`
  - `1 <= durations[i] <= 10^9`
  - `0 <= min_increase <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_rising_duration_chain
  params:
    - {name: durations, type: "int[]"}
    - {name: min_increase, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right


    def longest_rising_duration_chain(durations: list[int], min_increase: int) -> int:
        # tails[j] = smallest last duration of any chain with j + 1 builds seen so far.
        # Each entry is at least min_increase above the previous one, so tails stays sorted.
        tails: list[int] = []
        for d in durations:
            # Chains of length 1..j can be extended by d when their last value is <= d - min_increase.
            j = bisect_right(tails, d - min_increase)
            if j == len(tails):
                tails.append(d)
            elif d < tails[j]:
                tails[j] = d  # only replace when it lowers the best ending value
        return len(tails)
  javascript: |
    function longestRisingDurationChain(durations, minIncrease) {
      const tails = [];
      for (const d of durations) {
        const limit = d - minIncrease;
        // Upper bound: first index whose tail is greater than limit.
        let lo = 0;
        let hi = tails.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (tails[mid] <= limit) lo = mid + 1;
          else hi = mid;
        }
        if (lo === tails.length) tails.push(d);
        else if (d < tails[lo]) tails[lo] = d;
      }
      return tails.length;
    }
