time_limit_minutes: 12
prompt_markdown: |
  ## Self-Indexed Audit Entry

  An audit table was migrated from an old system that used offset entry ids, some of them negative. The
  exported ids are stored in `ids`, ordered by position, and they are **strictly increasing**.

  A consistency check looks for rows whose entry id equals their own zero-based position, that is,
  positions `i` with `ids[i] == i`. Return the **smallest** such position, or `-1` if no position matches.

  The export can be very large, so aim for `O(log n)` time.

  ### Example 1
  ```
  Input:  ids = [-4, -1, 2, 5, 9]
  Output: 2
  Explanation: ids[2] is 2.
  ```

  ### Example 2
  ```
  Input:  ids = [-2, 1, 2, 3, 8]
  Output: 1
  Explanation: Positions 1, 2 and 3 all match; the smallest is 1.
  ```

  ### Example 3
  ```
  Input:  ids = [1, 2, 3]
  Output: -1
  Explanation: Every id is larger than its position.
  ```

  ### Constraints
  - `0 <= ids.length <= 10^5`
  - `-10^9 <= ids[i] <= 10^9`
  - `ids` is strictly increasing (all ids are distinct integers).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: self_indexed_audit_entry
  params:
    - {name: ids, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def self_indexed_audit_entry(ids: list[int]) -> int:
        # ids[i] - i never decreases, so find the first i where it is >= 0.
        low, high = 0, len(ids)
        while low < high:
            mid = (low + high) // 2
            if ids[mid] - mid < 0:
                low = mid + 1
            else:
                high = mid
        if low < len(ids) and ids[low] == low:
            return low
        return -1
  javascript: |
    function selfIndexedAuditEntry(ids) {
      let low = 0;
      let high = ids.length;
      while (low < high) {
        const mid = (low + high) >> 1;
        if (ids[mid] - mid < 0) low = mid + 1;
        else high = mid;
      }
      return low < ids.length && ids[low] === low ? low : -1;
    }
