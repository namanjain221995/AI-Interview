expected_concepts:
  - "observing that ids[i] - i is non-decreasing for strictly increasing integers"
  - "lower-bound binary search on a derived monotonic sequence"
  - "returning the leftmost match instead of any match"
  - "not-found handling"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Proves that ids[i] - i never decreases because ids increase by at least 1 per step, binary searches for the first non-negative difference, checks equality at that position and states O(log n) time."
  good: "Correct binary search that finds a match, then fixes it to return the leftmost one with a little guidance."
  weak: "Linear scan only, a binary search that returns an arbitrary match, or reliance on the ids being non-negative."
  criteria:
    correctness: "All tests pass, including several matches and no match."
    efficiency: "Logarithmic time with constant extra memory."
    code_quality: "Expresses the condition in terms of ids[mid] - mid with a short comment explaining it."
    edge_cases: "Empty input, all positions matching, negative ids and the last position."
    communication: "Explains why strictness (distinct integers) is required for the argument."
hints:
  - "Compare each id with its position. As you move one step to the right, the position grows by exactly one. How much does the id grow at least?"
  - "Look at the difference between the id and its position. Because ids are distinct increasing integers, that difference can never go down as you move right. Where would a zero difference have to be?"
  - "Binary search for the first position where the id minus the position is zero or more, moving the low end right whenever the difference is negative. When the search ends, check whether that position is inside the array and its id equals the position; otherwise there is no match."
followups:
  - "Why does the approach fail if ids may repeat? Can you still beat a linear scan in that case?"
  - "How would you count all matching positions in O(log n)?"
  - "How would you adapt the search if the table were 1-indexed?"
  - "What happens to the difference ids[i] - i if ids were strictly decreasing?"
common_errors:
  - "Stopping at the first match the binary search happens to hit instead of the leftmost one."
  - "Comparing ids[mid] to a fixed target instead of to mid."
  - "Reading ids[low] after the loop without checking that low is inside the array."
  - "Assuming the answer must be at a non-negative id and skipping negative values incorrectly."
