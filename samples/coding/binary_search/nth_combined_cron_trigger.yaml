version: 1
slug: nth_combined_cron_trigger
title: N-th Trigger of Two Cron Jobs
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [devops, backend, platform, sre]
time_limit_minutes: 30
prompt_markdown: |
  ## N-th Trigger of Two Cron Jobs

  A scheduler runs two recurring jobs on a shared worker, starting the clock at minute `0`:

  - job A fires at minutes `a, 2a, 3a, ...`
  - job B fires at minutes `b, 2b, 3b, ...`

  Whenever at least one job fires, the worker wakes up once; a minute in which **both** jobs fire
  counts as a **single** wake-up. Minute `0` itself is not a wake-up.

  Return the minute of the **`n`-th wake-up** (1-based). The answer can exceed the 32-bit range, so
  return it as a 64-bit integer.

  ### Example 1
  ```
  Input:  n = 5, a = 4, b = 6
  Output: 16
  Explanation: Wake-ups happen at minutes 4, 6, 8, 12, 16, ... Minute 12 is shared by both jobs and
  counts once, so the 5th wake-up is minute 16.
  ```

  ### Example 2
  ```
  Input:  n = 4, a = 3, b = 3
  Output: 12
  Explanation: Both jobs always fire together: 3, 6, 9, 12.
  ```

  ### Example 3
  ```
  Input:  n = 1000000000, a = 40000, b = 39999
  Output: 20000000000000
  Explanation: By minute 2 * 10^13 job A has fired 500000000 times and job B 500012500 times, with
  12500 shared minutes, giving exactly 10^9 wake-ups; minute 2 * 10^13 itself is one of them.
  ```

  ### Constraints
  - `1 <= n <= 10^9`
  - `1 <= a, b <= 4 * 10^4`

  **Follow-up:** How would you count wake-ups if there were three jobs instead of two?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nth_combined_cron_trigger
  params:
    - {name: n, type: int}
    - {name: a, type: int}
    - {name: b, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    from math import gcd


    def nth_combined_cron_trigger(n: int, a: int, b: int) -> int:
        both = a // gcd(a, b) * b  # minutes where both jobs fire are multiples of lcm(a, b)

        def wakeups_until(t: int) -> int:
            return t // a + t // b - t // both

        lo, hi = 1, n * min(a, b)  # the faster job alone reaches n wake-ups by hi
        while lo < hi:
            mid = (lo + hi) // 2
            if wakeups_until(mid) >= n:
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function nthCombinedCronTrigger(n, a, b) {
      const gcd = (x, y) => (y === 0 ? x : gcd(y, x % y));
      const both = (a / gcd(a, b)) * b;
      const wakeupsUntil = (t) => Math.floor(t / a) + Math.floor(t / b) - Math.floor(t / both);
      let lo = 1;
      let hi = n * Math.min(a, b);
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (wakeupsUntil(mid) >= n) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
tests:
  - {id: t1, args: [5, 4, 6], expected: 16, description: "Example 1 - shared minute 12 counts once"}
  - {id: t2, args: [4, 3, 3], expected: 12, description: "Example 2 - equal intervals always coincide"}
  - {id: t3, args: [1000000000, 40000, 39999], expected: 20000000000000, description: "Example 3 - largest n with coprime intervals; answer needs 64 bits"}
  - {id: t4, hidden: true, args: [1, 7, 5], expected: 5, description: "n = 1 - the faster job fires first"}
  - {id: t5, hidden: true, args: [10, 1, 40000], expected: 10, description: "a = 1 - every minute is a wake-up"}
  - {id: t6, hidden: true, args: [9, 2, 6], expected: 18, description: "b is a multiple of a - job B never adds a new minute"}
  - {id: t7, hidden: true, args: [12, 6, 10], expected: 50, description: "Shared factor - lcm is 30, not 60"}
  - {id: t8, hidden: true, args: [1000000000, 40000, 40000], expected: 40000000000000, description: "Equal maximal intervals with n = 10^9 - answer 4 * 10^13"}
  - {id: t9, hidden: true, args: [999999937, 39998, 40000], expected: 19999998750060, description: "Large n with intervals sharing a factor of 2"}
  - {id: t10, hidden: true, args: [23, 5, 7], expected: 75, description: "Coprime small intervals around the first shared minute 35"}
expected_concepts:
  - binary search on the answer (the minute)
  - counting multiples up to T with integer division
  - inclusion-exclusion using lcm(a, b) = a / gcd(a, b) * b
  - finding the smallest T whose count reaches n (lower bound)
  - 64-bit arithmetic for the search range
optimal_complexity: {time: "O(log(n * min(a, b)))", space: O(1)}
rubric:
  excellent: Counts wake-ups up to T with inclusion-exclusion over lcm(a, b), binary searches the smallest T whose count reaches n with a tight upper bound, uses 64-bit arithmetic, and explains why the answer is always a multiple of a or b.
  good: Correct binary search after a hint about double-counted minutes, or minor issues such as a loose but safe upper bound.
  weak: Simulates minute by minute or merges the two sequences one step at a time (linear in n), double counts shared minutes, or overflows 32-bit integers.
  criteria:
    correctness: All tests pass, including a = b, one interval dividing the other and n = 10^9.
    efficiency: Logarithmic number of constant-time counts.
    code_quality: Counting function separated from the search; lcm computed without overflow.
    edge_cases: n = 1, a = 1, equal intervals, coprime intervals and the largest answers.
    communication: Explains the inclusion-exclusion count and why the lower-bound search returns a real wake-up minute.
hints:
  - Rather than listing wake-ups one by one, ask how many wake-ups happen in the first T minutes.
  - Count the multiples of a and of b up to T, and subtract the minutes counted twice, which are the multiples of the least common multiple. That count only grows with T.
  - Binary search T between 1 and n times the smaller interval, keeping the smallest T whose wake-up count is at least n; compute the least common multiple through the greatest common divisor and use 64-bit integers throughout.
followups:
  - How does the count change with three jobs (inclusion-exclusion over all pairs and the triple)?
  - Why is the smallest T with count >= n guaranteed to be a minute where a job fires?
  - How would you list the next k wake-ups after a given minute?
common_errors:
  - Counting a shared minute twice by forgetting the lcm term.
  - Computing a * b / gcd in a way that overflows, or using 32-bit integers for T.
  - Returning a T whose count is >= n but which is not the smallest such T.
  - Using lcm = a * b even when a and b share a factor.
