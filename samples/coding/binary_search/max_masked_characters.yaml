prompt_markdown: |
  ## Maximum Masked Characters Keeping a Pattern

  A log scrubber hides sensitive data by deleting characters from a log line `s` one at a time. It
  always deletes in the fixed sequence given by `order`: first the character at index `order[0]`,
  then the one at `order[1]`, and so on. Indices in `order` refer to positions in the **original**
  line, so they never shift as characters disappear.

  A detection rule still has to fire on the scrubbed line. The rule fires when `pattern` is a
  **subsequence** of the remaining characters: its characters appear in the same relative order, not
  necessarily next to each other.

  Return the **largest `k`** (`0 <= k <= order.length`) such that `pattern` is still a subsequence
  of `s` after deleting the characters at `order[0], order[1], ..., order[k - 1]`. The rule is
  guaranteed to fire on the untouched line, so the answer always exists.

  ### Example 1
  ```
  Input:  s = "token=ab12", pattern = "tk1", order = [1, 6, 2, 9, 0, 3]
  Output: 2
  Explanation: Deleting indices 1 and 6 leaves "tken=b12", which still contains t, k, 1 in order.
  The third deletion removes the only "k", so the rule stops firing.
  ```

  ### Example 2
  ```
  Input:  s = "retry-retry", pattern = "ry", order = [3, 4, 9, 10, 0]
  Output: 3
  Explanation: Deleting indices 3, 4 and 9 leaves "ret-rety", which still has an "r" before a "y".
  The fourth deletion (index 10) removes the last "y".
  ```

  ### Example 3
  ```
  Input:  s = "status=ok", pattern = "sok", order = [0, 7, 8, 1]
  Output: 1
  ```

  ### Constraints
  - `1 <= s.length <= 10^5`
  - `0 <= pattern.length <= s.length`
  - `0 <= order.length <= s.length`
  - The values in `order` are distinct and satisfy `0 <= order[i] < s.length`.
  - `s` and `pattern` contain printable ASCII characters.
  - `pattern` is a subsequence of `s`.

  **Follow-up:** Why does the property "pattern still matches after k deletions" let you binary search
  on `k`, and what would a linear scan over every `k` cost?
