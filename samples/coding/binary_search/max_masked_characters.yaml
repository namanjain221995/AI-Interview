expected_concepts:
  - monotonic predicate (more deletions never make the pattern reappear)
  - binary search on the answer k
  - linear two-pointer subsequence check
  - recording the deletion step of each index instead of rebuilding the string
  - O((n + m) log n) total time
optimal_complexity: {time: "O(n log n)", space: O(n)}
rubric:
  excellent: Notices that the match property is monotone in k, binary searches k with a linear subsequence check that skips indices whose deletion step is below k, handles an empty pattern and an empty order, and states O(n log n) time with a clear argument.
  good: Reaches the binary search with a correct check but rebuilds a masked string or set for each candidate, or needs a hint about monotonicity.
  weak: Tries every k with a fresh scan (quadratic), shifts indices after deletions, or has an off-by-one between k deletions and the index of the last deletion.
  criteria:
    correctness: All tests pass, including an empty pattern, an empty order and the case where every deletion is allowed.
    efficiency: Binary search over k with an O(n) check per step; no quadratic scan.
    code_quality: The deletion step per index is precomputed once and the check is a small helper with a clear name.
    edge_cases: Handles k = 0, k = order.length, repeated characters in the pattern and deletions of characters the pattern never uses.
    communication: Explains why the predicate is monotone and which half of the range each check discards.
hints:
  - Think about what happens to the rule once it has stopped firing - can more deletions ever make it fire again?
  - Because the answer is monotone, you can guess a k and test it. How do you test one k quickly without physically rebuilding the string?
  - Record for each index the step at which it is deleted. For a candidate k, walk s with a pointer into pattern, skipping indices deleted before step k, then binary search for the largest k whose walk consumes the whole pattern.
followups:
  - How would you return the index of the first deletion that breaks the rule instead of the count?
  - What changes if several patterns must all keep matching?
  - Could you solve it without binary search by processing deletions in reverse?
common_errors:
  - Treating indices in order as positions in the already-shortened string.
  - Off-by-one between "k deletions" and "the deletion at order[k]".
  - Checking every k from scratch, which is quadratic on long lines.
  - Forgetting that an empty pattern always matches, so every deletion is allowed.
