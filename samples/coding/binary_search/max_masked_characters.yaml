reference_solutions:
  python: |
    def max_masked_characters(s: str, pattern: str, order: list[int]) -> int:
        # removed_at[i] = the step at which s[i] is deleted (len(order) if never).
        removed_at = [len(order)] * len(s)
        for step, index in enumerate(order):
            removed_at[index] = step

        def still_matches(k: int) -> bool:
            j = 0
            for i, ch in enumerate(s):
                if j < len(pattern) and removed_at[i] >= k and ch == pattern[j]:
                    j += 1
            return j == len(pattern)

        lo, hi = 0, len(order)
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if still_matches(mid):
                lo = mid
            else:
                hi = mid - 1
        return lo
  javascript: |
    function maxMaskedCharacters(s, pattern, order) {
      const removedAt = new Array(s.length).fill(order.length);
      for (let step = 0; step < order.length; step++) removedAt[order[step]] = step;

      const stillMatches = (k) => {
        let j = 0;
        for (let i = 0; i < s.length && j < pattern.length; i++) {
          if (removedAt[i] >= k && s[i] === pattern[j]) j++;
        }
        return j === pattern.length;
      };

      let lo = 0;
      let hi = order.length;
      while (lo < hi) {
        const mid = Math.floor((lo + hi + 1) / 2);
        if (stillMatches(mid)) lo = mid;
        else hi = mid - 1;
      }
      return lo;
    }
