  - "binary search on a rotated sorted array"
  - "comparing the middle element with the right end to pick a half"
  - "the minimum is the only element smaller than its predecessor"
  - "handling the unrotated case and arrays of length one or two"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Derives the binary search that compares the middle with the right end, explains why the minimum stays inside the search range, covers the unrotated and two-element cases, and states O(log n) time with O(1) space."
  good: "Correct binary search after a hint about which end to compare with, or a correct solution with a small boundary slip fixed during testing."
  weak: "Uses a linear scan or sorting, or writes a binary search that loops forever or misses the unrotated case."
  criteria:
    correctness: "All tests pass, including single elements, unrotated rosters and the minimum at either end."
    efficiency: "Logarithmic time and constant memory; a linear scan is noted as the baseline only."
    code_quality: "Clear loop condition and an invariant that the answer lies within the current range."
    edge_cases: "Length one and two, no rotation, minimum in the last position and negative values."
    communication: "Explains why comparing with the right end (rather than the left) always shrinks the range correctly."
hints:
  - "A rotated sorted list is made of two increasing runs. The value you need is where the second run starts."
  - "Look at the middle element and the last element. If the middle is larger than the last, the drop must be somewhere to the right of the middle."
  - "Keep a range from low to high. While low is below high, take the middle: if it is greater than the element at high, move low just past the middle; otherwise move high to the middle (it may itself be the minimum). When the range closes, low is the answer."
followups:
  - "Why is it safer to compare the middle with the right end than with the left end?"
  - "What changes if ids may contain duplicates, and what is the worst-case complexity then?"
  - "How would you recover the rotation amount k from the answer?"
  - "How would you use this index to search for a specific id in O(log n)?"
common_errors:
  - "Comparing with the first element without handling the unrotated roster, which returns the wrong index."
  - "Setting high to mid minus one and skipping the minimum when the middle element is the answer."
  - "Using a loop condition that never terminates when the range has two elements."
  - "Returning the smallest value instead of its index."
