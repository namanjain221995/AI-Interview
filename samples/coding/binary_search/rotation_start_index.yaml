title: "Rotation Start of a Shift Roster"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Rotation Start of a Shift Roster

  An on-call scheduler issues shift ids in **strictly increasing** order and stores them as a roster. So
  that the current shift is listed first, the service rotates the roster: it moves some number of
  entries from the front to the back, keeping their relative order. The number of moved entries is
  unknown and may be zero (the roster is then still sorted).

  Given the rotated roster `ids` (all values distinct), return the **index of the smallest id** in
  `ids`, which is the position where the original issue order begins. If the roster was not rotated,
  the answer is `0`.

  Your solution should run in `O(log n)` time.

  ### Example 1
  ```
  Input:  ids = [40, 52, 61, 7, 13, 25]
  Output: 3
  Explanation: The smallest id, 7, sits at index 3; the original order was [7, 13, 25, 40, 52, 61].
  ```

  ### Example 2
  ```
  Input:  ids = [3, 8, 15, 21]
  Output: 0
  Explanation: Nothing was moved, so the smallest id is already first.
  ```

  ### Example 3
  ```
  Input:  ids = [31, 47, 58, 66, 70, 9]
  Output: 5
  ```

  ### Constraints
  - `1 <= ids.length <= 10^5`
  - `-10^9 <= ids[i] <= 10^9`
  - All values are distinct, and `ids` is a strictly increasing list rotated by some amount `k` with `0 <= k < ids.length`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rotation_start_index
  params:
    - {name: ids, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def rotation_start_index(ids: list[int]) -> int:
        lo, hi = 0, len(ids) - 1
        while lo < hi:
            mid = (lo + hi) // 2
            if ids[mid] > ids[hi]:
                # The drop (and so the minimum) lies to the right of mid.
                lo = mid + 1
            else:
                hi = mid
        return lo
  javascript: |
    function rotationStartIndex(ids) {
      const n = ids.length;
      if (ids[0] <= ids[n - 1]) return 0;
      // Find the first element smaller than ids[0].
      let lo = 1;
      let hi = n - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (ids[mid] < ids[0]) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
