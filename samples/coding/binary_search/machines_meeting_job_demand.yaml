expected_concepts:
  - "sort the machine rates once"
  - "minimum qualifying rate via ceiling division"
  - "lower-bound binary search and counting from the found position to the end"
  - "64-bit products or division to avoid overflow"
  - "O((n + m) log m) instead of O(n * m)"
optimal_complexity: {time: "O((n + m) log m)", space: "O(m)"}
rubric:
  excellent: "Sorts the rates once, derives the minimum rate per job with exact ceiling division (or a 64-bit product check), counts with a lower-bound search and explains the overflow risk and O((n + m) log m) cost."
  good: "Gets the sort plus binary search solution working with a small boundary or overflow slip fixed after testing."
  weak: "Stays with the nested loop, overflows the product in a 32-bit type, or uses floating-point division that rounds the boundary wrongly."
  criteria:
    correctness: "All tests pass, including boundary equality, non-divisible requirements and products beyond 32 bits."
    efficiency: "One sort of the machines plus one binary search per job."
    code_quality: "A clear lower-bound helper and named values such as the minimum rate needed."
    edge_cases: "Handles no jobs, no qualifying machines, all machines qualifying and duplicate rates."
    communication: "Explains why the condition is monotonic in the rate and where 64-bit arithmetic is needed."
hints:
  - "For a fixed job, a faster machine can only help, so the machines that work for it are all the ones above some cut-off rate."
  - "If the rates are sorted, the machines that qualify form a suffix of the sorted list; you only need to find where that suffix starts."
  - "Sort the rates once; for each job compute the smallest whole rate that reaches the requirement using ceiling division in 64-bit integers, binary search for the first rate at least that large and count everything from there to the end."
followups:
  - "If the jobs were sorted as well, how could you answer all of them in linear time after sorting?"
  - "What would change if each machine could only take one job?"
  - "How would you support machines joining and leaving the pool between queries?"
common_errors:
  - "Computing the product in a 32-bit integer so it overflows near 2^31."
  - "Using floor division for the minimum rate, which accepts a machine that is one step too slow."
  - "Using floating-point division and rounding, which can be off by one at the boundary."
  - "Using an upper-bound search and missing machines whose product equals the requirement exactly."
