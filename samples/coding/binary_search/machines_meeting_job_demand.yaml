slug: machines_meeting_job_demand
title: "Machines Able to Meet Each Job's Demand"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, cloud, platform, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Machines Able to Meet Each Job's Demand

  A batch platform places nightly data jobs on a pool of worker machines. Job `i` holds a reservation of
  `job_hours[i]` hours, and machine `j` processes `machine_rates[j]` thousand records per hour. Every job
  must process at least `required_records` thousand records inside its reservation, so job `i` can run on
  machine `j` exactly when

  ```
  job_hours[i] * machine_rates[j] >= required_records
  ```

  This product can be larger than a 32-bit integer can hold.

  Return an array whose `i`-th entry is the number of machines that job `i` could run on, in the same order
  as `job_hours`. Both lists can hold up to 10^5 entries, so checking every job against every machine is
  too slow.

  ### Example 1
  ```
  Input:  job_hours = [2, 5, 1], machine_rates = [4, 1, 10, 3], required_records = 10
  Output: [1, 3, 1]
  Explanation: a 2-hour job needs a rate of at least 5 (only 10 qualifies); a 5-hour job needs at
               least 2 (4, 10 and 3 qualify); a 1-hour job needs 10.
  ```

  ### Example 2
  ```
  Input:  job_hours = [100000], machine_rates = [100000, 99999], required_records = 10000000000
  Output: [1]
  Explanation: 100000 * 100000 = 10^10 meets the requirement exactly; 100000 * 99999 falls short.
  ```

  ### Constraints
  - `0 <= job_hours.length <= 10^5`
  - `1 <= machine_rates.length <= 10^5`
  - `1 <= job_hours[i], machine_rates[j] <= 10^5`
  - `1 <= required_records <= 10^10` (use 64-bit arithmetic)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: machines_meeting_job_demand
  params:
    - {name: job_hours, type: "int[]"}
    - {name: machine_rates, type: "int[]"}
    - {name: required_records, type: "long"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def machines_meeting_job_demand(job_hours: list[int], machine_rates: list[int], required_records: int) -> list[int]:
        rates = sorted(machine_rates)
        result = []
        for hours in job_hours:
            min_rate = -(-required_records // hours)  # ceiling division, exact integers
            result.append(len(rates) - bisect_left(rates, min_rate))
        return result
  javascript: |
    function machinesMeetingJobDemand(jobHours, machineRates, requiredRecords) {
      const rates = [...machineRates].sort((a, b) => a - b);
      return jobHours.map((hours) => {
        // first machine whose rate * hours reaches the requirement (products stay below 2^53)
        let lo = 0;
        let hi = rates.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (rates[mid] * hours >= requiredRecords) hi = mid;
          else lo = mid + 1;
        }
        return rates.length - lo;
      });
    }
