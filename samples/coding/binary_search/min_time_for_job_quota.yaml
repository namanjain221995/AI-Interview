expected_concepts:
  - binary search on the answer (a monotone yes/no predicate over time)
  - counting completed jobs with integer division
  - a safe upper bound such as min(cycle_times) * quota
  - 64-bit arithmetic and early exit to avoid overflow
optimal_complexity: {time: O(n log(min(cycle_times) * quota)), space: O(1)}
rubric:
  excellent: "Frames the task as finding the first T where a monotone predicate turns true, picks a tight upper bound, uses 64-bit math with an early exit in the count, and explains the O(n log U) cost."
  good: "Correct binary search on time with a loose bound or a minor off-by-one fixed after testing, or a correct solution that relies on a wide integer type without discussing overflow."
  weak: "Simulates minute by minute, uses a heap of next-completion times for the full quota, or overflows 32-bit integers on large inputs."
  criteria:
    correctness: "All tests pass, including quota 1, a single machine and answers above 2^31."
    efficiency: "O(n log U) where U is the upper bound on T; no per-minute or per-job simulation."
    code_quality: "The feasibility check is a separate, clearly named helper and the search keeps a clear lo/hi contract."
    edge_cases: "quota = 1, identical cycle times, one machine much faster than the rest and the largest values."
    communication: "Explains why more minutes can never mean fewer completed jobs, which is what makes binary search valid."
hints:
  - "If the machines can reach the quota by minute T, can they also reach it by minute T + 1? What does that tell you about the set of valid answers?"
  - "For a fixed T you can count the completed jobs directly with integer division, so try searching over T instead of simulating time."
  - "Binary search T between 1 and min(cycle_times) * quota: for the middle value sum floor(mid / cycle) over all machines (stopping as soon as the sum reaches quota), move the upper bound down when the quota is met and the lower bound up otherwise, using 64-bit integers throughout."
followups:
  - "How would you also report how many jobs each machine completed by the answer time?"
  - "If machines had a start-up delay before their first job, how would the count change?"
  - "Could a priority queue solve this, and when would it be faster or slower than binary search?"
common_errors:
  - "Using 32-bit integers for T or the job count, which overflows for large quotas or cycle times."
  - "Summing every machine without an early exit in a language with fixed-width integers, which can overflow the 64-bit total."
  - "Searching for the last T that fails instead of the first T that succeeds, returning an answer that is off by one."
  - "Simulating minute by minute, which is far too slow when T reaches 10^15."
