title: Minimum Time to Hit a Job Quota
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, sre, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Time to Hit a Job Quota

  A batch farm has several worker machines that all start at minute `0` and run in parallel. Machine
  `i` completes one job every `cycle_times[i]` minutes, so after `T` minutes it has completed
  `floor(T / cycle_times[i])` jobs. Machines never wait for each other and never pause.

  The nightly run is finished once the machines have completed at least `quota` jobs in total. Return the
  smallest whole number of minutes `T` at which that is true.

  - Only completed jobs count; a job that is halfway done at minute `T` does not.
  - The answer can be much larger than `2^31 - 1`, so use a 64-bit integer.

  ### Example 1
  ```
  Input:  cycle_times = [2, 3, 7], quota = 10
  Output: 12
  Explanation: At minute 12 the machines have completed 6 + 4 + 1 = 11 jobs. At minute 11 they have completed only 5 + 3 + 1 = 9.
  ```

  ### Example 2
  ```
  Input:  cycle_times = [6], quota = 3
  Output: 18
  ```

  ### Example 3
  ```
  Input:  cycle_times = [4, 4], quota = 5
  Output: 12
  Explanation: At minute 12 each machine has completed 3 jobs (6 in total); at minute 11 each has completed only 2.
  ```

  ### Constraints
  - `1 <= cycle_times.length <= 10^5`
  - `1 <= cycle_times[i] <= 10^7`
  - `1 <= quota <= 10^8`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_time_for_job_quota
  params:
    - {name: cycle_times, type: "int[]"}
    - {name: quota, type: long}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def min_time_for_job_quota(cycle_times: list[int], quota: int) -> int:
        def reaches_quota(minutes: int) -> bool:
            done = 0
            for cycle in cycle_times:
                done += minutes // cycle
                if done >= quota:  # stop early so the running total never grows huge
                    return True
            return False

        # The fastest machine alone reaches the quota by min(cycle_times) * quota minutes.
        lo, hi = 1, min(cycle_times) * quota
        while lo < hi:
            mid = (lo + hi) // 2
            if reaches_quota(mid):
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function minTimeForJobQuota(cycleTimes, quota) {
      const reachesQuota = (minutes) => {
        let done = 0;
        for (const cycle of cycleTimes) {
          done += Math.floor(minutes / cycle);
          if (done >= quota) return true;
        }
        return false;
      };
      let lo = 1;
      let hi = Math.min(...cycleTimes) * quota;
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (reachesQuota(mid)) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
