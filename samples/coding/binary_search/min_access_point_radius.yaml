expected_concepts:
  - "sort the access points once"
  - "binary search the insertion point of each sensor"
  - "the two nearest access points lie within two positions on either side of the insertion point"
  - "answer is the maximum over sensors of the distance to the second-nearest access point"
  - "O((n + m) log m) instead of O(n * m)"
optimal_complexity: {time: "O((n + m) log m)", space: "O(m)"}
rubric:
  excellent: "Reduces the task to the second-nearest access point per sensor, sorts the access points, uses one binary search per sensor and checks the right neighbourhood of candidates, treats co-located access points as distinct and states O((n + m) log m)."
  good: "Reaches a correct sort plus binary search solution, possibly after fixing which neighbours to compare or the duplicate-position case with prompting."
  weak: "Computes all sensor-to-access-point distances with nested loops, uses only the nearest access point, or treats repeated positions as a single access point."
  criteria:
    correctness: "All tests pass, including co-located access points, sensors outside the access point range and an empty sensor list."
    efficiency: "One sort plus a logarithmic search per sensor; no quadratic scan."
    code_quality: "Clear candidate-gathering step with bounds checks rather than many special cases."
    edge_cases: "Handles no sensors, sensors left or right of every access point, all access points at one spot and extreme coordinates."
    communication: "Explains why only the two neighbours on each side of the insertion point can be the two nearest."
hints:
  - "For a single sensor, the radius it needs is set by its second-closest access point, and the whole line needs the worst sensor's value."
  - "Once the access points are sorted, the access points nearest to a sensor sit right around where the sensor would be inserted in that order."
  - "Sort the access points; for each sensor binary search its insertion point, collect the distances to the up to two access points just before and the up to two just after it, take the second smallest of those and keep the maximum over all sensors."
followups:
  - "How would you generalise to requiring coverage by at least k access points?"
  - "If sensors were sorted too, how could you avoid binary search entirely?"
  - "How would the answer change if each access point had its own radius budget?"
common_errors:
  - "Only checking one neighbour on each side, which misses cases where both nearest access points lie on the same side."
  - "Deduplicating access point positions, which breaks double coverage from co-located access points."
  - "Returning the maximum distance to the nearest access point instead of the second-nearest."
  - "Using nested loops over sensors and access points."
