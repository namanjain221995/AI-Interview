prompt_markdown: |
  ## Minimum Access Point Radius for Failover Coverage

  A factory runs one long, straight conveyor line, so every location on it is a single integer
  (centimetres from the start of the line). Wireless vibration sensors are mounted at the positions in
  `sensors`, and wireless access points at the positions in `access_points`. Neither list is sorted and
  positions can repeat; two access points mounted at the same position still count as two separate
  access points.

  All access points are configured with the same integer radius `r`, and an access point at position `p`
  reaches every position in `[p - r, p + r]`. For failover, **every sensor must be reached by at least two
  different access points**. Return the smallest `r` that achieves this, or `0` if there are no sensors.

  ### Example 1
  ```
  Input:  sensors = [6, 1, 14], access_points = [0, 10, 4, 15]
  Output: 4
  Explanation: the sensor at 6 is 2 from the access point at 4 and 4 from the one at 10, so it needs r
               = 4. The sensor at 1 needs 3 (points 0 and 4) and the sensor at 14 needs 4 (points 15
               and 10).
  ```

  ### Example 2
  ```
  Input:  sensors = [7, 7], access_points = [7, 7, 30]
  Output: 0
  Explanation: both sensors sit on two access points mounted at 7, so r = 0 already gives double
               coverage.
  ```

  ### Example 3
  ```
  Input:  sensors = [50], access_points = [10, 40]
  Output: 40
  Explanation: the second-nearest access point is at 10, 40 away.
  ```

  ### Constraints
  - `0 <= sensors.length <= 10^5`
  - `2 <= access_points.length <= 10^5`
  - `0 <= sensors[i], access_points[j] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_access_point_radius
  params:
    - {name: sensors, type: "int[]"}
    - {name: access_points, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def min_access_point_radius(sensors: list[int], access_points: list[int]) -> int:
        aps = sorted(access_points)
        radius = 0
        for s in sensors:
            i = bisect_left(aps, s)
            # the two nearest access points are among the two on each side of the insertion point
            nearby = sorted(abs(aps[j] - s) for j in range(max(0, i - 2), min(len(aps), i + 2)))
            radius = max(radius, nearby[1])
        return radius
  javascript: |
    function minAccessPointRadius(sensors, accessPoints) {
      const aps = [...accessPoints].sort((a, b) => a - b);
      let radius = 0;
      for (const s of sensors) {
        let lo = 0;
        let hi = aps.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (aps[mid] < s) lo = mid + 1;
          else hi = mid;
        }
        const nearby = [];
        for (let j = Math.max(0, lo - 2); j < Math.min(aps.length, lo + 2); j++) nearby.push(Math.abs(aps[j] - s));
        nearby.sort((a, b) => a - b);
        radius = Math.max(radius, nearby[1]);
      }
      return radius;
    }
