slug: maintainer_impact_score
title: Maintainer Impact Score
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Maintainer Impact Score

  An open-source registry shows an **impact score** on each maintainer's profile. For every package the
  maintainer owns, the registry knows how many downstream projects depend on it. `dependents` holds those
  counts, already **sorted in non-decreasing order** by the registry's index.

  The impact score is the largest integer `h` such that **at least `h` packages** each have **at least
  `h` dependents**. A maintainer with no packages, or whose packages have no dependents, scores `0`.

  The registry recomputes scores on every page view, so return the score in `O(log n)` time by using the
  sorted order.

  ### Example 1
  ```
  Input:  dependents = [0, 2, 3, 5, 9, 14]
  Output: 3
  Explanation: The 3 packages with 5, 9 and 14 dependents each have at least 3. Only 3 packages have at least 4, so h = 4 fails.
  ```

  ### Example 2
  ```
  Input:  dependents = [1, 1, 1]
  Output: 1
  ```

  ### Example 3
  ```
  Input:  dependents = [0, 0]
  Output: 0
  ```

  ### Constraints
  - `0 <= dependents.length <= 10^5`
  - `0 <= dependents[i] <= 10^9`
  - `dependents` is sorted in non-decreasing order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: maintainer_impact_score
  params:
    - {name: dependents, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def maintainer_impact_score(dependents: list[int]) -> int:
        n = len(dependents)
        # Find the first index i where the package at i has at least (n - i) dependents:
        # then the n - i packages from i to the end all qualify for h = n - i.
        lo, hi = 0, n
        while lo < hi:
            mid = (lo + hi) // 2
            if dependents[mid] >= n - mid:
                hi = mid
            else:
                lo = mid + 1
        return n - lo
  javascript: |
    function maintainerImpactScore(dependents) {
      const n = dependents.length;
      let lo = 0;
      let hi = n;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (dependents[mid] >= n - mid) hi = mid;
        else lo = mid + 1;
      }
      return n - lo;
    }
