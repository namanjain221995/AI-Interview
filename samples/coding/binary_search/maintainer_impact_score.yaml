expected_concepts:
  - binary search for the first index meeting a condition
  - "the suffix from index i holds n - i packages, all with at least dependents[i]"
  - monotonicity of dependents[i] - (n - i)
  - empty input and all-zero input return 0
optimal_complexity: {time: O(log n), space: O(1)}
rubric:
  excellent: "Turns the definition into the monotone condition dependents[i] >= n - i, binary searches for the first index that satisfies it, returns n - i, and explains why the condition flips only once."
  good: "Reaches a correct binary search after trying a linear scan first, or needs a hint to express the score in terms of an index."
  weak: "Only gives a linear or sorting-based solution, confuses h with a dependent count from the array, or fails on empty or all-zero input."
  criteria:
    correctness: "All tests pass, including the empty list, all zeros and very large counts."
    efficiency: "O(log n) time and O(1) space using the sorted order; no full scan."
    code_quality: "Half-open search bounds [lo, hi) with a clear meaning and a single return expression."
    edge_cases: "Empty input, all zeros, a single package, counts far larger than n and many equal counts."
    communication: "Explains why the score cannot exceed the number of packages and why large counts still contribute one package each."
hints:
  - "Because the counts are sorted, if you pick index i, how many packages from i to the end are there, and what is the smallest count among them?"
  - "Index i gives a valid score of n - i exactly when dependents[i] >= n - i. As i moves right the left side grows and the right side shrinks, so that condition switches from false to true once."
  - "Binary search over the half-open range [0, n) for the first index i with dependents[i] >= n - i; the answer is n - i, which is 0 when no index qualifies and the search ends at n."
followups:
  - "How would you compute the score in O(n) if the counts arrived unsorted?"
  - "If one new package were added to the sorted list, could you update the score without a full search?"
  - "Why is the answer n - i and not dependents[i]?"
common_errors:
  - "Returning dependents[i] instead of n - i."
  - "Using a closed search range and missing the case where no index qualifies (answer 0)."
  - "Falling back to a linear scan, which ignores the O(log n) requirement."
  - "Reading dependents[0] or dependents[n - 1] without checking for an empty list."
