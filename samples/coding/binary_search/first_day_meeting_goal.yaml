time_limit_minutes: 15
prompt_markdown: |
  ## First Day a Sales Goal Is Met

  A sales dashboard tracks a product launch. `daily_units[d]` is the number of units sold on day `d` of the
  launch (day `0` is the first day); a day with no sales has `0`.

  Product managers keep asking the same kind of question with different targets: "on which day did
  cumulative sales first reach this goal?" For every goal in `goals`, find the **smallest day index `d`**
  such that `daily_units[0] + daily_units[1] + ... + daily_units[d] >= goal`. If cumulative sales never
  reach the goal, the answer for that goal is `-1`.

  Return the answers as a list in the **same order as `goals`**. Goals are not sorted and may repeat.
  Cumulative totals can exceed the 32-bit integer range, so use 64-bit arithmetic.

  Aim for `O((n + q) log n)` or better, where `n` is the number of days and `q` the number of goals.

  ### Example 1
  ```
  Input:  daily_units = [3, 0, 5, 2, 8], goals = [1, 3, 4, 10, 18, 19]
  Output: [0, 0, 2, 3, 4, -1]
  Explanation: Cumulative sales are 3, 3, 8, 10, 18. Goal 3 is first reached on day 0, goal 18 on day 4, and goal 19 is never reached.
  ```

  ### Example 2
  ```
  Input:  daily_units = [0, 0, 4, 1], goals = [5, 4, 4]
  Output: [3, 2, 2]
  Explanation: Cumulative sales are 0, 0, 4, 5. Answers follow the order of goals.
  ```

  ### Constraints
  - `0 <= daily_units.length <= 10^5`
  - `0 <= daily_units[d] <= 10^9`
  - `1 <= goals.length <= 10^5`
  - `1 <= goals[i] <= 10^15`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_day_meeting_goal
  params:
    - {name: daily_units, type: "int[]"}
    - {name: goals, type: "long[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def first_day_meeting_goal(daily_units: list[int], goals: list[int]) -> list[int]:
        prefix = []
        total = 0
        for units in daily_units:
            total += units
            prefix.append(total)  # non-decreasing because units are non-negative

        answers = []
        for goal in goals:
            low, high = 0, len(prefix)
            while low < high:  # first index with prefix >= goal
                mid = (low + high) // 2
                if prefix[mid] < goal:
                    low = mid + 1
                else:
                    high = mid
            answers.append(low if low < len(prefix) else -1)
        return answers
  javascript: |
    function firstDayMeetingGoal(dailyUnits, goals) {
      const prefix = [];
      let total = 0;
      for (const units of dailyUnits) {
        total += units;
        prefix.push(total);
      }
      return goals.map((goal) => {
        let low = 0;
        let high = prefix.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (prefix[mid] < goal) low = mid + 1;
          else high = mid;
        }
        return low < prefix.length ? low : -1;
      });
    }
