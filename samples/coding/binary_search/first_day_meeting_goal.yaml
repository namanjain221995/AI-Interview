expected_concepts:
  - "prefix sums of non-negative values form a non-decreasing sequence"
  - "lower-bound binary search for the first prefix >= goal"
  - "answering many queries after O(n) preprocessing"
  - "64-bit accumulation to avoid overflow"
optimal_complexity: {time: "O(n + q log n)", space: "O(n)"}
rubric:
  excellent: "Builds 64-bit prefix sums once, explains why they never decrease, answers each goal with a lower-bound binary search that returns the first day even across zero-sales plateaus, keeps the output in input order and states O(n + q log n)."
  good: "Correct prefix sums and binary search, possibly after fixing an off-by-one or the integer width with a test run."
  weak: "Rescans the days for every goal (O(n * q)), sorts the goals and loses their order, returns a later day on a plateau, or overflows 32-bit totals."
  criteria:
    correctness: "All tests pass, including plateaus of zero days and goals that are never reached."
    efficiency: "Linear preprocessing plus a logarithmic search per goal."
    code_quality: "Separates building the prefix array from the search and uses a 64-bit type for totals."
    edge_cases: "Empty sales data, a single day, exact matches and goals larger than the total."
    communication: "Explains why the non-negativity of daily sales makes binary search valid."
hints:
  - "For one goal you could add up sales day by day until you reach it. What could you compute once so that every goal can reuse it?"
  - "Store the running total after each day. Because no day has negative sales, these totals never go down, so the question for each goal becomes a search in a sorted list."
  - "Build the running totals in a 64-bit type. For each goal, binary search for the first position whose total is at least the goal (a lower bound), moving the low end right while the total is still below it. If the search runs past the last day, the answer is minus one. Keep the answers in the order the goals were given."
followups:
  - "How would you answer the goals with a single linear pass if they were sorted first? What would you have to do to restore the original order?"
  - "What changes if returns can make a day's units negative?"
  - "How would you support new days being appended while queries keep arriving?"
  - "How would you report the day each goal was reached as a calendar date range across several products?"
common_errors:
  - "Summing from day zero for every goal, giving O(n * q) time."
  - "Using an upper bound or a plain exact-match search, which returns a later day when zero-sales days repeat the total."
  - "Storing prefix sums in 32-bit integers in Java, Go or C++."
  - "Sorting the goals in place and returning answers in the wrong order."
