expected_concepts:
  - "count of missing numbers before index i is invoices[i] - (i + 1)"
  - "that count is non-decreasing, so it can be binary searched"
  - "answer = index of the first position with enough missing numbers + k"
  - "answers before the first or after the last invoice"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Derives the missing-before-index formula, binary searches for the first index where it reaches k, explains why the answer is that index plus k, covers empty input and answers beyond the last invoice, and states O(log n)."
  good: "Correct linear scan using the missing-count formula, then reaches the binary search with a hint."
  weak: "Builds the full list of missing numbers or a set of all issued numbers and counts up, which is far too slow when k is large."
  criteria:
    correctness: "All tests pass, including an empty list, answers before the first invoice and answers beyond the last."
    efficiency: "Logarithmic time with constant memory; a linear scan is acceptable only as a first step."
    code_quality: "Clear naming of the missing count and a well-defined search invariant."
    edge_cases: "Empty input, k inside the first gap, k exactly at the end of a gap and very large k."
    communication: "Explains the formula with a small example and why the final answer is index plus k."
hints:
  - "Look at one issued invoice at position i. Without any gaps it would equal i plus one. What does the difference tell you?"
  - "The number of skipped values before position i is the invoice number minus i minus one, and this count never decreases from left to right. Find where it first reaches k."
  - "Binary search for the first index whose missing count is at least k (the list length if there is none). At that point exactly that many issued invoices lie below the answer, so the answer is the index plus k; this also covers an empty list and answers past the last invoice."
followups:
  - "Can you explain why the answer equals the found index plus k with a small example?"
  - "How would you return the first k missing numbers instead of only the k-th?"
  - "What if invoices could contain duplicates?"
  - "How would you answer many queries for different k values on the same list?"
common_errors:
  - "Generating every missing number one by one, which is too slow when k is around 10^9."
  - "Forgetting that the answer can be smaller than the first invoice or larger than the last."
  - "Off-by-one errors in the missing-count formula (using i instead of i plus one)."
  - "Returning the invoice next to the gap instead of the missing number itself."
