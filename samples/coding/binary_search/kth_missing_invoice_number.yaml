time_limit_minutes: 20
prompt_markdown: |
  ## K-th Missing Invoice Number

  A billing system numbers its invoices with positive integers. Because of voided drafts and an old
  sequencing bug, some numbers were skipped. `invoices` lists every number that was actually issued, in
  **strictly increasing** order.

  An auditor counts upward from `1` and writes down every positive integer that was **never issued**.
  The list does not stop at the last issued invoice: every number above it was never issued either.
  Return the **`k`-th number** on the auditor's list.

  Your solution should run in `O(log n)` time.

  ### Example 1
  ```
  Input:  invoices = [3, 4, 7, 8, 12], k = 4
  Output: 6
  Explanation: The numbers never issued are 1, 2, 5, 6, 9, 10, 11, 13, ...; the fourth is 6.
  ```

  ### Example 2
  ```
  Input:  invoices = [1, 2, 3], k = 2
  Output: 5
  Explanation: Nothing is missing up to 3, so the missing numbers are 4, 5, 6, ...; the second is 5.
  ```

  ### Example 3
  ```
  Input:  invoices = [5, 6, 9], k = 1
  Output: 1
  ```

  ### Constraints
  - `0 <= invoices.length <= 10^5`
  - `1 <= invoices[i] <= 10^9`, strictly increasing
  - `1 <= k <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: kth_missing_invoice_number
  params:
    - {name: invoices, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def kth_missing_invoice_number(invoices: list[int], k: int) -> int:
        # Before index i, exactly invoices[i] - (i + 1) numbers were skipped.
        # Find the first index where at least k numbers are already missing.
        lo, hi = 0, len(invoices)
        while lo < hi:
            mid = (lo + hi) // 2
            if invoices[mid] - (mid + 1) >= k:
                hi = mid
            else:
                lo = mid + 1
        # lo issued invoices lie below the answer.
        return lo + k
  javascript: |
    function kthMissingInvoiceNumber(invoices, k) {
      // Find the last index with fewer than k missing numbers before it,
      // then step forward from that issued invoice.
      let lo = -1;
      let hi = invoices.length;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (invoices[mid] - mid - 1 < k) lo = mid;
        else hi = mid;
      }
      if (lo < 0) return k;
      const missingBefore = invoices[lo] - lo - 1;
      return invoices[lo] + (k - missingBefore);
    }
