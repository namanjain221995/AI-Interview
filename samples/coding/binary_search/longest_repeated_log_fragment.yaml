version: 1
slug: longest_repeated_log_fragment
title: Longest Log Fragment Seen K Times
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, backend, security, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Longest Log Fragment Seen K Times

  A detection pipeline encodes a stream of events as a string `s` of lowercase letters, one letter
  per event type. Analysts want the longest burst of activity that keeps coming back: find the
  **longest substring** of `s` that appears **at least `k` times**, counting every starting index
  where it appears. Appearances may **overlap** (in `"aaaa"`, the substring `"aa"` appears 3 times).

  - If several substrings share the maximum length, return the one whose **first appearance starts
    at the smallest index** (not the alphabetically smallest one).
  - If no substring of any length appears `k` times, return the empty string `""`.

  ### Example 1
  ```
  Input:  s = "aaaaa", k = 3
  Output: "aaa"
  Explanation: "aaa" starts at indices 0, 1 and 2; "aaaa" starts only at 0 and 1.
  ```

  ### Example 2
  ```
  Input:  s = "cdabxabycd", k = 2
  Output: "cd"
  Explanation: no substring of length 3 appears twice. "cd" (first at index 0) and "ab" (first at
  index 2) both appear twice, and "cd" appears first.
  ```

  ### Example 3
  ```
  Input:  s = "abcab", k = 3
  Output: ""
  ```

  ### Constraints
  - `1 <= s.length <= 2 * 10^4`
  - `2 <= k <= 2 * 10^4` (`k` may exceed `s.length`)
  - `s` consists of lowercase English letters only.

  **Follow-up:** counting every substring of every length is far too slow at the upper limit. Aim for
  roughly `O(n log n)` expected time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_repeated_log_fragment
  params:
    - {name: s, type: string}
    - {name: k, type: int}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def longest_repeated_log_fragment(s: str, k: int) -> str:
        n = len(s)
        mod1, mod2, base = 1_000_000_007, 998_244_353, 131

        def earliest_start(length: int) -> int:
            """Smallest first start of a window of this length seen at least k times, or -1."""
            power1, power2 = pow(base, length, mod1), pow(base, length, mod2)
            h1 = h2 = 0
            first: dict[tuple[int, int], int] = {}
            count: dict[tuple[int, int], int] = {}
            best = -1
            for i, ch in enumerate(s):
                h1 = (h1 * base + ord(ch)) % mod1
                h2 = (h2 * base + ord(ch)) % mod2
                if i >= length:
                    old = ord(s[i - length])
                    h1 = (h1 - old * power1) % mod1
                    h2 = (h2 - old * power2) % mod2
                if i >= length - 1:
                    key = (h1, h2)
                    if key not in first:
                        first[key] = i - length + 1
                    count[key] = count.get(key, 0) + 1
                    if count[key] == k and (best == -1 or first[key] < best):
                        best = first[key]
            return best

        # A window seen k times at length L means its prefixes are seen k times at every shorter length.
        low, high = 1, n - k + 1
        best_len, best_start = 0, -1
        while low <= high:
            mid = (low + high) // 2
            start = earliest_start(mid)
            if start >= 0:
                best_len, best_start, low = mid, start, mid + 1
            else:
                high = mid - 1
        return s[best_start:best_start + best_len] if best_len else ""
  javascript: |
    function longestRepeatedLogFragment(s, k) {
      const n = s.length;
      const mod1 = 1000000007;
      const mod2 = 998244353;
      const base = 131;

      function earliestStart(length) {
        let power1 = 1;
        let power2 = 1;
        for (let i = 0; i < length; i++) {
          power1 = (power1 * base) % mod1;
          power2 = (power2 * base) % mod2;
        }
        let h1 = 0;
        let h2 = 0;
        const first = new Map();
        const count = new Map();
        let best = -1;
        for (let i = 0; i < n; i++) {
          const code = s.charCodeAt(i);
          h1 = (h1 * base + code) % mod1;
          h2 = (h2 * base + code) % mod2;
          if (i >= length) {
            const old = s.charCodeAt(i - length);
            h1 = (((h1 - old * power1) % mod1) + mod1) % mod1;
            h2 = (((h2 - old * power2) % mod2) + mod2) % mod2;
          }
          if (i >= length - 1) {
            const key = h1 + ':' + h2;
            if (!first.has(key)) first.set(key, i - length + 1);
            const c = (count.get(key) || 0) + 1;
            count.set(key, c);
            if (c === k && (best === -1 || first.get(key) < best)) best = first.get(key);
          }
        }
        return best;
      }

      let low = 1;
      let high = n - k + 1;
      let bestLen = 0;
      let bestStart = -1;
      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        const start = earliestStart(mid);
        if (start >= 0) {
          bestLen = mid;
          bestStart = start;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }
      return bestLen > 0 ? s.slice(bestStart, bestStart + bestLen) : '';
    }
tests:
  - {id: t1, args: ["aaaaa", 3], expected: "aaa", description: "Example 1 - overlapping appearances"}
  - {id: t2, args: ["cdabxabycd", 2], expected: "cd", description: "Example 2 - tie on length broken by earliest first appearance"}
  - {id: t3, args: ["abcab", 3], expected: "", description: "Example 3 - nothing appears k times"}
  - {id: t4, hidden: true, args: ["q", 2], expected: "", description: "Minimum length - nothing can repeat"}
  - {id: t5, hidden: true, args: ["zz", 2], expected: "z", description: "Two equal characters - answer of length 1"}
  - {id: t6, hidden: true, args: ["aaaa", 4], expected: "a", description: "k equals the length - only single characters qualify"}
  - {id: t7, hidden: true, args: ["abc", 5], expected: "", description: "k larger than the string - empty answer without errors"}
  - {id: t8, hidden: true, args: ["abababab", 3], expected: "abab", description: "Overlapping periodic pattern - abab starts at 0, 2 and 4"}
  - {id: t9, hidden: true, args: ["zmabzmpqab", 2], expected: "zm", description: "Tie where the later fragment is alphabetically smaller - earliest must win"}
  - {id: t10, hidden: true, args: ["abxyxyab", 2], expected: "ab", description: "Tie where the later fragment reaches k first - earliest first appearance must win"}
  - {id: t11, hidden: true, args: ["", 3], expected: "deployrollbackcanary", description: "1000 characters with a planted 20-character fragment three times - needs better than cubic time"}
expected_concepts:
  - "monotonic property: a substring seen k times at length L has a prefix seen k times at every shorter length"
  - binary search on the fragment length between 1 and n - k + 1
  - rolling (Rabin-Karp) hash with a count and first start per window
  - collision awareness (double hashing or verifying candidate windows)
  - tie-breaking by the earliest first appearance rather than the first window to reach k
  - suffix array with LCP over sliding groups of k suffixes as a deterministic alternative
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: States the monotonic property, binary searches the length with an O(n) rolling-hash pass that tracks a count and first start per window, handles overlaps, collisions and the earliest-first-appearance tie-break correctly and explains the n - k + 1 upper bound; may sketch the suffix array alternative.
  good: Correct binary search with a substring-keyed map per length (slicing each window, O(n L) per check) or a rolling hash with minor issues in the tie-break or collision handling.
  weak: Counts every substring of every length (cubic or worse), ignores overlapping appearances, or returns the first window whose count reaches k instead of the one that appears earliest.
  criteria:
    correctness: All tests pass, including overlapping appearances, k larger than the log, and ties on length.
    efficiency: O(n log n) expected time via binary search and one linear rolling-hash pass per length.
    code_quality: The per-length check is a separate, well-named helper; modular arithmetic stays non-negative.
    edge_cases: Single-character logs, k equal to or above the length, all-equal characters, and ties where the later fragment is alphabetically smaller.
    communication: Explains why the search is valid and how hash collisions are made negligible or verified.
hints:
  - If some fragment of length L appears k times, what can you say about fragments of length L minus one?
  - That property lets you search on the length; what remains is deciding quickly, for one fixed length, whether any window of that length appears k times and which such window appears first.
  - For a fixed length, slide a polynomial rolling hash across the string and keep, per hash, a counter and the index where it first appeared (two moduli make collisions negligible). Among hashes whose counter reaches k, keep the smallest first index; binary search the length from 1 up to n - k + 1.
followups:
  - How would you solve this deterministically with a suffix array and an LCP array?
  - What changes if appearances are not allowed to overlap?
  - How would you report every fragment of the best length together with its count?
  - How would you process an unbounded stream where only the last W events are kept?
common_errors:
  - Returning the window whose counter reaches k first, which is not necessarily the one that appears earliest.
  - Ignoring overlapping appearances, for example counting "aa" only twice in "aaaa".
  - Taking the remainder of a negative number when removing the outgoing character in languages where it stays negative.
  - Searching lengths beyond n - k + 1 or failing when k exceeds the string length.
