version: 1
slug: next_release_codename
title: "Next Release Codename"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, frontend, backend, mobile]
time_limit_minutes: 12
prompt_markdown: |
  ## Next Release Codename

  A mobile team names each release after an entry in a shared codename list, `codenames`, kept sorted in
  **ascending** string order (plain character-by-character comparison of lowercase letters, so `"oak"`
  comes before `"oaks"` and `"oaks"` before `"pine"`). The list is maintained by several people, so a
  codename can appear more than once.

  Given the codename of the `current` release, return the **first codename in the list that is strictly
  greater than `current`** in string order. `current` does not have to be in the list. If no codename is
  greater than `current`, the naming wraps around: return the first codename in the list, `codenames[0]`.

  Aim for `O(log n)` string comparisons.

  ### Example 1
  ```
  Input:  codenames = ["aspen", "birch", "cedar", "maple"], current = "birch"
  Output: "cedar"
  Explanation: cedar is the first codename after birch.
  ```

  ### Example 2
  ```
  Input:  codenames = ["delta", "delta", "delta", "echo", "foxtrot"], current = "delta"
  Output: "echo"
  Explanation: Every copy of delta is not strictly greater, so the answer is echo.
  ```

  ### Example 3
  ```
  Input:  codenames = ["aspen", "birch", "cedar"], current = "zinnia"
  Output: "aspen"
  Explanation: Nothing comes after zinnia, so naming wraps to the first codename.
  ```

  ### Constraints
  - `1 <= codenames.length <= 10^5`
  - `1 <= codenames[i].length, current.length <= 20`
  - All strings consist of lowercase English letters `a`-`z` only.
  - `codenames` is sorted in non-decreasing order and may contain duplicates.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: next_release_codename
  params:
    - {name: codenames, type: "string[]"}
    - {name: current, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def next_release_codename(codenames: list[str], current: str) -> str:
        low, high = 0, len(codenames)
        while low < high:  # first index with codenames[i] > current (upper bound)
            mid = (low + high) // 2
            if codenames[mid] <= current:
                low = mid + 1
            else:
                high = mid
        return codenames[low] if low < len(codenames) else codenames[0]
  javascript: |
    function nextReleaseCodename(codenames, current) {
      let low = 0;
      let high = codenames.length;
      while (low < high) {
        const mid = (low + high) >> 1;
        if (codenames[mid] <= current) low = mid + 1;
        else high = mid;
      }
      return low < codenames.length ? codenames[low] : codenames[0];
    }
tests:
  - {id: t1, args: [["aspen", "birch", "cedar", "maple"], "birch"], expected: "cedar", description: "Example 1"}
  - {id: t2, args: [["delta", "delta", "delta", "echo", "foxtrot"], "delta"], expected: "echo", description: "Example 2 - duplicates of current are skipped"}
  - {id: t3, args: [["aspen", "birch", "cedar"], "zinnia"], expected: "aspen", description: "Example 3 - wrap around"}
  - {id: t4, hidden: true, args: [["kiwi"], "kiwi"], expected: "kiwi", description: "Single codename equal to current wraps to itself"}
  - {id: t5, hidden: true, args: [["kiwi"], "apple"], expected: "kiwi", description: "Single codename greater than current"}
  - {id: t6, hidden: true, args: [["lark", "lark", "lark"], "lark"], expected: "lark", description: "All duplicates equal to current; wrap to the first"}
  - {id: t7, hidden: true, args: [["app", "apple", "apples", "apply"], "app"], expected: "apple", description: "Prefix relationship: apple is greater than app"}
  - {id: t8, hidden: true, args: [["app", "apple", "apples", "apply"], "applf"], expected: "apply", description: "current not in list; applf sorts after apple and apples, so the answer is apply"}
  - {id: t9, hidden: true, args: [["bravo", "charlie", "delta"], "a"], expected: "bravo", description: "current smaller than every codename returns the first"}
  - {id: t10, hidden: true, args: [["alpha", "beta", "gamma", "gamma", "omega", "omega"], "omega"], expected: "alpha", description: "Duplicates at the end equal to current; must wrap rather than return an omega"}
  - {id: t11, hidden: true, args: [["aaaaaaaaaaaaaaaaaaay", "aaaaaaaaaaaaaaaaaaaz", "b"], "aaaaaaaaaaaaaaaaaaaa"], expected: "aaaaaaaaaaaaaaaaaaay", description: "Maximum-length strings that differ only in the last character"}
expected_concepts:
  - "upper-bound binary search (first element strictly greater)"
  - "lexicographic string comparison"
  - "wrap-around when the bound reaches the end"
  - "handling duplicates without a linear scan"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Implements an upper-bound binary search that skips every duplicate of current in logarithmic time, wraps to the first codename when the bound is past the end, and explains the difference from a lower bound."
  good: "Correct search with a small fix for duplicates or the wrap-around after testing."
  weak: "Finds current and returns the next index (wrong for duplicates or when current is absent), scans linearly, or forgets the wrap-around."
  criteria:
    correctness: "All tests pass, including duplicates, prefixes and wrap-around."
    efficiency: "Logarithmic number of string comparisons."
    code_quality: "One clean binary search with a half-open range and a single wrap-around expression."
    edge_cases: "Single-element lists, all duplicates and current outside the list's range."
    communication: "States whether the search is a lower or an upper bound and why."
hints:
  - "Finding current in the list and stepping forward does not work in every case. Which cases break it?"
  - "You want the first position whose codename is strictly greater than current. Every position before it holds a codename that is less than or equal to current, which is a yes/no condition that flips only once."
  - "Binary search a half-open range over the list: if the middle codename is less than or equal to current, move the low end past it, otherwise move the high end to it. When the range closes, return the codename at the low end, or the first codename if the low end equals the list length."
followups:
  - "How would you return the previous codename instead, also wrapping around?"
  - "What changes if codenames can contain uppercase letters and the order should ignore case?"
  - "How would you find how many times current appears in the list in O(log n)?"
  - "How would you keep the list sorted when new codenames are added frequently?"
common_errors:
  - "Using a lower bound (greater than or equal), which returns current itself when it is in the list."
  - "Returning the element right after the first match of current, which is a duplicate of current."
  - "Forgetting the wrap-around and indexing past the end of the list."
  - "Comparing strings by length first instead of lexicographically."
