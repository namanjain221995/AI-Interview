reference_solutions:
  python: |
    import math


    def min_max_charging_gap(stations: list[int], k: int) -> float:
        gaps = [b - a for a, b in zip(stations, stations[1:])]

        def added_needed(limit: float) -> int:
            # A gap of length d cut into pieces of at most `limit` needs ceil(d / limit) - 1 new stations.
            return sum(math.ceil(d / limit) - 1 for d in gaps)

        low, high = 0.0, float(max(gaps))  # high is always achievable, low never is
        for _ in range(100):
            mid = (low + high) / 2
            if added_needed(mid) <= k:
                high = mid
            else:
                low = mid
        return high
  javascript: |
    function minMaxChargingGap(stations, k) {
      const gaps = [];
      for (let i = 1; i < stations.length; i++) gaps.push(stations[i] - stations[i - 1]);

      function addedNeeded(limit) {
        let total = 0;
        for (const d of gaps) total += Math.ceil(d / limit) - 1;
        return total;
      }

      let low = 0;
      let high = Math.max(...gaps); // high is always achievable, low never is
      for (let iter = 0; iter < 100; iter++) {
        const mid = (low + high) / 2;
        if (addedNeeded(mid) <= k) high = mid;
        else low = mid;
      }
      return high;
    }
