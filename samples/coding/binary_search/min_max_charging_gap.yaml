expected_concepts:
  - "monotonic feasibility: if a longest stretch g is achievable, every larger value is too"
  - binary search on a real-valued answer with a fixed iteration count or precision bound
  - "per-gap counting: a gap of length d needs ceil(d / g) - 1 extra stations"
  - why greedily filling the current longest piece is O(k log n) and too slow for large k
  - floating-point precision and termination of the search
optimal_complexity: {time: O(n log(maxGap / epsilon)), space: O(1)}
rubric:
  excellent: Recognises the monotonic feasibility check, binary searches the real-valued stretch with a sound termination rule, counts ceil(d / g) - 1 per gap in O(n), explains why the greedy heap is too slow for k up to 10^6 and states O(n log(range / epsilon)).
  good: Reaches the binary search with a correct per-gap count but needs prompting on the termination rule or precision, or first implements the heap greedy and then improves it.
  weak: Distributes stations evenly across all gaps or proportionally without a feasibility argument, uses the heap greedy only (times out for large k) or searches only integer answers.
  criteria:
    correctness: All tests pass within tolerance, including k = 0, equal gaps and a fractional optimum.
    efficiency: O(n) per feasibility check and a bounded number of iterations independent of k.
    code_quality: The feasibility count is a separate helper with clear names; the search bounds are justified.
    edge_cases: Two stations, k = 0, equal gaps where extra stations do not help, very large k and very large gaps.
    communication: Explains the monotonic property and why the search converges to within the tolerance.
hints:
  - Instead of deciding where each new station goes, ask the reverse question - if you insist that no stretch is longer than some value g, how many new stations would that require?
  - That count only grows as g shrinks, so you can search for the smallest g whose required count fits in the budget; g is a real number, so think about how to stop the search.
  - For a candidate g, each existing gap of length d needs ceil(d / g) - 1 extra stations; sum this over the gaps and compare with k. Bisect g between 0 and the current longest gap for a fixed number of rounds (around 100), keeping the upper end as the best feasible value.
followups:
  - How would you return the actual positions of the new stations for the optimal value?
  - What changes if new stations may only be placed at integer kilometre markers?
  - How would a priority-queue greedy work, and when is it the better choice?
  - How would you handle a circular route where the last station also neighbours the first?
common_errors:
  - Using integer division or an integer search space, which cannot represent answers such as 10/3.
  - Counting ceil(d / g) instead of ceil(d / g) - 1 stations per gap.
  - Looping until high - low is below a fixed epsilon that is smaller than floating-point resolution for large values, so the loop never ends.
  - Spreading the k stations evenly across gaps instead of where they reduce the maximum.
