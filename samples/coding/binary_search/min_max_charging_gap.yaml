prompt_markdown: |
  ## Minimise the Largest Charging-Station Gap

  An infrastructure planner is reviewing an electric-vehicle corridor. The existing charging stations
  sit at the integer kilometre markers in `stations`, listed in **strictly increasing** order. The
  budget covers exactly `k` additional stations, and each new one may be placed at **any real-valued
  position** between the first and the last existing station (several may share a stretch).

  The quality of a layout is its **longest stretch**: the largest distance between two neighbouring
  stations once the new ones are added. Return the smallest longest stretch that can be achieved.

  - Using fewer than `k` new stations is allowed, so the answer never exceeds the current longest gap.
  - With `k = 0` the answer is simply the current longest gap.
  - Your answer is accepted if it is within `10^-6` of the exact value (relative for values above 1).

  ### Example 1
  ```
  Input:  stations = [0, 10, 14], k = 2
  Output: 4.0
  Explanation: new stations at 4 and 8 cut the 10 km stretch into pieces of 4, 4 and 2, and the
  stretch from 10 to 14 is already 4 long. Going below 4 would need one station in the 4 km stretch plus
  two in the 10 km stretch, which is three.
  ```

  ### Example 2
  ```
  Input:  stations = [3, 9], k = 3
  Output: 1.5
  Explanation: three evenly spaced stations split the 6 km stretch into four pieces of 1.5 km.
  ```

  ### Example 3
  ```
  Input:  stations = [2, 5, 20], k = 0
  Output: 15.0
  ```

  ### Constraints
  - `2 <= stations.length <= 2000`
  - `0 <= stations[i] <= 10^8`, strictly increasing
  - `0 <= k <= 10^6`

  **Follow-up:** placing stations one at a time into the currently longest piece is easy to reason
  about but slow when `k` is large. Can you make the running time depend on the precision instead
  of on `k`?
languages: [python, javascript, typescript, java, go, cpp]
