expected_concepts:
  - "the total allocation is non-decreasing in the cap"
  - "binary search over the answer space from 0 to the largest request"
  - "compare the boundary cap with the one just below it for closeness"
  - "tie-breaking toward the smaller cap"
  - "alternative: sort plus prefix sums"
optimal_complexity: {time: "O(n log M) where M is the largest request (or O(n log n) with sorting and prefix sums)", space: "O(1)"}
rubric:
  excellent: "Observes that the allocation grows with the cap, binary searches the first cap that reaches the budget, compares it with the cap below for the closest total with the smaller-cap tie rule, and states the complexity."
  good: "Reaches a correct binary search or sorted prefix-sum solution with some prompting on the tie or the cap upper bound."
  weak: "Tries every cap up to the largest request without noticing monotonicity, or returns the first cap that exceeds the budget without comparing neighbours."
  criteria:
    correctness: "All tests pass, including ties, a zero budget and a budget above the total requested."
    efficiency: "O(n log M) via binary search on the cap, or O(n log n) with sorting."
    code_quality: "A small helper for the allocation at a given cap and a clear final comparison."
    edge_cases: "Handles a budget of 0, budgets smaller than the team count and budgets that fund every request."
    communication: "Justifies the search range and explains why only two candidate caps need comparing."
hints:
  - "Think about how the total allocation changes as the cap goes up by one: can it ever go down?"
  - "Because the total only grows with the cap, you can binary search for the first cap where the total reaches the budget instead of trying every cap."
  - "Binary search between zero and the largest request for the smallest cap whose total is at least the budget, then compare that cap with the one just below it and keep whichever is closer, preferring the lower cap on a tie."
followups:
  - "How would you solve it in O(n log n) with sorting and prefix sums, without searching over cap values?"
  - "What if the cap could be any real number instead of an integer?"
  - "How would you handle a minimum guaranteed amount per team in addition to the cap?"
common_errors:
  - "Returning the first cap whose total is at least the budget without checking whether the cap below is closer."
  - "Breaking ties toward the larger cap."
  - "Searching above the largest request, which returns a cap bigger than any request when the budget covers everything."
  - "Ignoring a cap of 0 as a valid answer."
