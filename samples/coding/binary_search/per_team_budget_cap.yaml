slug: per_team_budget_cap
title: "Per-Team Budget Cap"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [engineering_manager, data_analyst, backend, cloud]
time_limit_minutes: 20
prompt_markdown: |
  ## Per-Team Budget Cap

  Finance has to trim next quarter's cloud spend. Each engineering team has submitted a request,
  `requests[i]` (in thousands of dollars). Instead of negotiating with every team, finance will choose one
  integer cap `c >= 0`: team `i` receives `min(requests[i], c)`, so teams at or under the cap get what they
  asked for and every other team gets exactly `c`.

  Return the cap `c` that makes the **total allocation** as close as possible to `budget` (smallest absolute
  difference). If several caps are equally close, return the **smallest** of them. Note that raising the
  cap above the largest request changes nothing, so the tie rule never lets the answer exceed the largest
  request.

  ### Example 1
  ```
  Input:  requests = [40, 10, 25, 60], budget = 100
  Output: 32
  Explanation: a cap of 32 allocates 32 + 10 + 25 + 32 = 99 and a cap of 33 allocates 101. Both are 1
               away from 100, so the smaller cap wins.
  ```

  ### Example 2
  ```
  Input:  requests = [7, 7, 7], budget = 10
  Output: 3
  Explanation: a cap of 3 allocates 9 (1 short) while a cap of 4 allocates 12 (2 over).
  ```

  ### Example 3
  ```
  Input:  requests = [5, 9, 3], budget = 100
  Output: 9
  Explanation: every cap of 9 or more allocates the full 17; 9 is the smallest of them.
  ```

  ### Constraints
  - `1 <= requests.length <= 10^4`
  - `1 <= requests[i] <= 10^5`
  - `0 <= budget <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: per_team_budget_cap
  params:
    - {name: requests, type: "int[]"}
    - {name: budget, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def per_team_budget_cap(requests: list[int], budget: int) -> int:
        def allocated(cap: int) -> int:
            return sum(min(request, cap) for request in requests)

        # smallest cap in [0, max(requests)] whose allocation reaches the budget
        lo, hi = 0, max(requests)
        while lo < hi:
            mid = (lo + hi) // 2
            if allocated(mid) >= budget:
                hi = mid
            else:
                lo = mid + 1
        if lo > 0 and abs(allocated(lo - 1) - budget) <= abs(allocated(lo) - budget):
            return lo - 1
        return lo
  javascript: |
    function perTeamBudgetCap(requests, budget) {
      const allocated = (cap) => {
        let total = 0;
        for (const request of requests) total += Math.min(request, cap);
        return total;
      };
      let lo = 0;
      let hi = requests.reduce((a, b) => Math.max(a, b), 0);
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (allocated(mid) >= budget) hi = mid;
        else lo = mid + 1;
      }
      if (lo > 0 && Math.abs(allocated(lo - 1) - budget) <= Math.abs(allocated(lo) - budget)) return lo - 1;
      return lo;
    }
