slug: shelf_grid_contains
title: "Warehouse Shelf Grid Lookup"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, fullstack]
time_limit_minutes: 12
prompt_markdown: |
  ## Warehouse Shelf Grid Lookup

  A warehouse stores products on a wall of shelves with `m` rows and `n` bins per row. The SKU number in
  each bin is recorded in `grid`, where `grid[r][c]` is the SKU in row `r`, bin `c`.

  Stock was put away in order, so the layout has two properties:

  - Every row is sorted in **strictly ascending** order from left to right.
  - The first SKU of every row is **greater** than the last SKU of the row above it.

  A picker asks whether a given `sku` is stocked anywhere on the wall. Return `true` if `sku` appears in
  `grid` and `false` otherwise. Aim for `O(log(m * n))` time.

  ### Example 1
  ```
  Input:  grid = [[101, 104, 109], [120, 133, 140], [152, 160, 171]], sku = 133
  Output: true
  Explanation: 133 is stocked in row 1, bin 1.
  ```

  ### Example 2
  ```
  Input:  grid = [[101, 104, 109], [120, 133, 140], [152, 160, 171]], sku = 115
  Output: false
  Explanation: 115 is larger than every SKU in row 0 and smaller than every SKU in row 1.
  ```

  ### Constraints
  - `1 <= m, n <= 300` (every row has the same length `n`)
  - `0 <= grid[r][c], sku <= 10^9`
  - Rows are strictly ascending, and each row starts above the previous row's last value.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shelf_grid_contains
  params:
    - {name: grid, type: "int[][]"}
    - {name: sku, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def shelf_grid_contains(grid: list[list[int]], sku: int) -> bool:
        rows, cols = len(grid), len(grid[0])
        low, high = 0, rows * cols - 1
        while low <= high:
            mid = (low + high) // 2
            value = grid[mid // cols][mid % cols]  # flattened index -> (row, column)
            if value == sku:
                return True
            if value < sku:
                low = mid + 1
            else:
                high = mid - 1
        return False
  javascript: |
    function shelfGridContains(grid, sku) {
      const rows = grid.length;
      const cols = grid[0].length;
      let low = 0;
      let high = rows * cols - 1;
      while (low <= high) {
        const mid = (low + high) >> 1;
        const value = grid[Math.floor(mid / cols)][mid % cols];
        if (value === sku) return true;
        if (value < sku) low = mid + 1;
        else high = mid - 1;
      }
      return false;
    }
