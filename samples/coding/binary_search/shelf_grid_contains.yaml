  - "O(log(m*n)) versus searching row by row"
optimal_complexity: {time: "O(log(m * n))", space: "O(1)"}
rubric:
  excellent: "Recognises that the layout is one sorted sequence in row-major order, runs a single binary search over flat indices with index-to-row/column conversion, and states O(log(m*n)) time and O(1) space."
  good: "Two binary searches (first the row, then within the row) that are correct, or the flattened search after a hint."
  weak: "Scans every bin or every row linearly, copies the grid into a new list first, or mixes up rows and columns when converting the index."
  criteria:
    correctness: "All tests pass, including single-row, single-column and gap cases."
    efficiency: "Logarithmic in the number of bins without copying the grid."
    code_quality: "Clear names for rows, cols and the flat index; the conversion is computed in one place."
    edge_cases: "1x1 grids, SKUs outside the stocked range and SKUs that fall between rows."
    communication: "Explains why the row-boundary property makes the flattened view sorted."
hints:
  - "Read the bins row by row, left to right, as if they were written on one long line. What do you notice about that sequence?"
  - "The whole wall is one sorted list in row-major order. You can binary search it directly if you can turn a position in that imaginary list back into a row and a bin."
  - "Binary search positions from zero to rows times columns minus one. For a middle position, the row is the position divided by the number of columns and the bin is the remainder. Compare that SKU with the target and move the low or high end as in a normal exact-match binary search."
followups:
  - "What changes if each row and each column is sorted, but rows do not continue from the previous row?"
  - "How would you return the position of the smallest SKU that is at least the requested one?"
  - "Could the flat index overflow for a much larger grid in a typed language? How would you avoid it?"
  - "How would you answer many lookups if the wall were restocked rarely?"
common_errors:
  - "Dividing the flat index by the number of rows instead of the number of columns."
  - "Searching only the first column to pick a row and then forgetting the row-gap case."
  - "Flattening the grid into a new list, which costs O(m*n) time and memory."
  - "Using low < high with high = mid - 1, which skips the last candidate."
