time_limit_minutes: 15
prompt_markdown: |
  ## Count Sensor Readings in Bands

  A plant monitoring job stores one day of temperature `readings` from a sensor, sorted in
  **non-decreasing** order; readings can repeat and can be negative. Analysts send a batch of `queries`,
  each a band `[low, high]` with `low <= high`.

  For every query, count the readings `r` with `low <= r <= high` (both ends inclusive). Return the
  counts in the **same order as the queries**. With many queries, each one should cost `O(log n)`
  rather than a scan of all readings.

  ### Example 1
  ```
  Input:  readings = [-5, -2, 0, 0, 3, 3, 3, 8, 12], queries = [[0, 3], [-10, -3], [4, 7], [3, 3]]
  Output: [5, 1, 0, 3]
  Explanation: [0, 3] holds 0, 0, 3, 3, 3; [-10, -3] holds -5; nothing lies in [4, 7]; [3, 3] holds the three 3s.
  ```

  ### Example 2
  ```
  Input:  readings = [10, 20, 30], queries = [[5, 35], [31, 100], [20, 29]]
  Output: [3, 0, 1]
  ```

  ### Constraints
  - `0 <= readings.length <= 10^5`
  - `0 <= queries.length <= 10^5`
  - `-10^9 <= readings[i] <= 10^9`, sorted in non-decreasing order
  - `queries[j].length == 2` and `-10^9 <= queries[j][0] <= queries[j][1] <= 10^9`

  **Follow-up:** How would you answer the same queries if readings kept arriving throughout the day?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_readings_in_bands
  params:
    - {name: readings, type: "int[]"}
    - {name: queries, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def count_readings_in_bands(readings: list[int], queries: list[list[int]]) -> list[int]:
        def first_at_least(value: int) -> int:
            low, high = 0, len(readings)
            while low < high:
                mid = (low + high) // 2
                if readings[mid] < value:
                    low = mid + 1
                else:
                    high = mid
            return low

        def first_greater(value: int) -> int:
            low, high = 0, len(readings)
            while low < high:
                mid = (low + high) // 2
                if readings[mid] <= value:
                    low = mid + 1
                else:
                    high = mid
            return low

        return [first_greater(high) - first_at_least(low) for low, high in queries]
  javascript: |
    function countReadingsInBands(readings, queries) {
      const firstAtLeast = (value) => {
        let low = 0;
        let high = readings.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (readings[mid] < value) low = mid + 1;
          else high = mid;
        }
        return low;
      };
      const firstGreater = (value) => {
        let low = 0;
        let high = readings.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (readings[mid] <= value) low = mid + 1;
          else high = mid;
        }
        return low;
      };
      return queries.map(([lo, hi]) => firstGreater(hi) - firstAtLeast(lo));
    }
