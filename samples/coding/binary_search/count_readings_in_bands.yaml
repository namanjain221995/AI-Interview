expected_concepts:
  - "lower bound and upper bound binary search"
  - "count in range as upper bound minus lower bound"
  - "inclusive versus exclusive boundaries with duplicates"
  - "O(q log n) instead of O(q n)"
optimal_complexity: {time: "O(q log n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Reduces each band to two boundary searches (first reading >= low and first reading > high), subtracts them, gets duplicates and inclusive ends right on the first try and states O(q log n) time."
  good: "Correct boundary searches with a small fix needed for duplicates or inclusive ends; complexity stated correctly."
  weak: "Scans all readings per query, counts only one copy of duplicate values, or excludes readings equal to high."
  criteria:
    correctness: "All tests pass, including empty inputs, duplicates on band edges and bands outside the data."
    efficiency: "Two O(log n) searches per query."
    code_quality: "One reusable helper (or two clearly named ones) instead of duplicated search loops with subtle differences."
    edge_cases: "Empty readings or queries, single-point bands, extreme values."
    communication: "Explains why upper bound minus lower bound equals the count of values in an inclusive range."
hints:
  - "In a sorted array, all readings inside a band form one contiguous block, so you only need to find where that block starts and ends."
  - "Find the first position holding a value of at least low and the first position holding a value strictly greater than high; both can be found with binary search."
  - "Write a search that returns the first index whose reading is >= a value (or > a value for the second bound); the count for a band is first index > high minus first index >= low, appended in query order."
followups:
  - "How would you support bands with exclusive ends, such as low < r < high?"
  - "If there were millions of queries but only a few hundred distinct reading values, what would you precompute?"
  - "How would you report the average reading in each band?"
  - "What standard library functions implement these two searches in Python, C++ and Java?"
common_errors:
  - "Using the same comparison for both searches, which drops readings equal to high."
  - "Searching for low exactly and failing when low is not present in the array."
  - "Looping over all readings for every query, giving O(q n) time."
  - "Sorting the queries and returning counts in the wrong order."
