expected_concepts:
  - "lower-bound binary search (first element >= target)"
  - "parsing version strings into numeric components"
  - "tuple or component-wise comparison instead of string comparison"
  - "handling the not-found case without reading past the end"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Separates parsing from searching with a small comparison helper, implements a lower-bound binary search with a clean half-open range, returns the empty string when the bound lands past the end and explains why string comparison is wrong."
  good: "Correct numeric comparison and a working binary search, possibly after fixing an off-by-one, or a correct linear scan improved to logarithmic time with prompting."
  weak: "Compares version strings as text, returns the last release below the minimum, or crashes on an empty list."
  criteria:
    correctness: "All tests pass, including multi-digit components and the not-found case."
    efficiency: "O(log n) version comparisons, parsing only the versions that are compared."
    code_quality: "A dedicated parse or compare helper; the binary search itself stays short and readable."
    edge_cases: "Empty registry, exact match, minimum below or above every release."
    communication: "Points out the 1.10.0 versus 1.9.3 trap before coding."
hints:
  - "Before thinking about searching, decide how you would tell which of two version strings is newer. Is comparing them as text good enough?"
  - "Turn each version into three numbers and compare them left to right. Since the list is sorted by that order, you are looking for the first position whose version is not older than the minimum."
  - "Run a lower-bound binary search over a half-open range from zero to the list length: if the middle release is older than the minimum, move the low end past it, otherwise pull the high end down to it. When the range closes, the low index is the answer, or the empty string if it equals the list length."
followups:
  - "How would you support pre-release tags such as 2.0.0-rc.1 that sort before 2.0.0?"
  - "How would you return the newest release that is still below the next major version (a caret range)?"
  - "Would you pre-parse all versions once if the same list is queried many times? What does that cost?"
  - "How would the search change if the registry listed releases newest first?"
common_errors:
  - "Comparing versions as strings, so 1.10.0 sorts before 1.9.3."
  - "Using an upper bound and skipping a release equal to the minimum."
  - "Indexing releases[low] when low equals the list length."
  - "Comparing only the major version or summing the components."
