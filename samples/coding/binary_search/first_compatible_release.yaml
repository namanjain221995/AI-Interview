slug: first_compatible_release
title: "First Compatible Release"
difficulty: easy
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [backend, devops, fullstack, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## First Compatible Release

  A dependency resolver must pick the oldest published release of a library that still satisfies a
  service's minimum version requirement.

  Each entry in `releases` is a version string `"MAJOR.MINOR.PATCH"` made of three non-negative integers
  without leading zeros. The list holds **distinct** versions sorted in **ascending version order**, where
  versions are compared component by component as **numbers**: `1.10.0` is newer than `1.9.3`, even though
  it sorts earlier as plain text.

  Given `minimum` in the same format, return the **first** (oldest) release that is greater than or equal
  to `minimum`. If no release qualifies, return the empty string `""`.

  The registry can hold many thousands of releases, so aim for `O(log n)` version comparisons.

  ### Example 1
  ```
  Input:  releases = ["1.2.0", "1.9.3", "1.10.0", "2.0.0"], minimum = "1.9.4"
  Output: "1.10.0"
  Explanation: 1.9.3 is too old; 1.10.0 is the oldest release at or above 1.9.4.
  ```

  ### Example 2
  ```
  Input:  releases = ["0.9.1", "1.0.0", "1.0.7"], minimum = "1.0.0"
  Output: "1.0.0"
  Explanation: A release equal to the minimum satisfies the requirement.
  ```

  ### Example 3
  ```
  Input:  releases = ["3.1.4", "3.2.0"], minimum = "4.0.0"
  Output: ""
  Explanation: Every release is older than 4.0.0.
  ```

  ### Constraints
  - `0 <= releases.length <= 10^5`
  - Every version has exactly three components, each an integer in `[0, 10^6]` written without leading zeros.
  - `releases` is strictly increasing in numeric version order.
  - `minimum` has the same format; it may or may not appear in `releases`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_compatible_release
  params:
    - {name: releases, type: "string[]"}
    - {name: minimum, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def first_compatible_release(releases: list[str], minimum: str) -> str:
        def key(version: str) -> tuple[int, int, int]:
            major, minor, patch = version.split(".")
            return int(major), int(minor), int(patch)

        target = key(minimum)
        low, high = 0, len(releases)
        while low < high:
            mid = (low + high) // 2
            if key(releases[mid]) < target:
                low = mid + 1
            else:
                high = mid
        return releases[low] if low < len(releases) else ""
  javascript: |
    function firstCompatibleRelease(releases, minimum) {
      const key = (v) => v.split(".").map(Number);
      const compare = (a, b) => {
        for (let i = 0; i < 3; i++) {
          if (a[i] !== b[i]) return a[i] - b[i];
        }
        return 0;
      };
      const target = key(minimum);
      let low = 0;
      let high = releases.length;
      while (low < high) {
        const mid = (low + high) >> 1;
        if (compare(key(releases[mid]), target) < 0) low = mid + 1;
        else high = mid;
      }
      return low < releases.length ? releases[low] : "";
    }
