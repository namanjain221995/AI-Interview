expected_concepts:
  - binary search on the answer (the largest length that is still feasible)
  - counting pieces per spool with integer division
  - "an upper bound of max(spools) and 0 as the 'impossible' answer"
  - avoiding 32-bit overflow in the piece count
optimal_complexity: {time: O(n log(max(spools))), space: O(1)}
rubric:
  excellent: "Recognises that feasibility only gets harder as the length grows, binary searches the largest feasible length between 0 and max(spools) with an upward-rounded midpoint, guards the piece count against overflow and handles the impossible case cleanly."
  good: "Correct binary search with a minor off-by-one or overflow issue spotted and fixed during testing."
  weak: "Tries every length from the longest spool downward, divides the total length by count (ignoring the no-splicing rule), or loops forever on the boundary."
  criteria:
    correctness: "All tests pass, including the impossible case, a single spool and very large counts."
    efficiency: "O(n log M) where M is the longest spool; no linear scan over lengths."
    code_quality: "The feasibility check is a named helper and the search keeps 'lo is feasible' as an explicit invariant."
    edge_cases: "count larger than the total length, count = 1, one spool and spool lengths near 10^9."
    communication: "Explains why sum(spools) / count is only an upper bound and why the leftovers make it unreachable in general."
hints:
  - "If cables of length L give enough pieces, what can you say about cables of length L - 1? What about L + 1?"
  - "For one fixed length you can count the pieces directly: each spool gives floor(spool / L). So search over L instead of trying lengths one by one."
  - "Binary search L between 0 and the longest spool, keeping lo as a length that works (0 counts as the fallback): take mid rounded up, keep it if the piece count reaches count (stop summing as soon as it does), otherwise lower hi to mid - 1. Return lo when the range collapses."
followups:
  - "How would you also report how many cables each spool should produce?"
  - "What changes if each cut wastes 1 cm of fibre at the connector?"
  - "How would you handle lengths that may be fractional, to a precision of 0.1 cm?"
common_errors:
  - "Using sum(spools) // count as the answer, which ignores that pieces cannot be spliced across spools."
  - "Starting the search at 1 without a way to report 0 when no length works."
  - "Rounding the midpoint down with lo = mid, which loops forever when hi = lo + 1."
  - "Accumulating the piece count in a 32-bit integer, which overflows for short lengths on long spools."
