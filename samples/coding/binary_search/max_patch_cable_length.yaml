title: Longest Equal Patch Cables
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, devops, general, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Equal Patch Cables

  A data-centre technician is wiring a new row of racks and needs `count` fibre patch cables that are
  all **exactly the same whole length** (in centimetres). The storeroom has several spools of fibre:
  `spools[i]` is the length of spool `i`.

  Each cable must be cut from a single spool; two pieces can never be spliced together. A spool may
  yield several cables, and whatever is left over on a spool is thrown away.

  Return the **longest** whole cable length that still yields at least `count` cables. If even
  1 cm cables cannot produce `count` pieces, return `0`.

  ### Example 1
  ```
  Input:  spools = [230, 145, 410], count = 7
  Output: 102
  Explanation: 102 cm cables give 2 + 1 + 4 = 7 pieces. At 103 cm the spools give only 2 + 1 + 3 = 6.
  ```

  ### Example 2
  ```
  Input:  spools = [3, 4], count = 10
  Output: 0
  Explanation: Even 1 cm cables give only 7 pieces.
  ```

  ### Example 3
  ```
  Input:  spools = [90, 90], count = 6
  Output: 30
  ```

  ### Constraints
  - `1 <= spools.length <= 10^5`
  - `1 <= spools[i] <= 10^9`
  - `1 <= count <= 10^9`
  - The total number of pieces for a given length can exceed `2^31 - 1`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_patch_cable_length
  params:
    - {name: spools, type: "int[]"}
    - {name: count, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def max_patch_cable_length(spools: list[int], count: int) -> int:
        def enough(length: int) -> bool:
            pieces = 0
            for spool in spools:
                pieces += spool // length
                if pieces >= count:  # early exit keeps the running total small
                    return True
            return False

        # lo is always a length known to work (0 means "no valid length yet").
        lo, hi = 0, max(spools)
        while lo < hi:
            mid = lo + (hi - lo + 1) // 2  # round up so the range always shrinks
            if enough(mid):
                lo = mid
            else:
                hi = mid - 1
        return lo
  javascript: |
    function maxPatchCableLength(spools, count) {
      const enough = (length) => {
        let pieces = 0;
        for (const spool of spools) {
          pieces += Math.floor(spool / length);
          if (pieces >= count) return true;
        }
        return false;
      };
      let lo = 0;
      let hi = Math.max(...spools);
      while (lo < hi) {
        const mid = lo + Math.ceil((hi - lo) / 2);
        if (enough(mid)) lo = mid;
        else hi = mid - 1;
      }
      return lo;
    }
