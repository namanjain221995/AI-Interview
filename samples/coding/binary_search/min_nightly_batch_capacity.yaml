slug: min_nightly_batch_capacity
title: "Minimum Nightly Batch Capacity"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [data, backend, devops, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Minimum Nightly Batch Capacity

  A data warehouse runs a fixed chain of batch jobs: job `i` must finish before job `i + 1` starts, and
  `costs[i]` is the compute cost of job `i`. The whole chain has to finish within `nights` nights.

  Each night the scheduler runs the next few jobs of the chain, a **contiguous** run that continues where
  the previous night stopped. The total cost of the jobs run in one night may not exceed the warehouse's
  **nightly capacity**. A job cannot be split across nights, and nights may be left idle (finishing in
  fewer nights is fine).

  Return the **minimum nightly capacity** that lets the whole chain finish within `nights` nights.

  ### Example 1
  ```
  Input:  costs = [4, 8, 3, 6, 5, 2], nights = 3
  Output: 12
  Explanation: With capacity 12 the nights run [4, 8], [3, 6] and [5, 2]. With 11 the chain needs four nights.
  ```

  ### Example 2
  ```
  Input:  costs = [10, 2, 3], nights = 1
  Output: 15
  ```

  ### Example 3
  ```
  Input:  costs = [7, 1, 9, 3], nights = 4
  Output: 9
  Explanation: Each job can run on its own night, so the most expensive job decides.
  ```

  ### Constraints
  - `1 <= costs.length <= 10^5`
  - `1 <= costs[i] <= 10^9`
  - `1 <= nights <= 10^5`
  - The answer can exceed 32 bits, so it is returned as a 64-bit integer.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_nightly_batch_capacity
  params:
    - {name: costs, type: "int[]"}
    - {name: nights, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def min_nightly_batch_capacity(costs: list[int], nights: int) -> int:
        def nights_needed(capacity: int) -> int:
            used, load = 1, 0
            for cost in costs:
                if load + cost > capacity:
                    used += 1
                    load = 0
                load += cost
            return used

        lo, hi = max(costs), sum(costs)
        while lo < hi:
            mid = (lo + hi) // 2
            if nights_needed(mid) <= nights:
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function minNightlyBatchCapacity(costs, nights) {
      // Totals stay below 2^53, so plain numbers are exact here.
      const fits = (capacity) => {
        let used = 1;
        let load = 0;
        for (const c of costs) {
          if (load + c > capacity) {
            used += 1;
            load = 0;
            if (used > nights) return false;
          }
          load += c;
        }
        return true;
      };
      let lo = 0;
      let hi = 0;
      for (const c of costs) {
        lo = Math.max(lo, c);
        hi += c;
      }
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (fits(mid)) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
