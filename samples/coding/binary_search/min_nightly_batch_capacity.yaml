expected_concepts:
  - "binary search on the answer (capacity)"
  - "greedy feasibility check that packs each night as full as possible"
  - "bounds max(costs) and sum(costs)"
  - "monotonicity: a larger capacity never needs more nights"
  - "64-bit sums"
optimal_complexity: {time: "O(n log S), where S = sum(costs)", space: "O(1)"}
rubric:
  excellent: "Explains the monotonic feasibility, proves the greedy packing is optimal for a fixed capacity, binary searches between the largest job and the total with 64-bit arithmetic, and states O(n log S)."
  good: "Correct binary search with a greedy check after a hint about the bounds or the check, and correct complexity."
  weak: "Tries capacities one by one, uses a lower bound below the largest job, or attempts an exponential search over all splits."
  criteria:
    correctness: "All tests pass, including more nights than jobs and answers beyond 32 bits."
    efficiency: "Binary search over the capacity with a linear greedy check; a dynamic programming approach is noted as slower."
    code_quality: "Separate feasibility function, clear names for the current night's load and the nights used."
    edge_cases: "Single job, one night, idle nights, a single dominant job and very large costs."
    communication: "Justifies why filling each night greedily never uses more nights than any other split."
hints:
  - "If you fix a nightly capacity, can you quickly tell how many nights the chain needs?"
  - "For a fixed capacity, keep adding jobs to the current night until the next one would not fit, then start a new night. A larger capacity never needs more nights, so you can search over the capacity."
  - "Binary search the capacity between the largest single job and the total cost. For the middle value, count nights greedily; if the count is within the limit, keep the middle as the upper bound, otherwise move the lower bound past it. Use 64-bit integers for the sums."
followups:
  - "Why is the greedy packing optimal for a fixed capacity?"
  - "How would you also return where each night starts in the chain?"
  - "What if jobs could be reordered freely - is the problem still easy?"
  - "How would you solve it with dynamic programming, and how does that compare?"
common_errors:
  - "Starting the search below the largest job, so the greedy check loops or reports a wrong night count."
  - "Using 32-bit integers for the capacity or the running load."
  - "Counting the nights off by one by not counting the first night or the last partial night."
  - "Requiring exactly the given number of nights instead of at most that many."
