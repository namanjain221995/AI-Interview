time_limit_minutes: 35
prompt_markdown: |
  ## Maximise Minimum Edge Coverage

  A CDN operator runs edge nodes in a row of cities along a fibre backbone, numbered `0` to `n - 1`.
  City `i` already hosts `nodes[i]` edge nodes. A node placed in city `j` serves every city `i` with
  `|i - j| <= radius`. The **coverage** of a city is the total number of nodes that serve it.

  The budget allows `extra` additional nodes, which may be placed in any cities (several in the same
  city is fine, and not all of them have to be used). After placing them, the operator looks at the
  **weakest city**: the minimum coverage over all cities.

  Return the **largest possible minimum coverage**. Coverage values can exceed the 32-bit range, so
  return a 64-bit integer.

  ### Example 1
  ```
  Input:  nodes = [1, 0, 0, 3, 0, 2], radius = 1, extra = 3
  Output: 3
  Explanation: The initial coverage is [1, 1, 3, 3, 5, 2]. Placing 2 nodes in city 1 and 1 node in
  city 5 gives [3, 3, 5, 3, 6, 3]. Reaching 4 everywhere would need more than 3 nodes.
  ```

  ### Example 2
  ```
  Input:  nodes = [4, 0, 0, 0, 4], radius = 0, extra = 5
  Output: 1
  Explanation: With radius 0 each node serves only its own city. Three cities start at 0, and lifting
  all of them to 2 would need 6 nodes.
  ```

  ### Example 3
  ```
  Input:  nodes = [2, 1, 0, 5, 0, 0, 1], radius = 2, extra = 2
  Output: 3
  ```

  ### Constraints
  - `1 <= n == nodes.length <= 10^5`
  - `0 <= nodes[i] <= 10^5`
  - `0 <= radius < n`
  - `0 <= extra <= 10^9`

  **Follow-up:** Why is it always safe to place the nodes needed by the leftmost under-covered city as
  far to the right as possible?
