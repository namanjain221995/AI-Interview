reference_solutions:
  python: |
    def max_min_edge_coverage(nodes: list[int], radius: int, extra: int) -> int:
        n = len(nodes)
        prefix = [0] * (n + 1)
        for i, count in enumerate(nodes):
            prefix[i + 1] = prefix[i] + count
        coverage = [prefix[min(n, i + radius + 1)] - prefix[max(0, i - radius)] for i in range(n)]

        def reachable(target: int) -> bool:
            # Sweep left to right; place missing nodes as far right as still helps city i.
            expires = [0] * (n + 1)  # difference array: added nodes stop serving here
            active = 0
            used = 0
            for i in range(n):
                active += expires[i]
                missing = target - coverage[i] - active
                if missing > 0:
                    used += missing
                    if used > extra:
                        return False
                    active += missing
                    # A node at city min(n - 1, i + radius) serves cities up to i + 2 * radius.
                    expires[min(n, i + 2 * radius + 1)] -= missing
            return True

        lo = min(coverage)
        hi = lo + extra
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if reachable(mid):
                lo = mid
            else:
                hi = mid - 1
        return lo
  javascript: |
    function maxMinEdgeCoverage(nodes, radius, extra) {
      const n = nodes.length;
      const prefix = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) prefix[i + 1] = prefix[i] + nodes[i];
      const coverage = [];
      for (let i = 0; i < n; i++) {
        coverage.push(prefix[Math.min(n, i + radius + 1)] - prefix[Math.max(0, i - radius)]);
      }
      const reachable = (target) => {
        const expires = new Array(n + 1).fill(0);
        let active = 0;
        let used = 0;
        for (let i = 0; i < n; i++) {
          active += expires[i];
          const missing = target - coverage[i] - active;
          if (missing > 0) {
            used += missing;
            if (used > extra) return false;
            active += missing;
            expires[Math.min(n, i + 2 * radius + 1)] -= missing;
          }
        }
        return true;
      };
      let lo = Math.min(...coverage);
      let hi = lo + extra;
      while (lo < hi) {
        const mid = Math.floor((lo + hi + 1) / 2);
        if (reachable(mid)) lo = mid;
        else hi = mid - 1;
      }
      return lo;
    }
