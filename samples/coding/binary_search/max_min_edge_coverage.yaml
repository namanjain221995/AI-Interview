expected_concepts:
  - prefix sums for the initial coverage of every city
  - binary search on the target minimum coverage
  - greedy placement as far right as still useful
  - difference array (or sliding window) to track the effect of added nodes
  - 64-bit arithmetic for coverage and budget
optimal_complexity: {time: "O(n log(extra))", space: O(n)}
rubric:
  excellent: Computes initial coverage with prefix sums, binary searches the target between the current minimum and the minimum plus extra, checks each target with a left-to-right greedy that places missing nodes at i + radius and tracks their expiry with a difference array, justifies the greedy with an exchange argument and uses 64-bit values.
  good: Correct binary search and greedy, but with a slower coverage update (for example re-summing a window) or needing a hint to see why the rightmost placement is safe.
  weak: Adds nodes one at a time to the currently weakest city (too slow and not always optimal), places missing nodes at city i itself, or overflows 32-bit integers.
  criteria:
    correctness: All tests pass, including radius 0, a radius covering every city, zero budget and huge budgets.
    efficiency: O(n) feasibility check inside an O(log extra) binary search.
    code_quality: Coverage, feasibility check and search are separated; the difference array is indexed without off-by-one errors.
    edge_cases: Single city, extra = 0, radius = n - 1, cities already above the target and values beyond 32 bits.
    communication: Explains monotonicity of the target and the exchange argument for rightmost placement.
hints:
  - First work out each city's coverage before any new nodes. Then ask - for a given target, can every city reach it within the budget? Larger targets are never easier.
  - Check a target by sweeping the cities from left to right. When a city is short, the leftmost under-covered city is the one that must be fixed now, and a new node helps the most future cities if it is placed as far right as still reaches that city.
  - Binary search the target between the current minimum coverage and that minimum plus extra. In the sweep, place the missing amount at city i plus radius (clamped to the end), remember in a difference array that those nodes stop serving after city i plus twice the radius, keep a running total of active added nodes, and fail as soon as the total placed exceeds extra.
followups:
  - How would you return where to place the nodes, not just the best minimum?
  - What changes if each city has a different service radius?
  - How would you handle a ring of cities where the last city neighbours the first?
common_errors:
  - Placing missing nodes in the short city itself instead of radius cities to the right, which wastes coverage.
  - Forgetting to expire added nodes after 2 * radius + 1 cities, or expiring them one city too early.
  - Using an upper bound that is too small, such as the maximum initial coverage.
  - Overflowing 32-bit integers in coverage or the running total of placed nodes.
