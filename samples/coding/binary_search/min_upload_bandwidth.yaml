expected_concepts:
  - "binary search on the answer (bandwidth)"
  - "monotonic feasibility: more bandwidth never takes longer"
  - "integer ceiling division"
  - "search bounds 1 and max(file_sizes) plus the impossible case"
  - "64-bit accumulation of the total time"
optimal_complexity: {time: "O(n log M), where M = max(file_sizes)", space: "O(1)"}
rubric:
  excellent: "Spots that feasibility is monotonic in the bandwidth, binary searches between 1 and the largest file, uses integer ceiling division and 64-bit totals, handles the impossible case up front and states O(n log M)."
  good: "Correct binary search on the answer with a hint about bounds or ceiling division, and the right complexity."
  weak: "Tries every bandwidth one by one, uses floating-point division that rounds wrongly, or forgets the impossible case."
  criteria:
    correctness: "All tests pass, including the impossible case, exact-fit deadlines and very large sizes."
    efficiency: "Binary search over the bandwidth with a linear check per candidate."
    code_quality: "A separate, clearly named feasibility check and tidy search bounds."
    edge_cases: "Deadline below the file count, deadline equal to the file count, totals beyond 32 bits."
    communication: "Explains why the smallest feasible bandwidth can be found by binary search."
hints:
  - "If a certain bandwidth meets the deadline, does every larger bandwidth also meet it?"
  - "Write a check that, for one candidate bandwidth, adds up the whole seconds every file needs. Then search over candidate bandwidths instead of trying them all."
  - "Return minus one when the deadline is below the number of files. Otherwise binary search between one and the largest file size: if the total time at the middle fits the deadline, keep the middle as the upper bound, else move the lower bound past it. Use integer ceiling division and a 64-bit total."
followups:
  - "Why is the largest file size a safe upper bound for the search?"
  - "How would the problem change if two files could be uploaded in parallel?"
  - "Could you tighten the lower bound using the total size divided by the deadline?"
  - "What goes wrong if you compute the ceiling with floating-point division on very large sizes?"
common_errors:
  - "Using floor division instead of ceiling division for each file."
  - "Accumulating the total time in a 32-bit integer, which overflows for large files at small bandwidths."
  - "Forgetting to return minus one when the deadline is smaller than the number of files."
  - "Searching only up to the deadline or the average size, which can exclude the correct answer."
