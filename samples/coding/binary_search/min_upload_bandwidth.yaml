    - {name: deadline_seconds, type: "long"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_upload_bandwidth(file_sizes: list[int], deadline_seconds: int) -> int:
        if deadline_seconds < len(file_sizes):
            return -1

        def seconds_needed(bandwidth: int) -> int:
            return sum((size + bandwidth - 1) // bandwidth for size in file_sizes)

        lo, hi = 1, max(file_sizes)  # at max(file_sizes) every file takes one second
        while lo < hi:
            mid = (lo + hi) // 2
            if seconds_needed(mid) <= deadline_seconds:
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function minUploadBandwidth(fileSizes, deadlineSeconds) {
      if (deadlineSeconds < fileSizes.length) return -1;
      const fits = (b) => {
        let total = 0;
        for (const s of fileSizes) {
          total += Math.floor((s + b - 1) / b);
          if (total > deadlineSeconds) return false;
        }
        return true;
      };
      let lo = 1;
      let hi = Math.max(...fileSizes);
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (fits(mid)) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
