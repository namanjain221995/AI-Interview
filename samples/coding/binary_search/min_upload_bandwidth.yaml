time_limit_minutes: 22
prompt_markdown: |
  ## Minimum Upload Bandwidth for a Deadline

  A backup agent pushes files to object storage over a link whose bandwidth can be reserved in **whole
  MB/s**. Files are uploaded **one at a time**, in any order, and the storage gateway works in whole
  seconds: at a reserved bandwidth of `b` MB/s, a file of `s` MB occupies `ceil(s / b)` seconds, and
  the next file starts only at the following whole second.

  Given the file sizes `file_sizes` (in MB) and the backup window `deadline_seconds`, return the
  **smallest integer bandwidth** `b >= 1` such that the total upload time (the sum of `ceil(s / b)`
  over all files) is **at most** `deadline_seconds`.

  Every file needs at least one second whatever the bandwidth, so if `deadline_seconds` is smaller than
  the number of files no bandwidth is enough: return `-1` in that case.

  ### Example 1
  ```
  Input:  file_sizes = [12, 7, 25, 3], deadline_seconds = 8
  Output: 7
  Explanation: At 7 MB/s the files take 2 + 1 + 4 + 1 = 8 seconds. At 6 MB/s they would take 2 + 2 + 5 + 1 = 10 seconds, which is too long.
  ```

  ### Example 2
  ```
  Input:  file_sizes = [12, 7, 25, 3], deadline_seconds = 4
  Output: 25
  Explanation: Every file must finish in one second, so the bandwidth must cover the largest file.
  ```

  ### Example 3
  ```
  Input:  file_sizes = [5, 9], deadline_seconds = 1
  Output: -1
  Explanation: Two files need at least two seconds.
  ```

  ### Constraints
  - `1 <= file_sizes.length <= 10^4`
  - `1 <= file_sizes[i] <= 10^9`
  - `1 <= deadline_seconds <= 10^14` (use a 64-bit integer)
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_upload_bandwidth
  params:
