expected_concepts:
  - "sort starts together with their original indices"
  - "lower-bound binary search for the first start >= end"
  - "mapping the sorted position back to the original index"
  - "O(n log n) instead of the O(n^2) pairwise scan"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts (start, index) pairs, uses a lower-bound search per window, returns original indices, handles the zero-length self case and states O(n log n) time with a clear argument."
  good: "Reaches a correct sort plus binary search solution with minor prompting, perhaps with an off-by-one fixed while testing."
  weak: "Stays with the O(n^2) scan, returns positions in the sorted order instead of original indices, or uses a strict comparison that misses equal start and end."
  criteria:
    correctness: "All tests pass, including equal end and start, zero-length windows and the -1 case."
    efficiency: "O(n log n) time from one sort and n binary searches; O(n) extra space."
    code_quality: "Clear separation between building the sorted index and answering each window; a small lower-bound helper."
    edge_cases: "Handles an empty list, a single window, negative times and ends beyond every start."
    communication: "Explains why the search must be a lower bound (greater than or equal) and how the original index is recovered."
hints:
  - "For one window you only care about the starts of the windows, and you want the smallest one that is not before this window's end."
  - "If the starts were sorted, finding the first start that is greater than or equal to a value is a classic binary search question."
  - "Sort pairs of start and original index once, then for each window run a lower-bound binary search for its end and report the stored index of the found pair, or -1 when the search runs past the last start."
followups:
  - "How would you answer the same question if windows were added and removed over time?"
  - "What changes if starts can repeat and ties must return the smallest index?"
  - "How would you find, for each window, the follow-up window that ends earliest instead?"
common_errors:
  - "Using a strictly-greater search, which misses a window that starts exactly when another ends."
  - "Returning the position in the sorted array instead of the original index."
  - "Excluding the window itself, which breaks zero-length windows."
  - "Sorting the input in place and then reporting answers in the wrong order."
