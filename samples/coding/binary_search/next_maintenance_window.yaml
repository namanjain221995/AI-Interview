slug: next_maintenance_window
title: "Next Maintenance Window"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, platform, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Next Maintenance Window

  A shared cluster keeps a calendar of maintenance windows. `windows[i] = [start, end]` describes window
  `i` in minutes since the start of the month, with `start <= end`. No two windows have the same start
  time, and the list is in no particular order.

  When window `i` ends, the on-call engineer wants to line up a follow-up window: the window whose
  `start` is the **smallest start that is greater than or equal to** `end_i`. A zero-length window
  (`start == end`) can be its own follow-up.

  Return an array `result` with one entry per window, in the same order as `windows`: `result[i]` is the
  index (into the original `windows` list) of the follow-up window for window `i`, or `-1` if no window
  starts at or after `end_i`.

  ### Example 1
  ```
  Input:  windows = [[30, 45], [10, 20], [20, 35], [50, 60]]
  Output: [3, 2, 3, -1]
  Explanation: window 1 ends at minute 20, exactly when window 2 starts. Windows 0 and 2 end at 45 and
               35, and the first start at or after those is 50 (window 3). Nothing starts at or after
               60.
  ```

  ### Example 2
  ```
  Input:  windows = [[5, 5], [1, 4]]
  Output: [0, 0]
  Explanation: window 0 has start == end == 5, so it is its own follow-up; window 1 ends at 4 and the
               first start at or after 4 is 5.
  ```

  ### Example 3
  ```
  Input:  windows = [[7, 9]]
  Output: [-1]
  ```

  ### Constraints
  - `0 <= windows.length <= 2 * 10^4`
  - `windows[i].length == 2`
  - `-10^6 <= start <= end <= 10^6`
  - All `start` values are distinct.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: next_maintenance_window
  params:
    - {name: windows, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left


    def next_maintenance_window(windows: list[list[int]]) -> list[int]:
        by_start = sorted((start, i) for i, (start, _end) in enumerate(windows))
        starts = [start for start, _ in by_start]
        result = []
        for _start, end in windows:
            k = bisect_left(starts, end)
            result.append(by_start[k][1] if k < len(starts) else -1)
        return result
  javascript: |
    function nextMaintenanceWindow(windows) {
      const order = windows.map((_, i) => i).sort((a, b) => windows[a][0] - windows[b][0]);
      const starts = order.map((i) => windows[i][0]);
      return windows.map(([, end]) => {
        let lo = 0;
        let hi = starts.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (starts[mid] < end) lo = mid + 1;
          else hi = mid;
        }
        return lo < starts.length ? order[lo] : -1;
      });
    }
