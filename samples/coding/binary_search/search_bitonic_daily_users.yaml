expected_concepts:
  - "binary search for the peak by comparing a day with the next day"
  - "ordinary binary search on the ascending part"
  - "reversed-comparison binary search on the descending part"
  - "search the rising side first so the earliest day wins"
  - "O(log n) reads overall"
optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Finds the peak with a neighbour-comparison binary search, searches the rising side first and the falling side with reversed comparisons, explains why this returns the earliest day and states O(log n)."
  good: "Reaches the three-phase binary search with some prompting, maybe fixing a boundary around the peak after testing."
  weak: "Scans the array linearly, returns the falling-side index when the value also appears while rising, or applies one ordinary binary search to the whole array."
  criteria:
    correctness: "All tests pass, including the peak itself, values on both sides and absent values."
    efficiency: "Three logarithmic searches; no linear scan."
    code_quality: "Each phase is clearly separated, ideally with a helper that takes the sort direction."
    edge_cases: "Handles minimum length, targets at the first, peak or last day and targets outside the value range."
    communication: "Explains why comparing a day with the next one locates the peak and why the rising side is searched first."
hints:
  - "The series is two sorted runs glued together at the peak; if you knew where the peak was, each half would be easy to search."
  - "You can locate the peak by binary search too: compare the middle day with the following day to tell whether you are on the rising or the falling part."
  - "First binary search for the peak by moving right while the middle value is below its successor; then run a normal binary search on the days up to the peak, and only if that fails run a binary search with reversed comparisons on the days after the peak."
followups:
  - "How would you handle plateaus where neighbouring days can have equal counts?"
  - "What if you had to return every day with the target count instead of the earliest?"
  - "How would you find the peak if each read went over the network and you wanted to minimise reads?"
common_errors:
  - "Running a single ordinary binary search over the whole array."
  - "Searching the falling side first and returning the later day."
  - "Off-by-one around the peak, either skipping it or searching it twice in conflicting directions."
  - "Using the ascending comparison on the descending half."
