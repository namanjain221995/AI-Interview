title: "Search a Rise-and-Fall Usage Curve"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [data_analyst, backend, general, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Search a Rise-and-Fall Usage Curve

  A product team launched a seasonal feature. Its daily active users rose every day until a single peak
  day and fell every day after it. `daily_users[d]` is the number of users on day `d`: the values
  **strictly increase** up to the peak and **strictly decrease** after it, and the peak is neither the
  first nor the last day.

  Given a `target` user count, return the **earliest** day `d` with `daily_users[d] == target`, or `-1` if
  no day had exactly that many users. A count can occur at most twice, once while rising and once while
  falling.

  Reading the series is expensive, so aim for `O(log n)` reads instead of scanning every day.

  ### Example 1
  ```
  Input:  daily_users = [120, 340, 560, 910, 700, 340, 90], target = 340
  Output: 1
  Explanation: 340 users were seen on day 1 (rising) and day 5 (falling); the earlier day is 1.
  ```

  ### Example 2
  ```
  Input:  daily_users = [5, 9, 4], target = 4
  Output: 2
  ```

  ### Example 3
  ```
  Input:  daily_users = [10, 20, 30, 25, 15], target = 18
  Output: -1
  ```

  ### Constraints
  - `3 <= daily_users.length <= 10^5`
  - `0 <= daily_users[d] <= 10^9`
  - There is a peak day `p` with `0 < p < daily_users.length - 1`; values strictly increase up to `p` and strictly decrease after it.
  - `0 <= target <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: search_bitonic_daily_users
  params:
    - {name: daily_users, type: "int[]"}
    - {name: target, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def search_bitonic_daily_users(daily_users: list[int], target: int) -> int:
        a = daily_users
        # 1. peak: the first day that is not lower than the next day
        lo, hi = 0, len(a) - 1
        while lo < hi:
            mid = (lo + hi) // 2
            if a[mid] < a[mid + 1]:
                lo = mid + 1
            else:
                hi = mid
        peak = lo
        # 2. rising side (ascending), checked first because it holds the earlier day
        lo, hi = 0, peak
        while lo <= hi:
            mid = (lo + hi) // 2
            if a[mid] == target:
                return mid
            if a[mid] < target:
                lo = mid + 1
            else:
                hi = mid - 1
        # 3. falling side (descending)
        lo, hi = peak + 1, len(a) - 1
        while lo <= hi:
            mid = (lo + hi) // 2
            if a[mid] == target:
                return mid
            if a[mid] > target:
                lo = mid + 1
            else:
                hi = mid - 1
        return -1
  javascript: |
    function searchBitonicDailyUsers(dailyUsers, target) {
      const a = dailyUsers;
      let lo = 0;
      let hi = a.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (a[mid] < a[mid + 1]) lo = mid + 1;
        else hi = mid;
      }
      const peak = lo;
      lo = 0;
      hi = peak;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (a[mid] === target) return mid;
        if (a[mid] < target) lo = mid + 1;
        else hi = mid - 1;
      }
      lo = peak + 1;
      hi = a.length - 1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (a[mid] === target) return mid;
        if (a[mid] > target) lo = mid + 1;
        else hi = mid - 1;
      }
      return -1;
    }
