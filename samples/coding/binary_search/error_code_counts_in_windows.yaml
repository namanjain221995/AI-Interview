prompt_markdown: |
  ## Status Code Counts in Time Windows

  An alerting team is replaying a gateway's history to tune a new alert rule. Entry `i` of the history was
  recorded at second `timestamps[i]` and carries the HTTP status `codes[i]`. Entries are listed in
  recording order, so `timestamps` is **non-decreasing**, and several entries can share the same second.

  Each query is a triple `[t_from, t_to, code]` and asks how many entries with status `code` were recorded
  at a second `t` with `t_from <= t <= t_to` (both ends included). Return one count per query, in the
  order of `queries`; a status that never occurs in the window counts as `0`.

  The history and the query list can each hold up to 10^5 items, so rescanning the history for every
  query is too slow.

  ### Example 1
  ```
  Input:  timestamps = [3, 5, 5, 8, 12, 12, 15], codes = [503, 500, 503, 503, 500, 503, 503], queries = [[5, 12, 503], [0, 4, 500], [12, 12, 503], [9, 20, 500]]
  Output: [3, 0, 1, 1]
  Explanation: 503 was recorded at seconds 3, 5, 8, 12 and 15, so three of them fall in [5, 12] and
               one at exactly 12. 500 was recorded at 5 and 12: none in [0, 4], one in [9, 20].
  ```

  ### Example 2
  ```
  Input:  timestamps = [10, 10, 10], codes = [429, 429, 200], queries = [[10, 10, 429], [11, 30, 429], [0, 100, 404]]
  Output: [2, 0, 0]
  ```

  ### Constraints
  - `0 <= timestamps.length == codes.length <= 10^5`
  - `0 <= timestamps[i] <= 10^9` and `timestamps[i] <= timestamps[i + 1]`
  - `100 <= codes[i] <= 599`
  - `0 <= queries.length <= 10^5`
  - `queries[j] = [t_from, t_to, code]` with `0 <= t_from <= t_to <= 10^9` and `100 <= code <= 599`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: error_code_counts_in_windows
  params:
    - {name: timestamps, type: "int[]"}
    - {name: codes, type: "int[]"}
    - {name: queries, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_left, bisect_right
    from collections import defaultdict


    def error_code_counts_in_windows(timestamps: list[int], codes: list[int], queries: list[list[int]]) -> list[int]:
        seconds_by_code: dict[int, list[int]] = defaultdict(list)
        for t, code in zip(timestamps, codes):
            seconds_by_code[code].append(t)  # stays sorted: timestamps are non-decreasing
        result = []
        for t_from, t_to, code in queries:
            seconds = seconds_by_code.get(code, [])
            result.append(bisect_right(seconds, t_to) - bisect_left(seconds, t_from))
        return result
  javascript: |
    function errorCodeCountsInWindows(timestamps, codes, queries) {
      const secondsByCode = new Map();
      for (let i = 0; i < timestamps.length; i++) {
        if (!secondsByCode.has(codes[i])) secondsByCode.set(codes[i], []);
        secondsByCode.get(codes[i]).push(timestamps[i]);
      }
      // first index whose value is >= target (strict=false) or > target (strict=true)
      const bound = (arr, target, strict) => {
        let lo = 0;
        let hi = arr.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (arr[mid] < target || (strict && arr[mid] === target)) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      return queries.map(([tFrom, tTo, code]) => {
        const seconds = secondsByCode.get(code) || [];
        return bound(seconds, tTo, true) - bound(seconds, tFrom, false);
      });
    }
