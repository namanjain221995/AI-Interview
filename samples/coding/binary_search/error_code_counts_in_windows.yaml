expected_concepts:
  - "group the timestamps by status code"
  - "each group is already sorted because the history is in time order"
  - "lower bound for t_from and upper bound for t_to"
  - "count as the difference of the two positions"
  - "O((n + q) log n) instead of O(n * q)"
optimal_complexity: {time: "O(n + q log n)", space: "O(n)"}
rubric:
  excellent: "Builds a map from status to its sorted seconds in one pass, answers each query with a lower and an upper bound search, handles inclusive ends and duplicates, and states O(n + q log n) time."
  good: "Reaches the grouped binary search approach with prompting, possibly with an off-by-one on the inclusive bounds fixed after testing."
  weak: "Rescans the history for every query, or uses the same bound type on both ends so duplicates at the edges are miscounted."
  criteria:
    correctness: "All tests pass, including shared seconds, inclusive bounds, unknown codes and empty inputs."
    efficiency: "Linear preprocessing plus two logarithmic searches per query."
    code_quality: "Readable grouping step and a small, reusable bound helper."
    edge_cases: "Handles an empty history, an empty query list, absent statuses and windows outside the recorded range."
    communication: "Explains why the per-status lists come out sorted and why the two searches use different bound types."
hints:
  - "A query only cares about the entries of one status, so think about keeping each status's entries apart from the others."
  - "If you had the seconds at which one status occurred in sorted order, counting those inside a closed interval is a matter of finding two positions in that list."
  - "In one pass build a map from status to the list of its seconds, which is already sorted; for each query, count with the position of the first second greater than the window end minus the position of the first second at or after the window start."
followups:
  - "How would you support new entries arriving at the end of the history between queries?"
  - "If there were only a handful of distinct statuses, could prefix counts per status beat binary search?"
  - "How would you answer the count for any status in the window, not just one?"
common_errors:
  - "Scanning the whole history for every query."
  - "Using a lower bound for both ends, which drops entries recorded exactly at the window end."
  - "Searching the whole timestamp list instead of the list for the requested status."
  - "Re-sorting each per-status list even though the history is already in time order."
