expected_concepts:
  - hash map from key to its write history
  - per-key histories are already sorted by time
  - "binary search for the last write with time <= query time (upper bound minus one)"
  - empty-string result for unknown keys and reads before the first write
optimal_complexity: {time: O((W + Q) log W), space: O(W)}
rubric:
  excellent: "Groups writes by key into time-sorted lists in one pass, answers each read with an upper-bound binary search, handles unknown keys and early reads, and explains why no sorting is needed."
  good: "Correct grouping and binary search with a small boundary slip (for example strict versus inclusive time) fixed after testing, or an extra unnecessary sort."
  weak: "Scans the whole log for every read in O(W * Q), returns the first write instead of the latest, or ignores the key when searching by time."
  criteria:
    correctness: "All tests pass, including reads exactly at a write time, before the first write and for unknown keys."
    efficiency: "O(W) to build the index plus O(log W) per read."
    code_quality: "The per-key index is a clear structure (map of time and value lists) and the search helper has an obvious contract."
    edge_cases: "No writes at all, repeated reads, reads in decreasing time order and keys written many times."
    communication: "Explains the choice of upper bound and why the global time order keeps each key's list sorted."
hints:
  - "Reads for one key never care about writes to other keys. How could you organise the log so each read only looks at the relevant writes?"
  - "Build a map from key to the list of (time, value) writes for that key. Because the log is in time order, each list is already sorted by time."
  - "For a read, look up the key's list (missing key means \"\"), then binary search for the first write time strictly greater than the query time; the write just before that position is the answer, and if that position is 0 the answer is \"\"."
followups:
  - "How would you support new writes arriving between reads (an online store)?"
  - "What would you change if writes could arrive out of time order?"
  - "How could you also answer 'how many times did this key change between t1 and t2'?"
common_errors:
  - "Using a strict comparison so a read exactly at a write time misses that write."
  - "Returning the earliest write at or before the time instead of the latest."
  - "Crashing on a key that was never written instead of returning an empty string."
  - "Scanning the full write log for every read."
