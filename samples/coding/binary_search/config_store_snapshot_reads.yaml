version: 1
slug: config_store_snapshot_reads
title: Point-in-Time Reads from a Config Store
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, platform, fullstack, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Point-in-Time Reads from a Config Store

  A configuration service keeps every version of every setting so that engineers can ask "what was this
  setting at time `t`?" while debugging an incident.

  The write log is given as three parallel arrays: write `j` set key `keys[j]` to value `values[j]` at
  time `times[j]`. Writes are listed in the order they happened and `times` is **strictly increasing**
  across the whole log (no two writes share a timestamp). A later write to the same key replaces the
  earlier value from its own timestamp onwards.

  Read `i` asks for key `query_keys[i]` as of time `query_times[i]`. Its answer is the value of the
  **latest write to that key with time `<= query_times[i]`**, or the empty string `""` if the key had not
  been written by then (or was never written). Reads are independent, may come in any order and may
  repeat.

  Return the answers in the same order as the reads.

  ### Example 1
  ```
  Input:  keys = ["timeout", "retries", "timeout"], times = [5, 8, 12], values = ["30s", "3", "45s"],
          query_keys = ["timeout", "timeout", "retries", "timeout"], query_times = [4, 5, 11, 20]
  Output: ["", "30s", "3", "45s"]
  Explanation: At time 4 nothing has been written yet. The write at time 5 counts for a read at time 5. Time 11 sees the retries write from time 8; time 20 sees the second timeout write.
  ```

  ### Example 2
  ```
  Input:  keys = ["region"], times = [100], values = ["eu-west"],
          query_keys = ["zone", "region", "region"], query_times = [150, 99, 1000]
  Output: ["", "", "eu-west"]
  ```

  ### Constraints
  - `0 <= keys.length == times.length == values.length <= 10^5`
  - `1 <= query_keys.length == query_times.length <= 10^5`
  - `1 <= times[j], query_times[i] <= 10^9`, and `times` is strictly increasing
  - Keys and values are non-empty strings of at most 20 letters, digits, `.`, `_` or `-`.
  - Aim for `O((W + Q) log W)` time, where `W` is the number of writes and `Q` the number of reads.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: config_store_snapshot_reads
  params:
    - {name: keys, type: "string[]"}
    - {name: times, type: "int[]"}
    - {name: values, type: "string[]"}
    - {name: query_keys, type: "string[]"}
    - {name: query_times, type: "int[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from bisect import bisect_right


    def config_store_snapshot_reads(
        keys: list[str],
        times: list[int],
        values: list[str],
        query_keys: list[str],
        query_times: list[int],
    ) -> list[str]:
        # Per key, the write times stay sorted because the log is in time order.
        history: dict[str, tuple[list[int], list[str]]] = {}
        for key, t, value in zip(keys, times, values):
            ts, vs = history.setdefault(key, ([], []))
            ts.append(t)
            vs.append(value)

        answers: list[str] = []
        for key, t in zip(query_keys, query_times):
            if key not in history:
                answers.append("")
                continue
            ts, vs = history[key]
            idx = bisect_right(ts, t) - 1  # last write at or before t
            answers.append(vs[idx] if idx >= 0 else "")
        return answers
  javascript: |
    function configStoreSnapshotReads(keys, times, values, queryKeys, queryTimes) {
      const history = new Map();
      for (let j = 0; j < keys.length; j++) {
        if (!history.has(keys[j])) history.set(keys[j], { ts: [], vs: [] });
        const h = history.get(keys[j]);
        h.ts.push(times[j]);
        h.vs.push(values[j]);
      }
      return queryKeys.map((key, i) => {
        const h = history.get(key);
        if (!h) return "";
        const t = queryTimes[i];
        // Find the number of writes with time <= t.
        let lo = 0;
        let hi = h.ts.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (h.ts[mid] <= t) lo = mid + 1;
          else hi = mid;
        }
        return lo > 0 ? h.vs[lo - 1] : "";
      });
    }
