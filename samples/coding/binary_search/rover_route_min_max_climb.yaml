reference_solutions:
  python: |
    from collections import deque


    def rover_route_min_max_climb(grid: list[list[int]]) -> int:
        rows, cols = len(grid), len(grid[0])

        def reachable(limit: int) -> bool:
            seen = [[False] * cols for _ in range(rows)]
            seen[0][0] = True
            queue = deque([(0, 0)])
            while queue:
                r, c = queue.popleft()
                if r == rows - 1 and c == cols - 1:
                    return True
                for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                    if 0 <= nr < rows and 0 <= nc < cols and not seen[nr][nc]:
                        if abs(grid[nr][nc] - grid[r][c]) <= limit:
                            seen[nr][nc] = True
                            queue.append((nr, nc))
            return False

        lo = 0
        hi = max(max(row) for row in grid) - min(min(row) for row in grid)
        while lo < hi:
            mid = (lo + hi) // 2
            if reachable(mid):
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function roverRouteMinMaxClimb(grid) {
      const rows = grid.length;
      const cols = grid[0].length;
      const reachable = (limit) => {
        const seen = new Uint8Array(rows * cols);
        const queue = [0];
        seen[0] = 1;
        for (let head = 0; head < queue.length; head++) {
          const r = Math.floor(queue[head] / cols);
          const c = queue[head] % cols;
          if (r === rows - 1 && c === cols - 1) return true;
          for (const [nr, nc] of [[r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]]) {
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || seen[nr * cols + nc]) continue;
            if (Math.abs(grid[nr][nc] - grid[r][c]) <= limit) {
              seen[nr * cols + nc] = 1;
              queue.push(nr * cols + nc);
            }
          }
        }
        return false;
      };
      let lo = 0;
      let hi = Math.max(...grid.map((row) => Math.max(...row))) - Math.min(...grid.map((row) => Math.min(...row)));
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (reachable(mid)) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
