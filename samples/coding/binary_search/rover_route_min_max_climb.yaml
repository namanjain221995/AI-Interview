prompt_markdown: |
  ## Rover Route with the Gentlest Climb

  A survey rover maps a site as an elevation `grid` with `rows x cols` cells. It starts in the
  top-left cell `(0, 0)` and must reach the bottom-right cell `(rows - 1, cols - 1)`. In one move it
  goes up, down, left or right to a neighbouring cell inside the grid, and it may revisit cells.

  The rover's motors are rated by the **steepest single step** they must handle. The **effort** of a
  route is the largest absolute elevation difference between two consecutive cells on it.

  Return the **minimum effort** over all routes from the start to the goal. A `1 x 1` grid needs no
  moves, so its effort is `0`.

  ### Example 1
  ```
  Input:  grid = [[1, 3, 9], [2, 8, 4], [3, 4, 5]]
  Output: 1
  Explanation: The route 1 -> 2 -> 3 -> 4 -> 5 down the left column and along the bottom row never
  changes elevation by more than 1.
  ```

  ### Example 2
  ```
  Input:  grid = [[10, 30], [70, 32]]
  Output: 20
  Explanation: Via the top-right cell the steps are 20 and 2; via the bottom-left cell they are 60 and 38.
  ```

  ### Example 3
  ```
  Input:  grid = [[5]]
  Output: 0
  ```

  ### Constraints
  - `1 <= rows, cols <= 100`
  - All rows have the same length.
  - `0 <= grid[r][c] <= 10^6`

  **Follow-up:** How does a binary search over the effort compare with a Dijkstra-style search that
  minimises the maximum step directly?
languages: [python, javascript, typescript, java, go, cpp]
