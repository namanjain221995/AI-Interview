expected_concepts:
  - binary search on the answer (the effort limit)
  - monotone feasibility (a larger limit never blocks a route)
  - BFS or DFS reachability under a step limit
  - alternative minimax Dijkstra or union-find over sorted edges
  - O(R * C * log(maxHeight)) time
optimal_complexity: {time: "O(R * C * log H)", space: "O(R * C)"}
rubric:
  excellent: Frames the problem as minimising the maximum step, binary searches the limit with a BFS reachability check (or uses minimax Dijkstra or union-find), handles the 1 x 1 grid and states the complexity with the log factor explained.
  good: Correct solution with one of the standard techniques but with minor inefficiency (for example a fresh search range of 0..10^6 instead of the height spread) or needs a hint about monotonicity.
  weak: Minimises the total climb or the path length instead of the steepest step, only allows right/down moves, or enumerates paths exponentially.
  criteria:
    correctness: All tests pass, including the 1 x 1 grid, single rows and routes that must go back up or left.
    efficiency: Logarithmic number of linear-time searches, or a heap-based minimax search.
    code_quality: Reachability check isolated in a helper with clear bounds and visited handling.
    edge_cases: Single cell, single row or column, flat grids and detours that move away from the goal.
    communication: Explains why feasibility is monotone in the limit and compares the alternatives.
hints:
  - If you fix a maximum allowed step, can you decide quickly whether the rover can still reach the goal?
  - A larger allowed step never blocks a route that worked with a smaller one, so the smallest workable limit can be found by searching the range of possible limits.
  - Binary search the limit between zero and the spread of elevations; for each candidate run a breadth-first search that only crosses edges whose elevation difference is within the limit, and keep the smallest limit that reaches the bottom-right cell.
followups:
  - How would you solve it with a priority queue in a single pass, and what is that complexity?
  - How would union-find over edges sorted by difference solve it?
  - What changes if diagonal moves are allowed or some cells are impassable?
common_errors:
  - Only allowing moves right and down, which misses routes that detour.
  - Summing the differences instead of taking their maximum.
  - Forgetting the 1 x 1 grid or starting the search range at 1.
  - Marking cells visited only when popped, which bloats the queue.
