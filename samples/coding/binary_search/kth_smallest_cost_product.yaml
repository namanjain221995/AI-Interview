expected_concepts:
  - binary search on the answer value rather than on positions
  - counting pairs with product <= x per row using sorted order
  - sign cases - positive, negative and zero factors flip or remove monotonicity
  - floor division pitfalls with negative numbers
  - 64-bit counts and products
optimal_complexity: {time: "O(n log m log V)", space: O(1)}
rubric:
  excellent: Binary searches the product value between the extreme corner products, counts pairs <= mid per unit cost with a binary search whose direction depends on the sign (and a constant for zero), uses 64-bit arithmetic, and explains why the smallest value whose count reaches k is an actual product.
  good: Correct value-space binary search but with a sign case fixed only after a hint, or a slower counting step such as a linear scan per row.
  weak: Generates and sorts all products, uses a heap that pops k times (infeasible for large k), or mishandles negative factors and zeros.
  criteria:
    correctness: All tests pass, including all-negative lists, zeros, duplicates and k at both extremes.
    efficiency: Value-space binary search with logarithmic counting per row; no enumeration of all pairs.
    code_quality: Sign cases separated cleanly in the counting helper; 64-bit types where needed.
    edge_cases: Zeros, negative times negative, single-element lists, k = 1 and k = total pairs.
    communication: Explains how the sign of a unit cost changes the order of its row of products.
hints:
  - Instead of producing every product, pick a candidate value x and ask how many products are at most x. That count only grows as x grows.
  - For a fixed unit cost, its products with the sorted multipliers are themselves sorted - ascending when the unit cost is positive, descending when it is negative, and all zero when it is zero - so the number of products at most x can be found by binary search.
  - Binary search x between the smallest and largest corner products. For each unit cost, count the qualifying multipliers - a prefix for positive costs, a suffix for negative ones, all or none for zero - and keep the smallest x whose total count is at least k, using 64-bit integers for counts and products.
followups:
  - How would you count pairs with a two-pointer sweep instead of a binary search per row?
  - What changes if you need the k-th largest instead?
  - How would you solve it if the lists were not sorted?
common_errors:
  - Treating a negative unit cost like a positive one, so the counted side of its row is reversed.
  - Using floor division with negative numerators, which rounds the wrong way in some languages.
  - Overflowing 32-bit integers in the product or the pair count.
  - Searching between 0 and the largest product, which misses negative answers.
