title: K-th Smallest Cost Product
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, data_scientist, general]
time_limit_minutes: 35
prompt_markdown: |
  ## K-th Smallest Cost Product

  A pricing team simulates the revenue impact of a catalogue change. `unit_costs` lists candidate
  per-unit price changes (negative values are discounts) and `multipliers` lists quantity changes seen
  in past orders (negative values are returns). Both lists are **sorted in non-decreasing order** and
  may contain negatives, zeros and duplicates.

  Every pair `(i, j)` produces the impact `unit_costs[i] * multipliers[j]`, so there are
  `unit_costs.length * multipliers.length` impacts in total (equal values are counted separately).

  Return the **`k`-th smallest impact** (`k` is 1-based). The number of pairs, and therefore `k`, can
  exceed the 32-bit range, and so can the impacts; use 64-bit integers.

  ### Example 1
  ```
  Input:  unit_costs = [2, 5], multipliers = [3, 4], k = 2
  Output: 8
  Explanation: The impacts are 6, 8, 15, 20 in sorted order; the 2nd smallest is 8.
  ```

  ### Example 2
  ```
  Input:  unit_costs = [-3, 0, 2], multipliers = [-1, 4], k = 2
  Output: -2
  Explanation: Sorted impacts: -12, -2, 0, 0, 3, 8.
  ```

  ### Example 3
  ```
  Input:  unit_costs = [-4, -2, 1], multipliers = [-5, 3, 6], k = 7
  Output: 6
  Explanation: Sorted impacts: -24, -12, -12, -6, -5, 3, 6, 10, 20.
  ```

  ### Constraints
  - `1 <= unit_costs.length, multipliers.length <= 5 * 10^4`
  - `-10^5 <= unit_costs[i], multipliers[j] <= 10^5`
  - Both lists are sorted in non-decreasing order.
  - `1 <= k <= unit_costs.length * multipliers.length`

  **Follow-up:** Generating and sorting every product needs up to 2.5 * 10^9 values. How can you find
  the answer without listing them?
languages: [python, javascript, typescript, java, go, cpp]
