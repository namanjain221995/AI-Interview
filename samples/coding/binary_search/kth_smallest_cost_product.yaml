    - {name: k, type: long}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def kth_smallest_cost_product(unit_costs: list[int], multipliers: list[int], k: int) -> int:
        m = len(multipliers)

        def count_at_most(limit: int) -> int:
            total = 0
            for a in unit_costs:
                if a == 0:
                    total += m if limit >= 0 else 0
                elif a > 0:
                    # a * multipliers[j] grows with j: count the prefix whose product <= limit.
                    lo, hi = 0, m
                    while lo < hi:
                        mid = (lo + hi) // 2
                        if a * multipliers[mid] <= limit:
                            lo = mid + 1
                        else:
                            hi = mid
                    total += lo
                else:
                    # a * multipliers[j] shrinks with j: count the suffix whose product <= limit.
                    lo, hi = 0, m
                    while lo < hi:
                        mid = (lo + hi) // 2
                        if a * multipliers[mid] <= limit:
                            hi = mid
                        else:
                            lo = mid + 1
                    total += m - lo
            return total

        corners = [x * y for x in (unit_costs[0], unit_costs[-1]) for y in (multipliers[0], multipliers[-1])]
        lo, hi = min(corners), max(corners)
        while lo < hi:
            mid = (lo + hi) // 2
            if count_at_most(mid) >= k:
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function kthSmallestCostProduct(unitCosts, multipliers, k) {
      const m = multipliers.length;
      const countAtMost = (limit) => {
        let total = 0;
        for (const a of unitCosts) {
          if (a === 0) {
            if (limit >= 0) total += m;
          } else if (a > 0) {
            let lo = 0;
            let hi = m;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (a * multipliers[mid] <= limit) lo = mid + 1;
              else hi = mid;
            }
            total += lo;
          } else {
            let lo = 0;
            let hi = m;
            while (lo < hi) {
              const mid = (lo + hi) >> 1;
              if (a * multipliers[mid] <= limit) hi = mid;
              else lo = mid + 1;
            }
            total += m - lo;
          }
        }
        return total;
      };
      const ends = [unitCosts[0], unitCosts[unitCosts.length - 1]];
      const corners = [];
      for (const x of ends) for (const y of [multipliers[0], multipliers[m - 1]]) corners.push(x * y);
      let lo = Math.min(...corners);
      let hi = Math.max(...corners);
      while (lo < hi) {
        const mid = Math.floor((lo + hi) / 2);
        if (countAtMost(mid) >= k) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
