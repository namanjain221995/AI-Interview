reference_solutions:
  python: |
    def earliest_day_for_rack_blocks(ready_day: list[int], blocks: int, block_size: int) -> int:
        if blocks * block_size > len(ready_day):
            return -1

        def blocks_ready_by(day: int) -> int:
            count = run = 0
            for ready in ready_day:
                if ready <= day:
                    run += 1
                    if run == block_size:
                        count += 1
                        run = 0
                else:
                    run = 0
            return count

        lo, hi = min(ready_day), max(ready_day)
        while lo < hi:
            mid = (lo + hi) // 2
            if blocks_ready_by(mid) >= blocks:
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function earliestDayForRackBlocks(readyDay, blocks, blockSize) {
      // Numbers are exact up to 2^53, so the product check is safe in JavaScript.
      if (blocks * blockSize > readyDay.length) return -1;
      const days = [...new Set(readyDay)].sort((a, b) => a - b);
      const enough = (day) => {
        let count = 0;
        let run = 0;
        for (const r of readyDay) {
          if (r <= day) {
            run += 1;
            if (run === blockSize) {
              count += 1;
              run = 0;
            }
          } else {
            run = 0;
          }
        }
        return count >= blocks;
      };
      // Binary search over the distinct candidate days.
      let lo = 0;
      let hi = days.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (enough(days[mid])) hi = mid;
        else lo = mid + 1;
      }
      return days[lo];
    }
