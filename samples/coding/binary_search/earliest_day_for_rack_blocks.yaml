prompt_markdown: |
  ## Earliest Day for Contiguous Rack Blocks

  A data-centre rack has a single row of slots, indexed from `0` on the left. New hardware in slot `i`
  finishes its burn-in test and becomes **usable on day `ready_day[i]`**; it stays usable on every later
  day.

  A deployment needs `blocks` separate blocks of hardware, and each block must consist of exactly
  `block_size` **adjacent** usable slots. Blocks may touch but may not share a slot.

  Return the **earliest day** on which the deployment fits, that is, the smallest day `d` such that
  the slots with `ready_day[i] <= d` contain `blocks` disjoint runs of `block_size` adjacent slots. If
  the rack does not have enough slots at all (`blocks * block_size > ready_day.length`), return `-1`.

  ### Example 1
  ```
  Input:  ready_day = [3, 9, 2, 6, 4, 8, 1], blocks = 2, block_size = 2
  Output: 8
  Explanation: By day 6 only the slots at indices 2, 3 and 4 form a run of ready slots, which holds one block. On day 8 index 5 becomes ready, so indices 2 to 6 form a run of five and two blocks fit.
  ```

  ### Example 2
  ```
  Input:  ready_day = [3, 9, 2, 6, 4, 8, 1], blocks = 2, block_size = 4
  Output: -1
  Explanation: Two blocks of four slots need 8 slots, but the rack has only 7.
  ```

  ### Example 3
  ```
  Input:  ready_day = [7, 2, 3, 10, 1, 4], blocks = 3, block_size = 1
  Output: 3
  Explanation: With blocks of one slot, the deployment waits for the third slot to become ready.
  ```

  ### Constraints
  - `1 <= ready_day.length <= 10^5`
  - `1 <= ready_day[i] <= 10^9`
  - `1 <= blocks <= 10^6`
  - `1 <= block_size <= 10^5`
  - `blocks * block_size` can exceed 32 bits.
