expected_concepts:
  - "binary search on the answer (the day)"
  - "greedy count of disjoint runs of adjacent ready slots"
  - "monotonicity: more days never means fewer usable slots"
  - "early exit when blocks * block_size exceeds the slot count, with 64-bit multiplication"
optimal_complexity: {time: "O(n log D), where D is the range of ready days", space: "O(1)"}
rubric:
  excellent: "Recognises the monotonic yes/no question per day, counts blocks greedily in one pass, binary searches between the earliest and latest ready day, handles the impossible case with a 64-bit product and states O(n log D)."
  good: "Correct binary search with a greedy count after a hint, and correct complexity."
  weak: "Simulates day by day across the full range, counts ready slots without requiring adjacency, or lets a block span a slot that is not ready."
  criteria:
    correctness: "All tests pass, including fragmented racks, the impossible case and the overflow case."
    efficiency: "Binary search over days (or over the sorted distinct days) with a linear greedy check."
    code_quality: "A clearly named counting function and a reset of the current run when a slot is not ready."
    edge_cases: "Single slot, all slots ready together, blocks that need every slot, and very large products."
    communication: "Explains why taking a block as soon as a run reaches the block size is optimal."
hints:
  - "If the deployment fits on some day, it also fits on every later day. What kind of search does that allow?"
  - "For one candidate day, walk the rack from left to right, extend a run while slots are ready and reset it when one is not; every time the run reaches the block size, count a block and start a new run."
  - "First return minus one if blocks times block size (computed in 64 bits) exceeds the number of slots. Otherwise binary search the day between the smallest and largest ready day: if the greedy count reaches the required number of blocks, keep the middle as the upper bound, otherwise move the lower bound past it."
followups:
  - "Why is taking a block as soon as a run is long enough never worse than waiting?"
  - "Could you search over the distinct ready days instead of the whole numeric range?"
  - "How would you return which slots each block uses?"
  - "What if blocks had different required sizes?"
common_errors:
  - "Counting usable slots in total without requiring them to be adjacent."
  - "Not resetting the current run when a slot is not ready yet."
  - "Multiplying blocks by block_size in 32-bit arithmetic, which can wrap around to a small value."
  - "Simulating every day from 1 to the maximum ready day, which is far too slow for days near 10^9."
