reference_solutions:
  python: |
    def kth_smallest_latency_in_grid(grid: list[list[int]], k: int) -> int:
        n = len(grid)

        def count_at_most(value: int) -> int:
            # Staircase walk from the bottom-left corner: O(n) per count.
            row, col, total = n - 1, 0, 0
            while row >= 0 and col < n:
                if grid[row][col] <= value:
                    total += row + 1  # this cell and every cell above it qualify
                    col += 1
                else:
                    row -= 1
            return total

        lo, hi = grid[0][0], grid[n - 1][n - 1]
        while lo < hi:
            mid = lo + (hi - lo) // 2
            if count_at_most(mid) >= k:
                hi = mid
            else:
                lo = mid + 1
        return lo
  javascript: |
    function kthSmallestLatencyInGrid(grid, k) {
      const n = grid.length;
      const countAtMost = (value) => {
        let row = n - 1;
        let col = 0;
        let total = 0;
        while (row >= 0 && col < n) {
          if (grid[row][col] <= value) {
            total += row + 1;
            col++;
          } else {
            row--;
          }
        }
        return total;
      };
      let lo = grid[0][0];
      let hi = grid[n - 1][n - 1];
      while (lo < hi) {
        const mid = lo + Math.floor((hi - lo) / 2);
        if (countAtMost(mid) >= k) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }
