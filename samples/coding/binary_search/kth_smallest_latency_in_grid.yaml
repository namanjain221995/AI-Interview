prompt_markdown: |
  ## K-th Smallest Latency in a Sorted Grid

  A load-testing job measures the response latency of a service, in microseconds, for `n` payload sizes
  and `n` concurrency levels. The results form an `n x n` grid: `grid[r][c]` is the latency for payload
  size `r` at concurrency level `c`. Both payload sizes and concurrency levels are listed from lightest
  to heaviest, and the report has been smoothed so that **every row and every column is sorted in
  non-decreasing order**. Different cells can hold the same value.

  The capacity planner wants percentile-style cut-offs, so return the `k`-th smallest value in the grid
  (`1`-based), counting every cell, duplicates included.

  Aim for better than sorting all `n^2` values: the intended solution uses the sorted rows and columns
  and needs only `O(1)` extra space.

  ### Example 1
  ```
  Input:  grid = [[12, 18, 30], [15, 22, 41], [20, 35, 60]], k = 5
  Output: 22
  Explanation: The five smallest values are 12, 15, 18, 20 and 22.
  ```

  ### Example 2
  ```
  Input:  grid = [[7, 7], [7, 9]], k = 4
  Output: 9
  ```

  ### Example 3
  ```
  Input:  grid = [[5, 9, 12], [8, 9, 14], [8, 11, 20]], k = 6
  Output: 11
  Explanation: In sorted order the values are 5, 8, 8, 9, 9, 11, 12, 14, 20; duplicates are counted separately.
  ```

  ### Constraints
  - `1 <= n <= 300`, and `grid` is `n x n`
  - `0 <= grid[r][c] <= 10^9`
  - Every row and every column is sorted in non-decreasing order.
  - `1 <= k <= n^2`
languages: [python, javascript, typescript, java, go, cpp]
