expected_concepts:
  - binary search over the value range rather than over positions
  - "counting cells <= x in O(n) with a staircase walk from a corner"
  - "the smallest x with count(x) >= k is always a value present in the grid"
  - duplicates counted separately
optimal_complexity: {time: O(n log(max - min)), space: O(1)}
rubric:
  excellent: "Binary searches the value range between the top-left and bottom-right cells, counts cells <= mid with an O(n) staircase walk, explains why the final value must exist in the grid, and compares it with a heap-based k-way merge."
  good: "Correct value-range binary search with an O(n log n) row-by-row count, or a correct O(k log n) heap solution with a clear explanation of the trade-off."
  weak: "Flattens and sorts the whole grid without discussing alternatives, treats the grid as fully sorted row after row, or skips duplicates."
  criteria:
    correctness: "All tests pass, including duplicates, k = 1, k = n^2 and a 1 x 1 grid."
    efficiency: "O(n log R) where R is the value range, with O(1) extra space; heap or full sort noted as alternatives."
    code_quality: "The counting helper is separate and the walk direction is explained in a comment or name."
    edge_cases: "All cells equal, k at both extremes, a single cell and values up to 10^9."
    communication: "Explains why searching values (not indices) works and why the answer is guaranteed to be a grid value."
hints:
  - "You do not need to know where the k-th value sits. If you picked a candidate value x, could you quickly count how many cells are <= x?"
  - "Start at the bottom-left cell: if it is <= x, every cell above it in that column is too, so add them and move right; otherwise move up. That counts cells <= x in O(n)."
  - "Binary search x between grid[0][0] and grid[n-1][n-1]: when the count of cells <= mid is at least k, keep mid as a candidate (hi = mid), otherwise set lo = mid + 1. When lo meets hi it is the smallest value with at least k cells at or below it, which is the answer."
followups:
  - "How would a min-heap solution work, and when would it beat the binary search?"
  - "What changes if the grid is n x m instead of square?"
  - "How would you find the median of the grid with the same technique?"
common_errors:
  - "Assuming the last value of a row is smaller than the first value of the next row."
  - "Returning mid when the count equals k exactly, which may be a value not present in the grid."
  - "Counting distinct values instead of cells, so duplicates are lost."
  - "Computing the midpoint as (lo + hi) / 2 in 32-bit arithmetic without care for overflow."
