expected_concepts:
  - nesting as a strict partial order on (width, height)
  - "minimum chain cover equals maximum antichain (Dilworth's theorem)"
  - sorting by width ascending and height descending so equal widths never chain
  - longest non-increasing subsequence with patience sorting and an upper-bound binary search
  - greedy stack assignment as an equivalent view of the same patience piles
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Identifies that boxes which cannot nest with each other force separate stacks, connects the minimum number of stacks to the largest such group, sorts with the height-descending tie-break for equal widths, computes a longest non-increasing subsequence in O(n log n) with the correct upper-bound search and explains why duplicates and equal widths are handled.
  good: Reaches the sort-plus-subsequence idea with a correct O(n^2) dynamic programme or with minor tie-break issues that are fixed after a hint.
  weak: Computes the longest nested chain instead of the number of stacks, greedily builds stacks in input order, or nests boxes with equal width or height.
  criteria:
    correctness: All tests pass, including equal widths, equal heights, identical boxes and the empty list.
    efficiency: O(n log n) time after sorting; no pairwise matching for large inputs.
    code_quality: The sort key and the binary search direction (strict versus non-strict) are clear and commented.
    edge_cases: Empty input, a single box, duplicates, all boxes mutually non-nestable and very large dimensions.
    communication: Explains why the size of the largest non-nestable group is both a lower bound and achievable.
hints:
  - Look for boxes that can never share a stack with each other - what does a large group of them tell you about the number of stacks needed?
  - The fewest stacks equals the size of the largest group in which no box fits inside another. After sorting by width, think about what such a group looks like in terms of heights, and be careful with boxes of equal width.
  - Sort by width ascending and, for equal widths, by height descending; the answer is the length of the longest non-increasing subsequence of the heights. Compute it with patience-style piles and a binary search that allows equal heights to extend a run.
followups:
  - How would you output the actual stacks, not just their number?
  - Why does the height-descending tie-break matter, and what goes wrong without it?
  - What if boxes may be rotated by 90 degrees before stacking?
  - How would you compute the longest single stack instead, and how do the two answers relate?
common_errors:
  - Returning the longest nested chain, which answers a different question.
  - Sorting equal widths by height ascending, which lets equal-width boxes look nestable.
  - Using a strict lower-bound search, which mishandles boxes with equal heights or identical boxes.
  - Building stacks greedily in input order without sorting.
