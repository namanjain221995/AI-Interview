version: 1
slug: nested_shipping_boxes
title: Fewest Stacks of Nested Shipping Boxes
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Fewest Stacks of Nested Shipping Boxes

  A returns depot stores empty cardboard boxes as nested stacks to save floor space. Box `i` has a
  footprint of `boxes[i] = [width, height]` and keeps its orientation (width is only ever compared
  with width). Inside a stack, every box must sit inside the box directly around it, which requires
  it to be **strictly narrower and strictly shorter** than that box.

  Every box must go into exactly one stack, and a stack may contain a single box. Return the
  **minimum number of stacks** the depot needs. Return `0` when there are no boxes.

  ### Example 1
  ```
  Input:  boxes = [[3, 5], [1, 2], [4, 4], [2, 6], [5, 7]]
  Output: 3
  Explanation: [1, 2] inside [3, 5] inside [5, 7] forms one stack, and [2, 6] and [4, 4] each form their own.
  No two of [2, 6], [3, 5] and [4, 4] can share a stack, so 3 is the minimum.
  ```

  ### Example 2
  ```
  Input:  boxes = [[2, 2], [2, 3], [2, 4]]
  Output: 3
  Explanation: equal widths never nest, so every box is alone.
  ```

  ### Example 3
  ```
  Input:  boxes = [[1, 1], [2, 2], [3, 3]]
  Output: 1
  ```

  ### Constraints
  - `0 <= boxes.length <= 10^5`
  - `boxes[i].length == 2`
  - `1 <= width, height <= 10^9`
  - Identical boxes may appear more than once.

  **Follow-up:** a matching-based approach works for small inputs; aim for `O(n log n)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nested_shipping_boxes
  params:
