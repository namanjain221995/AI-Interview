reference_solutions:
  python: |
    from bisect import bisect_right


    def nested_shipping_boxes(boxes: list[list[int]]) -> int:
        # Fewest stacks = largest group of boxes where no box fits in another (Dilworth's theorem).
        # Sorted by width ascending and height descending, such a group is a non-increasing run of heights.
        order = sorted(boxes, key=lambda b: (b[0], -b[1]))
        tails: list[int] = []  # tails of non-decreasing runs of negated heights, kept sorted
        for _, height in order:
            value = -height
            i = bisect_right(tails, value)
            if i == len(tails):
                tails.append(value)
            else:
                tails[i] = value
        return len(tails)
  javascript: |
    function nestedShippingBoxes(boxes) {
      // Fewest stacks = largest group of boxes where no box fits in another (Dilworth's theorem).
      // Sorted by width ascending and height descending, such a group is a non-increasing run of heights.
      const order = [...boxes].sort((a, b) => a[0] - b[0] || b[1] - a[1]);
      const tails = []; // tails[i]: largest final height of a non-increasing run of length i + 1
      for (const [, height] of order) {
        let lo = 0;
        let hi = tails.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (tails[mid] >= height) lo = mid + 1;
          else hi = mid;
        }
        if (lo === tails.length) tails.push(height);
        else tails[lo] = height;
      }
      return tails.length;
    }
