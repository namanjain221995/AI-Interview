slug: count_services_with_prefix
title: "Count Services by Name Prefix"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [platform, backend, devops, frontend]
time_limit_minutes: 15
prompt_markdown: |
  ## Count Services by Name Prefix

  A platform team's service registry exports the names of all registered services in `names`. The names
  are **distinct** and sorted in **ascending** order by plain character-code comparison (the default string
  order in most languages). Names use lowercase letters, digits and hyphens.

  A search box in the internal portal shows, as you type, how many services start with the text typed so
  far. For each string in `prefixes`, return the number of names that **start with** that prefix. The
  empty prefix matches every name.

  Return the counts in the **same order as `prefixes`**. Aim for `O(log n)` string comparisons per prefix.

  ### Example 1
  ```
  Input:  names = ["auth-api", "auth-worker", "billing", "billing-api", "search"], prefixes = ["auth", "billing", "s", "x"]
  Output: [2, 2, 1, 0]
  Explanation: Two names start with auth, two with billing, one with s and none with x.
  ```

  ### Example 2
  ```
  Input:  names = ["cache", "cache-01", "cache-02", "cdn"], prefixes = ["", "cache-0", "cache-01", "cache-012"]
  Output: [4, 2, 1, 0]
  Explanation: The empty prefix matches all four names; cache-01 matches only itself.
  ```

  ### Constraints
  - `0 <= names.length <= 10^5`
  - `1 <= prefixes.length <= 10^4`
  - `1 <= names[i].length <= 30` and `0 <= prefixes[j].length <= 30`
  - All strings contain only `a`-`z`, `0`-`9` and `-`.
  - `names` is strictly increasing in character-code order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_services_with_prefix
  params:
    - {name: names, type: "string[]"}
    - {name: prefixes, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def count_services_with_prefix(names: list[str], prefixes: list[str]) -> list[int]:
        def first_index(condition) -> int:
            low, high = 0, len(names)
            while low < high:
                mid = (low + high) // 2
                if condition(names[mid]):
                    high = mid
                else:
                    low = mid + 1
            return low

        counts = []
        for prefix in prefixes:
            size = len(prefix)
            # Names starting with prefix form one contiguous block of the sorted list.
            start = first_index(lambda name: name >= prefix)
            end = first_index(lambda name: name[:size] > prefix)
            counts.append(end - start)
        return counts
  javascript: |
    function countServicesWithPrefix(names, prefixes) {
      const firstIndex = (condition) => {
        let low = 0;
        let high = names.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (condition(names[mid])) high = mid;
          else low = mid + 1;
        }
        return low;
      };
      return prefixes.map((prefix) => {
        const size = prefix.length;
        const start = firstIndex((name) => name >= prefix);
        const end = firstIndex((name) => name.slice(0, size) > prefix);
        return end - start;
      });
    }
