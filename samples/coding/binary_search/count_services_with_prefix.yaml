expected_concepts:
  - "names sharing a prefix form a contiguous block in sorted order"
  - "two binary-search boundaries (lower bound and end of block)"
  - "monotonic predicate built from the first k characters"
  - "per-query O(log n) versus scanning with a startswith check"
optimal_complexity: {time: "O(q * L * log n)", space: "O(1)"}
rubric:
  excellent: "Explains why matches form one contiguous block, finds its start with a lower bound and its end with a second binary search (comparing the first k characters or using a sentinel successor string), handles the empty prefix and states O(L log n) per prefix."
  good: "Finds the start with binary search and the end correctly, or uses two boundaries after a hint; small issues with the empty prefix fixed by testing."
  weak: "Checks startswith on every name for every prefix, or finds the start and then scans forward linearly without discussing the cost."
  criteria:
    correctness: "All tests pass, including nested names, hyphens and the empty prefix."
    efficiency: "Two logarithmic searches per prefix and no extra data structures."
    code_quality: "A reusable boundary-search helper instead of two copied loops."
    edge_cases: "Empty registry, empty prefix, prefixes longer than names and prefixes that sort outside the list."
    communication: "States the contiguity argument before relying on it."
hints:
  - "In a sorted list of names, where do all the names that start with the same prefix end up relative to each other?"
  - "They form one unbroken block. If you can find where the block starts and where it ends, the count is just the distance between the two positions."
  - "The block starts at the first name that is greater than or equal to the prefix. It ends at the first name whose first k characters (k is the prefix length) are greater than the prefix. Both conditions flip from false to true only once along the sorted list, so each position can be found with its own binary search, and the count is the end position minus the start position."
followups:
  - "How would you return the matching names themselves, limited to the first ten for the portal dropdown?"
  - "Why can a sentinel such as appending a character larger than every allowed one also find the end of the block? What could go wrong with it?"
  - "When would a trie be a better choice than binary search over a sorted list?"
  - "How would you keep the counts fast if services are registered and removed continuously?"
common_errors:
  - "Finding the start of the block and then counting matches with a linear scan."
  - "Ending the block at the first name strictly greater than the prefix, which stops at the prefix itself or its first extension."
  - "Assuming letters sort before digits and hyphens."
  - "Returning zero instead of the full count for the empty prefix."
