slug: largest_square_tile_side
title: Largest Square Tile Layout
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, frontend]
time_limit_minutes: 12
prompt_markdown: |
  ## Largest Square Tile Layout

  A dashboard renderer has `tiles` identical widgets and wants to place as many as possible in a single
  **square grid that is completely filled**: `s` rows of `s` widgets each. Leftover widgets go to an
  overflow panel.

  Return the largest integer `s` with `s * s <= tiles`.

  Do **not** use a built-in square root: floating-point square roots can be off by one for large
  values. Search for `s` instead, and make sure intermediate values cannot overflow a 64-bit integer.

  ### Example 1
  ```
  Input:  tiles = 30
  Output: 5
  Explanation: A 5 x 5 grid uses 25 widgets; 6 x 6 would need 36.
  ```

  ### Example 2
  ```
  Input:  tiles = 49
  Output: 7
  Explanation: 7 x 7 = 49 fills the grid exactly.
  ```

  ### Example 3
  ```
  Input:  tiles = 0
  Output: 0
  ```

  ### Constraints
  - `0 <= tiles <= 9 * 10^15`

  **Follow-up:** How would you generalise the search to the largest s with s * s * s <= tiles (a cube of widgets)?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: largest_square_tile_side
  params:
    - {name: tiles, type: "long"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def largest_square_tile_side(tiles: int) -> int:
        low, high = 0, tiles  # the answer lies in [low, high]
        while low < high:
            mid = low + (high - low + 1) // 2
            if mid <= tiles // mid:
                low = mid
            else:
                high = mid - 1
        return low
  javascript: |
    function largestSquareTileSide(tiles) {
      let low = 0;
      let high = tiles;
      while (low < high) {
        const mid = low + Math.floor((high - low + 1) / 2);
        if (mid <= Math.floor(tiles / mid)) low = mid;
        else high = mid - 1;
      }
      return low;
    }
