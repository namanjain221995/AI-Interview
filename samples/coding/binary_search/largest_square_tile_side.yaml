  - {id: t2, args: [49], expected: 7, description: "Example 2 - perfect square"}
  - {id: t3, args: [0], expected: 0, description: "Example 3 - no widgets"}
  - {id: t4, hidden: true, args: [1], expected: 1, description: "Smallest non-empty input"}
  - {id: t5, hidden: true, args: [3], expected: 1, description: "Just below the perfect square 4"}
  - {id: t6, hidden: true, args: [8], expected: 2, description: "Just below the perfect square 9 - answer 2"}
  - {id: t7, hidden: true, args: [2147395600], expected: 46340, description: "46340 squared, the largest square that fits in a signed 32-bit int"}
  - {id: t8, hidden: true, args: [2147483647], expected: 46340, description: "2^31 - 1; mid * mid overflows 32-bit arithmetic"}
  - {id: t9, hidden: true, args: [8999999847252241], expected: 94868329, description: "Large perfect square near the upper limit"}
  - {id: t10, hidden: true, args: [8999999847252240], expected: 94868328, description: "One below a large perfect square - floating-point sqrt tends to round up here"}
  - {id: t11, hidden: true, args: [9000000000000000], expected: 94868329, description: "Maximum input 9 * 10^15; mid * mid overflows 64-bit if high starts at tiles"}
  - {id: t12, hidden: true, args: [999999999999], expected: 999999, description: "10^12 - 1, just below a perfect square"}
expected_concepts:
  - "binary search on the answer"
  - "monotone predicate s * s <= tiles"
  - "overflow-safe comparison using division"
  - "upper-biased midpoint to avoid infinite loops"
optimal_complexity: {time: "O(log tiles)", space: "O(1)"}
rubric:
  excellent: "Frames the task as binary search on the answer with the predicate s * s <= tiles, avoids overflow by comparing s with tiles / s (or by bounding high), uses an upper-biased midpoint so the loop terminates and states O(log tiles) time."
  good: "Correct binary search on the answer, with a small fix needed for overflow or for termination."
  weak: "Uses floating-point sqrt, counts up linearly from 1, or overflows on the largest inputs."
  criteria:
    correctness: "All tests pass, including 0, 1, perfect squares and values one below them."
    efficiency: "About 53 iterations at most; no linear scan."
    code_quality: "A single loop with a clear invariant and no magic constants left unexplained."
    edge_cases: "tiles = 0 (no division by zero), tiles = 1 and the maximum input."
    communication: "Explains why mid * mid can overflow and how the chosen comparison avoids it."
hints:
  - "If a side length s is too large, every bigger side length is too large as well, so the valid side lengths form a prefix of the integers."
  - "Binary search for the largest s with s * s <= tiles, but think about what happens to s * s when s is close to tiles and tiles is about 10^15."
  - "Keep low at 0 and high at tiles; take the middle rounded up, keep it as the new low when middle <= tiles divided by middle (integer division), otherwise set high to middle minus one; stop when low equals high and return low."
followups:
  - "Why does rounding the midpoint down make this particular loop run forever?"
  - "Can you tighten the initial upper bound so that mid * mid never overflows?"
  - "How does Newton's method compare with binary search for this problem?"
  - "How would you return the number of leftover widgets as well?"
common_errors:
  - "Computing mid * mid in 64-bit arithmetic when mid can be around 4.5 * 10^15, which overflows."
  - "Using a floating-point square root and returning a value one too high for numbers just below a perfect square."
  - "Using low = mid with a downward-rounded midpoint, which never terminates when high = low + 1."
  - "Dividing tiles by mid when mid is 0."
