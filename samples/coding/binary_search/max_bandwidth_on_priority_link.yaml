version: 1
slug: max_bandwidth_on_priority_link
title: "Maximum Bandwidth on a Priority Link"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, backend, sre, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Maximum Bandwidth on a Priority Link

  A network team is provisioning a chain of `n` links laid out in a row, numbered `0` to `n - 1`. Every
  link receives a **positive integer** bandwidth allocation (in Gbps). To avoid sharp bottlenecks, the
  allocations of neighbouring links may differ by **at most 1**, and the sum of all allocations must not
  exceed `total_budget`.

  Link `index` carries priority traffic. Return the **largest** bandwidth link `index` can receive in an
  allocation that follows these rules. A valid allocation always exists because `total_budget >= n`
  (every link at 1 Gbps).

  Totals for candidate allocations can exceed 32 bits even though the inputs fit in 32 bits.

  ### Example 1
  ```
  Input:  n = 4, index = 2, total_budget = 6
  Output: 2
  Explanation: [1, 2, 2, 1] uses 6 and gives link 2 a bandwidth of 2. Giving it 3 needs at least [1,
               2, 3, 2] = 8.
  ```

  ### Example 2
  ```
  Input:  n = 6, index = 1, total_budget = 10
  Output: 3
  Explanation: [2, 3, 2, 1, 1, 1] uses exactly 10.
  ```

  ### Constraints
  - `1 <= n <= total_budget <= 10^9`
  - `0 <= index < n`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_bandwidth_on_priority_link
  params:
    - {name: n, type: "int"}
    - {name: index, type: "int"}
    - {name: total_budget, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_bandwidth_on_priority_link(n: int, index: int, total_budget: int) -> int:
        def side_cost(peak: int, length: int) -> int:
            # cheapest allocation for `length` links next to the peak: peak-1, peak-2, ... never below 1
            if length == 0:
                return 0
            if peak - 1 >= length:
                return (2 * peak - 1 - length) * length // 2
            return (peak - 1) * peak // 2 + (length - (peak - 1))

        def cost(peak: int) -> int:
            return peak + side_cost(peak, index) + side_cost(peak, n - index - 1)

        lo, hi = 1, total_budget
        while lo < hi:
            mid = (lo + hi + 1) // 2
            if cost(mid) <= total_budget:
                lo = mid
            else:
                hi = mid - 1
        return lo
  javascript: |
    function maxBandwidthOnPriorityLink(n, index, totalBudget) {
      // BigInt keeps the arithmetic-series sums exact beyond 2^53
      const sideCost = (peak, length) => {
        if (length === 0n) return 0n;
        if (peak - 1n >= length) return ((2n * peak - 1n - length) * length) / 2n;
        return ((peak - 1n) * peak) / 2n + (length - (peak - 1n));
      };
      const N = BigInt(n);
      const I = BigInt(index);
      const budget = BigInt(totalBudget);
      const cost = (peak) => peak + sideCost(peak, I) + sideCost(peak, N - I - 1n);
      let lo = 1n;
      let hi = budget;
      while (lo < hi) {
        const mid = (lo + hi + 1n) / 2n;
        if (cost(mid) <= budget) lo = mid;
        else hi = mid - 1n;
      }
      return Number(lo);
    }
tests:
  - {id: t1, args: [4, 2, 6], expected: 2, description: "Example 1 - small chain"}
  - {id: t2, args: [6, 1, 10], expected: 3, description: "Example 2 - slope reaches the floor of 1"}
  - {id: t3, hidden: true, args: [1, 0, 1000000000], expected: 1000000000, description: "Single link takes the whole budget"}
  - {id: t4, hidden: true, args: [7, 3, 7], expected: 1, description: "Budget equals n, so every link must stay at 1"}
  - {id: t5, hidden: true, args: [5, 0, 12], expected: 4, description: "Priority link at the left end (only one side slopes)"}
  - {id: t6, hidden: true, args: [5, 4, 12], expected: 4, description: "Priority link at the right end"}
  - {id: t7, hidden: true, args: [3, 1, 1000000000], expected: 333333334, description: "Short chain with a huge budget; intermediate sums are near 10^9"}
  - {id: t8, hidden: true, args: [1000000000, 500000000, 1000000000], expected: 1, description: "Maximum n with budget equal to n"}
  - {id: t9, hidden: true, args: [100000, 37, 1000000000], expected: 44682, description: "Right slope reaches 1 while the short left slope does not; sums exceed 32 bits during the search"}
  - {id: t10, hidden: true, args: [9, 4, 25], expected: 5, description: "Budget exactly fits a full pyramid down to 1 on both sides"}
  - {id: t11, hidden: true, args: [999999999, 0, 1000000000], expected: 2, description: "Huge n, priority at the edge, one spare unit"}
expected_concepts:
  - "binary search on the answer because feasibility is monotonic"
  - "cheapest allocation for a given peak decreases by 1 per step and never goes below 1"
  - "closed-form arithmetic-series sums for each side"
  - "64-bit arithmetic for intermediate totals"
  - "O(log total_budget) time"
optimal_complexity: {time: "O(log total_budget)", space: "O(1)"}
rubric:
  excellent: "Argues that if a peak value is feasible every smaller one is too, computes the minimum total for a peak in O(1) with arithmetic series on both sides including the run of ones, binary searches the largest feasible peak with 64-bit sums and states O(log total_budget)."
  good: "Reaches the binary search with a correct cost function after some prompting, perhaps fixing an off-by-one in the series bounds while testing."
  weak: "Simulates the allocation link by link for every candidate or increments the peak one unit at a time, or overflows 32-bit sums."
  criteria:
    correctness: "All tests pass, including the ends of the chain, budget equal to n and maximum inputs."
    efficiency: "Constant-time cost evaluation inside a logarithmic search."
    code_quality: "A separate helper for the cost of one side, with clear handling of the two series cases."
    edge_cases: "Handles n = 1, index at either end, budget equal to n and slopes that do and do not reach 1."
    communication: "Explains why the descending-by-one shape is the cheapest for a fixed peak and why the search is monotonic."
hints:
  - "Pick a bandwidth for the priority link and ask what the cheapest valid allocation around it looks like."
  - "The cheapest allocation for a fixed peak steps down by one on each side until it hits 1 and then stays at 1, and if a peak is affordable then any smaller peak is too, so you can binary search the peak."
  - "Binary search the peak between 1 and the budget; for each candidate compute the cost of each side with an arithmetic-series formula, splitting into the part that steps down and the run of ones, add the peak itself, keep 64-bit totals and move the bounds depending on whether the total fits the budget."
followups:
  - "Can you compute the answer directly with a formula instead of binary searching?"
  - "How would the cost change if neighbouring links could differ by up to 2?"
  - "What if some links had fixed minimum allocations of their own?"
common_errors:
  - "Summing the slope link by link inside the search, which is far too slow for n near 10^9."
  - "Forgetting that allocations cannot drop below 1, so the run of ones is not counted."
  - "Off-by-one in the series bounds, counting the peak twice or missing a link."
  - "Using 32-bit integers for the totals, which overflow during the search."
