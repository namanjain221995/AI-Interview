expected_concepts:
  - "floor lookup with binary search"
  - "upper bound minus one"
  - "inclusive boundary at the exact rollout time"
  - "independent per-query searches for unsorted queries"
optimal_complexity: {time: "O(q log n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Identifies the task as a floor lookup, implements it as the first index with effective time > query minus one, handles the exact-match boundary and the before-first case without extra branches, and states O(q log n)."
  good: "Correct floor search with a small fix needed at the exact-match boundary or for times before the first version."
  weak: "Scans all versions per query, returns the next version instead of the active one, or sorts the queries and loses their original order."
  criteria:
    correctness: "All tests pass, including exact rollout times, times before the first version and unsorted queries."
    efficiency: "One O(log n) search per query."
    code_quality: "A small helper named for what it returns (for example floor_index) and a clear return value of -1 for no version."
    edge_cases: "Single version, empty query list, duplicate queries, time 0 and the maximum time."
    communication: "Explains why a version rolled out exactly at the query time is active."
hints:
  - "For one query time, the active version is the newest rollout that is not in the future."
  - "Binary search for the boundary between rollouts at or before the query and rollouts after it; the active version sits just left of that boundary."
  - "Find the first index whose effective time is strictly greater than the query time with a half-open search, then subtract one; that gives -1 automatically when every rollout is later than the query."
followups:
  - "How would you also return how long the active version had been live at each query time?"
  - "How would you support rollbacks, where an older version becomes active again?"
  - "If versions could be scheduled per region, how would you store and query them?"
  - "How would you answer queries in one pass if they were sorted?"
common_errors:
  - "Using < instead of <= so a version that starts exactly at the query time is not counted as active."
  - "Returning the index of the next rollout instead of the current one."
  - "Sorting the queries for a sweep and returning answers in sorted order."
  - "Returning 0 instead of -1 for times before the first rollout."
