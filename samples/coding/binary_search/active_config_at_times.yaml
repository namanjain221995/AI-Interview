slug: active_config_at_times
title: Active Config Version at Query Times
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, backend, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Active Config Version at Query Times

  A configuration service records when each version of a config was rolled out. Version `i` takes
  effect at second `effective_times[i]` (the times are **strictly increasing**) and stays active until
  the next version takes effect; the last version stays active forever.

  During an incident review you receive a list of `queries`, each a moment in seconds, in **no
  particular order**. For each query, return the index of the version that was active at that moment:
  the **last** version whose effective time is `<=` the query time. A version that takes effect exactly
  at the query time counts as active. If the query time is before the first version, return `-1`.
  Return the answers in the same order as `queries`, using `O(log n)` work per query.

  ### Example 1
  ```
  Input:  effective_times = [100, 250, 400], queries = [50, 100, 300, 1000]
  Output: [-1, 0, 1, 2]
  Explanation: 50 is before any rollout; version 0 starts exactly at 100; at 300 version 1 (since 250) is active; version 2 stays active after 400.
  ```

  ### Example 2
  ```
  Input:  effective_times = [0, 60], queries = [59, 0, 60]
  Output: [0, 0, 1]
  ```

  ### Constraints
  - `1 <= effective_times.length <= 10^5`
  - `0 <= effective_times[i] <= 10^9`, strictly increasing
  - `0 <= queries.length <= 10^5`
  - `0 <= queries[j] <= 10^9`

  **Follow-up:** If the queries were already sorted, how could you answer all of them in a single linear pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: active_config_at_times
  params:
    - {name: effective_times, type: "int[]"}
    - {name: queries, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def active_config_at_times(effective_times: list[int], queries: list[int]) -> list[int]:
        def floor_index(moment: int) -> int:
            # count of versions with effective time <= moment, minus one
            low, high = 0, len(effective_times)
            while low < high:
                mid = (low + high) // 2
                if effective_times[mid] <= moment:
                    low = mid + 1
                else:
                    high = mid
            return low - 1

        return [floor_index(moment) for moment in queries]
  javascript: |
    function activeConfigAtTimes(effectiveTimes, queries) {
      const floorIndex = (moment) => {
        let low = 0;
        let high = effectiveTimes.length;
        while (low < high) {
          const mid = (low + high) >> 1;
          if (effectiveTimes[mid] <= moment) low = mid + 1;
          else high = mid;
        }
        return low - 1;
      };
      return queries.map(floorIndex);
    }
