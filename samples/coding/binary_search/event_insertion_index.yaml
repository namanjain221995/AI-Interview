prompt_markdown: |
  ## Insertion Index for a Late Event

  An event store keeps epoch-millisecond `timestamps` sorted in **non-decreasing** order; several events
  can share the same millisecond. A late event with timestamp `ts` arrives and must be inserted without
  breaking the order.

  Return the **smallest index** at which the late event can be inserted. If events with the same
  timestamp already exist, the late event goes **before** all of them. The answer may be
  `timestamps.length` when `ts` is later than every stored event. Aim for `O(log n)`.

  Timestamps exceed the 32-bit integer range, so use 64-bit integers.

  ### Example 1
  ```
  Input:  timestamps = [1700000000000, 1700000000500, 1700000000500, 1700000002000], ts = 1700000000500
  Output: 1
  Explanation: Two events already sit at 1700000000500 (indices 1 and 2); the late event goes before them.
  ```

  ### Example 2
  ```
  Input:  timestamps = [1700000000000, 1700000000500, 1700000000500, 1700000002000], ts = 1700000003000
  Output: 4
  Explanation: Every stored event is earlier, so the event is appended at index 4.
  ```

  ### Example 3
  ```
  Input:  timestamps = [1700000000000, 1700000000500, 1700000000500, 1700000002000], ts = 1700000001000
  Output: 3
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= timestamps[i], ts <= 4 * 10^12`
  - `timestamps[i] <= timestamps[i + 1]`

  **Follow-up:** How would the answer change if the late event had to go after existing events with the same timestamp?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: event_insertion_index
  params:
    - {name: timestamps, type: "long[]"}
    - {name: ts, type: "long"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def event_insertion_index(timestamps: list[int], ts: int) -> int:
        low, high = 0, len(timestamps)
        while low < high:
            mid = (low + high) // 2
            if timestamps[mid] < ts:
                low = mid + 1
            else:
                high = mid
        return low
  javascript: |
    function eventInsertionIndex(timestamps, ts) {
      let low = 0;
      let high = timestamps.length;
      while (low < high) {
        const mid = Math.floor((low + high) / 2);
        if (timestamps[mid] < ts) low = mid + 1;
        else high = mid;
      }
      return low;
    }
