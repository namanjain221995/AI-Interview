optimal_complexity: {time: "O(log n)", space: "O(1)"}
rubric:
  excellent: "Writes a lower-bound search on a half-open range that moves left on equality, explains why the result can equal the length, uses 64-bit values in typed languages and states O(log n) time."
  good: "Correct search with a minor fix needed for duplicates or for the append-at-end case."
  weak: "Returns any matching index instead of the first, never returns the array length, or uses a linear scan."
  criteria:
    correctness: "All tests pass, including runs of duplicates, an empty store and ts later than every event."
    efficiency: "O(log n) comparisons and O(1) extra memory."
    code_quality: "A compact loop with a clear invariant and no special cases bolted on."
    edge_cases: "Empty array, all-equal values, ts below the minimum and above the maximum."
    communication: "States the invariant: everything before low is smaller than ts, everything from high on is at least ts."
hints:
  - "You are looking for the first position whose timestamp is not smaller than ts; everything before it is strictly earlier."
  - "Use a search range that can include the position just past the end, and when the middle value equals ts keep searching to the left instead of stopping."
  - "Start with low at 0 and high at the length; while low < high, move low to middle plus one when the middle timestamp is smaller than ts, otherwise move high to the middle; return low."
followups:
  - "How would you return the position after the last equal timestamp (upper bound) instead?"
  - "How could you use lower and upper bound together to count events in a time window?"
  - "What happens to insertion cost if the store is an array versus a balanced tree or a skip list?"
  - "How do standard libraries expose this search in the languages you use?"
common_errors:
  - "Returning as soon as an equal value is found, which can land after earlier duplicates."
  - "Starting high at length - 1, which makes appending at the end impossible."
  - "Storing timestamps in 32-bit integers in Java, Go or C++."
  - "Using <= in the comparison, which produces the upper bound instead of the lower bound."
