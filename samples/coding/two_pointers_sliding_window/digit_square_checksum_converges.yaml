version: 1
slug: digit_square_checksum_converges
title: Digit-Square Checksum Convergence
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, qa, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Digit-Square Checksum Convergence

  A legacy batch system validates record numbers with an iterative checksum. One **step** replaces a
  positive integer with the sum of the squares of its decimal digits; for example, one step turns
  `307` into `3*3 + 0*0 + 7*7 = 58`.

  A record number is accepted when repeating the step eventually produces exactly `1`. Some numbers
  never reach `1` and instead enter a loop of values that repeats forever.

  Given a positive integer `n`, return `true` if repeating the step starting from `n` reaches `1`
  (a number that is already `1` counts), and `false` if it loops forever without reaching `1`.

  ### Example 1
  ```
  Input:  n = 7
  Output: true
  Explanation: 7 -> 49 -> 97 -> 130 -> 10 -> 1
  ```

  ### Example 2
  ```
  Input:  n = 4
  Output: false
  Explanation: 4 -> 16 -> 37 -> 58 -> 89 -> 145 -> 42 -> 20 -> 4 -> ... never reaches 1
  ```

  ### Constraints
  - `1 <= n <= 2^31 - 1`

  **Follow-up:** can you detect the loop using only `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: checksum_converges
  params:
    - {name: n, type: "int"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def checksum_converges(n: int) -> bool:
        def step(value: int) -> int:
            total = 0
            while value:
                value, digit = divmod(value, 10)
                total += digit * digit
            return total

        slow = n
        fast = step(n)
        while fast != 1 and slow != fast:
            slow = step(slow)
            fast = step(step(fast))
        return fast == 1
  javascript: |
    function checksumConverges(n) {
      const step = (value) => {
        let total = 0;
        while (value > 0) {
          const digit = value % 10;
          total += digit * digit;
          value = Math.floor(value / 10);
        }
        return total;
      };
      let slow = n;
      let fast = step(n);
      while (fast !== 1 && slow !== fast) {
        slow = step(slow);
        fast = step(step(fast));
      }
      return fast === 1;
    }
tests:
  - {id: t1, args: [7], expected: true, description: "Example 1"}
  - {id: t2, args: [4], expected: false, description: "Example 2 - 4 is part of the repeating loop"}
  - {id: t3, hidden: true, args: [1], expected: true, description: "Already 1 before any step"}
  - {id: t4, hidden: true, args: [10], expected: true, description: "Power of ten reaches 1 in one step"}
  - {id: t5, hidden: true, args: [2], expected: false, description: "Small number that loops"}
  - {id: t6, hidden: true, args: [2147483647], expected: false, description: "Largest 32-bit input"}
  - {id: t7, hidden: true, args: [1111111], expected: true, description: "Seven ones step to 7, which converges"}
  - {id: t8, hidden: true, args: [999999999], expected: false, description: "Large repeated digits"}
  - {id: t9, hidden: true, args: [89], expected: false, description: "Starts inside the loop at a value other than 4"}
  - {id: t10, hidden: true, args: [3], expected: false, description: "Single digit that loops"}
expected_concepts:
  - digit extraction with modulo and integer division
  - cycle detection with slow and fast pointers
  - "alternative: hash set of seen values"
  - termination argument (values quickly drop below a few hundred)
optimal_complexity: {time: O(log n), space: O(1)}
rubric:
  excellent: Implements the digit-square step cleanly, detects the loop with slow and fast pointers in O(1) memory, compares it with the hash-set approach and argues why the sequence must either reach 1 or cycle.
  good: Correct solution using a set of seen values, with the memory trade-off acknowledged, or Floyd's method after a small fix.
  weak: Caps the number of iterations with a magic constant without justification, recurses without loop detection, or gets the digit step wrong.
  criteria:
    correctness: All tests pass, including n = 1, values inside the loop and the largest 32-bit input.
    efficiency: Each step is O(number of digits) and the sequence falls to small values quickly; constant memory with the two-pointer method.
    code_quality: The step is a separate small helper; the loop condition is clear.
    edge_cases: n = 1, powers of ten, numbers already inside the loop.
    communication: Explains why a loop must exist when 1 is never reached and how the fast pointer catches the slow one.
hints:
  - Write the single step first, then trace a few starting numbers by hand. What are the only two things that can eventually happen to the sequence?
  - Any value that repeats means the sequence is stuck in a loop; you could remember every value seen, or move two cursors through the sequence at different speeds.
  - Advance one cursor by one step and another by two steps at a time; if the faster one reaches 1 the number is accepted, and if the two cursors meet on any other value the sequence is looping and the answer is false.
followups:
  - Why can the sequence not grow forever? Give a bound on the value after one step for a 10-digit number.
  - How would you find the length of the loop once it is detected?
  - How would you speed up checking millions of record numbers?
common_errors:
  - Looping until the value is 1 without any loop detection, which never terminates for numbers like 2.
  - Stopping after a fixed number of iterations without an argument for why it is enough.
  - Checking slow and fast for equality before advancing them, which returns immediately.
  - Handling n = 1 incorrectly because the comparison happens only after a step.
