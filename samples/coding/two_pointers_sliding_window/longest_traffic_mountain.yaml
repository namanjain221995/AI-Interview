slug: longest_traffic_mountain
title: Longest Traffic Surge
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, data_analyst, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Traffic Surge

  An SRE dashboard stores the number of requests served in each hour as `counts`. A **surge** is a
  contiguous run of hours that climbs to one peak and then falls:

  - it covers at least 3 hours;
  - the counts rise **strictly** from the first hour up to a single peak hour, then fall **strictly**
    until the last hour;
  - both the rising part and the falling part are non-empty, so the peak is never the first or the
    last hour of the run.

  Two equal neighbouring counts (a flat step) cannot be part of a surge. A valley hour may end one
  surge and start the next one.

  Return the length (number of hours) of the longest surge, or `0` if `counts` contains no surge.

  ### Example 1
  ```
  Input:  counts = [40, 55, 70, 65, 30, 30, 45, 90, 120, 150, 110]
  Output: 6
  Explanation: [40, 55, 70, 65, 30] is a surge of 5 hours and [30, 45, 90, 120, 150, 110] is a surge of 6 hours.
  ```

  ### Example 2
  ```
  Input:  counts = [500, 500, 500]
  Output: 0
  Explanation: Flat traffic never rises strictly.
  ```

  ### Example 3
  ```
  Input:  counts = [10, 20, 30, 40]
  Output: 0
  Explanation: Traffic only rises; a surge must also fall.
  ```

  ### Constraints
  - `0 <= counts.length <= 10^5`
  - `0 <= counts[i] <= 10^9`

  **Follow-up:** can you do it in a single pass with `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_surge
  params:
    - {name: counts, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_surge(counts: list[int]) -> int:
        n = len(counts)
        best = 0
        start = 0
        while start < n:
            end = start
            if end + 1 < n and counts[end] < counts[end + 1]:
                while end + 1 < n and counts[end] < counts[end + 1]:
                    end += 1
                if end + 1 < n and counts[end] > counts[end + 1]:
                    while end + 1 < n and counts[end] > counts[end + 1]:
                        end += 1
                    best = max(best, end - start + 1)
            # The end of a surge (its valley) may start the next one.
            start = max(end, start + 1)
        return best
  javascript: |
    function longestSurge(counts) {
      const n = counts.length;
      let best = 0;
      let start = 0;
      while (start < n) {
        let end = start;
        if (end + 1 < n && counts[end] < counts[end + 1]) {
          while (end + 1 < n && counts[end] < counts[end + 1]) end++;
          if (end + 1 < n && counts[end] > counts[end + 1]) {
            while (end + 1 < n && counts[end] > counts[end + 1]) end++;
            best = Math.max(best, end - start + 1);
          }
        }
        start = Math.max(end, start + 1);
      }
      return best;
    }
