expected_concepts:
  - single pass that extends a strict climb and then a strict descent
  - strict comparisons so flat steps break a surge
  - reusing the valley that ends one surge as the start of the next
  - O(1) extra memory instead of up/down arrays
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: "Derives a one-pass scan (or up/down counters) that requires both a climb and a descent, handles flat steps and shared valleys, and explains O(n) time with O(1) memory."
  good: "Correct linear solution using two auxiliary arrays (longest climb ending at i, longest descent starting at i), or a one-pass scan fixed after a failing edge case."
  weak: "Checks every segment in O(n^2) or worse, counts climbs without a descent as surges, or treats equal neighbours as rising."
  criteria:
    correctness: "All tests pass, including flat peaks, sawtooth traffic and the empty input."
    efficiency: Linear time; every hour is visited a constant number of times and extra memory is constant.
    code_quality: "Clear names for the start, peak and end of the current run; the restart rule is easy to follow."
    edge_cases: "Empty and short inputs, monotonic traffic, plateaus at the peak and valleys shared by two surges."
    communication: Explains why restarting at the valley is safe and why both sides of the peak must be non-empty.
hints:
  - "Picture each surge as a climb followed by a descent: what must be true just before and just after the peak hour?"
  - "You can walk the hours once with two markers, the start of the current run and how far it currently reaches; extend the climb first and only then try to extend a descent."
  - "From a start hour, move forward while counts rise strictly; if you climbed at least one step, keep moving while they fall strictly; if both parts are non-empty, record the run length; then restart from the hour where you stopped (it may be the valley of the next surge), or from the next hour if you could not move at all."
followups:
  - "How would you also return the start hour of the longest surge, choosing the earliest on ties?"
  - "What changes if a short flat stretch is allowed at the peak?"
  - "How would you track the longest surge seen so far while counts arrive as a live stream?"
common_errors:
  - Counting a run that only rises (or only falls) as a surge.
  - "Using non-strict comparisons, so flat steps are treated as part of a climb or descent."
  - "Restarting after the valley instead of at it, which misses a surge that begins at that valley."
  - Getting stuck in an infinite loop when the scan cannot extend from the current start.
