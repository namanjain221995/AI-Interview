slug: windows_with_exactly_k_services
title: Windows With Exactly K Services
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, sre]
time_limit_minutes: 30
prompt_markdown: |
  ## Windows With Exactly K Services

  An API gateway logs every incoming call together with the numeric id of the backend service that
  handled it; `calls[i]` is the service id of call `i`. A tracing team wants to know how much of the log
  shows traffic fanning out to a specific number of services.

  Given `calls` and an integer `k`, count the **contiguous windows** `calls[i..j]` (with `i <= j`) that
  contain **exactly `k` distinct** service ids. Windows at different positions are counted separately
  even if they hold the same ids. Return `0` when no window qualifies.

  ### Example 1
  ```
  Input:  calls = [7, 3, 7, 9, 3], k = 2
  Output: 5
  Explanation: [7, 3], [3, 7], [7, 9], [9, 3] and [7, 3, 7]
  ```

  ### Example 2
  ```
  Input:  calls = [4, 4, 4], k = 1
  Output: 6
  Explanation: every one of the 6 windows contains only service 4
  ```

  ### Example 3
  ```
  Input:  calls = [1, 2, 3], k = 4
  Output: 0
  ```

  ### Constraints
  - `1 <= calls.length <= 10^5`
  - `1 <= calls[i] <= 10^9`
  - `1 <= k <= calls.length`
  - The count can exceed the 32-bit integer range; return a 64-bit integer.

  **Follow-up:** checking every window is `O(n^2)`; can you count them in `O(n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_exact_k_service_windows
  params:
