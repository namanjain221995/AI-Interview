    - {name: k, type: int}
  return_type: long
  comparison: exact
reference_solutions:
  python: |
    def count_exact_k_service_windows(calls: list[int], k: int) -> int:
        def at_most(limit: int) -> int:
            """Windows with at most `limit` distinct services."""
            if limit <= 0:
                return 0
            seen: dict[int, int] = {}
            left = 0
            total = 0
            for right, service in enumerate(calls):
                seen[service] = seen.get(service, 0) + 1
                while len(seen) > limit:
                    gone = calls[left]
                    seen[gone] -= 1
                    if seen[gone] == 0:
                        del seen[gone]
                    left += 1
                total += right - left + 1  # every window ending at right and starting at left or later
            return total

        return at_most(k) - at_most(k - 1)
  javascript: |
    function countExactKServiceWindows(calls, k) {
      const atMost = (limit) => {
        if (limit <= 0) return 0;
        const seen = new Map();
        let left = 0;
        let total = 0;
        for (let right = 0; right < calls.length; right++) {
          seen.set(calls[right], (seen.get(calls[right]) || 0) + 1);
          while (seen.size > limit) {
            const gone = calls[left++];
            const count = seen.get(gone) - 1;
            if (count === 0) seen.delete(gone);
            else seen.set(gone, count);
          }
          total += right - left + 1;
        }
        return total;
      };
      return atMost(k) - atMost(k - 1);
    }
