expected_concepts:
  - sliding window with a frequency map
  - exactly k equals at most k minus at most k - 1
  - counting all windows that end at each right edge
  - 64-bit accumulation of the count
  - O(n) because each pointer only moves forward
optimal_complexity: {time: O(n), space: O(k)}
rubric:
  excellent: Recognises that "exactly k" is not monotonic, reduces it to at-most-k minus at-most-(k - 1) (or a three-pointer window), implements the frequency-map window cleanly, uses a 64-bit total and argues O(n).
  good: Correct O(n) or O(n log n) solution after a hint about the at-most decomposition, or a correct O(n^2) solution with a clear explanation of how to improve it.
  weak: Tries a single shrinking window for exactly k and misses windows, double counts, or only produces an O(n^2) or slower enumeration.
  criteria:
    correctness: All tests pass, including k larger than the number of distinct ids, k = 1 and k = n.
    efficiency: Linear time; each pointer moves forward at most n times per pass.
    code_quality: The at-most helper is reused rather than duplicated, with clear names for the window edges and counts.
    edge_cases: Single call, all ids equal, all ids different and long runs of repeated ids.
    communication: Explains why a single window cannot count "exactly k" directly and why the subtraction works.
hints:
  - Counting windows with "at most k" distinct services is much easier than "exactly k"; why is that, and how do the two relate?
  - For a fixed right edge, the windows with at most k distinct ids are exactly those starting at or after the leftmost valid start, so a sliding window can count them all at once.
  - Write a helper that slides a window with a frequency map, shrinking from the left while more than the limit distinct ids are inside and adding the window length for every right edge, then return the helper for k minus the helper for k minus one, keeping the total in a 64-bit integer.
followups:
  - How would you solve it in a single pass with three pointers instead of two passes?
  - How would you list the start and end of the longest window with exactly k services?
  - What changes if the log is a stream and you need the running count after each call?
  - How would you count windows with between a and b distinct services?
common_errors:
  - Using one shrinking window that only counts the longest valid window per right edge, which misses shorter ones.
  - Removing an id from the map before its count reaches zero, which undercounts distinct services.
  - Accumulating the count in a 32-bit integer.
  - Forgetting that at most zero distinct services gives zero windows.
