role_tags: [data, ml, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Smoothed Sensor Readings

  A telemetry service receives one reading per second from a factory sensor. Before the readings are
  plotted, each one is replaced by the **centred average** of the readings around it, which removes
  short spikes.

  Given the list `readings` and a non-negative integer `radius`, return a list `smoothed` of the same
  length where, for every position `i`:

  - if all positions from `i - radius` to `i + radius` (inclusive) exist in `readings`, `smoothed[i]` is
    the sum of those `2 * radius + 1` readings divided by `2 * radius + 1`, rounded **down** to an integer;
  - otherwise (the window would run past the start or the end of the list), `smoothed[i]` is `-1`.

  With `radius = 0` every reading is its own average.

  ### Example 1
  ```
  Input:  readings = [12, 5, 9, 20, 3, 7, 14, 6], radius = 2
  Output: [-1, -1, 9, 8, 10, 10, -1, -1]
  Explanation: smoothed[2] = (12 + 5 + 9 + 20 + 3) / 5 = 9.8, rounded down to 9; positions 0, 1, 6 and 7 lack a full window
  ```

  ### Example 2
  ```
  Input:  readings = [42], radius = 0
  Output: [42]
  ```

  ### Example 3
  ```
  Input:  readings = [10, 20, 30], radius = 2
  Output: [-1, -1, -1]
  Explanation: a window needs 5 readings but there are only 3
  ```

  ### Constraints
  - `1 <= readings.length <= 10^5`
  - `0 <= readings[i] <= 10^9`
  - `0 <= radius <= 10^5`
  - A window sum can exceed the 32-bit integer range; use a 64-bit type.

  **Follow-up:** can you make the running time independent of `radius`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smoothed_readings
  params:
    - {name: readings, type: "long[]"}
    - {name: radius, type: "int"}
  return_type: "long[]"
  comparison: exact
reference_solutions:
  python: |
    def smoothed_readings(readings: list[int], radius: int) -> list[int]:
        n = len(readings)
        width = 2 * radius + 1
        result = [-1] * n
        if width > n:
            return result
        window = sum(readings[:width])
        for center in range(radius, n - radius):
            if center > radius:
                window += readings[center + radius] - readings[center - radius - 1]
            result[center] = window // width
        return result
  javascript: |
    function smoothedReadings(readings, radius) {
      const n = readings.length;
      const width = 2 * radius + 1;
      const result = new Array(n).fill(-1);
      if (width > n) return result;
      let window = 0;
      for (let i = 0; i < width; i++) window += readings[i];
      for (let center = radius; center < n - radius; center++) {
        if (center > radius) window += readings[center + radius] - readings[center - radius - 1];
        result[center] = (window - (window % width)) / width;
      }
      return result;
    }
