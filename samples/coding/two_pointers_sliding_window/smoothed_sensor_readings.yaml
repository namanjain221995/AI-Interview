expected_concepts:
  - fixed-size sliding window with a running sum
  - add the entering reading and subtract the leaving one
  - 64-bit accumulation to avoid overflow
  - integer floor division
  - handling positions without a full window
optimal_complexity: {time: O(n), space: O(1) extra besides the output}
rubric:
  excellent: Keeps one running window sum that slides by adding the entering reading and removing the leaving one, uses a 64-bit sum, marks incomplete windows with -1 and explains why the cost is O(n) regardless of radius.
  good: Correct sliding-window or prefix-sum solution, possibly after fixing an off-by-one at the window edges or an overflow found by the tests.
  weak: Recomputes every window from scratch in O(n * radius), overflows 32-bit integers, or mishandles windows that are wider than the list.
  criteria:
    correctness: All tests pass, including radius 0, a window wider than the list and sums beyond 32 bits.
    efficiency: Linear time; each reading enters and leaves the window once (or a prefix-sum array is used with the extra memory acknowledged).
    code_quality: Clear window bounds with named width and centre, no duplicated summation loops.
    edge_cases: Single reading, radius 0, maximum radius on a short list and very large readings.
    communication: Explains which positions get -1 and why the running sum stays correct as the window slides.
hints:
  - Neighbouring windows share almost all of their readings; think about what actually changes when the centre moves one step to the right.
  - Keep a single running total for the current window and update it as the centre advances, and make sure that total is stored in a 64-bit type.
  - Compute the total of the first full window, then for each later centre add the reading that enters on the right and subtract the one that leaves on the left; positions closer than radius to either end, or every position when the window is wider than the list, stay at minus one.
followups:
  - How would you compute the same result with a prefix-sum array, and what does that cost in memory?
  - How would you adapt this to a stream where readings arrive one at a time?
  - What would change if readings could be negative and you had to round towards zero instead of down?
  - How would you produce a centred median instead of a centred average?
common_errors:
  - Summing every window from scratch, which costs O(n * radius) time.
  - Accumulating the window in a 32-bit integer, which overflows for large readings.
  - Off-by-one errors when choosing which reading leaves the window.
  - Not handling a window that is wider than the whole list.
