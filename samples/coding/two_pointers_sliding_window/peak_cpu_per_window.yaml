title: Peak CPU per Window
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, platform, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Peak CPU per Window

  An autoscaler samples a service's CPU usage (in millicores) at a fixed interval. To size replicas, it
  looks at the **peak** usage over every stretch of `k` consecutive samples.

  Given `samples` and an integer `k`, return an array of length `n - k + 1` (where `n` is the number of
  samples) whose entry `i` is the maximum of `samples[i]` to `samples[i + k - 1]` inclusive, in order of
  `i`.

  ### Example 1
  ```
  Input:  samples = [120, 340, 90, 410, 410, 60, 75, 300], k = 3
  Output: [340, 410, 410, 410, 410, 300]
  Explanation: the windows are [120, 340, 90], [340, 90, 410], [90, 410, 410], [410, 410, 60],
  [410, 60, 75] and [60, 75, 300]
  ```

  ### Example 2
  ```
  Input:  samples = [55, 10, 80], k = 1
  Output: [55, 10, 80]
  ```

  ### Example 3
  ```
  Input:  samples = [55, 10, 80, 20], k = 4
  Output: [80]
  ```

  ### Constraints
  - `1 <= k <= samples.length <= 10^5`
  - `0 <= samples[i] <= 10^6`

  **Follow-up:** an `O(n * k)` scan is easy; can you do it in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: window_peaks
  params:
    - {name: samples, type: "int[]"}
    - {name: k, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def window_peaks(samples: list[int], k: int) -> list[int]:
        candidates: deque[int] = deque()  # indices; their samples strictly decrease from front to back
        peaks: list[int] = []
        for i, value in enumerate(samples):
            while candidates and samples[candidates[-1]] <= value:
                candidates.pop()
            candidates.append(i)
            if candidates[0] <= i - k:
                candidates.popleft()
            if i >= k - 1:
                peaks.append(samples[candidates[0]])
        return peaks
  javascript: |
    function windowPeaks(samples, k) {
      const queue = new Array(samples.length);
      let head = 0;
      let tail = 0;
      const peaks = [];
      for (let i = 0; i < samples.length; i++) {
        while (tail > head && samples[queue[tail - 1]] <= samples[i]) tail--;
        queue[tail++] = i;
        if (queue[head] <= i - k) head++;
        if (i >= k - 1) peaks.push(samples[queue[head]]);
      }
      return peaks;
    }
