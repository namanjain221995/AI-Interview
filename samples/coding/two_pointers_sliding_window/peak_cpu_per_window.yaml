expected_concepts:
  - monotonic deque of indices
  - dropping smaller samples that can never be a peak again
  - expiring the front index when it leaves the window
  - amortised O(n) because each index is pushed and popped once
  - storing indices rather than values to handle duplicates
optimal_complexity: {time: O(n), space: O(k)}
rubric:
  excellent: Explains the O(n * k) baseline, derives the monotonic deque of indices, handles duplicates and window expiry correctly, and argues the amortised O(n) bound.
  good: Correct heap-based O(n log n) solution, or a deque solution reached with a hint about discarding dominated samples.
  weak: Only the O(n * k) rescan, returns the wrong number of windows, or stores values in a way that breaks when the peak value repeats.
  criteria:
    correctness: All tests pass, including k = 1, k = n, monotonic inputs and repeated peaks.
    efficiency: Linear time with a deque; a heap is acceptable but slower and needs lazy removal of expired entries.
    code_quality: Clear invariant on the deque documented in a comment or a well-named variable.
    edge_cases: Single sample, all equal samples and duplicate peaks leaving the window.
    communication: Explains why a sample followed by a larger one can be discarded forever.
hints:
  - When a new sample arrives that is at least as large as an older one still in the window, can the older one ever be the peak of a later window?
  - Keep the positions of only the samples that might still become a peak, ordered so their values decrease; the peak of the current window is then always at one end.
  - Maintain a double-ended queue of indices whose samples strictly decrease; for each new sample remove smaller or equal samples from the back, append its index, drop the front index once it falls out of the window, and from the k-th sample on record the sample at the front.
followups:
  - How would you compute the minimum of each window at the same time?
  - What changes if samples arrive as a stream and you must emit each peak as soon as its window is complete?
  - How would you solve it with block-wise prefix and suffix maxima instead of a deque?
  - How would you handle a window defined by time span rather than sample count when samples are irregular?
common_errors:
  - Rescanning each window, which is O(n * k) and too slow for large k.
  - Storing values instead of indices, so it is impossible to tell when the front leaves the window.
  - Off-by-one when expiring the front index or when starting to record peaks.
  - Popping with a strict comparison and then mishandling repeated peak values.
