version: 1
slug: minimize_max_paired_shift_load
title: Balance Paired On-Call Shifts
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Balance Paired On-Call Shifts

  An SRE team plans next month's on-call rota. Each entry of `loads` is the expected workload of one
  shift (in alert points). Shifts are covered in **pairs**: every shift must be placed in exactly one
  pair, and the load of a pair is the sum of its two shifts. The number of shifts is always even.

  Group the shifts into pairs so that the **heaviest pair is as light as possible**, and return that
  smallest possible heaviest-pair load.

  ### Example 1
  ```
  Input:  loads = [6, 2, 9, 4]
  Output: 11
  Explanation: pair (2, 9) and (4, 6) for loads 11 and 10; the 9 must be paired with something of at
  least 2, so no grouping keeps every pair below 11
  ```

  ### Example 2
  ```
  Input:  loads = [8, 1, 5, 4, 7, 3]
  Output: 10
  Explanation: pairs (1, 8), (3, 7) and (4, 5) have loads 9, 10 and 9
  ```

  ### Constraints
  - `2 <= loads.length <= 10^5`
  - `loads.length` is even.
  - `0 <= loads[i] <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_max_pair_load
  params:
    - {name: loads, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_max_pair_load(loads: list[int]) -> int:
        ordered = sorted(loads)
        lo, hi = 0, len(ordered) - 1
        best = 0
        while lo < hi:
            best = max(best, ordered[lo] + ordered[hi])
            lo += 1
            hi -= 1
        return best
  javascript: |
    function minMaxPairLoad(loads) {
      const ordered = [...loads].sort((a, b) => a - b);
      let lo = 0;
      let hi = ordered.length - 1;
      let best = 0;
      while (lo < hi) {
        best = Math.max(best, ordered[lo] + ordered[hi]);
        lo++;
        hi--;
      }
      return best;
    }
