expected_concepts:
  - "sorting the loads"
  - "pairing the smallest with the largest using two pointers"
  - "exchange argument for why the greedy pairing is optimal"
  - "numeric sort comparator in JavaScript"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Sorts, pairs smallest with largest from both ends, tracks the maximum pair sum and gives a convincing exchange argument for optimality plus O(n log n) time."
  good: "Implements the sort-and-pair-from-both-ends solution correctly but explains why it is optimal only informally."
  weak: "Pairs adjacent elements, tries all pairings, or returns the sum of all loads or the largest pair rather than the minimised maximum."
  criteria:
    correctness: "All tests pass, including a single dominant shift and duplicates."
    efficiency: "Sorting dominates; the pairing pass is linear."
    code_quality: "Two clearly named pointers moving towards each other; input not mutated unexpectedly."
    edge_cases: "Minimum size of two, all-equal loads, zeros and values at the upper bound."
    communication: "Explains why swapping partners can never lower the heaviest pair below the greedy result."
hints:
  - "Which shift is hardest to place? Think about who the heaviest shift should be paired with."
  - "After sorting, the largest load should go with the smallest one; once both are used, the same reasoning applies to what remains."
  - "Sort the loads, put one pointer at each end, record the sum of the two pointed values as a candidate maximum, move both pointers inward and keep the largest candidate seen; that largest candidate is the answer."
followups:
  - "Can you sketch why pairing smallest with largest is optimal (an exchange argument)?"
  - "If loads were bounded by a small value, could you avoid a comparison sort?"
  - "How would the problem change if shifts had to be grouped in threes?"
  - "How would you also return the pairs themselves?"
common_errors:
  - "Pairing neighbours after sorting, which puts the two largest loads together."
  - "Using the default JavaScript sort, which compares numbers as strings."
  - "Returning the smallest pair sum instead of the largest one in the chosen grouping."
