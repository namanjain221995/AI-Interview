version: 1
slug: first_overdraft_per_window
title: First Overdraft per Window
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data_analyst, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## First Overdraft per Window

  A finance service stores the net cash change of a business account for each day: `changes[i]` is the
  change on day `i` (negative means more went out than came in). For a rolling review, every block of `k`
  consecutive days is inspected and the reviewer wants to see the **earliest** negative day in that block.

  Return an array of length `n - k + 1` (where `n` is the length of `changes`) whose entry `i` is the
  **first negative value** among days `i` to `i + k - 1` inclusive, or `0` if that block has no negative
  value. Zero is not negative.

  ### Example 1
  ```
  Input:  changes = [120, -40, 15, -10, 30, 25], k = 2
  Output: [-40, -40, -10, -10, 0]
  Explanation: blocks [120, -40], [-40, 15], [15, -10], [-10, 30], [30, 25] give -40, -40, -10, -10 and 0
  ```

  ### Example 2
  ```
  Input:  changes = [-5, -3, 8], k = 3
  Output: [-5]
  Explanation: -5 comes before -3
  ```

  ### Constraints
  - `1 <= k <= changes.length <= 10^5`
  - `-10^9 <= changes[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: first_negative_per_window
  params:
    - {name: changes, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def first_negative_per_window(changes: list[int], k: int) -> list[int]:
        n = len(changes)
        result: list[int] = []
        nxt = 0  # smallest index >= window start that may hold a negative
        for start in range(n - k + 1):
            if nxt < start:
                nxt = start
            while nxt < start + k and changes[nxt] >= 0:
                nxt += 1
            result.append(changes[nxt] if nxt < start + k else 0)
        return result
  javascript: |
    function firstNegativePerWindow(changes, k) {
      const result = [];
      let next = 0;
      for (let start = 0; start + k <= changes.length; start++) {
        if (next < start) next = start;
        while (next < start + k && changes[next] >= 0) next++;
        result.push(next < start + k ? changes[next] : 0);
      }
      return result;
    }
