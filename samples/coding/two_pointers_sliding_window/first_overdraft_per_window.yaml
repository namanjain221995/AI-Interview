  excellent: "Keeps a queue of negative indices or a forward-only pointer, drops indices that leave the window, answers each window in amortised O(1), and explains why the total work is O(n)."
  good: "Correct queue-based solution with a small boundary fix after testing, or a clear O(n) argument that is slightly informal."
  weak: "Scans every window from its start in O(n k) without improving, returns the most negative value instead of the earliest, or treats zero as negative."
  criteria:
    correctness: "All tests pass, including windows without negatives and negatives leaving the window."
    efficiency: "Each index is examined a constant number of times overall."
    code_quality: "The window bounds and the queue or pointer invariant are explicit."
    edge_cases: "k = 1, k = n, all negative, no negatives and zeros."
    communication: "Explains the invariant: the front of the queue is the earliest negative still inside the window."
hints:
  - "For a given block, only the negative days matter, and among them only the earliest one; how does that earliest one change as the block moves right?"
  - "Remember the positions of negative days you have seen in order; when the block's start moves past the oldest remembered position, that position can be discarded."
  - "Keep a queue of indices of negative values; add each new index when its value is negative, drop indices from the front while they are before the current block start, and for each full block report the value at the front of the queue or zero when the queue is empty."
followups:
  - "How would you return the index of the first negative day instead of its value?"
  - "How would you report the most negative day in each block (the sliding minimum)?"
  - "What changes if the blocks are calendar weeks rather than a rolling window?"
common_errors:
  - "Returning the smallest value in the block rather than the earliest negative one."
  - "Treating zero as a negative change."
  - "Not discarding negative positions that have left the block, so a stale value is reported."
  - "Producing one result per day instead of one per complete block."
