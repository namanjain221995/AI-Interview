expected_concepts:
  - "the answer is the largest distance from a desk to its nearest access point"
  - "sorting both lists so the nearest access point only moves forward"
  - "two-pointer sweep (or binary search per desk)"
  - "numeric sort rather than lexicographic sort in JavaScript"
optimal_complexity: {time: "O(n log n + m log m)", space: "O(n + m) for the sorted copies"}
rubric:
  excellent: "Reduces the problem to the maximum over desks of the distance to the nearest access point, sorts both lists, sweeps with a pointer that only moves forward, handles duplicates and an empty desk list and explains the sort-dominated complexity."
  good: "Sorts the access points and binary-searches the nearest one for each desk, or reaches the two-pointer sweep with hints."
  weak: "Compares every desk with every access point in O(n * m), or binary-searches the radius with an incorrect coverage check."
  criteria:
    correctness: "All tests pass, including desks on both sides of all access points and repeated positions."
    efficiency: "Sorting dominates; the sweep itself is linear."
    code_quality: "Does not mutate the caller's lists unnecessarily and uses a numeric comparator where needed."
    edge_cases: "No desks, a single access point, desks exactly on access points and large coordinates."
    communication: "Explains why the nearest access point index never moves backwards as desks increase."
hints:
  - "For a single desk, what is the smallest radius that covers it? How does that relate to the radius needed for every desk?"
  - "The answer is the largest, over all desks, of the distance to the nearest access point. Sorting both lists means the nearest access point for each next desk is never to the left of the previous one."
  - "Sort desks and access points, keep an index into the access points, and for each desk advance the index while the next access point is at least as close; the distance to the current access point is that desk's requirement, and the maximum requirement over all desks is the answer, or zero with no desks."
followups:
  - "How would you instead place the minimum number of new access points for a fixed radius?"
  - "What changes on a two-dimensional floor plan?"
  - "How would you handle desks being added one at a time and report the radius after each addition?"
  - "How would you solve it with binary search on the radius, and when is that preferable?"
common_errors:
  - "Using the default JavaScript sort, which orders numbers as strings."
  - "Advancing the access point index only when the next one is strictly closer, which stalls on duplicate positions and misses a closer access point further right."
  - "Forgetting desks to the left of the first access point or to the right of the last one."
  - "Returning the minimum distance instead of the maximum over desks."
