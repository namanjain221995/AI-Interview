version: 1
slug: wifi_radius_for_all_desks
title: Minimum Wi-Fi Radius for All Desks
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [network, general, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Minimum Wi-Fi Radius for All Desks

  An office floor is one long corridor, so every position is a single integer (metres from the
  entrance). `desks` lists the positions of the desks and `access_points` lists the positions of the
  Wi-Fi access points. Neither list is sorted, and several desks or access points may share a
  position.

  All access points are configured with the **same** integer radius `r`; an access point at position
  `p` covers every position in `[p - r, p + r]`. Return the **smallest** `r` such that every desk is
  covered by at least one access point. If there are no desks, return `0`.

  ### Example 1
  ```
  Input:  desks = [2, 9, 5], access_points = [1, 10]
  Output: 4
  Explanation: the desk at 5 is 4 m from the access point at 1 and 5 m from the one at 10, so r must
  be at least 4; with r = 4 the desks at 2 and 9 are covered too.
  ```

  ### Example 2
  ```
  Input:  desks = [4, 4, 20], access_points = [4]
  Output: 16
  ```

  ### Constraints
  - `0 <= desks.length <= 10^5`
  - `1 <= access_points.length <= 10^5`
  - `0 <= desks[i], access_points[j] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_coverage_radius
  params:
    - {name: desks, type: "int[]"}
    - {name: access_points, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_coverage_radius(desks: list[int], access_points: list[int]) -> int:
        desks = sorted(desks)
        points = sorted(access_points)
        radius = 0
        j = 0
        for desk in desks:
            # move to the next access point while it is at least as close to this desk
            while j + 1 < len(points) and abs(points[j + 1] - desk) <= abs(points[j] - desk):
                j += 1
            radius = max(radius, abs(points[j] - desk))
        return radius
  javascript: |
    function minCoverageRadius(desks, accessPoints) {
      const sortedDesks = [...desks].sort((x, y) => x - y);
      const points = [...accessPoints].sort((x, y) => x - y);
      let radius = 0;
      let j = 0;
      for (const desk of sortedDesks) {
        while (j + 1 < points.length && Math.abs(points[j + 1] - desk) <= Math.abs(points[j] - desk)) j++;
        radius = Math.max(radius, Math.abs(points[j] - desk));
      }
      return radius;
    }
