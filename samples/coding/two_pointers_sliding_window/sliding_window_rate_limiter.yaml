expected_concepts:
  - "queue of accepted timestamps as a sliding window"
  - "evicting timestamps at or before t - window_ms (half-open window)"
  - "only accepted requests enter the window"
  - "amortised O(1) work per request and 64-bit timestamps"
optimal_complexity: {time: "O(n)", space: "O(min(n, limit))"}
rubric:
  excellent: "Keeps a FIFO of accepted timestamps, evicts entries at or before t - window_ms before each decision, adds only accepted requests, bounds the queue by limit, uses 64-bit arithmetic and explains amortised O(n) time."
  good: "Correct queue-based limiter with small slips on the window boundary that are fixed after testing, or an O(n log n) approach with binary search over accepted timestamps."
  weak: "Re-counts all earlier requests for every arrival in O(n^2), counts rejected requests, or uses a fixed-bucket counter that gives different answers."
  criteria:
    correctness: "All tests pass, including same-millisecond bursts, the exclusive left edge and long idle gaps."
    efficiency: "Each accepted timestamp is added and evicted at most once."
    code_quality: "The window rule is visible in one eviction condition with a clear comment or name."
    edge_cases: "Empty input, limit of 1, window of 1 ms, huge windows and timestamps beyond 32 bits."
    communication: "Contrasts the sliding window with fixed-window counters and explains why rejected requests are not stored."
hints:
  - "To decide on a request you only need the accepted requests that are still inside its window. Which data structure lets you drop the oldest ones cheaply?"
  - "Keep the accepted timestamps in arrival order. Because time never goes backwards, once a timestamp has fallen out of the window it will never be needed again."
  - "Before deciding on each request, remove accepted timestamps from the front while they are at or before the current time minus the window length; then accept and append the request if fewer than the limit remain, otherwise reject it without storing anything."
followups:
  - "How would you run this limiter per client key with bounded memory across millions of clients?"
  - "How does a sliding-window-counter approximation trade accuracy for memory?"
  - "How would you implement this across several gateway instances sharing one limit?"
  - "What changes if timestamps can arrive slightly out of order?"
common_errors:
  - "Using a closed window [t - window_ms, t], which keeps requests exactly window_ms old."
  - "Counting rejected requests in the window."
  - "Storing timestamps in 32-bit integers in a typed language."
  - "Shifting a JavaScript array from the front on every eviction, which can degrade to quadratic time."
