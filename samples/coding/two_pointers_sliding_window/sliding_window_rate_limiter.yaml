title: Sliding Window Rate Limiter
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, sre, security, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Sliding Window Rate Limiter

  An API gateway protects a login endpoint with a sliding-window rate limiter. You are given the
  arrival `timestamps` of the requests in milliseconds, in **non-decreasing** order (several requests
  may arrive in the same millisecond), the limit `limit` and the window length `window_ms`.

  Requests are processed in the given order. A request arriving at time `t` is **accepted** if fewer
  than `limit` **previously accepted** requests have a timestamp in the half-open interval
  `(t - window_ms, t]`; otherwise it is **rejected**. Rejected requests never count against later
  requests.

  Return a list of booleans, one per request in order: `true` for accepted, `false` for rejected.

  ### Example 1
  ```
  Input:  timestamps = [100, 200, 300, 1100, 1150, 1300], limit = 2, window_ms = 1000
  Output: [true, true, false, true, false, true]
  Explanation: at 300 the window (-700, 300] already holds 100 and 200. At 1100 the window
  (100, 1100] excludes 100, so only 200 counts. At 1150 it holds 200 and 1100. At 1300 the window
  (300, 1300] holds only 1100; the rejected request at 300 never counted.
  ```

  ### Example 2
  ```
  Input:  timestamps = [0, 0, 0, 10], limit = 2, window_ms = 10
  Output: [true, true, false, true]
  Explanation: requests in the same millisecond count against each other; at 10 the window (0, 10]
  no longer contains time 0.
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= timestamps[i] <= 10^13`, and `timestamps[i] <= timestamps[i + 1]`
  - `1 <= limit <= 10^5`
  - `1 <= window_ms <= 10^12`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: rate_limit_decisions
  params:
    - {name: timestamps, type: "long[]"}
    - {name: limit, type: int}
    - {name: window_ms, type: "long"}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def rate_limit_decisions(timestamps: list[int], limit: int, window_ms: int) -> list[bool]:
        accepted: deque[int] = deque()
        decisions: list[bool] = []
        for t in timestamps:
            while accepted and accepted[0] <= t - window_ms:
                accepted.popleft()  # fell out of (t - window_ms, t]
            if len(accepted) < limit:
                accepted.append(t)
                decisions.append(True)
            else:
                decisions.append(False)
        return decisions
  javascript: |
    function rateLimitDecisions(timestamps, limit, windowMs) {
      const accepted = [];
      let head = 0;
      const decisions = [];
      for (const t of timestamps) {
        while (head < accepted.length && accepted[head] <= t - windowMs) head++;
        if (accepted.length - head < limit) {
          accepted.push(t);
          decisions.push(true);
        } else {
          decisions.push(false);
        }
      }
      return decisions;
    }
