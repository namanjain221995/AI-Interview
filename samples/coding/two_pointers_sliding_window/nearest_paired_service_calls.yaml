version: 1
slug: nearest_paired_service_calls
title: Nearest Pair of Service Calls
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, sre, platform]
time_limit_minutes: 12
prompt_markdown: |
  ## Nearest Pair of Service Calls

  A distributed tracing tool records, for one request, the order in which services were called: `trace[i]`
  is the name of the service called at step `i`. A service can be called many times in the same trace.

  While investigating a latency issue you want to know how close together two services `a` and `b` ever
  ran. Return the **smallest** value of `|i - j|` over all pairs of steps where `trace[i]` is `a` and
  `trace[j]` is `b`. The order does not matter: `b` may be called before or after `a`.

  Names are compared exactly (`auth` and `auth-v2` are different services).

  ### Example 1
  ```
  Input:  trace = ["gateway", "auth", "cart", "inventory", "pricing", "cart", "billing"], a = "auth", b = "pricing"
  Output: 3
  Explanation: auth is called at step 1 and pricing at step 4
  ```

  ### Example 2
  ```
  Input:  trace = ["gateway", "auth", "cart", "inventory", "pricing", "cart", "billing"], a = "cart", b = "pricing"
  Output: 1
  Explanation: pricing at step 4 and cart at step 5
  ```

  ### Constraints
  - `2 <= trace.length <= 10^5`
  - `1 <= trace[i].length <= 30`; names use lowercase letters, digits and hyphens
  - `a` and `b` are different, and each appears in `trace` at least once

  **Follow-up:** can you solve it in one pass with constant extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: nearest_call_distance
  params:
    - {name: trace, type: "string[]"}
    - {name: a, type: "string"}
    - {name: b, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def nearest_call_distance(trace: list[str], a: str, b: str) -> int:
        last_a = -1
        last_b = -1
        best = len(trace)
        for i, name in enumerate(trace):
            if name == a:
                last_a = i
            elif name == b:
                last_b = i
            else:
                continue
            if last_a >= 0 and last_b >= 0:
                best = min(best, abs(last_a - last_b))
        return best
  javascript: |
    function nearestCallDistance(trace, a, b) {
      let lastA = -1;
      let lastB = -1;
      let best = trace.length;
      for (let i = 0; i < trace.length; i++) {
        if (trace[i] === a) lastA = i;
        else if (trace[i] === b) lastB = i;
        else continue;
        if (lastA >= 0 && lastB >= 0) best = Math.min(best, Math.abs(lastA - lastB));
      }
      return best;
    }
