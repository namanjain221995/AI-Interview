  - {id: t4, hidden: true, args: [["auth", "edge", "edge", "edge", "edge", "edge", "billing"], "billing", "auth"], expected: 6, description: "Each service once at opposite ends - answer is n - 1"}
  - {id: t5, hidden: true, args: [["queue", "worker", "queue", "worker", "queue", "worker"], "queue", "worker"], expected: 1, description: "Strictly alternating repeats - answer is 1"}
