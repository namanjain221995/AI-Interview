expected_concepts:
  - single pass tracking the latest index of each target
  - updating the best distance only when both have been seen
  - order-independent distance
  - O(1) extra memory
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Explains why only the most recent occurrence of the other service can give the best distance, implements a single pass with two last-seen indices and states O(n) time and O(1) space.
  good: Correct solution, for example collecting both index lists and merging them with two pointers, with the right complexity.
  weak: Compares every occurrence of a with every occurrence of b in O(n^2), or only measures pairs where a precedes b.
  criteria:
    correctness: All tests pass, including b appearing before a and look-alike names.
    efficiency: Linear time with constant extra memory (index lists with a merge is acceptable with the memory noted).
    code_quality: Clear names for the last-seen positions and a sentinel for not yet seen.
    edge_cases: Two-element trace, one occurrence each at opposite ends, many repeats.
    communication: Justifies why earlier occurrences can be forgotten once a newer one is seen.
hints:
  - When you reach a call to one of the two services, which earlier call of the other service could possibly be the closest?
  - Only the most recent position of each service matters, so you can remember just two indices while scanning left to right.
  - Scan once keeping the latest step where a appeared and the latest step where b appeared; whenever either is updated and both have been seen, compare their absolute difference with the best found so far.
followups:
  - How would you answer many queries for different service pairs on the same trace efficiently?
  - What changes if a and b may be the same service and you need two different steps?
  - How would you report the pair of steps rather than just the distance?
common_errors:
  - Comparing every occurrence of a with every occurrence of b, which is quadratic.
  - Only considering pairs where a comes before b.
  - Initialising the last-seen positions to 0, which creates fake distances before a service has been seen.
  - Matching names by prefix or substring instead of exact equality.
