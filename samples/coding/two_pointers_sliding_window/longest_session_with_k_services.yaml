  - {id: t2, args: [["auth", "auth"], 0], expected: 0, description: "Example 2 - k = 0 returns 0"}
  - {id: t3, hidden: true, args: [[], 3], expected: 0, description: "Empty session returns 0"}
  - {id: t4, hidden: true, args: [["pay"], 1], expected: 1, description: "Single request with k = 1"}
  - {id: t5, hidden: true, args: [["a", "b", "c", "d", "e"], 1], expected: 1, description: "All services distinct with k = 1 - answer 1"}
  - {id: t6, hidden: true, args: [["auth", "cart", "auth", "pay"], 10], expected: 4, description: "k larger than the number of distinct services covers everything"}
  - {id: t7, hidden: true, args: [["Auth", "auth", "AUTH", "auth"], 1], expected: 1, description: "Case-sensitive names are different services"}
  - {id: t8, hidden: true, args: [["geo", "geo", "mail", "geo", "feed", "feed", "mail", "feed", "feed", "geo", "mail", "mail"], 2], expected: 5, description: "Service leaves the window while still repeated later - counts, not a set, are needed"}
  - {id: t9, hidden: true, args: [["x", "y", "x", "z", "z", "z", "y", "y", "x", "x", "x", "x"], 2], expected: 6, description: "Best stretch is at the end after several shrinks"}
