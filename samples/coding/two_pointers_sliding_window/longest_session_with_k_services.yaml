version: 1
slug: longest_session_with_k_services
title: Longest Stretch Touching K Services
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [backend, data, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Stretch Touching K Services

  A tracing system records, in order, the name of the backend service hit by each request of one user
  session: `calls[i]` is the service called by request `i`. The platform team is sizing a
  connection-pool experiment and wants to know how long a session can run while talking to only a few
  services.

  Return the length of the longest **contiguous** stretch of `calls` that involves **at most `k`
  distinct** service names. Names are compared exactly (case-sensitive). With `k = 0` no request can be
  included, so the answer is `0`; an empty session also returns `0`.

  ### Example 1
  ```
  Input:  calls = ["auth", "cart", "auth", "search", "search", "cart", "search"], k = 2
  Output: 4
  Explanation: requests 3 to 6 only touch search and cart
  ```

  ### Example 2
  ```
  Input:  calls = ["auth", "auth"], k = 0
  Output: 0
  Explanation: with k = 0 no request can be part of the stretch
  ```

  ### Constraints
  - `0 <= calls.length <= 10^5`
  - `1 <= calls[i].length <= 30`; names use letters, digits, `-` and `_`
  - `0 <= k <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_k_service_stretch
  params:
    - {name: calls, type: "string[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_k_service_stretch(calls: list[str], k: int) -> int:
        counts: dict[str, int] = {}
        best = 0
        left = 0
        for right, name in enumerate(calls):
            counts[name] = counts.get(name, 0) + 1
            while len(counts) > k:
                leaving = calls[left]
                counts[leaving] -= 1
                if counts[leaving] == 0:
                    del counts[leaving]
                left += 1
            best = max(best, right - left + 1)
        return best
  javascript: |
    function longestKServiceStretch(calls, k) {
      const counts = new Map();
      let best = 0;
      let left = 0;
      for (let right = 0; right < calls.length; right++) {
        counts.set(calls[right], (counts.get(calls[right]) || 0) + 1);
        while (counts.size > k) {
          const leaving = calls[left];
          const c = counts.get(leaving) - 1;
          if (c === 0) counts.delete(leaving);
          else counts.set(leaving, c);
          left++;
        }
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
