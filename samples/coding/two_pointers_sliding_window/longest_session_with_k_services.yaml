expected_concepts:
  - "variable-size sliding window"
  - "hash map of counts per service in the window"
  - "deleting keys whose count reaches zero so the map size is the distinct count"
  - "O(n) time with O(k) extra space"
optimal_complexity: {time: "O(n)", space: "O(k)"}
rubric:
  excellent: "Keeps a count map for the window, grows it on the right, shrinks from the left while more than k services are present (deleting zero counts), handles k = 0 and empty input, and states O(n) time and O(k) space."
  good: "Correct count-map window with minor prompting, or tracks the distinct count with a separate counter correctly."
  weak: "Enumerates all stretches in O(n^2) or worse, uses a plain set so a service is dropped while still present, or crashes when k is 0."
  criteria:
    correctness: "All tests pass, including k = 0, case-sensitive names and services that reappear inside the window."
    efficiency: "Each request enters and leaves the window once; linear time."
    code_quality: "Clear entering and leaving updates; no zero-count keys left behind."
    edge_cases: "Empty session, one request, all-distinct names and k above the number of services."
    communication: "Explains why counts are required instead of a set of names."
hints:
  - "Think of a window over the session that you can widen and narrow; what has to be true about the window for it to be acceptable?"
  - "Track how many times each service occurs in the current window; the number of services with a positive count tells you whether the window is still within k."
  - "Move a right pointer over every request and add one to that service's count; while more than k services have a positive count, decrease the count of the request at the left pointer, removing the service once it reaches zero, and advance the left pointer; the window length after each step is a candidate answer."
followups:
  - "How would you return the services involved in the best stretch?"
  - "What changes if each request also has a duration and you want the longest stretch in time rather than in requests?"
  - "How would you handle a session too large to fit in memory?"
common_errors:
  - "Using a set of names and removing a service when it leaves the window even though it still occurs later in the window."
  - "Leaving zero-count keys in the map so the distinct count is overstated."
  - "Not special-casing or naturally handling k = 0, leading to a negative or non-zero answer."
  - "Lower-casing names although they are compared exactly."
