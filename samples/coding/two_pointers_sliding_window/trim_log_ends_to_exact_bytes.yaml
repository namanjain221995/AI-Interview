expected_concepts:
  - "reframing as the longest contiguous middle block whose sum is total minus x"
  - "sliding window over positive sizes"
  - "answer equals n minus the longest kept block"
  - "handling x = 0, x = total and x > total"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Reframes the trims as keeping one contiguous middle block of sum total minus x, finds the longest such block with a two-pointer window (valid because sizes are positive), handles x = 0, x = total and x > total, and states O(n) time and O(1) space."
  good: "Correct reframing solved with a prefix-sum hash map in O(n) space, or a correct window solution reached with small prompting."
  weak: "Attempts greedy removal of the larger end, explores all combinations recursively, or fails on x = total or x > total."
  criteria:
    correctness: "All tests pass, including impossible targets and removing every entry."
    efficiency: "Linear time; the window relies on sizes being positive."
    code_quality: "Clear names for the kept target and the longest kept length."
    edge_cases: "x = 0, x equal to and larger than the total, and a single entry."
    communication: "Explains why removed entries always form a prefix and a suffix and why greedy choice of ends fails."
hints:
  - "Whatever sequence of trims you choose, what shape do the entries that remain in the buffer always have?"
  - "The removed entries are always a prefix plus a suffix, so the kept entries form one contiguous block whose sum must be the total minus x; minimizing operations means keeping the longest such block."
  - "Compute the required kept sum (total minus x) and return minus one if it is negative; slide a window with two pointers, shrinking from the left while the window sum is above the kept sum, and record the window length whenever it matches exactly, treating an empty kept block as valid when the kept sum is zero; the answer is n minus the longest length found, or minus one if none matched."
followups:
  - "What breaks in the window approach if some sizes could be zero or negative, and how would a prefix-sum map fix it?"
  - "How would you return which entries to remove from each end?"
  - "How would you change the problem if each end had a different cost per operation?"
common_errors:
  - "Greedily removing the larger of the two ends, which can miss exact totals."
  - "Not handling x equal to the total (an empty kept block) or x larger than the total."
  - "Returning the length of the kept block instead of the number of operations."
  - "Exploring every prefix and suffix pair in O(n^2)."
