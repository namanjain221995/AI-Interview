slug: trim_log_ends_to_exact_bytes
title: Trim Log Ends to Exact Bytes
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, devops, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Trim Log Ends to Exact Bytes

  A log buffer holds entries in order, and `sizes[i]` is the size in bytes of entry `i`. To reclaim
  space, a rotation tool can perform one **trim operation** at a time, each of which deletes either the
  **first** or the **last** entry still in the buffer.

  Return the **minimum number of trim operations** that delete **exactly `x` bytes** in total. If no
  sequence of operations removes exactly `x` bytes, return `-1`. Removing nothing is allowed, so
  `x = 0` returns `0`, and removing every entry is allowed when `x` equals the total size.

  ### Example 1
  ```
  Input:  sizes = [2, 4, 1, 3, 5], x = 8
  Output: 2
  Explanation: delete the last two entries (5 and then 3) for 8 bytes in 2 operations
  ```

  ### Example 2
  ```
  Input:  sizes = [5, 6, 7], x = 4
  Output: -1
  Explanation: every prefix and suffix combination misses 4 bytes
  ```

  ### Example 3
  ```
  Input:  sizes = [3, 1, 1, 3], x = 6
  Output: 2
  Explanation: delete the first entry and the last entry, 3 + 3 = 6 bytes
  ```

  ### Constraints
  - `1 <= sizes.length <= 10^5`
  - `1 <= sizes[i] <= 10^4`
  - `0 <= x <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_trim_ops
  params:
    - {name: sizes, type: "int[]"}
    - {name: x, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_trim_ops(sizes: list[int], x: int) -> int:
        keep = sum(sizes) - x
        if keep < 0:
            return -1
        longest = -1
        left = 0
        window = 0
        for right, size in enumerate(sizes):
            window += size
            while window > keep:
                window -= sizes[left]
                left += 1
            if window == keep:
                longest = max(longest, right - left + 1)
        if keep == 0:
            longest = max(longest, 0)
        return -1 if longest < 0 else len(sizes) - longest
  javascript: |
    function minTrimOps(sizes, x) {
      let total = 0;
      for (const s of sizes) total += s;
      const keep = total - x;
      if (keep < 0) return -1;
      let longest = keep === 0 ? 0 : -1;
      let left = 0;
      let window = 0;
      for (let right = 0; right < sizes.length; right++) {
        window += sizes[right];
        while (window > keep) {
          window -= sizes[left];
          left++;
        }
        if (window === keep) longest = Math.max(longest, right - left + 1);
      }
      return longest < 0 ? -1 : sizes.length - longest;
    }
