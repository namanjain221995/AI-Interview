expected_concepts:
  - "counting windows by their right end"
  - "a reading above high acts as a barrier that no window may cross"
  - "the last in-band reading decides how far left a valid window may start"
  - "single pass with O(1) state instead of enumerating windows"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Counts windows by right endpoint using the last too-high index and the last in-band index, explains why the count for each end is their difference when positive, handles readings below low correctly and states O(n) time and O(1) space."
  good: "Reaches a linear solution via 'windows with peak at most high minus windows with peak at most low - 1', or the direct method with some prompting."
  weak: "Enumerates all windows with a running maximum in O(n^2), or treats readings below low as barriers."
  criteria:
    correctness: "All tests pass, including readings below low inside valid windows and readings exactly at the band edges."
    efficiency: "One pass with constant state; no nested loops."
    code_quality: "The two tracked indices have descriptive names and their meaning is documented."
    edge_cases: "Empty input, all readings above high, all below low, low equal to high and negative readings."
    communication: "Explains the per-right-end counting argument clearly, including why readings below low are allowed inside a window."
hints:
  - "Count the valid windows grouped by where they end. For a fixed right end, which starting positions are allowed?"
  - "A reading above high can never be inside a valid window, while a reading below low is fine as long as some reading in the window is inside the band. Track the most recent position of each kind as you scan."
  - "Scan left to right keeping the last index whose reading is above high and the last index whose reading is in the band, both starting at minus one; for each position, every start strictly after the first index and at or before the second gives a valid window, so add their difference when it is positive."
followups:
  - "How would you count windows whose peak is at least low, with no upper limit?"
  - "How would you answer many (low, high) queries on the same series efficiently?"
  - "How would you count windows whose minimum, rather than maximum, lies in the band?"
  - "What changes if the readings arrive as a stream and you must report the running count?"
common_errors:
  - "Resetting the count when a reading is below low, which drops windows such as [7, 2] whose peak is still in the band."
  - "Counting windows that end at a too-high reading."
  - "Off-by-one errors from initialising the tracked indices to 0 instead of -1."
  - "Using strict comparisons so readings exactly equal to low or high are mishandled."
