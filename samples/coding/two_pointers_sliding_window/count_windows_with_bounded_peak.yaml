slug: count_windows_with_bounded_peak
title: Windows With a Bounded Peak
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [data_analyst, backend, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Windows With a Bounded Peak

  A capacity analyst is studying a series of per-minute CPU readings `values`. For a contiguous run
  of readings (a **window**), its **peak** is the largest reading in it. A window is interesting when
  its peak lies in the band `[low, high]`, both ends inclusive: it reached at least `low` but never
  went above `high`.

  Return the **number of non-empty windows** whose peak lies in `[low, high]`. Windows are counted by
  position, so two windows with the same readings at different positions are counted separately.

  ### Example 1
  ```
  Input:  values = [3, 7, 2, 9, 5], low = 3, high = 7
  Output: 6
  Explanation: [3], [3, 7], [3, 7, 2], [7], [7, 2] and [5]. Any window containing 9 peaks too high,
  and [2] peaks too low.
  ```

  ### Example 2
  ```
  Input:  values = [1, 1, 1], low = 2, high = 4
  Output: 0
  Explanation: no window ever reaches 2.
  ```

  ### Constraints
  - `0 <= values.length <= 10^4`
  - `-10^9 <= values[i] <= 10^9`
  - `-10^9 <= low <= high <= 10^9`
  - The answer fits in a 32-bit signed integer.

  **Follow-up:** can you count in a single `O(n)` pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_bounded_peak_windows
  params:
    - {name: values, type: "int[]"}
    - {name: low, type: int}
    - {name: high, type: int}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_bounded_peak_windows(values: list[int], low: int, high: int) -> int:
        total = 0
        last_too_high = -1  # last index with a reading above high
        last_in_band = -1   # last index with a reading inside [low, high]
        for i, value in enumerate(values):
            if value > high:
                last_too_high = i
            elif value >= low:
                last_in_band = i
            # windows ending at i may start after last_too_high and at or before last_in_band
            total += max(0, last_in_band - last_too_high)
        return total
  javascript: |
    function countBoundedPeakWindows(values, low, high) {
      let total = 0;
      let lastTooHigh = -1;
      let lastInBand = -1;
      for (let i = 0; i < values.length; i++) {
        if (values[i] > high) lastTooHigh = i;
        else if (values[i] >= low) lastInBand = i;
        total += Math.max(0, lastInBand - lastTooHigh);
      }
      return total;
    }
