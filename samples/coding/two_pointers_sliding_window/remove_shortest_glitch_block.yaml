slug: remove_shortest_glitch_block
title: Remove the Shortest Glitch Block
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [data, ml, qa]
time_limit_minutes: 25
prompt_markdown: |
  ## Remove the Shortest Glitch Block

  A cumulative odometer sensor reports `readings` that should never go down over time. A firmware
  glitch corrupted **one contiguous stretch** of the data, and the data team wants to discard as
  little as possible.

  Return the length of the **shortest contiguous block** of readings whose deletion leaves the
  remaining readings (in their original order) **non-decreasing**. Equal neighbouring readings are
  fine. The block may be empty (return `0` when the readings are already non-decreasing), and it may
  be a prefix, a suffix or lie in the middle.

  ### Example 1
  ```
  Input:  readings = [1, 3, 8, 4, 2, 6, 9]
  Output: 3
  Explanation: deleting [8, 4, 2] leaves [1, 3, 6, 9]. No block of length 2 or less works.
  ```

  ### Example 2
  ```
  Input:  readings = [10, 20, 30]
  Output: 0
  ```

  ### Example 3
  ```
  Input:  readings = [9, 7, 5, 3]
  Output: 3
  Explanation: only one reading can be kept, for example by deleting [9, 7, 5].
  ```

  ### Constraints
  - `0 <= readings.length <= 10^5`
  - `-10^9 <= readings[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_glitch_removal
  params:
    - {name: readings, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def shortest_glitch_removal(readings: list[int]) -> int:
        n = len(readings)
        right = n - 1
        while right > 0 and readings[right - 1] <= readings[right]:
            right -= 1
        if right <= 0:
            return 0  # already non-decreasing
        best = right  # delete the whole prefix before the sorted suffix
        for left in range(n):
            if left > 0 and readings[left - 1] > readings[left]:
                break  # the kept prefix must itself be non-decreasing
            while right < n and readings[right] < readings[left]:
                right += 1
            best = min(best, right - left - 1)
        return best
  javascript: |
    function shortestGlitchRemoval(readings) {
      const n = readings.length;
      let right = n - 1;
      while (right > 0 && readings[right - 1] <= readings[right]) right--;
      if (right <= 0) return 0;
      let best = right;
      for (let left = 0; left < n; left++) {
        if (left > 0 && readings[left - 1] > readings[left]) break;
        while (right < n && readings[right] < readings[left]) right++;
        best = Math.min(best, right - left - 1);
      }
      return best;
    }
