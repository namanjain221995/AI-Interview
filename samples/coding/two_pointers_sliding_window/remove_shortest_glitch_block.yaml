expected_concepts:
  - "the kept readings are a non-decreasing prefix joined to a non-decreasing suffix"
  - "longest sorted prefix and longest sorted suffix"
  - "two pointers to join the prefix and suffix at the cheapest point"
  - "deleting only a prefix or only a suffix as baseline answers"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Observes that what remains is a sorted prefix plus a sorted suffix, computes the longest sorted suffix, sweeps the prefix with a second pointer that only moves right, covers the delete-a-prefix and delete-a-suffix cases and explains O(n) time and O(1) space."
  good: "Finds the prefix/suffix structure and joins them with binary search in O(n log n), or reaches the two-pointer join with hints."
  weak: "Tries every block and re-checks sortedness in O(n^2) or worse, or deletes only the first descent it finds."
  criteria:
    correctness: "All tests pass, including strictly decreasing data, equal readings and blocks at either end."
    efficiency: "Both pointers move forward only, giving a linear scan."
    code_quality: "Prefix and suffix boundaries are named clearly and the early return for sorted input is explicit."
    edge_cases: "Empty and single-reading inputs, duplicates across the join, negatives and already-sorted data."
    communication: "Justifies why the suffix pointer never has to move backwards as the prefix grows."
hints:
  - "After deleting one block, what do the surviving readings look like? Think about the part before the block and the part after it separately."
  - "The survivors are a non-decreasing prefix followed by a non-decreasing suffix, and the last kept prefix reading must not exceed the first kept suffix reading. Find the longest non-decreasing suffix first."
  - "Start with the answer of deleting everything before the longest sorted suffix; then walk a left pointer through the sorted prefix, and for each prefix end advance a suffix pointer until its reading is at least the prefix reading, taking the gap between the two pointers as a candidate; stop when the prefix stops being sorted."
followups:
  - "How would you return the start and end index of the block to delete?"
  - "What if you were allowed to delete two separate blocks?"
  - "How does the solution change if the readings must be strictly increasing?"
  - "Could you solve it with binary search instead of the second pointer, and what does that cost?"
common_errors:
  - "Deleting just the readings between the first and last descent, which ignores values that must also go to make the join valid."
  - "Forgetting the option of deleting the entire prefix or the entire suffix."
  - "Treating equal neighbouring readings as a violation."
  - "Letting the prefix pointer continue past the first descent."
