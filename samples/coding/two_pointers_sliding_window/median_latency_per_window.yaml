version: 1
slug: median_latency_per_window
title: Median Latency per Window
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, data, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Median Latency per Window

  A latency dashboard plots the **median** response time over the last `k` requests, because a median is
  not dragged around by a single slow request the way an average is.

  Given the request latencies in arrival order (`latencies`, in microseconds) and an integer `k`, return an
  array of length `n - k + 1` (where `n` is the number of latencies) whose entry `i` is the median of
  `latencies[i]` to `latencies[i + k - 1]` inclusive, in order of `i`.

  The median of `k` values is the middle value after sorting them when `k` is odd, and the mean of the
  two middle values when `k` is even. Return every median as a floating-point number; answers within
  `10^-6` (relative for large values) are accepted.

  ### Example 1
  ```
  Input:  latencies = [40, 12, 55, 31, 28, 90, 7], k = 3
  Output: [40.0, 31.0, 31.0, 31.0, 28.0]
  Explanation: the sorted windows are [12, 40, 55], [12, 31, 55], [28, 31, 55], [28, 31, 90] and [7, 28, 90]
  ```

  ### Example 2
  ```
  Input:  latencies = [8, 3, 10, 5, 7], k = 4
  Output: [6.5, 6.0]
  Explanation: [3, 5, 8, 10] has middle values 5 and 8; [3, 5, 7, 10] has 5 and 7
  ```

  ### Constraints
  - `1 <= k <= latencies.length <= 10^5`
  - `0 <= latencies[i] <= 10^9`
  - The sum of the two middle values can exceed the 32-bit integer range.

  **Follow-up:** re-sorting every window costs `O(n * k log k)`; can you reach `O(n log k)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: window_medians
  params:
    - {name: latencies, type: "int[]"}
    - {name: k, type: int}
  return_type: "float[]"
  comparison: float_tolerance
reference_solutions:
  python: |
    import heapq
    from collections import defaultdict


    def window_medians(latencies: list[int], k: int) -> list[float]:
        low: list[int] = []  # max-heap (negated) with the smaller half; holds the extra value when k is odd
        high: list[int] = []  # min-heap with the larger half
        pending = defaultdict(int)  # value -> copies that left the window but are still inside a heap
        live = [0, 0]  # live element counts in low and high

        def prune(heap: list[int], sign: int) -> None:
            while heap and pending[sign * heap[0]]:
                pending[sign * heap[0]] -= 1
                heapq.heappop(heap)

        def rebalance() -> None:
            while live[0] > live[1] + 1:
                heapq.heappush(high, -heapq.heappop(low))
                live[0] -= 1
                live[1] += 1
                prune(low, -1)
            while live[0] < live[1]:
                heapq.heappush(low, -heapq.heappop(high))
                live[1] -= 1
                live[0] += 1
                prune(high, 1)

        medians: list[float] = []
        for i, value in enumerate(latencies):
            if not low or value <= -low[0]:
                heapq.heappush(low, -value)
                live[0] += 1
            else:
                heapq.heappush(high, value)
                live[1] += 1
            if i >= k:
                leaving = latencies[i - k]
                pending[leaving] += 1
                if leaving <= -low[0]:
                    live[0] -= 1
                else:
                    live[1] -= 1
                prune(low, -1)
                prune(high, 1)
            rebalance()
            if i >= k - 1:
                medians.append(float(-low[0]) if k % 2 else (-low[0] + high[0]) / 2)
        return medians
  javascript: |
    function windowMedians(latencies, k) {
      // Keep the current window sorted; binary search finds where to insert and remove.
      const sorted = [];
      const lowerBound = (x) => {
        let lo = 0;
        let hi = sorted.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (sorted[mid] < x) lo = mid + 1;
          else hi = mid;
        }
        return lo;
      };
      const medians = [];
      for (let i = 0; i < latencies.length; i++) {
        sorted.splice(lowerBound(latencies[i]), 0, latencies[i]);
        if (i >= k) sorted.splice(lowerBound(latencies[i - k]), 1);
        if (i >= k - 1) {
          const mid = k >> 1;
          medians.push(k % 2 === 1 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2);
        }
      }
      return medians;
    }
