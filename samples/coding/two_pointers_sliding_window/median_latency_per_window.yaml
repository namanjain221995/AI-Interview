expected_concepts:
  - two heaps splitting the window into a lower and an upper half
  - lazy deletion of values that left the window
  - rebalancing so the halves differ in size by at most one
  - even and odd k
  - 64-bit or floating-point arithmetic when averaging two middle values
optimal_complexity: {time: O(n log k), space: O(k)}
rubric:
  excellent: Builds the two-heap window with lazy deletion (or an order-statistics structure), keeps sizes balanced after every insert and removal, handles even k without overflow and states O(n log k).
  good: Correct solution with a sorted window and binary search (O(n * k) moves), or two heaps with minor guidance on removing departed values.
  weak: Re-sorts every window from scratch, mishandles even k, removes the wrong copy of a duplicate, or overflows when averaging large latencies.
  criteria:
    correctness: All tests pass, including k = 1, k = n, duplicates and latencies near 10^9.
    efficiency: O(n log k) with heaps or a balanced structure; a sorted window with binary search is acceptable but noted as O(n * k).
    code_quality: Clear separation of insert, remove, rebalance and median steps with documented heap invariants.
    edge_cases: Duplicate values leaving the window, even windows with a half result and single-element windows.
    communication: Explains why lazy deletion is safe and when the halves need rebalancing.
hints:
  - The median only depends on the middle of the sorted window; think about keeping the window split into a lower half and an upper half instead of fully sorted.
  - A max-heap for the lower half and a min-heap for the upper half give you the middle values at their tops; the hard part is removing the value that leaves the window, which a heap cannot do directly.
  - Record departing values in a pending-removal count and only discard them when they reach a heap top, track how many live values each half holds, rebalance so the lower half has the same number or one more, and read the median from the lower top for odd k or the average of both tops (in 64-bit or floating point) for even k.
followups:
  - How would you implement the same idea in a language with a balanced tree or multiset?
  - What changes if you need the 90th percentile of each window instead of the median?
  - How would you produce an approximate median over a very large window with bounded memory?
  - How much memory can lazy deletion waste in the worst case, and how would you bound it?
common_errors:
  - Sorting a fresh copy of every window, which is O(n * k log k).
  - Averaging the two middle values in 32-bit integers, which overflows for latencies near 10^9.
  - Integer division for even k, which drops the half.
  - Deciding which heap a departing value belongs to without considering duplicates, which unbalances the halves.
  - Forgetting to rebalance after removals as well as after inserts.
