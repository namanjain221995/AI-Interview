version: 1
slug: config_abbreviation_matches
title: Resource Name Abbreviation Check
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Resource Name Abbreviation Check

  An internal ops CLI lets engineers type shortened resource names, in the style of `k8s` for
  `kubernetes`. An abbreviation is read from left to right:

  - a **letter** must equal the next character of the name;
  - a **run of consecutive digits** is read as one number `m` and skips exactly the next `m` characters
    of the name (`12` means skip twelve, not one then two).

  An abbreviation **matches** a name when it consumes the whole name exactly: no characters left over and
  no skipping past the end. A number that starts with `0` (including the number `0` itself) is invalid, so
  an abbreviation containing one never matches.

  Given a resource `name` and an abbreviation `abbr`, return `true` if `abbr` matches `name`, otherwise
  `false`.

  ### Example 1
  ```
  Input:  name = "kubernetes", abbr = "k8s"
  Output: true
  Explanation: k matches, 8 skips 'ubernete', s matches the last character
  ```

  ### Example 2
  ```
  Input:  name = "deployment", abbr = "d08t"
  Output: false
  ```

  ### Example 3
  ```
  Input:  name = "ingress", abbr = "i4s"
  Output: false
  Explanation: i matches, 4 skips 'ngre', s matches the first s, but the final s of the name is never consumed
  ```

  ### Constraints
  - `1 <= name.length <= 100`; `name` contains only lowercase letters
  - `1 <= abbr.length <= 100`; `abbr` contains only lowercase letters and digits
  - Every run of digits in `abbr` has at most 4 digits
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: abbreviation_matches
  params:
    - {name: name, type: "string"}
    - {name: abbr, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def abbreviation_matches(name: str, abbr: str) -> bool:
        i = 0
        j = 0
        while j < len(abbr):
            ch = abbr[j]
            if ch.isdigit():
                if ch == "0":
                    return False
                skip = 0
                while j < len(abbr) and abbr[j].isdigit():
                    skip = skip * 10 + int(abbr[j])
                    j += 1
                i += skip
                if i > len(name):
                    return False
            else:
                if i >= len(name) or name[i] != ch:
                    return False
                i += 1
                j += 1
        return i == len(name)
  javascript: |
    function abbreviationMatches(name, abbr) {
      const isDigit = (c) => c >= "0" && c <= "9";
      let i = 0;
      let j = 0;
      while (j < abbr.length) {
        const ch = abbr[j];
        if (isDigit(ch)) {
          if (ch === "0") return false;
          let skip = 0;
          while (j < abbr.length && isDigit(abbr[j])) {
            skip = skip * 10 + (abbr.charCodeAt(j) - 48);
            j++;
          }
          i += skip;
          if (i > name.length) return false;
        } else {
          if (i >= name.length || name[i] !== ch) return false;
          i++;
          j++;
        }
      }
      return i === name.length;
    }
tests:
  - {id: t1, args: ["kubernetes", "k8s"], expected: true, description: "Example 1"}
  - {id: t2, args: ["deployment", "d08t"], expected: false, description: "Example 2 - number with a leading zero is invalid"}
  - {id: t3, args: ["ingress", "i4s"], expected: false, description: "Example 3 - one name character left over"}
  - {id: t4, hidden: true, args: ["api", "3"], expected: true, description: "Abbreviation is only a number covering the whole name"}
  - {id: t5, hidden: true, args: ["cache", "cache"], expected: true, description: "No digits - literal exact match"}
  - {id: t6, hidden: true, args: ["ab", "a0b"], expected: false, description: "Bare zero is invalid even though skipping zero would otherwise fit"}
  - {id: t7, hidden: true, args: ["service", "s5"], expected: false, description: "Abbreviation ends with one character of the name left over"}
  - {id: t8, hidden: true, args: ["observability", "ob10y"], expected: true, description: "Multi-digit number in the middle of the abbreviation"}
  - {id: t9, hidden: true, args: ["loadbalancer", "12"], expected: true, description: "Two-digit number must be read as twelve"}
  - {id: t10, hidden: true, args: ["node", "9999"], expected: false, description: "Large number skips past the end"}
  - {id: t11, hidden: true, args: ["gateway", "gb5"], expected: false, description: "Letter mismatch right after the first character"}
  - {id: t12, hidden: true, args: ["namespace", "name5x"], expected: false, description: "Abbreviation continues after the name is fully consumed"}
expected_concepts:
  - two pointers over the name and the abbreviation
  - parsing a multi-digit number
  - rejecting leading zeros
  - checking both strings are fully consumed
optimal_complexity: {time: O(n + m), space: O(1)}
rubric:
  excellent: Walks both strings with two indices, parses whole digit runs as one number, rejects leading zeros up front, guards against skipping past the end and checks that the name is fully consumed at the end.
  good: Correct two-pointer solution after fixing one boundary case found by the tests, such as the final length check or the zero rule.
  weak: Treats each digit as a separate skip, accepts leading zeros, ignores leftover characters, or indexes past the end of the name.
  criteria:
    correctness: All tests pass, including leading zeros, multi-digit numbers and leftover characters on either side.
    efficiency: Single linear pass over both strings with constant memory.
    code_quality: Number parsing is isolated and the two indices have clear roles.
    edge_cases: Abbreviation that is only a number, number skipping past the end, letters after the name is consumed, bare zero.
    communication: States the matching rules back before coding, especially how digit runs and zeros are handled.
hints:
  - Think of reading the name and the abbreviation side by side with one position in each. What should happen to the name position when you read a letter, and when you read a number?
  - Read a whole run of digits before using it, check the first digit of that run for the zero rule, and remember that a match also requires you to land exactly at the end of the name.
  - Keep an index into the name and an index into the abbreviation; for a letter, fail if the name is exhausted or the characters differ, otherwise advance both; for a digit, fail on a leading zero, accumulate the full number, advance the name index by it and fail if it passes the end; at the end, succeed only if the name index equals the name length.
followups:
  - How would you generate the shortest valid abbreviation that matches a name but no other name in a list?
  - How would you support an abbreviation that is matched as a prefix rather than the whole name?
  - What would you change if numbers could be arbitrarily long?
common_errors:
  - Treating each digit as its own skip so 12 skips three characters instead of twelve.
  - Allowing numbers with a leading zero or the bare number zero.
  - Returning true when the abbreviation ends before the name is consumed.
  - Comparing characters after a skip without first checking the name index is still in range.
