expected_concepts:
  - "the largest square is at one of the two ends of a sorted array"
  - "two pointers from both ends filling the output from the back"
  - "O(n) time versus O(n log n) re-sorting"
  - "handling duplicates and zeros"
optimal_complexity: {time: "O(n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Observes that the largest square sits at one end, fills the output from the back with two pointers in O(n), handles empty and single-element input and compares the approach with square-and-sort."
  good: "Gives the square-and-sort solution correctly and reaches the two-pointer version with a hint, or implements two pointers with a small off-by-one fixed during testing."
  weak: "Assumes squares are already sorted, loses duplicates, or cannot get past the sort-based approach after hints."
  criteria:
    correctness: "Output has the same length as the input and is non-decreasing for mixed signs, duplicates and zeros."
    efficiency: "Linear time with two pointers; no sort call."
    code_quality: "Writes into a pre-sized result with a clear write index."
    edge_cases: "Empty input, single value, all negative, all positive and both extremes."
    communication: "Explains why the maximum remaining square is always at the left or right end."
hints:
  - "After squaring, large negative values become large positive ones, so think about where the biggest squares come from in a sorted input."
  - "The biggest remaining square is always at one of the two ends of the input; you can build the answer from the largest value downwards."
  - "Keep a pointer at each end and a write position at the back of a result of the same length; place the square of whichever end has the larger absolute value, move that pointer inward, and step the write position back until it reaches the front."
followups:
  - "How would you return the k smallest squared deviations without producing them all?"
  - "What changes if the transformation were the absolute value instead of the square?"
  - "Could you produce the output in increasing order starting from the value closest to zero instead?"
common_errors:
  - "Returning the squares in input order, which is wrong when negatives are present."
  - "Looping while left < right instead of left <= right, which drops the last remaining element."
  - "Filling the result from the front with the larger square, which reverses the order."
  - "Calling sort and claiming O(n) time."
