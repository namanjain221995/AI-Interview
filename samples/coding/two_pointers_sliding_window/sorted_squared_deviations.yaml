version: 1
slug: sorted_squared_deviations
title: "Sorted Squared Deviations"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, data, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Sorted Squared Deviations

  A temperature sensor array reports, for each probe, how far its reading is from the calibration point.
  Readings below the calibration point are negative. The firmware already delivers these `deviations`
  sorted in **non-decreasing** order.

  The quality report needs the **squared** deviation of every probe, also in non-decreasing order, so it
  can compute error percentiles. Write `squared_deviations_sorted(deviations)` that returns a list of the
  same length containing each deviation squared, sorted in non-decreasing order.

  - Duplicate values stay in the output as many times as they occur.
  - An empty input returns an empty list.
  - A solution that squares and then re-sorts is correct; the expected solution runs in `O(n)` time.

  ### Example 1
  ```
  Input:  deviations = [-6, -2, 0, 3, 5]
  Output: [0, 4, 9, 25, 36]
  ```

  ### Example 2
  ```
  Input:  deviations = [-4, -4, -1]
  Output: [1, 16, 16]
  ```

  ### Constraints
  - `0 <= deviations.length <= 10^4`
  - `-10^4 <= deviations[i] <= 10^4`
  - `deviations` is sorted in non-decreasing order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: squared_deviations_sorted
  params:
    - {name: deviations, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def squared_deviations_sorted(deviations: list[int]) -> list[int]:
        n = len(deviations)
        result = [0] * n
        left, right = 0, n - 1
        for write in range(n - 1, -1, -1):
            if abs(deviations[left]) > abs(deviations[right]):
                result[write] = deviations[left] * deviations[left]
                left += 1
            else:
                result[write] = deviations[right] * deviations[right]
                right -= 1
        return result
  javascript: |
    function squaredDeviationsSorted(deviations) {
      const n = deviations.length;
      const result = new Array(n).fill(0);
      let left = 0;
      let right = n - 1;
      for (let write = n - 1; write >= 0; write--) {
        if (Math.abs(deviations[left]) > Math.abs(deviations[right])) {
          result[write] = deviations[left] * deviations[left];
          left++;
        } else {
          result[write] = deviations[right] * deviations[right];
          right--;
        }
      }
      return result;
    }
