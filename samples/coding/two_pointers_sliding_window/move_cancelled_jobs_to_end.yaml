expected_concepts:
  - "read pointer and write pointer (stable compaction)"
  - "filling the tail with -1 after the scan"
  - "preserving relative order of kept elements"
  - "O(n) time and O(1) extra space in place"
optimal_complexity: {time: "O(n)", space: "O(1) extra when done in place"}
rubric:
  excellent: "Uses a read pointer and a write pointer to compact live jobs stably, fills the tail with -1, explains why order is preserved and states O(n) time with O(1) extra space."
  good: "Builds the result with two passes or two lists correctly and can describe the in-place version when prompted."
  weak: "Swaps elements in a way that reorders live jobs, sorts the queue, or drops the -1 slots so the length changes."
  criteria:
    correctness: "Live jobs keep their relative order, the output length is unchanged and every -1 is at the end."
    efficiency: "Single linear scan plus tail fill."
    code_quality: "Clearly named read and write positions with no nested loops."
    edge_cases: "Empty queue, no holes, all holes and duplicate ids."
    communication: "Explains the invariant that everything before the write position is final."
hints:
  - "Think of the live jobs as the ones you keep; where should the next kept job be placed?"
  - "Track a position where the next live job will be written while you scan the queue with a separate position."
  - "Scan once; each time you meet a live job copy it to the write position and advance that position by one; after the scan, every slot from the write position to the end becomes a cancelled slot."
followups:
  - "How would you minimise the number of writes if writes are expensive?"
  - "What changes if order does not need to be preserved?"
  - "How would you do this when cancellations are marked by a predicate instead of a sentinel value?"
common_errors:
  - "Swapping each -1 with the last element, which breaks the relative order of live jobs."
  - "Removing the -1 values instead of moving them, so the output is shorter than the input."
  - "Sorting the queue."
  - "Removing elements from the list while iterating over it."
