version: 1
slug: move_cancelled_jobs_to_end
title: "Move Cancelled Jobs to the End"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, devops]
time_limit_minutes: 12
prompt_markdown: |
  ## Move Cancelled Jobs to the End

  A batch scheduler stores its run queue as a fixed-size list of job ids. When a job is cancelled its slot
  is overwritten with `-1`, leaving holes that the dispatcher keeps tripping over.

  Write `compact_job_queue(queue)` that returns the queue after compaction:

  - every live job id (any value other than `-1`) comes first, in exactly the **same relative order** as
    in the input;
  - every `-1` slot comes after all live jobs;
  - the returned list has the same length as the input.

  The same job id may appear more than once (a job that was queued twice); keep every occurrence.

  ### Example 1
  ```
  Input:  queue = [4, -1, 7, -1, 2]
  Output: [4, 7, 2, -1, -1]
  ```

  ### Example 2
  ```
  Input:  queue = [-1, -1, 9]
  Output: [9, -1, -1]
  ```

  ### Constraints
  - `0 <= queue.length <= 10^4`
  - Each `queue[i]` is `-1` or a job id with `1 <= queue[i] <= 10^9`.

  **Follow-up:** can you compact the list in place with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: compact_job_queue
  params:
    - {name: queue, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def compact_job_queue(queue: list[int]) -> list[int]:
        result = list(queue)
        write = 0
        for read in range(len(result)):
            if result[read] != -1:
                result[write] = result[read]
                write += 1
        for k in range(write, len(result)):
            result[k] = -1
        return result
  javascript: |
    function compactJobQueue(queue) {
      const result = queue.slice();
      let write = 0;
      for (let read = 0; read < result.length; read++) {
        if (result[read] !== -1) {
          result[write] = result[read];
          write++;
        }
      }
      for (let k = write; k < result.length; k++) result[k] = -1;
      return result;
    }
