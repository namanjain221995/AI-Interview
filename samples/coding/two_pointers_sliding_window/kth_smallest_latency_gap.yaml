slug: kth_smallest_latency_gap
title: "Kth Smallest Latency Gap"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [sre, data, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Kth Smallest Latency Gap

  An SRE is checking how consistent a pool of servers is. `latencies[i]` is the median response time of server
  `i` in microseconds. For every pair of different servers `i < j` the **gap** is `|latencies[i] - latencies[j]|`,
  which gives `n * (n - 1) / 2` gaps in total (equal gaps from different pairs are all counted).

  Write `kth_smallest_gap(latencies, k)` that returns the `k`-th smallest gap, counting from `1`, when all
  gaps are listed in non-decreasing order.

  ### Example 1
  ```
  Input:  latencies = [40, 10, 25, 31], k = 1
  Output: 6
  Explanation: the closest pair is 25 and 31
  ```

  ### Example 2
  ```
  Input:  latencies = [40, 10, 25, 31], k = 4
  Output: 15
  Explanation: the six gaps in order are 6, 9, 15, 15, 21, 30
  ```

  ### Constraints
  - `2 <= latencies.length <= 10^4`
  - `0 <= latencies[i] <= 10^6`
  - `1 <= k <= n * (n - 1) / 2`

  **Follow-up:** listing every gap is `O(n^2)`; can you avoid building that list?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: kth_smallest_gap
  params:
    - {name: latencies, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def kth_smallest_gap(latencies: list[int], k: int) -> int:
        values = sorted(latencies)
        n = len(values)

        def pairs_within(limit: int) -> int:
            count = 0
            left = 0
            for right in range(n):
                while values[right] - values[left] > limit:
                    left += 1
                count += right - left
            return count

        low, high = 0, values[-1] - values[0]
        while low < high:
            mid = (low + high) // 2
            if pairs_within(mid) >= k:
                high = mid
            else:
                low = mid + 1
        return low
  javascript: |
    function kthSmallestGap(latencies, k) {
      const values = [...latencies].sort((a, b) => a - b);
      const n = values.length;
      const pairsWithin = (limit) => {
        let count = 0;
        let left = 0;
        for (let right = 0; right < n; right++) {
          while (values[right] - values[left] > limit) left++;
          count += right - left;
        }
        return count;
      };
      let low = 0;
      let high = values[n - 1] - values[0];
      while (low < high) {
        const mid = Math.floor((low + high) / 2);
        if (pairsWithin(mid) >= k) high = mid;
        else low = mid + 1;
      }
      return low;
    }
