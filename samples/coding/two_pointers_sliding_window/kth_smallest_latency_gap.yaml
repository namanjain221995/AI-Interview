expected_concepts:
  - "sorting so pair gaps become index distances"
  - "binary search on the answer value"
  - "two-pointer count of pairs with gap at most a limit"
  - "monotonic predicate: the count only grows with the limit"
  - "O(n log n + n log W) time where W is the value range"
optimal_complexity: {time: "O(n log n + n log W)", space: "O(n)"}
rubric:
  excellent: "Sorts, binary searches the gap value with a correct lower-bound loop, counts pairs within a limit in linear time with two pointers, explains why the result is an actual gap, and states O(n log n + n log W) time."
  good: "Binary search on the answer with an O(n log n) counting step (binary search per element), or the optimal approach with an off-by-one fixed under guidance."
  weak: "Builds and sorts all n^2 gaps, uses a heap of all pairs without improving, or returns a value that is not the k-th gap due to search bounds."
  criteria:
    correctness: "All tests pass, including zero gaps, k = 1 and the maximum k."
    efficiency: "Each counting pass is linear and the search runs over the value range, not over pairs."
    code_quality: "Counting is a separate helper with a clear contract (pairs with gap at most the limit)."
    edge_cases: "Duplicates, all-equal input, two servers and the largest possible k."
    communication: "Explains why the smallest limit whose count reaches k must be an existing gap."
hints:
  - "Instead of finding the k-th gap directly, ask an easier question: for a given limit, how many pairs have a gap at most that limit?"
  - "After sorting, the pairs with gap at most a limit can be counted with two pointers in one pass. That count never decreases as the limit grows, so you can binary search the limit."
  - "Sort the latencies, then binary search the limit between zero and the largest minus the smallest value; for each candidate, move a right pointer over the array while advancing a left pointer until the gap fits, add the window size minus one to the count, and keep the smallest limit whose count reaches k."
followups:
  - "Why does the binary search always land on a gap that some pair actually has?"
  - "How would you solve it if k were always very small, for example at most 10?"
  - "What changes if latencies are floating-point values?"
  - "How would you find the k-th largest gap instead?"
common_errors:
  - "Generating every pair, which is quadratic in time and memory."
  - "Resetting the left pointer for each right pointer, making the count quadratic."
  - "Using a search that stops on a limit whose count is exactly k, which may not exist."
  - "Forgetting to sort before the two-pointer count."
