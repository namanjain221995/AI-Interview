version: 1
slug: most_high_priority_in_window
title: Most High-Priority Tickets in a Window
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [support_engineer, general, backend]
time_limit_minutes: 12
prompt_markdown: |
  ## Most High-Priority Tickets in a Window

  A support queue logs the priority of every incoming ticket in arrival order as one character:
  `H` (high), `M` (medium) or `L` (low). To size the on-duty team, the support lead wants to know the
  worst burst: across every block of exactly `k` **consecutive** tickets, what is the largest number of
  `H` tickets in one block?

  Return that maximum count.

  ### Example 1
  ```
  Input:  tickets = "MHHLHMH", k = 4
  Output: 3
  Explanation: the block "HHLH" (0-based positions 1 to 4) holds three high-priority tickets
  ```

  ### Example 2
  ```
  Input:  tickets = "LLM", k = 2
  Output: 0
  Explanation: no block contains an H
  ```

  ### Constraints
  - `1 <= k <= tickets.length <= 10^5`
  - Every character of `tickets` is `H`, `M` or `L`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_high_priority
  params:
    - {name: tickets, type: "string"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_high_priority(tickets: str, k: int) -> int:
        count = sum(1 for c in tickets[:k] if c == "H")
        best = count
        for i in range(k, len(tickets)):
            if tickets[i] == "H":
                count += 1
            if tickets[i - k] == "H":
                count -= 1
            best = max(best, count)
        return best
  javascript: |
    function maxHighPriority(tickets, k) {
      let count = 0;
      for (let i = 0; i < k; i++) if (tickets[i] === "H") count++;
      let best = count;
      for (let i = k; i < tickets.length; i++) {
        if (tickets[i] === "H") count++;
        if (tickets[i - k] === "H") count--;
        best = Math.max(best, count);
      }
      return best;
    }
tests:
  - {id: t1, args: ["MHHLHMH", 4], expected: 3, description: "Example 1"}
  - {id: t2, args: ["LLM", 2], expected: 0, description: "Example 2 - no high-priority tickets at all"}
  - {id: t3, hidden: true, args: ["H", 1], expected: 1, description: "Minimum size - one ticket, k = 1"}
  - {id: t4, hidden: true, args: ["HMHLH", 5], expected: 3, description: "k equals the length - single window"}
  - {id: t5, hidden: true, args: ["LHLLMH", 1], expected: 1, description: "k = 1 - answer is 1 if any H exists"}
  - {id: t6, hidden: true, args: ["HHHHHH", 3], expected: 3, description: "All high priority"}
  - {id: t7, hidden: true, args: ["LLLLMMHHH", 3], expected: 3, description: "Best window is the last one (loop must include the final window)"}
  - {id: t8, hidden: true, args: ["HHMLLLLLLMH", 2], expected: 2, description: "Best window is the first one"}
  - {id: t9, hidden: true, args: ["", 37], expected: 12, description: "1000 random tickets, k = 37 (stress, needs O(n) fixed window)"}
expected_concepts:
  - "fixed-size sliding window"
  - "incremental count update (add entering, remove leaving)"
  - "O(n) instead of recounting each window"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Counts the first window, then slides one step at a time adding the entering ticket and removing the leaving one, covers the first and last windows and states O(n) time with O(1) space."
  good: "Correct sliding window with an off-by-one fixed after running tests, or a prefix-count solution with O(n) extra space."
  weak: "Recounts every window in O(n k), skips the first or last window, or counts all H tickets in the string."
  criteria:
    correctness: "All tests pass, including k equal to the length and best windows at either end."
    efficiency: "Linear time with constant extra space."
    code_quality: "The entering and leaving indices are obvious; no duplicated counting loops beyond the first window."
    edge_cases: "k = 1, k = n, no H and all H."
    communication: "Explains why only two characters change between neighbouring windows."
hints:
  - "Two neighbouring blocks of k tickets share almost all of their tickets; what actually changes?"
  - "Count the high-priority tickets in the first block once, then move the block one step at a time and update the count instead of recounting."
  - "When the block moves right by one, add one if the newly included ticket is high priority and subtract one if the ticket that just dropped out was high priority; track the largest count seen, starting with the first block."
followups:
  - "How would you return the start position of the busiest block, choosing the earliest on ties?"
  - "How would you find the shortest block that contains at least m high-priority tickets?"
  - "What if the window were defined by time (say ten minutes) rather than by ticket count?"
common_errors:
  - "Recounting each window from scratch, giving O(n k) time."
  - "Starting the slide loop at the wrong index so the last window is never evaluated."
  - "Forgetting to compare the first window's count before sliding."
