version: 1
slug: palindrome_with_one_typo
title: Mirrored Code After One Deletion
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, qa, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Mirrored Code After One Deletion

  Storage bins in a warehouse carry **mirrored** label codes: a valid code reads the same from left to
  right as from right to left (for example `level` or `noon`). A faulty label printer occasionally
  inserts one stray character somewhere in a code.

  Given a scanned code, return `true` if it can be made mirrored by deleting **at most one**
  character, and `false` otherwise. A code that is already mirrored needs no deletion and returns
  `true`.

  ### Example 1
  ```
  Input:  code = "racecar"
  Output: true
  Explanation: The code is already mirrored, so no deletion is needed.
  ```

  ### Example 2
  ```
  Input:  code = "abcdba"
  Output: true
  Explanation: Deleting 'd' leaves "abcba", which reads the same both ways.
  ```

  ### Example 3
  ```
  Input:  code = "pqrs"
  Output: false
  Explanation: Every single deletion still leaves a code that differs when reversed.
  ```

  ### Constraints
  - `1 <= code.length <= 10^5`
  - `code` consists of lowercase English letters only.

  **Follow-up:** Can you answer in `O(n)` time and `O(1)` extra space, without building new strings for every possible deletion?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: mirrored_after_one_deletion
  params:
    - {name: code, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def mirrored_after_one_deletion(code: str) -> bool:
        def is_mirrored(lo: int, hi: int) -> bool:
            while lo < hi:
                if code[lo] != code[hi]:
                    return False
                lo += 1
                hi -= 1
            return True

        lo, hi = 0, len(code) - 1
        while lo < hi:
            if code[lo] != code[hi]:
                return is_mirrored(lo + 1, hi) or is_mirrored(lo, hi - 1)
            lo += 1
            hi -= 1
        return True
  javascript: |
    function mirroredAfterOneDeletion(code) {
      const isMirrored = (lo, hi) => {
        while (lo < hi) {
          if (code[lo] !== code[hi]) return false;
          lo++;
          hi--;
        }
        return true;
      };
      let lo = 0;
      let hi = code.length - 1;
      while (lo < hi) {
        if (code[lo] !== code[hi]) {
          return isMirrored(lo + 1, hi) || isMirrored(lo, hi - 1);
        }
        lo++;
        hi--;
      }
      return true;
    }
tests:
  - {id: t1, args: ["racecar"], expected: true, description: "Example 1 - already mirrored, odd length"}
  - {id: t2, args: ["abcdba"], expected: true, description: "Example 2 - one stray character in the middle"}
  - {id: t3, args: ["pqrs"], expected: false, description: "Example 3 - needs more than one deletion"}
  - {id: t4, hidden: true, args: ["z"], expected: true, description: "Minimum length - single character"}
  - {id: t5, hidden: true, args: ["ab"], expected: true, description: "Two different characters - delete either"}
  - {id: t6, hidden: true, args: ["xmadam"], expected: true, description: "Stray character at the very start"}
  - {id: t7, hidden: true, args: ["abxcyba"], expected: false, description: "Outer characters match but both inner deletions fail"}
  - {id: t8, hidden: true, args: ["abaccacba"], expected: true, description: "Ambiguous mismatch - only deleting the right-hand character works although the left deletion looks plausible"}
  - {id: t9, hidden: true, args: ["bacbccbab"], expected: true, description: "Ambiguous mismatch - only deleting the left-hand character works although the right deletion looks plausible"}
  - {id: t10, hidden: true, args: ["abccbx"], expected: false, description: "Stray characters at both ends - two deletions needed"}
  - {id: t11, hidden: true, args: [""], expected: true, description: "Stress - 1000 characters with one stray character just right of the centre"}
expected_concepts:
- two pointers moving inward from both ends
- branching into two candidate deletions at the first mismatch
- checking the remaining range in place without building new strings
- O(n) time with O(1) extra space
optimal_complexity:
  time: O(n)
  space: O(1)
rubric:
  excellent: Walks inward until the first mismatch, explains why only the two deletions at that point need checking,
    verifies both ranges in place and states O(n) time and O(1) space.
  good: Correct two-pointer solution that tries both deletions, perhaps using substring copies or needing a nudge
    on the ambiguous case.
  weak: Tries every deletion with a full palindrome check (O(n^2)), or greedily picks one side at the mismatch and
    fails ambiguous cases.
  criteria:
    correctness: All tests pass, including mismatches where only one of the two deletions works.
    efficiency: Single linear scan plus at most two linear range checks with constant extra memory.
    code_quality: A small helper that checks a range, clear pointer names and no duplicated loops.
    edge_cases: Single-character codes, two-character codes and stray characters at either end.
    communication: Explains why matched outer characters never need to be revisited.
hints:
- Compare characters from both ends moving inward; while they match, the outer characters are fine and never need
  revisiting.
- At the first mismatch, the stray character must be one of the two characters you are looking at, so there are
  only two possibilities to check.
- Move two indexes inward until they disagree; then test whether the range that skips the left character is mirrored
  or the range that skips the right character is mirrored, checking each range in place, and return true if either
  succeeds or if no mismatch was found at all.
followups:
- How would you generalise this to allow up to k deletions, and what would it cost?
- Why is it not enough to skip whichever side happens to match the next character?
- How would you report which position should be deleted?
- What would change if the codes could contain uppercase letters and separators that should be ignored?
common_errors:
- Choosing only one side to skip at the mismatch, which fails when the other deletion was the right one.
- Allowing a second deletion inside the helper check instead of requiring an exact mirror.
- Trying every possible deletion with a fresh string, which is O(n^2) time and memory.
- Returning false for a code that is already mirrored.
