title: "Windows Hitting Exact Floor and Ceiling"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [data_analyst, sre, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Windows Hitting Exact Floor and Ceiling

  An SRE team calibrates an alerting rule on a series of metric samples `values`. A **calibration window** is
  a non-empty contiguous run of samples whose **minimum is exactly** `floor_value` and whose **maximum is
  exactly** `ceiling_value`. In other words, every sample in the run lies between the two bounds (inclusive),
  at least one sample equals `floor_value` and at least one sample equals `ceiling_value`.

  Write `count_bounded_windows(values, floor_value, ceiling_value)` that returns the number of calibration
  windows. Windows are identified by their start and end positions, so equal-looking windows at different
  positions are counted separately. When `floor_value == ceiling_value`, a single sample equal to that value
  satisfies both conditions.

  ### Example 1
  ```
  Input:  values = [2, 5, 3, 7, 5, 2, 9], floor_value = 2, ceiling_value = 5
  Output: 3
  Explanation: [2, 5], [2, 5, 3] and [5, 2]; any window containing 7 or 9 has a larger maximum
  ```

  ### Example 2
  ```
  Input:  values = [4, 4, 1, 4], floor_value = 4, ceiling_value = 4
  Output: 4
  Explanation: every window made only of 4s qualifies: three single samples and the pair [4, 4]
  ```

  ### Constraints
  - `1 <= values.length <= 10^4`
  - `-10^9 <= values[i] <= 10^9`
  - `-10^9 <= floor_value <= ceiling_value <= 10^9`

  **Follow-up:** can you count them in a single `O(n)` pass with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_bounded_windows
  params:
    - {name: values, type: "int[]"}
    - {name: floor_value, type: "int"}
    - {name: ceiling_value, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_bounded_windows(values: list[int], floor_value: int, ceiling_value: int) -> int:
        total = 0
        last_bad = -1      # last index whose value lies outside [floor_value, ceiling_value]
        last_floor = -1    # last index holding floor_value
        last_ceiling = -1  # last index holding ceiling_value
        for i, value in enumerate(values):
            if value < floor_value or value > ceiling_value:
                last_bad = i
            if value == floor_value:
                last_floor = i
            if value == ceiling_value:
                last_ceiling = i
            # Windows ending at i are valid for every start in (last_bad, min(last_floor, last_ceiling)].
            total += max(0, min(last_floor, last_ceiling) - last_bad)
        return total
  javascript: |
    function countBoundedWindows(values, floorValue, ceilingValue) {
      let total = 0;
      let lastBad = -1;
      let lastFloor = -1;
      let lastCeiling = -1;
      for (let i = 0; i < values.length; i++) {
        const value = values[i];
        if (value < floorValue || value > ceilingValue) lastBad = i;
        if (value === floorValue) lastFloor = i;
        if (value === ceilingValue) lastCeiling = i;
        total += Math.max(0, Math.min(lastFloor, lastCeiling) - lastBad);
      }
      return total;
    }
