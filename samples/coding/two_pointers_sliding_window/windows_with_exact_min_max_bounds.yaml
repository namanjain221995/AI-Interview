expected_concepts:
  - "counting windows by their right end"
  - "tracking the last index of an out-of-range sample"
  - "tracking the last index of the floor value and of the ceiling value"
  - "number of valid starts is the gap between the earlier of the two and the last bad index"
  - "O(n) time and O(1) space"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Counts windows by their right end, keeps the last positions of an out-of-range sample, the floor and the ceiling, derives the count of valid starts as a clamped difference, handles floor equal to ceiling naturally and states O(n) time and O(1) space."
  good: "Correct solution with monotonic deques or a segment-splitting approach in O(n) or O(n log n), or the three-pointer idea with some prompting."
  weak: "Enumerates all windows with running min and max in O(n^2) without improving, forgets to reset on out-of-range samples, or double counts when floor equals ceiling."
  criteria:
    correctness: "All tests pass, including floor equal to ceiling and bounds that never occur."
    efficiency: "Single pass with three indices and constant extra memory."
    code_quality: "The three tracked positions are clearly named and the per-step count is one expression."
    edge_cases: "Single samples, missing bounds, negative values and long runs of identical samples."
    communication: "Explains why every start between the last bad index and the earlier of the two last bound positions works."
hints:
  - "Count the windows grouped by where they end. For a fixed end, which starts produce a valid window?"
  - "A window ending at position i is valid when its start is after the most recent out-of-range sample and at or before both the most recent floor sample and the most recent ceiling sample. Track those three positions as you scan."
  - "Scan left to right, updating the last out-of-range index, the last index equal to the floor and the last index equal to the ceiling (starting each at minus one); at every position add the smaller of the two bound positions minus the out-of-range position, but never a negative amount, to the running total."
followups:
  - "How would you count windows whose minimum is at least the floor and whose maximum is at most the ceiling (without requiring equality)?"
  - "How would you answer the same question for many different bound pairs?"
  - "What changes if the samples arrive as an unbounded stream?"
  - "How would you return the longest calibration window instead of the count?"
common_errors:
  - "Not resetting when a sample is outside the bounds, which counts windows containing it."
  - "Adding a negative amount when a bound has not been seen since the last break."
  - "Special-casing floor equal to ceiling and counting single samples twice."
  - "Counting only windows that start exactly at a floor or ceiling sample, which misses starts on in-range samples before them."
