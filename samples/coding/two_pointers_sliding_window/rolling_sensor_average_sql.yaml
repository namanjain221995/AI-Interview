version: 1
slug: rolling_sensor_average_sql
title: Rolling Sensor Average (SQL)
difficulty: medium
competency_keys: [sql, databases, problem_solving]
role_tags: [data, data_analyst, dba]
time_limit_minutes: 20
prompt_markdown: |
  ## Rolling Sensor Average

  A plant-monitoring service stores the readings of its pump and fan sensors in table `sensor_readings`:

  | column | type | notes |
  |--------|------|-------|
  | sensor_id | TEXT | sensor identifier |
  | seq | INTEGER | sequence number of the reading within its sensor; `(sensor_id, seq)` is the primary key |
  | value | INTEGER | measured value (may be negative) |

  Sequence numbers grow over time but are **not contiguous**: readings lost in transit leave gaps.

  The dashboard shows every reading next to a **rolling average**: the average of that reading and the
  **up to two stored readings that come immediately before it for the same sensor**, in `seq` order.
  Gaps do not matter: "before" means the previous stored rows of that sensor, not `seq - 1` and `seq - 2`.
  A sensor's first reading averages only itself and its second reading averages two values.

  Return `sensor_id`, `seq` and `rolling_avg` (the average rounded to **2 decimal places**) for every
  reading, ordered by `sensor_id` ascending and then `seq` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  sensor_readings
  +-----------+-----+-------+
  | sensor_id | seq | value |
  +-----------+-----+-------+
  | pump-a    | 1   | 10    |
  | pump-a    | 2   | 12    |
  | pump-a    | 4   | 17    |
  | pump-a    | 7   | 11    |
  | pump-b    | 3   | 5     |
  | pump-b    | 9   | 8     |
  +-----------+-----+-------+

  Output
  +-----------+-----+-------------+
  | sensor_id | seq | rolling_avg |
  +-----------+-----+-------------+
  | pump-a    | 1   | 10.00       |
  | pump-a    | 2   | 11.00       |
  | pump-a    | 4   | 13.00       |
  | pump-a    | 7   | 13.33       |
  | pump-b    | 3   | 5.00        |
  | pump-b    | 9   | 6.50        |
  +-----------+-----+-------------+
  pump-a seq 7 averages seq 2, 4 and 7: (12 + 17 + 11) / 3 = 13.333..., rounded to 13.33.
  ```

  ### Example 2
  ```
  sensor_readings
  +-----------+-----+-------+
  | sensor_id | seq | value |
  +-----------+-----+-------+
  | fan-01    | 5   | 4     |
  | fan-01    | 6   | 9     |
  | fan-01    | 9   | -2    |
  +-----------+-----+-------+

  Output
  +-----------+-----+-------------+
  | sensor_id | seq | rolling_avg |
  +-----------+-----+-------------+
  | fan-01    | 5   | 4.00        |
  | fan-01    | 6   | 6.50        |
  | fan-01    | 9   | 3.67        |
  +-----------+-----+-------------+
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `-10^6 <= value <= 10^6`
  - Each `(sensor_id, seq)` pair appears at most once.
languages: [sql]
starter_code:
  sql: |
    -- For every reading, average it with up to two previous readings of the same sensor (by seq).
    SELECT sensor_id, seq, value AS rolling_avg
    FROM sensor_readings
    ORDER BY sensor_id, seq;
reference_solutions:
  sql: |
    SELECT
      sensor_id,
      seq,
      CAST(
        ROUND(
          AVG(value) OVER (
            PARTITION BY sensor_id
            ORDER BY seq
            ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
          ),
          2
        ) AS DOUBLE PRECISION
      ) AS rolling_avg
    FROM sensor_readings
    ORDER BY sensor_id, seq;
sql_setup: |
  CREATE TABLE sensor_readings (
    sensor_id VARCHAR(40) NOT NULL,
    seq INTEGER NOT NULL,
    value INTEGER NOT NULL,
    PRIMARY KEY (sensor_id, seq)
  );
tests:
  - id: t1
    description: "Example 1"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES
        ('pump-a', 1, 10), ('pump-a', 2, 12), ('pump-a', 4, 17), ('pump-a', 7, 11),
        ('pump-b', 3, 5), ('pump-b', 9, 8);
    expected_rows:
      - ["pump-a", 1, 10.0]
      - ["pump-a", 2, 11.0]
      - ["pump-a", 4, 13.0]
      - ["pump-a", 7, 13.33]
      - ["pump-b", 3, 5.0]
      - ["pump-b", 9, 6.5]
  - id: t2
    description: "Example 2 - negative value and a repeating decimal"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES ('fan-01', 5, 4), ('fan-01', 6, 9), ('fan-01', 9, -2);
    expected_rows:
      - ["fan-01", 5, 4.0]
      - ["fan-01", 6, 6.5]
      - ["fan-01", 9, 3.67]
  - id: t3
    hidden: true
    description: "Empty table"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Single reading averages only itself"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES ('pump-a', 42, 7);
    expected_rows: [["pump-a", 42, 7.0]]
  - id: t5
    hidden: true
    description: "Large seq gaps - a RANGE frame or seq-1 self join gives wrong averages"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES ('pump-a', 1, 3), ('pump-a', 50, 6), ('pump-a', 1000, 10), ('pump-a', 1001, 20);
    expected_rows:
      - ["pump-a", 1, 3.0]
      - ["pump-a", 50, 4.5]
      - ["pump-a", 1000, 6.33]
      - ["pump-a", 1001, 12.0]
  - id: t6
    hidden: true
    description: "Negative values and thirds that need rounding"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES ('pump-c', 1, -5), ('pump-c', 2, 3), ('pump-c', 3, -7), ('pump-c', 4, 2), ('pump-c', 5, -1);
    expected_rows:
      - ["pump-c", 1, -5.0]
      - ["pump-c", 2, -1.0]
      - ["pump-c", 3, -3.0]
      - ["pump-c", 4, -0.67]
      - ["pump-c", 5, -2.0]
  - id: t7
    hidden: true
    description: "Interleaved inserts - frame must reset per sensor and not follow insert order"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES
        ('pump-b', 2, 100), ('pump-a', 3, 1), ('pump-b', 1, 50), ('pump-a', 1, 2), ('pump-a', 2, 4), ('pump-b', 3, 70);
    expected_rows:
      - ["pump-a", 1, 2.0]
      - ["pump-a", 2, 3.0]
      - ["pump-a", 3, 2.33]
      - ["pump-b", 1, 50.0]
      - ["pump-b", 2, 75.0]
      - ["pump-b", 3, 73.33]
  - id: t8
    hidden: true
    description: "Ten readings on one sensor - frame keeps sliding"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES
        ('fan-02', 1, 1), ('fan-02', 2, 2), ('fan-02', 3, 4), ('fan-02', 4, 8), ('fan-02', 5, 16),
        ('fan-02', 6, 32), ('fan-02', 7, 64), ('fan-02', 8, 128), ('fan-02', 9, 256), ('fan-02', 10, 512);
    expected_rows:
      - ["fan-02", 1, 1.0]
      - ["fan-02", 2, 1.5]
      - ["fan-02", 3, 2.33]
      - ["fan-02", 4, 4.67]
      - ["fan-02", 5, 9.33]
      - ["fan-02", 6, 18.67]
      - ["fan-02", 7, 37.33]
      - ["fan-02", 8, 74.67]
      - ["fan-02", 9, 149.33]
      - ["fan-02", 10, 298.67]
  - id: t9
    hidden: true
    description: "All values identical"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES ('fan-9', 1, 6), ('fan-9', 2, 6), ('fan-9', 3, 6), ('fan-9', 4, 6);
    expected_rows:
      - ["fan-9", 1, 6.0]
      - ["fan-9", 2, 6.0]
      - ["fan-9", 3, 6.0]
      - ["fan-9", 4, 6.0]
  - id: t10
    hidden: true
    description: "Text ordering of sensor ids (fan-10 before fan-2)"
    ordered: true
    setup_sql: |
      INSERT INTO sensor_readings (sensor_id, seq, value) VALUES ('fan-2', 1, 1), ('fan-10', 1, 2), ('fan-10', 2, 3), ('fan-9', 1, 4);
    expected_rows:
      - ["fan-10", 1, 2.0]
      - ["fan-10", 2, 2.5]
      - ["fan-2", 1, 1.0]
      - ["fan-9", 1, 4.0]
expected_concepts:
  - window functions with PARTITION BY and ORDER BY
  - ROWS frame versus RANGE frame
  - gaps in sequence numbers break offset-based self joins
  - avoiding integer division when averaging
  - deterministic ORDER BY of the final result
optimal_complexity: {time: "O(n log n) for sorting by sensor_id and seq", space: O(n)}
rubric:
  excellent: Uses AVG as a window function partitioned by sensor and ordered by seq with a ROWS BETWEEN 2 PRECEDING AND CURRENT ROW frame, explains why a RANGE frame or a seq-based self join breaks on gaps, rounds correctly and orders the output.
  good: Reaches a correct window-function query after a hint about the frame type, partitioning or integer division.
  weak: Joins on seq - 1 and seq - 2, uses a RANGE frame over seq values, forgets to partition by sensor, or divides integers and truncates the average.
  criteria:
    correctness: All tests pass, including large gaps in seq, negative values and interleaved sensors.
    efficiency: A single window-function pass instead of correlated subqueries per row; mentions an index on (sensor_id, seq).
    code_quality: Readable frame clause, clear output aliases and an explicit ORDER BY.
    edge_cases: Empty table, a sensor with one or two readings and identical values.
    communication: Explains the difference between ROWS and RANGE frames and how the first readings of a sensor are handled.
hints:
  - Each output row depends on a few neighbouring rows of the same sensor; which SQL feature computes a value over related rows without collapsing them into one?
  - A window function partitioned by sensor and ordered by sequence number can average a frame of rows; the frame has to count physical rows rather than seq values, because seq has gaps.
  - Apply AVG as a window function partitioned by sensor_id and ordered by seq, with a rows-based frame that starts two rows before the current row and ends at the current row; round the result to two decimals and sort the final output by sensor_id and seq.
followups:
  - What would a RANGE BETWEEN 2 PRECEDING AND CURRENT ROW frame return for the readings with gaps, and when would that actually be the desired metric?
  - How would you only start reporting once a sensor has three readings, returning NULL before that?
  - Which index helps this query on a table with hundreds of millions of readings?
  - How would you compute a time-based rolling average if seq were replaced by a timestamp?
common_errors:
  - Self-joining on seq - 1 and seq - 2, which misses readings whenever there are gaps.
  - Using a RANGE frame over seq, which averages by value distance instead of by row count.
  - Forgetting PARTITION BY sensor_id, so the frame reaches into another sensor's readings.
  - Summing the values and dividing by an integer count, which truncates the average.
  - Omitting the final ORDER BY, so the row order is not guaranteed.
