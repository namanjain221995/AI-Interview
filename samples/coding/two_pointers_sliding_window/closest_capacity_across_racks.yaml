expected_concepts:
- two pointers over two sorted lists
- advancing the pointer at the smaller value
- early exit on an exact match
- O(n + m) time with O(1) extra space
optimal_complexity:
  time: O(n + m)
  space: O(1)
rubric:
  excellent: Explains why only the smaller side should advance, writes a clean single merge-style pass with an early
    zero exit, and states O(n + m) time and O(1) space.
  good: Reaches a correct two-pointer or binary-search solution with a small fix (for example the loop condition)
    and gives the right complexity.
  weak: Stays with the nested-loop comparison, advances the wrong pointer, or stops scanning too early and misses
    the closest pair.
  criteria:
    correctness: All tests pass, including duplicates, racks that do not overlap at all and the closest pair at
      the end.
    efficiency: Linear time in the total number of servers and constant extra memory.
    code_quality: Clear pointer names, a simple loop condition and no unnecessary copies of the input.
    edge_cases: Single-server racks, equal capacities, and one list being exhausted before the other.
    communication: Justifies that moving the larger value can only widen the current gap.
hints:
- Both lists are sorted, so the best partner for a capacity sits near where that value would land in the other rack.
- Keep one position in each list and, after comparing the two current capacities, decide which side should step
  forward to get closer.
- Start both positions at the beginning, record the absolute difference of the current pair, then advance the position
  holding the smaller capacity because moving the larger one can only widen the gap; stop when either list runs
  out and return zero immediately on an exact match.
followups:
- How would you return the pair of capacities, not only the gap?
- If one rack has ten servers and the other a million, would binary search per server of the small rack be faster
  than the linear pass?
- What changes if the racks arrive as two unsorted lists?
- How would you find the closest triple when there are three racks?
common_errors:
- Advancing the pointer at the larger value, which skips closer partners.
- Stopping as soon as the difference grows instead of scanning until one list is exhausted.
- Using the O(n * m) nested loop that times out on large racks.
- Accessing an index past the end of the shorter list after it has been exhausted.
