time_limit_minutes: 15
prompt_markdown: |
  ## Closest Capacity Across Racks

  A placement service mirrors workloads between two racks and wants to pair one server from rack A
  with one server from rack B whose capacities are as close as possible. The capacities of each rack
  are given as lists sorted in **non-decreasing** order (the same capacity can appear more than once).

  Return the smallest absolute difference `|a - b|` over every choice of `a` from `rack_a` and `b`
  from `rack_b`.

  - Both racks contain at least one server.
  - Return `0` when the two racks share a capacity value.

  ### Example 1
  ```
  Input:  rack_a = [4, 9, 15, 30], rack_b = [11, 20, 33]
  Output: 2
  Explanation: 9 from rack A and 11 from rack B differ by 2.
  ```

  ### Example 2
  ```
  Input:  rack_a = [100], rack_b = [40, 70, 160]
  Output: 30
  Explanation: The closest server in rack B is 70.
  ```

  ### Example 3
  ```
  Input:  rack_a = [5, 12, 12, 40], rack_b = [12, 50]
  Output: 0
  Explanation: Both racks contain a server with capacity 12.
  ```

  ### Constraints
  - `1 <= rack_a.length, rack_b.length <= 10^5`
  - `1 <= rack_a[i], rack_b[i] <= 10^9`
  - Both lists are sorted in non-decreasing order.

  **Follow-up:** Comparing every pair is `O(n * m)`. Can you finish in `O(n + m)` time with `O(1)` extra space?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: closest_capacity_gap
  params:
    - {name: rack_a, type: "int[]"}
    - {name: rack_b, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def closest_capacity_gap(rack_a: list[int], rack_b: list[int]) -> int:
        i, j = 0, 0
        best = abs(rack_a[0] - rack_b[0])
        while i < len(rack_a) and j < len(rack_b):
            a, b = rack_a[i], rack_b[j]
            if a == b:
                return 0
            best = min(best, abs(a - b))
            if a < b:
                i += 1
            else:
                j += 1
        return best
  javascript: |
    function closestCapacityGap(rackA, rackB) {
      let i = 0;
      let j = 0;
      let best = Math.abs(rackA[0] - rackB[0]);
      while (i < rackA.length && j < rackB.length) {
        const a = rackA[i];
        const b = rackB[j];
        if (a === b) return 0;
        best = Math.min(best, Math.abs(a - b));
        if (a < b) i++;
        else j++;
      }
      return best;
    }
