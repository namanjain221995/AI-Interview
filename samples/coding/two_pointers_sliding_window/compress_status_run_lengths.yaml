version: 1
slug: compress_status_run_lengths
title: Compress Status Run Lengths
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## Compress Status Run Lengths

  A health dashboard samples a service once a minute and records one letter per sample, for example
  `O` (ok), `W` (warning) or `E` (error). The history string `statuses` is getting long, so before it
  is shipped to the dashboard it is shortened as follows:

  - Split the string into **maximal runs** of the same letter (a run ends where the next letter differs).
  - A run of length `1` is written as the letter alone.
  - A run of length `2` or more is written as the letter followed by the run length in decimal
    (for example a run of twelve `E` becomes `E12`).
  - The pieces are joined in their original order.

  Letters are **case-sensitive**: `O` and `o` are different codes. Return the shortened string; an
  empty history returns an empty string.

  ### Example 1
  ```
  Input:  statuses = "OOOWEE"
  Output: "O3WE2"
  Explanation: runs "OOO", "W", "EE" become "O3", "W", "E2"
  ```

  ### Example 2
  ```
  Input:  statuses = "OWOW"
  Output: "OWOW"
  Explanation: every run has length 1, so nothing is shortened
  ```

  ### Constraints
  - `0 <= statuses.length <= 10^5`
  - `statuses` contains only English letters (`A`-`Z`, `a`-`z`).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: compress_statuses
  params:
    - {name: statuses, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def compress_statuses(statuses: str) -> str:
        pieces: list[str] = []
        i = 0
        n = len(statuses)
        while i < n:
            j = i
            while j < n and statuses[j] == statuses[i]:
                j += 1
            run = j - i
            pieces.append(statuses[i] if run == 1 else f"{statuses[i]}{run}")
            i = j
        return "".join(pieces)
  javascript: |
    function compressStatuses(statuses) {
      const pieces = [];
      let i = 0;
      while (i < statuses.length) {
        let j = i;
        while (j < statuses.length && statuses[j] === statuses[i]) j++;
        const run = j - i;
        pieces.push(run === 1 ? statuses[i] : statuses[i] + String(run));
        i = j;
      }
      return pieces.join("");
    }
tests:
  - {id: t1, args: ["OOOWEE"], expected: "O3WE2", description: "Example 1"}
  - {id: t2, args: ["OWOW"], expected: "OWOW", description: "Example 2 - no run longer than one, output equals input"}
  - {id: t3, hidden: true, args: [""], expected: "", description: "Empty history returns an empty string"}
  - {id: t4, hidden: true, args: ["E"], expected: "E", description: "Single letter - run of one is written without a count"}
  - {id: t5, hidden: true, args: ["WWWWWWWWWWWW"], expected: "W12", description: "Single run of twelve - count has two digits"}
  - {id: t6, hidden: true, args: ["OOWOO"], expected: "O2WO2", description: "Same letter in two separate runs must not be merged"}
  - {id: t7, hidden: true, args: ["OoOOoo"], expected: "OoO2o2", description: "Case-sensitive letters form different runs"}
  - {id: t8, hidden: true, args: ["OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOE"], expected: "O100E", description: "Three-digit run followed by a final run of one (last run must be flushed)"}
  - {id: t9, hidden: true, args: ["ABCDEFGHIJKLMNOPQRSTUVWXYZZ"], expected: "ABCDEFGHIJKLMNOPQRSTUVWXYZ2", description: "Many distinct letters with a run of two only at the end"}
  - {id: t10, hidden: true, args: [""], expected: "OW4O39W7O36W16O3W2O13E11O67E7O2E14O8W3O78E2OW5E18O2E5O23E2O7W10O33W17O5E12O48W6O22E8O24E12O20W2O8W10O11W12OW13E19W10O8W11O28E4O105W8O12", description: "855 characters of mixed runs from 1 to 105 letters long (stress - one- to three-digit counts, string building must be linear)"}
expected_concepts:
  - "two pointers marking the start and end of each run"
  - "flushing the final run after the loop"
  - "multi-digit run lengths"
  - "linear-time string building with a list or builder"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Scans once with a run-start pointer, writes runs of one without a count, handles multi-digit counts and the final run, builds the output with a list or builder and explains O(n)."
  good: "Correct single-pass solution that needs a nudge for one edge case such as the empty string or the last run."
  weak: "Drops the final run, writes a count of 1 for single letters, only handles single-digit counts or builds the string with quadratic concatenation without noticing."
  criteria:
    correctness: "All tests pass, including runs of ten or more and case-sensitive letters."
    efficiency: "One pass over the input; output built in linear time."
    code_quality: "Clear run boundaries (start and end indices or a counter) without duplicated flush logic."
    edge_cases: "Empty string, single letter, a run at the very end and the same letter appearing in separate runs."
    communication: "Explains how the end of a run is detected and why the last run needs handling."
hints:
  - "Think of the history as a sequence of blocks where each block repeats one letter."
  - "Keep a marker at the start of the current block and move forward until the letter changes; the distance you moved is the block length."
  - "For every block, append the letter and, only when the length is at least two, the full decimal length; then jump the start marker to where the block ended and repeat until the string is used up, collecting the pieces in a list joined once at the end."
followups:
  - "How would you write the reverse operation that expands the shortened string?"
  - "Is the shortened form always unambiguous to decode, and what would break if digits were allowed as status codes?"
  - "How would you process a status stream that arrives one letter at a time?"
  - "When is the shortened string longer than the original, if ever?"
common_errors:
  - "Forgetting to emit the last run after the loop ends."
  - "Writing a count of 1 for single letters, which the format does not allow."
  - "Converting only the last digit of the count, which breaks runs of ten or more."
  - "Treating upper- and lower-case letters as the same status."
