title: "Near-Duplicate Readings"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, security, sre]
time_limit_minutes: 35
prompt_markdown: |
  ## Near-Duplicate Readings

  A data-quality job scans a stream of counter `readings` (for example cumulative bytes reported by
  devices). A replayed or stuck reporter shows up as two readings that are **close in position and close in
  value**.

  Write `has_near_duplicate(readings, index_gap, value_gap)` that returns `true` if there exist two
  **different** positions `i` and `j` with

  - `|i - j| <= index_gap`, and
  - `|readings[i] - readings[j]| <= value_gap`,

  and `false` otherwise. With `index_gap = 0` no two different positions qualify, so the answer is `false`.

  Readings can be large and negative, and differences between them can exceed the 32-bit range, so use
  64-bit arithmetic throughout.

  ### Example 1
  ```
  Input:  readings = [100, 250, 103], index_gap = 2, value_gap = 3
  Output: true
  Explanation: positions 0 and 2 are two apart and differ by 3
  ```

  ### Example 2
  ```
  Input:  readings = [100, 250, 103], index_gap = 1, value_gap = 3
  Output: false
  Explanation: each neighbouring pair differs by more than 3
  ```

  ### Constraints
  - `1 <= readings.length <= 10^5`
  - `-10^15 <= readings[i] <= 10^15`
  - `0 <= index_gap <= 10^5`
  - `0 <= value_gap <= 2 * 10^15`

  **Follow-up:** an ordered set gives `O(n log index_gap)`; can you reach `O(n)` expected time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: has_near_duplicate
  params:
    - {name: readings, type: "long[]"}
    - {name: index_gap, type: "int"}
    - {name: value_gap, type: "long"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def has_near_duplicate(readings: list[int], index_gap: int, value_gap: int) -> bool:
        if index_gap <= 0:
            return False
        width = value_gap + 1
        buckets: dict[int, int] = {}  # bucket id -> reading, for the last index_gap readings only
        for i, reading in enumerate(readings):
            bucket = reading // width  # floor division, also for negative readings
            if bucket in buckets:
                return True
            for neighbour in (bucket - 1, bucket + 1):
                if neighbour in buckets and abs(reading - buckets[neighbour]) <= value_gap:
                    return True
            buckets[bucket] = reading
            if i >= index_gap:
                del buckets[readings[i - index_gap] // width]
        return False
  javascript: |
    function hasNearDuplicate(readings, indexGap, valueGap) {
      if (indexGap <= 0) return false;
      const width = valueGap + 1;
      const bucketOf = (x) => {
        // Floor division that stays exact for large magnitudes and negative readings.
        let q = Math.floor(x / width);
        while (q * width > x) q--;
        while ((q + 1) * width <= x) q++;
        return q;
      };
      const buckets = new Map();
      for (let i = 0; i < readings.length; i++) {
        const reading = readings[i];
        const bucket = bucketOf(reading);
        if (buckets.has(bucket)) return true;
        for (const neighbour of [bucket - 1, bucket + 1]) {
          if (buckets.has(neighbour) && Math.abs(reading - buckets.get(neighbour)) <= valueGap) return true;
        }
        buckets.set(bucket, reading);
        if (i >= indexGap) buckets.delete(bucketOf(readings[i - indexGap]));
      }
      return false;
    }
