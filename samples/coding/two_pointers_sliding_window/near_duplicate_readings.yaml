expected_concepts:
  - "sliding window over the last index_gap readings"
  - "bucketing values by width value_gap + 1 so equal buckets always match"
  - "checking only the two neighbouring buckets"
  - "floor division for negative values and 64-bit arithmetic"
  - "O(n) expected time, O(min(n, index_gap)) space"
optimal_complexity: {time: "O(n)", space: "O(min(n, index_gap))"}
rubric:
  excellent: "Uses buckets of width value_gap + 1 over a sliding window of the last index_gap readings, explains why at most one reading per bucket is needed, handles floor division of negatives and 64-bit differences, and states O(n) expected time with window-bounded space."
  good: "Correct ordered-set (tree map) solution in O(n log index_gap) with the window maintained properly, or the bucket solution with minor gaps in the negative-number reasoning."
  weak: "Compares every pair within the window in O(n * k) without improving, overflows when subtracting large readings, or rounds negative buckets toward zero."
  criteria:
    correctness: "All tests pass, including index_gap 0, negative readings and extreme magnitudes."
    efficiency: "Each reading is inserted and removed once with constant-time bucket checks."
    code_quality: "Bucket computation lives in one helper and the window eviction is clearly placed."
    edge_cases: "Single reading, value_gap 0, duplicates just outside the window and values beyond 32 bits."
    communication: "Explains why two readings in the same bucket always qualify and why only adjacent buckets need a check."
hints:
  - "You only ever compare a reading with the previous index_gap readings. What structure lets you ask whether any of them is within value_gap of the current one quickly?"
  - "Group values into buckets of width value_gap plus one. Two readings in the same bucket always qualify, so each bucket holds at most one reading of the window, and a match can otherwise only come from the two adjacent buckets."
  - "Keep a map from bucket number to reading for the last index_gap positions; for each reading compute its bucket with floor division that rounds negative values down, report a match if that bucket is occupied or a neighbouring bucket holds a reading within value_gap, then insert it and remove the reading that just left the window."
followups:
  - "How would an ordered-set solution look, and when would you prefer it?"
  - "What goes wrong if bucket numbers are computed with truncating division?"
  - "How would you report the pair of positions instead of a boolean?"
  - "How would you adapt this to readings arriving from many devices at once?"
common_errors:
  - "Using truncating division, which puts small negative and small positive values in the same bucket."
  - "Using a bucket width of value_gap, which fails when value_gap is 0."
  - "Computing differences in 32-bit integers."
  - "Evicting the wrong reading from the window, or evicting before checking."
