slug: renumber_servers_consecutive
title: Renumber Servers Into a Consecutive Range
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [platform, devops, backend]
time_limit_minutes: 35
prompt_markdown: |
  ## Renumber Servers Into a Consecutive Range

  After several rack migrations, the numeric ids of a server pool have drifted: some servers share an
  id and others sit far away from the rest. The platform team wants the pool to use a tidy block of ids
  again, so that the pool's `n` servers carry `n` **distinct** ids that form a **consecutive range**
  (every integer from the smallest id to the largest id is used exactly once, so `max - min = n - 1`).

  Re-labelling a server is a manual change that needs a maintenance ticket, so the team wants as few of
  them as possible. A single change sets one server's id to **any** integer you choose (it may be
  negative, and it does not have to be one of the current ids). Servers that are not changed keep their
  current id. You choose where the final range starts.

  Write `min_renumbering(ids)` that returns the **minimum number of servers** that must be re-labelled.
  The input list is not sorted and may contain repeated ids. Return `0` when the ids already form a
  consecutive range of distinct values.

  ### Example 1
  ```
  Input:  ids = [105, 101, 104, 102, 103]
  Output: 0
  Explanation: the ids are already the distinct consecutive range 101..105
  ```

  ### Example 2
  ```
  Input:  ids = [7, 3, 3, 12, 6]
  Output: 2
  Explanation: keep 3, 6 and 7 and aim for the range 3..7; re-label the second 3 and the 12 to 4 and 5
  ```

  ### Example 3
  ```
  Input:  ids = [20, 21, 21, 21, 40, 22]
  Output: 3
  Explanation: keep 20, 21 and 22 inside the range 20..25; two of the repeated 21s and the 40 must change
  ```

  ### Constraints
  - `1 <= ids.length <= 10^5`
  - `-10^9 <= ids[i] <= 10^9`

  **Follow-up:** trying every possible starting id is far too slow when ids are spread over a billion
  values. Can you solve it in `O(n log n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_renumbering
  params:
    - {name: ids, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_renumbering(ids: list[int]) -> int:
        n = len(ids)
        values = sorted(set(ids))
        best = 0
        right = 0
        for left, low in enumerate(values):
            # Grow the window to every distinct id that fits in a range starting at low.
            while right < len(values) and values[right] <= low + n - 1:
                right += 1
            best = max(best, right - left)
        return n - best
  javascript: |
    function minRenumbering(ids) {
      const n = ids.length;
      const values = [...new Set(ids)].sort((x, y) => x - y);
      let best = 0;
      let right = 0;
      for (let left = 0; left < values.length; left++) {
        const high = values[left] + n - 1;
        while (right < values.length && values[right] <= high) right++;
        best = Math.max(best, right - left);
      }
      return n - best;
    }
