expected_concepts:
  - reframing the question as keeping the most servers rather than changing the fewest
  - deduplicating because repeated ids can keep at most one copy
  - sorting distinct ids and sliding a window of width n
  - optimal range can be assumed to start at an existing id
  - monotone right pointer giving linear work after sorting
optimal_complexity: {time: O(n log n), space: O(n)}
rubric:
  excellent: Reframes the task as maximising the servers that keep their id, argues the best range can start at an existing id, dedupes and sorts, and slides a window of width n with a monotone right pointer, stating O(n log n) time and O(n) space with a clear justification.
  good: Correct solution using sort plus dedupe with binary search per start (also O(n log n)), or the two-pointer version with minor prompting; handles duplicates correctly.
  weak: Counts duplicates as keepable, uses the number of distinct ids instead of n as the window width, tries every integer start, or stays at an O(n^2) scan without discussing a faster approach.
  criteria:
    correctness: All tests pass, including all-equal ids, a single server, negative ids and duplicates inside the best window.
    efficiency: O(n log n) from sorting; the window pass is linear because the right pointer only moves forward.
    code_quality: Clear names for the distinct sorted ids and the window bounds; the answer is n minus the best window size.
    edge_cases: Single server, all ids equal, clusters far apart, and ids near plus or minus 10^9, where a check written as values[right] - low can overflow a 32-bit int (comparing against low + n - 1 stays in range).
    communication: Explains why repeated ids cost a change each and why the window width uses the original count n.
hints:
  - Instead of counting the servers to change, think about the largest set of servers that could keep their current id.
  - Servers sharing an id cannot all stay, and the final range always spans exactly n integers. If you look at the distinct ids in sorted order, which of them could stay together in one range?
  - Sort the distinct ids and, for each one as the lowest id of the range, advance a second pointer to cover every distinct id no larger than that id plus n minus 1; the largest such window is the number kept, and the answer is n minus that number.
followups:
  - How would you also return one valid final range start and which servers to re-label?
  - What changes if re-labelling a server costs a different amount per server?
  - How would you answer the question when servers join and leave the pool one at a time?
common_errors:
  - Using the count of distinct ids instead of the original n as the range width.
  - Counting repeated ids inside the window as servers that can stay.
  - Trying every integer as the range start, which is too slow for ids spread over a billion values.
  - Resetting the right pointer for each start, turning the pass back into O(n^2).
