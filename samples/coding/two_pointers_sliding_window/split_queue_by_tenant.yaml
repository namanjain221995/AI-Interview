slug: split_queue_by_tenant
title: Split the Queue by Tenant
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Split the Queue by Tenant

  A multi-tenant job runner receives a work queue `queue`, where `queue[i]` is the tenant id that owns
  job `i`. To isolate tenants, the runner wants to cut the queue into **contiguous batches** (keeping
  the original order) such that **all jobs of any one tenant land in the same batch**. Smaller
  batches can run in parallel, so it wants **as many batches as possible**.

  Return the sizes of the batches in queue order. Tenant ids are case-sensitive strings. An empty
  queue returns an empty list.

  ### Example 1
  ```
  Input:  queue = ["acme", "bolt", "acme", "core", "dyn", "core", "echo"]
  Output: [3, 3, 1]
  Explanation: batches ["acme", "bolt", "acme"], ["core", "dyn", "core"] and ["echo"]. "acme" and
  "core" each force their batch to stretch to their last job.
  ```

  ### Example 2
  ```
  Input:  queue = ["x", "y", "x"]
  Output: [3]
  Explanation: "x" appears at both ends, so the whole queue is one batch.
  ```

  ### Constraints
  - `0 <= queue.length <= 10^5`
  - `1 <= queue[i].length <= 20`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: tenant_batch_sizes
  params:
    - {name: queue, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def tenant_batch_sizes(queue: list[str]) -> list[int]:
        last_seen = {tenant: i for i, tenant in enumerate(queue)}
        sizes: list[int] = []
        start = 0
        reach = 0
        for i, tenant in enumerate(queue):
            reach = max(reach, last_seen[tenant])
            if i == reach:
                sizes.append(i - start + 1)
                start = i + 1
        return sizes
  javascript: |
    function tenantBatchSizes(queue) {
      const lastSeen = new Map();
      queue.forEach((tenant, i) => lastSeen.set(tenant, i));
      const sizes = [];
      let start = 0;
      let reach = 0;
      for (let i = 0; i < queue.length; i++) {
        reach = Math.max(reach, lastSeen.get(queue[i]));
        if (i === reach) {
          sizes.push(i - start + 1);
          start = i + 1;
        }
      }
      return sizes;
    }
