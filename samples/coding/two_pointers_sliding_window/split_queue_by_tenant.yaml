expected_concepts:
  - "precompute the last position of every tenant with a hash map"
  - "greedy extension of the current batch to the furthest last position seen"
  - "cut as soon as the scan reaches that furthest position"
  - "why cutting at the earliest legal point maximises the batch count"
optimal_complexity: {time: "O(n)", space: "O(t) for t distinct tenants"}
rubric:
  excellent: "Records each tenant's last index, scans once extending the batch end to the furthest last index seen, cuts when the scan reaches it, argues why greedy earliest cuts maximise the count and states O(n) time and O(t) space."
  good: "Correct greedy with the last-index map, perhaps with minor prompting on the cut condition or the empty queue."
  weak: "Re-scans the rest of the queue for every job in O(n^2), or cuts whenever the tenant changes."
  criteria:
    correctness: "All tests pass, including interleaved tenants, single-tenant queues and one tenant per job."
    efficiency: "Two linear passes and constant-time map lookups."
    code_quality: "Variables such as last_seen, start and reach make the invariant obvious."
    edge_cases: "Empty queue, a single job, case-sensitive ids and a tenant spanning the whole queue."
    communication: "Explains the greedy choice and why no smaller first batch is possible."
hints:
  - "Once a tenant appears, the batch it is in cannot end before that tenant's final job. What do you need to know about each tenant in advance?"
  - "Store the last position of every tenant first. Then, while scanning, keep track of the furthest last position among all tenants seen in the current batch."
  - "Scan the queue keeping the start of the current batch and the furthest last position of any tenant in it; when the scan index equals that furthest position, no tenant in the batch appears later, so close the batch, record its size and start the next one right after it."
followups:
  - "How would you return the batches themselves instead of their sizes?"
  - "What if the queue is a stream and you cannot see a tenant's last job in advance?"
  - "How would you cap the batch size while still keeping tenants together, and when is that impossible?"
  - "How does memory scale with the number of distinct tenants?"
common_errors:
  - "Cutting whenever the tenant id changes, which splits a tenant across batches."
  - "Using the first position of each tenant instead of the last."
  - "Treating tenant ids case-insensitively."
  - "Returning a list containing 0 for an empty queue."
