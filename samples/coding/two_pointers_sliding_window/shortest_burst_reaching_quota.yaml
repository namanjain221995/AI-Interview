ts"}
expected_concepts:
  - variable-size sliding window with two pointers
  - shrinking from the left is safe because all counts are positive
  - returning 0 as the no-answer sentinel
  - prefix sums with binary search as an O(n log n) alternative
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: "Uses a grow-then-shrink window, explains why positivity makes shrinking safe and why each index moves at most n times, handles the no-answer case, and states O(n) time with O(1) memory."
  good: "Correct prefix-sum plus binary search solution in O(n log n), or the linear window after a nudge."
  weak: "Checks every pair of endpoints in O(n^2), shrinks with an if instead of a loop, or returns n when the quota is never reached."
  criteria:
    correctness: "All tests pass, including unreachable quotas and runs at the very end of the log."
    efficiency: Linear time; both pointers only move forward.
    code_quality: Clear names for the window bounds and the running total; the sentinel for no answer is explicit.
    edge_cases: "Single second, quota equal to the whole total, quota of one and an unreachable quota."
    communication: Explains why the approach would fail if counts could be zero or negative.
hints:
  - "Because every count is positive, extending a run can only increase its total and dropping its first second can only decrease it."
  - "Keep a window with a left and right edge and a running total; grow the right edge until the total reaches the quota, then see how far you can pull the left edge in."
  - "Move the right edge one second at a time, adding its count; while the total is at least the quota, record the window length if it is the shortest so far, then subtract the leftmost count and advance the left edge; if nothing was ever recorded, return zero."
followups:
  - "Why does this approach break if some seconds could have negative adjustments?"
  - "How would you answer many different quotas on the same log efficiently?"
  - "How would you return the earliest shortest run instead of only its length?"
common_errors:
  - Shrinking the window only once per step instead of while the total still reaches the quota.
  - Initialising the best length to n and returning it when no run reaches the quota.
  - Using a strict greater-than comparison so a run that exactly hits the quota is missed.
  - Checking every start and end pair in O(n^2).
