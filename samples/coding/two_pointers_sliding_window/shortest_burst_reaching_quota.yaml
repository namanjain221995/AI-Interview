slug: shortest_burst_reaching_quota
title: Shortest Burst Reaching a Quota
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, backend, devops]
time_limit_minutes: 20
prompt_markdown: |
  ## Shortest Burst Reaching a Quota

  A rate limiter logs `counts[i]`, the number of requests received in second `i`; every count is
  positive. Capacity planning wants to know how quickly traffic can pile up: find the **shortest** run of
  consecutive seconds whose total number of requests is **at least** `quota`.

  Return the length of that run in seconds, or `0` if even the whole log never reaches `quota`.

  ### Example 1
  ```
  Input:  counts = [12, 4, 9, 20, 3, 15, 7], quota = 30
  Output: 3
  Explanation: No two consecutive seconds reach 30; seconds 1 to 3 give 4 + 9 + 20 = 33.
  ```

  ### Example 2
  ```
  Input:  counts = [5, 5, 5], quota = 100
  Output: 0
  Explanation: The whole log totals only 15 requests.
  ```

  ### Example 3
  ```
  Input:  counts = [40, 2, 3], quota = 30
  Output: 1
  Explanation: Second 0 alone already reaches the quota.
  ```

  ### Constraints
  - `1 <= counts.length <= 10^5`
  - `1 <= counts[i] <= 10^4`
  - `1 <= quota <= 10^9`

  **Follow-up:** an `O(n log n)` solution exists; can you find an `O(n)` one?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_burst
  params:
    - {name: counts, type: "int[]"}
    - {name: quota, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def shortest_burst(counts: list[int], quota: int) -> int:
        best = 0
        total = 0
        left = 0
        for right, count in enumerate(counts):
            total += count
            # Shrink from the left while the run still reaches the quota.
            while total >= quota:
                length = right - left + 1
                if best == 0 or length < best:
                    best = length
                total -= counts[left]
                left += 1
        return best
  javascript: |
    function shortestBurst(counts, quota) {
      let best = 0;
      let total = 0;
      let left = 0;
      for (let right = 0; right < counts.length; right++) {
        total += counts[right];
        while (total >= quota) {
          const length = right - left + 1;
          if (best === 0 || length < best) best = length;
          total -= counts[left];
          left++;
        }
      }
      return best;
    }
