expected_concepts:
  - "sorting turns any best group into a contiguous block"
  - "fixed-size window over the sorted values"
  - "spread equals last minus first in a sorted window"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Explains why an optimal group is contiguous after sorting, slides a window of size k comparing last minus first, and states O(n log n) dominated by sorting."
  good: "Correct sort-then-window solution with a minor off-by-one fixed during testing."
  weak: "Uses contiguous windows of the unsorted list, enumerates subsets, or returns the group instead of the spread."
  criteria:
    correctness: "All tests pass, including k = 1, k = n and duplicates."
    efficiency: "One sort plus a linear pass."
    code_quality: "Window bounds expressed clearly; input is copied before sorting."
    edge_cases: "Single server, k equal to n, duplicate values and extreme values."
    communication: "Justifies that replacing a gap-containing group with a contiguous sorted block never increases the spread."
hints:
  - "The spread only depends on the smallest and largest latency in the group; would some ordering of the servers make good groups easier to see?"
  - "After sorting, an optimal group can always be taken as k neighbouring values, because skipping a value inside the range never helps."
  - "Sort the latencies, then for every starting position whose block of k values fits in the list, compute the last value of the block minus the first and keep the minimum of these differences."
followups:
  - "Can you argue formally that an optimal group is contiguous in sorted order?"
  - "How would you return the indices of the chosen servers in the original list?"
  - "What changes if each server also has a capacity and the group must reach a minimum total capacity?"
common_errors:
  - "Sliding the window over the unsorted list, which only considers adjacent servers."
  - "Off-by-one in the last window start, either skipping it or reading past the end."
  - "Using JavaScript's default sort, which orders numbers as strings."
