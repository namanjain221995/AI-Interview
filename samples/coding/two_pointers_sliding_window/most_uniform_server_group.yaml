time_limit_minutes: 12
prompt_markdown: |
  ## Most Uniform Server Group

  A platform team is forming a canary pool of `k` servers and wants their behaviour to be as similar as
  possible. `latencies[i]` is the median request latency of server `i` in microseconds.

  Choose **any** `k` servers (they do not have to be next to each other in the list) so that the
  **spread** of the group, the highest latency in the group minus the lowest latency in the group, is as
  small as possible. Return that minimum spread.

  ### Example 1
  ```
  Input:  latencies = [40, 12, 35, 90, 38], k = 3
  Output: 5
  Explanation: choosing the servers with 35, 38 and 40 gives a spread of 40 - 35 = 5
  ```

  ### Example 2
  ```
  Input:  latencies = [7, 300], k = 1
  Output: 0
  Explanation: any single server has spread 0
  ```

  ### Constraints
  - `1 <= k <= latencies.length <= 10^5`
  - `1 <= latencies[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_latency_spread
  params:
    - {name: latencies, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_latency_spread(latencies: list[int], k: int) -> int:
        ordered = sorted(latencies)
        best = ordered[k - 1] - ordered[0]
        for i in range(1, len(ordered) - k + 1):
            best = min(best, ordered[i + k - 1] - ordered[i])
        return best
  javascript: |
    function minLatencySpread(latencies, k) {
      const ordered = [...latencies].sort((a, b) => a - b);
      let best = ordered[k - 1] - ordered[0];
      for (let i = 1; i + k - 1 < ordered.length; i++) {
        best = Math.min(best, ordered[i + k - 1] - ordered[i]);
      }
      return best;
    }
