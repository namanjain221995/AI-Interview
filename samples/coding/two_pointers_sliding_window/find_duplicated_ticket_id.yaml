expected_concepts:
  - reading values as next-pointers (functional graph over positions)
  - "Floyd cycle detection: meeting point, then entry point"
  - pigeonhole principle guarantees a repeat
  - binary search on the value range as an O(n log n) alternative
  - respecting read-only input and O(1) memory
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: "Maps the list to a linked structure, applies Floyd's two phases correctly, explains why the cycle entrance is the repeated id, and states O(n) time and O(1) memory."
  good: "Uses binary search over the value range with counting (O(n log n), O(1) memory), or reaches Floyd's method with some guidance."
  weak: "Sorts or marks the input in place, uses a set despite the memory rule, or assumes the repeated id appears exactly twice (for example a sum formula)."
  criteria:
    correctness: "All tests pass, including ids repeated more than twice and missing ids."
    efficiency: Linear time with constant extra memory; the input is never modified.
    code_quality: The two phases of the cycle search are clearly separated and named.
    edge_cases: "n = 1, the repeated id being 1 or n, and an id that fills almost the whole list."
    communication: Justifies why position 0 is outside the cycle and why the second phase finds the entrance.
hints:
  - Sorting or a set would solve it but breaks the rules; try reading each value as directions to another position in the list.
  - "Follow the chain from position 0 to the position named by its value, then to the position named by that value, and so on; nothing points back to position 0, so the walk must enter a cycle, and the cycle is entered through the repeated id."
  - "Run two walkers from position 0, one moving one step and one moving two steps per round, until they stand on the same position; then send one walker back to position 0 and move both one step at a time; the value where they meet again is the repeated id."
followups:
  - "Why does the arithmetic-sum trick fail for this version of the problem?"
  - "How does a binary search over the id range work here, and what does it cost?"
  - "If two different ids could be repeated, which parts of the approach break?"
common_errors:
  - "Using the sum of 1 to n, which only works when exactly one id appears exactly twice."
  - "Marking seen ids by negating entries, which modifies the shared export."
  - "Starting the second phase from the meeting point for both walkers, which loops forever."
  - Off-by-one confusion between positions and values when starting from position 0.
