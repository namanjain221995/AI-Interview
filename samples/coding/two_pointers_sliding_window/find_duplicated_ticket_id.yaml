slug: find_duplicated_ticket_id
title: Find the Duplicated Ticket Id
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, qa]
time_limit_minutes: 25
prompt_markdown: |
  ## Find the Duplicated Ticket Id

  A support system exported `ids`, a list of `n + 1` ticket ids in which every id is an integer from
  `1` to `n`. A sync bug wrote one ticket id more than once: **exactly one** value appears two or more
  times, and every other value appears at most once (so some ids from `1` to `n` may be missing).

  Return the repeated id.

  Your solution must **not modify** `ids` (the export is shared with other jobs) and must use only
  `O(1)` extra memory, so sorting a copy or keeping a set of seen ids is not allowed.

  ### Example 1
  ```
  Input:  ids = [4, 2, 5, 1, 3, 2]
  Output: 2
  Explanation: n = 5 and ticket id 2 appears twice.
  ```

  ### Example 2
  ```
  Input:  ids = [3, 3, 3, 1]
  Output: 3
  Explanation: n = 3. Ticket id 3 appears three times and id 2 is missing.
  ```

  ### Constraints
  - `1 <= n <= 10^5`
  - `ids.length == n + 1`
  - `1 <= ids[i] <= n`
  - Exactly one value appears more than once.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_repeated_id
  params:
    - {name: ids, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def find_repeated_id(ids: list[int]) -> int:
        # Read each value as a pointer to another position; position 0 is never
        # pointed at, and the repeated value is where the walk enters its cycle.
        slow = fast = ids[0]
        while True:
            slow = ids[slow]
            fast = ids[ids[fast]]
            if slow == fast:
                break
        slow = ids[0]
        while slow != fast:
            slow = ids[slow]
            fast = ids[fast]
        return slow
  javascript: |
    function findRepeatedId(ids) {
      let slow = ids[0];
      let fast = ids[0];
      do {
        slow = ids[slow];
        fast = ids[ids[fast]];
      } while (slow !== fast);
      slow = ids[0];
      while (slow !== fast) {
        slow = ids[slow];
        fast = ids[fast];
      }
      return slow;
    }
