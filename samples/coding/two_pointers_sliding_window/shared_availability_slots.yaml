slug: shared_availability_slots
title: Shared Availability Slots
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, fullstack, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Shared Availability Slots

  A meeting scheduler wants to pair two engineers for a design review. Each engineer's calendar is
  exported as a list of free slots `[start, end]` measured in minutes from the start of the week.
  Slots are **closed** intervals (both ends included). Within each list the slots are sorted by start
  and pairwise disjoint (they do not overlap or touch).

  Return every interval of time during which **both** engineers are free, as a list of `[start, end]`
  pairs sorted by `start`. When two slots meet at a single minute, that minute is shared and is
  returned as `[t, t]`. Return an empty list if the engineers are never free at the same time.

  ### Example 1
  ```
  Input:  a = [[1, 4], [6, 10], [13, 15]], b = [[3, 7], [10, 14]]
  Output: [[3, 4], [6, 7], [10, 10], [13, 14]]
  Explanation: [6, 10] meets [10, 14] at minute 10 only, which counts as the shared slot [10, 10].
  ```

  ### Example 2
  ```
  Input:  a = [[1, 2]], b = [[5, 6]]
  Output: []
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 10^4`
  - Every slot has exactly two values with `0 <= start <= end <= 10^9`.
  - In each list, `end` of a slot is strictly less than `start` of the next slot.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shared_slots
  params:
    - {name: a, type: "int[][]"}
    - {name: b, type: "int[][]"}
  return_type: "int[][]"
  comparison: exact
reference_solutions:
  python: |
    def shared_slots(a: list[list[int]], b: list[list[int]]) -> list[list[int]]:
        result: list[list[int]] = []
        i = j = 0
        while i < len(a) and j < len(b):
            start = max(a[i][0], b[j][0])
            end = min(a[i][1], b[j][1])
            if start <= end:
                result.append([start, end])
            # the slot that finishes first cannot overlap anything later in the other list
            if a[i][1] < b[j][1]:
                i += 1
            else:
                j += 1
        return result
  javascript: |
    function sharedSlots(a, b) {
      const result = [];
      let i = 0;
      let j = 0;
      while (i < a.length && j < b.length) {
        const start = Math.max(a[i][0], b[j][0]);
        const end = Math.min(a[i][1], b[j][1]);
        if (start <= end) result.push([start, end]);
        if (a[i][1] < b[j][1]) i++;
        else j++;
      }
      return result;
    }
