expected_concepts:
  - "two pointers over two sorted interval lists"
  - "intersection of two closed intervals is [max of starts, min of ends] when non-empty"
  - "advance the interval that ends first"
  - "output stays sorted without an extra sort"
optimal_complexity: {time: "O(n + m)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Walks both lists with two pointers, computes each intersection as max start and min end, always advances the slot that ends first, handles single-minute overlaps and explains O(n + m) time."
  good: "Correct two-pointer merge with small slips around touching endpoints that are fixed after testing, or a correct but less direct merge."
  weak: "Compares every slot of one list with every slot of the other in O(n * m), or drops single-point intersections."
  criteria:
    correctness: "All tests pass, including touching endpoints, nested slots and one slot spanning many slots of the other list."
    efficiency: "Each pointer advances at most once per step, so the scan is linear in the combined length."
    code_quality: "Intersection bounds and pointer advancement are each expressed in one clear line."
    edge_cases: "Empty lists, identical calendars, single-minute slots and no overlap at all."
    communication: "Explains why the slot that ends first can be discarded safely."
hints:
  - "Two slots overlap only if each one starts no later than the other ends. What is the shared part when they do?"
  - "Because both lists are sorted, you never need to look back: keep one pointer per list and compare only the two current slots."
  - "At each step take the larger of the two starts and the smaller of the two ends; if the start does not exceed the end, record that pair; then move past whichever current slot finishes earlier (either one when they finish together) and repeat until one list runs out."
followups:
  - "How would you find time when all of k engineers are free?"
  - "How would you return only shared slots of at least d minutes?"
  - "What if the slots were half-open intervals instead of closed ones?"
  - "How would you handle calendars whose slots may overlap within the same list?"
common_errors:
  - "Using a strict comparison so a single shared minute such as [10, 10] is missed."
  - "Advancing both pointers after an intersection, which skips overlaps with the longer slot."
  - "Advancing the slot that starts first rather than the one that ends first."
  - "Sorting the output again, which is unnecessary work."
