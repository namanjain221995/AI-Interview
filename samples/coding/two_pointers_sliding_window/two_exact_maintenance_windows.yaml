slug: two_exact_maintenance_windows
title: Two Exact Maintenance Windows
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Two Exact Maintenance Windows

  The capacity team must run **two** drain drills against a production region. `load[i]` is the
  number of requests (thousands) the region serves in hour `i`; every value is positive. A drill drains
  a **contiguous** range of hours to a standby region that was pre-warmed for exactly `target`
  requests, so a drill is only valid when the loads of its hours add up to **exactly** `target`.

  The two drills must not share an hour (they may be back to back). Every drained hour costs on-call
  time, so return the **minimum total number of hours** covered by two valid, non-overlapping drills.
  If it is impossible to schedule two such drills, return `-1`.

  ### Example 1
  ```
  Input:  load = [2, 1, 3, 3, 1, 2, 4], target = 4
  Output: 3
  Explanation: hours 1..2 (1 + 3) and hour 6 (4) are valid drills and do not overlap: 2 + 1 = 3 hours.
  ```

  ### Example 2
  ```
  Input:  load = [5, 5, 5], target = 5
  Output: 2
  Explanation: any two different single hours work.
  ```

  ### Example 3
  ```
  Input:  load = [4, 4, 1], target = 8
  Output: -1
  Explanation: hours 0..1 are the only range totalling 8, so a second drill cannot be found.
  ```

  ### Constraints
  - `0 <= load.length <= 10^5`
  - `1 <= load[i] <= 1000`
  - `1 <= target <= 10^8`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_two_windows
  params:
    - {name: load, type: "int[]"}
    - {name: target, type: int}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_two_windows(load: list[int], target: int) -> int:
        n = len(load)
        none = n + 1
        best_until = [none] * n  # shortest valid window ending at or before i
        best = none
        answer = 2 * none
        left = 0
        window = 0
        for right in range(n):
            window += load[right]
            while window > target:
                window -= load[left]
                left += 1
            if window == target:
                length = right - left + 1
                if left > 0 and best_until[left - 1] < none:
                    answer = min(answer, best_until[left - 1] + length)
                best = min(best, length)
            best_until[right] = best
        return -1 if answer >= 2 * none else answer
  javascript: |
    function minTwoWindows(load, target) {
      const n = load.length;
      const none = n + 1;
      const bestUntil = new Array(n).fill(none);
      let best = none;
      let answer = 2 * none;
      let left = 0;
      let windowSum = 0;
      for (let right = 0; right < n; right++) {
        windowSum += load[right];
        while (windowSum > target) {
          windowSum -= load[left];
          left++;
        }
        if (windowSum === target) {
          const length = right - left + 1;
          if (left > 0 && bestUntil[left - 1] < none) {
            answer = Math.min(answer, bestUntil[left - 1] + length);
          }
          best = Math.min(best, length);
        }
        bestUntil[right] = best;
      }
      return answer >= 2 * none ? -1 : answer;
    }
