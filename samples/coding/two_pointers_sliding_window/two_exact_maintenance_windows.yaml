expected_concepts:
  - "sliding window over positive values to find every range with an exact sum"
  - "prefix best: shortest valid window ending at or before each position"
  - "combining the current window with the best window strictly to its left"
  - "returning -1 when two disjoint windows do not exist"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Uses the positivity of the loads to find exact-sum windows with two pointers, keeps the shortest window ending at or before each hour, pairs each new window with the best one ending before its start, and explains O(n) time and space plus the -1 case."
  good: "Finds all exact-sum windows correctly and combines them with a sort or prefix/suffix pass in O(n log n) or O(n), possibly with prompting on the non-overlap condition."
  weak: "Picks the two shortest windows greedily without checking overlap, or enumerates all pairs of ranges in O(n^2) or worse."
  criteria:
    correctness: "All tests pass, including overlapping candidate windows, adjacent drills and the impossible case."
    efficiency: "Linear scan with a window that never moves backwards and constant-time pairing per window."
    code_quality: "A clear sentinel for no window yet, and the best-so-far array is named for what it stores."
    edge_cases: "Empty or tiny load arrays, a single valid window, target larger than the total and windows that touch."
    communication: "Explains why greedily taking the two shortest windows fails when they overlap."
hints:
  - "Because every load is positive, the windows with an exact total can be found with a window whose two edges only move forward."
  - "As you discover each valid window, you want to combine it with the shortest valid window that ends before it starts. Keep, for every hour, the length of the shortest valid window seen so far ending at or before that hour."
  - "Grow the right edge, shrink the left edge while the sum exceeds the target, and whenever the sum equals the target take the window length plus the best length recorded for the hour just before the left edge (if there is one) as a candidate answer; then update the best length for the current hour, and return -1 if no candidate was ever formed."
followups:
  - "What breaks if loads may be zero or negative, and how would prefix sums with a hash map help?"
  - "How would you generalise to k non-overlapping drills?"
  - "How would you return the actual hour ranges of the two drills?"
  - "What if the drills had to be at least m hours apart?"
common_errors:
  - "Choosing the two globally shortest windows even when they overlap."
  - "Pairing a window with a best value that includes windows ending at or after its own start."
  - "Using an infinity sentinel and then adding two of them together, which overflows in typed languages."
  - "Returning 0 instead of -1 when fewer than two disjoint windows exist."
