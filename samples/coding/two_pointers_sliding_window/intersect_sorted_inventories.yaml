title: "Common Stock Across Two Warehouses"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Common Stock Across Two Warehouses

  Two warehouses export their stock as lists of SKU numbers sorted in **non-decreasing** order, where
  **each entry is one physical unit**: a SKU listed three times means three units are on the shelf.

  To plan a cross-dock transfer, operations wants to know which units can be matched one-to-one between
  the warehouses. Write `common_stock(a, b)` that returns the matched units as a list sorted in
  non-decreasing order: a SKU that appears `x` times in `a` and `y` times in `b` appears exactly
  `min(x, y)` times in the result.

  - Return an empty list when the warehouses share no SKU (or either list is empty).

  ### Example 1
  ```
  Input:  a = [101, 101, 205, 205, 205, 330], b = [101, 205, 205, 412]
  Output: [101, 205, 205]
  ```

  ### Example 2
  ```
  Input:  a = [7, 8], b = [9]
  Output: []
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 10^4`
  - `1 <= a[i], b[i] <= 10^9`
  - `a` and `b` are each sorted in non-decreasing order.

  **Follow-up:** can you do it in `O(n + m)` time and `O(1)` extra space (ignoring the output)?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: common_stock
  params:
    - {name: a, type: "int[]"}
    - {name: b, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def common_stock(a: list[int], b: list[int]) -> list[int]:
        matched: list[int] = []
        i, j = 0, 0
        while i < len(a) and j < len(b):
            if a[i] < b[j]:
                i += 1
            elif a[i] > b[j]:
                j += 1
            else:
                matched.append(a[i])
                i += 1
                j += 1
        return matched
  javascript: |
    function commonStock(a, b) {
      const matched = [];
      let i = 0;
      let j = 0;
      while (i < a.length && j < b.length) {
        if (a[i] < b[j]) {
          i++;
        } else if (a[i] > b[j]) {
          j++;
        } else {
          matched.push(a[i]);
          i++;
          j++;
        }
      }
      return matched;
    }
