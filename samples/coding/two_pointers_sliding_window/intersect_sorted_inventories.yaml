expected_concepts:
  - "two pointers over two sorted lists"
  - "advancing the pointer at the smaller value"
  - "consuming one unit from each list on a match (multiset semantics)"
  - "O(n + m) time without a hash map"
optimal_complexity: {time: "O(n + m)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Walks both sorted lists with two pointers, advances both on a match so counts become min(x, y) automatically, explains O(n + m) time and O(1) extra space and compares it with a counting hash map."
  good: "Uses a hash map of counts or two pointers correctly with minor prompting and states the complexity."
  weak: "Returns distinct SKUs only, returns max instead of min counts, or uses nested loops that match the same unit twice."
  criteria:
    correctness: "Each SKU appears exactly min(x, y) times and the output is sorted."
    efficiency: "Linear in the combined length with two pointers."
    code_quality: "Three clear branches (less, greater, equal) and readable names."
    edge_cases: "Empty lists, no overlap, full containment and long duplicate runs."
    communication: "Explains why advancing both pointers on equality produces the minimum count."
hints:
  - "Since both lists are sorted, compare their smallest unmatched units first."
  - "If the two front units differ, the smaller one can never be matched by anything later in the other list, so it can be skipped."
  - "Keep one pointer per list; advance the pointer at the smaller SKU, and when both point at the same SKU record it once and advance both pointers, which pairs units one-to-one and naturally yields the minimum count."
followups:
  - "What if one warehouse is tiny and the other has millions of units - is there a faster approach?"
  - "How would you solve it if the lists were not sorted?"
  - "How would you return each SKU with its matched count instead of repeated entries?"
common_errors:
  - "Deduplicating the result so each SKU appears only once."
  - "Advancing only one pointer on a match, which matches the same unit more than once."
  - "Using nested loops and marking matches, which is O(n * m)."
  - "Forgetting that the loop must stop as soon as either list is exhausted."
