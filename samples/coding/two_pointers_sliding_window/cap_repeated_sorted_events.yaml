slug: cap_repeated_sorted_events
title: "Cap Repeated Event Codes"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, sre]
time_limit_minutes: 15
prompt_markdown: |
  ## Cap Repeated Event Codes

  An alerting pipeline batches event codes and sorts each batch in **non-decreasing** order before
  forwarding it. A noisy service can emit the same code hundreds of times, flooding the consumers
  downstream.

  Write `cap_repeats(codes, k)` that keeps at most the **first `k` occurrences** of each distinct code and
  drops the rest. Return the remaining codes in their original (sorted) order.

  - If a code occurs `k` times or fewer, all of its occurrences are kept.
  - An empty batch returns an empty list.

  ### Example 1
  ```
  Input:  codes = [100, 100, 100, 200, 300, 300, 300, 300], k = 2
  Output: [100, 100, 200, 300, 300]
  ```

  ### Example 2
  ```
  Input:  codes = [5, 5, 5], k = 1
  Output: [5]
  ```

  ### Constraints
  - `0 <= codes.length <= 10^4`
  - `-10^9 <= codes[i] <= 10^9`
  - `codes` is sorted in non-decreasing order.
  - `1 <= k <= 10^4`

  **Follow-up:** can you do it with a single pass and `O(1)` extra space (ignoring the output)?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: cap_repeats
  params:
    - {name: codes, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def cap_repeats(codes: list[int], k: int) -> list[int]:
        kept: list[int] = []
        for code in codes:
            if len(kept) < k or kept[-k] != code:
                kept.append(code)
        return kept
  javascript: |
    function capRepeats(codes, k) {
      const kept = [];
      for (const code of codes) {
        if (kept.length < k || kept[kept.length - k] !== code) kept.push(code);
      }
      return kept;
    }
