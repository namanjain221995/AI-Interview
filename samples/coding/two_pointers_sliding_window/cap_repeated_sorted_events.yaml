expected_concepts:
  - "sorted input puts equal codes in contiguous runs"
  - "comparing with the element k positions back in the kept output"
  - "single pass with a write pointer"
  - "O(n) time and O(1) extra space"
optimal_complexity: {time: "O(n)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Uses the sorted order to compare each code with the kept element k positions back (or a run counter), writes a single clean pass, covers k larger than any run and explains O(n) time with O(1) extra space."
  good: "Uses a run-length counter or a hash map of counts correctly, possibly with a little prompting, and states the complexity."
  weak: "Loses ordering, compares only with the immediately previous code so larger k fails, mishandles k of one, or produces an off-by-one at run boundaries."
  criteria:
    correctness: "Each code appears min(count, k) times in the original order."
    efficiency: "Single linear pass; no extra sorting."
    code_quality: "Concise loop with a clear condition for keeping a code."
    edge_cases: "Empty input, k of one, k larger than every run and negative codes."
    communication: "Explains why sorted input makes a look-back of k positions sufficient."
hints:
  - "Because the batch is sorted, all copies of a code sit next to each other in one run."
  - "You only need to know whether you have already kept k copies of the current code; the codes you have kept so far can tell you that."
  - "Scan once and append a code to the output unless the output already has at least k elements and the element k positions from its end equals the current code; that element can only match if the last k kept codes are all this same code."
followups:
  - "How would you do this in place on the input array with a write pointer?"
  - "What if the batch were not sorted but you still had to keep the first k occurrences of each code?"
  - "How would you also report how many events were dropped for each code?"
common_errors:
  - "Resetting the run counter at the wrong time, so the first element of a new run is counted against the previous code."
  - "Using a hash map of counts and forgetting that sorted input makes it unnecessary."
  - "When compacting in place, comparing with the input k positions back after that slot has already been overwritten, instead of with the kept prefix."
  - "Off-by-one that keeps k + 1 or k - 1 copies."
