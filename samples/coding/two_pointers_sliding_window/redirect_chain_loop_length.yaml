expected_concepts:
  - "functional graph: every page has at most one outgoing redirect"
  - fast and slow pointers (Floyd cycle detection)
  - measuring the cycle length after the pointers meet
  - O(1) extra memory versus a visited set
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: "Uses fast and slow pointers, stops as soon as the fast pointer hits a final page, walks the loop once to measure it, and explains O(n) time with O(1) memory."
  good: "Correct solution with a visited map from page to step number (loop length is the difference of step numbers), with a clear statement of the O(n) memory cost."
  weak: "Counts the tail pages as part of the loop, loops forever on cyclic input, or dereferences -1."
  criteria:
    correctness: "All tests pass, including self-redirects, unreachable loops and a start page inside the loop."
    efficiency: Linear time; the expected solution keeps only a constant number of pointers.
    code_quality: The -1 check happens before every dereference of the fast pointer; loop exits are explicit.
    edge_cases: "Single page, self-redirect, start on a final page, long tails and long loops."
    communication: Explains why the pointers must meet inside the loop and how the length is then measured.
hints:
  - "A crawler that never reaches a final page must eventually revisit a page; what is the simplest way to notice a revisit?"
  - Remembering every visited page works but costs memory; two crawlers moving at different speeds from the start page will meet somewhere inside the loop if there is one.
  - "Advance one pointer one hop and another two hops per round, returning zero the moment the faster one reaches a final page; once they land on the same page you are inside the loop, so walk from that page until you come back to it and count the hops."
followups:
  - "How would you also return the first page of the loop that the crawler enters?"
  - "How would you find every loop in the whole table, not just the one reachable from start?"
  - "How would a redirect service reject a configuration change that would create a loop?"
common_errors:
  - Including the tail pages in the loop length.
  - Advancing the fast pointer twice without checking for a final page after each hop.
  - "Measuring the loop by counting steps until the pointers meet, which is not the loop length."
  - Assuming the start page is part of the loop.
