slug: redirect_chain_loop_length
title: Redirect Chain Loop Length
difficulty: medium
competency_keys: [algorithms, problem_solving, debugging]
role_tags: [backend, sre, security]
time_limit_minutes: 20
prompt_markdown: |
  ## Redirect Chain Loop Length

  A website's redirect table has one entry per page. `next_hop[i]` is the page that page `i` redirects
  to, or `-1` if page `i` is a final page that serves content. A misconfigured table can send a visitor
  around a redirect loop forever.

  A crawler starts at page `start` and keeps following redirects. Return the number of distinct pages
  in the loop the crawler eventually gets stuck in, or `0` if it reaches a final page.

  - A page that redirects to itself is a loop of length `1`.
  - Pages that are only passed through on the way into the loop do not count.
  - Loops the crawler never reaches do not matter.

  ### Example 1
  ```
  Input:  next_hop = [1, 2, 3, 4, 2], start = 0
  Output: 3
  Explanation: 0 -> 1 -> 2 -> 3 -> 4 -> 2 -> ... Pages 2, 3 and 4 form the loop; pages 0 and 1 are only passed through.
  ```

  ### Example 2
  ```
  Input:  next_hop = [2, -1, 3, -1], start = 0
  Output: 0
  Explanation: 0 -> 2 -> 3, and page 3 is a final page.
  ```

  ### Example 3
  ```
  Input:  next_hop = [0, 0], start = 1
  Output: 1
  Explanation: 1 -> 0 -> 0 -> ... Page 0 redirects to itself.
  ```

  ### Constraints
  - `1 <= next_hop.length <= 10^5`
  - `-1 <= next_hop[i] < next_hop.length`
  - `0 <= start < next_hop.length`

  **Follow-up:** the straightforward solution remembers every visited page. Can you use only `O(1)`
  extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: redirect_loop_length
  params:
    - {name: next_hop, type: "int[]"}
    - {name: start, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def redirect_loop_length(next_hop: list[int], start: int) -> int:
        slow = fast = start
        while True:
            for _ in range(2):
                fast = next_hop[fast]
                if fast == -1:
                    return 0
            slow = next_hop[slow]
            if slow == fast:
                break
        # slow and fast meet inside the loop: walk around it once.
        length = 1
        page = next_hop[slow]
        while page != slow:
            page = next_hop[page]
            length += 1
        return length
  javascript: |
    function redirectLoopLength(nextHop, start) {
      let slow = start;
      let fast = start;
      while (true) {
        for (let step = 0; step < 2; step++) {
          fast = nextHop[fast];
          if (fast === -1) return 0;
        }
        slow = nextHop[slow];
        if (slow === fast) break;
      }
      let length = 1;
      let page = nextHop[slow];
      while (page !== slow) {
        page = nextHop[page];
        length++;
      }
      return length;
    }
