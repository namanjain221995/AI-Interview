expected_concepts:
  - the target arc length equals the number of active nodes
  - fixed-size sliding window over a circular array (modulo indexing or doubling)
  - swaps needed equal idle nodes inside the chosen arc
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: "Observes that the arc length is fixed to the number of active nodes and each idle node in it costs one swap, slides that window around the ring with modulo indexing, and explains O(n) time and O(1) memory."
  good: Correct answer using a doubled array (O(n) memory) or after fixing the wrap-around case with a hint.
  weak: "Simulates swaps greedily, ignores wrap-around, or counts adjacent swaps instead of arbitrary swaps."
  criteria:
    correctness: "All tests pass, including wrap-around arcs and the all-idle and all-active rings."
    efficiency: Linear time; one fixed-size window slides around the ring once.
    code_quality: Modulo indexing or doubling is explicit and the window update is symmetric.
    edge_cases: "No active nodes, every node active, a single node and a single active node."
    communication: Justifies why the number of idle nodes in the arc is exactly the number of swaps.
hints:
  - "Once all active replicas are clustered, how long is the arc they occupy?"
  - "Pick a candidate arc of that length: every idle node inside it must swap with an active node outside it, and one swap fixes exactly one such node, so the cost of an arc is the number of idle nodes it contains."
  - "Let m be the number of active nodes; slide a window of length m around the ring (using indices modulo n so arcs can wrap past the last node), keep a running count of active nodes inside it, and return m minus the largest count you see; handle zero or n active nodes up front."
followups:
  - "How does the answer change if only adjacent nodes may be swapped?"
  - "How would you report which arc to use, preferring the lowest starting node on ties?"
  - "What if the nodes form a line instead of a ring?"
common_errors:
  - "Ignoring the wrap-around, which misses arcs that cross from the last node to node 0."
  - Choosing an arc length other than the number of active nodes.
  - Returning the number of active nodes outside the arc but double-counting swaps.
  - Dividing by zero or indexing out of range when no node is active.
