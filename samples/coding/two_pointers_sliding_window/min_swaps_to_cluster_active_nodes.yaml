slug: min_swaps_to_cluster_active_nodes
title: Cluster Active Nodes in a Ring
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [platform, network, sre]
time_limit_minutes: 20
prompt_markdown: |
  ## Cluster Active Nodes in a Ring

  A cluster's nodes are wired in a ring: node `i` is next to node `i + 1`, and the last node is next to
  node `0`. `nodes[i]` is `1` if node `i` currently runs an active replica and `0` if it is idle.

  To cut cross-rack traffic, the scheduler wants all active replicas on one **contiguous arc** of the
  ring. A swap exchanges the states of any two nodes; the nodes do not need to be neighbours.

  Return the minimum number of swaps needed so that all `1`s are contiguous around the ring. An arc may
  wrap around from the last node to node `0`. If there are no active replicas, or every node is
  active, return `0`.

  ### Example 1
  ```
  Input:  nodes = [1, 0, 1, 0, 0, 1, 1, 0]
  Output: 1
  Explanation: Four nodes are active. The arc of nodes 5, 6, 7 and 0 already holds three of them, so one swap (node 7 with node 2) is enough.
  ```

  ### Example 2
  ```
  Input:  nodes = [1, 1, 0, 0, 0, 1]
  Output: 0
  Explanation: Nodes 5, 0 and 1 are already contiguous because the ring wraps around.
  ```

  ### Constraints
  - `1 <= nodes.length <= 10^5`
  - `nodes[i]` is `0` or `1`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_swaps_to_cluster
  params:
    - {name: nodes, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_swaps_to_cluster(nodes: list[int]) -> int:
        n = len(nodes)
        m = sum(nodes)
        if m == 0 or m == n:
            return 0
        # Best arc of length m = the one already holding the most active nodes.
        window = sum(nodes[:m])
        best = window
        for start in range(1, n):
            window += nodes[(start + m - 1) % n] - nodes[start - 1]
            best = max(best, window)
        return m - best
  javascript: |
    function minSwapsToCluster(nodes) {
      const n = nodes.length;
      let m = 0;
      for (const v of nodes) m += v;
      if (m === 0 || m === n) return 0;
      let window = 0;
      for (let i = 0; i < m; i++) window += nodes[i];
      let best = window;
      for (let start = 1; start < n; start++) {
        window += nodes[(start + m - 1) % n] - nodes[start - 1];
        best = Math.max(best, window);
      }
      return m - best;
    }
