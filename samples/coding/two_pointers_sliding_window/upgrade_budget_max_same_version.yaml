expected_concepts:
  - "sorting so the best group is a contiguous block of the sorted builds"
  - "the target build is the largest build in the group"
  - "sliding window with a running sum: cost equals target times size minus sum"
  - "64-bit arithmetic for the cost"
optimal_complexity: {time: "O(n log n)", space: "O(n)"}
rubric:
  excellent: "Argues that an optimal group is a contiguous block of the sorted builds aligned to its largest build, keeps a running sum in a two-pointer window whose cost is target times size minus sum, uses 64-bit values, and states O(n log n) time dominated by the sort."
  good: "Correct sort plus window or sort plus prefix sums with binary search, with minor prompting about overflow."
  weak: "Tries every target with a full scan in O(n^2), allows downgrades, or overflows 32-bit integers on large builds."
  criteria:
    correctness: "All tests pass, including zero budget, duplicates and very large builds."
    efficiency: "Sort plus a linear window; O(n log n) overall."
    code_quality: "Cost formula is computed incrementally and named clearly."
    edge_cases: "Single server, already aligned fleet and budgets far above what is needed."
    communication: "Explains why the group should be the servers with the closest lower builds to the target."
hints:
  - "If you have decided which build number the group will end on, which servers are the cheapest to bring up to it?"
  - "Sort the builds; the best group for a target is a contiguous block of sorted builds ending at that target, and its cost is the target times the group size minus the sum of the group."
  - "Walk the sorted builds with a right pointer as the target while keeping a running sum of the block; while the cost of the block (target times size minus sum) exceeds the budget, subtract the leftmost build and move the left pointer forward; the block size after each step is a candidate, and the cost must be computed in 64-bit integers."
followups:
  - "How would you also report which build number the group ends on, preferring the lowest?"
  - "What changes if downgrades were allowed at the same cost?"
  - "How would you answer many budget queries on the same fleet efficiently?"
common_errors:
  - "Forgetting to sort, so the window covers servers that are far apart in build number."
  - "Computing the cost with 32-bit integers, which overflows for builds near 10^9."
  - "Choosing a target that is not one of the existing builds or allowing a downgrade."
  - "Recomputing the cost of each block from scratch instead of keeping a running sum."
