title: Align Server Versions on a Budget
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, sre]
time_limit_minutes: 25
prompt_markdown: |
  ## Align Server Versions on a Budget

  A fleet of servers runs different builds of the same agent; `versions[i]` is the integer build number
  on server `i`. To roll out a fix, the platform team wants as many servers as possible on **exactly
  the same** build. One **upgrade step** raises a single server's build number by `1`; downgrades are
  not possible, and a server may receive several steps.

  Given at most `budget` upgrade steps in total, return the **maximum number of servers** that can end
  up on the same build number. Servers that are not part of the group are left unchanged. The fleet has
  at least one server, so the answer is at least `1`. Totals can exceed the 32-bit range.

  ### Example 1
  ```
  Input:  versions = [4, 2, 7, 3], budget = 3
  Output: 3
  Explanation: upgrade build 2 twice and build 3 once so three servers run build 4
  ```

  ### Example 2
  ```
  Input:  versions = [10, 10, 1], budget = 0
  Output: 2
  Explanation: with no budget only the two servers already on build 10 match
  ```

  ### Constraints
  - `1 <= versions.length <= 10^5`
  - `1 <= versions[i] <= 10^9`
  - `0 <= budget <= 10^14`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_aligned_servers
  params:
    - {name: versions, type: "int[]"}
    - {name: budget, type: "long"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_aligned_servers(versions: list[int], budget: int) -> int:
        ordered = sorted(versions)
        best = 0
        left = 0
        window_sum = 0
        for right, target in enumerate(ordered):
            window_sum += target
            while target * (right - left + 1) - window_sum > budget:
                window_sum -= ordered[left]
                left += 1
            best = max(best, right - left + 1)
        return best
  javascript: |
    function maxAlignedServers(versions, budget) {
      const ordered = [...versions].sort((a, b) => a - b);
      let best = 0;
      let left = 0;
      let windowSum = 0;
      for (let right = 0; right < ordered.length; right++) {
        const target = ordered[right];
        windowSum += target;
        while (target * (right - left + 1) - windowSum > budget) {
          windowSum -= ordered[left];
          left++;
        }
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
