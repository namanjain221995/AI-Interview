expected_concepts:
  - water level at a position is the minimum of the tallest wall on each side
  - prefix and suffix maximum arrays
  - two pointers moving inward from the lower side
  - O(1) extra space argument for the two-pointer version
  - empty and very short inputs
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Derives the per-position level as the minimum of the tallest wall on each side, improves the O(n^2) scan to prefix and suffix maxima, then to two pointers with O(1) extra space, and proves why the lower side can be settled.
  good: Implements a correct O(n) solution with prefix and suffix maximum arrays, or reaches two pointers with some guidance.
  weak: Only manages a quadratic scan, counts coolant above the lower neighbour instead of the bounding walls, or lets coolant stay above an open end.
  criteria:
    correctness: All tests pass, including empty input, single racks, falling rows and nested basins.
    efficiency: Linear time; the two-pointer version uses constant extra memory.
    code_quality: Clear names for the two running walls and the trapped total, with no duplicated scanning loops.
    edge_cases: Empty row, one or two racks, monotonic rows and equal-height walls.
    communication: Explains why the side with the lower current rack can be resolved without knowing the rest of the row.
hints:
  - Look at a single rack and ask how high the coolant above it can rise; what decides that level?
  - The level above rack i is the smaller of the tallest rack at or left of i and the tallest rack at or right of i; you can precompute both for every position in two passes.
  - To drop the extra arrays, keep a pointer at each end with the tallest rack seen so far from each side; always advance the side whose current rack is lower, since a taller rack on the other side guarantees that side's running maximum alone sets the level, and add that maximum minus the current height to the total.
followups:
  - Prove that moving the pointer on the lower side never misses a taller bounding wall.
  - How would you solve it with a monotonic stack, and what does each popped element represent?
  - How would you report the volume of each separate pool instead of the total?
  - What changes if the floor itself is uneven and some slots leak to the floor below?
common_errors:
  - Comparing only with the immediate neighbours instead of the tallest rack on each side.
  - Recomputing the left and right maxima for every position, which is O(n^2).
  - Advancing the pointer on the taller side, which uses the wrong bound for the level.
  - Failing on an empty or one-element row by indexing past the ends.
