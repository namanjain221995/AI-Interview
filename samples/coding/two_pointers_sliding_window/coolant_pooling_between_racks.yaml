prompt_markdown: |
  ## Coolant Pooling Between Racks

  A facilities team is modelling a leak in a data hall. Seen from the side, a row of racks stands on a
  flat floor; every rack is one unit wide and `heights[i]` is the height of rack `i` (a height of `0` is an
  empty slot). Coolant drips onto the whole row from above and settles wherever it is enclosed: on top of
  a rack the liquid can stay only as high as the **lower** of the tallest rack somewhere to its left and
  the tallest rack somewhere to its right. Anything higher flows off one of the two ends of the row,
  which are open.

  Return the total number of unit squares of coolant that stay trapped on top of the racks.

  ### Example 1
  ```
  Input:  heights = [4, 0, 3, 1, 0, 5]
  Output: 12
  Explanation: every slot between the walls of height 4 and 5 fills up to level 4,
  holding 4 + 1 + 3 + 4 = 12 units
  ```

  ### Example 2
  ```
  Input:  heights = [5, 1, 1, 6, 2, 4]
  Output: 10
  Explanation: the basin left of the 6 fills to level 5 (4 + 4 units), the basin right of it to level 4 (2 units)
  ```

  ### Example 3
  ```
  Input:  heights = [1, 2, 3, 4]
  Output: 0
  Explanation: no rack has a taller rack on its left, so everything flows off the left end
  ```

  ### Constraints
  - `0 <= heights.length <= 10^5`
  - `0 <= heights[i] <= 10^4`

  **Follow-up:** can you solve it in `O(n)` time with `O(1)` extra memory?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: trapped_coolant
  params:
    - {name: heights, type: "int[]"}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    def trapped_coolant(heights: list[int]) -> int:
        left, right = 0, len(heights) - 1
        left_wall = right_wall = 0
        trapped = 0
        while left < right:
            if heights[left] <= heights[right]:
                # The right side holds a wall at least this tall, so the left wall decides the level.
                left_wall = max(left_wall, heights[left])
                trapped += left_wall - heights[left]
                left += 1
            else:
                right_wall = max(right_wall, heights[right])
                trapped += right_wall - heights[right]
                right -= 1
        return trapped
  javascript: |
    function trappedCoolant(heights) {
      let left = 0;
      let right = heights.length - 1;
      let leftWall = 0;
      let rightWall = 0;
      let trapped = 0;
      while (left < right) {
        if (heights[left] <= heights[right]) {
          leftWall = Math.max(leftWall, heights[left]);
          trapped += leftWall - heights[left];
          left++;
        } else {
          rightWall = Math.max(rightWall, heights[right]);
          trapped += rightWall - heights[right];
          right--;
        }
      }
      return trapped;
    }
