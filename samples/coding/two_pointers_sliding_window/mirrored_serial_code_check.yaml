version: 1
slug: mirrored_serial_code_check
title: "Mirrored Serial Code Check"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, qa, frontend, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## Mirrored Serial Code Check

  A label printer on the packaging line prints serial codes that are designed to read the same in both
  directions, so a conveyor scanner that may read a label from either end always gets the same code. The printer also inserts
  separators such as dashes, colons, spaces and slashes, and mixes upper and lower case.

  Write `is_mirrored_code(code)` that returns `true` if the code is **mirrored** and `false` otherwise:

  - Only letters (`a-z`, `A-Z`) and digits (`0-9`) count; every other character is ignored.
  - Letters are compared case-insensitively; a digit only matches the same digit.
  - The code is mirrored if the sequence of counted characters is the same read forwards and backwards.
  - A code with no letters or digits (including the empty string) counts as mirrored.

  ### Example 1
  ```
  Input:  code = "AB-12:21-ba"
  Output: true
  ```

  ### Example 2
  ```
  Input:  code = "X7-7Y"
  Output: false
  ```

  ### Constraints
  - `0 <= code.length <= 2 * 10^5`
  - `code` consists of printable ASCII characters.

  **Follow-up:** can you check it in `O(1)` extra space, without building a cleaned copy of the code?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: is_mirrored_code
  params:
    - {name: code, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def is_mirrored_code(code: str) -> bool:
        def counted(ch: str) -> bool:
            return ch.isascii() and ch.isalnum()

        left, right = 0, len(code) - 1
        while left < right:
            if not counted(code[left]):
                left += 1
            elif not counted(code[right]):
                right -= 1
            elif code[left].lower() != code[right].lower():
                return False
            else:
                left += 1
                right -= 1
        return True
  javascript: |
    function isMirroredCode(code) {
      const counted = (ch) => /[A-Za-z0-9]/.test(ch);
      let left = 0;
      let right = code.length - 1;
      while (left < right) {
        if (!counted(code[left])) {
          left++;
        } else if (!counted(code[right])) {
          right--;
        } else if (code[left].toLowerCase() !== code[right].toLowerCase()) {
          return false;
        } else {
          left++;
          right--;
        }
      }
      return true;
    }
tests:
  - {id: t1, args: ["AB-12:21-ba"], expected: true, description: "Example 1 - separators ignored and letters matched case-insensitively"}
  - {id: t2, args: ["X7-7Y"], expected: false, description: "Example 2 - outer characters differ"}
  - {id: t3, hidden: true, args: [""], expected: true, description: "Empty code counts as mirrored"}
  - {id: t4, hidden: true, args: ["--// :: --"], expected: true, description: "Only separators, no letters or digits"}
  - {id: t5, hidden: true, args: ["q"], expected: true, description: "Single counted character"}
  - {id: t6, hidden: true, args: ["0P"], expected: false, description: "A digit never matches a letter (0 versus P)"}
  - {id: t7, hidden: true, args: ["7-a/B:a 7"], expected: true, description: "Odd number of counted characters with mixed separators"}
  - {id: t8, hidden: true, args: ["ab_A"], expected: true, description: "Underscore is ignored, not counted"}
  - {id: t9, hidden: true, args: ["Rk9- 8kr"], expected: false, description: "Middle digits differ while the outer letters match"}
  - {id: t10, hidden: true, args: ["-:"], expected: true, description: "Stress - 902 characters with separators only at the ends"}
expected_concepts:
  - "two pointers moving inward from both ends"
  - "skipping characters that do not count"
  - "case-insensitive comparison of letters only"
  - "O(1) extra space versus building a filtered copy"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Uses two inward pointers that skip uncounted characters, compares case-insensitively, handles empty and separator-only codes naturally and explains O(n) time with O(1) space."
  good: "Builds a cleaned lowercase copy and compares it with its reverse, correctly, and can describe the in-place two-pointer improvement when asked."
  weak: "Compares the raw string, forgets case-folding, counts underscores or other symbols, or crashes on separator-only input."
  criteria:
    correctness: "Correct for mixed case, separators, digits and separator-only input."
    efficiency: "Linear time; constant extra space for the follow-up."
    code_quality: "A small helper for the counted-character test and a loop with clear pointer movement."
    edge_cases: "Empty code, single character, only separators and a letter next to a digit."
    communication: "States the rule for which characters count before coding and walks through a mixed example."
hints:
  - "Imagine first deleting every separator and lower-casing the letters; the question becomes whether the remaining text reads the same from both ends."
  - "You can avoid building that cleaned copy by keeping one position at each end of the original code and moving them towards each other."
  - "Move the left position forward while it sits on a non-counted character and the right position backward likewise; when both rest on counted characters, compare them ignoring case, stop with false on a mismatch, otherwise step both inward until they meet."
followups:
  - "How would you report the first pair of positions that breaks the mirror?"
  - "What if the scanner may misread at most one character - could the code still be accepted?"
  - "How would you extend the rule to Unicode letters?"
common_errors:
  - "Treating underscores or other punctuation as counted characters."
  - "Forgetting to lower-case one side, so 'A' and 'a' do not match."
  - "Skipping on one side but not checking bounds, which runs a pointer past the other."
  - "Matching digits case-insensitively against letters (for example 0 against O)."
