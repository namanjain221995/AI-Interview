version: 1
slug: longest_alignment_within_budget
title: Longest Config Segment Within Budget
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, devops, general]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Config Segment Within Budget

  A configuration line `s` has to be migrated to a new line `t` of the **same length**, one character
  position at a time. Rewriting position `i` costs `|code(s[i]) - code(t[i])|`, where `code` is the
  character's ASCII code. Positions that already match cost `0`.

  You may only migrate one **contiguous** segment of positions this release, and the total cost of that
  segment must not exceed `budget`. Return the **maximum length** of such a segment. If even a single
  position costs more than `budget`, return `0`.

  ### Example 1
  ```
  Input:  s = "timeout=30", t = "timeout=45", budget = 3
  Output: 9
  Explanation: the first 9 positions cost 0 + ... + 0 + 1 = 1; adding the last position would cost 5 more
  ```

  ### Example 2
  ```
  Input:  s = "v1.2.0", t = "v2.4.1", budget = 2
  Output: 3
  Explanation: the per-position costs are 0, 1, 0, 2, 0, 1
  ```

  ### Example 3
  ```
  Input:  s = "abc", t = "xyz", budget = 0
  Output: 0
  ```

  ### Constraints
  - `1 <= s.length == t.length <= 10^5`
  - `s` and `t` contain printable ASCII characters (codes 32 to 126)
  - `0 <= budget <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_affordable_segment
  params:
    - {name: s, type: "string"}
    - {name: t, type: "string"}
    - {name: budget, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_affordable_segment(s: str, t: str, budget: int) -> int:
        left = 0
        cost = 0
        best = 0
        for right in range(len(s)):
            cost += abs(ord(s[right]) - ord(t[right]))
            while cost > budget:
                cost -= abs(ord(s[left]) - ord(t[left]))
                left += 1
            best = max(best, right - left + 1)
        return best
  javascript: |
    function longestAffordableSegment(s, t, budget) {
      const diff = (i) => Math.abs(s.charCodeAt(i) - t.charCodeAt(i));
      let left = 0;
      let cost = 0;
      let best = 0;
      for (let right = 0; right < s.length; right++) {
        cost += diff(right);
        while (cost > budget) {
          cost -= diff(left);
          left++;
        }
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
tests:
  - {id: t1, args: ["timeout=30", "timeout=45", 3], expected: 9, description: "Example 1"}
  - {id: t2, args: ["v1.2.0", "v2.4.1", 2], expected: 3, description: "Example 2"}
  - {id: t3, args: ["abc", "xyz", 0], expected: 0, description: "Example 3 - every position costs more than the budget"}
  - {id: t4, hidden: true, args: ["replicas=3", "replicas=3", 0], expected: 10, description: "Identical strings with zero budget - whole length"}
  - {id: t5, hidden: true, args: ["a", "z", 24], expected: 0, description: "Single position costing 25 with budget 24"}
  - {id: t6, hidden: true, args: ["a", "z", 25], expected: 1, description: "Single position costing exactly the budget"}
  - {id: t7, hidden: true, args: ["~ ~ ~", " ~ ~ ", 1000000], expected: 5, description: "Huge budget covers every position (max-cost characters)"}
  - {id: t8, hidden: true, args: ["host=db1;port=5432", "host=db2;port=6543", 2], expected: 15, description: "Best segment is in the middle between two expensive positions"}
  - {id: t9, hidden: true, args: ["zzzzabcd", "aaaaabcd", 0], expected: 4, description: "Zero-cost segment at the end after expensive ones"}
  - {id: t10, hidden: true, args: ["mode=a", "MODE=b", 33], expected: 3, description: "Case changes cost 32 each; window must shrink repeatedly"}
  - {id: t11, hidden: true, args: ["", "", 60], expected: 12, description: "600 characters with mixed costs - many grow and shrink steps of the window"}
expected_concepts:
  - variable-size sliding window
  - per-position cost from character codes
  - shrink the window while the cost exceeds the budget
  - track the best window length
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Turns the strings into per-position costs, uses a two-pointer window that grows on the right and shrinks on the left while over budget, explains why each pointer moves at most n times and handles a zero answer.
  good: Correct sliding-window or prefix-sum plus binary-search solution, possibly after fixing an off-by-one in the window length.
  weak: Tries every start and end in O(n^2) or worse, resets the window instead of shrinking it, or misreads the cost as the number of differing positions.
  criteria:
    correctness: All tests pass, including zero budget, single positions and a zero-cost tail.
    efficiency: Linear time with constant memory; each position enters and leaves the window once.
    code_quality: A small helper for the per-position cost and clear left and right pointer names.
    edge_cases: Zero budget, identical strings, every position too expensive, budget equal to a single cost.
    communication: Explains why costs are non-negative and why that makes shrinking from the left valid.
hints:
  - First turn the two strings into a list of costs, one per position. What are you then looking for in that list?
  - Because no cost is negative, extending a segment never makes it cheaper; this lets you maintain a window with two pointers instead of trying every segment.
  - Move a right pointer across the positions adding each cost to a running total; while the total exceeds the budget, subtract the cost at the left pointer and move it right; after each step the window between the pointers is affordable, so record its length if it is the longest so far.
followups:
  - Why does this approach break if costs could be negative, and what would you do instead?
  - How would you return the start and end positions of the best segment?
  - How would you answer many different budgets for the same pair of strings?
common_errors:
  - Counting how many positions differ instead of summing the character-code differences.
  - Using an if instead of a loop when shrinking the window, which can leave it over budget.
  - Computing the window length as right minus left without the plus one.
  - Restarting the window from scratch after it goes over budget, which is quadratic.
