expected_concepts:
  - fixed-size sliding window
  - hash map of item counts inside the window
  - window is valid when it holds k distinct ids (or no repeats)
  - 64-bit accumulation of the revenue sum
optimal_complexity: {time: O(n), space: O(k)}
rubric:
  excellent: "Slides a k-day window with a count map and running sum, checks validity in O(1) (distinct count equals k), uses 64-bit sums, and explains O(n) time and O(k) memory."
  good: "Correct sliding window with a small inefficiency, such as rebuilding a set for each window in O(n k), or a 32-bit overflow fixed after testing."
  weak: "Uses a variable-size window that changes the stretch length, ignores the distinct rule, or returns a negative or sentinel value when nothing qualifies."
  criteria:
    correctness: "All tests pass, including no qualifying window and very large revenue totals."
    efficiency: Linear time; each day enters and leaves the window once and map updates are O(1).
    code_quality: Count map entries that drop to zero are removed (or tracked) so validity is easy to read.
    edge_cases: "k = 1, k = n, repeats at both ends of the input, zero revenue and 64-bit totals."
    communication: Explains how the validity check stays correct as days enter and leave the window.
hints:
  - "Every candidate stretch has the same length k; what changes when the stretch moves forward by one day?"
  - "Keep the revenue sum and a count of each item id for the current k-day window, updating both for the day that enters and the day that leaves instead of rebuilding them."
  - "Slide a k-day window from left to right; add the entering day's revenue and increment its id's count, subtract the leaving day's revenue and decrement its count (removing ids that reach zero); the window qualifies exactly when the map holds k different ids, so only then compare its sum with the best so far, which starts at zero."
followups:
  - "How would you return the first day of the best qualifying stretch?"
  - "What changes if a stretch may contain each item at most twice?"
  - "How would you find the longest stretch of distinct items instead of a fixed length?"
common_errors:
  - "Using a 32-bit accumulator, which overflows for large revenues."
  - Leaving zero-count entries in the map and then using the map size as the distinct count.
  - Checking validity before the first full window has been built.
  - "Rebuilding a set for every window, which is O(n k)."
