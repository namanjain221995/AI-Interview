slug: best_promo_window_distinct_products
title: Best Promotion Window With Distinct Items
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data_analyst, backend, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Best Promotion Window With Distinct Items

  A shop runs a daily featured-item promotion. On day `i` it featured the item with id `item_ids[i]`,
  and the promotion earned `revenue[i]`.

  Marketing wants to reuse the best stretch of exactly `k` consecutive days as a case study, but only
  stretches in which **no item id is featured more than once** qualify.

  Return the maximum total revenue of a qualifying stretch, or `0` if no stretch of `k` consecutive days
  qualifies. The total can exceed the 32-bit integer range.

  ### Example 1
  ```
  Input:  item_ids = [7, 3, 7, 5, 2, 3, 8], revenue = [120, 80, 200, 50, 90, 60, 40], k = 3
  Output: 340
  Explanation: Days 0-2 feature item 7 twice. The qualifying stretches earn 330 (days 1-3), 340 (days 2-4), 200 (days 3-5) and 190 (days 4-6).
  ```

  ### Example 2
  ```
  Input:  item_ids = [4, 4, 4], revenue = [10, 20, 30], k = 2
  Output: 0
  Explanation: Every two-day stretch features item 4 twice, so none qualifies.
  ```

  ### Constraints
  - `1 <= k <= n <= 10^5`
  - `item_ids.length == revenue.length == n`
  - `1 <= item_ids[i] <= 10^9`
  - `0 <= revenue[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_distinct_window_sum
  params:
    - {name: item_ids, type: "int[]"}
    - {name: revenue, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def best_distinct_window_sum(item_ids: list[int], revenue: list[int], k: int) -> int:
        counts: dict[int, int] = {}
        extra = 0  # how many entries in the window repeat an earlier entry
        total = 0
        best = 0
        for i, item in enumerate(item_ids):
            seen = counts.get(item, 0)
            if seen > 0:
                extra += 1
            counts[item] = seen + 1
            total += revenue[i]
            if i >= k:
                old = item_ids[i - k]
                counts[old] -= 1
                if counts[old] > 0:
                    extra -= 1
                total -= revenue[i - k]
            if i >= k - 1 and extra == 0:
                best = max(best, total)
        return best
  javascript: |
    function bestDistinctWindowSum(itemIds, revenue, k) {
      const counts = new Map();
      let total = 0;
      let best = 0;
      for (let i = 0; i < itemIds.length; i++) {
        counts.set(itemIds[i], (counts.get(itemIds[i]) || 0) + 1);
        total += revenue[i];
        if (i >= k) {
          const old = itemIds[i - k];
          const left = counts.get(old) - 1;
          if (left === 0) counts.delete(old);
          else counts.set(old, left);
          total -= revenue[i - k];
        }
        // The window is valid when it holds k distinct ids.
        if (i >= k - 1 && counts.size === k) best = Math.max(best, total);
      }
      return best;
    }
