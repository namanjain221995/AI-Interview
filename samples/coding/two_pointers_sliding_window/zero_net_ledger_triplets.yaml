title: Zero-Net Ledger Adjustments
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_analyst, general]
time_limit_minutes: 25
prompt_markdown: |
  ## Zero-Net Ledger Adjustments

  During month-end reconciliation, a finance team looks for groups of three ledger adjustments that
  cancel each other out exactly. You receive the adjustment amounts in cents as `amounts` (credits are
  positive, debits are negative).

  Return every **distinct** value triple `[a, b, c]` such that:

  - `a`, `b` and `c` are taken from three different positions of `amounts`,
  - `a + b + c = 0`, and
  - `a <= b <= c` (each triple is written in ascending order).

  Each distinct value triple is listed **once**, even when several combinations of positions produce
  it. The triples may be returned in any order. Return an empty list when no triple cancels out.

  ### Example 1
  ```
  Input:  amounts = [-4, 1, 3, 0, -1, 2, -2]
  Output: [[-4, 1, 3], [-2, -1, 3], [-2, 0, 2], [-1, 0, 1]]
  ```

  ### Example 2
  ```
  Input:  amounts = [5, -5, 0, 5]
  Output: [[-5, 0, 5]]
  Explanation: [-5, 0, 5] can be formed with either 5, but it is listed once.
  ```

  ### Example 3
  ```
  Input:  amounts = [1, 2, -10]
  Output: []
  Explanation: The only possible triple sums to -7.
  ```

  ### Constraints
  - `0 <= amounts.length <= 3000`
  - `-10^5 <= amounts[i] <= 10^5`

  **Follow-up:** Checking every combination of three positions is `O(n^3)`. Can you reach `O(n^2)` time without a set of seen triples?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: zero_sum_adjustments
  params:
    - {name: amounts, type: "int[]"}
  return_type: "int[][]"
  comparison: unordered
reference_solutions:
  python: |
    def zero_sum_adjustments(amounts: list[int]) -> list[list[int]]:
        values = sorted(amounts)
        n = len(values)
        result: list[list[int]] = []
        for i in range(n - 2):
            if values[i] > 0:
                break
            if i > 0 and values[i] == values[i - 1]:
                continue
            lo, hi = i + 1, n - 1
            while lo < hi:
                total = values[i] + values[lo] + values[hi]
                if total < 0:
                    lo += 1
                elif total > 0:
                    hi -= 1
                else:
                    result.append([values[i], values[lo], values[hi]])
                    lo += 1
                    hi -= 1
                    while lo < hi and values[lo] == values[lo - 1]:
                        lo += 1
                    while lo < hi and values[hi] == values[hi + 1]:
                        hi -= 1
        return result
  javascript: |
    function zeroSumAdjustments(amounts) {
      const values = [...amounts].sort((a, b) => a - b);
      const n = values.length;
      const result = [];
      for (let i = 0; i < n - 2; i++) {
        if (values[i] > 0) break;
        if (i > 0 && values[i] === values[i - 1]) continue;
        let lo = i + 1;
        let hi = n - 1;
        while (lo < hi) {
          const total = values[i] + values[lo] + values[hi];
          if (total < 0) {
            lo++;
          } else if (total > 0) {
            hi--;
          } else {
            result.push([values[i], values[lo], values[hi]]);
            lo++;
            hi--;
            while (lo < hi && values[lo] === values[lo - 1]) lo++;
            while (lo < hi && values[hi] === values[hi + 1]) hi--;
          }
        }
      }
      return result;
    }
