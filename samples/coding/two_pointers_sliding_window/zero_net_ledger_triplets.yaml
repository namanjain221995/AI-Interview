expected_concepts:
- sorting to enable two pointers
- fixing one value and searching the rest with two pointers
- skipping duplicate values to keep triples distinct
- O(n^2) time instead of O(n^3)
optimal_complexity:
  time: O(n^2)
  space: O(1) extra besides sorting and the output
rubric:
  excellent: Sorts, fixes each smallest value once, finds the other two with converging pointers, skips duplicates
    at all three positions without a set, and explains O(n^2) time.
  good: Correct O(n^2) solution that removes duplicates with a set of tuples or needs one fix to the duplicate skipping.
  weak: Uses three nested loops, returns duplicate triples, or reuses the same position twice.
  criteria:
    correctness: All tests pass with each value triple listed exactly once.
    efficiency: Quadratic time after an O(n log n) sort and no extra memory beyond the output.
    code_quality: Clear separation of the outer loop and the two-pointer scan, with readable duplicate skipping.
    edge_cases: Empty input, fewer than three amounts, all zeros and long runs of equal values.
    communication: Explains why sorting lets each pointer move in only one direction.
hints:
- If the amounts were in sorted order, how would you find two of them that add up to a given value without trying
  every pair?
- Fix the smallest member of the triple, then look for two later values that add up to its negation; sorting makes
  equal values sit next to each other, which helps with duplicates.
- Sort the amounts, take each position as the first member (skipping it when it equals the previous value), and
  move a low and a high index toward each other based on whether the sum is too small or too large; after recording
  a match, step both indexes past any repeats of the values just used.
followups:
- How would you adapt the approach to find triples that sum to an arbitrary target?
- What would change if you had to return the positions instead of the values?
- How would you count the triples instead of listing them, and could the count be large?
- How would you extend the idea to groups of four adjustments?
common_errors:
- Returning the same value triple more than once because duplicates are not skipped.
- Skipping duplicates of the first value before it has been used once, which misses triples such as [-1, -1, 2].
- Using three nested loops that are too slow for a few thousand amounts.
- Reusing the same position for two members of a triple.
