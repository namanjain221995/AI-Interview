title: Count Affordable Item Pairs
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, fullstack, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Count Affordable Item Pairs

  An online store is planning a "pick any two" bundle promotion. Before launching it, the merchandising
  team wants to know how many different bundles a shopper with a fixed budget could buy.

  You are given the list `costs`, where `costs[i]` is the price of item `i` (in cents), and an integer
  `budget`. Count the pairs of indices `i < j` such that `costs[i] + costs[j] <= budget`. Two different
  items with the same price are still different items, so each index pair counts once.

  ### Example 1
  ```
  Input:  costs = [30, 10, 50, 20, 40], budget = 60
  Output: 6
  Explanation: the affordable pairs are 10+20, 10+30, 10+40, 10+50, 20+30 and 20+40
  ```

  ### Example 2
  ```
  Input:  costs = [25, 25, 25], budget = 50
  Output: 3
  Explanation: every pair costs exactly 50; items with the same price are still different items
  ```

  ### Constraints
  - `0 <= costs.length <= 10^5`
  - `0 <= costs[i] <= 10^6`
  - `0 <= budget <= 2 * 10^6`
  - The number of pairs can exceed the 32-bit integer range; return it as a 64-bit integer.

  **Follow-up:** checking every pair is `O(n^2)`. Can you count them in `O(n log n)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_affordable_pairs
  params:
    - {name: costs, type: "int[]"}
    - {name: budget, type: "int"}
  return_type: "long"
  comparison: exact
reference_solutions:
  python: |
    def count_affordable_pairs(costs: list[int], budget: int) -> int:
        prices = sorted(costs)
        left, right = 0, len(prices) - 1
        count = 0
        while left < right:
            if prices[left] + prices[right] <= budget:
                count += right - left
                left += 1
            else:
                right -= 1
        return count
  javascript: |
    function countAffordablePairs(costs, budget) {
      const prices = [...costs].sort((x, y) => x - y);
      let left = 0;
      let right = prices.length - 1;
      let count = 0;
      while (left < right) {
        if (prices[left] + prices[right] <= budget) {
          count += right - left;
          left++;
        } else {
          right--;
        }
      }
      return count;
    }
