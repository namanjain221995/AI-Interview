et - roughly half of all pairs qualify"}
expected_concepts:
  - sorting to enable two pointers
  - counting a whole block of pairs at once
  - moving the pointer that cannot form more valid pairs
  - counting index pairs, not distinct prices
optimal_complexity: {time: O(n log n), space: O(n) for the sorted copy}
rubric:
  excellent: Starts from the O(n^2) baseline, sorts a copy, and counts with two pointers by adding right - left whenever the cheapest remaining item pairs with the current right item, explaining why each pointer move is safe.
  good: Correct sort-based solution (two pointers or binary search per item) with the right complexity, or a clear brute force with a convincing plan for the faster method.
  weak: Counts each pair twice, counts an item paired with itself, deduplicates equal prices, or stops at the nested loop without discussing complexity.
  criteria:
    correctness: All tests pass, including empty input, duplicates and sums exactly equal to the budget.
    efficiency: O(n log n) from sorting; the counting pass is linear, which matters at 10^5 items where the nested loop needs about 5 * 10^9 checks.
    code_quality: Sorts a copy rather than the caller's list; pointer moves are easy to follow.
    edge_cases: Zero or one item, zero budget, every pair affordable, no pair affordable, and a count beyond 32 bits held in a 64-bit integer.
    communication: Explains why all items between the pointers pair with the left item once the left and right items fit.
hints:
  - Checking every pair works but is quadratic. Would knowing the items in price order help you count many pairs at once?
  - After sorting, look at the cheapest and the most expensive remaining items. If they fit in the budget, what can you say about the cheapest item paired with every item in between?
  - Sort a copy and keep a left and a right pointer; when the two prices fit, every item from left plus one up to right pairs with the left item, so add that count and move left forward; otherwise the right item is too expensive for anything remaining, so move right back; stop when they meet.
followups:
  - How would you count pairs whose total falls within a range, between a minimum and a maximum?
  - How would you count distinct price combinations instead of index pairs?
  - What changes if the list is too large to sort in memory?
common_errors:
  - Adding one per step instead of right - left, which undercounts.
  - Counting ordered pairs or pairing an item with itself.
  - Removing duplicate prices, which drops valid bundles of different items.
  - Using a strict less-than comparison and missing pairs that cost exactly the budget.
  - Accumulating the count in a 32-bit integer, which overflows when almost every pair of 10^5 items is affordable.
