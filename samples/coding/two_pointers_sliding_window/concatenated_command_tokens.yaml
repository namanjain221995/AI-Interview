version: 1
slug: concatenated_command_tokens
title: "Concatenated Command Tokens"
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [security, backend, devops]
time_limit_minutes: 30
prompt_markdown: |
  ## Concatenated Command Tokens

  An intrusion-detection rule watches a shell `stream` with the separators stripped out, leaving one lowercase
  string. A suspicious command is assembled from a fixed list of `tokens`; all tokens have the **same
  length**, and the list may contain the same token more than once. Attackers reorder the pieces to dodge
  simple pattern matching.

  Write `concatenation_starts(stream, tokens)` that returns every start index `s` such that the substring of
  `stream` beginning at `s` with length `tokens.length * tokens[0].length` is formed by joining **all** the
  tokens in **some order**, each token used exactly as many times as it appears in the list.

  - Return the start indices in **ascending** order.
  - Matches may overlap; report every one.
  - Return an empty list when there is no match.

  ### Example 1
  ```
  Input:  stream = "zrmrfrmrfz", tokens = ["rm", "rf"]
  Output: [1, 3, 5]
  Explanation: "rmrf" starts at 1 and at 5, and "rfrm" starts at 3
  ```

  ### Example 2
  ```
  Input:  stream = "lscdlslscd", tokens = ["ls", "ls", "cd"]
  Output: [0, 2, 4]
  Explanation: "lscdls" at 0, "cdlsls" at 2 and "lslscd" at 4 each use ls twice and cd once
  ```

  ### Constraints
  - `1 <= stream.length <= 10^4`
  - `1 <= tokens.length <= 5000`
  - `1 <= tokens[i].length <= 30`, and all tokens have the same length
  - `stream` and every token contain only lowercase English letters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: concatenation_starts
  params:
    - {name: stream, type: "string"}
    - {name: tokens, type: "string[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import Counter


    def concatenation_starts(stream: str, tokens: list[str]) -> list[int]:
        size = len(tokens[0])
        total = size * len(tokens)
        need = Counter(tokens)
        found: list[int] = []
        for offset in range(size):
            seen: Counter[str] = Counter()
            used = 0  # tokens currently inside the window
            left = offset
            for right in range(offset, len(stream) - size + 1, size):
                word = stream[right:right + size]
                if word not in need:
                    seen.clear()
                    used = 0
                    left = right + size
                    continue
                seen[word] += 1
                used += 1
                while seen[word] > need[word]:
                    seen[stream[left:left + size]] -= 1
                    used -= 1
                    left += size
                if used == len(tokens):
                    found.append(left)
                    seen[stream[left:left + size]] -= 1
                    used -= 1
                    left += size
        return sorted(found)
  javascript: |
    function concatenationStarts(stream, tokens) {
      const size = tokens[0].length;
      const need = new Map();
      for (const token of tokens) need.set(token, (need.get(token) || 0) + 1);
      const found = [];
      for (let offset = 0; offset < size; offset++) {
        const seen = new Map();
        let used = 0;
        let left = offset;
        for (let right = offset; right + size <= stream.length; right += size) {
          const word = stream.slice(right, right + size);
          if (!need.has(word)) {
            seen.clear();
            used = 0;
            left = right + size;
            continue;
          }
          seen.set(word, (seen.get(word) || 0) + 1);
          used++;
          while (seen.get(word) > need.get(word)) {
            const out = stream.slice(left, left + size);
            seen.set(out, seen.get(out) - 1);
            used--;
            left += size;
          }
          if (used === tokens.length) {
            found.push(left);
            const out = stream.slice(left, left + size);
            seen.set(out, seen.get(out) - 1);
            used--;
            left += size;
          }
        }
      }
      return found.sort((a, b) => a - b);
    }
tests:
  - {id: t1, args: ["zrmrfrmrfz", ["rm", "rf"]], expected: [1, 3, 5], description: "Example 1 - overlapping matches in both token orders"}
  - {id: t2, args: ["lscdlslscd", ["ls", "ls", "cd"]], expected: [0, 2, 4], description: "Example 2 - a token that must appear twice"}
  - {id: t3, hidden: true, args: ["ab", ["abc"]], expected: [], description: "Token longer than the stream"}
  - {id: t4, hidden: true, args: ["aaaa", ["a"]], expected: [0, 1, 2, 3], description: "Single one-letter token matching everywhere"}
  - {id: t5, hidden: true, args: ["aaaaaa", ["aa", "aa"]], expected: [0, 1, 2], description: "Overlapping matches at different offsets modulo the token length"}
  - {id: t6, hidden: true, args: ["killpsps", ["kill", "kill"]], expected: [], description: "Token required twice but present once"}
  - {id: t7, hidden: true, args: ["pingping", ["ping", "ping"]], expected: [0], description: "Whole stream is exactly one match"}
  - {id: t8, hidden: true, args: ["xabba", ["ab", "ba"]], expected: [1], description: "Only match starts at an odd offset"}
  - {id: t9, hidden: true, args: ["getputgetputputget", ["get", "put", "put"]], expected: [3, 6, 9], description: "Repeated token with matches at several positions and a surplus that forces the window to shrink"}
  - {id: t10, hidden: true, args: ["", ["aba", "bab", "abb", "aba"]], expected: [455], description: "Stress - 1000-character two-letter stream with repeated three-letter tokens"}
expected_concepts:
  - "token counts in a hash map (multiset)"
  - "one sliding window per offset modulo the token length"
  - "shrinking the window when a token is over-used"
  - "resetting the window on an unknown token"
  - "O(L * n) time where L is the token length"
optimal_complexity: {time: "O(n * L)", space: "O(m * L)"}
rubric:
  excellent: "Counts tokens in a map, runs a token-stepped sliding window for each offset modulo the token length, shrinks on surplus and resets on unknown tokens, reports overlapping matches in ascending order and states O(n * L) time."
  good: "Checks every start index by cutting the candidate into tokens and comparing counts (O(n * m * L)) with clean code, or the sliding version with minor slips."
  weak: "Generates permutations of the tokens, ignores repeated tokens, or misses overlapping matches."
  criteria:
    correctness: "All tests pass, including repeated tokens, overlaps and impossible lengths."
    efficiency: "Each token-aligned position enters and leaves the window once per offset."
    code_quality: "Clear separation between required counts and window counts, with the window size tracked explicitly."
    edge_cases: "Tokens longer than the stream, single-character tokens and whole-stream matches."
    communication: "Explains why offsets modulo the token length cover every possible start."
hints:
  - "The order of the tokens does not matter, only how many times each one is used. How can you compare a candidate substring against the token list without trying permutations?"
  - "A candidate substring splits into token-sized pieces. If you only look at starts with the same remainder modulo the token length, consecutive candidates share all but one piece, so you can slide a window one token at a time."
  - "For each offset smaller than the token length, step through the stream one token at a time with a left edge and a map of counts; reset when a piece is not a token, shrink from the left while the newest piece is over-used, and when the window holds exactly as many pieces as the list, record the left edge and then drop the leftmost piece; finally sort the recorded starts."
followups:
  - "What if tokens could have different lengths?"
  - "How would you run this check on a stream that never ends?"
  - "How would you report which order of tokens was used at each match?"
  - "How does the cost change when the token list is very long but the stream is short?"
common_errors:
  - "Using a set of tokens, which ignores repeated tokens."
  - "Advancing one character at a time with fresh counts for each start, which is much slower."
  - "Forgetting to try every offset modulo the token length."
  - "Returning indices in offset order instead of ascending order."
