slug: min_k_toggle_flips
title: "Minimum Bulk Flag Flips"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [backend, platform, general]
time_limit_minutes: 30
prompt_markdown: |
  ## Minimum Bulk Flag Flips

  A platform team stores a row of feature flags for a fleet of services in a fixed order: `flags[i]` is `1`
  when the flag is on and `0` when it is off. Their legacy admin tool only supports one bulk operation: pick
  **exactly `k` consecutive flags** and **toggle** each of them (on becomes off, off becomes on). The range
  must lie fully inside the row.

  Write `min_window_flips(flags, k)` that returns the **minimum number of bulk operations** needed to turn
  every flag on, or `-1` if it cannot be done. If every flag is already on, the answer is `0`.

  ### Example 1
  ```
  Input:  flags = [0, 1, 0], k = 1
  Output: 2
  Explanation: toggle position 0, then position 2
  ```

  ### Example 2
  ```
  Input:  flags = [1, 1, 0], k = 2
  Output: -1
  Explanation: the last flag can only change by toggling positions 1 and 2, which turns position 1 off, and no further sequence repairs it
  ```

  ### Example 3
  ```
  Input:  flags = [0, 0, 0, 1, 0, 1, 1, 0], k = 3
  Output: 3
  Explanation: toggle positions 0-2, then 4-6, then 5-7
  ```

  ### Constraints
  - `1 <= k <= flags.length <= 10^5`
  - `flags[i]` is `0` or `1`

  **Follow-up:** a direct simulation costs `O(n * k)`; aim for `O(n)`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_window_flips
  params:
    - {name: flags, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_window_flips(flags: list[int], k: int) -> int:
        n = len(flags)
        started = [0] * n  # started[i] = 1 if an operation begins at flag i
        active = 0         # operations currently covering the flag being examined
        operations = 0
        for i in range(n):
            if i >= k:
                active -= started[i - k]
            # The flag's current state is its original value toggled by every active operation.
            if (flags[i] + active) % 2 == 0:
                if i + k > n:
                    return -1
                started[i] = 1
                active += 1
                operations += 1
        return operations
  javascript: |
    function minWindowFlips(flags, k) {
      const n = flags.length;
      const started = new Array(n).fill(0);
      let active = 0;
      let operations = 0;
      for (let i = 0; i < n; i++) {
        if (i >= k) active -= started[i - k];
        if ((flags[i] + active) % 2 === 0) {
          if (i + k > n) return -1;
          started[i] = 1;
          active++;
          operations++;
        }
      }
      return operations;
    }
