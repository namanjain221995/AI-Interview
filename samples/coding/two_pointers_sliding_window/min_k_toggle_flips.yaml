expected_concepts:
  - "greedy: the leftmost off flag can only be fixed by an operation starting there"
  - "difference array or queue recording where operations start"
  - "parity of active operations decides the current state of a flag"
  - "detecting impossibility when an operation would run past the end"
  - "O(n) time"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Argues that the leftmost off flag forces an operation starting there, tracks the number of active operations with a sliding record so each flag is examined once, detects impossibility at the tail, and states O(n) time (with the O(1)-space in-place variant as a bonus)."
  good: "Correct greedy with an O(n * k) simulation, then improves it to O(n) with hints, or the O(n) version with a partially explained greedy argument."
  weak: "Tries combinations or BFS over states, uses a greedy without justification that fails on overlaps, or misses the impossible case."
  criteria:
    correctness: "All tests pass, including impossible rows, k equal to n and already-on rows."
    efficiency: "Each flag is visited once and the active-operation count is updated in constant time."
    code_quality: "The current state of a flag is derived from one clear parity expression."
    edge_cases: "Single flag, k = 1, k = n and failures in the last k - 1 positions."
    communication: "Explains why the greedy choice is forced and why the order of operations does not matter."
hints:
  - "Look at the leftmost flag that is off. Which operations could still turn it on without touching earlier flags?"
  - "The order of operations does not matter and toggling the same range twice is wasted, so scan left to right and start an operation exactly when the current flag is off. Avoid re-toggling k flags each time by remembering how many operations currently cover the position."
  - "Keep a counter of active operations and a record of where each one started; when moving to position i, subtract the operation that started k positions earlier, compute the flag's state from its original value plus the counter modulo two, and if it is off either start a new operation there or return -1 when fewer than k flags remain."
followups:
  - "How would you do it with O(1) extra space by marking the input?"
  - "What if the tool could toggle any range of length at most k?"
  - "How would you return the start positions of the operations as well?"
  - "Why is the greedy choice optimal and not just valid?"
common_errors:
  - "Physically toggling k flags per operation, which is O(n * k)."
  - "Forgetting to expire an operation after k positions."
  - "Not checking that an operation fits before the end of the row."
  - "Using the original flag value instead of its value after the active toggles."
