version: 1
slug: merge_sorted_build_numbers
title: "Merge Release Train Build Numbers"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, devops, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Merge Release Train Build Numbers

  Your platform team runs two release trains, `a` and `b`. Each train publishes the build numbers it
  shipped as a list sorted in **non-decreasing** order. A build number can repeat inside one list (a build
  that was re-published), and the same build number can appear in both lists (a build promoted to both
  trains).

  The release dashboard needs one combined history. Write `merge_build_numbers(a, b)` that returns every
  build number that appears in `a`, in `b` or in both, **each exactly once**, in strictly increasing order.

  - Either list may be empty; if both are empty, return an empty list.
  - Aim to use the fact that both inputs are already sorted instead of sorting again.

  ### Example 1
  ```
  Input:  a = [3, 5, 5, 9], b = [1, 5, 8, 9, 12]
  Output: [1, 3, 5, 8, 9, 12]
  ```

  ### Example 2
  ```
  Input:  a = [], b = [4, 4, 7]
  Output: [4, 7]
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 10^4`
  - `0 <= a[i], b[i] <= 10^9`
  - `a` and `b` are each sorted in non-decreasing order.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: merge_build_numbers
  params:
    - {name: a, type: "int[]"}
    - {name: b, type: "int[]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def merge_build_numbers(a: list[int], b: list[int]) -> list[int]:
        merged: list[int] = []
        i, j = 0, 0
        while i < len(a) or j < len(b):
            if j >= len(b) or (i < len(a) and a[i] <= b[j]):
                value = a[i]
                i += 1
            else:
                value = b[j]
                j += 1
            if not merged or merged[-1] != value:
                merged.append(value)
        return merged
  javascript: |
    function mergeBuildNumbers(a, b) {
      const merged = [];
      let i = 0;
      let j = 0;
      while (i < a.length || j < b.length) {
        let value;
        if (j >= b.length || (i < a.length && a[i] <= b[j])) {
          value = a[i++];
        } else {
          value = b[j++];
        }
        if (merged.length === 0 || merged[merged.length - 1] !== value) merged.push(value);
      }
      return merged;
    }
