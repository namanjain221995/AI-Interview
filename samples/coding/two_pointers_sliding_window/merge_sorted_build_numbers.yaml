expected_concepts:
  - "two pointers advancing through both sorted lists"
  - "skipping duplicates by comparing with the last emitted value"
  - "draining the remaining list after the other is exhausted"
  - "O(n + m) time instead of concatenating and sorting"
optimal_complexity: {time: "O(n + m)", space: "O(1) extra besides the output"}
rubric:
  excellent: "Writes a single linear merge with two pointers, removes duplicates both within and across lists by checking the last emitted value, handles empty inputs without special cases and explains O(n + m) time."
  good: "Produces a correct merge with minor prompting, perhaps with separate loops for the tails or a slightly clumsy duplicate check, and states the linear complexity."
  weak: "Concatenates and sorts or uses a set without noticing the sorted input, keeps duplicates, or fails when one list is empty."
  criteria:
    correctness: "Every distinct build number appears exactly once and the output is strictly increasing."
    efficiency: "Linear time in the combined length; no re-sorting."
    code_quality: "Clear pointer names and one place where values are appended."
    edge_cases: "Empty lists, identical lists and long runs of the same build number."
    communication: "Explains why comparing with the last emitted value is enough to deduplicate sorted output."
hints:
  - "Both lists are already in order, so the smallest build you have not emitted yet is always at the front of one of them."
  - "Keep one position in each list and repeatedly take the smaller front value, then think about when that value should be skipped."
  - "Advance whichever pointer holds the smaller value (either one on a tie), and append the value only if it differs from the last value you appended; when one list runs out, keep pulling from the other with the same check."
followups:
  - "How would you merge k release trains instead of two?"
  - "What changes if you must keep repeated builds (a true multiset merge)?"
  - "Could you do this as a streaming merge where each train is an iterator you can only read once?"
common_errors:
  - "Only removing duplicates that appear in both lists and keeping repeats inside one list."
  - "Forgetting to copy the remaining tail of the longer list."
  - "Indexing past the end of a list when the other one still has elements."
  - "Sorting the concatenation, which ignores the sorted input and costs O((n + m) log(n + m))."
