version: 1
slug: count_segments_with_all_levels
title: Segments Containing Every Required Level
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, backend, data]
time_limit_minutes: 25
prompt_markdown: |
  ## Segments Containing Every Required Level

  An incident-triage tool shows log excerpts. `levels[i]` is the severity label of log line `i`
  (for example `"INFO"`, `"WARN"` or `"ERROR"`). An excerpt is useful only if it contains **every**
  label listed in `required` at least once.

  Return the number of **contiguous, non-empty** segments of `levels` that contain each label in
  `required` at least once. Segments are counted by position (start and end index). Labels are
  compared exactly (case-sensitive), `required` is non-empty with no duplicates, and labels in `levels`
  that are not required are allowed inside a segment. If some required label never appears, the answer
  is `0`.

  ### Example 1
  ```
  Input:  levels = ["INFO", "WARN", "INFO", "ERROR", "WARN"], required = ["WARN", "ERROR"]
  Output: 6
  Explanation: segments ending at index 3 must start at 0 or 1 (2 segments); segments ending at index 4 can start at 0 to 3 (4 segments)
  ```

  ### Example 2
  ```
  Input:  levels = ["DEBUG", "INFO"], required = ["ERROR"]
  Output: 0
  Explanation: no line has the ERROR label
  ```

  ### Constraints
  - `0 <= levels.length <= 1000`
  - `1 <= required.length <= 10`, all entries distinct
  - `1 <= levels[i].length, required[j].length <= 10`
  - Target an `O(n)` solution (with hashing) rather than checking every segment.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_covering_segments
  params:
    - {name: levels, type: "string[]"}
    - {name: required, type: "string[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_covering_segments(levels: list[str], required: list[str]) -> int:
        need = set(required)
        counts: dict[str, int] = {}
        covered = 0
        left = 0
        total = 0
        for level in levels:
            if level in need:
                counts[level] = counts.get(level, 0) + 1
                if counts[level] == 1:
                    covered += 1
            while covered == len(need):
                leaving = levels[left]
                if leaving in need:
                    counts[leaving] -= 1
                    if counts[leaving] == 0:
                        covered -= 1
                left += 1
            total += left
        return total
  javascript: |
    function countCoveringSegments(levels, required) {
      const need = new Set(required);
      const counts = new Map();
      let covered = 0;
      let left = 0;
      let total = 0;
      for (const level of levels) {
        if (need.has(level)) {
          const c = (counts.get(level) || 0) + 1;
          counts.set(level, c);
          if (c === 1) covered++;
        }
        while (covered === need.size) {
          const leaving = levels[left];
          if (need.has(leaving)) {
            const c = counts.get(leaving) - 1;
            counts.set(leaving, c);
            if (c === 0) covered--;
          }
          left++;
        }
        total += left;
      }
      return total;
    }
