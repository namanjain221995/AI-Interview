expected_concepts:
  - "sliding window with counts of required labels"
  - "number of required labels currently covered"
  - "for each right end, every start before the shrunk left pointer qualifies"
  - "counting by complement or at-least-k window technique in O(n)"
optimal_complexity: {time: "O(n + m)", space: "O(m)"}
rubric:
  excellent: "Uses a window with per-label counts and a covered counter, shrinks the left pointer while the window still covers every required label, adds the number of valid starts (the left pointer) for each right end, explains why that count is correct, and states O(n + m) time and O(m) space."
  good: "Correct O(n) or O(n log n) counting with a small slip fixed after tracing an example, or an O(n * m) solution that rechecks coverage per step."
  weak: "Enumerates every segment and checks coverage in O(n^2) or worse, counts only minimal segments, or double counts segments."
  criteria:
    correctness: "All tests pass, including absent labels, case-sensitive labels and repeated required labels."
    efficiency: "Each line enters and leaves the window once; linear in the log length."
    code_quality: "The covered counter and the counting step are clearly named and commented where non-obvious."
    edge_cases: "Empty log, requirement equal to the whole log and a single required label."
    communication: "Explains why every start before the left pointer gives a valid segment for the current end."
hints:
  - "If a segment contains every required label, what happens when you extend it further to the left?"
  - "For each end position, the valid starts form a prefix of positions; find the latest valid start with a window that tracks how many of each required label it holds and how many labels are covered."
  - "Move a right pointer over the lines, updating counts only for required labels and the covered total; while every required label is covered, remove the line at the left pointer from the counts and advance it; once the loop stops, every start strictly before the left pointer yields a covering segment for this end, so add the left pointer to the running total."
followups:
  - "How would you count segments that contain each required label at least twice?"
  - "How would you return the shortest covering segment instead of the count?"
  - "What changes if the log is a stream and you must report the count after every new line?"
common_errors:
  - "Counting only the minimal covering segment per end instead of all of them."
  - "Tracking labels that are not required, so the covered check never succeeds."
  - "Decrementing the covered count every time a required label leaves rather than when its count reaches zero."
  - "Checking coverage by scanning the whole segment at each step."
