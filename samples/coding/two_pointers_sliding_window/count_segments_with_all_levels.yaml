  - {id: t6, hidden: true, args: [["WARN", "warn", "Warn"], ["warn"]], expected: 4, description: "Case-sensitive labels - only segments containing index 1"}
  - {id: t7, hidden: true, args: [["A", "B", "C"], ["A", "B", "C"]], expected: 1, description: "Requirement equals the whole log - exactly one segment"}
