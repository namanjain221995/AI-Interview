  - {id: t3, hidden: true, args: [[], ["INFO"]], expected: 0, description: "Empty log returns 0"}
  - {id: t4, hidden: true, args: [["ERROR"], ["ERROR"]], expected: 1, description: "Single line that is exactly the requirement"}
