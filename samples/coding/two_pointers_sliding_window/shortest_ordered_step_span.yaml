version: 1
slug: shortest_ordered_step_span
title: "Shortest Span Containing Ordered Steps"
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [qa, security, backend]
time_limit_minutes: 30
prompt_markdown: |
  ## Shortest Span Containing Ordered Steps

  A security team audits privileged sessions. Each session's audit trail is stored as a string `log` of
  uppercase **step codes**, one character per recorded event (for example `L` for login, `M` for a
  second-factor check, `R` for reading a secret, `E` for an export). A compliance rule describes a
  `steps` string: a sequence of step codes that must occur **in this order**, although any other events may
  be interleaved between them.

  Write `shortest_ordered_span(log, steps)` that returns the **shortest contiguous substring** of `log` that
  contains `steps` as a subsequence, so that every character of `steps` can be matched, left to right, to a
  different position inside the substring.

  - If several substrings have the same minimum length, return the one that **starts earliest**.
  - If no substring of `log` contains `steps` in order, return the empty string `""`.
  - A repeated code in `steps` must be matched by separate events, so `"RR"` needs two `R` events.

  ### Example 1
  ```
  Input:  log = "LMXRLMRE", steps = "LRE"
  Output: "LMRE"
  Explanation: the whole log contains L, R, E in order, but "LMRE" (indices 4 to 7) is the shortest stretch that does
  ```

  ### Example 2
  ```
  Input:  log = "LMRRL", steps = "LE"
  Output: ""
  Explanation: no E event exists, so no span can contain the steps
  ```

  ### Example 3
  ```
  Input:  log = "ARBXAQB", steps = "AB"
  Output: "ARB"
  Explanation: "ARB" and "AQB" both have length 3; "ARB" starts first
  ```

  ### Constraints
  - `1 <= log.length <= 2 * 10^4`
  - `1 <= steps.length <= 100`
  - `log` and `steps` contain only uppercase English letters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_ordered_span
  params:
    - {name: log, type: "string"}
    - {name: steps, type: "string"}
  return_type: "string"
  comparison: exact
reference_solutions:
  python: |
    def shortest_ordered_span(log: str, steps: str) -> str:
        n, m = len(log), len(steps)
        best_start, best_len = -1, n + 1
        i = 0
        while i < n:
            # Forward: match steps in order starting from position i.
            j = 0
            while i < n:
                if log[i] == steps[j]:
                    j += 1
                    if j == m:
                        break
                i += 1
            if i == n:
                break
            end = i
            # Backward: from the end, find the latest start that still matches.
            j = m - 1
            while j >= 0:
                if log[i] == steps[j]:
                    j -= 1
                i -= 1
            start = i + 1
            if end - start + 1 < best_len:
                best_start, best_len = start, end - start + 1
            i = start + 1
        return "" if best_start < 0 else log[best_start:best_start + best_len]
  javascript: |
    function shortestOrderedSpan(log, steps) {
      const n = log.length;
      const m = steps.length;
      let bestStart = -1;
      let bestLen = n + 1;
      let i = 0;
      while (i < n) {
        let j = 0;
        while (i < n) {
          if (log[i] === steps[j]) {
            j++;
            if (j === m) break;
          }
          i++;
        }
        if (i === n) break;
        const end = i;
        j = m - 1;
        while (j >= 0) {
          if (log[i] === steps[j]) j--;
          i--;
        }
        const start = i + 1;
        if (end - start + 1 < bestLen) {
          bestStart = start;
          bestLen = end - start + 1;
        }
        i = start + 1;
      }
      return bestStart < 0 ? "" : log.slice(bestStart, bestStart + bestLen);
    }
tests:
  - {id: t1, args: ["LMXRLMRE", "LRE"], expected: "LMRE", description: "Example 1 - a later, shorter span beats the first full match"}
  - {id: t2, args: ["LMRRL", "LE"], expected: "", description: "Example 2 - a required step never occurs"}
  - {id: t3, args: ["ARBXAQB", "AB"], expected: "ARB", description: "Example 3 - tie between two shortest spans goes to the leftmost"}
  - {id: t4, hidden: true, args: ["LRE", "LRE"], expected: "LRE", description: "Log equals the steps exactly, answer is the whole log"}
  - {id: t5, hidden: true, args: ["LR", "LRE"], expected: "", description: "Steps longer than the log, must return empty string"}
  - {id: t6, hidden: true, args: ["XXQXX", "Q"], expected: "Q", description: "Single-step procedure, answer is the first occurrence of that code"}
  - {id: t7, hidden: true, args: ["RXRYYRZR", "RR"], expected: "RXR", description: "Repeated step code needs two separate events; two length-3 spans tie and the leftmost wins"}
  - {id: t8, hidden: true, args: ["AAAABXC", "ABC"], expected: "ABXC", description: "Forward match starts at the first A; the backward shrink must move the start to the last usable A"}
  - {id: t9, hidden: true, args: ["ABCABC", "CBA"], expected: "", description: "All codes present but never in the required order"}
  - {id: t10, hidden: true, args: ["MMMMMMLRE", "LRE"], expected: "LRE", description: "Only match sits at the very end of the log"}
  - {id: t11, hidden: true, args: ["QWERTYQWERTY", "YQ"], expected: "YQ", description: "Adjacent pair straddling the repeat boundary"}
  - {id: t12, hidden: true, args: ["", "LEDAM"], expected: "LELXLDRADM", description: "Stress - 1000-event log over eight codes with a five-step procedure"}
expected_concepts:
  - "subsequence matching inside a window"
  - "forward scan to find a window end, then backward scan to find the latest valid start"
  - "restarting the search just after the found start"
  - "leftmost tie-breaking by only replacing on a strictly shorter span"
  - "O(n * m) time with O(1) extra space (or an equivalent DP over positions)"
optimal_complexity: {time: "O(n * m)", space: "O(1)"}
rubric:
  excellent: "Explains why a forward match alone is not minimal, adds the backward shrink to find the latest start, restarts from just after that start, keeps the leftmost span on ties, handles impossible cases and repeated codes, and justifies O(n * m) time with O(1) space."
  good: "Reaches a correct O(n * m) solution (two-phase scan or a DP over log and step positions) with some prompting, with minor gaps in the complexity argument or tie-breaking explanation."
  weak: "Checks every substring with a subsequence test in O(n^2 * m) or worse without improving, treats the steps as a set or as a contiguous substring, or returns the wrong span on ties."
  criteria:
    correctness: "All tests pass, including repeated step codes, ties and impossible procedures."
    efficiency: "Each candidate end is found by one forward scan and shrunk by one backward scan; overall O(n * m)."
    code_quality: "Forward and backward phases are clearly separated and indices are named for what they hold."
    edge_cases: "Steps longer than the log, single-step procedures, matches at the very end and no match at all."
    communication: "Explains why the latest start for a fixed end gives the shortest span ending there."
hints:
  - "Suppose you already know where a valid span ends. Which start position makes that span as short as possible?"
  - "Scan forward until all steps have been matched in order; that position ends a valid span. Then walk backwards from there matching the steps in reverse to find the latest position where a span ending there can start."
  - "Repeat a two-phase scan: match the steps forward to find an end, match them backward from that end to find the tightest start, record the span if it is strictly shorter than the best so far, and resume the forward scan from one position after that start; return the empty string if no span was ever recorded."
followups:
  - "How would a dynamic-programming formulation over log positions and step positions compare in time and memory?"
  - "How would you answer many different procedures against the same long log efficiently?"
  - "What changes if the steps may occur in any order (a multiset instead of a sequence)?"
  - "How would you return every minimal span instead of only the leftmost one?"
common_errors:
  - "Stopping at the first forward match without shrinking it from the left."
  - "Restarting the next search after the end of the found span, which skips overlapping shorter spans."
  - "Treating steps as a contiguous substring instead of a subsequence."
  - "Replacing the best span on equal length, which returns the rightmost tie."
