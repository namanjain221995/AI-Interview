version: 1
slug: rebalance_shift_codes
title: Rebalance the Team Rota
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Rebalance the Team Rota

  A support organisation runs four on-call teams, coded `A`, `B`, `C` and `D`. The upcoming rota is a
  string `rota` in which character `i` names the team that owns shift `i`. Its length `n` is always a
  multiple of 4, and the rota is **balanced** when every team owns exactly `n / 4` shifts.

  The scheduling tool lets you make exactly one edit: pick a **contiguous** block of shifts and
  overwrite each shift in the block with any team code you like (codes inside the block may be chosen
  independently). Shifts outside the block keep their owner.

  Return the **minimum length** of a block whose rewrite can make the rota balanced. If the rota is
  already balanced, return `0` (no edit is needed).

  ### Example 1
  ```
  Input:  rota = "AABBBCAD"
  Output: 2
  Explanation: n / 4 = 2. Team A and team B each own one shift too many. Rewriting shifts 1..2
  ("AB") as "CD" gives "ACDBBCAD", where every team owns 2 shifts. No single shift can fix both
  surpluses.
  ```

  ### Example 2
  ```
  Input:  rota = "ACCCCCBD"
  Output: 3
  Explanation: team C owns 5 shifts but may only own 2, so three of its shifts must be inside the
  block; the shortest block holding three C shifts has length 3.
  ```

  ### Example 3
  ```
  Input:  rota = "ABCDDCBA"
  Output: 0
  Explanation: every team already owns exactly 2 shifts.
  ```

  ### Constraints
  - `4 <= rota.length <= 10^5`
  - `rota.length` is a multiple of 4.
  - `rota` contains only the characters `A`, `B`, `C` and `D`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_rebalance_segment
  params:
    - {name: rota, type: "string"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_rebalance_segment(rota: str) -> int:
        n = len(rota)
        quota = n // 4
        outside = {code: 0 for code in "ABCD"}
        for code in rota:
            outside[code] += 1
        if all(outside[code] == quota for code in "ABCD"):
            return 0
        best = n
        left = 0
        for right, code in enumerate(rota):
            outside[code] -= 1
            while left <= right and all(outside[c] <= quota for c in "ABCD"):
                best = min(best, right - left + 1)
                outside[rota[left]] += 1
                left += 1
        return best
  javascript: |
    function minRebalanceSegment(rota) {
      const n = rota.length;
      const quota = n / 4;
      const outside = { A: 0, B: 0, C: 0, D: 0 };
      for (const code of rota) outside[code]++;
      const fits = () => outside.A <= quota && outside.B <= quota && outside.C <= quota && outside.D <= quota;
      if (outside.A === quota && outside.B === quota && outside.C === quota && outside.D === quota) return 0;
      let best = n;
      let left = 0;
      for (let right = 0; right < n; right++) {
        outside[rota[right]]--;
        while (left <= right && fits()) {
          best = Math.min(best, right - left + 1);
          outside[rota[left]]++;
          left++;
        }
      }
      return best;
    }
tests:
  - {id: t1, args: ["AABBBCAD"], expected: 2, description: "Example 1"}
  - {id: t2, args: ["ACCCCCBD"], expected: 3, description: "Example 2"}
  - {id: t3, args: ["ABCDDCBA"], expected: 0, description: "Example 3 - already balanced returns 0"}
  - {id: t4, hidden: true, args: ["ABCD"], expected: 0, description: "Minimum length, already balanced"}
  - {id: t5, hidden: true, args: ["AAAA"], expected: 3, description: "Minimum length, single team owns everything - rewrite 3 of 4"}
  - {id: t6, hidden: true, args: ["DDDDDDDD"], expected: 6, description: "Whole rota is one team - block must cover n - n/4 shifts"}
  - {id: t7, hidden: true, args: ["AAAAACCCDDDBBBBB"], expected: 8, description: "Surplus teams at opposite ends - block must span the whole middle"}
  - {id: t8, hidden: true, args: ["BDCADCBCADDBCCAC"], expected: 2, description: "One team two shifts over quota, surplus spread across the rota"}
  - {id: t9, hidden: true, args: ["CCCCAAAABBBBDDDDDDDDBBBB"], expected: 4, description: "Long runs - surplus sits in one contiguous run"}
  - {id: t10, hidden: true, args: ["ACBDCADBACDBACBA"], expected: 1, description: "One surplus shift and one missing shift - block of length 1"}
  - {id: t11, hidden: true, args: [""], expected: 47, description: "400-shift rota with a cluster of surplus A shifts (stress, needs linear window)"}
expected_concepts:
  - "reframing: the shifts outside the block must not exceed the quota for any team"
  - "variable-size sliding window with two pointers"
  - "maintaining counts incrementally as the window moves"
  - "early exit when the rota is already balanced"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Observes that a block works exactly when no team exceeds n / 4 shifts outside it, scans with a shrinking window that keeps counts of the outside shifts, handles the already-balanced case and explains O(n) time with O(1) extra space."
  good: "Reaches the outside-count condition and a correct sliding window, or a correct binary search on the block length with an O(n log n) check, with minor prompting."
  weak: "Tries every block in O(n^2) or worse without improving, or reasons only about the total surplus and ignores which teams are over quota."
  criteria:
    correctness: "All tests pass, including the already-balanced rota and a rota made of a single team."
    efficiency: "Each pointer only moves forward and the check costs constant time for four teams."
    code_quality: "Counts of shifts outside the window are kept in one small map with a clear validity check."
    edge_cases: "Balanced input returns 0; surplus at both ends of the rota; minimum length 4."
    communication: "Explains why only teams above quota matter and why shrinking from the left never skips a shorter block."
hints:
  - "Think about the shifts you do not touch. What must be true about them for some rewrite of the block to balance the rota?"
  - "A block is good exactly when, outside the block, no team owns more than n / 4 shifts, because the block can then be filled with the missing teams. Look for the shortest such block with a window over the rota."
  - "Count every team's shifts, return zero if already balanced, then extend a right pointer one shift at a time while removing that shift from the outside counts; whenever all four outside counts are within the quota, record the window length and move the left pointer forward, adding its shift back to the outside counts, until the condition breaks."
followups:
  - "How would the approach change for k teams instead of four, and what would the complexity be?"
  - "How would you also return the rewritten rota, not just the block length?"
  - "What if each team had its own target count instead of an equal share?"
  - "Could you solve it with binary search on the block length, and how does that compare?"
common_errors:
  - "Answering with the total surplus divided among teams, which ignores where the surplus shifts are located."
  - "Checking that outside counts equal the quota instead of being at most the quota."
  - "Forgetting to return 0 for an already balanced rota, which makes the window logic return a positive length."
  - "Moving the left pointer past the right pointer and reading an empty window as valid."
