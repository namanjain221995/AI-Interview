time_limit_minutes: 20
prompt_markdown: |
  ## Growth Windows Below a Cap

  A growth dashboard stores one positive integer multiplier per week: `multipliers[i]` is how many
  times a usage metric grew during week `i` (a value of `1` means it stayed flat). The compounded growth
  of a run of consecutive weeks is the **product** of their multipliers.

  Return how many **contiguous, non-empty** windows of weeks have a compounded growth **strictly less
  than** `cap`. Windows are counted by position, so equal values in different positions are counted
  separately. An empty list returns `0`.

  Aim for a solution that does not recompute the product of every window from scratch.

  ### Example 1
  ```
  Input:  multipliers = [3, 1, 4, 2], cap = 10
  Output: 8
  Explanation: all 4 single weeks, the pairs [3, 1], [1, 4] and [4, 2], and the triple [1, 4, 2] stay below 10
  ```

  ### Example 2
  ```
  Input:  multipliers = [5, 5, 5], cap = 5
  Output: 0
  Explanation: the cap is strict, so even a single week with growth 5 does not count
  ```

  ### Constraints
  - `0 <= multipliers.length <= 1000`
  - `1 <= multipliers[i] <= 1000`
  - `0 <= cap <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_windows_product_below
  params:
    - {name: multipliers, type: "int[]"}
    - {name: cap, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_windows_product_below(multipliers: list[int], cap: int) -> int:
        if cap <= 1:
            return 0
        product = 1
        left = 0
        total = 0
        for right, value in enumerate(multipliers):
            product *= value
            while product >= cap:
                product //= multipliers[left]
                left += 1
            total += right - left + 1
        return total
  javascript: |
    function countWindowsProductBelow(multipliers, cap) {
      if (cap <= 1) return 0;
      let product = 1;
      let left = 0;
      let total = 0;
      for (let right = 0; right < multipliers.length; right++) {
        product *= multipliers[right];
        while (product >= cap) {
          product = product / multipliers[left];
          left++;
        }
        total += right - left + 1;
      }
      return total;
    }
