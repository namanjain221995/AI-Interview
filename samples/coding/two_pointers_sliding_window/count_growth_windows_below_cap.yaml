expected_concepts:
  - "two-pointer window with a running product"
  - "dividing out the leaving element when shrinking"
  - "each right end contributes the window length to the count"
  - "cap of 0 or 1 means no window qualifies"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Keeps a running product over a window, shrinks from the left while the product reaches the cap, adds the window length for every right end, handles cap <= 1 explicitly, notes that the product stays below cap times 1000 so it fits in 32 bits, and states O(n) time and O(1) space."
  good: "Correct two-pointer solution with minor prompting, or a log-prefix-sum plus binary search approach with a discussion of precision."
  weak: "Computes every window product in O(n^2) or O(n^3) without improvement, counts windows equal to the cap, or loops forever when cap <= 1."
  criteria:
    correctness: "All tests pass, including the strict boundary, cap = 0 and cap = 1."
    efficiency: "Each week enters and leaves the window once; linear time."
    code_quality: "The counting step (adding the window length) is explained or obvious from naming."
    edge_cases: "Empty list, all-ones input and multipliers equal to the cap."
    communication: "Explains why every window ending at the right pointer and starting inside the current window qualifies."
hints:
  - "If a window's product is below the cap, what can you say about every shorter window that ends at the same week?"
  - "Because all multipliers are at least 1, extending a window never lowers its product; keep a running product over a window and shrink it from the left when it gets too large."
  - "Move a right pointer over the weeks and multiply the running product by the new week; while the product is at least the cap, divide out the week at the left pointer and advance it; then every window ending at the right pointer and starting anywhere from the left pointer qualifies, so add the window length to the total, and return zero immediately when the cap is at most one."
followups:
  - "What would break if multipliers could be zero or fractional?"
  - "How would you count windows whose product lies inside a range [low, high)?"
  - "How could logarithms and prefix sums solve this, and what precision issues would they introduce?"
common_errors:
  - "Forgetting the cap <= 1 case, so the shrinking loop runs past the right pointer."
  - "Counting windows whose product equals the cap."
  - "Adding 1 per right end instead of the window length."
  - "Recomputing products for every pair of endpoints, which is quadratic or worse."
