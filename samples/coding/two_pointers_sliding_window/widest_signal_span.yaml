slug: widest_signal_span
title: Widest Relay Link Coverage
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, network]
time_limit_minutes: 20
prompt_markdown: |
  ## Widest Relay Link Coverage

  A row of antenna masts stands along a ridge, one unit apart; `heights[i]` is the height of mast `i`.
  Engineers can string a single relay link between any two masts `i < j`. The link hangs at the height
  of the lower of its two masts, so its **coverage** is

  `coverage(i, j) = (j - i) * min(heights[i], heights[j])`

  Masts standing between `i` and `j` do not affect the link. Return the largest coverage any single
  link can achieve, or `0` when there are fewer than two masts.

  ### Example 1
  ```
  Input:  heights = [2, 7, 4, 1, 6, 3]
  Output: 18
  Explanation: Masts 1 and 4 (heights 7 and 6) are 3 apart, so the link covers 3 * 6 = 18.
  ```

  ### Example 2
  ```
  Input:  heights = [5, 5]
  Output: 5
  Explanation: The only link spans distance 1 at height 5.
  ```

  ### Constraints
  - `0 <= heights.length <= 10^5`
  - `0 <= heights[i] <= 10^4`

  **Follow-up:** Checking every pair is `O(n^2)`. Can you find the answer in a single `O(n)` pass?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_link_coverage
  params:
    - {name: heights, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_link_coverage(heights: list[int]) -> int:
        lo, hi = 0, len(heights) - 1
        best = 0
        while lo < hi:
            best = max(best, (hi - lo) * min(heights[lo], heights[hi]))
            if heights[lo] < heights[hi]:
                lo += 1
            else:
                hi -= 1
        return best
  javascript: |
    function maxLinkCoverage(heights) {
      let lo = 0;
      let hi = heights.length - 1;
      let best = 0;
      while (lo < hi) {
        best = Math.max(best, (hi - lo) * Math.min(heights[lo], heights[hi]));
        if (heights[lo] < heights[hi]) lo++;
        else hi--;
      }
      return best;
    }
