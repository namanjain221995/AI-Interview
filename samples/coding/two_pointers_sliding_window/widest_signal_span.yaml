expected_concepts:
- two pointers starting at both ends
- moving the pointer at the lower mast
- argument that the discarded mast cannot be part of a better link
- O(n) time with O(1) extra space
optimal_complexity:
  time: O(n)
  space: O(1)
rubric:
  excellent: Starts from the widest link, always moves the lower end inward, proves why that end can be discarded,
    and states O(n) time and O(1) space.
  good: Implements the two-pointer solution correctly but needs prompting to justify why moving the lower mast is
    safe.
  weak: Uses the O(n^2) double loop, moves the taller mast, or mishandles inputs with fewer than two masts.
  criteria:
    correctness: All tests pass, including empty input, a single mast and equal heights.
    efficiency: Single pass from both ends with constant extra memory.
    code_quality: Readable loop with the coverage formula computed in one place.
    edge_cases: Fewer than two masts, zero heights and equal heights at both pointers.
    communication: Explains that every narrower link using the lower mast is no better than the current one.
hints:
- Begin with the widest possible link, between the first and the last mast, and ask which of its two masts limits
  the coverage.
- Any narrower link that keeps the lower of the two masts can never beat the current one, so that mast can be dropped
  from consideration.
- Keep one index at each end, record the coverage of the current pair, then move the index at the lower mast one
  step inward (either one on a tie) and repeat until the indexes meet, returning the best value seen.
followups:
- Why is it safe to discard the lower mast, and what goes wrong if you move the taller one instead?
- How would you return the pair of masts as well as the coverage?
- What changes if each link must also skip over at most one taller mast between its ends?
- How would you handle heights large enough that the product overflows a 32-bit integer?
common_errors:
- Moving the pointer at the taller mast, which can skip the optimal pair.
- Computing the area with the taller mast instead of the lower one.
- Checking all pairs in O(n^2) and timing out on large inputs.
- Indexing into an empty array or returning a negative value when there are fewer than two masts.
