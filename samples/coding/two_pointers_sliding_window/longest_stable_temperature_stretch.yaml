time_limit_minutes: 30
prompt_markdown: |
  ## Longest Stable Temperature Stretch

  A cold-storage warehouse logs one temperature reading per minute, as an integer in hundredths of a
  degree. Quality assurance calls a stretch of consecutive readings **stable** when the difference between
  its highest and its lowest reading is at most `tolerance`.

  Given `readings` and `tolerance`, return the length of the **longest** stable stretch of consecutive
  readings. A single reading is always stable; return `0` when there are no readings.

  ### Example 1
  ```
  Input:  readings = [-410, -395, -402, -398, -380, -399, -401, -360], tolerance = 20
  Output: 4
  Explanation: the first four readings span -410 to -395 (difference 15); adding -380 would make the
  difference 30, and no later stretch of four or more stays within 20
  ```

  ### Example 2
  ```
  Input:  readings = [], tolerance = 5
  Output: 0
  ```

  ### Example 3
  ```
  Input:  readings = [250, 250, 250], tolerance = 0
  Output: 3
  ```

  ### Constraints
  - `0 <= readings.length <= 10^5`
  - `-10^9 <= readings[i] <= 10^9`
  - `0 <= tolerance <= 2 * 10^9`
  - The difference between two readings can exceed the 32-bit integer range.

  **Follow-up:** can you find the answer in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_stable_stretch
  params:
    - {name: readings, type: "int[]"}
    - {name: tolerance, type: int}
  return_type: int
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def longest_stable_stretch(readings: list[int], tolerance: int) -> int:
        highs: deque[int] = deque()  # indices with decreasing readings: front is the window maximum
        lows: deque[int] = deque()  # indices with increasing readings: front is the window minimum
        left = 0
        best = 0
        for right, value in enumerate(readings):
            while highs and readings[highs[-1]] <= value:
                highs.pop()
            highs.append(right)
            while lows and readings[lows[-1]] >= value:
                lows.pop()
            lows.append(right)
            while readings[highs[0]] - readings[lows[0]] > tolerance:
                left += 1
                if highs[0] < left:
                    highs.popleft()
                if lows[0] < left:
                    lows.popleft()
            best = max(best, right - left + 1)
        return best
  javascript: |
    function longestStableStretch(readings, tolerance) {
      const n = readings.length;
      const highs = new Array(n);
      const lows = new Array(n);
      let hHead = 0;
      let hTail = 0;
      let lHead = 0;
      let lTail = 0;
      let left = 0;
      let best = 0;
      for (let right = 0; right < n; right++) {
        const value = readings[right];
        while (hTail > hHead && readings[highs[hTail - 1]] <= value) hTail--;
        highs[hTail++] = right;
        while (lTail > lHead && readings[lows[lTail - 1]] >= value) lTail--;
        lows[lTail++] = right;
        while (readings[highs[hHead]] - readings[lows[lHead]] > tolerance) {
          left++;
          if (highs[hHead] < left) hHead++;
          if (lows[lHead] < left) lHead++;
        }
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
