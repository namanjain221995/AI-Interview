expected_concepts:
  - variable-size sliding window
  - monotonic deques for the running maximum and minimum
  - shrinking the window from the left while it is unstable
  - 64-bit arithmetic for the spread
  - amortised O(n) because every index enters and leaves each deque once
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Uses a sliding window whose maximum and minimum are kept in two monotonic deques, shrinks it while the spread exceeds the tolerance, avoids overflow with 64-bit arithmetic and proves the O(n) bound.
  good: Correct sliding window that tracks the extremes with a balanced tree, multiset or heaps in O(n log n), or reaches the deques with a hint.
  weak: Checks every stretch in O(n^2) or worse, recomputes the extremes of each window from scratch, or overflows on extreme readings.
  criteria:
    correctness: All tests pass, including empty input, zero tolerance and spreads of 2 * 10^9.
    efficiency: Linear time with monotonic deques; an O(n log n) ordered structure is acceptable but noted.
    code_quality: Clear window edges and deque invariants, with no duplicated extreme recomputation.
    edge_cases: Empty log, single reading, all equal readings and negative values.
    communication: Explains why shrinking from the left never skips a longer stable stretch.
hints:
  - If a stretch is unstable, every longer stretch containing it is unstable too; that suggests a window that grows on the right and shrinks on the left.
  - The window needs its current maximum and minimum at every step, even after readings leave from the left; think about structures that keep only the readings that can still become the extreme.
  - Keep one deque of indices with decreasing readings for the maximum and one with increasing readings for the minimum; after adding each reading, advance the left edge while the front maximum minus the front minimum exceeds the tolerance, popping fronts that fall behind the left edge, and record the window length, computing the difference in 64-bit arithmetic.
followups:
  - How would you return the start and end minute of the longest stable stretch, preferring the earliest one?
  - What changes if you may ignore up to one faulty reading inside a stretch?
  - How would you answer this over a live stream where readings older than a day are discarded?
  - How would a balanced tree or multiset solution compare in time and memory?
common_errors:
  - Comparing each new reading only with the first reading of the window instead of the true maximum and minimum.
  - Recomputing the window maximum and minimum by scanning, which is O(n^2).
  - Computing the spread in 32-bit integers, which overflows for readings of opposite sign near 10^9.
  - Forgetting to drop deque fronts that are now left of the window.
