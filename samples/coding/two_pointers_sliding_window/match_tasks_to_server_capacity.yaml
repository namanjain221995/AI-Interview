expected_concepts:
  - "sorting both lists"
  - "two pointers over sorted tasks and servers"
  - "greedy: give each server the smallest task that still fits"
  - "exchange argument for the greedy choice"
optimal_complexity: {time: "O(n log n + m log m)", space: "O(n + m)"}
rubric:
  excellent: "Sorts both lists, walks servers in ascending order matching the smallest unplaced task, justifies the greedy choice and states O(n log n + m log m)."
  good: "Correct sorted two-pointer solution with a brief or partially formal justification."
  weak: "Assigns tasks in input order, uses a strict less-than comparison, or tries all assignments with exponential or quadratic cost without recognising it."
  criteria:
    correctness: "All tests pass, including exact fits, duplicates and empty lists."
    efficiency: "Two sorts followed by a single linear merge-style pass."
    code_quality: "Clear names for the task pointer and server loop; inputs are copied before sorting."
    edge_cases: "Empty lists, nothing fits, more servers than tasks and values at the bound."
    communication: "Explains why wasting a big server on a small task is never better than using the smallest adequate server."
hints:
  - "Small tasks are the easiest to place and small servers are the least useful; does ordering either list help?"
  - "Sort both lists. Look at the smallest server: if it cannot take the smallest task, it cannot take any task."
  - "Walk the servers from smallest to largest with a pointer into the sorted tasks; whenever the current server can hold the task at the pointer, count a placement and advance the pointer, otherwise just skip the server; the count at the end is the answer."
followups:
  - "Why is matching each server to the smallest remaining task never worse than any other choice?"
  - "How would you return which task runs on which server, using original indices?"
  - "What changes if a server could host several tasks as long as their total fits?"
  - "If tasks also had a CPU demand, would the greedy still work?"
common_errors:
  - "Using a strict comparison so a task equal to the capacity is rejected."
  - "Sorting only one of the two lists."
  - "Assigning the largest server to the first task in input order."
  - "Relying on JavaScript's default string sort for numbers."
