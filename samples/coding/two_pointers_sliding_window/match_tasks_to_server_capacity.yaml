version: 1
slug: match_tasks_to_server_capacity
title: Place Tasks on Servers
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [backend, devops, cloud, platform]
time_limit_minutes: 15
prompt_markdown: |
  ## Place Tasks on Servers

  A batch scheduler has a list of pending tasks and a list of idle servers. `demands[i]` is the memory
  (in MiB) task `i` needs and `capacities[j]` is the free memory of server `j`.

  - Each server can host **at most one** task.
  - Each task runs on **at most one** server.
  - A task fits on a server only if its demand is **less than or equal to** the server's capacity.

  Return the **maximum number of tasks** that can be placed at the same time. Either list may be empty.

  ### Example 1
  ```
  Input:  demands = [4, 2, 7], capacities = [3, 8, 1]
  Output: 2
  Explanation: only the 8 MiB server can take the 4 MiB or the 7 MiB task, so at most two tasks run,
  for example 2 MiB on the 3 MiB server and 4 MiB on the 8 MiB server
  ```

  ### Example 2
  ```
  Input:  demands = [5, 5, 5], capacities = [5, 6]
  Output: 2
  Explanation: only two servers exist, and both can take a 5 MiB task
  ```

  ### Constraints
  - `0 <= demands.length, capacities.length <= 10^5`
  - `1 <= demands[i], capacities[j] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: max_tasks_placed
  params:
    - {name: demands, type: "int[]"}
    - {name: capacities, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def max_tasks_placed(demands: list[int], capacities: list[int]) -> int:
        tasks = sorted(demands)
        servers = sorted(capacities)
        placed = 0
        for capacity in servers:
            if placed < len(tasks) and tasks[placed] <= capacity:
                placed += 1
        return placed
  javascript: |
    function maxTasksPlaced(demands, capacities) {
      const tasks = [...demands].sort((a, b) => a - b);
      const servers = [...capacities].sort((a, b) => a - b);
      let placed = 0;
      for (const capacity of servers) {
        if (placed < tasks.length && tasks[placed] <= capacity) placed++;
      }
      return placed;
    }
