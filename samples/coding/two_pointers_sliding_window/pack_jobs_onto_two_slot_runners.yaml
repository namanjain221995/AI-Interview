expected_concepts:
- sorting the jobs by memory
- pairing the heaviest remaining job with the lightest when possible
- exchange argument for why the greedy pairing is optimal
- two pointers meeting in the middle
optimal_complexity:
  time: O(n log n)
  space: O(1) extra besides sorting
rubric:
  excellent: Sorts, always places the heaviest job and pairs it with the lightest when they fit, gives an exchange
    argument for optimality and states O(n log n).
  good: Correct greedy two-pointer solution with a short informal justification or a small fix to the loop bounds.
  weak: Pairs adjacent jobs, tries a non-optimal greedy such as pairing the two heaviest that fit, or searches all
    pairings.
  criteria:
    correctness: All tests pass, including no jobs, a single job and jobs that cannot pair.
    efficiency: Sorting dominates; the pairing pass is linear.
    code_quality: A short loop with clear pointer names and no special cases outside the loop.
    edge_cases: Empty input, odd counts, jobs equal to the cap and many tiny jobs.
    communication: Explains why the heaviest job loses nothing by taking the lightest available partner.
hints:
- 'Think about the heaviest job: which partner, if any, gives it the best chance of sharing a runner?'
- If the heaviest job cannot share with the lightest job, it cannot share with anyone, so it must run alone; if
  it can, pairing it with the lightest never hurts the remaining jobs.
- Sort the memory values and keep a low index at the lightest job and a high index at the heaviest; each step opens
  one runner for the heavy job, adds the light job to it when their total is within the cap, and moves the indexes
  inward until they cross.
followups:
- Can you sketch the exchange argument that proves the greedy pairing is optimal?
- What changes if a runner could host up to three jobs?
- If memory values are small integers, can you avoid the comparison sort?
- How would you also return which jobs share each runner?
common_errors:
- Pairing adjacent jobs in sorted order instead of the lightest with the heaviest.
- Letting the loop pair a job with itself when the two indexes meet.
- Packing more than two jobs on a runner because the memory still fits.
- Forgetting to count the final runner when one job is left in the middle.
