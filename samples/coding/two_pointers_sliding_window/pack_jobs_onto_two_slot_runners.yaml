slug: pack_jobs_onto_two_slot_runners
title: Pack Jobs Onto Two-Slot Runners
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, cloud]
time_limit_minutes: 20
prompt_markdown: |
  ## Pack Jobs Onto Two-Slot Runners

  A CI system starts a batch of jobs at the same moment. `job_memory[i]` is the memory (in MB) that
  job `i` needs. Every runner has **two slots** and `cap` MB of memory, so a runner can host either one
  job, or two jobs whose combined memory is **at most** `cap`. Every job fits on a runner by itself.

  Return the minimum number of runners needed to run all jobs at the same time. Return `0` when there
  are no jobs.

  ### Example 1
  ```
  Input:  job_memory = [400, 700, 300, 900, 600], cap = 1000
  Output: 3
  Explanation: 900 runs alone; 300 + 700 and 400 + 600 each fill a runner exactly.
  ```

  ### Example 2
  ```
  Input:  job_memory = [2, 2, 2], cap = 4
  Output: 2
  Explanation: Two jobs share one runner and the third needs its own.
  ```

  ### Constraints
  - `0 <= job_memory.length <= 5 * 10^4`
  - `1 <= job_memory[i] <= cap <= 3 * 10^4`

  **Follow-up:** Can you do it in `O(n log n)` time and explain why your pairing choice is always optimal?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: min_runners
  params:
    - {name: job_memory, type: "int[]"}
    - {name: cap, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def min_runners(job_memory: list[int], cap: int) -> int:
        jobs = sorted(job_memory)
        lo, hi = 0, len(jobs) - 1
        runners = 0
        while lo <= hi:
            if lo < hi and jobs[lo] + jobs[hi] <= cap:
                lo += 1
            hi -= 1
            runners += 1
        return runners
  javascript: |
    function minRunners(jobMemory, cap) {
      const jobs = [...jobMemory].sort((a, b) => a - b);
      let lo = 0;
      let hi = jobs.length - 1;
      let runners = 0;
      while (lo <= hi) {
        if (lo < hi && jobs[lo] + jobs[hi] <= cap) lo++;
        hi--;
        runners++;
      }
      return runners;
    }
