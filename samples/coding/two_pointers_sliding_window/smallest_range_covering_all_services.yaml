slug: smallest_range_covering_all_services
title: Smallest Range Covering Every Service
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [sre, backend, platform]
time_limit_minutes: 35
prompt_markdown: |
  ## Smallest Range Covering Every Service

  During an incident review, an SRE wants the shortest moment in time when **every** service in a fleet
  was demonstrably alive. Each service sends heartbeats: `heartbeats[i]` lists the timestamps (in
  seconds) of service `i`'s heartbeats, sorted in non-decreasing order.

  Find the closed range `[start, end]` with the smallest width `end - start` that contains **at least one
  heartbeat of every service**. If several ranges have the same smallest width, return the one with the
  smaller `start`. Return the range as the two-element array `[start, end]`.

  ### Example 1
  ```
  Input:  heartbeats = [[3, 18, 40], [10, 21, 33], [15, 25]]
  Output: [15, 21]
  Explanation: [15, 21] contains 18, 21 and 15 (width 6); no narrower range covers all three services
  ```

  ### Example 2
  ```
  Input:  heartbeats = [[5, 9], [5, 12]]
  Output: [5, 5]
  ```

  ### Example 3
  ```
  Input:  heartbeats = [[8, 14, 20]]
  Output: [8, 8]
  ```

  ### Constraints
  - `1 <= heartbeats.length <= 1000`
  - `1 <= heartbeats[i].length <= 100`
  - `0 <= heartbeats[i][j] <= 10^9`
  - Each `heartbeats[i]` is sorted in non-decreasing order and may contain repeated timestamps.

  **Follow-up:** with `k` services and `N` heartbeats in total, can you do it in `O(N log k)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: smallest_covering_range
  params:
    - {name: heartbeats, type: "int[][]"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    import heapq


    def smallest_covering_range(heartbeats: list[list[int]]) -> list[int]:
        # One pointer per service; the heap holds each service's current timestamp.
        heap = [(times[0], service, 0) for service, times in enumerate(heartbeats)]
        heapq.heapify(heap)
        current_max = max(times[0] for times in heartbeats)
        best = [heap[0][0], current_max]
        while True:
            low, service, index = heapq.heappop(heap)
            # Starts are visited in non-decreasing order, so a strict improvement keeps the smallest start on ties.
            if current_max - low < best[1] - best[0]:
                best = [low, current_max]
            if index + 1 == len(heartbeats[service]):
                return best  # this service has no later heartbeat, so no later start can cover it
            nxt = heartbeats[service][index + 1]
            current_max = max(current_max, nxt)
            heapq.heappush(heap, (nxt, service, index + 1))
  javascript: |
    function smallestCoveringRange(heartbeats) {
      // Binary min-heap of [timestamp, service, index].
      const heap = [];
      const less = (a, b) => a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);
      const push = (item) => {
        heap.push(item);
        let i = heap.length - 1;
        while (i > 0) {
          const parent = (i - 1) >> 1;
          if (!less(heap[i], heap[parent])) break;
          [heap[i], heap[parent]] = [heap[parent], heap[i]];
          i = parent;
        }
      };
      const pop = () => {
        const top = heap[0];
        const last = heap.pop();
        if (heap.length > 0) {
          heap[0] = last;
          let i = 0;
          for (;;) {
            const l = 2 * i + 1;
            const r = l + 1;
            let m = i;
            if (l < heap.length && less(heap[l], heap[m])) m = l;
            if (r < heap.length && less(heap[r], heap[m])) m = r;
            if (m === i) break;
            [heap[i], heap[m]] = [heap[m], heap[i]];
            i = m;
          }
        }
        return top;
      };
      let currentMax = -Infinity;
      heartbeats.forEach((times, service) => {
        push([times[0], service, 0]);
        currentMax = Math.max(currentMax, times[0]);
      });
      let best = [heap[0][0], currentMax];
      for (;;) {
        const [low, service, index] = pop();
        if (currentMax - low < best[1] - best[0]) best = [low, currentMax];
        if (index + 1 === heartbeats[service].length) return best;
        const next = heartbeats[service][index + 1];
        currentMax = Math.max(currentMax, next);
        push([next, service, index + 1]);
      }
    }
