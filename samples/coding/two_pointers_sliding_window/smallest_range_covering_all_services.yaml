expected_concepts:
  - one pointer per sorted list (k-way merge)
  - min-heap for the smallest current timestamp
  - tracking the running maximum of the current pointers
  - advancing the pointer of the minimum to shrink the range
  - stopping when any list is exhausted
  - tie-breaking on the smaller start
optimal_complexity: {time: O(N log k), space: O(k)}
rubric:
  excellent: Keeps one pointer per service with a min-heap and a running maximum, advances only the minimum, stops when that service is exhausted, explains why the optimal range is examined and how the tie-break falls out of the scan order, and states O(N log k).
  good: Correct heap solution reached with a hint, or a correct merge-then-sliding-window solution over all timestamps tagged by service in O(N log N).
  weak: Tries every pair of timestamps as a range, advances the wrong pointer, or ignores the tie-break and duplicate timestamps.
  criteria:
    correctness: All tests pass, including ties in width, duplicate timestamps, a single service and identical lists.
    efficiency: O(N log k) with a heap; the merged sliding window is acceptable at O(N log N).
    code_quality: Clear heap entries (timestamp, service, position) and a single loop with an explicit stopping condition.
    edge_cases: One service, one heartbeat per service, shared timestamps and disjoint services.
    communication: Explains why advancing anything other than the minimum can never produce a narrower range.
hints:
  - A covering range has to touch one heartbeat from each service; imagine holding exactly one current heartbeat per service and looking at the smallest and largest of them.
  - The only way to narrow the range defined by the current heartbeats is to move the service holding the smallest one to its next heartbeat; a heap gives you that smallest one quickly.
  - Start with every service's first heartbeat in a min-heap and track the largest current heartbeat; repeatedly take the smallest, compare the range from it to the tracked largest with the best so far (replacing it only when strictly narrower so the earlier start wins ties), then advance that service to its next heartbeat and update the largest, stopping as soon as that service has no heartbeats left.
followups:
  - How would you solve it by merging all heartbeats into one list tagged by service and sliding a window over it?
  - How would you find the narrowest range that covers at least m of the k services?
  - What changes if heartbeats arrive as unsorted streams?
  - Why is it safe to stop as soon as one service runs out of heartbeats?
common_errors:
  - Advancing the pointer of the largest timestamp, which can only widen the range.
  - Continuing after a service is exhausted, which produces ranges that miss that service.
  - Replacing the best range on equal width, which returns a later start instead of the earliest.
  - Forgetting to update the running maximum when a pointer advances.
