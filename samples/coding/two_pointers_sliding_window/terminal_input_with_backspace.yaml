  - {id: t10, hidden: true, args: ["x<y", "xy"], expected: false, description: "Backspace removes x so only y remains"}
  - {id: t11, hidden: true, args: ["<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<z", ""], expected: true, description: "Stress - 900 keystrokes with a long backspace run"}
expected_concepts:
  - "replaying with a stack as the baseline"
  - "walking both strings from the end"
  - "counting pending backspaces to skip characters"
  - "O(1) extra space two-pointer comparison"
optimal_complexity: {time: "O(n + m)", space: "O(1)"}
rubric:
  excellent: "Starts from the stack replay baseline, then derives the backward scan that counts pending backspaces, compares surviving characters pairwise, handles excess backspaces and different lengths, and states O(n + m) time with O(1) space."
  good: "Implements the stack or string-builder replay correctly for both inputs and can explain the backward two-pointer idea when prompted."
  weak: "Removes characters incorrectly when a backspace hits an empty line, compares raw lengths, or only handles a single backspace in a row."
  criteria:
    correctness: "Correct for consecutive backspaces, backspaces on an empty line and texts of different raw length."
    efficiency: "Linear time; constant extra space for the follow-up."
    code_quality: "A small helper that finds the previous surviving character keeps the main loop readable."
    edge_cases: "Empty recordings, only backspaces, trailing backspaces and case differences."
    communication: "Explains why scanning from the end makes it possible to know which characters survive."
hints:
  - "Start by thinking about how you would replay one recording into its final text; which data structure behaves like a line where backspace removes the latest character?"
  - "Whether a character survives depends only on the backspaces that come after it, so reading each recording from the end lets you decide without rebuilding the text."
  - "Walk both recordings from the end, keeping a count of pending backspaces for each; a backspace increases the count, a typed character with a positive count decreases it and is skipped, and otherwise it is the next surviving character to compare with the other side; the texts match only if both sides run out together."
followups:
  - "How would you support a key that deletes the whole previous word?"
  - "How would you return the final text itself in a streaming fashion?"
  - "What changes if the recordings can contain a cursor-left key?"
common_errors:
  - "Letting a backspace on an empty line go negative or delete future characters."
  - "Comparing only the number of surviving characters, not the characters themselves."
  - "Returning true when one side still has surviving characters after the other is exhausted."
  - "Handling only one backspace at a time when scanning backwards, so runs of backspaces skip too few characters."
