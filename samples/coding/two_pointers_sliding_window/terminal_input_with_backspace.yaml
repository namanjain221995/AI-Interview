slug: terminal_input_with_backspace
title: "Terminal Input With Backspace"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [frontend, qa, fullstack, support_engineer]
time_limit_minutes: 15
prompt_markdown: |
  ## Terminal Input With Backspace

  A support tool records raw keystrokes from two terminal sessions so engineers can tell whether two
  users actually ran the same command. In a recording, the character `<` stands for the **backspace** key;
  every other character is a key that typed itself.

  Replaying a recording works like a terminal: a backspace deletes the most recently typed character that
  is still on the line, and a backspace on an empty line does nothing.

  Write `same_final_text(a, b)` that returns `true` if replaying recordings `a` and `b` leaves exactly the
  same text on the line, and `false` otherwise. Comparison is case-sensitive and spaces count as typed
  characters.

  ### Example 1
  ```
  Input:  a = "git stauts<<<tus", b = "git status"
  Output: true
  ```

  ### Example 2
  ```
  Input:  a = "kubectl<<<<<<<helm", b = "helm"
  Output: true
  ```

  ### Example 3
  ```
  Input:  a = "rm -r<f", b = "rm -rf"
  Output: false
  ```

  ### Constraints
  - `0 <= a.length, b.length <= 10^4`
  - `a` and `b` consist of printable ASCII characters; `<` is always a backspace.

  **Follow-up:** can you answer in `O(n + m)` time and `O(1)` extra space, without rebuilding either text?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: same_final_text
  params:
    - {name: a, type: "string"}
    - {name: b, type: "string"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def same_final_text(a: str, b: str) -> bool:
        def prev_kept(s: str, i: int) -> int:
            # Index of the last character at or before i that survives replay, or -1.
            skip = 0
            while i >= 0:
                if s[i] == "<":
                    skip += 1
                elif skip > 0:
                    skip -= 1
                else:
                    return i
                i -= 1
            return -1

        i, j = len(a) - 1, len(b) - 1
        while True:
            i = prev_kept(a, i)
            j = prev_kept(b, j)
            if i < 0 or j < 0:
                return i < 0 and j < 0
            if a[i] != b[j]:
                return False
            i -= 1
            j -= 1
  javascript: |
    function sameFinalText(a, b) {
      const prevKept = (s, i) => {
        let skip = 0;
        while (i >= 0) {
          if (s[i] === "<") {
            skip++;
          } else if (skip > 0) {
            skip--;
          } else {
            return i;
          }
          i--;
        }
        return -1;
      };
      let i = a.length - 1;
      let j = b.length - 1;
      while (true) {
        i = prevKept(a, i);
        j = prevKept(b, j);
        if (i < 0 || j < 0) return i < 0 && j < 0;
        if (a[i] !== b[j]) return false;
        i--;
        j--;
      }
    }
