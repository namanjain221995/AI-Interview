title: Promotion Bundles Under a Limit
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data_analyst, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Promotion Bundles Under a Limit

  An online store is planning a "pick any three" promotion. A **bundle** is any choice of three
  different catalog items, identified by their positions `i < j < k` in `prices`. Two bundles are
  different when they use a different set of positions, even if their prices happen to be equal.

  Given the item prices and a budget `limit`, return how many bundles have a total price **strictly
  less than** `limit`. Return `0` when the catalog has fewer than three items.

  ### Example 1
  ```
  Input:  prices = [12, 5, 9, 20, 3], limit = 27
  Output: 4
  Explanation: The qualifying totals are 3 + 5 + 9 = 17, 3 + 5 + 12 = 20, 3 + 9 + 12 = 24 and 5 + 9 + 12 = 26.
  ```

  ### Example 2
  ```
  Input:  prices = [4, 4, 4, 4], limit = 12
  Output: 0
  Explanation: Every bundle costs exactly 12, which is not strictly less than the limit.
  ```

  ### Constraints
  - `0 <= prices.length <= 300`
  - `0 <= prices[i] <= 10^6`
  - `0 <= limit <= 4 * 10^6`

  **Follow-up:** Checking every bundle is `O(n^3)`. Can you count them in `O(n^2)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_bundles_under
  params:
    - {name: prices, type: "int[]"}
    - {name: limit, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_bundles_under(prices: list[int], limit: int) -> int:
        values = sorted(prices)
        count = 0
        for i in range(len(values) - 2):
            lo, hi = i + 1, len(values) - 1
            while lo < hi:
                if values[i] + values[lo] + values[hi] < limit:
                    count += hi - lo
                    lo += 1
                else:
                    hi -= 1
        return count
  javascript: |
    function countBundlesUnder(prices, limit) {
      const values = [...prices].sort((a, b) => a - b);
      let count = 0;
      for (let i = 0; i < values.length - 2; i++) {
        let lo = i + 1;
        let hi = values.length - 1;
        while (lo < hi) {
          if (values[i] + values[lo] + values[hi] < limit) {
            count += hi - lo;
            lo++;
          } else {
            hi--;
          }
        }
      }
      return count;
    }
