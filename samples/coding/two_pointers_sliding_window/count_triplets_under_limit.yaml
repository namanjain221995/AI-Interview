expected_concepts:
- sorting so that prices are ordered
- fixing the cheapest item and counting pairs with two pointers
- adding a whole block of pairs at once (hi - lo)
- O(n^2) time instead of O(n^3)
optimal_complexity:
  time: O(n^2)
  space: O(1) extra besides sorting
rubric:
  excellent: Sorts, fixes the first item, and for each low index adds every valid high partner at once, explaining
    why sorting does not change the count and stating O(n^2) time.
  good: Correct O(n^2) counting with a small fix, or an O(n^2 log n) binary-search version with the trade-off explained.
  weak: Stays with three nested loops, counts totals equal to the limit, or counts the same bundle more than once.
  criteria:
    correctness: All tests pass, including totals exactly equal to the limit and duplicate prices.
    efficiency: Quadratic time after an O(n log n) sort.
    code_quality: Clear names for the fixed item and the two pointers, and the count update in one place.
    edge_cases: Fewer than three items, a limit of zero and equal prices.
    communication: Explains why sorting is allowed even though bundles are defined by original positions.
hints:
- Only the set of three items matters for the total, so reordering the prices does not change how many bundles qualify.
- After sorting, fix the cheapest item of the bundle; if the cheapest remaining partner plus the most expensive
  one fit under the limit, every partner in between fits as well.
- Sort the prices, then for each first item keep a low index just after it and a high index at the end; when the
  three prices are below the limit add the number of positions between low and high and move low up, otherwise move
  high down.
followups:
- Why is it valid to sort when bundles are defined by the original positions?
- How would you count bundles whose total lies within a range [low, high)?
- How would you return the cheapest bundle instead of a count?
- What changes if a bundle could contain four items?
common_errors:
- Counting totals equal to the limit even though the comparison is strict.
- Adding one per valid pair instead of the whole block of partners, which makes the count wrong.
- Using three nested loops that do not scale.
- Deduplicating equal prices, which undercounts bundles made from different positions.
