expected_concepts:
- the answer is a contiguous window of the sorted list
- binary search on the left edge of the window
- comparing the distances of the elements just outside the window
- tie-breaking toward the smaller price
optimal_complexity:
  time: O(log(n - k) + k)
  space: O(1) extra besides the output
rubric:
  excellent: Recognises the answer is a window, binary-searches its left edge by comparing x - prices[mid] with
    prices[mid + k] - x, handles ties toward the cheaper price and states O(log n + k).
  good: Correct O(n) solution that shrinks a window from both ends, or the binary search after fixing the tie rule.
  weak: Sorts by distance and loses the tie rule or the ascending output, or returns indexes instead of prices.
  criteria:
    correctness: All tests pass, including ties, duplicates and budgets outside the price range.
    efficiency: Logarithmic search for the window plus linear output, or at worst a linear scan.
    code_quality: Clear window bounds with no off-by-one errors in the search range.
    edge_cases: k equal to n, a single price, and budgets below or above every price.
    communication: Explains why the comparison at the window edges decides which way to move.
hints:
- Because the prices are sorted, the k closest prices always sit next to each other in the list.
- Treat the answer as a window of length k and ask where its left edge should start; compare the first price inside
  a candidate window with the first price just past its right end.
- 'Binary-search the left edge between position zero and n minus k: if the price at the candidate start is farther
  from the budget than the price k positions later, the window must move right, otherwise keep the start or move
  left (a tie keeps the cheaper side), then return the k prices from that start.'
followups:
- Why does the comparison use the price k positions after the candidate start rather than the last price inside
  the window?
- How would you solve it with a heap if the prices were not sorted?
- How would you return the answer ordered by closeness instead of by price?
- What changes if ties should go to the more expensive price?
common_errors:
- Using absolute values in the binary-search comparison, which breaks on duplicate prices.
- Searching the left edge up to n instead of n minus k and indexing past the end.
- Breaking ties toward the more expensive price.
- Returning the prices ordered by distance instead of in ascending order.
