title: K Closest Price Points
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [backend, data, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## K Closest Price Points

  A shopping assistant suggests the `k` price points nearest to a shopper's budget `x`. The available
  price points are given in `prices`, sorted in **non-decreasing** order (the same price can appear
  more than once).

  The distance of a price `p` from the budget is `|p - x|`. Price `p` is **closer** than price `q`
  when `|p - x| < |q - x|`, or when the distances are equal and `p < q` (ties go to the cheaper price).

  Return the `k` closest prices in **ascending** order.

  ### Example 1
  ```
  Input:  prices = [10, 20, 30, 40, 50], k = 2, x = 33
  Output: [30, 40]
  Explanation: 30 is 3 away and 40 is 7 away; the next candidate, 20, is 13 away.
  ```

  ### Example 2
  ```
  Input:  prices = [5, 8, 12, 15], k = 3, x = 10
  Output: [5, 8, 12]
  Explanation: 8 and 12 are both 2 away; 5 and 15 are both 5 away, and the cheaper 5 wins the tie.
  ```

  ### Example 3
  ```
  Input:  prices = [3, 6, 9], k = 2, x = 100
  Output: [6, 9]
  Explanation: The budget is above every price, so the two most expensive prices are closest.
  ```

  ### Constraints
  - `1 <= k <= prices.length <= 10^4`
  - `0 <= prices[i] <= 10^6`, sorted in non-decreasing order
  - `0 <= x <= 10^6` (the budget does not have to be one of the prices)

  **Follow-up:** Sorting by distance costs `O(n log n)`. Can you use the sorted order to answer in `O(log n + k)`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: closest_prices
  params:
    - {name: prices, type: "int[]"}
    - {name: k, type: "int"}
    - {name: x, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def closest_prices(prices: list[int], k: int, x: int) -> list[int]:
        lo, hi = 0, len(prices) - k
        while lo < hi:
            mid = (lo + hi) // 2
            if x - prices[mid] > prices[mid + k] - x:
                lo = mid + 1
            else:
                hi = mid
        return prices[lo:lo + k]
  javascript: |
    function closestPrices(prices, k, x) {
      let lo = 0;
      let hi = prices.length - k;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (x - prices[mid] > prices[mid + k] - x) lo = mid + 1;
        else hi = mid;
      }
      return prices.slice(lo, lo + k);
    }
