expected_concepts:
  - circular indexing with modulo
  - fixed-size sliding window on a ring
  - mapping negative k to a window that precedes each tile
  - not mutating the input
optimal_complexity: {time: O(n), space: O(1) extra besides the output}
rubric:
  excellent: Treats both signs of k as one window with different start and end offsets, slides it around the ring with modulo indexing in O(n), and explains why the tile's own value is never included.
  good: Correct solution, possibly O(n * |k|) with direct summation, or a linear solution that needed a fix for the wrap-around or the negative case.
  weak: Includes the tile's own value, breaks on wrap-around or negative k, or overwrites values while still reading from them.
  criteria:
    correctness: All tests pass for positive, negative and zero k, including k = n - 1 and a single tile.
    efficiency: Linear time with a running window sum; quadratic direct summation is noted as the baseline.
    code_quality: Index arithmetic is centralised (one start and end offset) rather than duplicated for each sign.
    edge_cases: Single tile, k = 0, k = plus or minus (n - 1), negative values.
    communication: Explains how the negative case maps onto the same circular window.
hints:
  - "Start with the straightforward version: for each tile, walk around the ring and add up the tiles it needs. How do you wrap an index past the end or before the start?"
  - The tiles summed for tile i and tile i plus one overlap in all but two positions, so a running window sum can move one step at a time.
  - "Express both signs of k as a window of offsets relative to i: offsets one through k for positive k, and offsets n plus k through n minus one for negative k; compute that window once for tile zero, then for each next tile subtract the value leaving at the start offset and add the value entering after the end offset, all taken modulo n."
followups:
  - How would you handle values of k whose magnitude is n or larger?
  - How would you do this with a prefix-sum array over a doubled copy of the ring?
  - What changes if the display needs the average of the neighbours instead of the sum?
common_errors:
  - Including the tile's own value in its sum.
  - Using a language's remainder operator on negative indices, which can give a negative index.
  - Writing results back into values while later tiles still read the original numbers.
  - Recomputing every window from scratch without discussing the O(n * |k|) cost.
