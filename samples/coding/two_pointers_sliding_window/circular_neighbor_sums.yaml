title: Ring Dashboard Neighbour Sums
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [frontend, general, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Ring Dashboard Neighbour Sums

  An operations wall display shows metric tiles arranged in a **ring**: tile `i` is followed clockwise by
  tile `i + 1`, and the last tile is followed by tile `0`. Tile `i` currently shows `values[i]`.

  A new "neighbourhood" view replaces every tile's number with a sum of other tiles, controlled by `k`:

  - if `k > 0`, tile `i` shows the sum of the `k` tiles that **follow** it clockwise
    (`values[i + 1]`, ..., `values[i + k]`, wrapping around the ring);
  - if `k < 0`, tile `i` shows the sum of the `|k|` tiles that **precede** it
    (`values[i - 1]`, ..., `values[i - |k|]`, wrapping around the ring);
  - if `k == 0`, every tile shows `0`.

  A tile never includes its own value. Return the new values as a list in tile order, without
  modifying `values`.

  ### Example 1
  ```
  Input:  values = [3, -1, 4, 2], k = 2
  Output: [3, 6, 5, 2]
  Explanation: tile 0 shows values[1] + values[2] = -1 + 4 = 3; tile 3 wraps and shows values[0] + values[1] = 2
  ```

  ### Example 2
  ```
  Input:  values = [6, 0, -5, 9, 1], k = -2
  Output: [10, 7, 6, -5, 4]
  Explanation: tile 0 shows values[4] + values[3] = 1 + 9 = 10
  ```

  ### Example 3
  ```
  Input:  values = [7, 7, 7], k = 0
  Output: [0, 0, 0]
  ```

  ### Constraints
  - `1 <= values.length <= 10^4`
  - `-10^4 <= values[i] <= 10^4`
  - `-(values.length - 1) <= k <= values.length - 1`

  **Follow-up:** can you do it in `O(n)` time, independent of `|k|`?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: ring_neighbor_sums
  params:
    - {name: values, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def ring_neighbor_sums(values: list[int], k: int) -> list[int]:
        n = len(values)
        result = [0] * n
        if k == 0:
            return result
        if k > 0:
            start, end = 1, k
        else:
            start, end = n + k, n - 1
        window = sum(values[j % n] for j in range(start, end + 1))
        for i in range(n):
            result[i] = window
            window -= values[(start + i) % n]
            window += values[(end + i + 1) % n]
        return result
  javascript: |
    function ringNeighborSums(values, k) {
      const n = values.length;
      const result = new Array(n).fill(0);
      if (k === 0) return result;
      const start = k > 0 ? 1 : n + k;
      const end = k > 0 ? k : n - 1;
      let window = 0;
      for (let j = start; j <= end; j++) window += values[j % n];
      for (let i = 0; i < n; i++) {
        result[i] = window;
        window -= values[(start + i) % n];
        window += values[(end + i + 1) % n];
      }
      return result;
    }
