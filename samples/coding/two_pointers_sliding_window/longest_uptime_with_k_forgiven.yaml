slug: longest_uptime_with_k_forgiven
title: Longest Uptime With Forgiven Failures
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [sre, devops, backend]
time_limit_minutes: 20
prompt_markdown: |
  ## Longest Uptime With Forgiven Failures

  A health checker probes a service once a minute and records the result in `checks`: `1` means the
  probe succeeded (up) and `0` means it failed (down). For the monthly SLA review the team may
  **forgive** up to `k` failed probes inside a reported uptime streak (for example, blips caused by the
  probe itself).

  Return the length of the longest **contiguous** stretch of probes that contains **at most `k`**
  failed probes, so that it counts as fully up once those failures are forgiven. Forgiveness is not
  needed to use all `k`. An empty list of probes returns `0`, and with `k = 0` the answer is simply the
  longest run of consecutive `1`s.

  ### Example 1
  ```
  Input:  checks = [1, 1, 0, 1, 1, 1, 0, 0, 1, 1], k = 1
  Output: 6
  Explanation: forgiving the failure at index 2 joins indices 0 to 5 into a stretch of 6 probes
  ```

  ### Example 2
  ```
  Input:  checks = [0, 0, 1, 0], k = 0
  Output: 1
  Explanation: nothing can be forgiven, so the longest run of successful probes has length 1
  ```

  ### Constraints
  - `0 <= checks.length <= 10^5`
  - `checks[i]` is `0` or `1`
  - `0 <= k <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_forgiven_uptime
  params:
    - {name: checks, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_forgiven_uptime(checks: list[int], k: int) -> int:
        best = 0
        left = 0
        down = 0
        for right, value in enumerate(checks):
            if value == 0:
                down += 1
            while down > k:
                if checks[left] == 0:
                    down -= 1
                left += 1
            best = max(best, right - left + 1)
        return best
  javascript: |
    function longestForgivenUptime(checks, k) {
      let best = 0;
      let left = 0;
      let down = 0;
      for (let right = 0; right < checks.length; right++) {
        if (checks[right] === 0) down++;
        while (down > k) {
          if (checks[left] === 0) down--;
          left++;
        }
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
