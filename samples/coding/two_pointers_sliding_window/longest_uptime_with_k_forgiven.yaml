expected_concepts:
  - "variable-size sliding window with two pointers"
  - "counting failures inside the window"
  - "shrinking the window only while the failure count exceeds k"
  - "linear scan instead of checking every stretch"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Reframes the task as the longest window with at most k zeros, keeps a zero count while advancing the right pointer and shrinking the left only when the count exceeds k, handles empty input and k larger than the number of failures, and states O(n) time and O(1) space."
  good: "Correct sliding-window solution reached with small prompting, or a prefix-count plus binary-search approach in O(n log n) with clear reasoning."
  weak: "Tries every start and end in O(n^2) or worse, flips zeros greedily from the left without a window, or fails when k is zero or exceeds the number of failures."
  criteria:
    correctness: "All tests pass, including k = 0, all failures and k larger than the failure count."
    efficiency: "Each probe enters and leaves the window at most once; O(n) overall."
    code_quality: "The window invariant (at most k failures) is obvious from names and structure."
    edge_cases: "Empty list, a single probe, all ones and all zeros."
    communication: "Explains why moving the left pointer forward never discards a better stretch."
hints:
  - "Instead of deciding which failures to forgive, ask what makes a contiguous stretch acceptable in the first place."
  - "A stretch works exactly when it holds at most k failed probes; keep a window over the probes and track how many failures it currently contains."
  - "Advance a right pointer over every probe and count the failures it brings in; whenever that count rises above k, move the left pointer forward, decreasing the count when a failure leaves, and after each step record the window length as a candidate for the maximum."
followups:
  - "How would you also return where the best stretch starts?"
  - "How would you answer the question for many different values of k on the same data?"
  - "How would you maintain the answer while new probes keep streaming in?"
common_errors:
  - "Resetting the window at every failure, which ignores that up to k failures may be forgiven."
  - "Shrinking by only one probe when the count exceeds k, although several successful probes may have to leave before a failure does, or forgetting to decrease the count when a failure leaves."
  - "Returning the number of forgiven failures or the count of ones instead of the stretch length."
  - "Not handling k greater than the number of failures, or the empty list."
