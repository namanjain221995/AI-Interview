title: Triangle Frames From Rods
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Triangle Frames From Rods

  A fabrication workshop welds triangular support frames from metal rods. `lengths[i]` is the length
  of rod `i`. A frame uses three **different** rods (three different positions), and it can only be
  welded when the rods enclose a real area: if the three lengths in increasing order are
  `x <= y <= z`, the frame works only when `x + y > z`. A rod of length `0` can therefore never be part
  of a frame.

  Return how many choices of three rods can form a frame. Choices that use different positions count
  separately, even when the lengths are the same.

  ### Example 1
  ```
  Input:  lengths = [3, 4, 5, 6]
  Output: 4
  Explanation: All four choices work, for example 3 + 4 > 6 and 4 + 5 > 6.
  ```

  ### Example 2
  ```
  Input:  lengths = [1, 2, 3, 10]
  Output: 0
  Explanation: 1 + 2 is not greater than 3 (the frame would be flat), and 10 is too long for any pair.
  ```

  ### Constraints
  - `0 <= lengths.length <= 1000`
  - `0 <= lengths[i] <= 1000`

  **Follow-up:** Checking every triple is `O(n^3)`. Can you count the frames in `O(n^2)` time after sorting?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: count_triangle_frames
  params:
    - {name: lengths, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def count_triangle_frames(lengths: list[int]) -> int:
        rods = sorted(lengths)
        count = 0
        for longest in range(len(rods) - 1, 1, -1):
            lo, hi = 0, longest - 1
            while lo < hi:
                if rods[lo] + rods[hi] > rods[longest]:
                    count += hi - lo
                    hi -= 1
                else:
                    lo += 1
        return count
  javascript: |
    function countTriangleFrames(lengths) {
      const rods = [...lengths].sort((a, b) => a - b);
      let count = 0;
      for (let longest = rods.length - 1; longest >= 2; longest--) {
        let lo = 0;
        let hi = longest - 1;
        while (lo < hi) {
          if (rods[lo] + rods[hi] > rods[longest]) {
            count += hi - lo;
            hi--;
          } else {
            lo++;
          }
        }
      }
      return count;
    }
