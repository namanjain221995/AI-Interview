expected_concepts:
- sorting so only one triangle inequality needs checking
- fixing the longest rod and counting pairs with two pointers
- counting a block of valid pairs at once (hi - lo)
- O(n^2) time after an O(n log n) sort
optimal_complexity:
  time: O(n^2)
  space: O(1) extra besides sorting
rubric:
  excellent: Explains why sorting reduces the check to one inequality, fixes the longest rod, counts whole blocks
    of pairs with converging pointers and states O(n^2) time.
  good: Correct sorted solution using binary search per pair (O(n^2 log n)) or the two-pointer version after a small
    fix.
  weak: Checks all triples with three loops, uses a non-strict inequality, or forgets that rods are counted by position.
  criteria:
    correctness: All tests pass, including degenerate triples, zero lengths and duplicates.
    efficiency: Quadratic time after sorting with constant extra memory.
    code_quality: Descriptive names for the longest rod and the pair pointers, with the counting step easy to follow.
    edge_cases: Fewer than three rods, zero-length rods and sums exactly equal to the longest rod.
    communication: Justifies why moving the high pointer after counting does not miss any frames.
hints:
- If the three lengths are sorted, only one of the three triangle inequalities can fail; which one?
- Sort the rods and fix the longest rod of the frame; now you need to count pairs of shorter rods whose lengths
  add up to more than it.
- With the longest rod fixed, start a low index at the shortest rod and a high index just below the longest; when
  the low and high rods together exceed the longest, every rod between low and high also works with high, so add
  that whole block and move high down, otherwise move low up.
followups:
- Why does fixing the longest rod make the two-pointer step work, while fixing the shortest rod does not?
- How would you return the frame with the largest perimeter instead of a count?
- How would the approach change if lengths could be fractional?
- Can the count overflow a 32-bit integer for larger inputs, and what would you do about it?
common_errors:
- Using greater-than-or-equal, which counts flat frames with zero area.
- Fixing the shortest rod and trying to move both pointers, which misses valid triples.
- Removing duplicate lengths, which undercounts frames that use different rods of the same length.
- Checking all three inequalities on unsorted triples in an O(n^3) loop.
