expected_concepts:
  - "fixed-size sliding window"
  - "hash map of counts per user id"
  - "removing keys whose count drops to zero"
  - "distinct count equals the number of keys"
optimal_complexity: {time: "O(n)", space: "O(k)"}
rubric:
  excellent: "Maintains a count map for the current window, adds the entering minute, decrements the leaving one and deletes zero counts, reads the distinct count as the map size and states O(n) time and O(k) space."
  good: "Correct count-map solution that tracks the distinct count with a separate counter or needs a small fix after testing."
  weak: "Rebuilds a set for every window in O(n k), uses a set without counts (so a leaving user still in the window is wrongly removed), or returns the wrong number of entries."
  criteria:
    correctness: "All tests pass, including repeated users that leave while still present in the window."
    efficiency: "Each minute is added and removed once; O(n) overall."
    code_quality: "Clear separation between entering and leaving updates; no leftover zero-count keys."
    edge_cases: "k = 1, k = n, one user throughout and all distinct users."
    communication: "Explains why a plain set is not enough and counts are needed."
hints:
  - "When the window moves by one minute, only one user enters and one user leaves; can you update the answer instead of recounting?"
  - "A set alone cannot tell whether the user who just left still appears elsewhere in the window; keep how many times each user occurs in the window."
  - "Keep a map from user id to its count in the current window; add one for the entering minute, subtract one for the leaving minute and remove the key when its count reaches zero, then the number of keys is the distinct count to record once the window has reached k minutes."
followups:
  - "How would you handle a window defined by time when some minutes have no activity?"
  - "If the number of distinct users were huge, how could you approximate the count with bounded memory?"
  - "How would you return, per window, the user who appears most often?"
common_errors:
  - "Removing a user from a set when they leave even though they still appear later in the window."
  - "Leaving keys with a zero count in the map so the size overcounts."
  - "Producing n or n - k results instead of n - k + 1."
