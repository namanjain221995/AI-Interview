title: Distinct Users per Window
difficulty: easy
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, data_analyst, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Distinct Users per Window

  An analytics job records, for every minute of a session log, the id of the user who was active in that
  minute: `user_ids[i]` is the user for minute `i`. The product team wants a rolling "unique users"
  metric over a window of `k` minutes.

  Return an array of length `n - k + 1` (where `n` is the length of `user_ids`) whose entry `i` is the
  number of **distinct** user ids among minutes `i` to `i + k - 1` inclusive, in order of `i`.

  ### Example 1
  ```
  Input:  user_ids = [4, 7, 4, 2, 7, 7], k = 3
  Output: [2, 3, 3, 2]
  Explanation: windows [4, 7, 4], [7, 4, 2], [4, 2, 7] and [2, 7, 7] contain 2, 3, 3 and 2 distinct users
  ```

  ### Example 2
  ```
  Input:  user_ids = [5, 5, 5], k = 1
  Output: [1, 1, 1]
  Explanation: every one-minute window has exactly one user
  ```

  ### Constraints
  - `1 <= k <= user_ids.length <= 10^5`
  - `1 <= user_ids[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: distinct_per_window
  params:
    - {name: user_ids, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def distinct_per_window(user_ids: list[int], k: int) -> list[int]:
        counts: dict[int, int] = {}
        result: list[int] = []
        for i, user in enumerate(user_ids):
            counts[user] = counts.get(user, 0) + 1
            if i >= k:
                leaving = user_ids[i - k]
                counts[leaving] -= 1
                if counts[leaving] == 0:
                    del counts[leaving]
            if i >= k - 1:
                result.append(len(counts))
        return result
  javascript: |
    function distinctPerWindow(userIds, k) {
      const counts = new Map();
      const result = [];
      for (let i = 0; i < userIds.length; i++) {
        counts.set(userIds[i], (counts.get(userIds[i]) || 0) + 1);
        if (i >= k) {
          const leaving = userIds[i - k];
          const left = counts.get(leaving) - 1;
          if (left === 0) counts.delete(leaving);
          else counts.set(leaving, left);
        }
        if (i >= k - 1) result.push(counts.size);
      }
      return result;
    }
