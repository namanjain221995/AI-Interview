expected_concepts:
  - "variable-size sliding window with two pointers"
  - "an optimal interval can start at an event timestamp"
  - "inclusive interval boundary"
  - "64-bit timestamps"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Argues that an optimal interval can start at some event, uses a two-pointer window that shrinks while the span exceeds d, handles inclusive ends and 64-bit values, and states O(n) time and O(1) space."
  good: "Correct sliding window or a binary-search-per-event O(n log n) solution with clear reasoning."
  weak: "Checks every pair of events in O(n^2) without improving, uses an exclusive boundary, or overflows on large timestamps."
  criteria:
    correctness: "All tests pass, including duplicates, d = 0 and inclusive boundaries."
    efficiency: "Each pointer only moves forward, so the scan is linear."
    code_quality: "Window invariant is clear from the code and named variables."
    edge_cases: "Empty log, single event, huge span and timestamps beyond 32 bits."
    communication: "Explains why moving the left pointer forward is safe and never skips a better window."
hints:
  - "Where could the best interval start? Consider sliding it until its left edge touches an event."
  - "Because timestamps are sorted, keep a window of consecutive events and widen it to the right; when its first and last events are more than d apart, shrink it from the left."
  - "Move a right pointer over every event; while the timestamp at the right minus the timestamp at the left exceeds d, advance the left pointer; after that the window size is a candidate, and the largest candidate over the scan is the answer, with an empty log giving zero."
followups:
  - "How would you answer the same question for many different values of d?"
  - "What changes if the timestamps arrive unsorted?"
  - "How would you report the start time of the busiest interval as well?"
  - "How would you do this over a live stream while keeping memory bounded?"
common_errors:
  - "Using a strict comparison so events exactly d seconds apart are not counted together."
  - "Resetting the left pointer for every right pointer, which makes the scan quadratic."
  - "Storing timestamps in 32-bit integers in a typed language."
  - "Returning a window length in seconds instead of an event count."
