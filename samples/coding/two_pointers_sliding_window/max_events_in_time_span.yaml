prompt_markdown: |
  ## Busiest Time Span in a Log

  An alerting service wants to know how bursty a log is. You are given the event `timestamps` (in
  seconds) of one log, already sorted in **non-decreasing** order (several events may share the same
  second), and a span length `d`.

  Return the **maximum number of events** that fit inside a single closed time interval `[t, t + d]`
  for some start time `t`. Both ends are inclusive, so with `d = 0` the answer is the largest number of
  events that share one timestamp. An empty log returns `0`.

  ### Example 1
  ```
  Input:  timestamps = [10, 12, 15, 21, 22, 30], d = 5
  Output: 3
  Explanation: the interval [10, 15] contains 10, 12 and 15; no interval of length 5 contains four events
  ```

  ### Example 2
  ```
  Input:  timestamps = [100, 100, 100, 250], d = 0
  Output: 3
  Explanation: three events happen at second 100
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= timestamps[i] <= 10^13`, and `timestamps[i] <= timestamps[i + 1]`
  - `0 <= d <= 10^13`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: busiest_span
  params:
    - {name: timestamps, type: "long[]"}
    - {name: d, type: "long"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def busiest_span(timestamps: list[int], d: int) -> int:
        best = 0
        left = 0
        for right, stamp in enumerate(timestamps):
            while stamp - timestamps[left] > d:
                left += 1
            best = max(best, right - left + 1)
        return best
  javascript: |
    function busiestSpan(timestamps, d) {
      let best = 0;
      let left = 0;
      for (let right = 0; right < timestamps.length; right++) {
        while (timestamps[right] - timestamps[left] > d) left++;
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
