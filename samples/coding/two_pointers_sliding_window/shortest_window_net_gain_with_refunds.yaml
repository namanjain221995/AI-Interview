expected_concepts:
  - "prefix sums turn a range sum into a difference of two prefixes"
  - "monotonic deque of candidate start prefixes with increasing values"
  - "popping from the front once a start has been used (it can never give a shorter answer later)"
  - "popping from the back when a newer prefix is not larger (an older, larger prefix is never a better start)"
  - "64-bit prefix sums"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Explains why a two-pointer window fails with negative values, builds prefix sums in 64-bit, maintains an increasing monotonic deque of start indices with both pruning rules justified, returns -1 correctly and states O(n) time and space."
  good: "Reaches a correct prefix-sum solution, possibly O(n log n) with a sorted structure or binary search, or the deque solution with a partially explained invariant."
  weak: "Uses a plain sliding window that breaks on negative days, checks every pair in O(n^2) without improving, or overflows 32-bit sums."
  criteria:
    correctness: "All tests pass, including all-negative input, unreachable goals and large magnitudes."
    efficiency: "Each prefix index enters and leaves the deque at most once, so the scan is linear."
    code_quality: "Prefix array and deque are clearly named and the two pruning loops are easy to follow."
    edge_cases: "Single day, all negative days, zero days and sums beyond 32 bits."
    communication: "Justifies both pruning rules of the deque with a short argument."
hints:
  - "Write the sum of any stretch as the difference of two prefix sums. What are you looking for in terms of those prefix sums?"
  - "For each end prefix you want the closest earlier prefix that is small enough. An earlier prefix that is greater than or equal to a later one can never be a better start, so keep candidate starts in a queue with increasing prefix values."
  - "Sweep the prefix sums in order: while the current prefix minus the prefix at the front of the queue reaches the goal, record the length and drop the front because it cannot do better later; then drop from the back every prefix that is at least the current one and append the current index; report -1 if nothing was recorded."
followups:
  - "Why can a used start be removed from the front for good?"
  - "How would you solve it in O(n log n) with prefix sums and binary search instead?"
  - "What simpler approach works if refunds never exceed sales on any day?"
  - "How would you return the start and end day of the stretch as well?"
common_errors:
  - "Using the two-pointer window from the all-positive version, which misses answers after negative days."
  - "Storing prefix sums in 32-bit integers."
  - "Forgetting the empty prefix (index 0), which loses stretches that start on the first day."
  - "Returning 0 instead of -1 when no stretch reaches the goal."
