role_tags: [data_analyst, backend, data]
time_limit_minutes: 35
prompt_markdown: |
  ## Shortest Net-Gain Window With Refunds

  A finance analytics team tracks a store's daily **net revenue**: `net[i]` is the sales of day `i` minus the
  refunds issued that day, so it can be negative when refunds outweigh sales. For a promotion review they
  want the shortest run of consecutive days whose combined net revenue reached a `goal`.

  Write `shortest_net_gain_window(net, goal)` that returns the **length** of the shortest non-empty contiguous
  stretch of days whose sum is **at least** `goal`. If no such stretch exists, return `-1`.

  Because values can be negative, extending a stretch does not always increase its sum, so the usual
  "grow until large enough, then shrink" window is not enough on its own.

  ### Example 1
  ```
  Input:  net = [4, -1, 2, -6, 5, 3], goal = 8
  Output: 2
  Explanation: days 4 and 5 give 5 + 3 = 8
  ```

  ### Example 2
  ```
  Input:  net = [3, -1, 2], goal = 4
  Output: 3
  Explanation: only all three days together reach 3 - 1 + 2 = 4
  ```

  ### Example 3
  ```
  Input:  net = [1, 2], goal = 4
  Output: -1
  Explanation: the largest possible sum is 3
  ```

  ### Constraints
  - `1 <= net.length <= 10^5`
  - `-10^9 <= net[i] <= 10^9`
  - `1 <= goal <= 10^9`
  - Sums of many days can exceed the 32-bit integer range.

  **Follow-up:** aim for `O(n)` time.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: shortest_net_gain_window
  params:
    - {name: net, type: "int[]"}
    - {name: goal, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def shortest_net_gain_window(net: list[int], goal: int) -> int:
        n = len(net)
        prefix = [0] * (n + 1)
        for i, value in enumerate(net):
            prefix[i + 1] = prefix[i] + value
        best = n + 1
        candidates: deque[int] = deque()  # prefix indices with increasing prefix sums
        for end in range(n + 1):
            while candidates and prefix[end] - prefix[candidates[0]] >= goal:
                best = min(best, end - candidates.popleft())
            while candidates and prefix[candidates[-1]] >= prefix[end]:
                candidates.pop()
            candidates.append(end)
        return best if best <= n else -1
  javascript: |
    function shortestNetGainWindow(net, goal) {
      const n = net.length;
      const prefix = new Array(n + 1).fill(0);
      for (let i = 0; i < n; i++) prefix[i + 1] = prefix[i] + net[i];
      let best = n + 1;
      const queue = new Array(n + 1);
      let head = 0;
      let tail = 0;
      for (let end = 0; end <= n; end++) {
        while (head < tail && prefix[end] - prefix[queue[head]] >= goal) {
          best = Math.min(best, end - queue[head]);
          head++;
        }
        while (head < tail && prefix[queue[tail - 1]] >= prefix[end]) tail--;
        queue[tail++] = end;
      }
      return best <= n ? best : -1;
    }
