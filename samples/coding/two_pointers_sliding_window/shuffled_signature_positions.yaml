version: 1
slug: shuffled_signature_positions
title: Shuffled Signature Positions
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [security, backend, network]
time_limit_minutes: 20
prompt_markdown: |
  ## Shuffled Signature Positions

  An intrusion-detection rule looks for a known attack `signature` inside a network `payload`.
  Attackers shuffle the characters of the signature to dodge exact matching, so the rule flags every
  window of the payload that contains **exactly the same characters as the signature, with the same
  counts, in any order**.

  Every window has length `signature.length`. Return the start indices of all flagged windows in
  **ascending order**. Windows may overlap. Return an empty list if nothing matches, including when the
  signature is longer than the payload.

  ### Example 1
  ```
  Input:  payload = "xdropdorpqrodp", signature = "drop"
  Output: [1, 2, 4, 5, 10]
  Explanation: The windows "drop", "ropd", "pdor", "dorp" and "rodp" are rearrangements of "drop".
  ```

  ### Example 2
  ```
  Input:  payload = "aaaa", signature = "aa"
  Output: [0, 1, 2]
  Explanation: Flagged windows may overlap.
  ```

  ### Example 3
  ```
  Input:  payload = "abc", signature = "abcd"
  Output: []
  Explanation: The signature is longer than the payload.
  ```

  ### Constraints
  - `1 <= payload.length <= 10^5`
  - `1 <= signature.length <= 10^5`
  - `payload` and `signature` contain only lowercase English letters.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: signature_positions
  params:
    - {name: payload, type: "string"}
    - {name: signature, type: "string"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def signature_positions(payload: str, signature: str) -> list[int]:
        k, n = len(signature), len(payload)
        if k > n:
            return []
        need = [0] * 26
        have = [0] * 26
        for ch in signature:
            need[ord(ch) - 97] += 1
        result = []
        for i, ch in enumerate(payload):
            have[ord(ch) - 97] += 1
            if i >= k:
                have[ord(payload[i - k]) - 97] -= 1
            if i >= k - 1 and have == need:
                result.append(i - k + 1)
        return result
  javascript: |
    function signaturePositions(payload, signature) {
      const k = signature.length;
      const n = payload.length;
      if (k > n) return [];
      // diff[c] = count in signature minus count in the window; track how many letters differ.
      const diff = new Array(26).fill(0);
      for (let i = 0; i < k; i++) diff[signature.charCodeAt(i) - 97]++;
      let mismatched = diff.filter((c) => c !== 0).length;
      const bump = (code, delta) => {
        const before = diff[code];
        diff[code] += delta;
        if (before === 0 && diff[code] !== 0) mismatched++;
        else if (before !== 0 && diff[code] === 0) mismatched--;
      };
      const result = [];
      for (let i = 0; i < n; i++) {
        bump(payload.charCodeAt(i) - 97, -1);
        if (i >= k) bump(payload.charCodeAt(i - k) - 97, 1);
        if (i >= k - 1 && mismatched === 0) result.push(i - k + 1);
      }
      return result;
    }
tests:
