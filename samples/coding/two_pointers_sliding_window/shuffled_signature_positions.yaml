  - {id: t10, hidden: true, args: ["abcdeabcdz", "zabcd"], expected: [5], description: Only the final window matches}
  - {id: t11, hidden: true, args: ["", "dcba"], expected: [6, 7, 8, 21, 27, 56, 83, 95, 130, 136, 141, 142, 159, 162, 180, 240, 245, 264, 268, 282, 283, 301, 305, 311, 324, 329, 338, 374, 375, 377, 378, 390, 394, 395, 396, 418, 434, 461, 477, 478, 483, 518, 567, 571, 587, 588, 600, 634, 650, 665, 685, 699, 701, 706, 791, 798, 799, 802, 831, 861, 862, 873, 877, 906, 916, 917, 927, 976, 977, 987], description: "Stress: 1000-character payload over four letters"}
expected_concepts:
  - fixed-size sliding window
  - letter frequency counts (array of 26 or hash map)
  - incremental update when the window slides by one
  - tracking the number of mismatched letters for O(1) comparison
optimal_complexity: {time: O(n + m), space: O(1)}
rubric:
  excellent: "Slides a fixed window with incremental letter counts, compares in constant time (26 counters or a mismatch counter), and explains O(n + m) time with O(1) alphabet-sized memory."
  good: "Correct sliding window that recompares two count maps each step (O(26 n)), or needs a nudge to avoid re-counting each window."
  weak: "Sorts every window or generates permutations of the signature, or misses overlapping matches."
  criteria:
    correctness: "All tests pass, including repeated letters and overlapping matches."
    efficiency: Each payload character enters and leaves the window once; no per-window sorting.
    code_quality: "Window bounds are clear, and adding and removing characters are symmetric."
    edge_cases: "Signature longer than payload, single-letter signatures, equal lengths and no matches."
    communication: Explains why only the entering and leaving characters change the counts.
hints:
  - Two strings are rearrangements of each other exactly when every letter appears the same number of times in both.
  - "All candidate windows have the same length, so when the window moves one step only one character enters and one leaves; keep letter counts for the window instead of recounting it."
  - "Count the signature letters once, then slide a window of the same length over the payload, adding the entering letter and removing the leaving one; whenever the window counts equal the signature counts (or a running number of mismatched letters reaches zero), record the window's start index."
followups:
  - "How would you avoid comparing all 26 counters on every step?"
  - "What changes if the payload may contain any byte value instead of lowercase letters?"
  - "How would you scan for many different signatures at once?"
common_errors:
  - "Sorting each window, which costs O(n m log m)."
  - Forgetting to remove the character that leaves the window.
  - Recording the end index of the window instead of its start.
  - Not handling a signature longer than the payload.
