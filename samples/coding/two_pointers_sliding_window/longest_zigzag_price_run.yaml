expected_concepts:
  - "single pass comparing each tick with the previous one"
  - "tracking the sign of the previous change"
  - "restarting the run on equal neighbours or repeated direction"
  - "O(n) time and O(1) space"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Scans once tracking the direction of the last change, extends the run only when the new direction is the opposite non-zero direction, restarts at 2 on a repeated direction and at 1 on an equal pair, covers empty and single-tick input, and states O(n) time and O(1) space."
  good: "Correct single pass or a two-pointer window with minor slips on the restart length fixed after testing."
  weak: "Checks every segment for alternation in O(n^2) or worse, treats equal ticks as continuing the run, or always restarts at length 1."
  criteria:
    correctness: "All tests pass, including equal neighbours, monotonic input and empty input."
    efficiency: "One pass with constant extra memory."
    code_quality: "Direction is computed once per step and the restart rules are easy to read."
    edge_cases: "Empty list, one tick, two ticks and extreme values."
    communication: "Explains why a repeated direction restarts at length 2 and an equal pair at length 1."
hints:
  - "Describe each step between neighbouring ticks as up, down or flat; what pattern does a valid run follow?"
  - "Walk the ticks once and remember the direction of the previous step and the length of the current run; decide on each step whether the run grows or restarts."
  - "For each new tick compute the direction of the change; if it is flat the run restarts at length 1, if it is the opposite of the previous non-flat direction the run grows by one, and otherwise the run restarts at length 2 because the last two ticks still form a valid pair; keep the maximum, returning zero for an empty list."
followups:
  - "How would you return the start and end index of the longest run?"
  - "What changes if small moves below a threshold should be treated as flat?"
  - "How would you find the longest alternating subsequence that does not need to be contiguous?"
common_errors:
  - "Restarting at length 1 instead of 2 when the direction repeats."
  - "Treating equal neighbours as either an up or a down move."
  - "Returning 1 for an empty list or 0 for a single tick."
  - "Overflowing when subtracting extreme prices in a 32-bit language instead of comparing directly."
