prompt_markdown: |
  ## Longest Zigzag Price Run

  A market-data service stores the price ticks of one instrument in order: `prices[i]` is tick `i`. An
  analyst is looking for choppy periods, where the price keeps changing direction on every tick.

  Return the length (number of ticks) of the longest **contiguous** run in which the comparisons
  between consecutive ticks **strictly alternate** between up and down: up, down, up, ... or down, up,
  down, ... A run may start in either direction. Two equal neighbouring ticks break a run, a single
  tick is a run of length `1`, and an empty list returns `0`.

  ### Example 1
  ```
  Input:  prices = [3, 5, 2, 6, 6, 4, 7, 1, 8]
  Output: 5
  Explanation: ticks 4 to 8 (6, 4, 7, 1, 8) go down, up, down, up; the equal pair 6, 6 ends the earlier run of 4
  ```

  ### Example 2
  ```
  Input:  prices = [7, 7, 7]
  Output: 1
  Explanation: every neighbouring pair is equal, so each run is a single tick
  ```

  ### Constraints
  - `0 <= prices.length <= 10^5`
  - `-10^9 <= prices[i] <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_zigzag
  params:
    - {name: prices, type: "int[]"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_zigzag(prices: list[int]) -> int:
        if not prices:
            return 0
        best = 1
        run = 1
        prev_dir = 0
        for i in range(1, len(prices)):
            if prices[i] > prices[i - 1]:
                direction = 1
            elif prices[i] < prices[i - 1]:
                direction = -1
            else:
                direction = 0
            if direction == 0:
                run = 1
            elif direction == -prev_dir:
                run += 1
            else:
                run = 2
            prev_dir = direction
            best = max(best, run)
        return best
  javascript: |
    function longestZigzag(prices) {
      if (prices.length === 0) return 0;
      let best = 1;
      let run = 1;
      let prevDir = 0;
      for (let i = 1; i < prices.length; i++) {
        const direction = Math.sign(prices[i] - prices[i - 1]);
        if (direction === 0) run = 1;
        else if (direction === -prevDir) run++;
        else run = 2;
        prevDir = direction;
        best = Math.max(best, run);
      }
      return best;
    }
