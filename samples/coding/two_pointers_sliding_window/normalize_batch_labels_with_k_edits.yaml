version: 1
slug: normalize_batch_labels_with_k_edits
title: Uniform Label Block After Edits
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [data, ml, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Uniform Label Block After Edits

  A labelling pipeline stores the class label of every row in a training batch as one uppercase letter,
  so the whole batch is a string `labels` where `labels[i]` is the label of row `i`. Before a
  consistency check, a reviewer may **relabel at most `k` rows**, changing each chosen row to any
  uppercase letter.

  Return the length of the longest **contiguous** block of rows that can be made to share the **same
  label** using at most `k` relabels in total. Relabels outside the block do not help, and you do not
  have to use all `k`. An empty batch returns `0`.

  ### Example 1
  ```
  Input:  labels = "CCDCDDDC", k = 2
  Output: 6
  Explanation: rows 1 to 6 hold four D and two C labels; relabelling the two C rows gives six D rows in a row
  ```

  ### Example 2
  ```
  Input:  labels = "XYZ", k = 0
  Output: 1
  Explanation: without relabels every block of equal labels has length 1
  ```

  ### Constraints
  - `0 <= labels.length <= 10^5`
  - `labels` contains only uppercase English letters `A`-`Z`
  - `0 <= k <= 10^5`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: longest_uniform_after_edits
  params:
    - {name: labels, type: "string"}
    - {name: k, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def longest_uniform_after_edits(labels: str, k: int) -> int:
        counts = [0] * 26
        top = 0
        left = 0
        best = 0
        for right, ch in enumerate(labels):
            idx = ord(ch) - 65
            counts[idx] += 1
            top = max(top, counts[idx])
            while (right - left + 1) - top > k:
                counts[ord(labels[left]) - 65] -= 1
                left += 1
            best = max(best, right - left + 1)
        return best
  javascript: |
    function longestUniformAfterEdits(labels, k) {
      const counts = new Array(26).fill(0);
      let top = 0;
      let left = 0;
      let best = 0;
      for (let right = 0; right < labels.length; right++) {
        const idx = labels.charCodeAt(right) - 65;
        counts[idx]++;
        top = Math.max(top, counts[idx]);
        while (right - left + 1 - top > k) {
          counts[labels.charCodeAt(left) - 65]--;
          left++;
        }
        best = Math.max(best, right - left + 1);
      }
      return best;
    }
tests:
  - {id: t1, args: ["CCDCDDDC", 2], expected: 6, description: "Example 1"}
  - {id: t2, args: ["XYZ", 0], expected: 1, description: "Example 2 - no edits allowed"}
  - {id: t3, hidden: true, args: ["", 3], expected: 0, description: "Empty batch returns 0"}
  - {id: t4, hidden: true, args: ["Q", 0], expected: 1, description: "Single row"}
  - {id: t5, hidden: true, args: ["MMMMMM", 0], expected: 6, description: "Already uniform - whole batch"}
  - {id: t6, hidden: true, args: ["ABCDE", 10], expected: 5, description: "k larger than the batch length - whole batch"}
  - {id: t7, hidden: true, args: ["AABBBAACCCCBA", 0], expected: 4, description: "k = 0 reduces to the longest run of identical labels"}
  - {id: t8, hidden: true, args: ["ABABBACCCBBB", 2], expected: 5, description: "Majority label changes as the window slides; best block uses B"}
  - {id: t9, hidden: true, args: ["ZYXWVUTSRQ", 3], expected: 4, description: "All labels distinct - answer is k + 1"}
  - {id: t10, hidden: true, args: ["", 4], expected: 18, description: "1000 rows over four labels with skewed frequencies, k = 4 (stress, needs a linear window)"}
expected_concepts:
  - "sliding window where cost equals window length minus the most frequent label count"
  - "fixed-size count array for 26 letters"
  - "the stale maximum frequency never makes the answer wrong because the best length only grows with a higher maximum"
  - "O(n) time and O(1) extra space"
optimal_complexity: {time: "O(n)", space: "O(1)"}
rubric:
  excellent: "Identifies that a block needs (length minus count of its most common label) relabels, maintains letter counts in a window shrinking while that exceeds k, explains why the maximum frequency need not be recomputed on shrink (or recomputes over 26 letters), and states O(n) time and O(1) space."
  good: "Correct window solution that recomputes the maximum over 26 letters each step, or a per-letter window (26 passes) with correct complexity discussion."
  weak: "Tries every block in O(n^2) or worse, only considers turning rows into one fixed letter, or miscounts the relabels needed."
  criteria:
    correctness: "All tests pass, including k = 0, k above the batch length and all-distinct labels."
    efficiency: "Linear time (or 26 times linear) with constant extra memory."
    code_quality: "Window condition is expressed clearly in terms of length, top count and k."
    edge_cases: "Empty batch, single row, already uniform batch and k larger than n."
    communication: "Justifies why keeping the most common label and relabelling the rest is optimal for a block."
hints:
  - "For a fixed block, which label should it end up with to need the fewest relabels?"
  - "A block can be made uniform when its length minus the count of its most common label is at most k; keep letter counts for a sliding block so you can test that quickly."
  - "Grow the block one row at a time, updating that letter's count and the largest count seen; while the block length minus that largest count exceeds k, drop the leftmost row from the counts and move the left edge; the block length after each step is a candidate, and the largest count does not need to shrink because only a higher maximum could produce a longer answer."
followups:
  - "Why is it safe not to decrease the remembered maximum frequency when the window shrinks?"
  - "How would you report which label the best block ends up with?"
  - "What changes if each relabel has a different cost depending on the row?"
common_errors:
  - "Counting relabels as the number of rows that differ from the first row of the block instead of from its most common label."
  - "Restarting the window from scratch after every failure, which makes the scan quadratic."
  - "Recomputing the maximum frequency by scanning the whole block each time."
  - "Returning more than the batch length when k exceeds n."
