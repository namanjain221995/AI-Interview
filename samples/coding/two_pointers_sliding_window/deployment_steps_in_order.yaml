version: 1
slug: deployment_steps_in_order
title: "Deployment Steps in Order"
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [devops, platform, qa, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Deployment Steps in Order

  A compliance check reviews each production deployment. The runbook lists the `required` step names in
  the order they must happen. The pipeline's audit `log` lists the names of every step that actually ran,
  in execution order, including many steps the runbook does not care about.

  Write `steps_in_order(required, log)` that returns `true` if the required steps appear in the log in the
  given order, and `false` otherwise:

  - Other log entries may appear before, between and after the required steps; required steps do not have
    to be adjacent.
  - Each log entry can satisfy at most one required step, so a step listed twice in `required` must run
    twice.
  - Step names are compared exactly (case-sensitive).
  - An empty `required` list is always satisfied.

  ### Example 1
  ```
  Input:  required = ["build", "test", "deploy"], log = ["checkout", "build", "lint", "test", "approve", "deploy"]
  Output: true
  ```

  ### Example 2
  ```
  Input:  required = ["migrate", "deploy"], log = ["deploy", "migrate"]
  Output: false
  ```

  ### Constraints
  - `0 <= required.length, log.length <= 10^4`
  - `1 <= name.length <= 40` for every step name
  - Step names consist of lowercase or uppercase letters, digits, `-` and `_`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: steps_in_order
  params:
    - {name: required, type: "string[]"}
    - {name: log, type: "string[]"}
  return_type: "bool"
  comparison: exact
reference_solutions:
  python: |
    def steps_in_order(required: list[str], log: list[str]) -> bool:
        matched = 0
        for entry in log:
            if matched == len(required):
                break
            if entry == required[matched]:
                matched += 1
        return matched == len(required)
  javascript: |
    function stepsInOrder(required, log) {
      let matched = 0;
      for (const entry of log) {
        if (matched === required.length) break;
        if (entry === required[matched]) matched++;
      }
      return matched === required.length;
    }
tests:
  - {id: t1, args: [["build", "test", "deploy"], ["checkout", "build", "lint", "test", "approve", "deploy"]], expected: true, description: "Example 1 - required steps interleaved with other steps"}
  - {id: t2, args: [["migrate", "deploy"], ["deploy", "migrate"]], expected: false, description: "Example 2 - both steps ran but in the wrong order"}
  - {id: t3, hidden: true, args: [[], []], expected: true, description: "Both lists empty"}
  - {id: t4, hidden: true, args: [[], ["build", "deploy"]], expected: true, description: "Empty required list is always satisfied"}
  - {id: t5, hidden: true, args: [["build"], []], expected: false, description: "Required step but empty log"}
  - {id: t6, hidden: true, args: [["deploy", "deploy"], ["build", "deploy", "smoke"]], expected: false, description: "Required step listed twice but ran once"}
  - {id: t7, hidden: true, args: [["deploy", "deploy"], ["deploy", "smoke", "deploy"]], expected: true, description: "Required step listed twice and ran twice"}
  - {id: t8, hidden: true, args: [["Build", "deploy"], ["build", "deploy"]], expected: false, description: "Case-sensitive comparison"}
