expected_concepts:
  - "subsequence check with one pointer into the required list"
  - "greedy matching of the earliest possible log entry"
  - "single pass over the log"
  - "O(n + m) time and O(1) extra space"
optimal_complexity: {time: "O(n + m)", space: "O(1)"}
rubric:
  excellent: "Recognises a subsequence check, walks the log once with a pointer into the required list, argues why greedy earliest matching is safe, handles empty lists and repeated steps, and states O(n + m) time."
  good: "Implements the pointer-based check correctly with minor prompting or uses index searches that still respect order, and explains the complexity."
  weak: "Checks only membership (ignoring order), requires the steps to be adjacent, reuses one log entry for repeated steps, or fails on empty lists."
  criteria:
    correctness: "Order respected, each log entry used at most once, repeated required steps handled."
    efficiency: "Single linear scan of the log."
    code_quality: "One loop with a clear matched counter and an early exit."
    edge_cases: "Empty required list, empty log, repeated steps and case differences."
    communication: "Explains why matching the earliest possible log entry never hurts."
hints:
  - "You only ever need to look for one required step at a time: the next one that has not been seen yet."
  - "Walk the log from the start and keep a position in the required list that moves forward whenever the current log entry is the step you are waiting for."
  - "Scan every log entry; if it equals the required step at your current position, advance the position by one; at the end, report whether the position reached the length of the required list, which is immediately true when that list is empty."
followups:
  - "How would you report the first required step that is missing or out of order?"
  - "If you had to check many runbooks against the same very long log, how would you preprocess the log?"
  - "What if some required steps may run in any order relative to each other?"
common_errors:
  - "Checking only that every required step appears somewhere in the log."
  - "Requiring the required steps to be contiguous in the log."
  - "Using a set, which ignores repeated required steps."
  - "Indexing past the end of the required list after all steps are matched."
