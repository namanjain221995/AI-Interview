prompt_markdown: |
  ## Three Ad Slots With Maximum Reach

  A streaming platform sells a sponsor exactly **three** ad slots for tomorrow. Each slot runs for exactly
  `k` consecutive hours, and slots may not overlap (one may start right where the previous one ends).
  From historical data, `audience[i]` is the expected number of viewers during hour `i`, and the reach of a
  slot is the sum of the audience over its `k` hours.

  Write `best_three_slots(audience, k)` that returns the **start hours of the three slots**, in ascending
  order, that maximise the total reach of all three.

  - If several choices give the same maximum total, return the **lexicographically smallest** list of start
    hours (smallest first start, then smallest second start, then smallest third start).
  - It is guaranteed that `3 * k <= audience.length`, so an answer always exists.

  ### Example 1
  ```
  Input:  audience = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3], k = 2
  Output: [1, 4, 7]
  Explanation: slots at hours 1, 4 and 7 reach 5 + 14 + 11 = 30; starting the first slot at hour 2 also reaches 30, but [1, 4, 7] is smaller
  ```

  ### Example 2
  ```
  Input:  audience = [5, 5, 5, 5, 5, 5, 5], k = 2
  Output: [0, 2, 4]
  Explanation: every choice reaches 30, and [0, 2, 4] is the smallest list
  ```

  ### Constraints
  - `1 <= k`
  - `3 * k <= audience.length <= 2 * 10^4`
  - `0 <= audience[i] <= 10^4`

  **Follow-up:** can you do it in `O(n)` time?
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: best_three_slots
  params:
    - {name: audience, type: "int[]"}
    - {name: k, type: "int"}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def best_three_slots(audience: list[int], k: int) -> list[int]:
        n = len(audience)
        count = n - k + 1
        window = [0] * count  # window[i] = audience of the slot starting at hour i
        running = sum(audience[:k])
        window[0] = running
        for i in range(1, count):
            running += audience[i + k - 1] - audience[i - 1]
            window[i] = running
        left = [0] * count  # best start in [0, i], smallest index on ties
        for i in range(1, count):
            left[i] = i if window[i] > window[left[i - 1]] else left[i - 1]
        right = [count - 1] * count  # best start in [i, count - 1], smallest index on ties
        for i in range(count - 2, -1, -1):
            right[i] = i if window[i] >= window[right[i + 1]] else right[i + 1]
        best: list[int] = []
        best_total = -1
        for middle in range(k, count - k):
            a, c = left[middle - k], right[middle + k]
            total = window[a] + window[middle] + window[c]
            if total > best_total:
                best_total = total
                best = [a, middle, c]
        return best
  javascript: |
    function bestThreeSlots(audience, k) {
      const n = audience.length;
      const count = n - k + 1;
      const window = new Array(count).fill(0);
      let running = 0;
      for (let i = 0; i < k; i++) running += audience[i];
      window[0] = running;
      for (let i = 1; i < count; i++) {
        running += audience[i + k - 1] - audience[i - 1];
        window[i] = running;
      }
      const left = new Array(count).fill(0);
      for (let i = 1; i < count; i++) left[i] = window[i] > window[left[i - 1]] ? i : left[i - 1];
      const right = new Array(count).fill(count - 1);
      for (let i = count - 2; i >= 0; i--) right[i] = window[i] >= window[right[i + 1]] ? i : right[i + 1];
      let best = [];
      let bestTotal = -1;
      for (let middle = k; middle < count - k; middle++) {
        const a = left[middle - k];
        const c = right[middle + k];
        const total = window[a] + window[middle] + window[c];
        if (total > bestTotal) {
          bestTotal = total;
          best = [a, middle, c];
        }
      }
      return best;
    }
