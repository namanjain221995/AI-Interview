expected_concepts:
  - "sliding-window sums for every possible slot start"
  - "best-on-the-left and best-on-the-right arrays"
  - "fixing the middle slot and combining the best compatible outer slots"
  - "tie-breaking: strict comparison from the left, non-strict from the right"
  - "O(n) time and O(n) space"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Computes all slot sums with a sliding window, precomputes the best slot to the left and right with tie-breaking that keeps the smallest index, iterates the middle slot once, explains why this yields the lexicographically smallest optimum and states O(n) time and space."
  good: "Correct prefix-sum or dynamic-programming solution in O(n) or O(n * 3) with minor slips in the tie-breaking explanation."
  weak: "Tries all triples in O(n^3), greedily picks the best slot first, allows overlapping slots, or returns a non-minimal list on ties."
  criteria:
    correctness: "All tests pass, including ties, exact fits and cases where greedy selection fails."
    efficiency: "Window sums, left-best and right-best arrays and the middle loop are each linear."
    code_quality: "Arrays named for what they hold (slot sums, best left, best right) and boundaries computed once."
    edge_cases: "n equal to 3k, k = 1, all-zero audiences and ties on every slot."
    communication: "Explains the non-overlap boundaries (middle start minus k, middle start plus k) and the tie rules."
hints:
  - "First compute the reach of every possible slot start with a sliding window. What is left is choosing three starts at least k apart."
  - "If you fix where the middle slot starts, the best first slot is the best start at or before the middle minus k, and the best third slot is the best start at or after the middle plus k. Both can be precomputed for every position."
  - "Build an array of slot reaches, a left array holding the earliest index of the best reach seen from the start (replace only on strictly larger), and a right array holding the best index from the end (replace on larger or equal so the smaller index wins); then try every middle start in increasing order and keep a triple only when its total is strictly larger than the best found so far."
followups:
  - "How would you generalise this to m slots instead of three?"
  - "What changes if slots must be separated by at least one idle hour?"
  - "How would you handle slots of different lengths for each sponsor?"
  - "Why does the comparison need to be strict on the left but not on the right?"
common_errors:
  - "Picking the best slot greedily and then the best remaining ones."
  - "Using an off-by-one boundary that lets the middle slot overlap an outer slot."
  - "Using non-strict comparison on the left (or strict on the right), which returns a larger index on ties."
  - "Recomputing each slot sum from scratch, which makes the solution O(n * k)."
