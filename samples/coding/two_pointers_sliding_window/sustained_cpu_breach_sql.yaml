expected_concepts:
  - gaps-and-islands with ROW_NUMBER
  - grouping consecutive values by minute minus row number
  - filtering before numbering so non-hot minutes split runs
  - missing minutes break runs
  - two-level aggregation (per run, then per host)
optimal_complexity: {time: "O(n log n) for the per-host sort", space: O(n)}
rubric:
  excellent: Filters to hot minutes, numbers them per host, groups by minute minus row number to form runs, keeps runs of three or more and aggregates per host, explaining why gaps in minutes split runs automatically.
  good: Reaches a correct gaps-and-islands query after a hint, or uses LAG-based run detection that handles gaps correctly.
  weak: Counts hot minutes per host without checking consecutiveness, treats rows adjacent in order as adjacent in time, or applies the three-minute filter after aggregating per host.
  criteria:
    correctness: All tests pass, including missing minutes, boundary values 89 and 90, and hosts with several runs.
    efficiency: Set-based window functions in one pass; no per-minute correlated subqueries.
    code_quality: Named CTEs for hot minutes, runs and the final aggregate with clear aliases.
    edge_cases: Empty table, hosts with no hot minutes, short runs before longer ones and ties between runs.
    communication: Explains why minute minus row number is constant within a run and changes across gaps.
hints:
  - Only hot minutes can belong to a run; think about how to recognise which hot minutes of a host form one unbroken stretch.
  - Number each host's hot minutes in time order; inside one unbroken stretch the difference between the minute and that number stays the same, and it changes after any gap or cool minute.
  - Keep the hot rows, compute minute minus a per-host row number ordered by minute, and group by host and that difference to get each run's first minute and length; discard runs shorter than three, then per host take the smallest first minute and the largest length, ordered by host.
followups:
  - How would you return every sustained breach (start, end, length) instead of a per-host summary?
  - How would you solve it with LAG instead of ROW_NUMBER?
  - What changes if a single missing minute should be tolerated inside a breach?
  - Which index supports this query when the table holds a month of per-minute samples for thousands of hosts?
common_errors:
  - Counting hot minutes per host without checking that they are consecutive.
  - Numbering all rows and then filtering, so cool minutes no longer split runs.
  - Comparing each hot row with the previous stored row instead of the previous minute, which joins runs across gaps.
  - Taking the earliest hot minute instead of the start of the earliest run that lasts three minutes.
