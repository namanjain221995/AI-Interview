    expected_rows: [["batch-1", 5, 6]]
  - id: t6
    hidden: true
    description: "Gap in minutes - rows adjacent in order but not in time must not join (answer 4, 3 not 1, 5)"
    ordered: true
    setup_sql: |
      INSERT INTO host_metrics (host, minute, cpu_pct) VALUES
