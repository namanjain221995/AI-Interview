version: 1
slug: sustained_cpu_breach_sql
title: Sustained CPU Breaches (SQL)
difficulty: medium
competency_keys: [sql, databases, problem_solving]
role_tags: [sre, data_analyst, dba, devops]
time_limit_minutes: 25
prompt_markdown: |
  ## Sustained CPU Breaches

  A metrics collector stores one CPU sample per host per minute in table `host_metrics`:

  | column | type | notes |
  |--------|------|-------|
  | host | TEXT | host name |
  | minute | INTEGER | minute index since monitoring started; `(host, minute)` is the primary key |
  | cpu_pct | INTEGER | CPU utilisation in percent, 0 to 100 |

  The collector sometimes misses a minute, so a host's minutes can have **gaps**.

  A minute is **hot** when `cpu_pct >= 90`. A **breach run** is a maximal sequence of hot minutes of one
  host at consecutive integer minutes `m, m + 1, m + 2, ...` with no missing minute in between: a missing
  minute ends a run, because nobody knows how busy the host was during it. A breach run is
  **sustained** when it lasts at least **3** minutes.

  For every host with at least one sustained breach, return:

  - `host`;
  - `first_breach_minute`: the first minute of the host's **earliest** sustained breach;
  - `longest_run`: the number of minutes in the host's **longest** sustained breach.

  Hosts without a sustained breach are not returned. Order the result by `host` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite (no date functions are needed).

  ### Example 1
  ```
  host_metrics
  +-------+--------+---------+
  | host  | minute | cpu_pct |
  +-------+--------+---------+
  | api-1 | 1      | 95      |
  | api-1 | 2      | 91      |
  | api-1 | 3      | 97      |
  | api-1 | 4      | 60      |
  | api-1 | 5      | 92      |
  | api-1 | 6      | 93      |
  | api-1 | 7      | 99      |
  | api-1 | 8      | 90      |
  | api-1 | 9      | 40      |
  | db-1  | 1      | 92      |
  | db-1  | 2      | 94      |
  | db-1  | 4      | 96      |
  | db-1  | 5      | 98      |
  +-------+--------+---------+

  Output
  +-------+---------------------+-------------+
  | host  | first_breach_minute | longest_run |
  +-------+---------------------+-------------+
  | api-1 | 1                   | 4           |
  +-------+---------------------+-------------+
  api-1 has sustained runs at minutes 1-3 and 5-8. db-1 has no sample for minute 3, so it only has two
  runs of two minutes and is not returned.
  ```

  ### Example 2
  ```
  host_metrics
  +-------+--------+---------+
  | host  | minute | cpu_pct |
  +-------+--------+---------+
  | web-2 | 10     | 90      |
  | web-2 | 11     | 90      |
  | web-2 | 12     | 89      |
  | web-2 | 13     | 95      |
  | web-2 | 14     | 96      |
  | web-2 | 15     | 97      |
  | web-1 | 0      | 100     |
  | web-1 | 1      | 100     |
  | web-1 | 2      | 100     |
  +-------+--------+---------+

  Output
  +-------+---------------------+-------------+
  | host  | first_breach_minute | longest_run |
  +-------+---------------------+-------------+
  | web-1 | 0                   | 3           |
  | web-2 | 13                  | 3           |
  +-------+---------------------+-------------+
  web-2's run at minutes 10-11 is too short, so its earliest sustained breach starts at minute 13.
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `0 <= minute <= 10^7`
  - `0 <= cpu_pct <= 100`
languages: [sql]
starter_code:
  sql: |
    -- Return host, first_breach_minute and longest_run for hosts with a run of >= 3 consecutive hot minutes.
    SELECT host, MIN(minute) AS first_breach_minute, COUNT(*) AS longest_run
    FROM host_metrics
    WHERE cpu_pct >= 90
    GROUP BY host
    ORDER BY host;
reference_solutions:
  sql: |
    WITH hot AS (
      SELECT
        host,
        minute,
        minute - ROW_NUMBER() OVER (PARTITION BY host ORDER BY minute) AS island
      FROM host_metrics
      WHERE cpu_pct >= 90
    ),
    runs AS (
      SELECT host, MIN(minute) AS start_minute, COUNT(*) AS run_length
      FROM hot
      GROUP BY host, island
    )
    SELECT host, MIN(start_minute) AS first_breach_minute, MAX(run_length) AS longest_run
    FROM runs
    WHERE run_length >= 3
    GROUP BY host
    ORDER BY host;
sql_setup: |
  CREATE TABLE host_metrics (
    host VARCHAR(40) NOT NULL,
    minute INTEGER NOT NULL,
    cpu_pct INTEGER NOT NULL,
    PRIMARY KEY (host, minute)
  );
tests:
  - id: t1
    description: "Example 1 - a missing minute splits db-1 into two short runs"
    ordered: true
    setup_sql: |
      INSERT INTO host_metrics (host, minute, cpu_pct) VALUES
        ('api-1', 1, 95), ('api-1', 2, 91), ('api-1', 3, 97), ('api-1', 4, 60), ('api-1', 5, 92),
        ('api-1', 6, 93), ('api-1', 7, 99), ('api-1', 8, 90), ('api-1', 9, 40),
        ('db-1', 1, 92), ('db-1', 2, 94), ('db-1', 4, 96), ('db-1', 5, 98);
    expected_rows: [["api-1", 1, 4]]
  - id: t2
    description: "Example 2 - 90 counts, 89 does not, a two-minute run is ignored"
    ordered: true
    setup_sql: |
      INSERT INTO host_metrics (host, minute, cpu_pct) VALUES
        ('web-2', 10, 90), ('web-2', 11, 90), ('web-2', 12, 89), ('web-2', 13, 95), ('web-2', 14, 96),
        ('web-2', 15, 97), ('web-1', 0, 100), ('web-1', 1, 100), ('web-1', 2, 100);
    expected_rows:
      - ["web-1", 0, 3]
      - ["web-2", 13, 3]
  - id: t3
    hidden: true
    description: "Empty table"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
