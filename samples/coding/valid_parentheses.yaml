prompt_markdown: |
  ## Valid Parentheses

  Given a string `s` containing only the characters `(`, `)`, `[`, `]`, `{` and `}`, decide whether
  the brackets are **balanced**:

  1. Every opening bracket is closed by a bracket of the same type.
  2. Brackets are closed in the correct order (the most recently opened bracket closes first).
  3. Every closing bracket has a matching opening bracket.

  An empty string is considered valid.

  ### Example 1
  ```
  Input:  s = "()"
  Output: true
  ```

  ### Example 2
  ```
  Input:  s = "()[]{}"
  Output: true
  ```

  ### Example 3
  ```
  Input:  s = "(]"
  Output: false
  ```

  ### Constraints
  - `0 <= s.length <= 10^4`
  - `s` consists only of the characters `()[]{}`.
