expected_concepts:
  - stack (last in, first out)
  - mapping closing brackets to opening brackets
  - early exit on mismatch
  - checking the stack is empty at the end
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Identifies the stack immediately, handles empty input, unmatched closers and leftover openers, and explains O(n) time and space.
  good: Correct stack solution with minor prompting on one edge case such as a closer arriving on an empty stack.
  weak: Counts brackets per type without considering order, or crashes on an unmatched closing bracket.
  criteria:
    correctness: All tests pass, including interleaved pairs such as "([)]".
    efficiency: Single pass with a stack; no repeated string replacement.
    code_quality: Bracket pairs stored in a lookup table instead of long condition chains.
    edge_cases: Empty string, a leading closer and leftover openers are handled.
    communication: Explains why a stack matches the "most recent opener" rule.
hints:
  - Think about which opening bracket a closing bracket has to match — the first one you saw, or the most recent one still open?
  - A data structure that gives you the most recently added item first fits this problem well.
  - Push opening brackets onto a stack; for each closing bracket, the top of the stack must be its matching opener, and the stack must be empty at the end.
followups:
  - What happens with an empty input, or a string that starts with a closing bracket?
  - How would you report the position of the first error to help a user fix a config file?
  - Could you solve it with O(1) extra space if only one bracket type existed?
  - How would you extend this to ignore brackets inside quoted strings?
common_errors:
  - Counting each bracket type independently, which accepts "([)]".
  - Reading the top of an empty stack when the first character is a closing bracket.
  - Forgetting to check that no openers remain once the loop finishes.
  - Repeatedly replacing "()" pairs in the string, which is O(n^2).
