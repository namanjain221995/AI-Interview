reference_solutions:
  python: |
    def is_valid_parentheses(s: str) -> bool:
        pairs = {")": "(", "]": "[", "}": "{"}
        stack: list[str] = []
        for ch in s:
            if ch in pairs:
                if not stack or stack[-1] != pairs[ch]:
                    return False
                stack.pop()
            else:
                stack.append(ch)
        return not stack
  javascript: |
    function isValidParentheses(s) {
      const pairs = { ")": "(", "]": "[", "}": "{" };
      const stack = [];
      for (const ch of s) {
        if (ch in pairs) {
          if (stack.length === 0 || stack[stack.length - 1] !== pairs[ch]) return false;
          stack.pop();
        } else {
          stack.push(ch);
        }
      }
      return stack.length === 0;
    }
  typescript: |
    function isValidParentheses(s: string): boolean {
      const pairs: Record<string, string> = { ")": "(", "]": "[", "}": "{" };
      const stack: string[] = [];
      for (const ch of s) {
        const open = pairs[ch];
        if (open !== undefined) {
          if (stack.pop() !== open) return false;
        } else {
          stack.push(ch);
        }
      }
      return stack.length === 0;
    }
  java: |
    import java.util.*;

    class Solution {
        public boolean isValidParentheses(String s) {
            Deque<Character> stack = new ArrayDeque<>();
            for (char ch : s.toCharArray()) {
                if (ch == '(' || ch == '[' || ch == '{') {
                    stack.push(ch);
                    continue;
                }
                if (stack.isEmpty()) return false;
                char open = stack.pop();
                if ((ch == ')' && open != '(') || (ch == ']' && open != '[') || (ch == '}' && open != '{')) {
                    return false;
                }
            }
            return stack.isEmpty();
        }
    }
  go: |
    package main

    func isValidParentheses(s string) bool {
    	pairs := map[rune]rune{')': '(', ']': '[', '}': '{'}
    	stack := make([]rune, 0, len(s))
    	for _, ch := range s {
    		if open, ok := pairs[ch]; ok {
    			if len(stack) == 0 || stack[len(stack)-1] != open {
    				return false
    			}
    			stack = stack[:len(stack)-1]
    		} else {
    			stack = append(stack, ch)
    		}
    	}
    	return len(stack) == 0
    }
  cpp: |
    #include <string>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        bool isValidParentheses(string s) {
            vector<char> stack;
            for (char ch : s) {
                if (ch == '(' || ch == '[' || ch == '{') {
                    stack.push_back(ch);
                    continue;
                }
                if (stack.empty()) return false;
                char open = stack.back();
                stack.pop_back();
                if ((ch == ')' && open != '(') || (ch == ']' && open != '[') || (ch == '}' && open != '{')) {
                    return false;
                }
            }
            return stack.empty();
        }
    };
