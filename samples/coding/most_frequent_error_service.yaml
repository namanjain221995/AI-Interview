expected_concepts:
  - hash map counting
  - parsing fields without misreading message content
  - deterministic tie-breaking
  - linear time over the input
optimal_complexity: {time: "O(n * L) for n lines of length L", space: "O(s) for s distinct services"}
rubric:
  excellent: Parses only the level and service fields, counts with a hash map, applies the tie-break and empty-result rules, and explains the complexity and why the message must be ignored.
  good: Correct counting with a minor slip (for example on malformed lines or tie-breaking) fixed after running the tests.
  weak: Searches the whole line for "ERROR", ignores ties, or crashes on short lines.
  criteria:
    correctness: All tests pass, including ties, malformed lines and ERROR inside messages.
    efficiency: One pass to count and one pass over distinct services.
    code_quality: Parsing and selection are clearly separated and readable.
    edge_cases: Empty input, no ERROR lines, malformed lines and lexicographic ties.
    communication: States assumptions about the log format before coding.
hints:
  - Which two fields of each line do you actually need, and how do you make sure words in the message can't be mistaken for the level?
  - Split each line on spaces, skip lines with fewer than three fields, and count ERROR lines per service in a hash map.
  - After counting, walk the map once keeping the best service — prefer a higher count, and on equal counts prefer the smaller name; return "" if nothing was counted.
followups:
  - What happens with an empty input or a batch with no ERROR lines?
  - How would you change the solution if the logs were a 50 GB file that does not fit in memory?
  - How would you return the top three services instead of one?
  - How would you make the parser robust to multiple spaces or JSON-formatted log lines?
common_errors:
  - Using a substring search for "ERROR" anywhere in the line, which counts messages that mention errors.
  - Indexing the third field without checking the line has enough fields.
  - Breaking ties by insertion order or map iteration order instead of string order.
  - Comparing service names numerically, which orders node-2 before node-10.
