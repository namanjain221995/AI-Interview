reference_solutions:
  python: |
    def most_frequent_error_service(logs: list[str]) -> str:
        counts: dict[str, int] = {}
        for line in logs:
            parts = line.split(" ", 3)
            if len(parts) < 3 or parts[1] != "ERROR":
                continue
            counts[parts[2]] = counts.get(parts[2], 0) + 1
        best, best_count = "", 0
        for service, count in counts.items():
            if count > best_count or (count == best_count and service < best):
                best, best_count = service, count
        return best
  javascript: |
    function mostFrequentErrorService(logs) {
      const counts = new Map();
      for (const line of logs) {
        const parts = line.split(" ");
        if (parts.length < 3 || parts[1] !== "ERROR") continue;
        counts.set(parts[2], (counts.get(parts[2]) || 0) + 1);
      }
      let best = "";
      let bestCount = 0;
      for (const [service, count] of counts) {
        if (count > bestCount || (count === bestCount && service < best)) {
          best = service;
          bestCount = count;
        }
      }
      return best;
    }
  typescript: |
    function mostFrequentErrorService(logs: string[]): string {
      const counts = new Map<string, number>();
      for (const line of logs) {
        const parts = line.split(" ");
        if (parts.length < 3 || parts[1] !== "ERROR") continue;
        counts.set(parts[2], (counts.get(parts[2]) ?? 0) + 1);
      }
      let best = "";
      let bestCount = 0;
      for (const [service, count] of counts) {
