version: 1
slug: most_frequent_error_service
title: Noisiest Service in the Logs
difficulty: easy
competency_keys: [data_structures, code_quality, problem_solving]
role_tags: [devops, sre, platform, backend, general]
time_limit_minutes: 12
prompt_markdown: |
  ## Noisiest Service in the Logs

  During an incident you have a batch of log lines. Each well-formed line has at least three fields
  separated by single spaces:

  ```
  <timestamp> <LEVEL> <service> [message ...]
  ```

  `LEVEL` is one of `DEBUG`, `INFO`, `WARN` or `ERROR` (always upper case). The message is optional and
  may contain any words — including the word `ERROR` — which must **not** be treated as the level.

  Return the name of the service with the **most `ERROR` lines**.

  - If several services tie, return the one that comes first in **lexicographic (string) order**.
  - If there are no `ERROR` lines at all, return an empty string `""`.
  - Lines with fewer than three fields are malformed and must be ignored.

  ### Example 1
  ```
  Input:  logs = [
    "2026-10-07T10:00:00Z ERROR payments-api timeout calling card network",
    "2026-10-07T10:00:01Z INFO checkout-web request served in 42ms",
    "2026-10-07T10:00:02Z ERROR payments-api connection reset by peer",
    "2026-10-07T10:00:03Z ERROR auth-service token signature invalid"
  ]
  Output: "payments-api"
  ```

  ### Example 2
  ```
  Input:  logs = [
    "2026-10-07T11:00:00Z ERROR search-api index unavailable",
    "2026-10-07T11:00:05Z ERROR auth-service upstream returned 503"
  ]
  Output: "auth-service"
  Explanation: both services have one ERROR line; "auth-service" < "search-api"
  ```

  ### Constraints
  - `0 <= logs.length <= 10^5`
  - Service names contain lower-case letters, digits and hyphens.
