        }
      }
      return best;
    }
  java: |
    import java.util.*;

    class Solution {
        public String mostFrequentErrorService(String[] logs) {
            Map<String, Integer> counts = new HashMap<>();
            for (String line : logs) {
                String[] parts = line.split(" ", 4);
                if (parts.length < 3 || !parts[1].equals("ERROR")) continue;
                counts.merge(parts[2], 1, Integer::sum);
            }
            String best = "";
            int bestCount = 0;
            for (Map.Entry<String, Integer> entry : counts.entrySet()) {
                int count = entry.getValue();
                if (count > bestCount || (count == bestCount && entry.getKey().compareTo(best) < 0)) {
                    best = entry.getKey();
                    bestCount = count;
                }
            }
            return best;
        }
    }
  go: |
    package main

    import "strings"

    func mostFrequentErrorService(logs []string) string {
    	counts := map[string]int{}
    	for _, line := range logs {
    		parts := strings.SplitN(line, " ", 4)
    		if len(parts) < 3 || parts[1] != "ERROR" {
    			continue
    		}
    		counts[parts[2]]++
    	}
    	best, bestCount := "", 0
    	for service, count := range counts {
    		if count > bestCount || (count == bestCount && service < best) {
    			best, bestCount = service, count
    		}
    	}
    	return best
    }
  cpp: |
    #include <string>
    #include <unordered_map>
    #include <vector>
    using namespace std;

    class Solution {
    public:
        string mostFrequentErrorService(vector<string>& logs) {
            unordered_map<string, int> counts;
            for (const string& line : logs) {
                vector<string> parts;
                size_t start = 0;
                while (parts.size() < 3) {
                    size_t end = line.find(' ', start);
                    if (end == string::npos) {
                        parts.push_back(line.substr(start));
                        break;
                    }
                    parts.push_back(line.substr(start, end - start));
                    start = end + 1;
                }
                if (parts.size() < 3 || parts[1] != "ERROR") continue;
                ++counts[parts[2]];
            }
            string best;
            int bestCount = 0;
            for (const auto& [service, count] : counts) {
                if (count > bestCount || (count == bestCount && service < best)) {
                    best = service;
                    bestCount = count;
                }
            }
            return best;
        }
    };
