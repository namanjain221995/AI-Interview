title: Maximum Average Subarray
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [general, backend, data, devops]
time_limit_minutes: 15
prompt_markdown: |
  ## Maximum Average Subarray

  You are given an integer array `nums` (for example, requests per second sampled once a second) and an
  integer `k`. Find the **contiguous** window of exactly `k` elements with the **largest average** and
  return that average.

  Answers within `1e-5` of the expected value are accepted.

  ### Example 1
  ```
  Input:  nums = [1, 12, -5, -6, 50, 3], k = 4
  Output: 12.75
  Explanation: the window [12, -5, -6, 50] has sum 51 and average 51 / 4 = 12.75
  ```

  ### Example 2
  ```
  Input:  nums = [5], k = 1
  Output: 5.0
  ```

  ### Constraints
  - `1 <= k <= nums.length <= 10^5`
  - `-10^4 <= nums[i] <= 10^4`
languages: [python, javascript, typescript, java, go, cpp]
