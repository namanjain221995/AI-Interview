expected_concepts:
  - sliding window
  - maintaining a running sum
  - integer versus floating-point division
  - O(n) instead of O(n*k)
optimal_complexity: {time: O(n), space: O(1)}
rubric:
  excellent: Uses a fixed-size sliding window with a running sum, divides only once at the end, and explains why recomputing each window is O(n*k).
  good: Correct sliding window solution, possibly after starting with the brute-force approach.
  weak: Recomputes every window from scratch, uses integer division, or mishandles k equal to the array length.
  criteria:
    correctness: Returns the exact maximum average for every test, including all-negative input.
    efficiency: Linear time with constant extra space.
    code_quality: Clear window update (add the incoming element, subtract the outgoing one).
    edge_cases: Handles k == 1, k == n and negative numbers; does not initialise the best value to zero.
    communication: Explains the window invariant and the final division.
hints:
  - Two neighbouring windows of size k share k - 1 elements — how much really changes when the window moves one step?
  - Keep a running sum of the current window and update it by adding the element that enters and subtracting the one that leaves.
  - Compute the sum of the first k elements, slide the window to the end while tracking the maximum sum, and divide that maximum by k once at the end.
followups:
  - What happens if every value is negative — what should the best sum start at?
  - How would you find the window with the maximum average of length at least k instead of exactly k?
  - How would you compute this over an unbounded stream of metrics?
common_errors:
  - Initialising the best sum to 0, which is wrong when every window sum is negative.
  - Integer division that truncates the average in Java, C++ or Go.
  - Recomputing each window sum from scratch, giving O(n*k) time.
  - Off-by-one errors in the loop bounds that skip the last window.
