version: 1
slug: support_agent_leaderboard_rank
title: Support Agent Leaderboard
difficulty: easy
competency_keys: [sql, databases]
role_tags: [support_engineer, data_analyst, business_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Support Agent Leaderboard

  The support team shows a weekly leaderboard of closed tickets. Every closed ticket is one row in
  table `closed_tickets`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | agent | VARCHAR(40) | the agent's handle (lowercase letters only) |
  | closed_at | TEXT | close time formatted `'YYYY-MM-DD HH:MM'` |

  For every agent who closed at least one ticket return `agent`, `closed_count` (number of tickets that
  agent closed) and `rank_position`, using **competition ranking**: agents with more closed tickets
  rank higher, agents with the same count share the same position, and the next position skips by the
  number of tied agents (counts 9, 7, 7, 4 get positions 1, 2, 2, 4).

  Order the result by `rank_position` ascending, then `agent` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  closed_tickets
  +----+-------+------------------+
  | id | agent | closed_at        |
  +----+-------+------------------+
  | 1  | aspen | 2026-03-02 09:10 |
  | 2  | cedar | 2026-03-02 09:45 |
  | 3  | birch | 2026-03-02 10:05 |
  | 4  | aspen | 2026-03-02 11:30 |
  | 5  | maple | 2026-03-03 08:20 |
  | 6  | cedar | 2026-03-03 09:00 |
  | 7  | maple | 2026-03-03 13:15 |
  | 8  | aspen | 2026-03-04 16:40 |
  | 9  | cedar | 2026-03-05 10:00 |
  +----+-------+------------------+

  Output
  +-------+--------------+---------------+
  | agent | closed_count | rank_position |
  +-------+--------------+---------------+
  | aspen | 3            | 1             |
  | cedar | 3            | 1             |
  | maple | 2            | 3             |
  | birch | 1            | 4             |
  +-------+--------------+---------------+
  aspen and cedar tie for first place, so the next agent is in position 3, not 2.
  ```

  ### Example 2
  ```
  closed_tickets
  +----+--------+------------------+
  | id | agent  | closed_at        |
  +----+--------+------------------+
  | 1  | willow | 2026-04-01 12:00 |
  | 2  | oak    | 2026-04-01 12:30 |
  +----+--------+------------------+

  Output
  +--------+--------------+---------------+
  | agent  | closed_count | rank_position |
  +--------+--------------+---------------+
  | oak    | 1            | 1             |
  | willow | 1            | 1             |
  +--------+--------------+---------------+
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `agent` contains lowercase letters only and is never NULL.
  - Agents without closed tickets do not appear in the table and are not returned.
languages: [sql]
starter_code:
  sql: |
    -- Return agent, closed_count and rank_position (ties share a position, next position skips), ordered by rank_position, agent.
    SELECT agent, COUNT(*) AS closed_count, 1 AS rank_position
    FROM closed_tickets
    GROUP BY agent
    ORDER BY rank_position, agent;
reference_solutions:
  sql: |
    SELECT agent,
           COUNT(*) AS closed_count,
           RANK() OVER (ORDER BY COUNT(*) DESC) AS rank_position
    FROM closed_tickets
    GROUP BY agent
    ORDER BY rank_position, agent;
sql_setup: |
  CREATE TABLE closed_tickets (
    id INTEGER PRIMARY KEY,
    agent VARCHAR(40) NOT NULL,
    closed_at TEXT NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - tie at the top, next position skips to 3"
    ordered: true
    setup_sql: |
      INSERT INTO closed_tickets (id, agent, closed_at) VALUES
        (1, 'aspen', '2026-03-02 09:10'), (2, 'cedar', '2026-03-02 09:45'), (3, 'birch', '2026-03-02 10:05'),
        (4, 'aspen', '2026-03-02 11:30'), (5, 'maple', '2026-03-03 08:20'), (6, 'cedar', '2026-03-03 09:00'),
        (7, 'maple', '2026-03-03 13:15'), (8, 'aspen', '2026-03-04 16:40'), (9, 'cedar', '2026-03-05 10:00');
    expected_rows: [["aspen", 3, 1], ["cedar", 3, 1], ["maple", 2, 3], ["birch", 1, 4]]
  - id: t2
    description: "Example 2 - everyone tied, alphabetical order inside the tie"
    ordered: true
    setup_sql: |
      INSERT INTO closed_tickets (id, agent, closed_at) VALUES (1, 'willow', '2026-04-01 12:00'), (2, 'oak', '2026-04-01 12:30');
    expected_rows: [["oak", 1, 1], ["willow", 1, 1]]
  - id: t3
    hidden: true
    description: "Empty table returns no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Single agent with a single ticket"
    ordered: true
    setup_sql: "INSERT INTO closed_tickets (id, agent, closed_at) VALUES (1, 'rowan', '2026-05-01 08:00');"
    expected_rows: [["rowan", 1, 1]]
  - id: t5
    hidden: true
    description: "No ties - positions 1..n in descending count order, not alphabetical"
    ordered: true
    setup_sql: |
      INSERT INTO closed_tickets (id, agent, closed_at) VALUES
        (1, 'aspen', '2026-05-01 08:00'), (2, 'birch', '2026-05-01 08:05'), (3, 'birch', '2026-05-01 08:10'),
        (4, 'cedar', '2026-05-01 08:15'), (5, 'cedar', '2026-05-01 08:20'), (6, 'cedar', '2026-05-01 08:25');
    expected_rows: [["cedar", 3, 1], ["birch", 2, 2], ["aspen", 1, 3]]
  - id: t6
    hidden: true
    description: "Tie in the middle (counts 4, 2, 2, 1) - DENSE_RANK would give 3 instead of 4 for the last agent"
    ordered: true
    setup_sql: |
      INSERT INTO closed_tickets (id, agent, closed_at) VALUES
        (1, 'oak', '2026-06-01 09:00'), (2, 'oak', '2026-06-01 09:10'), (3, 'oak', '2026-06-01 09:20'), (4, 'oak', '2026-06-01 09:30'),
        (5, 'willow', '2026-06-01 10:00'), (6, 'willow', '2026-06-01 10:10'), (7, 'elm', '2026-06-01 11:00'),
        (8, 'elm', '2026-06-01 11:10'), (9, 'hazel', '2026-06-01 12:00');
    expected_rows: [["oak", 4, 1], ["elm", 2, 2], ["willow", 2, 2], ["hazel", 1, 4]]
  - id: t7
    hidden: true
    description: "Three-way tie at the top and a two-way tie at the bottom (ROW_NUMBER trap)"
    ordered: true
    setup_sql: |
      INSERT INTO closed_tickets (id, agent, closed_at) VALUES
        (1, 'larch', '2026-07-01 09:00'), (2, 'larch', '2026-07-01 09:01'), (3, 'spruce', '2026-07-01 09:02'),
        (4, 'spruce', '2026-07-01 09:03'), (5, 'alder', '2026-07-01 09:04'), (6, 'alder', '2026-07-01 09:05'),
        (7, 'yew', '2026-07-01 09:06'), (8, 'fir', '2026-07-01 09:07');
    expected_rows: [["alder", 2, 1], ["larch", 2, 1], ["spruce", 2, 1], ["fir", 1, 4], ["yew", 1, 4]]
  - id: t8
    hidden: true
    description: "Agent rows interleaved in id order and one agent far ahead"
    ordered: true
    setup_sql: |
      INSERT INTO closed_tickets (id, agent, closed_at) VALUES
        (1, 'pine', '2026-08-03 08:00'), (2, 'ash', '2026-08-03 08:01'), (3, 'pine', '2026-08-03 08:02'),
        (4, 'beech', '2026-08-03 08:03'), (5, 'pine', '2026-08-03 08:04'), (6, 'ash', '2026-08-03 08:05'),
        (7, 'pine', '2026-08-03 08:06'), (8, 'pine', '2026-08-03 08:07'), (9, 'beech', '2026-08-03 08:08'),
        (10, 'pine', '2026-08-03 08:09'), (11, 'holly', '2026-08-03 08:10');
    expected_rows: [["pine", 6, 1], ["ash", 2, 2], ["beech", 2, 2], ["holly", 1, 4]]
expected_concepts:
  - "GROUP BY with COUNT"
  - "RANK() window function over an aggregate"
  - "RANK versus DENSE_RANK versus ROW_NUMBER"
  - "deterministic ordering inside ties"
optimal_complexity: {time: "O(n + a log a) for n tickets and a agents", space: "O(a)"}
rubric:
  excellent: "Groups by agent, ranks with RANK() OVER (ORDER BY COUNT(*) DESC), explains how RANK, DENSE_RANK and ROW_NUMBER differ on ties, and orders by position then agent."
  good: "Correct query after a hint about which ranking function skips positions."
  weak: "Uses DENSE_RANK or ROW_NUMBER, ranks ascending, or omits the tie-breaking order by agent."
  criteria:
    correctness: "All tests pass, including ties at the top, middle and bottom."
    efficiency: "One aggregation and one window pass."
    code_quality: "Clear aliases and a readable window clause."
    edge_cases: "Empty table, single agent, all agents tied and no ties at all."
    communication: "Explains competition ranking and why the result order must break ties explicitly."
hints:
  - "First reduce the table to one row per agent with its count, then decide each agent's position."
  - "A ranking window function can order by an aggregate; pick the one that lets tied agents share a position and then skips."
  - "Group by agent, select COUNT(*), and compute RANK() OVER (ORDER BY COUNT(*) DESC); finish with ORDER BY rank_position, agent."
followups:
  - "What would DENSE_RANK and ROW_NUMBER return for counts 9, 7, 7, 4?"
  - "How would you rank agents per week inside one query?"
  - "How would you include agents with zero closed tickets from a separate agents table?"
common_errors:
  - "Using DENSE_RANK, which does not skip positions after a tie."
  - "Using ROW_NUMBER, which gives tied agents different positions."
  - "Ranking by COUNT ascending, which puts the busiest agent last."
