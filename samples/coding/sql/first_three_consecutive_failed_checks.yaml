expected_concepts:
  - "window functions with PARTITION BY and ORDER BY"
  - "LAG with an offset to look at previous rows"
  - "ordering by position rather than assuming gap-free sequence numbers"
  - "aggregating the earliest qualifying row per group"
optimal_complexity: {time: "O(n log n) to order runs within each probe (O(n) with an index on (probe, run_no))", space: "O(n) for the window evaluation"}
rubric:
  excellent: "Uses LAG(ok, 1) and LAG(ok, 2) (or ROW_NUMBER plus a self-join on row numbers) partitioned by probe and ordered by run_no, takes MIN(run_no) of qualifying runs, and explains why joining on run_no - 1 breaks with gaps."
  good: "Correct query after a hint about gaps in run_no or about returning only the earliest alert."
  weak: "Joins on run_no + 1 and run_no + 2, counts total failures per probe, returns every run of a long streak, or mixes runs of different probes."
  criteria:
    correctness: "All tests pass, including gaps in run_no, shuffled insertion order, streaks longer than three and probes that never alert."
    efficiency: "A single windowed pass over the table; notes that the (probe, run_no) primary key supports the ordering."
    code_quality: "Named CTE, descriptive column aliases and a clear filter on the three ok values."
    edge_cases: "Empty table, a streak at the very first runs, two-failure streaks, interleaved probes."
    communication: "Explains the difference between consecutive numbers and consecutive rows."
hints:
  - "For each failed run you need to know the outcome of the two runs that came just before it for the same probe; think about how to look backwards in an ordered list of rows."
  - "Do not assume run numbers are contiguous; the previous run is the previous row when a probe's runs are sorted by run_no, which a window function can give you directly."
  - "In a CTE compute LAG(ok, 1) and LAG(ok, 2) over a window partitioned by probe and ordered by run_no, keep rows where ok and both lagged values are 0, then take MIN(run_no) per probe and order by probe."
followups:
  - "How would you make the streak length (three) a parameter without writing N LAG calls?"
  - "How would you report every distinct streak that paged, not just the first one?"
  - "How would you also require that the three failures happened within ten minutes of each other if there were a timestamp column?"
common_errors:
  - "Self-joining on run_no + 1 and run_no + 2, which misses streaks that span skipped run numbers."
  - "Forgetting PARTITION BY probe, so the last runs of one probe become the previous rows of the next probe."
  - "Returning every failed run in a long streak instead of only the earliest third failure."
  - "Counting total failures per probe, which alerts on scattered failures that were never consecutive."
