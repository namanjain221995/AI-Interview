version: 1
slug: first_three_consecutive_failed_checks
title: "Third Consecutive Failed Check"
difficulty: medium
competency_keys: [sql, databases]
role_tags: [sre, devops, qa]
time_limit_minutes: 22
prompt_markdown: |
  ## Third Consecutive Failed Check

  Synthetic monitoring runs scripted probes (log in, search, check out) against production on a
  schedule. A single failed run is often noise, so the on-call policy pages only when a probe fails
  **three runs in a row**. The SRE team is replaying last week's results to see when each probe would
  have paged.

  Table `health_checks`:

  | column | type | notes |
  |--------|------|-------|
  | probe | VARCHAR(40) | probe name; `(probe, run_no)` is the primary key |
  | run_no | INTEGER | run sequence number of that probe; increases over time but **may skip values** (runs lost to scheduler restarts) |
  | ok | INTEGER | `1` when the run passed, `0` when it failed |

  The runs of a probe are ordered by `run_no`. Missing numbers do not matter: two runs are
  consecutive when no other run of the same probe lies between them. Runs of different probes are
  independent.

  A probe **alerts** at the run that is its third failure in a row, that is a failed run whose two
  previous runs of the same probe also failed. If a probe has several such streaks, or a streak
  longer than three, only the **earliest** alerting run counts.

  Return `probe` and `alert_run_no` (the `run_no` of that earliest alerting run) for every probe that
  ever had three consecutive failures, ordered by `probe` ascending. Probes that never alert are left
  out.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  health_checks
  +----------+--------+----+
  | probe    | run_no | ok |
  +----------+--------+----+
  | login    | 1      | 1  |
  | login    | 2      | 0  |
  | login    | 3      | 0  |
  | login    | 4      | 0  |
  | login    | 5      | 0  |
  | cdn      | 1      | 0  |
  | cdn      | 2      | 0  |
  | cdn      | 3      | 1  |
  | cdn      | 4      | 0  |
  | cdn      | 5      | 0  |
  | payments | 10     | 0  |
  | payments | 12     | 0  |
  | payments | 15     | 0  |
  +----------+--------+----+

  Output
  +----------+--------------+
  | probe    | alert_run_no |
  +----------+--------------+
  | login    | 4            |
  | payments | 15           |
  +----------+--------------+
  login alerts at run 4 (runs 2, 3, 4 failed). cdn never fails three times in a row. payments fails
  at runs 10, 12 and 15, which are consecutive runs because 11, 13 and 14 do not exist.
  ```

  ### Example 2
  ```
  health_checks
  +----------+--------+----+
  | probe    | run_no | ok |
  +----------+--------+----+
  | search   | 1      | 0  |
  | search   | 2      | 0  |
  | search   | 3      | 1  |
  | search   | 4      | 0  |
  | search   | 5      | 0  |
  | search   | 6      | 0  |
  | checkout | 1      | 1  |
  | checkout | 2      | 0  |
  | checkout | 3      | 0  |
  +----------+--------+----+

  Output
  +--------+--------------+
  | probe  | alert_run_no |
  +--------+--------------+
  | search | 6            |
  +--------+--------------+
  search fails at runs 1 and 2, passes at 3, then fails at 4, 5 and 6, so it alerts at run 6.
  ```

  ### Constraints
  - At most `10^6` rows; the table may be empty.
  - `1 <= run_no <= 10^9`, unique per probe; `ok` is `0` or `1`.
  - Rows are stored in no particular order.
languages: [sql]
starter_code:
  sql: |
    -- Return probe and alert_run_no (the earliest run that is the third failure in a row),
    -- ordered by probe.
    SELECT probe, MIN(run_no) AS alert_run_no
    FROM health_checks
    WHERE ok = 0
    GROUP BY probe
    ORDER BY probe;
reference_solutions:
  sql: |
    WITH ordered AS (
      SELECT probe,
             run_no,
             ok,
             LAG(ok, 1) OVER (PARTITION BY probe ORDER BY run_no) AS prev1_ok,
             LAG(ok, 2) OVER (PARTITION BY probe ORDER BY run_no) AS prev2_ok
      FROM health_checks
    )
    SELECT probe, MIN(run_no) AS alert_run_no
    FROM ordered
    WHERE ok = 0 AND prev1_ok = 0 AND prev2_ok = 0
    GROUP BY probe
    ORDER BY probe;
sql_setup: |
  CREATE TABLE health_checks (
    probe VARCHAR(40) NOT NULL,
    run_no INTEGER NOT NULL,
    ok INTEGER NOT NULL,
    PRIMARY KEY (probe, run_no)
  );
tests:
  - id: t1
    description: "Example 1 - a streak of four alerts at its third run, a broken streak never alerts, gaps in run_no are ignored"
    ordered: true
    setup_sql: |
      INSERT INTO health_checks (probe, run_no, ok) VALUES
        ('login', 1, 1), ('login', 2, 0), ('login', 3, 0), ('login', 4, 0), ('login', 5, 0),
        ('cdn', 1, 0), ('cdn', 2, 0), ('cdn', 3, 1), ('cdn', 4, 0), ('cdn', 5, 0),
        ('payments', 10, 0), ('payments', 12, 0), ('payments', 15, 0);
    expected_rows: [["login", 4], ["payments", 15]]
  - id: t2
    description: "Example 2 - first streak breaks after two failures; alert at the later triple; two failures alone do not alert"
    ordered: true
    setup_sql: |
