expected_concepts:
  - conditional aggregation per group
  - integer division and the order of multiply and divide
  - NULLIF to avoid division by zero
  - keeping groups that a WHERE filter would remove
optimal_complexity: {time: "O(n) to aggregate plus O(p log p) to sort p pipelines", space: "O(p)"}
rubric:
  excellent: Counts finished and failed runs with conditional aggregates, multiplies by 100 before the integer division, uses NULLIF (or CASE) to return NULL for zero finished runs, keeps cancelled-only pipelines and orders by name.
  good: Correct query after a hint about cancelled-only pipelines or about integer division.
  weak: Filters cancelled runs in WHERE (losing cancelled-only pipelines), counts cancelled runs as finished, returns decimals or rounded values, or divides by zero.
  criteria:
    correctness: All tests pass, including cancelled-only pipelines, rounding down and 0 and 100 percent.
    efficiency: One grouped pass over the table.
    code_quality: Readable aggregates with the finished-run expression clearly named.
    edge_cases: Empty table, pipelines with only cancelled or only failed runs.
    communication: Explains integer division semantics and why NULL is better than 0 for no data.
hints:
  - Each output row summarises one pipeline; the numbers you need are how many runs finished and how many of those failed.
  - A WHERE filter on status removes pipelines whose runs were all cancelled, so count conditionally inside the aggregates instead. Integer division truncates, so the order of multiplying by 100 and dividing matters.
  - Group by pipeline, count runs whose status is success or failed and runs whose status is failed with CASE inside COUNT, compute 100 times the failed count divided by NULLIF of the finished count and zero, and order by pipeline.
followups:
  - How would you report the percentage with one decimal place portably?
  - How would you restrict the report to the last 30 days of runs?
  - Should retried runs of the same commit count once or several times, and how would you model that?
common_errors:
  - Excluding cancelled runs in WHERE, which drops pipelines that only have cancelled runs.
  - Counting cancelled runs as finished.
  - Dividing before multiplying by 100, which truncates every partial failure rate to 0.
  - Returning 0 or causing a division-by-zero error instead of NULL when nothing finished.
  - Using 100.0 or ROUND, which returns 66.67 or 67 instead of the requested 66.
