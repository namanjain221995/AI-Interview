version: 1
slug: pipeline_failure_percentage
title: Pipeline Failure Percentage
difficulty: easy
competency_keys: [sql, databases]
role_tags: [devops, platform, qa, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Pipeline Failure Percentage

  The CI system stores one row per pipeline run. The platform team wants a quick table of how flaky each
  pipeline is, **ignoring runs that someone cancelled** (a cancelled run says nothing about the code).

  Table `pipeline_runs`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | pipeline | VARCHAR(60) | pipeline name, lower-case letters, digits and `-` |
  | status | VARCHAR(20) | exactly one of `success`, `failed`, `cancelled` |

  For every pipeline that appears in the table, return:

  - `pipeline`;
  - `finished_runs`: the number of its runs with status `success` or `failed` (cancelled runs are not
    counted);
  - `failure_pct`: `100 * failed_runs / finished_runs` as an **integer, rounded down** (so 2 failures out
    of 3 finished runs is `66`, not `67` and not `66.67`). If the pipeline has **no finished runs** (only
    cancelled ones), `finished_runs` is `0` and `failure_pct` is **NULL**.

  Order the rows by `pipeline` ascending. An empty table returns no rows.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  pipeline_runs
  +----+------------+-----------+
  | id | pipeline   | status    |
  +----+------------+-----------+
  | 1  | web-build  | success   |
  | 2  | web-build  | failed    |
  | 3  | api-deploy | success   |
  | 4  | web-build  | cancelled |
  | 5  | web-build  | failed    |
  | 6  | api-deploy | success   |
  | 7  | api-deploy | cancelled |
  | 8  | api-deploy | failed    |
  | 9  | api-deploy | success   |
  +----+------------+-----------+

  Output
  +------------+---------------+-------------+
  | pipeline   | finished_runs | failure_pct |
  +------------+---------------+-------------+
  | api-deploy | 4             | 25          |
  | web-build  | 3             | 66          |
  +------------+---------------+-------------+
  web-build: 3 finished runs (the cancelled one is ignored), 2 failed, 100 * 2 / 3 = 66.67 rounded down to 66.
  api-deploy: 4 finished runs, 1 failed, 25.
  ```

  ### Example 2
  ```
  pipeline_runs
  +----+--------------+-----------+
  | id | pipeline     | status    |
  +----+--------------+-----------+
  | 1  | nightly-fuzz | cancelled |
  | 2  | docs-publish | success   |
  | 3  | nightly-fuzz | cancelled |
  | 4  | docs-publish | success   |
  +----+--------------+-----------+

  Output
  +--------------+---------------+-------------+
  | pipeline     | finished_runs | failure_pct |
  +--------------+---------------+-------------+
  | docs-publish | 2             | 0           |
  | nightly-fuzz | 0             | NULL        |
  +--------------+---------------+-------------+
  nightly-fuzz never finished a run, so failure_pct is NULL. docs-publish never failed, so it is 0.
  ```

  ### Constraints
  - `0 <= rows in pipeline_runs <= 10^6`
  - `status` is never NULL and always one of the three values above, in lower case.
  - Pipeline names use only lower-case letters, digits and `-`.
languages: [sql]
starter_code:
  sql: |
    -- Return pipeline, finished_runs (success + failed) and failure_pct (integer, rounded down; NULL when
    -- there are no finished runs), ordered by pipeline.
    SELECT pipeline, COUNT(*) AS finished_runs, 0 AS failure_pct
    FROM pipeline_runs
    GROUP BY pipeline;
reference_solutions:
  sql: |
    SELECT pipeline,
           COUNT(CASE WHEN status IN ('success', 'failed') THEN 1 END) AS finished_runs,
           100 * COUNT(CASE WHEN status = 'failed' THEN 1 END)
             / NULLIF(COUNT(CASE WHEN status IN ('success', 'failed') THEN 1 END), 0) AS failure_pct
    FROM pipeline_runs
    GROUP BY pipeline
    ORDER BY pipeline;
sql_setup: |
  CREATE TABLE pipeline_runs (
    id INTEGER PRIMARY KEY,
    pipeline VARCHAR(60) NOT NULL,
    status VARCHAR(20) NOT NULL
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - cancelled runs ignored, percentage rounded down (2 of 3 is 66)"
    setup_sql: |
      INSERT INTO pipeline_runs (id, pipeline, status) VALUES
        (1, 'web-build', 'success'), (2, 'web-build', 'failed'), (3, 'api-deploy', 'success'), (4, 'web-build', 'cancelled'), (5, 'web-build', 'failed'),
        (6, 'api-deploy', 'success'), (7, 'api-deploy', 'cancelled'), (8, 'api-deploy', 'failed'), (9, 'api-deploy', 'success');
    expected_rows: [["api-deploy", 4, 25], ["web-build", 3, 66]]
  - id: t2
    ordered: true
    description: "Example 2 - a pipeline with only cancelled runs has 0 finished runs and NULL percentage"
    setup_sql: |
      INSERT INTO pipeline_runs (id, pipeline, status) VALUES
