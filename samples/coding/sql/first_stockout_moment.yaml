version: 1
slug: first_stockout_moment
title: First Oversell per SKU
difficulty: medium
competency_keys: [sql, databases]
role_tags: [backend, data, business_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## First Oversell per SKU

  A warehouse ledger records every stock movement for a new site that opened with **empty shelves**.
  Pickers were supposed to be blocked from taking stock that was not there, but a scanner bug let some
  picks through. The operations team wants to know, for each product, the **first moment its book
  balance dropped below zero**.

  Table `stock_movements`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | sku | VARCHAR(20) | product code, uppercase letters and digits |
  | moved_at | TEXT | `'YYYY-MM-DD HH:MM:SS'` (UTC); several movements can share a timestamp |
  | delta | INTEGER | non-zero; positive for a receipt, negative for a pick |

  Every SKU starts at a balance of `0`. Movements of a SKU are applied in order of `moved_at`, and
  movements with the same `moved_at` in order of `id`. The **balance after** a movement is the sum of
  the deltas of that SKU up to and including it.

  For every SKU whose balance ever goes **below zero**, return `sku`, the `moved_at` of the **first**
  movement after which its balance is negative, and that `balance_after`. A balance of exactly `0` is
  fine. SKUs that never go negative are left out. Sort by `sku` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite (window functions are available on
  both).

  ### Example 1
  ```
  stock_movements
  +----+------+---------------------+-------+
  | id | sku  | moved_at            | delta |
  +----+------+---------------------+-------+
  | 1  | A100 | 2026-05-01 08:00:00 | 10    |
  | 2  | A100 | 2026-05-01 09:00:00 | -4    |
  | 3  | B200 | 2026-05-01 09:30:00 | -2    |
  | 4  | A100 | 2026-05-01 10:00:00 | -7    |
  | 5  | A100 | 2026-05-01 11:00:00 | -3    |
  | 6  | B200 | 2026-05-01 12:00:00 | 5     |
  +----+------+---------------------+-------+

  Output
  +------+---------------------+---------------+
  | sku  | moved_at            | balance_after |
  +------+---------------------+---------------+
  | A100 | 2026-05-01 10:00:00 | -1            |
  | B200 | 2026-05-01 09:30:00 | -2            |
  +------+---------------------+---------------+
  A100 goes 10 -> 6 -> -1 at 10:00 (and later -4, which is not the first). B200 is picked before any
  receipt, so its first movement already leaves it at -2.
  ```

  ### Example 2
  ```
  stock_movements
  +----+------+---------------------+-------+
  | id | sku  | moved_at            | delta |
  +----+------+---------------------+-------+
  | 10 | C300 | 2026-05-02 10:00:00 | -5    |
  | 11 | C300 | 2026-05-02 09:00:00 | 5     |
  | 14 | E500 | 2026-05-02 11:00:00 | -1    |
  | 15 | E500 | 2026-05-02 11:00:00 | 1     |
  +----+------+---------------------+-------+

  Output
  +------+---------------------+---------------+
  | sku  | moved_at            | balance_after |
  +------+---------------------+---------------+
  | E500 | 2026-05-02 11:00:00 | -1            |
  +------+---------------------+---------------+
  C300 receives 5 at 09:00 and ships 5 at 10:00, so it never drops below 0. E500's two movements share
  a timestamp: id 14 is applied first, leaving -1, before id 15 brings it back to 0.
  ```

  ### Constraints
  - `0 <= rows in stock_movements <= 10^5`
  - `-10^9 <= delta <= 10^9`, `delta != 0`; running balances can exceed the 32-bit range
languages: [sql]
starter_code:
  sql: |
    -- Return sku, moved_at and balance_after of each SKU's first movement that leaves it negative.
    SELECT sku, moved_at, delta AS balance_after
    FROM stock_movements
    WHERE delta < 0
    ORDER BY sku;
reference_solutions:
  sql: |
    WITH running AS (
      SELECT id,
             sku,
             moved_at,
             SUM(delta) OVER (
               PARTITION BY sku
               ORDER BY moved_at, id
               ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
             ) AS balance_after
      FROM stock_movements
    ),
    negative AS (
      SELECT sku,
             moved_at,
             balance_after,
             ROW_NUMBER() OVER (PARTITION BY sku ORDER BY moved_at, id) AS rn
      FROM running
      WHERE balance_after < 0
    )
    SELECT sku, moved_at, balance_after
    FROM negative
    WHERE rn = 1
    ORDER BY sku;
sql_setup: |
  CREATE TABLE stock_movements (
    id INTEGER PRIMARY KEY,
    sku VARCHAR(20) NOT NULL,
    moved_at TEXT NOT NULL,
    delta INTEGER NOT NULL
  );
