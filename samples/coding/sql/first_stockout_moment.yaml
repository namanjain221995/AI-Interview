expected_concepts:
  - running total with SUM() OVER (PARTITION BY ... ORDER BY ...)
  - deterministic tie-breaking in window ordering (ROWS frame or a unique sort key)
  - picking the first qualifying row per group (ROW_NUMBER or MIN)
  - filtering on a window result through a subquery or CTE
  - 64-bit aggregates
optimal_complexity: {time: "O(n log n) for the per-SKU sort", space: O(n)}
rubric:
  excellent: Computes a per-SKU running balance ordered by moved_at then id with an explicit ROWS frame (or a unique order key), filters negative balances in an outer query, keeps the first one per SKU, and explains why window results cannot be filtered in WHERE of the same SELECT and how the default RANGE frame treats ties.
  good: Correct running balance and first-row selection after a hint about timestamp ties or reporting only the first dip.
  weak: Uses a global running sum, orders only by moved_at so peers are summed together, reports the minimum balance or the last dip, or tries to filter a window function in WHERE.
  criteria:
    correctness: All tests pass, including timestamp ties, recoveries, exact zero balances and large values.
    efficiency: One sort per SKU with window functions; no self-join that is quadratic per SKU.
    code_quality: Named CTEs for the running balance and the first dip; clear output names.
    edge_cases: Ties on moved_at, first movement negative, never negative, empty table.
    communication: Explains window frames (ROWS versus RANGE) and the evaluation order of WHERE and window functions.
hints:
  - Think of the balance after each movement as a running total that restarts for every SKU and follows time order, with id deciding between equal timestamps.
  - Once every movement carries its balance after, you only need the earliest movement per SKU whose balance is below zero; window results have to be filtered in an outer query.
  - Compute SUM(delta) OVER (PARTITION BY sku ORDER BY moved_at, id ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) in a CTE, keep rows with a negative balance, number them per SKU by moved_at and id with ROW_NUMBER and return number 1, sorted by sku.
followups:
  - How would you return every period during which a SKU was negative, with start and end times?
  - How would you compute the same answer without window functions, and what would it cost?
  - What index supports this query on a ledger with hundreds of millions of rows?
common_errors:
  - Ordering the running sum only by moved_at, so the default RANGE frame adds all movements with the same timestamp at once.
  - Forgetting PARTITION BY sku, which mixes the balances of different products.
  - Reporting the lowest balance or the last negative movement instead of the first one.
  - Filtering on the window function in the WHERE clause of the same SELECT.
