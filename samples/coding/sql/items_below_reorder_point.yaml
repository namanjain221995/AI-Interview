expected_concepts:
  - LEFT JOIN to keep products without stock rows
  - aggregating with SUM and COALESCE for missing groups
  - HAVING to filter on an aggregate
  - ORDER BY a computed expression with a tie-breaker
optimal_complexity: {time: "O(n + m) to aggregate plus O(k log k) to sort the k results", space: "O(n) for the per-product totals"}
rubric:
  excellent: Aggregates stock per product with a LEFT JOIN and COALESCE(SUM(qty), 0), filters with HAVING on the strict inequality, orders by the shortfall then sku, and explains why an inner join silently drops out-of-stock products.
  good: Correct query after a hint about products with no stock rows or about the ordering rule.
  weak: Uses an inner join (losing products with no stock), compares per warehouse instead of the total, or orders by reorder_level instead of the shortfall.
  criteria:
    correctness: All tests pass, including products with no stock rows, the strict boundary and tied shortfalls.
    efficiency: One grouped join; mentions an index on stock_levels.sku (or its primary key) for the join.
    code_quality: Readable aliases and the on_hand expression written once or consistently.
    edge_cases: Empty tables, zero-quantity rows, reorder level 0 and orphaned stock rows.
    communication: Explains the difference between WHERE and HAVING and why COALESCE is needed after a LEFT JOIN.
hints:
  - Work out the total stock per product first; the most urgent items may be the ones that have no stock rows at all.
  - An inner join drops products without any stock rows, and summing nothing gives NULL rather than zero. The comparison with reorder_level uses the total, so it belongs after grouping.
  - Left-join products to stock_levels, group by the product columns, turn a missing sum into 0, keep groups whose total is strictly below the level with HAVING, and sort by the gap descending with sku as the tie-breaker.
followups:
  - How would you include the suggested order quantity to bring each product back to twice its reorder level?
  - How would the query change if each warehouse had its own reorder level?
  - Which index supports this report on a large stock table?
common_errors:
  - Using an inner join, which hides products that have no stock rows at all.
  - Leaving SUM(qty) NULL for products without stock, so the comparison and the output are NULL.
  - Using <= instead of <, which lists products that are exactly at their reorder level.
  - Comparing each warehouse row with the reorder level instead of the total across warehouses.
  - Ordering by reorder_level or on_hand alone instead of the shortfall.
