version: 1
slug: items_below_reorder_point
title: Items Below Reorder Point
difficulty: easy
competency_keys: [sql, databases]
role_tags: [backend, business_analyst, data_analyst]
time_limit_minutes: 15
prompt_markdown: |
  ## Items Below Reorder Point

  A spare-parts distributor keeps the same products in several warehouses. Every morning purchasing gets
  a list of products that need to be reordered.

  Table `products`:

  | column | type | notes |
  |--------|------|-------|
  | sku | VARCHAR(20) | primary key |
  | name | VARCHAR(100) | |
  | reorder_level | INTEGER | reorder when the total stock is **below** this number, `>= 0` |

  Table `stock_levels`:

  | column | type | notes |
  |--------|------|-------|
  | sku | VARCHAR(20) | the product held; may name a SKU that is no longer in `products` |
  | warehouse | VARCHAR(40) | at most one row per `(sku, warehouse)` |
  | qty | INTEGER | units in that warehouse, `>= 0` |

  A product's `on_hand` is the sum of `qty` over all its warehouses, or `0` when it has no rows in
  `stock_levels`. A product needs reordering when `on_hand < reorder_level` (strictly below; a product
  exactly at its reorder level is fine).

  Return `sku`, `name`, `on_hand` and `reorder_level` for every product that needs reordering. Order the
  rows by the shortfall `reorder_level - on_hand` descending (biggest gap first), then by `sku` ascending.
  Stock rows whose SKU is not in `products` are ignored.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  products
  +---------+---------------+---------------+
  | sku     | name          | reorder_level |
  +---------+---------------+---------------+
  | BRK-210 | Brake pad set | 40            |
  | FLT-004 | Oil filter    | 30            |
  | GSK-118 | Head gasket   | 10            |
  | HNG-300 | Door hinge    | 25            |
  | VLV-052 | Intake valve  | 12            |
  +---------+---------------+---------------+

  stock_levels
  +---------+-----------+-----+
  | sku     | warehouse | qty |
  +---------+-----------+-----+
  | BRK-210 | lyon      | 15  |
  | BRK-210 | porto     | 10  |
  | FLT-004 | lyon      | 22  |
  | FLT-004 | porto     | 9   |
  | HNG-300 | porto     | 25  |
  | VLV-052 | lyon      | 4   |
  +---------+-----------+-----+

  Output
  +---------+---------------+---------+---------------+
  | sku     | name          | on_hand | reorder_level |
  +---------+---------------+---------+---------------+
  | BRK-210 | Brake pad set | 25      | 40            |
  | GSK-118 | Head gasket   | 0       | 10            |
  | VLV-052 | Intake valve  | 4       | 12            |
  +---------+---------------+---------+---------------+
  BRK-210 has 15 + 10 = 25 units (shortfall 15); GSK-118 has no stock rows, so on_hand is 0 (shortfall 10);
  VLV-052 is short by 8. FLT-004 (31 >= 30) and HNG-300 (exactly 25) do not need reordering.
  ```

  ### Example 2
  ```
  products
  +---------+----------------------+---------------+
  | sku     | name                 | reorder_level |
  +---------+----------------------+---------------+
  | CBL-900 | Ethernet patch cable | 50            |
  | CBL-120 | Power cord           | 20            |
  | BRK-007 | Rotor                | 8             |
  +---------+----------------------+---------------+

  stock_levels
  +---------+-----------+-----+
  | sku     | warehouse | qty |
  +---------+-----------+-----+
  | CBL-900 | lyon      | 44  |
  | CBL-120 | porto     | 14  |
  | BRK-007 | porto     | 9   |
  | OLD-001 | lyon      | 0   |
  +---------+-----------+-----+

  Output
  +---------+----------------------+---------+---------------+
  | sku     | name                 | on_hand | reorder_level |
  +---------+----------------------+---------+---------------+
  | CBL-120 | Power cord           | 14      | 20            |
  | CBL-900 | Ethernet patch cable | 44      | 50            |
  +---------+----------------------+---------+---------------+
  CBL-120 and CBL-900 are both short by 6, so they are ordered by sku. OLD-001 is not a product and is ignored.
  ```

  ### Constraints
  - `0 <= rows in products <= 10^4`, `0 <= rows in stock_levels <= 10^5`
  - `0 <= qty <= 10^6` and `0 <= reorder_level <= 10^6`; no column is NULL.
  - SKUs have the form `AAA-000` (three upper-case letters, a hyphen and three digits).
languages: [sql]
starter_code:
  sql: |
    -- Return sku, name, on_hand and reorder_level for products whose total stock is below reorder_level,
    -- ordered by (reorder_level - on_hand) descending, then sku.
    SELECT p.sku, p.name, s.qty AS on_hand, p.reorder_level
    FROM products p
    JOIN stock_levels s ON s.sku = p.sku;
reference_solutions:
  sql: |
    SELECT p.sku, p.name, COALESCE(SUM(s.qty), 0) AS on_hand, p.reorder_level
    FROM products p
    LEFT JOIN stock_levels s ON s.sku = p.sku
    GROUP BY p.sku, p.name, p.reorder_level
    HAVING COALESCE(SUM(s.qty), 0) < p.reorder_level
    ORDER BY p.reorder_level - COALESCE(SUM(s.qty), 0) DESC, p.sku;
sql_setup: |
  CREATE TABLE products (
    sku VARCHAR(20) PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    reorder_level INTEGER NOT NULL
  );
  CREATE TABLE stock_levels (
    sku VARCHAR(20) NOT NULL,
    warehouse VARCHAR(40) NOT NULL,
    qty INTEGER NOT NULL,
    PRIMARY KEY (sku, warehouse)
  );
