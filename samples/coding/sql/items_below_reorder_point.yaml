        ('BRK-210', 'Brake pad set', 40), ('FLT-004', 'Oil filter', 30), ('GSK-118', 'Head gasket', 10), ('HNG-300', 'Door hinge', 25), ('VLV-052', 'Intake valve', 12);
      INSERT INTO stock_levels (sku, warehouse, qty) VALUES
        ('BRK-210', 'lyon', 15), ('BRK-210', 'porto', 10), ('FLT-004', 'lyon', 22), ('FLT-004', 'porto', 9), ('HNG-300', 'porto', 25),
        ('VLV-052', 'lyon', 4);
    expected_rows: [["BRK-210", "Brake pad set", 25, 40], ["GSK-118", "Head gasket", 0, 10], ["VLV-052", "Intake valve", 4, 12]]
