version: 1
slug: classify_tree_node_types
title: "Classify Tree Nodes"
difficulty: easy
competency_keys: [sql, databases, data_structures]
role_tags: [backend, data, dba]
time_limit_minutes: 12
prompt_markdown: |
  ## Classify Tree Nodes

  A configuration service stores its settings folders as a tree in a single adjacency-list table.
  Before a migration, the platform team wants every folder labelled by its position in the tree.

  Table `nodes`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | parent_id | INTEGER | `id` of the parent folder; NULL for a top-level folder |

  The table may hold several independent trees. Every non-NULL `parent_id` refers to an existing
  `id`, and there are no cycles.

  Return every node with the columns `id` and `node_type`, where `node_type` is:

  - `'root'` when `parent_id` is NULL (even if the node has no children),
  - `'inner'` when the node has a parent **and** at least one child,
  - `'leaf'` when the node has a parent and no children.

  Order by `id` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  nodes
  +----+-----------+
  | id | parent_id |
  +----+-----------+
  | 1  | NULL      |
  | 2  | 1         |
  | 3  | 1         |
  | 4  | 2         |
  | 5  | NULL      |
  | 6  | 4         |
  +----+-----------+

  Output
  +----+-----------+
  | id | node_type |
  +----+-----------+
  | 1  | root      |
  | 2  | inner     |
  | 3  | leaf      |
  | 4  | inner     |
  | 5  | root      |
  | 6  | leaf      |
  +----+-----------+
  ```
  Node 5 has no parent and no children: it is still a root.

  ### Example 2
  ```
  nodes
  +----+-----------+
  | id | parent_id |
  +----+-----------+
  | 1  | NULL      |
  +----+-----------+

  Output
  +----+-----------+
  | id | node_type |
  +----+-----------+
  | 1  | root      |
  +----+-----------+
  ```

  ### Constraints
  - `0 <= rows in nodes <= 10^5`
  - `parent_id` is NULL or an existing `id`; the data contains no cycles.
  - The output order is part of the answer.
languages: [sql]
starter_code:
  sql: |
    -- Label every node as 'root', 'inner' or 'leaf', ordered by id.
    SELECT id, 'leaf' AS node_type
    FROM nodes
    ORDER BY id;
reference_solutions:
  sql: |
    SELECT n.id,
           CASE
             WHEN n.parent_id IS NULL THEN 'root'
             WHEN EXISTS (SELECT 1 FROM nodes c WHERE c.parent_id = n.id) THEN 'inner'
             ELSE 'leaf'
           END AS node_type
    FROM nodes n
    ORDER BY n.id;
sql_setup: |
  CREATE TABLE nodes (
    id INTEGER PRIMARY KEY,
    parent_id INTEGER
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - two roots (one without children), inner nodes and leaves"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (1, NULL), (2, 1), (3, 1), (4, 2),
        (5, NULL), (6, 4);
    expected_rows:
      - [1, "root"]
      - [2, "inner"]
      - [3, "leaf"]
      - [4, "inner"]
      - [5, "root"]
      - [6, "leaf"]
  - id: t2
    ordered: true
    description: "Example 2 - a single node is a root"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (1, NULL);
    expected_rows: [[1, "root"]]
  - id: t3
    hidden: true
    ordered: true
    description: "Empty table"
    expected_rows: []
  - id: t4
    hidden: true
    ordered: true
    description: "Forest of lone roots only"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (3, NULL), (1, NULL), (2, NULL);
    expected_rows: [[1, "root"], [2, "root"], [3, "root"]]
  - id: t5
    hidden: true
    ordered: true
    description: "Chain root -> inner -> inner -> leaf"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (1, NULL), (2, 1), (3, 2), (4, 3);
    expected_rows:
      - [1, "root"]
      - [2, "inner"]
      - [3, "inner"]
      - [4, "leaf"]
  - id: t6
    hidden: true
    ordered: true
    description: "Star - a root with many leaves"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (10, NULL), (11, 10), (12, 10), (13, 10),
        (14, 10), (15, 10), (16, 10), (17, 10),
        (18, 10);
    expected_rows:
      - [10, "root"]
      - [11, "leaf"]
      - [12, "leaf"]
      - [13, "leaf"]
      - [14, "leaf"]
      - [15, "leaf"]
      - [16, "leaf"]
      - [17, "leaf"]
      - [18, "leaf"]
  - id: t7
    hidden: true
    ordered: true
    description: "Children with smaller ids than their parents, inserted out of order"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (9, NULL), (5, 9), (2, 5), (7, 9),
        (1, 2), (3, 2);
    expected_rows:
      - [1, "leaf"]
      - [2, "inner"]
      - [3, "leaf"]
      - [5, "inner"]
      - [7, "leaf"]
      - [9, "root"]
  - id: t8
    hidden: true
    ordered: true
    description: "NOT IN pitfall - roots make parent_id contain NULL; leaves must still be detected"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (1, NULL), (2, NULL), (3, 1), (4, 3),
        (5, 2), (6, 2);
    expected_rows:
      - [1, "root"]
      - [2, "root"]
      - [3, "inner"]
      - [4, "leaf"]
      - [5, "leaf"]
      - [6, "leaf"]
  - id: t9
    hidden: true
    ordered: true
    description: "Stress - 40 nodes, one deep tree plus two lone roots"
    setup_sql: |
      INSERT INTO nodes (id, parent_id) VALUES
        (1, NULL), (2, 1), (3, 2), (4, 2),
        (5, 2), (6, 3), (7, 3), (8, 3),
        (9, 4), (10, 4), (11, 4), (12, 5),
        (13, 5), (14, 5), (15, 6), (16, 6),
        (17, 6), (18, 7), (19, 7), (20, 7),
        (21, 8), (22, 8), (23, 8), (24, 9),
        (25, 9), (26, 9), (27, 10), (28, 10),
        (29, 10), (30, 11), (31, 11), (32, 11),
        (33, 12), (34, 12), (35, 12), (36, 13),
        (37, 13), (38, 13), (39, NULL), (40, NULL);
    expected_rows:
      - [1, "root"]
      - [2, "inner"]
      - [3, "inner"]
      - [4, "inner"]
      - [5, "inner"]
      - [6, "inner"]
      - [7, "inner"]
      - [8, "inner"]
      - [9, "inner"]
      - [10, "inner"]
      - [11, "inner"]
      - [12, "inner"]
      - [13, "inner"]
      - [14, "leaf"]
      - [15, "leaf"]
      - [16, "leaf"]
      - [17, "leaf"]
      - [18, "leaf"]
      - [19, "leaf"]
      - [20, "leaf"]
      - [21, "leaf"]
      - [22, "leaf"]
      - [23, "leaf"]
      - [24, "leaf"]
      - [25, "leaf"]
      - [26, "leaf"]
      - [27, "leaf"]
      - [28, "leaf"]
      - [29, "leaf"]
      - [30, "leaf"]
      - [31, "leaf"]
      - [32, "leaf"]
      - [33, "leaf"]
      - [34, "leaf"]
      - [35, "leaf"]
      - [36, "leaf"]
      - [37, "leaf"]
      - [38, "leaf"]
      - [39, "root"]
      - [40, "root"]
expected_concepts:
  - "CASE expression with ordered branches"
  - "EXISTS subquery (or LEFT JOIN with DISTINCT) to test for children"
  - "NULL semantics of NOT IN"
  - "adjacency-list trees"
optimal_complexity: {time: "O(n log n), or O(n) with an index on parent_id", space: "O(1) beyond the output"}
rubric:
  excellent: "Uses a CASE that checks parent_id IS NULL first and then EXISTS for children, orders by id, explains why NOT IN against parent_id breaks when roots exist and suggests an index on parent_id."
  good: "Correct after a hint about branch order for childless roots or about NULLs in NOT IN."
  weak: "Labels childless roots as leaves, uses NOT IN against a column containing NULL, or duplicates nodes by joining to every child."
  criteria:
    correctness: "All tests pass, including childless roots, chains, forests and children with smaller ids."
    efficiency: "A set-based query with an EXISTS or a grouped join; mentions an index on parent_id."
    code_quality: "A single readable CASE expression with clear labels."
    edge_cases: "Empty table, single node, forests of lone roots and deep chains."
    communication: "Explains three-valued logic in NOT IN and why the root check must come first."
hints:
  - "Each node needs two facts: whether it has a parent, and whether any other row names it as its parent."
  - "Combine the two facts in a CASE expression; consider which condition must be checked first so a root without children is not mistaken for a leaf, and how to test whether a child exists without multiplying rows."
  - "Use CASE WHEN parent_id IS NULL THEN 'root' WHEN EXISTS (a row whose parent_id equals this id) THEN 'inner' ELSE 'leaf' END, and order by id. Avoid id NOT IN (SELECT parent_id ...) because that list contains NULL."
followups:
  - "How would you also return each node's depth with a recursive CTE?"
  - "Why does id NOT IN (SELECT parent_id FROM nodes) return no rows at all here?"
  - "How would you detect a cycle if the data were not guaranteed to be a tree?"
common_errors:
  - "Using id NOT IN (SELECT parent_id FROM nodes) to find leaves, which yields no matches once any root has a NULL parent_id."
  - "Checking for children before checking for a parent, so a root with children is labelled inner."
  - "LEFT JOINing to children without DISTINCT or GROUP BY, which repeats a node once per child."
  - "Labelling a root without children as a leaf."
