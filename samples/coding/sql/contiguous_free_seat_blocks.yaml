version: 1
slug: contiguous_free_seat_blocks
title: Contiguous Free Seat Blocks
difficulty: medium
competency_keys: [sql, databases, problem_solving]
role_tags: [backend, fullstack, data]
time_limit_minutes: 20
prompt_markdown: |
  ## Contiguous Free Seat Blocks

  A venue booking tool offers a "seat our group together" option. To show it, the backend needs every
  block of **at least three adjacent free seats** in the same row. The current seat map is in table
  `seats`:

  | column | type | notes |
  |--------|------|-------|
  | row_label | VARCHAR(5) | row name such as `A`, `B` or `AA` |
  | seat_no | INTEGER | seat number within the row, `>= 1` |
  | is_free | INTEGER | `1` = free, `0` = sold or held |

  `(row_label, seat_no)` is the primary key. Seat numbers are **not always continuous**: a number that
  does not exist in a row (for example an aisle or a removed seat) separates the seats on either side
  of it. Two seats are adjacent only when they are in the **same row** and their numbers differ by
  exactly `1`.

  Return one row per maximal block of adjacent free seats that contains **3 or more** seats, with columns
  `row_label`, `first_seat`, `last_seat` and `block_size`. Order the rows by `row_label` ascending (plain
  text order), then by `first_seat` ascending. Return no rows when there is no such block.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  seats
  +-----------+---------+---------+
  | row_label | seat_no | is_free |
  +-----------+---------+---------+
  | A         | 1       | 1       |
  | A         | 2       | 1       |
  | A         | 3       | 1       |
  | A         | 4       | 0       |
  | A         | 5       | 1       |
  | A         | 6       | 1       |
  | B         | 1       | 0       |
  | B         | 2       | 1       |
  | B         | 3       | 1       |
  | B         | 4       | 1       |
  | B         | 5       | 1       |
  | B         | 6       | 0       |
  +-----------+---------+---------+

  Output
  +-----------+------------+-----------+------------+
  | row_label | first_seat | last_seat | block_size |
  +-----------+------------+-----------+------------+
  | A         | 1          | 3         | 3          |
  | B         | 2          | 5         | 4          |
  +-----------+------------+-----------+------------+
  Seats A5-A6 are free but only two long.
  ```

  ### Example 2
  ```
  seats
  +-----------+---------+---------+
  | row_label | seat_no | is_free |
  +-----------+---------+---------+
  | D         | 1       | 1       |
  | D         | 2       | 1       |
  | D         | 5       | 1       |
  | D         | 6       | 1       |
  | D         | 7       | 1       |
  | E         | 1       | 1       |
  | E         | 2       | 1       |
  | E         | 3       | 0       |
  +-----------+---------+---------+

  Output
  +-----------+------------+-----------+------------+
  | row_label | first_seat | last_seat | block_size |
  +-----------+------------+-----------+------------+
  | D         | 5          | 7         | 3          |
  +-----------+------------+-----------+------------+
  Row D has no seats 3 and 4, so D1-D2 and D5-D7 are separate blocks.
  ```

  ### Constraints
  - `0 <= rows in seats <= 10^5`
  - `1 <= seat_no <= 10^4`; `is_free` is always `0` or `1`.
languages: [sql]
starter_code:
  sql: |
    -- Return row_label, first_seat, last_seat, block_size for every run of 3+ adjacent free seats.
    SELECT row_label, MIN(seat_no) AS first_seat, MAX(seat_no) AS last_seat, COUNT(*) AS block_size
    FROM seats
    WHERE is_free = 1
    GROUP BY row_label
    ORDER BY row_label, first_seat;
reference_solutions:
  sql: |
    WITH free_seats AS (
      SELECT
        row_label,
        seat_no,
        seat_no - ROW_NUMBER() OVER (PARTITION BY row_label ORDER BY seat_no) AS island
      FROM seats
      WHERE is_free = 1
    )
    SELECT
      row_label,
      MIN(seat_no) AS first_seat,
      MAX(seat_no) AS last_seat,
      COUNT(*) AS block_size
    FROM free_seats
    GROUP BY row_label, island
    HAVING COUNT(*) >= 3
    ORDER BY row_label, first_seat;
sql_setup: |
  CREATE TABLE seats (
    row_label VARCHAR(5) NOT NULL,
    seat_no INTEGER NOT NULL,
    is_free INTEGER NOT NULL,
    PRIMARY KEY (row_label, seat_no)
  );
tests:
  - id: t1
    description: "Example 1 - one block per row, a two-seat run is too short"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES
        ('A', 1, 1), ('A', 2, 1), ('A', 3, 1), ('A', 4, 0), ('A', 5, 1), ('A', 6, 1),
        ('B', 1, 0), ('B', 2, 1), ('B', 3, 1), ('B', 4, 1), ('B', 5, 1), ('B', 6, 0);
    expected_rows: [["A", 1, 3, 3], ["B", 2, 5, 4]]
  - id: t2
    description: "Example 2 - missing seat numbers split a block"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES
        ('D', 1, 1), ('D', 2, 1), ('D', 5, 1), ('D', 6, 1), ('D', 7, 1),
        ('E', 1, 1), ('E', 2, 1), ('E', 3, 0);
    expected_rows: [["D", 5, 7, 3]]
  - id: t3
    hidden: true
    description: "Empty seat map"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Sold-out venue - no free seats at all"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES ('A', 1, 0), ('A', 2, 0), ('A', 3, 0), ('B', 1, 0), ('B', 2, 0);
    expected_rows: []
  - id: t5
    hidden: true
    description: "Whole row free plus a single-seat row - exactly one block"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES
        ('C', 1, 1), ('C', 2, 1), ('C', 3, 1), ('C', 4, 1), ('C', 5, 1), ('C', 6, 1), ('C', 7, 1), ('C', 8, 1), ('C', 9, 1), ('C', 10, 1),
        ('D', 1, 1);
    expected_rows: [["C", 1, 10, 10]]
  - id: t6
    hidden: true
    description: "Blocks must not join across rows even when seat numbers continue (A5-A6 and B7-B8)"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES
        ('A', 1, 0), ('A', 2, 0), ('A', 3, 0), ('A', 4, 0), ('A', 5, 1), ('A', 6, 1),
        ('B', 7, 1), ('B', 8, 1), ('B', 9, 0), ('B', 10, 0), ('B', 11, 0), ('B', 12, 0);
    expected_rows: []
  - id: t7
    hidden: true
    description: "Boundary 2 versus 3 free seats, several blocks in one row, rows inserted out of order"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES
        ('F', 9, 1), ('F', 8, 1), ('F', 7, 1), ('F', 6, 0), ('F', 5, 1), ('F', 4, 1), ('F', 3, 0),
        ('F', 2, 1), ('F', 1, 1), ('F', 10, 0), ('F', 11, 1), ('F', 12, 1), ('F', 13, 1), ('F', 14, 1);
    expected_rows: [["F", 7, 9, 3], ["F", 11, 14, 4]]
  - id: t8
    hidden: true
    description: "Text ordering of row labels - AA sorts before B"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES
        ('B', 1, 1), ('B', 2, 1), ('B', 3, 1),
        ('AA', 4, 1), ('AA', 5, 1), ('AA', 6, 1), ('AA', 7, 1),
        ('A', 20, 1), ('A', 21, 1), ('A', 22, 1);
    expected_rows: [["A", 20, 22, 3], ["AA", 4, 7, 4], ["B", 1, 3, 3]]
  - id: t9
    hidden: true
    description: "40-seat row with mixed runs of length 1-7"
    ordered: true
    setup_sql: |
      INSERT INTO seats (row_label, seat_no, is_free) VALUES
        ('K', 1, 1), ('K', 2, 1), ('K', 3, 1), ('K', 4, 0), ('K', 5, 1), ('K', 6, 1), ('K', 7, 1), ('K', 8, 1),
        ('K', 9, 0), ('K', 10, 1), ('K', 11, 1), ('K', 12, 0), ('K', 13, 0), ('K', 14, 1), ('K', 15, 1), ('K', 16, 1),
        ('K', 17, 1), ('K', 18, 1), ('K', 19, 0), ('K', 20, 1), ('K', 21, 0), ('K', 22, 1), ('K', 23, 1), ('K', 24, 1),
        ('K', 25, 1), ('K', 26, 1), ('K', 27, 1), ('K', 28, 1), ('K', 29, 0), ('K', 30, 0), ('K', 31, 0), ('K', 32, 1),
        ('K', 33, 1), ('K', 34, 0), ('K', 35, 1), ('K', 36, 1), ('K', 37, 1), ('K', 38, 0), ('K', 39, 1), ('K', 40, 1);
    expected_rows: 
      - ["K", 1, 3, 3]
      - ["K", 5, 8, 4]
      - ["K", 14, 18, 5]
      - ["K", 22, 28, 7]
      - ["K", 35, 37, 3]
expected_concepts:
  - gaps-and-islands with value minus ROW_NUMBER()
  - PARTITION BY to keep islands inside one row
  - filtering groups with HAVING
  - treating missing keys as breaks in a sequence
optimal_complexity: {time: "O(n log n) for ordering seats within each row", space: O(n)}
rubric:
  excellent: Filters free seats, computes seat_no - ROW_NUMBER() partitioned by row as an island key, groups by row and island, keeps groups with HAVING COUNT(*) >= 3 and explains why missing seat numbers and row boundaries split islands automatically.
  good: Reaches the gaps-and-islands query after a hint, or uses a correct but heavier self-join or LAG-based run-start approach.
  weak: Groups whole rows, forgets to partition the ROW_NUMBER by row, treats missing seat numbers as adjacent, or counts sold seats.
  criteria:
    correctness: All tests pass, including missing seat numbers, cross-row continuation and the 2-versus-3 boundary.
    efficiency: One window pass over free seats rather than nested correlated subqueries per seat.
    code_quality: Clear island key name, readable CTE and explicit ORDER BY.
    edge_cases: Empty or sold-out venue, a fully free row, rows with one seat and unusual row labels.
    communication: Explains why seat_no - ROW_NUMBER() is constant inside a run of consecutive numbers.
hints:
  - Only free seats matter; think about how to label each free seat with the run of consecutive numbers it belongs to.
  - Inside a run of consecutive seat numbers, the seat number and its position among the row's free seats both grow by one at a time, so their difference stays constant and changes whenever a run breaks.
  - Keep free seats, compute seat_no minus ROW_NUMBER() OVER (PARTITION BY row_label ORDER BY seat_no) as a group key, group by row_label and that key, keep groups with at least three seats and report MIN, MAX and COUNT ordered by row and first seat.
followups:
  - How would you return only the single best block for a party of N, preferring rows closer to the stage?
  - How would you solve it without window functions?
  - What index supports this query on a seat map that changes every second?
common_errors:
  - Computing ROW_NUMBER over the whole table instead of per row, letting blocks join across rows.
  - Numbering all seats instead of only free seats, so the difference does not change at sold seats.
  - Treating the next existing seat number as adjacent even when numbers are missing.
  - Forgetting the HAVING filter, returning one- and two-seat runs.
