version: 1
slug: catalog_page_with_stable_sort
title: Catalog Page with Stable Sort
difficulty: easy
competency_keys: [sql, databases]
role_tags: [backend, fullstack]
time_limit_minutes: 12
prompt_markdown: |
  ## Catalog Page with Stable Sort

  The storefront lists products **most expensive first**, three per page. Shoppers reported that some
  products appeared on two pages while others never appeared at all: many products share a price, and
  the database is free to return equally priced rows in any order, which can differ from one query to
  the next.

  The fix is a total order: sort by `price_cents` descending and, among products with the **same price,
  by `id` descending** (newer listings first). Because `id` is unique, every product has exactly one
  position.

  Table `products`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key; higher means listed more recently |
  | name | VARCHAR(100) | display name, not unique |
  | price_cents | INTEGER | price in cents, `>= 0` |

  Return **page 2** of this listing, that is positions 4, 5 and 6, with columns `id`, `name`,
  `price_cents` in listing order. If the catalog has fewer than six products the page is shorter, and if
  it has three or fewer products the page is empty.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  products
  +----+----------------+-------------+
  | id | name           | price_cents |
  +----+----------------+-------------+
  | 1  | Standing desk  | 45000       |
  | 2  | Office chair   | 30000       |
  | 3  | Desk lamp      | 4500        |
  | 4  | Monitor arm    | 12000       |
  | 5  | Footrest       | 4500        |
  | 6  | Cable tray     | 4500        |
  | 7  | Whiteboard     | 12000       |
  | 8  | Pen holder     | 1500        |
  +----+----------------+-------------+

  Output
  +----+-------------+-------------+
  | id | name        | price_cents |
  +----+-------------+-------------+
  | 4  | Monitor arm | 12000       |
  | 6  | Cable tray  | 4500        |
  | 5  | Footrest    | 4500        |
  +----+-------------+-------------+
  Page 1 is Standing desk (1), Office chair (2), Whiteboard (7); the 12000 tie puts id 7 before id 4.
  ```

  ### Example 2
  ```
  products
  +----+-------------+-------------+
  | id | name        | price_cents |
  +----+-------------+-------------+
  | 1  | Desk lamp   | 4500        |
  | 2  | Footrest    | 4500        |
  | 3  | Pen holder  | 1500        |
  | 4  | Cable tray  | 4500        |
  +----+-------------+-------------+

  Output
  +----+------------+-------------+
  | id | name       | price_cents |
  +----+------------+-------------+
  | 3  | Pen holder | 1500        |
  +----+------------+-------------+
  ```

  ### Constraints
  - `id` values are unique; prices are non-negative integers.
  - The table may hold any number of products, including none.
  - Use a fixed page size of 3 and return page 2 only.
languages: [sql]
starter_code:
  sql: |
    -- Return id, name, price_cents for page 2 (positions 4-6) of the price-descending listing.
    SELECT id, name, price_cents
    FROM products
    LIMIT 3;
reference_solutions:
  sql: |
    SELECT id, name, price_cents
    FROM products
    ORDER BY price_cents DESC, id DESC
    LIMIT 3 OFFSET 3;
sql_setup: |
  CREATE TABLE products (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL,
    price_cents INTEGER NOT NULL
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - ties at 12000 and 4500 straddle the page boundary"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES
        (1, 'Standing desk', 45000), (2, 'Office chair', 30000), (3, 'Desk lamp', 4500), (4, 'Monitor arm', 12000),
        (5, 'Footrest', 4500), (6, 'Cable tray', 4500), (7, 'Whiteboard', 12000), (8, 'Pen holder', 1500);
    expected_rows: [[4, "Monitor arm", 12000], [6, "Cable tray", 4500], [5, "Footrest", 4500]]
  - id: t2
    ordered: true
    description: "Example 2 - four products, page 2 holds one row"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES
        (1, 'Desk lamp', 4500), (2, 'Footrest', 4500), (3, 'Pen holder', 1500), (4, 'Cable tray', 4500);
    expected_rows: [[3, "Pen holder", 1500]]
  - id: t3
    hidden: true
    ordered: true
    description: "Empty catalog - empty page"
    expected_rows: []
  - id: t4
    hidden: true
    ordered: true
    description: "Exactly three products - page 2 is empty"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES (1, 'Mug', 900), (2, 'Coaster', 300), (3, 'Tray', 1800);
    expected_rows: []
  - id: t5
    hidden: true
    ordered: true
    description: "All prices equal - order is purely id descending (omitting the tie-break gives id ascending on SQLite)"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES
        (1, 'Sticker A', 200), (2, 'Sticker B', 200), (3, 'Sticker C', 200), (4, 'Sticker D', 200),
        (5, 'Sticker E', 200), (6, 'Sticker F', 200), (7, 'Sticker G', 200), (8, 'Sticker H', 200);
    expected_rows: [[5, "Sticker E", 200], [4, "Sticker D", 200], [3, "Sticker C", 200]]
  - id: t6
    hidden: true
    ordered: true
    description: "Exactly six products with distinct prices inserted out of order - page 2 is positions 4-6"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES
        (10, 'Router', 8900), (11, 'Switch', 15900), (12, 'Patch cable', 400), (13, 'Rack shelf', 5200),
        (14, 'Access point', 12900), (15, 'Cable tester', 2600);
    expected_rows: [[13, "Rack shelf", 5200], [15, "Cable tester", 2600], [12, "Patch cable", 400]]
  - id: t7
    hidden: true
    ordered: true
    description: "Free items (price 0) sort last; duplicate names are separate products"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES
        (1, 'Sample pack', 0), (2, 'Gift card', 5000), (3, 'Sample pack', 0), (4, 'Gift card', 2500),
        (5, 'Gift card', 1000), (6, 'Sample pack', 0), (7, 'Gift card', 5000);
    expected_rows: [[5, "Gift card", 1000], [6, "Sample pack", 0], [3, "Sample pack", 0]]
  - id: t8
    hidden: true
    ordered: true
    description: "Larger catalog with gaps in ids - page 2 takes one distinct price plus the two newest of a five-way tie"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES
        (3, 'Laptop stand', 3900), (9, 'Webcam', 6900), (14, 'Laptop sleeve', 3900), (21, 'USB hub', 3900),
        (22, 'Headset', 9900), (30, 'Docking station', 18900), (31, 'Phone stand', 3900), (40, 'Keyboard', 3900),
        (41, 'Mouse', 2900), (55, 'Monitor', 21900);
    expected_rows: [[9, "Webcam", 6900], [40, "Keyboard", 3900], [31, "Phone stand", 3900]]
  - id: t9
    hidden: true
    ordered: true
    description: "Prices near the 32-bit limit with ties inside page 1 and inside page 2"
    setup_sql: |
      INSERT INTO products (id, name, price_cents) VALUES
        (1, 'Server rack', 2000000000), (2, 'Storage array', 1999999999), (3, 'Core switch', 1500000000),
        (4, 'Firewall', 1500000000), (5, 'UPS unit', 300000000), (6, 'Blade chassis', 1999999999), (7, 'PDU', 100);
    expected_rows: [[4, "Firewall", 1500000000], [3, "Core switch", 1500000000], [5, "UPS unit", 300000000]]
expected_concepts:
  - "ORDER BY with a unique tie-breaker for deterministic results"
  - "LIMIT and OFFSET arithmetic for page N"
  - "mixed sort directions in one ORDER BY"
  - "keyset pagination as an alternative to OFFSET"
optimal_complexity: {time: "O(n log n) without an index; O(page offset + page size) with an index on (price_cents DESC, id DESC)", space: "O(1) beyond the sort"}
rubric:
  excellent: "Writes ORDER BY price_cents DESC, id DESC LIMIT 3 OFFSET 3, explains that without a unique tie-breaker the database may return ties in a different order per query, and proposes keyset pagination with a composite index for deep pages."
  good: "Correct query after a hint about the tie-break or the offset value."
  weak: "Sorts only by price, uses OFFSET 6 or 4, or sorts ties by id ascending."
  criteria:
    correctness: "All tests pass, including tie groups across page boundaries and short catalogs."
    efficiency: "A single sorted query; mentions a composite index and the cost of large offsets."
    code_quality: "Explicit sort directions on both keys and the exact output columns."
    edge_cases: "Empty, three-item and exactly six-item catalogs, all-equal prices and price 0."
    communication: "Explains why non-deterministic ordering breaks pagination."
hints:
  - "Pagination is only stable when every row has exactly one position, so ask what decides the order between two products with the same price."
  - "Add the unique id as a second sort key in the direction the statement asks for, then skip page 1."
  - "Order by price_cents descending and then by id descending so newer listings come first among equal prices, then skip the first three rows with OFFSET 3 and take the next three with LIMIT 3; a short catalog simply yields fewer rows."
followups:
  - "How would you fetch page 2 with keyset pagination instead of OFFSET?"
  - "Which index makes deep pages cheap, and why does OFFSET still get slower?"
  - "What happens to pagination if a product's price changes while a shopper is paging?"
common_errors:
  - "Sorting only by price, so equally priced products can repeat or disappear across pages."
  - "Using OFFSET 6 (page 3) or OFFSET 4 (an off-by-one) instead of OFFSET 3."
  - "Breaking ties by id ascending instead of the required id descending."
