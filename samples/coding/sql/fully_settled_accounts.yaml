version: 1
slug: fully_settled_accounts
title: "Fully Settled Accounts"
difficulty: easy
competency_keys: [sql, databases]
role_tags: [business_analyst, backend, data_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Fully Settled Accounts

  Before closing the month, the billing team wants to know which customer accounts are completely
  settled so it can stop sending payment reminders to them.

  Table `invoices`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | account_id | INTEGER | the billed account |
  | status | VARCHAR(10) | exactly one of `'paid'`, `'open'`, `'void'` |

  A **void** invoice was cancelled and is ignored completely. An account is **fully settled** when,
  after ignoring void invoices, it still has **at least one** invoice and **none** of those invoices
  is `'open'`. An account whose invoices are all void is therefore **not** settled.

  Return one column, `account_id`, with one row per fully settled account, ordered by `account_id`
  ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  invoices
  +----+------------+--------+
  | id | account_id | status |
  +----+------------+--------+
  | 1  | 10         | paid   |
  | 2  | 10         | paid   |
  | 3  | 20         | paid   |
  | 4  | 20         | open   |
  | 5  | 30         | void   |
  | 6  | 40         | void   |
  | 7  | 40         | paid   |
  | 8  | 50         | open   |
  +----+------------+--------+

  Output
  +------------+
  | account_id |
  +------------+
  | 10         |
  | 40         |
  +------------+
  ```
  Account 20 still has an open invoice, account 30 only has a void invoice and account 50 is open.
  Account 40's void invoice is ignored, leaving one paid invoice.

  ### Example 2
  ```
  invoices
  +----+------------+--------+
  | id | account_id | status |
  +----+------------+--------+
  | 1  | 5          | paid   |
  | 2  | 3          | paid   |
  | 3  | 3          | void   |
  +----+------------+--------+

  Output
  +------------+
  | account_id |
  +------------+
  | 3          |
  | 5          |
  +------------+
  ```

  ### Constraints
  - `0 <= rows in invoices <= 10^5`
  - `status` is always one of the three lowercase values above.
  - The output order is part of the answer.
languages: [sql]
starter_code:
  sql: |
    -- Accounts with at least one non-void invoice and no open invoice, ordered by account_id.
    SELECT DISTINCT account_id
    FROM invoices
    ORDER BY account_id;
reference_solutions:
  sql: |
    SELECT account_id
    FROM invoices
    WHERE status <> 'void'
    GROUP BY account_id
    HAVING SUM(CASE WHEN status = 'open' THEN 1 ELSE 0 END) = 0
    ORDER BY account_id;
sql_setup: |
  CREATE TABLE invoices (
    id INTEGER PRIMARY KEY,
    account_id INTEGER NOT NULL,
    status VARCHAR(10) NOT NULL
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - paid-only, open, void-only and paid-plus-void accounts"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 10, 'paid'), (2, 10, 'paid'), (3, 20, 'paid'), (4, 20, 'open'),
        (5, 30, 'void'), (6, 40, 'void'), (7, 40, 'paid'), (8, 50, 'open');
    expected_rows: [[10], [40]]
  - id: t2
    ordered: true
    description: "Example 2 - output ordered by account_id, not insertion order"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 5, 'paid'), (2, 3, 'paid'), (3, 3, 'void');
    expected_rows: [[3], [5]]
  - id: t3
    hidden: true
    ordered: true
    description: "Empty table"
    expected_rows: []
  - id: t4
    hidden: true
    ordered: true
    description: "Only void invoices - no account is settled"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 1, 'void'), (2, 1, 'void'), (3, 2, 'void');
    expected_rows: []
  - id: t5
    hidden: true
    ordered: true
    description: "Open plus void (no paid) is not settled"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 7, 'open'), (2, 7, 'void');
    expected_rows: []
  - id: t6
    hidden: true
    ordered: true
    description: "Single paid invoice"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 42, 'paid');
    expected_rows: [[42]]
  - id: t7
    hidden: true
    ordered: true
    description: "An open invoice among many paid ones disqualifies the account"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 9, 'paid'), (2, 9, 'paid'), (3, 9, 'paid'), (4, 9, 'open'),
        (5, 9, 'paid'), (6, 8, 'paid'), (7, 8, 'paid');
    expected_rows: [[8]]
  - id: t8
    hidden: true
    ordered: true
    description: "Large account ids, all three statuses on one account, duplicates of paid"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 900000001, 'paid'), (2, 900000001, 'void'), (3, 900000001, 'open'), (4, 900000002, 'paid'),
        (5, 900000002, 'paid'), (6, 100, 'void'), (7, 100, 'paid'), (8, 100, 'void');
    expected_rows: [[100], [900000002]]
  - id: t9
    hidden: true
    ordered: true
    description: "Twelve accounts in a mixed batch"
    setup_sql: |
      INSERT INTO invoices (id, account_id, status) VALUES
        (1, 12, 'paid'), (2, 11, 'open'), (3, 10, 'void'), (4, 9, 'paid'),
        (5, 8, 'paid'), (6, 8, 'open'), (7, 7, 'void'), (8, 7, 'void'),
        (9, 6, 'paid'), (10, 5, 'open'), (11, 4, 'paid'), (12, 4, 'void'),
        (13, 3, 'void'), (14, 3, 'open'), (15, 2, 'paid'), (16, 1, 'paid'),
        (17, 1, 'paid');
    expected_rows:
      - [1]
      - [2]
      - [4]
      - [6]
      - [9]
      - [12]
expected_concepts:
  - "GROUP BY with a HAVING condition over the whole group"
  - "conditional aggregation (SUM of CASE)"
  - "filtering rows before grouping versus filtering groups"
  - "relational division style 'for all' conditions"
optimal_complexity: {time: "O(n log n) for the grouping, or O(n) with hashing", space: "O(a) for a distinct accounts"}
rubric:
  excellent: "Removes void invoices in WHERE, groups by account and keeps groups with zero open invoices via conditional aggregation in HAVING, explaining why the WHERE filter also excludes void-only accounts."
  good: "Correct after a hint about void-only accounts or about checking every invoice of the group rather than single rows."
  weak: "Filters status = 'paid' row by row (returning accounts that also have open invoices), returns void-only accounts or returns duplicate account ids."
  criteria:
    correctness: "All tests pass, including void-only accounts, open-plus-void accounts and duplicates."
    efficiency: "One grouping pass; no per-account correlated subqueries needed (NOT EXISTS is acceptable)."
    code_quality: "A readable HAVING condition and a single output column with the requested name."
    edge_cases: "Empty table, void-only accounts, accounts mixing all three statuses and large ids."
    communication: "Explains the difference between filtering rows with WHERE and filtering groups with HAVING."
hints:
  - "The decision is about all of an account's invoices together, not about any single row; think of one group per account."
  - "Drop the invoices that should be ignored before grouping, so an account with only those has no group at all, then test a condition across each remaining group."
  - "Filter WHERE status <> 'void', GROUP BY account_id, and keep groups where the count of rows with status 'open' (a SUM over a CASE expression) is zero; order by account_id."
followups:
  - "How would you write the same query with NOT EXISTS, and when could it be faster?"
  - "How would you also return the total paid amount per settled account if invoices had an amount column?"
  - "What index would help this report on a table with hundreds of millions of invoices?"
common_errors:
  - "Selecting accounts WHERE status = 'paid', which also returns accounts that have open invoices."
  - "Counting void invoices toward 'at least one invoice', which returns accounts with only void invoices."
  - "Filtering with HAVING on a non-aggregated column, which is invalid in standard SQL."
  - "Forgetting DISTINCT or GROUP BY so an account appears once per invoice."
