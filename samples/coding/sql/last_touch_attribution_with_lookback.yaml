expected_concepts:
  - "range join on visitor and a day window (BETWEEN with an offset)"
  - "picking one row per group with ROW_NUMBER and a tie-breaking ORDER BY"
  - "LEFT JOIN plus COALESCE to keep unmatched conversions as direct"
  - "aggregating after attribution, with a deterministic ORDER BY"
optimal_complexity: {time: "O(n log n) with an index on touches (visitor_id, day_no); one ranked row per conversion", space: "O(m) for the credited conversions"}
rubric:
  excellent: "Joins conversions to eligible touches with both window ends inclusive, picks one touch per conversion with ROW_NUMBER ordered by day then id, keeps unmatched conversions as direct through a LEFT JOIN, and explains why aggregating before choosing the winner double-counts."
  good: "Correct after a hint about the tie-breaker, the inclusive window edges or keeping conversions that have no eligible touch."
  weak: "Credits every eligible touch (counting a conversion several times), drops direct conversions with an inner join, uses MAX(day_no) without resolving same-day ties, or ignores the lookback window."
  criteria:
    correctness: "All tests pass, including the 7-day edge, same-day ties, repeat conversions and conversions without touches."
    efficiency: "Set-based query with a single ranking pass; mentions an index on touches (visitor_id, day_no)."
    code_quality: "Readable CTEs that separate eligibility, winner selection and counting, with the exact output column names."
    edge_cases: "Empty tables, touches after the conversion, other visitors' touches and count ties."
    communication: "Explains why each conversion must be resolved to exactly one touch before counting."
hints:
  - "Work per conversion first: decide which single touch (or none) gets the credit, and only then count credits per campaign."
  - "The eligible touches of a conversion are those of the same visitor whose day lies in the seven days up to and including the conversion day; rank them so the latest day comes first and, within a day, the highest id comes first."
  - "Join conversions to touches on visitor and the inclusive day range, number the matches per conversion with a window function ordered by day descending then id descending, keep number one through a left join from conversions so unmatched ones survive, replace a missing campaign with the word direct, then group by campaign and sort by the count descending and the name."
followups:
  - "How would you switch to a position-based model that splits credit between the first and last touch?"
  - "Which index would make the range join fast on hundreds of millions of touches?"
  - "How would the query change if the lookback window differed per campaign?"
common_errors:
  - "Counting every eligible touch, so one conversion is credited to several campaigns."
  - "Using an inner join, which silently drops direct conversions."
  - "Off-by-one on the window: excluding the touch exactly 7 days earlier or including touches after the conversion."
  - "Taking MAX(day_no) and joining back, which returns several rows when two touches share the latest day."
