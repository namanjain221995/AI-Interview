version: 1
slug: last_touch_attribution_with_lookback
title: "Last-Touch Attribution with Lookback"
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data_analyst, product_manager, data_scientist]
time_limit_minutes: 22
prompt_markdown: |
  ## Last-Touch Attribution with Lookback

  The growth team is deciding where to spend next quarter's marketing budget and wants a simple
  last-touch report: which campaign gets the credit for each sign-up. The tracking pipeline stores
  every ad interaction and every sign-up, with dates already converted to a day number (days since
  the product launched) so no date functions are needed.

  Table `touches` (one row per ad click or email open):

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key; a higher id was recorded later |
  | visitor_id | VARCHAR(40) | anonymous visitor identifier |
  | campaign | VARCHAR(40) | lower-case campaign name, never `'direct'` |
  | day_no | INTEGER | day of the touch, `>= 0` |

  Table `conversions` (one row per sign-up):

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | visitor_id | VARCHAR(40) | the visitor who signed up |
  | day_no | INTEGER | day of the sign-up, `>= 0` |

  Credit each conversion to exactly one campaign:

  - Only touches of the **same visitor** inside the **7-day lookback window** are eligible: the
    touch's `day_no` must be between `conversion.day_no - 7` and `conversion.day_no`, both ends
    included (a touch on the conversion day counts; a touch after it never does).
  - Among eligible touches, the one with the **latest `day_no`** wins; if several share that day, the
    one with the **highest `id`** wins.
  - A conversion without any eligible touch is credited to the campaign `'direct'`.

  Return one row per campaign that received at least one conversion, with the columns `campaign` and
  `conversion_count`, ordered by `conversion_count` descending, then `campaign` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  touches
  +----+------------+------------+--------+
  | id | visitor_id | campaign   | day_no |
  +----+------------+------------+--------+
  | 1  | v1         | search     | 10     |
  | 2  | v1         | newsletter | 14     |
  | 3  | v2         | social     | 3      |
  | 4  | v3         | search     | 20     |
  | 5  | v1         | social     | 19     |
  | 6  | v4         | newsletter | 12     |
  +----+------------+------------+--------+

  conversions
  +----+------------+--------+
  | id | visitor_id | day_no |
  +----+------------+--------+
  | 1  | v1         | 16     |
  | 2  | v2         | 10     |
  | 3  | v3         | 12     |
  | 4  | v5         | 5      |
  | 5  | v4         | 20     |
  | 6  | v1         | 21     |
  +----+------------+--------+

  Output
  +------------+------------------+
  | campaign   | conversion_count |
  +------------+------------------+
  | direct     | 3                |
  | social     | 2                |
  | newsletter | 1                |
  +------------+------------------+
  Conversion 1 (day 16): v1's touches on days 10 and 14 are eligible; day 14 (newsletter) is latest.
  Conversion 2 (day 10): v2's touch on day 3 is exactly 7 days earlier, so it counts.
  Conversion 3: v3's only touch (day 20) is after the sign-up. Conversion 4: v5 has no touches.
  Conversion 5 (day 20): v4's touch on day 12 is 8 days earlier, outside the window.
  Conversion 6 (day 21): v1's touches on days 14 and 19 are eligible; day 19 (social) is latest.
  ```

  ### Example 2
  ```
  touches
  +----+------------+----------+--------+
  | id | visitor_id | campaign | day_no |
  +----+------------+----------+--------+
  | 1  | a1         | email    | 5      |
  | 2  | a1         | partner  | 5      |
  | 3  | a2         | partner  | 8      |
  | 4  | a2         | email    | 8      |
  +----+------------+----------+--------+

  conversions
  +----+------------+--------+
  | id | visitor_id | day_no |
  +----+------------+--------+
  | 1  | a1         | 5      |
  | 2  | a2         | 9      |
  | 3  | a1         | 13     |
  +----+------------+--------+

  Output
  +----------+------------------+
  | campaign | conversion_count |
  +----------+------------------+
  | direct   | 1                |
  | email    | 1                |
  | partner  | 1                |
  +----------+------------------+
  a1 converts on day 5: touches 1 and 2 are both on day 5, so the higher id (2, partner) wins.
  a2 converts on day 9: touches 3 and 4 share day 8, so touch 4 (email) wins.
  a1's second conversion on day 13 has no touch in days 6..13, so it is direct.
  ```

  ### Constraints
  - Each table has at most `10^6` rows; either table may be empty.
  - `0 <= day_no <= 10^6`
  - A visitor can convert several times; every conversion is credited separately.
languages: [sql]
starter_code:
  sql: |
    -- Return campaign and conversion_count (last eligible touch within 7 days, else 'direct'),
    -- ordered by conversion_count DESC, campaign.
    SELECT t.campaign, COUNT(*) AS conversion_count
    FROM conversions c
    JOIN touches t ON t.visitor_id = c.visitor_id
    GROUP BY t.campaign
    ORDER BY conversion_count DESC, t.campaign;
reference_solutions:
  sql: |
    WITH eligible AS (
      SELECT c.id AS conversion_id,
             t.campaign,
             ROW_NUMBER() OVER (
               PARTITION BY c.id
               ORDER BY t.day_no DESC, t.id DESC
             ) AS rn
      FROM conversions c
      JOIN touches t
        ON t.visitor_id = c.visitor_id
       AND t.day_no BETWEEN c.day_no - 7 AND c.day_no
    ),
    credited AS (
      SELECT COALESCE(e.campaign, 'direct') AS campaign
      FROM conversions c
      LEFT JOIN eligible e
        ON e.conversion_id = c.id
       AND e.rn = 1
    )
    SELECT campaign, COUNT(*) AS conversion_count
    FROM credited
    GROUP BY campaign
    ORDER BY conversion_count DESC, campaign;
sql_setup: |
  CREATE TABLE touches (
    id INTEGER PRIMARY KEY,
    visitor_id VARCHAR(40) NOT NULL,
    campaign VARCHAR(40) NOT NULL,
    day_no INTEGER NOT NULL
  );
  CREATE TABLE conversions (
    id INTEGER PRIMARY KEY,
    visitor_id VARCHAR(40) NOT NULL,
    day_no INTEGER NOT NULL
  );
