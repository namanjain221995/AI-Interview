version: 1
slug: latency_spike_vs_trailing_window
title: Latency Spikes vs Trailing Window
difficulty: medium
competency_keys: [sql, databases]
role_tags: [sre, data_scientist, backend]
time_limit_minutes: 25
prompt_markdown: |
  ## Latency Spikes vs Trailing Window

  An API gateway exports one p95 latency sample per endpoint per collection cycle into table
  `latency_samples`:

  | column | type | notes |
  |--------|------|-------|
  | endpoint | VARCHAR(80) | route, for example `/checkout` |
  | seq | INTEGER | sample number within the endpoint; `(endpoint, seq)` is the primary key |
  | p95_ms | INTEGER | p95 latency of the cycle in milliseconds |

  Sequence numbers grow over time but **can have gaps** (a cycle that failed to export leaves no row).
  The "previous samples" of a sample are the stored rows of the **same endpoint** with smaller `seq`,
  nearest first, regardless of gaps.

  A sample is a **spike** when its `p95_ms` is **strictly greater than twice the average of exactly
  the 3 previous samples** of its endpoint. To avoid rounding, compare in integers: with
  `trailing_sum` = the sum of those 3 previous `p95_ms` values, the sample is a spike when
  `p95_ms * 3 > 2 * trailing_sum`. A sample with fewer than 3 previous samples is never a spike.
  Spikes stay in the history: a spike is one of the 3 previous samples of the samples that follow it.

  Return `endpoint`, `seq`, `p95_ms` and `trailing_sum` for every spike, ordered by `endpoint`
  ascending and then `seq` ascending. Return no rows when there are no spikes.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  latency_samples
  +-----------+-----+--------+
  | endpoint  | seq | p95_ms |
  +-----------+-----+--------+
  | /checkout | 1   | 100    |
  | /checkout | 2   | 110    |
  | /checkout | 3   | 90     |
  | /checkout | 4   | 250    |
  | /checkout | 5   | 120    |
  | /checkout | 6   | 400    |
  | /search   | 1   | 50     |
  | /search   | 2   | 500    |
  | /search   | 3   | 60     |
  +-----------+-----+--------+

  Output
  +-----------+-----+--------+--------------+
  | endpoint  | seq | p95_ms | trailing_sum |
  +-----------+-----+--------+--------------+
  | /checkout | 4   | 250    | 300          |
  | /checkout | 6   | 400    | 460          |
  +-----------+-----+--------+--------------+
  /checkout seq 5: 120 * 3 = 360 is not greater than 2 * (110 + 90 + 250) = 900.
  /search never has 3 previous samples, so 500 is not reported.
  ```

  ### Example 2
  ```
  latency_samples
  +----------+-----+--------+
  | endpoint | seq | p95_ms |
  +----------+-----+--------+
  | /login   | 1   | 10     |
  | /login   | 5   | 20     |
  | /login   | 9   | 30     |
  | /login   | 20  | 40     |
  | /login   | 21  | 121    |
  +----------+-----+--------+

  Output
  +----------+-----+--------+--------------+
  | endpoint | seq | p95_ms | trailing_sum |
  +----------+-----+--------+--------------+
  | /login   | 21  | 121    | 90           |
  +----------+-----+--------+--------------+
  seq 20 is exactly twice the average (40 * 3 = 120 = 2 * 60), which is not strictly greater.
  ```

  ### Constraints
  - `0 <= rows in latency_samples <= 10^6`
  - `0 <= p95_ms <= 10^6`
  - Each `(endpoint, seq)` pair appears at most once.
languages: [sql]
starter_code:
  sql: |
    -- Samples whose p95 is more than twice the average of the 3 previous samples of the same endpoint.
    SELECT endpoint, seq, p95_ms, 0 AS trailing_sum
    FROM latency_samples
    ORDER BY endpoint, seq;
reference_solutions:
  sql: |
    WITH windowed AS (
      SELECT
        endpoint,
        seq,
        p95_ms,
        SUM(p95_ms) OVER (
          PARTITION BY endpoint ORDER BY seq
          ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING
        ) AS trailing_sum,
        COUNT(*) OVER (
          PARTITION BY endpoint ORDER BY seq
          ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING
        ) AS previous_count
      FROM latency_samples
    )
    SELECT endpoint, seq, p95_ms, trailing_sum
    FROM windowed
    WHERE previous_count = 3
      AND p95_ms * 3 > 2 * trailing_sum
    ORDER BY endpoint, seq;
sql_setup: |
  CREATE TABLE latency_samples (
    endpoint VARCHAR(80) NOT NULL,
    seq INTEGER NOT NULL,
    p95_ms INTEGER NOT NULL,
    PRIMARY KEY (endpoint, seq)
  );
tests:
  - id: t1
    description: "Example 1 - two spikes on one endpoint, short series on another is never a spike"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/checkout', 1, 100), ('/checkout', 2, 110), ('/checkout', 3, 90), ('/checkout', 4, 250),
        ('/checkout', 5, 120), ('/checkout', 6, 400), ('/search', 1, 50), ('/search', 2, 500), ('/search', 3, 60);
    expected_rows: [["/checkout", 4, 250, 300], ["/checkout", 6, 400, 460]]
  - id: t2
    description: "Example 2 - seq gaps and exactly twice the average is not a spike"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/login', 1, 10), ('/login', 5, 20), ('/login', 9, 30), ('/login', 20, 40), ('/login', 21, 121);
    expected_rows: [["/login", 21, 121, 90]]
  - id: t3
    hidden: true
    description: "Empty table"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Endpoints with one, two and three samples - a partial window must not count as a spike"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/a', 1, 900), ('/b', 1, 1), ('/b', 2, 900), ('/c', 1, 1), ('/c', 2, 1), ('/c', 3, 900);
    expected_rows: []
  - id: t5
    hidden: true
    description: "Integer-division trap - trailing sum 101, p95 67 is below 2 x 33.67 but above 2 x (101 / 3 truncated)"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/pay', 1, 30), ('/pay', 2, 35), ('/pay', 3, 36), ('/pay', 4, 67),
        ('/ship', 1, 30), ('/ship', 2, 35), ('/ship', 3, 36), ('/ship', 4, 68);
    expected_rows: [["/ship", 4, 68, 101]]
  - id: t6
    hidden: true
    description: "Interleaved endpoints - the window must not borrow samples from another endpoint"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/fast', 1, 5), ('/slow', 1, 1000), ('/fast', 2, 5), ('/slow', 2, 1000), ('/fast', 3, 5),
        ('/slow', 3, 1000), ('/fast', 4, 40), ('/slow', 4, 1100), ('/slow', 5, 2500), ('/fast', 5, 9);
    expected_rows: [["/fast", 4, 40, 15], ["/slow", 5, 2500, 3100]]
  - id: t7
    hidden: true
    description: "Consecutive spikes - an earlier spike stays in the trailing window and raises the bar"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/feed', 1, 10), ('/feed', 2, 10), ('/feed', 3, 10), ('/feed', 4, 100), ('/feed', 5, 100),
        ('/feed', 6, 300), ('/feed', 7, 1000), ('/feed', 8, 10);
    expected_rows:
      - ["/feed", 4, 100, 30]
      - ["/feed", 5, 100, 120]
      - ["/feed", 6, 300, 210]
      - ["/feed", 7, 1000, 500]
  - id: t8
    hidden: true
    description: "Flat and decreasing series, including zeros - no spikes"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/flat', 1, 0), ('/flat', 2, 0), ('/flat', 3, 0), ('/flat', 4, 0),
        ('/down', 1, 800), ('/down', 2, 400), ('/down', 3, 200), ('/down', 4, 100), ('/down', 5, 50);
    expected_rows: []
  - id: t9
    hidden: true
    description: "Twenty samples with large values and gaps - several spikes, sorted by endpoint text order"
    ordered: true
    setup_sql: |
      INSERT INTO latency_samples (endpoint, seq, p95_ms) VALUES
        ('/api/v2', 1, 120000), ('/api/v2', 2, 130000), ('/api/v2', 4, 125000), ('/api/v2', 7, 400000),
        ('/api/v2', 8, 150000), ('/api/v2', 9, 140000), ('/api/v2', 10, 135000), ('/api/v2', 15, 1000000),
        ('/api/v2', 16, 900000), ('/api/v2', 17, 120000),
        ('/api/v10', 3, 700), ('/api/v10', 4, 650), ('/api/v10', 6, 720), ('/api/v10', 8, 2000),
        ('/api/v10', 9, 680), ('/api/v10', 10, 690), ('/api/v10', 11, 700), ('/api/v10', 12, 1400),
        ('/api/v10', 13, 1500), ('/api/v10', 14, 3001);
    expected_rows:
      - ["/api/v10", 8, 2000, 2070]
      - ["/api/v10", 12, 1400, 2070]
      - ["/api/v10", 14, 3001, 3600]
      - ["/api/v2", 7, 400000, 375000]
      - ["/api/v2", 15, 1000000, 425000]
      - ["/api/v2", 16, 900000, 1275000]
expected_concepts:
  - window functions with PARTITION BY and ORDER BY
  - ROWS frame that excludes the current row (3 PRECEDING AND 1 PRECEDING)
  - detecting partial frames with COUNT over the same window
  - integer comparison instead of truncating division
  - deterministic ORDER BY of the final result
optimal_complexity: {time: "O(n log n) for sorting by endpoint and seq", space: O(n)}
rubric:
  excellent: Uses SUM and COUNT over a ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING frame partitioned by endpoint (or three LAG calls), filters in an outer query on a full window and the integer comparison, orders the output and explains why integer division or a RANGE frame over seq is wrong.
  good: Correct query after a hint about excluding the current row, partial windows or integer division.
  weak: Includes the current sample in the window, uses a self-join on seq - 1..3 that breaks on gaps, forgets PARTITION BY, or divides integers and reports false spikes.
  criteria:
    correctness: All tests pass, including partial windows, the exact-double boundary, seq gaps and the integer-division trap.
    efficiency: A single window pass rather than correlated subqueries per sample; mentions an index on (endpoint, seq).
    code_quality: A named CTE, an explicit frame clause and output aliases that match the contract.
    edge_cases: Empty table, endpoints with fewer than four samples, flat series and consecutive spikes.
    communication: Explains why a filter on a window result needs an outer query and how the frame is defined.
hints:
  - Each sample is compared with a few rows that come right before it in the same endpoint; which SQL feature can look at neighbouring rows without collapsing them?
  - A window partitioned by endpoint and ordered by seq can sum a frame that ends one row before the current one; you also need to know whether that frame really contains three rows, and you should compare without dividing.
  - In a CTE, compute SUM(p95_ms) and COUNT(*) over PARTITION BY endpoint ORDER BY seq ROWS BETWEEN 3 PRECEDING AND 1 PRECEDING; in the outer query keep rows where the count is 3 and p95_ms * 3 > 2 * trailing_sum, then order by endpoint and seq.
followups:
  - How would you require the spike to persist for two consecutive samples before alerting?
  - How would you use a time-based window (the last 15 minutes) instead of the last three samples?
  - Why can a window function result not be filtered in the same query's WHERE clause?
  - How would you run this incrementally as new samples arrive?
common_errors:
  - Using ROWS BETWEEN 3 PRECEDING AND CURRENT ROW, which mixes the sample into its own baseline.
  - Reporting samples whose frame holds fewer than three rows because the sum of a partial frame is small.
  - Computing trailing_sum / 3 with integer division, which truncates and reports false spikes.
  - Self-joining on seq - 1, seq - 2 and seq - 3, which breaks whenever seq has gaps.
  - Forgetting PARTITION BY endpoint, so the baseline borrows samples from other endpoints.
