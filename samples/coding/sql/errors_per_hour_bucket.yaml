version: 1
slug: errors_per_hour_bucket
title: Errors per Hour
difficulty: easy
competency_keys: [sql, databases]
role_tags: [sre, backend, support_engineer]
time_limit_minutes: 12
prompt_markdown: |
  ## Errors per Hour

  After a noisy deployment on **4 May 2026**, the on-call engineer wants to see when the errors happened
  during that day. Application logs are collected into one table.

  Table `app_logs`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | service | VARCHAR(40) | service that wrote the line (not needed for this report) |
  | level | VARCHAR(10) | one of `DEBUG`, `INFO`, `WARN`, `ERROR`, always upper case |
  | logged_at | TEXT | UTC timestamp in the fixed format `YYYY-MM-DD HH:MM:SS` |

  Consider only rows that have level `ERROR` **and** whose date (the first 10 characters of `logged_at`)
  is `2026-05-04`. The hour of a row is the two-character text at positions 12-13 of `logged_at`, i.e.
  `SUBSTR(logged_at, 12, 2)` (for example `'09'`).

  Return one row per hour of that day with **at least one error**, with columns `hour` (the two-character
  text, keeping the leading zero) and `error_count`. Order the rows by `hour` ascending. Hours without
  errors are not listed; rows from other days and other levels are ignored.

  Write standard SQL that runs on both PostgreSQL and SQLite (use string functions, not date functions).

  ### Example 1
  ```
  app_logs
  +----+----------+-------+---------------------+
  | id | service  | level | logged_at           |
  +----+----------+-------+---------------------+
  | 1  | checkout | INFO  | 2026-05-04 09:00:12 |
  | 2  | checkout | ERROR | 2026-05-04 09:14:55 |
  | 3  | search   | ERROR | 2026-05-04 09:59:59 |
  | 4  | auth     | WARN  | 2026-05-04 10:02:00 |
  | 5  | search   | ERROR | 2026-05-04 14:30:00 |
  | 6  | checkout | ERROR | 2026-05-03 09:20:00 |
  | 7  | auth     | ERROR | 2026-05-04 10:00:00 |
  +----+----------+-------+---------------------+

  Output
  +------+-------------+
  | hour | error_count |
  +------+-------------+
  | 09   | 2           |
  | 10   | 1           |
  | 14   | 1           |
  +------+-------------+
  Row 6 is from 3 May and row 4 is a WARN, so neither is counted. 09:59:59 still belongs to hour '09'.
  ```

  ### Example 2
  ```
  app_logs
  +----+---------+-------+---------------------+
  | id | service | level | logged_at           |
  +----+---------+-------+---------------------+
  | 1  | auth    | ERROR | 2026-05-03 23:59:59 |
  | 2  | auth    | ERROR | 2026-05-04 00:00:00 |
  | 3  | search  | ERROR | 2026-05-04 23:59:59 |
  | 4  | search  | ERROR | 2026-05-05 00:00:00 |
  +----+---------+-------+---------------------+

  Output
  +------+-------------+
  | hour | error_count |
  +------+-------------+
  | 00   | 1           |
  | 23   | 1           |
  +------+-------------+
  Only rows 2 and 3 fall on 2026-05-04. The hour keeps its leading zero: '00', not 0.
  ```

  ### Constraints
  - `0 <= rows in app_logs <= 10^6`
  - Every `logged_at` is a valid timestamp in the format `YYYY-MM-DD HH:MM:SS`; rows may be stored in any order.
  - The table can contain any number of days, including none for 2026-05-04.
languages: [sql]
starter_code:
  sql: |
    -- Return hour ('00'-'23') and error_count for ERROR rows logged on 2026-05-04, ordered by hour.
    SELECT SUBSTR(logged_at, 12, 2) AS hour, COUNT(*) AS error_count
    FROM app_logs
    GROUP BY SUBSTR(logged_at, 12, 2);
reference_solutions:
  sql: |
    SELECT SUBSTR(logged_at, 12, 2) AS hour,
           COUNT(*) AS error_count
    FROM app_logs
    WHERE level = 'ERROR'
      AND SUBSTR(logged_at, 1, 10) = '2026-05-04'
    GROUP BY SUBSTR(logged_at, 12, 2)
    ORDER BY hour;
sql_setup: |
  CREATE TABLE app_logs (
    id INTEGER PRIMARY KEY,
    service VARCHAR(40) NOT NULL,
    level VARCHAR(10) NOT NULL,
    logged_at TEXT NOT NULL
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - only ERROR rows of 2026-05-04 counted; WARN and other days ignored"
    setup_sql: |
      INSERT INTO app_logs (id, service, level, logged_at) VALUES
        (1, 'checkout', 'INFO', '2026-05-04 09:00:12'), (2, 'checkout', 'ERROR', '2026-05-04 09:14:55'), (3, 'search', 'ERROR', '2026-05-04 09:59:59'), (4, 'auth', 'WARN', '2026-05-04 10:02:00'), (5, 'search', 'ERROR', '2026-05-04 14:30:00'),
        (6, 'checkout', 'ERROR', '2026-05-03 09:20:00'), (7, 'auth', 'ERROR', '2026-05-04 10:00:00');
    expected_rows: [["09", 2], ["10", 1], ["14", 1]]
  - id: t2
    ordered: true
    description: "Example 2 - first and last second of the day count; neighbouring midnights do not"
    setup_sql: |
      INSERT INTO app_logs (id, service, level, logged_at) VALUES
        (1, 'auth', 'ERROR', '2026-05-03 23:59:59'), (2, 'auth', 'ERROR', '2026-05-04 00:00:00'), (3, 'search', 'ERROR', '2026-05-04 23:59:59'), (4, 'search', 'ERROR', '2026-05-05 00:00:00');
    expected_rows: [["00", 1], ["23", 1]]
  - id: t3
    hidden: true
    ordered: true
    description: "Empty table - no rows"
    expected_rows: []
