expected_concepts:
  - filtering on a substring of a fixed-format timestamp
  - GROUP BY on a computed expression
  - half-open date ranges versus BETWEEN
  - deterministic ORDER BY on text keys
optimal_complexity: {time: "O(n) scan, or O(log n + k) with an index on logged_at and a range predicate", space: "O(24)"}
rubric:
  excellent: Filters to ERROR rows of the target day (ideally with a sargable half-open range on logged_at), groups by SUBSTR(logged_at, 12, 2), orders by hour, and explains why BETWEEN with the next midnight double counts.
  good: Correct query after a hint about the day filter or about the hour expression.
  weak: Forgets the day or level filter, uses an inclusive end at the next midnight, picks the wrong substring positions or omits ORDER BY.
  criteria:
    correctness: All tests pass, including midnight boundaries, other days and non-error levels.
    efficiency: Mentions that a range predicate on logged_at can use an index while SUBSTR on the column cannot.
    code_quality: Clear aliases and one consistent hour expression.
    edge_cases: Empty table, no errors on the day, all 24 hours and out-of-order rows.
    communication: Explains why the leading zero matters and how text ordering works for fixed-width hours.
hints:
  - Two filters decide which rows matter (the level and the day), and one expression decides which bucket a row falls into.
  - Both the date and the hour can be read from fixed positions of the timestamp text. Be careful that a range ending at the next midnight is not inclusive, or the first second of 5 May sneaks in.
  - Keep rows whose level is ERROR and whose first ten characters equal the target date (or that fall in a half-open range from that midnight to the next), group by the two characters starting at position 12, count the rows and order by that hour text.
followups:
  - How would you include hours with zero errors so the chart has 24 bars?
  - How would you rewrite the filter so an index on logged_at can be used?
  - How would you break the counts down per service as well?
common_errors:
  - Forgetting to restrict to 2026-05-04, which merges the same hour from different days.
  - Using BETWEEN '2026-05-04 00:00:00' AND '2026-05-05 00:00:00', which also counts the first second of the next day.
  - Taking the wrong substring positions, for example SUBSTR(logged_at, 11, 2), which includes the space.
  - Casting the hour to an integer, which drops the leading zero the output requires.
  - Omitting ORDER BY hour.
