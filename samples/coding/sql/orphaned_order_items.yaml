expected_concepts:
  - anti-join with LEFT JOIN ... IS NULL or NOT EXISTS
  - NULL foreign keys and three-valued logic
  - CASE expression with ordered branches
  - referential-integrity auditing before adding constraints
optimal_complexity: {time: "O(n log n) or O(n) with hash/index lookups on the primary keys", space: "O(k) for the k reported rows"}
rubric:
  excellent: Uses two LEFT JOINs (or NOT EXISTS) and a CASE that checks 'both' first, handles NULL product_id naturally, orders by id, and explains why NOT IN with NULLs or inner joins would hide broken rows.
  good: Correct query after a hint about NULL product ids or about the order of the CASE branches.
  weak: Uses inner joins, NOT IN against a nullable column, or reports clean rows or wrong problem labels.
  criteria:
    correctness: All tests pass, including NULL product ids, items broken in both ways and empty reference tables.
    efficiency: Set-based joins against primary keys; no per-row procedural code.
    code_quality: Clear aliases, a readable CASE and an explicit ORDER BY.
    edge_cases: Empty tables, NULL product ids, all-clean data and ids reused across tables.
    communication: Explains how this audit would be used before enabling foreign keys.
hints:
  - For each line item you need to know whether its order exists and whether its product exists; a join that keeps unmatched rows tells you both.
  - With outer joins to both parent tables, a missing parent shows up as NULL on that side. A NULL product_id never matches anything, so it is reported without special handling, but NOT IN comparisons with NULL behave differently.
  - Left-join order_items to orders and to products, keep rows where either joined key is NULL, label them with a CASE whose first branch tests that both are missing, and sort by the line item id.
followups:
  - How would you fix or quarantine these rows before adding the foreign keys?
  - Which constraint would you add for product_id if a NULL product is legitimately allowed for gift cards?
  - How would you run this audit on a table with hundreds of millions of rows without locking it?
common_errors:
  - Using inner joins, which remove exactly the broken rows the audit should report.
  - Using product_id NOT IN (SELECT id FROM products), which never flags NULL product ids.
  - Testing the single-missing cases before the 'both' case in CASE, so items missing both are mislabelled.
  - Forgetting ORDER BY id.
