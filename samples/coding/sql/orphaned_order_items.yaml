      INSERT INTO products (id, name) VALUES (1, 'A'), (2, 'B');
      INSERT INTO order_items (id, order_id, product_id, quantity) VALUES (1, 1, 1, 1), (2, 1, 2, 1), (3, 2, 2, 5);
    expected_rows: []
  - id: t5
    hidden: true
    ordered: true
    description: "Orders and products tables empty - every item is 'both' (inner joins return nothing)"
    setup_sql: |
      INSERT INTO order_items (id, order_id, product_id, quantity) VALUES
        (3, 1, 1, 1), (1, 2, NULL, 1), (2, 2, 5, 2);
    expected_rows: [[1, 2, null, "both"], [2, 2, 5, "both"], [3, 1, 1, "both"]]
  - id: t6
    hidden: true
    ordered: true
    description: "NULL product ids next to orphaned ones - NOT IN against products loses NULL rows"
    setup_sql: |
      INSERT INTO orders (id, status) VALUES (1, 'paid');
      INSERT INTO products (id, name) VALUES (1, 'A');
      INSERT INTO order_items (id, order_id, product_id, quantity) VALUES
        (1, 1, NULL, 1), (2, 1, NULL, 1), (3, 1, 9, 1), (4, 1, 1, 1);
    expected_rows: [[1, 1, null, "missing_product"], [2, 1, null, "missing_product"], [3, 1, 9, "missing_product"]]
  - id: t7
    hidden: true
    ordered: true
    description: "Several items share one missing order; ids out of insertion order must be sorted"
    setup_sql: |
      INSERT INTO orders (id, status) VALUES (100, 'paid');
      INSERT INTO products (id, name) VALUES (1, 'A'), (2, 'B');
      INSERT INTO order_items (id, order_id, product_id, quantity) VALUES
        (40, 200, 1, 1), (5, 200, 2, 1), (17, 100, 2, 1), (23, 200, 3, 1);
    expected_rows: [[5, 200, 2, "missing_order"], [23, 200, 3, "both"], [40, 200, 1, "missing_order"]]
  - id: t8
    hidden: true
    ordered: true
    description: "Order id equal to an existing product id (and vice versa) must not be confused across tables"
    setup_sql: |
      INSERT INTO orders (id, status) VALUES (5, 'paid');
      INSERT INTO products (id, name) VALUES (6, 'A');
      INSERT INTO order_items (id, order_id, product_id, quantity) VALUES (1, 6, 5, 1), (2, 5, 6, 1), (3, 5, 5, 1);
    expected_rows: [[1, 6, 5, "both"], [3, 5, 5, "missing_product"]]
