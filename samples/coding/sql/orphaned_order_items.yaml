version: 1
slug: orphaned_order_items
title: Orphaned Order Items
difficulty: easy
competency_keys: [sql, databases, debugging]
role_tags: [data, dba, qa]
time_limit_minutes: 15
prompt_markdown: |
  ## Orphaned Order Items

  A legacy shop system was migrated with a bulk import that loaded `order_items` **without foreign-key
  constraints**. Before the constraints can be switched on, the data team needs a list of every line item
  that would violate them.

  Table `orders`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | status | VARCHAR(20) | not relevant for this task |

  Table `products`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | name | VARCHAR(100) | |

  Table `order_items`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | order_id | INTEGER | never NULL, but may point to an order that does not exist |
  | product_id | INTEGER | **may be NULL**, or may point to a product that does not exist |
  | quantity | INTEGER | |

  A line item has:

  - a **missing order** when no row in `orders` has `id = order_id`;
  - a **missing product** when `product_id` is NULL or no row in `products` has `id = product_id`.

  Return `id`, `order_id`, `product_id` and `problem` for every line item with at least one of these
  issues, where `problem` is `'missing_order'`, `'missing_product'` or `'both'` (when the order and the
  product are both missing). Line items without issues are not returned. Order the rows by `id`
  ascending; `product_id` is returned as stored (NULL stays NULL).

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  orders
  +-----+---------+
  | id  | status  |
  +-----+---------+
  | 501 | paid    |
  | 502 | shipped |
  +-----+---------+

  products
  +----+-----------+
  | id | name      |
  +----+-----------+
  | 10 | Desk lamp |
  | 11 | USB hub   |
  +----+-----------+

  order_items
  +----+----------+------------+----------+
  | id | order_id | product_id | quantity |
  +----+----------+------------+----------+
  | 1  | 501      | 10         | 1        |
  | 2  | 501      | 12         | 2        |
  | 3  | 503      | 11         | 1        |
  | 4  | 502      | 11         | 3        |
  | 5  | 599      | 77         | 1        |
  +----+----------+------------+----------+

  Output
  +----+----------+------------+-----------------+
  | id | order_id | product_id | problem         |
  +----+----------+------------+-----------------+
  | 2  | 501      | 12         | missing_product |
  | 3  | 503      | 11         | missing_order   |
  | 5  | 599      | 77         | both            |
  +----+----------+------------+-----------------+
  Item 2 references product 12, which does not exist. Item 3 references order 503, which does not exist.
  Item 5 references neither an existing order nor an existing product. Items 1 and 4 are clean.
  ```

  ### Example 2
  ```
  orders
  +----+--------+
  | id | status |
  +----+--------+
  | 7  | paid   |
  +----+--------+

  products
  +----+----------------+
  | id | name           |
  +----+----------------+
  | 3  | Cable tie pack |
  +----+----------------+

  order_items
  +----+----------+------------+----------+
  | id | order_id | product_id | quantity |
  +----+----------+------------+----------+
  | 10 | 7        | NULL       | 1        |
  | 11 | 7        | 3          | 4        |
  | 12 | 8        | NULL       | 2        |
  +----+----------+------------+----------+

  Output
  +----+----------+------------+-----------------+
  | id | order_id | product_id | problem         |
  +----+----------+------------+-----------------+
  | 10 | 7        | NULL       | missing_product |
  | 12 | 8        | NULL       | both            |
  +----+----------+------------+-----------------+
  Item 10 has no product at all (NULL), item 12 has neither a valid order nor a product.
  ```

  ### Constraints
  - `0 <= rows in each table <= 10^5`
  - Ids are integers; `order_items.order_id` is never NULL, `order_items.product_id` can be NULL.
languages: [sql]
starter_code:
  sql: |
    -- Return id, order_id, product_id and problem ('missing_order', 'missing_product' or 'both')
    -- for every line item that breaks a reference, ordered by id.
    SELECT oi.id, oi.order_id, oi.product_id, 'missing_order' AS problem
    FROM order_items oi
    ORDER BY oi.id;
reference_solutions:
  sql: |
    SELECT oi.id, oi.order_id, oi.product_id,
           CASE
             WHEN o.id IS NULL AND p.id IS NULL THEN 'both'
             WHEN o.id IS NULL THEN 'missing_order'
             ELSE 'missing_product'
           END AS problem
    FROM order_items oi
    LEFT JOIN orders o ON o.id = oi.order_id
    LEFT JOIN products p ON p.id = oi.product_id
    WHERE o.id IS NULL OR p.id IS NULL
    ORDER BY oi.id;
sql_setup: |
  CREATE TABLE orders (
    id INTEGER PRIMARY KEY,
    status VARCHAR(20) NOT NULL
  );
  CREATE TABLE products (
    id INTEGER PRIMARY KEY,
    name VARCHAR(100) NOT NULL
  );
  CREATE TABLE order_items (
    id INTEGER PRIMARY KEY,
    order_id INTEGER NOT NULL,
    product_id INTEGER,
    quantity INTEGER NOT NULL
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - one item of each kind plus clean rows"
    setup_sql: |
      INSERT INTO orders (id, status) VALUES (501, 'paid'), (502, 'shipped');
      INSERT INTO products (id, name) VALUES (10, 'Desk lamp'), (11, 'USB hub');
      INSERT INTO order_items (id, order_id, product_id, quantity) VALUES
        (1, 501, 10, 1), (2, 501, 12, 2), (3, 503, 11, 1), (4, 502, 11, 3), (5, 599, 77, 1);
    expected_rows: [[2, 501, 12, "missing_product"], [3, 503, 11, "missing_order"], [5, 599, 77, "both"]]
  - id: t2
    ordered: true
    description: "Example 2 - a NULL product_id counts as a missing product, also together with a missing order"
    setup_sql: |
      INSERT INTO orders (id, status) VALUES (7, 'paid');
      INSERT INTO products (id, name) VALUES (3, 'Cable tie pack');
      INSERT INTO order_items (id, order_id, product_id, quantity) VALUES
        (10, 7, NULL, 1), (11, 7, 3, 4), (12, 8, NULL, 2);
    expected_rows: [[10, 7, null, "missing_product"], [12, 8, null, "both"]]
  - id: t3
    hidden: true
    ordered: true
    description: "Empty tables - no rows"
    expected_rows: []
