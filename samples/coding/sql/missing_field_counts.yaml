expected_concepts:
  - conditional aggregation (COUNT or SUM over CASE)
  - NULL versus empty string versus whitespace
  - TRIM for blank detection
  - aggregates without GROUP BY always return one row
optimal_complexity: {time: "O(n) single scan", space: "O(1)"}
rubric:
  excellent: Computes every count in one scan with conditional aggregation, treats NULL and space-only text as missing but keeps 0 and placeholders, guarantees zeros on an empty table, and explains COUNT(column) versus COUNT(*).
  good: Correct query after a hint about blank strings or about SUM returning NULL on an empty table.
  weak: Counts only NULLs, treats 0 weights as missing, runs a separate query per column or returns NULLs for an empty table.
  criteria:
    correctness: All tests pass, including space-only strings, zero weights and the empty table.
    efficiency: One pass over the table instead of one query or subquery per column.
    code_quality: Consistent, readable expressions and the requested column aliases.
    edge_cases: Empty table, all-NULL rows, padded real values and placeholder text.
    communication: Explains the NULL, empty and blank distinctions and how the profile would be used.
hints:
  - One pass over the table can produce every count at once if each count only counts the rows that satisfy a condition.
  - COUNT of a column skips NULLs, and comparing a NULL with anything is never true, so blank text needs its own test after trimming. Think about what SUM returns when there are no rows at all.
  - For each text column count the rows where the value is NULL or its trimmed form equals the empty string, count NULL weights separately, and use COUNT over a CASE that yields a value only for missing rows (or wrap sums in COALESCE) so an empty table gives zeros.
followups:
  - How would you return the profile as one row per column instead of one wide row?
  - How would you also flag placeholder values such as 'n/a' or '-' without hard-coding them in every expression?
  - How would you run this profile incrementally on each new upload batch?
common_errors:
  - Counting only NULLs and missing empty or space-only strings.
  - Comparing with = '' without TRIM, which misses values made only of spaces.
  - Treating a weight of 0 as missing.
  - Using SUM(CASE ...) without COALESCE, which returns NULL instead of 0 on an empty table.
