version: 1
slug: missing_field_counts
title: Missing Field Profile
difficulty: easy
competency_keys: [sql, databases]
role_tags: [data, qa, data_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Missing Field Profile

  Partner warehouses upload shipment records into a staging table before they are cleaned. As a
  data-quality check, you need a one-row **profile of how many values are missing in each column**.

  Table `shipments_raw`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | carrier | VARCHAR(40) | may be NULL, empty or only spaces |
  | tracking_code | VARCHAR(60) | may be NULL, empty or only spaces |
  | weight_grams | INTEGER | may be NULL; `0` is a real (if suspicious) weight |
  | destination | VARCHAR(100) | may be NULL, empty or only spaces |

  The rules for "missing" are:

  - a **text** value (`carrier`, `tracking_code`, `destination`) is missing when it is NULL **or** when it
    is empty after removing leading and trailing spaces (`''`, `'   '`). Placeholder text such as `'n/a'`
    or `'-'` is **not** missing;
  - `weight_grams` is missing only when it is NULL.

  Return **exactly one row** with the columns `total_rows`, `missing_carrier`, `missing_tracking`,
  `missing_weight` and `missing_destination` (each an integer count). An empty table still returns one
  row, with every count `0`.

  Write standard SQL that runs on both PostgreSQL and SQLite. In the examples, text values are shown in
  single quotes so blank strings are visible.

  ### Example 1
  ```
  shipments_raw
  +----+---------+---------------+--------------+-------------+
  | id | carrier | tracking_code | weight_grams | destination |
  +----+---------+---------------+--------------+-------------+
  | 1  | 'DHL'   | 'JD0148'      | 1200         | 'Rotterdam' |
  | 2  | NULL    | 'JD0151'      | NULL         | 'Lyon'      |
  | 3  | '  '    | ''            | 0            | 'Gdansk'    |
  | 4  | 'UPS'   | NULL          | 830          | '   '       |
  | 5  | 'n/a'   | 'JD0160'      | 2450         | NULL        |
  +----+---------+---------------+--------------+-------------+

  Output
  +------------+-----------------+------------------+----------------+---------------------+
  | total_rows | missing_carrier | missing_tracking | missing_weight | missing_destination |
  +------------+-----------------+------------------+----------------+---------------------+
  | 5          | 2               | 2                | 1              | 2                   |
  +------------+-----------------+------------------+----------------+---------------------+
  carrier: NULL (row 2) and '  ' (row 3) are missing, 'n/a' is not. tracking_code: '' and NULL.
  weight_grams: only the NULL in row 2; the 0 in row 3 is a value. destination: '   ' and NULL.
  ```

  ### Example 2
  ```
  shipments_raw
  +----+---------+---------------+--------------+-------------+
  | id | carrier | tracking_code | weight_grams | destination |
  +----+---------+---------------+--------------+-------------+
  +----+---------+---------------+--------------+-------------+

  Output
  +------------+-----------------+------------------+----------------+---------------------+
  | total_rows | missing_carrier | missing_tracking | missing_weight | missing_destination |
  +------------+-----------------+------------------+----------------+---------------------+
  | 0          | 0               | 0                | 0              | 0                   |
  +------------+-----------------+------------------+----------------+---------------------+
  The table is empty, so the result is a single row of zeros (not NULLs and not an empty result).
  ```

  ### Constraints
  - `0 <= rows in shipments_raw <= 10^6`
  - Text values contain no tabs or line breaks; only the space character counts as blank padding.
languages: [sql]
starter_code:
  sql: |
    -- Return one row: total_rows, missing_carrier, missing_tracking, missing_weight, missing_destination.
    SELECT COUNT(*) AS total_rows,
           0 AS missing_carrier,
           0 AS missing_tracking,
           0 AS missing_weight,
           0 AS missing_destination
    FROM shipments_raw;
reference_solutions:
  sql: |
    SELECT COUNT(*) AS total_rows,
           COUNT(CASE WHEN carrier IS NULL OR TRIM(carrier) = '' THEN 1 END) AS missing_carrier,
           COUNT(CASE WHEN tracking_code IS NULL OR TRIM(tracking_code) = '' THEN 1 END) AS missing_tracking,
           COUNT(CASE WHEN weight_grams IS NULL THEN 1 END) AS missing_weight,
           COUNT(CASE WHEN destination IS NULL OR TRIM(destination) = '' THEN 1 END) AS missing_destination
    FROM shipments_raw;
sql_setup: |
  CREATE TABLE shipments_raw (
    id INTEGER PRIMARY KEY,
    carrier VARCHAR(40),
    tracking_code VARCHAR(60),
    weight_grams INTEGER,
    destination VARCHAR(100)
  );
tests:
  - id: t1
    description: "Example 1 - NULLs, empty and space-only strings are missing; a 0 weight and 'n/a' are present"
    setup_sql: |
      INSERT INTO shipments_raw (id, carrier, tracking_code, weight_grams, destination) VALUES
        (1, 'DHL', 'JD0148', 1200, 'Rotterdam'), (2, NULL, 'JD0151', NULL, 'Lyon'), (3, '  ', '', 0, 'Gdansk'), (4, 'UPS', NULL, 830, '   '), (5, 'n/a', 'JD0160', 2450, NULL);
    expected_rows: [[5, 2, 2, 1, 2]]
  - id: t2
    description: "Example 2 - empty table still returns one row of zeros"
    expected_rows: [[0, 0, 0, 0, 0]]
  - id: t3
    hidden: true
    description: "Fully populated rows - all missing counts 0"
    setup_sql: |
