        (1, 'GLS', 'A1', 10, 'Porto'), (2, 'DHL', 'B2', 20, 'Lyon');
    expected_rows: [[2, 0, 0, 0, 0]]
  - id: t4
    hidden: true
    description: "Every value NULL - every missing count equals total_rows"
    setup_sql: |
      INSERT INTO shipments_raw (id, carrier, tracking_code, weight_grams, destination) VALUES
        (1, NULL, NULL, NULL, NULL), (2, NULL, NULL, NULL, NULL), (3, NULL, NULL, NULL, NULL);
    expected_rows: [[3, 3, 3, 3, 3]]
  - id: t5
    hidden: true
    description: "Space-only strings of several lengths are missing - a plain = '' test misses them"
    setup_sql: |
      INSERT INTO shipments_raw (id, carrier, tracking_code, weight_grams, destination) VALUES
        (1, ' ', '  ', 5, '    '), (2, '', '        ', 6, ' '), (3, 'DPD', 'X9', 7, 'Oslo');
    expected_rows: [[3, 2, 2, 0, 2]]
  - id: t6
    hidden: true
    description: "Zero weights are not missing; values padded with spaces around real text are present"
    setup_sql: |
      INSERT INTO shipments_raw (id, carrier, tracking_code, weight_grams, destination) VALUES
        (1, ' DHL ', '  TRK1', 0, 'Lyon  '), (2, 'UPS', 'TRK2', 0, ' Porto'), (3, '-', '?', NULL, 'n/a');
    expected_rows: [[3, 0, 0, 1, 0]]
  - id: t7
    hidden: true
    description: "Single row with only weight missing"
