expected_concepts:
  - "LEFT JOIN to keep rows without matches"
  - "COUNT(column) versus COUNT(*) on outer joins"
  - "aggregating an aggregate through a derived table or CTE"
  - "NULL foreign keys do not join"
optimal_complexity: {time: "O(n + m) with hash aggregation (O((n + m) log(n + m)) with sorting)", space: "O(n) for n customers"}
rubric:
  excellent: "Counts orders per customer with a LEFT JOIN and COUNT(o.id) in a derived table, groups that result again by the count, orders by order_count, and explains why COUNT(*) would turn customers without orders into a count of 1."
  good: "Reaches the correct two-level query after a hint about customers with no orders or about COUNT(*) on the outer join."
  weak: "Groups only the orders table (losing zero-order customers and creating a NULL group for guests), or counts joined rows with COUNT(*)."
  criteria:
    correctness: "All tests pass, including customers without orders and guest orders."
    efficiency: "Two set-based aggregations; no correlated subquery per customer is required."
    code_quality: "Readable derived table or CTE with meaningful aliases."
    edge_cases: "Empty tables, no orders at all, only guest orders and very active customers."
    communication: "Explains the outer join and the difference between counting rows and counting matches."
hints:
  - "Solve it in two steps: first find how many orders each customer placed, then count how many customers share each of those numbers."
  - "Customers without orders must still produce a count of 0, so start from the customers table with an outer join, and count something that is NULL when there is no match."
  - "In a derived table, left join customers to orders, group by the customer id and count the order id (not every row); then group that derived table by its count, count its rows, and order by the count ascending."
followups:
  - "How would you also list the missing counts between 0 and the maximum with a zero?"
  - "How would you bucket counts into 0, 1, 2-4 and 5 or more?"
  - "Why might a correlated subquery that counts orders per customer be slower or faster than the join on a large table?"
common_errors:
  - "Grouping the orders table by customer_id, which never sees customers without orders and adds a group for NULL guests."
  - "Using COUNT(*) after the LEFT JOIN, which counts the unmatched customer row and reports 1 instead of 0."
  - "Using an inner join, which drops every customer without orders."
