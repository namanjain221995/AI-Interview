version: 1
slug: order_count_distribution
title: "Order Count Distribution"
difficulty: easy
competency_keys: [sql, databases]
role_tags: [data_analyst, product_manager, data]
time_limit_minutes: 15
prompt_markdown: |
  ## Order Count Distribution

  Product analytics wants a histogram of engagement for a business account dashboard: how many
  accounts made zero purchases, how many made exactly one, exactly two, and so on.

  Table `customers`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | account_name | VARCHAR(100) | display label only |

  Table `orders`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | customer_id | INTEGER | buying account, a `customers.id`; **NULL for anonymous purchases** |
  | total_cents | INTEGER | order value in cents (unused by this report) |

  An account's **order count** is how many `orders` rows carry its `id` in `customer_id`
  (0 when it bought nothing). Anonymous purchases belong to no account and are left out of all counts.

  Produce a row for each order count that occurs, with the columns:

  - `order_count`
  - `customers`: how many accounts reach exactly that order count

  Sort by `order_count` ascending. Counts that no account reaches are **not** listed (no zero
  lines for gaps). With an empty `customers` table the result is empty.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  customers
  +----+--------------+
  | id | account_name |
  +----+--------------+
  | 1  | Acme         |
  | 2  | Birchwood    |
  | 3  | Cobalt       |
  | 4  | Dunmore      |
  | 5  | Ember        |
  +----+--------------+

  orders
  +----+-------------+-------------+
  | id | customer_id | total_cents |
  +----+-------------+-------------+
  | 1  | 1           | 1000        |
  | 2  | 3           | 2750        |
  | 3  | 1           | 1750        |
  | 4  | 2           | 3500        |
  | 5  | 3           | 2500        |
  +----+-------------+-------------+

  Output
  +-------------+-----------+
  | order_count | customers |
  +-------------+-----------+
  | 0           | 2         |
  | 1           | 1         |
  | 2           | 2         |
  +-------------+-----------+
  Acme and Cobalt placed 2 orders, Birchwood 1, Dunmore and Ember none.
  ```

  ### Example 2
  ```
  customers
  +----+--------------+
  | id | account_name |
  +----+--------------+
  | 1  | Acme         |
  | 2  | Birchwood    |
  | 3  | Cobalt       |
  +----+--------------+

  orders
  +----+-------------+-------------+
  | id | customer_id | total_cents |
  +----+-------------+-------------+
  | 1  | NULL        | 1000        |
  | 2  | NULL        | 2750        |
  | 3  | 2           | 1750        |
  | 4  | 2           | 3500        |
  | 5  | 2           | 2500        |
  +----+-------------+-------------+

  Output
  +-------------+-----------+
  | order_count | customers |
  +-------------+-----------+
  | 0           | 2         |
  | 3           | 1         |
  +-------------+-----------+
  Birchwood placed 3 orders; Acme and Cobalt none. The two guest orders belong to nobody.
  ```

  ### Constraints
  - `0 <= rows in customers, orders <= 10^5`
  - A non-NULL `orders.customer_id` always matches an existing customer.
languages: [sql]
starter_code:
  sql: |
    -- Return order_count and the number of customers with exactly that many orders.
    SELECT 0 AS order_count, COUNT(*) AS customers
    FROM customers
    ORDER BY order_count;
reference_solutions:
  sql: |
    SELECT order_count, COUNT(*) AS customers
    FROM (
      SELECT c.id, COUNT(o.id) AS order_count
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.id
      GROUP BY c.id
    ) per_customer
    GROUP BY order_count
    ORDER BY order_count;
sql_setup: |
  CREATE TABLE customers (
    id INTEGER PRIMARY KEY,
    account_name VARCHAR(100) NOT NULL
  );
  CREATE TABLE orders (
    id INTEGER PRIMARY KEY,
    customer_id INTEGER REFERENCES customers (id),
    total_cents INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - customers with 0, 1 and 2 orders"
    ordered: true
    setup_sql: |
      INSERT INTO customers (id, account_name) VALUES
        (1, 'Acme'), (2, 'Birchwood'), (3, 'Cobalt'), (4, 'Dunmore'), (5, 'Ember');
      INSERT INTO orders (id, customer_id, total_cents) VALUES
        (1, 1, 1000), (2, 3, 2750), (3, 1, 1750), (4, 2, 3500), (5, 3, 2500);
    expected_rows: [[0, 2], [1, 1], [2, 2]]
  - id: t2
    description: "Example 2 - guest orders (NULL customer_id) are not counted; gaps 1 and 2 are not listed"
    ordered: true
    setup_sql: |
      INSERT INTO customers (id, account_name) VALUES (1, 'Acme'), (2, 'Birchwood'), (3, 'Cobalt');
      INSERT INTO orders (id, customer_id, total_cents) VALUES
        (1, NULL, 1000), (2, NULL, 2750), (3, 2, 1750), (4, 2, 3500), (5, 2, 2500);
    expected_rows: [[0, 2], [3, 1]]
