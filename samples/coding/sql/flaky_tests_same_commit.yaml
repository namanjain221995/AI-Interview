expected_concepts:
  - "GROUP BY on two columns (test and commit)"
  - "HAVING with conditional aggregation to require both outcomes"
  - "two-level aggregation through a CTE or derived table"
  - "ignoring irrelevant rows (skip) without breaking the logic"
  - "deterministic ORDER BY with a tie-breaker"
optimal_complexity: {time: "O(n log n) for grouping and sorting (O(n) with hash aggregation)", space: "O(t * c) for t tests and c commits"}
rubric:
  excellent: "Groups by test and commit, keeps groups that have both a pass and a fail with HAVING and conditional counts, counts those groups per test in an outer query, orders by count descending then name, and explains why skips need no special filter."
  good: "Reaches a correct two-level query but needs a nudge on grouping by commit as well as test, or on the ordering tie-breaker."
  weak: "Groups by test only (flagging tests that changed outcome across commits), counts runs instead of commits, or treats skip as a failure."
  criteria:
    correctness: "All tests pass, including retries on one commit, skips and outcome changes across commits."
    efficiency: "Set-based aggregation with no correlated subquery per row; mentions an index on (test_name, commit_sha)."
    code_quality: "Readable CTE or derived table with clear aliases and output names."
    edge_cases: "Empty table, skip-only commits, the same commit shared by different tests and ties on the count."
    communication: "Explains why outcomes must be compared within one commit and how the two aggregation levels fit together."
hints:
  - "Flakiness is a property of one test on one commit. Start by looking at all runs of a single test against a single commit."
  - "Group by test and commit, then keep only the groups that contain at least one pass and at least one fail; counting each outcome conditionally inside the group works well."
  - "In an inner query group by test_name and commit_sha with a HAVING clause that requires a positive count of pass rows and a positive count of fail rows; in the outer query count those rows per test_name and order by that count descending, then by test_name."
followups:
  - "How would you report the flake rate per test, flaky commits divided by all commits the test ran on?"
  - "Which index would make this query fast on a table with hundreds of millions of runs?"
  - "How would you limit the report to commits from the last 14 days if the table had a run timestamp?"
common_errors:
  - "Grouping by test_name only, which flags tests that failed on one commit and passed after a fix on another."
  - "Counting runs instead of distinct commits, which inflates the number for tests with many retries."
  - "Treating 'skip' as a failure, or filtering skips out in a way that drops the whole commit."
  - "Ordering only by the count, which leaves tied tests in an arbitrary order."
