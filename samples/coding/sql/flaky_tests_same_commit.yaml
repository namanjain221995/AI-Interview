version: 1
slug: flaky_tests_same_commit
title: "Flaky Tests on the Same Commit"
difficulty: easy
competency_keys: [sql, databases, testing]
role_tags: [qa, devops, backend]
time_limit_minutes: 15
prompt_markdown: |
  ## Flaky Tests on the Same Commit

  The CI system stores the outcome of every test execution. Pipelines retry failed jobs, so the same
  test often runs several times against the same commit. The QA team wants a list of flaky tests: a
  test that gives different answers for identical code.

  Table `test_runs`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | test_name | VARCHAR(120) | name of the test |
  | commit_sha | VARCHAR(40) | commit the test ran against |
  | outcome | VARCHAR(10) | `'pass'`, `'fail'` or `'skip'` |

  A test is **flaky on a commit** when, for that same `commit_sha`, it has **at least one `'pass'`
  and at least one `'fail'`** run. `'skip'` runs are ignored completely. A test that failed on one
  commit and passed on a different commit is **not** flaky on either of them (the code changed).

  Return one row per test that is flaky on at least one commit, with the columns:

  - `test_name`
  - `flaky_commits`: the number of distinct commits on which the test is flaky

  Order the rows by `flaky_commits` descending, then by `test_name` ascending. Tests that are never
  flaky do not appear.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  test_runs
  +----+-------------------------+------------+---------+
  | id | test_name               | commit_sha | outcome |
  +----+-------------------------+------------+---------+
  | 1  | checkout_applies_coupon | a1f3c9e    | pass    |
  | 2  | checkout_applies_coupon | a1f3c9e    | fail    |
  | 3  | login_redirects_home    | a1f3c9e    | pass    |
  | 4  | login_redirects_home    | a1f3c9e    | skip    |
  | 5  | search_paginates        | a1f3c9e    | fail    |
  | 6  | search_paginates        | b72d014    | pass    |
  | 7  | checkout_applies_coupon | b72d014    | pass    |
  | 8  | checkout_applies_coupon | b72d014    | fail    |
  | 9  | login_redirects_home    | b72d014    | fail    |
  | 10 | login_redirects_home    | b72d014    | pass    |
  +----+-------------------------+------------+---------+

  Output
  +-------------------------+---------------+
  | test_name               | flaky_commits |
  +-------------------------+---------------+
  | checkout_applies_coupon | 2             |
  | login_redirects_home    | 1             |
  +-------------------------+---------------+
  checkout_applies_coupon is flaky on a1f3c9e and b72d014; login_redirects_home only on b72d014
  (pass + skip on a1f3c9e does not count). search_paginates failed and passed on different
  commits, so it is not flaky.
  ```

  ### Example 2
  ```
  test_runs
  +----+-------------------+------------+---------+
  | id | test_name         | commit_sha | outcome |
  +----+-------------------+------------+---------+
  | 1  | report_export_csv | c90e11a    | fail    |
  | 2  | report_export_csv | c90e11a    | fail    |
  | 3  | report_export_csv | c90e11a    | pass    |
  | 4  | api_rate_limit    | c90e11a    | pass    |
  | 5  | api_rate_limit    | c90e11a    | fail    |
  | 6  | cache_eviction    | d4410bb    | skip    |
  | 7  | cache_eviction    | d4410bb    | fail    |
  +----+-------------------+------------+---------+

  Output
  +-------------------+---------------+
  | test_name         | flaky_commits |
  +-------------------+---------------+
  | api_rate_limit    | 1             |
  | report_export_csv | 1             |
  +-------------------+---------------+
  Both flaky tests have one flaky commit, so they are ordered by name. cache_eviction only
  failed (the skip is ignored).
  ```

  ### Constraints
  - `0 <= rows in test_runs <= 10^5`
  - `outcome` is always one of `'pass'`, `'fail'`, `'skip'`.
  - The same test may run any number of times against the same commit.
languages: [sql]
starter_code:
  sql: |
    -- Return test_name and flaky_commits for every test that both passed and failed on the same commit.
    SELECT test_name, COUNT(*) AS flaky_commits
    FROM test_runs
    GROUP BY test_name
    ORDER BY flaky_commits DESC, test_name;
reference_solutions:
  sql: |
    WITH flaky AS (
      SELECT test_name, commit_sha
      FROM test_runs
      GROUP BY test_name, commit_sha
      HAVING SUM(CASE WHEN outcome = 'pass' THEN 1 ELSE 0 END) > 0
         AND SUM(CASE WHEN outcome = 'fail' THEN 1 ELSE 0 END) > 0
    )
    SELECT test_name, COUNT(*) AS flaky_commits
    FROM flaky
    GROUP BY test_name
    ORDER BY flaky_commits DESC, test_name;
sql_setup: |
  CREATE TABLE test_runs (
    id INTEGER PRIMARY KEY,
    test_name VARCHAR(120) NOT NULL,
    commit_sha VARCHAR(40) NOT NULL,
    outcome VARCHAR(10) NOT NULL
  );
