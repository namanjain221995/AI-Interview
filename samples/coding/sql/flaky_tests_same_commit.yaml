        (1, 'checkout_applies_coupon', 'a1f3c9e', 'pass'), (2, 'checkout_applies_coupon', 'a1f3c9e', 'fail'),
        (3, 'login_redirects_home', 'a1f3c9e', 'pass'), (4, 'login_redirects_home', 'a1f3c9e', 'skip'),
        (5, 'search_paginates', 'a1f3c9e', 'fail'), (6, 'search_paginates', 'b72d014', 'pass'),
