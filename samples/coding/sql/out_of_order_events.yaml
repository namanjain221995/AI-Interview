version: 1
slug: out_of_order_events
title: "Late-Arriving Events"
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data, backend, platform]
time_limit_minutes: 20
prompt_markdown: |
  ## Late-Arriving Events

  A streaming pipeline copies events from several upstream sources into one table. Each row gets an
  `ingest_seq` when it lands, so `ingest_seq` is the order in which the pipeline saw the events.
  Every event also carries `event_ts`, the time at which the source says it happened. Network
  retries mean events sometimes arrive after newer events from the same source.

  For each source the pipeline tracks a **watermark**: the largest `event_ts` among all events from
  that source that were ingested **before** the current one (smaller `ingest_seq`). An event is
  **late** when its `event_ts` is strictly smaller than the watermark at the moment it was ingested.
  The first event of a source has no watermark and is never late, and an event whose `event_ts`
  equals the watermark is not late. Sources never influence each other.

  Table `ingested_events`:

  | column | type | notes |
  |--------|------|-------|
  | ingest_seq | INTEGER | primary key; values may have gaps and rows may be stored in any order |
  | source | VARCHAR(50) | name of the upstream source (lower-case letters) |
  | event_ts | BIGINT | event time in seconds (or milliseconds) since an epoch, `>= 0` |

  Return one row per late event with the columns `source`, `ingest_seq`, `event_ts` and
  `watermark` (the watermark at the time that event was ingested). Order the result by `source`,
  then `ingest_seq`, both ascending. Return no rows when nothing arrived late.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  ingested_events
  +------------+---------+----------+
  | ingest_seq | source  | event_ts |
  +------------+---------+----------+
  | 1          | gateway | 100      |
  | 2          | billing | 95       |
  | 3          | gateway | 130      |
  | 4          | gateway | 120      |
  | 5          | billing | 97       |
  | 6          | billing | 90       |
  | 7          | gateway | 130      |
  | 8          | gateway | 125      |
  +------------+---------+----------+

  Output
  +---------+------------+----------+-----------+
  | source  | ingest_seq | event_ts | watermark |
  +---------+------------+----------+-----------+
  | billing | 6          | 90       | 97        |
  | gateway | 4          | 120      | 130       |
  | gateway | 8          | 125      | 130       |
  +---------+------------+----------+-----------+
  Event 7 (gateway, 130) equals the watermark 130, so it is not late.
  ```

  ### Example 2
  ```
  ingested_events
  +------------+--------+----------+
  | ingest_seq | source | event_ts |
  +------------+--------+----------+
  | 1          | edge   | 50       |
  | 2          | edge   | 20       |
  | 3          | edge   | 30       |
  | 4          | edge   | 60       |
  | 5          | edge   | 55       |
  +------------+--------+----------+

  Output
  +--------+------------+----------+-----------+
  | source | ingest_seq | event_ts | watermark |
  +--------+------------+----------+-----------+
  | edge   | 2          | 20       | 50        |
  | edge   | 3          | 30       | 50        |
  | edge   | 5          | 55       | 60        |
  +--------+------------+----------+-----------+
  Event 3 is compared with the largest earlier time (50), not with the event just before it (20).
  ```

  ### Constraints
  - At most `10^6` rows; the table may be empty.
  - `ingest_seq` values are unique; `0 <= event_ts <= 10^13`.
languages: [sql]
starter_code:
  sql: |
    -- Return source, ingest_seq, event_ts and watermark for every late event,
    -- ordered by source, ingest_seq.
    SELECT source, ingest_seq, event_ts, NULL AS watermark
    FROM ingested_events
    ORDER BY source, ingest_seq;
reference_solutions:
  sql: |
    SELECT source, ingest_seq, event_ts, watermark
    FROM (
      SELECT source,
             ingest_seq,
             event_ts,
             MAX(event_ts) OVER (
               PARTITION BY source
               ORDER BY ingest_seq
               ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
             ) AS watermark
      FROM ingested_events
    ) w
    WHERE event_ts < watermark
    ORDER BY source, ingest_seq;
sql_setup: |
  CREATE TABLE ingested_events (
    ingest_seq INTEGER PRIMARY KEY,
    source VARCHAR(50) NOT NULL,
    event_ts BIGINT NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - two interleaved sources, a tie with the watermark is not late"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (1, 'gateway', 100), (2, 'billing', 95), (3, 'gateway', 130), (4, 'gateway', 120),
        (5, 'billing', 97), (6, 'billing', 90), (7, 'gateway', 130), (8, 'gateway', 125);
    expected_rows: [["billing", 6, 90, 97], ["gateway", 4, 120, 130], ["gateway", 8, 125, 130]]
  - id: t2
    description: "Example 2 - watermark is the running maximum, not the previous event"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (1, 'edge', 50), (2, 'edge', 20), (3, 'edge', 30), (4, 'edge', 60), (5, 'edge', 55);
    expected_rows: [["edge", 2, 20, 50], ["edge", 3, 30, 50], ["edge", 5, 55, 60]]
  - id: t3
    hidden: true
    description: "Empty table - no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Single event and perfectly ordered streams (including equal timestamps) - nothing is late"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (1, 'solo', 500), (2, 'meter', 10), (3, 'meter', 10), (4, 'meter', 11), (5, 'meter', 11), (6, 'meter', 40);
    expected_rows: []
  - id: t5
    hidden: true
    description: "Sources are independent - a high timestamp in one source must not make another source late"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (1, 'alpha', 9000), (2, 'beta', 100), (3, 'beta', 200), (4, 'alpha', 8999), (5, 'beta', 150), (6, 'gamma', 1);
    expected_rows: [["alpha", 4, 8999, 9000], ["beta", 5, 150, 200]]
  - id: t6
    hidden: true
    description: "Rows stored out of ingest order with gaps in ingest_seq - must order by ingest_seq, not insertion"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (40, 'orders', 300), (10, 'orders', 100), (30, 'orders', 250), (20, 'orders', 400), (55, 'orders', 410), (50, 'orders', 405);
    expected_rows: [["orders", 30, 250, 400], ["orders", 40, 300, 400]]
  - id: t7
    hidden: true
    description: "Very first event is the newest - every later event is late against the same watermark"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (1, 'backfill', 1000), (2, 'backfill', 1), (3, 'backfill', 2), (4, 'backfill', 999), (5, 'backfill', 0), (6, 'backfill', 1000);
    expected_rows: [["backfill", 2, 1, 1000], ["backfill", 3, 2, 1000], ["backfill", 4, 999, 1000], ["backfill", 5, 0, 1000]]
  - id: t8
    hidden: true
    description: "Millisecond epoch timestamps beyond 32-bit range"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (1, 'clicks', 1717000000000), (2, 'clicks', 1717000005000), (3, 'clicks', 1717000004999),
        (4, 'views', 1717000000500), (5, 'clicks', 1717000005000), (6, 'views', 1717000000499);
    expected_rows: [["clicks", 3, 1717000004999, 1717000005000], ["views", 6, 1717000000499, 1717000000500]]
  - id: t9
    hidden: true
    description: "Several sources with many interleaved late arrivals - ordering by source then ingest_seq"
    ordered: true
    setup_sql: |
      INSERT INTO ingested_events (ingest_seq, source, event_ts) VALUES
        (1, 'payments', 10), (2, 'auth', 5), (3, 'payments', 30), (4, 'auth', 3), (5, 'search', 70),
        (6, 'payments', 20), (7, 'search', 60), (8, 'auth', 8), (9, 'payments', 31), (10, 'search', 75),
        (11, 'auth', 7), (12, 'payments', 29), (13, 'search', 74), (14, 'auth', 9), (15, 'search', 80);
    expected_rows: [["auth", 4, 3, 5], ["auth", 11, 7, 8], ["payments", 6, 20, 30], ["payments", 12, 29, 31], ["search", 7, 60, 70], ["search", 13, 74, 75]]
expected_concepts:
  - "window aggregate with a frame that excludes the current row (ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING)"
  - "PARTITION BY to keep sources independent"
  - "filtering on a window result through a subquery or CTE"
  - "running maximum versus LAG of the previous row"
  - "NULL watermark for the first event of a source"
optimal_complexity: {time: "O(n log n) to sort by source and ingest_seq, then one pass", space: "O(n)"}
rubric:
  excellent: "Computes a running maximum per source with a window frame that ends one row before the current row, filters it in an outer query, explains why LAG is not enough and why the first event is never late, and orders by source then ingest_seq."
  good: "Correct query after a hint about excluding the current row from the frame or about the running maximum, or a correct correlated-subquery solution that is slower."
  weak: "Compares with the previous event only (LAG), includes the current row in the maximum so nothing is ever late, mixes sources, or orders by insertion order or event time."
  criteria:
    correctness: "All tests pass, including ties with the watermark, gaps in ingest_seq and independent sources."
    efficiency: "One window pass per source rather than a correlated subquery per row; mentions an index on (source, ingest_seq)."
    code_quality: "Readable subquery or CTE with clear names and the exact output columns."
    edge_cases: "Empty table, single-event sources, equal timestamps and 64-bit timestamps."
    communication: "Explains the window frame and why the comparison is strict."
hints:
  - "For each event you need a summary of the events from the same source that came before it in ingestion order, which is what window functions are good at."
  - "The watermark is a running maximum over earlier rows only, so the window must be partitioned by source, ordered by ingest_seq, and its frame must stop just before the current row; comparing with only the previous event is not enough."
  - "Compute MAX(event_ts) over a frame of all preceding rows up to one row before the current one in a subquery, then in the outer query keep rows whose event_ts is strictly smaller than that value (the first event's NULL watermark drops out naturally) and order by source and ingest_seq."
followups:
  - "How would you also report how far behind each late event was, and the worst lateness per source?"
  - "How would the query change if late events should be compared with a watermark that lags the maximum by an allowed delay?"
  - "How would you compute this incrementally in a streaming system instead of over the whole table?"
common_errors:
  - "Using LAG(event_ts), which compares only with the previous event and misses events that are older than an earlier maximum."
  - "Using the default window frame, which includes the current row, so the maximum is never smaller than the event itself."
  - "Filtering on the window function in WHERE of the same SELECT, which SQL does not allow."
  - "Ordering by event_ts or by insertion order instead of ingest_seq."
