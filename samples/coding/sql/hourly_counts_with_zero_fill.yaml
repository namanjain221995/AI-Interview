expected_concepts:
  - generating a dense series of keys (recursive CTE or a numbers table)
  - LEFT JOIN from the generated series so empty buckets survive
  - COUNT(column) versus COUNT(*) on outer-joined rows
  - putting row filters in the ON clause of an outer join instead of WHERE
  - extracting fields from fixed-format text timestamps portably
optimal_complexity: {time: "O(n) over api_calls with a range filter on called_at (O(log n + k) with an index)", space: "O(24)"}
rubric:
  excellent: Generates the 24 hours with a recursive CTE (or a VALUES list), LEFT JOINs the day's calls with the date filter inside the ON clause, counts a column of the joined table so empty hours give 0, orders numerically and mentions a range predicate on called_at for index use.
  good: Reaches a correct query after a hint about COUNT(*) returning 1 for empty hours or about the date filter in WHERE turning the outer join into an inner join.
  weak: Groups only the existing calls (missing empty hours), counts calls from other days, uses COUNT(*) on the outer join, or relies on vendor-specific date functions.
  criteria:
    correctness: All tests pass, including the empty table, other days and hour boundaries.
    efficiency: One pass over the day's calls joined to a 24-row series; no per-hour correlated scans of the whole table.
    code_quality: Readable CTE, clear aliases and output column names, explicit ORDER BY.
    edge_cases: Empty table, calls only on other days, duplicate timestamps and the first and last second of each hour.
    communication: Explains why the date filter belongs in the ON clause and why COUNT(c.id) differs from COUNT(*).
hints:
  - The calls table cannot produce rows for hours that have no calls; where else could 24 rows come from?
  - Build a small set of the numbers 0 to 23 (a recursive CTE works on both databases) and outer-join the calls onto it, so every hour keeps a row even without a match.
  - Start from the generated hours, LEFT JOIN api_calls on "date part equals 2026-06-01 and hour part equals this hour" (both conditions in the ON clause), group by hour, count a column of the calls table rather than every row, and order by hour.
followups:
  - How would you make the day a parameter, and which predicate on called_at lets an index be used?
  - How would you produce zero-filled buckets for every hour of a whole month?
  - What changes if called_at were stored in local time with daylight-saving transitions?
common_errors:
  - Grouping only the existing rows, so hours without calls are missing.
  - Using COUNT(*) after the outer join, which reports 1 instead of 0 for empty hours.
  - Filtering the date in WHERE after a LEFT JOIN, which removes the empty hours again.
  - Matching the date with a LIKE pattern that also matches other days such as 2026-06-10 or 2026-06-11.
