version: 1
slug: price_at_time_of_order
title: Price at Time of Order
difficulty: medium
competency_keys: [sql, databases]
role_tags: [backend, data, business_analyst]
time_limit_minutes: 20
prompt_markdown: |
  ## Price at Time of Order

  The catalogue service never edits a price in place. Every change is appended to a change log with
  the moment it takes effect, and a price stays in force until the **next change of the same product**
  takes effect. Billing is re-running last quarter's invoices and needs each order valued at the price
  that applied when it was placed, not at today's price.

  Table `price_changes`:

  | column | type | notes |
  |--------|------|-------|
  | product_id | INTEGER | product the change applies to |
  | effective_at | TEXT | `'YYYY-MM-DD HH:MM:SS'` (UTC) the new price starts to apply |
  | price_cents | INTEGER | new unit price in cents, `>= 0` |

  `(product_id, effective_at)` is the primary key. Rows are stored in no particular order, and a price
  can go up or down.

  Table `orders`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | product_id | INTEGER | product ordered |
  | ordered_at | TEXT | `'YYYY-MM-DD HH:MM:SS'` (UTC) |
  | qty | INTEGER | units, at least 1 |

  All timestamps use the same fixed-width format, so comparing them as text compares them in time.

  For **every order**, return `order_id`, `unit_price_cents` and `line_total_cents`
  (`unit_price_cents * qty`). The unit price is the `price_cents` of the product's change with the
  **latest `effective_at` that is at or before `ordered_at`**; a change that takes effect at exactly
  the order time already applies. When the product had no change effective yet (or none at all), keep
  the order and return **NULL** in both price columns. Sort by `order_id` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  price_changes
  +------------+---------------------+-------------+
  | product_id | effective_at        | price_cents |
  +------------+---------------------+-------------+
  | 10         | 2026-03-01 00:00:00 | 1500        |
  | 10         | 2026-03-10 09:00:00 | 1350        |
  | 20         | 2026-03-05 12:00:00 | 800         |
  +------------+---------------------+-------------+

  orders
  +----+------------+---------------------+-----+
  | id | product_id | ordered_at          | qty |
  +----+------------+---------------------+-----+
  | 1  | 10         | 2026-03-02 14:30:00 | 2   |
  | 2  | 10         | 2026-03-10 09:00:00 | 1   |
  | 3  | 20         | 2026-03-05 11:59:59 | 4   |
  | 4  | 20         | 2026-03-20 08:00:00 | 3   |
  +----+------------+---------------------+-----+

  Output
  +----------+------------------+------------------+
  | order_id | unit_price_cents | line_total_cents |
  +----------+------------------+------------------+
  | 1        | 1500             | 3000             |
  | 2        | 1350             | 1350             |
  | 3        | NULL             | NULL             |
  | 4        | 800              | 2400             |
  +----------+------------------+------------------+
  Order 2 is placed at the exact second the 1350 price starts, so it already pays 1350.
  Order 3 comes one second before product 20 has any price, so both price columns are NULL.
  ```

  ### Example 2
  ```
  price_changes
  +------------+---------------------+-------------+
  | product_id | effective_at        | price_cents |
  +------------+---------------------+-------------+
  | 7          | 2026-01-01 00:00:00 | 400         |
  | 7          | 2026-02-01 00:00:00 | 650         |
  | 7          | 2026-02-15 00:00:00 | 500         |
  +------------+---------------------+-------------+

  orders
  +----+------------+---------------------+-----+
  | id | product_id | ordered_at          | qty |
  +----+------------+---------------------+-----+
  | 12 | 7          | 2026-02-20 10:00:00 | 3   |
  | 5  | 9          | 2026-02-20 10:00:00 | 1   |
  | 8  | 7          | 2026-02-14 23:59:59 | 2   |
  +----+------------+---------------------+-----+

  Output
  +----------+------------------+------------------+
  | order_id | unit_price_cents | line_total_cents |
  +----------+------------------+------------------+
  | 5        | NULL             | NULL             |
  | 8        | 650              | 1300             |
  | 12       | 500              | 1500             |
  +----------+------------------+------------------+
  Order 12 pays 500: the change of 2026-02-15 is the latest one at or before its time, even though
  650 was charged earlier. Product 9 has never had a price.
  ```

  ### Constraints
  - `0 <= rows in price_changes, orders <= 10^5`
  - `0 <= price_cents <= 10^6`, `1 <= qty <= 1000`, so every line total fits in a 32-bit integer
languages: [sql]
starter_code:
  sql: |
    -- Return order_id, unit_price_cents and line_total_cents for every order, ordered by order_id.
    SELECT o.id AS order_id,
           NULL AS unit_price_cents,
           NULL AS line_total_cents
    FROM orders o
    ORDER BY o.id;
reference_solutions:
  sql: |
    SELECT o.id AS order_id,
           p.price_cents AS unit_price_cents,
           p.price_cents * o.qty AS line_total_cents
    FROM orders o
    LEFT JOIN price_changes p
      ON p.product_id = o.product_id
     AND p.effective_at = (
           SELECT MAX(p2.effective_at)
           FROM price_changes p2
           WHERE p2.product_id = o.product_id
             AND p2.effective_at <= o.ordered_at
         )
    ORDER BY o.id;
sql_setup: |
  CREATE TABLE price_changes (
    product_id INTEGER NOT NULL,
    effective_at TEXT NOT NULL,
    price_cents INTEGER NOT NULL,
    PRIMARY KEY (product_id, effective_at)
  );
  CREATE TABLE orders (
    id INTEGER PRIMARY KEY,
    product_id INTEGER NOT NULL,
    ordered_at TEXT NOT NULL,
    qty INTEGER NOT NULL
  );
