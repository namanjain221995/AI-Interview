  - id: t1
    description: "Example 1 - price in force, change exactly at the order time, order before the first change, later change"
    setup_sql: |
      INSERT INTO price_changes (product_id, effective_at, price_cents) VALUES
        (10, '2026-03-01 00:00:00', 1500), (10, '2026-03-10 09:00:00', 1350), (20, '2026-03-05 12:00:00', 800);
      INSERT INTO orders (id, product_id, ordered_at, qty) VALUES
        (1, 10, '2026-03-02 14:30:00', 2), (2, 10, '2026-03-10 09:00:00', 1), (3, 20, '2026-03-05 11:59:59', 4), (4, 20, '2026-03-20 08:00:00', 3);
    expected_rows:
      - [1, 1500, 3000]
      - [2, 1350, 1350]
      - [3, null, null]
      - [4, 800, 2400]
    ordered: true
