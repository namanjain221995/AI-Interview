      INSERT INTO orders (id, product_id, ordered_at, qty) VALUES
        (12, 7, '2026-02-20 10:00:00', 3), (5, 9, '2026-02-20 10:00:00', 1), (8, 7, '2026-02-14 23:59:59', 2);
    expected_rows: [[5, null, null], [8, 650, 1300], [12, 500, 1500]]
