expected_concepts:
  - point-in-time (as-of) lookup of the latest row at or before a timestamp
  - correlated subquery with MAX, or ROW_NUMBER over a range join
  - LEFT JOIN that keeps unmatched orders with NULLs
  - inclusive boundary at the change time
  - deterministic ORDER BY
optimal_complexity: {time: "O(n log m) with an index on price_changes(product_id, effective_at)", space: O(n)}
rubric:
  excellent: Finds the latest change at or before the order time per product (correlated MAX, ROW_NUMBER over the range join or a LATERAL/TOP-1 lookup), keeps unpriced orders with NULLs, treats a change at the order time as applying, and explains how an index on (product_id, effective_at) turns each lookup into a seek.
  good: Correct query after a hint about duplicated rows from the range join, the inclusive boundary or orders without a price.
  weak: Joins every earlier change (duplicating orders), uses the current or maximum price, compares only by product, or drops orders without a price.
  criteria:
    correctness: All tests pass, including changes at the exact order time, price drops, zero prices and unpriced products.
    efficiency: One lookup per order backed by an index; avoids sorting the whole history per order.
    code_quality: Readable aliases, clear subquery or window naming, explicit output column names.
    edge_cases: Orders before the first change, future changes, empty history and several orders at the same instant.
    communication: Explains why a plain range join returns several rows per order and how the query keeps only the latest.
hints:
  - Each change is valid from its effective time until the next change of the same product, so the price for an order is decided by one specific earlier change. Which one?
  - Among the product's changes whose effective time is at or before the order time, you need the most recent one, and orders with no such change must still appear.
  - Left join orders to price_changes on the product and on effective_at being equal to the largest effective_at of that product that is not after ordered_at (a correlated subquery); select the price and the price times qty, then sort by the order id.
followups:
  - How would you write this with ROW_NUMBER, and how does its cost compare with the correlated subquery?
  - Which index makes the lookup fast, and would you change the table to store a valid_to column instead?
  - How would you handle two changes recorded for the same product and the same second?
common_errors:
  - Joining on effective_at <= ordered_at without picking the latest change, which repeats each order once per earlier change.
  - Using MAX(price_cents) or the current price instead of the most recent change.
  - Forgetting the product filter inside the correlated subquery, so another product's change decides the time.
  - Using an inner join or a WHERE filter that drops orders placed before the first change.
