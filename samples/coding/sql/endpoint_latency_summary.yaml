version: 1
slug: endpoint_latency_summary
title: "Endpoint Latency Summary"
difficulty: easy
competency_keys: [sql, databases]
role_tags: [backend, sre, devops]
time_limit_minutes: 12
prompt_markdown: |
  ## Endpoint Latency Summary

  The API gateway writes one row per handled request into an access-log table. Before a release
  review, the SRE team wants a compact per-endpoint summary: how much traffic each route took, its
  fastest and slowest response, and how many server errors it returned.

  Table `requests`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | endpoint | VARCHAR(100) | route template such as `/api/orders` (lower-case letters and `/`) |
  | status_code | INTEGER | HTTP status code between 100 and 599 |
  | latency_ms | INTEGER | time to respond in milliseconds, `>= 0` |

  Return one row per endpoint that appears in the table, with the columns:

  - `endpoint`
  - `request_count`: the number of requests to that endpoint
  - `min_latency_ms` and `max_latency_ms`: the smallest and largest `latency_ms` of those requests
  - `error_count`: how many of those requests have `status_code >= 500`; client errors (4xx) are not
    counted, and the value is `0` (not NULL) when the endpoint had no server errors

  Order the result by `endpoint` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  requests
  +----+-------------+-------------+------------+
  | id | endpoint    | status_code | latency_ms |
  +----+-------------+-------------+------------+
  | 1  | /api/orders | 200         | 45         |
  | 2  | /api/orders | 503         | 1200       |
  | 3  | /health     | 200         | 2          |
  | 4  | /api/orders | 404         | 30         |
  | 5  | /api/users  | 200         | 80         |
  | 6  | /api/users  | 500         | 950        |
  | 7  | /api/users  | 502         | 1010       |
  | 8  | /health     | 200         | 3          |
  +----+-------------+-------------+------------+

  Output
  +-------------+---------------+----------------+----------------+-------------+
  | endpoint    | request_count | min_latency_ms | max_latency_ms | error_count |
  +-------------+---------------+----------------+----------------+-------------+
  | /api/orders | 3             | 30             | 1200           | 1           |
  | /api/users  | 3             | 80             | 1010           | 2           |
  | /health     | 2             | 2              | 3              | 0           |
  +-------------+---------------+----------------+----------------+-------------+
  The 404 on /api/orders counts as a request but not as an error.
  ```

  ### Example 2
  ```
  requests
  +----+-------------+-------------+------------+
  | id | endpoint    | status_code | latency_ms |
  +----+-------------+-------------+------------+
  | 1  | /api/search | 200         | 120        |
  | 2  | /api/search | 201         | 95         |
  | 3  | /api/search | 304         | 15         |
  +----+-------------+-------------+------------+

  Output
  +-------------+---------------+----------------+----------------+-------------+
  | endpoint    | request_count | min_latency_ms | max_latency_ms | error_count |
  +-------------+---------------+----------------+----------------+-------------+
  | /api/search | 3             | 15             | 120            | 0           |
  +-------------+---------------+----------------+----------------+-------------+
  ```

  ### Constraints
  - At most `10^6` requests; the table may be empty.
  - `0 <= latency_ms <= 600000`
languages: [sql]
starter_code:
  sql: |
    -- Return endpoint, request_count, min_latency_ms, max_latency_ms and error_count
    -- (status_code >= 500) per endpoint, ordered by endpoint.
    SELECT endpoint, COUNT(*) AS request_count
    FROM requests
    GROUP BY endpoint
    ORDER BY endpoint;
reference_solutions:
  sql: |
    SELECT endpoint,
           COUNT(*) AS request_count,
           MIN(latency_ms) AS min_latency_ms,
           MAX(latency_ms) AS max_latency_ms,
           SUM(CASE WHEN status_code >= 500 THEN 1 ELSE 0 END) AS error_count
    FROM requests
    GROUP BY endpoint
    ORDER BY endpoint;
sql_setup: |
  CREATE TABLE requests (
    id INTEGER PRIMARY KEY,
    endpoint VARCHAR(100) NOT NULL,
    status_code INTEGER NOT NULL,
    latency_ms INTEGER NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - three endpoints, 404 counted as a request but not an error"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/api/orders', 200, 45), (2, '/api/orders', 503, 1200), (3, '/health', 200, 2), (4, '/api/orders', 404, 30),
        (5, '/api/users', 200, 80), (6, '/api/users', 500, 950), (7, '/api/users', 502, 1010), (8, '/health', 200, 3);
    expected_rows: [["/api/orders", 3, 30, 1200, 1], ["/api/users", 3, 80, 1010, 2], ["/health", 2, 2, 3, 0]]
  - id: t2
    description: "Example 2 - one endpoint without server errors, error_count is 0"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/api/search', 200, 120), (2, '/api/search', 201, 95), (3, '/api/search', 304, 15);
    expected_rows: [["/api/search", 3, 15, 120, 0]]
  - id: t3
    hidden: true
    description: "Empty table - no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Boundary status codes - 499 is not an error, 500 and 599 are"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/api/pay', 499, 70), (2, '/api/pay', 500, 310), (3, '/api/pay', 599, 15), (4, '/api/pay', 200, 40);
    expected_rows: [["/api/pay", 4, 15, 310, 2]]
  - id: t5
    hidden: true
    description: "Only client errors (4xx) - error_count stays 0, not NULL"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/api/login', 400, 12), (2, '/api/login', 401, 9), (3, '/api/login', 429, 1), (4, '/api/cart', 200, 33);
    expected_rows: [["/api/cart", 1, 33, 33, 0], ["/api/login", 3, 1, 12, 0]]
  - id: t6
    hidden: true
    description: "Single request per endpoint - min equals max; zero latency allowed"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/ping', 200, 0), (2, '/api/export', 504, 30000);
    expected_rows: [["/api/export", 1, 30000, 30000, 1], ["/ping", 1, 0, 0, 0]]
  - id: t7
    hidden: true
    description: "Every request failed with a server error"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/api/report', 500, 800), (2, '/api/report', 502, 650), (3, '/api/report', 503, 2400), (4, '/api/report', 504, 60000);
    expected_rows: [["/api/report", 4, 650, 60000, 4]]
  - id: t8
    hidden: true
    description: "Many endpoints in mixed insertion order - output ordered by endpoint text"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/api/zones', 200, 18), (2, '/metrics', 200, 4), (3, '/api/accounts', 200, 55), (4, '/api/items', 500, 210),
        (5, '/api/carts', 200, 61), (6, '/api/zones', 503, 99), (7, '/api/items', 200, 47), (8, '/api/accounts', 201, 75),
        (9, '/metrics', 200, 6), (10, '/api/carts', 404, 12), (11, '/api/zones', 200, 21), (12, '/api/items', 200, 52);
    expected_rows: [["/api/accounts", 2, 55, 75, 0], ["/api/carts", 2, 12, 61, 0], ["/api/items", 3, 47, 210, 1], ["/api/zones", 3, 18, 99, 1], ["/metrics", 2, 4, 6, 0]]
  - id: t9
    hidden: true
    description: "Large latencies near a two-minute timeout and a long tail"
    ordered: true
    setup_sql: |
      INSERT INTO requests (id, endpoint, status_code, latency_ms) VALUES
        (1, '/api/batch', 200, 118500), (2, '/api/batch', 504, 120000), (3, '/api/batch', 200, 250),
        (4, '/api/batch', 200, 599999);
    expected_rows: [["/api/batch", 4, 250, 599999, 1]]
expected_concepts:
  - "GROUP BY with several aggregates in one pass"
  - "conditional aggregation with SUM(CASE ...) or COUNT(CASE ...)"
  - "returning 0 instead of NULL for empty conditional counts"
  - "deterministic ORDER BY"
optimal_complexity: {time: "O(n) aggregation pass plus O(e log e) to sort e endpoints", space: "O(e) for the grouped result"}
rubric:
  excellent: "Computes every column in one grouped pass, counts server errors with conditional aggregation that yields 0 when none, gets the 500 boundary right and orders by endpoint."
  good: "Correct query after a hint about conditional counting or the 4xx versus 5xx boundary."
  weak: "Filters errors in WHERE (losing the other counts), counts 4xx as errors, uses COUNT on a boolean that counts every row, or omits the ORDER BY."
  criteria:
    correctness: "All tests pass, including 4xx-only endpoints and the 499/500 boundary."
    efficiency: "A single scan with grouping; no separate subquery per column."
    code_quality: "Clear aggregate expressions and the exact output column names."
    edge_cases: "Empty table, single-request endpoints, endpoints where every request failed and very large latencies."
    communication: "Explains why the error filter lives inside the aggregate rather than in WHERE."
hints:
  - "Every output column is a summary of one endpoint's requests, so think about grouping once and computing all of them together."
  - "The error count must not remove the successful requests from the other columns, so the condition cannot go in WHERE; it has to live inside an aggregate."
  - "Group by endpoint, use COUNT, MIN and MAX for the first three numbers, and add up a CASE expression that gives one for a status code of 500 or more and zero otherwise; then order by endpoint."
followups:
  - "How would you add an approximate 95th-percentile latency per endpoint?"
  - "How would you restrict the summary to the last hour if the table had a timestamp column?"
  - "Which index or pre-aggregation would you use when the table grows by millions of rows per hour?"
common_errors:
  - "Filtering status_code >= 500 in WHERE, which changes request_count and the latency columns."
  - "Writing COUNT of a boolean comparison, which counts every non-NULL row instead of only the errors."
  - "Treating 4xx client errors as server errors."
