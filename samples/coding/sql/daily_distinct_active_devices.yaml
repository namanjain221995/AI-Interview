expected_concepts:
  - GROUP BY on a computed expression (SUBSTR of the timestamp)
  - COUNT(DISTINCT ...) versus COUNT(*)
  - deterministic ORDER BY
  - lexicographic order of fixed-format date strings
optimal_complexity: {time: "O(n log n) for grouping and sorting", space: "O(d + u) where d is days and u distinct (day, device) pairs"}
rubric:
  excellent: Groups by SUBSTR(event_ts, 1, 10), counts COUNT(DISTINCT device_id), orders by day, and explains why fixed-format date text sorts chronologically and what an index or a stored date column would change.
  good: Correct query after a hint about counting distinct devices or adding ORDER BY.
  weak: Counts events with COUNT(*), groups by the full timestamp, relies on vendor-specific date functions or omits ORDER BY.
  criteria:
    correctness: All tests pass, including repeated events, midnight boundaries and case-sensitive device ids.
    efficiency: One grouped scan; mentions that an expression index or a separate date column helps on large tables.
    code_quality: Clear output aliases and the day expression used consistently in SELECT and GROUP BY.
    edge_cases: Empty table, single event, out-of-order rows and year boundaries.
    communication: Explains the difference between events and distinct devices.
hints:
  - Every event on the same calendar day shares the same first ten characters of its timestamp; that prefix is the natural grouping key.
  - Counting rows per day counts events, not devices. You need an aggregate that ignores repeated device ids within each group.
  - Group by the ten-character day prefix, count the distinct device ids in each group, alias both columns as requested and sort by the day text, which is chronological because the format is fixed-width.
followups:
  - How would you also list days with zero active devices in a date range?
  - How would you compute weekly active devices without double counting a device seen on several days?
  - What would you index or precompute if this table held billions of events?
common_errors:
  - Using COUNT(*) or COUNT(device_id), which counts events instead of devices.
  - Grouping by the full event_ts, producing one row per timestamp.
  - Forgetting ORDER BY and relying on the grouping order.
  - Using vendor-specific date functions such as DATE() or DATE_TRUNC that do not run on both engines.
