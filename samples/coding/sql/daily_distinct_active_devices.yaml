version: 1
slug: daily_distinct_active_devices
title: Daily Active Devices
difficulty: easy
competency_keys: [sql, databases]
role_tags: [data_analyst, data, product_manager]
time_limit_minutes: 12
prompt_markdown: |
  ## Daily Active Devices

  A fleet of field gateways sends telemetry events (heartbeats, sensor readings, firmware pings) to a
  collector. Product wants a simple adoption chart: **how many different devices were active on each
  calendar day**.

  Table `device_events`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | device_id | VARCHAR(40) | identifier of the sending device; compared exactly (case-sensitive) |
  | event_ts | TEXT | UTC timestamp in the fixed format `YYYY-MM-DD HH:MM:SS` |

  The calendar day of an event is the first 10 characters of `event_ts`, i.e. `SUBSTR(event_ts, 1, 10)`
  (for example `2026-03-14`).

  Return one row per day that has **at least one event**, with columns:

  - `day`: the calendar day as text `YYYY-MM-DD`;
  - `active_devices`: the number of **distinct** devices with at least one event on that day. A device
    that sends many events on the same day counts once for that day; a device active on two days counts
    once on each of them.

  Order the rows by `day` ascending. Days without events are not listed; an empty table returns no rows.

  Write standard SQL that runs on both PostgreSQL and SQLite (do not use date or time functions).

  ### Example 1
  ```
  device_events
  +----+------------+---------------------+
  | id | device_id  | event_ts            |
  +----+------------+---------------------+
  | 1  | gw-north-1 | 2026-03-14 08:00:05 |
  | 2  | gw-north-1 | 2026-03-14 08:05:05 |
  | 3  | gw-south-2 | 2026-03-14 13:40:00 |
  | 4  | gw-north-1 | 2026-03-15 07:59:58 |
  | 5  | gw-east-7  | 2026-03-15 22:10:41 |
  | 6  | gw-south-2 | 2026-03-15 23:01:00 |
  | 7  | gw-east-7  | 2026-03-17 00:00:00 |
  +----+------------+---------------------+

  Output
  +------------+----------------+
  | day        | active_devices |
  +------------+----------------+
  | 2026-03-14 | 2              |
  | 2026-03-15 | 3              |
  | 2026-03-17 | 1              |
  +------------+----------------+
  gw-north-1 sends two events on 2026-03-14 but is counted once. 2026-03-16 has no events and is not listed.
  ```

  ### Example 2
  ```
  device_events
  +----+-----------+---------------------+
  | id | device_id | event_ts            |
  +----+-----------+---------------------+
  | 1  | meter-a   | 2026-03-31 23:59:59 |
  | 2  | meter-a   | 2026-04-01 00:00:00 |
  | 3  | meter-b   | 2026-04-01 12:30:00 |
  | 4  | meter-b   | 2026-04-01 12:30:00 |
  +----+-----------+---------------------+

  Output
  +------------+----------------+
  | day        | active_devices |
  +------------+----------------+
  | 2026-03-31 | 1              |
  | 2026-04-01 | 2              |
  +------------+----------------+
  meter-a is active on both days. meter-b's two identical events on 2026-04-01 still count once.
  ```

  ### Constraints
  - `0 <= rows in device_events <= 10^5`
  - Every `event_ts` is a valid timestamp in the format `YYYY-MM-DD HH:MM:SS`; rows may be stored in any order.
  - `device_id` is never NULL.
languages: [sql]
starter_code:
  sql: |
    -- Return day (YYYY-MM-DD) and active_devices (distinct devices with an event that day), ordered by day.
    SELECT event_ts AS day, device_id AS active_devices
    FROM device_events;
reference_solutions:
  sql: |
    SELECT SUBSTR(event_ts, 1, 10) AS day,
           COUNT(DISTINCT device_id) AS active_devices
    FROM device_events
    GROUP BY SUBSTR(event_ts, 1, 10)
    ORDER BY day;
sql_setup: |
  CREATE TABLE device_events (
    id INTEGER PRIMARY KEY,
    device_id VARCHAR(40) NOT NULL,
    event_ts TEXT NOT NULL
  );
tests:
  - id: t1
    ordered: true
    description: "Example 1 - repeated events of one device on a day count once"
    setup_sql: |
      INSERT INTO device_events (id, device_id, event_ts) VALUES
        (1, 'gw-north-1', '2026-03-14 08:00:05'), (2, 'gw-north-1', '2026-03-14 08:05:05'), (3, 'gw-south-2', '2026-03-14 13:40:00'), (4, 'gw-north-1', '2026-03-15 07:59:58'), (5, 'gw-east-7', '2026-03-15 22:10:41'),
        (6, 'gw-south-2', '2026-03-15 23:01:00'), (7, 'gw-east-7', '2026-03-17 00:00:00');
    expected_rows: [["2026-03-14", 2], ["2026-03-15", 3], ["2026-03-17", 1]]
  - id: t2
    ordered: true
    description: "Example 2 - events one second apart across midnight belong to different days"
    setup_sql: |
      INSERT INTO device_events (id, device_id, event_ts) VALUES
        (1, 'meter-a', '2026-03-31 23:59:59'), (2, 'meter-a', '2026-04-01 00:00:00'), (3, 'meter-b', '2026-04-01 12:30:00'), (4, 'meter-b', '2026-04-01 12:30:00');
    expected_rows: [["2026-03-31", 1], ["2026-04-01", 2]]
  - id: t3
    hidden: true
    ordered: true
    description: "Empty table - no rows"
    expected_rows: []
  - id: t4
    hidden: true
    ordered: true
    description: "Single event"
    setup_sql: |
      INSERT INTO device_events (id, device_id, event_ts) VALUES (1, 'x', '2026-01-01 00:00:00');
    expected_rows: [["2026-01-01", 1]]
  - id: t5
    hidden: true
    ordered: true
    description: "One device sending many events on one day - COUNT(*) instead of COUNT(DISTINCT) gives 6"
    setup_sql: |
      INSERT INTO device_events (id, device_id, event_ts) VALUES
        (1, 'pump-9', '2026-02-10 01:00:00'), (2, 'pump-9', '2026-02-10 03:00:00'), (3, 'pump-9', '2026-02-10 05:00:00'), (4, 'pump-9', '2026-02-10 09:00:00'), (5, 'pump-9', '2026-02-10 15:00:00'),
        (6, 'pump-9', '2026-02-10 23:00:00');
    expected_rows: [["2026-02-10", 1]]
  - id: t6
    hidden: true
    ordered: true
    description: "Rows inserted out of time order across a year boundary - output ordered by day"
    setup_sql: |
      INSERT INTO device_events (id, device_id, event_ts) VALUES
        (1, 'd3', '2026-01-02 10:00:00'), (2, 'd1', '2025-12-31 23:00:00'), (3, 'd2', '2026-01-01 00:00:01'), (4, 'd1', '2026-01-01 05:00:00'), (5, 'd2', '2025-12-31 01:00:00'),
        (6, 'd3', '2025-12-31 12:00:00');
    expected_rows: [["2025-12-31", 3], ["2026-01-01", 2], ["2026-01-02", 1]]
  - id: t7
    hidden: true
    ordered: true
    description: "Device ids differing only in case are distinct devices"
    setup_sql: |
      INSERT INTO device_events (id, device_id, event_ts) VALUES
        (1, 'Sensor-1', '2026-06-01 09:00:00'), (2, 'sensor-1', '2026-06-01 09:00:00'), (3, 'SENSOR-1', '2026-06-01 10:00:00'), (4, 'sensor-1', '2026-06-02 09:00:00');
    expected_rows: [["2026-06-01", 3], ["2026-06-02", 1]]
  - id: t8
    hidden: true
    ordered: true
    description: "Grouping by full timestamp (or by hour) instead of day splits a day into several rows"
    setup_sql: |
      INSERT INTO device_events (id, device_id, event_ts) VALUES
        (1, 'a', '2026-07-04 01:00:00'), (2, 'b', '2026-07-04 02:00:00'), (3, 'c', '2026-07-04 03:00:00'), (4, 'a', '2026-07-05 01:00:00'), (5, 'b', '2026-07-05 01:00:00');
    expected_rows: [["2026-07-04", 3], ["2026-07-05", 2]]
