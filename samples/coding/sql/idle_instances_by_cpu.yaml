expected_concepts:
  - "GROUP BY with aggregate functions (COUNT, MAX)"
  - "HAVING to filter groups after aggregation"
  - "expressing 'every row satisfies' as a condition on MAX"
  - "WHERE versus HAVING semantics"
optimal_complexity: {time: "O(n log n) for grouping and sorting (O(n) with hash aggregation)", space: "O(m) for m instances"}
rubric:
  excellent: "Writes one GROUP BY with HAVING COUNT(*) >= 5 AND MAX(cpu_pct) < 5, explains why a WHERE filter on cpu_pct would wrongly keep instances with spikes, and orders by instance_id."
  good: "Reaches the correct query after a hint about the strict bound or about WHERE versus HAVING."
  weak: "Filters samples with WHERE before counting, uses 5 as an inclusive bound, or returns instances with fewer than 5 samples."
  criteria:
    correctness: "All tests pass, including spikes among quiet samples and both thresholds."
    efficiency: "Single aggregation pass with no self-joins or per-instance subqueries."
    code_quality: "Clear output aliases and a HAVING clause that reads like the requirement."
    edge_cases: "Empty table, exactly 5 samples, a sample of exactly 5 percent and instances that are always busy."
    communication: "Explains how MAX turns 'every sample' into one group condition and why WHERE changes the meaning."
hints:
  - "Both conditions are about an instance as a whole, not about individual samples. Think about grouping first and testing the group afterwards."
  - "Every sample being below 5 is the same as the highest sample being below 5, and conditions on groups go in HAVING rather than WHERE."
  - "Group by instance_id, select the row count and the maximum cpu_pct, keep groups whose count is at least 5 and whose maximum is strictly below 5 with a HAVING clause, and order by instance_id."
followups:
  - "How would you restrict the analysis to the last 7 days of samples, and where would that condition go?"
  - "How would you also require the 95th percentile of memory usage to be low if there were a memory column?"
  - "What index would help this report on a table with billions of samples?"
common_errors:
  - "Filtering WHERE cpu_pct < 5 before grouping, which keeps instances that have spikes as long as five quiet samples exist."
  - "Using cpu_pct <= 5, which treats a sample of exactly 5 as idle."
  - "Forgetting the minimum sample count, so instances with one quiet sample are flagged."
