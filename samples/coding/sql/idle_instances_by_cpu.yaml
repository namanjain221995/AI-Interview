version: 1
slug: idle_instances_by_cpu
title: "Idle Instances by CPU"
difficulty: easy
competency_keys: [sql, databases]
role_tags: [cloud, devops, sre]
time_limit_minutes: 12
prompt_markdown: |
  ## Idle Instances by CPU

  The cloud cost team collects CPU utilisation samples from every virtual machine and wants a short
  list of machines that are safe to downsize.

  Table `cpu_samples`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key |
  | instance_id | VARCHAR(40) | machine identifier |
  | sampled_at | TEXT | sample time, `YYYY-MM-DD HH:MM` (not needed for this report) |
  | cpu_pct | INTEGER | CPU utilisation in whole percent, 0 to 100 |

  Each row is one sample. An instance is **idle** when:

  - it has **at least 5 samples**, and
  - **every** one of its samples is **below 5** percent (a sample of exactly 5 disqualifies it).

  Return one row per idle instance with the columns `instance_id`, `sample_count` (the number of
  samples of the instance) and `peak_cpu` (its highest sample). Order the rows by `instance_id`
  ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  cpu_samples
  +----+-------------+------------------+---------+
  | id | instance_id | sampled_at       | cpu_pct |
  +----+-------------+------------------+---------+
  | 1  | i-0a17      | 2026-05-04 10:00 | 2       |
  | 2  | i-0b22      | 2026-05-04 10:00 | 1       |
  | 3  | i-0c35      | 2026-05-04 10:00 | 0       |
  | 4  | i-0a17      | 2026-05-04 10:05 | 1       |
  | 5  | i-0b22      | 2026-05-04 10:05 | 2       |
  | 6  | i-0c35      | 2026-05-04 10:05 | 0       |
  | 7  | i-0a17      | 2026-05-04 10:10 | 3       |
  | 8  | i-0b22      | 2026-05-04 10:10 | 1       |
  | 9  | i-0c35      | 2026-05-04 10:10 | 1       |
  | 10 | i-0a17      | 2026-05-04 10:15 | 0       |
  | 11 | i-0b22      | 2026-05-04 10:15 | 7       |
  | 12 | i-0c35      | 2026-05-04 10:15 | 0       |
  | 13 | i-0a17      | 2026-05-04 10:20 | 4       |
  | 14 | i-0b22      | 2026-05-04 10:20 | 1       |
  | 15 | i-0b22      | 2026-05-04 10:25 | 0       |
  +----+-------------+------------------+---------+

  Output
  +-------------+--------------+----------+
  | instance_id | sample_count | peak_cpu |
  +-------------+--------------+----------+
  | i-0a17      | 5            | 4        |
  +-------------+--------------+----------+
  i-0b22 has five samples below 5 but one sample of 7, so it is not idle.
  i-0c35 is always quiet but has only 4 samples.
  ```

  ### Example 2
  ```
  cpu_samples
  +----+-------------+------------------+---------+
  | id | instance_id | sampled_at       | cpu_pct |
  +----+-------------+------------------+---------+
  | 1  | i-07fe      | 2026-05-04 10:00 | 0       |
  | 2  | i-08ed      | 2026-05-04 10:00 | 4       |
  | 3  | i-07fe      | 2026-05-04 10:05 | 0       |
  | 4  | i-08ed      | 2026-05-04 10:05 | 5       |
  | 5  | i-07fe      | 2026-05-04 10:10 | 0       |
  | 6  | i-08ed      | 2026-05-04 10:10 | 3       |
  | 7  | i-07fe      | 2026-05-04 10:15 | 0       |
  | 8  | i-08ed      | 2026-05-04 10:15 | 2       |
  | 9  | i-07fe      | 2026-05-04 10:20 | 0       |
  | 10 | i-08ed      | 2026-05-04 10:20 | 1       |
  +----+-------------+------------------+---------+

  Output
  +-------------+--------------+----------+
  | instance_id | sample_count | peak_cpu |
  +-------------+--------------+----------+
  | i-07fe      | 5            | 0        |
  +-------------+--------------+----------+
  i-08ed has one sample of exactly 5, which is not below 5.
  ```

  ### Constraints
  - `0 <= rows in cpu_samples <= 10^5`
  - `0 <= cpu_pct <= 100`
  - `instance_id` values use lowercase letters, digits and hyphens.
languages: [sql]
starter_code:
  sql: |
    -- Return instance_id, sample_count and peak_cpu for every idle instance.
    SELECT instance_id, COUNT(*) AS sample_count, MAX(cpu_pct) AS peak_cpu
    FROM cpu_samples
    GROUP BY instance_id
    ORDER BY instance_id;
reference_solutions:
  sql: |
    SELECT instance_id, COUNT(*) AS sample_count, MAX(cpu_pct) AS peak_cpu
    FROM cpu_samples
    GROUP BY instance_id
    HAVING COUNT(*) >= 5 AND MAX(cpu_pct) < 5
    ORDER BY instance_id;
sql_setup: |
  CREATE TABLE cpu_samples (
    id INTEGER PRIMARY KEY,
    instance_id VARCHAR(40) NOT NULL,
    sampled_at TEXT NOT NULL,
    cpu_pct INTEGER NOT NULL
  );
