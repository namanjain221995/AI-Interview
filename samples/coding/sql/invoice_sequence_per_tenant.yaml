version: 1
slug: invoice_sequence_per_tenant
title: Per-Tenant Invoice Sequence
difficulty: easy
competency_keys: [sql, databases]
role_tags: [backend, data, business_analyst]
time_limit_minutes: 12
prompt_markdown: |
  ## Per-Tenant Invoice Sequence

  A multi-tenant billing service keeps the invoices of every tenant in one shared table, so the `id`
  values are global and interleaved between tenants. Accounting rules require each tenant to see its
  own invoices numbered `1, 2, 3, ...` without gaps, in the order they were issued.

  Table `invoices`:

  | column | type | notes |
  |--------|------|-------|
  | id | INTEGER | primary key; assigned when a draft is created, so id order is **not** issue order |
  | tenant_id | INTEGER | owning tenant |
  | issued_at | TEXT | UTC timestamp formatted `'YYYY-MM-DD HH:MM:SS'` (text order equals time order) |

  For every invoice return `id`, `tenant_id` and `seq_no`, where `seq_no` is the invoice's position
  among **its own tenant's** invoices ordered by `issued_at` ascending, starting at 1. When two invoices
  of the same tenant share the same `issued_at`, the one with the **smaller `id`** gets the smaller
  number. Every invoice appears exactly once.

  Order the result by `tenant_id` ascending, then `seq_no` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  invoices
  +----+-----------+---------------------+
  | id | tenant_id | issued_at           |
  +----+-----------+---------------------+
  | 1  | 20        | 2026-03-02 09:15:00 |
  | 2  | 10        | 2026-03-01 08:00:00 |
  | 3  | 20        | 2026-03-01 17:40:00 |
  | 4  | 10        | 2026-03-03 12:00:00 |
  | 5  | 20        | 2026-03-04 10:05:00 |
  +----+-----------+---------------------+

  Output
  +----+-----------+--------+
  | id | tenant_id | seq_no |
  +----+-----------+--------+
  | 2  | 10        | 1      |
  | 4  | 10        | 2      |
  | 3  | 20        | 1      |
  | 1  | 20        | 2      |
  | 5  | 20        | 3      |
  +----+-----------+--------+
  Tenant 20's invoice 3 was issued before invoice 1, so it is number 1.
  ```

  ### Example 2
  ```
  invoices
  +----+-----------+---------------------+
  | id | tenant_id | issued_at           |
  +----+-----------+---------------------+
  | 11 | 7         | 2026-05-10 14:00:00 |
  | 9  | 7         | 2026-05-10 14:00:00 |
  | 10 | 7         | 2026-05-09 23:59:59 |
  +----+-----------+---------------------+

  Output
  +----+-----------+--------+
  | id | tenant_id | seq_no |
  +----+-----------+--------+
  | 10 | 7         | 1      |
  | 9  | 7         | 2      |
  | 11 | 7         | 3      |
  +----+-----------+--------+
  Invoices 9 and 11 were issued in the same second; the smaller id comes first.
  ```

  ### Constraints
  - `0 <= rows <= 10^5`
  - `issued_at` is never NULL and always uses the exact format above.
  - Numbering restarts at 1 for every tenant and has no gaps, even when timestamps tie.
languages: [sql]
starter_code:
  sql: |
    -- Return id, tenant_id and seq_no (1, 2, 3, ... per tenant in issue order), ordered by tenant_id, seq_no.
    SELECT id, tenant_id, id AS seq_no
    FROM invoices
    ORDER BY tenant_id, seq_no;
reference_solutions:
  sql: |
    SELECT id,
           tenant_id,
           ROW_NUMBER() OVER (PARTITION BY tenant_id ORDER BY issued_at, id) AS seq_no
    FROM invoices
    ORDER BY tenant_id, seq_no;
sql_setup: |
  CREATE TABLE invoices (
    id INTEGER PRIMARY KEY,
    tenant_id INTEGER NOT NULL,
    issued_at TEXT NOT NULL
  );
tests:
  - id: t1
    description: "Example 1 - two tenants, id order differs from issue order"
    ordered: true
    setup_sql: |
      INSERT INTO invoices (id, tenant_id, issued_at) VALUES
        (1, 20, '2026-03-02 09:15:00'), (2, 10, '2026-03-01 08:00:00'), (3, 20, '2026-03-01 17:40:00'),
        (4, 10, '2026-03-03 12:00:00'), (5, 20, '2026-03-04 10:05:00');
    expected_rows: [[2, 10, 1], [4, 10, 2], [3, 20, 1], [1, 20, 2], [5, 20, 3]]
  - id: t2
    description: "Example 2 - equal timestamps broken by smaller id"
    ordered: true
    setup_sql: |
      INSERT INTO invoices (id, tenant_id, issued_at) VALUES
        (11, 7, '2026-05-10 14:00:00'), (9, 7, '2026-05-10 14:00:00'), (10, 7, '2026-05-09 23:59:59');
    expected_rows: [[10, 7, 1], [9, 7, 2], [11, 7, 3]]
  - id: t3
    hidden: true
    description: "Empty table returns no rows"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Single invoice gets seq_no 1"
    ordered: true
    setup_sql: "INSERT INTO invoices (id, tenant_id, issued_at) VALUES (42, 3, '2026-01-15 10:00:00');"
    expected_rows: [[42, 3, 1]]
  - id: t5
    hidden: true
    description: "Ids strictly reverse to issue order inside one tenant (ORDER BY id trap)"
    ordered: true
    setup_sql: |
      INSERT INTO invoices (id, tenant_id, issued_at) VALUES
        (50, 1, '2026-02-01 08:00:00'), (40, 1, '2026-02-02 08:00:00'), (30, 1, '2026-02-03 08:00:00'),
        (20, 1, '2026-02-04 08:00:00'), (10, 1, '2026-02-05 08:00:00');
    expected_rows: [[50, 1, 1], [40, 1, 2], [30, 1, 3], [20, 1, 4], [10, 1, 5]]
  - id: t6
    hidden: true
    description: "Several interleaved tenants with non-contiguous ids - numbering restarts per tenant, tenants sorted numerically"
    ordered: true
    setup_sql: |
      INSERT INTO invoices (id, tenant_id, issued_at) VALUES
        (1, 1000, '2026-04-01 09:00:00'), (2, 55, '2026-04-01 09:00:01'), (3, 1, '2026-04-01 09:00:02'),
        (4, 55, '2026-03-31 23:00:00'), (5, 1000, '2026-04-02 07:30:00'), (6, 1, '2026-04-01 08:59:59'),
        (7, 55, '2026-04-03 12:00:00'), (8, 1000, '2026-03-30 18:00:00'), (9, 1, '2026-04-05 06:00:00');
    expected_rows: [[6, 1, 1], [3, 1, 2], [9, 1, 3], [4, 55, 1], [2, 55, 2], [7, 55, 3], [8, 1000, 1], [1, 1000, 2], [5, 1000, 3]]
  - id: t7
    hidden: true
    description: "Every invoice issued in the same second across two tenants - gapless numbering by id (RANK/DENSE_RANK trap)"
    ordered: true
    setup_sql: |
      INSERT INTO invoices (id, tenant_id, issued_at) VALUES
        (8, 2, '2026-06-30 23:59:59'), (3, 1, '2026-06-30 23:59:59'), (6, 2, '2026-06-30 23:59:59'),
        (1, 1, '2026-06-30 23:59:59'), (7, 1, '2026-06-30 23:59:59'), (2, 2, '2026-06-30 23:59:59');
    expected_rows: [[1, 1, 1], [3, 1, 2], [7, 1, 3], [2, 2, 1], [6, 2, 2], [8, 2, 3]]
  - id: t8
    hidden: true
    description: "Year and hour boundaries - text ordering of the fixed timestamp format matches time order"
    ordered: true
    setup_sql: |
      INSERT INTO invoices (id, tenant_id, issued_at) VALUES
        (1, 4, '2026-01-01 00:00:00'), (2, 4, '2025-12-31 23:59:59'), (3, 4, '2026-01-01 10:00:00'),
        (4, 4, '2026-01-01 09:59:59'), (5, 4, '2025-01-01 00:00:00');
    expected_rows: [[5, 4, 1], [2, 4, 2], [1, 4, 3], [4, 4, 4], [3, 4, 5]]
  - id: t9
    hidden: true
    description: "Mixed ties and distinct times in several tenants, ties in the middle of a sequence"
    ordered: true
    setup_sql: |
      INSERT INTO invoices (id, tenant_id, issued_at) VALUES
        (21, 9, '2026-07-01 10:00:00'), (14, 9, '2026-07-01 11:00:00'), (12, 9, '2026-07-01 11:00:00'),
        (30, 9, '2026-07-01 12:00:00'), (13, 8, '2026-07-02 10:00:00'), (25, 8, '2026-07-01 10:00:00'),
        (11, 8, '2026-07-02 10:00:00'), (40, 9, '2026-06-30 10:00:00');
    expected_rows: [[25, 8, 1], [11, 8, 2], [13, 8, 3], [40, 9, 1], [21, 9, 2], [12, 9, 3], [14, 9, 4], [30, 9, 5]]
expected_concepts:
  - "ROW_NUMBER() with PARTITION BY"
  - "deterministic tie-breaking with a secondary sort key"
  - "difference between ROW_NUMBER, RANK and DENSE_RANK"
  - "explicit result ordering"
optimal_complexity: {time: "O(n log n) for the partitioned sort (or an index on (tenant_id, issued_at, id))", space: "O(n)"}
rubric:
  excellent: "Uses ROW_NUMBER() OVER (PARTITION BY tenant_id ORDER BY issued_at, id), explains why RANK or DENSE_RANK would create duplicate numbers on ties, orders the output explicitly and mentions an index on (tenant_id, issued_at, id)."
  good: "Reaches a correct window query after a hint about tied timestamps or restarting the numbering per tenant."
  weak: "Numbers rows by id, numbers globally instead of per tenant, uses RANK so tied invoices share a number, or leaves the output unordered."
  criteria:
    correctness: "All tests pass, including tied timestamps, ids out of issue order and several tenants."
    efficiency: "A single window pass; mentions that a correlated COUNT per row is quadratic without an index."
    code_quality: "Readable window clause, clear column aliases and an explicit ORDER BY."
    edge_cases: "Empty table, single invoice, ties, year boundaries and non-contiguous tenant ids."
    communication: "Explains why the tie-breaker is needed for a gapless, reproducible sequence."
hints:
  - "Each tenant gets its own independent counter - think about a window function that restarts for every tenant."
  - "Order rows inside each tenant by issue time; when times tie you still need a unique, repeatable order, so add a second sort key."
  - "Use ROW_NUMBER() over a window partitioned by tenant_id and ordered by issued_at then id, and sort the final result by tenant_id and that number."
followups:
  - "What would RANK() and DENSE_RANK() return for invoices issued in the same second?"
  - "How would you assign these numbers at insert time so they never change, and what concurrency problems does that raise?"
  - "How would you produce the same numbering without window functions?"
common_errors:
  - "Using the global id as the sequence number, which has gaps and ignores issue order."
  - "Forgetting PARTITION BY, which numbers invoices across all tenants."
  - "Using RANK or DENSE_RANK, which gives tied invoices the same number."
  - "Omitting the id tie-breaker, which makes the numbering nondeterministic on equal timestamps."
