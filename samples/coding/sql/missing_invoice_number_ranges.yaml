version: 1
slug: missing_invoice_number_ranges
title: Missing Invoice Number Ranges
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data, business_analyst, qa]
time_limit_minutes: 25
prompt_markdown: |
  ## Missing Invoice Number Ranges

  A billing system hands out invoice numbers from pre-allocated **number books**: each book reserves a
  continuous block of numbers, and every invoice issued from a book must use a number from that block.
  Before the year-end audit, the finance team must explain every reserved number that was **never
  issued** (voided drafts, crashed batch runs, manual skips).

  Table `invoice_books`:

  | column | type | notes |
  |--------|------|-------|
  | book_id | INTEGER | primary key |
  | first_no | INTEGER | first number reserved by the book |
  | last_no | INTEGER | last number reserved by the book, `last_no >= first_no` |

  Table `invoices`:

  | column | type | notes |
  |--------|------|-------|
  | invoice_no | INTEGER | primary key |
  | book_id | INTEGER | references `invoice_books.book_id` |

  The number ranges of different books never overlap, and every invoice's number lies inside the range
  `[first_no, last_no]` of its own book.

  For each book, find every **maximal run of consecutive reserved numbers that were never issued**.
  Runs can sit at the start of the book, between two issued numbers or at the end of the book, and a
  book with no invoices at all is one single run. A run never continues into another book, even when
  the next book's range starts right after this one.

  Return one row per run with columns `book_id`, `gap_start`, `gap_end` (both **inclusive**) and
  `missing_count` (`gap_end - gap_start + 1`), ordered by `book_id` ascending and then by `gap_start`
  ascending. A book whose numbers were all issued produces no rows.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  invoice_books                    invoices
  +---------+----------+---------+ +------------+---------+
  | book_id | first_no | last_no | | invoice_no | book_id |
  +---------+----------+---------+ +------------+---------+
  | 1       | 1000     | 1009    | | 1000       | 1       |
  | 2       | 2000     | 2004    | | 1001       | 1       |
  +---------+----------+---------+ | 1004       | 1       |
                                   | 1005       | 1       |
                                   | 1009       | 1       |
                                   | 2002       | 2       |
                                   +------------+---------+

  Output
  +---------+-----------+---------+---------------+
  | book_id | gap_start | gap_end | missing_count |
  +---------+-----------+---------+---------------+
  | 1       | 1002      | 1003    | 2             |
  | 1       | 1006      | 1008    | 3             |
  | 2       | 2000      | 2001    | 2             |
  | 2       | 2003      | 2004    | 2             |
  +---------+-----------+---------+---------------+
  Book 2 is missing numbers both before and after its only invoice.
  ```

  ### Example 2
  ```
  invoice_books                    invoices
  +---------+----------+---------+ +------------+---------+
  | book_id | first_no | last_no | | invoice_no | book_id |
  +---------+----------+---------+ +------------+---------+
  | 7       | 500      | 503     | | 500        | 7       |
  | 8       | 600      | 602     | | 501        | 7       |
  +---------+----------+---------+ | 502        | 7       |
                                   | 503        | 7       |
                                   +------------+---------+

  Output
  +---------+-----------+---------+---------------+
  | book_id | gap_start | gap_end | missing_count |
  +---------+-----------+---------+---------------+
  | 8       | 600       | 602     | 3             |
  +---------+-----------+---------+---------------+
  Book 7 is complete; book 8 has not issued anything yet.
  ```

  ### Constraints
  - `0 <= rows in invoice_books <= 10^4`, `0 <= rows in invoices <= 10^6`
  - `1 <= first_no <= last_no <= 10^9`; book ranges never overlap.
  - Every `invoice_no` is unique and lies inside its own book's range.
languages: [sql]
starter_code:
  sql: |
    -- Return book_id, gap_start, gap_end and missing_count for every run of never-issued numbers.
    SELECT b.book_id, b.first_no AS gap_start, b.last_no AS gap_end, 0 AS missing_count
    FROM invoice_books b
    ORDER BY b.book_id, b.first_no;
reference_solutions:
  sql: |
    WITH starts AS (
      SELECT b.book_id, b.first_no AS gap_start, b.last_no
      FROM invoice_books b
      WHERE NOT EXISTS (SELECT 1 FROM invoices i WHERE i.invoice_no = b.first_no)
      UNION ALL
      SELECT b.book_id, i.invoice_no + 1 AS gap_start, b.last_no
      FROM invoices i
      JOIN invoice_books b ON b.book_id = i.book_id
      WHERE i.invoice_no < b.last_no
        AND NOT EXISTS (SELECT 1 FROM invoices n WHERE n.invoice_no = i.invoice_no + 1)
    ),
    gaps AS (
      SELECT
        s.book_id,
        s.gap_start,
        COALESCE(
          (SELECT MIN(n.invoice_no) FROM invoices n
           WHERE n.invoice_no > s.gap_start AND n.invoice_no <= s.last_no) - 1,
          s.last_no
        ) AS gap_end
      FROM starts s
    )
    SELECT book_id, gap_start, gap_end, gap_end - gap_start + 1 AS missing_count
    FROM gaps
    ORDER BY book_id, gap_start;
sql_setup: |
  CREATE TABLE invoice_books (
    book_id INTEGER PRIMARY KEY,
    first_no INTEGER NOT NULL,
    last_no INTEGER NOT NULL
  );
  CREATE TABLE invoices (
    invoice_no INTEGER PRIMARY KEY,
    book_id INTEGER NOT NULL REFERENCES invoice_books (book_id)
  );
tests:
  - id: t1
    description: "Example 1 - gaps in the middle, at the start and at the end of books"
    ordered: true
    setup_sql: |
      INSERT INTO invoice_books (book_id, first_no, last_no) VALUES (1, 1000, 1009), (2, 2000, 2004);
      INSERT INTO invoices (invoice_no, book_id) VALUES (1000, 1), (1001, 1), (1004, 1), (1005, 1), (1009, 1), (2002, 2);
    expected_rows: 
      - [1, 1002, 1003, 2]
      - [1, 1006, 1008, 3]
      - [2, 2000, 2001, 2]
      - [2, 2003, 2004, 2]
  - id: t2
    description: "Example 2 - complete book gives no rows, empty book is one run"
    ordered: true
    setup_sql: |
      INSERT INTO invoice_books (book_id, first_no, last_no) VALUES (7, 500, 503), (8, 600, 602);
      INSERT INTO invoices (invoice_no, book_id) VALUES (500, 7), (501, 7), (502, 7), (503, 7);
    expected_rows: [[8, 600, 602, 3]]
  - id: t3
    hidden: true
    description: "Empty tables"
    ordered: true
    expected_rows: []
  - id: t4
    hidden: true
    description: "Books without any invoice, including a one-number book - min/max of issued numbers finds nothing"
    ordered: true
    setup_sql: |
      INSERT INTO invoice_books (book_id, first_no, last_no) VALUES (3, 10, 10), (1, 1, 5);
    expected_rows: [[1, 1, 5, 5], [3, 10, 10, 1]]
  - id: t5
    hidden: true
    description: "Single missing number at the very start and very end of a book (outside the min-max of issued numbers)"
    ordered: true
    setup_sql: |
      INSERT INTO invoice_books (book_id, first_no, last_no) VALUES (1, 100, 110);
      INSERT INTO invoices (invoice_no, book_id) VALUES
