    expected_rows: [[1, 100, 100, 1], [1, 110, 110, 1]]
  - id: t6
    hidden: true
    description: "Adjacent books - 104 (end of book 1) and 105 (start of book 2) must stay separate runs"
    ordered: true
    setup_sql: |
      INSERT INTO invoice_books (book_id, first_no, last_no) VALUES (1, 100, 104), (2, 105, 109);
      INSERT INTO invoices (invoice_no, book_id) VALUES (100, 1), (101, 1), (102, 1), (103, 1), (106, 2), (107, 2), (108, 2), (109, 2);
    expected_rows: [[1, 104, 104, 1], [2, 105, 105, 1]]
  - id: t7
    hidden: true
    description: "One-number books issued and not issued, plus a three-number book with only the middle issued"
    ordered: true
    setup_sql: |
      INSERT INTO invoice_books (book_id, first_no, last_no) VALUES (5, 77, 77), (6, 78, 78), (4, 79, 81);
      INSERT INTO invoices (invoice_no, book_id) VALUES (77, 5), (80, 4);
    expected_rows: [[4, 79, 79, 1], [4, 81, 81, 1], [6, 78, 78, 1]]
  - id: t8
    hidden: true
    description: "Large invoice numbers near 10^9"
    ordered: true
    setup_sql: |
      INSERT INTO invoice_books (book_id, first_no, last_no) VALUES (9, 999999990, 1000000000);
      INSERT INTO invoices (invoice_no, book_id) VALUES (999999990, 9), (999999995, 9);
    expected_rows: [[9, 999999991, 999999994, 4], [9, 999999996, 1000000000, 5]]
