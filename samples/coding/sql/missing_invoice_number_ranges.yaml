expected_concepts:
  - gaps-and-islands on integer sequences
  - finding run starts with NOT EXISTS (n + 1) and run ends with the next issued number
  - LAG/LEAD with sentinel rows for range boundaries
  - outer boundaries of a range that are not covered by any data row
  - keeping runs inside their partition (per book)
optimal_complexity: {time: "O(n log n) for sorting invoices per book (O(n) index lookups with an index on invoice_no)", space: O(n)}
rubric:
  excellent: Finds run starts (book start or issued number + 1 when the next number is unissued) and run ends (next issued number - 1 or book end), or uses LEAD over issued numbers plus sentinel rows at first_no - 1 and last_no + 1 per book, handles empty books and book edges, and orders the output.
  good: Correctly finds gaps between issued numbers but needs a hint for leading or trailing runs, empty books or adjacent books.
  weak: Only reports gaps between the smallest and largest issued number, merges runs across books, lists missing numbers one per row, or returns wrong inclusive bounds.
  criteria:
    correctness: All tests pass, including empty books, one-number books, adjacent books and runs at both ends.
    efficiency: Set-based query that does not materialize every reserved number of large books.
    code_quality: Named CTEs for run starts and run ends, clear inclusive bounds and an explicit ORDER BY.
    edge_cases: Empty tables, books with no invoices, complete books, single-number gaps and large numbers.
    communication: Explains the run-start/run-end idea or the sentinel trick and why the book boundaries need special handling.
hints:
  - Think about what marks the beginning of a missing run and what marks its end, and remember that a run may touch the first or last reserved number of a book.
  - A run starts at the book's first number when that number is unissued, or right after an issued number whose successor is unissued; it ends just before the next issued number of the same book, or at the book's last number if there is none.
  - Build the candidate starts with two queries combined by UNION ALL (book first_no when not issued, invoice_no + 1 when invoice_no + 1 is not issued and still inside the book), then compute each end as COALESCE(smallest issued number above the start within the book minus 1, last_no); alternatively apply LEAD over each book's issued numbers padded with first_no - 1 and last_no + 1 and keep pairs that differ by more than 1.
followups:
  - How would you list the individual missing numbers when the auditors need one row per number, and what is the risk for huge books?
  - Which indexes help this query on ten million invoices?
  - How would you also flag invoices whose number lies outside their book's range?
common_errors:
  - Only looking between the smallest and largest issued number, which misses leading, trailing and whole-book runs.
  - Letting a run cross from one book into the next when the ranges are adjacent.
  - Off-by-one bounds, such as reporting the issued neighbours instead of the first and last missing numbers.
  - Generating every reserved number with a recursive CTE, which is slow for large books.
