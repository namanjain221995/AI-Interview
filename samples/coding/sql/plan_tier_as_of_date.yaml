        (5, 'starter', '2025-12-01', NULL), (5, 'growth', '2026-02-01', '2026-03-01'), (6, 'growth', '2026-02-15', '2026-02-16');
    expected_rows: [[5, "growth"], [6, "growth"]]
    ordered: true
