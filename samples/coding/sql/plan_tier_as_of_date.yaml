expected_concepts:
  - half-open validity ranges (inclusive start, exclusive end)
  - NULL as an open-ended upper bound
  - picking the latest applying row per group (NOT EXISTS, MAX subquery or ROW_NUMBER)
  - filtering before choosing the latest row
  - deterministic ORDER BY
optimal_complexity: {time: "O(n log n), or O(n) with an index on (account_id, valid_from)", space: O(n)}
rubric:
  excellent: Filters rows that apply on the day with valid_from <= day < valid_to (handling NULL), then keeps only the applying row with the latest valid_from per account (NOT EXISTS, MAX or ROW_NUMBER), and explains why filtering must happen before choosing the latest row.
  good: Correct after a hint about the exclusive end, NULL valid_to or overlapping rows.
  weak: Uses BETWEEN or <= valid_to, ignores NULL valid_to, returns several rows per account, or picks each account's newest row before checking it applies.
  criteria:
    correctness: All tests pass, including overlaps, boundary days, zero-length rows and gaps.
    efficiency: Single pass with an index-friendly predicate; no per-account procedural logic.
    code_quality: Clear grouping of the range predicate and readable aliases.
    edge_cases: Rows starting or ending exactly on the day, open rows, overlaps and empty history.
    communication: Explains half-open ranges and why BETWEEN double-counts the boundary.
hints:
  - Start with a single row - write down exactly when it applies on a given day, remembering that the end date is exclusive and may be missing.
  - Once you keep only rows that apply on 2026-02-15, an account can still have several of them; the tie-break is the latest valid_from among those applying rows, not among all rows.
  - Filter rows with valid_from at or before the day and valid_to NULL or after the day, then keep a row only when no other applying row of the same account has a later valid_from (NOT EXISTS), or rank applying rows per account by valid_from descending and keep rank 1; sort by account_id.
followups:
  - How would you return the tier for every account on every day of February?
  - How would you detect and repair overlapping rows in this table?
  - What constraint or index would you add to stop overlaps in PostgreSQL?
common_errors:
  - Using BETWEEN valid_from AND valid_to, which also matches rows ending on the day.
  - Comparing valid_to > day without handling NULL, which drops every open row.
  - Choosing each account's newest row first and filtering afterwards, which loses accounts whose newest row is not applying.
  - Returning every applying row, so overlapping accounts appear twice.
