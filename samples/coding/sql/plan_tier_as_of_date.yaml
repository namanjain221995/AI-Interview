slug: plan_tier_as_of_date
title: Plan Tier as of a Date
difficulty: medium
competency_keys: [sql, databases]
role_tags: [data, backend, product_manager]
time_limit_minutes: 20
prompt_markdown: |
  ## Plan Tier as of a Date

  Finance is reconciling the invoices issued on **15 February 2026** and needs to know which plan tier
  each account was on that day. Plan history is kept as validity ranges.

  Table `subscription_history`:

  | column | type | notes |
  |--------|------|-------|
  | account_id | INTEGER | the customer account |
  | tier | VARCHAR(20) | plan tier, for example `starter`, `growth`, `enterprise` |
  | valid_from | TEXT | `'YYYY-MM-DD'`, first day the row applies (**inclusive**) |
  | valid_to | TEXT | `'YYYY-MM-DD'`, first day the row no longer applies (**exclusive**); **NULL** while the row is still open |

  `(account_id, valid_from)` is the primary key. A row applies on day `D` when
  `valid_from <= D < valid_to`, or `valid_from <= D` when `valid_to` is NULL. A row with
  `valid_to = valid_from` never applies. Dates are fixed-width text, so comparing them as text
  compares them in time.

  The history is written by two systems, so an account's rows can **overlap**: a plan change is
  sometimes recorded before the previous row has been closed. When several rows of the same account
  apply on the day, the one with the **latest `valid_from`** wins.

  Return `account_id` and `tier` for every account that has at least one row applying on
  `'2026-02-15'`, one row per account. Accounts with no applying row (not started yet, cancelled
  earlier, or in a gap) are left out. Sort by `account_id` ascending.

  Write standard SQL that runs on both PostgreSQL and SQLite.

  ### Example 1
  ```
  subscription_history
  +------------+------------+------------+------------+
  | account_id | tier       | valid_from | valid_to   |
  +------------+------------+------------+------------+
  | 1          | starter    | 2025-11-01 | 2026-02-15 |
  | 1          | growth     | 2026-02-15 | NULL       |
  | 2          | growth     | 2025-06-01 | 2026-01-31 |
  | 3          | enterprise | 2026-02-16 | NULL       |
  | 4          | starter    | 2026-01-10 | NULL       |
  +------------+------------+------------+------------+

  Output
  +------------+---------+
  | account_id | tier    |
  +------------+---------+
  | 1          | growth  |
  | 4          | starter |
  +------------+---------+
  Account 1's starter row ends on 2026-02-15 (exclusive) and its growth row starts that day.
  Account 2 lapsed in January and account 3 only starts on 2026-02-16.
  ```

  ### Example 2
  ```
  subscription_history
  +------------+---------+------------+------------+
  | account_id | tier    | valid_from | valid_to   |
  +------------+---------+------------+------------+
  | 5          | starter | 2025-12-01 | NULL       |
  | 5          | growth  | 2026-02-01 | 2026-03-01 |
  | 6          | growth  | 2026-02-15 | 2026-02-16 |
  +------------+---------+------------+------------+

  Output
  +------------+--------+
  | account_id | tier   |
  +------------+--------+
  | 5          | growth |
  | 6          | growth |
  +------------+--------+
  Both of account 5's rows apply on the day; the growth row started later, so it wins.
  Account 6's row covers exactly one day, 2026-02-15.
  ```

  ### Constraints
  - `0 <= rows in subscription_history <= 10^5`
  - `valid_to` is NULL or `>= valid_from`
  - the date `'2026-02-15'` is fixed; you may write it as a literal
languages: [sql]
starter_code:
  sql: |
    -- Return account_id and tier for every account with a row applying on 2026-02-15, ordered by account_id.
    SELECT s.account_id, s.tier
    FROM subscription_history s
    WHERE s.valid_to IS NULL
    ORDER BY s.account_id;
reference_solutions:
  sql: |
    SELECT s.account_id, s.tier
    FROM subscription_history s
    WHERE s.valid_from <= '2026-02-15'
      AND (s.valid_to IS NULL OR s.valid_to > '2026-02-15')
      AND NOT EXISTS (
        SELECT 1
        FROM subscription_history t
        WHERE t.account_id = s.account_id
          AND t.valid_from > s.valid_from
          AND t.valid_from <= '2026-02-15'
          AND (t.valid_to IS NULL OR t.valid_to > '2026-02-15')
      )
    ORDER BY s.account_id;
sql_setup: |
  CREATE TABLE subscription_history (
    account_id INTEGER NOT NULL,
    tier VARCHAR(20) NOT NULL,
    valid_from TEXT NOT NULL,
    valid_to TEXT,
    PRIMARY KEY (account_id, valid_from)
  );
tests:
  - id: t1
    description: "Example 1 - change exactly on the day, lapsed account, account starting the next day, open row"
    setup_sql: |
      INSERT INTO subscription_history (account_id, tier, valid_from, valid_to) VALUES
        (1, 'starter', '2025-11-01', '2026-02-15'), (1, 'growth', '2026-02-15', NULL), (2, 'growth', '2025-06-01', '2026-01-31'), (3, 'enterprise', '2026-02-16', NULL),
        (4, 'starter', '2026-01-10', NULL);
    expected_rows: [[1, "growth"], [4, "starter"]]
    ordered: true
  - id: t2
