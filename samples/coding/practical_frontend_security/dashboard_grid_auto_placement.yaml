reference_solutions:
  python: |
    def place_widgets(columns: int, spans: list[list[int]], dense: bool) -> list[list[int]]:
        grid: list[list[bool]] = []

        def fits(row: int, col: int, width: int, height: int) -> bool:
            if col + width > columns:
                return False
            for r in range(row, min(row + height, len(grid))):
                line = grid[r]
                for c in range(col, col + width):
                    if line[c]:
                        return False
            return True

        result: list[list[int]] = []
        cursor_row, cursor_col = 0, 0
        for width, height in spans:
            row, col = (0, 0) if dense else (cursor_row, cursor_col)
            while not fits(row, col, width, height):
                col += 1
                if col + width > columns:
                    row, col = row + 1, 0
            while len(grid) < row + height:
                grid.append([False] * columns)
            for r in range(row, row + height):
                for c in range(col, col + width):
                    grid[r][c] = True
            result.append([row, col])
            cursor_row, cursor_col = row, col + width
        return result
  javascript: |
    function placeWidgets(columns, spans, dense) {
      const grid = [];
      const fits = (row, col, width, height) => {
        if (col + width > columns) return false;
        for (let r = row; r < Math.min(row + height, grid.length); r++) {
          for (let c = col; c < col + width; c++) {
            if (grid[r][c]) return false;
          }
        }
        return true;
      };
      const result = [];
      let cursorRow = 0;
      let cursorCol = 0;
      for (const [width, height] of spans) {
        let row = dense ? 0 : cursorRow;
        let col = dense ? 0 : cursorCol;
        while (!fits(row, col, width, height)) {
          col += 1;
          if (col + width > columns) {
            row += 1;
            col = 0;
          }
        }
        while (grid.length < row + height) grid.push(new Array(columns).fill(false));
        for (let r = row; r < row + height; r++) {
          for (let c = col; c < col + width; c++) grid[r][c] = true;
        }
        result.push([row, col]);
        cursorRow = row;
        cursorCol = col + width;
      }
      return result;
    }
