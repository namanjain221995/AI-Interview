title: Dashboard Widget Grid Auto-Placement
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [frontend, fullstack, ux_designer]
time_limit_minutes: 25
prompt_markdown: |
  ## Dashboard Widget Grid Auto-Placement

  A monitoring dashboard lets users drop widgets (charts, counters, tables) into a grid with `columns`
  columns and as many rows as needed. Widget `i` is `spans[i] = [col_span, row_span]`: it covers
  `col_span` adjacent columns and `row_span` adjacent rows. The layout engine places widgets one at a time,
  in input order, at the position of their **top-left cell** `[row, col]` (both 0-based). A widget fits at
  `[row, col]` when `col + col_span <= columns` and none of the cells it would cover is already taken.

  Positions are scanned in **row-major order**: `(row, 0), (row, 1), ..., (row, columns - 1)`, then the
  next row. Two modes exist:

  - **Sparse** (`dense = false`): the engine keeps a cursor that starts at `(0, 0)`. Each widget is placed
    at the first position, scanning from the cursor onwards, where it fits. After placing a widget at
    `[row, col]` the cursor moves to `(row, col + col_span)` - the same row, just after the widget (when
    that column is `columns`, the next scan simply continues on the following row). Holes left behind the
    cursor are never filled.
  - **Dense** (`dense = true`): every widget is placed at the first position, scanning from `(0, 0)`, where
    it fits, so later small widgets backfill earlier holes.

  Return the `[row, col]` of every widget in input order.

  ### Example 1
  ```
  Input:  columns = 4, spans = [[2, 1], [3, 1], [1, 2], [1, 1], [2, 1]], dense = false
  Output: [[0, 0], [1, 0], [1, 3], [2, 0], [2, 1]]
  Explanation: the 3-wide widget does not fit after the first one on row 0, so it goes to row 1 and the
  cursor moves to (1, 3). The 1x2 widget fits at (1, 3). The 1x1 widget would fit at (0, 2), but that is
  behind the cursor, so it goes to (2, 0) and the last widget follows it at (2, 1).
  ```

  ### Example 2
  ```
  Input:  columns = 4, spans = [[2, 1], [3, 1], [1, 2], [1, 1], [2, 1]], dense = true
  Output: [[0, 0], [1, 0], [0, 3], [0, 2], [2, 0]]
  Explanation: in dense mode the 1x2 widget backfills (0, 3) (column 2 is blocked on row 1), the 1x1 widget
  takes (0, 2), and the last widget only fits on row 2.
  ```

  ### Constraints
  - `1 <= columns <= 24`
  - `0 <= spans.length <= 1000`
  - `1 <= col_span <= columns` and `1 <= row_span <= 20`
