expected_concepts:
  - simulating placement on an occupancy grid that grows on demand
  - row-major scanning with a persistent cursor versus restarting from the origin
  - collision checks over a rectangle of cells
  - mapping a layout specification precisely onto code
optimal_complexity: {time: "O(n * R * C * A) for n widgets, R rows used, C columns and widget area A (simple simulation)", space: O(R * C)}
rubric:
  excellent: Builds a growable occupancy grid, writes a single fits(row, col) check, implements the cursor update exactly (including the case where it lands on the last column) and explains how dense mode could skip already-full rows to speed up long dashboards.
  good: Correct simulation for both modes with a small slip, such as the cursor wrap or the column bound, fixed after a hint.
  weak: Mixes up sparse and dense, lets widgets overlap or overflow the right edge, or resets the cursor to the next row after every widget.
  criteria:
    correctness: All tests pass in both modes, including tall widgets that block later rows and full-width widgets.
    efficiency: Scans only as far as needed and grows the grid lazily; avoids preallocating huge fixed grids.
    code_quality: One placement loop shared by both modes, with the cursor logic isolated in a couple of lines.
    edge_cases: Empty input, a single column, widgets spanning every column and cursors that end exactly at the right edge.
    communication: Walks through the examples on a small drawn grid and explains the difference between the two modes.
hints:
  - Represent the dashboard as rows of booleans that you append to whenever a widget reaches below the current bottom; a cell is either free or taken.
  - Write one helper that answers whether a widget fits with its top-left at (row, col), then find the first such position by stepping through columns and wrapping to the next row. The only difference between the modes is where that scan starts.
  - For each widget start the scan at (0, 0) in dense mode or at the cursor in sparse mode, advance column by column (moving to the next row once the widget would overflow the right edge) until it fits, mark its cells, record the position and set the cursor to the same row just after the widget.
followups:
  - How would you speed up dense placement for a dashboard with thousands of widgets?
  - How would you support widgets that are pinned to an explicit position before auto-placement runs?
  - What would change if the grid had a fixed number of rows and columns grew instead?
common_errors:
  - Restarting the sparse scan from the beginning of the next row instead of at the cursor column.
  - Checking only the top-left cell instead of every cell the widget covers.
  - Allowing a widget to overflow the right edge when col + col_span > columns.
  - Indexing rows that do not exist yet in the grid.
