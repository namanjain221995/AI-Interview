version: 1
slug: parse_cookie_header
title: Parse a Cookie Request Header
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [backend, frontend, fullstack, security]
time_limit_minutes: 12
prompt_markdown: |
  ## Parse a Cookie Request Header

  An edge middleware reads the cookies a browser sent in the `Cookie` request header and passes them to
  the application as name/value pairs. Real headers are messy (extra spaces, empty segments, duplicated
  names), so the parser must follow precise rules.

  Given the header value `header`:

  1. Split it on every `;` into parts and trim leading and trailing **spaces** from each part.
  2. Skip a part that is empty or contains no `=`.
  3. The **name** is the text before the first `=`, the **value** is the text after it; trim spaces from
     both. Skip the part if the name is empty.
  4. If the value has at least 2 characters and both starts and ends with a double quote `"`, remove
     that one pair of surrounding quotes (spaces inside the quotes are kept).
  5. Names are case-sensitive. When a name occurs more than once, the **first** occurrence wins and later
     ones are ignored.

  Return the cookies as `[name, value]` pairs in the order their names first appear in the header.

  ### Example 1
  ```
  Input:  header = "session=abc123; theme=dark; lang=en-GB"
  Output: [["session", "abc123"], ["theme", "dark"], ["lang", "en-GB"]]
  ```

  ### Example 2
  ```
  Input:  header = "cart=\"sku1,sku2\"; ; flag; =orphan; theme=light; theme=dark"
  Output: [["cart", "sku1,sku2"], ["theme", "light"]]
  Explanation: the empty part, "flag" (no '=') and "=orphan" (empty name) are skipped; the second theme
  is a duplicate.
  ```

  ### Constraints
  - `0 <= header.length <= 4096`
  - `header` contains printable ASCII characters only (codes `32` to `126`).
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: parse_cookie_header
  params:
    - {name: header, type: string}
  return_type: "string[][]"
  comparison: exact
reference_solutions:
  python: |
    def parse_cookie_header(header: str) -> list[list[str]]:
        cookies: list[list[str]] = []
        seen: set[str] = set()
        for part in header.split(";"):
            part = part.strip(" ")
            if "=" not in part:
                continue
            name, value = part.split("=", 1)
            name, value = name.strip(" "), value.strip(" ")
            if not name or name in seen:
                continue
            if len(value) >= 2 and value[0] == '"' and value[-1] == '"':
                value = value[1:-1]
            seen.add(name)
            cookies.append([name, value])
        return cookies
  javascript: |
    function parseCookieHeader(header) {
      const trim = (s) => s.replace(/^ +| +$/g, "");
      const cookies = [];
      const seen = new Set();
      for (const raw of header.split(";")) {
        const part = trim(raw);
        const eq = part.indexOf("=");
        if (eq < 0) continue;
        const name = trim(part.slice(0, eq));
        let value = trim(part.slice(eq + 1));
        if (name === "" || seen.has(name)) continue;
        if (value.length >= 2 && value[0] === '"' && value[value.length - 1] === '"') {
          value = value.slice(1, -1);
        }
        seen.add(name);
        cookies.push([name, value]);
      }
      return cookies;
    }
tests:
  - {id: t1, args: ["session=abc123; theme=dark; lang=en-GB"], expected: [["session", "abc123"], ["theme", "dark"], ["lang", "en-GB"]], description: "Example 1 - simple well-formed header"}
  - {id: t2, args: ["cart=\"sku1,sku2\"; ; flag; =orphan; theme=light; theme=dark"], expected: [["cart", "sku1,sku2"], ["theme", "light"]], description: "Example 2 - quotes, empty part, no equals, empty name, duplicate"}
  - {id: t3, hidden: true, args: [""], expected: [], description: "Empty header"}
  - {id: t4, hidden: true, args: ["token=a=b==; x="], expected: [["token", "a=b=="], ["x", ""]], description: "Value contains equals signs; empty value kept"}
  - {id: t5, hidden: true, args: ["ID=1; id=2; Id=3"], expected: [["ID", "1"], ["id", "2"], ["Id", "3"]], description: "Names are case-sensitive - three distinct cookies"}
  - {id: t6, hidden: true, args: ["   a  =  b  ;c=d   "], expected: [["a", "b"], ["c", "d"]], description: "Spaces around names, values and separators are trimmed"}
  - {id: t7, hidden: true, args: ["q=\"; e=\"\"; s=\"  hi  \""], expected: [["q", "\""], ["e", ""], ["s", "  hi  "]], description: "A lone quote is kept; empty quoted value; inner spaces kept after quote removal"}
  - {id: t8, hidden: true, args: ["pref=; pref=dark; ;;; =x; noeq"], expected: [["pref", ""]], description: "First occurrence wins even when its value is empty; junk parts skipped"}
  - {id: t9, hidden: true, args: ["w=\"abc; v=abc\""], expected: [["w", "\"abc"], ["v", "abc\""]], description: "Quotes only on one side are kept"}
expected_concepts:
  - splitting on a delimiter and trimming each segment
  - splitting only on the first equals sign so values may contain more
  - removing one pair of surrounding quotes only when both are present
  - first-wins de-duplication with a set while preserving order
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Splits on semicolons, trims, splits each part on the first equals sign only, skips empty names and parts without an equals sign, strips one matched pair of quotes after trimming, keeps the first occurrence with a seen-set and explains why first-wins matters for security.
  good: Correct for well-formed headers; needs a test run to fix one rule such as values containing equals signs or one-sided quotes.
  weak: Splits on every equals sign, keeps the last duplicate, strips quotes that are not paired, lower-cases names, or crashes on empty parts.
  criteria:
    correctness: All tests pass, including empty headers, empty values, values with equals signs and duplicate names.
    efficiency: One pass over the parts with constant-time duplicate checks.
    code_quality: Each rule from the statement maps to one readable step; no ad-hoc character loops where split and trim suffice.
    edge_cases: Empty header, consecutive semicolons, a lone quote character, quotes on only one side, case-different names.
    communication: Explains why parsing differences between proxies and applications can become a security issue such as cookie shadowing.
hints:
  - Follow the statement step by step - break the header into parts, clean each part, and decide for each one whether it describes a cookie at all.
  - Only the first equals sign separates the name from the value, because values may themselves contain equals signs; trim both sides and check the name before you keep the pair.
  - For every trimmed part that contains an equals sign, split at the first one, trim name and value, skip empty names and names already seen, remove the outer quotes only when the value is at least two characters long and starts and ends with a quote, then remember the name in a set and append the pair to the result list.
followups:
  - How would you decode percent-encoded values safely?
  - Why might an attacker send duplicate cookie names, and how do browsers order cookies with the same name?
  - How would you parse a Set-Cookie response header with attributes such as Path, Secure and SameSite?
  - What limits would you enforce on header size and cookie count at the edge?
common_errors:
  - Splitting on every equals sign and losing the rest of the value.
  - Letting a later duplicate overwrite the first one, for example by writing into a map without checking.
  - Stripping a single quote character or quotes that appear on only one side.
  - Forgetting to trim before checking for an empty name or for quotes.
  - Lower-casing cookie names.
