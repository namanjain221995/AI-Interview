expected_concepts:
  - "event replay as a state machine"
  - "sliding window over timestamps with a queue"
  - "half-open time intervals"
  - "resetting state on success and on lock"
  - "ignoring events while locked"
optimal_complexity: {time: "O(n)", space: "O(max_failures + n) in the worst case, O(n)"}
rubric:
  excellent: "Models the account as a small state machine (lock_until plus a queue of failure times), evicts expired failures from the front, applies the half-open window and the exact release second correctly, and explains each step against the examples with O(n) amortised time."
  good: "Correct outcomes with a list that is filtered on every failure (O(n * k)), or a single boundary bug fixed after testing."
  weak: "Counts all failures since the start, extends the lock on locked attempts, treats a locked success as OK, or gets the window boundaries wrong in several places."
  criteria:
    correctness: "All tests pass, including same-second attempts, half-open windows and locked successes."
    efficiency: "Amortised O(1) per attempt with a deque or head index."
    code_quality: "State kept in two clearly named variables; the three rules map to three branches."
    edge_cases: "Empty input, max_failures of 1, failures exactly window_seconds apart and attempts at lock_until."
    communication: "Discusses trade-offs of lockouts (denial of service against real users) versus progressive delays or CAPTCHA."
hints:
  - "Replay the attempts in order and keep only the state you need: when the account is locked until, and which recent failures still matter."
  - "Store the times of recorded failures in a queue. On each new failure, drop failures from the front that are no longer inside the window, then compare the queue size with max_failures."
  - "Check the lock first (t < lock_until means LOCKED and nothing else happens). A success clears the queue. A failure is appended, failures with time <= t - window_seconds are popped, and if the size reaches max_failures set lock_until = t + lockout_seconds and clear the queue."
followups:
  - "Attackers can lock real users out on purpose. How would you change the policy to limit that?"
  - "How would you implement the same policy across many servers that see attempts for the same account?"
  - "How would progressive lockouts (each lock longer than the last) change the state you keep?"
  - "Should failures from different IP addresses count together? What are the trade-offs?"
common_errors:
  - "Using a closed window [t - window_seconds, t] instead of the half-open one."
  - "Recording failures or clearing history for attempts made while locked."
  - "Releasing the lock one second too late by using t <= lock_until."
  - "Forgetting to clear the history when the account locks, which causes an immediate relock."
  - "Re-scanning the whole failure list on every attempt."
