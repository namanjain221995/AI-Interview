prompt_markdown: |
  ## Login Lockout Timeline

  The identity team is tuning brute-force protection and wants to replay one account's login attempts
  against a candidate policy to see exactly what users would have experienced.

  Attempt `k` happened at second `timestamps[k]` and succeeded (correct password) when
  `successes[k]` is `true`. Timestamps are non-decreasing. The account starts unlocked with an empty
  failure history. Process the attempts in order:

  1. If the account is locked, meaning `t < lock_until`, the outcome is `"LOCKED"` and the attempt is
     otherwise **ignored** (it is not checked, recorded or counted).
  2. Otherwise, a successful attempt is `"OK"` and **clears** the failure history.
  3. Otherwise the attempt is `"FAIL"` and its time is recorded. If the history now contains at least
     `max_failures` failures with time in the window `(t - window_seconds, t]`, the account locks:
     `lock_until = t + lockout_seconds`, and the failure history is cleared.

  The lock is released exactly at `lock_until`: an attempt at that second is processed normally.
  Return the outcome of every attempt, in order.

  ### Example 1
  ```
  Input:  timestamps = [0, 10, 20, 25, 30, 50, 70, 80, 81],
          successes = [false, false, true, false, false, false, true, true, false],
          max_failures = 3,
          window_seconds = 60,
          lockout_seconds = 30
  Output: ["FAIL", "FAIL", "OK", "FAIL", "FAIL", "FAIL", "LOCKED", "OK", "FAIL"]
  Explanation: The success at 20 clears the two earlier failures. Failures at 25, 30 and 50 lock the
  account until 80, so the correct password at 70 is LOCKED. The lock is released at 80.
  ```

  ### Example 2
  ```
  Input:  timestamps = [0, 30, 61, 90, 91, 150, 191, 192],
          successes = [false, false, false, false, false, false, true, false],
          max_failures = 3,
          window_seconds = 60,
          lockout_seconds = 100
  Output: ["FAIL", "FAIL", "FAIL", "FAIL", "FAIL", "LOCKED", "OK", "FAIL"]
  Explanation: At 90 the window (30, 90] holds only the failures at 61 and 90, so there is no lock yet. The
  failure at 91 is the third in (31, 91] and locks the account until 191.
  ```

  ### Example 3
  ```
  Input:  timestamps = [5, 5, 5, 6, 7],
          successes = [false, true, false, false, true],
          max_failures = 1,
          window_seconds = 10,
          lockout_seconds = 2
  Output: ["FAIL", "LOCKED", "LOCKED", "LOCKED", "OK"]
  Explanation: The failure at 5 locks the account until 7, so the next three attempts (the correct password
  included) are LOCKED and the attempt at 7 is processed normally.
  ```

  ### Constraints
  - `0 <= timestamps.length == successes.length <= 10^5`
  - `0 <= timestamps[k] <= 10^9`, non-decreasing
  - `1 <= max_failures <= 1000`, `1 <= window_seconds <= 10^6`, `1 <= lockout_seconds <= 10^6`
  - Expected time `O(n)`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: login_attempt_outcomes
  params:
    - {name: timestamps, type: "int[]"}
    - {name: successes, type: "bool[]"}
    - {name: max_failures, type: "int"}
    - {name: window_seconds, type: "int"}
    - {name: lockout_seconds, type: "int"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    from collections import deque


    def login_attempt_outcomes(timestamps: list[int], successes: list[bool], max_failures: int,
                               window_seconds: int, lockout_seconds: int) -> list[str]:
        outcomes: list[str] = []
        failures: deque[int] = deque()
        lock_until = None
        for t, ok in zip(timestamps, successes):
            if lock_until is not None and t < lock_until:
                outcomes.append("LOCKED")
                continue
            if ok:
                outcomes.append("OK")
                failures.clear()
                continue
            outcomes.append("FAIL")
            failures.append(t)
            while failures and failures[0] <= t - window_seconds:
                failures.popleft()
            if len(failures) >= max_failures:
                lock_until = t + lockout_seconds
                failures.clear()
        return outcomes
  javascript: |
    function loginAttemptOutcomes(timestamps, successes, maxFailures, windowSeconds, lockoutSeconds) {
      const outcomes = [];
      const failures = []; // queue: failures[head..] are the recorded failure times
      let head = 0;
      let lockUntil = null;
      for (let k = 0; k < timestamps.length; k++) {
        const t = timestamps[k];
        if (lockUntil !== null && t < lockUntil) { outcomes.push('LOCKED'); continue; }
        if (successes[k]) { outcomes.push('OK'); failures.length = 0; head = 0; continue; }
        outcomes.push('FAIL');
        failures.push(t);
        while (head < failures.length && failures[head] <= t - windowSeconds) head++;
        if (failures.length - head >= maxFailures) {
          lockUntil = t + lockoutSeconds;
          failures.length = 0;
          head = 0;
        }
      }
      return outcomes;
    }
