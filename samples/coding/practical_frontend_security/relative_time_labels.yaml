reference_solutions:
  python: |
    MINUTE = 60
    HOUR = 60 * MINUTE
    DAY = 24 * HOUR
    WEEK = 7 * DAY
    MONTH = 30 * DAY
    YEAR = 365 * DAY

    # (exclusive upper bound of d, unit length in seconds, unit name)
    BUCKETS = [
        (HOUR, MINUTE, "minute"),
        (DAY, HOUR, "hour"),
        (WEEK, DAY, "day"),
        (35 * DAY, WEEK, "week"),
        (YEAR, MONTH, "month"),
    ]


    def label(d: int) -> str:
        if d < 0:
            return "in the future"
        if d < MINUTE:
            return "just now"
        size, name = YEAR, "year"
        for limit, unit, unit_name in BUCKETS:
            if d < limit:
                size, name = unit, unit_name
                break
        n = d // size
        return f"{n} {name} ago" if n == 1 else f"{n} {name}s ago"


    def format_relative_times(now: int, timestamps: list[int]) -> list[str]:
        return [label(now - t) for t in timestamps]
  javascript: |
    const MINUTE = 60;
    const HOUR = 60 * MINUTE;
    const DAY = 24 * HOUR;
    const WEEK = 7 * DAY;
    const MONTH = 30 * DAY;
    const YEAR = 365 * DAY;

    // [exclusive upper bound of d, unit length in seconds, unit name]
    const BUCKETS = [
      [HOUR, MINUTE, 'minute'],
      [DAY, HOUR, 'hour'],
      [WEEK, DAY, 'day'],
      [35 * DAY, WEEK, 'week'],
      [YEAR, MONTH, 'month'],
    ];

    function label(d) {
      if (d < 0) return 'in the future';
      if (d < MINUTE) return 'just now';
      let size = YEAR;
      let name = 'year';
      for (const [limit, unit, unitName] of BUCKETS) {
        if (d < limit) {
          size = unit;
          name = unitName;
          break;
        }
      }
      const n = Math.floor(d / size);
      return n === 1 ? `${n} ${name} ago` : `${n} ${name}s ago`;
    }

    function formatRelativeTimes(now, timestamps) {
      return timestamps.map((t) => label(now - t));
    }
