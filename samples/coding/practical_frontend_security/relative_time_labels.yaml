expected_concepts:
  - threshold table checked in order
  - integer floor division for unit counts
  - singular versus plural formatting
  - 64-bit arithmetic for timestamps
  - boundary-value thinking at bucket edges
optimal_complexity: {time: O(n), space: O(n) for the output}
rubric:
  excellent: Encodes the thresholds as an ordered table instead of a long if-chain, uses integer division, gets every boundary right (59 seconds, 3599 seconds, 35 days, 365 days), handles plurals in one place and mentions time-zone and calendar caveats of real date formatting.
  good: Correct labels with an if-else chain, possibly after a hint about the week-to-month switch at 35 days or about floating-point rounding.
  weak: Rounds instead of flooring, uses <= on the boundaries, produces "1 minutes ago", or overflows 32-bit integers on large timestamps.
  criteria:
    correctness: All tests pass, including exact bucket boundaries and future timestamps.
    efficiency: Constant work per timestamp.
    code_quality: Named constants for unit lengths and a single formatting helper.
    edge_cases: Empty input, zero difference, future timestamps, values beyond 32-bit range.
    communication: Explains how the boundaries were checked and why integer division is used.
hints:
  - Compute the age d of each event first; the label depends only on d.
  - The rules form an ordered list of (upper bound, unit length, unit name); find the first bucket whose bound d is below and divide by that bucket's unit length.
  - Handle d < 0 and d < 60 first, then walk the table of (3600, 60, minute), (86400, 3600, hour), (7 days, 1 day, day), (35 days, 7 days, week), (365 days, 30 days, month) with years as the fallback; floor-divide and add "s" unless the count is 1.
followups:
  - How would you keep the labels in a long-lived page up to date without re-rendering every row every second?
  - How would you localise these labels for languages with several plural forms?
  - Why might "yesterday" or calendar months be preferable for some products, and what extra input would you need?
common_errors:
  - Using <= instead of < on a threshold, so exactly 60 seconds becomes "just now".
  - Rounding to the nearest unit instead of flooring.
  - Always appending "s", producing "1 minutes ago".
  - Switching from weeks to months at 28 or 30 days instead of 35.
