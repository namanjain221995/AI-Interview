slug: relative_time_labels
title: Relative Time Labels for an Activity Feed
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [frontend, fullstack, mobile]
time_limit_minutes: 12
prompt_markdown: |
  ## Relative Time Labels for an Activity Feed

  The activity feed of a project-tracking app shows when each event happened as a short label such as
  `"5 minutes ago"` instead of a full date. Given the current time `now` and the event `timestamps`,
  all as Unix times in **seconds**, return one label per timestamp, in input order.

  Let `d = now - t` be the age of an event in seconds. Pick the **first** row that applies:

  | Condition | Label |
  |-----------|-------|
  | `d < 0` | `"in the future"` |
  | `d < 60` | `"just now"` |
  | `d < 3600` (1 hour) | `N minute(s)` with `N = floor(d / 60)` |
  | `d < 86400` (1 day) | `N hour(s)` with `N = floor(d / 3600)` |
  | `d < 7 days` | `N day(s)` with `N = floor(d / 86400)` |
  | `d < 35 days` | `N week(s)` with `N = floor(d / (7 days))` |
  | `d < 365 days` | `N month(s)` with `N = floor(d / (30 days))` |
  | otherwise | `N year(s)` with `N = floor(d / (365 days))` |

  For the counted rows the label is `"N unit ago"`, using the **singular** unit when `N == 1` and the
  plural (unit + `s`) otherwise, for example `"1 hour ago"` and `"3 weeks ago"`. A day is always 86400
  seconds; ignore time zones and calendars.

  ### Example 1
  ```
  Input:  now = 1767225600, timestamps = [1767225570, 1767225540, 1767225450, 1767222000, 1767218401, 1766966400, 1767225605]
  Output: ["just now", "1 minute ago", "2 minutes ago", "1 hour ago", "1 hour ago", "3 days ago", "in the future"]
  ```

  ### Example 2
  ```
  Input:  now = 1767225600, timestamps = [1766534400, 1764288000, 1764201600, 1732665600, 1672185600]
  Output: ["1 week ago", "4 weeks ago", "1 month ago", "1 year ago", "3 years ago"]
  Explanation: 34 days is 4 whole weeks; from 35 days on, months of 30 days are used
  (35 // 30 = 1). 400 days is 1 year and 1100 days is 3 years (365-day years).
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^4`
  - `0 <= now, timestamps[i] <= 10^11` (use 64-bit integers)
