slug: attribute_policy_expression_evaluator
title: Attribute-Based Policy Expression Evaluator
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [security, backend, platform, fullstack]
time_limit_minutes: 35
prompt_markdown: |
  ## Attribute-Based Policy Expression Evaluator

  An internal access gateway decides who may open a production console with **attribute-based access
  control**. A policy is a boolean expression over the attributes of the person or service making the
  request, for example:

  ```
  dept == "eng" and (level >= 3 or role in ["admin", "sre"]) and not suspended == "yes"
  ```

  Each subject is a list of `"key=value"` strings. The key is everything before the **first** `=`, the
  value everything after it (it may be empty or contain more `=`). A value is an **integer** if it matches
  `-?[0-9]+` (so `"042"` is the integer 42), otherwise it is a **string**. Keys within one subject are
  unique and case-sensitive.

  Return, for every subject in order, whether the policy grants access (`true`) or not (`false`).

  **Grammar** (tokens may be separated by any number of spaces, including none where unambiguous):

  ```
  expr       := and_expr ( "or" and_expr )*
  and_expr   := not_expr ( "and" not_expr )*
  not_expr   := "not" not_expr | primary
  primary    := "(" expr ")" | comparison
  comparison := IDENT OP literal | IDENT "in" "[" literal ( "," literal )* "]"
  OP         := "==" | "!=" | "<" | "<=" | ">" | ">="
  literal    := a double-quoted string (no escapes, no " inside) | an integer -?[0-9]+
  IDENT      := a letter or _ followed by letters, digits or _ (not one of: and, or, not, in)
  ```

  So `not` binds tighter than `and`, which binds tighter than `or`, and `not suspended == "yes"` means
  `not (suspended == "yes")`. Keywords are lowercase.

  **Semantics of a comparison:**

  - If the subject does not have the attribute, the comparison is **false** (for every operator,
    including `!=`).
  - If the attribute value and the literal have different types (integer versus string), the comparison is
    **false** (again including `!=`).
  - Integers compare numerically; strings compare by character codes (lexicographically, so `"v10" < "v2"`).
  - `attr in [...]` is true when the attribute exists and equals (same type and value) at least one literal
    in the list.

  The expression is always well-formed.

  ### Example 1
  ```
  Input:  expression = "dept == \"eng\" and (level >= 3 or role in [\"admin\", \"sre\"]) and not suspended == \"yes\"", subjects = [["dept=eng", "level=4"], ["dept=eng", "level=2", "role=sre"], ["dept=eng", "level=5", "suspended=yes"], ["dept=sales", "level=9"], ["dept=eng", "level=2"]]
  Output: [true, true, false, false, false]
  Explanation: the third subject is suspended; the fourth is not in eng; the fifth has level 2 and no role.
  ```

  ### Example 2
  ```
  Input:  expression = "region != \"eu\" or tier < 2", subjects = [["region=us", "tier=5"], ["region=eu", "tier=1"], ["region=eu", "tier=gold"], ["tier=7"], ["region=eu"]]
  Output: [true, true, false, false, false]
  Explanation: "gold" is a string, so tier < 2 is false for the third subject; the fourth has no region
  (so region != "eu" is false) and the fifth has no tier.
  ```

  ### Example 3
  ```
  Input:  expression = "not (team == \"payments\")", subjects = [["team=payments"], ["team=search"], []]
  Output: [false, true, true]
  Explanation: a missing attribute makes the comparison false, so its negation is true.
  ```

  ### Constraints
  - `1 <= expression.length <= 1000`, printable ASCII, always well-formed
  - `0 <= subjects.length <= 200`, each with `0` to `20` entries
  - Keys follow the IDENT rule; values are printable ASCII without spaces at either end
  - Integers in the expression and in values satisfy `|x| <= 10^9`
languages: [python, javascript, typescript, java, go, cpp]
