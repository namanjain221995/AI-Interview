reference_solutions:
  python: |
    import re

    TOKEN = re.compile(r' *(?:(==|!=|<=|>=|<|>|\(|\)|\[|\]|,)|"([^"]*)"|(-?[0-9]+)|([A-Za-z_][A-Za-z0-9_]*))')
    KEYWORDS = {"and", "or", "not", "in"}
    INTEGER = re.compile(r"-?[0-9]+")


    def tokenize(expression: str) -> list[tuple[str, object]]:
        tokens: list[tuple[str, object]] = []
        pos = 0
        while expression[pos:].strip(" "):
            m = TOKEN.match(expression, pos)
            symbol, text, number, word = m.groups()
            if symbol is not None:
                tokens.append(("sym", symbol))
            elif text is not None:
                tokens.append(("lit", text))
            elif number is not None:
                tokens.append(("lit", int(number)))
            elif word in KEYWORDS:
                tokens.append(("kw", word))
            else:
                tokens.append(("id", word))
            pos = m.end()
        return tokens


    class Parser:
        def __init__(self, tokens: list[tuple[str, object]]) -> None:
            self.tokens = tokens
            self.pos = 0

        def peek(self, kind: str, value: object = None) -> bool:
            if self.pos >= len(self.tokens):
                return False
            k, v = self.tokens[self.pos]
            return k == kind and (value is None or v == value)

        def take(self) -> object:
            self.pos += 1
            return self.tokens[self.pos - 1][1]

        def parse_or(self):
            node = self.parse_and()
            while self.peek("kw", "or"):
                self.take()
                node = ("or", node, self.parse_and())
            return node

        def parse_and(self):
            node = self.parse_not()
            while self.peek("kw", "and"):
                self.take()
                node = ("and", node, self.parse_not())
            return node

        def parse_not(self):
            if self.peek("kw", "not"):
                self.take()
                return ("not", self.parse_not())
            return self.parse_primary()

        def parse_primary(self):
            if self.peek("sym", "("):
                self.take()
                node = self.parse_or()
                self.take()  # ")"
                return node
            attr = self.take()
            if self.peek("kw", "in"):
                self.take()
                self.take()  # "["
                values = [self.take()]
                while self.peek("sym", ","):
                    self.take()
                    values.append(self.take())
                self.take()  # "]"
                return ("in", attr, values)
            op = self.take()
            return ("cmp", attr, op, self.take())


    def same_type(a: object, b: object) -> bool:
        return isinstance(a, int) == isinstance(b, int)


    def evaluate(node, attrs: dict[str, object]) -> bool:
        kind = node[0]
        if kind == "or":
            return evaluate(node[1], attrs) or evaluate(node[2], attrs)
        if kind == "and":
            return evaluate(node[1], attrs) and evaluate(node[2], attrs)
        if kind == "not":
            return not evaluate(node[1], attrs)
        if node[1] not in attrs:
            return False
        value = attrs[node[1]]
        if kind == "in":
            return any(same_type(value, lit) and value == lit for lit in node[2])
        op, lit = node[2], node[3]
        if not same_type(value, lit):
            return False
        return {
            "==": value == lit,
            "!=": value != lit,
            "<": value < lit,
            "<=": value <= lit,
            ">": value > lit,
            ">=": value >= lit,
        }[op]


    def evaluate_policy(expression: str, subjects: list[list[str]]) -> list[bool]:
        tree = Parser(tokenize(expression)).parse_or()
        results: list[bool] = []
        for subject in subjects:
            attrs: dict[str, object] = {}
            for entry in subject:
                key, value = entry.split("=", 1)
                attrs[key] = int(value) if INTEGER.fullmatch(value) else value
            results.append(evaluate(tree, attrs))
        return results
  javascript: |
    function tokenizePolicy(expression) {
      const re = / *(?:(==|!=|<=|>=|<|>|\(|\)|\[|\]|,)|"([^"]*)"|(-?[0-9]+)|([A-Za-z_][A-Za-z0-9_]*))/y;
      const keywords = new Set(["and", "or", "not", "in"]);
      const tokens = [];
      let pos = 0;
      while (expression.slice(pos).trim() !== "") {
        re.lastIndex = pos;
        const m = re.exec(expression);
        if (m[1] !== undefined) tokens.push(["sym", m[1]]);
        else if (m[2] !== undefined) tokens.push(["lit", m[2]]);
        else if (m[3] !== undefined) tokens.push(["lit", Number(m[3])]);
        else if (keywords.has(m[4])) tokens.push(["kw", m[4]]);
        else tokens.push(["id", m[4]]);
        pos = re.lastIndex;
      }
      return tokens;
    }

    function evaluatePolicy(expression, subjects) {
      const tokens = tokenizePolicy(expression);
      let pos = 0;
      const peek = (kind, value) =>
        pos < tokens.length && tokens[pos][0] === kind && (value === undefined || tokens[pos][1] === value);
      const take = () => tokens[pos++][1];

      function parseOr() {
        let node = parseAnd();
        while (peek("kw", "or")) {
          take();
          node = { kind: "or", left: node, right: parseAnd() };
        }
        return node;
      }
      function parseAnd() {
        let node = parseNot();
        while (peek("kw", "and")) {
          take();
          node = { kind: "and", left: node, right: parseNot() };
        }
        return node;
      }
      function parseNot() {
        if (peek("kw", "not")) {
          take();
          return { kind: "not", inner: parseNot() };
        }
        return parsePrimary();
      }
      function parsePrimary() {
        if (peek("sym", "(")) {
          take();
          const node = parseOr();
          take();
          return node;
        }
        const attr = take();
        if (peek("kw", "in")) {
          take();
          take();
          const values = [take()];
          while (peek("sym", ",")) {
            take();
            values.push(take());
          }
          take();
          return { kind: "in", attr, values };
        }
        const op = take();
        return { kind: "cmp", attr, op, lit: take() };
      }

      const tree = parseOr();
      const evaluate = (node, attrs) => {
        if (node.kind === "or") return evaluate(node.left, attrs) || evaluate(node.right, attrs);
        if (node.kind === "and") return evaluate(node.left, attrs) && evaluate(node.right, attrs);
        if (node.kind === "not") return !evaluate(node.inner, attrs);
        if (!attrs.has(node.attr)) return false;
        const value = attrs.get(node.attr);
        if (node.kind === "in") return node.values.some((lit) => typeof lit === typeof value && lit === value);
        const lit = node.lit;
        if (typeof lit !== typeof value) return false;
        switch (node.op) {
          case "==": return value === lit;
          case "!=": return value !== lit;
          case "<": return value < lit;
          case "<=": return value <= lit;
          case ">": return value > lit;
          default: return value >= lit;
        }
      };

      return subjects.map((subject) => {
        const attrs = new Map();
        for (const entry of subject) {
          const eq = entry.indexOf("=");
          const value = entry.slice(eq + 1);
          attrs.set(entry.slice(0, eq), /^-?[0-9]+$/.test(value) ? Number(value) : value);
        }
        return evaluate(tree, attrs);
      });
    }
