expected_concepts:
  - tokenizer separating symbols, literals, identifiers and keywords
  - recursive-descent parsing with one function per precedence level
  - building an expression tree once and evaluating it per subject
  - typed values and explicit rules for missing attributes and type mismatches
optimal_complexity: {time: O(L + S * L) for expression length L and S subjects, space: O(L + K) for K attributes per subject}
rubric:
  excellent: Writes a clean tokenizer and a recursive-descent parser (or precedence climbing) with one level per operator, evaluates the tree once per subject, implements missing-attribute and type-mismatch semantics precisely (including != and not) and explains why parsing once matters for many subjects.
  good: Correct parser and evaluation with a small slip, such as treating != on a missing attribute as true or parsing keyword prefixes like index as in, fixed after a hint.
  weak: Evaluates with string replacement or eval, ignores precedence, or compares integers as strings.
  criteria:
    correctness: All tests pass, including precedence, double negation, typed comparisons and identifiers that start with keywords.
    efficiency: Parses the expression once and evaluates the tree for each subject in time linear in its size.
    code_quality: Separate tokenizer, parser and evaluator; no use of a host-language eval.
    edge_cases: Missing attributes, empty values, values containing =, leading zeros, negative integers, no subjects.
    communication: Explains the grammar and how precedence falls out of the call structure.
hints:
  - Split the problem into three parts - turn the text into tokens, turn the tokens into a tree, then evaluate the tree for each subject's attribute map.
  - For precedence write one parsing function per level - or calls and, and calls not, not calls primary - and let primary handle parentheses and the two comparison forms. Read whole identifiers before checking whether they are keywords.
  - Store each subject's values as integers or strings, then evaluate recursively; a comparison node returns false when the key is missing or the types differ, otherwise applies the operator, and an in node checks for an equal literal of the same type.
followups:
  - How would you report a helpful error for a malformed policy instead of assuming it is well-formed?
  - Should not missing == "x" grant access? How would you design policies so that a missing attribute fails closed?
  - How would you compile the tree into a closure or bytecode for very hot authorisation paths?
common_errors:
  - Treating a missing attribute as an empty string or zero instead of making the comparison false.
  - Making != true when the types differ or the attribute is missing.
  - Giving and and or equal precedence, or letting not apply to a whole and-chain.
  - Matching the keyword in at the start of an identifier such as index.
  - Comparing numeric values as strings, so 10 < 9.
