title: Allowlist HTML Sanitiser for Comments
difficulty: hard
competency_keys: [algorithms, data_structures, problem_solving, code_quality]
role_tags: [security, frontend, backend, fullstack]
time_limit_minutes: 35
prompt_markdown: |
  ## Allowlist HTML Sanitiser for Comments

  The team wiki lets people format review comments with a little HTML. Before a comment is stored, it
  passes through an **allowlist sanitiser**: only tags in `allowed_tags` survive, only safe attributes are
  kept, and everything else is either dropped or escaped so it can never run in a reader's browser.
  Implement `sanitize_html(html, allowed_tags)` and return the sanitised HTML string.

  **Reading the input.** Scan `html` from left to right. At a `<` exactly one of these applies, checked in
  this order:

  1. **Comment** - `<!--` starts a comment that ends at the first `-->` after it. A comment without `-->`
     runs to the end of the input. Comments are removed entirely.
  2. **Close tag** - `</`, a tag name, optional spaces, `>`.
  3. **Open tag** - `<`, a tag name, zero or more attributes, optional spaces, an optional `/`, `>`. Each
     attribute is one or more spaces, an attribute name, `="`, a value containing no `"`, and `"`.
  4. Otherwise the `<` is an ordinary text character.

  A tag name is a letter followed by letters or digits; an attribute name is a letter followed by letters,
  digits or `-`. "Spaces" means the space character only. Tag and attribute names are case-insensitive
  and are always written in lowercase in the output. Everything that is not part of a comment or a tag is
  **text**.

  **Rules.**

  - `allowed_tags` holds lowercase tag names. `script` and `style` are **never** allowed: their open tag,
    everything after it up to and including the next matching close tag (`</script>` or `</style>`, any
    case, optional spaces before `>`) are removed; with no matching close tag the rest of the input is
    removed.
  - A tag that is not allowed is removed, but the text and allowed tags inside it are kept.
  - An allowed open tag is written as `<name` + kept attributes + `>`. A trailing `/` is ignored. The tags
    `br`, `hr` and `img` are **void**: they never need closing. Every other allowed open tag stays open
    until it is closed.
  - Attributes: if a name appears more than once in a tag, only its first occurrence is considered. Keep
    `title` on any allowed tag and `href` on `a` only; drop every other attribute. Keep `href` only when its
    value, after removing leading and trailing spaces, is **safe**: find the first `:`; if there is none,
    or a `/`, `?` or `#` appears before it, the link is relative and safe; otherwise the text before the
    `:` is the scheme, and the link is safe only if that scheme is `http`, `https` or `mailto` (any case).
    Kept attributes are written as ` name="value"` in their original order, with the trimmed value for
    `href`.
  - A close tag whose name is currently open closes the most recently opened element with that name and
    every element opened after it (innermost first), writing `</name>` for each. Any other close tag is
    removed.
  - At the end, every element still open is closed, innermost first.
  - Escaping: in text, replace `&` with `&amp;`, `<` with `&lt;` and `>` with `&gt;` (every `&`, even one
    that already starts an entity). In kept attribute values also replace `"` with `&quot;`.

  ### Example 1
  ```
  Input:  html = "<p>Hi <b>team</b>, see <a href=\"https://wiki.example/x\" onclick=\"run()\">notes</a><script>alert(1)</script></p>", allowed_tags = ["p", "b", "a"]
  Output: "<p>Hi <b>team</b>, see <a href=\"https://wiki.example/x\">notes</a></p>"
  ```

  ### Example 2
  ```
  Input:  html = "<div title=\"Q3\">5 < 7 & <i>urgent</I><!-- internal --><a href=\" JavaScript:steal()\">x</a>", allowed_tags = ["i", "a"]
  Output: "5 &lt; 7 &amp; <i>urgent</i><a>x</a>"
  Explanation: div is not allowed (its text stays), "< " does not start a tag, the comment is removed and
  the javascript: link loses its href.
  ```

  ### Example 3
  ```
  Input:  html = "<ul><li>one<li>two</ul></span>tail<b>bold", allowed_tags = ["ul", "li", "b"]
  Output: "<ul><li>one<li>two</li></li></ul>tail<b>bold</b>"
  Explanation: </ul> closes both open li elements and the ul; </span> was never opened; b is closed at the end.
  ```

  ### Constraints
  - `0 <= html.length <= 2000`, printable ASCII characters
  - `0 <= allowed_tags.length <= 20`, lowercase tag names
languages: [python, javascript, typescript, java, go, cpp]
signature:
