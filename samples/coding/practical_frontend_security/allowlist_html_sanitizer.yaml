expected_concepts:
  - single-pass tokenizer with explicit precedence between comment, close tag, open tag and text
  - stack of open elements for close-tag matching and auto-closing
  - allowlists instead of blocklists for tags, attributes and URL schemes
  - context-specific output escaping for text and attribute values
  - raw-text handling for script and style
optimal_complexity: {time: O(n * d) where d is the depth of open elements (O(n) with a per-name count), space: O(n)}
rubric:
  excellent: Builds a small tokenizer with clear precedence, keeps a stack of open allowed elements, matches the rules exactly (first attribute occurrence, trimmed href, scheme detection before /?#, raw-text removal) and explains why an allowlist with output escaping is safer than stripping known-bad patterns.
  good: Produces correct output for well-formed input and most rules, missing one or two edge cases such as unterminated comments, duplicate attributes or a stale close tag, fixed after a hint.
  weak: Uses regex replacement over the whole string, blocklists dangerous tags, forgets to escape text or attributes, or lets close tags mismatch the stack.
  criteria:
    correctness: All tests pass, including malformed tags treated as text, nested same-name elements and unsafe href values.
    efficiency: Linear scan of the input with constant work per character apart from stack unwinding.
    code_quality: Separate helpers for escaping, href checking and attribute filtering; the main loop reads as the four token cases.
    edge_cases: Empty input, unterminated comments and scripts, void elements, duplicate attributes, uppercase names and already-escaped entities.
    communication: Explains the security reasoning for each rule (why javascript:, why script content is removed, why escape everything).
hints:
  - Treat the input as a stream of tokens - comment, close tag, open tag or text - and decide which one starts at each < using the precedence in the statement; anything that does not match a tag pattern exactly is just text.
  - Keep a stack of the allowed elements that are currently open. Disallowed tags are simply skipped, script and style jump ahead to their closing tag, and a close tag only does something when its name is on the stack.
  - For an allowed open tag, filter its attributes (first occurrence only, title anywhere, href on a only after trimming and checking the scheme), escape the kept values, write the tag and push it unless it is void; for a close tag pop and write closing tags down to the most recent element with that name; escape all text and close what is left at the end.
followups:
  - Why do production sanitisers parse into a DOM tree instead of working on tokens, and what attacks does that prevent?
  - How would you add a style attribute safely?
  - What is the difference between sanitising on input and escaping on output, and where would you do each?
common_errors:
  - Removing script tags but keeping their content, or keeping content of an unterminated script.
  - Checking href with startsWith("javascript:") instead of allowlisting schemes, missing padded or uppercase variants.
  - Forgetting to escape text, so a literal < from the user becomes markup.
  - Writing close tags for elements that were never opened, or not closing intervening elements.
  - Using a later duplicate attribute when the first one was unsafe.
