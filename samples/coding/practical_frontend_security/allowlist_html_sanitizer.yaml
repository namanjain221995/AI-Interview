    - {name: allowed_tags, type: "string[]"}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    import re

    OPEN_TAG = re.compile(r'<([A-Za-z][A-Za-z0-9]*)((?: +[A-Za-z][A-Za-z0-9-]*="[^"]*")*) */?>')
    ATTRIBUTE = re.compile(r' +([A-Za-z][A-Za-z0-9-]*)="([^"]*)"')
    CLOSE_TAG = re.compile(r'</([A-Za-z][A-Za-z0-9]*) *>')
    VOID_TAGS = {"br", "hr", "img"}
    RAW_TEXT_TAGS = {"script", "style"}
    SAFE_SCHEMES = {"http", "https", "mailto"}


    def escape_text(text: str) -> str:
        return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")


    def escape_attribute(text: str) -> str:
        return escape_text(text).replace('"', "&quot;")


    def is_safe_href(value: str) -> bool:
        colon = value.find(":")
        if colon == -1 or any(ch in value[:colon] for ch in "/?#"):
            return True
        return value[:colon].lower() in SAFE_SCHEMES


    def sanitize_html(html: str, allowed_tags: list[str]) -> str:
        allowed = set(allowed_tags) - RAW_TEXT_TAGS
        out: list[str] = []
        stack: list[str] = []
        i, n = 0, len(html)
        while i < n:
            if html[i] != "<":
                j = html.find("<", i)
                j = n if j == -1 else j
                out.append(escape_text(html[i:j]))
                i = j
                continue
            if html.startswith("<!--", i):
                end = html.find("-->", i + 4)
                i = n if end == -1 else end + 3
                continue
            m = CLOSE_TAG.match(html, i)
            if m:
                name = m.group(1).lower()
                if name in stack:
                    k = len(stack) - 1 - stack[::-1].index(name)
                    while len(stack) > k:
                        out.append(f"</{stack.pop()}>")
                i = m.end()
                continue
            m = OPEN_TAG.match(html, i)
            if m:
                name = m.group(1).lower()
                i = m.end()
                if name in RAW_TEXT_TAGS:
                    end = re.compile(rf"</{name} *>", re.IGNORECASE).search(html, i)
                    i = n if end is None else end.end()
                elif name in allowed:
                    kept: list[str] = []
                    seen: set[str] = set()
                    for am in ATTRIBUTE.finditer(m.group(2)):
                        attr, value = am.group(1).lower(), am.group(2)
                        if attr in seen:
                            continue
                        seen.add(attr)
                        if attr == "title":
                            kept.append(f' title="{escape_attribute(value)}"')
                        elif attr == "href" and name == "a":
                            value = value.strip(" ")
                            if is_safe_href(value):
                                kept.append(f' href="{escape_attribute(value)}"')
                    out.append(f"<{name}{''.join(kept)}>")
                    if name not in VOID_TAGS:
                        stack.append(name)
                continue
            out.append("&lt;")
            i += 1
        while stack:
            out.append(f"</{stack.pop()}>")
        return "".join(out)
  javascript: |
    const VOID_TAGS = new Set(["br", "hr", "img"]);
    const RAW_TEXT_TAGS = new Set(["script", "style"]);
    const SAFE_SCHEMES = new Set(["http", "https", "mailto"]);

    const escapeText = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const escapeAttribute = (s) => escapeText(s).replace(/"/g, "&quot;");

    function isSafeHref(value) {
      const colon = value.indexOf(":");
      if (colon === -1 || /[/?#]/.test(value.slice(0, colon))) return true;
      return SAFE_SCHEMES.has(value.slice(0, colon).toLowerCase());
    }

    function sanitizeHtml(html, allowedTags) {
      const allowed = new Set(allowedTags.filter((t) => !RAW_TEXT_TAGS.has(t)));
      const openTag = /<([A-Za-z][A-Za-z0-9]*)((?: +[A-Za-z][A-Za-z0-9-]*="[^"]*")*) *\/?>/y;
      const closeTag = /<\/([A-Za-z][A-Za-z0-9]*) *>/y;
      const out = [];
      const stack = [];
      const n = html.length;
      let i = 0;
      while (i < n) {
        if (html[i] !== "<") {
          let j = html.indexOf("<", i);
          if (j === -1) j = n;
          out.push(escapeText(html.slice(i, j)));
          i = j;
          continue;
        }
        if (html.startsWith("<!--", i)) {
          const end = html.indexOf("-->", i + 4);
          i = end === -1 ? n : end + 3;
          continue;
        }
        closeTag.lastIndex = i;
        let m = closeTag.exec(html);
        if (m) {
          const name = m[1].toLowerCase();
          const k = stack.lastIndexOf(name);
          if (k !== -1) {
            while (stack.length > k) out.push(`</${stack.pop()}>`);
          }
          i = closeTag.lastIndex;
          continue;
        }
        openTag.lastIndex = i;
        m = openTag.exec(html);
        if (m) {
          const name = m[1].toLowerCase();
          i = openTag.lastIndex;
          if (RAW_TEXT_TAGS.has(name)) {
            const endRe = new RegExp(`</${name} *>`, "gi");
            endRe.lastIndex = i;
            const end = endRe.exec(html);
            i = end ? endRe.lastIndex : n;
          } else if (allowed.has(name)) {
            const kept = [];
            const seen = new Set();
            for (const am of m[2].matchAll(/ +([A-Za-z][A-Za-z0-9-]*)="([^"]*)"/g)) {
              const attr = am[1].toLowerCase();
              if (seen.has(attr)) continue;
              seen.add(attr);
              if (attr === "title") {
                kept.push(` title="${escapeAttribute(am[2])}"`);
              } else if (attr === "href" && name === "a") {
                const value = am[2].replace(/^ +| +$/g, "");
                if (isSafeHref(value)) kept.push(` href="${escapeAttribute(value)}"`);
              }
            }
            out.push(`<${name}${kept.join("")}>`);
            if (!VOID_TAGS.has(name)) stack.push(name);
          }
          continue;
        }
        out.push("&lt;");
        i += 1;
      }
      while (stack.length) out.push(`</${stack.pop()}>`);
      return out.join("");
    }
