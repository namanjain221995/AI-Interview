prompt_markdown: |
  ## Chat Markup Tokenizer

  The team chat client lets people format messages with a tiny bracket markup. Before rendering (and
  before any sanitising), a message is split into **tokens**. Write the tokenizer.

  Scan `source` from left to right. Outside a code block:

  - **Tags.** These bracket sequences are tags; the tag name is matched **case-insensitively** and
    always emitted in lowercase:

    | Markup | Token |
    |--------|-------|
    | `[b]`, `[/b]` | `"OPEN:b"`, `"CLOSE:b"` |
    | `[i]`, `[/i]` | `"OPEN:i"`, `"CLOSE:i"` |
    | `[url=TARGET]` | `"OPEN:url=TARGET"` |
    | `[/url]` | `"CLOSE:url"` |
    | `[code]`, `[/code]` | `"OPEN:code"`, `"CLOSE:code"` |

    `TARGET` is one or more characters that are neither `[` nor `]`, copied **verbatim** (original
    case, no escape processing). Nothing else is allowed inside a tag: `[ b]`, `[b ]`, `[url]` and
    `[url=]` are not tags.
  - **Escapes.** A backslash followed by `[` produces a literal `[`; a backslash followed by another
    backslash produces one literal backslash. Any other backslash (including one at the very end) is an
    ordinary character, and the character after it is processed normally.
  - **Everything else is text**, including a `[` that does not start a tag. Scanning then continues
    with the character right after that `[`, so `[[b]` is the text `[` followed by `OPEN:b`.

  After an `OPEN:code` token, the code block is **raw**: every character, including backslashes and
  brackets, is literal text until the first `[/code]` (case-insensitive), which produces
  `CLOSE:code` and returns to normal scanning. If there is no `[/code]`, the rest of the message is
  text. A `[/code]` outside a code block is still a `CLOSE:code` token.

  Text is emitted as `"TEXT:<text>"`. Consecutive text characters are merged into one `TEXT` token
  and empty text tokens are never emitted. Do **not** check whether tags are balanced or nested
  correctly: this step only tokenizes. Return the tokens in order.

  The examples write strings as JSON-style literals, so `\\` inside quotes stands for **one**
  backslash character.

  ### Example 1
  ```
  Input:  source = "Deploy [b]now[/b], see [url=https://status.example.com]status[/url]"
  Output: ["TEXT:Deploy ", "OPEN:b", "TEXT:now", "CLOSE:b", "TEXT:, see ", "OPEN:url=https://status.example.com", "TEXT:status", "CLOSE:url"]
  Explanation: Tags become OPEN/CLOSE tokens, the link target is copied verbatim and the text between tags is merged.
  ```

  ### Example 2
  ```
  Input:  source = "Use \\[b] for bold: [CODE]if a[0] \\[b][/Code] done"
  Output: ["TEXT:Use [b] for bold: ", "OPEN:code", "TEXT:if a[0] \\[b]", "CLOSE:code", "TEXT: done"]
  Explanation: \[ is a literal bracket, so "[b]" after it is text. Inside the code block everything is raw
  until [/Code], including the second \[b].
  ```

  ### Example 3
  ```
  Input:  source = "[[b]] [url=] [b ] \\x\\\\"
  Output: ["TEXT:[", "OPEN:b", "TEXT:] [url=] [b ] \\x\\"]
  Explanation: "[" before [b] is text, as are "] [url=] [b ] ", \x stays as typed and \\ becomes one backslash.
  ```

  ### Constraints
  - `0 <= source.length <= 10^4`
  - `source` contains printable ASCII characters only (spaces included, no line breaks)
  - Aim for a single left-to-right pass: `O(n)` time
languages: [python, javascript, typescript, java, go, cpp]
