reference_solutions:
  python: |
    def tokenize_markup(source: str) -> list[str]:
        simple = {"[b]": "OPEN:b", "[/b]": "CLOSE:b", "[i]": "OPEN:i", "[/i]": "CLOSE:i",
                  "[/url]": "CLOSE:url", "[code]": "OPEN:code", "[/code]": "CLOSE:code"}
        tokens: list[str] = []
        text: list[str] = []

        def flush() -> None:
            chunk = "".join(text)
            text.clear()
            if chunk:
                tokens.append("TEXT:" + chunk)

        def emit(token: str) -> None:
            flush()
            tokens.append(token)

        n = len(source)
        lower = source.lower()
        i = 0
        while i < n:
            ch = source[i]
            if ch == "\\" and i + 1 < n and source[i + 1] in "[\\":
                text.append(source[i + 1])
                i += 2
                continue
            if ch != "[":
                text.append(ch)
                i += 1
                continue
            tag = None
            for markup, token in simple.items():
                if lower.startswith(markup, i):
                    tag = (token, len(markup))
                    break
            if tag is None and lower.startswith("[url=", i):
                j = i + 5
                while j < n and source[j] not in "[]":
                    j += 1
                if j < n and source[j] == "]" and j > i + 5:
                    tag = ("OPEN:url=" + source[i + 5:j], j + 1 - i)
            if tag is None:
                text.append("[")
                i += 1
                continue
            emit(tag[0])
            i += tag[1]
            if tag[0] == "OPEN:code":
                end = lower.find("[/code]", i)
                if end == -1:
                    text.append(source[i:])
                    i = n
                else:
                    text.append(source[i:end])
                    emit("CLOSE:code")
                    i = end + 7
        flush()
        return tokens
  javascript: |
    function tokenizeMarkup(source) {
      const simple = [['[b]', 'OPEN:b'], ['[/b]', 'CLOSE:b'], ['[i]', 'OPEN:i'], ['[/i]', 'CLOSE:i'],
        ['[/url]', 'CLOSE:url'], ['[code]', 'OPEN:code'], ['[/code]', 'CLOSE:code']];
      const tokens = [];
      let text = '';
      const flush = () => { if (text) { tokens.push('TEXT:' + text); text = ''; } };
      const emit = (token) => { flush(); tokens.push(token); };
      const n = source.length;
      const lower = source.toLowerCase();
      let i = 0;
      while (i < n) {
        const ch = source[i];
        if (ch === '\\' && i + 1 < n && (source[i + 1] === '[' || source[i + 1] === '\\')) {
          text += source[i + 1];
          i += 2;
          continue;
        }
        if (ch !== '[') { text += ch; i += 1; continue; }
        let token = null;
        let len = 0;
        for (const [markup, tok] of simple) {
          if (lower.startsWith(markup, i)) { token = tok; len = markup.length; break; }
        }
        if (token === null && lower.startsWith('[url=', i)) {
          let j = i + 5;
          while (j < n && source[j] !== '[' && source[j] !== ']') j++;
          if (j < n && source[j] === ']' && j > i + 5) {
            token = 'OPEN:url=' + source.slice(i + 5, j);
            len = j + 1 - i;
          }
        }
        if (token === null) { text += '['; i += 1; continue; }
        emit(token);
        i += len;
        if (token === 'OPEN:code') {
          const end = lower.indexOf('[/code]', i);
          if (end === -1) { text += source.slice(i); i = n; }
          else { text += source.slice(i, end); emit('CLOSE:code'); i = end + 7; }
        }
      }
      flush();
      return tokens;
    }
