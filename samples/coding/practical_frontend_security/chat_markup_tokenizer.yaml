expected_concepts:
  - "single-pass scanner with an index pointer"
  - "lookahead matching of tag literals"
  - "case-insensitive comparison while preserving original text"
  - "a raw mode for code blocks"
  - "buffering and flushing adjacent text"
  - "escape-sequence handling"
optimal_complexity: {time: "O(n)", space: "O(n)"}
rubric:
  excellent: "Writes a clean single-pass scanner with a text buffer, a small table of fixed tags, a bounded scan for url targets and a raw mode for code blocks; explains every rule from the statement against the examples and states O(n) time."
  good: "Produces correct tokens for normal input and fixes one or two edge cases (escapes, unclosed code, empty url target) after testing or a hint."
  weak: "Relies on a regular expression or split that mishandles escapes or code blocks, emits empty TEXT tokens, lowercases the url target or validates nesting instead of tokenizing."
  criteria:
    correctness: "All tests pass, including escapes, raw code blocks, unclosed code and non-tag brackets."
    efficiency: "Linear scan; avoids repeated string concatenation in a loop that would make the whole pass quadratic."
    code_quality: "Separates the text buffer, tag matching and code-block mode; constants for tags instead of scattered literals."
    edge_cases: "Empty input, trailing backslash, [[b], [url=], url targets containing '[' and case variants of tags."
    communication: "Explains why tokenizing is separated from nesting validation and HTML escaping in a rendering pipeline."
hints:
  - "Walk the message one character at a time and keep a buffer for plain text; only a few characters (backslash and '[') can start something special."
  - "When you see '[', check whether one of the fixed tags starts at this position (ignoring case) or whether it is '[url=' followed by a valid target and ']'. If nothing matches, the '[' is just text. Remember that a code block switches you into a different mode."
  - "Flush the text buffer before emitting a tag token. For a url tag scan forward until '[' or ']'; it is a tag only if you stop at ']' with at least one character consumed. After OPEN:code, search for the next case-insensitive '[/code]' and treat everything before it as text."
followups:
  - "How would you add a validation pass that reports unbalanced or wrongly nested tags?"
  - "Where in the rendering pipeline should HTML escaping happen, and why must the url target be checked against an allow-list of schemes?"
  - "How would you support [url] without '=' where the link text is also the target?"
  - "How would you report source positions for each token to underline markup errors in the editor?"
common_errors:
  - "Processing escapes inside code blocks or inside url targets."
  - "Emitting empty TEXT tokens between adjacent tags or for an empty code block."
  - "Lowercasing the whole token, which changes the url target."
  - "Skipping the whole bracket sequence when it is not a tag instead of only the '[' character."
  - "Treating any backslash as an escape and dropping it."
