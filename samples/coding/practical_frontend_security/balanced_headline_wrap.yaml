slug: balanced_headline_wrap
title: Balanced Headline Wrapping
difficulty: hard
competency_keys: [algorithms, problem_solving]
role_tags: [frontend, fullstack, ux_designer]
time_limit_minutes: 35
prompt_markdown: |
  ## Balanced Headline Wrapping

  Product cards on the marketing site show short headlines in a fixed-width box. Plain greedy wrapping
  (put as many words as fit on each line) often leaves a lonely word on the last line, so the design system
  asks for **balanced** wrapping: keep the same number of lines that greedy wrapping would use, but spread
  the words so the lines are as even as possible.

  You are given the headline as a list of `words` and the box `width` in characters. A line is one or more
  consecutive words joined by single spaces; its length is the total number of characters including those
  spaces and must be at most `width`. Words keep their order and are never split.

  1. Let `K` be the number of lines produced by **greedy** wrapping (fill each line with as many words as
     fit, then start a new line).
  2. Among all ways to split the words into **exactly `K` lines**, choose one that minimises the
     **badness**: the sum over **all** lines (the last one included) of `(width - line_length)^2`.
  3. If several splits have the same minimal badness, choose the one whose sequence of words-per-line is
     **lexicographically largest** (compare the first line's word count, then the second's, and so on; more
     words on earlier lines wins).

  Return the lines of the chosen split, top to bottom. Return an empty list when there are no words.

  ### Example 1
  ```
  Input:  words = ["Ship", "faster", "with", "zero", "downtime", "deploys"], width = 16
  Output: ["Ship faster", "with zero", "downtime deploys"]
  ```

  ### Example 2
  ```
  Input:  words = ["Quarterly", "roadmap", "review"], width = 20
  Output: ["Quarterly", "roadmap review"]
  Explanation: greedy wrapping gives "Quarterly roadmap" / "review" (badness 3^2 + 14^2 = 205). Moving
  "roadmap" down gives 11^2 + 6^2 = 157, which is the minimum for two lines.
  ```

  ### Example 3
  ```
  Input:  words = ["ab", "cd", "ef"], width = 5
  Output: ["ab cd", "ef"]
  Explanation: both two-line splits have badness 9; words-per-line [2, 1] is larger than [1, 2].
  ```

  ### Constraints
  - `0 <= words.length <= 200`
  - `1 <= width <= 100`
  - `1 <= words[i].length <= width`; words contain no spaces
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: balance_lines
  params:
    - {name: words, type: "string[]"}
    - {name: width, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def balance_lines(words: list[str], width: int) -> list[str]:
        n = len(words)
        if n == 0:
            return []
        line_count, current = 1, len(words[0])
        for word in words[1:]:
            if current + 1 + len(word) <= width:
                current += 1 + len(word)
            else:
                line_count += 1
                current = len(word)

        # best[i][k]: minimal badness for words[i:] in exactly k lines (None when impossible);
        # take[i][k]: words on the first of those lines, the largest among optimal choices.
        best: list[list[int | None]] = [[None] * (line_count + 1) for _ in range(n + 1)]
        take = [[0] * (line_count + 1) for _ in range(n + 1)]
        best[n][0] = 0
        for i in range(n - 1, -1, -1):
            for k in range(1, line_count + 1):
                length = -1
                for j in range(i, n):
                    length += len(words[j]) + 1
                    if length > width:
                        break
                    rest = best[j + 1][k - 1]
                    if rest is None:
                        continue
                    cost = (width - length) ** 2 + rest
                    if best[i][k] is None or cost <= best[i][k]:
                        best[i][k] = cost
                        take[i][k] = j - i + 1

        lines: list[str] = []
        i, k = 0, line_count
        while i < n:
            count = take[i][k]
            lines.append(" ".join(words[i:i + count]))
            i, k = i + count, k - 1
        return lines
  javascript: |
    function balanceLines(words, width) {
      const n = words.length;
      if (n === 0) return [];
      let lineCount = 1;
      let current = words[0].length;
      for (const word of words.slice(1)) {
        if (current + 1 + word.length <= width) {
          current += 1 + word.length;
        } else {
          lineCount += 1;
          current = word.length;
        }
      }
      const best = Array.from({ length: n + 1 }, () => new Array(lineCount + 1).fill(-1));
      const take = Array.from({ length: n + 1 }, () => new Array(lineCount + 1).fill(0));
      best[n][0] = 0;
      for (let i = n - 1; i >= 0; i--) {
        for (let k = 1; k <= lineCount; k++) {
          let length = -1;
          for (let j = i; j < n; j++) {
            length += words[j].length + 1;
            if (length > width) break;
            const rest = best[j + 1][k - 1];
            if (rest < 0) continue;
            const cost = (width - length) * (width - length) + rest;
            if (best[i][k] < 0 || cost <= best[i][k]) {
              best[i][k] = cost;
              take[i][k] = j - i + 1;
            }
          }
        }
      }
      const lines = [];
      let i = 0;
      let k = lineCount;
      while (i < n) {
        const count = take[i][k];
        lines.push(words.slice(i, i + count).join(" "));
        i += count;
        k -= 1;
      }
      return lines;
    }
