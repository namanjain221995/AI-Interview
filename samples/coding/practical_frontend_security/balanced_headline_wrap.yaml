expected_concepts:
  - greedy wrapping gives the minimum number of lines
  - dynamic programming over (first word, lines remaining)
  - squared slack penalises uneven lines because total slack is fixed for a fixed line count
  - tie-breaking by choosing the largest first-line count during reconstruction
optimal_complexity: {time: O(n * K * w) where w is the most words that fit on one line, space: O(n * K)}
rubric:
  excellent: Computes the greedy line count first, defines a DP over (start word, lines left) with squared slack over every line, handles the tie-break by preferring the largest first-line count among optimal choices and explains why that yields the lexicographically largest sequence.
  good: Correct DP and reconstruction but needs a hint for the fixed line count or the tie-break rule.
  weak: Uses greedy wrapping only, tries all splits exponentially, drops the last line from the cost, or ignores ties.
  criteria:
    correctness: All tests pass, including ties, single-line headlines and words exactly as wide as the box.
    efficiency: Polynomial DP that only extends a line while it still fits.
    code_quality: Clear separation of greedy count, DP table and reconstruction; no duplicated length arithmetic.
    edge_cases: No words, one word, a word equal to the width and many equal-cost splits.
    communication: Explains why the DP state needs the number of remaining lines and how ties are resolved.
hints:
  - First work out how many lines greedy wrapping uses; that number is fixed and only the split points change.
  - The best way to lay out the words from position i using exactly k lines depends only on i and k. Try every possible first line from i that fits, and add the best layout of the remaining words in k - 1 lines.
  - Fill a table best[i][k] from the end of the list backwards, extending each candidate first line one word at a time until it no longer fits. When two first lines give the same cost keep the longer one, then rebuild the answer from position 0 with K lines by following the recorded first-line lengths.
followups:
  - How would you balance using rendered pixel widths of a proportional font instead of character counts?
  - How could you speed up the DP for very long paragraphs?
  - What would you change to also avoid ending a line with a short word such as "a" or "to"?
common_errors:
  - Allowing a different number of lines than greedy wrapping produces.
  - Forgetting to include the last line in the badness.
  - Counting the spaces between words incorrectly when computing line length.
  - Resolving ties by keeping the first (shortest) candidate line instead of the longest.
