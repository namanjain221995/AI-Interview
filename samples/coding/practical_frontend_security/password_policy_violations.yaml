version: 1
slug: password_policy_violations
title: Password Policy Violations
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [security, backend, frontend, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Password Policy Violations

  The sign-up form of an internal tool rejects weak passwords, and users complained that it only ever
  showed the first problem it found. Write the check that reports **every** rule a password breaks, so
  the form can list all of them at once.

  The password is made of printable ASCII characters (codes `32` to `126`, so it may contain spaces).
  Check these rules and return the code of each violated rule, **in exactly this order**:

  | Code | Violated when |
  |------|---------------|
  | `TOO_SHORT` | the password has fewer than 12 characters |
  | `TOO_LONG` | the password has more than 64 characters |
  | `NO_UPPER` | there is no upper-case letter `A-Z` |
  | `NO_LOWER` | there is no lower-case letter `a-z` |
  | `NO_DIGIT` | there is no digit `0-9` |
  | `NO_SYMBOL` | there is no symbol: a character with code `33` to `126` that is not a letter or digit (a space is **not** a symbol) |
  | `HAS_SPACE` | the password contains a space character |
  | `REPEATED_RUN` | the same character appears 3 or more times in a row (case-sensitive, so `aaA` is not a run) |
  | `CONTAINS_USERNAME` | the username has at least 3 characters and appears inside the password, ignoring letter case |

  Return an empty list when the password breaks no rule.

  ### Example 1
  ```
  Input:  password = "Tr4il-Mix-Sunset", username = "dana"
  Output: []
  ```

  ### Example 2
  ```
  Input:  password = "password", username = "pass"
  Output: ["TOO_SHORT", "NO_UPPER", "NO_DIGIT", "NO_SYMBOL", "CONTAINS_USERNAME"]
  ```

  ### Example 3
  ```
  Input:  password = "Blue  sky 2024!!!", username = "ops"
  Output: ["HAS_SPACE", "REPEATED_RUN"]
  Explanation: two spaces in a row are not a run, but "!!!" is.
  ```

  ### Constraints
  - `0 <= password.length <= 200`, printable ASCII (codes `32` to `126`).
  - `0 <= username.length <= 32`, made of letters, digits, `.`, `_` and `-`.
  - The order of the returned codes is fixed by the table above.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: check_password_policy
  params:
    - {name: password, type: string}
    - {name: username, type: string}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def check_password_policy(password: str, username: str) -> list[str]:
        violations: list[str] = []
        if len(password) < 12:
            violations.append("TOO_SHORT")
        if len(password) > 64:
            violations.append("TOO_LONG")
        if not any("A" <= ch <= "Z" for ch in password):
            violations.append("NO_UPPER")
        if not any("a" <= ch <= "z" for ch in password):
            violations.append("NO_LOWER")
        if not any("0" <= ch <= "9" for ch in password):
            violations.append("NO_DIGIT")
        if not any(33 <= ord(ch) <= 126 and not ch.isalnum() for ch in password):
            violations.append("NO_SYMBOL")
        if " " in password:
            violations.append("HAS_SPACE")
        if any(password[i] == password[i - 1] == password[i - 2] for i in range(2, len(password))):
            violations.append("REPEATED_RUN")
        if len(username) >= 3 and username.lower() in password.lower():
            violations.append("CONTAINS_USERNAME")
        return violations
  javascript: |
    function checkPasswordPolicy(password, username) {
      const violations = [];
      if (password.length < 12) violations.push("TOO_SHORT");
      if (password.length > 64) violations.push("TOO_LONG");
      if (!/[A-Z]/.test(password)) violations.push("NO_UPPER");
      if (!/[a-z]/.test(password)) violations.push("NO_LOWER");
      if (!/[0-9]/.test(password)) violations.push("NO_DIGIT");
      if (!/[!-\/:-@\[-`{-~]/.test(password)) violations.push("NO_SYMBOL");
      if (password.includes(" ")) violations.push("HAS_SPACE");
      let run = false;
      for (let i = 2; i < password.length; i++) {
        if (password[i] === password[i - 1] && password[i] === password[i - 2]) {
          run = true;
          break;
        }
      }
      if (run) violations.push("REPEATED_RUN");
      if (username.length >= 3 && password.toLowerCase().includes(username.toLowerCase())) {
        violations.push("CONTAINS_USERNAME");
      }
      return violations;
    }
tests:
  - {id: t1, args: ["Tr4il-Mix-Sunset", "dana"], expected: [], description: "Example 1 - acceptable password"}
  - {id: t2, args: ["password", "pass"], expected: ["TOO_SHORT", "NO_UPPER", "NO_DIGIT", "NO_SYMBOL", "CONTAINS_USERNAME"], description: "Example 2 - several violations including the username"}
  - {id: t3, args: ["Blue  sky 2024!!!", "ops"], expected: ["HAS_SPACE", "REPEATED_RUN"], description: "Example 3 - spaces and a run of three symbols"}
  - {id: t4, hidden: true, args: ["", ""], expected: ["TOO_SHORT", "NO_UPPER", "NO_LOWER", "NO_DIGIT", "NO_SYMBOL"], description: "Empty password and empty username - every character-class rule fires"}
  - {id: t5, hidden: true, args: ["Ab1!Ab1!Ab1!", "ab"], expected: [], description: "Exactly 12 characters passes; username shorter than 3 is never checked"}
  - {id: t6, hidden: true, args: ["xx-MARIO-77-xx", "mario"], expected: ["CONTAINS_USERNAME"], description: "Username matched case-insensitively"}
  - {id: t7, hidden: true, args: ["Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Z", "zed"], expected: ["TOO_LONG"], description: "65 characters - too long but every class present"}
  - {id: t8, hidden: true, args: ["Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!Aa1!", "qwerty"], expected: [], description: "Exactly 64 characters is allowed"}
  - {id: t9, hidden: true, args: ["Correct   Horse9", "kim"], expected: ["NO_SYMBOL", "HAS_SPACE", "REPEATED_RUN"], description: "Three consecutive spaces - HAS_SPACE, REPEATED_RUN and NO_SYMBOL (space is not a symbol)"}
  - {id: t10, hidden: true, args: ["aaABBb1122!!xY", "abc"], expected: [], description: "Runs of exactly two are allowed; aaA and BBb are not runs because case differs"}
expected_concepts:
  - independent rule checks collected into one result instead of returning at the first failure
  - fixed output order that matches the rule table
  - character classification by ASCII ranges
  - detecting a run of three equal consecutive characters in one pass
  - case-insensitive substring search guarded by a minimum username length
optimal_complexity: {time: O(n * m), space: O(n + m)}
rubric:
  excellent: Checks every rule independently in the documented order, classifies characters precisely (space is not a symbol), detects runs with a single linear scan, guards the username rule by its length and discusses that the username search is a substring check whose cost depends on the library implementation.
  good: Correct codes for most inputs with readable code; may need a test run to fix the order of codes or the space-versus-symbol distinction.
  weak: Returns only the first failing rule, emits codes in the wrong order, treats a space as a symbol, counts any repeated character anywhere as a run, or checks short usernames.
  criteria:
    correctness: All tests pass, including the empty password, the exact 12 and 64 character boundaries and case-insensitive username matches.
    efficiency: Linear passes over the password for the character rules; no repeated rescans per rule beyond a constant number.
    code_quality: Rules are easy to read and reorder, for example a list of named checks, rather than one tangled condition.
    edge_cases: Empty strings, runs of exactly two, runs of spaces, usernames shorter than three characters.
    communication: Explains why reporting every violation improves the sign-up experience and how the order is kept stable.
hints:
  - Treat each row of the table as its own yes or no question about the password and collect the codes of the rules that fail, keeping the table order.
  - Most rules are about whether at least one character of a certain class exists; decide the class of a character from its ASCII range, remembering that a space counts neither as a letter, a digit nor a symbol.
  - Check the length rules first, then scan for upper, lower, digit and symbol characters, then look for a space, then compare each character with the two before it to find a run of three, and finally lower-case both strings and test whether the username is contained in the password only when it is at least three characters long.
followups:
  - How would you make the rule list configurable per organisation without changing the code?
  - Would you also reject passwords that appear in a list of known breached passwords, and how would you check that list efficiently?
  - Why do current guidelines favour long passphrases over strict composition rules?
  - How would you show these violations live as the user types without re-running expensive checks?
common_errors:
  - Returning after the first failed rule instead of collecting all of them.
  - Counting a space as a symbol, or checking for spaces only at the ends.
  - Flagging any character that occurs three times anywhere instead of three times consecutively.
  - Comparing the username case-sensitively or checking usernames shorter than three characters.
  - Emitting the codes in discovery order instead of the documented order.
