expected_concepts:
  - "segment-wise matching of patterns"
  - "specificity ranking with lexicographic comparison"
  - "stable tie-breaking by declaration order"
  - "parameter capture and wildcard tails"
  - "path normalisation (trailing slash, root)"
  - "optional trie of segments for many routes"
optimal_complexity: {time: "O(P * R * S) for P paths, R routes and S segments; a segment trie reduces the typical cost", space: "O(R * S)"}
rubric:
  excellent: "Pre-parses routes into segment lists and rank vectors, matches each path segment by segment with clear handling of params and the one-or-more wildcard, compares ranks lexicographically with stable tie-breaking and discusses a trie for large route tables."
  good: "Correct matching and output format, with the ranking rule or the trailing-slash normalisation fixed after a failing case."
  weak: "Picks the first match in declaration order, converts patterns to regular expressions without handling ranking, or lets the wildcard match zero segments."
  criteria:
    correctness: "All tests pass, including the root route, trailing slashes, wildcard rules and ties."
    efficiency: "Routes are parsed once, not per path; matching stops at the first mismatching segment."
    code_quality: "Small helpers for splitting, matching and ranking; output assembled in one place."
    edge_cases: "Root path, empty wildcard tail, duplicates, case sensitivity and overlapping wildcard routes."
    communication: "Explains why specificity ranking is preferable to relying on declaration order in a growing app."
hints:
  - "Turn every pattern and every path into a list of segments first; then think about what each kind of pattern segment accepts."
  - "Check each pattern against the path one segment at a time. Collect all patterns that match, and to choose between them give each pattern a list of numbers describing its segment kinds."
  - "Compare the rank lists lexicographically and keep the first pattern with the smallest list (only replace the best on a strictly smaller list). While matching, record 'name=value' for parameters and, at '*', require at least one remaining segment and capture the rest joined with '/'."
followups:
  - "How would you build a trie of route segments so that matching does not test every route?"
  - "How would you support optional segments or parameters with type constraints such as :id(\\d+)?"
  - "What should happen with URL-encoded characters in captured values?"
  - "How would you warn developers at build time about routes that can never be chosen?"
common_errors:
  - "Letting the wildcard match zero segments so /files matches /files/*."
  - "Choosing the first matching route instead of the most specific one."
  - "Replacing the best route on equal rank, which breaks the earliest-wins rule."
  - "Treating '/' as having one empty segment."
  - "Including the trailing slash in the wildcard capture."
