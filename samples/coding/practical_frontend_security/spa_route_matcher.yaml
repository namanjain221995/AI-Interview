title: "Single-Page App Route Matcher"
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [frontend, fullstack, mobile]
time_limit_minutes: 25
prompt_markdown: |
  ## Single-Page App Route Matcher

  The web dashboard is a single-page app with its own client-side router. When the address bar
  changes, the router picks which screen to show and extracts values from the URL. Implement the
  matching step for a batch of paths.

  **Patterns.** Each entry of `routes` starts with `/` and is split into segments on `/`. A segment is
  one of:

  - **static** text such as `users`: matches exactly that segment (case-sensitive);
  - a **parameter** `:name`: matches exactly one segment and captures it as `name`;
  - the **wildcard** `*`, only ever the last segment: matches **one or more** remaining segments.

  The pattern `/` has no segments. No other pattern ends with `/`.

  **Paths.** Each entry of `paths` starts with `/`; a single trailing `/` is ignored, so `/users/7/`
  is the same as `/users/7`, and `/` has no segments. Paths contain no query string and no empty
  segments.

  **Choosing a route.** Among all matching patterns, rank each one by the list of its segment kinds,
  where static = 0, parameter = 1 and wildcard = 2, and pick the pattern whose list is smallest when
  compared position by position. If several patterns have the same list, the one that appears
  **earliest** in `routes` wins. So `/users/new` beats `/users/:id`, and `/files/:name` beats
  `/files/*` for a one-segment file name.

  **Output.** For each path return the chosen pattern exactly as written, followed by
  ` name=value` for each parameter in pattern order and then, for a wildcard, ` *=` and the matched
  segments joined with `/`. Return `"404"` when no pattern matches.

  ### Example 1
  ```
  Input:  routes = ["/users", "/users/:id", "/users/new", "/users/:id/posts/:postId", "/files/*"],
          paths = ["/users/new", "/users/42/", "/users/42/posts/7", "/files/img/logo.png", "/files", "/teams"]
  Output: ["/users/new", "/users/:id id=42", "/users/:id/posts/:postId id=42 postId=7", "/files/* *=img/logo.png", "404", "404"]
  Explanation: /users/new matches both /users/:id ([0, 1]) and /users/new ([0, 0]); the static one wins.
  /files has no segment for the wildcard and /teams matches nothing.
  ```

  ### Example 2
  ```
  Input:  routes = ["/:section/*", "/docs/*", "/docs/:page", "/"],
          paths = ["/docs/intro", "/docs/api/auth", "/", "/blog/2024/launch"]
  Output: ["/docs/:page page=intro", "/docs/* *=api/auth", "/", "/:section/* section=blog *=2024/launch"]
  Explanation: /docs/intro matches /:section/* ([1, 2]), /docs/* ([0, 2]) and /docs/:page ([0, 1]); the
  smallest list is [0, 1]. /docs/api/auth only matches the two wildcard patterns.
  ```

  ### Example 3
  ```
  Input:  routes = ["/a/:x", "/a/:y"], paths = ["/a/b", "/a"]
  Output: ["/a/:x x=b", "404"]
  ```

  ### Constraints
  - `1 <= routes.length <= 100`, `1 <= paths.length <= 200`
  - Patterns and paths have at most 20 segments; segments use letters, digits, `-`, `_` and `.`
  - Parameter names are unique within a pattern
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: match_routes
  params:
    - {name: routes, type: "string[]"}
    - {name: paths, type: "string[]"}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def match_routes(routes: list[str], paths: list[str]) -> list[str]:
        def segments(path: str) -> list[str]:
            stripped = path.strip("/")
            return stripped.split("/") if stripped else []

        parsed = []
        for pattern in routes:
            segs = segments(pattern)
            rank = [2 if s == "*" else 1 if s.startswith(":") else 0 for s in segs]
            parsed.append((pattern, segs, rank))

        def try_match(segs: list[str], parts: list[str]):
            captured: list[str] = []
            for k, seg in enumerate(segs):
                if seg == "*":
                    if k >= len(parts):
                        return None
                    captured.append("*=" + "/".join(parts[k:]))
                    return captured
                if k >= len(parts):
                    return None
                if seg.startswith(":"):
                    captured.append(seg[1:] + "=" + parts[k])
                elif seg != parts[k]:
                    return None
            return captured if len(segs) == len(parts) else None

        result = []
        for path in paths:
            parts = segments(path)
            best = None
            for pattern, segs, rank in parsed:
                captured = try_match(segs, parts)
                if captured is None:
                    continue
                if best is None or rank < best[0]:
                    best = (rank, pattern, captured)
            if best is None:
                result.append("404")
            else:
                result.append(" ".join([best[1]] + best[2]))
        return result
  javascript: |
    function matchRoutes(routes, paths) {
      const segments = (path) => path.split('/').filter((s, i, arr) => !(s === '' && (i === 0 || i === arr.length - 1)));
      const parsed = routes.map((pattern) => {
        const segs = segments(pattern);
        const rank = segs.map((s) => (s === '*' ? 2 : s.startsWith(':') ? 1 : 0));
        return { pattern, segs, rank };
      });
      const less = (a, b) => {
        const n = Math.min(a.length, b.length);
        for (let i = 0; i < n; i++) if (a[i] !== b[i]) return a[i] < b[i];
        return a.length < b.length;
      };
      const tryMatch = (segs, parts) => {
        const captured = [];
        for (let k = 0; k < segs.length; k++) {
          const seg = segs[k];
          if (seg === '*') {
            if (k >= parts.length) return null;
            captured.push('*=' + parts.slice(k).join('/'));
            return captured;
          }
          if (k >= parts.length) return null;
          if (seg.startsWith(':')) captured.push(seg.slice(1) + '=' + parts[k]);
          else if (seg !== parts[k]) return null;
        }
        return segs.length === parts.length ? captured : null;
      };
      return paths.map((path) => {
        const parts = segments(path);
        let best = null;
        for (const route of parsed) {
          const captured = tryMatch(route.segs, parts);
          if (captured === null) continue;
          if (best === null || less(route.rank, best.rank)) best = { rank: route.rank, pattern: route.pattern, captured };
        }
        return best === null ? '404' : [best.pattern, ...best.captured].join(' ');
      });
    }
