version: 1
slug: truncate_label_word_boundary
title: Truncate Card Label at a Word Boundary
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [frontend, fullstack, mobile]
time_limit_minutes: 12
prompt_markdown: |
  ## Truncate Card Label at a Word Boundary

  A deployments dashboard shows each deployment title on a small card that fits at most `max_chars`
  characters. Long titles must be shortened with an ellipsis `...` (three full stops), and the product
  team does not want words cut in half unless there is no other way.

  Given `text` (words separated by single spaces, with no leading or trailing spaces) and `max_chars`:

  - If `text` has at most `max_chars` characters, return it **unchanged**.
  - Otherwise return the **longest** prefix made of whole words (the first `k >= 1` words joined by single
    spaces) such that the prefix followed by `...` has at most `max_chars` characters, and append `...`
    to it.
  - If not even the first word fits that way, return the first `max_chars - 3` characters of the first
    word followed by `...`.

  The ellipsis counts as three characters, and no space is placed before it.

  ### Example 1
  ```
  Input:  text = "Rollback payments service to v2.14", max_chars = 20
  Output: "Rollback payments..."
  Explanation: "Rollback payments" has 17 characters, plus 3 for the ellipsis is exactly 20.
  ```

  ### Example 2
  ```
  Input:  text = "Deploy api", max_chars = 12
  Output: "Deploy api"
  ```

  ### Example 3
  ```
  Input:  text = "Hotfix-cache-invalidation storm", max_chars = 12
  Output: "Hotfix-ca..."
  Explanation: the first word alone needs 25 + 3 characters, so it is cut to 12 - 3 = 9 characters.
  ```

  ### Constraints
  - `1 <= text.length <= 2000`; `text` contains printable ASCII characters, words are separated by single
    spaces and there are no leading or trailing spaces.
  - `4 <= max_chars <= 2000`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: fit_label
  params:
    - {name: text, type: string}
    - {name: max_chars, type: int}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    def fit_label(text: str, max_chars: int) -> str:
        if len(text) <= max_chars:
            return text
        words = text.split(" ")
        used, length = 0, 0
        for i, word in enumerate(words):
            candidate = length + len(word) + (1 if i > 0 else 0)
            if candidate + 3 > max_chars:
                break
            used, length = i + 1, candidate
        if used == 0:
            return words[0][: max_chars - 3] + "..."
        return " ".join(words[:used]) + "..."
  javascript: |
    function fitLabel(text, maxChars) {
      if (text.length <= maxChars) return text;
      const words = text.split(" ");
      let used = 0;
      let length = 0;
      for (let i = 0; i < words.length; i++) {
        const candidate = length + words[i].length + (i > 0 ? 1 : 0);
        if (candidate + 3 > maxChars) break;
        used = i + 1;
        length = candidate;
      }
      if (used === 0) return words[0].slice(0, maxChars - 3) + "...";
      return words.slice(0, used).join(" ") + "...";
    }
