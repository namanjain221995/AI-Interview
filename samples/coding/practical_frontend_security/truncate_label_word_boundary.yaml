expected_concepts:
  - early return when no truncation is needed
  - greedy accumulation of whole words while tracking the running length
  - reserving room for the three-character ellipsis
  - fallback to a mid-word cut when the first word is too long
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Returns short text unchanged, accumulates whole words while counting the separating spaces and the reserved ellipsis, falls back to the mid-word cut only for an oversized first word, and checks the off-by-one boundaries out loud.
  good: Correct for typical titles; needs a test run to fix one boundary such as a prefix that exactly fills the limit or text exactly max_chars long.
  weak: Always appends the ellipsis, cuts mid-word when a whole-word prefix fits, forgets the spaces between words in the length, or returns a result longer than max_chars.
  criteria:
    correctness: All tests pass, including text exactly at the limit, a prefix that exactly fills the limit and the mid-word fallback.
    efficiency: One pass over the words; no repeated joining of growing prefixes inside the loop.
    code_quality: The three cases (fits, whole words, mid-word) are visibly separate and the running length is easy to follow.
    edge_cases: Minimum max_chars of 4, single-word text, one-letter words, very long titles.
    communication: Explains how the space before each additional word and the ellipsis are accounted for.
hints:
  - Handle the case where nothing needs to change first, then think about how many whole words you can keep if three characters are reserved for the ellipsis.
  - Walk through the words in order while keeping the length of the prefix so far; adding a word costs its length plus one space, except for the first word.
  - Stop at the first word whose addition would make the prefix plus three characters exceed the limit; if at least one word was kept, join those words and add the ellipsis, otherwise take the first max_chars minus three characters of the first word and add the ellipsis.
followups:
  - How would you truncate by rendered pixel width instead of character count?
  - How would you handle titles that contain multi-byte characters or emoji?
  - When should the full title be available, for example as a tooltip or accessible label?
  - How would you truncate in the middle of the text, keeping the start and the end?
common_errors:
  - Forgetting to count the space between words when growing the prefix.
  - Appending the ellipsis even when the text already fits.
  - Off-by-one at the boundary where prefix plus ellipsis equals max_chars exactly.
  - Cutting mid-word even though a whole-word prefix would fit.
  - Placing a space before the ellipsis.
