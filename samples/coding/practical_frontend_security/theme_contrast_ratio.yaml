version: 1
slug: theme_contrast_ratio
title: Theme Contrast Checker
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [frontend, fullstack, mobile, ux_designer]
time_limit_minutes: 12
prompt_markdown: |
  ## Theme Contrast Checker

  Your design-system linter checks every text/background colour pair in a theme before the theme is
  published. Pairs with too little contrast are hard to read, so the linter needs the **contrast ratio**
  defined by WCAG 2.x. Write the function that computes it.

  Each colour is a string `"#RRGGBB"`: a `#` followed by six hexadecimal digits (upper or lower case)
  giving the red, green and blue channels as integers `v` from `0` to `255`.

  1. For each channel compute `c = v / 255` and linearise it:
     - if `c <= 0.04045` the linear value is `c / 12.92`;
     - otherwise it is `((c + 0.055) / 1.055)` raised to the power `2.4`.
  2. The relative luminance of a colour is `L = 0.2126 * R + 0.7152 * G + 0.0722 * B`, using the linear
     values of its red, green and blue channels.
  3. With `L1` the larger and `L2` the smaller of the two luminances, the contrast ratio is
     `(L1 + 0.05) / (L2 + 0.05)`.

  Return the ratio **unrounded**. The result does not depend on which colour is the foreground: swapping
  the arguments gives the same value. The ratio is always between `1` (identical luminance) and `21`
  (black and white).

  ### Example 1
  ```
  Input:  foreground = "#000000", background = "#FFFFFF"
  Output: 21.0
  ```

  ### Example 2
  ```
  Input:  foreground = "#ffffff", background = "#767676"
  Output: 4.542224959605253
  Explanation: the lighter colour may be either argument; this grey passes the common 4.5 threshold.
  ```

  ### Example 3
  ```
  Input:  foreground = "#1D4ED8", background = "#F8FAFC"
  Output: 6.405212062099509
  ```

  ### Constraints
  - Both inputs are exactly 7 characters: `#` followed by 6 hexadecimal digits (`0-9`, `a-f`, `A-F`).
  - Inputs are always well formed.
  - Answers are accepted within a relative tolerance of `1e-6`.
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: contrast_ratio
  params:
    - {name: foreground, type: string}
    - {name: background, type: string}
  return_type: float
  comparison: float_tolerance
reference_solutions:
  python: |
    def contrast_ratio(foreground: str, background: str) -> float:
        def channel(hex_pair: str) -> float:
            c = int(hex_pair, 16) / 255
            return c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4

        def luminance(colour: str) -> float:
            r, g, b = channel(colour[1:3]), channel(colour[3:5]), channel(colour[5:7])
            return 0.2126 * r + 0.7152 * g + 0.0722 * b

        a, b = luminance(foreground), luminance(background)
        lighter, darker = max(a, b), min(a, b)
        return (lighter + 0.05) / (darker + 0.05)
  javascript: |
    function contrastRatio(foreground, background) {
      const channel = (hexPair) => {
        const c = parseInt(hexPair, 16) / 255;
        return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      };
      const luminance = (colour) =>
        0.2126 * channel(colour.slice(1, 3)) +
        0.7152 * channel(colour.slice(3, 5)) +
        0.0722 * channel(colour.slice(5, 7));
      const a = luminance(foreground);
      const b = luminance(background);
      return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    }
tests:
  - {id: t1, args: ["#000000", "#FFFFFF"], expected: 21.0, description: "Example 1 - black on white gives the maximum ratio"}
  - {id: t2, args: ["#ffffff", "#767676"], expected: 4.542224959605253, description: "Example 2 - background darker than foreground; mid grey just above 4.5"}
  - {id: t3, args: ["#1D4ED8", "#F8FAFC"], expected: 6.405212062099509, description: "Example 3 - brand blue on an off-white surface, mixed channels"}
  - {id: t4, hidden: true, args: ["#336699", "#336699"], expected: 1.0, description: "Identical colours give exactly 1"}
  - {id: t5, hidden: true, args: ["#F8FAFC", "#1D4ED8"], expected: 6.405212062099509, description: "Arguments swapped - must equal Example 3"}
  - {id: t6, hidden: true, args: ["#0a0a0a", "#000000"], expected: 1.0607053967097675, description: "Channel value 10 sits below the 0.04045 threshold - linear branch"}
  - {id: t7, hidden: true, args: ["#0B0B0B", "#0A0A0A"], expected: 1.0058690363860938, description: "Channel 11 is just above the threshold, 10 just below - both branches"}
  - {id: t8, hidden: true, args: ["#FF0000", "#0000ff"], expected: 2.148936170212766, description: "Pure red vs pure blue - channel weights matter, case mixed"}
  - {id: t9, hidden: true, args: ["#00FF00", "#FFFFFF"], expected: 1.3721902770517513, description: "Pure green on white - green dominates luminance"}
  - {id: t10, hidden: true, args: ["#aBcDeF", "#123456"], expected: 7.697307588979985, description: "Mixed-case hex digits in every position"}
expected_concepts:
  - parsing two-digit hexadecimal channels case-insensitively
  - piecewise gamma linearisation with the 0.04045 threshold
  - weighted sum for relative luminance
  - ordering the luminances so the ratio is symmetric and at least 1
  - floating-point results compared with a tolerance
optimal_complexity: {time: O(1), space: O(1)}
rubric:
  excellent: Parses the channels with a small helper, applies the piecewise linearisation exactly as specified, picks the lighter and darker luminance so argument order does not matter, keeps the result unrounded and explains why both branches of the formula exist.
  good: Correct ratio for typical colours with clear code; may need a hint about argument order or the threshold comparison.
  weak: Uses raw channel values without linearising, divides in a fixed order so swapped arguments give a ratio below 1, rounds the result, or mishandles lower-case hex digits.
  criteria:
    correctness: All tests pass within tolerance, including identical colours, swapped arguments and channels on each side of the threshold.
    efficiency: Constant work per call; no lookup tables or loops beyond the three channels are needed.
    code_quality: Separate helpers for channel linearisation and luminance; no copy-pasted per-channel formulas.
    edge_cases: Lower-case and mixed-case hex digits, values 10 and 11 around the linear threshold, identical colours.
    communication: Explains what luminance and contrast ratio mean for a design-system check and why the order of arguments is irrelevant.
hints:
  - Break the job into three steps - turn a colour into three channel numbers, turn the channels into one luminance value, then combine two luminances into the ratio.
  - Each channel is two hexadecimal digits that your language can parse directly; divide by 255, then apply the two-branch linearisation rule before weighting the red, green and blue values.
  - Write one helper that linearises a single channel (small values are divided by 12.92, larger ones go through the power 2.4 formula) and another that returns the weighted luminance of a colour; compute both luminances, take the larger as the numerator and the smaller as the denominator, add 0.05 to each and divide without rounding.
followups:
  - How would you suggest the closest colour that reaches a ratio of 4.5 by only changing lightness?
  - How would you run this check over every token pair in a theme with hundreds of colours efficiently?
  - What changes if colours can include an alpha channel over a known background?
  - Why might a linter apply a different threshold to large or bold text?
common_errors:
  - Using the 0-255 channel values directly instead of the linearised values.
  - Dividing the foreground luminance by the background luminance without ordering them, which yields ratios below 1.
  - Forgetting the 0.05 offset in the numerator or denominator.
  - Parsing only upper-case hex digits.
  - Rounding the ratio before returning it.
