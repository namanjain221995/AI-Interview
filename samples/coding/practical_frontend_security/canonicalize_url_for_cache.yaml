  - {id: t1, args: ["HTTPS://Docs.Example.COM.:0443/API%2fv1/%7Euser/a%2Db?b=2&a=%41&c=&&a=1#top"], expected: "https://docs.example.com/API%2Fv1/~user/a-b?a=A&a=1&b=2", description: "Example 1"}
  - {id: t2, args: ["http://shop.example.net:8080"], expected: "http://shop.example.net:8080/", description: "Example 2 - missing path becomes /, non-default port kept"}
  - {id: t3, args: ["http://Cdn.Example.org:443/img/./logo.png?#frag"], expected: "http://cdn.example.org:443/img/./logo.png", description: "Example 3 - 443 is not the default for http; dot segments untouched; empty query dropped"}
  - {id: t4, hidden: true, args: ["https://example.com/a%25b%2541?x=%25"], expected: "https://example.com/a%25b%2541?x=%25", description: "Percent-encoded percent sign stays encoded and is not decoded twice"}
  - {id: t5, hidden: true, args: ["https://example.com/100%/off%zz%4?%=1&q=50%"], expected: "https://example.com/100%/off%zz%4?%=1&q=50%", description: "Malformed escapes (no hex, one hex digit, at the end) are left unchanged"}
  - {id: t6, hidden: true, args: ["http://api.example.com:00080/v2//Items/../X?z=1&Z=2&_=3&a=&a&=v#?frag=1"], expected: "http://api.example.com/v2//Items/../X?=v&Z=2&_=3&a&z=1", description: "Port with leading zeros equal to default dropped; double slash and .. kept; uppercase keys before underscore before lowercase; flag parameter without = kept, empty-key parameter sorted first"}
  - {id: t7, hidden: true, args: ["https://EXAMPLE.com:65535?b=1&a=2"], expected: "https://example.com:65535/?a=2&b=1", description: "No path but a query - path becomes / before the query; maximum port kept"}
  - {id: t8, hidden: true, args: ["http://example.com/%41%62%30%2d%2E%5f%7e%20%2F%3a%3F%23%26"], expected: "http://example.com/Ab0-._~%20%2F%3A%3F%23%26", description: "Every unreserved class decoded, reserved and space escapes uppercased"}
  - {id: t9, hidden: true, args: ["https://example.com/search?q=a%26b%3Dc&q=a&lang=en&q=%7a&page=2&lang=&sort=price%2Basc"], expected: "https://example.com/search?lang=en&page=2&q=a%26b%3Dc&q=a&q=z&sort=price%2Basc", description: "Encoded & and = inside values do not split parameters; repeated keys keep input order; empty value dropped"}
  - {id: t10, hidden: true, args: ["https://h.example/p?&&&#x"], expected: "https://h.example/p", description: "Query made only of separators collapses to no query"}
  - {id: t11, hidden: true, args: ["http://example.com:080/#only-fragment?not=query"], expected: "http://example.com/", description: "Question mark inside the fragment is not a query; port 080 is the http default"}
expected_concepts:
  - splitting a URL into components by the first delimiter
  - percent-encoding normalisation (unreserved decode, uppercase hex)
  - single-pass scanning that avoids double decoding
  - stable sort by key
  - cache-key fragmentation and cache poisoning awareness
optimal_complexity: {time: "O(n + p log p) for a URL of length n with p query parameters", space: O(n)}
rubric:
  excellent: Splits the URL with clear component boundaries, normalises escapes in a single left-to-right pass without double decoding, handles default ports with leading zeros per scheme, drops blank parameters, uses a stable sort by key only, and explains why over-normalising (for example decoding reserved characters) could change meaning or enable cache poisoning.
  good: Correct output after a hint about the escape rules for reserved characters or about stable ordering of repeated keys.
  weak: Uses a full URL-decoding library call that decodes reserved characters, sorts by the whole parameter, compares the port as a string, or keeps the fragment.
  criteria:
    correctness: All tests pass, including %25, malformed escapes, encoded & and =, and fragments containing ?.
    efficiency: Linear scanning plus one sort of the parameters.
    code_quality: Separate helpers for splitting, escape normalisation and query handling.
    edge_cases: Missing path, empty query, query of only separators, ports with leading zeros, maximum port, trailing dot on the host.
    communication: Explains which normalisations are safe for a cache key and which are not.
hints:
  - Split the URL into scheme, authority, path, query and fragment first, using the first occurrence of each delimiter, and treat each part with its own rules.
  - For escapes, walk the text once and look at a percent sign plus the next two characters; decide between decoding and uppercasing, then jump past all three characters so nothing is decoded twice.
  - Normalise the path and query text, split the query on ampersands, filter out empty pieces and pieces whose value after the first equals sign is empty, stable-sort by the text before the first equals sign, and only add the question mark when something remains; compare the port numerically with the scheme default.
followups:
  - Why must %2F not be decoded to / in the path, and what could go wrong for the origin server if it were?
  - Which query parameters (for example tracking tags) would you also strip for caching, and how would you make that configurable?
  - How can a mismatch between the cache's normalisation and the origin's URL parsing lead to cache poisoning?
common_errors:
  - Decoding every escape, including reserved characters such as %2F, %26 or %3D, which changes the meaning of the URL.
  - Decoding %25 and then decoding the result again.
  - Comparing the port as text so 0443 or 00080 is not recognised as the default.
  - Sorting parameters by full text or with an unstable sort, reordering repeated keys.
  - Treating a ? inside the fragment as the start of the query.
