version: 1
slug: canonicalize_url_for_cache
title: Normalise Percent-Encoded URLs for an Edge Cache
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [frontend, backend, sre, security]
time_limit_minutes: 25
prompt_markdown: |
  ## Normalise Percent-Encoded URLs for an Edge Cache

  The edge cache in front of a documentation site stores pages by URL. Browsers, crawlers and old
  links write the same address in different ways (`%7E` versus `~`, `%2f` versus `%2F`, a trailing dot
  on the host, an explicit default port, blank form fields), and every spelling currently gets its own
  cache entry. Write `normalize_url(url)` that rewrites a URL into one **normal form**.

  The input has the shape `scheme://authority[path][?query][#fragment]`:

  - `scheme` is `http` or `https` in any letter case.
  - `authority` runs from after `://` up to the first `/`, `?` or `#` (or the end). It is `host` or
    `host:port`.
  - `path` starts with `/` and runs up to the first `?` or `#`; it may be missing.
  - `query` is the text after a `?` up to the first `#`; it exists only if that `?` comes before
    any `#`.
  - `fragment` is everything from the first `#`.

  Build the result as `scheme://host[:port]` + `path` + `?query` (when parameters remain):

  1. **Scheme and host** are lowercased, and one trailing `.` on the host is removed.
  2. **Port**: read it as a decimal number (leading zeros allowed). If it equals the default for the
     scheme (`80` for `http`, `443` for `https`), drop it; otherwise write it without leading zeros.
  3. **Escapes** in the path and the query: a `%` followed by two hex digits is an escape. If the
     escaped character is **unreserved** (`A-Z`, `a-z`, `0-9`, `-`, `.`, `_`, `~`), replace the escape
     with that character; otherwise keep the escape with **uppercase** hex digits. Scan left to right
     and never re-examine produced text, so `%2541` becomes `%2541`. A `%` that does not start an
     escape is kept as is.
  4. **Path**: after step 3 it is kept exactly (letter case, `.` and `..` segments and `//` are not
     touched). A missing path becomes `/`.
  5. **Query**: after step 3 split it on `&`. Drop pieces that are empty and pieces with an `=` whose
     value (the text after the first `=`) is empty. The **key** of a piece is the text before its first
     `=`, or the whole piece if it has no `=`. Sort the remaining pieces by key in plain character-code
     (ASCII) order, keeping the original order of pieces with equal keys, and join them with `&`. If no
     pieces remain, the result has no `?`.
  6. The **fragment** is dropped.

  ### Example 1
  ```
  Input:  url = "HTTPS://Docs.Example.COM.:0443/API%2fv1/%7Euser/a%2Db?b=2&a=%41&c=&&a=1#top"
  Output: "https://docs.example.com/API%2Fv1/~user/a-b?a=A&a=1&b=2"
  Explanation: port 0443 is the https default; %2f is reserved and becomes %2F, %7E and %2D
  are unreserved and are decoded; "c=" and the empty piece are dropped; the two "a" parameters
  keep their original order.
  ```

  ### Example 2
  ```
  Input:  url = "http://shop.example.net:8080"
  Output: "http://shop.example.net:8080/"
  ```

  ### Example 3
  ```
  Input:  url = "http://Cdn.Example.org:443/img/./logo.png?#frag"
  Output: "http://cdn.example.org:443/img/./logo.png"
  Explanation: 443 is only the default port for https, so it stays. "/./" is left as is.
  ```

  ### Constraints
  - `10 <= url.length <= 2000`; the URL contains printable ASCII characters without spaces
  - `host` has 1-253 characters from `a-z`, `A-Z`, `0-9`, `-` and `.`, and does not end with `..`
  - a `port`, when present, is 1-5 digits with a value between 1 and 65535
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: normalize_url
  params:
    - {name: url, type: string}
  return_type: string
  comparison: exact
reference_solutions:
  python: |
    HEX = "0123456789abcdefABCDEF"
    DEFAULT_PORTS = {"http": 80, "https": 443}


    def _is_unreserved(ch: str) -> bool:
        return ch.isascii() and (ch.isalnum() or ch in "-._~")


    def _normalize_escapes(text: str) -> str:
        out: list[str] = []
        i = 0
        while i < len(text):
            if text[i] == "%" and i + 2 < len(text) and text[i + 1] in HEX and text[i + 2] in HEX:
                ch = chr(int(text[i + 1:i + 3], 16))
                out.append(ch if _is_unreserved(ch) else "%" + text[i + 1:i + 3].upper())
                i += 3
            else:
                out.append(text[i])
                i += 1
        return "".join(out)


    def normalize_url(url: str) -> str:
        scheme, rest = url.split("://", 1)
        scheme = scheme.lower()
        end = len(rest)
        for sep in "/?#":
            pos = rest.find(sep)
            if pos != -1:
                end = min(end, pos)
        authority, rest = rest[:end], rest[end:]
        rest = rest.split("#", 1)[0]  # drop the fragment
        path, _, query = rest.partition("?")

        host, _, port = authority.partition(":")
        host = host.lower()
        if host.endswith("."):
            host = host[:-1]
        result = scheme + "://" + host
        if port and int(port) != DEFAULT_PORTS[scheme]:
            result += ":" + str(int(port))

        result += _normalize_escapes(path) or "/"

        params = []
        for piece in _normalize_escapes(query).split("&"):
            key, has_eq, value = piece.partition("=")
            if piece == "" or (has_eq and value == ""):
                continue
            params.append((key, piece))
        params.sort(key=lambda kv: kv[0])  # stable: equal keys keep their order
        if params:
            result += "?" + "&".join(piece for _, piece in params)
        return result
  javascript: |
    const HEX = '0123456789abcdefABCDEF';
    const DEFAULT_PORTS = { http: 80, https: 443 };

    const isUnreserved = (ch) => /^[A-Za-z0-9\-._~]$/.test(ch);

    function normalizeEscapes(text) {
      let out = '';
      let i = 0;
      while (i < text.length) {
        if (text[i] === '%' && i + 2 < text.length && HEX.includes(text[i + 1]) && HEX.includes(text[i + 2])) {
          const hex = text.slice(i + 1, i + 3);
          const ch = String.fromCharCode(parseInt(hex, 16));
          out += isUnreserved(ch) ? ch : '%' + hex.toUpperCase();
          i += 3;
        } else {
          out += text[i];
          i += 1;
        }
      }
      return out;
    }

    function normalizeUrl(url) {
      const sepAt = url.indexOf('://');
      const scheme = url.slice(0, sepAt).toLowerCase();
      let rest = url.slice(sepAt + 3);
      let end = rest.length;
      for (const sep of '/?#') {
        const pos = rest.indexOf(sep);
        if (pos !== -1) end = Math.min(end, pos);
      }
      const authority = rest.slice(0, end);
      rest = rest.slice(end).split('#')[0]; // drop the fragment
      const q = rest.indexOf('?');
      const path = q === -1 ? rest : rest.slice(0, q);
      const query = q === -1 ? '' : rest.slice(q + 1);

      const colon = authority.indexOf(':');
      let host = (colon === -1 ? authority : authority.slice(0, colon)).toLowerCase();
      const port = colon === -1 ? '' : authority.slice(colon + 1);
      if (host.endsWith('.')) host = host.slice(0, -1);
      let result = scheme + '://' + host;
      if (port !== '' && parseInt(port, 10) !== DEFAULT_PORTS[scheme]) result += ':' + parseInt(port, 10);

      result += normalizeEscapes(path) || '/';

      const params = [];
      for (const piece of normalizeEscapes(query).split('&')) {
        const eq = piece.indexOf('=');
        const key = eq === -1 ? piece : piece.slice(0, eq);
        if (piece === '' || (eq !== -1 && eq === piece.length - 1)) continue;
        params.push([key, piece]);
      }
      params.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)); // stable sort by key
      if (params.length > 0) result += '?' + params.map((p) => p[1]).join('&');
      return result;
    }
