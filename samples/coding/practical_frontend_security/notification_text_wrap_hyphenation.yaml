version: 1
slug: notification_text_wrap_hyphenation
title: Wrap Toast Text with Hard Hyphenation
difficulty: medium
competency_keys: [algorithms, problem_solving, code_quality]
role_tags: [frontend, mobile, fullstack]
time_limit_minutes: 20
prompt_markdown: |
  ## Wrap Toast Text with Hard Hyphenation

  A mobile app shows short toast notifications in a monospace font inside a box that is exactly `width`
  characters wide. Messages often contain file names, URLs or error codes longer than the box, and
  those must be cut with a hyphen instead of overflowing. Write `wrap_toast_text(text, width)` that
  returns the lines of the toast.

  **Words** are the maximal runs of non-space characters in `text`; words are separated by one or more
  space characters. Place the words in order while building the current line:

  - **Short word** (length `<= width`): if the current line is empty, the word becomes the line. If
    the current line plus one space plus the word fits in `width`, append it with a single space.
    Otherwise finish the current line and start a new one with the word.
  - **Long word** (length `> width`): if the current line is not empty, finish it. Then, while the
    rest of the word is longer than `width`, output a line made of its next `width - 1` characters
    followed by `-`. The final rest of the word (at most `width` characters) becomes the new
    **current line**, so later short words can still be appended to it.

  After the last word, finish the current line if it is not empty. Return the finished lines in order;
  return an empty list when `text` has no words. Lines never start or end with a space.

  ### Example 1
  ```
  Input:  text = "Upload  finished: quarterly-report-final.pdf is ready", width = 12
  Output: ["Upload", "finished:", "quarterly-r-", "eport-final-", ".pdf is", "ready"]
  Explanation: the 26-character file name does not fit in 12, so it starts a new line and is cut
  into pieces of 11 characters plus '-'. The rest ".pdf" stays open, so "is" is appended to it;
  ".pdf is ready" would need 13 characters, so "ready" starts a new line.
  ```

  ### Example 2
  ```
  Input:  text = "Sync failed", width = 20
  Output: ["Sync failed"]
  ```

  ### Constraints
  - `0 <= text.length <= 10^4`; `text` contains printable ASCII characters (space is the only
    whitespace)
  - `2 <= width <= 200`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: wrap_toast_text
  params:
    - {name: text, type: string}
    - {name: width, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def wrap_toast_text(text: str, width: int) -> list[str]:
        lines: list[str] = []
        current = ""
        for word in text.split(" "):
            if not word:
                continue  # runs of spaces
            if len(word) <= width:
                if not current:
                    current = word
                elif len(current) + 1 + len(word) <= width:
                    current += " " + word
                else:
                    lines.append(current)
                    current = word
                continue
            # Word longer than the line: start fresh and break it into hyphenated pieces.
            if current:
                lines.append(current)
            while len(word) > width:
                lines.append(word[:width - 1] + "-")
                word = word[width - 1:]
            current = word  # the remainder stays open for the next words
        if current:
            lines.append(current)
        return lines
  javascript: |
    function wrapToastText(text, width) {
      const lines = [];
      let current = '';
      for (let word of text.split(' ')) {
        if (word === '') continue; // runs of spaces
        if (word.length <= width) {
          if (current === '') current = word;
          else if (current.length + 1 + word.length <= width) current += ' ' + word;
          else {
            lines.push(current);
            current = word;
          }
          continue;
        }
        // Word longer than the line: start fresh and break it into hyphenated pieces.
        if (current !== '') lines.push(current);
        while (word.length > width) {
          lines.push(word.slice(0, width - 1) + '-');
          word = word.slice(width - 1);
        }
        current = word; // the remainder stays open for the next words
      }
      if (current !== '') lines.push(current);
      return lines;
    }
tests:
  - {id: t1, args: ["Upload  finished: quarterly-report-final.pdf is ready", 12], expected: ["Upload", "finished:", "quarterly-r-", "eport-final-", ".pdf is", "ready"], description: "Example 1"}
  - {id: t2, args: ["Sync failed", 20], expected: ["Sync failed"], description: "Example 2 - everything fits on one line"}
  - {id: t3, hidden: true, args: ["   ", 10], expected: [], description: "Only spaces - no words, empty list"}
  - {id: t4, hidden: true, args: ["", 5], expected: [], description: "Empty text"}
  - {id: t5, hidden: true, args: ["abcdefghij abcdefghijk x", 10], expected: ["abcdefghij", "abcdefghi-", "jk x"], description: "Word exactly width is not broken; width+1 breaks into 9 chars plus dash and a 2-char remainder that takes the next word"}
  - {id: t6, hidden: true, args: ["abcdef", 2], expected: ["a-", "b-", "c-", "d-", "ef"], description: "Minimum width - one character plus dash per piece"}
  - {id: t7, hidden: true, args: ["  ok   then  supercalifragilistic  ", 6], expected: ["ok", "then", "super-", "calif-", "ragil-", "istic"], description: "Leading, trailing and repeated spaces; long word flushes a non-empty line first"}
  - {id: t8, hidden: true, args: ["aaaaaaaa bbbbbbbbbbbbbbb c", 8], expected: ["aaaaaaaa", "bbbbbbb-", "bbbbbbbb", "c"], description: "Word of exactly width stays whole; a 15-letter word leaves a remainder of exactly width, so the next word wraps"}
  - {id: t9, hidden: true, args: ["a b c d e f g h", 3], expected: ["a b", "c d", "e f", "g h"], description: "Many one-letter words packed greedily"}
  - {id: t10, hidden: true, args: ["Deploy #4821 to eu-west-1 rolled back: health-check-timeout-exceeded-after-30s on 3/12 pods; see https://status.example.com/incidents/2026-10-08/a1b2c3d4e5f6 for details. Deploy #4821 to eu-west-1 rolled back: health-check-timeout-exceeded-after-30s on 3/12 pods; see https://status.example.com/incidents/2026-10-08/a1b2c3d4e5f6 for details. Deploy #4821 to eu-west-1 rolled back: health-check-timeout-exceeded-after-30s on 3/12 pods; see https://status.example.com/incidents/2026-10-08/a1b2c3d4e5f6 for details.", 24], expected: ["Deploy #4821 to", "eu-west-1 rolled back:", "health-check-timeout-ex-", "ceeded-after-30s on 3/12", "pods; see", "https://status.example.-", "com/incidents/2026-10-0-", "8/a1b2c3d4e5f6 for", "details. Deploy #4821 to", "eu-west-1 rolled back:", "health-check-timeout-ex-", "ceeded-after-30s on 3/12", "pods; see", "https://status.example.-", "com/incidents/2026-10-0-", "8/a1b2c3d4e5f6 for", "details. Deploy #4821 to", "eu-west-1 rolled back:", "health-check-timeout-ex-", "ceeded-after-30s on 3/12", "pods; see", "https://status.example.-", "com/incidents/2026-10-0-", "8/a1b2c3d4e5f6 for", "details."], description: "Long realistic notification with URLs and identifiers repeated three times"}
expected_concepts:
  - greedy line filling
  - tokenising on runs of spaces
  - chunking an over-long word with width - 1 characters plus a hyphen
  - carrying the remainder as an open line
  - off-by-one reasoning at exact widths
optimal_complexity: {time: O(n), space: O(n)}
rubric:
  excellent: Tokenises robustly, fills lines greedily with an exact fit check, flushes before a long word, cuts pieces of width - 1 plus a hyphen, keeps the remainder open for later words, and verifies the boundary cases (word of exactly width, width + 1, 2 * width - 1, width 2) out loud.
  good: Correct result after a hint about the remainder staying open or about the piece length being width - 1.
  weak: Lets long words overflow, cuts pieces of width characters so the hyphen overflows, always starts a new line after a long word, or emits empty lines for repeated spaces.
  criteria:
    correctness: All tests pass, including boundary lengths and texts with extra spaces.
    efficiency: Each character is copied a constant number of times; no repeated re-wrapping.
    code_quality: A clear current-line variable and separate branches for short and long words.
    edge_cases: Empty or space-only text, width 2, words of exactly width, remainder of exactly width.
    communication: Explains the greedy invariant and walks through the long-word branch on an example.
hints:
  - Process the words one by one while keeping the line you are currently building; most words follow the usual greedy rule.
  - Handle words longer than the width separately - close the current line, emit hyphenated pieces, and remember that the hyphen takes one of the width characters.
  - For a long word, push the current line if non-empty, then while the word is longer than width push word[0:width-1] + "-" and drop those characters; the leftover becomes the current line, and short words keep using the normal fits-with-one-space check.
followups:
  - How would you prefer breaking long words at natural points such as /, - or . in URLs?
  - How would the algorithm change for a proportional font where each character has its own width?
  - How would you truncate the toast to at most three lines with an ellipsis?
common_errors:
  - Cutting pieces of width characters and then adding the hyphen, producing lines longer than width.
  - Starting a new line after the remainder of a long word instead of letting short words join it.
  - Splitting on single spaces and producing empty words or empty lines.
  - Off-by-one in the fit check (using < instead of <=).
