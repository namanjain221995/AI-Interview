expected_concepts:
  - "parsing URLs into scheme, host, port and path"
  - "effective (default) ports"
  - "wildcard subdomain matching that excludes the apex"
  - "prefix versus exact path matching"
  - "scheme upgrade from http to https"
  - "parse sources once and reuse them"
optimal_complexity: {time: "O(S * U * L) for S sources, U URLs and string length L", space: "O(S + U)"}
rubric:
  excellent: "Parses origins, URLs and sources into structured parts once, implements each rule as a small predicate (scheme, host, port, path), handles the apex and look-alike host cases, default ports per URL scheme and the http-to-https upgrade, and explains why suffix matching must include the leading dot."
  good: "Correct for most cases; misses one subtle rule such as the default port after an upgrade or the apex exclusion and fixes it after a failing test."
  weak: "Uses substring or contains checks for hosts (so badexample.com or example.com.evil.net pass), ignores ports, or compares the whole URL string with the source."
  criteria:
    correctness: "All tests pass, including apex exclusion, look-alike hosts, default ports and exact versus prefix paths."
    efficiency: "Linear in the total input per source-URL pair; sources can be pre-parsed once."
    code_quality: "Separate parsing from matching, one helper per component, no duplicated port logic."
    edge_cases: "URLs without a path, queries and fragments, explicit default ports, uppercase hosts and 'none' alongside other sources."
    communication: "Relates the rules to real attacks (look-alike domains, mixed content) and notes where real CSP differs."
hints:
  - "Break every URL and every host source into the same parts (scheme, host, port, path) before comparing anything; most bugs come from comparing raw strings."
  - "Handle the keyword and scheme-only sources first, then for host sources check scheme, host, port and path in turn and reject as soon as one part fails. Work out the effective port of the URL from its own scheme."
  - "For '*.domain' compare against the suffix '.domain' so the apex and look-alikes such as 'baddomain' fail. A source scheme of http also accepts https; a missing source port means the URL's port must equal the default for the URL's scheme; a path ending in '/' is a prefix test, otherwise equality on the path with query and fragment removed."
followups:
  - "Real CSP also allows a bare '*' host and nonces or hashes. How would you extend the parser without turning it into a tangle of special cases?"
  - "Why do browsers ignore the path part of a source after a redirect?"
  - "How would you report which source allowed each URL so the policy can be tightened?"
  - "How would you support thousands of URLs efficiently, for example by indexing sources by host suffix?"
common_errors:
  - "Matching '*.example.com' with endsWith('example.com'), which lets badexample.com and the apex through."
  - "Using the source scheme's default port instead of the URL scheme's after an http-to-https upgrade."
  - "Forgetting to strip the query or fragment before path comparison."
  - "Treating every path as a prefix, so '/widget.js' also matches '/widget.js/x'."
  - "Comparing hosts case-sensitively."
