    - {name: page_origin, type: "string"}
    - {name: urls, type: "string[]"}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    def csp_allows(sources: list[str], page_origin: str, urls: list[str]) -> list[bool]:
        default_port = {"http": 80, "https": 443}

        def split_url(url: str):
            scheme, rest = url.split("://", 1)
            scheme = scheme.lower()
            end = len(rest)
            for stop in "/?#":
                k = rest.find(stop)
                if k != -1:
                    end = min(end, k)
            authority, tail = rest[:end], rest[end:]
            for stop in "?#":
                k = tail.find(stop)
                if k != -1:
                    tail = tail[:k]
            path = tail or "/"
            if ":" in authority:
                host, port = authority.split(":", 1)
                port_num = int(port)
            else:
                host, port_num = authority, default_port[scheme]
            return scheme, host.lower(), port_num, path

        page_scheme, page_host, page_port, _ = split_url(page_origin)

        def scheme_ok(source_scheme: str, url_scheme: str) -> bool:
            return url_scheme == source_scheme or (source_scheme == "http" and url_scheme == "https")

        def matches(source: str, url) -> bool:
            scheme, host, port, path = url
            if source == "'none'":
                return False
            if source == "'self'":
                return (scheme, host, port) == (page_scheme, page_host, page_port)
            if "://" not in source and source.endswith(":") and source.count(":") == 1:
                return scheme_ok(source[:-1].lower(), scheme)
            if "://" in source:
                src_scheme, rest = source.split("://", 1)
                src_scheme = src_scheme.lower()
            else:
                src_scheme, rest = page_scheme, source
            slash = rest.find("/")
            authority, src_path = (rest, "") if slash == -1 else (rest[:slash], rest[slash:])
            if ":" in authority:
                src_host, src_port = authority.split(":", 1)
            else:
                src_host, src_port = authority, ""
            src_host = src_host.lower()
            if not scheme_ok(src_scheme, scheme):
                return False
            if src_host.startswith("*."):
                if not host.endswith(src_host[1:]):
                    return False
            elif host != src_host:
                return False
            if src_port == "*":
                pass
            elif src_port:
                if int(src_port) != port:
                    return False
            elif port != default_port[scheme]:
                return False
            if src_path:
                if src_path.endswith("/"):
                    return path.startswith(src_path)
                return path == src_path
            return True

        result = []
        for raw in urls:
            url = split_url(raw)
            result.append(any(matches(source, url) for source in sources))
        return result
  javascript: |
    function cspAllows(sources, pageOrigin, urls) {
      const defaultPort = { http: 80, https: 443 };
      const splitUrl = (url) => {
        const sep = url.indexOf('://');
        const scheme = url.slice(0, sep).toLowerCase();
        const rest = url.slice(sep + 3);
        let end = rest.length;
        for (const stop of ['/', '?', '#']) {
          const k = rest.indexOf(stop);
          if (k !== -1 && k < end) end = k;
        }
        const authority = rest.slice(0, end);
        let tail = rest.slice(end);
        for (const stop of ['?', '#']) {
          const k = tail.indexOf(stop);
          if (k !== -1) tail = tail.slice(0, k);
        }
        const path = tail || '/';
        const colon = authority.indexOf(':');
        const host = (colon === -1 ? authority : authority.slice(0, colon)).toLowerCase();
        const port = colon === -1 ? defaultPort[scheme] : Number(authority.slice(colon + 1));
        return { scheme, host, port, path };
      };
      const page = splitUrl(pageOrigin);
      const schemeOk = (src, urlScheme) => urlScheme === src || (src === 'http' && urlScheme === 'https');
      const matches = (source, u) => {
        if (source === "'none'") return false;
        if (source === "'self'") {
          return u.scheme === page.scheme && u.host === page.host && u.port === page.port;
        }
        const hasSep = source.includes('://');
        if (!hasSep && source.endsWith(':') && source.indexOf(':') === source.length - 1) {
          return schemeOk(source.slice(0, -1).toLowerCase(), u.scheme);
        }
        let srcScheme = page.scheme;
        let rest = source;
        if (hasSep) {
          const sep = source.indexOf('://');
          srcScheme = source.slice(0, sep).toLowerCase();
          rest = source.slice(sep + 3);
        }
        const slash = rest.indexOf('/');
        const authority = slash === -1 ? rest : rest.slice(0, slash);
        const srcPath = slash === -1 ? '' : rest.slice(slash);
        const colon = authority.indexOf(':');
        const srcHost = (colon === -1 ? authority : authority.slice(0, colon)).toLowerCase();
        const srcPort = colon === -1 ? '' : authority.slice(colon + 1);
        if (!schemeOk(srcScheme, u.scheme)) return false;
        if (srcHost.startsWith('*.')) {
          if (!u.host.endsWith(srcHost.slice(1))) return false;
        } else if (u.host !== srcHost) {
          return false;
        }
        if (srcPort === '*') {
          // any port
        } else if (srcPort !== '') {
          if (Number(srcPort) !== u.port) return false;
        } else if (u.port !== defaultPort[u.scheme]) {
          return false;
        }
        if (srcPath) return srcPath.endsWith('/') ? u.path.startsWith(srcPath) : u.path === srcPath;
        return true;
      };
      return urls.map((raw) => {
        const u = splitUrl(raw);
        return sources.some((s) => matches(s, u));
      });
    }
