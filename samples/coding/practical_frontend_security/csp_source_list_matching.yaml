time_limit_minutes: 25
prompt_markdown: |
  ## Content Security Policy Source Matching

  The front-end platform team is rolling out a `script-src` policy and wants a pre-deployment check:
  given the policy's source list, the origin of the page and the script URLs the page loads, report
  which scripts the policy would allow. Implement a simplified matcher with exactly the rules below.

  **Origins and URLs.** `page_origin` is `scheme://host` or `scheme://host:port`. Each URL is
  `scheme://host[:port][path][?query][#fragment]`. Schemes are `http` or `https`. The **effective
  port** is the explicit port, otherwise `80` for `http` and `443` for `https`. A URL's path is the
  part from the first `/` after the host up to `?` or `#`; a URL without a path has path `/`. Query
  and fragment are ignored. Schemes and hosts compare **case-insensitively**; paths compare
  case-sensitively.

  **Sources.** Each entry of `sources` is one of:

  1. `'none'` (with the quotes): matches no URL. Other entries in the list are still evaluated.
  2. `'self'` (with the quotes): the URL has the page's scheme, host and effective port.
  3. A **scheme source** such as `https:` (a scheme followed by `:` and nothing else): `https:`
     matches every `https` URL; `http:` matches every `http` **and** `https` URL.
  4. A **host source** `[scheme://]host[:port][path]`. A URL matches when all four parts match:
     - **Scheme:** the source scheme, or the page's scheme when the source has none. If that scheme is
       `http`, both `http` and `https` URLs match; if it is `https`, only `https` URLs match.
     - **Host:** `*.example.com` matches any host that ends with `.example.com` (one or more extra
       labels, but **not** `example.com` itself); any other host must be equal.
     - **Port:** `*` matches any port; an explicit port must equal the URL's effective port; with no
       port, the URL's effective port must be the **default port of the URL's own scheme**.
     - **Path:** no path matches everything; a path ending in `/` matches every URL path that starts
       with it; any other path must equal the URL path exactly.

  Return one boolean per URL, in order: `true` when at least one source matches it.

  ### Example 1
  ```
  Input:  sources = ["'self'", "https://cdn.example.net/libs/", "*.analytics.example.com"],
          page_origin = "https://shop.example.com",
          urls = ["https://shop.example.com/app.js", "https://cdn.example.net/libs/chart.js", "https://cdn.example.net/other.js", "https://eu.analytics.example.com/t.js", "https://analytics.example.com/t.js"]
  Output: [true, true, false, true, false]
  Explanation: The page's own script matches 'self'; chart.js is under the /libs/ prefix; other.js is not;
  eu.analytics.example.com is a subdomain but the apex analytics.example.com is not.
  ```

  ### Example 2
  ```
  Input:  sources = ["https:", "http://legacy.example.com:8080/widget.js"],
          page_origin = "http://intranet.example.com:8080",
          urls = ["http://intranet.example.com:8080/a.js", "https://intranet.example.com/a.js", "https://legacy.example.com:8080/widget.js?v=3", "http://legacy.example.com:8080/widget.js/x"]
  Output: [false, true, true, false]
  Explanation: https: allows the second URL. The legacy source has scheme http, so the https URL on port
  8080 matches (the query is ignored); /widget.js/x is not the exact path. The first URL is
  http, which "https:" does not allow.
  ```

  ### Example 3
  ```
  Input:  sources = ["'none'"],
          page_origin = "https://admin.example.com",
          urls = ["https://admin.example.com/main.js"]
  Output: [false]
  ```

  ### Constraints
  - `1 <= sources.length <= 20`, `1 <= urls.length <= 200`
  - Every source, origin and URL is well formed as described: no whitespace, no user info, ports are
    decimal numbers from 1 to 65535, hosts are DNS names made of letters, digits, `-` and `.`
  - Keywords `'none'` and `'self'` are lowercase; no other quoted keywords appear
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: csp_allows
  params:
