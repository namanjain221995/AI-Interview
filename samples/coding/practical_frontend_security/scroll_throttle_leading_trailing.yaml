reference_solutions:
  python: |
    def throttle_fire_times(timestamps: list[int], interval_ms: int) -> list[int]:
        fires: list[int] = []
        window_end = None  # None while idle
        pending = False

        def run_timers(until: int | None) -> None:
            # Process window ends that are due at or before `until` (all of them when until is None).
            nonlocal window_end, pending
            while window_end is not None and (until is None or window_end <= until):
                if pending:
                    fires.append(window_end)  # trailing call opens a new window
                    pending = False
                    window_end += interval_ms
                else:
                    window_end = None  # quiet window: back to idle

        for t in timestamps:
            run_timers(t)
            if window_end is None:
                fires.append(t)  # leading call
                window_end = t + interval_ms
            else:
                pending = True
        run_timers(None)
        return fires
  javascript: |
    function throttleFireTimes(timestamps, intervalMs) {
      const fires = [];
      let windowEnd = null; // null while idle
      let pending = false;

      // Process window ends due at or before `until` (all of them when until is null).
      const runTimers = (until) => {
        while (windowEnd !== null && (until === null || windowEnd <= until)) {
          if (pending) {
            fires.push(windowEnd); // trailing call opens a new window
            pending = false;
            windowEnd += intervalMs;
          } else {
            windowEnd = null; // quiet window: back to idle
          }
        }
      };

      for (const t of timestamps) {
        runTimers(t);
        if (windowEnd === null) {
          fires.push(t); // leading call
          windowEnd = t + intervalMs;
        } else {
          pending = true;
        }
      }
      runTimers(null);
      return fires;
    }
