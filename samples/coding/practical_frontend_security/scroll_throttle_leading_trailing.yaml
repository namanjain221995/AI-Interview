prompt_markdown: |
  ## Scroll Handler Throttle (Leading and Trailing)

  A product listing page lazily loads images while the user scrolls. Running the loader on every scroll
  event makes the page stutter, so the handler is **throttled**: it runs at most once per
  `interval_ms`, but it always runs right away when scrolling starts and once more after scrolling
  stops, so the final position is never missed.

  Given the scroll event times `timestamps` (milliseconds, non-decreasing) and `interval_ms`, simulate
  the throttle and return every time at which the handler **fires**, in ascending order.

  The throttle is either **idle** or inside a **window** `[f, f + interval_ms)` that was opened by a
  call at time `f`:

  - An event that arrives while the throttle is **idle** fires immediately at its own time (the
    *leading* call) and opens the window `[t, t + interval_ms)`.
  - An event that arrives **inside** a window is suppressed but marks a *trailing* call as pending.
    Several suppressed events still produce only one pending call.
  - When a window ends at time `e = f + interval_ms`: if a call is pending, it fires at `e`, the
    pending mark is cleared and a new window `[e, e + interval_ms)` opens. If nothing is pending, the
    throttle becomes idle.
  - When a window ends at exactly the same time as an event arrives, the window end is processed
    **first**, then the event.
  - After the last event, windows keep ending as described until the throttle is idle.

  ### Example 1
  ```
  Input:  timestamps = [0, 30, 60, 90, 120, 300], interval_ms = 100
  Output: [0, 100, 200, 300]
  Explanation: 0 fires (leading). 30-90 are suppressed, so a trailing call fires at 100 and
  opens [100, 200). 120 is suppressed, so 200 fires and opens [200, 300). The window ending
  at 300 is processed before the event at 300; nothing is pending, so the handler is idle
  and 300 fires immediately.
  ```

  ### Example 2
  ```
  Input:  timestamps = [10, 10, 60, 260], interval_ms = 50
  Output: [10, 60, 110, 260]
  Explanation: 10 fires and the second 10 makes a call pending. At 60 the window end is
  processed first: the pending call fires at 60 and opens [60, 110), so the event at 60 is
  suppressed into that window and fires as a trailing call at 110. The window [110, 160)
  ends quietly, and 260 fires as a new leading call.
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= timestamps[i] <= 10^9` and `timestamps` is non-decreasing
  - `1 <= interval_ms <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
