expected_concepts:
  - discrete-event simulation with a small state machine
  - processing due timers before events at the same timestamp
  - leading and trailing edge semantics of throttling
  - draining remaining timers after the input ends
optimal_complexity: {time: O(n), space: O(1) besides the output}
rubric:
  excellent: Models the throttle as idle or windowed with a pending flag, processes every window end due at or before each event (including chains of trailing calls), drains timers at the end, explains the tie rule and contrasts throttle with debounce.
  good: Correct simulation after a hint about the same-time tie rule or about the final trailing call after the last event.
  weak: Only fires leading calls, fires a trailing call for every suppressed event, measures windows from event times instead of fire times, or forgets the trailing call after the last event.
  criteria:
    correctness: All tests pass, including events exactly on window boundaries and continuous scrolling.
    efficiency: Linear in the number of events; each window end is processed once.
    code_quality: Clear state variables (window end, pending flag) and a single helper that advances timers.
    edge_cases: No events, one event, duplicate timestamps, interval of 1, large timestamps.
    communication: Walks through an example timeline and states the order of timer and event at the same instant.
hints:
  - Think of the throttle as a tiny state machine - it is either idle or inside a window that will end at a known time, possibly with a call pending.
  - Before handling each event, first process every window end that is due at or before the event time; a pending call fires at the window end and immediately opens the next window from that time.
  - Keep window_end (or none when idle) and a pending flag; for each event, loop while window_end <= t (fire and extend if pending, otherwise go idle), then either fire now and set window_end = t + interval or set pending; after the input, run the same loop without a time limit.
followups:
  - How would you implement this throttle in the browser with setTimeout and what clock would you use?
  - How does a debounce differ, and when would you prefer it for a search box?
  - How could requestAnimationFrame replace a fixed interval for scroll work?
common_errors:
  - Treating an event that lands exactly on the window end as suppressed in the old window.
  - Opening the next window from the last event time instead of from the trailing fire time.
  - Forgetting the trailing call that fires after the last event.
  - Firing one trailing call per suppressed event instead of one per window.
