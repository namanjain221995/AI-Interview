version: 1
slug: password_history_similarity
title: "Reject Passwords Too Similar to History"
difficulty: medium
competency_keys: [algorithms, problem_solving]
role_tags: [security, backend, fullstack]
time_limit_minutes: 25
prompt_markdown: |
  ## Reject Passwords Too Similar to History

  The account service refuses a new password when it is only a small edit of one of the user's recent
  passwords (for example `Summer-2024` followed by `summer-2025`). To keep the exercise focused, the
  recent passwords are given as plain strings (the follow-up discusses how a real system avoids
  that). Find the offending history entry.

  - `previous` is ordered **newest first**: `previous[0]` is the password in use right now.
  - Compare **case-insensitively**: lowercase both strings (they are ASCII) before comparing.
  - The distance between two strings is the **edit distance**: the minimum number of single-character
    insertions, deletions and substitutions that turn one into the other.

  Return the **smallest index** `i` such that the distance between `new_password` and `previous[i]`
  is at most `max_distance`, or `-1` if no entry is that close (including when `previous` is empty).

  Many history entries can be ruled out cheaply: two strings whose lengths differ by more than
  `max_distance` can never be within `max_distance` of each other.

  ### Example 1
  ```
  Input:  new_password = "Summer-2025",
          previous = ["Autumn#88", "summer-2024", "Summer-2025"],
          max_distance = 1
  Output: 1
  Explanation: "autumn#88" is far away; "summer-2024" needs one substitution (4 -> 5), so index 1 is
  returned even though index 2 is an exact match.
  ```

  ### Example 2
  ```
  Input:  new_password = "harbor-lights",
          previous = ["Harbour-Lights", "harbor-light"],
          max_distance = 0
  Output: -1
  Explanation: "harbour-lights" needs one deletion and "harbor-light" one insertion, but max_distance is 0.
  ```

  ### Example 3
  ```
  Input:  new_password = "k3y-r1ng", previous = ["keyring", "k3y-r1ng-old"], max_distance = 2
  Output: -1
  ```

  ### Constraints
  - `1 <= new_password.length <= 64`
  - `0 <= previous.length <= 50` and `1 <= previous[i].length <= 64`
  - `0 <= max_distance <= 64`
  - All strings contain printable ASCII characters only
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: find_similar_password
  params:
    - {name: new_password, type: "string"}
    - {name: previous, type: "string[]"}
    - {name: max_distance, type: "int"}
  return_type: "int"
  comparison: exact
reference_solutions:
  python: |
    def find_similar_password(new_password: str, previous: list[str], max_distance: int) -> int:
        target = new_password.lower()

        def within(other: str) -> bool:
            if abs(len(other) - len(target)) > max_distance:
                return False
            prev_row = list(range(len(other) + 1))
            for i in range(1, len(target) + 1):
                row = [i] + [0] * len(other)
                for j in range(1, len(other) + 1):
                    cost = 0 if target[i - 1] == other[j - 1] else 1
                    row[j] = min(prev_row[j] + 1, row[j - 1] + 1, prev_row[j - 1] + cost)
                if min(row) > max_distance:
                    return False  # every alignment already costs too much
                prev_row = row
            return prev_row[-1] <= max_distance

        for index, old in enumerate(previous):
            if within(old.lower()):
                return index
        return -1
  javascript: |
    function findSimilarPassword(newPassword, previous, maxDistance) {
      const target = newPassword.toLowerCase();
      const within = (other) => {
        if (Math.abs(other.length - target.length) > maxDistance) return false;
        let prev = Array.from({ length: other.length + 1 }, (_, j) => j);
        for (let i = 1; i <= target.length; i++) {
          const row = new Array(other.length + 1).fill(0);
          row[0] = i;
          let rowMin = row[0];
          for (let j = 1; j <= other.length; j++) {
            const cost = target[i - 1] === other[j - 1] ? 0 : 1;
            row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + cost);
            if (row[j] < rowMin) rowMin = row[j];
          }
          if (rowMin > maxDistance) return false;
          prev = row;
        }
        return prev[other.length] <= maxDistance;
      };
      for (let k = 0; k < previous.length; k++) {
        if (within(previous[k].toLowerCase())) return k;
      }
      return -1;
    }
tests:
  - {id: t1, args: ["Summer-2025", ["Autumn#88", "summer-2024", "Summer-2025"], 1], expected: 1, description: "Example 1 - case-insensitive one-substitution match beats a later exact match"}
  - {id: t2, args: ["harbor-lights", ["Harbour-Lights", "harbor-light"], 0], expected: -1, description: "Example 2 - distance 0 means an exact case-insensitive match only"}
  - {id: t3, args: ["k3y-r1ng", ["keyring", "k3y-r1ng-old"], 2], expected: -1, description: "Example 3 - closest entries are still too far, -1"}
  - {id: t4, hidden: true, args: ["anything", [], 5], expected: -1, description: "Empty history - -1"}
  - {id: t5, hidden: true, args: ["a", ["b"], 1], expected: 0, description: "Minimum lengths with one substitution"}
  - {id: t6, hidden: true, args: ["abc", ["ABCDEF", "xyz", "AbC"], 2], expected: 2, description: "Length difference 3 is skipped before the exact case-insensitive match"}
  - {id: t7, hidden: true, args: ["deploy-key-7", ["deploykey7", "deploy_key_7", "DEPLOY-KEY-7"], 2], expected: 0, description: "Two deletions qualify at index 0 even though later entries are closer"}
  - {id: t8, hidden: true, args: ["abcdef", ["badcfe", "fedcba"], 3], expected: -1, description: "Three adjacent swaps give distance 4 and a reversal 6 - both exceed 3, -1"}
  - {id: t9, hidden: true, args: ["Password1", ["password1", "PASSWORD1"], 0], expected: 0, description: "Duplicates and case variants - newest wins"}
  - {id: t10, hidden: true, args: ["q", ["qwertyuiop", "w", "qq"], 64], expected: 0, description: "Very large max_distance matches the newest entry"}
  - {id: t11, hidden: true, args: ["XX-Rotation-07-Blue-x", ["Rotation-00-Blue!", "Rotation-01-Blue!", "Rotation-02-Blue!", "Rotation-03-Blue!", "Rotation-04-Blue!", "Rotation-05-Blue!", "Rotation-06-Blue!", "Rotation-07-Blue!", "Rotation-08-Blue!", "Rotation-09-Blue!", "Rotation-10-Blue!", "Rotation-11-Blue!", "Rotation-12-Blue!", "Rotation-13-Blue!", "Rotation-14-Blue!", "Rotation-15-Blue!", "Rotation-16-Blue!", "Rotation-17-Blue!", "Rotation-18-Blue!", "Rotation-19-Blue!", "Rotation-20-Blue!", "Rotation-21-Blue!", "Rotation-22-Blue!", "Rotation-23-Blue!", "Rotation-24-Blue!", "Rotation-25-Blue!", "Rotation-26-Blue!", "Rotation-27-Blue!", "Rotation-28-Blue!", "Rotation-29-Blue!", "Rotation-30-Blue!", "Rotation-31-Blue!", "Rotation-32-Blue!", "Rotation-33-Blue!", "Rotation-34-Blue!", "Rotation-35-Blue!", "Rotation-36-Blue!", "Rotation-37-Blue!", "Rotation-38-Blue!", "Rotation-39-Blue!", "Rotation-40-Blue!", "Rotation-41-Blue!", "Rotation-42-Blue!", "Rotation-43-Blue!", "Rotation-44-Blue!", "Rotation-45-Blue!", "Rotation-46-Blue!", "Rotation-47-Blue!", "Rotation-48-Blue!", "xX-rotation-07-blue-Xx"], 4], expected: 49, description: "Stress - 50 history entries, only the oldest is within 4 after lowercasing (the index-7 entry needs 5)"}
expected_concepts:
  - "edit distance dynamic programming"
  - "rolling two-row DP for O(m) memory"
  - "length-difference pruning"
  - "early exit when a whole DP row exceeds the threshold"
  - "case normalisation before comparison"
  - "returning the first qualifying index in order"
optimal_complexity: {time: "O(k * L^2) with L <= 64, or O(k * L * d) with a banded DP", space: "O(L)"}
rubric:
  excellent: "Implements the edit-distance DP correctly with two rows, lowercases both sides, prunes by length difference, adds an early exit or a diagonal band of width 2d+1, scans history newest first and explains why plain-text password history is only acceptable inside a protected comparison."
  good: "Correct full DP per history entry and the right return index, with the pruning added after a hint."
  weak: "Uses a character-count or Hamming comparison instead of edit distance, forgets case folding, or returns the closest entry instead of the first one within the threshold."
  criteria:
    correctness: "All tests pass, including distance 0, empty history and length-based skips."
    efficiency: "O(L^2) per entry at most with O(L) memory; recognises the length filter and banding as cheap wins."
    code_quality: "A separate distance (or within-threshold) helper, clear names and no duplicated lowercasing."
    edge_cases: "Empty history, single characters, duplicates, swaps that cost two edits and very large max_distance."
    communication: "Discusses the security trade-off of storing comparable password history versus only hashes."
hints:
  - "This is a question about how many single-character edits separate two strings; there is a classic way to compute that for every pair of prefixes."
  - "Build a table where cell (i, j) is the edit distance between the first i characters of one string and the first j of the other; each cell depends on its left, upper and upper-left neighbours. Check entries in order and stop at the first that qualifies."
  - "Lowercase both strings, skip an entry when the length difference exceeds max_distance, fill the table row by row keeping only the previous row, stop early if every value in a row is above max_distance, and return the index as soon as the last cell is within the limit."
followups:
  - "Real systems store only password hashes. How could you still catch near-copies without storing plain text?"
  - "How would you restrict the DP to a diagonal band of width 2 * max_distance + 1, and what does that save?"
  - "Should a transposition of two adjacent characters count as one edit? How would the recurrence change?"
  - "What other checks (breached-password lists, minimum length) belong in the same endpoint?"
common_errors:
  - "Forgetting to lowercase one of the two strings."
  - "Returning the index of the closest entry rather than the newest qualifying entry."
  - "Initialising the first row or column of the DP incorrectly."
  - "Comparing characters position by position, which misses insertions and deletions."
  - "Allocating a full table per entry without noticing that two rows are enough."
