expected_concepts:
  - splitting parsing into small validators per format (hex, functional, named)
  - strict whole-string matching instead of partial matches
  - range checking without clamping
  - exact integer rounding for percentages
  - consistent lowercase hex formatting with zero padding
optimal_complexity: {time: O(total length of all values), space: O(longest value)}
rubric:
  excellent: Structures the parser as small per-format helpers, matches each format against the whole string, rejects out-of-range and mixed channels instead of clamping, uses integer arithmetic for percentages and walks through tricky inputs (1., .5, rgb with four arguments) before running tests.
  good: Handles hex, functional and named colours correctly with one or two misses on malformed input (for example accepting 1. or a space before the parenthesis) that are fixed after a hint.
  weak: Uses loose substring checks or parseInt-style prefix parsing that accepts trailing junk, clamps out-of-range values, or forgets to expand short hex forms and add the default alpha.
  criteria:
    correctness: All tests pass, including every malformed form returning invalid and the exact rounding of percentages and decimal alpha.
    efficiency: One linear pass per value; no repeated re-parsing.
    code_quality: Separate helpers for hex, channel, percentage and alpha parsing with shared conversion code; no duplicated formatting logic.
    edge_cases: Empty strings, padding spaces, short hex forms, 0%/100%, alpha 1.0 and .5, huge integers, wrong argument counts.
    communication: States the accepted grammar explicitly and explains why invalid input is rejected rather than clamped.
hints:
  - Decide first which of the three families a trimmed value belongs to (it starts with #, it looks like a function call, or it is a bare word), and validate each family on its own.
  - Many bugs come from accepting a valid prefix followed by junk. Check that the entire value matches the format, and convert numbers only after their text has been validated (digits only for channels, digits plus % for percentages).
  - For functional values strip the name and parentheses, split the inside on commas, trim spaces from each part, check the argument count for rgb versus rgba, require the three channels to be all integers or all percentages, convert with integer rounding, then format the four bytes as two lowercase hex digits each.
followups:
  - How would you extend the parser to the space-separated CSS Color 4 syntax such as rgb(255 0 0 / 50%)?
  - Should the importer report why a value is invalid, and how would you shape that error?
  - How would you add hsl() support while keeping a single output format?
common_errors:
  - Using parseInt or parseFloat on unvalidated text, which accepts 12px, 1e0 or trailing junk.
  - Clamping 256 to 255 or 101% to 100% instead of rejecting the value.
  - Forgetting to double the digits of #rgb and #rgba, or forgetting the default ff alpha.
  - Computing p * 2.55 in floating point and rounding 50% down to 127.
  - Accepting four arguments in rgb() or three in rgba().
