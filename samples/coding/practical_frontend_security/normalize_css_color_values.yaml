slug: normalize_css_color_values
title: Normalise CSS Colour Values
difficulty: medium
competency_keys: [problem_solving, code_quality]
role_tags: [frontend, fullstack, ux_designer]
time_limit_minutes: 20
prompt_markdown: |
  ## Normalise CSS Colour Values

  The design team exports themes from several tools, and every tool writes colours differently. Before a
  theme is stored, the importer converts each colour to one canonical form: a lowercase
  **`#rrggbbaa`** string (red, green, blue and alpha as two hex digits each). Anything it cannot read
  exactly becomes the string **`"invalid"`**, so a bad theme is rejected instead of silently drifting.

  Given a list of colour strings, return the normalised value for each one, in the same order.

  First remove leading and trailing **space characters** from the value. Then it must be exactly one of:

  1. **Hex** - `#` followed by 3, 4, 6 or 8 hex digits (`0-9`, `a-f`, any case). In the 3- and 4-digit
     forms every digit is doubled (`#f0a` means `#ff00aa`). Without an alpha part the alpha is `ff`.
  2. **Functional** - `rgb(r, g, b)` or `rgba(r, g, b, a)`. The function name is case-insensitive and is
     followed directly by `(`; spaces are allowed anywhere around the arguments and commas. `rgb` takes
     exactly three arguments and `rgba` exactly four.
     - The three colour channels are either **all integers** `0`-`255` (digits only, leading zeros
       allowed) or **all percentages** `0%`-`100%` (digits followed by `%`). A percentage `p` becomes
       `floor((p * 255 + 50) / 100)`, i.e. `p * 2.55` rounded with halves going up. Mixing integers and
       percentages is invalid.
     - The alpha is either a percentage `0%`-`100%` (converted exactly like a channel) or a decimal number
       from `0` to `1`: digits with an optional decimal point that must be followed by at least one digit,
       where the integer part may be omitted (`1`, `0.5`, `.75` are fine; `1.` and `.` are not). A decimal
       alpha `a` becomes `floor(a * 255 + 0.5)`.
  3. **Named** - `black`, `white`, `red`, `green` (`#008000`), `blue` or `transparent` (`#00000000`),
     case-insensitive. The other named colours have alpha `ff`.

  Values out of range are **invalid** (never clamp). No signs (`+`, `-`), exponents or other whitespace
  characters are accepted. Output hex digits are lowercase.

  ### Example 1
  ```
  Input:  values = ["#1A2b3C", "#F0A", "Green"]
  Output: ["#1a2b3cff", "#ff00aaff", "#008000ff"]
  ```

  ### Example 2
  ```
  Input:  values = ["rgb(255, 128, 0)", "rgba( 100%, 50%, 0% , 0.25 )", "rgba(0, 0, 0, 40%)"]
  Output: ["#ff8000ff", "#ff800040", "#00000066"]
  Explanation: 50% -> floor((50 * 255 + 50) / 100) = 128 = 0x80; alpha 0.25 -> floor(63.75 + 0.5) = 64 = 0x40;
  alpha 40% -> 102 = 0x66.
  ```

  ### Example 3
  ```
  Input:  values = ["rgb(256, 0, 0)", "#12345", "rgb(10%, 20, 30)", "teal"]
  Output: ["invalid", "invalid", "invalid", "invalid"]
  Explanation: 256 is out of range, five hex digits is not a valid length, the channels mix a percentage
  with integers, and teal is not one of the supported names.
  ```

  ### Constraints
  - `0 <= values.length <= 50`
  - Each value has `0` to `40` printable ASCII characters.
languages: [python, javascript, typescript, java, go, cpp]
