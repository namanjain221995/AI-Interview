reference_solutions:
  python: |
    import math
    import re

    NAMED = {
        "black": "#000000ff",
        "white": "#ffffffff",
        "red": "#ff0000ff",
        "green": "#008000ff",
        "blue": "#0000ffff",
        "transparent": "#00000000",
    }
    HEX_DIGITS = set("0123456789abcdef")


    def _percent(text: str) -> int | None:
        if not re.fullmatch(r"[0-9]+%", text):
            return None
        p = int(text[:-1])
        return (p * 255 + 50) // 100 if p <= 100 else None


    def _normalize(raw: str) -> str:
        s = raw.strip(" ").lower()
        if s in NAMED:
            return NAMED[s]
        if s.startswith("#"):
            digits = s[1:]
            if len(digits) not in (3, 4, 6, 8) or not set(digits) <= HEX_DIGITS:
                return "invalid"
            if len(digits) <= 4:
                digits = "".join(c * 2 for c in digits)
            return "#" + (digits + "ff" if len(digits) == 6 else digits)
        m = re.fullmatch(r"(rgba?)\((.*)\)", s)
        if not m:
            return "invalid"
        parts = [p.strip(" ") for p in m.group(2).split(",")]
        if len(parts) != (4 if m.group(1) == "rgba" else 3):
            return "invalid"
        channels = parts[:3]
        if all(re.fullmatch(r"[0-9]+", p) for p in channels):
            values = [int(p) for p in channels]
            if any(v > 255 for v in values):
                return "invalid"
        elif all(p.endswith("%") for p in channels):
            values = [_percent(p) for p in channels]
            if any(v is None for v in values):
                return "invalid"
        else:
            return "invalid"
        alpha = 255
        if len(parts) == 4:
            a = parts[3]
            if a.endswith("%"):
                alpha = _percent(a)
                if alpha is None:
                    return "invalid"
            elif re.fullmatch(r"[0-9]*\.?[0-9]+", a) and float(a) <= 1:
                alpha = math.floor(float(a) * 255 + 0.5)
            else:
                return "invalid"
        return "#" + "".join(f"{v:02x}" for v in values + [alpha])


    def normalize_css_colors(values: list[str]) -> list[str]:
        return [_normalize(v) for v in values]
  javascript: |
    const NAMED = {
      black: "#000000ff",
      white: "#ffffffff",
      red: "#ff0000ff",
      green: "#008000ff",
      blue: "#0000ffff",
      transparent: "#00000000",
    };

    function percentValue(text) {
      if (!/^[0-9]+%$/.test(text)) return null;
      const p = parseInt(text.slice(0, -1), 10);
      return p <= 100 ? Math.floor((p * 255 + 50) / 100) : null;
    }

    function normalizeOne(raw) {
      const s = raw.replace(/^ +| +$/g, "").toLowerCase();
      if (Object.prototype.hasOwnProperty.call(NAMED, s)) return NAMED[s];
      if (s.startsWith("#")) {
        let digits = s.slice(1);
        if (![3, 4, 6, 8].includes(digits.length) || !/^[0-9a-f]*$/.test(digits)) return "invalid";
        if (digits.length <= 4) digits = [...digits].map((c) => c + c).join("");
        return "#" + (digits.length === 6 ? digits + "ff" : digits);
      }
      const m = /^(rgba?)\((.*)\)$/.exec(s);
      if (!m) return "invalid";
      const parts = m[2].split(",").map((p) => p.replace(/^ +| +$/g, ""));
      if (parts.length !== (m[1] === "rgba" ? 4 : 3)) return "invalid";
      const channels = parts.slice(0, 3);
      let values;
      if (channels.every((p) => /^[0-9]+$/.test(p))) {
        values = channels.map((p) => parseInt(p, 10));
        if (values.some((v) => v > 255)) return "invalid";
      } else if (channels.every((p) => p.endsWith("%"))) {
        values = channels.map(percentValue);
        if (values.some((v) => v === null)) return "invalid";
      } else {
        return "invalid";
      }
      let alpha = 255;
      if (parts.length === 4) {
        const a = parts[3];
        if (a.endsWith("%")) {
          alpha = percentValue(a);
          if (alpha === null) return "invalid";
        } else if (/^[0-9]*\.?[0-9]+$/.test(a) && parseFloat(a) <= 1) {
          alpha = Math.floor(parseFloat(a) * 255 + 0.5);
        } else {
          return "invalid";
        }
      }
      return "#" + [...values, alpha].map((v) => v.toString(16).padStart(2, "0")).join("");
    }

    function normalizeCssColors(values) {
      return values.map(normalizeOne);
    }
