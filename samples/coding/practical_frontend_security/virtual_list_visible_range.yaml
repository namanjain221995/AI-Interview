reference_solutions:
  python: |
    from bisect import bisect_left, bisect_right


    def visible_ranges(heights: list[int], scroll_offsets: list[int], viewport_height: int,
                       overscan: int) -> list[list[int]]:
        n = len(heights)
        tops = [0] * n
        bottoms = [0] * n
        y = 0
        for i, h in enumerate(heights):
            tops[i] = y
            y += h
            bottoms[i] = y
        result = []
        for s in scroll_offsets:
            end = s + viewport_height
            first = bisect_right(bottoms, s)      # first row whose bottom is below s
            last = bisect_left(tops, end) - 1     # last row whose top is above the viewport end
            if first >= n or last < 0 or first > last:
                result.append([-1, -1])
            else:
                result.append([max(0, first - overscan), min(n - 1, last + overscan)])
        return result
  javascript: |
    function visibleRanges(heights, scrollOffsets, viewportHeight, overscan) {
      const n = heights.length;
      const tops = new Array(n);
      const bottoms = new Array(n);
      let y = 0;
      for (let i = 0; i < n; i++) { tops[i] = y; y += heights[i]; bottoms[i] = y; }
      // first index with arr[idx] > x (strict) or >= x
      const lowerBound = (arr, x, strict) => {
        let lo = 0, hi = arr.length;
        while (lo < hi) {
          const mid = (lo + hi) >> 1;
          if (strict ? arr[mid] <= x : arr[mid] < x) lo = mid + 1; else hi = mid;
        }
        return lo;
      };
      return scrollOffsets.map((s) => {
        const end = s + viewportHeight;
        const first = lowerBound(bottoms, s, true);
        const last = lowerBound(tops, end, false) - 1;
        if (first >= n || last < 0 || first > last) return [-1, -1];
        return [Math.max(0, first - overscan), Math.min(n - 1, last + overscan)];
      });
    }
