expected_concepts:
  - "prefix sums of row heights"
  - "binary search for boundaries (lower and upper bound)"
  - "half-open intervals and strict overlap"
  - "clamping the overscan range"
  - "precomputation shared across many queries"
optimal_complexity: {time: "O((n + q) log n)", space: "O(n)"}
rubric:
  excellent: "Builds prefix sums once, finds the first row with bottom > s and the last row with top < s + viewport_height by binary search, handles empty intersections and clamping, reasons carefully about half-open boundaries and mentions how a real list would update offsets when row heights change."
  good: "Correct prefix sums and binary search with an off-by-one at a boundary fixed after testing, or a linear scan per query that is correct and then improved."
  weak: "Scans all rows for every offset without improving it, treats rows touching the viewport edge as visible, or forgets clamping and the no-row case."
  criteria:
    correctness: "All tests pass, including touching edges, negative offsets, offsets beyond the end and overscan clamping."
    efficiency: "O(n) precomputation and O(log n) per query."
    code_quality: "Separate prefix-sum construction and boundary search helpers with clear strict and non-strict variants."
    edge_cases: "Single row, one-pixel viewport, viewport larger than the list, duplicate offsets and huge overscan."
    communication: "Explains the half-open overlap rule with a boundary example before coding."
hints:
  - "If you knew where each row starts and ends on the page, could you find the visible rows without looking at every row for every scroll position?"
  - "Compute the top and bottom of every row once with a running sum. Both lists are sorted, so for each offset you can binary search for the first row that ends after the viewport starts and the last row that starts before it ends."
  - "first = number of rows whose bottom is <= s; last = (number of rows whose top is < s + viewport_height) - 1. If first > last or either is out of range, answer [-1, -1]; otherwise widen by overscan and clamp to [0, n - 1]."
followups:
  - "Row heights are often unknown until a row is rendered. How would you estimate them and correct the offsets later?"
  - "If one row's height changes, how would you update the prefix sums faster than O(n) (for example with a Fenwick tree)?"
  - "How would you keep the scroll position stable when new log lines are prepended above the viewport?"
  - "How would you handle a list that also virtualises columns horizontally?"
common_errors:
  - "Counting a row that only touches the viewport edge as visible."
  - "Using the wrong binary search variant (strict versus non-strict) at one of the two boundaries."
  - "Returning an invalid range instead of [-1, -1] when the viewport is above or below the list."
  - "Forgetting to clamp first - overscan and last + overscan."
  - "Recomputing prefix sums for every offset."
