prompt_markdown: |
  ## Virtualised List Visible Range

  The log viewer in the operations console can show hundreds of thousands of log lines. Rendering all
  of them freezes the browser, so the list is **virtualised**: only rows near the viewport are
  mounted. Rows have different heights because long lines wrap.

  Row `i` has height `heights[i]` pixels (always positive). Rows are stacked from the top with no gaps:
  row 0 starts at `y = 0`, and row `i` occupies the half-open interval `[top_i, top_i + heights[i])`
  where `top_i` is the sum of the heights before it.

  For each scroll offset `s` in `scroll_offsets`, the viewport shows `[s, s + viewport_height)`.
  Offsets can be negative (elastic overscroll at the top) or beyond the end of the list. A row is
  **visible** when its interval overlaps the viewport by a positive length. Let `first` and `last` be
  the smallest and largest visible row indexes. Return `[max(0, first - overscan),
  min(n - 1, last + overscan)]` (the extra `overscan` rows on each side are mounted early to avoid
  flicker while scrolling), or `[-1, -1]` when no row is visible.

  Aim for `O((n + q) log n)` time for `n` rows and `q` offsets.

  ### Example 1
  ```
  Input:  heights = [20, 40, 20, 60, 20],
          scroll_offsets = [0, 30, 65, 150],
          viewport_height = 50,
          overscan = 0
  Output: [[0, 1], [1, 2], [2, 3], [4, 4]]
  Explanation: Rows occupy [0,20), [20,60), [60,80), [80,140), [140,160). The viewport [0, 50) overlaps rows
  0-1; [30, 80) overlaps rows 1-2 (row 3 starts exactly at 80, so it is not visible);
  [65, 115) overlaps rows 2-3; [150, 200) overlaps only row 4.
  ```

  ### Example 2
  ```
  Input:  heights = [20, 40, 20, 60, 20],
          scroll_offsets = [-30, 59, 160],
          viewport_height = 30,
          overscan = 1
  Output: [[-1, -1], [0, 4], [-1, -1]]
  Explanation: [-30, 0) shows nothing. [59, 89) overlaps rows 1-3, widened to 0-4. [160, 190) is past the end.
  ```

  ### Example 3
  ```
  Input:  heights = [10, 10, 10], scroll_offsets = [-10, 30, 5], viewport_height = 10, overscan = 5
  Output: [[-1, -1], [-1, -1], [0, 2]]
  Explanation: [-10, 0) and [30, 40) only touch the list; [5, 15) shows rows 0-1, widened and clamped to 0-2.
  ```

  ### Constraints
  - `1 <= heights.length <= 10^5`, `1 <= heights[i] <= 10^4`
  - `1 <= scroll_offsets.length <= 10^5`, `-10^6 <= scroll_offsets[j] <= 10^9`
  - `1 <= viewport_height <= 10^5`, `0 <= overscan <= 10^5`
