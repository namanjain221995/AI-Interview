  - {id: t8, hidden: true, args: [["main>article~aside+footer", "* > * + *", "html body div span em strong"]], expected: [[0, 0, 4], [0, 0, 0], [0, 0, 6]], description: "Combinators without spaces; universal-only selectors; long type chain"}
