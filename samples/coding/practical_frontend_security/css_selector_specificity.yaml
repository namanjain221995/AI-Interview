expected_concepts:
  - "hand-written scanner over a small grammar"
  - "recursion for nested functional pseudo-classes"
  - "splitting arguments on top-level commas only"
  - "lexicographic comparison of triples"
  - "distinguishing pseudo-classes from pseudo-elements"
optimal_complexity: {time: "O(n * d) where d is the nesting depth of :is/:not/:has (O(n) without nesting)", space: "O(n)"}
rubric:
  excellent: "Writes a clean character scanner with one branch per part, recurses into :not/:is/:has with a depth-aware comma split, takes the lexicographic maximum, ignores :where, handles legacy pseudo-elements and explains how specificity decides which rule wins."
  good: "Correct for flat selectors and simple :not/:is, with nesting or the legacy pseudo-elements fixed after testing."
  weak: "Counts with regular expressions that break on nested parentheses, sums all arguments instead of taking the max, or counts :where and :not themselves as pseudo-classes."
  criteria:
    correctness: "All tests pass, including nested functions, :where, legacy pseudo-elements and combinators without spaces."
    efficiency: "Linear scan of each selector; recursion only re-reads argument text once per nesting level."
    code_quality: "A small scanner with helpers for names, balanced parentheses and argument splitting; the triple handled as a unit."
    edge_cases: "Universal-only selectors, attributes with hyphens, :nth-child arguments containing '+', and look-alikes such as :first-child."
    communication: "Relates specificity to real debugging: why :where is useful for low-specificity design-system defaults."
hints:
  - "Walk the selector character by character; the first character of each part (#, ., [, :, a letter) tells you what kind of part it is and where its count goes."
  - "Pseudo-classes may have a parenthesised argument; find the matching closing parenthesis by counting depth. For :not, :is and :has, the argument is itself a list of selectors, so the same function can compute each one."
  - "Split the argument on commas that are not inside nested parentheses, compute each argument's triple recursively and add the largest one (compare a, then b, then c). Skip :where entirely, count :before/:after/:first-line/:first-letter and '::' names as c, and every other ':' name as b."
followups:
  - "How would you extend this to :nth-child(2n+1 of .item), which adds the specificity of its selector list?"
  - "Given two rules matching the same element, how do specificity, source order, !important and cascade layers interact?"
  - "How would you report the location of the most specific part to help a developer simplify the selector?"
  - "Why do design systems often wrap their default styles in :where()?"
common_errors:
  - "Summing every argument of :is or :not instead of taking the most specific one."
  - "Counting :not, :is or :has itself as an extra pseudo-class."
  - "Splitting arguments on every comma, including commas inside nested parentheses."
  - "Counting the '+' in :nth-child(2n+1) as a combinator or a part."
  - "Treating :first-child like the legacy :first-line pseudo-element."
