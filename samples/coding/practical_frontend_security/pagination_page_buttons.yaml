version: 1
slug: pagination_page_buttons
title: Pagination Button Strip
difficulty: easy
competency_keys: [problem_solving, code_quality]
role_tags: [frontend, fullstack, mobile]
time_limit_minutes: 12
prompt_markdown: |
  ## Pagination Button Strip

  The orders table of an admin console can span thousands of pages, so its pagination bar shows a
  compact strip of buttons instead of one button per page. Write the function that decides which labels
  the strip shows.

  Given the current page `current` (1-based), the number of pages `total_pages` and the number of
  `siblings` to show on each side of the current page:

  - The **shown pages** are page `1`, page `total_pages` and every page from `current - siblings` to
    `current + siblings`, ignoring pages outside `1..total_pages`. Each page is shown once, in ascending
    order.
  - Between two consecutive shown pages, the pages in between are hidden. If exactly **one** page is
    hidden there, show that page number as well (an ellipsis would take the same space). If **two or
    more** pages are hidden, show a single `"..."` instead.

  Return the labels of the strip, from left to right, as strings.

  ### Example 1
  ```
  Input:  current = 5, total_pages = 10, siblings = 1
  Output: ["1", "...", "4", "5", "6", "...", "10"]
  ```

  ### Example 2
  ```
  Input:  current = 3, total_pages = 7, siblings = 1
  Output: ["1", "2", "3", "4", "...", "7"]
  Explanation: shown pages are 1, 2, 3, 4 and 7; pages 5 and 6 are hidden behind one ellipsis.
  ```

  ### Example 3
  ```
  Input:  current = 1, total_pages = 1, siblings = 2
  Output: ["1"]
  ```

  ### Constraints
  - `1 <= total_pages <= 10^9`
  - `1 <= current <= total_pages`
  - `0 <= siblings <= 10`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: page_buttons
  params:
    - {name: current, type: int}
    - {name: total_pages, type: int}
    - {name: siblings, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def page_buttons(current: int, total_pages: int, siblings: int) -> list[str]:
        low = max(1, current - siblings)
        high = min(total_pages, current + siblings)
        shown = sorted({1, total_pages, *range(low, high + 1)})
        labels: list[str] = []
        previous = None
        for page in shown:
            if previous is not None:
                hidden = page - previous - 1
                if hidden == 1:
                    labels.append(str(previous + 1))
                elif hidden >= 2:
                    labels.append("...")
            labels.append(str(page))
            previous = page
        return labels
  javascript: |
    function pageButtons(current, totalPages, siblings) {
      const low = Math.max(1, current - siblings);
      const high = Math.min(totalPages, current + siblings);
      const set = new Set([1, totalPages]);
      for (let p = low; p <= high; p++) set.add(p);
      const shown = [...set].sort((a, b) => a - b);
      const labels = [];
      let previous = null;
      for (const page of shown) {
        if (previous !== null) {
          const hidden = page - previous - 1;
          if (hidden === 1) labels.push(String(previous + 1));
          else if (hidden >= 2) labels.push("...");
        }
        labels.push(String(page));
        previous = page;
      }
      return labels;
    }
tests:
  - {id: t1, args: [5, 10, 1], expected: ["1", "...", "4", "5", "6", "...", "10"], description: "Example 1 - gaps on both sides"}
  - {id: t2, args: [3, 7, 1], expected: ["1", "2", "3", "4", "...", "7"], description: "Example 2 - gap of one page on the left is filled, right gap collapses"}
  - {id: t3, args: [1, 1, 2], expected: ["1"], description: "Example 3 - single page"}
  - {id: t4, hidden: true, args: [1, 10, 1], expected: ["1", "2", "...", "10"], description: "Current is the first page"}
  - {id: t5, hidden: true, args: [10, 10, 1], expected: ["1", "...", "9", "10"], description: "Current is the last page"}
  - {id: t6, hidden: true, args: [4, 10, 1], expected: ["1", "2", "3", "4", "5", "...", "10"], description: "Hidden gap of exactly one page between 1 and 3 shown as 2"}
  - {id: t7, hidden: true, args: [6, 12, 0], expected: ["1", "...", "6", "...", "12"], description: "Zero siblings - only first, current and last"}
  - {id: t8, hidden: true, args: [2, 2, 0], expected: ["1", "2"], description: "Two pages, current last, nothing hidden"}
  - {id: t9, hidden: true, args: [500000000, 1000000000, 2], expected: ["1", "...", "499999998", "499999999", "500000000", "500000001", "500000002", "...", "1000000000"], description: "Very large page counts"}
  - {id: t10, hidden: true, args: [5, 7, 10], expected: ["1", "2", "3", "4", "5", "6", "7"], description: "Siblings cover the whole range - every page shown"}
expected_concepts:
  - clamping a window around the current page to the valid range
  - merging the first and last page into the window without duplicates
  - classifying each gap between consecutive shown pages
  - work proportional to the window size, not the total number of pages
optimal_complexity: {time: O(siblings), space: O(siblings)}
rubric:
  excellent: Builds the small set of shown pages from the clamped window plus the first and last page, walks consecutive pairs to emit either the single hidden page or one ellipsis, never iterates over all pages, and checks the boundaries at both ends and the single-page case.
  good: Correct strip for typical inputs; needs a test run to fix one case such as the one-page gap or duplicates when the window touches page 1.
  weak: Loops over every page up to total_pages, shows duplicates, always uses an ellipsis even for one hidden page, or emits an ellipsis next to the edge when nothing is hidden.
  criteria:
    correctness: All tests pass, including the first and last page as current, a gap of exactly one page and zero siblings.
    efficiency: Work bounded by the number of shown pages, so a billion pages is no slower than ten.
    code_quality: Shown pages are computed first and labels second; the gap rule is a single clear comparison.
    edge_cases: One or two pages in total, siblings larger than the range, current at either end.
    communication: Explains why a single hidden page is shown as a number and how the strip keeps a stable width.
hints:
  - Separate the problem into two steps - first decide which page numbers are shown, then decide what goes between each pair of neighbouring shown pages.
  - The shown pages are the first page, the last page and a window around the current page cut off at the ends; a set or a careful merge removes duplicates, and the gap between two neighbours tells you what to print between them.
  - Clamp the window to between 1 and the total, collect it together with the first and last page into a sorted list without duplicates, then walk the list - before each page after the first, look at how many pages lie strictly between it and the previous one, print that single page number when exactly one is missing and one ellipsis when two or more are missing, and finally print the page itself.
followups:
  - How would you keep the strip the same width on every page so the buttons do not jump around?
  - How would you make the strip accessible to screen readers and keyboard users?
  - How would the design change for cursor-based pagination where the total is unknown?
  - How would you render this efficiently in a component library with memoisation?
common_errors:
  - Iterating over every page from 1 to total_pages.
  - Showing page 1 or the last page twice when the window reaches them.
  - Replacing a single hidden page with an ellipsis.
  - Adding an ellipsis between consecutive pages with nothing hidden.
