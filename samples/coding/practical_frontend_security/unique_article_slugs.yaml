version: 1
slug: unique_article_slugs
title: Unique URL Slugs for Articles
difficulty: easy
competency_keys: [data_structures, problem_solving, code_quality]
role_tags: [frontend, backend, fullstack]
time_limit_minutes: 15
prompt_markdown: |
  ## Unique URL Slugs for Articles

  The editors of a company blog import a batch of article titles at once, and the CMS must give every
  article a readable URL slug such as `/blog/release-notes-v2-1`. Two articles in the same batch must
  never share a slug.

  Process `titles` **in order**. For each title, first build its **base slug**:

  1. Convert the title to lowercase.
  2. Treat every character that is not `a-z` or `0-9` as a separator. Every run of one or more
     separators **between** two kept characters becomes a single `-`; separators at the start or end
     of the title produce nothing.
  3. If the result is longer than `max_length`, keep only its first `max_length` characters, then remove
     any `-` left at the end.
  4. If the result is empty, the base slug is `"untitled"`.

  Then issue a slug: if the base slug has not been issued yet in this batch, issue it as is. Otherwise
  issue `base + "-" + n` for the **smallest** integer `n >= 2` whose result has not been issued yet.
  The suffix is added after truncation, so a suffixed slug may be longer than `max_length`. Every
  issued slug (suffixed or not) counts as taken for the titles that follow.

  Return the issued slugs in the same order as `titles`.

  ### Example 1
  ```
  Input:  titles = ["Hello, World!", "Release Notes: v2.1", "hello world", "  Hello -- World  "], max_length = 40
  Output: ["hello-world", "release-notes-v2-1", "hello-world-2", "hello-world-3"]
  Explanation: the third and fourth titles normalise to "hello-world" again, so they get -2 and -3.
  ```

  ### Example 2
  ```
  Input:  titles = ["Q3 Planning & Roadmap Review", "!!!", "Q3 planning and roadmap"], max_length = 12
  Output: ["q3-planning", "untitled", "q3-planning-2"]
  Explanation: "q3-planning-roadmap-review" cut to 12 characters is "q3-planning-",
  and the trailing '-' is removed. The third title ("q3-planning-and-roadmap") has the same base.
  ```

  ### Constraints
  - `0 <= titles.length <= 1000`
  - `0 <= titles[i].length <= 200`; titles contain printable ASCII characters only
  - `8 <= max_length <= 80`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: make_unique_slugs
  params:
    - {name: titles, type: "string[]"}
    - {name: max_length, type: int}
  return_type: "string[]"
  comparison: exact
reference_solutions:
  python: |
    def make_unique_slugs(titles: list[str], max_length: int) -> list[str]:
        issued: set[str] = set()
        result: list[str] = []
        for title in titles:
            parts: list[str] = []
            pending_dash = False
            for ch in title.lower():
                if "a" <= ch <= "z" or "0" <= ch <= "9":
                    if pending_dash and parts:
                        parts.append("-")
                    parts.append(ch)
                    pending_dash = False
                else:
                    pending_dash = True  # leading and trailing runs never produce a dash
            base = "".join(parts)[:max_length].rstrip("-")
            if not base:
                base = "untitled"
            slug = base
            n = 2
            while slug in issued:
                slug = f"{base}-{n}"
                n += 1
            issued.add(slug)
            result.append(slug)
        return result
  javascript: |
    function makeUniqueSlugs(titles, maxLength) {
      const issued = new Set();
      const result = [];
      for (const title of titles) {
        let out = '';
        let pendingDash = false;
        for (const ch of title.toLowerCase()) {
          if ((ch >= 'a' && ch <= 'z') || (ch >= '0' && ch <= '9')) {
            if (pendingDash && out.length > 0) out += '-';
            out += ch;
            pendingDash = false;
          } else {
            pendingDash = true; // leading and trailing runs never produce a dash
          }
        }
        let base = out.slice(0, maxLength).replace(/-+$/, '');
        if (base === '') base = 'untitled';
        let slug = base;
        let n = 2;
        while (issued.has(slug)) {
          slug = `${base}-${n}`;
          n += 1;
        }
        issued.add(slug);
        result.push(slug);
      }
      return result;
    }
tests:
  - {id: t1, args: [["Hello, World!", "Release Notes: v2.1", "hello world", "  Hello -- World  "], 40], expected: ["hello-world", "release-notes-v2-1", "hello-world-2", "hello-world-3"], description: "Example 1"}
  - {id: t2, args: [["Q3 Planning & Roadmap Review", "!!!", "Q3 planning and roadmap"], 12], expected: ["q3-planning", "untitled", "q3-planning-2"], description: "Example 2 - cut to max_length then trailing dash trimmed; punctuation-only title becomes untitled"}
  - {id: t3, hidden: true, args: [[], 20], expected: [], description: "Empty batch"}
  - {id: t4, hidden: true, args: [["Post 2", "Post", "Post", "post-2"], 30], expected: ["post-2", "post", "post-3", "post-2-2"], description: "A title that naturally slugs to post-2 forces later duplicates to skip to -3, and a later post-2 title gets post-2-2"}
  - {id: t5, hidden: true, args: [["", "   ", "???", "Untitled", "untitled-2"], 20], expected: ["untitled", "untitled-2", "untitled-3", "untitled-4", "untitled-2-2"], description: "Empty and symbol-only titles become untitled; collisions with literal Untitled titles"}
  - {id: t6, hidden: true, args: [["ABCDEFGHIJKLMNOP", "abcdefghijXYZ", "abcdefghij", "abcdefghij-2 extra"], 10], expected: ["abcdefghij", "abcdefghij-2", "abcdefghij-3", "abcdefghij-4"], description: "Truncation makes different titles collide; suffix may push the slug past max_length"}
  - {id: t7, hidden: true, args: [["a b", "a--b", "a__b", "A.B", "a/b", "-a-b-"], 8], expected: ["a-b", "a-b-2", "a-b-3", "a-b-4", "a-b-5", "a-b-6"], description: "Different separator characters (space, dashes, underscores, dot, slash) collapse to one dash"}
  - {id: t8, hidden: true, args: [["2024 Q1 Report", "2024-q1-report", "100% Uptime!", "C++ & C# Tips", "cafe/menu?id=7"], 50], expected: ["2024-q1-report", "2024-q1-report-2", "100-uptime", "c-c-tips", "cafe-menu-id-7"], description: "Digits kept, symbols like % + # / ? = treated as separators"}
  - {id: t9, hidden: true, args: [["Long Title Here", "Long Title Here", "Long Title Here"], 9], expected: ["long-titl", "long-titl-2", "long-titl-3"], description: "Cut lands in the middle of a word (no dash to trim) with repeated duplicates"}
  - {id: t10, hidden: true, args: [["Status Update 10", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "Status Update", "status update 13"], 30], expected: ["status-update-10", "status-update", "status-update-2", "status-update-3", "status-update-4", "status-update-5", "status-update-6", "status-update-7", "status-update-8", "status-update-9", "status-update-11", "status-update-12", "status-update-13", "status-update-13-2"], description: "Many duplicates - suffix numbering reaches double digits and skips numbers already taken by natural slugs"}
expected_concepts:
  - character-class normalisation of the title
  - collapsing runs of separators and trimming the ends
  - truncation followed by re-trimming a trailing dash
  - hash set of issued slugs
  - smallest free numeric suffix
optimal_complexity: {time: O(L + d^2) where L is the total title length and d the largest number of collisions on one base, space: O(L)}
rubric:
  excellent: Builds the base slug in one pass with clear rules, re-trims after truncation, keeps a set of every issued slug (including suffixed ones), finds the smallest free suffix, and discusses how a per-base counter could avoid rescanning suffixes without breaking the smallest-free rule.
  good: Correct slugs and de-duplication after a hint about truncation creating a trailing dash or about naturally suffixed titles such as "Post 2".
  weak: Only lowercases and replaces spaces, forgets that truncation can leave a trailing dash, or tracks only base slugs so that a suffixed slug can be issued twice.
  criteria:
    correctness: All tests pass, including truncation collisions, empty titles and titles that naturally look like suffixed slugs.
    efficiency: Set lookups for collisions; no rescanning of the whole result list per title.
    code_quality: Separates slug normalisation from uniqueness handling, with small named helpers or clear steps.
    edge_cases: Empty batch, punctuation-only titles, separators at the ends, cut landing on a dash, suffix numbers in double digits.
    communication: States the rules being implemented and explains why issued suffixed slugs must also be tracked.
hints:
  - Split the task in two independent steps - turning one title into a base slug, and then making that slug unique among everything issued so far.
  - For the base slug, walk the characters once and only emit a dash when a run of separators sits between two kept characters; remember that cutting to max_length can expose a dash at the end again.
  - Keep a set of every slug you have issued, including suffixed ones; on a collision try base-2, base-3 and so on until the set does not contain the candidate, then add it to the set.
followups:
  - How would you keep slugs unique across batches when earlier slugs live in a database table?
  - How would you transliterate non-ASCII titles such as accented letters instead of dropping them?
  - With thousands of identical titles, how would you avoid trying every suffix from 2 upwards each time?
common_errors:
  - Producing double dashes or leading and trailing dashes for titles with punctuation or extra spaces.
  - Truncating without trimming a trailing dash created by the cut.
  - Only remembering base slugs, so a later title equal to an issued suffixed slug collides.
  - Truncating after adding the suffix, which can make two suffixed slugs identical.
