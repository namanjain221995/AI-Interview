title: Search Box Debounce Timeline
difficulty: easy
competency_keys: [algorithms, problem_solving]
role_tags: [frontend, fullstack, mobile]
time_limit_minutes: 12
prompt_markdown: |
  ## Search Box Debounce Timeline

  A product search box must not call the search API on every keystroke. Instead it **debounces**: it
  waits until the user pauses typing for `wait_ms` milliseconds and only then sends one request. To
  tune the delay, the team replays recorded typing sessions and wants to know exactly when requests
  would be sent.

  You get the keystroke times `timestamps` (milliseconds, non-decreasing) and `wait_ms`. Process the
  keystrokes in order:

  - A keystroke at time `t` schedules a request to fire at `t + wait_ms`.
  - If another request is still pending and its fire time is **strictly greater** than `t`, that pending
    request is cancelled and never fires.
  - A pending request whose fire time is **less than or equal to** `t` has already fired before the
    keystroke at `t` is handled (a timer due exactly at `t` fires first).
  - After the last keystroke, the request still pending fires as scheduled.

  Return the times at which requests actually fire, in ascending order. Return an empty list when there
  are no keystrokes.

  ### Example 1
  ```
  Input:  timestamps = [0, 100, 200, 800, 850], wait_ms = 300
  Output: [500, 1150]
  Explanation: the timers set at 0 and 100 are cancelled by the next keystroke; the one set at 200 fires
  at 500 before the keystroke at 800. The keystroke at 850 cancels the timer of 800 and fires at 1150.
  ```

  ### Example 2
  ```
  Input:  timestamps = [1000, 1300, 1301], wait_ms = 300
  Output: [1300, 1601]
  Explanation: the timer due at 1300 fires before the keystroke at 1300 is processed.
  ```

  ### Example 3
  ```
  Input:  timestamps = [], wait_ms = 250
  Output: []
  ```

  ### Constraints
  - `0 <= timestamps.length <= 10^5`
  - `0 <= timestamps[i] <= 10^9` and `timestamps` is sorted in non-decreasing order.
  - `1 <= wait_ms <= 10^6`
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: debounce_fire_times
  params:
    - {name: timestamps, type: "int[]"}
    - {name: wait_ms, type: int}
  return_type: "int[]"
  comparison: exact
reference_solutions:
  python: |
    def debounce_fire_times(timestamps: list[int], wait_ms: int) -> list[int]:
        fired: list[int] = []
        pending = None
        for t in timestamps:
            if pending is not None and pending <= t:
                fired.append(pending)
            pending = t + wait_ms
        if pending is not None:
            fired.append(pending)
        return fired
  javascript: |
    function debounceFireTimes(timestamps, waitMs) {
      const fired = [];
      let pending = null;
      for (const t of timestamps) {
        if (pending !== null && pending <= t) fired.push(pending);
        pending = t + waitMs;
      }
      if (pending !== null) fired.push(pending);
      return fired;
    }
