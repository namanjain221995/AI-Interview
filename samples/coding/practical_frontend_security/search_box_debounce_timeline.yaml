expected_concepts:
  - simulating a single pending timer while scanning events in time order
  - inclusive versus strict comparison at the exact fire time
  - flushing the last pending timer after the loop
  - equivalent view as gaps between consecutive keystrokes
optimal_complexity: {time: O(n), space: O(1) extra besides the output}
rubric:
  excellent: Models the single pending timer explicitly, decides fire versus cancel with the correct inclusive comparison, flushes the final timer, notes the equivalent rule that a keystroke fires when the next one is at least wait_ms later, and states linear time.
  good: Correct simulation with a minor boundary fix after testing, for example the timer due exactly at the next keystroke.
  weak: Fires a request per keystroke, uses a strict comparison so equal times cancel, forgets the final request, or crashes on an empty list.
  criteria:
    correctness: All tests pass, including equal timestamps, gaps exactly equal to wait_ms and the empty list.
    efficiency: One pass over the keystrokes with constant extra state.
    code_quality: A clear pending variable (or gap comparison) rather than an event queue or real timers.
    edge_cases: Empty input, single keystroke, repeated identical timestamps, very large times.
    communication: Explains the debounce behaviour in product terms and why the boundary rule matters for replaying logs.
hints:
  - At any moment at most one request can be waiting to fire, so you only need to remember a single pending fire time while you walk through the keystrokes.
  - When a new keystroke arrives, compare it with the pending fire time - if the pending time has already been reached (including exactly now) it fired, otherwise it is cancelled - then schedule the new one.
  - Keep a pending value that starts empty; for each keystroke time, record the pending value as fired if it exists and is not later than the keystroke, then set pending to the keystroke time plus the wait; after the loop record the remaining pending value, which is always the last keystroke plus the wait.
followups:
  - How would the output change for a throttle that fires at most once per wait_ms instead of a debounce?
  - How would you add a leading-edge option that fires immediately on the first keystroke of a burst?
  - How would you add a maximum wait so that continuous typing still triggers a request every few seconds?
  - How would you cancel in-flight requests whose results arrive after a newer request was sent?
common_errors:
  - Treating a timer due exactly at the next keystroke as cancelled.
  - Forgetting to emit the final pending request after the last keystroke.
  - Emitting one request per keystroke or per gap without checking the wait.
  - Failing on an empty timestamps list.
