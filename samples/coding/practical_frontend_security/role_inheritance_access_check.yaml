expected_concepts:
  - transitive closure over a DAG with memoised DFS
  - deny-overrides policy combination
  - default deny
  - wildcard and prefix pattern matching with boundary checks
  - indexing rules by role
optimal_complexity: {time: O(V + E) per distinct role for ancestors plus O(applicable rules) per request, space: O(V^2 + rules) in the worst case for cached ancestor sets}
rubric:
  excellent: Indexes rules by role, computes each role's ancestor set once with memoised DFS over the DAG (handling diamonds), evaluates deny-overrides with default deny, implements the prefix pattern with the at-least-one-character rule, and discusses caching, cycle detection and auditability of decisions.
  good: Correct decisions with a per-request BFS over ancestors, possibly after a hint about diamonds or the docs versus docs/ boundary.
  weak: Lets the first matching rule decide, ignores inherited denies, follows inheritance in the wrong direction, or uses a plain startsWith that lets docs/* match docsx or docs itself.
  criteria:
    correctness: All tests pass, including diamond inheritance, inherited denies, case-sensitive actions and pattern boundaries.
    efficiency: Ancestor sets computed once per role and reused across requests; rules looked up by role.
    code_quality: Parsing, ancestor computation, pattern matching and the decision are separate small functions.
    edge_cases: Unknown roles, no requests, deep chains, exact patterns versus children, global wildcards.
    communication: States the policy (deny overrides, default deny) and explains why order of rules does not matter.
hints:
  - Separate the problem into three parts - finding every role whose rules apply, deciding whether one rule matches a request, and combining the matching rules into one decision.
  - The inheritance pairs form a directed acyclic graph from child to parent; collect a role together with all ancestors by depth-first search and remember the result per role, because roles repeat across requests.
  - Group rules by role, compute each role's ancestor set once (memoised DFS that unions the parents' sets), then for a request scan the rules of every role in that set, track whether any matching deny or allow was seen, and return allow-and-not-deny; for prefix/* compare against the prefix including the slash and require a longer resource.
followups:
  - How would you return the rule that decided each request so administrators can audit access?
  - How would you detect and report a cycle if the inheritance data were not guaranteed to be acyclic?
  - With millions of resources and frequent checks, how would you index patterns instead of scanning every applicable rule?
common_errors:
  - Letting the first matching rule decide, so rule order changes the outcome.
  - Following inherits from parent to child, giving parents the rules of their children.
  - Matching docs/* with a plain prefix check on docs, which also matches docs and docsx/a.
  - Recomputing ancestors with no memoisation or visiting a shared ancestor repeatedly in large diamonds.
