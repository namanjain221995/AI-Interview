slug: role_inheritance_access_check
title: Role-Based Access Check with Inheritance
difficulty: medium
competency_keys: [algorithms, data_structures, problem_solving]
role_tags: [security, backend, fullstack, platform]
time_limit_minutes: 25
prompt_markdown: |
  ## Role-Based Access Check with Inheritance

  The admin console of an internal document service decides who may do what with role-based rules.
  Roles can inherit from other roles, and an explicit deny must always win so that a broad grant can
  never silently override a restriction. Write `check_access(rules, inherits, requests)`.

  - Each rule is a string `"effect role resource_pattern action_pattern"` (single spaces), where
    `effect` is `allow` or `deny`, for example `"allow editor docs/* write"`.
  - Each pair in `inherits` is `[child, parent]`: the child role gets every rule of the parent, and
    transitively of the parent's ancestors. A role may have several parents; there are no cycles.
    Inheritance is one-way: a parent never gets its children's rules.
  - Each request is `"role resource action"`.

  A **resource pattern** matches a resource as follows:

  - `*` matches every resource.
  - `prefix/*` matches resources that start with `prefix/` **and** have at least one more character
    after it, so `docs/*` matches `docs/a` and `docs/a/b`, but not `docs`, `docs/` or `docsx/a`.
  - Any other pattern matches only the identical resource.

  An **action pattern** matches when it equals the action or is `*`. Comparisons are case-sensitive.

  A rule **applies** to a request when it belongs to the request's role or to one of its ancestors and
  both its patterns match. For each request: if any applying rule is a **deny**, the answer is `false`;
  otherwise, if any applying rule is an **allow**, the answer is `true`; otherwise it is `false`. Roles
  that appear nowhere else are valid and simply have no rules. Return one boolean per request, in
  order.

  ### Example 1
  ```
  Input:  rules = ["allow viewer docs/* read", "allow editor docs/* write", "deny intern docs/payroll/* *"], inherits = [["editor", "viewer"], ["intern", "editor"]], requests = ["intern docs/handbook read", "intern docs/payroll/2026 read", "editor docs/payroll/2026 read", "viewer docs/handbook write"]
  Output: [true, false, true, false]
  Explanation: intern inherits from editor, which inherits from viewer. The intern's own deny
  blocks payroll documents for every action; editor has no deny, so it may read them. viewer has
  no write rule, so the last request is denied by default.
  ```

  ### Example 2
  ```
  Input:  rules = ["allow ops logs/* read", "allow ops status read", "allow admin * *"], inherits = [["admin", "ops"]], requests = ["ops logs read", "ops logs/ read", "ops logs/api/1 read", "ops logsx/1 read", "ops status/x read", "ops status read", "admin logs delete"]
  Output: [false, false, true, false, false, true, true]
  Explanation: "logs/*" matches neither "logs" nor "logs/" nor "logsx/1", and the exact pattern
  "status" does not match "status/x". admin inherits the rules of ops, but ops does not get
  admin's broad allow.
  ```

  ### Constraints
  - `0 <= rules.length <= 1000`, `0 <= inherits.length <= 1000`, `0 <= requests.length <= 1000`
  - Roles, resources and actions are 1-60 characters without spaces; `*` appears in a resource pattern
    only as the whole pattern or as a final `/*`
  - The inheritance graph has no cycles and no duplicate pairs
languages: [python, javascript, typescript, java, go, cpp]
signature:
  function_name: check_access
  params:
    - {name: rules, type: "string[]"}
    - {name: inherits, type: "string[][]"}
    - {name: requests, type: "string[]"}
  return_type: "bool[]"
  comparison: exact
reference_solutions:
  python: |
    def _resource_matches(pattern: str, resource: str) -> bool:
        if pattern == "*":
            return True
        if pattern.endswith("/*"):
            prefix = pattern[:-1]  # keeps the trailing "/"
            return resource.startswith(prefix) and len(resource) > len(prefix)
        return pattern == resource


    def check_access(rules: list[str], inherits: list[list[str]], requests: list[str]) -> list[bool]:
        rules_by_role: dict[str, list[tuple[bool, str, str]]] = {}
        for rule in rules:
            effect, role, resource, action = rule.split(" ")
            rules_by_role.setdefault(role, []).append((effect == "allow", resource, action))

        parents: dict[str, list[str]] = {}
        for child, parent in inherits:
            parents.setdefault(child, []).append(parent)

        closure_cache: dict[str, set[str]] = {}

        def closure(role: str) -> set[str]:
            # The role itself plus all of its ancestors (the graph is acyclic).
            if role not in closure_cache:
                roles = {role}
                for parent in parents.get(role, []):
                    roles |= closure(parent)
                closure_cache[role] = roles
            return closure_cache[role]

        results: list[bool] = []
        for request in requests:
            role, resource, action = request.split(" ")
            allowed = False
            denied = False
            for r in closure(role):
                for is_allow, res_pattern, act_pattern in rules_by_role.get(r, []):
                    if (act_pattern == "*" or act_pattern == action) and _resource_matches(res_pattern, resource):
                        if is_allow:
                            allowed = True
                        else:
                            denied = True
            results.append(allowed and not denied)
        return results
  javascript: |
    function resourceMatches(pattern, resource) {
      if (pattern === '*') return true;
      if (pattern.endsWith('/*')) {
        const prefix = pattern.slice(0, -1); // keeps the trailing "/"
        return resource.startsWith(prefix) && resource.length > prefix.length;
      }
      return pattern === resource;
    }

    function checkAccess(rules, inherits, requests) {
      const rulesByRole = new Map();
      for (const rule of rules) {
        const [effect, role, resource, action] = rule.split(' ');
        if (!rulesByRole.has(role)) rulesByRole.set(role, []);
        rulesByRole.get(role).push([effect === 'allow', resource, action]);
      }

      const parents = new Map();
      for (const [child, parent] of inherits) {
        if (!parents.has(child)) parents.set(child, []);
        parents.get(child).push(parent);
      }

      // The role itself plus all of its ancestors (the graph is acyclic).
      const cache = new Map();
      const closure = (role) => {
        if (!cache.has(role)) {
          const roles = new Set([role]);
          for (const parent of parents.get(role) || []) {
            for (const r of closure(parent)) roles.add(r);
          }
          cache.set(role, roles);
        }
        return cache.get(role);
      };

      return requests.map((request) => {
        const [role, resource, action] = request.split(' ');
        let allowed = false;
        let denied = false;
        for (const r of closure(role)) {
          for (const [isAllow, resPattern, actPattern] of rulesByRole.get(r) || []) {
            if ((actPattern === '*' || actPattern === action) && resourceMatches(resPattern, resource)) {
              if (isAllow) allowed = true;
              else denied = true;
            }
          }
        }
        return allowed && !denied;
      });
    }
