expected_concepts:
  - single-pass left-to-right scanner with a cursor
  - rule precedence (escape, triple, double, literal)
  - context-appropriate HTML escaping to prevent XSS
  - not re-scanning substituted values
  - hash map lookup of variables
optimal_complexity: {time: O(template length + output length), space: O(output length)}
rubric:
  excellent: Writes a cursor-based scanner that tries the escape, raw and escaped tag in order, falls back to copying one character, escapes all five characters with ampersand first, never re-scans inserted values, and explains why escaping by default and raw opt-in protect against XSS.
  good: Correct renderer after a hint about rule order for three braces or about fallback copying one character at a time.
  weak: Uses repeated string replace so values get re-scanned, escapes only some characters or escapes the ampersand last, or crashes on unterminated or malformed tags.
  criteria:
    correctness: All tests pass, including malformed tags, mismatched brace counts and values that contain tags.
    efficiency: One left-to-right pass; output built with a list or string builder.
    code_quality: A small helper that tries to parse a tag at a position and returns the name and end index, with escaping in one function.
    edge_cases: Empty template, unknown names, empty values, backslash not followed by braces, unterminated tag at the end.
    communication: Explains the precedence of the rules and the security reason for escaping by default.
hints:
  - Walk the template with an index and decide at each position whether a tag starts there; inserting values while scanning (instead of replacing in the template) avoids re-reading them.
  - Write a helper that, given a position and a brace count (2 or 3), skips spaces, reads a valid name, skips spaces and checks for the closing braces, returning the name and end position or nothing.
  - At each index check for backslash plus two braces, then the three-brace tag, then the two-brace tag; on a match append the raw or escaped value (ampersand handled per character so it is not double-escaped) and jump to the tag end, otherwise append one character and advance by one.
followups:
  - Why is HTML escaping not enough when a value is inserted into an href attribute or a script block?
  - How would you report malformed tags to template authors instead of silently copying them?
  - How would you add sections or loops while keeping the renderer linear and safe?
common_errors:
  - Using global string replacement in a loop, so a value containing a tag is substituted again.
  - Escaping & after the other characters, which turns &lt; into &amp;lt;.
  - Treating three braces as a two-brace tag plus a stray brace, inserting the value escaped.
  - Skipping a whole {{ on a failed match, which can hide a valid tag starting one character later.
