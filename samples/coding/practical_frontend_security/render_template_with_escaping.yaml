prompt_markdown: |
  ## Email Template Rendering with HTML Escaping

  The notification service fills HTML email templates with data such as customer-entered order notes.
  Because that data is untrusted, placeholders are **HTML-escaped by default**, and only placeholders
  written with three braces insert their value unchanged. Write the renderer.

  The template variables are given as two parallel arrays: `values[i]` is the value of variable
  `keys[i]` (keys are distinct). A **name** is a letter or `_` followed by any number of letters,
  digits, `_` or `.` characters (for example `user.name`); names are case-sensitive.

  Scan `template_text` from left to right. At each position, check these rules **in order** and apply the
  first one that matches:

  1. **Escape:** the text is a backslash followed by `{{`. Output `{{` and continue after those three
     characters.
  2. **Raw tag:** the text is `{{{`, then zero or more spaces, a name, zero or more spaces and `}}}`.
     Output the variable's value unchanged.
  3. **Escaped tag:** the text is `{{`, then zero or more spaces, a name, zero or more spaces and `}}`.
     Output the value with `&`, `<`, `>`, `"` and `'` replaced by `&amp;`, `&lt;`, `&gt;`, `&quot;` and
     `&#39;`.
  4. **Otherwise** copy the **single** current character and move to the next one.

  A name that is not one of `keys` renders as an empty string. "Spaces" means the space character
  only. Inserted values are never scanned again, even if they contain braces. Return the rendered text.

  Strings in the examples are written as JSON string literals, so `\\` stands for one backslash and
  `\"` for one double quote.

  ### Example 1
  ```
  Input:  template_text = "Hi {{ user.name }}, your order {{order_id}} shipped. {{{ tracking_link }}}", keys = ["user.name", "order_id", "tracking_link"], values = ["Sam <admin>", "A&B-17", "<a href=\"/t/9\">Track</a>"]
  Output: "Hi Sam &lt;admin&gt;, your order A&amp;B-17 shipped. <a href=\"/t/9\">Track</a>"
  Explanation: double-brace values are HTML-escaped, the triple-brace value is inserted raw.
  ```

  ### Example 2
  ```
  Input:  template_text = "\\{{ not_a_tag }} | {{ missing }} | {{ 9lives }} | {{ msg }}", keys = ["msg"], values = ["{{ msg }}"]
  Output: "{{ not_a_tag }} |  | {{ 9lives }} | {{ msg }}"
  Explanation: \{{ prints "{{" and the rest of that text is ordinary; "missing" is unknown and
  renders as ""; "9lives" is not a valid name, so that text is copied as is; the value of msg
  is inserted once and never scanned again.
  ```

  ### Constraints
  - `0 <= template_text.length <= 10^4`; it contains printable ASCII characters and tabs
  - `0 <= keys.length == values.length <= 100`, keys are distinct valid names
  - `0 <= values[i].length <= 1000`, printable ASCII
