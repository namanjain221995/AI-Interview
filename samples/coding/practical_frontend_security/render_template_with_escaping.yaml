reference_solutions:
  python: |
    HTML_ESCAPES = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}


    def _is_name_start(ch: str) -> bool:
        return ch == "_" or ("a" <= ch <= "z") or ("A" <= ch <= "Z")


    def _is_name_char(ch: str) -> bool:
        return _is_name_start(ch) or ("0" <= ch <= "9") or ch == "."


    def _parse_tag(s: str, i: int, braces: int):
        """Try to read a tag with `braces` braces starting at i; return (name, end) or None."""
        n = len(s)
        j = i + braces
        while j < n and s[j] == " ":
            j += 1
        if j >= n or not _is_name_start(s[j]):
            return None
        start = j
        while j < n and _is_name_char(s[j]):
            j += 1
        name = s[start:j]
        while j < n and s[j] == " ":
            j += 1
        close = "}" * braces
        if not s.startswith(close, j):
            return None
        return name, j + braces


    def render_template(template_text: str, keys: list[str], values: list[str]) -> str:
        lookup = dict(zip(keys, values))
        out: list[str] = []
        i, n = 0, len(template_text)
        while i < n:
            if template_text.startswith("\\{{", i):
                out.append("{{")
                i += 3
                continue
            if template_text.startswith("{{{", i):
                tag = _parse_tag(template_text, i, 3)
                if tag:
                    out.append(lookup.get(tag[0], ""))
                    i = tag[1]
                    continue
            if template_text.startswith("{{", i):
                tag = _parse_tag(template_text, i, 2)
                if tag:
                    value = lookup.get(tag[0], "")
                    out.append("".join(HTML_ESCAPES.get(ch, ch) for ch in value))
                    i = tag[1]
                    continue
            out.append(template_text[i])
            i += 1
        return "".join(out)
  javascript: |
    const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };

    const isNameStart = (ch) => ch === '_' || (ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z');
    const isNameChar = (ch) => isNameStart(ch) || (ch >= '0' && ch <= '9') || ch === '.';

    // Try to read a tag with `braces` braces starting at i; return [name, end] or null.
    function parseTag(s, i, braces) {
      let j = i + braces;
      while (j < s.length && s[j] === ' ') j++;
      if (j >= s.length || !isNameStart(s[j])) return null;
      const start = j;
      while (j < s.length && isNameChar(s[j])) j++;
      const name = s.slice(start, j);
      while (j < s.length && s[j] === ' ') j++;
      if (!s.startsWith('}'.repeat(braces), j)) return null;
      return [name, j + braces];
    }

    function renderTemplate(templateText, keys, values) {
      const lookup = new Map(keys.map((k, idx) => [k, values[idx]]));
      const out = [];
      let i = 0;
      while (i < templateText.length) {
        if (templateText.startsWith('\\{{', i)) {
          out.push('{{');
          i += 3;
          continue;
        }
        if (templateText.startsWith('{{{', i)) {
          const tag = parseTag(templateText, i, 3);
          if (tag) {
            out.push(lookup.has(tag[0]) ? lookup.get(tag[0]) : '');
            i = tag[1];
            continue;
          }
        }
        if (templateText.startsWith('{{', i)) {
          const tag = parseTag(templateText, i, 2);
          if (tag) {
            const value = lookup.has(tag[0]) ? lookup.get(tag[0]) : '';
            out.push(value.replace(/[&<>"']/g, (ch) => HTML_ESCAPES[ch]));
            i = tag[1];
            continue;
          }
        }
        out.push(templateText[i]);
        i += 1;
      }
      return out.join('');
    }
