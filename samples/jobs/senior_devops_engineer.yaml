# Demo job: Senior DevOps Engineer. The primary end-to-end demo (pairs with the Jane Doe resumes in
# samples/resumes/). Rounds start from the default templates in catalog/round_templates.yaml; the
# `overrides` mapping is deep-merged into the template config (lists replace) and validated as a
# RoundConfig.
version: 1
key: senior_devops_engineer
title: Senior DevOps Engineer
department: Platform Engineering
location: Remote (Americas or Europe time zones)
employment_type: full_time
seniority: senior
experience_min_years: 5
experience_max_years: 10
status: open
candidate_report_mode: never
allow_candidate_round_selection: false
description: |
  ## About the role

  Our Platform Engineering team runs the Kubernetes platform (Amazon EKS) behind more than 40
  microservices and a customer base that grows every quarter. We're looking for a Senior DevOps
  Engineer to own the reliability, security and cost efficiency of that platform and to raise the bar
  for how product teams ship software.

  ## What you'll do

  - Operate and evolve our multi-account AWS and EKS platform, managed end to end with Terraform.
  - Build fast, safe CI/CD pipelines with progressive delivery and automated rollback.
  - Define SLOs, improve observability (metrics, logs, traces) and reduce alert noise.
  - Lead incident response and run blameless postmortems that lead to lasting fixes.
  - Drive cloud cost efficiency with clear measurement.
  - Mentor engineers and help product teams adopt platform best practices.

  ## What we're looking for

  - 5+ years in DevOps, SRE or platform engineering.
  - Deep, hands-on Kubernetes experience in production.
  - Strong AWS fundamentals (IAM, VPC networking, managed data services).
  - Terraform at scale, including module design and safe change management.
  - Experience with observability tooling and on-call incident response.
  - Nice to have: Python or Go, cost optimisation, supply-chain security.

  ## How we interview

  The first step is a 30-minute conversation with our AI interviewer covering your experience, a few
  technical scenarios, a short coding exercise and how you work with others. A member of our hiring
  team reviews every interview; the AI never makes hiring decisions.
interview_instructions: >-
  Please join from a quiet place with a working microphone and camera. You can answer by speaking or by
  typing. The coding exercise runs in the browser — no setup needed — and you can choose Python, Go,
  JavaScript, TypeScript, Java or C++.
coding_requirements:
  enabled: true
  languages: [python, go, javascript, typescript, java, cpp]
  difficulty: easy
integrity_settings:
  enabled: true
  require_fullscreen: true
  monitor_focus: true
  monitor_clipboard: true
  block_paste_in_coding: false
  monitor_shortcuts: true
  camera_required: true
  camera_frame_analysis: true
  camera_frame_interval_seconds: 10
  store_evidence_frames: true
  screen_share_required: false
  screen_share_analysis: false
  warn_candidate: true
  allow_page_reload_resume: true
  max_reconnects: 10
  rules:
    - event_type: tab_hidden
      min_occurrences: 3
      window_seconds: 300
      action: warn_candidate
      candidate_message: Please keep the interview tab visible while you answer.
    - event_type: multiple_persons_visible
      min_confidence: 0.75
      min_duration_seconds: 5
      action: flag_for_human_review
    - event_type: possible_phone_visible
      min_confidence: 0.7
      min_duration_seconds: 3
      action: flag_for_human_review
    - event_type: large_paste_in_coding
      action: flag_for_human_review
recording_settings:
  record_answer_audio: true
  record_video: true
  record_screen: false
  show_live_subtitles: true
  allow_typed_answers: true
requirements:
  - {kind: required_skill, name: Kubernetes, competency_key: kubernetes, weight: 1.5, min_years: 3, description: "Operating production clusters: workloads, autoscaling, networking, upgrades and troubleshooting."}
  - {kind: required_skill, name: AWS, competency_key: aws, weight: 1.3, min_years: 3, description: "IAM, VPC networking, EKS, managed databases and multi-account setups."}
  - {kind: required_skill, name: Terraform, competency_key: terraform, weight: 1.2, min_years: 2, description: "Reusable modules, remote state and safe change management."}
  - {kind: required_skill, name: CI/CD, competency_key: ci_cd, weight: 1.0, min_years: 2, description: "Pipeline design, progressive delivery and automated rollback."}
  - {kind: required_skill, name: Observability, competency_key: observability, weight: 1.0, description: "Metrics, logs and traces; SLOs and actionable alerting."}
  - {kind: required_skill, name: Incident Response, competency_key: incident_response, weight: 1.0, description: On-call experience and blameless postmortems.}
  - {kind: preferred_skill, name: Python or Go, competency_key: python, weight: 0.6, description: Automation and tooling.}
  - {kind: preferred_skill, name: Cloud cost optimization, competency_key: cloud_cost_optimization, weight: 0.6}
  - {kind: preferred_skill, name: Supply-chain and platform security, competency_key: security, weight: 0.5}
  - {kind: preferred_skill, name: Linux troubleshooting, competency_key: linux, weight: 0.5}
  - {kind: responsibility, name: Own the EKS platform behind 40+ microservices, competency_key: kubernetes, weight: 1.0}
  - {kind: responsibility, name: Lead incident response and postmortems, competency_key: incident_response, weight: 0.8}
  - {kind: responsibility, name: Mentor engineers on platform practices, competency_key: mentoring, weight: 0.6}
  - {kind: qualification, name: "5+ years in DevOps, SRE or platform roles", weight: 1.0, min_years: 5}
  - {kind: qualification, name: Experience leading projects or small teams, competency_key: leadership, weight: 0.6}
rounds:
  # ------------------------------------------------------------------------
  - template: combined
    name: Combined AI Round
    pinned_coding_slugs: [most_frequent_error_service]
    overrides:
      duration_minutes: 30
      max_duration_minutes: 35
      competencies:
        - {key: kubernetes, weight: 1.5, focus_areas: [availability, scaling, troubleshooting]}
        - {key: aws, weight: 1.2, focus_areas: [networking, iam, high_availability]}
        - {key: terraform, weight: 1.0, focus_areas: [state_management, change_safety]}
        - {key: ci_cd, weight: 0.8, focus_areas: [deployment_strategy, rollback]}
        - {key: observability, weight: 0.8, focus_areas: [slo_design, alerting]}
        - {key: data_structures, weight: 0.8, focus_areas: [selection]}
        - {key: ownership, weight: 0.6, focus_areas: [accountability]}
        - {key: incident_response, weight: 0.6, required: false, min_evidence: 1}
        - {key: cloud_cost_optimization, weight: 0.5, required: false, min_evidence: 1, focus_areas: [measurement]}
        - {key: leadership, weight: 0.5, required: false, min_evidence: 1, focus_areas: [delegation, delivery]}
        - {key: communication, weight: 0.4, required: false, min_evidence: 1}
      rubric:
        - key: technical_knowledge
          label: Technical Knowledge
          weight: 30
          competency_keys: [kubernetes, aws, terraform, ci_cd, observability]
          dimensions: [correctness, depth]
        - key: practical_experience
          label: Practical Experience
          weight: 15
          competency_keys: [incident_response, cloud_cost_optimization]
          dimensions: [practical_experience, specificity]
        - key: coding
          label: Coding
          weight: 20
          competency_keys: [data_structures]
          dimensions: [code_quality, edge_case_handling]
        - key: problem_solving
          label: Problem Solving
          weight: 10
          dimensions: [reasoning]
        - key: ownership_leadership
          label: Ownership & Leadership
          weight: 10
          competency_keys: [ownership, leadership]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: resume_consistency
          label: Resume Consistency
          weight: 5
          dimensions: [consistency]
      coding:
        enabled: true
        duration_minutes: 10
        difficulty: easy
        languages: [python, go, javascript, typescript, java, cpp]
        max_problems: 1
      resume_validation: {enabled: true, max_claims: 3, min_priority: 3}
      interviewer_notes: >-
        Senior DevOps candidate. Prioritise verifying the largest platform claims on the resume (scale of the
        Kubernetes platform, the EKS migration and how cost savings were measured). Suggested flow: intro
        (1 min), resume and technical scenarios (about 12 min), the pinned log-parsing exercise (about 10 min),
        one ownership or leadership question (about 5 min), candidate questions.

  # ------------------------------------------------------------------------
  - template: technical_screening
    name: Technical Screening
    overrides:
      competencies:
        - {key: kubernetes, weight: 1.5, focus_areas: [workload_design, availability, troubleshooting]}
        - {key: aws, weight: 1.2, focus_areas: [networking, iam]}
        - {key: terraform, weight: 1.0, focus_areas: [state_management, module_design]}
        - {key: ci_cd, weight: 1.0, focus_areas: [pipeline_design, deployment_strategy]}
        - {key: observability, weight: 1.0, focus_areas: [slo_design, alerting]}
        - {key: incident_response, weight: 1.0, focus_areas: [mitigation, postmortem]}
        - {key: linux, weight: 0.6, required: false}
        - {key: networking, weight: 0.6, required: false}
        - {key: communication, weight: 0.5, required: false}
      rubric:
        - key: technical_knowledge
          label: Technical Knowledge
          weight: 30
          competency_keys: [kubernetes, aws, terraform, ci_cd, linux, networking]
          dimensions: [correctness, depth]
        - key: problem_solving
          label: Problem Solving
          weight: 20
          dimensions: [reasoning]
        - key: practical_experience
          label: Practical Experience
          weight: 20
          dimensions: [practical_experience, specificity]
        - key: reliability_operations
          label: Reliability & Operations
          weight: 15
          competency_keys: [observability, incident_response]
          dimensions: [tradeoff_understanding]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: resume_consistency
          label: Resume Consistency
          weight: 5
          dimensions: [consistency]

  # ------------------------------------------------------------------------
  - template: behavioral
    name: Behavioral
    overrides:
      competencies:
        - {key: ownership, weight: 1.2, focus_areas: [accountability, follow_through]}
        - {key: collaboration, weight: 1.0, focus_areas: [cross_team_work, conflict_resolution]}
        - {key: leadership, weight: 1.0, focus_areas: [delegation, decision_making]}
