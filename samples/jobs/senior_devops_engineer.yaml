        - key: actions_ownership
          label: Actions & Ownership
          weight: 35
          competency_keys: [ownership, collaboration, leadership, mentoring]
          dimensions: [depth, practical_experience]
        - key: results_impact
          label: Results & Impact
          weight: 25
          dimensions: [specificity, completeness]
        - key: reflection_learning
          label: Reflection & Learning
          weight: 15
          competency_keys: [culture_values]
          dimensions: [reasoning]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: consistency
          label: Consistency
          weight: 5
          dimensions: [consistency]
