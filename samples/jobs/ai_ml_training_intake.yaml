# Demo job: AI/ML Training Program intake (docs/design/INTAKE_INTERVIEW.md section 4.4). One round of type
# intake, started from the default "intake" template in catalog/round_templates.yaml. Candidates never see
# scores or reports (candidate_report_mode: never); a person on the training team decides.
version: 1
key: ai_ml_training_intake
title: "AI/ML Training Program — Intake"
department: Training
employment_type: training_program
seniority: entry
status: open
candidate_report_mode: never
allow_candidate_round_selection: false
description: |
  ## About the program

  The AI/ML Training Program is an intensive, time-boxed training program that prepares participants for
  roles in AI/ML, data analysis and technical product management. It combines guided study, hands-on
  projects and regular reviews with mentors.

  ## The intake interview

  Before the program starts, every applicant takes an intake interview with our AI interviewer. It takes
  about 45 minutes (35 to 50) and has seven short parts: an introduction, your experience, a few standard
  questions, a reading exercise, a short speaking exercise, how you learn, and your questions.

  A person on our training team reviews every interview and makes every decision. The AI interviewer never
  decides, and you won't see scores or a report.
interview_instructions: >-
  Please join from a quiet room with a working microphone. The interview includes a reading exercise (you
  read a short technical passage aloud, and later read another one silently for 30 seconds and explain it)
  and a timed speaking exercise (60 seconds to prepare, 2 minutes to speak). It's fine to say when you don't
  know something.
