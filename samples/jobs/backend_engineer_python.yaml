# Demo job: Backend Engineer (Python). Demonstrates candidate round selection: the candidate picks
# either the Technical Screening or the Coding Interview; System Design is scheduled separately.
version: 1
key: backend_engineer_python
title: Backend Engineer (Python)
department: Core Services
location: Berlin, Germany (hybrid, two office days per week)
employment_type: full_time
seniority: mid
experience_min_years: 2
experience_max_years: 6
status: open
candidate_report_mode: never
allow_candidate_round_selection: true
description: |
  ## About the role

  Core Services builds the APIs that power ordering, billing and notifications for our platform. We
  write Python (FastAPI, SQLAlchemy, asyncio) on PostgreSQL and Redis, deploy to Kubernetes and care a
  lot about correctness, testing and clear API contracts.

  ## What you'll do

  - Design and build well-tested backend services and REST APIs.
  - Model data in PostgreSQL and keep queries fast as tables grow.
  - Make asynchronous workflows reliable with queues, retries and idempotency.
  - Review code, improve tests and help keep the system easy to change.

  ## What we're looking for

  - 2+ years of professional backend development, ideally in Python.
  - Solid SQL and relational data modelling.
  - Experience designing HTTP APIs and writing automated tests.
  - Nice to have: message queues, distributed systems, Docker and Kubernetes.

  ## How we interview

  You choose your first round: a technical conversation or a live coding exercise. Both are run by our
  AI interviewer and reviewed by an engineer on the team, who makes every decision.
interview_instructions: >-
  You'll be asked to choose between a technical conversation and a coding exercise. Pick whichever lets you
  show your strengths best. Screen sharing is required for this job so we can see the same screen you do;
  you'll be asked for permission before it starts.
coding_requirements:
  enabled: true
  languages: [python, javascript, typescript, java, go, cpp]
  difficulty: medium
integrity_settings:
  enabled: true
  require_fullscreen: true
  monitor_focus: true
  monitor_clipboard: true
  block_paste_in_coding: false
  monitor_shortcuts: true
  camera_required: true
  camera_frame_analysis: true
  camera_frame_interval_seconds: 15
  store_evidence_frames: true
  screen_share_required: true
  screen_share_analysis: true
  screen_frame_interval_seconds: 30
  terminate_on_required_screen_share_stop: false
  warn_candidate: true
  allow_page_reload_resume: true
  max_reconnects: 8
  rules:
    - event_type: screen_share_stopped
      action: pause_interview
      candidate_message: Screen sharing stopped. Please share your entire screen again to continue.
    - event_type: screen_share_not_full_screen
      action: warn_candidate
      candidate_message: Please share your entire screen rather than a single window or tab.
    - event_type: large_paste_in_coding
      action: flag_for_human_review
recording_settings:
  record_answer_audio: true
  record_video: true
  record_screen: true
  show_live_subtitles: true
  allow_typed_answers: true
requirements:
  - {kind: required_skill, name: Python, competency_key: python, weight: 1.5, min_years: 2, description: "Idiomatic Python, asyncio and typing."}
  - {kind: required_skill, name: REST API design, competency_key: api_design, weight: 1.2, description: "Resource modelling, errors, pagination and idempotency."}
  - {kind: required_skill, name: PostgreSQL and data modelling, competency_key: databases, weight: 1.2, min_years: 2}
  - {kind: required_skill, name: SQL, competency_key: sql, weight: 1.0}
  - {kind: required_skill, name: Automated testing, competency_key: testing, weight: 1.0}
  - {kind: preferred_skill, name: Message queues and distributed systems, competency_key: distributed_systems, weight: 0.6}
  - {kind: preferred_skill, name: Docker, competency_key: docker, weight: 0.4}
  - {kind: preferred_skill, name: Kubernetes, competency_key: kubernetes, weight: 0.3}
  - {kind: responsibility, name: Build and operate ordering and billing APIs, competency_key: api_design, weight: 1.0}
  - {kind: responsibility, name: Keep queries fast as data grows, competency_key: databases, weight: 0.8}
  - {kind: qualification, name: 2+ years of professional backend development, weight: 1.0, min_years: 2}
rounds:
  # ------------------------------------------------------------------------
  - template: technical_screening
    name: Technical Screening
    candidate_selectable: true
    overrides:
      competencies:
        - {key: python, weight: 1.5, focus_areas: [concurrency, idioms]}
        - {key: databases, weight: 1.2, focus_areas: [indexing, transactions]}
        - {key: api_design, weight: 1.0, focus_areas: [semantics, idempotency, pagination]}
        - {key: sql, weight: 0.8, focus_areas: [joins, window_functions]}
        - {key: testing, weight: 0.8, focus_areas: [test_levels, isolation]}
        - {key: distributed_systems, weight: 0.6, required: false, focus_areas: [messaging]}
        - {key: communication, weight: 0.5, required: false}
      rubric:
        - key: technical_knowledge
          label: Technical Knowledge
          weight: 30
          competency_keys: [python, databases, sql, api_design, testing]
          dimensions: [correctness, depth]
        - key: problem_solving
          label: Problem Solving
          weight: 20
          dimensions: [reasoning]
        - key: practical_experience
          label: Practical Experience
          weight: 20
          dimensions: [practical_experience, specificity]
        - key: system_design
          label: System Design
          weight: 15
          competency_keys: [distributed_systems]
          dimensions: [architecture_awareness, tradeoff_understanding]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: resume_consistency
          label: Resume Consistency
          weight: 5
          dimensions: [consistency]

  # ------------------------------------------------------------------------
  - template: coding
    name: Coding Interview
    candidate_selectable: true
    overrides:
      coding:
        enabled: true
        duration_minutes: 35
        difficulty: medium
        languages: [python, javascript, typescript, java, go, cpp]
        max_problems: 2

  # ------------------------------------------------------------------------
  - template: system_design
    name: System Design
    overrides:
      interviewer_notes: >-
        Use a backend-flavoured prompt such as a notification service, a background job system or idempotent
        payment processing. Push on data modelling in PostgreSQL, retries and idempotency, and how the design
        behaves when a dependency is slow.
