# Demo job: Frontend Engineer (React).
version: 1
key: frontend_engineer_react
title: Frontend Engineer (React)
department: Web Experience
location: Remote (Europe)
employment_type: full_time
seniority: mid
experience_min_years: 2
experience_max_years: 5
status: open
candidate_report_mode: after_review
allow_candidate_round_selection: false
description: |
  ## About the role

  The Web Experience team builds the customer-facing web app used by hundreds of thousands of people
  every week. We work in React and TypeScript with a shared design system, and we care about
  accessibility and performance as much as features.

  ## What you'll do

  - Build accessible, responsive React features in TypeScript.
  - Improve Core Web Vitals with measurement, not guesswork.
  - Contribute components to our design system and keep them accessible by default.
  - Write meaningful component and end-to-end tests.

  ## What we're looking for

  - 2+ years of professional frontend development with React.
  - Strong TypeScript and modern JavaScript fundamentals.
  - Experience testing UI behaviour and fixing accessibility issues.
  - Nice to have: performance profiling, design systems, data-fetching libraries.

  ## How we interview

  Three short rounds with our AI interviewer — a technical conversation, a coding exercise in JavaScript or
  TypeScript, and a behavioural conversation. A frontend engineer reviews every interview and makes the
  decision.
interview_instructions: >-
  The coding exercise runs in the browser editor in JavaScript or TypeScript. Use the language you're most
  comfortable with and talk through your approach as you go.
