# Demo job: ML Engineer (LLM). Uses a camera-optional integrity policy.
version: 1
key: ml_engineer_llm
title: ML Engineer (LLM)
department: Applied AI
location: Remote (US time zones)
employment_type: full_time
seniority: senior
experience_min_years: 3
experience_max_years: 8
status: open
candidate_report_mode: never
allow_candidate_round_selection: false
description: |
  ## About the role

  Applied AI builds the retrieval, evaluation and serving systems behind our LLM-powered products. We
  run open-weight models on our own GPUs, so latency, cost and evaluation quality are engineering
  problems we own end to end.

  ## What you'll do

  - Build retrieval-augmented generation pipelines with strong retrieval evaluation.
  - Design evaluation suites and regression tests for prompts, models and retrieval changes.
  - Optimise LLM serving for time to first token, throughput and cost.
  - Ship models safely with monitoring for drift and quality.

  ## What we're looking for

  - 3+ years building machine-learning systems in production.
  - Hands-on LLM application experience (RAG, structured outputs, evaluation).
  - Strong Python and solid ML fundamentals.
  - Nice to have: model serving and GPU scheduling, Kubernetes, fine-tuning.

  ## How we interview

  A deep technical conversation, a Python coding exercise and a behavioural conversation, all with our AI
  interviewer. An engineer on the Applied AI team reviews every interview and makes the decision.
interview_instructions: >-
  The coding exercise is in Python. Camera use is optional for this job; the interview works with audio
  only.
coding_requirements:
