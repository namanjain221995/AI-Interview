# Role taxonomy: the vocabulary for `role_tags` in question_bank/ and coding/.
# Validation only (not stored in the database). Keys are permanent; add roles, do not rename them.
# `competency_keys` lists the competencies most relevant to the role (catalog/competencies.yaml);
# `round_types` lists the round types a typical hiring loop for the role uses.
version: 1
roles:
  # ------------------------------------------------------------------ software engineering
  - key: general
    title: Any role
    family: general
    description: Questions that suit candidates for any role.
    competency_keys: [communication, collaboration, ownership, adaptability, culture_values, motivation, problem_solving]
    round_types: [resume_screening, recruiter_screening, behavioral, problem_solving, combined, custom]
  - key: backend
    title: Backend Engineer
    family: software_engineering
    description: Builds server-side services, APIs and data access layers.
    competency_keys: [python, java, go, javascript, csharp_dotnet, api_design, databases, sql, distributed_systems, system_design, testing, code_quality, debugging, data_structures, algorithms, security]
    round_types: [resume_screening, recruiter_screening, technical_screening, deep_technical, coding, system_design, behavioral, combined]
  - key: frontend
    title: Frontend Engineer
    family: software_engineering
    description: Builds browser user interfaces, client state and web performance.
    competency_keys: [javascript, typescript, frontend_react, accessibility, testing, code_quality, debugging, api_design, data_structures, algorithms, security]
    round_types: [resume_screening, recruiter_screening, technical_screening, deep_technical, coding, system_design, behavioral, combined]
  - key: fullstack
    title: Full-Stack Engineer
    family: software_engineering
    description: Delivers features end to end across the user interface, APIs and data stores.
    competency_keys: [javascript, typescript, frontend_react, python, csharp_dotnet, api_design, databases, sql, system_design, testing, code_quality, debugging]
    round_types: [resume_screening, recruiter_screening, technical_screening, deep_technical, coding, system_design, behavioral, combined]
  - key: mobile
    title: Mobile Engineer
    family: software_engineering
    description: Builds native or cross-platform mobile applications and their release pipelines.
    competency_keys: [mobile_development, java, javascript, typescript, api_design, testing, code_quality, debugging, security, accessibility, system_design]
    round_types: [resume_screening, recruiter_screening, technical_screening, deep_technical, coding, system_design, behavioral, combined]
  - key: qa
    title: QA / Test Automation Engineer
    family: software_engineering
    description: Designs test strategy and builds automated test suites and quality gates.
    competency_keys: [test_automation, testing, ci_cd, python, javascript, debugging, code_quality, api_design]
    round_types: [resume_screening, recruiter_screening, technical_screening, deep_technical, coding, problem_solving, behavioral, combined]
  # ------------------------------------------------------------------ infrastructure and operations
  - key: devops
