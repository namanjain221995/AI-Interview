# Global competency catalog (competencies.organization_id = NULL).
#
# Loaded by app.seed.loaders.load_competencies and upserted by key by
# app.seed.catalog.seed_catalog. Each rubric has behavioural anchors for levels
# 1, 3 and 5 (levels 2 and 4 are interpolated by the scoring engine) and the
# evidence dimensions the interviewer probes.
#
# Fairness: anchors describe observable, job-related evidence in what the
# candidate says, designs or writes. They never refer to personality, emotion,
# confidence, accent, appearance or any protected characteristic.
version: 1
competencies:
  # ------------------------------------------------------------------ platform
  - key: kubernetes
    name: Kubernetes
    category: technical
    description: Designing, operating and troubleshooting workloads and clusters on Kubernetes, including scheduling, networking, storage, scaling and security.
    rubric:
      levels:
        "1": Knows basic objects (pods, deployments, services) by name but cannot explain how they interact or how to debug a failing workload.
        "3": Has operated production workloads; explains probes, rollouts, resource requests and limits, services and ingress, and debugs common failures with kubectl and events.
        "5": Has designed and run multi-tenant or multi-AZ clusters; reasons about scheduling, autoscaling interplay, failure domains, network policy and upgrade strategy with concrete trade-offs and numbers.
      dimensions: [workload_design, scheduling, networking, availability, scaling, security, troubleshooting]

  - key: aws
    name: Amazon Web Services
    category: technical
    description: Building secure, reliable infrastructure on AWS — IAM, networking, compute, managed data services and multi-account organisation.
    rubric:
      levels:
        "1": Recognises core services but cannot design a simple VPC or explain IAM roles versus users.
        "3": Designs multi-AZ architectures with VPCs, security groups, load balancers and managed databases; applies least-privilege IAM; troubleshoots connectivity.
        "5": Designs multi-account, multi-region platforms with guardrails (SCPs, centralised logging), disaster recovery targets and cost-aware service selection, and explains the trade-offs.
      dimensions: [iam, networking, high_availability, managed_services, disaster_recovery, governance]

  - key: terraform
    name: Terraform / Infrastructure as Code
    category: technical
    description: Managing infrastructure declaratively with Terraform — state, modules, environments, safe change management and drift.
    rubric:
      levels:
        "1": Has run terraform apply on existing code but cannot explain state, plans or why a resource would be replaced.
        "3": Writes reusable modules, uses remote state with locking, reviews plans for destructive changes and separates environments.
        "5": Designs IaC for many teams — state boundaries, module versioning, policy as code, drift detection and safe refactoring (moved/import blocks) — and recovers from state incidents.
      dimensions: [state_management, module_design, change_safety, environments, drift, policy_as_code]

  - key: docker
    name: Containers & Docker
    category: technical
    description: Building, securing and running container images, and understanding the Linux primitives behind them.
    rubric:
      levels:
        "1": Can write a basic Dockerfile but does not consider image size, layering or how the process runs inside the container.
        "3": Builds small multi-stage images, uses layer caching, runs as non-root, handles signals and configuration through the environment.
        "5": Explains namespaces, cgroups and image internals; designs a hardened supply chain (pinned digests, scanning, signing) and debugs runtime differences across architectures.
      dimensions: [image_design, build_performance, runtime_behaviour, security, internals]

  - key: ci_cd
    name: CI/CD
    category: technical
    description: Designing build, test and deployment pipelines that are fast, reliable and safe, including progressive delivery and supply-chain security.
    rubric:
      levels:
        "1": Has used an existing pipeline but cannot describe its stages or how a bad change would be stopped.
        "3": Builds pipelines with caching, parallel stages, quality gates and an automated deployment strategy with rollback.
        "5": Designs delivery platforms for many teams — progressive delivery with metric-driven rollback, artifact provenance and signing, OIDC-based credentials and measurable lead time improvements.
      dimensions: [pipeline_design, speed, quality_gates, deployment_strategy, rollback, supply_chain_security]

  - key: linux
    name: Linux Systems
    category: technical
    description: Operating and troubleshooting Linux hosts — processes, memory, storage, networking and performance tooling.
    rubric:
      levels:
        "1": Uses basic shell commands but has no structured approach to diagnosing a slow or full server.
        "3": Diagnoses CPU, memory, disk and I/O problems with standard tools (top, vmstat, iostat, df, du, lsof, journalctl) and explains what the numbers mean.
        "5": Reasons about kernel behaviour (scheduler, page cache, OOM killer, cgroups, file descriptors) and uses tracing tools to find root causes under production pressure.
      dimensions: [process_management, memory, storage, performance_analysis, troubleshooting]

  - key: networking
    name: Networking
    category: technical
    description: TCP/IP, DNS, HTTP, TLS and load balancing as they affect real systems, including cloud and container networking.
    rubric:
      levels:
        "1": Can name protocols but cannot explain what happens between a client request and a server response.
        "3": Explains DNS resolution, TCP connection setup, TLS handshakes, L4 versus L7 load balancing and troubleshoots common connectivity issues.
        "5": Debugs subtle issues (timeouts mismatches, conntrack exhaustion, MTU, DNS search paths) and designs hybrid or multi-region network topologies with clear trade-offs.
      dimensions: [dns, transport, tls, load_balancing, troubleshooting, topology]

  - key: observability
    name: Observability
    category: technical
    description: Instrumenting systems with metrics, logs and traces, defining SLIs/SLOs and building alerting that finds real user impact.
    rubric:
      levels:
        "1": Knows dashboards exist but cannot say what to measure or alert on for a service.
        "3": Defines meaningful SLIs and SLOs, builds symptom-based alerts, and uses metrics, logs and traces together to locate problems.
        "5": Designs observability for a platform — cardinality control, burn-rate alerting, tracing strategy, cost management — and has measurably reduced detection or resolution time.
      dimensions: [instrumentation, slo_design, alerting, tracing, cardinality, cost]

  - key: incident_response
    name: Incident Response
    category: domain
    description: Detecting, coordinating, mitigating and learning from production incidents, including communication and blameless postmortems.
    rubric:
      levels:
        "1": Describes incidents vaguely and focuses on blame or on the fix without mitigation or communication.
        "3": Follows a structured response — triage, mitigation before root cause, clear roles and updates — and writes useful postmortems.
        "5": Leads major incidents across teams, sets up incident processes and tooling, and drives follow-up actions that measurably reduce repeat incidents.
      dimensions: [triage, mitigation, coordination, communication, postmortem, prevention]

  - key: cloud_cost_optimization
    name: Cloud Cost Optimization
    category: domain
    description: Understanding what drives cloud spend, measuring it and reducing it without harming reliability.
    rubric:
      levels:
        "1": Mentions cost savings without knowing how cost was measured or what drove it.
        "3": Uses cost tooling and tagging to attribute spend, applies rightsizing, commitments and spot capacity, and measures savings against a baseline.
        "5": Builds a FinOps practice — unit-cost metrics, normalisation for growth, showback, guardrails — and explains savings claims with credible methodology.
      dimensions: [cost_visibility, attribution, optimisation_levers, measurement, governance]

  - key: security
    name: Security Engineering
    category: technical
    description: Applying security fundamentals to infrastructure and applications — identity, secrets, network controls, supply chain and threat modelling.
    rubric:
      levels:
        "1": Treats security as someone else's job; cannot describe how secrets or credentials are protected.
        "3": Applies least privilege, secret management, TLS, image scanning and secure defaults; knows how to respond to a leaked credential.
        "5": Threat-models systems, designs defence in depth (workload identity, network segmentation, supply-chain controls) and balances risk with delivery speed.
      dimensions: [identity_access, secrets, network_security, supply_chain, threat_modeling, incident_handling]

  # ----------------------------------------------------------------- languages
  - key: python
    name: Python
    category: technical
    description: Writing idiomatic, correct and efficient Python, including concurrency models, packaging and runtime behaviour.
    rubric:
      levels:
        "1": Writes simple scripts but misunderstands core data structures, mutability or error handling.
        "3": Writes idiomatic Python using appropriate data structures, generators, typing and testing; explains the GIL and when to use asyncio, threads or processes.
        "5": Diagnoses performance and memory issues in production services, designs robust async systems and explains interpreter behaviour precisely.
      dimensions: [language_fundamentals, idioms, concurrency, performance, testing, packaging]

  - key: javascript
    name: JavaScript
    category: technical
    description: Core JavaScript semantics — scope, closures, the event loop, async patterns and runtime performance.
    rubric:
      levels:
        "1": Uses JavaScript through frameworks without understanding scope, equality or asynchronous execution.
        "3": Explains closures, the event loop, promises and async/await, equality and common pitfalls, and writes clean modular code.
        "5": Diagnoses memory leaks and performance problems, reasons about microtask scheduling and engine behaviour, and designs robust async flows.
      dimensions: [language_semantics, async_model, closures_scope, performance, debugging]

  - key: typescript
    name: TypeScript
    category: technical
    description: Using TypeScript's type system to model domains safely, including generics, narrowing and migration strategies.
    rubric:
      levels:
        "1": Annotates basic types and falls back to any when types get difficult.
        "3": Uses interfaces, unions, generics, narrowing and utility types to model API data and catch errors at compile time.
        "5": Designs type-safe APIs and libraries (discriminated unions, conditional and mapped types) and leads strict-mode migrations of large codebases.
      dimensions: [type_modeling, generics, narrowing, strictness, api_typing]

  - key: java
    name: Java
    category: technical
    description: Building and operating JVM services — language features, collections, concurrency, memory management and tuning.
    rubric:
      levels:
        "1": Writes basic Java but cannot explain collections trade-offs, exceptions or memory behaviour.
        "3": Uses collections, streams and the concurrency utilities correctly and explains heap, garbage collection and common performance problems.
        "5": Tunes JVM services in production (GC selection, heap analysis, thread contention) and designs concurrent systems with clear correctness arguments.
      dimensions: [language_fundamentals, collections, concurrency, jvm_memory, performance]

  - key: go
    name: Go
    category: technical
    description: Writing idiomatic Go services — goroutines, channels, context, error handling and profiling.
    rubric:
      levels:
        "1": Writes simple Go programs but misuses goroutines or ignores errors.
        "3": Uses goroutines, channels, context cancellation and error wrapping idiomatically and avoids common leaks and races.
        "5": Profiles and optimises Go services (pprof, allocation and lock contention) and designs concurrency patterns with clear failure semantics.
      dimensions: [idioms, concurrency, error_handling, performance, tooling]

  - key: sql
    name: SQL
    category: technical
    description: Writing correct and efficient SQL — joins, aggregation, window functions, NULL semantics and query plans.
    rubric:
      levels:
        "1": Writes simple SELECT statements but struggles with joins, grouping or NULL handling.
        "3": Writes correct joins, aggregations, subqueries and window functions and reads a query plan to find obvious problems.
        "5": Writes complex analytical queries clearly, reasons about plans, indexes and NULL edge cases, and rewrites queries for performance.
      dimensions: [joins, aggregation, window_functions, null_semantics, performance]

  - key: databases
    name: Databases
    category: technical
    description: Designing schemas and operating relational and non-relational databases — indexing, transactions, scaling and migrations.
    rubric:
      levels:
        "1": Uses an ORM without understanding indexes, transactions or how queries execute.
        "3": Designs normalised schemas, chooses indexes, explains isolation levels and investigates slow queries with plans and statistics.
        "5": Designs for scale (partitioning, sharding, replication), runs zero-downtime migrations on large tables and chooses data stores for workload characteristics.
      dimensions: [data_modeling, indexing, transactions, performance, scaling, migrations]

  - key: frontend_react
    name: React & Frontend Engineering
    category: technical
    description: Building accessible, performant React applications — component design, state, effects, data fetching and rendering performance.
    rubric:
      levels:
        "1": Builds components by copying patterns; cannot explain re-renders, keys or effect dependencies.
        "3": Designs reusable components, manages local and server state appropriately, avoids effect pitfalls and fixes common performance and accessibility issues.
        "5": Architects large React applications and design systems, optimises Core Web Vitals with measurement, and sets patterns other teams adopt.
      dimensions: [component_design, state_management, effects_data_fetching, performance, accessibility, architecture]

  - key: testing
    name: Software Testing
    category: technical
    description: Choosing and writing effective automated tests at the right level, and keeping test suites fast and trustworthy.
    rubric:
      levels:
        "1": Writes few tests or tests that assert implementation details; cannot explain what to test.
        "3": Applies unit, integration and end-to-end tests appropriately, isolates dependencies sensibly and fixes flaky tests at their cause.
        "5": Designs testing strategies for systems and teams (contract tests, test data, CI time budgets) and measurably improves release safety and feedback speed.
      dimensions: [test_design, test_levels, isolation, flakiness, strategy]

  # ----------------------------------------------------------------------- AI
  - key: machine_learning
    name: Machine Learning
    category: technical
    description: Framing, training, evaluating and debugging machine-learning models with sound methodology.
    rubric:
      levels:
        "1": Knows algorithm names but cannot explain evaluation, overfitting or data leakage.
        "3": Chooses suitable models and metrics, prevents leakage, handles imbalance and explains bias-variance trade-offs with examples.
        "5": Designs end-to-end evaluation (offline and online), diagnoses production-versus-offline gaps and communicates uncertainty and limitations clearly.
      dimensions: [problem_framing, evaluation, data_quality, modeling, experimentation]

  - key: llm_engineering
    name: LLM Engineering
    category: technical
    description: Building reliable applications on large language models — retrieval, prompting, structured output, evaluation, safety and serving.
    rubric:
      levels:
        "1": Has called an LLM API but cannot explain retrieval, evaluation or failure modes such as hallucination and prompt injection.
        "3": Builds RAG pipelines with sensible chunking, retrieval and reranking, uses structured outputs and evaluates changes against test sets.
        "5": Designs evaluation-driven LLM systems, mitigates injection and hallucination, and optimises serving latency and cost (batching, caching, quantisation) with measurements.
      dimensions: [retrieval, prompting, structured_output, evaluation, safety, serving]

  - key: mlops
    name: MLOps
    category: technical
    description: Operating ML systems — reproducibility, model registries, deployment, monitoring and compute management.
    rubric:
      levels:
        "1": Trains models in notebooks with no versioning, deployment or monitoring plan.
        "3": Versions data, code and models, deploys through a registry with canary or shadow releases and monitors drift and quality.
        "5": Builds ML platforms — reproducible pipelines, feature consistency, GPU scheduling and cost control — used by multiple teams.
      dimensions: [reproducibility, deployment, monitoring, pipelines, compute_management]

  # ------------------------------------------------------------ coding & design
  - key: data_structures
    name: Data Structures
    category: coding
    description: Choosing and using data structures (arrays, hash maps, stacks, queues, heaps, trees, graphs) for correctness and efficiency.
    rubric:
      levels:
        "1": Uses arrays for everything and cannot explain access or update costs.
        "3": Selects appropriate structures for the problem and states the complexity of key operations.
        "5": Combines structures fluently (e.g. hash map plus heap or linked list) to meet strict complexity targets and explains why alternatives fall short.
      dimensions: [selection, complexity, implementation, trade_offs]

  - key: algorithms
    name: Algorithms
    category: coding
    description: Designing correct algorithms — searching, sorting, two pointers, sliding windows, graph traversal, dynamic programming — and analysing their complexity.
    rubric:
      levels:
        "1": Reaches only brute-force solutions and cannot analyse their complexity.
        "3": Recognises standard patterns, derives an efficient solution with guidance and analyses time and space complexity correctly.
        "5": Derives optimal solutions independently, proves correctness informally and discusses alternative approaches and their trade-offs.
      dimensions: [pattern_recognition, correctness, complexity_analysis, optimisation]

  - key: code_quality
    name: Code Quality
    category: coding
    description: Writing readable, maintainable code — naming, structure, error handling and appropriate abstraction.
    rubric:
      levels:
        "1": Code is hard to follow — unclear names, duplicated logic, no handling of invalid states.
        "3": Code is readable and well structured with clear names, small functions and sensible handling of edge cases.
        "5": Code is idiomatic and easy to extend; abstractions fit the problem and the candidate explains the design choices made.
      dimensions: [readability, structure, naming, error_handling, idiomatic_use]

  - key: debugging
    name: Debugging
    category: coding
    description: Systematically finding the cause of defects — forming hypotheses, gathering evidence and verifying fixes.
    rubric:
      levels:
        "1": Changes code at random or guesses without evidence.
        "3": Reproduces issues, narrows them down with logs, tests or a debugger and verifies the fix.
        "5": Debugs complex, intermittent or distributed problems methodically and turns findings into prevention (tests, alerts, tooling).
      dimensions: [reproduction, hypothesis_testing, tooling, verification, prevention]

  - key: system_design
    name: System Design
    category: system_design
    description: Designing scalable, reliable systems from ambiguous requirements — scoping, components, data, capacity and trade-offs.
    rubric:
      levels:
        "1": Lists technologies without clarifying requirements or explaining how components interact.
        "3": Clarifies requirements, proposes a coherent architecture with a data model, estimates scale roughly and discusses major trade-offs.
        "5": Drives the design with explicit assumptions and numbers, anticipates failure modes and bottlenecks, and evolves the design as requirements change.
      dimensions: [requirements, architecture, data_modeling, scalability, reliability, trade_offs]

  - key: distributed_systems
    name: Distributed Systems
    category: system_design
    description: Reasoning about consistency, replication, partitioning, messaging and failure in distributed systems.
    rubric:
      levels:
        "1": Assumes networks are reliable and operations happen exactly once.
        "3": Explains consistency models, idempotency, retries, at-least-once delivery and replication trade-offs with examples.
        "5": Designs protocols and workflows (sagas, outbox, leader election) that remain correct under partial failure and explains their limits.
      dimensions: [consistency, replication, partitioning, messaging, failure_handling]

  - key: api_design
    name: API Design
    category: system_design
    description: Designing clear, evolvable and safe APIs — resources, errors, pagination, idempotency and versioning.
    rubric:
      levels:
        "1": Designs endpoints ad hoc without consistent semantics, error handling or versioning.
        "3": Designs consistent resource-oriented APIs with proper status codes, pagination, validation and idempotent operations.
        "5": Designs APIs for many consumers with explicit compatibility guarantees, deprecation paths and contract testing.
      dimensions: [resource_modeling, semantics, error_handling, pagination, idempotency, evolution]

  - key: problem_solving
    name: Problem Solving
    category: problem_solving
    description: Structuring ambiguous problems, reasoning step by step, using evidence and adapting when new information appears.
    rubric:
      levels:
        "1": Jumps to an answer without clarifying the problem or checking assumptions.
        "3": Clarifies the goal, breaks the problem down, considers alternatives and checks the result.
        "5": Frames the problem precisely, quantifies options, anticipates risks and adapts the approach quickly when assumptions change.
      dimensions: [framing, decomposition, reasoning, use_of_evidence, adaptability]

  # -------------------------------------------------------------- behavioural
  - key: communication
    name: Communication (content)
    category: communication
    description: Explaining ideas clearly and in a structured way for the audience — judged only on the content and organisation of what is said or written.
    rubric:
      levels:
        "1": Answers are hard to follow — unstructured, missing the point of the question or overloaded with irrelevant detail.
        "3": Answers are structured, address the question directly and adapt technical depth to the audience.
        "5": Explains complex topics crisply with well-chosen examples, checks understanding and summarises decisions and trade-offs.
      dimensions: [structure, relevance, clarity_of_content, audience_adaptation]

  - key: collaboration
    name: Collaboration
    category: behavioral
    description: Working effectively with others — sharing context, resolving disagreements constructively and helping the team succeed.
    rubric:
      levels:
        "1": Examples show working in isolation or handling disagreement unconstructively.
        "3": Gives concrete examples of resolving disagreements with evidence, sharing knowledge and supporting teammates.
        "5": Builds alignment across teams, turns conflict into better decisions and creates practices that improve how others collaborate.
      dimensions: [conflict_resolution, knowledge_sharing, cross_team_work, reliability]

  - key: ownership
    name: Ownership
    category: behavioral
    description: Taking responsibility for outcomes end to end — following through, owning mistakes and improving systems beyond the immediate task.
    rubric:
      levels:
        "1": Describes outcomes as happening to them; attributes problems to others.
        "3": Gives examples of driving work to completion, owning mistakes openly and fixing root causes.
        "5": Proactively takes on ambiguous, high-impact problems outside their remit and leaves durable improvements behind.
      dimensions: [accountability, follow_through, initiative, learning_from_mistakes]

  - key: adaptability
    name: Adaptability
    category: behavioral
    description: Responding effectively to changing priorities, new information and unfamiliar technology, as shown by concrete past actions.
    rubric:
      levels:
        "1": Examples show stalling or continuing the old plan after circumstances changed.
        "3": Gives examples of re-planning when priorities changed and learning unfamiliar tools to deliver.
        "5": Anticipates change, helps the team re-plan and learns new domains quickly enough to lead in them.
      dimensions: [re_planning, learning_new_tools, handling_ambiguity, outcome_under_change]

  - key: culture_values
    name: Working Values
    category: behavioral
    description: How the candidate's past actions reflect the organisation's stated working values — giving and receiving feedback, integrity in engineering decisions and inclusive teamwork.
    rubric:
      levels:
        "1": Examples are generic or show disregard for feedback, quality or agreed team norms.
        "3": Gives concrete examples of acting on feedback, raising quality or safety concerns and treating colleagues fairly.
        "5": Examples show consistently modelling these values under pressure and helping the team adopt them.
      dimensions: [feedback, integrity, inclusive_teamwork, quality_mindset]

  - key: motivation
    name: Motivation & Role Interest
    category: behavioral
    description: Why the candidate is interested in this role and what they want from their next position, as it relates to the work on offer.
    rubric:
      levels:
        "1": Cannot connect their interests to the role; answers are generic.
        "3": Explains specific reasons the role and its work fit their goals.
        "5": Shows a well-researched understanding of the role's challenges and articulates how their goals and the role's needs align.
      dimensions: [role_understanding, goal_alignment, specificity]

  - key: recruiter_fit
    name: Role Alignment & Logistics
    category: behavioral
    description: Job-related practical alignment — availability, the role's stated working arrangement, scope and level expectations and other requirements stated in the job posting.
    rubric:
      levels:
        "1": Key job requirements (availability, working arrangement, scope) are unclear or unaddressed.
        "3": Practical requirements are discussed clearly; any gaps are identified for the recruiter.
        "5": All stated job requirements are addressed clearly with any constraints and questions raised proactively.
      dimensions: [availability, working_arrangement, scope_expectations, open_questions]

  # --------------------------------------------------------------- leadership
  - key: leadership
    name: Technical Leadership
    category: leadership
    description: Setting technical direction, leading people through complex change and making sound decisions that others can follow.
    rubric:
      levels:
        "1": Describes leading as assigning tasks; cannot describe a decision they drove or its outcome.
        "3": Gives examples of leading a project or small team — setting direction, delegating, unblocking and delivering results.
        "5": Leads multi-team initiatives, sets technical strategy, makes and explains difficult trade-offs and grows the leaders around them.
      dimensions: [direction_setting, decision_making, delegation, influence, delivery]

  - key: mentoring
    name: Mentoring & Developing Others
    category: leadership
    description: Helping engineers grow — coaching, feedback, onboarding and creating opportunities.
    rubric:
      levels:
        "1": Mentoring examples are limited to answering questions when asked.
        "3": Gives concrete examples of coaching someone through a challenge, giving actionable feedback and improving onboarding.
        "5": Systematically develops people (growth plans, stretch assignments, sponsorship) with visible results in others' careers.
      dimensions: [coaching, feedback, onboarding, growth_outcomes]

  - key: stakeholder_management
    name: Stakeholder Management
    category: leadership
    description: Aligning with product, business and partner teams — managing expectations, negotiating scope and communicating risk.
    rubric:
      levels:
        "1": Avoids or escalates disagreements; surprises stakeholders with late bad news.
        "3": Sets expectations early, negotiates scope with data and keeps stakeholders informed of risks.
        "5": Builds trust with senior stakeholders, reframes conflicting goals into shared plans and communicates trade-offs at the right level.
      dimensions: [expectation_setting, negotiation, risk_communication, alignment]

  - key: project_management
    name: Project Delivery
    category: leadership
    description: Planning and delivering multi-step engineering work — estimation, sequencing, risk management and scope control.
    rubric:
      levels:
        "1": Plans are vague; risks and dependencies are discovered late.
        "3": Breaks work into milestones, estimates with ranges, tracks risks and adjusts scope to meet commitments.
        "5": Delivers complex multi-team programs predictably, with clear milestones, risk burn-down and transparent reporting.
      dimensions: [planning, estimation, risk_management, scope_control, execution]

  - key: product_sense
    name: Product Sense
    category: domain
    description: Connecting engineering decisions to user and business outcomes — prioritisation, success metrics and user empathy.
    rubric:
      levels:
        "1": Treats requirements as fixed tasks without asking who benefits or how success is measured.
        "3": Asks about user problems, proposes success metrics and weighs technical work against user impact.
        "5": Shapes the roadmap with data, balances debt against features explicitly and anticipates user needs.
      dimensions: [user_focus, prioritisation, success_metrics, trade_offs]

  # ------------------------------------------------------- role coverage (added)
  - key: csharp_dotnet
    name: C# / .NET
    category: technical
    description: Building and running services and applications in C# on modern .NET — async code, dependency injection, memory behaviour, data access and tooling.
    rubric:
      levels:
        "1": Writes simple C# classes but misuses async/await (blocking on tasks, async void) and cannot explain how the runtime manages memory.
        "3": Builds ASP.NET Core services with dependency injection, configuration, async I/O and Entity Framework or Dapper; avoids common deadlocks and N+1 queries and writes tests with xUnit or NUnit.
        "5": Profiles and tunes .NET workloads (allocations, GC modes, thread-pool starvation, Span/pooling), designs library and service boundaries, and plans framework upgrades across a large codebase.
      dimensions: [language_idioms, async_programming, runtime_and_memory, data_access, framework_design, tooling]

  - key: azure
    name: Microsoft Azure
    category: technical
    description: Building secure, reliable infrastructure on Microsoft Azure — Entra ID and RBAC, virtual networking, compute, managed data services and subscription governance.
    rubric:
      levels:
        "1": Recognises core Azure services but cannot explain resource groups, subscriptions or how a managed identity differs from a service principal secret.
        "3": Designs zone-redundant workloads with VNets, NSGs, private endpoints, App Service or AKS and managed databases; applies least-privilege RBAC with managed identities and troubleshoots connectivity.
        "5": Designs landing zones across many subscriptions with management groups, Azure Policy, hub-and-spoke networking, centralised monitoring and regional disaster recovery, and explains cost and resilience trade-offs.
      dimensions: [identity_access, networking, high_availability, managed_services, governance, disaster_recovery]

  - key: gcp
    name: Google Cloud Platform
    category: technical
    description: Building secure, reliable infrastructure on Google Cloud — IAM and service accounts, VPC design, compute and GKE, managed data services and organisation policy.
    rubric:
      levels:
        "1": Recognises core Google Cloud services but cannot explain the project and folder hierarchy or how service accounts are granted access.
        "3": Designs regional workloads with VPCs, firewall rules, load balancing, GKE or Cloud Run and managed databases; uses least-privilege IAM and workload identity and troubleshoots connectivity.
        "5": Designs organisation-wide platforms with shared VPC, organisation policies, VPC Service Controls, centralised logging and multi-region recovery, and justifies service choices on cost and reliability.
      dimensions: [identity_access, networking, high_availability, managed_services, governance, disaster_recovery]

  - key: network_engineering
    name: Network Engineering
    category: technical
    description: Designing, operating and troubleshooting enterprise, data-centre and hybrid networks — routing, switching, segmentation, firewalls, VPN and WAN connectivity.
    rubric:
      levels:
        "1": Knows the OSI layers and subnetting basics but cannot explain how traffic is routed between sites or isolate a reachability fault methodically.
        "3": Configures and troubleshoots VLANs, trunks, static and dynamic routing (OSPF, BGP), ACLs, firewalls and site-to-site VPNs, using packet captures and device counters to find faults.
        "5": Designs resilient multi-site and hybrid-cloud topologies with redundancy, route policy, segmentation and capacity planning, automates configuration, and runs safe changes on production networks.
      dimensions: [routing, switching, segmentation, firewalls_vpn, troubleshooting, design_and_capacity, automation]

  - key: database_administration
    name: Database Administration
    category: technical
    description: Keeping production databases available, recoverable and fast — backup and restore, replication and failover, upgrades, tuning, capacity and access control.
    rubric:
      levels:
        "1": Can run queries and basic maintenance but cannot describe how the database would be restored to a point in time or how replication works.
        "3": Runs tested backup and point-in-time recovery, configures replication and failover, tunes slow queries and server settings, and plans upgrades and schema changes with minimal downtime.
        "5": Designs database platforms for many teams with defined recovery objectives, automated failover, online migrations, capacity forecasting and auditing, and has led recovery from serious data incidents.
      dimensions: [backup_recovery, replication_failover, performance_tuning, upgrades_migrations, capacity_planning, access_control]

  - key: mobile_development
    name: Mobile App Development
    category: technical
    description: Building native or cross-platform mobile apps — app lifecycle, UI and state, offline behaviour, performance, device constraints and store releases.
    rubric:
      levels:
        "1": Has built simple screens but cannot explain the app lifecycle, background limits or how the app behaves on a poor network.
        "3": Builds production apps with sound state management, lifecycle handling, offline caching and sync, crash and performance monitoring, and a staged store release process.
        "5": Designs app architecture for large teams and long-lived codebases, optimises start-up, memory and battery use, manages API versioning across app versions in the field and runs safe rollouts with feature flags.
      dimensions: [platform_fundamentals, ui_and_state, offline_and_sync, performance, release_management, backward_compatibility]

  - key: test_automation
    name: Test Automation & Quality Engineering
    category: technical
    description: Designing test strategy and building maintainable automation frameworks across UI, API and integration levels, with reliable quality gates in delivery pipelines.
    rubric:
      levels:
        "1": Records or copies scripted UI tests but cannot explain what to automate, why tests are flaky or how failures are triaged.
        "3": Builds maintainable automation (page objects or screenplay patterns, API tests, test data management), runs it in CI with reporting, and reduces flaky tests by finding their causes.
        "5": Defines quality strategy for a product or organisation — risk-based coverage, test environments, contract and performance testing, quality metrics — and measurably shortens feedback time while catching more defects before release.
      dimensions: [test_strategy, framework_design, test_data, flakiness_control, ci_integration, quality_metrics]

  - key: data_engineering
    name: Data Engineering
    category: technical
    description: Building reliable batch and streaming data pipelines, warehouses and lakehouses — ingestion, transformation, orchestration, data modelling and data quality.
    rubric:
      levels:
        "1": Has written one-off extraction scripts but cannot explain idempotent loads, late-arriving data or how a pipeline failure would be detected.
        "3": Builds orchestrated, idempotent pipelines with incremental loads, dimensional or wide-table models, schema evolution handling and automated data quality checks.
        "5": Designs data platforms for many producers and consumers — streaming and batch trade-offs, data contracts, lineage, backfills at scale, cost and performance tuning — with measured freshness and quality targets.
      dimensions: [ingestion, transformation, orchestration, data_modeling, data_quality, scalability_and_cost]

  - key: data_analysis
    name: Data Analysis
    category: technical
    description: Turning raw data into reliable answers — framing the question, cleaning and exploring data, defining metrics and drawing conclusions that hold up to scrutiny.
    rubric:
      levels:
        "1": Produces numbers without checking data quality, metric definitions or whether the result actually answers the business question.
        "3": Frames the question, validates and cleans data, defines metrics precisely, explores segments and trends with SQL or Python, and states the limits of the conclusion.
        "5": Leads analyses that change decisions — anticipates confounders and data pitfalls, builds trusted metric definitions others reuse and quantifies the impact of recommendations.
      dimensions: [question_framing, data_preparation, exploratory_analysis, metric_definition, interpretation, impact]

  - key: statistics_experimentation
    name: Statistics & Experimentation
    category: technical
    description: Applying statistical reasoning to decisions — hypothesis testing, A/B test design, power and sample size, uncertainty and causal inference.
    rubric:
      levels:
        "1": Reads p-values as the probability that the result is true and cannot explain how long an experiment should run.
        "3": Designs A/B tests with a clear hypothesis, primary metric, power analysis and guardrails; interprets intervals correctly and avoids peeking and multiple-comparison mistakes.
        "5": Chooses methods for hard cases — network effects, low traffic, sequential testing, variance reduction, quasi-experimental and observational causal methods — and builds experimentation practice others rely on.
      dimensions: [hypothesis_design, power_and_sample_size, inference, experiment_pitfalls, causal_methods, decision_making]

  - key: data_visualization
    name: Data Visualisation & Reporting
    category: technical
    description: Presenting data so decision makers read it correctly — choosing chart forms, designing dashboards and reports, and keeping metrics consistent and trusted.
    rubric:
      levels:
        "1": Builds charts with default settings that obscure the message, mix inconsistent metrics or mislead through scale choices.
        "3": Chooses chart forms for the question, designs focused dashboards with clear definitions and filters, and builds them in a BI tool with sensible data models and refresh schedules.
        "5": Designs reporting for an organisation — a governed semantic layer, a small set of trusted dashboards, adoption tracking — and retires reports that nobody uses.
      dimensions: [chart_selection, dashboard_design, metric_consistency, narrative, bi_tooling, governance]

  - key: ux_research
    name: UX Research
    category: domain
    description: Learning what users need through appropriate research methods — planning studies, recruiting participants, interviewing, usability testing and synthesising findings into decisions.
    rubric:
      levels:
        "1": Relies on opinions or a single source of feedback and cannot describe how a study was planned or how findings were synthesised.
        "3": Chooses suitable methods (interviews, usability tests, surveys, analytics), writes unbiased discussion guides, synthesises findings into themes and links them to design changes.
        "5": Builds a research practice — mixed-method programmes, research operations, a shared insight repository — and shows how research changed product strategy with measurable results.
      dimensions: [study_planning, method_selection, interviewing_and_testing, synthesis, research_impact, research_ethics]

  - key: ux_design
    name: Interaction & Visual Design
    category: technical
    description: Designing usable product experiences — information architecture, interaction flows, prototyping, visual hierarchy and design systems.
    rubric:
      levels:
        "1": Produces screens without a clear user goal or flow and cannot explain the reasoning behind layout or interaction choices.
        "3": Designs end-to-end flows from user goals, prototypes and tests them, applies consistent visual hierarchy and uses or extends a design system with clear handoff to engineering.
        "5": Shapes complex product experiences across platforms, leads design system decisions, balances user, business and technical constraints and measures the effect of design changes.
      dimensions: [information_architecture, interaction_design, prototyping, visual_hierarchy, design_systems, design_rationale]

  - key: accessibility
    name: Accessibility
    category: technical
    description: Making digital products usable by everyone — WCAG criteria, semantic structure, keyboard and screen-reader support, colour contrast and accessibility testing.
    rubric:
      levels:
        "1": Treats accessibility as an optional final check and cannot name concrete WCAG requirements or how they would be tested.
        "3": Builds or designs with semantic structure, keyboard operability, focus management, labels and sufficient contrast, and tests with automated tools and a screen reader.
        "5": Embeds accessibility in the design system and delivery process — standards, audits, training, regression checks — and resolves complex cases such as custom widgets and dynamic content.
      dimensions: [standards_knowledge, semantic_structure, keyboard_and_focus, assistive_technology_support, testing, process_integration]

  - key: requirements_analysis
    name: Requirements Analysis
    category: domain
    description: Eliciting, analysing and documenting requirements — understanding the business problem, writing clear user stories and acceptance criteria, and managing scope and change.
    rubric:
      levels:
        "1": Records requests as stated without asking what problem they solve, and produces requirements that are ambiguous or untestable.
        "3": Elicits needs through interviews and workshops, separates problems from solutions, writes testable user stories with acceptance criteria and keeps requirements traceable as they change.
        "5": Leads analysis for complex multi-system initiatives, resolves conflicting requirements across groups, defines non-functional requirements and shows how the requirements work reduced rework.
      dimensions: [elicitation, problem_framing, documentation, acceptance_criteria, traceability, change_management]

  - key: process_modeling
    name: Business Process Modelling
    category: domain
    description: Mapping how work and data flow through a business today, finding gaps and inefficiencies, and designing improved processes and their system support.
    rubric:
      levels:
        "1": Describes processes informally and cannot show where handoffs, delays or data errors occur.
        "3": Models current and future processes with BPMN, swimlanes or data-flow diagrams, performs gap analysis and quantifies the effect of proposed changes.
        "5": Redesigns cross-functional processes end to end, aligns them with system capabilities and data ownership, and measures the improvement after rollout.
      dimensions: [current_state_mapping, gap_analysis, future_state_design, data_flow, impact_measurement]

  - key: technical_support
    name: Technical Support & Troubleshooting
    category: domain
    description: Resolving customer technical issues efficiently — triage and prioritisation, reproducing problems, gathering diagnostics, escalating well and feeding fixes back into the product and knowledge base.
    rubric:
      levels:
        "1": Follows scripts but cannot gather the information needed to reproduce a problem or decide when to escalate.
        "3": Triages by impact, reproduces issues, collects logs and environment details, works within SLAs, escalates with a clear summary and writes reusable knowledge-base articles.
        "5": Improves support at scale — spots trends across tickets, drives product fixes for top issues, builds diagnostics and runbooks, and measurably reduces resolution time or ticket volume.
      dimensions: [triage, reproduction_and_diagnosis, escalation, sla_management, knowledge_sharing, feedback_to_product]

  - key: customer_communication
    name: Customer Communication (content)
    category: communication
    description: Explaining technical problems, workarounds and next steps to customers and non-technical users clearly and accurately — judged only on the content and organisation of what is said or written.
    rubric:
      levels:
        "1": Explanations are vague, full of unexplained jargon or omit what the customer needs to do next.
        "3": Explains the issue, impact, workaround and next update time in plain language, and confirms the customer's situation before proposing a solution.
        "5": Handles complex or high-impact cases with precise, well-structured updates, sets realistic expectations and turns recurring explanations into reusable customer-facing guidance.
      dimensions: [clarity_of_content, expectation_setting, accuracy, next_steps, written_guidance]

  - key: agile_delivery
    name: Agile Delivery Practices
    category: domain
    description: Running iterative delivery well — backlog refinement, planning and review ceremonies, flow metrics, impediment removal and continuous improvement of the team's process.
    rubric:
      levels:
        "1": Describes agile as a set of meetings and cannot explain how the team decides what to work on or measures its flow.
        "3": Facilitates refinement, planning, reviews and retrospectives with clear outcomes, tracks flow metrics (cycle time, throughput, work in progress) and removes impediments.
        "5": Coaches several teams or an organisation, adapts frameworks to context, coordinates cross-team dependencies and shows measurable improvements in predictability and lead time.
      dimensions: [backlog_management, facilitation, flow_metrics, impediment_removal, continuous_improvement, scaling_practices]

  - key: people_management
    name: People Management
    category: leadership
    description: Managing an engineering team's performance and growth — setting expectations, regular one-to-ones, performance feedback, hiring and building a healthy, productive team.
    rubric:
      levels:
        "1": Describes management as status tracking; cannot give an example of addressing underperformance or setting clear expectations.
        "3": Gives concrete examples of setting goals, running effective one-to-ones, addressing performance issues with documented feedback and running a structured hiring process.
        "5": Builds and scales teams — fair performance and promotion processes, succession, retention of strong engineers — and shows measurable improvement in team delivery and health over time.
      dimensions: [expectation_setting, performance_feedback, hiring, team_health, career_development, organisation_design]

  # ---------------------------------------------------------- intake interview
  # The seven Intake Interview competencies (round_type intake) are communication and adaptability
  # above plus the five below. Their anchors mirror the sanitised anchors of the intake kit
  # (samples/intake/intake_kit_v1.yaml, the scoring source; the intake pipeline never reads these).
  # structured_answer says "openly" where the kit says "honestly": the catalog lint keeps demeanour
  # words out of evaluator-facing text.
  - key: technical_reading
    name: Technical Reading & Relay
    category: communication
    description: Reading a technical passage aloud completely and fluently (Drill A) and relaying its key ideas in one's own words after 30 seconds of silent reading (Drill B).
    rubric:
      levels:
        "1": Stumbles, robotic, or freezes on relay
        "3": Reads okay, weak paraphrase
        "5": Fluent, natural, relays in own words
      dimensions: [reading_completeness, reading_pace, concept_coverage, own_words_relay]

  - key: structured_answer
    name: Structured Answer / Gap-Filling
    category: communication
    description: Connecting the four points of a general topic into one structured, flowing answer and handling the points they know less about openly, without inventing facts.
    rubric:
      levels:
        "1": Can't connect the bullets; points come out disjointed, are skipped, or are covered with made-up facts
        "3": Covers the points woodenly
        "5": Connects all points into a natural flow and handles gaps openly and gracefully, without inventing facts
      dimensions: [point_coverage, flow, use_of_examples, gap_handling]

  - key: technical
    name: Actual Technical Ability
    category: technical
    description: "Real technical depth versus what the résumé claims: explains their own tools, decisions and results, and the self-rating holds up under a short language check."
    rubric:
      levels:
        "1": Buzzwords only, can't explain own résumé
        "3": Real but shallow depth
        "5": Solid depth, explains clearly
      dimensions: [resume_claim_depth, language_fundamentals, self_rating_calibration]

  - key: trainability
    name: Trainability & Learning Attitude
    category: behavioral
    description: A real, described learning process, commitment to the training, and the ability to teach back something recently learned.
    rubric:
      levels:
        "1": Rigid, no learning process
        "3": Willing but passive
        "5": Hungry, self-directed, learns fast
      dimensions: [learning_process, training_commitment, teach_back]

  - key: composure
    name: Confidence & Composure
    category: behavioral
    description: "Observable behaviour under mild pressure: keeps going when unsure, handles follow-ups and challenges, and recovers from mistakes."
    rubric:
      levels:
        "1": Stops or abandons answers when unsure or challenged, and does not recover from mistakes
        "3": Keeps going on familiar ground but stalls when unsure or challenged
        "5": Keeps going when unsure, handles follow-ups and challenges, and recovers from mistakes cleanly
      dimensions: [continuing_when_unsure, handling_follow_ups, recovering_from_mistakes]
