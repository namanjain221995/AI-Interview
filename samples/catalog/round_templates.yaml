          dimensions: [consistency]
      question_strategy:
        style: [experience_deep_dive, scenario, coding_exercise, star_behavioral]
        max_followup_depth: 3
        prefer_curated_ratio: 0.4
        allow_generated_questions: true
        adaptive_difficulty: true
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 2
      confidence_threshold: 0.65
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 18, min_questions: 5, max_questions: 14}
