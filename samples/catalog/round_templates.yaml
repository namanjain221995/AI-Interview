# Default interview round templates — one per RoundType
# (interview_templates.organization_id = NULL, is_default = true).
#
# Each `config` is a complete app.schemas.rounds.RoundConfig (round_type and
# name are injected from the template entry). Jobs start from these defaults
# and override what they need (see samples/jobs/*.yaml).
#
# Conventions
# * Competency keys come from catalog/competencies.yaml. The defaults here are
#   generic; job rounds replace them with role-specific competencies.
# * Rubric category weights sum to 100. `competency_keys` must be competencies
#   of the round; `dimensions` are answer-evaluation dimensions
#   (app.schemas.ai.DimensionScores fields plus the numeric CodingEvaluation
#   criteria code_quality, problem_solving, edge_case_handling,
#   testing_approach).
# * question_strategy.style vocabulary: experience_deep_dive, scenario,
#   conceptual, resume_claim_verification, conversational, motivation,
#   logistics, tradeoff_probe, failure_mode_probe, scale_probe,
#   design_exercise, coding_exercise, complexity_probe, edge_case_probe,
#   estimation, debugging_walkthrough, star_behavioral, strategy.
# * Recommendations are advisory; a human reviewer owns every decision.
version: 1
templates:
  # ------------------------------------------------------------------------
  - round_type: resume_screening
    name: Resume Screening
    description: Short, evidence-focused walk-through of the candidate's resume that verifies the most important experience claims for the job.
    config:
      duration_minutes: 15
      max_duration_minutes: 20
      expected_difficulty: easy
      difficulty_distribution: {easy: 0.4, medium: 0.45, hard: 0.15}
      competencies:
        - {key: ownership, weight: 1.0, focus_areas: [personal_contribution, decisions_made, outcomes]}
        - {key: problem_solving, weight: 0.8, focus_areas: [challenges_faced, approach]}
        - {key: communication, weight: 0.6, required: false, focus_areas: [structure, clarity_of_content]}
      rubric:
        - key: claim_verification
          label: Claim Verification
          weight: 40
          dimensions: [consistency, specificity]
          description: Resume claims are supported by specific, consistent detail (scale, role, tools, numbers).
        - key: depth_of_experience
          label: Depth of Experience
          weight: 25
          competency_keys: [ownership]
          dimensions: [practical_experience, depth]
          description: Hands-on understanding of the work described, beyond surface-level familiarity.
        - key: impact
          label: Impact & Outcomes
          weight: 15
          dimensions: [completeness]
          description: Results are explained with how they were measured and what the candidate's part was.
        - key: problem_solving
          label: Problem Solving
          weight: 10
          competency_keys: [problem_solving]
          dimensions: [reasoning]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
      question_strategy:
        style: [resume_claim_verification, experience_deep_dive]
        max_followup_depth: 3
        prefer_curated_ratio: 0.1
        allow_generated_questions: true
        adaptive_difficulty: true
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 2
      confidence_threshold: 0.65
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 8, min_questions: 4, max_questions: 12}
      coding: {enabled: false}
      resume_validation: {enabled: true, max_claims: 6, min_priority: 2}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 65
        borderline_min_score: 50
        min_confidence: 0.6
        min_required_coverage: 0.75
      instructions: >-
        This short round walks through the experience on your resume. Expect questions about specific
        projects, what you personally did and how results were achieved. Concrete examples and numbers help
        most. If you don't remember a detail, it's fine to say so.
      interviewer_notes: >-
        Verify the highest-priority resume claims first. Never assume a claim is true: ask what the candidate
        personally did, the scale involved, the key decisions and how outcomes were measured. Raise apparent
        inconsistencies (for example overlapping dates) neutrally as a request for clarification, never as an
        accusation. Never ask about the personal reasons behind employment gaps.

  # ------------------------------------------------------------------------
  - round_type: recruiter_screening
    name: Recruiter Screening
    description: Conversational screen covering motivation, role alignment, working values and the practical requirements stated in the job posting.
    config:
      duration_minutes: 20
      max_duration_minutes: 25
      expected_difficulty: easy
      difficulty_distribution: {easy: 0.6, medium: 0.4, hard: 0.0}
      competencies:
        - {key: motivation, weight: 1.0, focus_areas: [role_understanding, goal_alignment]}
        - {key: recruiter_fit, weight: 1.2, focus_areas: [availability, working_arrangement, scope_expectations]}
        - {key: culture_values, weight: 0.8, focus_areas: [feedback, teamwork]}
        - {key: communication, weight: 0.6, required: false, focus_areas: [structure, relevance]}
      rubric:
        - key: role_motivation
          label: Role Motivation
          weight: 25
          competency_keys: [motivation]
          dimensions: [relevance]
        - key: role_alignment
          label: Role Alignment & Logistics
          weight: 30
          competency_keys: [recruiter_fit]
          dimensions: [completeness]
        - key: working_values
          label: Working Values
          weight: 20
          competency_keys: [culture_values]
          dimensions: [specificity]
        - key: communication_content
          label: Communication Content
          weight: 15
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: resume_consistency
          label: Resume Consistency
          weight: 10
          dimensions: [consistency]
      question_strategy:
        style: [conversational, motivation, logistics]
        max_followup_depth: 2
        prefer_curated_ratio: 0.6
        allow_generated_questions: true
        adaptive_difficulty: false
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 2
      confidence_threshold: 0.6
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 8, min_questions: 5, max_questions: 14}
      coding: {enabled: false}
      resume_validation: {enabled: true, max_claims: 2, min_priority: 3}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 60
        borderline_min_score: 45
        min_confidence: 0.55
        min_required_coverage: 0.75
      instructions: >-
        A relaxed conversation about your background, what you're looking for in your next role and the
        practical details of this position. There are no trick questions — answer as you would with a
        recruiter, and feel free to ask questions at the end.
      interviewer_notes: >-
        Ask only job-related questions. Never ask about age, family or marital status, health or disability,
        religion, national origin or citizenship, or current or past salary; leave legal work-eligibility
        checks to the human recruiter. Compare practical answers against the requirements stated in the job
        posting and record gaps neutrally for the recruiter.

  # ------------------------------------------------------------------------
  - round_type: technical_screening
    name: Technical Screening
    description: Thirty-minute technical conversation probing core knowledge, practical experience and problem solving for the role.
    config:
      duration_minutes: 30
      max_duration_minutes: 35
      expected_difficulty: medium
      difficulty_distribution: {easy: 0.3, medium: 0.4, hard: 0.3}
      competencies:
        - {key: problem_solving, weight: 1.0, focus_areas: [approach, trade_offs]}
        - {key: debugging, weight: 1.0, focus_areas: [reproduction, hypothesis_testing]}
        - {key: databases, weight: 1.0, focus_areas: [indexing, transactions]}
        - {key: api_design, weight: 0.8, focus_areas: [semantics, idempotency]}
        - {key: system_design, weight: 0.8, focus_areas: [architecture, scalability]}
        - {key: testing, weight: 0.6, required: false, focus_areas: [test_levels]}
        - {key: communication, weight: 0.6, required: false, focus_areas: [structure]}
      rubric:
        - key: technical_knowledge
          label: Technical Knowledge
          weight: 30
          competency_keys: [databases, api_design, testing, debugging]
          dimensions: [correctness, depth]
        - key: problem_solving
          label: Problem Solving
          weight: 20
          competency_keys: [problem_solving]
          dimensions: [reasoning]
        - key: practical_experience
          label: Practical Experience
          weight: 20
          dimensions: [practical_experience, specificity]
        - key: system_design
          label: System Design
          weight: 15
          competency_keys: [system_design]
          dimensions: [architecture_awareness, tradeoff_understanding]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: resume_consistency
          label: Resume Consistency
          weight: 5
          dimensions: [consistency]
      question_strategy:
        style: [experience_deep_dive, scenario, conceptual]
        max_followup_depth: 4
        prefer_curated_ratio: 0.4
        allow_generated_questions: true
        adaptive_difficulty: true
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 3
      confidence_threshold: 0.7
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 15, min_questions: 6, max_questions: 20}
      coding: {enabled: false}
      resume_validation: {enabled: true, max_claims: 3, min_priority: 3}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 65
        borderline_min_score: 50
        min_confidence: 0.6
        min_required_coverage: 0.75
      instructions: >-
        We'll talk through technical topics related to the role — a mix of questions about your own projects
        and practical scenarios. Thinking out loud is welcome, and it's fine to ask for clarification or to say
        you're not sure about something.
      interviewer_notes: >-
        Start from the candidate's own experience, then move to scenarios. Ask one question at a time and follow
        up on vague answers by asking for specifics (numbers, tools, decisions, failure cases). Raise difficulty
        after strong answers and simplify after two weak ones. Spend roughly equal evidence effort on each required
        competency before going deeper on any single one.

  # ------------------------------------------------------------------------
  - round_type: deep_technical
    name: Deep Technical Interview
    description: Forty-five minutes of in-depth technical discussion that stress-tests expertise, failure-mode reasoning and trade-offs.
    config:
      duration_minutes: 45
      max_duration_minutes: 55
      expected_difficulty: hard
      difficulty_distribution: {easy: 0.15, medium: 0.45, hard: 0.4}
      competencies:
        - {key: distributed_systems, weight: 1.2, focus_areas: [consistency, failure_handling]}
        - {key: databases, weight: 1.0, focus_areas: [scaling, migrations]}
        - {key: system_design, weight: 1.0, focus_areas: [reliability, trade_offs]}
        - {key: debugging, weight: 0.8, focus_areas: [hypothesis_testing, tooling]}
        - {key: problem_solving, weight: 0.8, focus_areas: [reasoning]}
        - {key: communication, weight: 0.5, required: false}
      rubric:
        - key: technical_depth
          label: Technical Depth
          weight: 35
          competency_keys: [distributed_systems, databases]
          dimensions: [depth, correctness]
        - key: problem_solving
          label: Problem Solving & Debugging
          weight: 20
          competency_keys: [problem_solving, debugging]
          dimensions: [reasoning]
        - key: practical_experience
          label: Practical Experience
          weight: 20
          dimensions: [practical_experience, specificity]
        - key: architecture_tradeoffs
          label: Architecture & Trade-offs
          weight: 15
          competency_keys: [system_design]
          dimensions: [architecture_awareness, tradeoff_understanding]
        - key: communication_content
          label: Communication Content
          weight: 5
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: resume_consistency
          label: Resume Consistency
          weight: 5
          dimensions: [consistency]
      question_strategy:
        style: [experience_deep_dive, scenario, tradeoff_probe, failure_mode_probe]
        max_followup_depth: 6
        prefer_curated_ratio: 0.3
        allow_generated_questions: true
        adaptive_difficulty: true
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 4
      confidence_threshold: 0.75
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 25, min_questions: 6, max_questions: 18}
      coding: {enabled: false}
      resume_validation: {enabled: true, max_claims: 4, min_priority: 3}
      passing_guidance:
        strong_proceed_min_score: 82
        proceed_min_score: 68
        borderline_min_score: 52
        min_confidence: 0.65
        min_required_coverage: 0.8
      instructions: >-
        This is an in-depth technical conversation. Expect follow-up questions that go several levels deep into
        how systems behave, fail and scale. It's completely fine to reason out loud, state assumptions and say
        where your experience ends.
      interviewer_notes: >-
        Go deep rather than broad: pick the candidate's strongest relevant project and probe internals, failure
        modes, scaling limits and alternatives they rejected. Keep asking "why" and "what happens when" until the
        candidate reaches the edge of their knowledge, then move on politely. Distinguish first-hand experience
        from second-hand knowledge.

  # ------------------------------------------------------------------------
  - round_type: coding
    name: Coding Interview
    description: Live coding round in the browser editor with real test execution, graduated hints and discussion of approach and complexity.
    config:
      duration_minutes: 45
      max_duration_minutes: 50
      expected_difficulty: medium
      difficulty_distribution: {easy: 0.25, medium: 0.5, hard: 0.25}
      competencies:
        - {key: algorithms, weight: 1.2, focus_areas: [pattern_recognition, complexity_analysis]}
        - {key: data_structures, weight: 1.0, focus_areas: [selection, complexity]}
        - {key: code_quality, weight: 1.0, focus_areas: [readability, structure]}
        - {key: problem_solving, weight: 1.0, focus_areas: [decomposition, reasoning]}
        - {key: debugging, weight: 0.6, focus_areas: [verification]}
        - {key: communication, weight: 0.6, required: false, focus_areas: [explaining_approach]}
      rubric:
        - key: correctness_testing
          label: Correctness & Testing
          weight: 30
          dimensions: [correctness, edge_case_handling, testing_approach]
        - key: problem_solving
          label: Problem Solving & Approach
          weight: 20
          competency_keys: [problem_solving]
          dimensions: [problem_solving, reasoning]
        - key: algorithms_complexity
          label: Algorithms & Complexity
          weight: 20
          competency_keys: [algorithms, data_structures]
        - key: code_quality
          label: Code Quality
          weight: 15
          competency_keys: [code_quality]
          dimensions: [code_quality]
        - key: debugging
          label: Debugging
          weight: 5
          competency_keys: [debugging]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
      question_strategy:
        style: [coding_exercise, complexity_probe, edge_case_probe]
        max_followup_depth: 3
        prefer_curated_ratio: 0.3
        allow_generated_questions: true
        adaptive_difficulty: true
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 2
      confidence_threshold: 0.65
      stopping: {stop_on_sufficient_evidence: false, min_duration_minutes: 25, min_questions: 2, max_questions: 10}
      coding:
        enabled: true
        duration_minutes: 35
        languages: [python, javascript, typescript, java, go, cpp]
        difficulty: medium
        allow_generated: false
        max_problems: 2
        hints_enabled: true
        max_hints: 3
        hint3_may_reveal_solution: false
        restrict_paste: true
        large_paste_threshold_chars: 200
        proactive_comments: true
        min_seconds_between_comments: 90
        start_after_minutes: 3
      resume_validation: {enabled: false, max_claims: 0, min_priority: 5}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 65
        borderline_min_score: 50
        min_confidence: 0.6
        min_required_coverage: 0.75
      instructions: >-
        You'll solve a coding problem in the editor using the language you're most comfortable with. You can run
        the visible tests as often as you like before submitting. Please talk through your approach as you go;
        up to three hints are available if you get stuck, and using one is not a failure.
      interviewer_notes: >-
        Let the candidate read the problem and ask clarifying questions before coding. Stay quiet while they make
        progress; comment only on long stalls, repeated failing runs or a clear bug, and never dictate code. After
        a working solution, ask about complexity, edge cases and how they would test it. Hints are graduated: give
        the lowest level that unblocks them. Large pastes are recorded for the reviewer, not treated as proof of
        anything.

  # ------------------------------------------------------------------------
  - round_type: system_design
    name: System Design Interview
    description: Collaborative design of a scalable system from ambiguous requirements, focusing on architecture, data, reliability and trade-offs.
    config:
      duration_minutes: 45
      max_duration_minutes: 55
      expected_difficulty: hard
      difficulty_distribution: {easy: 0.1, medium: 0.5, hard: 0.4}
      competencies:
        - {key: system_design, weight: 2.0, focus_areas: [requirements, architecture, scalability, trade_offs]}
        - {key: distributed_systems, weight: 1.0, focus_areas: [consistency, replication, failure_handling]}
        - {key: databases, weight: 1.0, focus_areas: [data_modeling, scaling]}
        - {key: api_design, weight: 0.8, focus_areas: [resource_modeling, pagination]}
        - {key: security, weight: 0.5, required: false, focus_areas: [identity_access]}
        - {key: communication, weight: 0.6, required: false, focus_areas: [structure]}
      rubric:
        - key: requirements_scoping
          label: Requirements & Scoping
          weight: 15
          dimensions: [completeness, relevance]
          description: Clarifies functional and non-functional requirements and states assumptions with numbers.
        - key: architecture
          label: Architecture
          weight: 25
          competency_keys: [system_design, api_design]
          dimensions: [architecture_awareness]
        - key: scalability_reliability
          label: Scalability & Reliability
          weight: 20
          competency_keys: [distributed_systems]
          dimensions: [depth]
        - key: data_modeling
          label: Data Modeling & Storage
          weight: 15
          competency_keys: [databases]
          dimensions: [correctness]
        - key: tradeoffs_security
          label: Trade-offs & Security
          weight: 15
          competency_keys: [security]
          dimensions: [tradeoff_understanding, reasoning]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
      question_strategy:
        style: [design_exercise, tradeoff_probe, scale_probe, failure_mode_probe]
        max_followup_depth: 6
        prefer_curated_ratio: 0.5
        allow_generated_questions: true
        adaptive_difficulty: true
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 3
      confidence_threshold: 0.7
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 30, min_questions: 3, max_questions: 14}
      coding: {enabled: false}
      resume_validation: {enabled: true, max_claims: 2, min_priority: 4}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 65
        borderline_min_score: 50
        min_confidence: 0.6
        min_required_coverage: 0.75
      instructions: >-
        We'll design a system together. Start by asking questions to clarify what's needed, then sketch the main
        components and data flow out loud. There's no single right answer — we're interested in how you reason
        about scale, reliability and trade-offs.
      interviewer_notes: >-
        Present one design prompt and let the candidate drive. Answer clarifying questions with concrete numbers.
        Push on the weakest part of the design (bottlenecks, single points of failure, data growth) and introduce a
        requirement change halfway to see how they adapt. Reward explicit trade-offs over buzzwords.

  # ------------------------------------------------------------------------
  - round_type: problem_solving
    name: Problem Solving Interview
    description: Reasoning-focused round with practical scenarios, estimation and debugging walk-throughs rather than live coding.
    config:
      duration_minutes: 30
      max_duration_minutes: 35
      expected_difficulty: medium
      difficulty_distribution: {easy: 0.3, medium: 0.45, hard: 0.25}
      competencies:
        - {key: problem_solving, weight: 2.0, focus_areas: [framing, decomposition, reasoning]}
        - {key: debugging, weight: 1.0, focus_areas: [hypothesis_testing]}
        - {key: algorithms, weight: 0.8, focus_areas: [complexity_analysis]}
        - {key: communication, weight: 0.6, required: false, focus_areas: [structure]}
      rubric:
        - key: problem_framing
          label: Problem Framing
          weight: 20
          competency_keys: [problem_solving]
          dimensions: [relevance, completeness]
        - key: reasoning
          label: Reasoning & Approach
          weight: 30
          competency_keys: [problem_solving, algorithms]
          dimensions: [reasoning]
        - key: solution_quality
          label: Solution Quality
          weight: 25
          competency_keys: [algorithms]
          dimensions: [correctness, depth]
        - key: evidence_debugging
          label: Use of Evidence & Debugging
          weight: 15
          competency_keys: [debugging]
          dimensions: [specificity]
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
      question_strategy:
        style: [scenario, estimation, debugging_walkthrough, conceptual]
        max_followup_depth: 5
        prefer_curated_ratio: 0.5
        allow_generated_questions: true
        adaptive_difficulty: true
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 3
      confidence_threshold: 0.7
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 15, min_questions: 4, max_questions: 14}
      coding: {enabled: false}
      resume_validation: {enabled: false, max_claims: 0, min_priority: 5}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 65
        borderline_min_score: 50
        min_confidence: 0.6
        min_required_coverage: 0.75
      instructions: >-
        We'll work through a few practical problems together. Please think out loud — the way you break a problem
        down matters more than reaching a perfect answer. Ask for any information you'd want in a real situation.
      interviewer_notes: >-
        Give scenarios with deliberately incomplete information and reward candidates who ask for the missing
        pieces. Add a new constraint after an initial answer to observe how they adapt. Score the reasoning path,
        not only the final answer.

  # ------------------------------------------------------------------------
  - round_type: behavioral
    name: Behavioral Interview
    description: STAR-based conversation about past situations that shows ownership, collaboration, adaptability and working values.
    config:
      duration_minutes: 30
      max_duration_minutes: 35
      expected_difficulty: medium
      difficulty_distribution: {easy: 0.35, medium: 0.45, hard: 0.2}
      competencies:
        - {key: ownership, weight: 1.2, focus_areas: [accountability, follow_through]}
        - {key: collaboration, weight: 1.0, focus_areas: [conflict_resolution, cross_team_work]}
        - {key: adaptability, weight: 0.8, focus_areas: [re_planning, learning_new_tools]}
        - {key: problem_solving, weight: 0.8, focus_areas: [reasoning, use_of_evidence]}
        - {key: culture_values, weight: 0.8, focus_areas: [feedback, integrity]}
        - {key: communication, weight: 0.6, required: false, focus_areas: [structure]}
      rubric:
        - key: situation_task
          label: Situation & Task
          weight: 10
          dimensions: [relevance]
          description: A specific, real situation with clear stakes and the candidate's responsibility in it.
        - key: actions_ownership
          label: Actions & Ownership
          weight: 35
          competency_keys: [ownership, collaboration, adaptability, problem_solving]
          dimensions: [depth, practical_experience]
          description: What the candidate personally did and why, as distinct from what the team did.
        - key: results_impact
          label: Results & Impact
          weight: 25
          dimensions: [specificity, completeness]
          description: Concrete, preferably measurable outcomes and the candidate's contribution to them.
        - key: reflection_learning
          label: Reflection & Learning
          weight: 15
          competency_keys: [culture_values]
          dimensions: [reasoning]
          description: What the candidate learned and what they changed afterwards.
        - key: communication_content
          label: Communication Content
          weight: 10
          competency_keys: [communication]
          dimensions: [communication_clarity]
        - key: consistency
          label: Consistency
          weight: 5
          dimensions: [consistency]
      question_strategy:
        style: [star_behavioral, experience_deep_dive]
        max_followup_depth: 3
        prefer_curated_ratio: 0.6
        allow_generated_questions: true
        adaptive_difficulty: false
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 2
      confidence_threshold: 0.65
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 15, min_questions: 4, max_questions: 10}
      coding: {enabled: false}
      resume_validation: {enabled: true, max_claims: 2, min_priority: 3}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 65
        borderline_min_score: 50
        min_confidence: 0.6
        min_required_coverage: 0.75
      instructions: >-
        We'll talk about real situations from your past work. A helpful structure is: the situation, what you
        needed to achieve, what you did, and how it turned out. Examples from any setting are welcome — work,
        study, open source or volunteering.
      interviewer_notes: >-
        Use STAR: ask for one specific situation, then probe what the candidate personally did ("what did you do?"
        rather than "what did the team do?"), the outcome with evidence and what they learned. If an answer is
        hypothetical, ask for a real example. Evaluate only the content of the examples — never personality,
        emotion, confidence or delivery style.

