        - key: people_leadership
          label: People Leadership & Development
          weight: 25
          competency_keys: [leadership, mentoring]
          dimensions: [practical_experience]
        - key: delivery_execution
          label: Delivery & Execution
          weight: 25
          competency_keys: [project_management]
          dimensions: [specificity, completeness]
        - key: stakeholder_management
          label: Stakeholder Management
          weight: 20
          competency_keys: [stakeholder_management]
          dimensions: [depth]
        - key: decision_making
          label: Decision Making
          weight: 15
          dimensions: [reasoning, tradeoff_understanding]
        - key: collaboration_communication
          label: Collaboration & Communication
          weight: 15
          competency_keys: [collaboration, communication]
          dimensions: [communication_clarity]
      question_strategy:
        style: [star_behavioral, scenario, experience_deep_dive]
        max_followup_depth: 4
        prefer_curated_ratio: 0.6
        allow_generated_questions: true
        adaptive_difficulty: false
        allow_candidate_questions_at_end: true
      min_evidence_per_competency: 2
      confidence_threshold: 0.65
      stopping: {stop_on_sufficient_evidence: true, min_duration_minutes: 25, min_questions: 5, max_questions: 12}
      coding: {enabled: false}
      resume_validation: {enabled: true, max_claims: 3, min_priority: 3}
      passing_guidance:
        strong_proceed_min_score: 80
        proceed_min_score: 65
        borderline_min_score: 50
        min_confidence: 0.6
        min_required_coverage: 0.75
      instructions: >-
        We'll discuss how you lead and support a team: delivering work, developing people and working with
        stakeholders. Specific examples from your experience are the most useful answers.
      interviewer_notes: >-
        Look for concrete examples with the candidate's own decisions and their outcomes. When discussing
        performance or people issues, keep the focus on observable work and how the candidate supported the
        person; do not ask for or accept personal details about third parties. Probe how they measured delivery
        and team health.

