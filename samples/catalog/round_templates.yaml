        enabled: true
        duration_minutes: 10
        languages: [python, javascript, typescript, java, go, cpp]
        difficulty: easy
        allow_generated: false
        max_problems: 1
        hints_enabled: true
        max_hints: 3
        hint3_may_reveal_solution: false
        restrict_paste: true
        large_paste_threshold_chars: 200
        proactive_comments: true
        min_seconds_between_comments: 60
