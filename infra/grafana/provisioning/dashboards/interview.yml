# Grafana dashboard provisioning. The JSON files are generated by
# infra/grafana/generate_dashboards.py (`make dashboards`); edit the generator,
# not the JSON. UI edits cannot be saved over provisioned dashboards: use
# "Save as" for experiments, then port the change to the generator.
apiVersion: 1

providers:
  - name: interview
    orgId: 1
    folder: Interview Platform
    folderUid: interview-platform
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
