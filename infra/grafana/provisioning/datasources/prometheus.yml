# Grafana datasource provisioning: the platform's Prometheus (host networking,
# loopback only). Dashboards reference it by uid "prometheus".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9191
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      # Matches the scrape interval so $__rate_interval covers >= 4 samples.
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 3.2.1
      cacheLevel: Low
