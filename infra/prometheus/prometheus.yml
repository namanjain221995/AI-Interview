# =============================================================================
# Prometheus — AI Interview Platform (compose service `prometheus`)
#
# Runs with host networking and listens on 127.0.0.1:9191 only. Every target
# below is a loopback (or docker-bridge) address on this host.
#
#   validate:  make prom-check     (promtool check config + rules, promtool test rules)
#   reload:    make prom-reload    (POST /-/reload; --web.enable-lifecycle is on)
#
# Shared endpoints owned by another stack (vLLM, the DGX GPU exporter and the
# host node-exporter) are scraped read-only; nothing here changes them.
# Whisper (172.17.0.1:30007) exposes no /metrics (404), so speech-to-text is
# observed through the API's interview_stt_latency_seconds and
# interview_model_call_failures_total{endpoint="whisper"} instead.
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: interview

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9191"]
        labels:
          service: prometheus

  # ---------------------------------------------------------------------------
  # Platform services (metric names: docs/design/CONTRACTS.md section 8)
  # ---------------------------------------------------------------------------
  - job_name: interview-api
    static_configs:
      - targets: ["127.0.0.1:8200"]
        labels:
          service: api

  - job_name: interview-worker
    static_configs:
      - targets: ["127.0.0.1:8201"]
        labels:
          service: worker

  - job_name: interview-tts
    static_configs:
      - targets: ["127.0.0.1:8210"]
        labels:
          service: tts

  - job_name: interview-sandbox
    static_configs:
      - targets: ["127.0.0.1:8220"]
        labels:
          service: sandbox

  # Caddy request metrics; the edge answers /__edge/metrics to loopback only.
  - job_name: interview-edge
    metrics_path: /__edge/metrics
    static_configs:
      - targets: ["127.0.0.1:3200"]
        labels:
          service: edge

  # ---------------------------------------------------------------------------
  # Stateful infrastructure exporters (compose services postgres-exporter and
  # redis-exporter on the backend network, published on loopback)
  # ---------------------------------------------------------------------------
  - job_name: postgres
    static_configs:
      - targets: ["127.0.0.1:9192"]
        labels:
          service: postgres

  - job_name: redis
    static_configs:
      - targets: ["127.0.0.1:9193"]
        labels:
          service: redis

  # ---------------------------------------------------------------------------
  # Shared local AI endpoints (read-only). The `endpoint` label matches the
  # API's own label values (main, vision, embedding, reranker) so model-side
  # and client-side series can be joined in dashboards.
  # ---------------------------------------------------------------------------
  - job_name: vllm
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          endpoint: main
      - targets: ["127.0.0.1:8002"]
        labels:
          endpoint: vision
      - targets: ["127.0.0.1:8003"]
        labels:
          endpoint: embedding
      - targets: ["127.0.0.1:8005"]
        labels:
          endpoint: reranker
    metric_relabel_configs:
      # Keep the engine series and process basics; each server's HTTP
      # middleware series add cardinality and nothing we chart.
      - source_labels: [__name__]
        regex: "vllm:.*|process_(cpu_seconds_total|resident_memory_bytes|start_time_seconds)"
        action: keep
      - source_labels: [__name__]
        regex: ".*_created"
        action: drop

  - job_name: dgx-gpu
    static_configs:
      - targets: ["127.0.0.1:9835"]
        labels:
          service: gpu
    metric_relabel_configs:
      # Per-process GPU memory carries PIDs of another stack: high churn.
      - source_labels: [__name__]
        regex: "dgx_gpu_process_memory_bytes"
        action: drop

  - job_name: host
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service: host
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "node_(cpu_seconds_total|load1|load5|load15|memory_MemTotal_bytes|memory_MemAvailable_bytes|filesystem_avail_bytes|filesystem_size_bytes|pressure_.*)"
        action: keep
