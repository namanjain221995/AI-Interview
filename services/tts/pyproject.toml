[project]
name = "interview-tts"
version = "0.1.0"
description = "Local text-to-speech microservice (Kokoro-82M via kokoro-onnx on CPU) with viseme timelines"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "uvloop>=0.21; sys_platform != 'win32'",
    "httptools>=0.6.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "numpy>=2.1",
    # Pinned: the service relies on kokoro-onnx's tokenizer/chunker modules and
    # was performance-tested with this onnxruntime build on arm64.
    "onnxruntime==1.30.0",
    "kokoro-onnx==0.6.1",
    "espeakng-loader==0.2.4",
    "phonemizer==3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "httpx>=0.28",
    "ruff>=0.8.4",
    "mypy>=1.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 300
markers = [
    "model: loads the real Kokoro model from TTS_MODEL_PATH (skipped when the files are absent)",
    "live: talks to a running tts service at TTS_LIVE_URL (opt-in with -m live)",
]
addopts = "-ra -m 'not live'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
