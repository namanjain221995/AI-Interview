[project]
name = "interview-sandbox"
version = "0.1.0"
description = "Secure code-execution sandbox for Swayam (one locked-down container per execution)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "uvloop>=0.21",
    "httptools>=0.6.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "docker>=7.1",
    "prometheus-client>=0.21",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "httpx>=0.28",
    "ruff>=0.8.4",
    "mypy>=1.14",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandbox_service"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "integration: needs Docker and the runtime images (and, for HTTP tests, the running sandbox service)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "S108", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]
"runtimes/**" = ["S", "UP", "RUF", "SIM105", "SIM108", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["sandbox_service"]
