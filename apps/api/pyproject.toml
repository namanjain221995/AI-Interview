[project]
name = "interview-api"
version = "0.1.0"
description = "Swayam — API, realtime gateway and background worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Web framework / runtime
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
    "orjson>=3.10",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    # HTTP clients
    "httpx>=0.28",
    # Security
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    # Documents / media
    "pypdf>=5.1",
    "pdfplumber>=0.11.4",
    "pypdfium2>=4.30",
    "python-docx>=1.1.2",
    "pillow>=11.0",
    "filetype>=1.2",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    # AI output handling / text
    "json-repair>=0.35",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "markupsafe>=3.0",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "respx>=0.22",
    "ruff>=0.8.4",
    "mypy>=1.14",
    "faker>=33.1",
    "reportlab>=4.2.5",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: requires running postgres/redis (docker compose up -d postgres redis)",
    "live: calls the real local AI endpoints (slow; opt-in with -m live)",
    "sandbox: requires the sandbox service and runtime images",
]
addopts = "-ra -m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "B008", "E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
