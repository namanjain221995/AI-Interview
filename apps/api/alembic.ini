# Alembic configuration for the AI Interview Platform.
#
# The database URL is NOT configured here: env.py reads DATABASE_URL through
# app.core.config.get_settings() (or `-x dburl=...` / a connection passed in
# config.attributes["connection"] by programmatic callers such as the tests).
#
#   uv run alembic upgrade head
#   uv run alembic check          # metadata vs database drift
#   uv run alembic revision --autogenerate -m "describe change"

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
version_path_separator = os
output_encoding = utf-8

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
